<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>😂 表情包制作工具</title>
<meta property="og:title" content="😂 表情包制作工具">
<meta property="og:description" content="😂 表情包制作工具 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线表情包制作工具，上传图片添加上下文字，多种字体样式，导出PNG">
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:900px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.canvas-wrap{display:flex;justify-content:center;overflow:auto;padding:10px 0}
canvas#memeCanvas{border:1px solid var(--border);border-radius:8px;max-width:100%}
.form-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.form-row label{font-size:13px;color:var(--text-secondary);min-width:70px}
.form-row input[type="text"],.form-row select{padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--input-bg);color:var(--text);flex:1;min-width:120px}
.form-row input[type="color"]{width:40px;height:32px;border:1px solid var(--border);border-radius:6px;cursor:pointer;padding:2px}
.form-row input[type="range"]{flex:1;accent-color:var(--accent)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card-bg);color:var(--text);padding:10px 24px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow);border:1px solid var(--border)}
.toast.show{opacity:1}
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:30px;text-align:center;cursor:pointer;transition:all .2s;color:var(--text-secondary)}
.upload-zone:hover{border-color:var(--accent);color:var(--accent)}
.template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.tpl-card{padding:10px;border:2px solid var(--border);border-radius:10px;cursor:pointer;text-align:center;font-size:12px;transition:all .2s;background:var(--input-bg)}
.tpl-card:hover{border-color:var(--accent)}
.tpl-card .tpl-icon{font-size:32px;margin-bottom:4px}
footer{text-align:center;padding:24px 0;color:var(--text-secondary);font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>😂</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--card-bg);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>😂 表情包制作工具</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </header>

  <div class="card">
    <div class="card-title">🖼️ 预览</div>
    <div class="canvas-wrap"><canvas id="memeCanvas" width="500" height="500"></canvas></div>
  </div>

  <div class="card">
    <div class="card-title">📸 图片</div>
    <div class="upload-zone" id="uploadZone">点击或拖拽上传图片</div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
    <div class="form-row" style="margin-top:8px"><label>预设</label>
      <select id="presetCanvas" onchange="setPreset(this.value)">
        <option value="500x500">正方形 500x500</option>
        <option value="600x400">横版 600x400</option>
        <option value="400x600">竖版 400x600</option>
        <option value="480x360">4:3横版</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📝 上方文字</div>
    <div class="form-row"><label>文字</label><input type="text" id="topText" value="" oninput="render()"></div>
    <div class="form-row"><label>字号</label><input type="range" min="20" max="80" value="40" id="topSize" oninput="render()"><span id="tsVal">40</span></div>
    <div class="form-row"><label>颜色</label><input type="color" id="topColor" value="#ffffff" onchange="render()"></div>
    <div class="form-row"><label>描边色</label><input type="color" id="topStroke" value="#000000" onchange="render()"></div>
    <div class="form-row"><label>描边宽</label><input type="range" min="0" max="10" value="3" id="topStrokeW" oninput="render()"><span id="tswVal">3</span></div>
  </div>

  <div class="card">
    <div class="card-title">📝 下方文字</div>
    <div class="form-row"><label>文字</label><input type="text" id="bottomText" value="" oninput="render()"></div>
    <div class="form-row"><label>字号</label><input type="range" min="20" max="80" value="40" id="bottomSize" oninput="render()"><span id="bsVal">40</span></div>
    <div class="form-row"><label>颜色</label><input type="color" id="bottomColor" value="#ffffff" onchange="render()"></div>
    <div class="form-row"><label>描边色</label><input type="color" id="bottomStroke" value="#000000" onchange="render()"></div>
    <div class="form-row"><label>描边宽</label><input type="range" min="0" max="10" value="3" id="bottomStrokeW" oninput="render()"><span id="bswVal">3</span></div>
  </div>

  <div class="card">
    <div class="card-title">🎨 文字设置</div>
    <div class="form-row"><label>字体</label>
      <select id="fontFamily" onchange="render()">
        <option value="Impact">Impact (经典)</option>
        <option value="Arial Black">Arial Black</option>
        <option value="SimHei">黑体</option>
        <option value="SimSun">宋体</option>
        <option value="KaiTi">楷体</option>
        <option value="Comic Sans MS">圆体</option>
      </select>
    </div>
    <div class="form-row"><label>文字位置</label><input type="range" min="5" max="30" value="12" id="textPadding" oninput="render()"><span id="tpVal">12%</span></div>
    <div class="form-row"><label>文字背景</label><input type="checkbox" id="textBg" onchange="render()"></div>
  </div>

  <div class="card">
    <div class="card-title">⭐ 快速模板</div>
    <div class="template-grid" id="tplGrid"></div>
  </div>

  <div class="card">
    <div class="card-title">⚡ 操作</div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="exportPNG()">💾 导出PNG</button>
      <button class="btn btn-outline" onclick="exportJPG()">💾 导出JPG</button>
    </div>
  </div>

  <footer>😂 表情包制作工具 - 一秒生成搞笑表情</footer>
</div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/i18n-js@3/dist/i18n.min.js" defer></script>
<script>
const C=document.getElementById('memeCanvas'),ctx=C.getContext('2d');
let bgImg=null;
const presets=[
  {top:'当你以为放假了',bottom:'结果要加班',icon:'😭'},
  {top:'工资到账',bottom:'花呗已扣',icon:'💸'},
  {top:'周一早上',bottom:'我的灵魂',icon:'😵'},
  {top:'老板说',bottom:'明天不用来了',icon:'🎉'},
  {top:'早睡早起',bottom:'凌晨三点',icon:'🌙'},
  {top:'减肥第一天',bottom:'奶茶真香',icon:'🧋'},
  {top:'说好一起变胖',bottom:'你却偷偷健身',icon:'💪'},
  {top:'考试前',bottom:'考试后',icon:'📉'},
  {top:'新手机',bottom:'碎屏了',icon:'🫠'},
  {top:'存钱计划',bottom:'双11来了',icon:'🛒'},
];

function init(){
  renderTemplates();
  const uz=document.getElementById('uploadZone');
  const fi=document.getElementById('fileInput');
  uz.onclick=()=>fi.click();
  uz.ondragover=e=>{e.preventDefault();uz.style.borderColor='var(--accent)';};
  uz.ondragleave=()=>uz.style.borderColor='var(--border)';
  uz.ondrop=e=>{e.preventDefault();uz.style.borderColor='var(--border)';handleFile(e.dataTransfer.files[0]);};
  fi.onchange=()=>handleFile(fi.files[0]);
  render();
}

function renderTemplates(){
  const grid=document.getElementById('tplGrid');grid.innerHTML='';
  presets.forEach(p=>{
    const card=document.createElement('div');card.className='tpl-card';
    card.innerHTML=`<div class="tpl-icon">${p.icon}</div><div style="font-size:11px;line-height:1.3">${p.top}<br>${p.bottom}</div>`;
    card.onclick=()=>{document.getElementById('topText').value=p.top;document.getElementById('bottomText').value=p.bottom;render();};
    grid.appendChild(card);
  });
}

function handleFile(f){
  if(!f)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{bgImg=img;const ratio=img.width/img.height;C.height=Math.round(C.width/ratio);render();showToast('图片已加载');};
    img.src=e.target.result;
  };
  reader.readAsDataURL(f);
}

function setPreset(v){
  const[w,h]=v.split('x').map(Number);C.width=w;C.height=h;render();
}

function render(){
  const w=C.width,h=C.height;
  ctx.clearRect(0,0,w,h);
  const font=document.getElementById('fontFamily').value;
  const pad=parseInt(document.getElementById('textPadding').value)/100;
  const showBg=document.getElementById('textBg').checked;

  if(bgImg){
    const scale=Math.max(w/bgImg.width,h/bgImg.height);
    const sw=bgImg.width*scale,sh=bgImg.height*scale;
    ctx.drawImage(bgImg,(w-sw)/2,(h-sh)/2,sw,sh);
  }else{
    const grad=ctx.createLinearGradient(0,0,w,h);
    grad.addColorStop(0,'#2d3436');grad.addColorStop(1,'#636e72');
    ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
    ctx.fillStyle='rgba(255,255,255,0.1)';ctx.font='80px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('😂',w/2,h/2);
  }

  const topText=document.getElementById('topText').value;
  const topSize=parseInt(document.getElementById('topSize').value);
  const topColor=document.getElementById('topColor').value;
  const topStroke=document.getElementById('topStroke').value;
  const topStrokeW=parseInt(document.getElementById('topStrokeW').value);
  const botText=document.getElementById('bottomText').value;
  const botSize=parseInt(document.getElementById('bottomSize').value);
  const botColor=document.getElementById('bottomColor').value;
  const botStroke=document.getElementById('bottomStroke').value;
  const botStrokeW=parseInt(document.getElementById('bottomStrokeW').value);

  document.getElementById('tsVal').textContent=topSize;
  document.getElementById('bsVal').textContent=botSize;
  document.getElementById('tswVal').textContent=topStrokeW;
  document.getElementById('bswVal').textContent=botStrokeW;
  document.getElementById('tpVal').textContent=Math.round(pad*100)+'%';

  function drawText(text,y,size,color,strokeColor,strokeW){
    if(!text)return;
    ctx.font=`bold ${size}px ${font}`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    if(showBg){
      const tw=ctx.measureText(text).width;
      ctx.fillStyle='rgba(0,0,0,0.5)';
      roundRect(ctx,w/2-tw/2-10,y-size/2-4,tw+20,size+8,6);ctx.fill();
    }
    if(strokeW>0){ctx.strokeStyle=strokeColor;ctx.lineWidth=strokeW*2;ctx.lineJoin='round';ctx.strokeText(text,w/2,y);}
    ctx.fillStyle=color;ctx.fillText(text,w/2,y);
  }

  drawText(topText,h*pad,topSize,topColor,topStroke,topStrokeW);
  drawText(botText,h*(1-pad),botSize,botColor,botStroke,botStrokeW);
}

function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}

function exportPNG(){
  const link=document.createElement('a');link.download='表情包_'+Date.now()+'.png';link.href=C.toDataURL('image/png');link.click();showToast('已导出PNG');
}
function exportJPG(){
  const link=document.createElement('a');link.download='表情包_'+Date.now()+'.jpg';link.href=C.toDataURL('image/jpeg',0.92);link.click();showToast('已导出JPG');
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function toggleTheme(){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';document.querySelector('.theme-toggle').textContent=d.dataset.theme==='dark'?'☀️':'🌙';}
init();
</script>
</body>
</html>
