if(!d){
var meanings=[{pos:'名',def:'汉字「'+c+'」',ex:'请查看更多字典资料'}];
d={p:'?',r:'?',s:'?',st:'?',meanings:meanings,words:[]};}
var html='<div class="card"><div class="detail-header"><div class="detail-char">'+c+'</div><div class="detail-meta">';
var rows=[['拼音',d.p],['部首',d.r],['笔画',d.s+'画'],['结构',d.st]];
rows.forEach(function(r){html+='<div class="meta-row"><span class="label">'+r[0]+'</span><span>'+r[1]+'</span></div>';});
html+='</div></div></div>';
html+='<div class="card"><h3 style="margin-bottom:12px">释义</h3>';
d.meanings.forEach(function(m){
html+='<div class="meaning-card"><span class="pos">'+m.pos+'</span><div class="def">'+m.def+'</div><div class="example">例：'+m.ex+'</div></div>';});
html+='</div>';
if(d.words&&d.words.length){html+='<div class="card"><h3 style="margin-bottom:8px">相关词汇</h3><div class="related-words">';
d.words.forEach(function(w){html+='<span class="word-chip">'+w+'</span>';});
html+='</div></div>';}

document.getElementById('result').innerHTML=html;
if(history.indexOf(c)<0){history.unshift(c);if(history.length>20)history.pop();renderHistory();}}
