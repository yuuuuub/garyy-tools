<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📲 推送通知构建器</title>
<meta name="description" content="推送通知构建器，创建和管理App推送通知模板">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📲 推送通知构建器">
<meta property="og:description" content="推送通知构建器 - Gary's Tools">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📲</text></svg>">
<style>
:root{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--orange:#bc4c00;--purple:#8250df;--shadow:0 1px 3px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--orange:#d29922;--purple:#bc8cff;--shadow:0 1px 3px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);padding:16px;transition:background .3s,color .3s}
.container{max-width:1000px;margin:0 auto}
h1{font-size:1.3rem;color:var(--blue);border-bottom:2px solid var(--blue);padding-bottom:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:.9rem;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical;min-height:60px}
button{background:var(--blue);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600}
button:hover{opacity:.85}
.btn-green{background:var(--green)}.btn-red{background:var(--red)}.btn-orange{background:var(--orange)}.btn-purple{background:var(--purple)}.btn-sm{padding:4px 10px;font-size:.8rem}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px}
.theme-toggle{position:fixed;top:12px;right:12px;background:var(--text2);color:var(--bg);border:none;padding:6px 12px;border-radius:8px;cursor:pointer;z-index:100}
.phone-frame{width:300px;margin:0 auto;background:#1a1a2e;border-radius:24px;padding:12px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.phone-screen{background:#0f0f1a;border-radius:16px;padding:10px;min-height:500px}
.phone-status{display:flex;justify-content:space-between;font-size:.6rem;color:#666;padding:4px 8px}
.push-notif{background:rgba(255,255,255,.12);border-radius:14px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;backdrop-filter:blur(10px)}
.push-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;color:#fff}
.push-body{flex:1;min-width:0}
.push-app{font-size:.65rem;color:#888;display:flex;justify-content:space-between}
.push-title{font-size:.82rem;font-weight:600;color:#fff;margin:2px 0}
.push-text{font-size:.72rem;color:#aaa;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.push-actions{display:flex;gap:6px;margin-top:6px}
.push-actions button{padding:3px 10px;font-size:.65rem;border-radius:6px;background:rgba(255,255,255,.15);color:#ddd;border:none;cursor:pointer}
.template-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.template-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;transition:border-color .2s}
.template-card:hover{border-color:var(--blue)}
.template-card .t-icon{font-size:1.2rem;margin-bottom:4px}
.template-card .t-name{font-size:.8rem;font-weight:600}
.template-card .t-desc{font-size:.7rem;color:var(--text2)}
.msg-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">🌓</button>
<div class="container">
<h1>📲 推送通知构建器</h1>

<div class="card">
<div class="section-title">模板选择</div>
<div class="template-grid" id="templateGrid"></div>
</div>

<div class="form-row">
<div class="card">
<div class="section-title">通知编辑</div>
<div style="margin-bottom:12px"><label>应用名称</label><input type="text" id="pApp" value="MyApp" placeholder="应用名称"></div>
<div style="margin-bottom:12px"><label>标题</label><input type="text" id="pTitle" placeholder="推送标题"></div>
<div style="margin-bottom:12px"><label>内容</label><textarea id="pContent" rows="3" placeholder="推送内容"></textarea></div>
<div class="form-row">
<div><label>图标颜色</label><input type="color" id="pColor" value="#0969da"></div>
<div><label>图标 emoji</label><input type="text" id="pIcon" value="🔔" maxlength="2"></div>
</div>
<div class="form-row">
<div><label>操作按钮1</label><input type="text" id="pBtn1" placeholder="例：查看"></div>
<div><label>操作按钮2</label><input type="text" id="pBtn2" placeholder="例：关闭"></div>
</div>
<div class="form-row">
<div><label>深度链接</label><input type="text" id="pLink" placeholder="myapp://page"></div>
<div><label>平台</label><select id="pPlatform"><option value="ios">iOS</option><option value="android">Android</option><option value="both">双平台</option></select></div>
</div>
<div style="margin-top:12px;display:flex;gap:8px">
<button onclick="savePush()">💾 保存</button>
<button class="btn-green" onclick="previewPush()">👁 预览</button>
<button class="btn-orange" onclick="genJSON()">📤 生成JSON</button>
</div>
</div>
<div class="card">
<div class="section-title">手机预览</div>
<div class="phone-frame"><div class="phone-screen">
<div class="phone-status"><span>9:41</span><span>📶 🔋</span></div>
<div id="pushPreview">
<div class="push-notif">
<div class="push-icon" style="background:#0969da">🔔</div>
<div class="push-body">
<div class="push-app"><span>MyApp</span><span>现在</span></div>
<div class="push-title">通知标题</div>
<div class="push-text">通知内容将显示在这里</div>
</div>
</div>
</div>
</div></div>
</div>
</div>

<div class="card">
<div class="section-title">保存的推送 <span id="pushCount" style="font-size:.8rem;color:var(--text2)">(0)</span></div>
<div id="pushList"></div>
</div>

<div class="card" id="jsonCard" style="display:none">
<div class="section-title">JSON Payload</div>
<div style="background:#1a1a2e;color:#e6e6e6;padding:16px;border-radius:8px;font-family:'SF Mono',Menlo,monospace;font-size:.8rem;white-space:pre-wrap;overflow:auto;max-height:300px" id="jsonOutput"></div>
<div style="margin-top:8px"><button class="btn-sm btn-green" onclick="copyJSON()">📋 复制JSON</button></div>
</div>
</div>

<script src="../i18n.js" defer></script>
<script>
var pushData = JSON.parse(localStorage.getItem('push_notifications') || '[]');
var idCounter = pushData.length ? Math.max(...pushData.map(p=>p.id)) + 1 : 1;

var templates = [
  {icon:'🛒',name:'购物提醒',desc:'购物车商品降价',title:'您购物车里的商品降价了！',content:'您收藏的XX商品现在限时8折，快来抢购吧！',btn1:'去看看',btn2:'忽略'},
  {icon:'📦',name:'物流更新',desc:'包裹状态变更',title:'您的包裹已发货',content:'订单号: 20240101001，预计明天送达',btn1:'查看物流',btn2:'确认'},
  {icon:'💬',name:'消息通知',desc:'新消息提醒',title:'您有一条新消息',content:'张三给您发来了一条消息',btn1:'回复',btn2:'标记已读'},
  {icon:'🎉',name:'活动推广',desc:'营销推送',title:'限时特惠！全场5折起',content:'双11大促火热进行中，海量好物等你来',btn1:'立即抢购',btn2:'稍后再说'},
  {icon:'⏰',name:'任务提醒',desc:'待办事项提醒',title:'您有一个待办事项',content:'项目报告截止日期：明天18:00',btn1:'立即处理',btn2:'延后'},
  {icon:'🔴',name:'系统告警',desc:'重要系统通知',title:'系统异常告警',content:'检测到服务CPU使用率超过90%',btn1:'查看详情',btn2:'忽略'}
];

function renderTemplates(){
  document.getElementById('templateGrid').innerHTML=templates.map(function(t,i){
    return '<div class="template-card" onclick="useTemplate('+i+')"><div class="t-icon">'+t.icon+'</div><div class="t-name">'+t.name+'</div><div class="t-desc">'+t.desc+'</div></div>';
  }).join('');
}

function useTemplate(i){
  var t=templates[i];
  document.getElementById('pTitle').value=t.title;
  document.getElementById('pContent').value=t.content;
  document.getElementById('pBtn1').value=t.btn1;
  document.getElementById('pBtn2').value=t.btn2;
  document.getElementById('pIcon').value=t.icon;
  previewPush();
}

function previewPush(){
  var color=document.getElementById('pColor').value;
  var icon=document.getElementById('pIcon').value;
  var app=document.getElementById('pApp').value||'MyApp';
  var title=document.getElementById('pTitle').value||'通知标题';
  var content=document.getElementById('pContent').value||'通知内容将显示在这里';
  var btn1=document.getElementById('pBtn1').value;
  var btn2=document.getElementById('pBtn2').value;
  var html='<div class="push-notif" style="animation:slideDown .3s ease-out"><div class="push-icon" style="background:'+color+'">'+icon+'</div><div class="push-body"><div class="push-app"><span>'+app+'</span><span>现在</span></div><div class="push-title">'+title+'</div><div class="push-text">'+content+'</div>';
  if(btn1||btn2){html+='<div class="push-actions">';if(btn1)html+='<button>'+btn1+'</button>';if(btn2)html+='<button>'+btn2+'</button>';html+='</div>';}
  html+='</div></div>';
  document.getElementById('pushPreview').innerHTML=html;
}

function savePush(){
  var title=document.getElementById('pTitle').value.trim();
  var content=document.getElementById('pContent').value.trim();
  if(!title){alert('请输入推送标题');return;}
  pushData.unshift({
    id:idCounter++,app:document.getElementById('pApp').value,
    title:title,content:content,color:document.getElementById('pColor').value,
    icon:document.getElementById('pIcon').value,btn1:document.getElementById('pBtn1').value,
    btn2:document.getElementById('pBtn2').value,link:document.getElementById('pLink').value,
    platform:document.getElementById('pPlatform').value,
    created:new Date().toLocaleDateString('zh-CN')
  });
  localStorage.setItem('push_notifications',JSON.stringify(pushData));
  renderList();
  alert('保存成功！');
}

function renderList(){
  var el=document.getElementById('pushList');
  document.getElementById('pushCount').textContent='('+pushData.length+')';
  if(!pushData.length){el.innerHTML='<p style="color:var(--text2);text-align:center;padding:16px">暂无保存的推送</p>';return;}
  el.innerHTML=pushData.map(function(p,i){
    return '<div class="msg-item" onclick="loadPush('+i+')"><div style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;align-items:center;gap:8px"><div class="push-icon" style="background:'+p.color+';width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.9rem">'+p.icon+'</div><div><div style="font-weight:600;font-size:.85rem">'+p.title+'</div><div style="font-size:.75rem;color:var(--text2)">'+p.app+' · '+p.created+'</div></div></div><button class="btn-sm btn-red" onclick="event.stopPropagation();deletePush('+i+')">删除</button></div></div>';
  }).join('');
}

function loadPush(i){
  var p=pushData[i];
  document.getElementById('pApp').value=p.app;
  document.getElementById('pTitle').value=p.title;
  document.getElementById('pContent').value=p.content;
  document.getElementById('pColor').value=p.color;
  document.getElementById('pIcon').value=p.icon;
  document.getElementById('pBtn1').value=p.btn1||'';
  document.getElementById('pBtn2').value=p.btn2||'';
  document.getElementById('pLink').value=p.link||'';
  document.getElementById('pPlatform').value=p.platform;
  previewPush();
}

function deletePush(i){pushData.splice(i,1);localStorage.setItem('push_notifications',JSON.stringify(pushData));renderList();}

function genJSON(){
  var payload={
    to:'/topics/all',
    notification:{title:document.getElementById('pTitle').value,body:document.getElementById('pContent').value},
    data:{icon:document.getElementById('pIcon').value,link:document.getElementById('pLink').value,action1:document.getElementById('pBtn1').value,action2:document.getElementById('pBtn2').value},
    android:{priority:'high',notification:{channel_id:'default',color:document.getElementById('pColor').value}},
    apns:{payload:{aps:{alert:{title:document.getElementById('pTitle').value,body:document.getElementById('pContent').value},badge:1,sound:'default'}}}
  };
  document.getElementById('jsonOutput').textContent=JSON.stringify(payload,null,2);
  document.getElementById('jsonCard').style.display='block';
  document.getElementById('jsonCard').scrollIntoView({behavior:'smooth'});
}

function copyJSON(){navigator.clipboard.writeText(document.getElementById('jsonOutput').textContent).then(function(){alert('已复制到剪贴板');});}
function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='dark'?'light':'dark');}
renderTemplates();renderList();previewPush();
</script>
</body>
</html>
