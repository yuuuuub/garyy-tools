<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📍 中医穴位图鉴</title>
<meta property="og:title" content="📍 中医穴位图鉴">
<meta property="og:description" content="中医经络穴位百科，穴位定位、功效、按摩方法 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="中医经络穴位百科，穴位定位、功效、按摩方法">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📍</text></svg>">
<meta name="robots" content="index, follow">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;display:flex;justify-content:center}
.ctn{max-width:600px;width:100%}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit;font-size:.95rem}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:.75rem;font-weight:600}
.tag.s{background:rgba(34,197,94,.15);color:var(--success)}.tag.w{background:rgba(245,158,11,.15);color:var(--warn)}.tag.d{background:rgba(239,68,68,.15);color:var(--danger)}.tag.b{background:rgba(59,130,246,.15);color:var(--blue)}.tag.p{background:rgba(168,85,247,.15);color:#a855f7}
.li{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.li:hover{border-color:var(--accent)}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:.9rem}
select,input,textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.9rem;margin-bottom:8px}
label{font-size:.85rem;color:var(--text2);margin-bottom:4px;display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
.tab-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:20px;font-size:.85rem;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:white;border-color:var(--accent)}
.detail{display:none}.detail.active{display:block}
.step{padding:10px;border-left:3px solid var(--accent);margin-bottom:8px;background:var(--bg);border-radius:0 8px 8px 0}
.step-num{font-weight:700;color:var(--accent);margin-right:8px}
.herb-info{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:.9rem;margin:12px 0}
.herb-info dt{color:var(--text2);font-weight:600}
.herb-info dd{color:var(--text)}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare-col{padding:12px;background:var(--bg);border-radius:8px}
.body-map{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.body-area{padding:12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;text-align:center;transition:all .2s}
.body-area:hover,.body-area.active{border-color:var(--accent);background:rgba(59,130,246,.1)}
</style>
</head>
<body>
<div class="ctn">
<div class="hdr">
<h1>📍 中医穴位图鉴</h1>
<p>经络穴位，养生保健</p>
</div>

<div class="tab-bar" id="tabs">
<div class="tab active" data-tab="meridian">穴位分类</div>
<div class="tab" data-tab="search">穴位搜索</div>
<div class="tab" data-tab="compare">穴位对照</div>
<div class="tab" data-tab="bodymap">穴位定位</div>
</div>

<div id="view-meridian" class="detail active">
<div class="cd">
<h2>📋 选择经络</h2>
<div id="meridian-tabs" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"></div>
<div id="point-list"></div>
</div>
<div class="cd" id="point-detail" style="display:none">
<h2 id="pd-title">穴位详情</h2>
<div id="pd-content"></div>
<div style="margin-top:12px"><button class="sec" onclick="addToCompare()">⚖️ 加入对照</button></div>
</div>
</div>

<div id="view-search" class="detail">
<div class="cd">
<h2>🔍 搜索穴位</h2>
<input type="text" id="search-input" placeholder="输入穴位名、拼音或主治...">
<div id="search-results"></div>
</div>
</div>

<div id="view-compare" class="detail">
<div class="cd">
<h2>⚖️ 穴位对照</h2>
<div id="compare-content"><div class="empty">请在穴位列表中点击"加入对照"</div></div>
</div>
</div>

<div id="view-bodymap" class="detail">
<div class="cd">
<h2>🗺️ 按部位查找穴位</h2>
<div class="body-map" id="body-areas"></div>
<div id="area-points" style="margin-top:12px"></div>
</div>
</div>
</div>

<script>
const points = [
  {name:'合谷',pinyin:'hé gǔ',meridian:'手阳明大肠经',location:'手背第1、2掌骨间，第2掌骨桡侧中点处',function:'镇静止痛，通经活络，清热解表',indication:'头痛，牙痛，咽喉肿痛，目赤肿痛，鼻衄，口眼歪斜',massage:'拇指按揉2-3分钟，力度适中，有酸胀感',caution:'孕妇不宜'},
  {name:'足三里',pinyin:'zú sān lǐ',meridian:'足阳明胃经',location:'小腿前外侧，犊鼻下3寸，胫骨前嵴外1横指处',function:'健脾和胃，扶正培元，通经活络',indication:'胃痛呕吐，腹胀泄泻，便秘，下肢痿痹，虚劳诸证',massage:'拇指按揉3-5分钟，力度稍重，每日坚持',caution:'无特殊禁忌'},
  {name:'内关',pinyin:'nèi guān',meridian:'手厥阴心包经',location:'前臂掌侧，腕横纹上2寸，掌长肌腱与桡侧腕屈肌腱之间',function:'宁心安神，理气止痛',indication:'心痛，胸闷，胃痛呕吐，失眠，眩晕',massage:'拇指按揉2-3分钟，可缓解恶心晕车',caution:'无特殊禁忌'},
  {name:'三阴交',pinyin:'sān yīn jiāo',meridian:'足太阴脾经',location:'小腿内侧，内踝尖上3寸，胫骨内侧缘后方',function:'健脾益血，调肝补肾',indication:'月经不调，带下，遗精，阳痿，失眠，消化不良',massage:'拇指按揉3-5分钟，经期前按摩可缓解痛经',caution:'孕妇禁按'},
  {name:'太冲',pinyin:'tài chōng',meridian:'足厥阴肝经',location:'足背侧，第1跖骨间隙后方凹陷处',function:'平肝息风，疏肝养血',indication:'头痛眩晕，目赤肿痛，胁肋疼痛，遗尿，疝气',massage:'拇指按揉2-3分钟，可疏肝理气、降压',caution:'气血虚弱者不宜重按'},
  {name:'百会',pinyin:'bǎi huì',meridian:'督脉',location:'头部正中线与两耳尖连线的交点处',function:'醒脑开窍，升阳固脱',indication:'头痛眩晕，失眠健忘，脱肛，子宫脱垂',massage:'指腹轻揉1-2分钟，可提神醒脑',caution:'囟门未闭者禁用'},
  {name:'印堂',pinyin:'yìn táng',meridian:'经外奇穴',location:'两眉头连线的中点处',function:'清头明目，通鼻开窍',indication:'头痛，眩晕，鼻渊，鼻衄，失眠',massage:'拇指按揉1-2分钟，可缓解头痛',caution:'无特殊禁忌'},
  {name:'太阳',pinyin:'tài yáng',meridian:'经外奇穴',location:'颞部，眉梢与目外眦之间向后约1寸凹陷处',function:'清肝明目，解痉止痛',indication:'偏头痛，目赤肿痛，牙痛，面瘫',massage:'双手拇指按揉2-3分钟，可缓解头痛',caution:'无特殊禁忌'},
  {name:'风池',pinyin:'fēng chí',meridian:'足少阳胆经',location:'项部，枕骨之下，胸锁乳突肌与斜方肌上端之间的凹陷处',function:'疏风清热，明目开窍',indication:'头痛眩晕，颈项强痛，目赤痛，鼻渊，感冒',massage:'双手拇指按揉3-5分钟，可缓解颈痛头痛',caution:'按揉时头微前倾'},
  {name:'曲池',pinyin:'qū chí',meridian:'手阳明大肠经',location:'肘横纹外侧端，屈肘，尺泽与肱骨外上髁连线中点',function:'清热和营，降逆活络',indication:'手臂痹痛，上肢不遂，热病，高血压',massage:'拇指按揉2-3分钟，可清热降压',caution:'无特殊禁忌'},
  {name:'涌泉',pinyin:'yǒng quán',meridian:'足少阴肾经',location:'足底前部凹陷处，第2、3趾趾缝纹头端与足跟连线的前1/3处',function:'苏厥开窍，滋阴降火',indication:'头顶痛，头晕，目眩，失眠，小儿惊风',massage:'拇指按揉3-5分钟，睡前按摩可安神助眠',caution:'力度不宜过大'},
  {name:'劳宫',pinyin:'láo gōng',meridian:'手厥阴心包经',location:'手掌心，第2、3掌骨之间偏于第3掌骨，握拳屈指时中指尖处',function:'清心泻火，开窍醒神',indication:'中风昏迷，心痛，呕吐，口疮',massage:'拇指按揉1-2分钟，可清心安神',caution:'无特殊禁忌'},
  {name:'神门',pinyin:'shén mén',meridian:'手少阴心经',location:'腕部，腕掌侧横纹尺侧端，尺侧腕屈肌腱桡侧凹陷处',function:'宁心安神，通经活络',indication:'心痛，心烦，惊悸，健忘，失眠',massage:'拇指按揉2-3分钟，可安神助眠',caution:'无特殊禁忌'},
  {name:'阳陵泉',pinyin:'yáng líng quán',meridian:'足少阳胆经',location:'小腿外侧，腓骨头前下方凹陷处',function:'疏肝利胆，舒筋活络',indication:'胁肋痛，口苦，下肢痿痹，膝肿痛',massage:'拇指按揉3-5分钟，可舒筋活络',caution:'无特殊禁忌'},
  {name:'血海',pinyin:'xuè hǎi',meridian:'足太阴脾经',location:'大腿内侧，髌底内侧端上2寸，股四头肌内侧头的隆起处',function:'调经统血，健脾化湿',indication:'月经不调，崩漏，湿疹，瘾疹',massage:'拇指按揉3-5分钟，可活血调经',caution:'孕妇慎用'},
  {name:'气海',pinyin:'qì hǎi',meridian:'任脉',location:'下腹部，前正中线上，脐中下1.5寸',function:'益气助阳，调经固经',indication:'腹痛，泄泻，便秘，遗尿，月经不调',massage:'掌心顺时针按摩3-5分钟，可温阳补气',caution:'孕妇慎用'},
  {name:'关元',pinyin:'guān yuán',meridian:'任脉',location:'下腹部，前正中线上，脐中下3寸',function:'培元固本，补益下焦',indication:'中风脱证，遗尿，遗精，阳痿，月经不调',massage:'掌心顺时针按摩3-5分钟，可温补下元',caution:'孕妇禁用'},
  {name:'中脘',pinyin:'zhōng wǎn',meridian:'任脉',location:'上腹部，前正中线上，脐中上4寸',function:'和胃健脾，降逆利水',indication:'胃痛，腹胀，呕吐，泄泻，消化不良',massage:'掌心顺时针按摩3-5分钟，可和胃消食',caution:'饭后不宜立即按摩'},
  {name:'委中',pinyin:'wěi zhōng',meridian:'足太阳膀胱经',location:'腘横纹中点，股二头肌腱与半腱肌腱中间',function:'舒筋通络，散瘀活血',indication:'腰背痛，下肢痿痹，腹痛，急性吐泻',massage:'拇指按揉2-3分钟，可缓解腰痛',caution:'不宜用力过猛'},
  {name:'承山',pinyin:'chéng shān',meridian:'足太阳膀胱经',location:'小腿后面正中，委中与昆仑之间，伸直小腿或足跟上提时腓肠肌腹下出现尖角凹陷处',function:'理气止痛，舒筋活络',indication:'小腿转筋，腰腿痛，痔疾，便秘',massage:'拇指按揉2-3分钟，可缓解小腿抽筋',caution:'无特殊禁忌'}
];

let activeMeridian = '手阳明大肠经';
let currentPoint = null;
let compareList = [];
const meridians = [...new Set(points.map(p => p.meridian))];
const bodyAreas = {'头面部':['百会','印堂','太阳','风池'],'上肢':['合谷','内关','曲池','劳宫','神门'],'下肢':['足三里','三阴交','太冲','涌泉','阳陵泉','委中','承山'],'躯干':['气海','关元','中脘','血海']};

function loadData() { return JSON.parse(localStorage.getItem('point-compare') || '[]'); }
function saveData(d) { localStorage.setItem('point-compare', JSON.stringify(d)); }

function renderMeridianTabs() {
  document.getElementById('meridian-tabs').innerHTML = meridians.map(m =>
    `<div class="tab ${m === activeMeridian ? 'active' : ''}" onclick="switchMeridian('${m}')" style="padding:6px 12px;font-size:.75rem">${m.replace(/经$/,'')}</div>`
  ).join('');
}

function switchMeridian(m) {
  activeMeridian = m;
  renderMeridianTabs();
  renderPointList();
}

function renderPointList() {
  const filtered = points.filter(p => p.meridian === activeMeridian);
  document.getElementById('point-list').innerHTML = filtered.map(p => {
    const idx = points.indexOf(p);
    return `<div class="li" onclick="showPoint(${idx})">
      <div><strong>${p.name}</strong> <span style="color:var(--text2);font-size:.85rem">${p.pinyin}</span><br><span style="color:var(--text2);font-size:.8rem">${p.location.substring(0, 25)}...</span></div>
      <span class="tag b">${p.meridian.replace(/经$/,'')}</span>
    </div>`;
  }).join('');
}

function showPoint(i) {
  currentPoint = i;
  const p = points[i];
  document.getElementById('point-detail').style.display = 'block';
  document.getElementById('pd-title').textContent = p.name;
  document.getElementById('pd-content').innerHTML = `
    <dl class="herb-info">
      <dt>拼音</dt><dd>${p.pinyin}</dd>
      <dt>经络</dt><dd><span class="tag b">${p.meridian}</span></dd>
      <dt>定位</dt><dd>${p.location}</dd>
      <dt>功效</dt><dd>${p.function}</dd>
      <dt>主治</dt><dd>${p.indication}</dd>
      <dt>按摩方法</dt><dd>${p.massage}</dd>
      <dt>注意事项</dt><dd style="color:var(--danger)">${p.caution}</dd>
    </dl>`;
}

function addToCompare() {
  if (currentPoint === null) return;
  if (compareList.length >= 2) compareList.shift();
  if (!compareList.includes(currentPoint)) compareList.push(currentPoint);
  saveData(compareList);
  alert(`已加入对照：${points[currentPoint].name}（${compareList.length}/2）`);
}

function renderCompare() {
  if (compareList.length < 2) {
    document.getElementById('compare-content').innerHTML = '<div class="empty">请在穴位列表中点击"加入对照"添加2个穴位</div>';
    return;
  }
  const [a, b] = compareList.map(i => points[i]);
  const fields = [['拼音','pinyin'],['经络','meridian'],['定位','location'],['功效','function'],['主治','indication'],['按摩','massage'],['注意','caution']];
  document.getElementById('compare-content').innerHTML = `
    <div class="compare-grid">
      <div class="compare-col"><h3 style="margin-bottom:8px">${a.name}</h3>${fields.map(([l,k]) => `<div style="margin-bottom:6px"><small style="color:var(--text2)">${l}</small><br>${a[k]}</div>`).join('')}</div>
      <div class="compare-col"><h3 style="margin-bottom:8px">${b.name}</h3>${fields.map(([l,k]) => `<div style="margin-bottom:6px"><small style="color:var(--text2)">${l}</small><br>${b[k]}</div>`).join('')}</div>
    </div>
    <button class="sec" onclick="compareList=[];saveData(compareList);renderCompare()" style="margin-top:12px;width:100%">清空对照</button>`;
}

// Search
document.getElementById('search-input').addEventListener('input', doSearch);
function doSearch() {
  const q = document.getElementById('search-input').value.toLowerCase();
  if (!q) { document.getElementById('search-results').innerHTML = ''; return; }
  const results = points.filter(p =>
    p.name.includes(q) || p.pinyin.includes(q) || p.indication.includes(q) || p.meridian.includes(q)
  );
  document.getElementById('search-results').innerHTML = results.length ? results.map(p => {
    const idx = points.indexOf(p);
    return `<div class="li" onclick="showPoint(${idx})">
      <div><strong>${p.name}</strong> ${p.pinyin}<br><span style="color:var(--text2);font-size:.85rem">${p.indication.substring(0, 25)}...</span></div>
      <span class="tag b">${p.meridian.replace(/经$/,'')}</span>
    </div>`;
  }).join('') : '<div class="empty">未找到匹配穴位</div>';
}

// Body Map
function renderBodyAreas() {
  document.getElementById('body-areas').innerHTML = Object.entries(bodyAreas).map(([area, names]) =>
    `<div class="body-area" onclick="showAreaPoints('${area}')">${area}<br><small style="color:var(--text2)">${names.length}个穴位</small></div>`
  ).join('');
}

function showAreaPoints(area) {
  document.querySelectorAll('.body-area').forEach(a => a.classList.remove('active'));
  event.currentTarget.classList.add('active');
  const names = bodyAreas[area];
  const areaPoints = points.filter(p => names.includes(p.name));
  document.getElementById('area-points').innerHTML = areaPoints.map(p => {
    const idx = points.indexOf(p);
    return `<div class="li" onclick="showPoint(${idx})">
      <div><strong>${p.name}</strong> ${p.pinyin}<br><span style="color:var(--text2);font-size:.85rem">${p.function}</span></div>
    </div>`;
  }).join('');
}

// Tabs
compareList = loadData();
document.querySelectorAll('#tabs .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('#tabs .tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.detail').forEach(d => d.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'compare') renderCompare();
  });
});

renderMeridianTabs();
renderPointList();
renderBodyAreas();
</script>
</body>
</html>
