<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>看板 - Kanban Board</title>
<meta property="og:title" content="看板 - Kanban Board">
<meta property="og:description" content="看板 - Kanban Board - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线看板工具，支持拖拽卡片，快速管理任务和项目">
<meta name="robots" content="index,follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='4' width='8' height='24' rx='2' fill='%23e94560'/><rect x='12' y='4' width='8' height='20' rx='2' fill='%230969da'/><rect x='22' y='4' width='8' height='16' rx='2' fill='%231a7f37'/></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--bg:#1a1a2e;--surface:#16213e;--surface2:#0f3460;--text:#e0e0e0;--text2:#a0a0b0;--accent:#e94560;--accent2:#533483;--border:#2a2a4a;--radius:10px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--surface:#fff;--surface2:#f0f3f6;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#8250df;--border:#d0d7de}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
h1{font-size:20px;font-weight:700;color:var(--accent);padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:space-between}
.toolbar{display:flex;gap:8px}
.toolbar button{background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;transition:var(--transition)}
.toolbar button:hover{background:var(--accent2);border-color:var(--accent)}
.toggle-theme{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.board{flex:1;display:flex;gap:16px;padding:16px;overflow-x:auto}
.column{width:300px;min-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 100px)}
.col-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:14px}
.col-header .count{background:var(--surface2);color:var(--text2);padding:2px 8px;border-radius:10px;font-size:12px}
.col-body{flex:1;padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:60px}
.col-body.drag-over{background:rgba(233,69,96,0.08);border:2px dashed var(--accent);border-radius:8px}
.card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;cursor:grab;transition:var(--transition);position:relative}
.card:hover{border-color:var(--accent)}
.card.dragging{opacity:.4;transform:rotate(2deg)}
.card-title{font-size:13px;font-weight:500;margin-bottom:6px;line-height:1.4}
.card-desc{font-size:12px;color:var(--text2);line-height:1.4}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.card-tag{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500}
.tag-high{background:#cf222e22;color:#cf222e;border:1px solid #cf222e44}
.tag-medium{background:#f5a62322;color:#f5a623;border:1px solid #f5a62344}
.tag-low{background:#1a7f3722;color:#1a7f37;border:1px solid #1a7f3744}
.card-actions{display:flex;gap:4px}
.card-actions button{background:none;border:none;color:var(--text2);cursor:pointer;font-size:14px;padding:2px;border-radius:4px}
.card-actions button:hover{color:var(--accent);background:var(--surface)}
.add-card-btn{width:100%;padding:8px;background:none;border:1px dashed var(--border);border-radius:8px;color:var(--text2);cursor:pointer;font-size:13px;transition:var(--transition)}
.add-card-btn:hover{border-color:var(--accent);color:var(--accent)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:300;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;width:400px}
.modal label{display:block;font-size:13px;color:var(--text2);margin:8px 0 4px}
.modal input,.modal textarea,.modal select{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:6px;font-size:13px;font-family:inherit}
.modal textarea{min-height:60px;resize:vertical}
.modal .btn-row{display:flex;gap:8px;margin-top:12px}
.modal .btn{flex:1;padding:10px;border-radius:6px;cursor:pointer;font-size:14px;border:none;font-weight:600}
.modal .btn-primary{background:var(--accent);color:#fff}
.modal .btn-cancel{background:var(--surface2);color:var(--text);border:1px solid var(--border)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<h1>📋 看板 Kanban Board
<div class="toolbar">
<button onclick="addColumn()">➕ 添加列</button>
<button onclick="exportData()">💾 导出</button>
<button onclick="importData()">📥 导入</button>
<button class="toggle-theme" onclick="toggleTheme()">🌙 / ☀️</button>
</div>
</h1>
<div class="board" id="board"></div>
<div class="modal-overlay" id="modal">
<div class="modal">
<label>卡片标题</label>
<input id="cardTitle" placeholder="输入标题">
<label>描述（可选）</label>
<textarea id="cardDesc" placeholder="输入描述"></textarea>
<label>优先级</label>
<select id="cardPriority"><option value="low">低</option><option value="medium" selected>中</option><option value="high">高</option></select>
<div class="btn-row">
<button class="btn btn-cancel" onclick="closeModal()">取消</button>
<button class="btn btn-primary" onclick="saveCard()">保存</button>
</div>
</div>
</div>
<script>
function toggleTheme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'}
let cardId=0,columnId=0;
let columns=[
{id:columnId++,name:'待办',color:'#e94560',cards:[]},
{id:columnId++,name:'进行中',color:'#0969da',cards:[]},
{id:columnId++,name:'已完成',color:'#1a7f37',cards:[]}
];
function addSampleCards(){
const samples=[
{title:'设计用户界面',desc:'完成首页和详情页设计',priority:'high'},
{title:'编写API文档',desc:'RESTful接口文档',priority:'medium'},
{title:'修复登录Bug',desc:'用户反馈登录偶尔失败',priority:'high'},
{title:'性能优化',desc:'首屏加载时间优化到2秒内',priority:'medium'},
{title:'单元测试',desc:'核心模块测试覆盖率达到80%',priority:'low'},
{title:'代码审查',desc:'PR #123 需要审查',priority:'medium'}
];
samples.forEach((s,i)=>{
const col=i<2?0:i<4?1:2;
columns[col].cards.push({id:cardId++,title:s.title,desc:s.desc,priority:s.priority});
});
}
addSampleCards();
let editingCard=null,editColId=null;
function render(){
const board=document.getElementById('board');
board.innerHTML=columns.map(col=>`
<div class="column" data-col="${col.id}">
<div class="col-header">
<span><span style="color:${col.color}">●</span> ${col.name}</span>
<span class="count">${col.cards.length}</span>
</div>
<div class="col-body" data-col="${col.id}" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="dropCard(event,${col.id})">
${col.cards.map(c=>`
<div class="card" draggable="true" ondragstart="dragCard(event,${c.id})" ondragend="this.classList.remove('dragging')">
<div class="card-title">${c.title}</div>
${c.desc?`<div class="card-desc">${c.desc}</div>`:''}
<div class="card-footer">
<span class="card-tag tag-${c.priority}">${c.priority==='high'?'高':c.priority==='medium'?'中':'低'}</span>
<div class="card-actions">
<button onclick="editCard(${col.id},${c.id})" title="编辑">✏️</button>
<button onclick="deleteCard(${col.id},${c.id})" title="删除">🗑️</button>
</div>
</div>
</div>`).join('')}
<button class="add-card-btn" onclick="openAddCard(${col.id})">+ 添加卡片</button>
</div>
</div>`).join('');
}
let dragCardId=null;
function dragCard(e,id){dragCardId=id;e.target.classList.add('dragging');e.dataTransfer.effectAllowed='move'}
function dropCard(e,colId){
e.preventDefault();e.currentTarget.classList.remove('drag-over');
if(dragCardId===null)return;
let card=null,fromCol=null;
for(const col of columns){const idx=col.cards.findIndex(c=>c.id===dragCardId);if(idx>=0){card=col.cards.splice(idx,1)[0];fromCol=col;break}}
if(card){const col=columns.find(c=>c.id===colId);if(col)col.cards.push(card)}
dragCardId=null;render();
}
function openAddCard(colId){editColId=colId;editingCard=null;
document.getElementById('cardTitle').value='';document.getElementById('cardDesc').value='';
document.getElementById('cardPriority').value='medium';
document.getElementById('modal').classList.add('show');document.getElementById('cardTitle').focus()}
function editCard(colId,cardId){
const col=columns.find(c=>c.id===colId);const card=col?.cards.find(c=>c.id===cardId);
if(!card)return;editColId=colId;editingCard=cardId;
document.getElementById('cardTitle').value=card.title;
document.getElementById('cardDesc').value=card.desc||'';
document.getElementById('cardPriority').value=card.priority;
document.getElementById('modal').classList.add('show');document.getElementById('cardTitle').focus()}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function saveCard(){
const title=document.getElementById('cardTitle').value.trim();if(!title)return;
const desc=document.getElementById('cardDesc').value.trim();
const priority=document.getElementById('cardPriority').value;
const col=columns.find(c=>c.id===editColId);if(!col)return;
if(editingCard!==null){const card=col.cards.find(c=>c.id===editingCard);if(card){card.title=title;card.desc=desc;card.priority=priority}}
else{col.cards.push({id:cardId++,title,desc,priority})}
closeModal();render();
}
function deleteCard(colId,cardId){const col=columns.find(c=>c.id===colId);if(col)col.cards=col.cards.filter(c=>c.id!==cardId);render()}
function addColumn(){const name=prompt('列名称：');if(!name)return;
columns.push({id:columnId++,name,color:['#e94560','#0969da','#1a7f37','#f5a623','#8250df','#cf222e'][columns.length%6],cards:[]});render()}
function exportData(){const a=document.createElement('a');a.download='kanban.json';a.href=URL.createObjectURL(new Blob([JSON.stringify(columns,null,2)],{type:'application/json'}));a.click()}
function importData(){const json=prompt('粘贴 JSON 数据：');if(!json)return;try{columns=JSON.parse(json);cardId=Math.max(0,...columns.flatMap(c=>c.cards.map(ca=>ca.id)))+1;columnId=Math.max(0,...columns.map(c=>c.id))+1;render()}catch(e){alert('JSON 错误')}}
render();
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
