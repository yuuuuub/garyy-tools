<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国旅行安全指南 - Chinese Travel Safety Guide</title>
<meta name="description" content="中国旅行安全指南，涵盖防盗防骗、紧急联系方式、常见骗局与急救知识">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国旅行安全指南 - Chinese Travel Safety Guide">
<meta property="og:description" content="中国旅行安全指南，涵盖防盗防骗、紧急联系方式、常见骗局与急救知识">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#ea580c;--accent2:#c2410c}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#ea580c;--accent2:#c2410c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a0a02 0%,#2d1505 50%,#3d1f08 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #9a3412;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#ea580c,#fb923c,#f97316,#fdba74);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.emergency-banner{background:linear-gradient(135deg,rgba(234,88,12,0.1),rgba(234,88,12,0.05));border:1px solid rgba(234,88,12,0.3);border-radius:14px;padding:20px;margin-bottom:24px}
.emergency-banner h2{font-size:1.2em;color:var(--accent);margin-bottom:12px}
.emergency-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.emergency-item{background:var(--card);border-radius:10px;padding:14px;text-align:center;border:1px solid var(--border)}
.emergency-item .number{font-size:1.8em;font-weight:700;color:var(--accent)}
.emergency-item .label{font-size:0.8em;color:var(--text2);margin-top:4px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.safety-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:16px}
.safety-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.safety-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.safety-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.safety-card .s-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.safety-card .s-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(234,88,12,0.15);color:var(--accent)}
.safety-card .s-name{font-size:1.1em;font-weight:bold}
.safety-card .s-level{font-size:0.75em;padding:2px 8px;border-radius:8px;margin-top:2px;display:inline-block}
.level-danger{background:rgba(239,68,68,0.15);color:#ef4444}
.level-warning{background:rgba(245,158,11,0.15);color:#f59e0b}
.level-info{background:rgba(59,130,246,0.15);color:#3b82f6}
.safety-card .s-content{font-size:0.85em;color:var(--text2);line-height:1.8;margin-bottom:8px}
.safety-card .s-content strong{color:var(--text)}
.safety-card .s-tip{background:rgba(234,88,12,0.08);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 8px 8px 0;font-size:0.8em;color:var(--text2);margin-top:8px}
.safety-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.safety-grid{grid-template-columns:1fr}.emergency-grid{grid-template-columns:repeat(2,1fr)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🛡️ 中国旅行安全指南</h1>
<p>Chinese Travel Safety Guide — 平安出行，快乐旅程</p>
</header>
<div class="container">
<div class="emergency-banner">
<h2>🆘 紧急联系电话</h2>
<div class="emergency-grid">
<div class="emergency-item"><div class="number">110</div><div class="label">报警电话</div></div>
<div class="emergency-item"><div class="number">120</div><div class="label">急救电话</div></div>
<div class="emergency-item"><div class="number">119</div><div class="label">火警电话</div></div>
<div class="emergency-item"><div class="number">122</div><div class="label">交通事故</div></div>
<div class="emergency-item"><div class="number">12345</div><div class="label">市民热线</div></div>
<div class="emergency-item"><div class="number">12308</div><div class="label">外交部领保</div></div>
</div>
</div>
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索安全信息...（如"小偷""骗局""急救"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="防盗防骗">🚨 防盗防骗</button>
<button class="filter-btn" data-filter="交通安全">🚗 交通安全</button>
<button class="filter-btn" data-filter="食品安全">🍜 食品安全</button>
<button class="filter-btn" data-filter="自然灾害">🌊 自然灾害</button>
<button class="filter-btn" data-filter="健康急救">🏥 健康急救</button>
</div>
<div class="safety-grid" id="safetyGrid"></div>
<footer><p>🛡️ 中国旅行安全指南 — 安全是旅行的第一要务</p></footer>
</div>
<script>
const SAFETY_DATA=[
{id:1,name:"车站扒窃",en:"Pickpocketing",category:"防盗防骗",level:"danger",icon:"🎒",content:"火车站、地铁站是扒窃<strong>高发区域</strong>。背包放胸前，手机钱包不放外裤口袋。注意身边故意挤靠你的人。<strong>使用贴身腰包</strong>存放重要证件。",tip:"失窃后立即拨打110报警，并联系使领馆补办证件"},
{id:2,name:"出租车拒载/绕路",en:"Taxi Scams",category:"防盗防骗",level:"warning",icon:"🚕",content:"部分出租车会在景区附近<strong>拒载或绕路</strong>。使用滴滴等打车软件可避免。上车前确认打表。如遇拒载可拨打<strong>12345投诉</strong>。",tip:"优先使用网约车平台，有行程记录和投诉渠道"},
{id:3,name:"假古玩/假特产",en:"Fake Souvenirs",category:"防盗防骗",level:"warning",icon:"🏺",content:"景区附近的"古玩"多为<strong>仿制品</strong>。高价茶叶、玉器、药材需谨慎购买。"免费品尝"后强买强卖也是常见套路。<strong>货比三家</strong>再购买。",tip:"购买贵重物品请去正规商场，索要发票"},
{id:4,name:"高原反应",en:"Altitude Sickness",category:"健康急救",level:"danger",icon:"🏔️",content:"前往西藏、青海等高原地区，海拔3000米以上可能出现高原反应。<strong>提前服用红景天</strong>，到达后不要剧烈运动，保持充足饮水。严重时立即下撤。",tip:"备好氧气罐，出现剧烈头痛呕吐立即就医"},
{id:5,name:"食品安全",en:"Food Safety",category:"食品安全",level:"info",icon:"🍽️",content:"选择<strong>卫生条件好</strong>的餐厅，路边摊注意食材新鲜度。夏天注意食物变质。饮水建议买<strong>瓶装水</strong>。肠胃不好的随身携带止泻药。",tip:"旅行常备：藿香正气水、止泻药、创可贴"},
{id:6,name:"交通出行安全",en:"Traffic Safety",category:"交通安全",level:"warning",icon:"🚦",content:"中国车辆<strong>靠右行驶</strong>。过马路注意看红绿灯，电动车速度很快需小心。乘坐大巴系好安全带。自驾需中国驾照或国际驾照。",tip:"共享单车骑行注意遵守交通规则"},
{id:7,name:"台风暴雨",en:"Typhoon & Rainstorm",category:"自然灾害",level:"danger",icon:"🌧️",content:"夏秋季节东南沿海可能遭遇<strong>台风</strong>。关注天气预报，台风来临时避免外出。遇到暴雨不要在低洼处停留。<strong>远离山区河道</strong>防止山洪。",tip:"关注当地气象部门发布的预警信息"},
{id:8,name:"防暑降温",en:"Heat Prevention",category:"健康急救",level:"warning",icon:"☀️",content:"夏季多地气温超过35°C，<strong>注意防暑</strong>。随身携带水和遮阳帽。避免正午时段长时间户外活动。出现头晕、恶心立即转移至阴凉处。",tip:"备好防晒霜、墨镜、便携风扇"},
{id:9,name:"诈骗电话",en:"Phone Scams",category:"防盗防骗",level:"warning",icon:"📱",content:"不要轻信"公检法"来电要求转账。<strong>任何要求提供验证码的都是诈骗</strong>。不要点击陌生链接。接到可疑电话直接挂断拨打110核实。",tip:"记住：公安机关绝不会电话要求转账"},
{id:10,name:"证件安全",en:"Document Safety",category:"防盗防骗",level:"info",icon:"📋",content:"护照、身份证<strong>拍照备份</strong>存手机和云端。原件与复印件分开存放。住酒店及时使用保险柜。丢失后立即报警并联系使领馆。",tip:"将紧急联系方式写在纸上随身携带"},
{id:11,name:"山区户外安全",en:"Mountain Safety",category:"自然灾害",level:"warning",icon:"⛰️",content:"山区徒步<strong>不要走野路</strong>，跟随标记路线。携带充足饮水和食物。告知他人行程计划。遇雷雨远离大树和金属物品。<strong>天黑前务必下山</strong>。",tip:"下载离线地图，山区信号可能不稳定"},
{id:12,name:"冬季防寒",en:"Winter Safety",category:"健康急救",level:"info",icon:"❄️",content:"北方冬季气温可达-20°C以下，注意<strong>防冻保暖</strong>。穿多层衣物，保护耳朵和手指。路面结冰注意防滑。室内有暖气注意补水。",tip:"暖宝宝、保温杯、防滑鞋是冬季旅行必备"}
];
const grid=document.getElementById('safetyGrid');
const search=document.getElementById('searchInput');
const filterRow=document.getElementById('filterRow');
let currentFilter='all';
function render(){
const q=search.value.toLowerCase();
grid.innerHTML='';
SAFETY_DATA.filter(d=>{
const matchFilter=currentFilter==='all'||d.category===currentFilter;
const matchSearch=!q||d.name.toLowerCase().includes(q)||d.en.toLowerCase().includes(q)||d.content.includes(q);
return matchFilter&&matchSearch;
}).forEach(d=>{
const levelClass=d.level==='danger'?'level-danger':d.level==='warning'?'level-warning':'level-info';
const levelText=d.level==='danger'?'高危':d.level==='warning'?'注意':'了解';
grid.innerHTML+=`<div class="safety-card"><div class="s-header"><div class="s-icon">${d.icon}</div><div><div class="s-name">${d.name}</div><span class="s-level ${levelClass}">${levelText}</span></div></div><div class="s-content">${d.content}</div><div class="s-tip">💡 ${d.tip}</div></div>`;
});
}
filterRow.addEventListener('click',e=>{
if(e.target.classList.contains('filter-btn')){
filterRow.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
e.target.classList.add('active');
currentFilter=e.target.dataset.filter;
render();
}
});
search.addEventListener('input',render);
render();
</script>
</body>
</html>
