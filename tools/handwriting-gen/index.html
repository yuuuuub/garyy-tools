<head>

<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --surface2: #0f3460;
  --text: #e0e0e0;
  --text-secondary: #a0a0b8;
  --accent: #e94560;
  --accent-hover: #ff6b81;
  --border: #2a2a4a;
  --input-bg: #1a1a30;
  --radius: 10px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Header ────────────────────────────── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 16px rgba(0,0,0,0.3);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header h1 {
  font-size: 1.5rem;
  font-weight: 700;
  background: linear-gradient(135deg, #e94560, #f39c12);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header .subtitle {
  font-size: 0.8rem;
  color: var(--text-secondary);
  margin-left: 12px;
}

/* ── Layout ────────────────────────────── */
.main-container {
  display: flex;
  gap: 24px;
  padding: 24px 32px;
  max-width: 1400px;
  margin: 0 auto;
  min-height: calc(100vh - 140px);
}

/* ── Controls Panel ────────────────────── */
.controls-panel {
  width: 320px;
  min-width: 320px;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 18px;
  height: fit-content;
  max-height: calc(100vh - 120px);
  overflow-y: auto;
}

.control-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.control-group label {
  font-size: 0.82rem;
  color: var(--text-secondary);
  font-weight: 500;
  letter-spacing: 0.02em;
}

.control-group select,
.control-group input[type="text"],
.control-group input[type="range"],
.control-group input[type="color"] {
  width: 100%;
}

select, input[type="text"] {
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 10px 12px;
  font-size: 0.9rem;
  transition: border-color 0.2s;
  outline: none;
}

select:focus, input[type="text"]:focus {
  border-color: var(--accent);
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  outline: none;
  cursor: pointer;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: 2px solid var(--surface);
  box-shadow: 0 0 6px rgba(233,69,96,0.4);
}

input[type="color"] {
  -webkit-appearance: none;
  appearance: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  height: 38px;
  padding: 2px;
  cursor: pointer;
  background: var(--input-bg);
}
input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
input[type="color"]::-webkit-color-swatch { border-radius: 4px; border: none; }

.range-value {
  font-size: 0.75rem;
  color: var(--accent);
  text-align: right;
  margin-top: -14px;
}

/* ── Pen Style Buttons ─────────────────── */
.pen-styles {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.pen-btn {
  flex: 1;
  min-width: 80px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--input-bg);
  color: var(--text);
  cursor: pointer;
  font-size: 0.8rem;
  transition: all 0.2s;
  text-align: center;
}

.pen-btn:hover {
  border-color: var(--accent-hover);
}

.pen-btn.active {
  border-color: var(--accent);
  background: rgba(233, 69, 96, 0.15);
  color: var(--accent-hover);
  box-shadow: 0 0 12px rgba(233,69,96,0.15);
}

/* ── Action Buttons ────────────────────── */
.btn {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}

.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover {
  background: var(--accent-hover);
  box-shadow: 0 4px 16px rgba(233,69,96,0.3);
}

.btn-secondary {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover {
  background: #1a4370;
}

/* ── Preview Area ──────────────────────── */
.preview-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.preview-toolbar {
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: flex-end;
}

.preview-paper {
  flex: 1;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 48px;
  min-height: 400px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
  position: relative;
  transition: background 0.3s;
}

/* Paper backgrounds */
.paper-lined {
  background-color: #f8f7f2;
  background-image:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 31px,
      #d4d4cc 31px,
      #d4d4cc 32px
    );
}

.paper-grid {
  background-color: #f8f7f2;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 24px, #d0d0c8 24px, #d0d0c8 25px),
    repeating-linear-gradient(90deg, transparent, transparent 24px, #d0d0c8 24px, #d0d0c8 25px);
}

.paper-kraft {
  background-color: #c4a97d;
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(0,0,0,0.03) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(255,255,255,0.02) 0%, transparent 50%);
}

.paper-white {
  background-color: #ffffff;
}

/* ── Handwriting Rendering ─────────────── */
.handwriting-display {
  line-height: 1.8;
  word-break: break-all;
  text-align: left;
  max-width: 100%;
  font-family: 'Ma Shan Zheng', cursive;
}

.handwriting-display .char-wrapper {
  display: inline-block;
  position: relative;
}

/* Ink bleed via text-shadow */
.ink-bleed-none { text-shadow: none; }
.ink-bleed-light { text-shadow: 0 0 2px currentColor, 0 0 4px rgba(0,0,0,0.08); }
.ink-bleed-medium { text-shadow: 0 0 3px currentColor, 0 0 6px rgba(0,0,0,0.12), 1px 1px 0 rgba(0,0,0,0.06); }
.ink-bleed-heavy { text-shadow: 0 0 5px currentColor, 0 0 10px rgba(0,0,0,0.18), 2px 1px 0 rgba(0,0,0,0.1), -1px 2px 0 rgba(0,0,0,0.05); }

/* ── Toast ─────────────────────────────── */
.toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface2);
  color: var(--text);
  padding: 12px 28px;
  border-radius: 8px;
  font-size: 0.9rem;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  border: 1px solid var(--border);
}

.toast.show {
  opacity: 1;
}

/* ── Footer ────────────────────────────── */
.footer {
  text-align: center;
  padding: 16px;
  color: var(--text-secondary);
  font-size: 0.78rem;
  border-top: 1px solid var(--border);
  background: var(--surface);
}

/* ── Textarea in controls ──────────────── */
.text-input-area {
  width: 100%;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 10px 12px;
  font-size: 0.9rem;
  resize: vertical;
  min-height: 80px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
}

.text-input-area:focus {
  border-color: var(--accent);
}

/* ── Responsive ────────────────────────── */
@media (max-width: 900px) {
  .main-container {
    flex-direction: column;
    padding: 16px;
  }
  .controls-panel {
    width: 100%;
    min-width: 0;
    max-height: none;
  }
  .preview-paper {
    padding: 24px;
    min-height: 300px;
  }
}

<body>

<!-- ── Header ──────────────────────────────── -->
<header class="header">
  <div style="display:flex;align-items:center;">
    <h1>手写体生成器</h1>
    <span class="subtitle">手写字生成器</span>
  </div>

</header>

<!-- ── Main Layout ─────────────────────────── -->
<div class="main-container">

  <!-- Controls Panel -->
  <aside class="controls-panel">

    <div class="control-group">
      <label>输入文字</label>
      <textarea class="text-input-area" id="textInput" placeholder="在这里输入你想生成手写效果的文字...">春风得意马蹄疾</textarea>

    <div class="control-group">

      <select id="fontFamily">
        <option value="Ma Shan Zheng">马善政 - Ma Shan Zheng</option>

        <option value="Liu Jian Mao Cao" selected>柳建茂草 - Liu Jian Mao Cao</option>
        <option value="Long Cang">龙藏 - Long Cang</option>
        <option value="ZCOOL KuaiLe">站酷快乐 - ZCOOL KuaiLe</option>

    <div class="control-group">

    <div class="control-group">
      <label>字间距 <span id="letterSpacingVal" class="range-value">0.05em</span></label>

      <label>旋转抖动 <span id="rotationJitterVal" class="range-value">3°</span></label>

    <div class="control-group">

      <select id="paperType">
        <option value="lined">横线纸</option>
        <option value="grid">方格纸</option>

  </aside>

  <!-- Preview Area -->
  <div class="preview-container">
    <div class="preview-toolbar">
      <button class="btn btn-secondary" id="resetBtn">重置</button>
      <button class="btn btn-secondary" id="randomBtn">随机风格</button>
      <button class="btn btn-primary" id="downloadBtn">下载图片</button>

    <div class="preview-paper paper-white" id="previewPaper">
      <div class="handwriting-display" id="handwritingDisplay"></div>

</div>

<!-- ── Toast ───────────────────────────────── -->
<div class="toast" id="toast"></div>

<!-- ── Footer ──────────────────────────────── -->
<footer class="footer">
  手写体生成器 &copy; 2026 — 使用 CSS + Google Fonts 驱动，无需后端
</footer>

<!-- ── Hidden Canvas for export ────────────── -->
<canvas id="exportCanvas" style="display:none;"></canvas>

<script>
// ============ State ============
const state = {
  text: '',
  fontFamily: 'Liu Jian Mao Cao',
  penStyle: 'ballpoint',
  fontSize: 48,
  letterSpacing: 0.05,
  rotationJitter: 3,
  sizeJitter: 5,
  inkBleed: 'light',
  fontColor: '#1a3a5c',
  paperType: 'white'
};

// ============ Pen Presets ============
const penPresets = {
  fountain: { color: '#1a1a1a', bleed: 'heavy', inkShadow: true, name: '钢笔' },
  ballpoint: { color: '#1a3a5c', bleed: 'light', inkShadow: true, name: '圆珠笔' },
  pencil: { color: '#555555', bleed: 'none', inkShadow: false, name: '铅笔' }
};

// ============ DOM Refs ============
const textInput = document.getElementById('textInput');
const fontFamilySelect = document.getElementById('fontFamily');
const fontSizeRange = document.getElementById('fontSize');
const fontSizeVal = document.getElementById('fontSizeVal');
const letterSpacingRange = document.getElementById('letterSpacing');
const letterSpacingVal = document.getElementById('letterSpacingVal');
const rotationJitterRange = document.getElementById('rotationJitter');
const rotationJitterVal = document.getElementById('rotationJitterVal');
const sizeJitterRange = document.getElementById('sizeJitter');
const sizeJitterVal = document.getElementById('sizeJitterVal');
const inkBleedSelect = document.getElementById('inkBleed');
const fontColorInput = document.getElementById('fontColor');
const paperTypeSelect = document.getElementById('paperType');
const previewPaper = document.getElementById('previewPaper');
const handwritingDisplay = document.getElementById('handwritingDisplay');
const penStyleBtns = document.querySelectorAll('.pen-btn');
const toast = document.getElementById('toast');
const exportCanvas = document.getElementById('exportCanvas');
const resetBtn = document.getElementById('resetBtn');
const randomBtn = document.getElementById('randomBtn');
const downloadBtn = document.getElementById('downloadBtn');

// ============ Seeded Random ============
// Simple deterministic pseudo-random for character variation
let charSeed = 0;
function seededRandom(reset = false) {
  if (reset) charSeed = 0;
  charSeed = (charSeed * 16807 + 0) % 2147483647;
  return (charSeed - 1) / 2147483646;
}

// ============ Render Handwriting ============
function renderHandwriting() {
  const display = handwritingDisplay;
  const text = state.text;
  display.innerHTML = '';

  if (!text.trim()) {
    display.innerHTML = '<span style="color:#aaa;font-family:sans-serif;font-size:1rem;">在上面输入文字开始预览...</span>';
    return;
  }

  const chars = [...text];
  seededRandom(true);

  const baseEmSize = state.fontSize / 16; // rem based

  chars.forEach((char) => {
    if (char === '\n') {
      const br = document.createElement('br');
      display.appendChild(br);
      return;
    }

    const wrapper = document.createElement('span');
    wrapper.className = 'char-wrapper';

    // Random rotation (jitter)
    const rotJitter = state.rotationJitter;
    const rotation = (seededRandom() * 2 - 1) * rotJitter;

    // Random size variation
    const sizeJitter = state.sizeJitter;
    const sizeVariation = 1 + (seededRandom() * 2 - 1) * (sizeJitter / 100);

    // Random slight vertical offset
    const vertOffset = (seededRandom() * 2 - 1) * (state.fontSize * 0.04);

    // Build style
    const fontSizePx = state.fontSize * sizeVariation;
    const styles = [
      `font-family: '${state.fontFamily}', cursive`,
      `font-size: ${fontSizePx}px`,
      `color: ${state.fontColor}`,
      `transform: rotate(${rotation.toFixed(2)}deg) translateY(${vertOffset.toFixed(1)}px)`,
      `display: inline-block`,
      `margin-right: ${state.letterSpacing}em`,
      `line-height: 1.6`
    ];

    // Ink bleed effect
    const bleed = state.inkBleed;
    if (bleed !== 'none') {
      wrapper.classList.add(`ink-bleed-${bleed}`);
    }

    // Pencil texture effect (subtle)
    if (state.penStyle === 'pencil') {
      styles.push('opacity: 0.85');
      styles.push('filter: url(#pencil-texture)');
    }

    wrapper.setAttribute('style', styles.join('; '));
    wrapper.textContent = char;

    // Store params as data attributes for canvas export
    wrapper.dataset.rotation = rotation;
    wrapper.dataset.sizeVar = sizeVariation;
    wrapper.dataset.vertOffset = vertOffset;

    display.appendChild(wrapper);
  });
}

// ============ Apply Paper Background ============
function applyPaperBackground() {
  previewPaper.className = 'preview-paper';
  previewPaper.classList.add(`paper-${state.paperType}`);
}

// ============ Apply Pen Style ============
function applyPenStyle(style) {
  const preset = penPresets[style];
  state.penStyle = style;
  state.fontColor = preset.color;
  fontColorInput.value = preset.color;
  state.inkBleed = preset.bleed;
  inkBleedSelect.value = preset.bleed;

  // Update active button
  penStyleBtns.forEach(btn => {
    btn.classList.toggle('active', btn.dataset.pen === style);
  });
}

// ============ Update State ============
function updateState(key, value) {
  state[key] = value;
  renderAll();
}

function renderAll() {
  renderHandwriting();
  applyPaperBackground();
}

// ============ Event Listeners ============
textInput.addEventListener('input', () => {
  state.text = textInput.value;
  renderHandwriting();
});

fontFamilySelect.addEventListener('change', () => {
  updateState('fontFamily', fontFamilySelect.value);
});

fontSizeRange.addEventListener('input', () => {
  const val = fontSizeRange.value;
  fontSizeVal.textContent = val + 'px';
  updateState('fontSize', parseInt(val));
});

letterSpacingRange.addEventListener('input', () => {
  const val = parseFloat(letterSpacingRange.value);
  letterSpacingVal.textContent = val.toFixed(2) + 'em';
  updateState('letterSpacing', val);
});

rotationJitterRange.addEventListener('input', () => {
  const val = parseFloat(rotationJitterRange.value);
  rotationJitterVal.textContent = val + '°';
  updateState('rotationJitter', val);
});

sizeJitterRange.addEventListener('input', () => {
  const val = parseInt(sizeJitterRange.value);
  sizeJitterVal.textContent = val + '%';
  updateState('sizeJitter', val);
});

inkBleedSelect.addEventListener('change', () => {
  updateState('inkBleed', inkBleedSelect.value);
});

fontColorInput.addEventListener('input', () => {
  updateState('fontColor', fontColorInput.value);
});

paperTypeSelect.addEventListener('change', () => {
  updateState('paperType', paperTypeSelect.value);
});

penStyleBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    applyPenStyle(btn.dataset.pen);
    updateActivePenButton(btn.dataset.pen);
    renderAll();
  });
});

function updateActivePenButton(style) {
  penStyleBtns.forEach(b => b.classList.toggle('active', b.dataset.pen === style));
}

// ============ Reset ============
resetBtn.addEventListener('click', () => {
  textInput.value = '春风得意马蹄疾';
  state.text = '春风得意马蹄疾';
  fontFamilySelect.value = 'Liu Jian Mao Cao';
  state.fontFamily = 'Liu Jian Mao Cao';
  fontSizeRange.value = 48;
  fontSizeVal.textContent = '48px';
  state.fontSize = 48;
  letterSpacingRange.value = 0.05;
  letterSpacingVal.textContent = '0.05em';
  state.letterSpacing = 0.05;
  rotationJitterRange.value = 3;
  rotationJitterVal.textContent = '3°';
  state.rotationJitter = 3;
  sizeJitterRange.value = 5;
  sizeJitterVal.textContent = '5%';
  state.sizeJitter = 5;
  inkBleedSelect.value = 'light';
  state.inkBleed = 'light';
  state.fontColor = '#1a3a5c';
  fontColorInput.value = '#1a3a5c';
  paperTypeSelect.value = 'white';
  state.paperType = 'white';
  applyPenStyle('ballpoint');
  renderAll();
  showToast('已重置为默认设置');
});

// ============ Random Style ============
randomBtn.addEventListener('click', () => {
  const fonts = ['Ma Shan Zheng', 'Zhi Mang Xing', 'Liu Jian Mao Cao', 'Long Cang', 'ZCOOL KuaiLe', 'ZCOOL QingKe HuangYou'];
  const papers = ['lined', 'grid', 'kraft', 'white'];
  const bleeds = ['none', 'light', 'medium', 'heavy'];
  const pens = ['fountain', 'ballpoint', 'pencil'];
  const hue = Math.floor(Math.random() * 360);
  const sat = 20 + Math.floor(Math.random() * 40);
  const light = 15 + Math.floor(Math.random() * 30);

  state.fontFamily = fonts[Math.floor(Math.random() * fonts.length)];
  fontFamilySelect.value = state.fontFamily;

  state.fontSize = 24 + Math.floor(Math.random() * 80);
  fontSizeRange.value = state.fontSize;
  fontSizeVal.textContent = state.fontSize + 'px';

  state.letterSpacing = Math.round((Math.random() * 0.4 - 0.05) * 100) / 100;
  letterSpacingRange.value = state.letterSpacing;
  letterSpacingVal.textContent = state.letterSpacing.toFixed(2) + 'em';

  state.rotationJitter = Math.round(Math.random() * 10 * 2) / 2;
  rotationJitterRange.value = state.rotationJitter;
  rotationJitterVal.textContent = state.rotationJitter + '°';

  state.sizeJitter = Math.floor(Math.random() * 15);
  sizeJitterRange.value = state.sizeJitter;
  sizeJitterVal.textContent = state.sizeJitter + '%';

  state.inkBleed = bleeds[Math.floor(Math.random() * bleeds.length)];
  inkBleedSelect.value = state.inkBleed;

  state.paperType = papers[Math.floor(Math.random() * papers.length)];
  paperTypeSelect.value = state.paperType;

  const pen = pens[Math.floor(Math.random() * pens.length)];
  applyPenStyle(pen);

  // Optional: override color with random one
  if (Math.random() > 0.5) {
    state.fontColor = `hsl(${hue}, ${sat}%, ${light}%)`;
    fontColorInput.value = state.fontColor;
  }

  renderAll();
  showToast('已随机生成风格');
});

// ============ Download as Image ============
downloadBtn.addEventListener('click', () => {
  if (!state.text.trim()) {
    showToast('请先输入文字');
    return;
  }

  const canvas = exportCanvas;
  const ctx = canvas.getContext('2d');

  // Calculate canvas size based on content
  const display = handwritingDisplay;
  const displayRect = display.getBoundingClientRect();
  const paperRect = previewPaper.getBoundingClientRect();

  const paddingX = 48;
  const paddingY = 48;

  // Measure text
  const chars = [...state.text];
  seededRandom(true);

  // Estimate dimensions
  let maxLineWidth = 0;
  let currentLineWidth = 0;
  let lineCount = 1;
  const lineHeight = state.fontSize * 1.6;

  chars.forEach(char => {
    if (char === '\n') {
      maxLineWidth = Math.max(maxLineWidth, currentLineWidth);
      currentLineWidth = 0;
      lineCount++;
      return;
    }
    const charWidth = state.fontSize * 1.0; // Approximate CJK char width
    currentLineWidth += charWidth + state.letterSpacing * state.fontSize;
    maxLineWidth = Math.max(maxLineWidth, currentLineWidth);
  });
  if (currentLineWidth > 0) {
    maxLineWidth = Math.max(maxLineWidth, currentLineWidth);
  }

  // Add some rotation space
  const rotationPadding = Math.sin(state.rotationJitter * Math.PI / 180) * state.fontSize * 1.5;
  const totalWidth = Math.max(400, maxLineWidth + paddingX * 2 + rotationPadding * 2 + 40);
  const totalHeight = Math.max(200, lineCount * lineHeight + paddingY * 2 + rotationPadding * 2 + 40);

  canvas.width = totalWidth;
  canvas.height = totalHeight;

  // Draw paper background
  switch (state.paperType) {
    case 'lined':
      ctx.fillStyle = '#f8f7f2';
      ctx.fillRect(0, 0, totalWidth, totalHeight);
      ctx.strokeStyle = '#d4d4cc';
      ctx.lineWidth = 1;
      for (let y = 0; y < totalHeight; y += 32) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(totalWidth, y);
        ctx.stroke();
      }
      break;
    case 'grid':
      ctx.fillStyle = '#f8f7f2';
      ctx.fillRect(0, 0, totalWidth, totalHeight);
      ctx.strokeStyle = '#d0d0c8';
      ctx.lineWidth = 1;
      for (let x = 0; x < totalWidth; x += 25) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, totalHeight);
        ctx.stroke();
      }
      for (let y = 0; y < totalHeight; y += 25) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(totalWidth, y);
        ctx.stroke();
      }
      break;
    case 'kraft':
      // Kraft paper gradient
      const kraftGrad = ctx.createLinearGradient(0, 0, totalWidth, totalHeight);
      kraftGrad.addColorStop(0, '#c4a97d');
      kraftGrad.addColorStop(0.5, '#d4b88a');
      kraftGrad.addColorStop(1, '#b89968');
      ctx.fillStyle = kraftGrad;
      ctx.fillRect(0, 0, totalWidth, totalHeight);
      // Add subtle noise-like spots
      for (let i = 0; i < 200; i++) {
        const sx = Math.random() * totalWidth;
        const sy = Math.random() * totalHeight;
        ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.03})`;
        ctx.beginPath();
        ctx.arc(sx, sy, Math.random() * 2, 0, Math.PI * 2);
        ctx.fill();
      }
      break;
    case 'white':
    default:
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, totalWidth, totalHeight);
      break;
  }

  // Draw text
  seededRandom(true);
  let x = paddingX + rotationPadding;
  let y = paddingY + rotationPadding + state.fontSize;
  const fontFamilySafe = `'${state.fontFamily}', cursive`;

  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = state.fontColor;

  chars.forEach(char => {
    if (char === '\n') {
      x = paddingX + rotationPadding;
      y += lineHeight;
      return;
    }

    const rot = (seededRandom() * 2 - 1) * state.rotationJitter;
    const sizeVar = 1 + (seededRandom() * 2 - 1) * (state.sizeJitter / 100);
    const vOff = (seededRandom() * 2 - 1) * (state.fontSize * 0.04);

    const fontSize = state.fontSize * sizeVar;

    ctx.save();
    ctx.translate(x + fontSize * 0.5, y + vOff);
    ctx.rotate(rot * Math.PI / 180);
    ctx.font = `${fontSize}px ${fontFamilySafe}`;

    // Ink bleed effect (text-shadow equivalent on canvas)
    // Draw multiple offset copies for bleed
    if (state.inkBleed === 'heavy') {
      ctx.globalAlpha = 0.07;
      ctx.fillText(char, -fontSize * 0.5, 0);
      ctx.fillText(char, -fontSize * 0.5 + 2, 0);
      ctx.fillText(char, -fontSize * 0.5 - 1, 1);
      ctx.globalAlpha = 1;
    } else if (state.inkBleed === 'medium') {
      ctx.globalAlpha = 0.05;
      ctx.fillText(char, -fontSize * 0.5 + 1, 0);
      ctx.fillText(char, -fontSize * 0.5, 1);
      ctx.globalAlpha = 1;
    } else if (state.inkBleed === 'light') {
      ctx.globalAlpha = 0.04;
      ctx.fillText(char, -fontSize * 0.5 + 1, 1);
      ctx.globalAlpha = 1;
    }

    ctx.fillText(char, -fontSize * 0.5, 0);
    ctx.restore();

    const charWidth = fontSize * 1.0;
    x += charWidth + state.letterSpacing * state.fontSize;
  });

  // Download
  const link = document.createElement('a');
  link.download = 'handwriting-' + Date.now() + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  showToast('图片已下载');
});

// ============ Toast ============
let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 2000);
}

// ============ Init ============
function init() {
  state.text = textInput.value;
  state.fontFamily = fontFamilySelect.value;
  state.fontSize = parseInt(fontSizeRange.value);
  state.letterSpacing = parseFloat(letterSpacingRange.value);
  state.rotationJitter = parseFloat(rotationJitterRange.value);
  state.sizeJitter = parseInt(sizeJitterRange.value);
  state.inkBleed = inkBleedSelect.value;
  state.fontColor = fontColorInput.value;
  state.paperType = paperTypeSelect.value;

  applyPenStyle('ballpoint');
  renderAll();
  showToast('手写体生成器已就绪');
}

// Wait for fonts to load, then init
document.fonts.ready.then(() => {
  init();
});
</script>
