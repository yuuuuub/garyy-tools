<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俯视角赛车</title>
    <meta name="description" content="俯视角赛车游戏，从上帝视角体验赛车竞速">
    <style>
:root {--bg: #0d1117;
--card: #161b22;
--border: #30363d;
--text: #e6edf3;
--accent: #3b82f6}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
* {margin: 0;
padding: 0;
box-sizing: border-box}
body {background: var(--bg);
color: var(--text);
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;
display: flex;
flex-direction: column;
align-items: center;
min-height: 100vh;
padding: 20pxscroll-behavior:smooth;}
h1 {margin-bottom: 10px;
color: #3b82f6}
.controls {background: var(--card);
border: 1px solid var(--border);
border-radius: 8px;
padding: 15px;
margin-bottom: 15px;
width: 100%;
max-width: 800px;
text-align: center}
.info {display: flex;
justify-content: space-between;
margin-bottom: 10px;
font-size: 18px}
canvas {border: 2px solid var(--border);
border-radius: 8px;
background: #1a1e24;
max-width: 100%}
.btn {background: #3b82f6;
color: white;
border: none;
padding: 10px 20px;
border-radius: 6px;
cursor: pointer;
font-size: 16px;
margin: 5px}
.btn:hover {opacity: 0.9}
.message {margin-top: 15px;
font-size: 16px;
color: #8b949e}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="俯视角赛车">
  <meta property="og:description" content="俯视角赛车游戏，从上帝视角体验赛车竞速">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/racing-topdown/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
    <h1>🚗 俯视角赛车</h1>
    <div class="controls">
        <div class="info">
            <span>时间: <span id="time">0.0</span>秒</span>
            <span>速度: <span id="speed">0</span>km/h</span>
            <span>圈数: <span id="laps">0</span>/3</span>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div style="margin-top: 10px;">
            <button class="btn" onclick="startGame()">开始游戏</button>
            <button class="btn" onclick="resetGame()">重新开始</button>
        </div>
        <div class="message">使用方向键或WASD控制赛车，完成3圈用时最短者获胜！</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const timeEl = document.getElementById('time');
        const speedEl = document.getElementById('speed');
        const lapsEl = document.getElementById('laps');
        let gameRunning = false;
        let gameTime = 0;
        let lastTime = 0;
        let car = { x: 400, y: 500, angle: 0, speed: 0, width: 20, height: 30 };
        let keys = {};
        let obstacles = [];
        let laps = 0;
        let checkpoints = [0, 0, 0, 0];
        let lastCheckpoint = -1;
        const track = [
            { x: 400, y: 500, type: 'start' },
            { x: 400, y: 400, type: 'straight' },
            { x: 400, y: 300, type: 'straight' },
            { x: 300, y: 200, type: 'curve' },
            { x: 200, y: 150, type: 'straight' },
            { x: 200, y: 100, type: 'straight' },
            { x: 300, y: 50, type: 'curve' },
            { x: 500, y: 50, type: 'straight' },
            { x: 600, y: 100, type: 'curve' },
            { x: 600, y: 200, type: 'straight' },
            { x: 600, y: 300, type: 'straight' },
            { x: 500, y: 400, type: 'curve' },
            { x: 400, y: 500, type: 'finish' }
        ];
        function initObstacles() {
            obstacles = [];
            for (let i = 0; i < 5; i++) {
                obstacles.push({
                    x: Math.random() * 700 + 50,
                    y: Math.random() * 500 + 50,
                    width: 20 + Math.random() * 30,
                    height: 20 + Math.random() * 30,
                    color: ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff'][Math.floor(Math.random() * 4)]
                });
            }
        }
        function drawTrack() {
            ctx.strokeStyle = '#30363d';
            ctx.lineWidth = 80;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(track[0].x, track[0].y);
            for (let i = 1; i < track.length; i++) {
                ctx.lineTo(track[i].x, track[i].y);
            }
            ctx.stroke();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(track[0].x, track[0].y);
            for (let i = 1; i < track.length; i++) {
                ctx.lineTo(track[i].x, track[i].y);
            }
            ctx.stroke();
            ctx.setLineDash([]);
        }
        function drawCar() {
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            ctx.fillStyle = #3b82f6;
            ctx.fillRect(-car.width/2, -car.height/2, car.width, car.height);
            ctx.fillStyle = '#1a1e24';
            ctx.fillRect(-car.width/2 + 3, -car.height/2 + 3, car.width - 6, car.height/3);
            ctx.restore();
        }
        function drawObstacles() {
            obstacles.forEach(obs => {
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x - obs.width/2, obs.y - obs.height/2, obs.width, obs.height);
            });
        }
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }
        function updateCar(deltaTime) {
            if (keys['ArrowUp'] || keys['w']) {
                car.speed = Math.min(car.speed + 0.1, 8);
            } else if (keys['ArrowDown'] || keys['s']) {
                car.speed = Math.max(car.speed - 0.2, -3);
            } else {
                car.speed *= 0.98;
            }
            if (keys['ArrowLeft'] || keys['a']) {
                car.angle -= 0.05 * car.speed;
            }
            if (keys['ArrowRight'] || keys['d']) {
                car.angle += 0.05 * car.speed;
            }
            car.x += Math.sin(car.angle) * car.speed;
            car.y -= Math.cos(car.angle) * car.speed;
            car.x = Math.max(20, Math.min(canvas.width - 20, car.x));
            car.y = Math.max(20, Math.min(canvas.height - 20, car.y));
            const carRect = { x: car.x - car.width/2, y: car.y - car.height/2, width: car.width, height: car.height };
            obstacles.forEach(obs => {
                const obsRect = { x: obs.x - obs.width/2, y: obs.y - obs.height/2, width: obs.width, height: obs.height };
                if (checkCollision(carRect, obsRect)) {
                    car.speed *= 0.5;
                    car.x -= Math.sin(car.angle) * 5;
                    car.y += Math.cos(car.angle) * 5;
                }
            });
        }
        function updateGame(timestamp) {
            if (!gameRunning) return;
            const deltaTime = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            gameTime += deltaTime;
            timeEl.textContent = gameTime.toFixed(1);
            speedEl.textContent = Math.abs(Math.round(car.speed * 20));
            updateCar(deltaTime);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawTrack();
            drawObstacles();
            drawCar();
            requestAnimationFrame(updateGame);
        }
        function startGame() {
            if (gameRunning) return;
            car = { x: 400, y: 500, angle: 0, speed: 0, width: 20, height: 30 };
            gameTime = 0;
            laps = 0;
            initObstacles();
            gameRunning = true;
            lastTime = performance.now();
            requestAnimationFrame(updateGame);
        }
        function resetGame() {
            gameRunning = false;
            car = { x: 400, y: 500, angle: 0, speed: 0, width: 20, height: 30 };
            gameTime = 0;
            laps = 0;
            timeEl.textContent = '0.0';
            speedEl.textContent = '0';
            lapsEl.textContent = '0';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawTrack();
            drawCar();
        }
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }
        });
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        initObstacles();
        drawTrack();
        drawCar();
    </script>
<script src="../i18n.js" defer></script>
</body>
</html>
