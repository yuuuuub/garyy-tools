<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>11x11中文填字</title>
<meta name="description" content="11x11中文填字游戏，中等难度中文填字挑战"><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#8b5cf6;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--orange:#f97316}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:1.8em;margin-bottom:8px;text-align:center}
.subtitle{color:#8b949e;margin-bottom:20px;text-align:center;font-size:.9em}
.game-area{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:700px;width:100%;margin-bottom:16px}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:1em;transition:all .2s}
.btn:hover{opacity:.9;transform:scale(1.02)}
.btn:active{transform:scale(.98)}
.btn-sm{padding:6px 14px;font-size:.85em}
.btn-green{background:var(--green)}.btn-red{background:var(--red)}.btn-yellow{background:var(--yellow);color:#000}.btn-orange{background:var(--orange)}
.flex{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.grid{display:grid;gap:4px}
.info{text-align:center;color:#8b949e;margin:12px 0;font-size:.95em}
.result{text-align:center;font-size:1.2em;margin:16px 0;padding:16px;border-radius:8px;background:var(--bg);min-height:40px}
.token{display:inline-block;padding:4px 10px;margin:3px;border-radius:6px;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:all .2s}
.token:hover{border-color:var(--accent)}
.token.active{background:var(--accent);border-color:var(--accent);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@media(max-width:480px){body{padding:12px}.game-area{padding:16px}h1{font-size:1.4em}}
</style><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="11x11中文填字">
  <meta property="og:description" content="11x11中文填字游戏，中等难度中文填字挑战">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/crosswords-11x11cn/">
</head><body>
<h1>11x11中文填字</h1><p class="subtitle">十一宫格填字挑战</p>
<div class="game-area"><div id="board" class="grid" style="grid-template-columns:repeat(11,32px);margin:0 auto;width:fit-content"></div>
<div class="flex" style="margin-top:16px"><button class="btn" onclick="newPuzzle()">新游戏</button><button class="btn btn-green" onclick="checkAnswer()">检查</button></div>
<div class="result" id="result"></div>
<script>
const S=11;const blocks=new Set();
for(let i=0;i<8;i++)blocks.add(Math.floor(Math.random()*S)+'-'+Math.floor(Math.random()*S));
const inp={};
function init(){const b=document.getElementById('board');b.innerHTML='';
for(let r=0;r<S;r++)for(let c=0;c<S;c++){if(blocks.has(r+'-'+c)){const d=document.createElement('div');d.style.cssText='width:32px;height:32px;background:#30363d;border-radius:3px';b.appendChild(d);continue;}
const i=document.createElement('input');i.type='text';i.maxLength=2;
i.style.cssText='width:32px;height:32px;text-align:center;font-size:.95em;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:3px';
i.oninput=function(){this.value=this.value.replace(/[^\u4e00-\u9fa5]/g,'');};
b.appendChild(i);inp[r+'-'+c]=i;}}}
function newPuzzle(){blocks.clear();for(let i=0;i<8;i++)blocks.add(Math.floor(Math.random()*S)+'-'+Math.floor(Math.random()*S));init();}
function checkAnswer(){let c=0,t=0;for(const[k,i]of Object.entries(inp)){t++;if(i.value)c++;}document.getElementById('result').innerHTML='已填 '+c+'/'+t+' 格';}
init();</script>
</div><script src="../i18n.js" defer></script>
</body></html>
