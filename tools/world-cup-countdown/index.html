<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ 2026世界杯倒计时 - Gary's Tools</title>
<meta name="description" content="2026美加墨世界杯倒计时，实时显示距开幕/决赛天数，支持北京时间">
<style>
:root{--bg:#0a0e1a;--card:#111827;--border:#1f2937;--text:#e5e7eb;--text2:#9ca3af;--gold:#f59e0b;--blue:#3b82f6;--red:#ef4444;--green:#10b981;--radius:16px;--shadow:0 4px 32px rgba(0,0,0,.4)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background-image:radial-gradient(ellipse at 50% 0%,rgba(245,158,11,.08) 0,transparent 60%),radial-gradient(ellipse at 20% 100%,rgba(59,130,246,.06) 0,transparent 50%)}
.container{max-width:500px;width:100%;text-align:center}
h1{font-size:1.8rem;font-weight:800;margin-bottom:4px;background:linear-gradient(135deg,var(--gold),var(--red));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{color:var(--text2);font-size:.85rem;margin-bottom:28px}
.hero{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:32px 20px;margin-bottom:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--red),var(--blue))}
.hero-label{font-size:.85rem;color:var(--text2);margin-bottom:8px}
.countdown{display:flex;justify-content:center;gap:12px;margin-bottom:8px}
.cd-block{text-align:center}
.cd-num{font-size:3rem;font-weight:900;font-variant-numeric:tabular-nums;min-width:70px;line-height:1;background:linear-gradient(180deg,var(--gold),#d97706);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.cd-label{font-size:.7rem;color:var(--text2);margin-top:4px;text-transform:uppercase}
.hero-title{font-size:1.1rem;font-weight:700;color:var(--gold);margin-top:12px}
.hero-date{font-size:.8rem;color:var(--text2)}
.milestones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.milestone{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;box-shadow:var(--shadow)}
.milestone .ms-icon{font-size:1.5rem;margin-bottom:4px}
.milestone .ms-date{font-size:.75rem;color:var(--text2);margin-bottom:4px}
.milestone .ms-name{font-size:.85rem;font-weight:600}
.milestone .ms-days{font-size:.75rem;color:var(--gold);margin-top:4px}
.fun-facts{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);text-align:left}
.fun-facts h3{font-size:.95rem;color:var(--gold);margin-bottom:12px}
.fact{font-size:.82rem;color:var(--text2);padding:6px 0;border-bottom:1px solid var(--border);line-height:1.6}
.fact:last-child{border-bottom:none}
.fact strong{color:var(--text)}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.7rem}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="⚽ 2026世界杯倒计时 - Gary's Tools">
  <meta property="og:description" content="2026美加墨世界杯倒计时，实时显示距开幕/决赛天数，支持北京时间">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/world-cup-countdown/">
</head>
<body>
<div class="container">
<h1>🏆 2026世界杯</h1>
<p class="subtitle">美国 · 加拿大 · 墨西哥 ｜ FIFA World Cup 2026</p>

<div class="hero">
<div class="hero-label" id="statusLabel">距离开幕还有</div>
<div class="countdown">
<div class="cd-block"><div class="cd-num" id="cd-days">00</div><div class="cd-label">天</div></div>
<div class="cd-block"><div class="cd-num" id="cd-hours">00</div><div class="cd-label">时</div></div>
<div class="cd-block"><div class="cd-num" id="cd-mins">00</div><div class="cd-label">分</div></div>
<div class="cd-block"><div class="cd-num" id="cd-secs">00</div><div class="cd-label">秒</div></div>
</div>
<div class="hero-title" id="targetTitle">加载中...</div>
<div class="hero-date" id="targetDate">2026年6月11日 21:00 (北京时间)</div>
</div>

<div class="milestones" id="milestones"></div>

<div class="fun-facts">
<h2>⚡ 世界杯小知识</h2>
<div class="fact">🏟️ 首次由<strong>三个国家</strong>联合主办（美国、加拿大、墨西哥）</div>
<div class="fact">🌍 历史首次<strong>48支球队</strong>参赛，共104场比赛</div>
<div class="fact">🏙️ 将在<strong>16个城市</strong>举行比赛</div>
<div class="fact">🎯 决赛在<strong>纽约/新泽西</strong>大都会人寿体育场举行</div>
<div class="fact">🥇 阿根廷是<strong>卫冕冠军</strong>（2022年卡塔尔世界杯）</div>
<div class="fact">📺 预计全球超过<strong>50亿人</strong>观看本届赛事</div>
</div>

<footer>2026 FIFA World Cup · 数据仅供参考</footer>
</div>

<script>
const OPENING=new Date('2026-06-11T21:00:00+08:00');
const FINAL=new Date('2026-07-20T03:00:00+08:00');
const MILESTONES=[
{name:'小组赛开始',date:new Date('2026-06-11T21:00:00+08:00'),icon:'🏟️'},
{name:'1/16决赛',date:new Date('2026-06-28T21:00:00+08:00'),icon:'⚔️'},
{name:'1/4决赛',date:new Date('2026-07-06T21:00:00+08:00'),icon:'🎯'},
{name:'半决赛',date:new Date('2026-07-12T21:00:00+08:00'),icon:'🔥'},
{name:'季军赛',date:new Date('2026-07-18T21:00:00+08:00'),icon:'🥉'},
{name:'决赛',date:new Date('2026-07-20T03:00:00+08:00'),icon:'🏆'},
];

function pad(n){return String(n).padStart(2,'0')}

function update(){
const now=new Date();
let target,label,title,dateStr;

// Find next milestone
let next=null;
for(const m of MILESTONES){
if(m.date>now){next=m;break;}
}
if(!next){next=MILESTONES[MILESTONES.length-1];}

const diff=next.date-now;
const isPast=diff<0;
const absDiff=Math.abs(diff);
const days=Math.floor(absDiff/86400000);
const hours=Math.floor((absDiff%86400000)/3600000);
const mins=Math.floor((absDiff%3600000)/60000);
const secs=Math.floor((absDiff%60000)/1000);

document.getElementById('cd-days').textContent=pad(days);
document.getElementById('cd-hours').textContent=pad(hours);
document.getElementById('cd-mins').textContent=pad(mins);
document.getElementById('cd-secs').textContent=pad(secs);
document.getElementById('statusLabel').textContent=isPast?'距离'+next.name+'已过':'距离'+next.name+'还有';
document.getElementById('targetTitle').textContent=next.name;
document.getElementById('targetDate').textContent=next.date.getFullYear()+'年'+(next.date.getMonth()+1)+'月'+next.date.getDate()+'日 '+
next.date.getHours().toString().padStart(2,'0')+':'+next.date.getMinutes().toString().padStart(2,'0')+' (北京时间)';

// milestones
document.getElementById('milestones').innerHTML=MILESTONES.map(m=>{
const d=m.date-now;const dd=Math.floor(d/86400000);
let ds=d<0?'已过去':'还有'+dd+'天';
if(dd===0)ds='今天';
return `<div class="milestone"><div class="ms-icon">${m.icon}</div><div class="ms-date">${m.date.getMonth()+1}月${m.date.getDate()}日</div><div class="ms-name">${m.name}</div><div class="ms-days">${ds}</div></div>`;
}).join('');
}
update();setInterval(update,1000);
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
