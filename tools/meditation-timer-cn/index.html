<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧘 冥想计时器</title>
<meta name="description" content="冥想计时器，支持多种冥想模式、引导音频、记录冥想时间">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;display:flex;justify-content:center}
.ctn{max-width:500px;width:100%}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.timer-display{text-align:center;padding:40px 0}
.timer-circle{width:240px;height:240px;border-radius:50%;border:4px solid var(--border);display:flex;align-items:center;justify-content:center;flex-direction:column;margin:0 auto;position:relative}
.timer-circle.running{border-color:var(--accent);animation:pulse 2s ease-in-out infinite}
.timer-circle.done{border-color:var(--success)}
.timer-time{font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums}
.timer-label{font-size:.9rem;color:var(--text2);margin-top:4px}
.progress-ring{position:absolute;inset:-4px;border-radius:50%;border:4px solid transparent;border-top-color:var(--accent);transition:transform .3s}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.2)}50%{box-shadow:0 0 0 20px rgba(59,130,246,0)}}
.mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mode-card{padding:12px;border:2px solid var(--border);border-radius:8px;cursor:pointer;text-align:center;transition:all .2s}.mode-card:hover{border-color:var(--accent)}.mode-card.active{border-color:var(--accent);background:rgba(59,130,246,.1)}
.mode-card .icon{font-size:1.5rem}.mode-card .name{font-size:.85rem;margin-top:4px}
.duration-btns{display:flex;gap:8px;margin-top:8px;justify-content:center}.dur-btn{padding:8px 16px;border:2px solid var(--border);border-radius:20px;cursor:pointer;font-size:.85rem;transition:all .2s}.dur-btn:hover{border-color:var(--accent)}.dur-btn.active{border-color:var(--accent);background:var(--accent);color:var(--text)}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}.stat-card .num{font-size:1.4rem;font-weight:700;color:var(--accent)}.stat-card .lbl{font-size:.7rem;color:var(--text2);margin-top:2px}
.bell{display:inline-block;font-size:1.5rem;margin:0 8px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧘</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div class="ctn">
<div class="hdr"><h1>🧘 冥想计时器</h1><p>静心冥想，放松身心</p></div>

<div class="cd">
<div class="mode-grid" id="modeGrid"></div>
<label style="text-align:center;margin-top:16px">选择时长</label>
<div class="duration-btns" id="durBtns"></div>

<div class="timer-display">
<div class="timer-circle" id="timerCircle">
  <div class="progress-ring" id="progressRing"></div>
  <div class="timer-time" id="timerTime">05:00</div>
  <div class="timer-label" id="timerLabel">准备开始</div>
</div>
</div>

<div class="bg">
<button id="startBtn" onclick="toggleTimer()" style="padding:14px 40px;font-size:1.1rem">▶ 开始</button>
<button class="sec" onclick="resetTimer()">⏹ 重置</button>
</div>
</div>

<div class="cd"><h2>📊 冥想统计</h2>
<div class="stats-grid" id="stats"></div>
<div style="margin-top:12px;font-size:.85rem;color:var(--text2);text-align:center" id="streak"></div></div>

<div class="cd"><h2>📋 最近记录</h2><div id="recentList" class="empty">暂无记录</div></div>
</div>

<script>
const $=id=>document.getElementById(id);
let sessions=JSON.parse(localStorage.getItem('mt_sessions')||'[]');
const today=()=>new Date().toISOString().slice(0,10);
const save=()=>localStorage.setItem('mt_sessions',JSON.stringify(sessions));

const modes=[
  {icon:'🧘',name:'专注呼吸',desc:'关注呼吸的节奏'},
  {icon:'🌊',name:'身体扫描',desc:'从头到脚放松'},
  {icon:'💡',name:'正念观察',desc:'观察当下的一切'},
  {icon:'🌙',name:'睡前放松',desc:'帮助入眠'},
  {icon:'☀️',name:'晨间冥想',desc:'开启新的一天'},
  {icon:'🎯',name:'目标冥想',desc:'专注目标'}
];

const durations=[3,5,10,15,20,30];
let selectedMode=0,selectedDur=5;
let timer=null,remaining=300,isRunning=false,totalSeconds=300;

function init(){
  let modeHtml='';modes.forEach((m,i)=>{
    modeHtml+=`<div class="mode-card ${i===selectedMode?'active':''}" onclick="selectMode(${i})">
      <div class="icon">${m.icon}</div><div class="name">${m.name}</div></div>`;
  });$('modeGrid').innerHTML=modeHtml;

  let durHtml='';durations.forEach(d=>{
    durHtml+=`<div class="dur-btn ${d===selectedDur?'active':''}" onclick="selectDur(${d})">${d}分钟</div>`;
  });$('durBtns').innerHTML=durHtml;

  updateDisplay();renderStats();renderRecent();
}

function selectMode(i){selectedMode=i;document.querySelectorAll('.mode-card').forEach((el,j)=>{el.classList.toggle('active',j===i)})}
function selectDur(d){
  selectedDur=d;totalSeconds=d*60;remaining=totalSeconds;
  document.querySelectorAll('.dur-btn').forEach(el=>{el.classList.toggle('active',el.textContent===d+'分钟')});
  updateDisplay();
}

function toggleTimer(){
  if(isRunning){pauseTimer()}else{startTimer()}
}

function startTimer(){
  if(remaining<=0){remaining=totalSeconds}
  isRunning=true;$('startBtn').textContent='⏸ 暂停';$('timerCircle').classList.add('running');
  $('timerLabel').textContent=modes[selectedMode].name;
  timer=setInterval(()=>{
    remaining--;updateDisplay();
    if(remaining<=0){completeTimer()}
  },1000);
}

function pauseTimer(){
  clearInterval(timer);isRunning=false;$('startBtn').textContent='▶ 继续';$('timerCircle').classList.remove('running');
}

function resetTimer(){
  clearInterval(timer);isRunning=false;remaining=totalSeconds;updateDisplay();
  $('startBtn').textContent='▶ 开始';$('timerCircle').classList.remove('running','done');$('timerLabel').textContent='准备开始';
}

function completeTimer(){
  clearInterval(timer);isRunning=false;
  $('timerCircle').classList.remove('running');$('timerCircle').classList.add('done');
  $('timerLabel').textContent='完成！ 🎉';$('startBtn').textContent='▶ 开始';
  sessions.push({date:today(),mode:modes[selectedMode].name,duration:selectedDur,completedAt:new Date().toISOString()});
  save();renderStats();renderRecent();
  try{const a=new AudioContext();const o=a.createOscillator();const g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=528;g.gain.value=0.3;o.start();setTimeout(()=>{g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+1);o.stop(a.currentTime+1)},1000)}catch(e){}
  setTimeout(()=>{$('timerCircle').classList.remove('done');resetTimer()},3000);
}

function updateDisplay(){
  const min=Math.floor(remaining/60);const sec=remaining%60;
  $('timerTime').textContent=`${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  const progress=((totalSeconds-remaining)/totalSeconds)*360;
  $('progressRing').style.transform=`rotate(${progress}deg)`;
}

function renderStats(){
  const total=sessions.length;const totalMin=sessions.reduce((s,x)=>s+x.duration,0);
  const thisWeek=sessions.filter(s=>{const d=new Date(s.completedAt);const now=new Date();return(now-d)<7*86400000}).length;
  const streak=getStreak();
  $('stats').innerHTML=`
    <div class="stat-card"><div class="num">${total}</div><div class="lbl">总次数</div></div>
    <div class="stat-card"><div class="num">${totalMin}</div><div class="lbl">总分钟</div></div>
    <div class="stat-card"><div class="num">${thisWeek}</div><div class="lbl">本周</div></div>`;
  $('streak').textContent=streak>0?`🔥 连续冥想 ${streak} 天`:'开始你的冥想之旅';
}

function getStreak(){let s=0;const d=new Date();for(let i=0;i<365;i++){const k=d.toISOString().slice(0,10);if(sessions.some(s=>s.date===k))s++;else break;d.setDate(d.getDate()-1)}return s}

function renderRecent(){
  const sorted=[...sessions].sort((a,b)=>b.completedAt.localeCompare(a.completedAt)).slice(0,10);
  let html='';sorted.forEach(s=>{
    html+=`<div class="li"><div style="display:flex;justify-content:space-between;align-items:center">
      <div><strong>${s.mode}</strong><div style="font-size:.8rem;color:var(--text2)">${s.date}</div></div>
      <span class="tag s">${s.duration}分钟</span></div></div>`;
  });$('recentList').innerHTML=html||'<div class="empty">暂无记录</div>';
}

init();
</script>
</body>
</html>
