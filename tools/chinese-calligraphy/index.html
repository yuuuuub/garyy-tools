<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国书法欣赏</title><meta name="description" content="中国书法欣赏 - 在线欣赏中国书法作品"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.calligraphy-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;cursor:pointer;transition:transform .2s}.calligraphy-item:hover{transform:translateY(-2px)}.calligraphy-title{font-size:1.2rem;font-weight:600;color:var(--blue);margin-bottom:8px}.calligraphy-author{font-size:.9rem;color:var(--text2);margin-bottom:4px}.calligraphy-dynasty{font-size:.85rem;color:var(--green);margin-bottom:12px}.calligraphy-content{font-size:2rem;text-align:center;padding:20px;background:var(--card);border-radius:8px;margin-bottom:12px;line-height:1.5}.calligraphy-desc{font-size:.9rem;color:var(--text)}.search-box{margin-bottom:16px}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{display:inline-block;padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.85rem}.btn:hover{opacity:.85}.btn.active{background:var(--green)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="中国书法欣赏"><meta property="og:description" content="中国书法欣赏 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🖌️ 中国书法欣赏</h1><p class="sub">在线欣赏中国书法作品</p>
<div class="card">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索书法作品..." oninput="filterCalligraphy()">
</div>
<div class="btn-group">
<button class="btn active" onclick="filterByStyle('all',this)">全部</button>
<button class="btn" onclick="filterByStyle('楷书',this)">楷书</button>
<button class="btn" onclick="filterByStyle('行书',this)">行书</button>
<button class="btn" onclick="filterByStyle('草书',this)">草书</button>
<button class="btn" onclick="filterByStyle('隶书',this)">隶书</button>
<button class="btn" onclick="filterByStyle('篆书',this)">篆书</button>
</div>
</div>
<div id="calligraphyList"></div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var calligraphies=[
  {title:'兰亭集序',author:'王羲之',dynasty:'东晋',style:'行书',content:'永和九年，岁在癸丑，暮春之初，会于会稽山阴之兰亭，修禊事也。群贤毕至，少长咸集。此地有崇山峻岭，茂林修竹；又有清流激湍，映带左右，引以为流觞曲水，列坐其次。虽无丝竹管弦之盛，一觞一咏，亦足以畅叙幽情。',desc:'被誉为"天下第一行书"，是王羲之的代表作。'},
  {title:'祭侄文稿',author:'颜真卿',dynasty:'唐代',style:'行书',content:'维乾元元年，岁次戊戌，九月庚午朔，三日壬申，第十三叔银青光禄大夫使持节蒲州诸军事蒲州刺史上轻车都尉丹阳县开国侯真卿，以清酌庶羞，祭于亡侄赠赞善大夫季明之灵。',desc:'被誉为"天下第二行书"，是颜真卿的代表作。'},
  {title:'寒食帖',author:'苏轼',dynasty:'宋代',style:'行书',content:'自我来黄州，已过三寒食。年年欲惜春，春去不容惜。今年又苦雨，两月秋萧瑟。卧闻海棠花，泥污燕支雪。暗中偷负去，夜半真有力。何殊病少年，病起头已白。',desc:'被誉为"天下第三行书"，是苏轼的代表作。'},
  {title:'九成宫醴泉铭',author:'欧阳询',dynasty:'唐代',style:'楷书',content:'九成宫醴泉铭，秘书监捡校侍中骑都尉郡开国公魏征奉敕撰，维贞观六年孟夏之月，皇帝避暑乎九成之宫，此则随之仁寿宫也。',desc:'欧阳询的楷书代表作，被誉为"天下第一楷书"。'},
  {title:'多宝塔碑',author:'颜真卿',dynasty:'唐代',style:'楷书',content:'多宝塔碑，西京千福寺多宝佛塔感应碑文，南阳岑勋撰，朝议郎判尚书武部员外郎琅邪颜真卿书，朝散大夫检校尚书都官郎中东海徐浩题额。',desc:'颜真卿的楷书代表作，结构严谨，笔力雄强。'},
  {title:'玄秘塔碑',author:'柳公权',dynasty:'唐代',style:'楷书',content:'唐故左街僧录内供奉三教谈论引驾大德安国寺上座赐紫大达法师玄秘塔碑铭并序，江南西道都团练观察处置等使朝散大夫兼御史中丞上柱国赐紫金鱼袋裴休撰。',desc:'柳公权的楷书代表作，结构严谨，笔力遒劲。'},
  {title:'自叙帖',author:'怀素',dynasty:'唐代',style:'草书',content:'怀素家长沙，幼而事佛，经禅之暇，颇好翰墨。然恨未能远睹前人之奇迹，所见甚浅。遂担笈杖锡，西游上国，谒见当代名公，错综其事。',desc:'怀素的草书代表作，笔势狂放，气势磅礴。'},
  {title:'古诗四帖',author:'张旭',dynasty:'唐代',style:'草书',content:'东明九芝盖，北烛五云车。飘飖入倒景，出没上流霞。碧峰共水镜，青琐出彤霞。莺啼御沟柳，鹤唳景阳花。',desc:'张旭的草书代表作，被誉为"草圣"。'},
  {title:'曹全碑',author:'佚名',dynasty:'汉代',style:'隶书',content:'君讳全，字景完，敦煌效谷人也。其先盖周之胄，武王秉乾之机，翦伐殷商，既定尔勋，福禄攸同，封弟叔振铎于曹国，因氏焉。',desc:'汉代隶书代表作，风格秀逸多姿。'},
  {title:'张迁碑',author:'佚名',dynasty:'汉代',style:'隶书',content:'君讳迁，字公方，陈留己吾人也。君之先，出自周室，周宣王中兴，有张仲，以孝友为行，披览诗雅，焕知其祖。',desc:'汉代隶书代表作，风格雄强古朴。'},
  {title:'峄山碑',author:'李斯',dynasty:'秦代',style:'篆书',content:'皇帝立国，维初在昔，嗣世称王。讨伐乱逆，威动四极，武义直方。上荐高号，孝道显献。既平泰昏，皇帝正平，端平法则，天下咸宁。',desc:'李斯的小篆代表作，结构严谨，笔画均匀。'},
  {title:'泰山刻石',author:'李斯',dynasty:'秦代',style:'篆书',content:'皇帝临位，作制明法，臣下修饬。二十有六年，初并天下，罔不宾服。亲巡远方黎民，登兹泰山，周览东极。',desc:'李斯的小篆代表作，风格端庄严谨。'}
];
var currentStyle='all';
function renderCalligraphy(calligraphiesToShow){
  var list=document.getElementById('calligraphyList');
  var html='';
  calligraphiesToShow.forEach(function(calligraphy){
    html+='<div class="calligraphy-item">';
    html+='<div class="calligraphy-title">'+calligraphy.title+'</div>';
    html+='<div class="calligraphy-author">作者：'+calligraphy.author+'</div>';
    html+='<div class="calligraphy-dynasty">朝代：'+calligraphy.dynasty+' | 书体：'+calligraphy.style+'</div>';
    html+='<div class="calligraphy-content">'+calligraphy.content.substring(0,50)+'...</div>';
    html+='<div class="calligraphy-desc">'+calligraphy.desc+'</div>';
    html+='</div>';
  });
  list.innerHTML=html;
}
function filterCalligraphy(){
  var search=document.getElementById('searchInput').value.toLowerCase();
  var filtered=calligraphies.filter(function(calligraphy){
    var matchSearch=calligraphy.title.toLowerCase().includes(search)||calligraphy.author.toLowerCase().includes(search)||calligraphy.desc.toLowerCase().includes(search);
    var matchStyle=currentStyle==='all'||calligraphy.style===currentStyle;
    return matchSearch&&matchStyle;
  });
  renderCalligraphy(filtered);
}
function filterByStyle(style,btn){
  currentStyle=style;
  document.querySelectorAll('.btn-group .btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  filterCalligraphy();
}
renderCalligraphy(calligraphies);

document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script></body></html>
