<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>调色板生成器</title><meta name="description" content="调色板生成器 - 在线生成和谐配色方案"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>"><meta name="robots" content="index, follow"><style>:root{--green:#238636;--red:#ef4444;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:700px;margin:auto}h1{text-align:center;padding:20px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.palette{display:flex;border-radius:10px;overflow:hidden;height:120px;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,.3)}.color-block{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s;position:relative}.color-block:hover{transform:scaleY(1.05);z-index:1}.color-block .hex{font-size:.8rem;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.5)}.color-block .copy{font-size:.65rem;opacity:.7;margin-top:4px}.btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.btn{padding:10px 20px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.85rem}.btn:hover{opacity:.85}.btn.secondary{background:var(--bg);border:1px solid var(--border);color:var(--text)}.mode-btns{display:flex;gap:6px;justify-content:center;margin-bottom:16px}.mode-btn{padding:6px 14px;background:var(--bg);border:1px solid var(--border);border-radius:16px;color:var(--text2);cursor:pointer;font-size:.8rem}.mode-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}.saved-palettes{margin-top:16px}.saved-palette{display:flex;border-radius:6px;overflow:hidden;height:40px;cursor:pointer;margin-bottom:8px;transition:transform .2s}.saved-palette:hover{transform:scaleY(1.1)}
/* === Smooth Animations === */
@keyframes animFadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes animScaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
body, .container, main, .container-fluid, .wrapper {
  animation: animFadeIn .45s ease-out both;
}
.weather-card, .word-card, .result-card, .output-card, .info-card,
.card, [class*="card"], [class*="panel"], [class*="result"], [class*="output"],
[class*="detail"], [class*="item"], [class*="section"]:not(header):not(nav),
[class*="box"]:not(.search-box) {
  transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
}
.weather-card:hover, .word-card:hover, .result-card:hover, .output-card:hover,
.info-card:hover, .card:hover, [class*="card"]:hover, [class*="panel"]:hover,
[class*="result"]:hover, [class*="output"]:hover, [class*="detail"]:hover,
[class*="item"]:hover, [class*="box"]:not(.search-box):hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 18px rgba(0,0,0,.12);
}
button, input[type="submit"], .btn, [class*="btn"], .search-box button,
.filter-btn, .refresh-btn, .retry-btn {
  transition: transform .12s ease, opacity .2s ease, background .2s ease, box-shadow .2s ease;
}
button:active, input[type="submit"]:active, .btn:active, [class*="btn"]:active,
.search-box button:active, .filter-btn:active, .refresh-btn:active, .retry-btn:active {
  transform: scale(.96);
  opacity: .88;
}
button:hover, .btn:hover, [class*="btn"]:hover {
  box-shadow: 0 2px 8px rgba(59,130,246,.18);
}
html { scroll-behavior: smooth; }
.coin-item { transition: transform .2s ease, box-shadow .2s ease; }
.coin-item:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
.city-item { transition: transform .2s ease, background .2s ease, border-color .2s ease; }
.city-item:hover { transform: translateX(4px); }
input[type="text"], input[type="number"], textarea, select {
  transition: border-color .2s ease, box-shadow .2s ease;
}
input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus {
  box-shadow: 0 0 0 3px rgba(59,130,246,.15);
}
/* end animations */

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<meta property="og:title" content="调色板生成器">
<meta property="og:description" content="调色板生成器 - 在线生成和谐配色方案">
<meta property="og:image" content="/og-default.png">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🎨 调色板生成器</h1><p class="sub">生成和谐的配色方案，点击色块复制HEX值</p>
<div class="mode-btns"><div class="mode-btn active" onclick="setMode('random')">随机</div><div class="mode-btn" onclick="setMode('analogous')">类似色</div><div class="mode-btn" onclick="setMode('complementary')">互补色</div><div class="mode-btn" onclick="setMode('triadic')">三色组</div><div class="mode-btn" onclick="setMode('monochromatic')">单色</div></div>
<div class="card"><div class="palette" id="palette"></div>
<div class="btn-row"><button class="btn" onclick="generate()">🎲 生成新配色</button><button class="btn secondary" onclick="savePalette()">💾 保存</button></div></div>
<div class="card" id="colorDetail" style="display:none"><div id="detailContent"></div></div>
<div class="saved-palettes card" id="savedSection" style="display:none"><h3 style="font-size:.95rem;margin-bottom:12px">💾 已保存的配色</h3><div id="savedList"></div></div></div>
<script src="../i18n.js" defer></script>
<script>
var mode='random',currentColors=[];
function setMode(m){mode=m;document.querySelectorAll('.mode-btn').forEach(function(b,i){b.classList.toggle('active',['random','analogous','complementary','triadic','monochromatic'][i]===m)});generate();}
function hslToHex(h,s,l){s/=100;l/=100;var a=s*Math.min(l,1-l);function f(n){var k=(n+h/30)%12;var c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c).toString(16).padStart(2,'0');}return '#'+f(0)+f(8)+f(4);}
function generate(){
  var colors=[];
  if(mode==='random'){for(var i=0;i<5;i++){colors.push(hslToHex(Math.random()*360,60+Math.random()*30,45+Math.random()*20));}}
  else if(mode==='analogous'){var h=Math.random()*360;for(var i=0;i<5;i++){colors.push(hslToHex((h+i*25)%360,65,50));}}
  else if(mode==='complementary'){var h=Math.random()*360;for(var i=0;i<5;i++){colors.push(hslToHex((h+(i<3?i*15:i*15+180))%360,60+i*5,45+i*8));}}
  else if(mode==='triadic'){var h=Math.random()*360;for(var i=0;i<5;i++){colors.push(hslToHex((h+Math.floor(i/2)*120+(i%2)*20)%360,60,45+i*8));}}
  else if(mode==='monochromatic'){var h=Math.random()*360;for(var i=0;i<5;i++){colors.push(hslToHex(h,50+i*10,25+i*13));}}
  currentColors=colors;
  var html='';colors.forEach(function(c,i){var bright=parseInt(c.slice(1),16)>0x7fffff;html+='<div class="color-block" style="background:'+c+'" onclick="showDetail('+i+')"><span class="hex" style="color:'+(bright?'#000':'#fff')+'">'+c.toUpperCase()+'</span><span class="copy" style="color:'+(bright?'#333':'#ccc')+'">点击复制</span></div>';});
  document.getElementById('palette').innerHTML=html;
}
function showDetail(i){
  var c=currentColors[i];
  var r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);
  var html='<div style="display:flex;align-items:center;gap:16px;margin-bottom:12px"><div style="width:60px;height:60px;border-radius:10px;background:'+c+'"></div><div><div style="font-size:1.2rem;font-weight:700">'+c.toUpperCase()+'</div><div style="font-size:.85rem;color:var(--text2)">RGB('+r+', '+g+', '+b+')</div></div></div>';
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.82rem">';
  html+='<div>HEX: <code style="background:var(--bg);padding:2px 8px;border-radius:4px;cursor:pointer" onclick="copy(\''+c+'\')">'+c+'</code></div>';
  html+='<div>RGB: <code style="background:var(--bg);padding:2px 8px;border-radius:4px;cursor:pointer" onclick="copy(\'rgb('+r+', '+g+', '+b+')\')">'+r+', '+g+', '+b+'</code></div>';
  html+='</div>';
  document.getElementById('detailContent').innerHTML=html;
  document.getElementById('colorDetail').style.display='block';
  navigator.clipboard.writeText(c).catch(function(){});
}
function copy(s){navigator.clipboard.writeText(s).then(function(){garyyToast('已复制: '+s,'success')}).catch(function(){})}
function savePalette(){if(!currentColors.length)return;var saved=JSON.parse(localStorage.getItem('color_palettes')||'[]');saved.unshift(currentColors);if(saved.length>20)saved=saved.slice(0,20);localStorage.setItem('color_palettes',JSON.stringify(saved));renderSaved();garyyToast('配色已保存','success');}
function renderSaved(){var saved=JSON.parse(localStorage.getItem('color_palettes')||'[]');if(!saved.length){document.getElementById('savedSection').style.display='none';return;}document.getElementById('savedSection').style.display='block';var html='';saved.forEach(function(p,i){html+='<div class="saved-palette" onclick="loadSaved('+i+')">';p.forEach(function(c){html+='<div style="flex:1;background:'+c+'"></div>';});html+='</div>';});document.getElementById('savedList').innerHTML=html;}
function loadSaved(i){var saved=JSON.parse(localStorage.getItem('color_palettes')||'[]');if(saved[i]){currentColors=saved[i];var html='';currentColors.forEach(function(c,j){var bright=parseInt(c.slice(1),16)>0x7fffff;html+='<div class="color-block" style="background:'+c+'" onclick="showDetail('+j+')"><span class="hex" style="color:'+(bright?'#000':'#fff')+'">'+c.toUpperCase()+'</span><span class="copy" style="color:'+(bright?'#333':'#ccc')+'">点击复制</span></div>';});document.getElementById('palette').innerHTML=html;}}
generate();renderSaved();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
