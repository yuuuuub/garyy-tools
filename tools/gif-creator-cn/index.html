<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎞️ GIF 制作器</title>
<meta name="description" content="在线GIF制作器，多图合成GIF、调整帧率、循环次数，一键导出">
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.upload-area{border:2px dashed var(--border);border-radius:12px;padding:40px 20px;text-align:center;cursor:pointer;transition:all .2s}
.upload-area:hover{border-color:var(--accent);background:var(--tag-bg)}
.upload-icon{font-size:48px;margin-bottom:8px}
.upload-text{font-size:14px;color:var(--text-secondary)}
.frame-list{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.frame-item{position:relative;flex-shrink:0;width:80px;text-align:center}
.frame-item img,.frame-item canvas{width:80px;height:80px;object-fit:cover;border-radius:8px;border:2px solid var(--border)}
.frame-item .remove{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#ef4444;color:#fff;border:none;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.frame-num{font-size:11px;color:var(--text-secondary);margin-top:4px}
.preview-box{display:flex;justify-content:center;padding:10px 0}
.preview-box canvas,.preview-box img{max-width:100%;border-radius:12px;border:1px solid var(--border)}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.slider-row label{font-size:13px;color:var(--text-secondary);min-width:60px}
.slider-row input[type="range"]{flex:1}
.slider-row span{font-size:13px;color:var(--text-secondary);min-width:36px;text-align:right}
.input-group{margin-bottom:12px}
.input-group label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:4px;font-weight:500}
.input-group select{width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;outline:none}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.info-item{background:var(--preview-bg);border-radius:10px;padding:12px;text-align:center}
.info-item .val{font-size:18px;font-weight:700;color:var(--accent)}
.info-item .lbl{font-size:11px;color:var(--text-secondary);margin-top:2px}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.btn:active{transform:scale(.97)}
.hidden{display:none}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card-bg);color:var(--text);padding:10px 24px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow);border:1px solid var(--border)}
.toast.show{opacity:1}
.progress{width:100%;height:6px;border-radius:3px;background:var(--border);margin-top:8px;overflow:hidden}
.progress-bar{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
footer{text-align:center;padding:24px 0;color:var(--text-secondary);font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎞️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🎞️ GIF 制作器">
<meta property="og:description" content="在线GIF制作器，多图合成GIF">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/gif-creator-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--card-bg);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>🎞️ GIF 制作器</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </header>

  <div class="card">
    <div class="card-title">📤 上传图片帧</div>
    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">🖼️</div>
      <div class="upload-text">点击或拖拽上传多张图片</div>
      <div style="font-size:12px;color:var(--text-secondary);margin-top:4px">支持 JPG / PNG / GIF（将拆分帧）</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
  </div>

  <div class="card hidden" id="framesCard">
    <div class="card-title">📋 帧列表 <span id="frameCount" style="font-size:12px;color:var(--text-secondary);font-weight:400"></span></div>
    <div class="frame-list" id="frameList"></div>
  </div>

  <div class="card hidden" id="settingsCard">
    <div class="card-title">⚙️ 设置</div>
    <div class="slider-row"><label>帧率</label><input type="range" min="1" max="30" value="10" id="fps" oninput="document.getElementById('fpsVal').textContent=this.value+' FPS'"><span id="fpsVal">10 FPS</span></div>
    <div class="slider-row"><label>循环</label><input type="range" min="1" max="20" value="0" id="loops" oninput="document.getElementById('loopVal').textContent=this.value===0?'∞':this.value+'次'"><span id="loopVal">∞</span></div>
    <div class="input-group"><label>输出尺寸</label>
      <select id="outSize">
        <option value="original">原始尺寸</option>
        <option value="320">320px</option>
        <option value="480" selected>480px</option>
        <option value="640">640px</option>
      </select>
    </div>
  </div>

  <div class="card hidden" id="previewCard">
    <div class="card-title">👁️ 预览</div>
    <div class="preview-box"><canvas id="previewCanvas"></canvas></div>
    <div class="progress hidden" id="progressWrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  </div>

  <div class="card hidden" id="infoCard">
    <div class="card-title">📊 信息</div>
    <div class="info-grid">
      <div class="info-item"><div class="val" id="infoFrames">0</div><div class="lbl">帧数</div></div>
      <div class="info-item"><div class="val" id="infoDuration">0s</div><div class="lbl">时长</div></div>
      <div class="info-item"><div class="val" id="infoSize">0KB</div><div class="lbl">文件大小</div></div>
      <div class="info-item"><div class="val" id="infoDimensions">0x0</div><div class="lbl">尺寸</div></div>
    </div>
  </div>

  <div class="btn-row hidden" id="btnRow">
    <button class="btn btn-primary" onclick="exportGif()">💾 导出 GIF</button>
    <button class="btn btn-outline" onclick="resetAll()">🔄 重置</button>
  </div>

  <footer>GIF 制作器 · 纯前端处理，不上传服务器</footer>
</div>
<div class="toast" id="toast"></div>
<script src="../i18n.js" defer></script>
<script>
let frames = [], gifData = null;

function init() {
  const ua = document.getElementById('uploadArea');
  const fi = document.getElementById('fileInput');
  ua.addEventListener('click', () => fi.click());
  ua.addEventListener('dragover', e => { e.preventDefault(); ua.classList.add('dragover'); });
  ua.addEventListener('dragleave', () => ua.classList.remove('dragover'));
  ua.addEventListener('drop', e => { e.preventDefault(); ua.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
  fi.addEventListener('change', e => handleFiles(e.target.files));
}

function handleFiles(files) {
  Array.from(files).forEach(f => {
    if (!f.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        frames.push(img);
        updateUI();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(f);
  });
}

function updateUI() {
  if (frames.length === 0) return;
  ['framesCard','settingsCard','previewCard','infoCard','btnRow'].forEach(id => document.getElementById(id).classList.remove('hidden'));
  document.getElementById('frameCount').textContent = `(${frames.length}帧)`;

  const list = document.getElementById('frameList');
  list.innerHTML = frames.map((f, i) => `<div class="frame-item"><img src="${f.src}" alt="帧${i+1}"><button class="remove" onclick="removeFrame(${i})">×</button><div class="frame-num">#${i+1}</div></div>`).join('');

  document.getElementById('infoFrames').textContent = frames.length;
  const fps = +document.getElementById('fps').value;
  document.getElementById('infoDuration').textContent = (frames.length / fps).toFixed(1) + 's';
  document.getElementById('infoDimensions').textContent = `${frames[0].width}x${frames[0].height}`;

  // preview
  renderPreview();
}

function renderPreview() {
  if (frames.length === 0) return;
  const c = document.getElementById('previewCanvas');
  const ctx = c.getContext('2d');
  c.width = frames[0].width; c.height = frames[0].height;
  let idx = 0;
  function draw() {
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.drawImage(frames[idx], 0, 0, c.width, c.height);
    idx = (idx + 1) % frames.length;
  }
  draw();
  setInterval(draw, 1000 / +document.getElementById('fps').value);
}

function removeFrame(i) {
  frames.splice(i, 1);
  if (frames.length === 0) {
    ['framesCard','settingsCard','previewCard','infoCard','btnRow'].forEach(id => document.getElementById(id).classList.add('hidden'));
  } else {
    updateUI();
  }
}

async function exportGif() {
  if (frames.length < 2) { showToast('至少需要2帧'); return; }
  showToast('正在生成GIF...');
  document.getElementById('progressWrap').classList.remove('hidden');

  const outSize = +document.getElementById('outSize').value || Math.max(frames[0].width, frames[0].height);
  const fps = +document.getElementById('fps').value;
  const delay = Math.round(1000 / fps);
  const loops = +document.getElementById('loops').value;

  // Simple GIF encoder
  const encoder = new GIFEncoder();
  encoder.setRepeat(loops);
  encoder.setDelay(delay);
  encoder.start();

  for (let i = 0; i < frames.length; i++) {
    const c = document.createElement('canvas');
    const ratio = Math.min(outSize / frames[i].width, outSize / frames[i].height, 1);
    c.width = Math.round(frames[i].width * ratio);
    c.height = Math.round(frames[i].height * ratio);
    const ctx = c.getContext('2d');
    ctx.drawImage(frames[i], 0, 0, c.width, c.height);
    encoder.addFrame(ctx);
    document.getElementById('progressBar').style.width = ((i+1)/frames.length*100)+'%';
    await new Promise(r => setTimeout(r, 0));
  }

  encoder.finish();
  gifData = encoder.dataURI();
  document.getElementById('progressWrap').classList.add('hidden');

  // size info
  const bytes = atob(gifData.split(',')[1]).length;
  document.getElementById('infoSize').textContent = bytes > 1024*1024 ? (bytes/1024/1024).toFixed(1)+'MB' : (bytes/1024).toFixed(0)+'KB';

  // download
  const a = document.createElement('a');
  a.download = 'animation.gif'; a.href = gifData; a.click();
  showToast('GIF已导出！');
}

// Minimal GIF Encoder
function GIFEncoder() {
  this.data = [];
  this.delay = 100;
  this.repeat = 0;
  this.started = false;
}

GIFEncoder.prototype.setRepeat = function(r) { this.repeat = r; };
GIFEncoder.prototype.setDelay = function(d) { this.delay = d; };

GIFEncoder.prototype.start = function() {
  this.data = [];
  this.started = true;
  // GIF header
  this.writeUTF('GIF89a');
};

GIFEncoder.prototype.addFrame = function(ctx) {
  const w = ctx.canvas.width, h = ctx.canvas.height;
  const imgData = ctx.getImageData(0, 0, w, h);

  // Simple quantization: 256 colors
  const palette = [];
  const pixels = new Uint8Array(w * h);
  const colorMap = {};
  const maxColors = 256;

  for (let i = 0; i < imgData.data.length; i += 4) {
    const r = imgData.data[i], g = imgData.data[i+1], b = imgData.data[i+2];
    const key = `${r>>2},${g>>2},${b>>2}`;
    if (!(key in colorMap)) {
      if (palette.length < maxColors) {
        colorMap[key] = palette.length;
        palette.push([r, g, b]);
      } else {
        colorMap[key] = 0;
      }
    }
    pixels[i/4] = colorMap[key];
  }

  // Pad palette to power of 2
  let palSize = 2;
  while (palSize < palette.length) palSize *= 2;
  while (palette.length < palSize) palette.push([0, 0, 0]);

  // Store frame data for LZW encoding
  this.frames = this.frames || [];
  this.frames.push({ w, h, pixels, palette, palSize });
};

GIFEncoder.prototype.finish = function() {
  if (!this.frames || this.frames.length === 0) return;

  const firstFrame = this.frames[0];
  const w = firstFrame.w, h = firstFrame.h;
  const out = [];

  // GIF Header
  this.writeUTFto(out, 'GIF89a');

  // Logical Screen Descriptor
  this.writeShort(out, w);
  this.writeShort(out, h);
  out.push(0x87); // GCT flag, 8-bit color
  out.push(0); // bg color index
  out.push(0); // pixel aspect ratio

  // Global Color Table
  const gct = firstFrame.palette;
  for (let i = 0; i < gct.length; i++) {
    out.push(gct[i][0], gct[i][1], gct[i][2]);
  }

  // Netscape extension for looping
  out.push(0x21, 0xFF, 11);
  this.writeUTFto(out, 'NETSCAPE2.0');
  out.push(3, 1);
  this.writeShort(out, this.repeat);
  out.push(0);

  // Frames
  for (const frame of this.frames) {
    // Graphic Control Extension
    out.push(0x21, 0xF9, 4);
    out.push(0x00); // disposal
    this.writeShort(out, this.delay / 10);
    out.push(0); // transparent color index
    out.push(0);

    // Image Descriptor
    out.push(0x2C);
    this.writeShort(out, 0); // left
    this.writeShort(out, 0); // top
    this.writeShort(out, frame.w);
    this.writeShort(out, frame.h);

    // Local Color Table flag
    if (frame.palSize !== gct.length) {
      out.push(0x87);
      for (let i = 0; i < frame.palSize; i++) {
        const c = frame.palette[i] || [0,0,0];
        out.push(c[0], c[1], c[2]);
      }
    } else {
      out.push(0x00);
    }

    // LZW Minimum Code Size
    const minCodeSize = 8;
    out.push(minCodeSize);

    // LZW compress
    const lzwData = this.lzwEncode(frame.pixels, minCodeSize);
    // Write sub-blocks
    let pos = 0;
    while (pos < lzwData.length) {
      const block = lzwData.slice(pos, pos + 255);
      out.push(block.length);
      for (const b of block) out.push(b);
      pos += 255;
    }
    out.push(0); // block terminator
  }

  // Trailer
  out.push(0x3B);

  // Create data URI
  let binary = '';
  for (const b of out) binary += String.fromCharCode(b);
  this.dataURI = 'data:image/gif;base64,' + btoa(binary);
};

GIFEncoder.prototype.lzwEncode = function(pixels, minCodeSize) {
  const clearCode = 1 << minCodeSize;
  const eoiCode = clearCode + 1;
  let codeSize = minCodeSize + 1;
  let nextCode = eoiCode + 1;
  const maxCode = 4096;

  const dict = {};
  for (let i = 0; i < clearCode; i++) dict[String.fromCharCode(i)] = i;

  const output = [];
  let buffer = 0, bits = 0;

  function writeCode(code) {
    buffer |= (code << bits);
    bits += codeSize;
    while (bits >= 8) {
      output.push(buffer & 0xFF);
      buffer >>= 8;
      bits -= 8;
    }
  }

  writeCode(clearCode);

  let current = String.fromCharCode(pixels[0]);
  for (let i = 1; i < pixels.length; i++) {
    const next = current + String.fromCharCode(pixels[i]);
    if (next in dict) {
      current = next;
    } else {
      writeCode(dict[current]);
      if (nextCode < maxCode) {
        dict[next] = nextCode++;
        if (nextCode > (1 << codeSize) && codeSize < 12) codeSize++;
      } else {
        writeCode(clearCode);
        dict = {};
        for (let j = 0; j < clearCode; j++) dict[String.fromCharCode(j)] = j;
        nextCode = eoiCode + 1;
        codeSize = minCodeSize + 1;
      }
      current = String.fromCharCode(pixels[i]);
    }
  }
  writeCode(dict[current]);
  writeCode(eoiCode);

  if (bits > 0) output.push(buffer & 0xFF);
  return output;
};

GIFEncoder.prototype.writeUTF = function(s) { this.data.push(...[...s].map(c => c.charCodeAt(0))); };
GIFEncoder.prototype.writeUTFto = function(arr, s) { arr.push(...[...s].map(c => c.charCodeAt(0))); };
GIFEncoder.prototype.writeShort = function(arr, v) { arr.push(v & 0xFF, (v >> 8) & 0xFF); };

function resetAll() {
  frames = []; gifData = null;
  ['framesCard','settingsCard','previewCard','infoCard','btnRow'].forEach(id => document.getElementById(id).classList.add('hidden'));
  document.getElementById('progressWrap').classList.add('hidden');
}

function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  document.querySelector('.theme-toggle').textContent = t === 'dark' ? '☀️' : '🌙';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

init();
</script>
</body>
</html>
