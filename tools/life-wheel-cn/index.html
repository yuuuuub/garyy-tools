<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎡 人生之轮</title>
<meta name="description" content="人生之轮工具，评估生活各维度满意度，找到平衡点">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=range],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
input[type=range]{padding:0;height:8px;-webkit-appearance:none;appearance:none;background:var(--border);border:none;border-radius:4px;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.es{text-align:center;padding:40px;color:var(--text2)}
.wheel-canvas{width:100%;max-width:400px;margin:0 auto;display:block}
.slider-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.slider-row:last-child{border-bottom:none}
.slider-label{min-width:80px;font-weight:600;font-size:.9rem}
.slider-input{flex:1}
.slider-val{min-width:40px;text-align:center;font-weight:700;color:var(--accent)}
.dim-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.dim-item:last-child{border-bottom:none}
.dim-score{font-weight:700;color:var(--accent)}
.result-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:12px}
.result-item{display:flex;justify-content:space-between;padding:6px 0;font-size:.9rem}
.result-bar{flex:2;margin:0 12px;height:6px;background:var(--border);border-radius:3px;position:relative}
.result-bar-fill{height:100%;border-radius:3px;position:absolute;left:0;top:0}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎡</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🎡 人生之轮">
<meta property="og:description" content="人生之轮工具，评估生活各维度满意度">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🎡 人生之轮</h1><p>评估生活各维度满意度，找到人生的平衡点</p></div>

<div class="cd"><h2>📊 生活维度评分</h2>
<p style="font-size:.85rem;color:var(--text2);margin-bottom:12px">为每个维度打分（1-10分），1分最不满意，10分最满意</p>
<div id="sliders"></div>
<div class="bg"><button onclick="generateWheel()">生成人生之轮</button></div></div>

<div class="cd"><h2>🎡 人生之轮图</h2>
<canvas class="wheel-canvas" id="wheelCanvas" width="400" height="400"></canvas>
<div id="avgScore" style="text-align:center;margin-top:12px"></div></div>

<div class="cd"><h2>📋 评分详情</h2><div id="detailList"></div></div>

<div class="cd"><h2>💡 分析建议</h2><div id="advice" class="es">完成评分后查看分析建议</div></div>

<div class="cd"><h2>📜 历史记录</h2><div id="historyList"></div>
<div class="bg"><button class="sec" onclick="clearHistory()">清空历史</button></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
const defaultDims=[
  {name:'事业',emoji:'💼',color:'#3b82f6'},
  {name:'财务',emoji:'💰',color:'#22c55e'},
  {name:'健康',emoji:'❤️',color:'#ef4444'},
  {name:'家庭',emoji:'👨‍👩‍👧',color:'#f59e0b'},
  {name:'社交',emoji:'🤝',color:'#8b5cf6'},
  {name:'学习',emoji:'📚',color:'#06b6d4'},
  {name:'娱乐',emoji:'🎮',color:'#ec4899'},
  {name:'精神',emoji:'🧘',color:'#14b8a6'},
  {name:'环境',emoji:'🏠',color:'#f97316'},
  {name:'贡献',emoji:'🌍',color:'#a855f7'}
];
let dims=JSON.parse(localStorage.getItem('lw_dims')||JSON.stringify(defaultDims));
let history=JSON.parse(localStorage.getItem('lw_history')||'[]');

function save(){localStorage.setItem('lw_dims',JSON.stringify(dims));localStorage.setItem('lw_history',JSON.stringify(history))}

function renderSliders(){
  $('sliders').innerHTML=dims.map((d,i)=>`<div class="slider-row"><span class="slider-label">${d.emoji} ${d.name}</span><input type="range" class="slider-input" min="1" max="10" value="${d.score||5}" id="sl${i}" oninput="updateVal(${i})"><span class="slider-val" id="sv${i}">${d.score||5}</span></div>`).join('');
}

function updateVal(i){const v=$(`sl${i}`).value;$(`sv${i}`).textContent=v;dims[i].score=+v;save()}

function generateWheel(){
  dims.forEach((d,i)=>d.score=+(document.getElementById(`sl${i}`)?.value||5));
  save();drawWheel();renderDetail();renderAdvice();saveHistory();
}

function drawWheel(){
  const canvas=$('wheelCanvas'),ctx=canvas.getContext('2d');
  const w=canvas.width,h=canvas.height,cx=w/2,cy=h/2,r=Math.min(w,h)/2-40;
  ctx.clearRect(0,0,w,h);
  const n=dims.length,step=Math.PI*2/n;

  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--border').trim()||'#30363d';
  for(let lv=1;lv<=10;lv++){
    ctx.beginPath();
    const lr=r*lv/10;
    for(let i=0;i<=n;i++){
      const angle=step*i-Math.PI/2;
      const x=cx+lr*Math.cos(angle),y=cy+lr*Math.sin(angle);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
  }

  for(let i=0;i<n;i++){
    const angle=step*i-Math.PI/2;
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.lineTo(cx+r*Math.cos(angle),cy+r*Math.sin(angle));ctx.stroke();
    const lx=cx+(r+20)*Math.cos(angle),ly=cy+(r+20)*Math.sin(angle);
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text').trim()||'#e6edf3';
    ctx.font='12px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(dims[i].emoji+' '+dims[i].name,lx,ly);
  }

  ctx.beginPath();
  dims.forEach((d,i)=>{
    const angle=step*i-Math.PI/2;
    const dr=r*(d.score||5)/10;
    const x=cx+dr*Math.cos(angle),y=cy+dr*Math.sin(angle);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.closePath();ctx.fillStyle='rgba(59,130,246,.2)';ctx.fill();
  ctx.strokeStyle='#3b82f6';ctx.lineWidth=2;ctx.stroke();

  dims.forEach((d,i)=>{
    const angle=step*i-Math.PI/2;
    const dr=r*(d.score||5)/10;
    ctx.beginPath();ctx.arc(cx+dr*Math.cos(angle),cy+dr*Math.sin(angle),4,0,Math.PI*2);
    ctx.fillStyle=d.color||'#3b82f6';ctx.fill();
  });

  const avg=(dims.reduce((s,d)=>s+(d.score||5),0)/dims.length).toFixed(1);
  $('avgScore').innerHTML=`<span style="font-size:1.2rem;font-weight:700;color:var(--accent)">平均分：${avg}</span> / 10`;
}

function renderDetail(){
  $('detailList').innerHTML=dims.map(d=>{
    const pct=((d.score||5)/10*100).toFixed(0);
    return `<div class="dim-item"><span>${d.emoji} ${d.name}</span><span class="dim-score">${d.score||5}/10</span></div>`;
  }).join('');
}

function renderAdvice(){
  const sorted=dims.slice().sort((a,b)=>(a.score||5)-(b.score||5));
  const lowest=sorted.slice(0,3);
  const highest=sorted.slice(-3).reverse();
  const avg=(dims.reduce((s,d)=>s+(d.score||5),0)/dims.length).toFixed(1);
  let html=`<div class="result-box">`;
  html+=`<p style="margin-bottom:8px"><strong>平均满意度：</strong>${avg}/10</p>`;
  html+=`<p style="color:var(--danger);margin-bottom:4px">⚠️ 需要改善的领域：</p>`;
  lowest.forEach(d=>{html+=`<div class="result-item"><span>${d.emoji} ${d.name}</span><span style="color:var(--danger)">${d.score||5}分</span></div>`});
  html+=`<p style="color:var(--success);margin-top:12px;margin-bottom:4px">✨ 表现优秀的领域：</p>`;
  highest.forEach(d=>{html+=`<div class="result-item"><span>${d.emoji} ${d.name}</span><span style="color:var(--success)">${d.score||5}分</span></div>`});
  html+=`</div>`;
  $('advice').innerHTML=html;
}

function saveHistory(){
  history.push({date:new Date().toISOString().slice(0,10),scores:dims.map(d=>({name:d.name,score:d.score||5}))});
  if(history.length>30)history=history.slice(-30);
  save();renderHistory();
}

function renderHistory(){
  if(!history.length){$('historyList').innerHTML='<div class="es">暂无历史记录</div>';return}
  $('historyList').innerHTML=history.slice(-5).reverse().map(h=>{
    const avg=(h.scores.reduce((s,d)=>s+d.score,0)/h.scores.length).toFixed(1);
    return `<div style="padding:8px 0;border-bottom:1px solid var(--border)"><span style="font-size:.85rem;color:var(--accent)">${h.date}</span> <span style="font-size:.85rem">平均 ${avg} 分</span></div>`;
  }).join('');
}

function clearHistory(){if(!confirm('确定清空历史？'))return;history=[];save();renderHistory()}
renderSliders();renderDetail();renderHistory();
</script>
</body>
</html>
