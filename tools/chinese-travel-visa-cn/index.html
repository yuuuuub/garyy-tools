<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国旅行签证指南 - Chinese Travel Visa Guide</title>
<meta name="description" content="中国旅行签证指南，免签政策、签证类型、申请流程与常见问题解答">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国旅行签证指南 - Chinese Travel Visa Guide">
<meta property="og:description" content="中国旅行签证指南，免签政策、签证类型、申请流程与常见问题解答">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#7c3aed;--accent2:#6d28d9}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#7c3aed;--accent2:#6d28d9}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#0f0520 0%,#1a0a30 50%,#200d3d 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5b21b6;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#7c3aed,#a78bfa,#8b5cf6,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.info-banner{background:linear-gradient(135deg,rgba(124,58,237,0.1),rgba(124,58,237,0.05));border:1px solid rgba(124,58,237,0.3);border-radius:14px;padding:20px;margin-bottom:24px}
.info-banner h2{font-size:1.2em;color:var(--accent);margin-bottom:12px}
.visa-types{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.visa-type{background:var(--card);border-radius:10px;padding:16px;border:1px solid var(--border)}
.visa-type .type-name{font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.visa-type .type-desc{font-size:0.85em;color:var(--text2)}
.visa-type .type-duration{font-size:0.75em;color:var(--accent);margin-top:6px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.visa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:16px}
.visa-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.visa-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.visa-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.visa-card .v-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.visa-card .v-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(124,58,237,0.15);color:var(--accent)}
.visa-card .v-name{font-size:1.1em;font-weight:bold}
.visa-card .v-country{font-size:0.8em;color:var(--text2);margin-top:2px}
.visa-card .v-content{font-size:0.85em;color:var(--text2);line-height:1.8;margin-bottom:8px}
.visa-card .v-content strong{color:var(--text)}
.visa-card .v-badge{display:inline-block;padding:3px 10px;border-radius:8px;font-size:0.75em;font-weight:600;margin-bottom:8px}
.badge-free{background:rgba(34,197,94,0.15);color:#22c55e}
.badge-visa{background:rgba(124,58,237,0.15);color:#7c3aed}
.badge-transit{background:rgba(59,130,246,0.15);color:#3b82f6}
.visa-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.visa-grid{grid-template-columns:1fr}.visa-types{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>📋 中国旅行签证指南</h1>
<p>Chinese Travel Visa Guide — 了解签证政策，轻松入境中国</p>
</header>
<div class="container">
<div class="info-banner">
<h2>📌 2024年最新政策</h2>
<div class="visa-types">
<div class="visa-type"><div class="type-name">🛂 普通签证 (L签)</div><div class="type-desc">旅游签证，需提前申请</div><div class="type-duration">停留期：30-90天</div></div>
<div class="visa-type"><div class="type-name">⚡ 144小时过境免签</div><div class="type-desc">54国公民过境免签</div><div class="type-duration">停留：144小时（6天）</div></div>
<div class="visa-type"><div class="type-name">🌍 单方面免签</div><div class="type-desc">多国互免签证政策</div><div class="type-duration">停留：30天</div></div>
<div class="visa-type"><div class="type-name">✈️ 海南免签</div><div class="type-desc">59国旅游团免签入琼</div><div class="type-duration">停留：30天</div></div>
</div>
</div>
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索国家或签证类型...（如"美国""日本""免签"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="免签">🌍 免签国家</button>
<button class="filter-btn" data-filter="过境免签">⚡ 过境免签</button>
<button class="filter-btn" data-filter="需要签证">🛂 需要签证</button>
<button class="filter-btn" data-filter="特别政策">📌 特别政策</button>
</div>
<div class="visa-grid" id="visaGrid"></div>
<footer><p>📋 中国旅行签证指南 — 出发前确认签证，旅途更安心</p></footer>
</div>
<script>
const VISA_DATA=[
{id:1,name:"美国",en:"United States",category:"需要签证",icon:"🇺🇸",content:"美国公民需提前申请<strong>L旅游签证</strong>。需提交护照、照片、行程单、在职证明等材料。审批时间约<strong>5-10个工作日</strong>。可申请10年多次往返签证。",tip:"建议提前1-2个月申请，准备面签"},
{id:2,name:"日本",en:"Japan",category:"免签",icon:"🇯🇵",content:"日本公民可享受<strong>15天免签</strong>入境中国。持有效护照即可入境，无需提前办理签证。适用于旅游、商务访问等短期活动。",tip:"确保护照有效期超过6个月"},
{id:3,name:"韩国",en:"South Korea",category:"免签",icon:"🇰🇷",content:"韩国公民可享受<strong>15天免签</strong>入境中国。适用于旅游和短期商务访问。入境时需持有往返机票和足够旅费。",tip:"济州岛居民有额外免签政策"},
{id:4,name:"新加坡",en:"Singapore",category:"免签",icon:"🇸🇬",content:"新加坡公民可享受<strong>30天免签</strong>入境中国。中新互免签证协定，持有效护照即可自由出入。",tip:"商务和旅游均适用"},
{id:5,name:"英国",en:"United Kingdom",category:"需要签证",icon:"🇬🇧",content:"英国公民需申请<strong>L旅游签证</strong>。可通过签证中心在线申请。通常审批时间为<strong>15个工作日</strong>。支持多次往返申请。",tip:"可通过UKVI在线系统提交申请"},
{id:6,name:"澳大利亚",en:"Australia",category:"过境免签",icon:"🇦🇺",content:"澳洲公民可享受<strong>144小时过境免签</strong>。需持有前往第三国/地区的联程机票，限特定口岸入境。也可申请普通旅游签证。",tip:"过境免签需从指定口岸入境"},
{id:7,name:"加拿大",en:"Canada",category:"需要签证",icon:"🇨🇦",content:"加拿大公民需申请<strong>L旅游签证</strong>。在线提交申请，通常<strong>10-15个工作日</strong>出签。可申请10年多次入境签证。",tip:"有加拿大永久居民卡可简化申请"},
{id:8,name:"法国",en:"France",category:"免签",icon:"🇫🇷",content:"法国公民可享受<strong>15天免签</strong>入境中国。中新法互免签证协定生效后适用。持有效护照即可入境。",tip:"适用于短期旅游和商务访问"},
{id:9,name:"德国",en:"Germany",category:"免签",icon:"🇩🇪",content:"德国公民可享受<strong>15天免签</strong>入境中国。适用于旅游、探亲和短期商务。入境时需出示回程机票。",tip:"长期停留仍需申请签证"},
{id:10,name:"马来西亚",en:"Malaysia",category:"免签",icon:"🇲🇾",content:"马来西亚公民可享受<strong>30天免签</strong>入境中国。中新马互免签证协定，持有效护照自由旅行。",tip:"旅游和商务均适用"},
{id:11,name:"泰国",en:"Thailand",category:"免签",icon:"🇹🇭",content:"泰国公民可享受<strong>30天免签</strong>入境中国。中泰互免签证协定生效后，持护照即可入境。",tip:"自2024年起永久互免签证"},
{id:12,name:"144小时过境免签",en:"144-Hour Transit Visa-Free",category:"过境免签",icon:"⚡",content:"适用于<strong>54个国家</strong>公民，持有联程机票前往第三国/地区，可在<strong>24个口岸</strong>入境。停留不超过144小时（6天），限入境城市所在省份活动。",tip:"适合国际旅客短期中转中国游玩"},
{id:13,name:"海南59国免签",en:"Hainan 59-Country Visa-Free",category:"特别政策",icon:"🏝️",content:"<strong>59个国家</strong>公民通过旅行社组团可免签进入海南。停留不超过<strong>30天</strong>。适用于海南全域旅游，但不能离开海南省。",tip:"个人游暂不适用，需通过旅行社"},
{id:14,name:"中国护照出境",en:"Chinese Passport Exit",category:"特别政策",icon:"🇨🇳",content:"中国公民持<strong>护照+签证</strong>出境。需确认目的地国家签证要求。护照有效期需超过<strong>6个月</strong>。港澳通行证另需办理。",tip:"出境前检查护照有效期和目的地签证"}
];
const grid=document.getElementById('visaGrid');
const search=document.getElementById('searchInput');
const filterRow=document.getElementById('filterRow');
let currentFilter='all';
function render(){
const q=search.value.toLowerCase();
grid.innerHTML='';
VISA_DATA.filter(d=>{
const matchFilter=currentFilter==='all'||d.category===currentFilter;
const matchSearch=!q||d.name.toLowerCase().includes(q)||d.en.toLowerCase().includes(q)||d.content.includes(q);
return matchFilter&&matchSearch;
}).forEach(d=>{
const badgeClass=d.category==='免签'?'badge-free':d.category==='过境免签'?'badge-transit':d.category==='需要签证'?'badge-visa':'badge-free';
grid.innerHTML+=`<div class="visa-card"><div class="v-header"><div class="v-icon">${d.icon}</div><div><div class="v-name">${d.name}</div><div class="v-country">${d.en}</div></div></div><span class="v-badge ${badgeClass}">${d.category}</span><div class="v-content">${d.content}</div><div class="v-tip">💡 ${d.tip}</div></div>`;
});
}
filterRow.addEventListener('click',e=>{
if(e.target.classList.contains('filter-btn')){
filterRow.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
e.target.classList.add('active');
currentFilter=e.target.dataset.filter;
render();
}
});
search.addEventListener('input',render);
render();
</script>
</body>
</html>
