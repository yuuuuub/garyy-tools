<head>

<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;display:flex;justify-content:center}
.ctn{max-width:600px;width:100%}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit;font-size:.95rem}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:.75rem;font-weight:600}
.tag.s{background:rgba(34,197,94,.15);color:var(--success)}.tag.w{background:rgba(245,158,11,.15);color:var(--warn)}.tag.d{background:rgba(239,68,68,.15);color:var(--danger)}
.li{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.li:hover{border-color:var(--accent)}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:.9rem}
select,input,textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.9rem;margin-bottom:8px}
label{font-size:.85rem;color:var(--text2);margin-bottom:4px;display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
.tab-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:20px;font-size:.85rem;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:white;border-color:var(--accent)}
.detail{display:none}.detail.active{display:block}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-chip{padding:6px 12px;border-radius:16px;font-size:.8rem;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:all .2s}
.filter-chip.active{background:var(--accent);color:white;border-color:var(--accent)}
.herb-card{padding:16px;border:1px solid var(--border);border-radius:8px;margin-bottom:12px}
.herb-card h3{color:var(--accent);margin-bottom:4px}
.herb-card .pinyin{color:var(--text2);font-size:.85rem;margin-bottom:8px}
.herb-card .tag{margin:2px}
.herb-detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.herb-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)}
.herb-row:last-child{border-bottom:none}
.herb-label{color:var(--text2)}
.daily-herb{padding:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:12px;color:white;text-align:center;margin-bottom:16px}
.daily-herb h3{font-size:1.5rem;margin-bottom:8px}
.daily-herb p{opacity:.9;font-size:.9rem}
</style>

<body>
<div class="ctn">
<div class="hdr">
<h1>🌿 中草药图鉴</h1>
<p>本草纲目，药食同源</p>
</div>

<div class="tab-bar" id="tabs">
<div class="tab active" data-tab="browse">浏览药材</div>
<div class="tab" data-tab="search">搜索药材</div>
<div class="tab" data-tab="favorites">收藏夹</div>
<div class="tab" data-tab="daily">每日推荐</div>
</div>

<div id="view-browse" class="detail active">
<div class="cd">
<h2>📋 按性味筛选</h2>
<div class="filter-bar" id="nature-filter"></div>
<h2 style="margin-top:12px">📋 按功效筛选</h2>
<div class="filter-bar" id="function-filter"></div>
</div>
<div id="herb-list"></div>
</div>

<div id="view-search" class="detail">
<div class="cd">
<h2>🔍 搜索药材</h2>
<input type="text" id="search-input" placeholder="输入药材名称或拼音..." oninput="searchHerbs()">
<div id="search-results"></div>
</div>
</div>

<div id="view-favorites" class="detail">
<div class="cd">
<h2>❤️ 收藏的药材</h2>
<div id="favorites-list"></div>
</div>
</div>

<div id="view-daily" class="detail">
<div id="daily-recommendation"></div>
<div class="cd">
<h2>📖 今日药材详解</2>
<div id="daily-detail"></div>
</div>
</div>
</div>

<script>
const herbs = [
  { name: '人参', pinyin: 'rén shēn', nature: '温', flavor: '甘、微苦', meridian: '脾、肺、心经', functions: ['补气', '固脱', '生津', '安神'], contraindications: '实证、热证忌服；不宜与藜芦、五灵脂同用' },
  { name: '黄芪', pinyin: 'huáng qí', nature: '微温', flavor: '甘', meridian: '脾、肺经', functions: ['补气', '固表', '利水', '生肌'], contraindications: '表实邪盛、气滞湿阻、食积停滞等不宜' },
  { name: '当归', pinyin: 'dāng guī', nature: '温', flavor: '甘、辛', meridian: '肝、心、脾经', functions: ['补血', '活血', '调经', '止痛'], contraindications: '湿盛中满、大便溏泄者慎用' },
  { name: '枸杞', pinyin: 'gǒu qǐ', nature: '平', flavor: '甘', meridian: '肝、肾经', functions: ['滋补肝肾', '益精明目', '润肺'], contraindications: '脾虚有湿、泄泻者忌服' },
  { name: '黄连', pinyin: 'huáng lián', nature: '寒', flavor: '苦', meridian: '心、脾、胃、肝、胆、大肠经', functions: ['清热燥湿', '泻火解毒'], contraindications: '脾胃虚寒者忌用' },
  { name: '金银花', pinyin: 'jīn yín huā', nature: '寒', flavor: '甘', meridian: '肺、心、胃经', functions: ['清热解毒', '疏散风热'], contraindications: '脾胃虚寒及气虚疮疡脓清者忌用' },
  { name: '菊花', pinyin: 'jú huā', nature: '微寒', flavor: '甘、苦', meridian: '肺、肝经', functions: ['散风清热', '平肝明目', '清热解毒'], contraindications: '气虚胃寒、食少泄泻者慎用' },
  { name: '丹参', pinyin: 'dān shēn', nature: '微寒', flavor: '苦', meridian: '心、肝经', functions: ['活血调经', '祛瘀止痛', '凉血消痈', '除烦安神'], contraindications: '无瘀血者慎用；不宜与藜芦同用' },
  { name: '白术', pinyin: 'bái zhú', nature: '温', flavor: '甘、苦', meridian: '脾、胃经', functions: ['健脾益气', '燥湿利水', '止汗', '安胎'], contraindications: '阴虚燥渴、气滞胀闷者忌用' },
  { name: '茯苓', pinyin: 'fú líng', nature: '平', flavor: '甘、淡', meridian: '心、肺、脾、肾经', functions: ['利水渗湿', '健脾', '宁心'], contraindications: '虚寒精滑或气虚下陷者忌服' },
  { name: '甘草', pinyin: 'gān cǎo', nature: '平', flavor: '甘', meridian: '心、肺、脾、胃经', functions: ['补脾益气', '清热解毒', '祛痰止咳', '缓急止痛', '调和诸药'], contraindications: '不宜与海藻、大戟、甘遂、芫花同用' },
  { name: '川芎', pinyin: 'chuān xiōng', nature: '温', flavor: '辛', meridian: '肝、胆、心包经', functions: ['活血行气', '祛风止痛'], contraindications: '阴虚火旺、出血者忌用' },
  { name: '红花', pinyin: 'hóng huā', nature: '温', flavor: '辛', meridian: '心、肝经', functions: ['活血通经', '散瘀止痛'], contraindications: '孕妇忌用；月经过多者慎用' },
  { name: '陈皮', pinyin: 'chén pí', nature: '温', flavor: '辛、苦', meridian: '脾、肺经', functions: ['理气健脾', '燥湿化痰'], contraindications: '气虚、阴虚燥咳者忌用' },
  { name: '半夏', pinyin: 'bàn xià', nature: '温', flavor: '辛', meridian: '脾、胃、肺经', functions: ['燥湿化痰', '降逆止呕', '消痞散结'], contraindications: '阴虚燥咳、津亏口渴者忌用；不宜与乌头类同用' },
  { name: '生姜', pinyin: 'shēng jiāng', nature: '微温', flavor: '辛', meridian: '肺、脾、胃经', functions: ['解表散寒', '温中止呕', '化痰止咳'], contraindications: '阴虚内热者忌服' },
  { name: '大枣', pinyin: 'dà zǎo', nature: '温', flavor: '甘', meridian: '脾、胃经', functions: ['补中益气', '养血安神'], contraindications: '湿盛脘腹胀满、食积、虫积者忌服' },
  { name: '山楂', pinyin: 'shān zhā', nature: '微温', flavor: '酸、甘', meridian: '脾、胃、肝经', functions: ['消食化积', '行气散瘀'], contraindications: '脾胃虚弱无积滞者慎用' },
  { name: '薏苡仁', pinyin: 'yì yǐ rén', nature: '凉', flavor: '甘、淡', meridian: '脾、胃、肺经', functions: ['利水渗湿', '健脾止泻', '清热排脓'], contraindications: '孕妇慎用' },
  { name: '薄荷', pinyin: 'bò he', nature: '凉', flavor: '辛', meridian: '肺、肝经', functions: ['疏散风热', '清利头目', '利咽透疹', '疏肝行气'], contraindications: '体虚多汗者不宜用' },
  { name: '艾叶', pinyin: 'ài yè', nature: '温', flavor: '辛、苦', meridian: '肝、脾、肾经', functions: ['温经止血', '散寒止痛', '祛湿止痒'], contraindications: '阴虚血热者慎用' },
  { name: '桂枝', pinyin: 'guì zhī', nature: '温', flavor: '辛、甘', meridian: '心、肺、膀胱经', functions: ['发汗解肌', '温通经脉', '助阳化气'], contraindications: '温热病及阴虚火旺者忌用' },
  { name: '柴胡', pinyin: 'chái hú', nature: '微寒', flavor: '苦、辛', meridian: '肝、胆、肺经', functions: ['和解表里', '疏肝升阳'], contraindications: '肝阳上亢、肝风内动者忌用' },
  { name: '白芍', pinyin: 'bái sháo', nature: '微寒', flavor: '苦、酸', meridian: '肝、脾经', functions: ['养血调经', '敛阴止汗', '柔肝止痛', '平抑肝阳'], contraindications: '虚寒腹泻者慎用' },
  { name: '熟地黄', pinyin: 'shú dì huáng', nature: '微温', flavor: '甘', meridian: '肝、肾经', functions: ['补血滋阴', '益精填髓'], contraindications: '脾胃虚弱、气滞痰多者慎用' },
  { name: '麦冬', pinyin: 'mài dōng', nature: '微寒', flavor: '甘、微苦', meridian: '心、肺、胃经', functions: ['养阴生津', '润肺清心'], contraindications: '脾胃虚寒泄泻者忌服' },
  { name: '五味子', pinyin: 'wǔ wèi zǐ', nature: '温', flavor: '酸、甘', meridian: '肺、心、肾经', functions: ['收敛固涩', '益气生津', '补肾宁心'], contraindications: '表邪未解、内有实热者忌用' },
  { name: '杜仲', pinyin: 'dù zhòng', nature: '温', flavor: '甘', meridian: '肝、肾经', functions: ['补肝肾', '强筋骨', '安胎'], contraindications: '阴虚火旺者慎用' },
  { name: '何首乌', pinyin: 'hé shǒu wū', nature: '微温', flavor: '苦、甘、涩', meridian: '肝、肾经', functions: ['补肝肾', '益精血', '乌须发', '强筋骨'], contraindications: '大便溏泄及有痰湿者忌用' },
  { name: '灵芝', pinyin: 'líng zhī', nature: '平', flavor: '甘', meridian: '心、肺、肝、肾经', functions: ['补气安神', '止咳平喘'], contraindications: '实证慎用' }
];

const natureFilters = ['全部', '寒', '凉', '平', '温', '热'];
const functionFilters = ['全部', '补气', '补血', '清热', '活血', '祛湿', '安神', '理气', '化痰'];

let favorites = JSON.parse(localStorage.getItem('herb-favorites') || '[]');
let selectedNature = '全部';
let selectedFunction = '全部';
let currentHerbIndex = null;

function saveFavorites() { localStorage.setItem('herb-favorites', JSON.stringify(favorites)); }

function renderFilters() {
  document.getElementById('nature-filter').innerHTML = natureFilters.map(f => `
    <div class="filter-chip ${f === selectedNature ? 'active' : ''}" onclick="filterByNature('${f}')">${f === '全部' ? '全部性味' : f}</div>
  `).join('');
  document.getElementById('function-filter').innerHTML = functionFilters.map(f => `
    <div class="filter-chip ${f === selectedFunction ? 'active' : ''}" onclick="filterByFunction('${f}')">${f === '全部' ? '全部功效' : f}</div>
  `).join('');
}

function filterByNature(nature) {
  selectedNature = nature;
  renderFilters();
  renderHerbList();
}

function filterByFunction(func) {
  selectedFunction = func;
  renderFilters();
  renderHerbList();
}

function renderHerbList() {
  let filtered = herbs;
  if (selectedNature !== '全部') {
    filtered = filtered.filter(h => h.nature === selectedNature);
  }
  if (selectedFunction !== '全部') {
    filtered = filtered.filter(h => h.functions.includes(selectedFunction));
  }
  const container = document.getElementById('herb-list');
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty">未找到匹配的药材</div>';
    return;
  }
  container.innerHTML = filtered.map((h, i) => `
    <div class="herb-card" onclick="showHerbDetail(${herbs.indexOf(h)})">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3>${h.name}</h3>
        <button onclick="event.stopPropagation();toggleFavorite(${herbs.indexOf(h)})" style="padding:4px 8px;font-size:.8rem">${favorites.includes(herbs.indexOf(h)) ? '❤️' : '🤍'}</button>
      </div>
      <div class="pinyin">${h.pinyin}</div>
      <div>
        <span class="tag ${h.nature === '寒' || h.nature === '凉' ? 's' : h.nature === '温' || h.nature === '热' ? 'w' : ''}">${h.nature}</span>
        <span class="tag" style="margin-left:4px">${h.flavor}</span>
      </div>
    </div>
  `).join('');
}

function showHerbDetail(index) {
  currentHerbIndex = index;
  const h = herbs[index];
  const container = document.getElementById('herb-list');
  container.innerHTML = `
    <div class="herb-card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3 style="font-size:1.3rem">${h.name}</h3>
        <button onclick="toggleFavorite(${index})" style="padding:4px 8px;font-size:.8rem">${favorites.includes(index) ? '❤️ 已收藏' : '🤍 收藏'}</button>
      </div>
      <div class="pinyin" style="font-size:1rem">${h.pinyin}</div>
      <div style="margin:12px 0">
        <span class="tag ${h.nature === '寒' || h.nature === '凉' ? 's' : h.nature === '温' || h.nature === '热' ? 'w' : ''}">${h.nature}</span>
        <span class="tag" style="margin-left:4px">${h.flavor}</span>
      </div>
      <div class="herb-detail">
        <div class="herb-row"><span class="herb-label">归经</span><span>${h.meridian}</span></div>
        <div class="herb-row"><span class="herb-label">性味</span><span>${h.flavor}</span></div>
        <div class="herb-row"><span class="herb-label">性</span><span>${h.nature}</span></div>
      </div>
      <div style="margin-top:12px">
        <strong>功效：</strong>
        <div style="margin-top:4px">${h.functions.map(f => `<span class="tag s" style="margin:2px">${f}</span>`).join('')}</div>
      </div>
      <div style="margin-top:12px">
        <strong>禁忌：</strong>
        <p style="color:var(--text2);font-size:.9rem;margin-top:4px">${h.contraindications}</p>
      </div>
      <button class="sec" onclick="renderHerbList()" style="margin-top:12px">返回列表</button>
    </div>
  `;
}

function toggleFavorite(index) {
  if (favorites.includes(index)) {
    favorites = favorites.filter(i => i !== index);
  } else {
    favorites.push(index);
  }
  saveFavorites();
  if (currentHerbIndex !== null) {
    showHerbDetail(currentHerbIndex);
  } else {
    renderHerbList();
  }
  renderFavorites();
}

function renderFavorites() {
  const container = document.getElementById('favorites-list');
  if (favorites.length === 0) {
    container.innerHTML = '<div class="empty">暂无收藏的药材</div>';
    return;
  }
  container.innerHTML = favorites.map(i => {
    const h = herbs[i];
    return `
      <div class="herb-card" onclick="showHerbDetail(${i})">
        <h3>${h.name}</h3>
        <div class="pinyin">${h.pinyin}</div>
        <div>${h.functions.slice(0, 3).map(f => `<span class="tag s" style="margin:2px">${f}</span>`).join('')}</div>
      </div>
    `;
  }).join('');
}

function searchHerbs() {
  const query = document.getElementById('search-input').value.toLowerCase();
  const container = document.getElementById('search-results');
  if (!query) {
    container.innerHTML = '';
    return;
  }
  const results = herbs.filter(h => 
    h.name.includes(query) || 
    h.pinyin.toLowerCase().includes(query) ||
    h.functions.some(f => f.includes(query))
  );
  if (results.length === 0) {
    container.innerHTML = '<div class="empty">未找到匹配的药材</div>';
    return;
  }
  container.innerHTML = results.map((h, i) => `
    <div class="herb-card" onclick="showHerbDetail(${herbs.indexOf(h)})">
      <h3>${h.name}</h3>
      <div class="pinyin">${h.pinyin}</div>
      <div>${h.functions.slice(0, 3).map(f => `<span class="tag s" style="margin:2px">${f}</span>`).join('')}</div>
    </div>
  `).join('');
}

function renderDailyRecommendation() {
  const today = new Date().toISOString().split('T')[0];
  const seed = today.split('-').join('');
  const index = parseInt(seed) % herbs.length;
  const h = herbs[index];
  
  document.getElementById('daily-recommendation').innerHTML = `
    <div class="daily-herb">
      <div style="font-size:3rem;margin-bottom:8px">🌿</div>
      <h3>${h.name}</h3>
      <p>${h.pinyin}</p>
      <p style="margin-top:8px;font-size:.85rem">${h.functions.slice(0, 3).join(' · ')}</p>
    </div>
  `;
  
  document.getElementById('daily-detail').innerHTML = `
    <div class="herb-row"><span class="herb-label">性味</span><span>${h.flavor}</span></div>
    <div class="herb-row"><span class="herb-label">性</span><span>${h.nature}</span></div>
    <div class="herb-row"><span class="herb-label">归经</span><span>${h.meridian}</span></div>
    <div style="margin-top:12px">
      <strong>功效：</strong>
      <div style="margin-top:4px">${h.functions.map(f => `<span class="tag s" style="margin:2px">${f}</span>`).join('')}</div>
    </div>
    <div style="margin-top:12px">
      <strong>禁忌：</strong>
      <p style="color:var(--text2);font-size:.9rem;margin-top:4px">${h.contraindications}</p>
    </div>
  `;
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.detail').forEach(d => d.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'favorites') renderFavorites();
    if (tab.dataset.tab === 'daily') renderDailyRecommendation();
  });
});

renderFilters();
renderHerbList();
</script>
</body>
</html>
