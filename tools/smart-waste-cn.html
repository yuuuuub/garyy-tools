<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♻️ 智能垃圾分类</title>
<meta name="description" content="智能垃圾分类系统，分类查询、投放指引、积分兑换、环保统计">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:1100px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}
.stat-card .icon{font-size:1.8rem;margin-bottom:4px}
.stat-card .val{font-size:1.3rem;font-weight:700;color:var(--accent)}
.stat-card .label{font-size:.8rem;color:var(--text2)}
.bins{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.bin{padding:20px;border-radius:12px;text-align:center;cursor:pointer;transition:all .2s;border:3px solid transparent}
.bin:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.bin.selected{border-color:#fff;transform:translateY(-3px)}
.bin .emoji{font-size:3rem;margin-bottom:8px}
.bin .name{font-weight:700;font-size:1rem}
.bin .desc{font-size:.8rem;margin-top:4px;opacity:.8}
.bin-wet{background:rgba(34,197,94,.15);color:var(--success)}
.bin-dry{background:rgba(59,130,246,.15);color:var(--accent)}
.bin-hazard{background:rgba(239,68,68,.15);color:var(--danger)}
.bin-recycle{background:rgba(245,158,11,.15);color:var(--warn)}
.search-box{display:flex;gap:8px;margin-bottom:12px}
.search-box input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem}
.btn{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-size:.85rem}
.btn:hover{background:var(--accent2)}
.result-box{padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-top:12px;display:none}
.result-box.show{display:block}
.result-box .item{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:.9rem}
.result-box .item:last-child{border-bottom:none}
.result-box .badge{padding:3px 10px;border-radius:10px;font-size:.8rem;font-weight:600;margin-right:10px}
.badge-wet{background:rgba(34,197,94,.2);color:var(--success)}
.badge-dry{background:rgba(59,130,246,.2);color:var(--accent)}
.badge-hazard{background:rgba(239,68,68,.2);color:var(--danger)}
.badge-recycle{background:rgba(245,158,11,.2);color:var(--warn)}
.history-list{max-height:200px;overflow-y:auto}
.points-bar{display:flex;align-items:center;gap:16px;padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:8px}
.points-val{font-size:2rem;font-weight:700;color:var(--warn)}
.rewards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px}
.reward{padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;text-align:center;cursor:pointer;transition:all .2s}
.reward:hover{border-color:var(--accent)}
.reward .r-icon{font-size:2rem;margin-bottom:4px}
.reward .r-name{font-size:.9rem;font-weight:600}
.reward .r-cost{font-size:.8rem;color:var(--warn);margin-top:4px}
.tips-list{font-size:.85rem}
.tips-list .tip{padding:8px 0;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:8px}
.tips-list .tip:last-child{border-bottom:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♻️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="♻️ 智能垃圾分类">
<meta property="og:description" content="智能垃圾分类系统，分类查询、投放指引、积分兑换、环保统计">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>♻️ 智能垃圾分类</h1><p>分类查询、投放指引、积分兑换、环保统计</p></div>

<div class="cd">
<h2>🗑️ 垃圾分类</h2>
<div class="bins" id="bins"></div>
</div>

<div class="cd">
<h2>🔍 垃圾分类查询</h2>
<div class="search-box"><input type="text" id="searchInput" placeholder="输入垃圾名称，如：苹果核、电池、纸箱..."><button class="btn" onclick="searchWaste()">查询</button></div>
<div class="result-box" id="resultBox"></div>
</div>

<div class="cd">
<h2>📊 投放数据统计</h2>
<div class="grid" id="stats"></div>
</div>

<div class="cd">
<h2>🏆 积分兑换</h2>
<div class="points-bar"><div><div style="font-size:.85rem;color:var(--text2)">我的积分</div><div class="points-val" id="points">1,280</div></div><button class="btn" onclick="earnPoints()" style="margin-left:auto">打卡领积分</button></div>
<div class="rewards-grid" id="rewards"></div>
</div>

<div class="cd">
<h2>💡 环保小贴士</h2>
<div class="tips-list" id="tips"></div>
</div>

<div class="cd">
<h2>📋 投放记录</h2>
<div class="history-list" id="history"></div>
</div>
</div>

<script src="i18n.js" defer></script>
<script>
(function(){
var categories=[
  {name:'厨余垃圾',emoji:'🍎',class:'bin-wet',desc:'剩菜剩饭、果皮、菜叶等',color:'#22c55e'},
  {name:'可回收物',emoji:'📦',class:'bin-recycle',desc:'纸张、塑料、金属、玻璃等',color:'#f59e0b'},
  {name:'有害垃圾',emoji:'🔋',class:'bin-hazard',desc:'电池、灯管、药品、油漆等',color:'#ef4444'},
  {name:'其他垃圾',emoji:'🚮',class:'bin-dry',desc:'卫生纸、烟蒂、陶瓷等',color:'#3b82f6'}
];
var wasteDB=[
  {name:'苹果核',cat:'厨余垃圾',tip:'可堆肥处理'},
  {name:'剩菜',cat:'厨余垃圾',tip:'沥干水分后投放'},
  {name:'茶叶渣',cat:'厨余垃圾',tip:'可堆肥处理'},
  {name:'鱼骨头',cat:'厨余垃圾',tip:'沥干水分后投放'},
  {name:'废纸箱',cat:'可回收物',tip:'压扁后投放'},
  {name:'塑料瓶',cat:'可回收物',tip:'倒空内容物，压扁'},
  {name:'易拉罐',cat:'可回收物',tip:'压扁后投放'},
  {name:'玻璃瓶',cat:'可回收物',tip:'小心投放，避免破碎'},
  {name:'旧衣服',cat:'可回收物',tip:'清洗后投放'},
  {name:'废电池',cat:'有害垃圾',tip:'单独投放，避免混入'},
  {name:'过期药品',cat:'有害垃圾',tip:'连带包装一起投放'},
  {name:'废灯管',cat:'有害垃圾',tip:'轻放，避免破碎'},
  {name:'废油漆',cat:'有害垃圾',tip:'密封后投放'},
  {name:'卫生纸',cat:'其他垃圾',tip:'直接投放'},
  {name:'烟蒂',cat:'其他垃圾',tip:'完全熄灭后投放'},
  {name:'陶瓷碎片',cat:'其他垃圾',tip:'包裹后投放'},
  {name:'一次性餐具',cat:'其他垃圾',tip:'清洗后投放'},
  {name:'瓜子壳',cat:'厨余垃圾',tip:'沥干水分后投放'},
  {name:'鸡蛋壳',cat:'厨余垃圾',tip:'可堆肥处理'},
  {name:'快递袋',cat:'可回收物',tip:'清洗后投放'},
  {name:'塑料袋',cat:'其他垃圾',tip:'不属于可回收物'},
  {name:'大骨头',cat:'其他垃圾',tip:'难以降解，归为其他'},
  {name:'贝壳',cat:'其他垃圾',tip:'难以降解，归为其他'},
  {name:'猫砂',cat:'其他垃圾',tip:'密封后投放'}
];
var rewards=[
  {icon:'🧴',name:'洗洁精',cost:200},
  {icon:'🧻',name:'卫生纸',cost:150},
  {icon:'🧼',name:'肥皂',cost:100},
  {icon:'🌱',name:'绿植',cost:500},
  {icon:'🎫',name:'电影票',cost:800},
  {icon:'🛍️',name:'购物袋',cost:50}
];
var tips=[
  {icon:'💧',text:'厨余垃圾沥干水分再投放，可以减少渗滤液产生'},
  {icon:'📦',text:'可回收物请保持清洁干燥，污染严重的回收物将被归为其他垃圾'},
  {icon:'🔋',text:'一节废电池可以污染60万升水，请务必单独投放有害垃圾'},
  {icon:'🍜',text:'外卖餐盒属于其他垃圾，请将剩余食物倒入厨余垃圾桶'},
  {icon:'👕',text:'旧衣物可以通过捐赠箱回收，让资源得到更好的利用'},
  {icon:'📋',text:'减少一次性用品的使用，从源头减量是最好的垃圾分类'}
];
var historyData=[];
var points=1280;

function renderBins(){
  var h='';
  categories.forEach(function(c,i){
    h+='<div class="bin '+c.class+'" onclick="selectBin('+i+')"><div class="emoji">'+c.emoji+'</div><div class="name">'+c.name+'</div><div class="desc">'+c.desc+'</div></div>';
  });
  document.getElementById('bins').innerHTML=h;
}

window.selectBin=function(idx){
  var c=categories[idx];
  document.querySelectorAll('.bin').forEach(function(b){b.classList.remove('selected')});
  document.querySelectorAll('.bin')[idx].classList.add('selected');
  var filtered=wasteDB.filter(function(w){return w.cat===c.name});
  var h='<div class="result-box show"><div style="font-weight:600;margin-bottom:8px">'+c.emoji+' '+c.name+' 包含：</div>';
  filtered.forEach(function(w){h+='<div class="item"><span class="badge badge-'+(w.cat==='厨余垃圾'?'wet':w.cat==='可回收物'?'recycle':w.cat==='有害垃圾'?'hazard':'dry')+'">'+w.cat.charAt(0)+'</span><span>'+w.name+'</span><span style="margin-left:auto;color:var(--text2);font-size:.8rem">'+w.tip+'</span></div>'});
  h+='</div>';
  document.getElementById('resultBox').outerHTML=h;
};

function searchWaste(){
  var q=document.getElementById('searchInput').value.trim();
  if(!q) return;
  var results=wasteDB.filter(function(w){return w.name.indexOf(q)!==-1});
  var h='<div class="result-box show">';
  if(results.length===0){
    h+='<div style="text-align:center;color:var(--text2)">未找到"'+q+'"的分类信息，请尝试其他关键词</div>';
  }else{
    results.forEach(function(w){
      h+='<div class="item"><span class="badge badge-'+(w.cat==='厨余垃圾'?'wet':w.cat==='可回收物'?'recycle':w.cat==='有害垃圾'?'hazard':'dry')+'">'+w.cat.charAt(0)+'</span><span style="flex:1"><strong>'+w.name+'</strong> → '+w.cat+'</span><span style="color:var(--text2);font-size:.8rem">'+w.tip+'</span></div>';
    });
  }
  h+='</div>';
  document.getElementById('resultBox').outerHTML=h;
}

function renderStats(){
  var data=[
    {icon:'📊',val:Math.round(85+Math.random()*10)+'%',label:'分类准确率'},
    {icon:'🗑️',val:Math.round(200+Math.random()*100)+'吨',label:'今日处理量'},
    {icon:'♻️',val:Math.round(40+Math.random()*20)+'%',label:'回收利用率'},
    {icon:'🌱',val:Math.round(50+Math.random()*30)+'吨',label:'减少碳排放'},
    {icon:'👥',val:Math.round(5000+Math.random()*2000),label:'今日参与人数'},
    {icon:'💰',val:'¥'+Math.round(10000+Math.random()*5000),label:'今日积分发放'}
  ];
  var h='';
  data.forEach(function(d){h+='<div class="stat-card"><div class="icon">'+d.icon+'</div><div class="val">'+d.val+'</div><div class="label">'+d.label+'</div></div>'});
  document.getElementById('stats').innerHTML=h;
}

function renderRewards(){
  var h='';
  rewards.forEach(function(r){
    h+='<div class="reward" onclick="exchangeReward(\''+r.name+'\',\''+r.cost+'\')"><div class="r-icon">'+r.icon+'</div><div class="r-name">'+r.name+'</div><div class="r-cost">'+r.cost+' 积分</div></div>';
  });
  document.getElementById('rewards').innerHTML=h;
}

window.exchangeReward=function(name,cost){
  cost=parseInt(cost);
  if(points>=cost){points-=cost;document.getElementById('points').textContent=points.toLocaleString();garyyToast('兑换成功：'+name,'success')}
  else{garyyToast('积分不足，还需'+(cost-points)+'积分','error')}
};

window.earnPoints=function(){
  var earn=10+Math.round(Math.random()*20);
  points+=earn;
  document.getElementById('points').textContent=points.toLocaleString();
  garyyToast('+'+earn+' 积分已到账','success');
};

function renderTips(){
  var h='';
  tips.forEach(function(t){h+='<div class="tip"><span>'+t.icon+'</span><span>'+t.text+'</span></div>'});
  document.getElementById('tips').innerHTML=h;
}

function renderHistory(){
  var actions=['投放厨余垃圾','投放可回收物','投放有害垃圾','投放其他垃圾','兑换积分','打卡领积分'];
  var h='';
  for(var i=0;i<6;i++){
    h+='<div style="display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:.85rem"><span style="margin-right:8px">♻️</span><span style="flex:1">'+Random.pick(actions)+'</span><span style="color:var(--text2);font-size:.8rem">'+Random.time(24)+':'+Random.int(0,59).toString().padStart(2,'0')+'</span></div>';
  }
  document.getElementById('history').innerHTML=h;
}

renderBins();renderStats();renderRewards();renderTips();renderHistory();
setInterval(renderStats,10000);
})();
</script>
</body>
</html>
