<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图标集工具 - SVG图标库管理</title>
<meta name="description" content="图标集工具，浏览、搜索、编辑SVG图标，支持批量导出和自定义图标集">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>">
<script src="i18n.js" defer></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--text2:#94a3b8;--accent:#f59e0b;--accent2:#fbbf24;--green:#22c55e;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f8fafc;--card:#ffffff;--border:#e2e8f0;--text:#1e293b;--text2:#64748b;--accent:#d97706;--accent2:#f59e0b;--green:#16a34a;--red:#dc2626}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);margin:0;padding:20px}
.container{max-width:1200px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.topbar h1{margin:0;font-size:1.2rem}
.topbar .spacer{flex:1}
.topbar button{background:var(--bg);color:var(--text);border:1px solid var(--border);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit}
.topbar button:hover{border-color:var(--accent)}
.topbar button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.search-bar{display:flex;gap:8px;margin-bottom:16px}
.search-bar input{flex:1;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px}
.search-bar input:focus{outline:none;border-color:var(--accent)}
.search-bar select{padding:10px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.filter-btn{padding:5px 12px;border:1px solid var(--border);border-radius:20px;background:var(--card);cursor:pointer;font-size:12px;transition:all .2s}
.filter-btn:hover{border-color:var(--accent)}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px}
.icon-cell{display:flex;flex-direction:column;align-items:center;padding:12px 8px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s;position:relative}
.icon-cell:hover{border-color:var(--accent);background:rgba(245,158,11,.05)}
.icon-cell.selected{border-color:var(--accent);background:rgba(245,158,11,.1)}
.icon-cell svg{width:28px;height:28px;margin-bottom:6px}
.icon-cell .name{font-size:10px;color:var(--text2);text-align:center;word-break:break-all}
.icon-cell .check{position:absolute;top:4px;right:4px;width:16px;height:16px;background:var(--accent);color:#fff;border-radius:50%;font-size:10px;display:none;align-items:center;justify-content:center}
.icon-cell.selected .check{display:flex}
.detail-panel{position:fixed;bottom:0;left:0;right:0;height:0;background:var(--card);border-top:1px solid var(--border);transition:height .3s;overflow:hidden;z-index:100}
.detail-panel.open{height:180px}
.detail-content{padding:16px 24px;display:flex;gap:24px;align-items:flex-start}
.detail-preview{width:120px;height:120px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:12px;background:var(--bg);flex-shrink:0}
.detail-preview svg{width:64px;height:64px}
.detail-info{flex:1}
.detail-info h3{margin:0 0 8px}
.detail-info .meta{font-size:13px;color:var(--text2);margin-bottom:8px}
.detail-info .codes{display:flex;gap:8px;flex-wrap:wrap}
.detail-info .code-tag{padding:4px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;font-size:12px;cursor:pointer}
.detail-info .code-tag:hover{border-color:var(--accent)}
.size-options{display:flex;gap:6px;margin-top:8px}
.size-opt{padding:3px 8px;border:1px solid var(--border);border-radius:4px;font-size:11px;cursor:pointer}
.size-opt.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.batch-bar{position:fixed;bottom:0;left:0;right:0;height:48px;background:var(--accent);display:none;align-items:center;justify-content:center;gap:12px;z-index:200;color:#fff}
.batch-bar.show{display:flex}
.batch-bar button{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.container{animation:fadeIn .3s ease-out}
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h1>⭐ 图标集工具</h1>
    <div class="spacer"></div>
    <span id="iconCount" style="font-size:13px;color:var(--text2)"></span>
    <button onclick="selectAll()">全选</button>
    <button onclick="deselectAll()">取消全选</button>
    <button onclick="addCustomIcon()">+ 自定义</button>
    <button onclick="toggleTheme()">🌙</button>
  </div>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="搜索图标名称或标签..." oninput="filterIcons()">
    <select id="sizeSelect" onchange="updateSize()"><option value="20">20px</option><option value="24" selected>24px</option><option value="32">32px</option><option value="48">48px</option></select>
  </div>
  <div class="filters" id="filters"></div>
  <div class="icon-grid" id="iconGrid"></div>
</div>
<div class="detail-panel" id="detailPanel"><div class="detail-content" id="detailContent"></div></div>
<div class="batch-bar" id="batchBar"><span id="batchCount"></span><button onclick="exportSVG()">导出 SVG</button><button onclick="exportPNG()">导出 PNG</button><button onclick="exportJSON()">导出 JSON</button></div>
<script>
const iconCategories={常用:['home','search','user','settings','heart','star','mail','phone','bell','calendar','camera','chat','cloud','download','eye','file','globe','lock','map','music','play','share','trash','upload','wifi'],界面:['menu','close','check','arrow-left','arrow-right','arrow-up','arrow-down','plus','minus','refresh','filter','sort','grid','list','search','edit','copy','paste','bookmark','flag','tag','folder','link','image','video'],社交:['facebook','twitter','instagram','linkedin','youtube','github','tiktok','wechat','qq','weibo','reddit','pinterest','snapchat','discord','slack'],工具:['clock','database','code','terminal','server','shield','key','wifi','bluetooth','battery','cpu','monitor','printer','scanner','cloud']};
const svgIcons={
home:'<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>',
search:'<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>',
user:'<path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>',
settings:'<circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>',
heart:'<path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>',
star:'<polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>',
mail:'<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>',
phone:'<path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>',
bell:'<path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/>',
calendar:'<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
camera:'<path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/>',
chat:'<path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>',
cloud:'<path d="M18 10h-1.26A8 8 0 109 20h9a5 5 0 000-10z"/>',
download:'<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
file:'<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>',
globe:'<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/>',
lock:'<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>',
map:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>',
menu:'<line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>',
close:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
check:'<polyline points="20 6 9 17 4 12"/>',
'arrow-left':'<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
'arrow-right':'<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>',
plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
minus:'<line x1="5" y1="12" x2="19" y2="12"/>',
refresh:'<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>',
edit:'<path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>',
trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>',
share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>',
upload:'<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
code:'<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
filter:'<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',
clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
folder:'<path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>',
link:'<path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>',
};

let icons=[],selectedIcons=new Set(),currentSize=24,currentCategory='全部',detailIcon=null;
function initIcons(){
  icons=[];
  Object.entries(iconCategories).forEach(([cat,names])=>{names.forEach(n=>{icons.push({name:n,category:cat,svg:svgIcons[n]||svgIcons.check})})});
}
function filterIcons(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const filtered=icons.filter(i=>(currentCategory==='全部'||i.category===currentCategory)&&(i.name.includes(q)||i.category.includes(q)));
  renderGrid(filtered);
}
function renderFilters(){
  const cats=['全部',...Object.keys(iconCategories)];
  document.getElementById('filters').innerHTML=cats.map(c=>`<div class="filter-btn ${c===currentCategory?'active':''}" onclick="setCategory('${c}')">${c}</div>`).join('');
}
function setCategory(c){currentCategory=c;renderFilters();filterIcons()}
function renderGrid(list){
  document.getElementById('iconGrid').innerHTML=list.map(i=>`<div class="icon-cell ${selectedIcons.has(i.name)?'selected':''}" onclick="toggleSelect('${i.name}')" ondblclick="showDetail('${i.name}')"><span class="check">✓</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${i.svg}</svg><span class="name">${i.name}</span></div>`).join('');
  document.getElementById('iconCount').textContent=`${list.length} 个图标`;
  document.getElementById('batchBar').classList.toggle('show',selectedIcons.size>0);
  document.getElementById('batchCount').textContent=`已选择 ${selectedIcons.size} 个图标`;
}
function toggleSelect(name){selectedIcons.has(name)?selectedIcons.delete(name):selectedIcons.add(name);filterIcons()}
function selectAll(){icons.forEach(i=>selectedIcons.add(i.name));filterIcons()}
function deselectAll(){selectedIcons.clear();filterIcons()}
function updateSize(){currentSize=+document.getElementById('sizeSelect').value}
function showDetail(name){
  const icon=icons.find(i=>i.name===name);if(!icon)return;detailIcon=icon;
  document.getElementById('detailPanel').classList.add('open');
  document.getElementById('detailContent').innerHTML=`<div class="detail-preview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="${currentSize*2}" height="${currentSize*2}">${icon.svg}</svg></div><div class="detail-info"><h3>${icon.name}</h3><div class="meta">分类: ${icon.category}</div><div class="codes"><span class="code-tag" onclick="copyCode('svg')">SVG</span><span class="code-tag" onclick="copyCode('jsx')">JSX</span><span class="code-tag" onclick="copyCode('datauri')">Data URI</span></div><div class="size-options">${[16,20,24,32,48].map(s=>`<span class="size-opt ${s===currentSize?'active':''}" onclick="currentSize=${s};showDetail('${name}')">${s}px</span>`).join('')}</div></div>`;
}
function copyCode(type){
  if(!detailIcon)return;
  let code='';
  if(type==='svg')code=`<svg viewBox="0 0 24 24" width="${currentSize}" height="${currentSize}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${detailIcon.svg}</svg>`;
  else if(type==='jsx')code=`<Icon name="${detailIcon.name}" size={${currentSize}} />`;
  else code=`data:image/svg+xml,${encodeURIComponent(`<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">${detailIcon.svg}</svg>`)}`;
  navigator.clipboard.writeText(code);alert('已复制');
}
function addCustomIcon(){const svg=prompt('粘贴 SVG path 数据:');if(svg){const name=prompt('图标名称:');if(name){icons.push({name,category:'自定义',svg});selectedIcons.add(name);filterIcons()}}}
function exportSVG(){if(!selectedIcons.size)return alert('请先选择图标');const iconsToExport=icons.filter(i=>selectedIcons.has(i.name));const svg=iconsToExport.map(i=>`<!-- ${i.name} -->\n<svg viewBox="0 0 24 24" width="${currentSize}" height="${currentSize}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${i.svg}</svg>`).join('\n\n');const blob=new Blob([svg],{type:'image/svg+xml'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='icons.svg';a.click()}
function exportPNG(){alert('PNG导出功能：请在浏览器中右键保存SVG图标')}
function exportJSON(){const iconsToExport=icons.filter(i=>selectedIcons.has(i.name));const blob=new Blob([JSON.stringify(iconsToExport.map(i=>({name:i.name,category:i.category,svg:i.svg})),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='icons.json';a.click()}
function toggleTheme(){const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t}
initIcons();renderFilters();filterIcons();
</script>
</body>
</html>
