<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍽️ 饮食计划</title>
<meta name="description" content="每日饮食计划管理，合理安排三餐营养">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:20pxpadding:16px;}
.ctn{max-width:600px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.meal-section{margin-bottom:16px}
.meal-section h3{font-size:.95rem;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.meal-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg);border-radius:8px;margin-bottom:6px}
.meal-item .food{flex:1;font-size:.9rem}
.meal-item .cals{font-size:.8rem;color:var(--text2)}
.day-nav{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:16px}
.day-nav button{padding:8px 16px;font-size:.85rem}
.day-label{font-size:1rem;font-weight:600;min-width:120px;text-align:center}
.cal-summary{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cal-summary>div{flex:1;min-width:80px;text-align:center;padding:10px;background:var(--bg);border-radius:8px}
.cal-summary .nm{font-size:1.2rem;font-weight:700}
.cal-summary .lb{font-size:.7rem;color:var(--text2)}
.empty{color:var(--text2);text-align:center;padding:20px}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🍽️ 饮食计划">
<meta property="og:description" content="每日饮食计划管理，合理安排三餐营养">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🍽️ 饮食计划</h1><p>合理安排三餐，健康饮食</p></div>

<div class="day-nav">
  <button class="sec" onclick="changeDay(-1)">◀</button>
  <span class="day-label" id="dayLabel"></span>
  <button class="sec" onclick="changeDay(1)">▶</button>
  <button class="sec" onclick="goToday()">今天</button>
</div>

<div class="cd">
<div class="cal-summary" id="calSummary"></div>
<label>餐次</label><select id="mMeal"><option value="breakfast">早餐 🌅</option><option value="lunch">午餐 ☀️</option><option value="dinner">晚餐 🌙</option><option value="snack">加餐 🍪</option></select>
<label>食物名称</label><input type="text" id="mFood" placeholder="如：米饭、蔬菜沙拉">
<label>热量 (千卡)</label><input type="number" id="mCal" value="0" min="0">
<div class="bg"><button onclick="addMeal()">添加食物</button></div></div>

<div class="cd" id="mealDisplay"></div>
</div>

<script>
const $ = id => document.getElementById(id);
let mealPlans = JSON.parse(localStorage.getItem('mp_plans') || '{}');
let currentDate = new Date();
const mealEmoji = { breakfast: '🌅 早餐', lunch: '☀️ 午餐', dinner: '🌙 晚餐', snack: '🍪 加餐' };
const mealColors = { breakfast: '#f59e0b', lunch: '#22c55e', dinner: '#3b82f6', snack: '#8b5cf6' };

function key() { return currentDate.toISOString().slice(0, 10); }
function save() { mealPlans[key()] = getMeals(); localStorage.setItem('mp_plans', JSON.stringify(mealPlans)); }
function getMeals() { return mealPlans[key()] || { breakfast: [], lunch: [], dinner: [], snack: [] }; }

function changeDay(offset) { currentDate.setDate(currentDate.getDate() + offset); render(); }
function goToday() { currentDate = new Date(); render(); }

function addMeal() {
  const food = $('mFood').value.trim();
  if (!food) { alert('请输入食物名称'); return; }
  const meals = getMeals();
  const meal = $('mMeal').value;
  meals[meal].push({ id: Date.now(), food, calories: parseInt($('mCal').value) || 0 });
  mealPlans[key()] = meals; save(); render(); $('mFood').value = '';
}

function removeMeal(mealType, id) {
  const meals = getMeals();
  meals[mealType] = meals[mealType].filter(x => x.id !== id);
  mealPlans[key()] = meals; save(); render();
}

function render() {
  const d = currentDate;
  const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
  $('dayLabel').textContent = `${d.getMonth() + 1}月${d.getDate()}日 周${weekdays[d.getDay()]}`;

  const meals = getMeals();
  const totalCal = Object.values(meals).flat().reduce((s, m) => s + m.calories, 0);
  const mealCals = Object.entries(meals).map(([k, v]) => ({ type: k, cal: v.reduce((s, m) => s + m.calories, 0) }));

  $('calSummary').innerHTML = `<div><div class="nm" style="color:var(--accent)">${totalCal}</div><div class="lb">总热量(千卡)</div></div>` +
    mealCals.map(m => `<div><div class="nm" style="color:${mealColors[m.type]}">${m.cal}</div><div class="lb">${mealEmoji[m.type].slice(2)}</div></div>`).join('');

  const html = Object.entries(meals).map(([type, items]) =>
    `<div class="meal-section"><h3>${mealEmoji[type]} <span style="font-size:.8rem;color:var(--text2)">(${items.reduce((s, i) => s + i.calories, 0)} 千卡)</span></h3>` +
    (items.length ? items.map(i =>
      `<div class="meal-item"><span class="food">${i.food}</span><span class="cals">${i.calories} 千卡</span><button class="dng" style="padding:2px 8px;font-size:.75rem" onclick="removeMeal('${type}',${i.id})">✕</button></div>`
    ).join('') : '<div style="font-size:.85rem;color:var(--text2);padding:8px">暂无记录</div>') +
    '</div>'
  ).join('');
  $('mealDisplay').innerHTML = '<h2>今日饮食</h2>' + html;
}

render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
