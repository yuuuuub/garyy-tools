<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国茶道文化 - Chinese Tea Ceremony Culture</title>
<meta name="description" content="中国茶道文化百科，茶道精神、功夫茶流程、茶室布置、茶具鉴赏、禅茶一味">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国茶道文化 - Chinese Tea Ceremony Culture">
<meta property="og:description" content="中国茶道文化百科，茶道精神、功夫茶流程、茶室布置、茶具鉴赏、禅茶一味">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-tea-ceremony-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🫖</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#7a9e6a;--accent2:#5a8a4a}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#238636;--accent2:#1a7f37}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#0a1510 0%,#142818 50%,#1a3a20 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #2a5a30;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#7a9e6a,#5a8a4a,#4a7a3a,#3a6a2a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.tea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.tea-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.tea-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.tea-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.tea-card .t-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.tea-card .t-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(122,158,106,0.15);color:var(--accent)}
.tea-card .t-name{font-size:1.3em;font-weight:bold}
.tea-card .t-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.tea-card .t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tea-card .t-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.tea-card .t-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.tea-card .t-detail strong{color:var(--text)}
.tea-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.tea-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🫖 中国茶道文化</h1>
<p>Chinese Tea Ceremony Culture — 茶禅一味，以茶悟道</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索茶道、茶礼、禅修...（如"功夫茶""盖碗""茶室"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="茶道精神">🧘 茶道精神</button>
<button class="filter-btn" data-filter="冲泡技艺">🫖 冲泡技艺</button>
<button class="filter-btn" data-filter="茶室布置">🏠 茶室布置</button>
<button class="filter-btn" data-filter="茶礼规范">🎎 茶礼规范</button>
<button class="filter-btn" data-filter="禅茶一味">☯️ 禅茶一味</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="tea-grid" id="teaGrid"></div>
<footer><p>🫖 中国茶道文化 — 茶禅一味，静心养性</p></footer>
</div>
<script>
const TEA_DATA=[
  {id:1,name:"和敬清寂",en:"Harmony, Respect, Purity, Tranquility",category:"茶道精神",icon:"🧘",summary:"茶道四谛",detail:"茶道的核心精神。'和'指和谐平和，'敬'指互相尊敬，'清'指清静清洁，'寂'指宁静安详。这是茶道修行的最高境界。",origin:"源自唐代茶圣陆羽《茶经》",usage:"贯穿整个茶道过程的基本准则"},
  {id:2,name:"禅茶一味",en:"Zen and Tea Share One Flavor",category:"禅茶一味",icon:"☯️",summary:"禅与茶的融合",detail:"禅宗与茶道的结合，强调在品茶中参禅悟道。茶能助禅定，禅能悟茶味。宋代圆悟克勤禅师手书'禅茶一味'四字，成为茶禅关系的经典表达。",origin:"宋代禅宗",usage:"寺院茶礼与文人茶会的核心理念"},
  {id:3,name:"功夫茶道",en:"Gongfu Tea Ceremony",category:"冲泡技艺",icon:"🫖",summary:"闽粤功夫茶艺",detail:"功夫茶以潮汕和闽南地区最为正宗。器具讲究（盖碗、公道杯、品茗杯），程序严谨（温壶、投茶、洗茶、泡茶、分茶、品茶），讲究水温、时间、手法的精准控制。",origin:"广东潮汕、福建闽南",usage:"日常品茶与待客的最高礼遇"},
  {id:4,name:"盖碗冲泡法",en:"Gaiwan Brewing Method",category:"冲泡技艺",icon:"🍵",summary:"三才碗的妙用",detail:"盖碗又称'三才碗'，盖为天、碗为人、托为地，寓意天地人和。适用于所有茶类，是最灵活的冲泡方式。水温、投茶量、浸泡时间均可自由调控。",origin:"清代康熙年间",usage:"品鉴各类茶叶的标准冲泡器具"},
  {id:5,name:"温壶温杯",en:"Warming the Teaware",category:"冲泡技艺",icon:"🔥",summary:"泡茶前的准备",detail:"正式泡茶前需用热水温润茶具，使器具达到适宜温度。温壶可提升茶香释放，温杯可避免茶汤遇冷失温。这是茶道中不可或缺的准备工作。",origin:"唐代煮茶传统",usage:"所有正式茶会的首要步骤"},
  {id:6,name:"关公巡城",en:"Guan Gong Patrolling the City",category:"冲泡技艺",icon:"⚔️",summary:"均匀分茶法",detail:"分茶时手持公道杯来回往各品茗杯中注茶，如同关羽巡城，确保每杯茶汤浓度均匀。这是功夫茶分茶的基本手法，体现了公平与尊重。",origin:"潮汕功夫茶传统",usage:"分茶环节的标准操作手法"},
  {id:7,name:"韩信点兵",en:"Han Xin Mustered the Troops",category:"冲泡技艺",icon:"🪖",summary:"点斟收尾",detail:"分茶到最后几滴时，用公道杯在每个杯子上轻轻点斟几滴，如同韩信点兵。目的是确保每杯茶汤量相等，最后几滴往往是最精华的部分。",origin:"潮汕功夫茶传统",usage:"分茶收尾的精细操作"},
  {id:8,name:"茶室四规",en:"Four Rules of Tea Room",category:"茶室布置",icon:"🏠",summary:"茶室精神准则",detail:"日本茶道提出茶室四规：和（和谐）、敬（尊敬）、清（清洁）、寂（寂静）。中国茶室同样讲究这些原则，追求简素自然、宁静致远的空间氛围。",origin:"千利休茶道思想",usage:"茶室设计与布置的指导原则"},
  {id:9,name:"茶席设计",en:"Tea Mat Design",category:"茶室布置",icon:"🎋",summary:"茶席的美学",detail:"茶席是以茶盘为中心，搭配插花、香炉、茶宠等元素的整体布置。讲究色彩协调、高低错落、疏密有致。季节不同，茶席主题也随之变化。",origin:"宋代文人茶会",usage:"正式茶会与茶艺表演的场景布置"},
  {id:10,name:"茶室插花",en:"Tea Room Flower Arrangement",category:"茶室布置",icon:"🌸",summary:"以花衬茶",detail:"茶室插花不同于普通插花，讲究简约素雅，通常只用一两枝花材。花材以当季植物为主，姿态自然，不加矫饰。目的是营造清雅氛围，与茶道精神相呼应。",origin:"宋代茶会传统",usage:"茶席点缀与季节感的营造"},
  {id:11,name:"主客之礼",en:"Host and Guest Etiquette",category:"茶礼规范",icon:"🤝",summary:"茶会中的礼节",detail:"主人应提前准备好茶具和茶叶，客人入座后先奉上第一道茶。主人泡茶时客人应静心观赏，品茶时先闻香再品味。主人续茶时客人轻叩桌面致谢。",origin:"中国传统礼仪",usage:"日常品茶与正式茶会的礼节规范"},
  {id:12,name:"叩手礼",en:"Finger Tap Gesture",category:"茶礼规范",icon:"🫶",summary:"以手代口的感谢",detail:"当主人为你斟茶时，用食指和中指并拢轻轻叩击桌面两三下，表示感谢。这个礼仪源于乾隆皇帝微服私访的传说，是茶桌上最常用的礼节。",origin:"清代民间传说",usage:"接受斟茶时的感谢礼仪"},
  {id:13,name:"伸掌礼",en:"Open Palm Gesture",category:"茶礼规范",icon:"✋",summary:"请茶的礼仪",detail:"主人请客人品茶时，右手伸掌，掌心朝上，指尖朝向客人，微微欠身。表示'请'的敬意。接受茶杯时同样以伸掌礼回应，体现互相尊重。",origin:"中国茶礼传统",usage:"请茶、接茶、递物时的通用礼仪"},
  {id:14,name:"凤凰三点头",en:"Phoenix Nods Three Times",category:"冲泡技艺",icon:"🐦",summary:"敬茶注水礼",detail:"注水时提壶三起三落，如同凤凰点头，向客人表示敬意。第一点头表示欢迎，第二点头表示请品茶，第三点头表示祝福。这是茶艺表演中的经典手法。",origin:"茶艺表演传统",usage:"茶艺表演与正式茶会的注水礼仪"},
  {id:15,name:"品茶三口",en:"Three Sips of Tasting",category:"茶礼规范",icon:"🍵",summary:"品茶的正确方式",detail:"品茶讲究三口为品：第一口小啜，感受茶汤的温度和香气；第二口中啜，品味茶汤的滋味和层次；第三口细品，体会回甘和喉韵。切忌牛饮，要细细品味。",origin:"文人品茶传统",usage:"品鉴茶叶品质的标准品饮方式"},
  {id:16,name:"洗茶润茶",en:"Rinsing the Tea",category:"冲泡技艺",icon:"💧",summary:"唤醒茶叶",detail:"正式泡茶前先用热水快速冲洗茶叶一遍，称为洗茶或润茶。目的是去除茶叶表面的灰尘，同时唤醒沉睡的茶叶，使其更好地释放茶香。洗茶水通常不饮用。",origin:"明代泡茶法",usage:"冲泡乌龙茶、普洱茶等紧压茶的必要步骤"},
  {id:17,name:"茶宠供养",en:"Tea Pet Nurturing",category:"茶室布置",icon:"🐉",summary:"茶桌上的灵物",detail:"茶宠是放置在茶盘上的小陶偶，常用紫砂或陶土制作。每次泡茶时用茶汤浇淋，日久天长茶宠会养出温润的光泽。常见茶宠有貔貅、金蟾、弥勒等。",origin:"清代紫砂工艺",usage:"茶桌装饰与养壶文化的延伸"},
  {id:18,name:"焚香伴茶",en:"Incense with Tea",category:"茶室布置",icon:"🌿",summary:"香茶合韵",detail:"焚香品茶是古代文人的雅事。茶室中焚一炉清香，与茶香交织，营造空灵幽远的氛围。香材宜选淡雅类，如沉香、檀香，不可过于浓烈喧宾夺主。",origin:"宋代文人茶会",usage:"茶会氛围营造与精神修养"},
  {id:19,name:"听琴品茗",en:"Listening to Guqin while Sipping Tea",category:"禅茶一味",icon:"🎵",summary:"琴茶合道",detail:"古琴与茶道是中国传统文化的两大雅事。弹琴时焚香品茶，琴声悠远如茶香袅袅。'琴茶一家'的理念体现了中国文人追求的精神境界：清、雅、淡、远。",origin:"魏晋文人传统",usage:"高层次茶会的雅集活动"},
  {id:20,name:"无我茶会",en:"No-Self Tea Gathering",category:"禅茶一味",icon:"🙏",summary:"平等的茶聚",detail:"无我茶会是一种现代茶会形式，人人自带茶具和茶叶，围坐一圈，泡好后依次奉给左边的人。没有主客之分，没有尊卑之别，体现了茶道中的平等与分享精神。",origin:"当代茶道创新",usage:"现代茶文化交流与分享活动"},
  {id:21,name:"茶道插花四季",en:"Seasonal Tea Flower Art",category:"茶室布置",icon:"🍂",summary:"应季之美",detail:"春用樱花桃花，夏用莲荷栀子，秋用菊花红叶，冬用梅花山茶。茶道插花讲究顺应自然，每个季节选用当令花材，体现天人合一的哲学思想。",origin:"四季茶会传统",usage:"季节性茶会的主题营造"}
];
function renderCards(data){
  document.getElementById('teaGrid').innerHTML=data.map(t=>`
    <div class="tea-card" data-category="${t.category}">
      <div class="t-header"><div class="t-icon">${t.icon}</div><div><div class="t-name">${t.name}</div><div class="t-sub">${t.en}</div></div></div>
      <div class="t-meta"><span>${t.summary}</span><span>${t.category}</span></div>
      <div class="t-detail">${t.detail}</div>
      <div class="t-detail"><strong>起源：</strong>${t.origin}</div>
      <div class="t-detail"><strong>应用：</strong>${t.usage}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(t=>{cats[t.category]=(cats[t.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">茶道文化</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.tea-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.tea-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(TEA_DATA);renderStats(TEA_DATA);
</script>
</body>
</html>
