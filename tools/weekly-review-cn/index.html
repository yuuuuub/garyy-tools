<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📝 周回顾</title>
<meta property="og:title" content="📝 周回顾">
<meta property="og:description" content="📝 周回顾 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="每周回顾工具，总结本周成果、反思不足、规划下周目标">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px}
.ctn{max-width:700px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.li{padding:14px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:var(--text)}.tag.s{background:var(--success)}.tag.w{background:var(--warn)}
.empty{text-align:center;padding:40px;color:var(--text2)}
.rating{display:flex;gap:8px;margin-top:8px}.rating span{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.85rem;transition:all .2s}.rating span.active{background:var(--accent);border-color:var(--accent);color:var(--text)}
.section-label{font-size:.9rem;font-weight:600;margin-bottom:8px;margin-top:16px;color:var(--text)}
.history-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;cursor:pointer;transition:all .2s}.history-card:hover{border-color:var(--accent)}
.history-card .date{font-size:.8rem;color:var(--text2)}.history-card .title{font-weight:600;margin-top:4px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📝 周回顾</h1><p>每周复盘，持续进步</p></div>

<div class="cd"><h2>📅 选择周</h2>
<div style="display:flex;gap:8px;align-items:center">
  <button onclick="prevWeek()" style="padding:8px 12px">◀</button>
  <div id="weekLabel" style="flex:1;text-align:center;font-weight:600"></div>
  <button onclick="nextWeek()" style="padding:8px 12px">▶</button>
</div></div>

<div class="cd"><h2>🏆 本周亮点</h2>
<label>本周最值得骄傲的3件事</label><textarea id="highlights" rows="3" placeholder="1. &#10;2. &#10;3."></textarea></div>

<div class="cd"><h2>💪 完成情况</h2>
<label>列出本周完成的重要事项</label><textarea id="completed" rows="3" placeholder="每行一项"></textarea>
<label>完成率评分</label>
<div class="rating" id="compRating"></div></div>

<div class="cd"><h2>🤔 反思与不足</h2>
<label>本周做得不好的地方</label><textarea id="improve" rows="3" placeholder="反思可以做得更好的方面"></textarea>
<label>遇到了哪些困难？</label><textarea id="challenges" rows="2" placeholder="描述遇到的挑战"></textarea>
<label>下次如何改进？</label><textarea id="lessons" rows="2" placeholder="学到的经验教训"></textarea></div>

<div class="cd"><h2>😊 情绪与状态</h2>
<label>整体情绪状态</label><div class="rating" id="moodRating"></div>
<label>能量水平</label><div class="rating" id="energyRating"></div>
<label>压力水平</label><div class="rating" id="stressRating"></div></div>

<div class="cd"><h2>🎯 下周计划</h2>
<label>下周最重要的3个目标</label><textarea id="nextGoals" rows="3" placeholder="1. &#10;2. &#10;3."></textarea>
<label>需要的资源/支持</label><textarea id="resources" rows="2" placeholder="需要什么帮助？"></textarea></div>

<div class="cd"><h2>💭 感恩与收获</h2>
<label>本周感恩的事</label><textarea id="grateful" rows="2" placeholder="感恩的人、事、物"></textarea>
<label>学到了什么新知识？</label><textarea id="learned" rows="2" placeholder="新技能、新认知"></textarea></div>

<div class="bg" style="justify-content:center">
<button onclick="saveReview()" style="padding:12px 32px">💾 保存回顾</button>
<button class="sec" onclick="exportReview()">📄 导出</button>
</div>

<div class="cd" style="margin-top:24px"><h2>📋 历史回顾</h2><div id="historyList" class="empty">暂无历史记录</div></div>
</div>

<div style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;justify-content:center;align-items:center" id="viewModal">
<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:90%;max-width:600px;max-height:80vh;overflow-y:auto" id="viewContent"></div>
</div>

<script>
const $=id=>document.getElementById(id);
let reviews=JSON.parse(localStorage.getItem('wr_reviews')||'[]');
let currentWeekStart=getWeekStart(new Date());
let ratings={comp:0,mood:0,energy:0,stress:0};

function getWeekStart(d){const dt=new Date(d);const day=dt.getDay();dt.setDate(dt.getDate()-day);dt.setHours(0,0,0,0);return dt}
function getWeekEnd(d){const dt=new Date(d);dt.setDate(dt.getDate()+6);return dt}
function fmtDate(d){return d.toISOString().slice(0,10)}
function weekKey(){return fmtDate(currentWeekStart)}

function prevWeek(){currentWeekStart.setDate(currentWeekStart.getDate()-7);updateWeekLabel();loadReview()}
function nextWeek(){currentWeekStart.setDate(currentWeekStart.getDate()+7);updateWeekLabel();loadReview()}
function updateWeekLabel(){$('weekLabel').textContent=`${fmtDate(currentWeekStart)} ~ ${fmtDate(getWeekEnd(currentWeekStart))}`}

function createRating(containerId, max, selected){
  const c=$(containerId);c.innerHTML='';
  for(let i=1;i<=max;i++){
    const s=document.createElement('span');s.textContent=i;
    s.className=i<=selected?'active':'';
    s.onclick=()=>{ratings[containerId.replace('Rating','')]=i;createRating(containerId,max,i)};
    c.appendChild(s);
  }
}

function loadReview(){
  const r=reviews.find(r=>r.week===weekKey());
  if(r){
    $('highlights').value=r.highlights||'';$('completed').value=r.completed||'';
    $('improve').value=r.improve||'';$('challenges').value=r.challenges||'';
    $('lessons').value=r.lessons||'';$('nextGoals').value=r.nextGoals||'';
    $('resources').value=r.resources||'';$('grateful').value=r.grateful||'';
    $('learned').value=r.learned||'';
    ratings={comp:r.comp||0,mood:r.mood||0,energy:r.energy||0,stress:r.stress||0};
  }else{
    $('highlights').value='';$('completed').value='';$('improve').value='';$('challenges').value='';
    $('lessons').value='';$('nextGoals').value='';$('resources').value='';$('grateful').value='';$('learned').value='';
    ratings={comp:0,mood:0,energy:0,stress:0};
  }
  createRating('compRating',5,ratings.comp);createRating('moodRating',5,ratings.mood);
  createRating('energyRating',5,ratings.energy);createRating('stressRating',5,ratings.stress);
}

function saveReview(){
  const data={week:weekKey(),highlights:$('highlights').value,completed:$('completed').value,
    improve:$('improve').value,challenges:$('challenges').value,lessons:$('lessons').value,
    nextGoals:$('nextGoals').value,resources:$('resources').value,grateful:$('grateful').value,
    learned:$('learned').value,...ratings,savedAt:new Date().toISOString()};
  const idx=reviews.findIndex(r=>r.week===weekKey());
  if(idx>=0)reviews[idx]=data;else reviews.push(data);
  localStorage.setItem('wr_reviews',JSON.stringify(reviews));renderHistory();
  alert('保存成功！');
}

function exportReview(){
  const r=reviews.find(r=>r.week===weekKey());if(!r){alert('请先保存回顾');return}
  let text=`周回顾 ${r.week}\n${'='.repeat(30)}\n\n`;
  text+=`🏆 本周亮点\n${r.highlights||'未填写'}\n\n`;
  text+=`💪 完成情况\n${r.completed||'未填写'}\n完成率: ${r.comp||0}/5\n\n`;
  text+=`🤔 反思\n${r.improve||'未填写'}\n\n挑战: ${r.challenges||'未填写'}\n改进: ${r.lessons||'未填写'}\n\n`;
  text+=`😊 状态\n情绪: ${r.mood||0}/5 能量: ${r.energy||0}/5 压力: ${r.stress||0}/5\n\n`;
  text+=`🎯 下周计划\n${r.nextGoals||'未填写'}\n\n`;
  text+=`💭 感恩\n${r.grateful||'未填写'}\n\n学习: ${r.learned||'未填写'}`;
  const blob=new Blob([text],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`周回顾_${r.week}.txt`;a.click();
}

function renderHistory(){
  const sorted=[...reviews].sort((a,b)=>b.week.localeCompare(a.week));
  let html='';sorted.forEach(r=>{
    html+=`<div class="history-card" onclick="viewReview('${r.week}')">
      <div class="date">${r.week}</div>
      <div class="title">情绪 ${r.mood||0}/5 · 能量 ${r.energy||0}/5</div></div>`;
  });$('historyList').innerHTML=html||'<div class="empty">暂无历史记录</div>';
}

function viewReview(week){
  const r=reviews.find(r=>r.week===week);if(!r)return;
  $('viewContent').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center"><h3>周回顾 ${r.week}</h3>
    <button class="sec" onclick="$('viewModal').style.display='none'" style="padding:4px 8px;font-size:.8rem">✕</button></div>
    <div style="margin-top:16px;font-size:.9rem;line-height:1.8">
    <strong>🏆 亮点</strong><br>${(r.highlights||'').replace(/\n/g,'<br>')}<br><br>
    <strong>💪 完成</strong><br>${(r.completed||'').replace(/\n/g,'<br>')} · 评分 ${r.comp||0}/5<br><br>
    <strong>🤔 反思</strong><br>${(r.improve||'').replace(/\n/g,'<br>')}<br><br>
    <strong>😊 状态</strong><br>情绪 ${r.mood||0}/5 · 能量 ${r.energy||0}/5 · 压力 ${r.stress||0}/5<br><br>
    <strong>🎯 下周</strong><br>${(r.nextGoals||'').replace(/\n/g,'<br>')}
    </div>`;
  $('viewModal').style.display='flex';
}

updateWeekLabel();loadReview();renderHistory();
</script>
</body>
</html>
