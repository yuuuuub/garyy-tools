<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64 图片转换器 | Base64 Image</title>
<meta property="og:title" content="Base64 图片转换器 | Base64 Image">
<meta property="og:description" content="Base64 图片转换器 | Base64 Image - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="Base64图片编码解码工具，支持图片转Base64、Base64转图片、拖拽上传">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖼️</text></svg>">
<script src="../i18n.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--border:#30363d;--text:#c9d1d9;--text-secondary:#8b949e;--accent:#58a6ff;--accent-hover:#79c0ff;--green:#3fb950;--green-bg:rgba(63,185,80,.15);--red:#f85149;--red-bg:rgba(248,81,73,.15);--cyan:#39d2c0;--radius:8px;--radius-sm:6px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--bg-secondary:#fff;--bg-tertiary:#f0f2f5;--border:#d0d7de;--text:#1f2328;--text-secondary:#656d76;--accent:#0969da;--accent-hover:#0550ae;--green:#1a7f37;--green-bg:rgba(26,127,55,.1);--red:#cf222e;--red-bg:rgba(207,34,46,.1);--cyan:#0598bc}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;padding:16px}
.container{max-width:900px;margin:0 auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{text-align:center;color:var(--text-secondary);font-size:.85rem;margin-bottom:20px}
.tabs{display:flex;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:4px;margin-bottom:20px;gap:4px}
.tab-btn{flex:1;padding:10px 16px;border:none;border-radius:var(--radius-sm);background:transparent;color:var(--text-secondary);font-size:.9rem;cursor:pointer;transition:all var(--transition);font-weight:500}
.tab-btn.active{background:var(--bg-tertiary);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tab-btn:hover:not(.active){color:var(--text)}
.tab-content{display:none}
.tab-content.active{display:block}
.card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h3{font-size:.9rem;color:var(--text-secondary);margin-bottom:12px}
.drop-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:40px 20px;text-align:center;cursor:pointer;transition:.2s;margin-bottom:16px}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--accent);background:rgba(88,166,255,.05)}
.drop-zone p{color:var(--text-secondary);margin-top:8px;font-size:.9rem}
.drop-zone .icon{font-size:48px;margin-bottom:8px}
.preview{max-width:100%;border-radius:var(--radius-sm);margin-top:12px;display:none}
textarea{width:100%;min-height:120px;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-family:monospace;font-size:.82rem;resize:vertical;outline:none;line-height:1.6}
textarea:focus{border-color:var(--accent)}
.info-row{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:.8rem;color:var(--text-secondary)}
.btn{padding:8px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);cursor:pointer;font-size:.82rem;transition:var(--transition)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:8px 20px;border-radius:var(--radius);font-size:.85rem;opacity:0;transition:.3s;z-index:100}
.toast.show{opacity:1}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--bg-secondary);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>🖼️ Base64 图片转换器</h1>
<p class="sub">图片与Base64互相转换，支持拖拽上传</p>

<div class="tabs">
<button class="tab-btn active" onclick="switchMode('encode')">图片 → Base64</button>
<button class="tab-btn" onclick="switchMode('decode')">Base64 → 图片</button>
</div>

<div id="encodeMode" class="tab-content active">
<div class="card">
<h3>选择或拖拽图片</h3>
<div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
<div class="icon">📁</div>
<p>点击选择图片或拖拽到此处</p>
<p style="font-size:.75rem;margin-top:4px">支持 JPG / PNG / GIF / WebP</p>
</div>
<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this.files[0])">
<img class="preview" id="previewImg">
<div class="info-row" id="fileInfo" style="display:none"></div>
</div>
<div class="card">
<h3>Base64 输出</h3>
<textarea id="base64Output" readonly placeholder="Base64编码将在此显示..."></textarea>
<div class="btn-row">
<button class="btn btn-primary" onclick="copyBase64()">📋 复制</button>
<button class="btn btn-green" onclick="downloadBase64()">📥 下载TXT</button>
<button class="btn" onclick="copyDataURI()">📋 复制Data URI</button>
</div>
</div>
</div>

<div id="decodeMode" class="tab-content">
<div class="card">
<h3>粘贴 Base64 数据</h3>
<textarea id="base64Input" placeholder='粘贴Base64数据，例如：
data:image/png;base64,iVBORw0KGgo...
或直接粘贴纯Base64字符串'></textarea>
<div class="btn-row">
<button class="btn btn-primary" onclick="decodeBase64()">🔄 解码</button>
<button class="btn" onclick="clearDecode()">🗑️ 清空</button>
</div>
</div>
<div class="card" id="decodeResult" style="display:none">
<h3>解码结果</h3>
<img class="preview" id="decodedImg" style="display:block">
<div class="info-row" id="decodeInfo"></div>
<div class="btn-row">
<button class="btn btn-green" onclick="downloadDecoded()">📥 下载图片</button>
<button class="btn" onclick="copyDecodeBase64()">📋 复制Base64</button>
</div>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
var currentFile=null,currentBase64='';
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
function switchMode(mode){
document.querySelectorAll('.tab-btn').forEach(function(b,i){b.classList.toggle('active',i===(mode==='encode'?0:1))});
document.getElementById('encodeMode').classList.toggle('active',mode==='encode');
document.getElementById('decodeMode').classList.toggle('active',mode==='decode');
}
var dropZone=document.getElementById('dropZone');
dropZone.addEventListener('dragover',function(e){e.preventDefault();dropZone.classList.add('dragover')});
dropZone.addEventListener('dragleave',function(){dropZone.classList.remove('dragover')});
dropZone.addEventListener('drop',function(e){e.preventDefault();dropZone.classList.remove('dragover');if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0])});
function handleFile(file){
if(!file||!file.type.startsWith('image/')){toast('请选择图片文件');return;}
currentFile=file;
var reader=new FileReader();
reader.onload=function(e){
currentBase64=e.target.result;
document.getElementById('base64Output').value=currentBase64;
document.getElementById('previewImg').src=currentBase64;
document.getElementById('previewImg').style.display='block';
var size=(file.size/1024).toFixed(1);
document.getElementById('fileInfo').style.display='flex';
document.getElementById('fileInfo').textContent=file.name+' | '+file.type+' | '+size+'KB';
};
reader.readAsDataURL(file);
}
function copyBase64(){navigator.clipboard.writeText(document.getElementById('base64Output').value).then(function(){toast('Base64已复制')})}
function copyDataURI(){navigator.clipboard.writeText(currentBase64).then(function(){toast('Data URI已复制')})}
function downloadBase64(){
var blob=new Blob([document.getElementById('base64Output').value],{type:'text/plain'});
var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='image-base64.txt';a.click();
}
function decodeBase64(){
var input=document.getElementById('base64Input').value.trim();
if(!input){toast('请输入Base64数据');return;}
var b64=input;
if(input.indexOf('data:image')===0){
var match=input.match(/^data:image\/(\w+);base64,(.+)$/);
if(match)b64=match[2];
}
try{
var img=new Image();
img.onload=function(){
document.getElementById('decodedImg').src='data:image/png;base64,'+b64;
document.getElementById('decodeResult').style.display='block';
var bytes=atob(b64).length;
document.getElementById('decodeInfo').textContent='尺寸: '+img.width+'×'+img.height+' | 大小: '+(bytes/1024).toFixed(1)+'KB';
};
img.onerror=function(){toast('Base64解码失败，请检查数据格式')};
img.src='data:image/png;base64,'+b64;
}catch(e){toast('解码错误: '+e.message)}
}
function clearDecode(){document.getElementById('base64Input').value='';document.getElementById('decodeResult').style.display='none'}
function downloadDecoded(){
var a=document.createElement('a');a.href=document.getElementById('decodedImg').src;a.download='decoded-image.png';a.click();
}
function copyDecodeBase64(){navigator.clipboard.writeText(document.getElementById('base64Input').value.trim()).then(function(){toast('Base64已复制')})}
</script>
</body>
</html>
