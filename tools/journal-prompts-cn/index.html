<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📝 日记提示</title>
<meta name="description" content="日记提示工具，提供每日写作灵感，帮助养成写日记的习惯">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:100px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.es{text-align:center;padding:40px;color:var(--text2)}
.prompt-card{text-align:center;padding:24px;background:var(--bg);border-radius:var(--radius);margin-bottom:16px;cursor:pointer;transition:all .3s;border:2px solid transparent}
.prompt-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.prompt-card .emoji{font-size:2.5rem;margin-bottom:8px}
.prompt-card .text{font-size:1.1rem;font-weight:600;line-height:1.5}
.prompt-card .hint{font-size:.8rem;color:var(--text2);margin-top:8px}
.journal-entry{padding:16px;border-bottom:1px solid var(--border)}.journal-entry:last-child{border-bottom:none}
.journal-entry .date{font-size:.8rem;color:var(--accent);font-weight:600}
.journal-entry .prompt-used{font-size:.8rem;color:var(--text2);margin-top:4px}
.journal-entry .content{margin-top:8px;font-size:.9rem;white-space:pre-wrap}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.7rem;margin-right:4px}
.tag.gratitude{background:rgba(34,197,94,.15);color:var(--success)}
.tag.reflect{background:rgba(59,130,246,.15);color:var(--accent)}
.tag.growth{background:rgba(139,92,246,.15);color:#8b5cf6}
.tag.creative{background:rgba(245,158,11,.15);color:var(--warn)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📝 日记提示">
<meta property="og:description" content="日记提示工具，提供每日写作灵感">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📝 日记提示</h1><p>每日写作灵感，养成写日记习惯</p></div>

<div class="cd"><h2>今日提示</h2>
<div id="todayPrompt" class="prompt-card" onclick="shufflePrompt()"></div>
<div class="bg"><button onclick="shufflePrompt()">🔄 换一个提示</button>
<select id="catFilter" onchange="filterPrompts()" style="max-width:150px">
<option value="all">全部类别</option><option value="gratitude">感恩</option><option value="reflect">反思</option><option value="growth">成长</option><option value="creative">创意</option>
</select></div></div>

<div class="cd"><h2>写日记</h2>
<textarea id="journalContent" placeholder="在这里写下你的想法..."></textarea>
<div class="bg"><button onclick="saveJournal()">保存日记</button></div></div>

<div class="cd"><h2>历史日记</h2><div id="journalList"></div>
<div class="bg"><button class="sec" onclick="clearJournals()">清空日记</button></div></div>

<div class="cd"><h2>统计</h2><div class="gr" id="stats"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
let journals=JSON.parse(localStorage.getItem('jp_journals')||'[]');

const prompts=[
  {emoji:'🌅',text:'今天最让你感恩的三件事是什么？',cat:'gratitude',hint:'想想那些微小但温暖的瞬间'},
  {emoji:'💪',text:'今天你克服了什么困难？学到了什么？',cat:'growth',hint:'每个挑战都是成长的机会'},
  {emoji:'🤔',text:'如果今天可以重来，你会做出什么不同的选择？',cat:'reflect',hint:'反思帮助我们做得更好'},
  {emoji:'🎨',text:'描述一个让你感到快乐的场景或时刻',cat:'creative',hint:'用文字描绘那幅画面'},
  {emoji:'🌟',text:'今天你为自己或他人做了什么好事？',cat:'gratitude',hint:'善行让世界更美好'},
  {emoji:'📚',text:'今天你学到了什么新知识或新技能？',cat:'growth',hint:'知识是最好的投资'},
  {emoji:'💬',text:'今天和谁进行了有意义的对话？说了什么？',cat:'reflect',hint:'人与人的连接很重要'},
  {emoji:'🎯',text:'离你的目标又近了一步吗？今天做了什么？',cat:'growth',hint:'每天进步一点点'},
  {emoji:'🎵',text:'今天什么音乐/声音最让你感动？',cat:'creative',hint:'音乐是心灵的语言'},
  {emoji:'🌈',text:'描述你今天的心情，用一种颜色来代表',cat:'creative',hint:'情绪是内心的天气预报'},
  {emoji:'🤗',text:'今天谁让你感到温暖？为什么？',cat:'gratitude',hint:'珍惜身边的人'},
  {emoji:'💭',text:'如果你有一个超能力，你今天会用它做什么？',cat:'creative',hint:'放飞想象力'},
  {emoji:'🔍',text:'今天有什么事情让你重新思考了？',cat:'reflect',hint:'改变观点是勇气的表现'},
  {emoji:'🌱',text:'你在哪个方面今天变得更好了？',cat:'growth',hint:'成长是持续的过程'},
  {emoji:'☕',text:'今天最放松的时刻是什么？',cat:'gratitude',hint:'学会享受当下'},
  {emoji:'📝',text:'写下今天的一句自我鼓励的话',cat:'growth',hint:'你比自己想象的更强大'},
  {emoji:'🌍',text:'今天你关注了什么社会议题？有什么想法？',cat:'reflect',hint:'关心世界是责任也是力量'},
  {emoji:'✨',text:'今天有什么小确幸让你微笑？',cat:'gratitude',hint:'幸福往往藏在细节里'},
  {emoji:'🔮',text:'五年后的你会如何看待今天的你？',cat:'reflect',hint:'用未来视角看现在'},
  {emoji:'🎭',text:'今天你扮演了什么角色？感觉如何？',cat:'creative',hint:'生活就是一场表演'},
];

let currentPrompt=null;

function shufflePrompt(cat){
  const filter=cat||$('catFilter').value;
  const filtered=filter==='all'?prompts:prompts.filter(p=>p.cat===filter);
  currentPrompt=filtered[Math.floor(Math.random()*filtered.length)];
  renderPrompt();
}

function renderPrompt(){
  if(!currentPrompt){shufflePrompt();return;}
  $('todayPrompt').innerHTML=`<div class="emoji">${currentPrompt.emoji}</div><div class="text">${currentPrompt.text}</div><div class="hint">${currentPrompt.hint}</div>`;
}

function filterPrompts(){shufflePrompt();}

function saveJournal(){
  const content=$('journalContent').value.trim();
  if(!content){alert('请先写点内容');return;}
  journals.push({
    id:Date.now(),
    date:new Date().toLocaleDateString(),
    prompt:currentPrompt?currentPrompt.text:'',
    promptCat:currentPrompt?currentPrompt.cat:'',
    content
  });
  save();render();$('journalContent').value='';alert('日记已保存！');
}

function deleteJournal(id){journals=journals.filter(j=>j.id!==id);save();render();}
function clearJournals(){journals=[];save();render();}
function save(){localStorage.setItem('jp_journals',JSON.stringify(journals));}

function getCatClass(cat){return cat||'gratitude';}

function render(){
  $('journalList').innerHTML=journals.length?journals.map(j=>`<div class="journal-entry">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="date">📅 ${j.date}</span>
      <span class="tag ${getCatClass(j.promptCat)}">${{gratitude:'感恩',reflect:'反思',growth:'成长',creative:'创意'}[j.promptCat]||'日记'}</span>
    </div>
    <div class="prompt-used">💭 ${j.prompt}</div>
    <div class="content">${j.content}</div>
    <button class="dng" style="padding:4px 10px;font-size:.8rem;margin-top:8px" onclick="deleteJournal(${j.id})">删除</button>
  </div>`).reverse().join(''):'<div class="es">暂无日记，开始写第一篇吧！</div>';
  
  const total=journals.length;
  const cats={};journals.forEach(j=>{const c=j.promptCat||'other';cats[c]=(cats[c]||0)+1;});
  const streak=calcStreak();
  $('stats').innerHTML=`
    <div class="st"><div class="nm">${total}</div><div class="lb">总日记</div></div>
    <div class="st"><div class="nm" style="color:var(--success)">${cats.gratitude||0}</div><div class="lb">感恩</div></div>
    <div class="st"><div class="nm" style="color:var(--accent)">${cats.reflect||0}</div><div class="lb">反思</div></div>
    <div class="st"><div class="nm" style="color:var(--warn)">${streak}</div><div class="lb">连续天数</div></div>`;
}

function calcStreak(){
  if(!journals.length)return 0;
  const dates=[...new Set(journals.map(j=>j.date))].sort().reverse();
  const today=new Date().toLocaleDateString();
  let streak=0,d=new Date();
  while(true){
    const ds=d.toLocaleDateString();
    if(dates.includes(ds)){streak++;d.setDate(d.getDate()-1);}else break;
  }
  return streak;
}

shufflePrompt();render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
