<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字拼图</title><meta name="description" content="汉字拼图 - 在线玩汉字拼图游戏"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.puzzle-area{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0}.puzzle-character{font-size:6rem;font-weight:700;color:var(--blue)}.puzzle-pinyin{font-size:1.5rem;color:var(--green);margin-top:16px}.puzzle-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}.puzzle-cell{width:80px;height:80px;background:var(--card);border:2px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer;transition:all .2s;justify-self:center}.puzzle-cell:hover{border-color:var(--blue)}.puzzle-cell.selected{border-color:var(--green);background:rgba(35,134,54,.1)}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}.score-display{font-size:1.2rem;margin:16px 0}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="汉字拼图"><meta property="og:description" content="汉字拼图 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🧩 汉字拼图</h1><p class="sub">在线玩汉字拼图游戏</p>
<div class="card">
<div class="btn-group">
<button class="btn" onclick="startPuzzle()">开始游戏</button>
<button class="btn" onclick="nextPuzzle()">下一题</button>
<button class="btn" onclick="showAnswer()">查看答案</button>
</div>
<div class="score-display" id="scoreDisplay"></div>
</div>
<div id="result"></div>
<div class="card" id="historyCard" style="display:none">
<h3 style="margin-bottom:16px">游戏记录</h3>
<div id="history" style="padding:12px;background:var(--bg);border-radius:8px"></div>
</div></div>
<script src="../i18n.js" defer></script>
<script>
var characters=[
  {char:'一',pinyin:'yī',meaning:'一，第一',strokes:1,components:['一']},
  {char:'二',pinyin:'èr',meaning:'二，第二',strokes:2,components:['一','一']},
  {char:'三',pinyin:'sān',meaning:'三，第三',strokes:3,components:['一','一','一']},
  {char:'四',pinyin:'sì',meaning:'四，第四',strokes:5,components:['丨','𠃍','一','丨','一']},
  {char:'五',pinyin:'wǔ',meaning:'五，第五',strokes:4,components:['一','丨','𠃌','一']},
  {char:'六',pinyin:'liù',meaning:'六，第六',strokes:4,components:['丶','一','丿','丶']},
  {char:'七',pinyin:'qī',meaning:'七，第七',strokes:2,components:['一','丨']},
  {char:'八',pinyin:'bā',meaning:'八，第八',strokes:2,components:['丿','㇏']},
  {char:'九',pinyin:'jiǔ',meaning:'九，第九',strokes:2,components:['丿','𠃌']},
  {char:'十',pinyin:'shí',meaning:'十，第十',strokes:2,components:['一','丨']},
  {char:'大',pinyin:'dà',meaning:'大的，巨大',strokes:3,components:['一','丿','㇏']},
  {char:'小',pinyin:'xiǎo',meaning:'小的，微小',strokes:3,components:['丨','丿','丶']},
  {char:'多',pinyin:'duō',meaning:'多的，很多',strokes:6,components:['丿','𠃋','丶','丿','𠃋','丶']},
  {char:'少',pinyin:'shǎo',meaning:'少的，很少',strokes:4,components:['丨','丿','丿','丶']},
  {char:'上',pinyin:'shàng',meaning:'上面，上方',strokes:3,components:['丨','一','一']},
  {char:'下',pinyin:'xià',meaning:'下面，下方',strokes:3,components:['一','丨','丶']},
  {char:'左',pinyin:'zuǒ',meaning:'左边，左侧',strokes:5,components:['一','丿','丨','一','一']},
  {char:'右',pinyin:'yòu',meaning:'右边，右侧',strokes:5,components:['一','丿','丨','𠃍','一']},
  {char:'前',pinyin:'qián',meaning:'前面，前方',strokes:9,components:['丶','ノ','一','一','丨','丨','丨','刂','刂']},
  {char:'后',pinyin:'hòu',meaning:'后面，后方',strokes:6,components:['丿','𠃋','𠃌','丨','𠃍','一']},
  {char:'东',pinyin:'dōng',meaning:'东方，东边',strokes:5,components:['一','𠃌','丨','丿','丶']},
  {char:'西',pinyin:'xī',meaning:'西方，西边',strokes:6,components:['一','丨','𠃍','丨','丨','一']},
  {char:'南',pinyin:'nán',meaning:'南方，南边',strokes:9,components:['一','丨','𠃌','丨','丨','一','丨','丨','丨']},
  {char:'北',pinyin:'běi',meaning:'北方，北边',strokes:5,components:['丨','𠃌','一','丨','𠃌']},
  {char:'天',pinyin:'tiān',meaning:'天空，一天',strokes:4,components:['一','一','丿','㇏']},
  {char:'地',pinyin:'dì',meaning:'地面，土地',strokes:6,components:['土','也']},
  {char:'人',pinyin:'rén',meaning:'人类，人们',strokes:2,components:['丿','㇏']},
  {char:'口',pinyin:'kǒu',meaning:'嘴，口',strokes:3,components:['丨','𠃍','一']},
  {char:'日',pinyin:'rì',meaning:'太阳，日子',strokes:4,components:['丨','𠃍','一','一']},
  {char:'月',pinyin:'yuè',meaning:'月亮，月份',strokes:4,components:['丿','𠃌','一','一']},
  {char:'水',pinyin:'shuǐ',meaning:'水，液体',strokes:4,components:['丨','𠃌','丿','㇏']},
  {char:'火',pinyin:'huǒ',meaning:'火，火焰',strokes:4,components:['丶','丿','丿','㇏']},
  {char:'木',pinyin:'mù',meaning:'木头，树木',strokes:4,components:['一','丨','丿','㇏']},
  {char:'金',pinyin:'jīn',meaning:'金属，黄金',strokes:8,components:['丿','一','丨','𠃍','一','丨','丨','一']},
  {char:'土',pinyin:'tǔ',meaning:'土壤，土地',strokes:3,components:['一','丨','一']}
];
var currentPuzzle=null;
var score=0;
var total=0;
var history=[];
var selectedStrokes=[];
function startPuzzle(){
  score=0;
  total=0;
  history=[];
  nextPuzzle();
}
function nextPuzzle(){
  var randomIndex=Math.floor(Math.random()*characters.length);
  currentPuzzle=characters[randomIndex];
  selectedStrokes=[];
  var allStrokes=['一','丨','丿','㇏','𠃍','𠃌','丶','𠃋','㇇','㇆','㇈','㇉','㇊','㇋','㇌','㇍','㇎','㇏','㇐','㇑','㇒','㇓','㇔','㇕','㇖','㇗','㇘','㇙','㇚','㇛','㇜','㇝','㇞','㇟','㇠','㇡','㇢','㇣'];
  var puzzleStrokes=currentPuzzle.components.slice();
  while(puzzleStrokes.length<12){
    var randomStroke=allStrokes[Math.floor(Math.random()*allStrokes.length)];
    if(!puzzleStrokes.includes(randomStroke)){
      puzzleStrokes.push(randomStroke);
    }
  }
  puzzleStrokes=shuffleArray(puzzleStrokes);
  var html='<div class="card">';
  html+='<div class="puzzle-area">';
  html+='<div class="puzzle-character">'+currentPuzzle.char+'</div>';
  html+='<div class="puzzle-pinyin">'+currentPuzzle.pinyin+' - '+currentPuzzle.meaning+'</div>';
  html+='</div>';
  html+='<div style="text-align:center;margin:16px 0">';
  html+='<div style="font-size:1.1rem;color:var(--text2)">选择笔画组成这个字：</div>';
  html+='<div id="selectedStrokes" style="font-size:1.5rem;margin:8px 0;min-height:40px"></div>';
  html+='</div>';
  html+='<div class="puzzle-grid">';
  puzzleStrokes.forEach(function(stroke,index){
    html+='<div class="puzzle-cell" onclick="selectStroke(this,\''+stroke+'\')">'+stroke+'</div>';
  });
  html+='</div>';
  html+='<div class="btn-group" style="margin-top:20px">';
  html+='<button class="btn" onclick="checkPuzzle()">检查答案</button>';
  html+='<button class="btn" onclick="clearSelection()">清空选择</button>';
  html+='</div></div>';
  document.getElementById('result').innerHTML=html;
}
function selectStroke(element,stroke){
  if(selectedStrokes.includes(stroke)){
    selectedStrokes=selectedStrokes.filter(function(s){return s!==stroke;});
    element.classList.remove('selected');
  }else{
    selectedStrokes.push(stroke);
    element.classList.add('selected');
  }
  updateSelectedStrokes();
}
function updateSelectedStrokes(){
  document.getElementById('selectedStrokes').textContent=selectedStrokes.join('');
}
function checkPuzzle(){
  if(!currentPuzzle)return;
  total++;
  var correctStrokes=currentPuzzle.components.slice().sort().join('');
  var userStrokes=selectedStrokes.slice().sort().join('');
  if(correctStrokes===userStrokes){
    score++;
    history.push({char:currentPuzzle.char,pinyin:currentPuzzle.pinyin,correct:true});
    alert('🎉 正确！');
  }else{
    history.push({char:currentPuzzle.char,pinyin:currentPuzzle.pinyin,correct:false});
    alert('❌ 错误！正确答案：'+correctStrokes);
  }
  updateScore();
  updateHistory();
}
function clearSelection(){
  selectedStrokes=[];
  document.querySelectorAll('.puzzle-cell').forEach(function(cell){
    cell.classList.remove('selected');
  });
  updateSelectedStrokes();
}
function showAnswer(){
  if(!currentPuzzle)return;
  alert('答案：'+currentPuzzle.components.join(''));
}
function updateScore(){
  var percentage=Math.round(score/total*100);
  document.getElementById('scoreDisplay').innerHTML='得分：'+score+'/'+total+' ('+percentage+'%)';
}
function updateHistory(){
  if(history.length===0){
    document.getElementById('historyCard').style.display='none';
    return;
  }
  document.getElementById('historyCard').style.display='block';
  var html='';
  history.forEach(function(item){
    html+='<div style="padding:8px;margin-bottom:4px;background:'+(item.correct?'rgba(35,134,54,.1)':'rgba(239,68,68,.1)')+';border-radius:4px">';
    html+='<strong>'+item.char+'</strong> ('+item.pinyin+') - '+(item.correct?'正确':'错误');
    html+='</div>';
  });
  document.getElementById('history').innerHTML=html;
}
function shuffleArray(array){
  for(var i=array.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var temp=array[i];
    array[i]=array[j];
    array[j]=temp;
  }
  return array;
}
startPuzzle();
</script></body></html>
