<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喝水记录 - garyy-tools</title>
<meta name="description" content="喝水记录工具，追踪每日饮水量养成好习惯">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16pxscroll-behavior:smooth;}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem;margin-bottom:4px}
.sub{color:var(--text2);font-size:.85rem}
button{padding:9px 20px;border-radius:6px;border:none;background:var(--blue);color:var(--text);font-size:.85rem;cursor:pointer;transition:opacity .2s}
button:hover{opacity:.85}
input,textarea,select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:.9rem;width:100%;outline:none;font-family:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn-green{background:var(--green)}
.btn-gold{background:var(--gold);color:#000}
.btn-red{background:var(--red)}
.water-display{text-align:center;padding:10px 0}
.water-amount{font-size:2.5rem;font-weight:700;color:var(--blue)}
.water-target{color:var(--text2);font-size:.85rem}
.progress-wrap{height:24px;background:var(--border);border-radius:12px;overflow:hidden;margin:16px 0;position:relative}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),#60a5fa);border-radius:12px;transition:width .5s;width:0}
.progress-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:500}
.quick-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.quick-btn{width:70px;height:70px;border-radius:50%;border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:.8rem;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.quick-btn:hover{border-color:var(--blue);background:rgba(59,130,246,.1)}
.quick-btn .icon{font-size:1.5rem}
.quick-btn .ml{font-size:.7rem;color:var(--text2)}
.custom-row{display:flex;gap:10px;align-items:center;margin-top:10px}
.custom-row input{width:100px;text-align:center;flex-shrink:0}
.custom-row span{color:var(--text2);font-size:.85rem}
.custom-row button{flex-shrink:0}
.records-list{list-style:none;margin-top:12px;max-height:300px;overflow-y:auto}
.records-list li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.85rem;color:var(--text2)}
.records-list li:last-child{border-bottom:none}
.records-list .time{color:var(--text)}
.records-list .amount{color:var(--blue);font-weight:500}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="喝水记录 - garyy-tools">
  <meta property="og:description" content="喝水记录工具，追踪每日饮水量养成好习惯">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/water-tracker/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header>
<h1>💧 喝水记录</h1>
<div class="sub">每日饮水目标</div>
</header>

<div class="card">
<div class="water-display">
<div class="water-amount" id="totalDisplay">0</div>
<div class="water-target">ml / <span id="targetDisplay">2000</span> ml</div>
</div>

<div class="progress-wrap">
<div class="progress-fill" id="progressFill"></div>
<div class="progress-text" id="progressText">0%</div>
</div>

<div class="quick-btns">
<button class="quick-btn" data-ml="100"><span class="icon">🥤</span><span class="ml">100ml</span></button>
<button class="quick-btn" data-ml="200"><span class="icon">🥛</span><span class="ml">200ml</span></button>
<button class="quick-btn" data-ml="250"><span class="icon">💧</span><span class="ml">250ml</span></button>
<button class="quick-btn" data-ml="350"><span class="icon">🫗</span><span class="ml">350ml</span></button>
<button class="quick-btn" data-ml="500"><span class="icon">🍶</span><span class="ml">500ml</span></button>
</div>

<div class="custom-row">
<input type="number" id="customAmount" placeholder="自定" min="1" max="9999" value="250">
<span>ml</span>
<button class="btn-green" id="btnCustomAdd">添加</button>
<button class="btn-red" id="btnResetToday">重置今日</button>
</div>

<div style="margin-top:16px">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
<span style="font-size:.9rem;color:var(--text2)">今日饮水记录</span>
<span style="font-size:.8rem;color:var(--text2)">共 <span id="countDisplay">0</span> 杯</span>
</div>
<ul class="records-list" id="recordsList">
<li style="color:var(--text2);text-align:center;justify-content:center">暂无记录</li>
</ul>
</div>

<div style="margin-top:16px;display:flex;align-items:center;gap:10px">
<label style="color:var(--text2);font-size:.85rem;white-space:nowrap">每日目标:</label>
<input type="number" id="dailyTarget" value="2000" min="100" max="10000" style="width:100px">
<span style="color:var(--text2);font-size:.85rem">ml</span>
<button id="btnSetTarget" style="font-size:.8rem;padding:5px 12px">设置</button>
</div>
</div>
</div>

<script>
(function(){
'use strict';

const STORAGE_KEY='garyy_water';
const TARGET_KEY='garyy_water_target';
const totalDisplay=document.getElementById('totalDisplay');
const targetDisplay=document.getElementById('targetDisplay');
const progressFill=document.getElementById('progressFill');
const progressText=document.getElementById('progressText');
const recordsList=document.getElementById('recordsList');
const countDisplay=document.getElementById('countDisplay');
const customAmount=document.getElementById('customAmount');
const dailyTarget=document.getElementById('dailyTarget');

let dailyTargetVal=parseInt(localStorage.getItem(TARGET_KEY))||2000;

function todayStr(){
return new Date().toISOString().slice(0,10);
}

function getData(){
const all=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
return all[todayStr()]||{records:[],total:0};
}

function saveData(data){
const all=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
all[todayStr()]=data;
localStorage.setItem(STORAGE_KEY,JSON.stringify(all));
}

function addWater(ml){
ml=parseInt(ml)||0;
if(ml<=0)return;
const data=getData();
data.records.push({ml:ml,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});
data.total+=ml;
saveData(data);
render();
}

function resetToday(){
if(!confirm('确定重置今日饮水记录吗？'))return;
const all=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
delete all[todayStr()];
localStorage.setItem(STORAGE_KEY,JSON.stringify(all));
render();
}

function render(){
const data=getData();
totalDisplay.textContent=data.total;
targetDisplay.textContent=dailyTargetVal;
const pct=Math.min(100,Math.round((data.total/dailyTargetVal)*100));
progressFill.style.width=pct+'%';
progressText.textContent=pct+'%';
countDisplay.textContent=data.records.length;

if(data.records.length===0){
recordsList.innerHTML='<li style="color:var(--text2);text-align:center;justify-content:center">暂无记录</li>';
}else{
let html='';
const records=data.records.slice().reverse();
records.forEach(function(r){
html+='<li><span class="time">'+r.time+'</span><span class="amount">+'+r.ml+'ml</span></li>';
});
recordsList.innerHTML=html;
}

dailyTarget.value=dailyTargetVal;
}

document.querySelectorAll('.quick-btn').forEach(function(btn){
btn.addEventListener('click',function(){
addWater(parseInt(this.dataset.ml));
});
});

document.getElementById('btnCustomAdd').addEventListener('click',function(){
const ml=parseInt(customAmount.value)||0;
if(ml<=0){garyyToast('请输入有效的水量');return;}
addWater(ml);
});

document.getElementById('btnResetToday').addEventListener('click',resetToday);

document.getElementById('btnSetTarget').addEventListener('click',function(){
const val=parseInt(dailyTarget.value)||2000;
if(val<100||val>10000)return;
dailyTargetVal=val;
localStorage.setItem(TARGET_KEY,String(val));
render();
});

render();
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
