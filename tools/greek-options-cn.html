<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="期权希腊字母计算器 - 计算和可视化期权Delta、Gamma、Theta、Vega、Rho">
    <meta name="robots" content="index, follow">
    <title>期权希腊字母</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="i18n.js" defer></script>
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #8b5cf6; --secondary-color: #6b7280; --success-color: #10b981; --warning-color: #f59e0b; --danger-color: #ef4444; --border-color: #e5e7eb; --card-bg: #f9fafb; }
        [data-theme="dark"] { --bg-color: #111827; --text-color: #f9fafb; --primary-color: #a78bfa; --secondary-color: #9ca3af; --success-color: #34d399; --warning-color: #fbbf24; --danger-color: #f87171; --border-color: #374151; --card-bg: #1f2937; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background 0.3s, color 0.3s; }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; margin-top: 0; }
        .container { max-width: 1100px; margin: 0 auto; }
        .card { padding: 20px; border: 1px solid var(--border-color); border-radius: 12px; background: var(--card-bg); margin-bottom: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--card-bg); color: var(--text-color); font-size: 14px; }
        input:focus { outline: 2px solid var(--primary-color); border-color: transparent; }
        button { background: var(--primary-color); color: #fff; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; transition: opacity 0.2s; }
        button:hover { opacity: 0.85; }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 14px; background: var(--secondary-color); color: #fff; border: none; border-radius: 8px; cursor: pointer; z-index: 100; }
        .result-chart { width: 100%; height: 280px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        canvas { width: 100%; height: 100%; }
        .stat-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .stat-box { flex: 1; min-width: 120px; text-align: center; padding: 16px; background: var(--bg-color); border-radius: 8px; border: 1px solid var(--border-color); }
        .stat-box .num { font-size: 22px; font-weight: 700; }
        .stat-box .lbl { font-size: 12px; color: var(--secondary-color); margin-top: 4px; }
        .greek-card { padding: 16px; border-radius: 8px; border: 2px solid var(--border-color); text-align: center; cursor: pointer; transition: border-color 0.2s, transform 0.1s; }
        .greek-card:hover { border-color: var(--primary-color); transform: translateY(-2px); }
        .greek-card.active { border-color: var(--primary-color); background: rgba(139,92,246,0.08); }
        .greek-symbol { font-size: 36px; font-weight: 700; color: var(--primary-color); }
        .greek-name { font-size: 13px; color: var(--secondary-color); margin-top: 4px; }
        .greek-val { font-size: 20px; font-weight: 700; margin-top: 8px; }
        .tooltip { position: absolute; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; font-size: 12px; pointer-events: none; z-index: 50; display: none; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>Δ 期权希腊字母计算器</h1>
        <p style="color:var(--secondary-color)">B-S模型计算期权价格及希腊字母，可视化Greeks随标的价格变化</p>

        <div class="card">
            <h3>期权参数</h3>
            <div class="grid-3">
                <div><label>标的价格 (S)</label><input type="number" id="spot" value="100" step="0.5"></div>
                <div><label>行权价 (K)</label><input type="number" id="strike" value="100" step="0.5"></div>
                <div><label>到期时间 (天)</label><input type="number" id="daysToExp" value="60" min="1"></div>
            </div>
            <div class="grid-3" style="margin-top:12px">
                <div><label>无风险利率 (%)</label><input type="number" id="rfRate" value="3" step="0.1"></div>
                <div><label>波动率 (%)</label><input type="number" id="vol" value="25" step="0.5"></div>
                <div><label>期权类型</label>
                    <select id="optType">
                        <option value="call">看涨 (Call)</option>
                        <option value="put">看跌 (Put)</option>
                    </select>
                </div>
            </div>
            <button onclick="calculate()" style="margin-top:16px;width:100%">计算Greeks</button>
        </div>

        <div class="card">
            <h3>希腊字母总览</h3>
            <div class="stat-row" id="greekCards"></div>
        </div>

        <div class="card">
            <h3>Greeks vs 标的价格</h3>
            <div style="display:flex;gap:8px;margin-bottom:10px">
                <button class="btn-sm" onclick="drawGreeks('delta')" id="btnDelta">Delta</button>
                <button class="btn-sm" onclick="drawGreeks('gamma')" id="btnGamma" style="background:var(--success-color)">Gamma</button>
                <button class="btn-sm" onclick="drawGreeks('theta')" id="btnTheta" style="background:var(--warning-color)">Theta</button>
                <button class="btn-sm" onclick="drawGreeks('vega')" id="btnVega" style="background:var(--danger-color)">Vega</button>
                <button class="btn-sm" onclick="drawGreeks('price')" id="btnPrice" style="background:var(--secondary-color)">期权价格</button>
            </div>
            <div class="result-chart" style="position:relative">
                <canvas id="greeksCanvas"></canvas>
            </div>
        </div>

        <div class="card">
            <h3>损益图</h3>
            <div class="result-chart"><canvas id="pnlCanvas"></canvas></div>
        </div>
    </div>

    <script>
        function normalCDF(x) {
            const a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741, a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
            const sign = x >= 0 ? 1 : -1;
            x = Math.abs(x) / Math.sqrt(2);
            const t = 1 / (1 + p * x);
            const y = 1 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-x * x);
            return 0.5 * (1 + sign * y);
        }

        function normalPDF(x) {
            return Math.exp(-0.5 * x * x) / Math.sqrt(2 * Math.PI);
        }

        function bsPrice(S, K, T, r, sigma, type) {
            if (T <= 0) return type === 'call' ? Math.max(S - K, 0) : Math.max(K - S, 0);
            const d1 = (Math.log(S / K) + (r + 0.5 * sigma * sigma) * T) / (sigma * Math.sqrt(T));
            const d2 = d1 - sigma * Math.sqrt(T);
            if (type === 'call') return S * normalCDF(d1) - K * Math.exp(-r * T) * normalCDF(d2);
            return K * Math.exp(-r * T) * normalCDF(-d2) - S * normalCDF(-d1);
        }

        function calcGreeks(S, K, T, r, sigma, type) {
            if (T <= 0) return { price: type === 'call' ? Math.max(S - K, 0) : Math.max(K - S, 0), delta: 0, gamma: 0, theta: 0, vega: 0, rho: 0 };
            const sqrtT = Math.sqrt(T);
            const d1 = (Math.log(S / K) + (r + 0.5 * sigma * sigma) * T) / (sigma * sqrtT);
            const d2 = d1 - sigma * sqrtT;

            const price = bsPrice(S, K, T, r, sigma, type);
            const delta = type === 'call' ? normalCDF(d1) : normalCDF(d1) - 1;
            const gamma = normalPDF(d1) / (S * sigma * sqrtT);
            const theta = (-(S * normalPDF(d1) * sigma) / (2 * sqrtT)
                - (type === 'call' ? 1 : -1) * r * K * Math.exp(-r * T) * normalCDF((type === 'call' ? 1 : -1) * d2)) / 365;
            const vega = S * normalPDF(d1) * sqrtT / 100;
            const rho = (type === 'call' ? 1 : -1) * K * T * Math.exp(-r * T) * normalCDF((type === 'call' ? 1 : -1) * d2) / 100;

            return { price, delta, gamma, theta, vega, rho };
        }

        let currentGreek = 'delta';

        function calculate() {
            const S = +document.getElementById('spot').value;
            const K = +document.getElementById('strike').value;
            const days = +document.getElementById('daysToExp').value;
            const r = +document.getElementById('rfRate').value / 100;
            const sigma = +document.getElementById('vol').value / 100;
            const type = document.getElementById('optType').value;
            const T = days / 365;

            const g = calcGreeks(S, K, T, r, sigma, type);

            document.getElementById('greekCards').innerHTML = `
                <div class="stat-box"><div class="num" style="color:var(--primary-color)">¥${g.price.toFixed(2)}</div><div class="lbl">期权价格</div></div>
                <div class="stat-box"><div class="num" style="color:#6366f1">${g.delta.toFixed(4)}</div><div class="lbl">Delta (Δ)</div></div>
                <div class="stat-box"><div class="num" style="color:#10b981">${g.gamma.toFixed(4)}</div><div class="lbl">Gamma (Γ)</div></div>
                <div class="stat-box"><div class="num" style="color:#f59e0b">${g.theta.toFixed(4)}</div><div class="lbl">Theta (Θ) /日</div></div>
                <div class="stat-box"><div class="num" style="color:#ef4444">${g.vega.toFixed(4)}</div><div class="lbl">Vega (ν) /1%</div></div>
                <div class="stat-box"><div class="num" style="color:#06b6d4">${g.rho.toFixed(4)}</div><div class="lbl">Rho (ρ) /1%</div></div>
            `;

            drawGreeks(currentGreek);
            drawPnL(S, K, T, r, sigma, type);
        }

        function drawGreeks(greek) {
            currentGreek = greek;
            document.querySelectorAll('[id^="btn"]').forEach(b => b.classList.remove('active'));
            document.getElementById('btn' + greek.charAt(0).toUpperCase() + greek.slice(1))?.classList.add('active');

            const S0 = +document.getElementById('spot').value;
            const K = +document.getElementById('strike').value;
            const days = +document.getElementById('daysToExp').value;
            const r = +document.getElementById('rfRate').value / 100;
            const sigma = +document.getElementById('vol').value / 100;
            const type = document.getElementById('optType').value;
            const T = days / 365;

            const canvas = document.getElementById('greeksCanvas');
            const ctx = canvas.getContext('2d');
            const W = canvas.parentElement.clientWidth;
            const H = 280;
            canvas.width = W * 2; canvas.height = H * 2;
            canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
            ctx.scale(2, 2);
            ctx.clearRect(0, 0, W, H);

            const pad = { l: 60, r: 20, t: 20, b: 35 };
            const sMin = S0 * 0.6, sMax = S0 * 1.4;
            const points = [];
            for (let s = sMin; s <= sMax; s += (sMax - sMin) / 100) {
                const g = calcGreeks(s, K, T, r, sigma, type);
                points.push({ x: s, y: g[greek] });
            }

            const yMin = Math.min(...points.map(p => p.y));
            const yMax = Math.max(...points.map(p => p.y));
            const yRange = yMax - yMin || 1;

            ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 0.5;
            for (let i = 0; i <= 4; i++) {
                const y = pad.t + (i / 4) * (H - pad.t - pad.b);
                ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
                ctx.fillStyle = '#999'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
                ctx.fillText((yMax - i / 4 * yRange).toFixed(3), pad.l - 5, y + 4);
            }

            const colors = { delta: '#6366f1', gamma: '#10b981', theta: '#f59e0b', vega: '#ef4444', price: '#06b6d4' };
            const color = colors[greek] || '#6366f1';

            ctx.beginPath();
            points.forEach((p, i) => {
                const sx = pad.l + (p.x - sMin) / (sMax - sMin) * (W - pad.l - pad.r);
                const sy = pad.t + ((yMax - p.y) / yRange) * (H - pad.t - pad.b);
                i === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
            });
            ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.stroke();

            const currentG = calcGreeks(S0, K, T, r, sigma, type);
            const curVal = currentG[greek];
            const cx = pad.l + (S0 - sMin) / (sMax - sMin) * (W - pad.l - pad.r);
            const cy = pad.t + ((yMax - curVal) / yRange) * (H - pad.t - pad.b);
            ctx.fillStyle = color;
            ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(cx, cy, 2, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#999'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('标的价格', W / 2, H - 8);
            ctx.save(); ctx.translate(14, H / 2); ctx.rotate(-Math.PI / 2);
            const names = { delta: 'Delta', gamma: 'Gamma', theta: 'Theta', vega: 'Vega', price: '期权价格' };
            ctx.fillText(names[greek], 0, 0); ctx.restore();
        }

        function drawPnL(S0, K, T, r, sigma, type) {
            const canvas = document.getElementById('pnlCanvas');
            const ctx = canvas.getContext('2d');
            const W = canvas.parentElement.clientWidth;
            const H = 280;
            canvas.width = W * 2; canvas.height = H * 2;
            canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
            ctx.scale(2, 2);
            ctx.clearRect(0, 0, W, H);

            const pad = { l: 60, r: 20, t: 20, b: 35 };
            const premium = bsPrice(S0, K, T, r, sigma, type);
            const sMin = K * 0.7, sMax = K * 1.3;
            const pnlPoints = [];
            for (let s = sMin; s <= sMax; s += (sMax - sMin) / 100) {
                const intrinsic = type === 'call' ? Math.max(s - K, 0) : Math.max(K - s, 0);
                pnlPoints.push({ x: s, y: intrinsic - premium });
            }

            const yMin = Math.min(...pnlPoints.map(p => p.y));
            const yMax = Math.max(...pnlPoints.map(p => p.y));
            const yRange = yMax - yMin || 1;

            const zeroY = pad.t + ((yMax - 0) / yRange) * (H - pad.t - pad.b);
            ctx.strokeStyle = '#999'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(pad.l, zeroY); ctx.lineTo(W - pad.r, zeroY); ctx.stroke();
            ctx.setLineDash([]);

            pnlPoints.forEach((p, i) => {
                if (i === 0) return;
                const sx = pad.l + (p.x - sMin) / (sMax - sMin) * (W - pad.l - pad.r);
                const sy = pad.t + ((yMax - p.y) / yRange) * (H - pad.t - pad.b);
                const prevSy = pad.t + ((yMax - pnlPoints[i - 1].y) / yRange) * (H - pad.t - pad.b);

                ctx.beginPath(); ctx.moveTo(sx - (W - pad.l - pad.r) / 100, prevSy); ctx.lineTo(sx, sy);
                ctx.strokeStyle = p.y >= 0 ? '#10b981' : '#ef4444'; ctx.lineWidth = 2; ctx.stroke();
            });

            ctx.fillStyle = '#999'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('到期时标的价格', W / 2, H - 8);
            ctx.save(); ctx.translate(14, H / 2); ctx.rotate(-Math.PI / 2);
            ctx.fillText('损益 (P/L)', 0, 0); ctx.restore();
        }

        function toggleTheme() {
            const html = document.documentElement;
            html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }

        calculate();
    </script>
</body>
</html>
