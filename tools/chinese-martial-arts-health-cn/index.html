<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国武术养生大全 - Chinese Martial Arts Health</title>
<meta name="description" content="中国武术养生大全，涵盖太极、气功、八段锦、五禽戏等养生功法">

<meta property="og:title" content="中国武术养生大全 - Chinese Martial Arts Health">
<meta property="og:description" content="中国武术养生大全，涵盖太极、气功、八段锦、五禽戏等养生功法">

<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e8a87c;--accent2:#d4956b}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#c97e4a;--accent2:#b06a55}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a0a05 0%,#2a1510 50%,#3d2015 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3020;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e8a87c,#d4956b,#c97e4a,#b06a55);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.health-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:16px}
.health-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.health-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.health-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.health-card .h-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.health-card .h-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(232,168,124,0.15);color:var(--accent)}
.health-card .h-name{font-size:1.3em;font-weight:bold}
.health-card .h-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.health-card .h-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.health-card .h-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.health-card .h-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.health-card .h-detail strong{color:var(--text)}
.health-card .h-benefits{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.health-card .h-benefits span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:rgba(35,134,54,0.1);color:var(--green)}
.health-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.health-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>

</div>

  {id:1,name:"太极拳养生",en:"Tai Chi Health",category:"太极养生",icon:"☯️",difficulty:"初学者",duration:"30-60分钟",description:"太极拳是最佳的养生运动之一，通过缓慢柔和的动作调节身心，增强免疫力，改善心肺功能。",benefits:["增强免疫力","改善心肺功能","调节血压","缓解压力","改善睡眠","增强平衡"],techniques:["起势","野马分鬃","白鹤亮翅","搂膝拗步","手挥琵琶","倒卷肱","左揽雀尾","右揽雀尾"],suitableFor:"各年龄段人群",tips:"练习时要放松身心，动作缓慢柔和"},

  {id:4,name:"易筋经",en:"Sinew Transforming Classic",category:"内功养生",icon:"💪",difficulty:"中级",duration:"20-30分钟",description:"易筋经是中国传统的健身气功，相传为达摩祖师所创。'易'意为改变，'筋'指筋骨。",benefits:["强筋壮骨","内外兼修","疏通经络","增强力量","改善柔韧性","延年益寿"],techniques:["韦驮献杵","横胆降魔","摘星换斗","出爪亮翅","九鬼拔马刀","三盘落地","青龙探爪","卧虎扑食"],suitableFor:"有一定基础的人群",tips:"练习时要意念集中，呼吸配合"},
  {id:5,name:"六字诀",en:"Six Healing Sounds",category:"气功养生",icon:"🧘",difficulty:"初学者",duration:"15-20分钟",description:"六字诀是通过呼气发出六种声音来调节脏腑功能的养生功法，是中医养生的重要组成部分。",benefits:["调理脏腑","疏通经络","调节呼吸","缓解压力","改善情绪","增强免疫力"],techniques:["嘘字诀：养肝","呵字诀：养心","呼字诀：养脾","呬字诀：养肺","吹字诀：养肾","嘻字诀：养三焦"],suitableFor:"各年龄段人群",tips:"发音要准确，气息要均匀"},
  {id:6,name:"站桩功",en:"Standing Meditation",category:"内功养生",icon:"🧍",difficulty:"初学者",duration:"15-30分钟",description:"站桩功是武术内功的基础，通过静态站立培养内劲和稳定性。站桩能增强腿部力量，培养正确的身体结构。",benefits:["增强腿部力量","培养内劲","改善体态","增强稳定性","调节呼吸","静心安神"],techniques:["混元桩","浑圆桩","三体式","无极桩","太极桩","降龙桩","伏虎桩","马步桩"],suitableFor:"各年龄段人群",tips:"初学者从5分钟开始，逐渐增加"},
  {id:7,name:"五脏养生功",en:"Five Organ Health Qigong",category:"气功养生",icon:"🧘",difficulty:"中级",duration:"20-30分钟",description:"五脏养生功是通过特定的动作和呼吸来调理五脏功能的养生功法，是中医养生的重要组成部分。",benefits:["调理五脏","疏通经络","增强体质","改善免疫","调节情绪","延年益寿"],techniques:["养肝功","养心功","养脾功","养肺功","养肾功"],suitableFor:"各年龄段人群",tips:"练习时要意念集中，呼吸配合"},
  {id:8,name:"太极养生杖",en:"Tai Chi Health Cane",category:"太极养生",icon:"☯️",difficulty:"初学者",duration:"20-30分钟",description:"太极养生杖是太极拳的衍生功法，以杖为辅助工具，适合中老年人练习。",benefits:["增强平衡","改善协调","锻炼全身","缓解关节疼痛","增强信心","社交互动"],techniques:["起势","点杖","撩杖","扫杖","挑杖","架杖","收势"],suitableFor:"中老年人群",tips:"杖的长度要适中，动作要缓慢"},
  {id:9,name:"导引养生功",en:"Dao Yin Health Qigong",category:"导引养生",icon:"🔄",difficulty:"初学者",duration:"15-20分钟",description:"导引养生功是中国传统的养生功法，通过肢体运动和呼吸调节来达到养生目的。",benefits:["疏通经络","调理脏腑","强身健体","延年益寿","缓解疲劳","改善体质"],techniques:["预备势","两手托天理三焦","左右开弓似射雕","调理脾胃须单举","五劳七伤往后瞧","摇头摆尾去心火","两手攀足固肾腰","攒拳怒目增气力","背后七颠百病消","收势"],suitableFor:"各年龄段人群",tips:"动作要舒展大方，呼吸自然"},
  {id:10,name:"太极内功",en:"Tai Chi Internal Skill",category:"太极养生",icon:"☯️",difficulty:"高级",duration:"30-60分钟",description:"太极内功是太极拳的高级修炼方法，通过意念引导内气运行，达到养生和技击的双重目的。",benefits:["培养内气","增强内劲","改善体质","调节身心","延年益寿","提高境界"],techniques:["站桩","行桩","走架","推手","散手","内功心法","意念引导","呼吸配合"],suitableFor:"有一定太极拳基础的人群",tips:"要在有经验的老师指导下练习"},
  {id:11,name:"佛家养生功",en:"Buddhist Health Qigong",category:"气功养生",icon:"☸️",difficulty:"中级",duration:"20-30分钟",description:"佛家养生功是佛教僧人修炼的养生功法，融合了禅修和气功的精华。",benefits:["静心安神","调理身心","增强定力","改善睡眠","调节情绪","延年益寿"],techniques:["禅定","数息观","随息观","观想","手印","诵经","打坐","经行"],suitableFor:"各年龄段人群",tips:"练习时要心无杂念，专注当下"},
  {id:12,name:"道家养生功",en:"Taoist Health Qigong",category:"气功养生",icon:"☯️",difficulty:"中级",duration:"20-30分钟",description:"道家养生功是道教修炼的养生功法，融合了道家哲学和气功的精华。",benefits:["延年益寿","调理身心","增强体质","调节阴阳","疏通经络","静心安神"],techniques:["内丹功","外丹功","导引术","吐纳术","存想术","辟谷术","房中术","胎息术"],suitableFor:"各年龄段人群",tips:"练习时要顺应自然，不可强求"}
];
function renderCards(data){
  document.getElementById('healthGrid').innerHTML=data.map(m=>`
    <div class="health-card" data-category="${m.category}">
      <div class="h-header"><div class="h-icon">${m.icon}</div><div><div class="h-name">${m.name}</div><div class="h-sub">${m.en} · ${m.difficulty}</div></div></div>
      <div class="h-meta"><span>时间：${m.duration}</span><span>难度：${m.difficulty}</span><span>适合：${m.suitableFor}</span></div>
      <div class="h-detail"><strong>说明：</strong>${m.description}</div>
      <div class="h-detail"><strong>功法：</strong>${m.techniques.join('、')}</div>
      <div class="h-detail"><strong>提示：</strong>${m.tips}</div>
      <div class="h-benefits">${m.benefits.map(b=>`<span>${b}</span>`).join('')}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(m=>{cats[m.category]=(cats[m.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">养生功法</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.health-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.health-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(HEALTH_DATA);renderStats(HEALTH_DATA);
</script>
</body>
</html>
