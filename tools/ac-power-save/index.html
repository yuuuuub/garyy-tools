<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❄️ 空调省电技巧</title>
<meta name="description" content="夏天开空调如何省电？最佳温度设定、定时使用、清洗滤网、风扇配合技巧，每月省几百块">
<style>
:root{--transition:0.2s ease;--bg:#f0fdf4;--card:#fff;--text:#14532d;--text2:#16a34a;--accent:#22c55e;--blue:#0ea5e9;--border:#bbf7d0;--radius:16px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
[data-theme="dark"]{--bg:#0a1a10;--card:#122018;--text:#bbf7d0;--text2:#4ade80;--border:#14532d}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16pxscroll-behavior:smooth;}
.container{max-width:520px;margin:0 auto}
header{text-align:center;padding:32px 0 20px}
header h1{font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#22c55e,#0ea5e9,#0284c7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.calc-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.calc-card h3{font-size:1rem;font-weight:700;margin-bottom:12px}
.form-row{display:flex;gap:8px;margin-bottom:10px}
.form-group{flex:1}
.form-group label{font-size:.72rem;color:var(--text2);display:block;margin-bottom:3px}
.form-group input,.form-group select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.85rem;font-family:inherit;outline:none}
.form-group input:focus{border-color:var(--accent)}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#22c55e,#16a34a);color:var(--text);border:none;border-radius:12px;font-size:.95rem;font-weight:800;cursor:pointer;font-family:inherit}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.result-item{text-align:center;padding:12px 8px;background:var(--bg);border-radius:10px}
.result-val{font-size:1.3rem;font-weight:900;color:var(--accent)}
.result-lab{font-size:.65rem;color:var(--text2)}
.tip-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.tip-item{display:flex;align-items:flex-start;gap:10px;padding:12px;background:var(--bg);border-radius:10px;font-size:.8rem;line-height:1.5}
.tip-item .ti-rank{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;flex-shrink:0}
.tip-item .ti-save{color:var(--accent);font-weight:700;font-size:.75rem}
.myth-grid{display:flex;flex-direction:column;gap:8px}
.myth-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:.78rem;line-height:1.5}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.7rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="❄️ 空调省电技巧">
  <meta property="og:description" content="夏天开空调如何省电？最佳温度设定、定时使用、清洗滤网、风扇配合技巧，每月省几百块">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/ac-power-save/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header><h1>❄️ 空调省电技巧</h1><p>凉爽不心疼 · 每月省几百</p></header>

<div class="calc-card">
<h2>💰 空调电费计算器</h2>
<div class="form-row">
<div class="form-group"><label>空调功率 (匹)</label>
<select id="power"><option value="1">1匹 (750W)</option><option value="1.5" selected>1.5匹 (1100W)</option><option value="2">2匹 (1500W)</option><option value="3">3匹 (2250W)</option></select></div>
<div class="form-group"><label>能效等级</label>
<select id="efficiency"><option value="3.6">一级能效 (APF 5.0)</option><option value="3.2" selected>二级能效 (APF 4.5)</option><option value="2.8">三级能效 (APF 4.0)</option><option value="2.4">五级能效 (APF 3.5)</option></select></div>
</div>
<div class="form-row">
<div class="form-group"><label>每天开几小时</label><input type="number" id="hours" value="8" min="1" max="24"></div>
<div class="form-group"><label>电价 (元/度)</label><input type="number" id="price" value="0.6" step="0.01" min="0.1"></div>
</div>
<div class="form-group"><label>设定温度 °C</label>
<select id="temp"><option value="16">16°C</option><option value="20">20°C</option><option value="24">24°C</option><option value="26" selected>26°C</option><option value="28">28°C</option></select></div>
<button class="btn" onclick="calculate()">💰 计算每月电费</button>
<div class="result-grid" id="calcResult" style="display:none">
<div class="result-item"><div class="result-val" id="dailyCost">--</div><div class="result-lab">每日电费</div></div>
<div class="result-item"><div class="result-val" id="monthlyCost">--</div><div class="result-lab">每月电费</div></div>
<div class="result-item"><div class="result-val" id="saveAmt">--</div><div class="result-lab">省电技巧可省</div></div>
</div>
</div>

<div class="calc-card">
<h2>💡 省电排行榜（效果从大到小）</h2>
<div class="tip-list" id="tipList"></div>
</div>

<div class="calc-card">
<h2>❌ 这些"省电妙招"其实是谣言</h2>
<div class="myth-grid" id="mythList"></div>
</div>

<footer>科学省电 · 凉爽一夏 ❄️</footer>
</div>

<script>
function calculate(){
const pWatts=[750,1100,1500,2250][document.getElementById('power').selectedIndex];
const eff=parseFloat(document.getElementById('efficiency').value);
const hours=parseInt(document.getElementById('hours').value);
const price=parseFloat(document.getElementById('price').value);
const temp=parseInt(document.getElementById('temp').value);
const basePower=pWatts/1000;
const tempFactor=1+Math.max(0,(26-temp))*0.06;
const actualPower=basePower*tempFactor/eff*4;
const daily=actualPower*hours*price;
const monthly=daily*30;
const potentialSave=monthly*0.35;
document.getElementById('dailyCost').textContent='¥'+daily.toFixed(1);
document.getElementById('monthlyCost').textContent='¥'+monthly.toFixed(0);
document.getElementById('saveAmt').textContent='¥'+potentialSave.toFixed(0)+'/月';
document.getElementById('calcResult').style.display='grid';
}
const tips=[
{r:'1',s:'省25-30%',t:'温度设26°C+风扇',d:'26°C+风扇摇头，体感温度和22°C差不多，但耗电量差40%！空调每提高1°C省6-8%电。'},
{r:'2',s:'省10-15%',t:'每2周清洗滤网',d:'滤网堵了出风量减少，空调拼命工作反而更费电。拆下来水冲一下晾干就行。'},
{r:'3',s:'省10-15%',t:'定时关闭+睡眠模式',d:'入睡后体温下降，设定2-3小时后自动关闭+睡眠模式缓慢升温，半夜不会热醒又省电。'},
{r:'4',s:'省8-10%',t:'拉窗帘/贴隔热膜',d:'阳光直射让室温升3-5°C。白天拉上窗帘或贴隔热膜，空调负荷大幅下降。'},
{r:'5',s:'省8-12%',t:'出门前10分钟关',d:'房间凉气能维持10-15分钟。提前关空调，利用余冷。'},
{r:'6',s:'省5-8%',t:'不要频繁开关',d:'空调启动瞬间电流大！短暂出门(30分钟内)反而不要关空调，保持运行更省电。'},
];
document.getElementById('tipList').innerHTML=tips.map(t=>`
<div class="tip-item">
<span class="ti-rank">${t.r}</span>
<div><b>${t.t}</b><br><span class="ti-save">💰 ${t.s}</span> · ${t.d}</div>
</div>`).join('');
const myths=[
{m:'开除湿模式比制冷省电？',t:'真相：除湿模式和制冷模式耗电差不多。除湿模式风量小但压缩机同样工作。不过湿度降低确实让人感觉凉快。'},
{m:'频繁开关更省电？',t:'真相：错了！空调启动瞬间耗电是正常运行的3-5倍。频繁开关反而费电。短暂离开不关更省。'},
{m:'温度设越低降温越快？',t:'真相：无论设16°C还是26°C，降温速度一样！定频空调只有开和关两种状态，设太低只会更费电。变频空调稍微聪明一点但也没差太多。'},
];
document.getElementById('mythList').innerHTML=myths.map(m=>`
<div class="myth-item"><span style="color:var(--red);font-size:1.2rem">❌</span><div><b>${m.m}</b><br><span style="color:var(--green)">✅ ${m.t}</span></div></div>`).join('');
calculate();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
