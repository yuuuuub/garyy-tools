<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📜 中医方剂大全</title>
<meta property="og:title" content="📜 中医方剂大全">
<meta property="og:description" content="经典中医方剂库，方剂组成、功效、主治详解 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="经典中医方剂库，方剂组成、功效、主治详解">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📜</text></svg>">
<meta name="robots" content="index, follow">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;display:flex;justify-content:center}
.ctn{max-width:600px;width:100%}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit;font-size:.95rem}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:.75rem;font-weight:600}
.tag.s{background:rgba(34,197,94,.15);color:var(--success)}.tag.w{background:rgba(245,158,11,.15);color:var(--warn)}.tag.d{background:rgba(239,68,68,.15);color:var(--danger)}.tag.b{background:rgba(59,130,246,.15);color:var(--blue)}.tag.p{background:rgba(168,85,247,.15);color:#a855f7}
.li{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.li:hover{border-color:var(--accent)}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:.9rem}
select,input,textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.9rem;margin-bottom:8px}
label{font-size:.85rem;color:var(--text2);margin-bottom:4px;display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
.tab-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:20px;font-size:.85rem;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:white;border-color:var(--accent)}
.detail{display:none}.detail.active{display:block}
.step{padding:10px;border-left:3px solid var(--accent);margin-bottom:8px;background:var(--bg);border-radius:0 8px 8px 0}
.step-num{font-weight:700;color:var(--accent);margin-right:8px}
.herb-info{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:.9rem;margin:12px 0}
.herb-info dt{color:var(--text2);font-weight:600}
.herb-info dd{color:var(--text)}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare-col{padding:12px;background:var(--bg);border-radius:8px}
</style>
</head>
<body>
<div class="ctn">
<div class="hdr">
<h1>📜 中医方剂大全</h1>
<p>经典方剂，辨证施治</p>
</div>

<div class="tab-bar" id="tabs">
<div class="tab active" data-tab="category">经典方剂</div>
<div class="tab" data-tab="search">方剂搜索</div>
<div class="tab" data-tab="compare">方剂对照</div>
<div class="tab" data-tab="compose">方剂组成</div>
</div>

<div id="view-category" class="detail active">
<div class="cd">
<h2>📋 选择方剂类别</h2>
<div id="cat-tabs" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"></div>
<div id="formula-list"></div>
</div>
<div class="cd" id="formula-detail" style="display:none">
<h2 id="fd-title">方剂详情</h2>
<div id="fd-content"></div>
<div style="margin-top:12px"><button class="sec" onclick="addToCompare()">⚖️ 加入对照</button></div>
</div>
</div>

<div id="view-search" class="detail">
<div class="cd">
<h2>🔍 搜索方剂</h2>
<input type="text" id="search-input" placeholder="输入方剂名、药材或主治...">
<div id="search-results"></div>
</div>
</div>

<div id="view-compare" class="detail">
<div class="cd">
<h2>⚖️ 方剂对照</h2>
<div id="compare-content"><div class="empty">请在方剂列表中点击"加入对照"添加方剂</div></div>
</div>
</div>

<div id="view-compose" class="detail">
<div class="cd">
<h2>🧩 方剂组成分析</h2>
<p style="color:var(--text2);font-size:.85rem;margin-bottom:12px">选择症状，获取推荐方剂</p>
<div id="symptom-list"></div>
<button onclick="recommendFormulas()" style="width:100%;margin-top:8px">获取推荐方剂</button>
<div id="recommendation" style="margin-top:12px"></div>
</div>
</div>
</div>

<script>
const formulas = [
  {name:'麻黄汤',source:'《伤寒论》',category:'解表剂',composition:'麻黄9g、桂枝6g、杏仁9g、甘草3g',function:'发汗解表，宣肺平喘',indication:'外感风寒表实证：恶寒发热，头痛身疼，无汗而喘，脉浮紧',notes:'本方发汗力强，不宜久服，得汗后停服'},
  {name:'桂枝汤',source:'《伤寒论》',category:'解表剂',composition:'桂枝9g、芍药9g、生姜9g、大枣3枚、甘草6g',function:'解肌发表，调和营卫',indication:'外感风寒表虚证：头痛发热，汗出恶风，鼻鸣干呕，脉浮缓',notes:'服后啜热稀粥以助药力，禁食生冷油腻'},
  {name:'小柴胡汤',source:'《伤寒论》',category:'解表剂',composition:'柴胡24g、黄芩9g、人参9g、半夏9g、甘草6g、生姜9g、大枣4枚',function:'和解少阳，疏肝理气',indication:'少阳病证：往来寒热，胸胁苦满，默默不欲饮食，心烦喜呕',notes:'为和解少阳第一方，临床应用极广'},
  {name:'白虎汤',source:'《伤寒论》',category:'清热剂',composition:'石膏30g、知母9g、甘草6g、粳米15g',function:'清热生津',indication:'气分热盛证：壮热面赤，烦渴引饮，汗出恶热，脉洪大',notes:'以大热、大汗、大渴、脉洪大为辨证要点'},
  {name:'龙胆泻肝汤',source:'《医方集解》',category:'清热剂',composition:'龙胆草6g、黄芩9g、栀子9g、泽泻9g、木通3g、车前子9g、当归3g、柴胡6g、甘草6g、生地黄9g',function:'泻肝胆实火，清下焦湿热',indication:'肝胆实火上炎或肝胆湿热下注：头痛目赤，胁痛口苦，阴肿阴痒',notes:'本方苦寒，不宜久服或过量'},
  {name:'四君子汤',source:'《太平惠民和剂局方》',category:'补益剂',composition:'人参9g、白术9g、茯苓9g、甘草6g',function:'益气健脾',indication:'脾胃气虚证：面色萎白，语声低微，气短乏力，食少便溏',notes:'为补气基础方，后世许多补脾益气方从此方化裁而来'},
  {name:'六味地黄丸',source:'《小儿药证直诀》',category:'补益剂',composition:'熟地黄24g、山萸肉12g、山药12g、泽泻9g、茯苓9g、牡丹皮9g',function:'滋阴补肾',indication:'肾阴虚证：腰膝酸软，头晕耳鸣，盗汗遗精，骨蒸潮热',notes:'三补三泻，以补为主，为滋阴补肾的基础方'},
  {name:'四物汤',source:'《太平惠民和剂局方》',category:'补益剂',composition:'当归9g、川芎6g、白芍9g、熟地黄12g',function:'补血调血',indication:'营血虚滞证：头晕目眩，心悸失眠，面色无华，妇人月经不调',notes:'为补血调经的基础方，被誉为"妇科第一方"'},
  {name:'逍遥散',source:'《太平惠民和剂局方》',category:'理气剂',composition:'柴胡9g、当归9g、白芍9g、白术9g、茯苓9g、甘草6g、薄荷3g、生姜3片',function:'疏肝解郁，养血健脾',indication:'肝郁血虚脾弱证：两胁作痛，头痛目眩，神疲食少，月经不调',notes:'为疏肝理脾的代表方，临床应用极广'},
  {name:'血府逐瘀汤',source:'《医林改错》',category:'活血剂',composition:'桃仁12g、红花9g、当归9g、川芎5g、赤芍6g、牛膝9g、桔梗5g、柴胡3g、枳壳6g、甘草3g、生地黄9g',function:'活血化瘀，行气止痛',indication:'胸中血瘀证：胸痛头痛日久不愈，痛如针刺而有定处',notes:'为活血化瘀的代表方，治疗范围广泛'},
  {name:'二陈汤',source:'《太平惠民和剂局方》',category:'化痰剂',composition:'半夏15g、橘红15g、白茯苓9g、甘草5g、生姜7片、乌梅1枚',function:'燥湿化痰，理气和中',indication:'湿痰证：咳嗽痰多，色白易咯，恶心呕吐，胸脘痞闷',notes:'为治痰的基础方，有"祛痰第一方"之称'},
  {name:'平胃散',source:'《太平惠民和剂局方》',category:'祛湿剂',composition:'苍术15g、厚朴9g、陈皮9g、甘草4g、生姜2片、大枣2枚',function:'燥湿运脾，行气和胃',indication:'湿滞脾胃证：脘腹胀满，不思饮食，口淡无味，恶心呕吐',notes:'为治疗湿困脾胃的基础方'},
  {name:'承气汤',source:'《伤寒论》',category:'泻下剂',composition:'大黄12g、厚朴15g、枳实12g、芒硝9g',function:'峻下热结',indication:'阳明腑实证：大便不通，频转矢气，脘腹痞满，腹痛拒按',notes:'即大承气汤，为寒下方的代表'},
  {name:'八珍汤',source:'《正体类要》',category:'补益剂',composition:'人参9g、白术9g、茯苓9g、甘草6g、当归9g、川芎6g、白芍9g、熟地黄12g',function:'气血双补',indication:'气血两虚证：面色苍白或萎黄，头晕目眩，食欲不振，四肢倦怠',notes:'由四君子汤合四物汤而成，为气血双补的基础方'},
  {name:'十全大补汤',source:'《太平惠民和剂局方》',category:'补益剂',composition:'人参9g、白术9g、茯苓9g、甘草6g、当归9g、川芎6g、白芍9g、熟地黄12g、黄芪15g、肉桂3g',function:'温补气血',indication:'气血不足，虚劳咳嗽，遗精盗汗，崩漏不止',notes:'在八珍汤基础上加黄芪、肉桂，温补之力更强'}
];

let activeCategory = '解表剂';
let currentFormula = null;
let compareList = [];
const categories = [...new Set(formulas.map(f => f.category))];

function loadData() { return JSON.parse(localStorage.getItem('formula-compare') || '[]'); }
function saveData(d) { localStorage.setItem('formula-compare', JSON.stringify(d)); }

function renderCatTabs() {
  document.getElementById('cat-tabs').innerHTML = categories.map(c =>
    `<div class="tab ${c === activeCategory ? 'active' : ''}" onclick="switchCategory('${c}')" style="padding:6px 12px;font-size:.8rem">${c}</div>`
  ).join('');
}

function switchCategory(cat) {
  activeCategory = cat;
  renderCatTabs();
  renderFormulaList();
}

function renderFormulaList() {
  const filtered = formulas.filter(f => f.category === activeCategory);
  document.getElementById('formula-list').innerHTML = filtered.map(f => {
    const idx = formulas.indexOf(f);
    return `<div class="li" onclick="showFormula(${idx})">
      <div><strong>${f.name}</strong><br><span style="color:var(--text2);font-size:.85rem">${f.source}</span></div>
      <span class="tag b">${f.category}</span>
    </div>`;
  }).join('');
}

function showFormula(i) {
  currentFormula = i;
  const f = formulas[i];
  document.getElementById('formula-detail').style.display = 'block';
  document.getElementById('fd-title').textContent = f.name;
  const herbs = f.composition.split('、').map(h => h.trim());
  document.getElementById('fd-content').innerHTML = `
    <dl class="herb-info">
      <dt>出处</dt><dd>${f.source}</dd>
      <dt>分类</dt><dd><span class="tag b">${f.category}</span></dd>
      <dt>组成</dt><dd>${herbs.map(h => `<span class="tag p" style="margin:2px">${h}</span>`).join('')}</dd>
      <dt>功效</dt><dd>${f.function}</dd>
      <dt>主治</dt><dd>${f.indication}</dd>
      <dt>注意</dt><dd style="color:var(--warn)">${f.notes}</dd>
    </dl>`;
}

function addToCompare() {
  if (currentFormula === null) return;
  if (compareList.length >= 2) compareList.shift();
  if (!compareList.includes(currentFormula)) compareList.push(currentFormula);
  saveData(compareList);
  alert(`已加入对照：${formulas[currentFormula].name}（${compareList.length}/2）`);
}

function renderCompare() {
  if (compareList.length < 2) {
    document.getElementById('compare-content').innerHTML = '<div class="empty">请在方剂列表中点击"加入对照"添加2个方剂</div>';
    return;
  }
  const [a, b] = compareList.map(i => formulas[i]);
  const fields = [['出处','source'],['分类','category'],['组成','composition'],['功效','function'],['主治','indication'],['注意','notes']];
  document.getElementById('compare-content').innerHTML = `
    <div class="compare-grid">
      <div class="compare-col"><h3 style="margin-bottom:8px">${a.name}</h3>${fields.map(([l,k]) => `<div style="margin-bottom:6px"><small style="color:var(--text2)">${l}</small><br>${a[k]}</div>`).join('')}</div>
      <div class="compare-col"><h3 style="margin-bottom:8px">${b.name}</h3>${fields.map(([l,k]) => `<div style="margin-bottom:6px"><small style="color:var(--text2)">${l}</small><br>${b[k]}</div>`).join('')}</div>
    </div>
    <button class="sec" onclick="compareList=[];saveData(compareList);renderCompare()" style="margin-top:12px;width:100%">清空对照</button>`;
}

// Search
document.getElementById('search-input').addEventListener('input', doSearch);
function doSearch() {
  const q = document.getElementById('search-input').value.toLowerCase();
  if (!q) { document.getElementById('search-results').innerHTML = ''; return; }
  const results = formulas.filter(f =>
    f.name.includes(q) || f.composition.includes(q) || f.indication.includes(q) || f.function.includes(q)
  );
  document.getElementById('search-results').innerHTML = results.length ? results.map(f => {
    const idx = formulas.indexOf(f);
    return `<div class="li" onclick="showFormula(${idx})">
      <div><strong>${f.name}</strong><br><span style="color:var(--text2);font-size:.85rem">${f.function}</span></div>
      <span class="tag b">${f.category}</span>
    </div>`;
  }).join('') : '<div class="empty">未找到匹配方剂</div>';
}

// Compose / Recommend
const symptomMap = {
  '发热恶寒': ['麻黄汤','桂枝汤'],
  '往来寒热': ['小柴胡汤'],
  '壮热口渴': ['白虎汤'],
  '头晕耳鸣': ['六味地黄丸'],
  '两胁作痛': ['逍遥散'],
  '胸痛如刺': ['血府逐瘀汤'],
  '咳嗽痰多': ['二陈汤'],
  '脘腹胀满': ['平胃散','承气汤'],
  '月经不调': ['四物汤','逍遥散'],
  '面色萎白': ['四君子汤','八珍汤'],
  '腰膝酸软': ['六味地黄丸'],
  '头痛目赤': ['龙胆泻肝汤']
};

document.getElementById('symptom-list').innerHTML = Object.keys(symptomMap).map(s =>
  `<label style="display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer">
    <input type="checkbox" class="symptom-cb" value="${s}"> ${s}
  </label>`
).join('');

function recommendFormulas() {
  const checked = [...document.querySelectorAll('.symptom-cb:checked')].map(c => c.value);
  if (!checked.length) { document.getElementById('recommendation').innerHTML = '<div class="empty">请先选择症状</div>'; return; }
  const counts = {};
  checked.forEach(s => (symptomMap[s] || []).forEach(f => { counts[f] = (counts[f] || 0) + 1; }));
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  document.getElementById('recommendation').innerHTML = sorted.map(([name, count]) => {
    const f = formulas.find(fm => fm.name === name);
    const idx = formulas.indexOf(f);
    return `<div class="li" onclick="showFormula(${idx})">
      <div><strong>${name}</strong><br><span style="color:var(--text2);font-size:.85rem">匹配${count}个症状 · ${f.function}</span></div>
      <span class="tag s">推荐</span>
    </div>`;
  }).join('');
}

// Tabs
compareList = loadData();
document.querySelectorAll('#tabs .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('#tabs .tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.detail').forEach(d => d.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'compare') renderCompare();
  });
});

renderCatTabs();
renderFormulaList();
</script>
</body>
</html>
