<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#eab308;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:900px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.95rem;transition:all .2s}
.btn-primary{background:var(--blue);color:#fff}
.btn-secondary{background:var(--border);color:var(--text)}
.hidden{display:none}
.timeline{position:relative;padding-left:30px}
.timeline-item{position:relative;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.timeline-item:last-child{border-bottom:none}
.timeline-dot{position:absolute;left:-30px;top:4px;width:12px;height:12px;background:var(--yellow);border-radius:50%}
.timeline-era{font-weight:600;margin-bottom:4px}
.timeline-desc{color:var(--text2);font-size:.85rem;line-height:1.6}
.custom-list{display:flex;flex-direction:column;gap:10px}
.custom-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;cursor:pointer;transition:all var(--transition)}
.custom-item:hover{border-color:var(--yellow)}
.custom-header{display:flex;align-items:center;gap:10px}
.custom-icon{font-size:1.5rem}
.custom-name{font-weight:600}
.custom-desc{color:var(--text2);font-size:.85rem;margin-top:4px}
.custom-detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);color:var(--text2);font-size:.85rem;line-height:1.6;display:none}
.custom-detail.show{display:block}
.region-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.region-tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:.8rem;transition:all .2s}
.region-tab.active{background:var(--yellow);color:#000;border-color:var(--yellow)}
.region-content{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px}
.region-title{font-weight:600;margin-bottom:8px}
.region-desc{color:var(--text2);font-size:.85rem;line-height:1.6}
.ingredient-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:12px 0}
.ing-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}
.ing-emoji{font-size:1.2rem}
.ing-name{font-size:.8rem;font-weight:600;margin:4px 0 2px}
.ing-cal{font-size:.7rem;color:var(--text2)}
.quiz-area{text-align:center}
.quiz-q{font-size:1rem;font-weight:600;margin-bottom:16px;line-height:1.6}
.quiz-options{display:flex;flex-direction:column;gap:8px;max-width:500px;margin:0 auto}
.quiz-opt{padding:12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s;background:var(--bg)}
.quiz-opt:hover{border-color:var(--blue);background:var(--card)}
.quiz-opt.correct{border-color:var(--green);background:rgba(35,134,54,.2)}
.quiz-opt.wrong{border-color:var(--red);background:rgba(239,68,68,.2)}
.quiz-score{margin-top:12px;font-size:.9rem;color:var(--text2)}
.blessing-area{text-align:center}
.blessing-card{background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;border-radius:var(--radius);padding:24px;margin:16px 0;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.blessing-text{font-size:1.3rem;font-weight:600;margin-bottom:8px}
.blessing-sub{font-size:.85rem;opacity:.8}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.countdown-box{display:flex;gap:16px;justify-content:center;margin:16px 0}
.countdown-item{text-align:center}
.countdown-num{font-size:2rem;font-weight:700;color:var(--yellow);line-height:1}
.countdown-label{font-size:.75rem;color:var(--text2);margin-top:4px}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>

];
var quizIdx=0,quizScore=0,quizAnswered=false,currentRegion=0;

function updateCountdown(){
  var now=new Date();var year=now.getFullYear();
  var laba=new Date(year,11,8);if(now>laba)laba=new Date(year+1,11,8);
  var diff=laba-now;var d=Math.floor(diff/864e5);
  document.getElementById('countdown').innerHTML='<div class="countdown-item"><div class="countdown-num">'+d+'</div><div class="countdown-label">天</div></div>';
}

function showTab(tab){
  ['historyView','customsView','ingredientsView','regionView','quizView','blessingView'].forEach(function(v){document.getElementById(v).classList.add('hidden')});
  document.getElementById(tab+'View').classList.remove('hidden');
  ['tabHistory','tabCustoms','tabIngredients','tabRegion','tabQuiz','tabBlessing'].forEach(function(id){document.getElementById(id).className='btn btn-secondary'});
  var map={history:'History',customs:'Customs',ingredients:'Ingredients',region:'Region',quiz:'Quiz',blessing:'Blessing'};
  document.getElementById('tab'+map[tab]).className='btn btn-primary';
  if(tab==='quiz'&&quizIdx===0)renderQuiz();
}

function renderTimeline(){
  var h='';historyData.forEach(function(d){
    h+='<div class="timeline-item"><div class="timeline-dot"></div><div class="timeline-era">'+d.era+'</div><div class="timeline-desc">'+d.desc+'</div></div>';
  });document.getElementById('timeline').innerHTML=h;
}

function renderCustoms(){
  var h='';
  customs.forEach(function(c,i){
    h+='<div class="custom-item" onclick="toggleDetail('+i+')">';
    h+='<div class="custom-header"><span class="custom-icon">'+c.icon+'</span><div><div class="custom-name">'+c.name+'</div><div class="custom-desc">'+c.desc+'</div></div></div>';
    h+='<div class="custom-detail" id="cd-'+i+'">'+c.detail+'</div></div>';
  });
  document.getElementById('customList').innerHTML=h;
}

function toggleDetail(idx){var el=document.getElementById('cd-'+idx);if(el)el.classList.toggle('show')}

function renderIngredients(){
  var h='';ingredients.forEach(function(ing){
    h+='<div class="ing-item"><div class="ing-emoji">'+ing.emoji+'</div><div class="ing-name">'+ing.name+'</div><div class="ing-cal">'+ing.cal+'/100g</div></div>';
  });document.getElementById('ingGrid').innerHTML=h;
}

function renderRegion(){
  var h='';
  regions.forEach(function(r,i){h+='<span class="region-tab'+(i===0?' active':'')+'" onclick="selectRegion('+i+')">'+r.name+'</span>'});
  document.getElementById('regionTabs').innerHTML=h;
  showRegionContent(0);
}

function selectRegion(i){
  currentRegion=i;
  document.querySelectorAll('.region-tab').forEach(function(t){t.classList.remove('active')});
  document.querySelectorAll('.region-tab')[i].classList.add('active');
  showRegionContent(i);
}

function showRegionContent(i){
  var r=regions[i];
  document.getElementById('regionContent').innerHTML='<div class="region-title">'+r.name+'</div><div class="region-desc">'+r.desc+'</div>';
}

function renderQuiz(){
  if(quizIdx>=quizData.length){
    document.getElementById('quizArea').innerHTML='<h3>🎉 答题结束！</h3><p style="font-size:1.2rem;margin:16px 0">得分：'+quizScore+'/'+quizData.length+'</p><button class="btn btn-primary" onclick="resetQuiz()">🔄 重新开始</button>';
    return;
  }
  var q=quizData[quizIdx];
  var h='<div class="quiz-q">第'+(quizIdx+1)+'题：'+q.q+'</div><div class="quiz-options">';
  q.opts.forEach(function(o,i){h+='<div class="quiz-opt" onclick="answerQuiz('+i+','+q.ans+')">'+o+'</div>'});
  h+='</div><div class="quiz-score">当前得分：'+quizScore+'</div>';
  document.getElementById('quizArea').innerHTML=h;
}

function answerQuiz(sel,correct){
  if(quizAnswered)return;quizAnswered=true;
  var opts=document.querySelectorAll('.quiz-opt');
  opts[correct].classList.add('correct');
  if(sel!==correct)opts[sel].classList.add('wrong');else quizScore++;
  setTimeout(function(){quizIdx++;quizAnswered=false;renderQuiz()},1200);
}

function resetQuiz(){quizIdx=0;quizScore=0;quizAnswered=false;renderQuiz()}

function randomBlessing(){
  var b=blessings[Math.floor(Math.random()*blessings.length)];
  document.getElementById('blessingText').textContent=b.text;
  document.getElementById('blessingSub').textContent=b.sub;
}

function toggleTheme(){
  var html=document.documentElement;var isLight=html.getAttribute('data-theme')==='light';
  html.setAttribute('data-theme',isLight?'dark':'light');
  document.getElementById('themeBtn').textContent=isLight?'☀️ 亮色':'🌙 暗色';
}
