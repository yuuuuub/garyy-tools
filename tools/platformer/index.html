<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平台跳跃</title>
    <meta name="description" content="平台跳跃游戏，操控角色在平台间跳跃闯关">
    <style>
:root {--bg: #0d1117;
--card: #161b22;
--border: #30363d;
--text: #e6edf3;
--accent: #3b82f6}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {background: var(--bg);
color: var(--text);
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
padding: 20pxscroll-behavior:smooth;}
h1 { margin-bottom: 10px; }
.stats {display: flex;
gap: 30px;
margin-bottom: 15px;
font-size: 1.1rem}
.stats span { color: var(--accent); font-weight: bold; }
#gameCanvas {border: 2px solid var(--border);
border-radius: 8px;
max-width: 100%}
.info { margin-top: 10px; color: #8b949e; text-align: center; }
.mobile-controls {display: none;
margin-top: 15px;
gap: 20px}
.mobile-btn {width: 60px;
height: 60px;
background: var(--card);
border: 1px solid var(--border);
border-radius: 10px;
color: var(--text);
font-size: 1.5rem;
cursor: pointer}
.mobile-btn:active { background: var(--accent); }
@media (max-width: 600px) {.mobile-controls { display: flex; justify-content: center; }}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="平台跳跃">
  <meta property="og:description" content="平台跳跃游戏，操控角色在平台间跳跃闯关">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/platformer/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
    <h1>🧱 平台跳跃</h1>
    <div class="stats">
        金币：<span id="coins">0</span>/20
        生命：<span id="lives">3</span>
        关卡：<span id="level">1</span>
    </div>
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    <div class="info">方向键移动，空格跳跃，收集所有金币过关</div>
    <div class="mobile-controls">
        <button class="mobile-btn" id="btnLeft">←</button>
        <button class="mobile-btn" id="btnJump">跳</button>
        <button class="mobile-btn" id="btnRight">→</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GRAVITY = 0.6, JUMP = -12, SPEED = 5;

        let player, platforms, coins, enemies, level, coinsCollected, lives;

        function initLevel(lvl) {
            level = lvl;
            coinsCollected = 0;
            player = {x: 50, y: 350, vx: 0, vy: 0, w: 30, h: 40, onGround: false, facing: 1};
            platforms = [
                {x:0, y:420, w:800, h:30},
                {x:150, y:340, w:120, h:20},
                {x:350, y:280, w:100, h:20},
                {x:500, y:350, w:150, h:20},
                {x:680, y:280, w:100, h:20},
                {x:200, y:200, w:100, h:20},
                {x:400, y:150, w:120, h:20},
                {x:600, y:180, w:100, h:20},
            ];
            coins = [];
            const coinPositions = [[180,310],[380,250],[530,320],[710,250],[230,170],[430,120],[630,150],
                [100,390],[300,390],[500,390],[700,390],[150,240],[350,190],[550,310],[250,130],[450,100],[650,140],[80,350],[400,300],[600,250]];
            coinPositions.slice(0, 15 + lvl * 2).forEach(p => coins.push({x:p[0], y:p[1], r:10, collected:false}));
            enemies = [];
            for (let i = 0; i < 2 + lvl; i++) {
                enemies.push({x: 300 + i * 150, y: 400, vx: (i%2?1:-1) * (2 + lvl * 0.5), w: 30, h: 30, alive: true});
            }
            lives = 3;
            updateUI();
        }

        function updateUI() {
            document.getElementById('coins').textContent = coinsCollected;
            document.getElementById('lives').textContent = lives;
            document.getElementById('level').textContent = level;
        }

        const keys = {};
        document.addEventListener('keydown', e => { keys[e.key] = true; if(e.key===' ') e.preventDefault(); });
        document.addEventListener('keyup', e => keys[e.key] = false);

        document.getElementById('btnLeft').addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowLeft'] = true; });
        document.getElementById('btnLeft').addEventListener('touchend', () => keys['ArrowLeft'] = false);
        document.getElementById('btnRight').addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowRight'] = true; });
        document.getElementById('btnRight').addEventListener('touchend', () => keys['ArrowRight'] = false);
        document.getElementById('btnJump').addEventListener('touchstart', e => { e.preventDefault(); keys[' '] = true; });
        document.getElementById('btnJump').addEventListener('touchend', () => keys[' '] = false);

        function update() {
            player.vx = 0;
            if (keys['ArrowLeft'] || keys['a']) { player.vx = -SPEED; player.facing = -1; }
            if (keys['ArrowRight'] || keys['d']) { player.vx = SPEED; player.facing = 1; }
            if ((keys[' '] || keys['ArrowUp'] || keys['w']) && player.onGround) player.vy = JUMP;

            player.vy += GRAVITY;
            player.x += player.vx;
            player.y += player.vy;
            player.onGround = false;

            platforms.forEach(p => {
                if (player.x + player.w > p.x && player.x < p.x + p.w &&
                    player.y + player.h > p.y && player.y + player.h < p.y + p.h + 15 && player.vy >= 0) {
                    player.y = p.y - player.h;
                    player.vy = 0;
                    player.onGround = true;
                }
            });

            if (player.y > 500) { lives--; updateUI(); if(lives<=0) initLevel(1); else { player.x=50; player.y=350; player.vy=0; } }

            coins.forEach(c => {
                if (!c.collected && Math.hypot(player.x+15-c.x, player.y+20-c.y) < 25) {
                    c.collected = true;
                    coinsCollected++;
                    updateUI();
                }
            });

            enemies.forEach(e => {
                if (!e.alive) return;
                e.x += e.vx;
                if (e.x < 0 || e.x > 770) e.vx *= -1;
                if (player.x+player.w > e.x && player.x < e.x+e.w && player.y+player.h > e.y && player.y < e.y+e.h) {
                    if (player.vy > 0 && player.y + player.h < e.y + e.h/2) {
                        e.alive = false;
                        player.vy = JUMP;
                    } else {
                        lives--;
                        updateUI();
                        if(lives<=0) initLevel(1);
                        else { player.x=50; player.y=350; player.vy=0; }
                    }
                }
            });

            if (coins.every(c => c.collected)) { initLevel(level + 1); }
        }

        function draw() {
            ctx.fillStyle = '#0d1117';
            ctx.fillRect(0, 0, 800, 450);

            platforms.forEach(p => {
                ctx.fillStyle = '#30363d';
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.fillStyle = '#3b82f6';
                ctx.fillRect(p.x, p.y, p.w, 3);
            });

            coins.forEach(c => {
                if (c.collected) return;
                ctx.fillStyle = '#fbbf24';
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#92400e';
                ctx.font = '12px sans-serif';
                ctx.fillText('$', c.x-4, c.y+4);
            });

            enemies.forEach(e => {
                if (!e.alive) return;
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(e.x, e.y, e.w, e.h);
                ctx.fillStyle = '#fff';
                ctx.fillRect(e.x+8, e.y+8, 5, 5);
                ctx.fillRect(e.x+18, e.y+8, 5, 5);
            });

            ctx.fillStyle = '#22c55e';
            ctx.fillRect(player.x, player.y, player.w, player.h);
            ctx.fillStyle = '#166534';
            ctx.fillRect(player.x + (player.facing>0?20:5), player.y+8, 6, 6);
            ctx.fillRect(player.x + (player.facing>0?20:5)+10, player.y+8, 6, 6);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        initLevel(1);
        gameLoop();
    </script>
<script src="../i18n.js" defer></script>
</body>
</html>
