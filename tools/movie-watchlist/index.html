<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 电影清单</title>
<meta property="og:title" content="🎬 电影清单">
<meta property="og:description" content="🎬 电影清单 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="管理你的电影观影清单，记录评分和观影心得">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1}.ctn{padding:0}}
.li{padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;color:#fff;margin-right:4px}
.tag.want{background:var(--accent)}.tag.watched{background:var(--success)}.tag.liked{background:var(--warn)}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
.gr .st{text-align:center;padding:12px;background:var(--bg);border-radius:8px}
.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-bar button{padding:6px 14px;font-size:.85rem;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:20px;cursor:pointer}
.filter-bar button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.stars{color:var(--warn);cursor:pointer;font-size:1.1rem;letter-spacing:2px}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🎬 电影清单</h1><p>管理你的观影清单</p></div>

<div class="gr" id="stats">
<div class="st"><div class="nm" id="sTotal">0</div><div class="lb">总电影</div></div>
<div class="st"><div class="nm" id="sWatched">0</div><div class="lb">已看</div></div>
<div class="st"><div class="nm" id="sWant">0</div><div class="lb">想看</div></div>
<div class="st"><div class="nm" id="sAvg">-</div><div class="lb">平均评分</div></div>
</div>

<div class="cd" style="margin-top:16px"><h2>添加电影</h2>
<div class="fr">
<div><label>电影名</label><input type="text" id="mTitle" placeholder="电影名称"></div>
<div><label>导演</label><input type="text" id="mDirector" placeholder="导演"></div>
</div>
<div class="fr">
<div><label>年份</label><input type="number" id="mYear" placeholder="2024"></div>
<div><label>类型</label><input type="text" id="mGenre" placeholder="动作、喜剧..."></div>
</div>
<label>评分 (1-10)</label><input type="number" id="mRating" min="1" max="10" placeholder="1-10">
<label>短评</label><textarea id="mComment" placeholder="你的观影感受..."></textarea>
<div class="bg"><button onclick="addMovie()">添加电影</button></div>
<div id="mMsg" style="display:none;text-align:center;padding:8px;border-radius:8px;margin-top:8px;font-size:.85rem"></div></div>

<div class="cd"><h2>我的清单</h2>
<div class="filter-bar">
<button class="active" onclick="setFilter('all',this)">全部</button>
<button onclick="setFilter('want',this)">想看</button>
<button onclick="setFilter('watched',this)">已看</button>
<button onclick="setFilter('liked',this)">喜欢</button>
</div>
<div id="movieList" class="es">暂无电影</div>
</div>
</div>

<script>
let movies=JSON.parse(localStorage.getItem('movieWatchlist')||'[]');
let filter='all';
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function save(){localStorage.setItem('movieWatchlist',JSON.stringify(movies))}
function showMsg(m,t){const e=$('mMsg');e.textContent=m;e.style.display='block';e.style.background=t==='error'?'rgba(239,68,68,.15)':'rgba(34,197,94,.15)';e.style.color=t==='error'?'var(--danger)':'var(--success)';setTimeout(()=>e.style.display='none',2000)}
function addMovie(){const title=$('mTitle').value.trim(),director=$('mDirector').value.trim(),year=$('mYear').value,genre=$('mGenre').value.trim(),rating=parseInt($('mRating').value),comment=$('mComment').value.trim();if(!title){showMsg('请填写电影名','error');return}movies.push({title,director,year,genre,rating:rating||0,comment,status:'want',addedAt:Date.now()});save();render();showMsg('电影已添加','success');['mTitle','mDirector','mYear','mGenre','mRating','mComment'].forEach(id=>$(id).value='')}
function setFilter(f,el){filter=f;document.querySelectorAll('.filter-bar button').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()}
function render(){const list=filter==='all'?movies:movies.filter(m=>m.status===filter);const rated=movies.filter(m=>m.rating>0);$('sTotal').textContent=movies.length;$('sWatched').textContent=movies.filter(m=>m.status==='watched'||m.status==='liked').length;$('sWant').textContent=movies.filter(m=>m.status==='want').length;$('sAvg').textContent=rated.length?(rated.reduce((s,m)=>s+m.rating,0)/rated.length).toFixed(1):'-';$('movieList').innerHTML=list.length?list.map((m,i)=>{const realIdx=movies.indexOf(m);const stars=m.rating?'★'.repeat(Math.min(5,Math.ceil(m.rating/2)))+'☆'.repeat(5-Math.min(5,Math.ceil(m.rating/2))):'未评分';const statusMap={want:'想看',watched:'已看',liked:'喜欢'};return '<div class="li"><div style="display:flex;justify-content:space-between;align-items:center"><div><span style="font-weight:600">'+esc(m.title)+'</span>'+(m.director?' <span style="color:var(--text2)">· '+esc(m.director)+'</span>':'')+(m.year?' <span style="color:var(--text2)">('+esc(m.year)+')</span>':'')+'<br><span class="tag '+m.status+'">'+statusMap[m.status]+'</span>'+(m.genre?'<span style="color:var(--text2);font-size:.8rem;margin-left:4px">'+esc(m.genre)+'</span>':'')+'</div><div style="text-align:right"><div style="color:var(--warn)">'+stars+'</div><div style="font-size:.8rem;color:var(--text2)">'+m.rating+'/10</div></div></div>'+(m.comment?'<div style="font-size:.85rem;color:var(--text2);margin-top:6px;font-style:italic">"'+esc(m.comment)+'"</div>':'')+'<div class="bg"><button class="sec" style="padding:4px 12px;font-size:.8rem" onclick="cycleStatus('+realIdx+')">切换状态</button><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="removeMovie('+realIdx+')">删除</button></div></div>'}).join(''):'<div class="es">暂无电影</div>'}
function removeMovie(i){movies.splice(i,1);save();render()}
function cycleStatus(i){const order=['want','watched','liked'];const cur=order.indexOf(movies[i].status);movies[i].status=order[(cur+1)%order.length];save();render()}
render()
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
