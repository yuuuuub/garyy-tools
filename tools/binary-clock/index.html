<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⏰ 二进制时钟</title>
<meta property="og:title" content="⏰ 二进制时钟">
<meta property="og:description" content="⏰ 二进制时钟 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线二进制时钟 - 以二进制方式显示当前时间，科技感十足的桌面时钟">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏰</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#3b82f6;--green:#238636;--red:#ef4444;--bg-primary:#f8fafc;--bg-card:#ffffff;--bg-input:#f1f5f9;--text-primary:#1e293b;--text-secondary:#64748b;--text-muted:#94a3b8;--border:#e2e8f0;--accent:#3b82f6;--accent-hover:#2563eb;--accent-light:#dbeafe;--danger:#ef4444;--success:#22c55e;--shadow-lg:0 10px 15px -3px rgba(0,0,0,.1);--radius:12px;--radius-sm:8px;--transition:.2s ease}
[data-theme="dark"]{--bg-primary:#0f172a;--bg-card:#1e293b;--bg-input:#334155;--text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;--border:#334155;--accent:#3b82f6;--accent-hover:#60a5fa;--danger:#f87171;--success:#4ade80}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.container{width:100%;max-width:480px;background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:24px 20px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
h1{font-size:1.4rem;font-weight:700}
.theme-btn{background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;cursor:pointer;font-size:1.1rem}
.clock{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px 0}
.time-display{font-size:3rem;font-weight:700;font-family:'Courier New',monospace;letter-spacing:4px}
.binary-row{display:flex;align-items:center;gap:12px}
.binary-row .label{width:30px;text-align:right;font-size:.8rem;color:var(--text-secondary);font-weight:600}
.dots{display:flex;gap:8px}
.dot{width:36px;height:36px;border-radius:50%;background:var(--bg-input);border:2px solid var(--border);transition:all .3s;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--text-muted)}
.dot.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 12px var(--accent)}
.separator{width:36px;text-align:center;font-size:1.5rem;color:var(--text-muted);align-self:flex-end;padding-bottom:6px}
.labels{display:flex;gap:8px;margin-top:8px}
.label-row{width:36px;text-align:center;font-size:.7rem;color:var(--text-muted);font-weight:600}
.legend{margin-top:24px;padding:16px;background:var(--bg-input);border-radius:var(--radius-sm)}
.legend h3{font-size:.9rem;margin-bottom:8px;color:var(--text-secondary)}
.legend-row{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:.8rem;color:var(--text-muted)}
.legend-dot{width:12px;height:12px;border-radius:50%}
.legend-dot.on{background:var(--accent)}
.legend-dot.off{background:var(--bg-input);border:1px solid var(--border)}
.mode-toggle{display:flex;gap:8px;margin-top:16px}
.mode-btn{flex:1;padding:8px;border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-input);color:var(--text-primary);font-size:.85rem;font-weight:600;cursor:pointer;text-align:center;transition:all var(--transition)}
.mode-btn.active{border-color:var(--accent);background:var(--accent-light);color:var(--accent)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
<header>
<h1>⏰ 二进制时钟</h1>
<button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
</header>

<div class="mode-toggle">
<div class="mode-btn active" onclick="setMode('24',this)">24小时制</div>
<div class="mode-btn" onclick="setMode('12',this)">12小时制</div>
</div>

<div class="clock" id="clock">
<div class="time-display" id="digitalTime">00:00:00</div>
</div>

<div class="legend">
<h3>图例说明</h3>
<div class="legend-row"><span class="legend-dot on"></span> 点亮 = 1</div>
<div class="legend-row"><span class="legend-dot off"></span> 熄灭 = 0</div>
<p style="font-size:.8rem;color:var(--text-muted);margin-top:8px">每一行代表一个二进制位，从上到下依次为 32, 16, 8, 4, 2, 1</p>
</div>
</div>

<script src="../i18n.js" defer></script>
<script>
function toggleTheme(){
const t=document.documentElement.dataset.theme==='dark'?'light':'dark';
document.documentElement.dataset.theme=t;
document.getElementById('themeBtn').textContent=t==='dark'?'☀️':'🌙';
}

let mode='24';

function setMode(m,el){
mode=m;
document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
el.classList.add('active');
}

function toBinary(n,digits){
return n.toString(2).padStart(digits,'0');
}

function updateClock(){
const now=new Date();
let h=now.getHours();
let period='';
if(mode==='12'){
period=h>=12?' PM':' AM';
h=h%12||12;
}
const m=now.getMinutes();
const s=now.getSeconds();

document.getElementById('digitalTime').textContent=
String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+(mode==='12'?period:'');

const clock=document.getElementById('clock');
// Remove old binary rows
clock.querySelectorAll('.binary-row').forEach(r=>r.remove());

const units=[
{val:h,label:'H',bits:mode==='24'?6:5},
{val:m,label:'M',bits:6},
{val:s,label:'S',bits:6}
];

units.forEach((u,idx)=>{
const row=document.createElement('div');
row.className='binary-row';
const bin=toBinary(u.val,u.bits);

const labelEl=document.createElement('div');
labelEl.className='label';
labelEl.textContent=u.label;
row.appendChild(labelEl);

const dotsContainer=document.createElement('div');
dotsContainer.className='dots';

const bitValues=[Math.pow(2,u.bits-1)];
for(let i=u.bits-2;i>=0;i--)bitValues.push(Math.pow(2,i));

for(let i=0;i<u.bits;i++){
const dot=document.createElement('div');
dot.className='dot'+(bin[i]==='1'?' on':'');
dot.textContent=bin[i];
dot.title=bitValues[i];
dotsContainer.appendChild(dot);
}

row.appendChild(dotsContainer);
clock.appendChild(row);

if(idx<2){
const sep=document.createElement('div');
sep.className='separator';
sep.textContent=':';
sep.style.width='100%';
sep.style.textAlign='center';
// Insert after this row
row.after(sep);
}
});
}

updateClock();
setInterval(updateClock,1000);
</script>
</body>
</html>
