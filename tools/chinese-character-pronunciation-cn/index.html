<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汉字发音指南 - 在线汉字拼音学习</title>
<meta property="og:title" content="汉字发音指南 - 在线汉字拼音学习">
<meta property="og:description" content="汉字发音指南 - 在线汉字拼音学习 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="汉字发音指南 - 学习汉字发音，支持拼音标注、声调练习和发音测试">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔊</text></svg>">
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text2: #8b949e;
  --blue: #3b82f6;
  --green: #238636;
  --red: #ef4444;
  --radius: 10px;
  --transition: 0.2s ease;
}
[data-theme="light"] {
  --bg: #f6f8fa;
  --card: #fff;
  --border: #d0d7de;
  --text: #1f2328;
  --text2: #656d76;
  --blue: #0969da;
  --green: #1a7f37;
  --red: #cf222e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;
  min-height: 100vh;
  padding: 16px;
}
.container { max-width: 800px; margin: auto; }
h1 { text-align: center; padding: 24px 0 8px; font-size: 1.5rem; }
.sub { text-align: center; color: var(--text2); font-size: .85rem; margin-bottom: 20px; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}
.btn {
  display: inline-block;
  padding: 10px 24px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: .9rem;
  margin-top: 12px;
  transition: var(--transition);
}
.btn:hover { opacity: .85; }
.btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.btn-secondary { background: var(--border); color: var(--text); }
.char-display {
  text-align: center;
  margin: 20px 0;
}
.char-main {
  font-size: 8rem;
  line-height: 1;
  margin-bottom: 10px;
}
.char-pinyin {
  font-size: 2rem;
  color: var(--blue);
  margin-bottom: 5px;
}
.char-meaning {
  font-size: 1rem;
  color: var(--text2);
}
.pronunciation-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: 16px 0;
}
.pron-item {
  padding: 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
}
.pron-item:hover {
  border-color: var(--blue);
  background: var(--card);
}
.pron-item.active {
  border-color: var(--blue);
  background: rgba(59,130,246,0.1);
}
.pron-char {
  font-size: 1.5rem;
  margin-bottom: 4px;
}
.pron-pinyin {
  font-size: .85rem;
  color: var(--blue);
}
.tone-display {
  display: flex;
  gap: 16px;
  justify-content: center;
  margin: 16px 0;
}
.tone-card {
  padding: 12px 20px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
}
.tone-card:hover {
  border-color: var(--blue);
}
.tone-card.active {
  border-color: var(--blue);
  background: rgba(59,130,246,0.1);
}
.tone-number {
  font-size: 1.5rem;
  font-weight: bold;
  color: var(--blue);
}
.tone-name {
  font-size: .8rem;
  color: var(--text2);
  margin-top: 4px;
}
.tone-mark {
  font-size: 1.2rem;
  margin-top: 4px;
}
.search-input {
  width: 100%;
  padding: 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 1rem;
  color: var(--text);
  margin-bottom: 16px;
}
.search-input:focus {
  outline: none;
  border-color: var(--blue);
}
.results-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  margin: 16px 0;
}
.result-item {
  padding: 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
}
.result-item:hover {
  border-color: var(--blue);
  background: var(--card);
}
.result-char {
  font-size: 1.5rem;
}
.result-pinyin {
  font-size: .75rem;
  color: var(--blue);
}
.category-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.category-tab {
  padding: 8px 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-size: .85rem;
  transition: var(--transition);
}
.category-tab:hover {
  border-color: var(--blue);
}
.category-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.quiz-area {
  text-align: center;
  margin: 20px 0;
}
.quiz-char {
  font-size: 6rem;
  margin: 20px 0;
}
.quiz-options {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  max-width: 400px;
  margin: 0 auto;
}
.quiz-option {
  padding: 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-size: 1rem;
  transition: var(--transition);
}
.quiz-option:hover {
  border-color: var(--blue);
  background: var(--card);
}
.quiz-option.correct {
  background: rgba(35,134,54,0.2);
  border-color: var(--green);
  color: var(--green);
}
.quiz-option.wrong {
  background: rgba(239,68,68,0.2);
  border-color: var(--red);
  color: var(--red);
}
.score-display {
  text-align: center;
  font-size: 1.1rem;
  margin: 16px 0;
}
.history {
  margin-top: 16px;
}
.history-item {
  display: flex;
  justify-content: space-between;
  padding: 8px;
  border-bottom: 1px solid var(--border);
  font-size: .85rem;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
body, .container { animation: fadeIn .4s ease-out; }
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999">
  <a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a>
</div>
<div class="container">
  <h1>🔊 汉字发音指南</h1>
  <p class="sub">学习汉字发音，支持拼音标注、声调练习和发音测试</p>

  <div class="card">
    <input type="text" class="search-input" id="searchInput" placeholder="搜索汉字或拼音...">
    <div class="btn-group">
      <button class="btn" onclick="searchChar()">搜索</button>
      <button class="btn btn-secondary" onclick="randomChar()">随机汉字</button>
      <button class="btn btn-secondary" onclick="startQuiz()">开始测试</button>
      <button class="btn btn-secondary" onclick="toggleTheme()">🌓 切换主题</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">声调练习</h3>
    <div class="tone-display">
      <div class="tone-card" onclick="selectTone(1)">
        <div class="tone-number">1</div>
        <div class="tone-name">阴平</div>
        <div class="tone-mark">ā</div>
      </div>
      <div class="tone-card" onclick="selectTone(2)">
        <div class="tone-number">2</div>
        <div class="tone-name">阳平</div>
        <div class="tone-mark">á</div>
      </div>
      <div class="tone-card" onclick="selectTone(3)">
        <div class="tone-number">3</div>
        <div class="tone-name">上声</div>
        <div class="tone-mark">ǎ</div>
      </div>
      <div class="tone-card" onclick="selectTone(4)">
        <div class="tone-number">4</div>
        <div class="tone-name">去声</div>
        <div class="tone-mark">à</div>
      </div>
      <div class="tone-card" onclick="selectTone(5)">
        <div class="tone-number">5</div>
        <div class="tone-name">轻声</div>
        <div class="tone-mark">a</div>
      </div>
    </div>
  </div>

  <div class="card" id="charCard">
    <div class="char-display">
      <div class="char-main" id="charMain">永</div>
      <div class="char-pinyin" id="charPinyin">yǒng</div>
      <div class="char-meaning" id="charMeaning">永远、永久</div>
    </div>
    <div class="btn-group" style="justify-content:center">
      <button class="btn" onclick="speakChar()">🔊 发音</button>
      <button class="btn btn-secondary" onclick="prevChar()">← 上一个</button>
      <button class="btn btn-secondary" onclick="nextChar()">下一个 →</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">分类学习</h3>
    <div class="category-tabs" id="categoryTabs"></div>
    <div class="pronunciation-grid" id="pronGrid"></div>
  </div>

  <div class="card" id="quizCard" style="display:none">
    <h3 style="margin-bottom:12px">发音测试</h3>
    <div class="quiz-area">
      <div class="quiz-char" id="quizChar">龙</div>
      <div class="quiz-options" id="quizOptions"></div>
      <div class="score-display">得分: <span id="quizScore">0</span> / <span id="quizTotal">0</span></div>
      <button class="btn" onclick="nextQuiz()">下一题</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">搜索结果</h3>
    <div class="results-grid" id="resultsGrid"></div>
  </div>

  <div class="card history" id="historyCard" style="display:none">
    <h3 style="margin-bottom:12px">学习记录</h3>
    <div id="history"></div>
  </div>
</div>

<script src="../i18n.js" defer></script>
<script>
var characters = [
  {char:'永',pinyin:'yǒng',meaning:'永远、永久',tone:3,category:'基础'},
  {char:'一',pinyin:'yī',meaning:'一个',tone:1,category:'数字'},
  {char:'二',pinyin:'èr',meaning:'两个',tone:4,category:'数字'},
  {char:'三',pinyin:'sān',meaning:'三个',tone:1,category:'数字'},
  {char:'四',pinyin:'sì',meaning:'四个',tone:4,category:'数字'},
  {char:'五',pinyin:'wǔ',meaning:'五个',tone:3,category:'数字'},
  {char:'六',pinyin:'liù',meaning:'六个',tone:4,category:'数字'},
  {char:'七',pinyin:'qī',meaning:'七个',tone:1,category:'数字'},
  {char:'八',pinyin:'bā',meaning:'八个',tone:1,category:'数字'},
  {char:'九',pinyin:'jiǔ',meaning:'九个',tone:3,category:'数字'},
  {char:'十',pinyin:'shí',meaning:'十个',tone:2,category:'数字'},
  {char:'大',pinyin:'dà',meaning:'大的',tone:4,category:'形容词'},
  {char:'小',pinyin:'xiǎo',meaning:'小的',tone:3,category:'形容词'},
  {char:'多',pinyin:'duō',meaning:'很多',tone:1,category:'形容词'},
  {char:'少',pinyin:'shǎo',meaning:'很少',tone:3,category:'形容词'},
  {char:'上',pinyin:'shàng',meaning:'上面',tone:4,category:'方位'},
  {char:'下',pinyin:'xià',meaning:'下面',tone:4,category:'方位'},
  {char:'人',pinyin:'rén',meaning:'人类',tone:2,category:'自然'},
  {char:'口',pinyin:'kǒu',meaning:'嘴巴',tone:3,category:'身体'},
  {char:'日',pinyin:'rì',meaning:'太阳',tone:4,category:'自然'},
  {char:'月',pinyin:'yuè',meaning:'月亮',tone:4,category:'自然'},
  {char:'水',pinyin:'shuǐ',meaning:'水',tone:3,category:'自然'},
  {char:'火',pinyin:'huǒ',meaning:'火',tone:3,category:'自然'},
  {char:'木',pinyin:'mù',meaning:'树木',tone:4,category:'自然'},
  {char:'金',pinyin:'jīn',meaning:'金属',tone:1,category:'自然'},
  {char:'土',pinyin:'tǔ',meaning:'泥土',tone:3,category:'自然'},
  {char:'山',pinyin:'shān',meaning:'山',tone:1,category:'自然'},
  {char:'石',pinyin:'shí',meaning:'石头',tone:2,category:'自然'},
  {char:'田',pinyin:'tián',meaning:'田地',tone:2,category:'自然'},
  {char:'王',pinyin:'wáng',meaning:'国王',tone:2,category:'人物'},
  {char:'马',pinyin:'mǎ',meaning:'马',tone:3,category:'动物'},
  {char:'鸟',pinyin:'niǎo',meaning:'鸟',tone:3,category:'动物'},
  {char:'鱼',pinyin:'yú',meaning:'鱼',tone:2,category:'动物'},
  {char:'牛',pinyin:'niú',meaning:'牛',tone:2,category:'动物'},
  {char:'羊',pinyin:'yáng',meaning:'羊',tone:2,category:'动物'},
  {char:'竹',pinyin:'zhú',meaning:'竹子',tone:2,category:'植物'},
  {char:'米',pinyin:'mǐ',meaning:'大米',tone:3,category:'食物'},
  {char:'麦',pinyin:'mài',meaning:'小麦',tone:4,category:'植物'},
  {char:'豆',pinyin:'dòu',meaning:'豆子',tone:4,category:'食物'},
  {char:'车',pinyin:'chē',meaning:'车',tone:1,category:'交通'},
  {char:'门',pinyin:'mén',meaning:'门',tone:2,category:'建筑'}
];

var currentIndex = 0;
var currentTone = 0;
var currentCategory = '全部';
var quizMode = false;
var quizScore = 0;
var quizTotal = 0;
var history = [];
var categories = ['全部','数字','形容词','方位','自然','身体','人物','动物','植物','食物','交通','建筑'];

function init() {
  renderCategories();
  renderPronGrid();
  setupSearch();
}

function renderCategories() {
  var html = '';
  categories.forEach(function(cat) {
    var cls = 'category-tab' + (cat === currentCategory ? ' active' : '');
    html += '<div class="' + cls + '" onclick="selectCategory(\'' + cat + '\')">' + cat + '</div>';
  });
  document.getElementById('categoryTabs').innerHTML = html;
}

function selectCategory(cat) {
  currentCategory = cat;
  renderCategories();
  renderPronGrid();
}

function renderPronGrid() {
  var filtered = currentCategory === '全部' ? characters : characters.filter(function(c) { return c.category === currentCategory; });
  if(currentTone > 0) {
    filtered = filtered.filter(function(c) { return c.tone === currentTone; });
  }
  var html = '';
  filtered.forEach(function(c, i) {
    html += '<div class="pron-item" onclick="showChar(' + characters.indexOf(c) + ')">';
    html += '<div class="pron-char">' + c.char + '</div>';
    html += '<div class="pron-pinyin">' + c.pinyin + '</div>';
    html += '</div>';
  });
  document.getElementById('pronGrid').innerHTML = html;
}

function selectTone(tone) {
  currentTone = currentTone === tone ? 0 : tone;
  document.querySelectorAll('.tone-card').forEach(function(card, i) {
    card.classList.toggle('active', i + 1 === currentTone);
  });
  renderPronGrid();
}

function showChar(index) {
  currentIndex = index;
  var c = characters[index];
  document.getElementById('charMain').textContent = c.char;
  document.getElementById('charPinyin').textContent = c.pinyin;
  document.getElementById('charMeaning').textContent = c.meaning;
  addToHistory(c);
}

function prevChar() {
  currentIndex = (currentIndex - 1 + characters.length) % characters.length;
  showChar(currentIndex);
}

function nextChar() {
  currentIndex = (currentIndex + 1) % characters.length;
  showChar(currentIndex);
}

function speakChar() {
  var c = characters[currentIndex];
  if('speechSynthesis' in window) {
    var utterance = new SpeechSynthesisUtterance(c.char);
    utterance.lang = 'zh-CN';
    utterance.rate = 0.8;
    speechSynthesis.speak(utterance);
  }
}

function randomChar() {
  var index = Math.floor(Math.random() * characters.length);
  showChar(index);
}

function setupSearch() {
  document.getElementById('searchInput').addEventListener('input', function() {
    var query = this.value.toLowerCase();
    if(!query) {
      document.getElementById('resultsGrid').innerHTML = '';
      return;
    }
    var results = characters.filter(function(c) {
      return c.char.includes(query) || c.pinyin.toLowerCase().includes(query) || c.meaning.includes(query);
    });
    var html = '';
    results.forEach(function(c) {
      html += '<div class="result-item" onclick="showChar(' + characters.indexOf(c) + ')">';
      html += '<div class="result-char">' + c.char + '</div>';
      html += '<div class="result-pinyin">' + c.pinyin + '</div>';
      html += '</div>';
    });
    document.getElementById('resultsGrid').innerHTML = html;
  });
}

function searchChar() {
  var query = document.getElementById('searchInput').value.toLowerCase();
  if(!query) return;
  var results = characters.filter(function(c) {
    return c.char.includes(query) || c.pinyin.toLowerCase().includes(query) || c.meaning.includes(query);
  });
  if(results.length > 0) {
    showChar(characters.indexOf(results[0]));
  }
}

function startQuiz() {
  quizMode = true;
  quizScore = 0;
  quizTotal = 0;
  document.getElementById('quizCard').style.display = 'block';
  nextQuiz();
}

function nextQuiz() {
  if(!quizMode) return;
  var correctIndex = Math.floor(Math.random() * characters.length);
  var correct = characters[correctIndex];
  var options = [correct];
  while(options.length < 4) {
    var randomIndex = Math.floor(Math.random() * characters.length);
    var randomChar = characters[randomIndex];
    if(!options.some(function(o) { return o.char === randomChar.char; })) {
      options.push(randomChar);
    }
  }
  options = shuffleArray(options);
  document.getElementById('quizChar').textContent = correct.char;
  var html = '';
  options.forEach(function(opt) {
    html += '<div class="quiz-option" onclick="checkAnswer(this,\'' + opt.pinyin + '\',\'' + correct.pinyin + '\')">' + opt.pinyin + '</div>';
  });
  document.getElementById('quizOptions').innerHTML = html;
}

function checkAnswer(el, selected, correct) {
  if(el.classList.contains('correct') || el.classList.contains('wrong')) return;
  quizTotal++;
  if(selected === correct) {
    el.classList.add('correct');
    quizScore++;
  } else {
    el.classList.add('wrong');
    document.querySelectorAll('.quiz-option').forEach(function(opt) {
      if(opt.textContent === correct) opt.classList.add('correct');
    });
  }
  document.getElementById('quizScore').textContent = quizScore;
  document.getElementById('quizTotal').textContent = quizTotal;
}

function addToHistory(char) {
  history.unshift({char:char.char, pinyin:char.pinyin, time:new Date().toLocaleString()});
  if(history.length > 10) history.pop();
  renderHistory();
}

function renderHistory() {
  if(history.length === 0) {
    document.getElementById('historyCard').style.display = 'none';
    return;
  }
  document.getElementById('historyCard').style.display = 'block';
  var html = '';
  history.forEach(function(h) {
    html += '<div class="history-item">';
    html += '<span>' + h.char + ' ' + h.pinyin + '</span>';
    html += '<span style="color:var(--text2)">' + h.time + '</span>';
    html += '</div>';
  });
  document.getElementById('history').innerHTML = html;
}

function shuffleArray(arr) {
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = a[i];
    a[i] = a[j];
    a[j] = temp;
  }
  return a;
}

function toggleTheme() {
  var html = document.documentElement;
  var current = html.getAttribute('data-theme');
  html.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
}

init();
</script>
</body>
</html>
