<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>肯肯数独</title>
<meta name="description" content="肯肯数独游戏，结合数学运算的逻辑填数">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--cage:#f59e0b}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
h1{font-size:1.5rem;margin-bottom:6px}
.info{color:#8b949e;margin-bottom:16px;font-size:.9rem;text-align:center;max-width:420px}
.timer{font-size:1.1rem;color:#8b949e;margin-bottom:12px}
.timer span{color:var(--accent);font-weight:700}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border:2px solid var(--accent);width:fit-content;margin-bottom:20px}
.cell{width:56px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.3rem;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:background .15s;position:relative}
.cell:hover{background:#1c2333}
.cell.selected{background:rgba(59,130,246,.25);outline:2px solid var(--accent);z-index:1}
.cell.error{color:#f87171}
.cell.fixed{color:#8b949e;font-weight:600}
.cell.user{color:var(--accent);font-weight:700}
.cell.highlight{background:rgba(59,130,246,.12)}
.cell .hint{position:absolute;top:2px;left:4px;font-size:.55rem;color:var(--cage);font-weight:700}
.cage-tl{border-top:2px solid var(--cage);border-left:2px solid var(--cage)}
.cage-tr{border-top:2px solid var(--cage);border-right:2px solid var(--cage)}
.cage-bl{border-bottom:2px solid var(--cage);border-left:2px solid var(--cage)}
.cage-br{border-bottom:2px solid var(--cage);border-right:2px solid var(--cage)}
.numpad{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
.numpad button{width:48px;height:48px;font-size:1.2rem;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;cursor:pointer;transition:all .15s}
.numpad button:hover{background:var(--accent);color:var(--text)}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.controls button{padding:8px 18px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:6px;cursor:pointer;font-size:.9rem;transition:all .15s}
.controls button:hover{background:var(--accent);color:var(--text)}
.legend{color:#8b949e;font-size:.8rem;margin-bottom:12px;text-align:center}
.win-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;justify-content:center;align-items:center}
.win-overlay.show{display:flex}
.win-box{background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:40px;text-align:center}
.win-box h2{font-size:2rem;margin-bottom:10px;color:var(--accent)}
.win-box p{color:#8b949e;margin-bottom:20px}
.win-box button{padding:10px 24px;background:var(--accent);color:var(--text);border:none;border-radius:8px;font-size:1rem;cursor:pointer}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="肯肯数独">
  <meta property="og:description" content="肯肯数独游戏，结合数学运算的逻辑填数">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/sudoku-kenken/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<h1>肯肯数独 6×6</h1>
<div class="info">每行每列1-6不重复，笼内数字通过运算得到目标值（× ÷ + -）</div>
<div class="legend">+ 加法 | − 减法 | × 乘法 | ÷ 除法</div>
<div class="timer">时间: <span id="time">00:00</span></div>
<div class="board" id="board"></div>
<div class="numpad" id="numpad"></div>
<div class="controls">
<button onclick="newGame()">新游戏</button>
<button onclick="undo()">撤销</button>
</div>
<div class="win-overlay" id="winOverlay">
<div class="win-box">
<h2>恭喜通关!</h2>
<p id="winMsg">用时</p>
<button onclick="newGame();document.getElementById('winOverlay').classList.remove('show')">再来一局</button>
</div>
</div>
<script>
const N=6;
let solution=[],grid=[],cages=[],cageMap=[],history=[],sel=null,timer=null,sec=0;

function rand(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}

function generateSolution(){
let sol=[];
for(let i=0;i<N;i++)sol[i]=Array(N).fill(0);
function valid(r,c,v){
for(let i=0;i<N;i++)if(sol[r][i]===v)return false;
for(let i=0;i<N;i++)if(sol[i][c]===v)return false;
return true;
}
function fill(pos){
if(pos===N*N)return true;
let r=Math.floor(pos/N),c=pos%N;
let nums=shuffle([1,2,3,4,5,6]);
for(let v of nums){
if(valid(r,c,v)){sol[r][c]=v;if(fill(pos+1))return true;sol[r][c]=0;}
}
return false;
}
fill(0);
return sol;
}

function generateCages(){
let map=[];
for(let i=0;i<N;i++)map[i]=Array(N).fill(-1);
let cages=[];
let id=0;
for(let i=0;i<N;i++)for(let j=0;j<N;j++){
if(map[i][j]!==-1)continue;
let cells=[[i,j]];
map[i][j]=id;
let r=i,c=j;
while(cells.length<rand(2,3)){
let dirs=[[0,1],[1,0]];
shuffle(dirs);
let found=false;
for(let[dr,dc] of dirs){
let nr=r+dr,nc=c+dc;
if(nr>=0&&nr<N&&nc>=0&&nc<N&&map[nr][nc]===-1){
cells.push([nr,nc]);map[nr][nc]=id;r=nr;c=nc;found=true;break;
}
}
if(!found)break;
}
let vals=cells.map(([cr,cc])=>solution[cr][cc]);
let op,result;
if(cells.length===2){
let ops=['+','×','-','÷'];
shuffle(ops);
for(let o of ops){
if(o==='+'||o==='×'){
op=o;result=o==='+'?vals[0]+vals[1]:vals[0]*vals[1];break;
}
if(o==='-'){
let d=Math.abs(vals[0]-vals[1]);
if(d>0){op='-';result=d;break;}
}
if(o==='÷'){
let mx=Math.max(vals[0],vals[1]),mn=Math.min(vals[0],vals[1]);
if(mn!==0&&mx%mn===0){op='÷';result=mx/mn;break;}
}
}
}
if(!op){op='+';result=vals.reduce((a,b)=>a+b,0);}
cages.push({cells,op,result});
id++;
}
return{cages,map};
}

function render(){
let b=document.getElementById('board');
b.innerHTML='';
for(let i=0;i<N;i++){
for(let j=0;j<N;j++){
let d=document.createElement('div');
d.className='cell';
let cid=cageMap[i][j];
let cage=cages[cid];
let isTL=cage.cells[0][0]===i&&cage.cells[0][1]===j;
let last=cage.cells.length-1;
let ci=cage.cells.findIndex(([r,c])=>r===i&&c===j);
if(isTL){
let hint=document.createElement('span');
hint.className='hint';
hint.textContent=cage.result+cage.op;
d.appendChild(hint);
}
if(ci===0)d.classList.add('cage-tl');
if(ci===last)d.classList.add('cage-br');
if(grid[i][j]!==0){
d.classList.add('user');d.textContent=grid[i][j];
}
if(sel){
if(sel[0]===i&&sel[1]===j)d.classList.add('selected');
else if(sel[0]===i||sel[1]===j)d.classList.add('highlight');
}
d.onclick=()=>{sel=[i,j];render()};
b.appendChild(d);
}
}
updateNumpad();
}

function updateNumpad(){
let n=document.getElementById('numpad');
n.innerHTML='';
for(let v=1;v<=6;v++){
let b=document.createElement('button');b.textContent=v;
b.onclick=()=>{
if(sel){
history.push([...sel,grid[sel[0]][sel[1]]]);
grid[sel[0]][sel[1]]=v;render();checkWin();
}
};
n.appendChild(b);
}
let clr=document.createElement('button');
clr.textContent='✕';clr.style.color='#f87171';
clr.onclick=()=>{
if(sel){
history.push([...sel,grid[sel[0]][sel[1]]]);
grid[sel[0]][sel[1]]=0;render();
}
};
n.appendChild(clr);
}

function checkWin(){
for(let i=0;i<N;i++)for(let j=0;j<N;j++){
if(grid[i][j]===0)return;
let v=grid[i][j];
for(let k=0;k<N;k++)if(k!==j&&grid[i][k]===v)return;
for(let k=0;k<N;k++)if(k!==i&&grid[k][j]===v)return;
}
for(let cage of cages){
let vals=cage.cells.map(([r,c])=>grid[r][c]).sort((a,b)=>a-b);
if(cage.op==='+'){if(vals.reduce((a,b)=>a+b,0)!==cage.result)return;}
else if(cage.op==='×'){if(vals.reduce((a,b)=>a*b,1)!==cage.result)return;}
else if(cage.op==='-'){if(Math.abs(vals[1]-vals[0])!==cage.result)return;}
else if(cage.op==='÷'){if(vals[1]/vals[0]!==cage.result)return;}
}
clearInterval(timer);
document.getElementById('winMsg').textContent='用时 '+document.getElementById('time').textContent;
document.getElementById('winOverlay').classList.add('show');
}

function newGame(){
solution=generateSolution();
let{cages:c,map:m}=generateCages();
cages=c;cageMap=m;
grid=Array.from({length:N},()=>Array(N).fill(0));
history=[];sel=null;sec=0;
if(timer)clearInterval(timer);
document.getElementById('time').textContent='00:00';
timer=setInterval(()=>{sec++;let m=String(Math.floor(sec/60)).padStart(2,'0');let s=String(sec%60).padStart(2,'0');document.getElementById('time').textContent=m+':'+s},1000);
render();
}

function undo(){
if(history.length===0)return;
let[last]=history.pop();
grid[last[0]][last[1]]=sel?grid[sel[0]][sel[1]]:0;
let prev=history.length>0?history[history.length-1]:null;
if(prev)sel=[prev[0],prev[1]];
render();
}

document.onkeydown=e=>{
if(!sel)return;
let v=parseInt(e.key);
if(v>=1&&v<=6){e.preventDefault();
history.push([...sel,grid[sel[0]][sel[1]]]);
grid[sel[0]][sel[1]]=v;render();checkWin()}
if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();
history.push([...sel,grid[sel[0]][sel[1]]]);
grid[sel[0]][sel[1]]=0;render()}
};

newGame();
}
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
