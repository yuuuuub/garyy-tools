<style>
:root{--transition:0.2s ease;--bg:#f0fdf4;--card:#fff;--text:#14532d;--text2:#16a34a;--accent:#22c55e;--gold:#f59e0b;--red:#ef4444;--blue:#3b82f6;--border:#bbf7d0;--radius:14px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
[data-theme="dark"]{--bg:#0a1a10;--card:#122018;--text:#bbf7d0;--text2:#4ade80;--border:#14532d}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16pxscroll-behavior:smooth;}
.container{max-width:520px;margin:0 auto}
header{text-align:center;padding:32px 0 20px}
header h1{font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#22c55e,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.search-wrap{position:relative;margin-bottom:16px}
.search-wrap input{width:100%;padding:12px 16px 12px 42px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-size:.9rem;outline:none;font-family:inherit}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap .s-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:1rem}
.tabs{display:flex;gap:4px;margin-bottom:14px;overflow-x:auto}
.tab{padding:7px 12px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:.75rem;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .2s}
.tab.active{background:var(--accent);color:var(--text);border-color:var(--accent)}
.term-list{display:flex;flex-direction:column;gap:6px}
.term-item{padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;font-size:.82rem;line-height:1.5}
.term-item .t-word{font-weight:800;color:var(--accent)}
.term-item .t-en{font-size:.7rem;color:var(--text2);margin-left:4px}
.term-item .t-desc{font-size:.75rem;color:var(--text2);margin-top:3px}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.7rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>

<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header><h1>⚽ 足球术语词典</h1><p>世界杯观赛必备 · 中英对照</p></header>

<div class="search-wrap">
<span class="s-icon">🔍</span>
<input type="text" id="search" placeholder="搜索足球术语...">
</div>

<div class="tabs" id="tabs">
<button class="tab active" data-c="all">全部</button>
<button class="tab" data-c="rule">📋 规则</button>
<button class="tab" data-c="tactic">🎯 战术</button>
<button class="tab" data-c="position">📍 位置</button>
<button class="tab" data-c="action">⚡ 动作</button>
<button class="tab" data-c="slang">💬 黑话</button>
</div>

<div id="termList"></div>
<footer>世界杯就要开始了 ⚽</footer>
</div>

<script>
const TERMS=[
{word:'越位',en:'Offside',cat:'rule',desc:'进攻球员在传球瞬间站在比倒数第二名防守球员更靠近球门线的位置，且参与进攻。简化版：传球时跑到了后卫前面=越位。'},
{word:'VAR',en:'Video Assistant Referee',cat:'rule',desc:'视频助理裁判。用多角度回放帮主裁判判断进球、点球、红牌、认错人四种情况。2026世界杯继续使用。'},
{word:'点球',en:'Penalty Kick',cat:'rule',desc:'禁区内防守方犯规被判罚。距离球门11米(12码)一对一射门。压力最大的判罚。'},
{word:'任意球',en:'Free Kick',cat:'rule',desc:'犯规后在犯规地点开球。直接任意球可以直接射门，间接任意球必须有第二人触球后才算进球。'},
{word:'角球',en:'Corner Kick',cat:'rule',desc:'防守方最后触球出底线，进攻方在角旗区开球。重要的进球机会。'},
{word:'加时赛',en:'Extra Time',cat:'rule',desc:'淘汰赛90分钟打平后加赛30分钟(上下半场各15分钟)。还平就点球大战。'},
{word:'伤停补时',en:'Injury Time',cat:'rule',desc:'裁判根据比赛中因伤停/换人/庆祝等浪费的时间，在每个半场末尾补回。'},
{word:'红黄牌',en:'Red/Yellow Card',cat:'rule',desc:'黄牌=警告，两黄变一红=罚下。红牌=直接罚下，球队少一人作战。2026新规：只有队长能和裁判沟通。'},
{word:'阵型',en:'Formation',cat:'tactic',desc:'球队的站位安排，如4-4-2(4后卫4中场2前锋)、4-3-3、3-5-2。第一个数字是后卫人数，最后是前锋人数。'},
{word:'高位逼抢',en:'High Press/Gegenpressing',cat:'tactic',desc:'在对方半场甚至禁区附近就开始疯狂逼抢，迫使对方失误。克洛普的标志性战术。'},
{word:'防守反击',en:'Counter Attack',cat:'tactic',desc:'主动回收防守，断球后利用对方防线前压的空档快速反击。弱队打强队的经典策略。'},
{word:'传控足球',en:'Tiki-Taka',cat:'tactic',desc:'通过大量短传控制球权消耗对手，寻找渗透机会。巴萨/西班牙的标签。'},
{word:'摆大巴',en:'Park the Bus',cat:'tactic',desc:'极致防守战术，全队缩在禁区里堵门。穆里尼奥的经典台词"我们在大巴前面停了一辆大巴"。'},
{word:'后场出球',en:'Build-up Play',cat:'tactic',desc:'从门将/后卫开始用短传组织进攻，而不是大脚开出去。现代足球的标配。'},
{word:'前锋',en:'Striker/Forward',cat:'position',desc:'最靠近对方球门的球员，主要任务是进球。中锋(支点型)、边锋(速度型)等等。'},
{word:'前腰/10号',en:'Attacking Midfielder/#10',cat:'position',desc:'中场和前锋之间的组织核心，负责传球创造机会。梅西/齐达内就是这个位置。'},
{word:'后腰/6号',en:'Defensive Midfielder/#6',cat:'position',desc:'后卫线前的屏障，负责拦截防守和分配球权。场上最累的位置之一。'},
{word:'中后卫',en:'Center Back',cat:'position',desc:'球门前的最后防线，负责对抗对方前锋和争头球。通常身材高大。'},
{word:'边后卫',en:'Full Back',cat:'position',desc:'防守两边路的球员。现代足球中也要参与进攻下底传中。'},
{word:'门将',en:'Goalkeeper',cat:'position',desc:'唯一可以用手触球的球员(但仅限禁区内)。最后一道防线。'},
{word:'帽子戏法',en:'Hat-trick',cat:'action',desc:'同一球员在一场比赛中进3个球。进2个叫"梅开二度"，进4个叫"大四喜"。'},
{word:'倒钩',en:'Bicycle Kick/Overhead Kick',cat:'action',desc:'身体腾空背对球门用脚后跟上方触球射门。最炫酷的进球方式！'},
{word:'世界波/远射',en:'Long-range Screamer',cat:'action',desc:'距离球门25米甚至更远的暴力抽射破门。力量和角度的完美结合。'},
{word:'乌龙球',en:'Own Goal',cat:'action',desc:'不小心把球踢进自家球门。最让球员崩溃的事情。算对方进球。'},
{word:'铲球',en:'Tackle/Slide Tackle',cat:'action',desc:'倒地用腿把球从对方脚下铲走。先碰到球=好铲，先碰到人=犯规+吃牌。'},
{word:'扑救/神扑',en:'Save/World-class Save',cat:'action',desc:'门将把对方的射门扑出去。好的扑救价值等于一个进球。'},
{word:'梅开二度',en:'Brace (two goals)',cat:'slang',desc:'同一球员一场比赛进2球。帽子戏法是3球，大四喜是4球，五子登科是5球。'},
{word:'大四喜',en:'Poker (four goals)',cat:'slang',desc:'同一球员一场比赛中进4个球。极其罕见。'},
{word:'闷平',en:'Goalless Draw',cat:'slang',desc:'双方踢了90分钟一个球都没进，0-0结束。最无聊的比赛类型。'},
{word:'国家德比',en:'El Clasico/Derby',cat:'slang',desc:'一个国家最顶级的两支球队之间的比赛。如巴萨vs皇马(西班牙)、曼联vs利物浦(英格兰)。'},
{word:'读秒绝杀',en:'Last-minute Winner',cat:'slang',desc:'比赛最后一分钟(伤停补时阶段)打进制胜进球。最刺激的赢球方式！'},
{word:'黑马',en:'Dark Horse',cat:'slang',desc:'赛前不被看好但表现出人意料的球队。2022年的摩洛哥就是最大黑马。'},
{word:'死亡之组',en:'Group of Death',cat:'slang',desc:'小组赛中实力最强的几支队分到同一组，至少一支强队会出局。'},
{word:'爆冷',en:'Upset',cat:'slang',desc:'强队输给弱队。2022年沙特2-1阿根廷就是经典爆冷。'},
{word:'黄牌停赛',en:'Suspension',cat:'slang',desc:'累积两张黄牌或直接红牌后，下一场比赛自动停赛。决赛前吃到黄牌=错过决赛！'},
];
let activeCat='all',searchQ='';
function render(){
let filtered=TERMS;
if(activeCat!=='all')filtered=filtered.filter(t=>t.cat===activeCat);
if(searchQ)filtered=filtered.filter(t=>t.word.includes(searchQ)||t.en.toLowerCase().includes(searchQ.toLowerCase())||t.desc.includes(searchQ));
document.getElementById('termList').innerHTML=filtered.map(t=>`
<div class="term-item">
<div class="t-word">${t.word} <span class="t-en">${t.en}</span></div>
<div class="t-desc">${t.desc}</div>
</div>`).join('')||'<div style="text-align:center;color:var(--text2);padding:40px">没找到匹配的术语</div>';
}
document.getElementById('tabs').addEventListener('click',e=>{
if(!e.target.classList.contains('tab'))return;
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
e.target.classList.add('active');
activeCat=e.target.dataset.c;
render();
});
document.getElementById('search').addEventListener('input',function(){
searchQ=this.value.toLowerCase();
render();
});
render();
</script>
<script src="../i18n.js" defer>
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
