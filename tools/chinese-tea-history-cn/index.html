<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国茶史 - History of Chinese Tea</title>
<meta name="description" content="中国茶史百科，从神农到现代，唐宋明清各朝代茶文化，茶叶传播世界，茶马古道">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国茶史 - History of Chinese Tea">
<meta property="og:description" content="中国茶史百科，从神农到现代，唐宋明清各朝代茶文化，茶叶传播世界，茶马古道">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-tea-history-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📜</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#8b6914;--accent2:#6b5010}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#92400e;--accent2:#78350f}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a1505 0%,#2a2010 50%,#3a2a15 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a4020;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#daa520,#b8860b,#cd853f,#8b6914);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.tea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.tea-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.tea-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.tea-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.tea-card .t-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.tea-card .t-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(139,105,20,0.15);color:var(--accent)}
.tea-card .t-name{font-size:1.3em;font-weight:bold}
.tea-card .t-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.tea-card .t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tea-card .t-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.tea-card .t-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.tea-card .t-detail strong{color:var(--text)}
.tea-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.tea-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>📜 中国茶史</h1>
<p>History of Chinese Tea — 五千年茶韵，一部文明史</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索茶史...（如"陆羽""唐代""茶马古道"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="远古先秦">🏛️ 远古先秦</button>
<button class="filter-btn" data-filter="唐宋元代">🏯 唐宋元代</button>
<button class="filter-btn" data-filter="明清时期">🏮 明清时期</button>
<button class="filter-btn" data-filter="近现代">🌐 近现代</button>
<button class="filter-btn" data-filter="茶道传播">🛤️ 茶道传播</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="tea-grid" id="teaGrid"></div>
<footer><p>📜 中国茶史 — 茶之为饮，发乎神农氏</p></footer>
</div>
<script>
const TEA_DATA=[
  {id:1,name:"神农尝百草",en:"Shennong Tasted Herbs",category:"远古先秦",icon:"🌿",summary:"茶的发现传说",detail:"传说神农氏（约公元前2737年）尝百草时发现了茶叶。'神农尝百草，日遇七十二毒，得荼而解之'。'荼'就是茶的古称。茶最初是作为药用植物被发现的。",origin:"《神农本草经》",usage:"中国茶文化的起源传说"},
  {id:2,name:"周代茶用",en:"Zhou Dynasty Tea Use",category:"远古先秦",icon:"🏛️",summary:"茶从药用到食用",detail:"周代（约公元前1046年）茶开始从药用转向食用和祭祀用。《周礼》记载'掌荼'官职，负责采集茶叶用于祭祀。茶在这一时期是珍贵的祭品和贡品。",origin:"《周礼》记载",usage:"茶的早期社会功能"},
  {id:3,name:"西汉茶市",en:"Western Han Tea Market",category:"远古先秦",icon:"🏪",summary:"茶叶贸易的开始",detail:"西汉王褒《僮约》记载'武阳买茶'、'烹荼尽具'，说明公元前59年四川已有茶叶市场。这是茶叶作为商品交易的最早文字记录，表明茶已进入日常生活。",origin:"王褒《僮约》",usage:"茶叶商业化的起点"},
  {id:4,name:"唐代茶经",en:"The Classic of Tea",category:"唐宋元代",icon:"📖",summary:"世界第一部茶学专著",detail:"唐代陆羽（733-804）著《茶经》，是世界上第一部茶学专著。全书三卷十章，系统论述了茶的起源、种植、采制、器具、煮饮等。陆羽被尊为'茶圣'。",origin:"唐代（约760年）",usage:"中国茶文化的奠基之作"},
  {id:5,name:"唐代煎茶法",en:"Tang Dynasty Tea Brewing",category:"唐宋元代",icon:"🫖",summary:"煮茶的时代",detail:"唐代流行煎茶法：将茶饼碾成末，放入釜中煮沸，加盐调味。讲究用水、火候和茶具。陆羽认为山水上、江水中、井水下。煎茶法体现了唐人对茶道的精致追求。",origin:"唐代茶道",usage:"唐代主流的茶饮方式"},
  {id:6,name:"宋代点茶",en:"Song Dynasty Tea Whisking",category:"唐宋元代",icon:"🍵",summary:"斗茶的盛行",detail:"宋代流行点茶法：将茶末放入盏中，用汤瓶注水，再用茶筅击拂出泡沫。斗茶比拼茶汤的色泽和泡沫的持久度。建盏（黑釉茶碗）因能衬托白色茶汤而成为宋代茶具之王。",origin:"宋代茶道",usage:"宋代最具特色的茶文化形式"},
  {id:7,name:"宋代斗茶",en:"Song Dynasty Tea Competition",category:"唐宋元代",icon:"⚔️",summary:"茶的竞技文化",detail:"斗茶是宋代茶人之间比拼茶艺的竞技活动。评判标准：一看茶汤颜色（以纯白为上），二看水痕出现时间（咬盏持久者胜）。范仲淹《和章岷从事斗茶歌》详细描述了斗茶盛况。",origin:"宋代文人传统",usage:"中国茶文化的竞技形式"},
  {id:8,name:"明代散茶革命",en:"Ming Dynasty Loose Tea Revolution",category:"明清时期",icon:"🍃",summary:"泡茶法的兴起",detail:"明太祖朱元璋废除团茶，提倡散茶。从此泡茶法（用开水直接冲泡散茶叶）取代了煎茶法和点茶法，成为主流。这一变革极大简化了饮茶方式，推动了茶的普及。",origin:"明代洪武年间",usage:"中国茶饮方式的重大转折"},
  {id:9,name:"明代紫砂壶",en:"Ming Yixing Teapots",category:"明清时期",icon:"🫖",summary:"紫砂壶的兴起",detail:"明代中期宜兴紫砂壶开始兴起。紫砂壶透气性好，适合泡散茶。时大彬等大师将紫砂壶从大壶改为小壶，适应了品茶方式的变革。紫砂壶成为最具中国特色的茶具。",origin:"明代正德年间",usage:"中国茶具文化的里程碑"},
  {id:10,name:"清代功夫茶",en:"Qing Gongfu Tea",category:"明清时期",icon:"🎎",summary:"功夫茶的成熟",detail:"清代功夫茶道在福建、广东地区成熟。以小壶小杯、精细冲泡为特点，讲究'高冲低斟'、'关公巡城'等手法。功夫茶将品茶提升为一种精致的生活艺术。",origin:"清代闽粤地区",usage:"中国最精致的茶道形式"},
  {id:11,name:"茶马古道",en:"Tea Horse Road",category:"茶道传播",icon:"🐎",summary:"千年商道",detail:"茶马古道是唐宋以来以茶马贸易为主的古代商道，连接云南、四川与西藏。马帮翻越雪山、跨过峡谷，将茶叶运往藏区换取马匹。这条道路促进了民族融合和文化交流。",origin:"唐代",usage:"中国最重要的茶叶贸易通道"},
  {id:12,name:"茶叶传日本",en:"Tea Spread to Japan",category:"茶道传播",icon:"🗾",summary:"遣唐使的贡献",detail:"唐代日本遣唐使将茶叶和饮茶方式带回日本。最澄禅师和空海大师是最早将茶种传入日本的人。经过千利休等茶道大师的发展，形成了独特的日本茶道文化。",origin:"唐代（8世纪）",usage:"中日文化交流的重要内容"},
  {id:13,name:"茶叶传欧洲",en:"Tea Spread to Europe",category:"茶道传播",icon:"⛵",summary:"海上茶路",detail:"17世纪茶叶通过海上贸易传入欧洲。荷兰东印度公司最早将中国茶叶运往欧洲。英国人对茶的狂热催生了下午茶文化，茶叶贸易甚至引发了波士顿倾茶事件，间接推动了美国独立。",origin:"17世纪",usage:"改变世界历史的饮品传播"},
  {id:14,name:"万里茶道",en:"Tea Road to Russia",category:"茶道传播",icon:"🚂",summary:"北向的茶路",detail:"万里茶道是从中国福建武夷山出发，经江西、湖北、河南、山西、内蒙古，到达俄罗斯恰克图的国际商道。全长约1.3万公里，是继丝绸之路后又一条重要的国际贸易通道。",origin:"17世纪中叶",usage:"中俄茶叶贸易的主要通道"},
  {id:15,name:"近现代茶业",en:"Modern Tea Industry",category:"近现代",icon:"🏭",summary:"茶叶的工业化",detail:"近代以来中国茶业经历了从传统手工业到现代工业化的转变。19世纪末印度和锡兰茶叶的机械化生产冲击了中国茶叶的国际地位。新中国成立后茶叶生产逐步恢复和发展。",origin:"19世纪至今",usage:"中国茶业的现代化进程"},
  {id:16,name:"中国茶申遗",en:"Chinese Tea UNESCO Heritage",category:"近现代",icon:"🏆",summary:"走向世界遗产",detail:"2022年11月，'中国传统制茶技艺及其相关习俗'被列入联合国教科文组织人类非物质文化遗产代表作名录。涵盖了绿茶、红茶、乌龙茶等六大茶类的制作技艺及各地茶俗。",origin:"2022年",usage:"中国茶文化的世界级认可"},
  {id:17,name:"乾隆与茶",en:"Emperor Qianlong and Tea",category:"明清时期",icon:"👑",summary:"皇帝的茶缘",detail:"乾隆皇帝是历史上最爱茶的皇帝之一。他六次南巡，四次到龙井品茶，并将龙井封为'御茶'。乾隆还发明了'三清茶'（用梅花、佛手、松子泡茶），体现了文人雅趣。",origin:"清代",usage:"帝王与茶文化的经典故事"},
  {id:18,name:"茶禅一味",en:"Zen and Tea",category:"唐宋元代",icon:"☯️",summary:"禅宗与茶的融合",detail:"唐代禅宗寺院形成'茶禅一味'的传统。寺院种植茶树、制作茶叶、以茶供佛、以茶待客。'吃茶去'成为禅宗公案。赵州禅师的'吃茶去'三字，蕴含深邃的禅理。",origin:"唐代禅宗",usage:"中国茶文化与宗教的融合"},
  {id:19,name:"英国下午茶",en:"British Afternoon Tea",category:"茶道传播",icon:"🫖",summary:"茶的西方化",detail:"1840年贝德福德公爵夫人首创下午茶习惯。英国下午茶搭配三层点心架（三明治、司康饼、甜点），用精美的骨瓷茶具。下午茶成为英国最具标志性的文化传统之一。",origin:"19世纪英国",usage:"茶叶西传后的文化演变"},
  {id:20,name:"茶叶之路",en:"The Tea Road",category:"茶道传播",icon:"🗺️",summary:"全球茶叶传播",detail:"茶叶从中国出发，向东传入日本、韩国，向南传入东南亚，向西经丝绸之路传入中亚和欧洲，向南经海路传入印度和斯里兰卡。茶叶成为全球第二大饮品（仅次于水）。",origin:"千年传播",usage:"中国对世界饮食文化的贡献"}
];
function renderCards(data){
  document.getElementById('teaGrid').innerHTML=data.map(t=>`
    <div class="tea-card" data-category="${t.category}">
      <div class="t-header"><div class="t-icon">${t.icon}</div><div><div class="t-name">${t.name}</div><div class="t-sub">${t.en}</div></div></div>
      <div class="t-meta"><span>${t.summary}</span><span>${t.category}</span></div>
      <div class="t-detail">${t.detail}</div>
      <div class="t-detail"><strong>来源：</strong>${t.origin}</div>
      <div class="t-detail"><strong>意义：</strong>${t.usage}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(t=>{cats[t.category]=(cats[t.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">茶史节点</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.tea-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.tea-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(TEA_DATA);renderStats(TEA_DATA);
</script>
</body>
</html>
