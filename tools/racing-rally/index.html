<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拉力赛</title>
    <meta name="description" content="拉力赛车游戏，在各种路况下挑战极限驾驶">
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --accent: #3b82f6;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            margin-bottom: 10px;
            color: #3b82f6;
        }
        .controls {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        .info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 18px;
        }
        canvas {
            border: 2px solid var(--border);
            border-radius: 8px;
            background: #1a1e24;
            max-width: 100%;
        }
        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .message {
            margin-top: 15px;
            font-size: 16px;
            color: #8b949e;
        }
    </style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="拉力赛">
  <meta property="og:description" content="拉力赛车游戏，在各种路况下挑战极限驾驶">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/racing-rally/">
</head>
<body>
    <h1>🏎️ 拉力赛</h1>
    <div class="controls">
        <div class="info">
            <span>时间: <span id="time">0.0</span>秒</span>
            <span>速度: <span id="speed">0</span>km/h</span>
            <span>检查点: <span id="checkpoints">0</span>/5</span>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div style="margin-top: 10px;">
            <button class="btn" onclick="startGame()">开始比赛</button>
            <button class="btn" onclick="resetGame()">重新开始</button>
        </div>
        <div class="message">方向键/WASD控制，砂石路面，完成5个检查点！</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const timeEl = document.getElementById('time');
        const speedEl = document.getElementById('speed');
        const checkpointsEl = document.getElementById('checkpoints');
        
        let gameRunning = false;
        let gameTime = 0;
        let lastTime = 0;
        let checkpointsPassed = 0;
        let car = { x: 400, y: 500, angle: 0, speed: 0, width: 20, height: 30, onGround: true, jumpVelocity: 0 };
        let keys = {};
        let terrain = [];
        let obstacles = [];
        let checkpointZones = [];
        
        // 初始化地形
        function initTerrain() {
            terrain = [];
            for (let i = 0; i < 20; i++) {
                terrain.push({
                    x: i * 50,
                    y: 300 + Math.sin(i * 0.5) * 100,
                    width: 50,
                    height: 200,
                    type: Math.random() < 0.3 ? 'bump' : 'flat'
                });
            }
            
            // 初始化障碍物
            obstacles = [];
            for (let i = 0; i < 10; i++) {
                obstacles.push({
                    x: 100 + i * 80,
                    y: 280 + Math.sin(i * 0.5) * 100,
                    width: 30,
                    height: 30,
                    type: Math.random() < 0.5 ? 'rock' : 'tree'
                });
            }
            
            // 初始化检查点
            checkpointZones = [];
            for (let i = 0; i < 5; i++) {
                checkpointZones.push({
                    x: 150 + i * 150,
                    y: 250 + Math.sin(i * 0.5) * 100,
                    width: 60,
                    height: 100,
                    passed: false
                });
            }
        }
        
        function drawTerrain() {
            // 砂石路面
            ctx.fillStyle = '#8b7355';
            terrain.forEach(segment => {
                ctx.fillRect(segment.x, segment.y, segment.width, segment.height);
                
                // 砂石纹理
                ctx.fillStyle = '#a08060';
                for (let i = 0; i < 5; i++) {
                    const x = segment.x + Math.random() * segment.width;
                    const y = segment.y + Math.random() * 20;
                    ctx.fillRect(x, y, 2, 2);
                }
                ctx.fillStyle = '#8b7355';
            });
            
            // 跳坡
            ctx.fillStyle = '#6b5b45';
            terrain.forEach(segment => {
                if (segment.type === 'bump') {
                    ctx.beginPath();
                    ctx.moveTo(segment.x, segment.y);
                    ctx.lineTo(segment.x + segment.width/2, segment.y - 30);
                    ctx.lineTo(segment.x + segment.width, segment.y);
                    ctx.fill();
                }
            });
        }
        
        function drawObstacles() {
            obstacles.forEach(obs => {
                if (obs.type === 'rock') {
                    ctx.fillStyle = '#666666';
                    ctx.beginPath();
                    ctx.arc(obs.x, obs.y, obs.width/2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#228b22';
                    ctx.fillRect(obs.x - 5, obs.y - 20, 10, 20);
                    ctx.fillStyle = '#006400';
                    ctx.beginPath();
                    ctx.arc(obs.x, obs.y - 25, 15, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }
        
        function drawCheckpoints() {
            checkpointZones.forEach(zone => {
                ctx.strokeStyle = zone.passed ? '#00ff00' : '#ff6b6b';
                ctx.lineWidth = 3;
                ctx.setLineDash([5, 5]);
                ctx.strokeRect(zone.x, zone.y, zone.width, zone.height);
                ctx.setLineDash([]);
                
                ctx.fillStyle = zone.passed ? 'rgba(0, 255, 0, 0.2)' : 'rgba(255, 107, 107, 0.2)';
                ctx.fillRect(zone.x, zone.y, zone.width, zone.height);
            });
        }
        
        function drawCar() {
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            
            // 拉力赛车
            ctx.fillStyle = #3b82f6;
            ctx.fillRect(-car.width/2, -car.height/2, car.width, car.height);
            
            // 车窗
            ctx.fillStyle = '#1a1e24';
            ctx.fillRect(-car.width/2 + 3, -car.height/2 + 3, car.width - 6, car.height/3);
            
            // 轮胎
            ctx.fillStyle = '#333333';
            ctx.fillRect(-car.width/2 - 3, -car.height/2 + 5, 3, 8);
            ctx.fillRect(car.width/2, -car.height/2 + 5, 3, 8);
            ctx.fillRect(-car.width/2 - 3, car.height/2 - 13, 3, 8);
            ctx.fillRect(car.width/2, car.height/2 - 13, 3, 8);
            
            ctx.restore();
        }
        
        function updateCar(deltaTime) {
            // 重力
            if (!car.onGround) {
                car.jumpVelocity += 0.5;
                car.y += car.jumpVelocity;
            }
            
            // 加速/减速
            if (keys['ArrowUp'] || keys['w']) {
                car.speed = Math.min(car.speed + 0.1, 8);
            } else if (keys['ArrowDown'] || keys['s']) {
                car.speed = Math.max(car.speed - 0.2, -3);
            } else {
                car.speed *= 0.98;
            }
            
            // 转向
            if (keys['ArrowLeft'] || keys['a']) {
                car.angle -= 0.05 * car.speed;
            }
            if (keys['ArrowRight'] || keys['d']) {
                car.angle += 0.05 * car.speed;
            }
            
            // 更新位置
            car.x += Math.sin(car.angle) * car.speed;
            car.y -= Math.cos(car.angle) * car.speed;
            
            // 地形碰撞检测
            car.onGround = false;
            terrain.forEach(segment => {
                if (car.x > segment.x && car.x < segment.x + segment.width) {
                    const groundY = segment.y;
                    if (car.y > groundY - 15) {
                        car.y = groundY - 15;
                        car.onGround = true;
                        car.jumpVelocity = 0;
                        
                        // 跳坡检测
                        if (segment.type === 'bump' && car.speed > 3) {
                            car.jumpVelocity = -8;
                            car.onGround = false;
                        }
                    }
                }
            });
            
            // 障碍物碰撞
            obstacles.forEach(obs => {
                const dx = car.x - obs.x;
                const dy = car.y - obs.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < 25) {
                    car.speed *= 0.5;
                    car.x += dx * 0.1;
                    car.y += dy * 0.1;
                }
            });
            
            // 检查点检测
            checkpointZones.forEach(zone => {
                if (!zone.passed && car.x > zone.x && car.x < zone.x + zone.width &&
                    car.y > zone.y && car.y < zone.y + zone.height) {
                    zone.passed = true;
                    checkpointsPassed++;
                    checkpointsEl.textContent = checkpointsPassed;
                    
                    if (checkpointsPassed >= 5) {
                        gameOver();
                    }
                }
            });
            
            // 边界检查
            car.x = Math.max(20, Math.min(canvas.width - 20, car.x));
            car.y = Math.max(20, Math.min(canvas.height - 20, car.y));
        }
        
        function updateGame(timestamp) {
            if (!gameRunning) return;
            
            const deltaTime = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            
            gameTime += deltaTime;
            timeEl.textContent = gameTime.toFixed(1);
            speedEl.textContent = Math.abs(Math.round(car.speed * 20));
            
            updateCar(deltaTime);
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawTerrain();
            drawCheckpoints();
            drawObstacles();
            drawCar();
            
            requestAnimationFrame(updateGame);
        }
        
        function gameOver() {
            gameRunning = false;
            alert('比赛完成！用时: ' + gameTime.toFixed(1) + '秒');
        }
        
        function startGame() {
            if (gameRunning) return;
            
            car = { x: 400, y: 500, angle: 0, speed: 0, width: 20, height: 30, onGround: true, jumpVelocity: 0 };
            gameTime = 0;
            checkpointsPassed = 0;
            
            initTerrain();
            
            timeEl.textContent = '0.0';
            speedEl.textContent = '0';
            checkpointsEl.textContent = '0';
            
            gameRunning = true;
            lastTime = performance.now();
            requestAnimationFrame(updateGame);
        }
        
        function resetGame() {
            gameRunning = false;
            car = { x: 400, y: 500, angle: 0, speed: 0, width: 20, height: 30, onGround: true, jumpVelocity: 0 };
            gameTime = 0;
            checkpointsPassed = 0;
            
            initTerrain();
            
            timeEl.textContent = '0.0';
            speedEl.textContent = '0';
            checkpointsEl.textContent = '0';
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawTerrain();
            drawCar();
        }
        
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // 初始绘制
        initTerrain();
        drawTerrain();
        drawCar();
    </script>
<script src="../i18n.js"></script>
</body>
</html>
