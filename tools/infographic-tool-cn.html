<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信息图工具 - 数据可视化设计</title>
<meta name="description" content="信息图设计工具，创建柱状图、饼图、流程图、时间线等数据可视化图表">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<script src="i18n.js" defer></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--text2:#94a3b8;--accent:#10b981;--accent2:#34d399;--green:#22c55e;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f8fafc;--card:#ffffff;--border:#e2e8f0;--text:#1e293b;--text2:#64748b;--accent:#059669;--accent2:#10b981;--green:#16a34a;--red:#dc2626}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);margin:0;padding:20px}
.container{max-width:1100px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.topbar h1{margin:0;font-size:1.2rem}
.topbar .spacer{flex:1}
.topbar button{background:var(--bg);color:var(--text);border:1px solid var(--border);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit}
.topbar button:hover{border-color:var(--accent)}
.topbar button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;background:var(--card);transition:all .2s}
.tab:hover{border-color:var(--accent)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:1rem}
.chart-area{width:100%;min-height:350px;background:var(--bg);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.chart-area canvas{max-width:100%;max-height:350px}
.data-editor{margin-top:16px}
.data-table{width:100%;border-collapse:collapse}
.data-table th,.data-table td{padding:6px 10px;border:1px solid var(--border);font-size:.85rem;text-align:left}
.data-table th{background:var(--bg);font-size:.75rem;color:var(--text2);text-transform:uppercase}
.data-table input{width:100%;padding:4px 8px;background:var(--card);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:.85rem;box-sizing:border-box}
.data-table input:focus{outline:none;border-color:var(--accent)}
.data-table input[type="color"]{width:40px;height:28px;padding:2px;cursor:pointer}
.data-table .del{color:var(--red);cursor:pointer;font-size:.8rem}
.controls{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.controls label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.controls select,.controls input{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;box-sizing:border-box}
.controls select:focus,.controls input:focus{outline:none;border-color:var(--accent)}
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}
.stat-card .val{font-size:1.5rem;font-weight:700;color:var(--accent)}
.stat-card .label{font-size:.75rem;color:var(--text2);margin-top:4px}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.container{animation:fadeIn .3s ease-out}
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h1>📊 信息图工具</h1>
    <div class="spacer"></div>
    <button onclick="exportPNG()">导出 PNG</button>
    <button onclick="exportSVG()">导出 SVG</button>
    <button onclick="exportData()">导出数据</button>
    <button onclick="toggleTheme()">🌙</button>
  </div>
  <div class="tabs" id="chartTabs">
    <div class="tab active" onclick="switchChart('bar')">柱状图</div>
    <div class="tab" onclick="switchChart('pie')">饼图</div>
    <div class="tab" onclick="switchChart('line')">折线图</div>
    <div class="tab" onclick="switchChart('radar')">雷达图</div>
    <div class="tab" onclick="switchChart('progress')">进度条</div>
    <div class="tab" onclick="switchChart('timeline')">时间线</div>
    <div class="tab" onclick="switchChart('funnel')">漏斗图</div>
    <div class="tab" onclick="switchChart('scatter')">散点图</div>
  </div>
  <div class="stats-row" id="statsRow"></div>
  <div class="controls">
    <div><label>标题</label><input type="text" id="chartTitle" value="数据可视化" oninput="renderChart()"></div>
    <div><label>配色方案</label><select id="colorScheme" onchange="renderChart()">
      <option value="vibrant">活力</option><option value="pastel">柔和</option><option value="neon">霓虹</option><option value="earth">大地</option><option value="ocean">海洋</option>
    </select></div>
    <div><label>圆角</label><input type="range" id="borderRadius" min="0" max="20" value="8" oninput="renderChart()"></div>
    <div><label>动画</label><select id="animType" onchange="renderChart()">
      <option value="ease">缓动</option><option value="bounce">弹跳</option><option value="elastic">弹性</option>
    </select></div>
  </div>
  <div class="card">
    <h3 id="chartHeading">柱状图预览</h3>
    <div class="chart-area" id="chartArea"></div>
  </div>
  <div class="card">
    <h3>数据编辑</h3>
    <button onclick="addRow()" style="padding:6px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;margin-bottom:12px">+ 添加数据</button>
    <div class="data-editor" id="dataEditor"></div>
  </div>
</div>
<script>
const schemes={vibrant:['#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#8b5cf6','#ec4899','#06b6d4'],pastel:['#fca5a5','#fdba74','#fde047','#86efac','#93c5fd','#c4b5fd','#f0abfc','#67e8f9'],neon:['#ff006e','#ff5400','#ffbe0b','#06d6a0','#118ab2','#8338ec','#fb5607','#3a86ff'],earth:['#92400e','#b45309','#ca8a04','#15803d','#1d4ed8','#6d28d9','#be185d','#0e7490'],ocean:['#0c4a6e','#075985','#0369a1','#0284c7','#0ea5e9','#38bdf8','#7dd3fc','#bae6fd']};
const names=['一月','二月','三月','四月','五月','六月','七月','八月'];
let currentChart='bar',data=names.slice(0,6).map((n,i)=>({label:n,value:Math.floor(Math.random()*80)+20,color:schemes.vibrant[i]}));

function switchChart(t){currentChart=t;document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['bar','pie','line','radar','progress','timeline','funnel','scatter'][i]===t));document.getElementById('chartHeading').textContent={bar:'柱状图',pie:'饼图',line:'折线图',radar:'雷达图',progress:'进度条',timeline:'时间线',funnel:'漏斗图',scatter:'散点图'}[t]+'预览';renderChart()}

function renderStats(){
  const vals=data.map(d=>d.value);
  const avg=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  const max=Math.max(...vals),min=Math.min(...vals);
  document.getElementById('statsRow').innerHTML=`<div class="stat-card"><div class="val">${vals.reduce((a,b)=>a+b,0)}</div><div class="label">总计</div></div><div class="stat-card"><div class="val">${avg}</div><div class="label">平均值</div></div><div class="stat-card"><div class="val">${max}</div><div class="label">最大值</div></div><div class="stat-card"><div class="val">${min}</div><div class="label">最小值</div></div><div class="stat-card"><div class="val">${data.length}</div><div class="label">数据项</div></div>`;
}

function renderChart(){
  const scheme=schemes[document.getElementById('colorScheme').value];
  data.forEach((d,i)=>d.color=scheme[i%scheme.length]);
  const area=document.getElementById('chartArea');
  const title=document.getElementById('chartTitle').value;
  const br=document.getElementById('borderRadius').value;
  let html=`<svg width="700" height="350" viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg">`;
  html+=`<text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)">${title}</text>`;

  if(currentChart==='bar'){
    const max=Math.max(...data.map(d=>d.value));
    const bw=60,gap=20,startX=60,baseY=310;
    data.forEach((d,i)=>{
      const h=(d.value/max)*240;const x=startX+i*(bw+gap);
      html+=`<rect x="${x}" y="${baseY-h}" width="${bw}" height="${h}" fill="${d.color}" rx="${br}"><animate attributeName="height" from="0" to="${h}" dur="0.6s" fill="freeze"/><animate attributeName="y" from="${baseY}" to="${baseY-h}" dur="0.6s" fill="freeze"/></rect>`;
      html+=`<text x="${x+bw/2}" y="${baseY+18}" text-anchor="middle" font-size="11" fill="var(--text2)">${d.label}</text>`;
      html+=`<text x="${x+bw/2}" y="${baseY-h-8}" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--text)">${d.value}</text>`;
    });
  }else if(currentChart==='pie'){
    const total=data.reduce((a,b)=>a+b.value,0);let angle=0;
    data.forEach(d=>{const slice=d.value/total*360;const startAngle=angle;angle+=slice;
      const s=(startAngle-90)*Math.PI/180,e=(angle-90)*Math.PI/180;const large=slice>180?1:0;
      html+=`<path d="M350,190 L${350+140*Math.cos(s)},${190+140*Math.sin(s)} A140,140 0 ${large},1 ${350+140*Math.cos(e)},${190+140*Math.sin(e)} Z" fill="${d.color}"><animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze"/></path>`;
      const mid=(startAngle+slice/2-90)*Math.PI/180;
      html+=`<text x="${350+100*Math.cos(mid)}" y="${190+100*Math.sin(mid)}" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">${Math.round(d.value/total*100)}%</text>`;
    });
    data.forEach((d,i)=>{html+=`<text x="520" y="${60+i*24}" font-size="12" fill="var(--text)"><tspan fill="${d.color}">●</tspan> ${d.label}: ${d.value}</text>`});
  }else if(currentChart==='line'){
    const max=Math.max(...data.map(d=>d.value));const sx=60,sy=310,ew=580,eh=250;
    const pts=data.map((d,i)=>`${sx+i*(ew/(data.length-1))},${sy-(d.value/max)*eh}`).join(' ');
    html+=`<polyline points="${pts}" fill="none" stroke="${data[0].color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="1s" fill="freeze"/></polyline>`;
    html+=`<polygon points="${pts} ${sx+(data.length-1)*(ew/(data.length-1))},${sy} ${sx},${sy}" fill="${data[0].color}" opacity="0.1"/>`;
    data.forEach((d,i)=>{const x=sx+i*(ew/(data.length-1)),y=sy-(d.value/max)*eh;
      html+=`<circle cx="${x}" cy="${y}" r="5" fill="${d.color}"/><text x="${x}" y="${sy+18}" text-anchor="middle" font-size="10" fill="var(--text2)">${d.label}</text><text x="${x}" y="${y-10}" text-anchor="middle" font-size="11" fill="var(--text)" font-weight="600">${d.value}</text>`;
    });
  }else if(currentChart==='radar'){
    const max=Math.max(...data.map(d=>d.value));const cx=350,cy=200,r=130;const n=data.length;
    for(let ring=1;ring<=4;ring++){const rr=r*ring/4;const pts=Array.from({length:n},(_,i)=>{const a=i*2*Math.PI/n-Math.PI/2;return`${cx+rr*Math.cos(a)},${cy+rr*Math.sin(a)}`}).join(' ');html+=`<polygon points="${pts}" fill="none" stroke="var(--border)" stroke-width="1"/>`}
    const pts=data.map((d,i)=>{const a=i*2*Math.PI/n-Math.PI/2;const rr=(d.value/max)*r;return`${cx+rr*Math.cos(a)},${cy+rr*Math.sin(a)}`}).join(' ');
    html+=`<polygon points="${pts}" fill="${data[0].color}" fill-opacity="0.2" stroke="${data[0].color}" stroke-width="2"/>`;
    data.forEach((d,i)=>{const a=i*2*Math.PI/n-Math.PI/2;const rr=(d.value/max)*r;
      html+=`<circle cx="${cx+rr*Math.cos(a)}" cy="${cy+rr*Math.sin(a)}" r="4" fill="${d.color}"/>`;
      html+=`<text x="${cx+(r+20)*Math.cos(a)}" y="${cy+(r+20)*Math.sin(a)}" text-anchor="middle" font-size="11" fill="var(--text)">${d.label}</text>`;
    });
  }else if(currentChart==='progress'){
    const max=Math.max(...data.map(d=>d.value));
    data.forEach((d,i)=>{
      const y=50+i*42;const w=(d.value/max)*550;
      html+=`<rect x="120" y="${y}" width="560" height="28" fill="var(--border)" rx="${br}"/>`;
      html+=`<rect x="120" y="${y}" width="${w}" height="28" fill="${d.color}" rx="${br}"><animate attributeName="width" from="0" to="${w}" dur="0.8s" fill="freeze"/></rect>`;
      html+=`<text x="115" y="${y+19}" text-anchor="end" font-size="12" fill="var(--text)">${d.label}</text>`;
      html+=`<text x="${125+w}" y="${y+19}" font-size="12" font-weight="600" fill="#fff">${d.value}</text>`;
    });
  }else if(currentChart==='timeline'){
    const step=580/(data.length-1||1);
    html+=`<line x1="60" y1="175" x2="640" y2="175" stroke="var(--border)" stroke-width="2"/>`;
    data.forEach((d,i)=>{const x=60+i*step;
      html+=`<circle cx="${x}" cy="175" r="10" fill="${d.color}"/><text x="${x}" y="${i%2===0?140:220}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text)">${d.label}</text>`;
      html+=`<text x="${x}" y="${i%2===0?155:235}" text-anchor="middle" font-size="11" fill="var(--text2)">${d.value}</text>`;
      html+=`<line x1="${x}" y1="175" x2="${x}" y2="${i%2===0?165:185}" stroke="var(--border)" stroke-width="1"/>`;
    });
  }else if(currentChart==='funnel'){
    const max=Math.max(...data.map(d=>d.value));
    data.forEach((d,i)=>{
      const y=50+i*38;const w=(d.value/max)*(500-i*30);const x=350-w/2;
      html+=`<rect x="${x}" y="${y}" width="${w}" height="30" fill="${d.color}" rx="${br}"><animate attributeName="width" from="0" to="${w}" dur="0.5s" fill="freeze"/></rect>`;
      html+=`<text x="350" y="${y+20}" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">${d.label} — ${d.value}</text>`;
    });
  }else if(currentChart==='scatter'){
    const maxX=Math.max(...data.map(d=>d.value));const maxY=Math.max(...data.map(d=>d.value*1.5));
    html+=`<line x1="60" y1="310" x2="640" y2="310" stroke="var(--border)" stroke-width="1"/>`;
    html+=`<line x1="60" y1="50" x2="60" y2="310" stroke="var(--border)" stroke-width="1"/>`;
    data.forEach((d,i)=>{const x=60+(d.value/maxX)*560;const y=310-(d.value*1.5/maxY)*250;
      html+=`<circle cx="${x}" cy="${y}" r="${8+i*2}" fill="${d.color}" opacity="0.7"><animate attributeName="r" from="0" to="${8+i*2}" dur="0.5s" fill="freeze"/></circle>`;
      html+=`<text x="${x}" y="${y-12}" text-anchor="middle" font-size="10" fill="var(--text)">${d.label}</text>`;
    });
  }
  html+=`</svg>`;
  area.innerHTML=html;
  renderStats();renderDataEditor();
}

function renderDataEditor(){
  document.getElementById('dataEditor').innerHTML=`<table class="data-table"><thead><tr><th>标签</th><th>数值</th><th>颜色</th><th></th></tr></thead><tbody>${data.map((d,i)=>`<tr><td><input value="${d.label}" onchange="data[${i}].label=this.value;renderChart()"></td><td><input type="number" value="${d.value}" onchange="data[${i}].value=+this.value;renderChart()"></td><td><input type="color" value="${d.color}" onchange="data[${i}].color=this.value;renderChart()"></td><td class="del" onclick="delRow(${i})">✕</td></tr>`).join('')}</tbody></table>`;
}
function addRow(){data.push({label:'新数据',value:50,color:schemes.vibrant[data.length%8]});renderChart()}
function delRow(i){if(data.length>1){data.splice(i,1);renderChart()}}

function renderChartCanvas(){
  const svgEl=document.querySelector('#chartArea svg');
  const canvas=document.createElement('canvas');canvas.width=1400;canvas.height=700;
  const ctx=canvas.getContext('2d');
  const img=new Image();
  return new Promise(resolve=>{img.onload=()=>{ctx.drawImage(img,0,0);resolve(canvas)};img.src='data:image/svg+xml,'+encodeURIComponent(svgEl.outerHTML)});
}
async function exportPNG(){const c=await renderChartCanvas();c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='infographic.png';a.click()})}
function exportSVG(){const blob=new Blob([document.querySelector('#chartArea svg').outerHTML],{type:'image/svg+xml'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='infographic.svg';a.click()}
function exportData(){const blob=new Blob([JSON.stringify({chart:currentChart,title:document.getElementById('chartTitle').value,data},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='chart-data.json';a.click()}
function toggleTheme(){const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t}
renderChart();
</script>
</body>
</html>
