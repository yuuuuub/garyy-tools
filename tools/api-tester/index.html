<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API 测试工具 | API Tester</title>
<meta property="og:title" content="API 测试工具 | API Tester">
<meta property="og:description" content="API 测试工具 | API Tester - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线API测试工具，支持GET/POST/PUT/DELETE等请求方法">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔌</text></svg>">
<script src="i18n.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--border:#30363d;--text:#c9d1d9;--text-secondary:#8b949e;--accent:#58a6ff;--accent-hover:#79c0ff;--green:#3fb950;--green-bg:rgba(63,185,80,.15);--red:#f85149;--red-bg:rgba(248,81,73,.15);--orange:#d2991d;--cyan:#39d2c0;--blue:#79c0ff;--purple:#bc8cff;--radius:8px;--radius-sm:6px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--bg-secondary:#fff;--bg-tertiary:#f0f2f5;--border:#d0d7de;--text:#1f2328;--text-secondary:#656d76;--accent:#0969da;--accent-hover:#0550ae;--green:#1a7f37;--green-bg:rgba(26,127,55,.1);--red:#cf222e;--red-bg:rgba(207,34,46,.1);--orange:#9a6700;--cyan:#0598bc;--blue:#0969da;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
.app-header{background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.app-header h1{font-size:1.25rem;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.app-header .subtitle{font-size:.8rem;color:var(--text-secondary)}
.main{max-width:1600px;margin:0 auto;padding:20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:20px;min-height:calc(100vh - 140px)}
@media(max-width:900px){.main{grid-template-columns:1fr}}
.panel{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.panel-header{padding:10px 16px;border-bottom:1px solid var(--border);font-size:.85rem;font-weight:500;color:var(--text-secondary);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.url-bar{display:flex;gap:0;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg-secondary)}
.method-select{padding:8px 12px;border:1px solid var(--border);border-right:none;border-radius:var(--radius-sm) 0 0 var(--radius-sm);background:var(--bg-tertiary);color:var(--text);font-weight:600;font-size:.85rem;cursor:pointer;min-width:90px}
.method-select option{background:var(--bg-secondary);color:var(--text)}
.url-input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:0 var(--radius-sm) var(--radius-sm) 0;background:var(--bg);color:var(--text);font-size:.85rem;font-family:'Fira Code',Consolas,monospace;outline:none}
.url-input:focus{border-color:var(--accent)}
.send-btn{padding:8px 20px;border:1px solid var(--accent);border-radius:0 var(--radius-sm) var(--radius-sm) 0;background:var(--accent);color:#fff;font-weight:600;font-size:.85rem;cursor:pointer;transition:var(--transition);margin-left:-1px}
.send-btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.send-btn:disabled{opacity:.5;cursor:not-allowed}
.tab-bar{display:flex;border-bottom:1px solid var(--border);padding:0 16px;gap:0}
.tab{padding:8px 16px;font-size:.8rem;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;transition:var(--transition)}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{display:none;padding:16px;flex:1;overflow:auto}
.tab-content.active{display:flex;flex-direction:column}
.kv-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.kv-row input{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:.8rem;outline:none}
.kv-row input:focus{border-color:var(--accent)}
.kv-row .remove-btn{padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--red);cursor:pointer;font-size:.8rem}
.kv-row .remove-btn:hover{background:var(--red-bg)}
.add-row-btn{padding:6px 12px;border:1px dashed var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--text-secondary);cursor:pointer;font-size:.8rem;width:100%;margin-top:4px}
.add-row-btn:hover{border-color:var(--accent);color:var(--accent)}
.body-textarea{width:100%;flex:1;min-height:200px;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-family:'Fira Code',Consolas,monospace;font-size:.8rem;resize:vertical;outline:none;line-height:1.6}
.body-textarea:focus{border-color:var(--accent)}
.response-status{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.status-badge{padding:4px 12px;border-radius:var(--radius-sm);font-weight:600;font-size:.8rem}
.status-2xx{background:var(--green-bg);color:var(--green)}
.status-3xx{background:rgba(210,153,29,.15);color:var(--orange)}
.status-4xx,.status-5xx{background:var(--red-bg);color:var(--red)}
.response-time{font-size:.8rem;color:var(--text-secondary)}
.response-body{flex:1;padding:16px;background:var(--bg);border-radius:var(--radius-sm);font-family:'Fira Code',Consolas,monospace;font-size:.8rem;line-height:1.6;overflow:auto;min-height:300px;white-space:pre-wrap;word-break:break-all;color:var(--text)}
.response-headers{flex:1;overflow:auto;min-height:200px}
.response-headers table{width:100%;border-collapse:collapse;font-size:.8rem}
.response-headers td{padding:6px 10px;border-bottom:1px solid var(--border);word-break:break-all}
.response-headers td:first-child{color:var(--cyan);white-space:nowrap;font-weight:500;width:200px}
.btn{padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);cursor:pointer;font-size:.8rem;transition:var(--transition)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.loading{display:none;text-align:center;padding:40px;color:var(--text-secondary)}
.loading.show{display:block}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.history-item{padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;gap:8px;align-items:center;font-size:.8rem;transition:var(--transition)}
.history-item:hover{background:var(--bg-tertiary)}
.history-method{font-weight:600;font-size:.75rem;padding:2px 6px;border-radius:3px;min-width:50px;text-align:center}
.method-GET{background:var(--green-bg);color:var(--green)}
.method-POST{background:rgba(57,210,192,.15);color:var(--cyan)}
.method-PUT{background:rgba(210,153,29,.15);color:var(--orange)}
.method-DELETE{background:var(--red-bg);color:var(--red)}
.method-PATCH{background:rgba(188,140,255,.15);color:var(--purple)}
.history-url{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-secondary)}
.history-status{font-weight:600}
.empty-state{text-align:center;padding:40px;color:var(--text-secondary);font-size:.85rem}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header class="app-header">
<div>
<h1>🔌 API 测试工具</h1>
<span class="subtitle">发送HTTP请求并查看响应</span>
</div>
<button class="btn" onclick="clearHistory()">清除历史</button>
</header>
<div class="main">
<div class="panel">
<div class="url-bar">
<select class="method-select" id="method">
<option value="GET">GET</option>
<option value="POST">POST</option>
<option value="PUT">PUT</option>
<option value="PATCH">PATCH</option>
<option value="DELETE">DELETE</option>
</select>
<input class="url-input" id="url" placeholder="https://api.example.com/endpoint" value="https://jsonplaceholder.typicode.com/posts/1">
<button class="send-btn" id="sendBtn" onclick="sendRequest()">发送</button>
</div>
<div class="tab-bar">
<div class="tab active" onclick="switchTab('headers',this)">Headers</div>
<div class="tab" onclick="switchTab('body',this)">Body</div>
<div class="tab" onclick="switchTab('history',this)">历史</div>
</div>
<div class="tab-content active" id="tab-headers">
<div id="headers-list"></div>
<button class="add-row-btn" onclick="addHeader()">+ 添加 Header</button>
</div>
<div class="tab-content" id="tab-body">
<textarea class="body-textarea" id="reqBody" placeholder='{"key": "value"}'></textarea>
</div>
<div class="tab-content" id="tab-history">
<div id="history-list"></div>
</div>
</div>
<div class="panel">
<div class="panel-header">
<span>📤 响应</span>
<div class="response-status" id="resStatus" style="display:none">
<span class="status-badge" id="statusBadge"></span>
<span class="response-time" id="resTime"></span>
<button class="btn" onclick="copyResponse()" style="margin-left:auto">📋 复制</button>
</div>
</div>
<div class="tab-bar">
<div class="tab active" onclick="switchResTab('body',this)">Body</div>
<div class="tab" onclick="switchResTab('headers',this)">Headers</div>
</div>
<div class="tab-content active" id="restab-body">
<div class="loading" id="loading"><span class="spinner"></span> 发送中...</div>
<div class="response-body" id="resBody"><div class="empty-state">发送请求后查看响应内容</div></div>
</div>
<div class="tab-content" id="restab-headers">
<div class="response-headers" id="resHeaders"><div class="empty-state">发送请求后查看响应头</div></div>
</div>
</div>
</div>

<script>
let headerRows=[];

function initHeaders(){
headerRows=[
{k:'Content-Type',v:'application/json'},
{k:'Accept',v:'application/json'}
];
renderHeaders();
}

function renderHeaders(){
const el=document.getElementById('headers-list');
el.innerHTML=headerRows.map((h,i)=>`
<div class="kv-row">
<input placeholder="Key" value="${esc(h.k)}" oninput="headerRows[${i}].k=this.value">
<input placeholder="Value" value="${esc(h.v)}" oninput="headerRows[${i}].v=this.value">
<button class="remove-btn" onclick="removeHeader(${i})">×</button>
</div>`).join('');
}

function addHeader(){headerRows.push({k:'',v:''});renderHeaders()}
function removeHeader(i){headerRows.splice(i,1);renderHeaders()}
function esc(s){return s.replace(/"/g,'&quot;').replace(/</g,'&lt;')}

function switchTab(name,el){
el.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
el.closest('.panel').querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
document.getElementById('tab-'+name).classList.add('active');
}
function switchResTab(name,el){
el.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
const panel=el.closest('.panel');
panel.querySelectorAll('.tab-content:not(.tab-content .tab-content)').forEach(c=>c.classList.remove('active'));
document.getElementById('restab-'+name).classList.add('active');
}

async function sendRequest(){
const method=document.getElementById('method').value;
const url=document.getElementById('url').value.trim();
if(!url)return;
const sendBtn=document.getElementById('sendBtn');
const loading=document.getElementById('loading');
const resBody=document.getElementById('resBody');
sendBtn.disabled=true;
loading.classList.add('show');
resBody.innerHTML='';
const headers={};
headerRows.forEach(h=>{if(h.k)headers[h.k]=h.v});
const opts={method,headers};
if(['POST','PUT','PATCH'].includes(method)){
const body=document.getElementById('reqBody').value.trim();
if(body)opts.body=body;
}
const start=performance.now();
try{
const res=await fetch(url,opts);
const elapsed=Math.round(performance.now()-start);
const data=await res.text();
let formatted=data;
try{formatted=JSON.stringify(JSON.parse(data),null,2)}catch(e){}
resBody.textContent=formatted;
resBody.style.color='';
const statusEl=document.getElementById('resStatus');
statusEl.style.display='flex';
const badge=document.getElementById('statusBadge');
badge.textContent=res.status+' '+res.statusText;
badge.className='status-badge '+(res.status<300?'status-2xx':res.status<400?'status-3xx':'status-4xx');
document.getElementById('resTime').textContent=elapsed+'ms';
const headersEl=document.getElementById('resHeaders');
let hdr='<table>';
res.headers.forEach((v,k)=>{hdr+=`<tr><td>${esc2(k)}</td><td>${esc2(v)}</td></tr>`});
hdr+='</table>';
headersEl.innerHTML=hdr;
addHistory(method,url,res.status);
}catch(err){
resBody.textContent='Error: '+err.message;
resBody.style.color='var(--red)';
document.getElementById('resStatus').style.display='none';
}finally{
sendBtn.disabled=false;
loading.classList.remove('show');
}
}

function esc2(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function copyResponse(){
const text=document.getElementById('resBody').textContent;
if(text)navigator.clipboard.writeText(text);
}

function addHistory(method,url,status){
let hist=JSON.parse(localStorage.getItem('apiHist')||'[]');
hist.unshift({method,url,status,time:Date.now()});
if(hist.length>20)hist=hist.slice(0,20);
localStorage.setItem('apiHist',JSON.stringify(hist));
renderHistory();
}

function renderHistory(){
const hist=JSON.parse(localStorage.getItem('apiHist')||'[]');
const el=document.getElementById('history-list');
if(!hist.length){el.innerHTML='<div class="empty-state">暂无请求历史</div>';return}
el.innerHTML=hist.map((h,i)=>{
const cls='method-'+h.method;
return`<div class="history-item" onclick="loadHistory(${i})">
<span class="history-method ${cls}">${h.method}</span>
<span class="history-url">${esc2(h.url)}</span>
<span class="history-status" style="color:${h.status<300?'var(--green)':h.status<400?'var(--orange)':'var(--red)'}">${h.status}</span>
</div>`}).join('');
}

function loadHistory(i){
const hist=JSON.parse(localStorage.getItem('apiHist')||'[]');
if(!hist[i])return;
document.getElementById('method').value=hist[i].method;
document.getElementById('url').value=hist[i].url;
}

function clearHistory(){
localStorage.removeItem('apiHist');
renderHistory();
}

initHeaders();
renderHistory();
</script>
</body>
</html>
