<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字比较</title><meta name="description" content="汉字比较 - 在线比较汉字"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.compare-area{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:16px 0}.compare-item{text-align:center;padding:20px;background:var(--bg);border-radius:12px}.compare-char{font-size:4rem;font-weight:700;color:var(--blue)}.compare-info{margin-top:12px;text-align:left}.compare-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)}.compare-label{color:var(--text2);font-size:.85rem}.compare-value{font-weight:500;font-size:.85rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}

h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}
</style><meta property="og:title" content="汉字比较"><meta property="og:description" content="汉字比较 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>⚖️ 汉字比较</h1><p class="sub">在线比较汉字</p>
<div class="card">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="input-group">
<label>汉字1</label>
<input type="text" id="char1Input" placeholder="输入第一个汉字" maxlength="1" value="大" oninput="compareChars()">
</div>
<div class="input-group">
<label>汉字2</label>
<input type="text" id="char2Input" placeholder="输入第二个汉字" maxlength="1" value="小" oninput="compareChars()">
</div>
</div>
<button class="btn" onclick="compareChars()">比较</button>
<button class="btn" onclick="randomCompare()">随机比较</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var charData={
  '一':{pinyin:'yī',strokes:1,radical:'一',structure:'独体字',meaning:'一，第一'},
  '二':{pinyin:'èr',strokes:2,radical:'二',structure:'独体字',meaning:'二，第二'},
  '三':{pinyin:'sān',strokes:3,radical:'一',structure:'独体字',meaning:'三，第三'},
  '四':{pinyin:'sì',strokes:5,radical:'囗',structure:'全包围结构',meaning:'四，第四'},
  '五':{pinyin:'wǔ',strokes:4,radical:'一',structure:'独体字',meaning:'五，第五'},
  '六':{pinyin:'liù',strokes:4,radical:'八',structure:'上下结构',meaning:'六，第六'},
  '七':{pinyin:'qī',strokes:2,radical:'一',structure:'独体字',meaning:'七，第七'},
  '八':{pinyin:'bā',strokes:2,radical:'八',structure:'独体字',meaning:'八，第八'},
  '九':{pinyin:'jiǔ',strokes:2,radical:'丿',structure:'独体字',meaning:'九，第九'},
  '十':{pinyin:'shí',strokes:2,radical:'十',structure:'独体字',meaning:'十，第十'},
  '大':{pinyin:'dà',strokes:3,radical:'大',structure:'独体字',meaning:'大的，巨大'},
  '小':{pinyin:'xiǎo',strokes:3,radical:'小',structure:'独体字',meaning:'小的，微小'},
  '多':{pinyin:'duō',strokes:6,radical:'夕',structure:'上下结构',meaning:'多的，很多'},
  '少':{pinyin:'shǎo',strokes:4,radical:'小',structure:'独体字',meaning:'少的，很少'},
  '上':{pinyin:'shàng',strokes:3,radical:'一',structure:'独体字',meaning:'上面，上方'},
  '下':{pinyin:'xià',strokes:3,radical:'一',structure:'独体字',meaning:'下面，下方'},
  '左':{pinyin:'zuǒ',strokes:5,radical:'工',structure:'半包围结构',meaning:'左边，左侧'},
  '右':{pinyin:'yòu',strokes:5,radical:'口',structure:'半包围结构',meaning:'右边，右侧'},
  '前':{pinyin:'qián',strokes:9,radical:'刂',structure:'上下结构',meaning:'前面，前方'},
  '后':{pinyin:'hòu',strokes:6,radical:'口',structure:'半包围结构',meaning:'后面，后方'},
  '东':{pinyin:'dōng',strokes:5,radical:'一',structure:'独体字',meaning:'东方，东边'},
  '西':{pinyin:'xī',strokes:6,radical:'西',structure:'独体字',meaning:'西方，西边'},
  '南':{pinyin:'nán',strokes:9,radical:'十',structure:'上下结构',meaning:'南方，南边'},
  '北':{pinyin:'běi',strokes:5,radical:'匕',structure:'左右结构',meaning:'北方，北边'},
  '天':{pinyin:'tiān',strokes:4,radical:'大',structure:'独体字',meaning:'天空，一天'},
  '地':{pinyin:'dì',strokes:6,radical:'土',structure:'左右结构',meaning:'地面，土地'},
  '人':{pinyin:'rén',strokes:2,radical:'人',structure:'独体字',meaning:'人类，人们'},
  '口':{pinyin:'kǒu',strokes:3,radical:'口',structure:'独体字',meaning:'嘴，口'},
  '日':{pinyin:'rì',strokes:4,radical:'日',structure:'独体字',meaning:'太阳，日子'},
  '月':{pinyin:'yuè',strokes:4,radical:'月',structure:'独体字',meaning:'月亮，月份'},
  '水':{pinyin:'shuǐ',strokes:4,radical:'水',structure:'独体字',meaning:'水，液体'},
  '火':{pinyin:'huǒ',strokes:4,radical:'火',structure:'独体字',meaning:'火，火焰'},
  '木':{pinyin:'mù',strokes:4,radical:'木',structure:'独体字',meaning:'木头，树木'},
  '金':{pinyin:'jīn',strokes:8,radical:'金',structure:'独体字',meaning:'金属，黄金'},
  '土':{pinyin:'tǔ',strokes:3,radical:'土',structure:'独体字',meaning:'土壤，土地'}
};
function compareChars(){
  var char1=document.getElementById('char1Input').value.trim();
  var char2=document.getElementById('char2Input').value.trim();
  var r=document.getElementById('result');
  if(!char1||!char2){r.innerHTML='';return;}
  if(char1.length!==1||char2.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入单个汉字</div>';return;}
  var data1=charData[char1]||{pinyin:'未知',strokes:0,radical:'未知',structure:'未知',meaning:'暂无信息'};
  var data2=charData[char2]||{pinyin:'未知',strokes:0,radical:'未知',structure:'未知',meaning:'暂无信息'};
  var html='<div class="card">';
  html+='<div class="compare-area">';
  html+='<div class="compare-item">';
  html+='<div class="compare-char">'+char1+'</div>';
  html+='<div class="compare-info">';
  html+='<div class="compare-row"><span class="compare-label">拼音</span><span class="compare-value">'+data1.pinyin+'</span></div>';
  html+='<div class="compare-row"><span class="compare-label">笔画</span><span class="compare-value">'+data1.strokes+'</span></div>';
  html+='<div class="compare-row"><span class="compare-label">部首</span><span class="compare-value">'+data1.radical+'</span></div>';
  html+='<div class="compare-row"><span class="compare-label">结构</span><span class="compare-value">'+data1.structure+'</span></div>';
  html+='<div class="compare-row"><span class="compare-label">含义</span><span class="compare-value">'+data1.meaning+'</span></div>';
  html+='</div></div>';
  html+='<div class="compare-item">';
  html+='<div class="compare-char">'+char2+'</div>';
  html+='<div class="compare-info">';
  html+='<div class="compare-row"><span class="compare-label">拼音</span><span class="compare-value">'+data2.pinyin+'</span></div>';
  html+='<div class="compare-row"><span class="compare-label">笔画</span><span class="compare-value">'+data2.strokes+'</span></div>';
  html+='<div class="compare-row"><span class="compare-label">部首</span><span class="compare-value">'+data2.radical+'</span></div>';
  html+='<div class="compare-row"><span class="compare-label">结构</span><span class="compare-value">'+data2.structure+'</span></div>';
  html+='<div class="compare-row"><span class="compare-label">含义</span><span class="compare-value">'+data2.meaning+'</span></div>';
  html+='</div></div></div>';
  html+='<div class="section"><h3>📊 比较结果</h3>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>笔画比较：</strong>'+char1+' ('+data1.strokes+'画) '+(data1.strokes>data2.strokes?'>':'<')+' '+char2+' ('+data2.strokes+'画)</div>';
  html+='<div><strong>部首比较：</strong>'+(data1.radical===data2.radical?'相同 ('+data1.radical+')':'不同 ('+data1.radical+' vs '+data2.radical+')')+'</div>';
  html+='<div><strong>结构比较：</strong>'+(data1.structure===data2.structure?'相同 ('+data1.structure+')':'不同 ('+data1.structure+' vs '+data2.structure+')')+'</div>';
  html+='</div></div></div>';
  r.innerHTML=html;
}
function randomCompare(){
  var chars=Object.keys(charData);
  var randomChar1=chars[Math.floor(Math.random()*chars.length)];
  var randomChar2=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('char1Input').value=randomChar1;
  document.getElementById('char2Input').value=randomChar2;
  compareChars();
}
compareChars();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
