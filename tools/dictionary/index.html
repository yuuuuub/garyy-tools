var quickWords=['你好','谢谢','朋友','学习','工作','高兴','中国','美食','文化','梦想'];
function renderQuick(){
var html='';
quickWords.forEach(function(w){
html+='<button class="quick-btn" onclick="quickSearch(\''+w+'\')">'+w+'</button>';
});
document.getElementById('quickList').innerHTML=html;
}
window.quickSearch=function(w){document.getElementById('searchInput').value=w;searchWord();};
window.searchWord=function(){
var q=document.getElementById('searchInput').value.trim().toLowerCase();
if(!q){document.getElementById('app').innerHTML='<div style="text-align:center;color:var(--text2);padding:40px">请输入词汇进行查询</div>';return;}
var results=dict.filter(function(d){
return d.w.indexOf(q)!==-1||d.en.toLowerCase().indexOf(q)!==-1||d.py.indexOf(q)!==-1;
});
if(!results.length){
document.getElementById('app').innerHTML='<div style="text-align:center;color:var(--text2);padding:40px">未找到"'+q+'"<br>试试：你好、hello、学习</div>';
return;
}
var html='';
results.forEach(function(d){
html+='<div class="word-card">';
html+='<div class="word-title">'+d.w+'</div>';
html+='<div class="word-pinyin">'+d.py+'</div>';
html+='<div class="word-en">'+d.en+'</div>';
html+='<div class="word-example"><div class="label">例句</div>'+d.ex+'</div>';

});
document.getElementById('app').innerHTML=html;
