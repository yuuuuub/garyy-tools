<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#e8a87c;--accent2:#d4956b}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#c97e4a;--accent2:#b06a55}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
header{background:linear-gradient(135deg,#1a0a00,#2a1505,#3d200a);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3010;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#e8a87c,#d4956b,#c97e4a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1200px;margin:0 auto;padding:20px}
.search-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-row input{flex:1;min-width:200px;padding:12px 16px;border-radius:10px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color .3s}
.search-row input:focus{border-color:var(--accent)}
.filter-group{margin-bottom:16px}
.filter-group label{font-size:.85em;color:var(--text2);margin-bottom:6px;display:block}
.filter-btns{display:flex;flex-wrap:wrap;gap:6px}
.filter-btn{padding:6px 14px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:.82em;transition:all .2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.recipe-card{background:var(--card);border-radius:12px;padding:18px;border:1px solid var(--border);transition:all .3s;cursor:pointer}
.recipe-card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.3)}
.recipe-card .r-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.recipe-card .r-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.4em;background:rgba(232,168,124,.15);flex-shrink:0}
.recipe-card .r-name{font-size:1.15em;font-weight:bold}
.recipe-card .r-meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.recipe-card .r-meta span{font-size:.72em;padding:2px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--border);color:var(--text2)}
.recipe-card .r-detail{font-size:.82em;color:var(--text2);line-height:1.6}
.recipe-card .r-detail strong{color:var(--text)}
.recipe-card.hidden{display:none}
.stats{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 16px;text-align:center}
.stat .num{font-size:1.4em;font-weight:bold;color:var(--accent)}
.stat .lbl{font-size:.72em;color:var(--text2)}
.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty .icon{font-size:3em;margin-bottom:12px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;justify-content:center;align-items:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:14px;padding:28px;max-width:600px;width:100%;max-height:80vh;overflow-y:auto;border:1px solid var(--border)}
.modal h2{font-size:1.4em;margin-bottom:12px}
.modal .close-btn{float:right;background:none;border:none;color:var(--text2);font-size:1.4em;cursor:pointer}
.modal p{font-size:.88em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.modal p strong{color:var(--text)}
footer{text-align:center;padding:30px;color:var(--text2);font-size:.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.results-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>

<script>
const RECIPES=[
{id:1,name:"宫保鸡丁",en:"Kung Pao Chicken",cuisine:"川菜",method:"炒",ingredients:["鸡","花生","辣椒"],icon:"🌶️",difficulty:"中等",time:"20分钟",history:"清末四川总督丁宝桢的私房菜，因丁宝桢被封为'宫保'而得名。鸡肉嫩滑、花生酥脆、辣而不猛。",steps:["鸡胸肉切丁，加料酒、酱油、淀粉腌制15分钟","调宫保汁：酱油、醋、糖、淀粉、水混合","锅中热油，爆香干辣椒和花椒","滑入鸡丁翻炒至变色","加入花生米、葱段翻炒","淋入宫保汁快速翻炒均匀即可"],tips:"花生最后放，保持酥脆。醋要最后加，保持酸香味。"},
{id:2,name:"麻婆豆腐",en:"Mapo Tofu",cuisine:"川菜",method:"煮",ingredients:["豆腐","猪肉","豆瓣酱"],icon:"🌶️",difficulty:"简单",time:"15分钟",history:"清朝同治年间成都万福桥边陈麻婆所创，以麻、辣、烫、嫩、酥、香、鲜八字真言著称。",steps:["豆腐切小方块，用盐水焯烫2分钟","猪肉末炒散至变色","加入豆瓣酱、姜蒜末炒香","加水烧开，放入豆腐小火煮5分钟","水淀粉勾芡，撒花椒粉和葱花"],tips:"豆腐焯水可去豆腥味。勾芡分两次，口感更嫩滑。"},
{id:3,name:"红烧肉",en:"Braised Pork Belly",cuisine:"苏菜",method:"炖",ingredients:["猪"],icon:"🍖",difficulty:"中等",time:"90分钟",history:"相传苏东坡被贬黄州时改良猪肉做法，提出'慢著火，少著水，火候足时它自美'的烹饪理念。",steps:["五花肉切方块，冷水下锅焯水去血沫","锅中少油，放入冰糖小火炒至焦糖色","放入肉块翻炒上色","加料酒、酱油、八角、桂皮、姜片","加热水没过肉，大火烧开转小火炖60分钟","大火收汁即可"],tips:"炒糖色要小火慢炒，过火会苦。最后收汁要不停翻动。"},
{id:4,name:"清蒸鲈鱼",en:"Steamed Sea Bass",cuisine:"粤菜",method:"蒸",ingredients:["鱼"],icon:"🐟",difficulty:"中等",time:"15分钟",history:"粤菜经典，体现广东人对食材新鲜度的极致追求。'鲜'字当头，蒸鱼讲究火候精准。",steps:["鲈鱼处理干净，两面划几刀","鱼身抹少许盐和料酒，放姜片腌10分钟","水烧开后放入鱼，大火蒸8分钟","取出倒掉蒸出的水，去掉姜片","铺上葱丝、红椒丝，淋热油和蒸鱼豉油"],tips:"蒸鱼一定要水开后再放鱼。蒸制时间不可过长，肉质会老。"},
{id:5,name:"东坡肉",en:"Dongpo Pork",cuisine:"浙菜",method:"炖",ingredients:["猪"],icon:"🍖",difficulty:"中等",time:"120分钟",history:"北宋苏东坡被贬杭州时创制，以'慢著火，少著水'为要诀，肉色红亮、肥而不腻。",steps:["五花肉切大块，焯水去血沫","砂锅底铺葱姜，肉皮朝下码放","加料酒、酱油、冰糖、热水","大火烧开转极小火炖2小时","翻面肉皮朝上，再炖30分钟","大火收浓汤汁"],tips:"全程小火慢炖，不加盐。砂锅炖制效果最佳。"},
{id:6,name:"剁椒鱼头",en:"Chopped Chili Fish Head",cuisine:"湘菜",method:"蒸",ingredients:["鱼","辣椒"],icon:"🐟",difficulty:"中等",time:"25分钟",history:"湖南经典名菜，选用大花鲢鱼头配以湖南特色剁辣椒蒸制，鲜辣开胃。",steps:["鱼头对半劈开洗净，抹料酒和盐","盘底铺姜片，鱼头放上","均匀铺上剁椒、蒜末","水烧开后大火蒸12分钟","出锅撒葱花，淋热油激香"],tips:"鱼头要选大的花鲢。剁椒本身有咸味，盐要少放。"},
{id:7,name:"佛跳墙",en:"Buddha Jumps Over the Wall",cuisine:"闽菜",method:"炖",ingredients:["虾","肉"],icon:"🍲",difficulty:"困难",time:"180分钟",history:"福州名菜，因香味浓郁到佛闻弃禅跳墙来偷吃而得名。用料考究，制作繁复。",steps:["海参、鲍鱼、鱼翅等干货提前泡发","猪蹄、鸡肉焯水切块","坛底放猪蹄、鸡块","依次码入海参、鲍鱼、鱼肚等","加料酒、高汤，封口小火煨3小时"],tips:"各食材需分别预处理。煨制时不可开盖，保持香气。"},
{id:8,name:"糖醋里脊",en:"Sweet and Sour Pork",cuisine:"鲁菜",method:"炸",ingredients:["猪"],icon:"🍖",difficulty:"中等",time:"30分钟",history:"鲁菜经典名菜，以酸甜适口、外酥里嫩著称，是鲁菜'爆炒熘炸'技法的典型代表。",steps:["里脊肉切条，加盐、料酒腌制","调糖醋汁：醋、糖、番茄酱、淀粉水","肉条裹干淀粉，再裹蛋液，再裹淀粉","油温六成热，炸至金黄捞出","油温八成热复炸一次","锅中少许油，倒入糖醋汁烧至浓稠","放入里脊快速翻炒均匀"],tips:"复炸是外酥的关键。糖醋汁比例：醋2糖3番茄酱1。"},
{id:9,name:"叫化鸡",en:"Beggar's Chicken",cuisine:"浙菜",method:"烤",ingredients:["鸡"],icon:"🍗",difficulty:"困难",time:"150分钟",history:"相传叫花子用泥巴包裹鸡烤制而成，后经杭州楼外楼改良，成为浙江名菜。",steps:["整鸡处理干净，用酱油、料酒腌2小时","鸡肚内塞入香菇、笋丁、火腿丁","用荷叶包裹，再裹黄泥","放入烤箱200度烤90分钟","敲开泥壳，撕开荷叶即食"],tips:"黄泥可用面团代替。荷叶增加清香，不可省略。"},
{id:10,name:"水煮牛肉",en:"Boiled Beef in Chili Sauce",cuisine:"川菜",method:"煮",ingredients:["牛","辣椒"],icon:"🥩",difficulty:"中等",time:"25分钟",history:"源于四川自贡盐场，因盐工就地取材烹制而得名。麻辣鲜嫩、汤红油亮。",steps:["牛肉切片，加蛋清、淀粉、料酒腌制","豆芽、莴笋焯水铺碗底","锅中炒香豆瓣酱、姜蒜、干辣椒","加水烧开，下牛肉片滑散","牛肉铺在蔬菜上，撒花椒粉、辣椒面","浇热油激香"],tips:"牛肉要逆纹切片，腌制后口感更嫩。滑牛肉时间不宜过长。"},
{id:11,name:"白切鸡",en:"White Cut Chicken",cuisine:"粤菜",method:"煮",ingredients:["鸡"],icon:"🍗",difficulty:"中等",time:"40分钟",history:"广东最经典的鸡肉做法，以'鸡有鸡味'为最高评价标准，体现粤菜清淡鲜美的精髓。",steps:["整鸡洗净，锅中水烧至微沸（约90度）","放入鸡，水再次烧开后关火焖20分钟","取出立即浸入冰水冷却","斩件摆盘，配沙姜、葱油蘸料"],tips:"水温控制是关键，不可大火煮沸。浸冰水使皮爽肉滑。"},
{id:12,name:"回锅肉",en:"Twice-Cooked Pork",cuisine:"川菜",method:"炒",ingredients:["猪"],icon:"🍖",difficulty:"中等",time:"20分钟",history:"川菜之首，因肉片先煮后炒（回锅）而得名。'入蜀不吃回锅肉，等于没到四川。'",steps:["五花肉整块冷水下锅煮至八分熟","捞出放凉后切薄片","锅中少油，放入肉片煸炒出油","肉片卷曲后加入豆瓣酱、甜面酱","加蒜苗段翻炒至断生"],tips:"肉要凉透再切，否则不成片。煸炒时不用加油，肉自身会出油。"},
{id:13,name:"西湖醋鱼",en:"West Lake Vinegar Fish",cuisine:"浙菜",method:"煮",ingredients:["鱼"],icon:"🐟",difficulty:"困难",time:"30分钟",history:"杭州西湖名菜，相传南宋时宋氏兄弟为纪念被恶人害死的嫂嫂而创制，鱼味酸甜似醋。",steps:["草鱼饿养两天去土腥","鱼身斜切花刀，焯水煮熟","调糖醋汁：醋、糖、酱油、姜末","鱼摆盘，淋上糖醋汁","撒姜末、葱花"],tips:"鱼要饿养去土腥。糖醋汁要趁热浇淋。"},
{id:14,name:"臭鳜鱼",en:"Stinky Mandarin Fish",cuisine:"徽菜",method:"煎",ingredients:["鱼"],icon:"🐟",difficulty:"困难",time:"48小时+30分钟",history:"徽州名菜，鳜鱼用盐腌制发酵后煎烧，闻着臭吃着香，是徽菜'重色重油重火功'的代表。",steps:["鳜鱼用盐腌制，在石压下发酵5-7天","取出洗净，两面煎至金黄","加酱油、糖、料酒、姜蒜","小火焖烧15分钟","大火收汁，撒葱花"],tips:"发酵是关键步骤，温度和盐量要控制好。煎鱼时不要频繁翻动。"},

let currentCuisine='all',currentMethod='all',currentIngredient='all';
function getFiltered(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  return RECIPES.filter(r=>{
    if(currentCuisine!=='all'&&r.cuisine!==currentCuisine)return false;
    if(currentMethod!=='all'&&r.method!==currentMethod)return false;
    if(currentIngredient!=='all'&&!r.ingredients.some(i=>i.includes(currentIngredient)))return false;
    if(q&&!r.name.toLowerCase().includes(q)&&!r.en.toLowerCase().includes(q)&&!r.ingredients.some(i=>i.includes(q)))return false;
    return true;
  });
}
function render(){
  const data=getFiltered();
  const grid=document.getElementById('results');
  const empty=document.getElementById('empty');
  if(!data.length){grid.innerHTML='';empty.style.display='block';return}
  empty.style.display='none';
  grid.innerHTML=data.map(r=>`
    <div class="recipe-card" onclick="showDetail(${r.id})">
      <div class="r-top"><div class="r-icon">${r.icon}</div><div><div class="r-name">${r.name}</div><div style="font-size:.78em;color:var(--text2)">${r.en}</div></div></div>
      <div class="r-meta"><span>${r.cuisine}</span><span>${r.method}</span><span>${r.difficulty}</span><span>${r.time}</span></div>
      <div class="r-detail"><strong>食材：</strong>${r.ingredients.join('、')}</div>
      <div class="r-detail" style="margin-top:6px;font-size:.78em;color:var(--accent)">点击查看详情 →</div>
    </div>`).join('');
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="num">${RECIPES.length}</div><div class="lbl">总菜谱</div></div>
    <div class="stat"><div class="num">${data.length}</div><div class="lbl">匹配结果</div></div>
    <div class="stat"><div class="num">${new Set(data.map(r=>r.cuisine)).size}</div><div class="lbl">菜系</div></div>`;
}
function showDetail(id){
  const r=RECIPES.find(x=>x.id===id);if(!r)return;
  document.getElementById('modalContent').innerHTML=`
    <h2>${r.icon} ${r.name} <span style="font-size:.6em;color:var(--text2)">${r.en}</span></h2>
    <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap"><span style="font-size:.78em;padding:3px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border)">${r.cuisine}</span><span style="font-size:.78em;padding:3px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border)">${r.method}</span><span style="font-size:.78em;padding:3px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border)">${r.difficulty}</span><span style="font-size:.78em;padding:3px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border)">⏱️ ${r.time}</span></div>
    <p><strong>历史典故：</strong>${r.history}</p>
    <p><strong>食材：</strong>${r.ingredients.join('、')}</p>
    <p><strong>烹饪步骤：</strong></p>
    <ol style="font-size:.85em;color:var(--text2);line-height:2;padding-left:20px">${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
    <p><strong>小贴士：</strong>${r.tips}</p>`;
  document.getElementById('modal').classList.add('show');
}
document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('show');
document.getElementById('modal').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('show')};
function setupFilter(containerId,key){
  document.getElementById(containerId).addEventListener('click',e=>{
    if(!e.target.classList.contains('filter-btn'))return;
    e.target.parentElement.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    if(key==='cuisine')currentCuisine=e.target.dataset.filter;
    else if(key==='method')currentMethod=e.target.dataset.filter;
    else if(key==='ingredient')currentIngredient=e.target.dataset.filter;
    render();
  });
}
document.getElementById('searchInput').addEventListener('input',render);
setupFilter('cuisineFilter','cuisine');
setupFilter('methodFilter','method');
setupFilter('ingredientFilter','ingredient');
render();
</script>
