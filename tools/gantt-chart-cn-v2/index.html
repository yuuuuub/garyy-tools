<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📈 甘特图 v2</title>
<meta name="description" content="甘特图v2，更强大的项目进度管理工具">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:1100px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select{padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
button.grn{background:var(--green)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.gantt-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;position:relative}
.gantt-header{display:flex;border-bottom:2px solid var(--border);position:sticky;top:0;background:var(--card);z-index:1}
.gantt-header .task-label{min-width:200px;padding:10px;font-weight:600;border-right:1px solid var(--border);flex-shrink:0}
.gantt-header .timeline{display:flex;flex:1}
.gantt-header .day-cell{min-width:40px;flex-shrink:0;padding:6px 2px;text-align:center;font-size:.7rem;color:var(--text2);border-right:1px solid var(--border)}
.gantt-header .day-cell.weekend{background:rgba(248,81,73,.05)}
.gantt-body{position:relative}
.gantt-row{display:flex;border-bottom:1px solid var(--border);min-height:44px;align-items:center}
.gantt-row .task-label{min-width:200px;padding:8px 10px;font-size:.85rem;border-right:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:6px;cursor:pointer}
.gantt-row .task-label .color{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.gantt-row .task-bar-area{display:flex;flex:1;position:relative;height:44px}
.gantt-row .task-bar{position:absolute;height:24px;top:10px;border-radius:4px;cursor:pointer;display:flex;align-items:center;padding:0 6px;font-size:.7rem;color:#fff;font-weight:600;transition:all .15s}
.gantt-row .task-bar:hover{filter:brightness(1.2);transform:scaleY(1.1)}
.today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:5;pointer-events:none}
.progress-text{font-size:.7rem;color:var(--text2);margin-left:8px}
.progress-bar-bg{width:60px;height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-left:4px;display:inline-block;vertical-align:middle}
.progress-bar-fill{height:100%;border-radius:3px}
.task-row-even{background:rgba(59,130,246,.02)}
.task-list{list-style:none;padding:0}
.task-list li{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--border)}
.task-list li:last-child{border-bottom:none}
.milestone{position:absolute;width:12px;height:12px;transform:rotate(45deg);top:16px;z-index:3}
.controls{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.controls select{width:auto;min-width:100px}
.summary{display:flex;gap:16px;flex-wrap:wrap}
.summary-item{text-align:center;padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border);flex:1;min-width:120px}
.summary-item .num{font-size:1.4rem;font-weight:700;color:var(--accent)}
.summary-item .label{font-size:.75rem;color:var(--text2);margin-top:2px}
.hidden{display:none!important}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
@media(max-width:768px){body{padding:10px}.ctn{max-width:100%}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📈 甘特图 v2">
<meta property="og:description" content="甘特图v2，更强大的项目进度管理工具">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/gantt-chart-cn-v2/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='gantt2_data';
let projects=JSON.parse(localStorage.getItem(STORE)||'[]');
let curProj=-1,dayWidth=40,zoomLevel=1;
const COLORS=['#3b82f6','#ef4444','#22c55e','#f59e0b','#8b5cf6','#ec4899','#06b6d4','#f97316','#14b8a6','#e11d48'];
function save(){localStorage.setItem(STORE,JSON.stringify(projects))}
function fmt(d){return d.slice(0,10)}
function parseDate(s){return new Date(s+'T00:00:00')}
function daysBetween(a,b){return Math.round((parseDate(b)-parseDate(a))/864e5)}
function addDays(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return fmt(d)}
function render(){
  let h=`<div class="hdr"><h1>📈 甘特图 v2</h1><p>强大的项目进度管理工具</p></div>`;
  h+=`<div class="flex" style="justify-content:center;margin-bottom:16px"><button onclick="showNewProj()">+ 新建项目</button>`;
  if(projects.length>0)h+=`<select onchange="curProj=parseInt(this.value);render()" style="min-width:150px"><option value="-1">选择项目</option>${projects.map((p,i)=>`<option value="${i}"${i===curProj?' selected':''}>${p.name}</option>`).join('')}</select>`;
  h+=`<button class="sec" onclick="exportJSON()">导出</button><button class="sec" onclick="importJSON()">导入</button></div>`;
  if(curProj>=0&&curProj<projects.length){
    const p=projects[curProj];
    const allDates=p.tasks.flatMap(t=>[t.start,t.end]);
    if(allDates.length>0){
      const minD=allDates.sort()[0],maxD=allDates.sort().reverse()[0];
      const startD=addDays(minD,-2),endD=addDays(maxD,5);
      const totalDays=daysBetween(startD,endD);
      const avgProgress=p.tasks.length?Math.round(p.tasks.reduce((s,t)=>s+t.progress,0)/p.tasks.length):0;
      h+=`<div class="cd"><div class="flex-between"><div><b>${p.name}</b> <span class="progress-text">总进度 ${avgProgress}%</span><div class="progress-bar-bg" style="width:120px"><div class="progress-bar-fill" style="width:${avgProgress}%;background:var(--accent)"></div></div></div>`;
      h+=`<div class="flex"><button class="sec" style="padding:6px 12px;font-size:.8rem" onclick="zoomIn()">+</button><button class="sec" style="padding:6px 12px;font-size:.8rem" onclick="zoomOut()">-</button><button style="padding:6px 14px;font-size:.85rem" onclick="showAddTask()">+ 任务</button></div></div></div>`;
      h+=`<div class="gantt-wrap" id="ganttWrap"><div class="gantt-header"><div class="task-label">任务</div><div class="timeline">`;
      for(let i=0;i<totalDays;i++){
        const d=addDays(startD,i);
        const dow=parseDate(d).getDay();
        h+=`<div class="day-cell${dow===0||dow===6?' weekend':''}" style="min-width:${dayWidth}px">${(parseDate(d).getMonth()+1)}/${parseDate(d).getDate()}</div>`;
      }
      h+=`</div></div><div class="gantt-body">`;
      const todayStr=fmt(new Date());
      const todayOffset=daysBetween(startD,todayStr);
      if(todayOffset>=0&&todayOffset<=totalDays){
        h+=`<div class="today-line" style="left:${200+todayOffset*dayWidth+dayWidth/2}px"></div>`;
      }
      p.tasks.forEach((t,i)=>{
        const off=daysBetween(startD,t.start);
        const dur=daysBetween(t.start,t.end)+1;
        h+=`<div class="gantt-row${i%2?' task-row-even':''}"><div class="task-label"><span class="color" style="background:${COLORS[i%COLORS.length]}"></span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${t.name}">${t.name}</span><span class="progress-text">${t.progress}%</span></div>`;
        h+=`<div class="task-bar-area">`;
        h+=`<div class="task-bar" style="left:${off*dayWidth}px;width:${dur*dayWidth-2}px;background:${COLORS[i%COLORS.length]}" onclick="editTask(${i})" title="${t.name}: ${t.start} ~ ${t.end}">${t.progress>0?`<div style="position:absolute;left:0;top:0;bottom:0;width:${t.progress}%;background:rgba(255,255,255,.3);border-radius:4px"></div>`:''}<span style="position:relative;z-index:1">${t.name}</span></div>`;
        h+=`</div></div>`;
      });
      if(p.tasks.length===0)h+=`<div style="text-align:center;color:var(--text2);padding:40px">暂无任务，请添加</div>`;
      h+=`</div></div>`;
    }
  }else{
    if(projects.length===0)h+=`<div class="cd" style="text-align:center;color:var(--text2);padding:40px">暂无项目，请创建新项目</div>`;
  }
  h+=`<div id="modal" class="hidden"></div>`;
  $('app').innerHTML=h;
}
function showNewProj(){
  $('modal').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)hideModal()"><div class="modal"><h2 style="margin-bottom:16px">新建项目</h2><label>项目名称</label><input type="text" id="pName" placeholder="项目名称"><div class="bg"><button onclick="createProj()">创建</button><button class="sec" onclick="hideModal()">取消</button></div></div></div>`;
  $('modal').classList.remove('hidden');
}
function createProj(){
  const name=$('pName').value.trim();if(!name){alert('请输入项目名称');return;}
  projects.push({name,tasks:[]});curProj=projects.length-1;save();hideModal();render();
}
function showAddTask(){
  const today=fmt(new Date());
  $('modal').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)hideModal()"><div class="modal"><h2 style="margin-bottom:16px">添加任务</h2><label>任务名称</label><input type="text" id="tName" placeholder="任务名称"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>开始日期</label><input type="date" id="tStart" value="${today}"></div><div><label>结束日期</label><input type="date" id="tEnd" value="${today}"></div></div><label>进度 (0-100%)</label><input type="number" id="tProg" min="0" max="100" value="0"><div class="bg"><button onclick="addTask()">添加</button><button class="sec" onclick="hideModal()">取消</button></div></div></div>`;
  $('modal').classList.remove('hidden');
}
function addTask(){
  const name=$('tName').value.trim(),start=$('tStart').value,end=$('tEnd').value,prog=parseInt($('tProg').value)||0;
  if(!name||!start||!end){alert('请填写完整信息');return;}
  projects[curProj].tasks.push({name,start,end,progress:Math.min(100,Math.max(0,prog))});save();hideModal();render();
}
function editTask(i){
  const t=projects[curProj].tasks[i];
  $('modal').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)hideModal()"><div class="modal"><h2 style="margin-bottom:16px">编辑任务</h2><label>任务名称</label><input type="text" id="eName" value="${t.name}"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>开始日期</label><input type="date" id="eStart" value="${t.start}"></div><div><label>结束日期</label><input type="date" id="eEnd" value="${t.end}"></div></div><label>进度 (0-100%)</label><input type="number" id="eProg" min="0" max="100" value="${t.progress}"><div class="bg"><button onclick="saveTask(${i})">保存</button><button class="dng" onclick="delTask(${i})">删除</button><button class="sec" onclick="hideModal()">取消</button></div></div></div>`;
  $('modal').classList.remove('hidden');
}
function saveTask(i){
  const t=projects[curProj].tasks[i];
  t.name=$('eName').value.trim()||t.name;t.start=$('eStart').value;t.end=$('eEnd').value;t.progress=Math.min(100,Math.max(0,parseInt($('eProg').value)||0));
  save();hideModal();render();
}
function delTask(i){if(!confirm('确定删除？'))return;projects[curProj].tasks.splice(i,1);save();hideModal();render()}
function hideModal(){$('modal').classList.add('hidden')}
function zoomIn(){dayWidth=Math.min(80,dayWidth+10);render()}
function zoomOut(){dayWidth=Math.max(15,dayWidth-10);render()}
function exportJSON(){
  const d=JSON.stringify(projects,null,2);
  const b=new Blob([d],{type:'application/json'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download='gantt-project.json';a.click();URL.revokeObjectURL(u);
}
function importJSON(){
  const input=document.createElement('input');input.type='file';input.accept='.json';
  input.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=ev=>{
      try{projects=JSON.parse(ev.target.result);curProj=projects.length>0?0:-1;save();render();}catch(err){alert('JSON格式错误');}
    };r.readAsText(f);
  };input.click();
}
render();
</script>
</body>
</html>
