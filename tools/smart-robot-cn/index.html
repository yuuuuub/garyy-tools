<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 智能扫地机器人</title>
<meta name="description" content="智能扫地机器人控制，查看清扫状态、设置清扫计划与地图管理">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.robot-status{text-align:center;padding:30px;border-radius:var(--radius);background:var(--bg);margin-bottom:16px}
.robot-icon{font-size:4rem;margin-bottom:12px}
.robot-text{font-size:1.2rem;font-weight:600;margin-bottom:8px}
.robot-battery{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0}
.battery-icon{font-size:1.5rem}
.battery-bar{width:100px;height:20px;background:var(--border);border-radius:10px;overflow:hidden}
.battery-fill{height:100%;background:var(--success);transition:width .5s}
.battery-percent{font-weight:600}
.robot-controls{display:flex;justify-content:center;gap:12px;margin-top:16px}
.robot-btn{padding:12px 24px;border-radius:8px;border:none;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s}
.robot-btn.start{background:var(--success);color:#fff}
.robot-btn.pause{background:var(--warn);color:#fff}
.robot-btn.stop{background:var(--danger);color:#fff}
.robot-btn.dock{background:var(--accent);color:#fff}
.robot-btn:hover{transform:scale(1.05)}
.map-container{position:relative;width:100%;height:300px;background:var(--bg);border-radius:8px;overflow:hidden;margin-bottom:16px}
.map-canvas{width:100%;height:100%}
.robot-position{position:absolute;width:20px;height:20px;background:var(--accent);border-radius:50%;border:2px solid #fff;transition:all .5s}
.cleaned-area{position:absolute;background:rgba(59,130,246,.2);border:1px solid var(--accent)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center}
.stat-label{font-size:.85rem;color:var(--text2);margin-bottom:4px}
.stat-value{font-size:1.5rem;font-weight:700;color:var(--accent)}
.mode-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.mode-btn{padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;text-align:center;transition:all .2s}
.mode-btn:hover{border-color:var(--accent)}
.mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.mode-btn .icon{font-size:1.5rem;margin-bottom:4px}
.mode-btn .label{font-size:.8rem}
.schedule-list{display:flex;flex-direction:column;gap:8px}
.schedule-item{padding:12px;background:var(--bg);border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.schedule-time{font-weight:600}
.schedule-days{font-size:.8rem;color:var(--text2)}
.room-list{display:flex;flex-direction:column;gap:8px}
.room-item{padding:12px;background:var(--bg);border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.room-info{display:flex;align-items:center;gap:12px}
.room-icon{font-size:1.5rem}
.room-name{font-weight:600}
.room-area{font-size:.85rem;color:var(--text2)}
.settings-group{margin-bottom:16px}
.settings-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:6px}
.settings-group input[type=text],.settings-group select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem}
.toggle-group{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.toggle-group:last-child{border-bottom:none}
.toggle{width:50px;height:26px;border-radius:13px;background:var(--border);position:relative;transition:background .2s;cursor:pointer}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .2s}
.toggle.on::after{transform:translateX(24px)}
button{padding:8px 16px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🤖 智能扫地机器人">
<meta property="og:description" content="智能扫地机器人控制，查看清扫状态、设置清扫计划与地图管理">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🤖 智能扫地机器人</h1><p>远程控制清扫，管理地图与计划</p></div>

<div class="cd">
<div class="robot-status">
<div class="robot-icon" id="robotIcon">🤖</div>
<div class="robot-text" id="robotText">待命中</div>
<div class="robot-battery">
<div class="battery-icon">🔋</div>
<div class="battery-bar"><div class="battery-fill" id="batteryFill" style="width:85%"></div></div>
<div class="battery-percent" id="batteryPercent">85%</div>
</div>
<div class="robot-controls">
<button class="robot-btn start" id="startBtn" onclick="startCleaning()">开始清扫</button>
<button class="robot-btn pause" id="pauseBtn" onclick="pauseCleaning()" style="display:none">暂停</button>
<button class="robot-btn stop" id="stopBtn" onclick="stopCleaning()" style="display:none">停止</button>
<button class="robot-btn dock" onclick="returnToDock()">回充</button>
</div>
</div>
</div>

<div class="cd">
<h2>清扫地图</h2>
<div class="map-container">
<canvas class="map-canvas" id="mapCanvas"></canvas>
<div class="robot-position" id="robotPos" style="left:50%;top:50%"></div>
</div>
<div style="display:flex;gap:8px;justify-content:center">
<button onclick="clearMap()">清除地图</button>
<button onclick="saveMap()">保存地图</button>
<button onclick="loadMap()">加载地图</button>
</div>
</div>

<div class="cd">
<h2>清扫统计</h2>
<div class="stats-grid">
<div class="stat-card">
<div class="stat-label">今日清扫</div>
<div class="stat-value" id="todayArea">0</div>
<div style="font-size:.8rem;color:var(--text2)">平方米</div>
</div>
<div class="stat-card">
<div class="stat-label">清扫时间</div>
<div class="stat-value" id="cleanTime">0</div>
<div style="font-size:.8rem;color:var(--text2)">分钟</div>
</div>
<div class="stat-card">
<div class="stat-label">清扫次数</div>
<div class="stat-value" id="cleanCount">0</div>
</div>
<div class="stat-card">
<div class="stat-label">滤网寿命</div>
<div class="stat-value" id="filterLife">95</div>
<div style="font-size:.8rem;color:var(--text2)">%</div>
</div>
</div>
</div>

<div class="cd">
<h2>清扫模式</h2>
<div class="mode-grid" id="modeGrid"></div>
</div>

<div class="cd">
<h2>房间管理</h2>
<div class="room-list" id="roomList"></div>
<div style="margin-top:12px">
<button onclick="addRoom()">+ 添加房间</button>
</div>
</div>

<div class="cd">
<h2>定时计划</h2>
<div class="schedule-list" id="scheduleList"></div>
<div style="margin-top:12px">
<button onclick="addSchedule()">+ 添加计划</button>
</div>
</div>

<div class="cd">
<h2>机器人设置</h2>
<div class="settings-group">
<label>机器人名称</label>
<input type="text" id="robotName" value="扫地机器人" onchange="saveSettings()">
</div>
<div class="settings-group">
<label>吸力档位</label>
<select id="suctionLevel" onchange="saveSettings()">
<option value="quiet">安静</option>
<option value="standard" selected>标准</option>
<option value="strong">强力</option>
<option value="turbo">极速</option>
</select>
</div>
<div class="toggle-group">
<span>自动回充</span>
<div class="toggle on" id="autoDockToggle" onclick="toggleSetting('autoDock')"></div>
</div>
<div class="toggle-group">
<span>断点续扫</span>
<div class="toggle on" id="resumeToggle" onclick="toggleSetting('resume')"></div>
</div>
<div class="toggle-group">
<span>勿扰模式</span>
<div class="toggle" id="dndToggle" onclick="toggleSetting('dnd')"></div>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let isCleaning=false;
let isPaused=false;
let battery=85;
let robotX=50;
let robotY=50;
let cleanedAreas=[];
let stats=JSON.parse(localStorage.getItem('sr_stats')||'{"todayArea":0,"cleanTime":0,"cleanCount":0,"filterLife":95}');
let rooms=JSON.parse(localStorage.getItem('sr_rooms')||'[]');
let schedules=JSON.parse(localStorage.getItem('sr_schedules')||'[]');
let settings=JSON.parse(localStorage.getItem('sr_settings')||'{"name":"扫地机器人","suction":"standard","autoDock":true,"resume":true,"dnd":false}');
const modes=[
  {id:'auto',icon:'🔄',name:'自动'},
  {id:'spot',icon:'🎯',name:'定点'},
  {id:'edge',icon:'🔲',name:'沿边'},
  {id:'room',icon:'🏠',name:'房间'},
  {id:'mop',icon:'💧',name:'拖地'},
  {id:'quiet',icon:'🤫',name:'安静'}
];
let currentMode='auto';

function saveStats(){localStorage.setItem('sr_stats',JSON.stringify(stats));}
function saveRooms(){localStorage.setItem('sr_rooms',JSON.stringify(rooms));}
function saveSchedules(){localStorage.setItem('sr_schedules',JSON.stringify(schedules));}
function saveSettings(){localStorage.setItem('sr_settings',JSON.stringify(settings));}

function updateUI(){
  $('robotName').value=settings.name;
  $('suctionLevel').value=settings.suction;
  ['autoDock','resume','dnd'].forEach(key=>{
    $(key+'Toggle').className='toggle '+(settings[key]?'on':'');
  });
  $('todayArea').textContent=stats.todayArea;
  $('cleanTime').textContent=stats.cleanTime;
  $('cleanCount').textContent=stats.cleanCount;
  $('filterLife').textContent=stats.filterLife;
  $('batteryFill').style.width=battery+'%';
  $('batteryPercent').textContent=battery+'%';
}

function renderModes(){
  $('modeGrid').innerHTML=modes.map(m=>`
    <div class="mode-btn ${m.id===currentMode?'active':''}" onclick="setMode('${m.id}')">
      <div class="icon">${m.icon}</div>
      <div class="label">${m.name}</div>
    </div>
  `).join('');
}

function setMode(mode){
  currentMode=mode;
  renderModes();
}

function startCleaning(){
  isCleaning=true;
  isPaused=false;
  $('robotText').textContent='清扫中...';
  $('robotIcon').textContent='🤖';
  $('startBtn').style.display='none';
  $('pauseBtn').style.display='inline-block';
  $('stopBtn').style.display='inline-block';
  moveRobot();
}

function pauseCleaning(){
  isPaused=!isPaused;
  $('robotText').textContent=isPaused?'已暂停':'清扫中...';
  $('pauseBtn').textContent=isPaused?'继续':'暂停';
}

function stopCleaning(){
  isCleaning=false;
  isPaused=false;
  $('robotText').textContent='待命中';
  $('startBtn').style.display='inline-block';
  $('pauseBtn').style.display='none';
  $('stopBtn').style.display='none';
  stats.cleanCount++;
  saveStats();
  updateUI();
}

function returnToDock(){
  isCleaning=false;
  isPaused=false;
  $('robotText').textContent='正在回充...';
  $('startBtn').style.display='inline-block';
  $('pauseBtn').style.display='none';
  $('stopBtn').style.display='none';
  robotX=50;
  robotY=50;
  $('robotPos').style.left=robotX+'%';
  $('robotPos').style.top=robotY+'%';
  setTimeout(()=>{
    $('robotText').textContent='已回充';
    battery=Math.min(100,battery+20);
    updateUI();
  },2000);
}

function moveRobot(){
  if(!isCleaning||isPaused)return;
  
  const canvas=$('mapCanvas');
  const rect=canvas.getBoundingClientRect();
  
  robotX+=((Math.random()-0.5)*10);
  robotY+=((Math.random()-0.5)*10);
  robotX=Math.max(5,Math.min(95,robotX));
  robotY=Math.max(5,Math.min(95,robotY));
  
  $('robotPos').style.left=robotX+'%';
  $('robotPos').style.top=robotY+'%';
  
  cleanedAreas.push({x:robotX,y:robotY});
  if(cleanedAreas.length>100)cleanedAreas.shift();
  
  battery=Math.max(0,battery-0.1);
  stats.todayArea+=0.01;
  stats.cleanTime+=1/60;
  
  updateUI();
  
  if(battery<=10&&settings.autoDock){
    returnToDock();
    return;
  }
  
  setTimeout(moveRobot,500);
}

function drawMap(){
  const canvas=$('mapCanvas');
  const ctx=canvas.getContext('2d');
  canvas.width=canvas.offsetWidth;
  canvas.height=canvas.offsetHeight;
  
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--bg');
  ctx.fillRect(0,0,canvas.width,canvas.height);
  
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--border');
  ctx.lineWidth=2;
  ctx.strokeRect(10,10,canvas.width-20,canvas.height-20);
  
  rooms.forEach(room=>{
    ctx.fillStyle='rgba(59,130,246,0.1)';
    ctx.fillRect(room.x,room.y,room.w,room.h);
    ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent');
    ctx.strokeRect(room.x,room.y,room.w,room.h);
  });
  
  if(cleanedAreas.length>1){
    ctx.strokeStyle='rgba(59,130,246,0.3)';
    ctx.lineWidth=10;
    ctx.lineCap='round';
    ctx.beginPath();
    cleanedAreas.forEach((p,i)=>{
      const x=p.x/100*canvas.width;
      const y=p.y/100*canvas.height;
      if(i===0)ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    });
    ctx.stroke();
  }
}

function clearMap(){
  cleanedAreas=[];
  drawMap();
}

function saveMap(){
  alert('地图已保存');
}

function loadMap(){
  alert('地图已加载');
}

function renderRooms(){
  $('roomList').innerHTML=rooms.map((r,i)=>`
    <div class="room-item">
      <div class="room-info">
        <div class="room-icon">🏠</div>
        <div>
          <div class="room-name">${r.name}</div>
          <div class="room-area">${r.area}平方米</div>
        </div>
      </div>
      <button onclick="removeRoom(${i})" style="background:var(--danger)">删除</button>
    </div>
  `).join('');
}

function addRoom(){
  const name=prompt('房间名称:');
  const area=prompt('面积(平方米):');
  if(name&&area){
    rooms.push({name,area:parseFloat(area),x:Math.random()*200,y:Math.random()*100,w:100,h:80});
    saveRooms();
    renderRooms();
    drawMap();
  }
}

function removeRoom(index){
  rooms.splice(index,1);
  saveRooms();
  renderRooms();
  drawMap();
}

function renderSchedules(){
  $('scheduleList').innerHTML=schedules.map((s,i)=>`
    <div class="schedule-item">
      <div>
        <div class="schedule-time">${s.time}</div>
        <div class="schedule-days">${s.days.join(', ')}</div>
      </div>
      <button onclick="removeSchedule(${i})" style="background:var(--danger)">删除</button>
    </div>
  `).join('');
}

function addSchedule(){
  const time=prompt('设置时间 (HH:MM):');
  if(time){
    schedules.push({time,days:['周一','周三','周五']});
    saveSchedules();
    renderSchedules();
  }
}

function removeSchedule(index){
  schedules.splice(index,1);
  saveSchedules();
  renderSchedules();
}

function toggleSetting(key){
  settings[key]=!settings[key];
  saveSettings();
  updateUI();
}

// Initialize with sample data
if(rooms.length===0){
  rooms=[
    {name:'客厅',area:25,x:20,y:20,w:150,h:100},
    {name:'卧室',area:15,x:200,y:20,w:120,h:100},
    {name:'厨房',area:10,x:20,y:140,w:100,h:80}
  ];
  saveRooms();
}

if(schedules.length===0){
  schedules=[
    {time:'09:00',days:['周一','周三','周五']},
    {time:'14:00',days:['周二','周四','周六']}
  ];
  saveSchedules();
}

updateUI();
renderModes();
renderRooms();
renderSchedules();
setTimeout(drawMap,100);
window.addEventListener('resize',drawMap);
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
