<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合同生成器</title>
<meta name="description" content="在线生成各类合同文本，支持劳动合同、租赁合同、合作协议等">
<script defer src="../i18n.js"></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;scroll-behavior:smooth;padding:16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
input,select,button,textarea{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:.9rem;font-family:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical;min-height:60px}
.btn{background:var(--blue);color:#fff;border:none;padding:8px 20px;border-radius:var(--radius);cursor:pointer;font-size:.9rem;transition:opacity .2s;display:inline-block;text-align:center}
.btn:hover{opacity:.85}
.btn-green{background:var(--green)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row .group{flex:1}
.group label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:var(--radius);cursor:pointer;font-size:.82rem;background:var(--card);border:1px solid var(--border);color:var(--text2);transition:all .2s}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.preview-box{background:#fff;color:#333;padding:24px;border-radius:var(--radius);border:1px solid #ddd;font-size:.82rem;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.output-area{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:12px}
@media(max-width:640px){.form-row{flex-direction:column}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="合同生成器">
<meta property="og:description" content="在线生成各类合同文本">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>📄 合同生成器</h1>
    <p>快速生成各类标准合同文本</p>
  </header>

  <div class="card">
    <div class="section-title">合同类型</div>
    <div class="tabs" id="typeTabs">
      <div class="tab active" data-type="labor">劳动合同</div>
      <div class="tab" data-type="rent">房屋租赁</div>
      <div class="tab" data-type="cooperation">合作协议</div>
      <div class="tab" data-type="service">服务合同</div>
      <div class="tab" data-type="nda">保密协议</div>
      <div class="tab" data-type="sale">买卖合同</div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">甲方信息</div>
    <div class="form-row">
      <div class="group"><label>甲方名称</label><input type="text" id="partyA" value="示例科技有限公司"></div>
      <div class="group"><label>法定代表人</label><input type="text" id="partyALegal" value="王五"></div>
    </div>
    <div class="form-row">
      <div class="group"><label>地址</label><input type="text" id="partyAAddr" value="北京市海淀区中关村"></div>
      <div class="group"><label>联系电话</label><input type="text" id="partyAPhone" value="010-12345678"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">乙方信息</div>
    <div class="form-row">
      <div class="group"><label>乙方名称</label><input type="text" id="partyB" value="张三"></div>
      <div class="group"><label>身份证号</label><input type="text" id="partyBId" value="110101199001011234"></div>
    </div>
    <div class="form-row">
      <div class="group"><label>地址</label><input type="text" id="partyBAddr" value="北京市朝阳区"></div>
      <div class="group"><label>联系电话</label><input type="text" id="partyBPhone" value="13800138000"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">合同条款</div>
    <div class="form-row">
      <div class="group"><label>合同金额（元）</label><input type="number" id="amount" value="10000"></div>
      <div class="group"><label>合同期限</label><input type="date" id="startDate"> <input type="date" id="endDate" style="margin-top:4px"></div>
    </div>
    <div class="form-row">
      <div class="group"><label>补充条款</label><textarea id="extraTerms" rows="3">双方应本着友好协商的原则解决争议。如有未尽事宜，双方可另行签订补充协议。</textarea></div>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn" onclick="generate()">生成合同</button>
    <button class="btn btn-green" onclick="copyContract()">复制</button>
    <button class="btn btn-outline" onclick="downloadContract()">下载 TXT</button>
  </div>

  <div class="output-area" id="outputArea" style="display:none">
    <div class="section-title">合同预览</div>
    <div class="preview-box" id="preview"></div>
  </div>
</div>

<script>
document.getElementById('startDate').value = new Date().toISOString().split('T')[0];
document.getElementById('endDate').value = new Date(Date.now() + 365*86400000).toISOString().split('T')[0];

var currentType = 'labor';
var typeNames = {labor:'劳动合同',rent:'房屋租赁合同',cooperation:'合作协议',service:'服务合同',nda:'保密协议',sale:'买卖合同'};

document.getElementById('typeTabs').addEventListener('click', function(e) {
  if (e.target.classList.contains('tab')) {
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
    e.target.classList.add('active');
    currentType = e.target.dataset.type;
  }
});

function getLaborClauses() {
  return '第一条 工作内容\n乙方同意根据甲方的工作安排，担任相应岗位工作。\n\n第二条 工作时间\n实行标准工时制度，每日工作8小时，每周工作5天。\n\n第三条 劳动报酬\n甲方按月支付乙方工资，工资标准为人民币' + Number(document.getElementById('amount').value).toLocaleString() + '元/月。\n\n第四条 社会保险\n甲方依法为乙方缴纳社会保险。\n\n第五条 合同期限\n本合同为固定期限劳动合同。';
}

function getRentClauses() {
  return '第一条 租赁物\n甲方将位于________________的房屋出租给乙方使用。\n\n第二条 租赁期限\n自' + document.getElementById('startDate').value + '起至' + document.getElementById('endDate').value + '止。\n\n第三条 租金及支付方式\n月租金为人民币' + Number(document.getElementById('amount').value).toLocaleString() + '元，按月支付。\n\n第四条 押金\n乙方应于签订合同时支付押金人民币' + (Number(document.getElementById('amount').value) * 2).toLocaleString() + '元。\n\n第五条 房屋维护\n乙方应合理使用并爱护房屋及其附属设施。';
}

function getCooperationClauses() {
  return '第一条 合作内容\n双方同意在________________领域开展合作。\n\n第二条 合作期限\n自' + document.getElementById('startDate').value + '起至' + document.getElementById('endDate').value + '止。\n\n第三条 权利义务\n1. 甲方负责：________________\n2. 乙方负责：________________\n\n第四条 利益分配\n合作收益按双方约定比例分配，合同金额为人民币' + Number(document.getElementById('amount').value).toLocaleString() + '元。\n\n第五条 违约责任\n任何一方违反本合同约定的，应承担违约责任。';
}

function getServiceClauses() {
  return '第一条 服务内容\n乙方为甲方提供以下服务：________________\n\n第二条 服务期限\n自' + document.getElementById('startDate').value + '起至' + document.getElementById('endDate').value + '止。\n\n第三条 服务费用\n服务总费用为人民币' + Number(document.getElementById('amount').value).toLocaleString() + '元。\n\n第四条 服务质量\n乙方应按照行业标准及甲方要求提供服务。\n\n第五条 验收标准\n甲方有权对乙方的服务成果进行验收。';
}

function getNdaClauses() {
  return '第一条 保密信息定义\n本协议所称保密信息包括但不限于：技术资料、商业计划、客户信息、财务数据等。\n\n第二条 保密义务\n双方对在合作过程中知悉的对方保密信息负有保密义务。\n\n第三条 保密期限\n保密期限自本协议签署之日起至' + document.getElementById('endDate').value + '止。\n\n第四条 违约赔偿\n违约方应赔偿守约方因此遭受的全部损失，合同金额为人民币' + Number(document.getElementById('amount').value).toLocaleString() + '元。';
}

function getSaleClauses() {
  return '第一条 标的物\n甲方将以下商品出售给乙方：________________\n\n第二条 价款及支付\n商品总价为人民币' + Number(document.getElementById('amount').value).toLocaleString() + '元。\n\n第三条 交付方式\n甲方应在' + document.getElementById('startDate').value + '前完成交付。\n\n第四条 质量保证\n甲方保证所售商品符合国家相关质量标准。\n\n第五条 验收与退换\n乙方应在收到商品后7日内完成验收。';
}

function generate() {
  var type = currentType;
  var pA = document.getElementById('partyA').value || '甲方';
  var pAL = document.getElementById('partyALegal').value;
  var pAA = document.getElementById('partyAAddr').value;
  var pAP = document.getElementById('partyAPhone').value;
  var pB = document.getElementById('partyB').value || '乙方';
  var pBI = document.getElementById('partyBId').value;
  var pBA = document.getElementById('partyBAddr').value;
  var pBP = document.getElementById('partyBPhone').value;
  var amount = Number(document.getElementById('amount').value).toLocaleString();
  var start = document.getElementById('startDate').value;
  var end = document.getElementById('endDate').value;
  var extra = document.getElementById('extraTerms').value;

  var clauseFuncs = {labor:getLaborClauses,rent:getRentClauses,cooperation:getCooperationClauses,service:getServiceClauses,nda:getNdaClauses,sale:getSaleClauses};
  var clauses = clauseFuncs[type]();

  var p = '                    ' + typeNames[type] + '\n\n';
  p += '合同编号: HT-' + Date.now().toString(36).toUpperCase() + '\n\n';
  p += '甲方（' + (type === 'labor' ? '用人单位' : '合同方') + '）: ' + pA + '\n';
  if (pAL) p += '法定代表人: ' + pAL + '\n';
  if (pAA) p += '地址: ' + pAA + '\n';
  if (pAP) p += '电话: ' + pAP + '\n\n';
  p += '乙方（' + (type === 'labor' ? '劳动者' : '合同方') + '）: ' + pB + '\n';
  if (pBI) p += '身份证号: ' + pBI + '\n';
  if (pBA) p += '地址: ' + pBA + '\n';
  if (pBP) p += '电话: ' + pBP + '\n\n';
  p += '签约日期: ' + start + '\n';
  p += '──────────────────────────────────────\n\n';
  p += clauses + '\n\n';
  if (extra) {
    p += '──────────────────────────────────────\n';
    p += '补充条款\n──────────────────────────────────────\n\n';
    p += extra + '\n\n';
  }
  p += '──────────────────────────────────────\n\n';
  p += '甲方签章: ________________    乙方签章: ________________\n\n';
  p += '日期: ' + start + '        日期: ' + start + '\n';
  p += '──────────────────────────────────────\n';
  p += '（本合同一式两份，双方各执一份，具有同等法律效力）';

  document.getElementById('preview').textContent = p;
  document.getElementById('outputArea').style.display = 'block';
  document.getElementById('outputArea').scrollIntoView({ behavior: 'smooth' });
}

function copyContract() {
  generate();
  navigator.clipboard.writeText(document.getElementById('preview').textContent).then(function() {
    alert('已复制到剪贴板');
  });
}

function downloadContract() {
  generate();
  var blob = new Blob([document.getElementById('preview').textContent], { type: 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = typeNames[currentType] + '.txt';
  a.click();
}
</script>
</body>
</html>
