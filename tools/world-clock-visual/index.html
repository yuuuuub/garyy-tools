<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 世界时钟</title>
<meta property="og:title" content="🌍 世界时钟">
<meta property="og:description" content="🌍 世界时钟 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="世界时钟可视化 - 同时查看全球多个城市时间，支持添加和动画显示">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#3b82f6;--green:#238636;--red:#ef4444;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button,select{font-family:inherit;font-size:.95rem}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.clock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.clock-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;position:relative;transition:all .3s}
.clock-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.clock-card .city{font-size:1rem;font-weight:600;margin-bottom:4px}
.clock-card .country{font-size:.8rem;color:var(--text2);margin-bottom:8px}
.clock-card .time{font-size:1.8rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.clock-card .date{font-size:.8rem;color:var(--text2);margin-top:4px}
.clock-card .offset{font-size:.75rem;color:var(--text2);margin-top:2px}
.clock-card .day-night{font-size:1.5rem;margin-bottom:4px}
.clock-card .remove{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;border:none;cursor:pointer;font-size:.7rem;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.clock-card:hover .remove{opacity:1}
.analog-clock{width:120px;height:120px;border-radius:50%;border:3px solid var(--border);position:relative;margin:0 auto 8px}
.analog-clock .hand{position:absolute;bottom:50%;left:50%;transform-origin:bottom center;border-radius:2px}
.analog-clock .hour{width:3px;height:30px;background:var(--text);margin-left:-1.5px}
.analog-clock .minute{width:2px;height:40px;background:var(--accent);margin-left:-1px}
.analog-clock .second{width:1px;height:45px;background:var(--danger);margin-left:-.5px}
.analog-clock .center{width:8px;height:8px;border-radius:50%;background:var(--accent);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.analog-clock .tick{position:absolute;width:2px;height:6px;background:var(--text2);top:4px;left:50%;margin-left:-1px;transform-origin:center 52px}
.es{text-align:center;padding:40px;color:var(--text2)}
.hidden{display:none}
.local-time{text-align:center;font-size:2.5rem;font-weight:700;color:var(--accent);margin:12px 0}
.local-date{text-align:center;color:var(--text2);font-size:1rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🌍 世界时钟</h1><p>同时查看全球多个城市时间</p></div>

<div class="cd" style="text-align:center">
<h2>本地时间</h2>
<div class="local-date" id="localDate"></div>
<div class="local-time" id="localTime"></div>
</div>

<div class="cd">
<h2>添加城市</h2>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end">
<div style="flex:1;min-width:200px">
<label style="margin-top:0">选择城市</label>
<select id="citySelect"></select>
</div>
<button onclick="addClock()">添加时钟</button>
</div>
</div>

<div class="cd">
<h2>世界时钟</h2>
<div id="clockGrid" class="clock-grid">
<div class="es">点击上方添加城市时钟</div>
</div>
</div>

<div class="cd">
<h2>时差对比</h2>
<div id="diffTable"></div>
</div>
</div>

<script>
const cities=[
  {name:'北京',tz:'Asia/Shanghai',flag:'🇨🇳',country:'中国'},
  {name:'东京',tz:'Asia/Tokyo',flag:'🇯🇵',country:'日本'},
  {name:'首尔',tz:'Asia/Seoul',flag:'🇰🇷',country:'韩国'},
  {name:'新加坡',tz:'Asia/Singapore',flag:'🇸🇬',country:'新加坡'},
  {name:'悉尼',tz:'Australia/Sydney',flag:'🇦🇺',country:'澳大利亚'},
  {name:'伦敦',tz:'Europe/London',flag:'🇬🇧',country:'英国'},
  {name:'巴黎',tz:'Europe/Paris',flag:'🇫🇷',country:'法国'},
  {name:'柏林',tz:'Europe/Berlin',flag:'🇩🇪',country:'德国'},
  {name:'莫斯科',tz:'Europe/Moscow',flag:'🇷🇺',country:'俄罗斯'},
  {name:'纽约',tz:'America/New_York',flag:'🇺🇸',country:'美国(东)'},
  {name:'芝加哥',tz:'America/Chicago',flag:'🇺🇸',country:'美国(中)'},
  {name:'丹佛',tz:'America/Denver',flag:'🇺🇸',country:'美国(山)'},
  {name:'洛杉矶',tz:'America/Los_Angeles',flag:'🇺🇸',country:'美国(西)'},
  {name:'迪拜',tz:'Asia/Dubai',flag:'🇦🇪',country:'阿联酋'},
  {name:'孟买',tz:'Asia/Kolkata',flag:'🇮🇳',country:'印度'},
  {name:'曼谷',tz:'Asia/Bangkok',flag:'🇹🇭',country:'泰国'},
  {name:'香港',tz:'Asia/Hong_Kong',flag:'🇭🇰',country:'中国香港'},
  {name:'台北',tz:'Asia/Taipei',flag:'🇹🇼',country:'中国台湾'},
  {name:'开罗',tz:'Africa/Cairo',flag:'🇪🇬',country:'埃及'},
  {name:'圣保罗',tz:'America/Sao_Paulo',flag:'🇧🇷',country:'巴西'},
  {name:'温哥华',tz:'America/Vancouver',flag:'🇨🇦',country:'加拿大'},
  {name:'多伦多',tz:'America/Toronto',flag:'🇨🇦',country:'加拿大'},
  {name:'奥克兰',tz:'Pacific/Auckland',flag:'🇳🇿',country:'新西兰'},
  {name:'柏林',tz:'Europe/Berlin',flag:'🇩🇪',country:'德国'},
  {name:'马德里',tz:'Europe/Madrid',flag:'🇪🇸',country:'西班牙'},
  {name:'罗马',tz:'Europe/Rome',flag:'🇮🇹',country:'意大利'},
  {name:'雅加达',tz:'Asia/Jakarta',flag:'🇮🇩',country:'印尼'},
  {name:'利雅得',tz:'Asia/Riyadh',flag:'🇸🇦',country:'沙特'},
  {name:'德黑兰',tz:'Asia/Tehran',flag:'🇮🇷',country:'伊朗'},
  {name:'伊斯坦布尔',tz:'Europe/Istanbul',flag:'🇹🇷',country:'土耳其'}
];

let clocks=[];let timerInterval;
function $(id){return document.getElementById(id)}
function load(){try{return JSON.parse(localStorage.getItem('world-clock-cities'))}catch(e){return null}}
function save(){localStorage.setItem('world-clock-cities',JSON.stringify(clocks))}

function initSelect(){
  const s=$('citySelect');s.innerHTML='';
  cities.forEach((c,i)=>{s.innerHTML+='<option value="'+i+'">'+c.flag+' '+c.name+' ('+c.country+')</option>'});
}

function addClock(){
  const idx=parseInt($('citySelect').value);
  const city=cities[idx];
  if(clocks.find(c=>c.tz===city.tz))return alert('已添加该城市');
  clocks.push({...city});save();renderClocks();
}

function removeClock(i){clocks.splice(i,1);save();renderClocks()}

function getTimeStr(tz){return new Date().toLocaleString('zh-CN',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})}

function getHour(tz){return parseInt(new Date().toLocaleString('zh-CN',{timeZone:tz,hour12:false,hour:'numeric'}))}
function isDay(h){return h>=6&&h<18}

function renderClocks(){
  const g=$('clockGrid');
  if(!clocks.length){g.innerHTML='<div class="es">点击上方添加城市时钟</div>';return}
  g.innerHTML=clocks.map((c,i)=>{
    const h=getHour(c.tz);
    const dayNight=isDay(h)?'☀️':'🌙';
    const offset=new Date().toLocaleString('en',{timeZone:c.tz,timeZoneName:'shortOffset'}).split(' ').pop();
    return '<div class="clock-card" id="cc'+i+'"><button class="remove" onclick="removeClock('+i+')">×</button><div class="day-night">'+dayNight+'</div><div class="analog-clock" id="ac'+i+'"><div class="hand hour" id="ah'+i+'"></div><div class="hand minute" id="am'+i+'"></div><div class="hand second" id="as'+i+'"></div><div class="center"></div></div><div class="city">'+c.flag+' '+c.name+'</div><div class="country">'+c.country+'</div><div class="time" id="ct'+i+'">--:--:--</div><div class="offset">UTC '+offset+'</div></div>';
  }).join('');
  updateClocks();
}

function updateClocks(){
  const now=new Date();
  $('localTime').textContent=now.toLocaleTimeString('zh-CN',{hour12:false});
  $('localDate').textContent=now.toLocaleDateString('zh-CN',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  clocks.forEach((c,i)=>{
    try{
      const parts=now.toLocaleString('en',{timeZone:c.tz,hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'}).split(':');
      const h=parseInt(parts[0]),m=parseInt(parts[1]),s=parseInt(parts[2]);
      const el=$('ct'+i);if(el)el.textContent=(h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
      const hDeg=(h%12)*30+m*0.5,mDeg=m*6,sDeg=s*6;
      const ah=$('ah'+i),am=$('am'+i),as=$('as'+i);
      if(ah)ah.style.transform='rotate('+hDeg+'deg)';
      if(am)am.style.transform='rotate('+mDeg+'deg)';
      if(as)as.style.transform='rotate('+sDeg+'deg)';
    }catch(e){}
  });
  renderDiffTable();
}

function renderDiffTable(){
  if(clocks.length<2){$('diffTable').innerHTML='<div style="color:var(--text2)">添加2个以上城市可查看时差</div>';return}
  let html='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem"><tr><th style="padding:8px;border-bottom:1px solid var(--border);text-align:left"></th>';
  clocks.forEach(c=>{html+='<th style="padding:8px;border-bottom:1px solid var(--border);text-align:center">'+c.flag+' '+c.name+'</th>'});
  html+='</tr>';
  clocks.forEach((c1,i)=>{
    html+='<tr><td style="padding:8px;border-bottom:1px solid var(--border);font-weight:600">'+c1.flag+' '+c1.name+'</td>';
    clocks.forEach((c2,j)=>{
      if(i===j){html+='<td style="padding:8px;border-bottom:1px solid var(--border);text-align:center;color:var(--text2)">—</td>';return}
      const h1=getHour(c1.tz),h2=getHour(c2.tz);
      let diff=h2-h1;if(diff>12)diff-=24;if(diff<-12)diff+=24;
      const color=diff>0?'var(--success)':diff<0?'var(--danger)':'var(--text2)';
      html+='<td style="padding:8px;border-bottom:1px solid var(--border);text-align:center;color:'+color+'">'+(diff>0?'+':'')+diff+'h</td>';
    });
    html+='</tr>';
  });
  html+='</table></div>';
  $('diffTable').innerHTML=html;
}

initSelect();
clocks=load()||[];
if(!clocks.length)clocks=[cities[0],cities[13],cities[5]];
renderClocks();
timerInterval=setInterval(updateClocks,1000);
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
