function initSelects(){

  var hSel=document.getElementById('t-hour');
  var hours=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];

}

  document.querySelectorAll('.tab-content').forEach(function(c){c.classList.remove('active')});
  btn.classList.add('active');
  document.getElementById('tab-'+id).classList.add('active');
}
function getGuaByNum(n){

}

  return sixtyFour.find(function(g){return g.upper===upper.name&&g.lower===lower.name})||{name:upper.name+'上'+lower.name+'下',meaning:'此卦待解'};
}
