<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;padding:16px}

.hdr p{color:var(--text2);margin-top:4px;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}

#breadcrumb span{cursor:pointer;color:var(--accent);margin:0 4px}
#tooltip{position:fixed;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:.8rem;pointer-events:none;display:none;z-index:200;box-shadow:var(--shadow)}
</style>

<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>

<div class="hdr"><h1>☀️ 旭日图</h1><p>放射状层次结构可视化</p></div>

<div class="card">
<h2>数据输入 (JSON)</h2>
<textarea id="dataInput">{
  "name": "公司",
  "children": [
    {"name": "技术部", "value": 300, "children": [
      {"name": "前端组", "value": 120},
      {"name": "后端组", "value": 100},
      {"name": "运维组", "value": 80}
    ]},
    {"name": "市场部", "value": 200, "children": [
      {"name": "线上推广", "value": 120},
      {"name": "线下活动", "value": 80}
    ]},
    {"name": "人事部", "value": 100},
    {"name": "财务部", "value": 80}
  ]
}</textarea>
<div class="btn-row">
<button onclick="generate()">生成旭日图</button>
<button class="sec" onclick="loadSample()">加载示例</button>
<button class="sec" onclick="exportPNG()">💾 导出PNG</button>
</div>
</div>

<div class="card" style="text-align:center">
<div id="breadcrumb">根目录</div>
<canvas id="canvas" width="600" height="600"></canvas>
<div id="tooltip"></div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
const breadcrumb = document.getElementById('breadcrumb');

const PALETTE = ['#3b82f6','#ef4444','#22c55e','#f59e0b','#8b5cf6','#ec4899','#06b6d4','#f97316','#14b8a6','#a855f7','#e11d48','#0891b2'];

let root = null;
let segments = [];
let hoverSeg = null;
let zoomNode = null;

function resize() {
  const s = Math.min(600, window.innerWidth - 80);
  canvas.width = s;
  canvas.height = s;
}
resize();
window.addEventListener('resize', () => { resize(); draw(); });

function totalValue(node) {
  if(node.children && node.children.length) return node.children.reduce((s,c) => s+totalValue(c), 0);
  return node.value || 0;
}

function buildSegments(node, cx, cy, innerR, outerR, startAngle, endAngle, depth, parentColor) {
  if(!node) return;
  const val = totalValue(node);
  if(val === 0) return;

  if(depth === 0) {
    // Center circle
    segments.push({node, cx, cy, innerR: 0, outerR: innerR, startAngle: 0, endAngle: Math.PI*2, depth: 0});
    if(node.children) {
      node.children.forEach((child, i) => {
        const childVal = totalValue(child);
        const childAngle = (childVal / val) * (endAngle - startAngle);
        const color = PALETTE[i % PALETTE.length];
        buildSegments(child, cx, cy, innerR, outerR, startAngle, startAngle + childAngle, depth + 1, color);
        startAngle += childAngle;
      });
    }
    return;
  }

  segments.push({node, cx, cy, innerR, outerR, startAngle, endAngle, depth, color: parentColor});

  if(node.children && node.children.length) {
    const childOuterR = outerR + (outerR - innerR) * 0.8;
    node.children.forEach((child, i) => {
      const childVal = totalValue(child);
      const childAngle = (childVal / val) * (endAngle - startAngle);
      const darker = adjustBrightness(parentColor, -20 - i*10);
      buildSegments(child, cx, cy, outerR, childOuterR, startAngle, startAngle + childAngle, depth + 1, darker);
      startAngle += childAngle;
    });
  }
}

function adjustBrightness(hex, amount) {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.max(0, ((num >> 16) & 0xFF) + amount));
  const g = Math.min(255, Math.max(0, ((num >> 8) & 0xFF) + amount));
  const b = Math.min(255, Math.max(0, (num & 0xFF) + amount));
  return '#' + ((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

function draw() {
  const cx = canvas.width/2, cy = canvas.height/2;
  const maxR = Math.min(cx, cy) - 10;
  const innerR = maxR * 0.25;

  segments = [];
  if(root) buildSegments(root, cx, cy, innerR, maxR, -Math.PI/2, Math.PI*1.5, 0, '#3b82f6');

  ctx.clearRect(0,0,canvas.width,canvas.height);

  segments.forEach((s,i) => {
    if(s.depth === 0) return;
    ctx.beginPath();
    ctx.arc(s.cx, s.cy, s.outerR, s.startAngle, s.endAngle);
    ctx.arc(s.cx, s.cy, s.innerR, s.endAngle, s.startAngle, true);
    ctx.closePath();
    ctx.fillStyle = s === hoverSeg ? adjustBrightness(s.color, 30) : s.color;
    ctx.fill();
    ctx.strokeStyle = '#0d1117';
    ctx.lineWidth = 2;
    ctx.stroke();

    const midAngle = (s.startAngle + s.endAngle) / 2;
    const midR = (s.innerR + s.outerR) / 2;
    const arcLen = (s.endAngle - s.startAngle) * midR;
    if(arcLen > 25) {
      ctx.save();
      ctx.translate(s.cx + Math.cos(midAngle)*midR, s.cy + Math.sin(midAngle)*midR);
      ctx.fillStyle = '#fff';
      ctx.font = arcLen > 50 ? 'bold 12px sans-serif' : '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const name = s.node.name.length > 8 ? s.node.name.slice(0,8)+'..' : s.node.name;
      ctx.fillText(name, 0, 0);
      ctx.restore();
    }
  });

  // Center label
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const centerName = zoomNode ? zoomNode.name : (root ? root.name : '');
  ctx.fillText(centerName, cx, cy);
  ctx.font = '12px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText(zoomNode ? totalValue(zoomNode) : (root ? totalValue(root) : ''), cx, cy+20);
}

function getSegment(cx, cy, x, y) {
  const dx = x - cx, dy = y - cy;
  const dist = Math.sqrt(dx*dx+dy*dy);
  let angle = Math.atan2(dy, dx);
  return segments.find(s => s.depth > 0 && dist >= s.innerR && dist <= s.outerR && angle >= s.startAngle && angle <= s.endAngle);
}

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const seg = getSegment(canvas.width/2, canvas.height/2, x, y);
  hoverSeg = seg;
  draw();
  if(seg) {
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX+12)+'px';
    tooltip.style.top = (e.clientY+12)+'px';
    tooltip.innerHTML = `<strong>${seg.node.name}</strong><br>值: ${totalValue(seg.node)}`;
  } else {
    tooltip.style.display = 'none';
  }
});

canvas.addEventListener('mouseleave', () => { hoverSeg = null; tooltip.style.display='none'; draw(); });

canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const seg = getSegment(canvas.width/2, canvas.height/2, x, y);
  if(seg && seg.node.children && seg.node.children.length) {
    zoomNode = seg.node;
    updateBreadcrumb();
    generate();
  }
});

function updateBreadcrumb() {
  const parts = [];
  let node = zoomNode;
  const path = [];
  function findPath(n, target, current) {
    if(n === target) { path.push(...current, n); return true; }
    if(n.children) {
      for(const c of n.children) {
        if(findPath(c, target, [...current, n])) return true;
      }
    }
    return false;
  }
  if(zoomNode && root) findPath(root, zoomNode, []);
  else path.push(root);

  breadcrumb.innerHTML = path.map((p,i) =>
    `<span onclick="zoomTo(${i})">${p.name}</span>${i<path.length-1?' → ':''}`
  ).join('');
}

window.zoomTo = function(idx) {
  if(idx === 0) zoomNode = null;
  else {
    let node = root;
    for(let i=1; i<=idx; i++) {
      // simplified: just go back to root
    }
    zoomNode = null;
  }
  generate();
};

function generate() {
  try {
    const data = JSON.parse(document.getElementById('dataInput').value);
    root = data;
    if(zoomNode) {
      // Find zoomNode in new data
      function findNode(n, name) {
        if(n.name === name) return n;
        if(n.children) {
          for(const c of n.children) {
            const found = findNode(c, name);
            if(found) return found;
          }
        }
        return null;
      }
      const found = findNode(data, zoomNode.name);
      zoomNode = found || null;
    }
    updateBreadcrumb();
    draw();
  } catch(e) {
    alert('JSON格式错误: ' + e.message);
  }
}

function loadSample() {
  document.getElementById('dataInput').value = JSON.stringify({
    name:"技术栈",children:[
      {name:"前端",value:250,children:[{name:"React",value:120},{name:"Vue",value:80},{name:"Angular",value:50}]},
      {name:"后端",value:300,children:[{name:"Node.js",value:120},{name:"Java",value:100},{name:"Python",value:80}]},
      {name:"数据库",value:180,children:[{name:"MySQL",value:80},{name:"Redis",value:50},{name:"MongoDB",value:50}]},
      {name:"云服务",value:150,children:[{name:"AWS",value:80},{name:"Cloudflare",value:70}]}
    ]
  },null,2);
  zoomNode = null;
  generate();
}

function exportPNG() {
  const link = document.createElement('a');
  link.download = 'sunburst-chart.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

generate();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
