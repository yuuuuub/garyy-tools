<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国陶瓷鉴赏</title><meta name="description" content="中国陶瓷鉴赏 - 在线了解中国陶瓷艺术"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#d4a017;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#b8860b}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;cursor:pointer;transition:transform .2s}.item:hover{transform:translateY(-2px)}.item-title{font-size:1.2rem;font-weight:600;color:var(--gold);margin-bottom:8px}.item-meta{font-size:.9rem;color:var(--text2);margin-bottom:4px}.item-display{font-size:3rem;text-align:center;padding:30px;background:var(--bg);border-radius:8px;margin-bottom:12px;min-height:100px;display:flex;align-items:center;justify-content:center}.item-desc{font-size:.9rem;color:var(--text)}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{display:inline-block;padding:6px 14px;background:var(--bg);border:1px solid var(--border);border-radius:20px;color:var(--text2);font-size:.85rem;cursor:pointer;transition:all .2s}.btn:hover{border-color:var(--blue);color:var(--blue)}.btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center}.modal-overlay.show{display:flex}.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:700px;width:90%;max-height:80vh;overflow-y:auto;position:relative}.modal h2{color:var(--gold);margin-bottom:12px}.modal p{color:var(--text2);line-height:1.8;margin-bottom:12px}.close-btn{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--text2);font-size:1.5rem;cursor:pointer}.theme-toggle{position:fixed;top:8px;right:80px;z-index:9999;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 12px;cursor:pointer;color:var(--text);font-size:.75rem}</style><meta property="og:title" content="中国陶瓷鉴赏"><meta property="og:description" content="中国陶瓷鉴赏 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏺</text></svg>"></head><body>
<button class="theme-toggle" onclick="toggleTheme()">🌓</button>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🏺 中国陶瓷鉴赏</h1><p class="sub">在线了解中国陶瓷艺术</p>
<div class="card"><div class="search-box"><input type="text" id="searchInput" placeholder="搜索陶瓷名称..." oninput="filterItems()"></div>
<div class="btn-group"><button class="btn active" onclick="filterByType('all',this)">全部</button><button class="btn" onclick="filterByType('青瓷',this)">青瓷</button><button class="btn" onclick="filterByType('白瓷',this)">白瓷</button><button class="btn" onclick="filterByType('青花',this)">青花瓷</button><button class="btn" onclick="filterByType('彩瓷',this)">彩瓷</button><button class="btn" onclick="filterByType('黑瓷',this)">黑瓷</button></div></div>
<div id="itemList"></div></div>
<div class="modal-overlay" id="modal"><div class="modal"><button class="close-btn" onclick="closeModal()">×</button><h2 id="modalTitle"></h2><div id="modalDisplay" class="item-display"></div><p id="modalMeta"></p><p id="modalDesc"></p><p id="modalDetail" style="padding-top:12px;border-top:1px solid var(--border);margin-top:8px"></p></div></div>
<script src="../i18n.js" defer></script>
<script>
var items=[
  {title:'汝窑天青釉洗',type:'青瓷',emoji:'🥣',desc:'北宋汝窑的代表作品，釉色如"雨过天青云破处"，温润如玉。传世仅存约90件，极为珍贵。',detail:'汝窑为宋代五大名窑之首，因产于河南汝州而得名。其釉色以天青色为最佳，釉面有细碎开片，工艺精湛。'},
  {title:'越窑秘色瓷',type:'青瓷',emoji:'🍵',desc:'唐代越窑的巅峰之作，釉色青翠如湖水，被誉为"千峰翠色"。法门寺地宫出土的秘色瓷举世震惊。',detail:'秘色瓷是越窑青瓷中的精品，因其釉色配方保密而得名。"九秋风露越窑开，夺得千峰翠色来"是对其的生动描绘。'},
  {title:'定窑白瓷孩儿枕',type:'白瓷',emoji:'👶',desc:'北宋定窑的代表作，以白瓷塑成枕形，孩童俯卧其上，造型生动可爱，是定窑白瓷的国宝级文物。',detail:'定窑是宋代五大名窑之一，以白瓷著称。其胎质细腻，釉色白中泛牙黄，刻花、印花工艺精湛。'},
  {title:'元青花鬼谷子下山罐',type:'青花',emoji:'📜',desc:'2005年在伦敦拍出2.3亿元人民币天价，创中国艺术品拍卖纪录。描绘鬼谷子下山营救弟子的故事。',detail:'元代青花瓷是中国陶瓷史上的里程碑，以其雄浑的造型、繁密的纹饰和浓艳的青花发色著称。'},
  {title:'明永乐甜白釉僧帽壶',type:'白瓷',emoji:'🫖',desc:'明永乐时期的白瓷精品，釉色白如凝脂，温润细腻。因形似僧人戴的帽子而得名。',detail:'永乐甜白釉是明代白瓷的巅峰之作，釉层肥厚，色泽温润，给人以甜美的感觉。'},
  {title:'清雍正粉彩瓷',type:'彩瓷',emoji:'🌸',desc:'清代粉彩瓷的代表，以粉润柔和的色彩著称，图案精美，是宫廷御用瓷器的精品。',detail:'粉彩瓷创烧于康熙晚期，雍正时期达到巅峰。其在釉上彩的基础上加入了玻璃白，使色彩呈现粉润柔和的效果。'},
  {title:'建窑兔毫盏',type:'黑瓷',emoji:'🍵',desc:'宋代建窑黑釉茶盏的精品，釉面呈现如兔毛般的细密条纹，是斗茶文化的最佳器具。',detail:'建窑位于福建建阳，以黑釉瓷著称。兔毫盏是建窑最著名的品种，其釉面的"兔毫"纹理是铁元素在高温下的自然结晶。'},
  {title:'钧窑玫瑰紫鼓钉洗',type:'青瓷',emoji:'🛁',desc:'宋代钧窑的代表作，釉色变幻莫测，红紫交融如玫瑰，体现了"入窑一色，出窑万彩"的神奇。',detail:'钧窑是宋代五大名窑之一，以其窑变釉色闻名。钧瓷的釉色在烧制过程中自然变化，每件作品都独一无二。'},
  {title:'明成化斗彩鸡缸杯',type:'彩瓷',emoji:'🐔',desc:'明代成化年间的斗彩精品，杯身绘有母鸡带小鸡觅食的场景，色彩明快，画工精细。',detail:'斗彩是先用青花勾勒轮廓，再在釉上填彩的工艺。成化斗彩是斗彩瓷的巅峰，鸡缸杯更是稀世珍品。'},
  {title:'龙泉窑梅子青',type:'青瓷',emoji:'🫒',desc:'南宋龙泉窑的代表釉色，色泽如青梅般鲜嫩，釉层厚润，是青瓷釉色的极致追求。',detail:'龙泉窑位于浙江龙泉，以青瓷著称。梅子青釉是龙泉窑创新的釉色品种，釉层比粉青更厚，色泽更加青翠。'},
  {title:'唐三彩骆驼载乐俑',type:'彩瓷',emoji:'🐫',desc:'唐代三彩釉陶的代表作，骆驼背上载有西域乐队，展现了盛唐时期的丝绸之路文化交流。',detail:'唐三彩以黄、绿、白三色为主，是唐代低温铅釉陶器的代表。虽然不是严格意义上的瓷器，但在中国陶瓷史上占有重要地位。'},
  {title:'德化窑白瓷观音',type:'白瓷',emoji:'🙏',desc:'明代德化窑的代表作品，白瓷塑成观音像，釉色温润如象牙，被誉为"中国白"。',detail:'德化窑位于福建德化，以白瓷著称。其白瓷釉色温润，胎质细腻，适合雕塑，被称为"象牙白"或"猪油白"。'}
];
var currentType='all';
function renderItems(list){
  var el=document.getElementById('itemList');
  var html='';
  list.forEach(function(p,i){
    html+='<div class="item" onclick="showDetail('+items.indexOf(p)+')">';
    html+='<div class="item-title">'+p.emoji+' '+p.title+'</div>';
    html+='<div class="item-meta">'+p.type+'</div>';
    html+='<div class="item-display">'+p.emoji+'</div>';
    html+='<div class="item-desc">'+p.desc.substring(0,60)+'...</div>';
    html+='</div>';
  });
  el.innerHTML=html||'<div class="card" style="text-align:center;color:var(--text2)">未找到匹配的陶瓷</div>';
}
function filterItems(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var filtered=items.filter(function(p){return(p.title.includes(q)||p.desc.includes(q))&&(currentType==='all'||p.type===currentType);});
  renderItems(filtered);
}
function filterByType(type,btn){
  currentType=type;
  document.querySelectorAll('.btn-group .btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  filterItems();
}
function showDetail(i){
  var p=items[i];
  document.getElementById('modalTitle').textContent=p.title;
  document.getElementById('modalDisplay').textContent=p.emoji;
  document.getElementById('modalMeta').textContent=p.type;
  document.getElementById('modalDesc').textContent=p.desc;
  document.getElementById('modalDetail').textContent=p.detail;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='light'?'dark':'light');}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
renderItems(items);
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
