<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 中文考试准备工具</title>
<meta property="og:title" content="🎓 中文考试准备工具">
<meta property="og:description" content="🎓 中文考试准备工具 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="考试准备工具，支持题库管理、模拟考试、错题集、分数预测">
<meta name="robots" content="index, follow">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
button.grn{background:var(--green)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
label{display:block;font-size:.85rem;color:var(--text2);margin:8px 0 4px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hidden{display:none}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;text-align:center;margin:16px 0}
.stat-box{padding:14px;background:var(--bg);border-radius:8px}
.stat-num{font-size:1.5rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.75rem;color:var(--text2);margin-top:4px}
.progress-bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;border-radius:4px;transition:width .3s}
.table{width:100%;border-collapse:collapse;margin-top:8px}
.table th,.table td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:.9rem}
.table th{color:var(--text2);font-weight:600}
.table tr:hover{background:rgba(59,130,246,.05)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600}
.badge-correct{background:rgba(63,185,80,.2);color:var(--green)}
.badge-wrong{background:rgba(248,81,73,.2);color:var(--red)}
.countdown{font-size:2.5rem;font-weight:700;color:var(--accent);text-align:center}
.radio-opt{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--border);border-radius:8px;margin:6px 0;cursor:pointer;transition:all .15s}
.radio-opt:hover{border-color:var(--accent)}
.radio-opt.selected{border-color:var(--accent);background:rgba(59,130,246,.1)}
.radio-opt.correct{border-color:var(--green);background:rgba(63,185,80,.1)}
.radio-opt.wrong{border-color:var(--red);background:rgba(248,81,73,.1)}
.fill-input{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);margin:6px 0}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1 style="position:fixed;top:6px;left:80px;z-index:999;font-size:1rem;pointer-events:none">🎓 中文考试准备工具</h1>

<div class="ctn" style="padding-top:50px">
<div class="bg" style="justify-content:center;margin-bottom:20px">
<button onclick="showView('exams')" id="btn-exams">📋 考试</button>
<button onclick="showView('practice')" id="btn-practice">📝 练习</button>
<button onclick="showView('wrong')" id="btn-wrong">❌ 错题集</button>
<button onclick="showView('sim')" id="btn-sim">⏱️ 模拟考</button>
<button onclick="showView('stats')" id="btn-stats">📊 统计</button>
</div>

<div id="view-exams">
<div class="bg"><button onclick="createExam()">+ 新建考试</button><button class="sec" onclick="loadDemo()">📖 示例</button><button class="sec" onclick="exportData()">💾 导出</button></div>
<div id="exam-list"></div>
<div class="countdown-area" id="countdown-area" class="hidden"></div>
</div>

<div id="view-practice" class="hidden"><div id="practice-area"><div class="empty" style="text-align:center;padding:40px;color:var(--text2)">选择一个考试开始练习</div></div></div>
<div id="view-wrong" class="hidden"><div id="wrong-list"></div></div>
<div id="view-sim" class="hidden"><div id="sim-area"><div class="empty" style="text-align:center;padding:40px;color:var(--text2)">选择一个考试进行模拟</div></div></div>
<div id="view-stats" class="hidden"><div id="stats-content"></div></div>
</div>

<div class="modal-overlay hidden" id="exam-modal"><div class="modal"><h2>新建考试</h2><label>考试名称</label><input type="text" id="exam-name" placeholder="如：期末考试"><label>考试日期</label><input type="date" id="exam-date"><label>科目</label><input type="text" id="exam-subject" placeholder="如：数学"><div class="bg"><button onclick="saveExam()">保存</button><button class="sec" onclick="closeModal('exam-modal')">取消</button></div></div></div>
<div class="modal-overlay hidden" id="q-modal"><div class="modal"><h2>添加题目</h2><label>题目类型</label><select id="q-type" onchange="toggleCloze()"><option value="choice">选择题</option><option value="truefalse">判断题</option><option value="fill">填空题</option><option value="short">简答题</option></select><label>题目内容</label><textarea id="q-content" rows="3"></textarea><div id="choice-options"><label>选项A</label><input type="text" id="q-opt-a"><label>选项B</label><input type="text" id="q-opt-b"><label>选项C</label><input type="text" id="q-opt-c"><label>选项D</label><input type="text" id="q-opt-d"></div><label>正确答案</label><input type="text" id="q-answer" placeholder="选择题填A/B/C/D，判断题填对/错"><label>分值</label><input type="number" id="q-score" value="10" min="1"><div class="bg"><button onclick="saveQuestion()">保存</button><button class="sec" onclick="closeModal('q-modal')">取消</button></div></div></div>

<script>
const STORAGE_KEY='exam_prep_data';
let data={exams:[],wrong:[],scores:[]};
let currentExam=null;
let simState={questions:[],index:0,answers:{},startTime:0,timer:null};

function load(){try{const d=JSON.parse(localStorage.getItem(STORAGE_KEY));if(d)data={...data,...d}}catch(e){}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}

function showView(v){['exams','practice','wrong','sim','stats'].forEach(id=>{document.getElementById('view-'+id).classList.toggle('hidden',id!==v);document.getElementById('btn-'+id)?.classList.toggle('active',id===v)});if(v==='wrong')renderWrong();if(v==='stats')renderStats()}

function renderExamList(){
const el=document.getElementById('exam-list');
if(!data.exams.length){el.innerHTML='<div class="empty" style="text-align:center;padding:40px;color:var(--text2)">暂无考试</div>';return}
el.innerHTML=data.exams.map(e=>{
const daysLeft=e.date?Math.ceil((new Date(e.date)-new Date())/(1000*60*60*24)):0;
const total=e.questions?e.questions.length:0;
const colors=daysLeft<0?'var(--red)':daysLeft<7?'var(--yellow)':'var(--green)';
return`<div class="cd"><div style="display:flex;justify-content:space-between;align-items:center"><div><strong style="font-size:1.05rem">${e.name}</strong><div style="font-size:.8rem;color:var(--text2);margin-top:4px">${e.subject||'未指定'} · ${total} 题 · ${e.date||'未设置日期'}</div></div><div style="text-align:right"><div style="font-size:1.2rem;font-weight:700;color:${colors}">${daysLeft>=0?daysLeft+'天':'已过'}</div></div></div><div class="bg"><button onclick="practiceExam('${e.id}')">练习</button><button onclick="simExam('${e.id}')">模拟考</button><button class="sec" onclick="addQuestion('${e.id}')">+ 添加题目</button><button class="dng" onclick="deleteExam('${e.id}')">删除</button></div></div>`;
}).join('');
}

function createExam(){document.getElementById('exam-name').value='';document.getElementById('exam-date').value='';document.getElementById('exam-subject').value='';document.getElementById('exam-modal').classList.remove('hidden')}
function saveExam(){const name=document.getElementById('exam-name').value.trim();if(!name)return;data.exams.push({id:Date.now().toString(),name,date:document.getElementById('exam-date').value,subject:document.getElementById('exam-subject').value,questions:[]});save();closeModal('exam-modal');renderExamList()}
function deleteExam(id){if(!confirm('确定删除？'))return;data.exams=data.exams.filter(e=>e.id!==id);save();renderExamList()}

function addQuestion(examId){currentExam=data.exams.find(e=>e.id===examId);document.getElementById('q-content').value='';document.getElementById('q-opt-a').value='';document.getElementById('q-opt-b').value='';document.getElementById('q-opt-c').value='';document.getElementById('q-opt-d').value='';document.getElementById('q-answer').value='';document.getElementById('q-score').value='10';document.getElementById('q-modal').classList.remove('hidden')}
function toggleCloze(){document.getElementById('choice-options').classList.toggle('hidden',['fill','short','truefalse'].includes(document.getElementById('q-type').value))}
function saveQuestion(){if(!currentExam)return;const content=document.getElementById('q-content').value.trim();const answer=document.getElementById('q-answer').value.trim();if(!content||!answer)return;const type=document.getElementById('q-type').value;const q={id:Date.now(),type,content,score:parseInt(document.getElementById('q-score').value)||10,answer};if(type==='choice'){q.options=[document.getElementById('q-opt-a').value,document.getElementById('q-opt-b').value,document.getElementById('q-opt-c').value,document.getElementById('q-opt-d').value]}currentExam.questions.push(q);save();closeModal('q-modal');renderExamList()}

function practiceExam(examId){
currentExam=data.exams.find(e=>e.id===examId);
if(!currentExam||!currentExam.questions.length){alert('请先添加题目');return}
const el=document.getElementById('practice-area');
const questions=currentExam.questions;
let html=`<h2 style="margin-bottom:16px">📝 ${currentExam.name} - 练习模式</h2>`;
questions.forEach((q,i)=>{
html+=`<div class="cd"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><strong>第${i+1}题</strong><span class="badge">${q.score}分</span></div><p style="margin-bottom:12px">${q.content}</p>`;
if(q.type==='choice'){
html+=q.options.map((o,oi)=>`<div class="radio-opt" onclick="this.classList.toggle('selected')" data-idx="${oi}"><input type="radio" name="q${i}" value="${'ABCD'[oi]}"><span>${'ABCD'[oi]}. ${o}</span></div>`).join('');
}else if(q.type==='truefalse'){
html+=`<div class="radio-opt" onclick="this.classList.toggle('selected')"><input type="radio" name="q${i}" value="对"><span>对</span></div><div class="radio-opt" onclick="this.classList.toggle('selected')"><input type="radio" name="q${i}" value="错"><span>错</span></div>`;
}else if(q.type==='fill'){
html+=`<input class="fill-input" placeholder="填写答案">`;
}else{
html+=`<textarea class="fill-input" rows="2" placeholder="简要作答"></textarea>`;
}
html+=`<div style="margin-top:8px"><button class="sec" onclick="checkAnswer(${i})" style="font-size:.8rem">查看答案</button><span id="ans-${i}" style="margin-left:8px;color:var(--green);font-weight:600"></span></div></div>`;
});
el.innerHTML=html;
}

function checkAnswer(i){
const q=currentExam.questions[i];
let userAns='';
if(q.type==='choice'){const sel=document.querySelector(`input[name="q${i}"]:checked`);userAns=sel?sel.value:''}
else if(q.type==='truefalse'){const sel=document.querySelector(`input[name="q${i}"]:checked`);userAns=sel?sel.value:''}
else{userAns=document.querySelectorAll('.fill-input')[i]?.value||''}
document.getElementById('ans-'+i).textContent=`正确答案: ${q.answer} ${userAns.toUpperCase()===q.answer.toUpperCase()||userAns===q.answer?'✅':'❌'}`;
}

function simExam(examId){
currentExam=data.exams.find(e=>e.id===examId);
if(!currentExam||!currentExam.questions.length){alert('请先添加题目');return}
simState={questions:[...currentExam.questions].sort(()=>Math.random()-.5),index:0,answers:{},startTime:Date.now(),timer:null};
document.getElementById('sim-area').innerHTML=`<div class="cd"><div style="display:flex;justify-content:space-between;align-items:center"><h2>⏱️ 模拟考试</h2><span id="sim-timer" style="font-size:1.2rem;font-weight:700;color:var(--accent)">00:00</span></div><div class="progress-bar" style="margin:12px 0"><div class="progress-fill" style="width:0%;background:var(--accent)" id="sim-progress"></div></div></div><div id="sim-question"></div>`;
simState.timer=setInterval(()=>{
const elapsed=Math.floor((Date.now()-simState.startTime)/1000);
const m=Math.floor(elapsed/60);const s=elapsed%60;
document.getElementById('sim-timer').textContent=`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
},1000);
showSimQuestion();
}

function showSimQuestion(){
if(simState.index>=simState.questions.length){finishSim();return}
const q=simState.questions[simState.index];
const el=document.getElementById('sim-question');
const pct=Math.floor(simState.index/simState.questions.length*100);
document.getElementById('sim-progress').style.width=pct+'%';
let html=`<div class="cd"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><span>第 ${simState.index+1}/${simState.questions.length} 题</span><span class="badge">${q.score}分</span></div><p style="margin-bottom:16px;font-size:1.05rem">${q.content}</p>`;
if(q.type==='choice'){
html+=q.options.map((o,oi)=>`<div class="radio-opt ${simState.answers[simState.index]==='ABCD'[oi]?'selected':''}" onclick="selectSimOption(${simState.index},'${'ABCD'[oi]}')"><input type="radio" name="sim" ${simState.answers[simState.index]==='ABCD'[oi]?'checked':''}><span>${'ABCD'[oi]}. ${o}</span></div>`).join('');
}else if(q.type==='truefalse'){
html+=['对','错'].map(t=>`<div class="radio-opt ${simState.answers[simState.index]===t?'selected':''}" onclick="selectSimOption(${simState.index},'${t}')"><input type="radio" name="sim" ${simState.answers[simState.index]===t?'checked':''}><span>${t}</span></div>`).join('');
}else if(q.type==='fill'){
html+=`<input class="fill-input" id="sim-fill" value="${simState.answers[simState.index]||''}" oninput="simState.answers[${simState.index}]=this.value">`;
}else{
html+=`<textarea class="fill-input" rows="3" oninput="simState.answers[${simState.index}]=this.value">${simState.answers[simState.index]||''}</textarea>`;
}
html+=`<div class="bg" style="margin-top:16px">${simState.index>0?'<button class="sec" onclick="simPrev()">上一题</button>':''}<div style="flex:1"></div>${simState.index<simState.questions.length-1?'<button onclick="simNext()">下一题</button>':'<button class="grn" onclick="finishSim()">提交</button>'}</div></div>`;
el.innerHTML=html;
}

function selectSimOption(i,val){simState.answers[i]=val;showSimQuestion()}
function simNext(){simState.index++;showSimQuestion()}
function simPrev(){simState.index--;showSimQuestion()}

function finishSim(){
clearInterval(simState.timer);
const elapsed=Math.floor((Date.now()-simState.startTime)/1000);
let correct=0,total=0,score=0,maxScore=0;
simState.questions.forEach((q,i)=>{
maxScore+=q.score;
const ans=simState.answers[i]||'';
if(ans.toUpperCase()===q.answer.toUpperCase()||ans===q.answer){correct++;score+=q.score}
else{data.wrong.push({examId:currentExam.id,question:q.content,correctAnswer:q.answer,userAnswer:ans,date:new Date().toISOString()})}
total++;
});
data.scores.push({examId:currentExam.id,examName:currentExam.name,score,maxScore,correct,total,date:new Date().toISOString()});
const m=Math.floor(elapsed/60);const s=elapsed%60;
document.getElementById('sim-area').innerHTML=`<div class="cd" style="text-align:center"><h2>🎉 考试完成！</h2><div class="countdown" style="margin:20px 0">${score}/${maxScore}</div><div style="color:var(--text2);font-size:1.1rem;margin-bottom:16px">正确率: ${total?Math.floor(correct/total*100):0}% · 用时 ${m}分${s}秒</div><div class="bg" style="justify-content:center"><button onclick="simExam('${currentExam.id}')">重新考试</button><button class="sec" onclick="showView('exams')">返回</button></div></div>`;
save();
}

function renderWrong(){
const el=document.getElementById('wrong-list');
if(!data.wrong.length){el.innerHTML='<div class="empty" style="text-align:center;padding:40px;color:var(--text2)">暂无错题</div>';return}
el.innerHTML=`<div class="cd"><h2 style="margin-bottom:12px">❌ 错题集</h2><div class="bg"><button class="dng" onclick="if(confirm('清除所有错题？')){data.wrong=[];save();renderWrong()}">清除全部</button></div>${data.wrong.map((w,i)=>`<div style="padding:12px;border-bottom:1px solid var(--border)"><p><strong>题目：</strong>${w.question}</p><p style="color:var(--green)">正确答案: ${w.correctAnswer}</p><p style="color:var(--red)">你的答案: ${w.userAnswer||'未作答'}</p></div>`).join('')}</div>`;
}

function renderStats(){
const el=document.getElementById('stats-content');
let totalScore=0,count=0;
data.scores.forEach(s=>{totalScore+=s.score;count++});
const avgScore=count?Math.round(totalScore/count):0;
el.innerHTML=`<div class="cd"><h2 style="margin-bottom:16px">📊 考试统计</h2><div class="stat-grid"><div class="stat-box"><div class="stat-num">${data.exams.length}</div><div class="stat-label">考试数</div></div><div class="stat-box"><div class="stat-num">${data.scores.length}</div><div class="stat-label">模拟次数</div></div><div class="stat-box"><div class="stat-num">${avgScore}</div><div class="stat-label">平均分</div></div><div class="stat-box"><div class="stat-num">${data.wrong.length}</div><div class="stat-label">错题数</div></div></div>${data.scores.length?`<h3 style="margin-top:20px;margin-bottom:8px">历史成绩</h3><table class="table"><thead><tr><th>考试</th><th>成绩</th><th>正确率</th><th>时间</th></tr></thead><tbody>${data.scores.map(s=>`<tr><td>${s.examName}</td><td>${s.score}/${s.maxScore}</td><td>${s.total?Math.floor(s.correct/s.total*100):0}%</td><td>${new Date(s.date).toLocaleDateString('zh-CN')}</td></tr>`).join('')}</tbody></table>`:''}</div>`;
}

function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='exam_data.json';a.click()}

function loadDemo(){
data.exams=[{id:'1',name:'期末数学考试',date:new Date(Date.now()+7*86400000).toISOString().split('T')[0],subject:'数学',questions:[
{id:1,type:'choice',content:'1+1等于多少？',options:['1','2','3','4'],answer:'B',score:10},
{id:2,type:'choice',content:'圆的面积公式是？',options:['2πr','πr²','πd','2πr²'],answer:'B',score:10},
{id:3,type:'truefalse',content:'三角形内角和为180度',answer:'对',score:5},
{id:4,type:'fill',content:'勾股定理：a²+b²=___',answer:'c²',score:10},
{id:5,type:'short',content:'简述微积分的基本思想',answer:'利用极限来研究函数的变化',score:15}
]}];save();renderExamList();
}

function closeModal(id){document.getElementById(id).classList.add('hidden')}

load();renderExamList();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
