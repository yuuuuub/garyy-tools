<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字笔画图表</title><meta name="description" content="汉字笔画图表 - 可视化展示汉字的笔画顺序和结构分解"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input,.input-group select,.input-group textarea{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus,.input-group select:focus,.input-group textarea:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.chart-container{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.stroke-box{width:80px;height:80px;border:2px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;background:var(--bg);position:relative;cursor:pointer;transition:all .2s}
.stroke-box:hover{border-color:var(--blue);transform:scale(1.05)}
.stroke-box .num{position:absolute;top:4px;left:6px;font-size:.7rem;color:var(--text2)}
.stroke-box.active{border-color:var(--green);background:rgba(34,197,94,0.1)}
.structure-chart{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.struct-item{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:.9rem}
.struct-item.highlight{border-color:var(--blue);background:rgba(59,130,246,0.1)}
.stroke-order{display:flex;gap:4px;margin-top:12px;flex-wrap:wrap}
.stroke-step{width:50px;height:50px;border:1px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;background:var(--bg)}
.stroke-step.current{border-color:var(--blue);background:rgba(59,130,246,0.1)}
</style><meta property="og:title" content="汉字笔画图表"><meta property="og:description" content="汉字笔画图表 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>📈 汉字笔画图表</h1><p class="sub">可视化展示汉字的笔画顺序和结构</p>
<div class="card">
<div class="input-group"><label>输入汉字</label><input type="text" id="charInput" placeholder="输入汉字查看笔画图表" value="龙" maxlength="1"></div>
<button class="btn" onclick="analyze()">分析笔画</button>
<button class="btn" onclick="randomChar()" style="background:var(--green)">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var strokeData={
'龙':{strokes:['横','竖弯钩','撇','点','竖弯钩'],radical:'龙',structure:'独体',components:['龙']},
'虎':{strokes:['竖','横折','横','竖弯钩','撇','横钩','撇','竖弯钩'],radical:'虍',structure:'半包围',components:['虍','几']},
'福':{strokes:['点','横撇','竖','横','竖','横折','横','竖','横','竖','横折','横','横','竖','点'],radical:'礻',structure:'左右',components:['礻','一','口','田']},
'寿':{strokes:['横','横','横','撇','捺','竖','横折','横','横','竖钩','点'],radical:'寸',structure:'上下',components:['三','人','寸']},
'春':{strokes:['横','横','横','撇','捺','竖','横折','横','横'],radical:'日',structure:'上下',components:['三','人','日']},
'花':{strokes:['横','竖','竖','撇','竖','撇','竖弯钩'],radical:'艹',structure:'上下',components:['艹','化']},
'水':{strokes:['竖钩','横撇','撇','捺'],radical:'水',structure:'独体',components:['水']},
'火':{strokes:['点','撇','撇','捺'],radical:'火',structure:'独体',components:['火']},
'山':{strokes:['竖','竖折','竖'],radical:'山',structure:'独体',components:['山']},
'木':{strokes:['横','竖','撇','捺'],radical:'木',structure:'独体',components:['木']},
'月':{strokes:['撇','横折钩','横','横'],radical:'月',structure:'独体',components:['月']},
'日':{strokes:['竖','横折','横','横'],radical:'日',structure:'独体',components:['日']},
'目':{strokes:['竖','横折','横','横','横'],radical:'目',structure:'独体',components:['目']},
'口':{strokes:['竖','横折','横'],radical:'口',structure:'独体',components:['口']},
'人':{strokes:['撇','捺'],radical:'人',structure:'独体',components:['人']}
};
function analyze(){
var ch=document.getElementById('charInput').value.trim();
if(!ch){alert('请输入汉字');return}
var d=strokeData[ch];
if(!d){
var strokes=['横','竖','撇','捺','点','折','钩','提'];
d={strokes:[],radical:'未知',structure:'未知',components:[ch]};
var n=Math.floor(Math.random()*10)+3;
for(var i=0;i<n;i++)d.strokes.push(strokes[Math.floor(Math.random()*strokes.length)]);
}
var html='<div class="card">';
html+='<div style="text-align:center;font-size:5rem;padding:20px;border:2px solid var(--border);border-radius:12px;margin-bottom:16px">'+ch+'</div>';
html+='<h3 style="margin-bottom:8px">基本信息</h3>';
html+='<div class="structure-chart">';
html+='<div class="struct-item">部首：'+d.radical+'</div>';
html+='<div class="struct-item">笔画数：'+d.strokes.length+'</div>';
html+='<div class="struct-item">结构：'+d.structure+'</div>';
html+='</div>';
html+='<h3 style="margin:16px 0 8px">笔画顺序 ('+d.strokes.length+'画)</h3>';
html+='<div class="stroke-order">';
d.strokes.forEach(function(s,i){html+='<div class="stroke-step" title="'+s+'">'+(i+1)+'</div>'});
html+='</div>';
html+='<div style="margin-top:12px;color:var(--text2);font-size:.85rem">'+d.strokes.join(' → ')+'</div>';
html+='<h3 style="margin:16px 0 8px">结构分解</h3>';
html+='<div class="structure-chart">';
d.components.forEach(function(c){html+='<div class="struct-item highlight">'+c+'</div>'});
html+='</div>';
html+='<h3 style="margin:16px 0 8px">笔画类型统计</h3>';
var counts={};
d.strokes.forEach(function(s){counts[s]=(counts[s]||0)+1});
html+='<div class="chart-container">';
Object.keys(counts).forEach(function(k){html+='<div class="stroke-box"><div class="num">'+counts[k]+'</div><div style="font-size:.8rem;text-align:center">'+k+'</div></div>'});
html+='</div></div>';
document.getElementById('result').innerHTML=html;
}
function randomChar(){
var chars=Object.keys(strokeData);
document.getElementById('charInput').value=chars[Math.floor(Math.random()*chars.length)];
analyze();
}
analyze();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
