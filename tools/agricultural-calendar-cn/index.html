<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌾 农业日历</title>
<meta name="description" content="农历农业日历，农事活动指导，节气农谚，作物种植时间">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
.current-farming{text-align:center;padding:30px;background:var(--bg);border-radius:12px;margin-bottom:16px}
.current-icon{font-size:4rem;margin-bottom:12px}
.current-name{font-size:1.5rem;font-weight:700;color:var(--accent)}
.current-desc{margin-top:8px;color:var(--text2);font-size:.95rem}
.current-tasks{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.task-tag{padding:4px 12px;background:var(--accent);color:#fff;border-radius:16px;font-size:.8rem}
.season-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.season-tab{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:.85rem;transition:all .2s}
.season-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.season-tab.spring{border-color:#22c55e}.season-tab.spring.active{background:#22c55e}
.season-tab.summer{border-color:#f59e0b}.season-tab.summer.active{background:#f59e0b}
.season-tab.autumn{border-color:#ef4444}.season-tab.autumn.active{background:#ef4444}
.season-tab.winter{border-color:#3b82f6}.season-tab.winter.active{background:#3b82f6}
.calendar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.calendar-card{background:var(--bg);border-radius:8px;padding:12px;border-left:4px solid}
.calendar-card .month{font-weight:600;font-size:1rem;margin-bottom:6px}
.calendar-card .solar-term{font-size:.85rem;color:var(--accent);margin-bottom:4px}
.calendar-card .tasks{font-size:.8rem;color:var(--text2);line-height:1.6}
.calendar-card .crops{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.crop-tag{padding:2px 8px;background:var(--card);border-radius:12px;font-size:.7rem}
谚语-list{margin-top:12px}
.谚语-item{padding:12px;border-bottom:1px solid var(--border);font-style:italic}
.谚语-item:last-child{border-bottom:none}
.谚语-item .source{font-size:.8rem;color:var(--text2);margin-top:4px;font-style:normal}
.crop-calendar{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.crop-item{background:var(--bg);border-radius:8px;padding:12px;text-align:center}
.crop-item .icon{font-size:1.5rem;margin-bottom:6px}
.crop-item .name{font-weight:600;font-size:.9rem}
.crop-item .season{font-size:.75rem;color:var(--text2);margin-top:2px}
.crop-item .months{font-size:.7rem;color:var(--accent);margin-top:4px}
.farming-tips{background:var(--bg);border-radius:8px;padding:12px;margin-bottom:8px}
.farming-tips .title{font-weight:600;font-size:.9rem;margin-bottom:6px}
.farming-tips .content{font-size:.8rem;color:var(--text2);line-height:1.6}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
@keyframes grow{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.grow{animation:grow 2s ease-in-out infinite}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🌾 农业日历">
<meta property="og:description" content="农历农业日历，农事活动指导">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1 class="grow">🌾 农业日历</h1><p>遵循自然节律，科学安排农事</p></div>

<div class="cd">
<div class="current-farming" id="currentFarming"></div>
</div>

<div class="cd">
<h2>季节选择</h2>
<div class="season-tabs" id="seasonTabs"></div>
</div>

<div class="cd">
<h2>农事月历</h2>
<div class="calendar-grid" id="calendarGrid"></div>
</div>

<div class="cd">
<h2>作物种植时间</h2>
<div class="crop-calendar" id="cropCalendar"></div>
</div>

<div class="cd">
<h2>农谚精选</h2>
<div class="谚语-list" id="proverbList"></div>
</div>

<div class="cd">
<h2>农事建议</h2>
<div id="farmingTips"></div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const seasons=[
  {name:'春',icon:'🌱',class:'spring',months:[
    {month:'正月',solarTerm:'立春、雨水',tasks:'整地施肥、准备种子、育苗',crops:['小麦','油菜','蔬菜']},
    {month:'二月',solarTerm:'惊蛰、春分',tasks:'播种育苗、栽种果树、防治病虫',crops:['水稻','玉米','棉花']},
    {month:'三月',solarTerm:'清明、谷雨',tasks:'插秧播种、田间管理、茶园采摘',crops:['水稻','茶叶','蔬菜']}
  ]},
  {name:'夏',icon:'☀️',class:'summer',months:[
    {month:'四月',solarTerm:'立夏、小满',tasks:'中耕除草、追肥灌溉、防治虫害',crops:['水稻','棉花','花生']},
    {month:'五月',solarTerm:'芒种、夏至',tasks:'抢收抢种、防暑降温、果园管理',crops:['小麦','水稻','大豆']},
    {month:'六月',solarTerm:'小暑、大暑',tasks:'防涝抗旱、晚稻插秧、蔬菜采收',crops:['水稻','蔬菜','瓜果']}
  ]},
  {name:'秋',icon:'🍂',class:'autumn',months:[
    {month:'七月',solarTerm:'立秋、处暑',tasks:'秋收准备、晚稻管理、棉花采摘',crops:['水稻','棉花','玉米']},
    {month:'八月',solarTerm:'白露、秋分',tasks:'收割稻谷、播种冬麦、果园施肥',crops:['水稻','小麦','果树']},
    {month:'九月',solarTerm:'寒露、霜降',tasks:'秋耕秋种、储藏粮食、茶园管理',crops:['小麦','油菜','蔬菜']}
  ]},
  {name:'冬',icon:'❄️',class:'winter',months:[
    {month:'十月',solarTerm:'立冬、小雪',tasks:'冬耕施肥、果树修剪、农田水利',crops:['小麦','油菜','绿肥']},
    {month:'冬月',solarTerm:'大雪、冬至',tasks:'防寒保暖、积肥造肥、设备维护',crops:['小麦','蔬菜','花卉']},
    {month:'腊月',solarTerm:'小寒、大寒',tasks:'总结规划、农具维修、来年准备',crops:['温室蔬菜','花卉']}
  ]}
];
const crops=[
  {name:'水稻',icon:'🌾',season:'春夏',months:'4-10月'},
  {name:'小麦',icon:'🌾',season:'秋冬',months:'10-次年6月'},
  {name:'玉米',icon:'🌽',season:'春夏',months:'4-9月'},
  {name:'大豆',icon:'🫘',season:'春夏',months:'5-9月'},
  {name:'棉花',icon:'☁️',season:'春季',months:'4-10月'},
  {name:'油菜',icon:'🌼',season:'秋冬',months:'9-次年5月'},
  {name:'花生',icon:'🥜',season:'春季',months:'4-8月'},
  {name:'蔬菜',icon:'🥬',season:'四季',months:'全年'},
  {name:'茶叶',icon:'🍵',season:'春夏',months:'3-10月'},
  {name:'水果',icon:'🍎',season:'四季',months:'全年'}
];
const proverbs=[
  {text:'春雨惊春清谷天，夏满芒夏暑相连。',source:'二十四节气歌'},
  {text:'清明前后，种瓜点豆。',source:'农谚'},
  {text:'芒种芒种，连收带种。',source:'农谚'},
  {text:'白露早，寒露迟，秋分种麦正当时。',source:'华北农谚'},
  {text:'冬至一阳生，万物始复苏。',source:'古语'},
  {text:'人误地一时，地误人一年。',source:'农谚'},
  {text:'庄稼一枝花，全靠粪当家。',source:'农谚'},
  {text:'三分种，七分管，十分收成才保险。',source:'农谚'}
];

let currentSeason=0;

function getCurrentFarming(){
  const now=new Date();
  const month=now.getMonth()+1;
  const seasonIndex=month>=3&&month<=5?0:month>=6&&month<=8?1:month>=9&&month<=11?2:3;
  const season=seasons[seasonIndex];
  const monthIndex=(month-3+12)%12;
  const farming=season.months[monthIndex%3];
  
  return{
    season:season.name,
    seasonIcon:season.icon,
    month:farming.month,
    tasks:farming.tasks.split('、'),
    crops:farming.crops
  };
}

function renderCurrentFarming(){
  const farming=getCurrentFarming();
  $('currentFarming').innerHTML=`
    <div class="current-icon">${farming.seasonIcon}</div>
    <div class="current-name">${farming.month}农事</div>
    <div class="current-desc">${farming.season}季主要农事活动</div>
    <div class="current-tasks">${farming.tasks.map(t=>`<span class="task-tag">${t}</span>`).join('')}</div>
  `;
}

function renderSeasons(){
  $('seasonTabs').innerHTML=seasons.map((s,i)=>`<div class="season-tab ${s.class} ${i===currentSeason?'active':''}" onclick="selectSeason(${i})">${s.icon} ${s.name}</div>`).join('');
}

function selectSeason(index){
  currentSeason=index;
  renderSeasons();
  renderCalendar();
}

function renderCalendar(){
  const months=seasons[currentSeason].months;
  $('calendarGrid').innerHTML=months.map(m=>`<div class="calendar-card" style="border-color:${currentSeason===0?'#22c55e':currentSeason===1?'#f59e0b':currentSeason===2?'#ef4444':'#3b82f6'}">
    <div class="month">${m.month}</div>
    <div class="solar-term">节气：${m.solarTerm}</div>
    <div class="tasks">${m.tasks}</div>
    <div class="crops">${m.crops.map(c=>`<span class="crop-tag">${c}</span>`).join('')}</div>
  </div>`).join('');
}

function renderCrops(){
  $('cropCalendar').innerHTML=crops.map(c=>`<div class="crop-item">
    <div class="icon">${c.icon}</div>
    <div class="name">${c.name}</div>
    <div class="season">${c.season}</div>
    <div class="months">${c.months}</div>
  </div>`).join('');
}

function renderProverbs(){
  $('proverbList').innerHTML=proverbs.map(p=>`<div class="谚语-item">
    <div>"${p.text}"</div>
    <div class="source">—— ${p.source}</div>
  </div>`).join('');
}

function renderTips(){
  const now=new Date();
  const month=now.getMonth()+1;
  const tips=[
    {icon:'🌱',title:'春季管理',content:'春季是播种育苗的关键时期，注意防寒保暖，适时播种，做好苗期管理。'},
    {icon:'☀️',title:'夏季管理',content:'夏季高温多雨，注意防涝抗旱，加强病虫害防治，及时追肥灌溉。'},
    {icon:'🍂',title:'秋季管理',content:'秋季是收获季节，抓紧时机收割，做好秋耕秋种，为来年打好基础。'},
    {icon:'❄️',title:'冬季管理',content:'冬季做好防寒保暖，积肥造肥，农田水利建设，为来年春耕做准备。'}
  ];
  
  const seasonIndex=month>=3&&month<=5?0:month>=6&&month<=8?1:month>=9&&month<=11?2:3;
  
  $('farmingTips').innerHTML=tips.map((t,i)=>`<div class="farming-tips" style="${i===seasonIndex?'border-left:3px solid var(--accent)':''}">
    <div class="title">${t.icon} ${t.title}</div>
    <div class="content">${t.content}</div>
  </div>`).join('');
}

renderCurrentFarming();
renderSeasons();
renderCalendar();
renderCrops();
renderProverbs();
renderTips();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
