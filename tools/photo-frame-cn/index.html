<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖼️ 照片相框工具</title>
<meta property="og:title" content="🖼️ 照片相框工具">
<meta property="og:description" content="🖼️ 照片相框工具 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线照片相框工具，多种边框样式、阴影、圆角、滤镜，导出PNG">
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:900px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.canvas-wrap{display:flex;justify-content:center;overflow:auto;padding:10px 0}
canvas#frameCanvas{border:1px solid var(--border);border-radius:8px;max-width:100%}
.form-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.form-row label{font-size:13px;color:var(--text-secondary);min-width:70px}
.form-row input[type="text"],.form-row select{padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--input-bg);color:var(--text);flex:1;min-width:120px}
.form-row input[type="color"]{width:40px;height:32px;border:1px solid var(--border);border-radius:6px;cursor:pointer;padding:2px}
.form-row input[type="range"]{flex:1;accent-color:var(--accent)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card-bg);color:var(--text);padding:10px 24px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow);border:1px solid var(--border)}
.toast.show{opacity:1}
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:30px;text-align:center;cursor:pointer;transition:all .2s;color:var(--text-secondary)}
.upload-zone:hover{border-color:var(--accent);color:var(--accent)}
.frame-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.frame-card{padding:8px;border:2px solid var(--border);border-radius:8px;cursor:pointer;text-align:center;font-size:12px;transition:all .2s}
.frame-card:hover{border-color:var(--accent)}
.frame-card.active{border-color:var(--accent);background:var(--tag-bg)}
.frame-card .frame-icon{font-size:28px;margin-bottom:4px}
footer{text-align:center;padding:24px 0;color:var(--text-secondary);font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖼️</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--card-bg);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>🖼️ 照片相框工具</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </header>

  <div class="card">
    <div class="card-title">🖼️ 预览</div>
    <div class="canvas-wrap"><canvas id="frameCanvas" width="600" height="600"></canvas></div>
  </div>

  <div class="card">
    <div class="card-title">📸 上传照片</div>
    <div class="upload-zone" id="uploadZone">点击或拖拽上传照片</div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
  </div>

  <div class="card">
    <div class="card-title">🖼️ 边框样式</div>
    <div class="frame-grid" id="frameGrid"></div>
  </div>

  <div class="card">
    <div class="card-title">⚙️ 边框设置</div>
    <div class="form-row"><label>边框宽度</label><input type="range" min="0" max="60" value="20" id="borderW" oninput="render()"><span id="bwVal">20px</span></div>
    <div class="form-row"><label>边框颜色</label><input type="color" id="borderColor" value="#ffffff" onchange="render()"></div>
    <div class="form-row"><label>内边距</label><input type="range" min="0" max="60" value="20" id="padding" oninput="render()"><span id="pdVal">20px</span></div>
    <div class="form-row"><label>外边距</label><input type="range" min="0" max="60" value="20" id="outerMargin" oninput="render()"><span id="omVal">20px</span></div>
  </div>

  <div class="card">
    <div class="card-title">🎨 效果</div>
    <div class="form-row"><label>圆角</label><input type="range" min="0" max="50" value="0" id="cornerRadius" oninput="render()"><span id="crVal">0px</span></div>
    <div class="form-row"><label>阴影</label><input type="range" min="0" max="40" value="10" id="shadowSize" oninput="render()"><span id="ssVal">10px</span></div>
    <div class="form-row"><label>阴影色</label><input type="color" id="shadowColor" value="#000000" onchange="render()"></div>
    <div class="form-row"><label>阴影透明度</label><input type="range" min="5" max="80" value="30" id="shadowAlpha" oninput="render()"><span id="saVal">30%</span></div>
    <div class="form-row"><label>亮度</label><input type="range" min="50" max="150" value="100" id="brightness" oninput="render()"><span id="brVal">100%</span></div>
    <div class="form-row"><label>饱和度</label><input type="range" min="0" max="200" value="100" id="saturation" oninput="render()"><span id="stVal">100%</span></div>
    <div class="form-row"><label>对比度</label><input type="range" min="50" max="150" value="100" id="contrast" oninput="render()"><span id="ctVal">100%</span></div>
    <div class="form-row"><label>背景色</label><input type="color" id="bgColor" value="#f0f0f0" onchange="render()"></div>
  </div>

  <div class="card">
    <div class="card-title">✏️ 水印文字</div>
    <div class="form-row"><label>文字</label><input type="text" id="watermarkText" value="" oninput="render()"></div>
    <div class="form-row"><label>颜色</label><input type="color" id="watermarkColor" value="#ffffff" onchange="render()"></div>
    <div class="form-row"><label>字号</label><input type="range" min="12" max="48" value="20" id="watermarkSize" oninput="render()"><span id="wmVal">20</span></div>
    <div class="form-row"><label>位置</label>
      <select id="watermarkPos" onchange="render()">
        <option value="bottom-right">右下角</option>
        <option value="bottom-left">左下角</option>
        <option value="bottom-center">底部居中</option>
        <option value="top-right">右上角</option>
        <option value="top-left">左上角</option>
        <option value="center">居中</option>
      </select>
    </div>
    <div class="form-row"><label>透明度</label><input type="range" min="10" max="100" value="50" id="watermarkAlpha" oninput="render()"><span id="waVal">50%</span></div>
  </div>

  <div class="card">
    <div class="card-title">⚡ 操作</div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="exportPNG()">💾 导出PNG</button>
      <button class="btn btn-outline" onclick="exportJPG()">💾 导出JPG</button>
    </div>
  </div>

  <footer>🖼️ 照片相框工具 - 为照片添加精美边框</footer>
</div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/i18n-js@3/dist/i18n.min.js" defer></script>
<script>
const C=document.getElementById('frameCanvas'),ctx=C.getContext('2d');
let bgImg=null,frameIdx=0;
const frames=[
  {name:'简单白框',icon:'⬜'},
  {name:'经典黑框',icon:'⬛'},
  {name:'圆角白框',icon:'🔲'},
  {name:'双层边框',icon:'🔳'},
  {name:'细线边框',icon:'📏'},
  {name:'粗线边框',icon:'📐'},
  {name:'渐变边框',icon:'🌈'},
  {name:'虚线边框',icon:'ٺ'},
  {name:'阴影边框',icon:'🔲'},
  {name:'拍立得',icon:'📷'},
];

function init(){
  renderFrameGrid();
  const uz=document.getElementById('uploadZone');
  const fi=document.getElementById('fileInput');
  uz.onclick=()=>fi.click();
  uz.ondragover=e=>{e.preventDefault();uz.style.borderColor='var(--accent)';};
  uz.ondragleave=()=>uz.style.borderColor='var(--border)';
  uz.ondrop=e=>{e.preventDefault();uz.style.borderColor='var(--border)';handleFile(e.dataTransfer.files[0]);};
  fi.onchange=()=>handleFile(fi.files[0]);
  render();
}

function renderFrameGrid(){
  const grid=document.getElementById('frameGrid');grid.innerHTML='';
  frames.forEach((f,i)=>{
    const card=document.createElement('div');
    card.className='frame-card'+(i===frameIdx?' active':'');
    card.innerHTML=`<div class="frame-icon">${f.icon}</div><div>${f.name}</div>`;
    card.onclick=()=>{frameIdx=i;renderFrameGrid();render();};
    grid.appendChild(card);
  });
}

function handleFile(f){
  if(!f)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{bgImg=img;const ratio=img.width/img.height;C.height=Math.round(C.width*ratio);render();showToast('照片已加载');};
    img.src=e.target.result;
  };
  reader.readAsDataURL(f);
}

function render(){
  const w=C.width,h=C.height;
  const bw=parseInt(document.getElementById('borderW').value);
  const bc=document.getElementById('borderColor').value;
  const pd=parseInt(document.getElementById('padding').value);
  const om=parseInt(document.getElementById('outerMargin').value);
  const cr=parseInt(document.getElementById('cornerRadius').value);
  const ss=parseInt(document.getElementById('shadowSize').value);
  const sc=document.getElementById('shadowColor').value;
  const sa=parseInt(document.getElementById('shadowAlpha').value)/100;
  const br=parseInt(document.getElementById('brightness').value);
  const st=parseInt(document.getElementById('saturation').value);
  const ct=parseInt(document.getElementById('contrast').value);
  const bgc=document.getElementById('bgColor').value;
  const wmText=document.getElementById('watermarkText').value;
  const wmColor=document.getElementById('watermarkColor').value;
  const wmSize=parseInt(document.getElementById('watermarkSize').value);
  const wmPos=document.getElementById('watermarkPos').value;
  const wmAlpha=parseInt(document.getElementById('watermarkAlpha').value)/100;

  document.getElementById('bwVal').textContent=bw+'px';
  document.getElementById('pdVal').textContent=pd+'px';
  document.getElementById('omVal').textContent=om+'px';
  document.getElementById('crVal').textContent=cr+'px';
  document.getElementById('ssVal').textContent=ss+'px';
  document.getElementById('saVal').textContent=Math.round(sa*100)+'%';
  document.getElementById('brVal').textContent=br+'%';
  document.getElementById('stVal').textContent=st+'%';
  document.getElementById('ctVal').textContent=ct+'%';
  document.getElementById('wmVal').textContent=wmSize;
  document.getElementById('waVal').textContent=Math.round(wmAlpha*100)+'%';

  ctx.clearRect(0,0,w,h);
  ctx.fillStyle=bgc;ctx.fillRect(0,0,w,h);

  if(ss>0){
    ctx.shadowColor=`rgba(0,0,0,${sa})`;
    ctx.shadowBlur=ss;ctx.shadowOffsetX=0;ctx.shadowOffsetY=ss/2;
  }

  const fx=om,fy=om,fw=w-om*2,fh=h-om*2;
  if(frameIdx===9){
    ctx.shadowColor='transparent';
    ctx.fillStyle='#fafafa';ctx.fillRect(om,om,fw,fh*0.85);
    ctx.fillStyle='#fff';
    roundRect(ctx,om+bw,om+bw,fw-bw*2,fh*0.85-bw-bw*4,cr);ctx.fill();
    if(bgImg){ctx.save();roundClip(ctx,om+bw,om+bw,fw-bw*2,fh*0.85-bw-bw*4,cr);drawImageCover(ctx,bgImg,om+bw,om+bw,fw-bw*2,fh*0.85-bw-bw*4,br,st,ct);ctx.restore();}
    ctx.shadowColor=`rgba(0,0,0,${sa})`;ctx.shadowBlur=ss;
  }else{
    ctx.fillStyle=bc;
    roundRect(ctx,fx,fy,fw,fh,cr);ctx.fill();
    ctx.shadowColor='transparent';
    const innerX=fx+bw,innerY=fy+bw,innerW=fw-bw*2,innerH=fh-bw*2;
    if(frameIdx===3){
      ctx.fillStyle='rgba(0,0,0,0.1)';roundRect(ctx,innerX-4,innerY-4,innerW+8,innerH+8,cr);ctx.fill();
    }
    if(bgImg){ctx.save();roundClip(ctx,innerX,innerY,innerW,innerH,cr);drawImageCover(ctx,bgImg,innerX,innerY,innerW,innerH,br,st,ct);ctx.restore();}
  }
  ctx.shadowColor='transparent';ctx.shadowBlur=0;

  if(frameIdx===5){
    ctx.strokeStyle=bc;ctx.lineWidth=bw/3;
    roundRect(ctx,om+bw/6,om+bw/6,w-om*2-bw/3,h-om*2-bw/3,cr);ctx.stroke();
  }

  if(frameIdx===7){
    ctx.setLineDash([10,5]);ctx.strokeStyle=bc;ctx.lineWidth=bw/2;
    roundRect(ctx,om+bw/4,om+bw/4,w-om*2-bw/2,h-om*2-bw/2,cr);ctx.stroke();
    ctx.setLineDash([]);
  }

  if(frameIdx===8){
    ctx.shadowColor=`rgba(0,0,0,${sa})`;ctx.shadowBlur=ss*2;
    ctx.fillStyle=bc;roundRect(ctx,om,om,w-om*2,h-om*2,cr);ctx.fill();
    ctx.shadowBlur=0;
    if(bgImg){ctx.save();roundClip(ctx,om+bw,om+bw,w-om*2-bw*2,h-om*2-bw*2,cr);drawImageCover(ctx,bgImg,om+bw,om+bw,w-om*2-bw*2,h-om*2-bw*2,br,st,ct);ctx.restore();}
  }

  if(wmText){
    ctx.font=`bold ${wmSize}px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.textBaseline='middle';ctx.fillStyle=wmColor;ctx.globalAlpha=wmAlpha;
    const tm=ctx.measureText(wmText).width;
    let wx,wy;
    if(wmPos==='bottom-right'){wx=w-tm-20;wy=h-20;}
    else if(wmPos==='bottom-left'){wx=20;wy=h-20;}
    else if(wmPos==='bottom-center'){wx=(w-tm)/2;wy=h-20;}
    else if(wmPos==='top-right'){wx=w-tm-20;wy=30;}
    else if(wmPos==='top-left'){wx=20;wy=30;}
    else{wx=(w-tm)/2;wy=h/2;}
    ctx.textAlign='left';ctx.fillText(wmText,wx,wy);
    ctx.globalAlpha=1;
  }
}

function drawImageCover(c,img,x,y,w,h,brightness,saturation,contrast){
  c.filter=`brightness(${brightness}%) saturate(${saturation}%) contrast(${contrast}%)`;
  const scale=Math.max(w/img.width,h/img.height);
  const sw=img.width*scale,sh=img.height*scale;
  c.drawImage(img,x+(w-sw)/2,y+(h-sh)/2,sw,sh);
  c.filter='none';
}

function roundRect(c,x,y,w,h,r){
  if(r<=0){c.fillRect(x,y,w,h);return;}
  c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();
}

function roundClip(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();c.clip();
}

function exportPNG(){
  const link=document.createElement('a');link.download='相框_'+Date.now()+'.png';link.href=C.toDataURL('image/png');link.click();showToast('已导出PNG');
}
function exportJPG(){
  const link=document.createElement('a');link.download='相框_'+Date.now()+'.jpg';link.href=C.toDataURL('image/jpeg',0.95);link.click();showToast('已导出JPG');
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function toggleTheme(){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';document.querySelector('.theme-toggle').textContent=d.dataset.theme==='dark'?'☀️':'🌙';}
init();
</script>
</body>
</html>
