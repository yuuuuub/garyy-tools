<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随机令牌生成器</title><meta name="description" content="随机令牌生成器 - 在线生成安全随机令牌"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input,.input-group select{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus,.input-group select:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.checkbox-group{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0}.checkbox-group label{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--text2);cursor:pointer}.checkbox-group input[type="checkbox"]{width:auto;margin:0}</style><meta property="og:title" content="随机令牌生成器"><meta property="og:description" content="随机令牌生成器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔑 随机令牌生成器</h1><p class="sub">在线生成安全随机令牌</p>
<div class="card">
<div class="input-group">
<label>令牌长度</label>
<input type="number" id="tokenLength" value="32" min="4" max="256">
</div>
<div class="input-group">
<label>生成数量</label>
<input type="number" id="tokenCount" value="5" min="1" max="100">
</div>
<div class="checkbox-group">
<label><input type="checkbox" id="includeUpper" checked> 大写字母 (A-Z)</label>
<label><input type="checkbox" id="includeLower" checked> 小写字母 (a-z)</label>
<label><input type="checkbox" id="includeNumbers" checked> 数字 (0-9)</label>
<label><input type="checkbox" id="includeSymbols"> 特殊字符 (!@#$%^&*)</label>
</div>
<div class="btn-group">
<button class="btn" onclick="generateTokens()">生成令牌</button>
<button class="btn" onclick="generateUUID()">生成UUID</button>
<button class="btn" onclick="generateNanoID()">生成NanoID</button>
<button class="btn" onclick="generateAPIKey()">生成API密钥</button>
</div></div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
function generateTokens(){
  var length=parseInt(document.getElementById('tokenLength').value)||32;
  var count=parseInt(document.getElementById('tokenCount').value)||5;
  var includeUpper=document.getElementById('includeUpper').checked;
  var includeLower=document.getElementById('includeLower').checked;
  var includeNumbers=document.getElementById('includeNumbers').checked;
  var includeSymbols=document.getElementById('includeSymbols').checked;
  var chars='';
  if(includeUpper)chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if(includeLower)chars+='abcdefghijklmnopqrstuvwxyz';
  if(includeNumbers)chars+='0123456789';
  if(includeSymbols)chars+='!@#$%^&*()_+-=[]{}|;:,.<>?';
  if(!chars){chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';}
  var tokens=[];
  for(var i=0;i<count;i++){
    var token='';
    var array=new Uint32Array(length);
    crypto.getRandomValues(array);
    for(var j=0;j<length;j++){
      token+=chars[array[j]%chars.length];
    }
    tokens.push(token);
  }
  showResult(tokens.join('\n'),'随机令牌');
}
function generateUUID(){
  var count=parseInt(document.getElementById('tokenCount').value)||5;
  var uuids=[];
  for(var i=0;i<count;i++){
    uuids.push('xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
      var r=Math.random()*16|0;
      var v=c==='x'?r:(r&0x3|0x8);
      return v.toString(16);
    }));
  }
  showResult(uuids.join('\n'),'UUID v4');
}
function generateNanoID(){
  var length=parseInt(document.getElementById('tokenLength').value)||21;
  var count=parseInt(document.getElementById('tokenCount').value)||5;
  var chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
  var ids=[];
  for(var i=0;i<count;i++){
    var id='';
    var array=new Uint32Array(length);
    crypto.getRandomValues(array);
    for(var j=0;j<length;j++){
      id+=chars[array[j]%chars.length];
    }
    ids.push(id);
  }
  showResult(ids.join('\n'),'NanoID');
}
function generateAPIKey(){
  var count=parseInt(document.getElementById('tokenCount').value)||5;
  var keys=[];
  for(var i=0;i<count;i++){
    var part1=generateRandomHex(16);
    var part2=generateRandomHex(16);
    var part3=generateRandomHex(16);
    keys.push(part1+'-'+part2+'-'+part3);
  }
  showResult(keys.join('\n'),'API密钥');
}
function generateRandomHex(length){
  var hex='';
  var array=new Uint32Array(length/2);
  crypto.getRandomValues(array);
  for(var i=0;i<array.length;i++){
    hex+=array[i].toString(16).padStart(8,'0');
  }
  return hex.substring(0,length);
}
function showResult(text,title){
  var r=document.getElementById('result');
  var html='<div class="card"><div class="section"><h3>📋 '+title+'</h3>';
  html+='<div class="result-block" id="resultText">'+escapeHtml(text)+'</div>';
  html+='<button class="copy-btn" onclick="copyResult()">复制所有</button></div></div>';
  r.innerHTML=html;
}
function escapeHtml(text){
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function copyResult(){
  var text=document.getElementById('resultText').textContent;
  navigator.clipboard.writeText(text).then(function(){alert('已复制到剪贴板');}).catch(function(){alert('复制失败');});
}
generateTokens();
</script></body></html>
