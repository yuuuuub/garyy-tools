<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔺 CSS 三角生成器</title>
<meta name="description" content="CSS三角形代码生成器，一键生成各种三角形样式">
<style>
:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --text: #1d1d1f;
  --text2: #86868b;
  --border: #e5e5ea;
  --primary: #5856d6;
  --primary-h: #4845b8;
  --input-bg: #ffffff;
  --input-bd: #d2d2d7;
  --shadow: 0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
  --radius: 14px;
  --code-bg: #1e1e2e;
  --code-fg: #cdd6f4;
  --grid-bg: repeating-conic-gradient(#e8e8ed 0% 25%,transparent 0% 50%) 50%/16px 16px;
  --toast-bg: #34c759;
}
@media (prefers-color-scheme:dark) {
  :root {
    --bg: #0d0d1a;
    --card: #16162a;
    --text: #e0e0ec;
    --text2: #8888a0;
    --border: #262644;
    --primary: #818cf8;
    --primary-h: #6d75e8;
    --input-bg: #1a1a36;
    --input-bd: #2e2e52;
    --shadow: 0 1px 3px rgba(0,0,0,.3),0 4px 20px rgba(0,0,0,.25);
    --code-bg: #0d0d1e;
    --grid-bg: repeating-conic-gradient(#1e1e3a 0% 25%,transparent 0% 50%) 50%/16px 16px;
  }
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;padding:16px;
  transition:background .3s,color .3s;line-height:1.5;
}
.container{max-width:880px;margin:0 auto}

header{text-align:center;padding:20px 0 12px}
header h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
header p{color:var(--text2);margin-top:2px;font-size:.85rem}

.main-grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:700px){
  .main-grid{grid-template-columns:1fr 1fr}
  body{padding:28px 20px}
  header h1{font-size:1.9rem}
}
@media(min-width:900px){
  body{padding:36px 20px}
}

.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);
  transition:background .3s,border-color .3s
}
.card-title{
  font-size:.75rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--text2);margin-bottom:14px
}
.full-width{grid-column:1/-1}

/* Preview */
.preview-area{
  min-height:200px;display:flex;align-items:center;justify-content:center;
  background:var(--grid-bg);border-radius:10px;position:relative;overflow:visible
}
@media(min-width:700px){.preview-area{min-height:260px}}

/* Controls */
.control-group{margin-bottom:14px}
.control-group:last-child{margin-bottom:0}
.control-group>label{display:block;font-size:.8rem;font-weight:600;margin-bottom:5px;color:var(--text2)}

.dir-btns{display:grid;grid-template-columns:1fr 1fr;gap:5px}
@media(min-width:360px){.dir-btns{grid-template-columns:1fr 1fr 1fr 1fr}}

.btn{
  padding:7px 12px;border:1.5px solid var(--input-bd);border-radius:8px;
  background:var(--input-bg);color:var(--text);cursor:pointer;
  font-size:.8rem;font-weight:500;transition:all .18s;text-align:center;
  -webkit-tap-highlight-color:transparent;user-select:none;white-space:nowrap
}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn:active{transform:scale(.97)}
.btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-h);border-color:var(--primary-h)}

.range-row{display:flex;align-items:center;gap:10px}
.range-row input[type=range]{flex:1}
.range-val{font-size:.82rem;font-weight:700;color:var(--primary);min-width:36px;text-align:right}
input[type=range]{width:100%;accent-color:var(--primary);margin:0;height:4px}
input[type=color]{
  width:100%;height:38px;border:2px solid var(--input-bd);
  border-radius:8px;cursor:pointer;padding:2px;background:var(--input-bg);
  -webkit-appearance:none;appearance:none
}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
input[type=color]::-webkit-color-swatch{border-radius:4px;border:none}

.preset-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
@media(max-width:350px){.preset-btns{grid-template-columns:1fr}}

.color-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.color-row .control-group{margin-bottom:0}

/* Code */
.code-wrap{position:relative}
.code-block{
  background:var(--code-bg);color:var(--code-fg);
  padding:16px 48px 16px 16px;border-radius:10px;
  font-family:'SF Mono','Fira Code','Cascadia Code',Consolas,monospace;
  font-size:.78rem;line-height:1.7;overflow-x:auto;white-space:pre;min-height:60px
}
.copy-btn{
  position:absolute;top:8px;right:8px;padding:6px 14px;font-size:.72rem;
  border-radius:6px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.08);color:var(--code-fg);
  cursor:pointer;transition:all .2s;font-weight:500
}
.copy-btn:hover{background:rgba(255,255,255,.15)}
.copy-btn.done{background:#22c55e;border-color:#22c55e;color:#fff}

/* Toast */
.toast{
  position:fixed;bottom:28px;left:50%;transform:translate(-50%,120px);
  background:var(--toast-bg);color:#fff;padding:10px 22px;border-radius:10px;
  font-size:.85rem;font-weight:600;box-shadow:0 6px 24px rgba(52,199,89,.35);
  transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:999;pointer-events:none
}
.toast.on{transform:translate(-50%,0)}
</style>

<body>
<div class="container">
  <header>
    <h1>🔺 CSS 三角生成器</h1>
    <p>纯 CSS border 实现 · 实时预览 · 一键复制</p>
  </header>

  <div class="main-grid">
    <!-- 预览 -->
    <div class="card">
      <div class="card-title">👁 实时预览</div>
      <div class="preview-area" id="preview"></div>
    </div>

    <!-- 控制面板 -->
    <div class="card">
      <div class="card-title">🎛 参数调节</div>

      <div class="control-group">
        <label>📐 方向</label>
        <div class="dir-btns" id="dirBtns">
          <button class="btn active" data-dir="up">⬆ 上</button>
          <button class="btn" data-dir="down">⬇ 下</button>
          <button class="btn" data-dir="left">⬅ 左</button>
          <button class="btn" data-dir="right">➡ 右</button>
        </div>
      </div>

      <div class="control-group">
        <label>📏 样式预设</label>
        <div class="preset-btns" id="presetBtns">
          <button class="btn active" data-style="solid">实心三角</button>
          <button class="btn" data-style="bordered">边框三角</button>
          <button class="btn" data-style="rounded">圆角三角</button>
        </div>
      </div>

      <div class="control-group">
        <label>↔ 底边宽度：<span id="widthLabel">100</span>px</label>
        <div class="range-row">
          <input type="range" id="widthRange" min="20" max="300" value="100" step="2">
          <span class="range-val" id="widthVal">100</span>
        </div>
      </div>

      <div class="control-group">
        <label>↕ 三角形高度：<span id="heightLabel">80</span>px</label>
        <div class="range-row">
          <input type="range" id="heightRange" min="20" max="300" value="80" step="2">
          <span class="range-val" id="heightVal">80</span>
        </div>
      </div>

      <div class="color-row">
        <div class="control-group">
          <label>🎨 填充颜色</label>
          <input type="color" id="fillColor" value="#5856d6">
        </div>
        <div class="control-group" id="borderColorGroup" style="display:none">
          <label>🖊 边框颜色</label>
          <input type="color" id="borderColor" value="#2c3e50">
        </div>
      </div>

      <div class="control-group" id="borderWidthGroup" style="display:none">
        <label>📏 边框粗细：<span id="bwLabel">3</span>px</label>
        <div class="range-row">
          <input type="range" id="borderWidthRange" min="1" max="10" value="3" step="1">
          <span class="range-val" id="bwVal">3</span>
        </div>
      </div>
    </div>

    <!-- 生成代码 -->
    <div class="card full-width">
      <div class="card-title">📋 生成的 CSS 代码</div>
      <div class="code-wrap">
        <div class="code-block" id="codeBlock"></div>
        <button class="copy-btn" id="copyBtn">📋 复制</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">✅ 已复制到剪贴板！</div>

<script>
(function(){
  // 状态
  const state = {
    direction: 'up',
    style: 'solid',
    width: 100,
    height: 80,
    color: '#5856d6',
    borderColor: '#2c3e50',
    borderWidth: 3
  };

  const $ = id => document.getElementById(id);
  const preview = $('preview');
  const codeBlock = $('codeBlock');
  const copyBtn = $('copyBtn');
  const toast = $('toast');

  // --- 预览渲染 ---
  function createSolidPreview(dir, w, h, color) {
    const hw = w / 2;
    const el = document.createElement('div');
    el.style.cssText = [
      'width:0;height:0;',
      dir === 'up'    ? `border-left:${hw}px solid transparent;border-right:${hw}px solid transparent;border-bottom:${h}px solid ${color};` :
      dir === 'down'  ? `border-left:${hw}px solid transparent;border-right:${hw}px solid transparent;border-top:${h}px solid ${color};` :
      dir === 'left'  ? `border-top:${h/2}px solid transparent;border-bottom:${h/2}px solid transparent;border-right:${w}px solid ${color};` :
                        `border-top:${h/2}px solid transparent;border-bottom:${h/2}px solid transparent;border-left:${w}px solid ${color};`
    ].join('');
    return el;
  }

  function createBorderedPreview(dir, w, h, color, bColor, bw) {
    const hw = w / 2;
    const hh = h / 2;
    const wrap = document.createElement('div');
    wrap.style.position = 'relative';
    wrap.style.display = 'inline-block';

    if (dir === 'up') {
      wrap.style.width = (w + 2*bw) + 'px';
      wrap.style.height = (h + bw) + 'px';
      const outer = document.createElement('div');
      outer.style.cssText = `position:absolute;left:${hw+bw}px;top:${-bw}px;width:0;height:0;border-left:${hw+bw}px solid transparent;border-right:${hw+bw}px solid transparent;border-bottom:${h+bw}px solid ${bColor};`;
      const inner = document.createElement('div');
      inner.style.cssText = `position:absolute;left:${hw+bw}px;top:0;width:0;height:0;border-left:${hw}px solid transparent;border-right:${hw}px solid transparent;border-bottom:${h}px solid ${color};`;
      wrap.appendChild(outer);
      wrap.appendChild(inner);
    } else if (dir === 'down') {
      wrap.style.width = (w + 2*bw) + 'px';
      wrap.style.height = (h + bw) + 'px';
      const outer = document.createElement('div');
      outer.style.cssText = `position:absolute;left:${hw+bw}px;top:0;width:0;height:0;border-left:${hw+bw}px solid transparent;border-right:${hw+bw}px solid transparent;border-top:${h+bw}px solid ${bColor};`;
      const inner = document.createElement('div');
      inner.style.cssText = `position:absolute;left:${hw+bw}px;top:${bw}px;width:0;height:0;border-left:${hw}px solid transparent;border-right:${hw}px solid transparent;border-top:${h}px solid ${color};`;
      wrap.appendChild(outer);
      wrap.appendChild(inner);
    } else if (dir === 'left') {
      wrap.style.width = (w + bw) + 'px';
      wrap.style.height = (h + 2*bw) + 'px';
      const outer = document.createElement('div');
      outer.style.cssText = `position:absolute;left:${-bw}px;top:${hh+bw}px;width:0;height:0;border-top:${hh+bw}px solid transparent;border-bottom:${hh+bw}px solid transparent;border-right:${w+bw}px solid ${bColor};`;
      const inner = document.createElement('div');
      inner.style.cssText = `position:absolute;left:0;top:${hh+bw}px;width:0;height:0;border-top:${hh}px solid transparent;border-bottom:${hh}px solid transparent;border-right:${w}px solid ${color};`;
      wrap.appendChild(outer);
      wrap.appendChild(inner);
    } else { // right
      wrap.style.width = (w + bw) + 'px';
      wrap.style.height = (h + 2*bw) + 'px';
      const outer = document.createElement('div');
      outer.style.cssText = `position:absolute;left:0;top:${hh+bw}px;width:0;height:0;border-top:${hh+bw}px solid transparent;border-bottom:${hh+bw}px solid transparent;border-left:${w+bw}px solid ${bColor};`;
      const inner = document.createElement('div');
      inner.style.cssText = `position:absolute;left:${bw}px;top:${hh+bw}px;width:0;height:0;border-top:${hh}px solid transparent;border-bottom:${hh}px solid transparent;border-left:${w}px solid ${color};`;
      wrap.appendChild(outer);
      wrap.appendChild(inner);
    }
    return wrap;
  }

  function createRoundedPreview(dir, w, h, color) {
    const wrap = document.createElement('div');
    wrap.style.position = 'relative';
    wrap.style.display = 'inline-block';
    wrap.style.overflow = 'hidden';

    const diag = Math.sqrt(w * w + h * h);
    const sqSize = Math.ceil(diag * 1.05);
    const br = Math.min(w, h) * 0.15;

    const sq = document.createElement('div');
    sq.style.cssText = `width:${sqSize}px;height:${sqSize}px;background:${color};border-radius:${br}px;position:absolute;`;

    if (dir === 'up') {
      wrap.style.width = w + 'px';
      wrap.style.height = h + 'px';
      sq.style.left = '50%';
      sq.style.top = '0';
      sq.style.transform = 'translate(-50%, -50%) rotate(45deg)';
    } else if (dir === 'down') {
      wrap.style.width = w + 'px';
      wrap.style.height = h + 'px';
      sq.style.left = '50%';
      sq.style.top = '100%';
      sq.style.transform = 'translate(-50%, -50%) rotate(45deg)';
    } else if (dir === 'left') {
      wrap.style.width = w + 'px';
      wrap.style.height = h + 'px';
      sq.style.left = '0';
      sq.style.top = '50%';
      sq.style.transform = 'translate(-50%, -50%) rotate(45deg)';
    } else { // right
      wrap.style.width = w + 'px';
      wrap.style.height = h + 'px';
      sq.style.left = '100%';
      sq.style.top = '50%';
      sq.style.transform = 'translate(-50%, -50%) rotate(45deg)';
    }

    wrap.appendChild(sq);
    return wrap;
  }

  function renderPreview() {
    const { direction: dir, style, width: w, height: h, color, borderColor: bc, borderWidth: bw } = state;
    preview.innerHTML = '';
    let el;
    if (style === 'solid') {
      el = createSolidPreview(dir, w, h, color);
    } else if (style === 'bordered') {
      el = createBorderedPreview(dir, w, h, color, bc, bw);
    } else {
      el = createRoundedPreview(dir, w, h, color);
    }
    preview.appendChild(el);
  }

  // --- 代码生成 ---
  function generateCSS() {
    const { direction: dir, style, width: w, height: h, color, borderColor: bc, borderWidth: bw } = state;
    const hw = w / 2;
    const hh = h / 2;
    let css = '';

    if (style === 'solid') {
      css = `.triangle {\n  width: 0;\n  height: 0;\n`;
      if (dir === 'up') {
        css += `  border-left: ${hw}px solid transparent;\n  border-right: ${hw}px solid transparent;\n  border-bottom: ${h}px solid ${color};\n`;
      } else if (dir === 'down') {
        css += `  border-left: ${hw}px solid transparent;\n  border-right: ${hw}px solid transparent;\n  border-top: ${h}px solid ${color};\n`;
      } else if (dir === 'left') {
        css += `  border-top: ${hh}px solid transparent;\n  border-bottom: ${hh}px solid transparent;\n  border-right: ${w}px solid ${color};\n`;
      } else {
        css += `  border-top: ${hh}px solid transparent;\n  border-bottom: ${hh}px solid transparent;\n  border-left: ${w}px solid ${color};\n`;
      }
      css += `}`;
    } else if (style === 'bordered') {
      css = `.triangle {\n  position: relative;\n  width: 0;\n  height: 0;\n`;
      if (dir === 'up') {
        css += `  border-left: ${hw}px solid transparent;\n  border-right: ${hw}px solid transparent;\n  border-bottom: ${h}px solid ${color};\n`;
        css += `}\n\n.triangle::before {\n  content: '';\n  position: absolute;\n  left: ${-(hw+bw)}px;\n  top: ${bw}px;\n`;
        css += `  border-left: ${hw+bw}px solid transparent;\n  border-right: ${hw+bw}px solid transparent;\n  border-bottom: ${h+bw}px solid ${bc};\n  z-index: -1;\n}`;
      } else if (dir === 'down') {
        css += `  border-left: ${hw}px solid transparent;\n  border-right: ${hw}px solid transparent;\n  border-top: ${h}px solid ${color};\n`;
        css += `}\n\n.triangle::before {\n  content: '';\n  position: absolute;\n  left: ${-(hw+bw)}px;\n  top: ${-bw}px;\n`;
        css += `  border-left: ${hw+bw}px solid transparent;\n  border-right: ${hw+bw}px solid transparent;\n  border-top: ${h+bw}px solid ${bc};\n  z-index: -1;\n}`;
      } else if (dir === 'left') {
        css += `  border-top: ${hh}px solid transparent;\n  border-bottom: ${hh}px solid transparent;\n  border-right: ${w}px solid ${color};\n`;
        css += `}\n\n.triangle::before {\n  content: '';\n  position: absolute;\n  left: ${-bw}px;\n  top: ${-(hh+bw)}px;\n`;
        css += `  border-top: ${hh+bw}px solid transparent;\n  border-bottom: ${hh+bw}px solid transparent;\n  border-right: ${w+bw}px solid ${bc};\n  z-index: -1;\n}`;
      } else {
        css += `  border-top: ${hh}px solid transparent;\n  border-bottom: ${hh}px solid transparent;\n  border-left: ${w}px solid ${color};\n`;
        css += `}\n\n.triangle::before {\n  content: '';\n  position: absolute;\n  left: ${bw}px;\n  top: ${-(hh+bw)}px;\n`;
        css += `  border-top: ${hh+bw}px solid transparent;\n  border-bottom: ${hh+bw}px solid transparent;\n  border-left: ${w+bw}px solid ${bc};\n  z-index: -1;\n}`;
      }
    } else { // rounded
      const diag = Math.sqrt(w * w + h * h);
      const sqSize = Math.ceil(diag * 1.05);
      const br = (Math.min(w, h) * 0.15).toFixed(1);
      css = `.triangle {\n  position: relative;\n  width: ${w}px;\n  height: ${h}px;\n  overflow: hidden;\n`;
      css += `}\n\n.triangle::after {\n  content: '';\n  position: absolute;\n`;
      css += `  width: ${sqSize}px;\n  height: ${sqSize}px;\n  background: ${color};\n`;
      css += `  border-radius: ${br}px;\n`;
      if (dir === 'up') {
        css += `  left: 50%;\n  top: 0;\n  transform: translate(-50%, -50%) rotate(45deg);\n`;
      } else if (dir === 'down') {
        css += `  left: 50%;\n  top: 100%;\n  transform: translate(-50%, -50%) rotate(45deg);\n`;
      } else if (dir === 'left') {
        css += `  left: 0;\n  top: 50%;\n  transform: translate(-50%, -50%) rotate(45deg);\n`;
      } else {
        css += `  left: 100%;\n  top: 50%;\n  transform: translate(-50%, -50%) rotate(45deg);\n`;
      }
      css += `}`;
    }
    return css;
  }

  function updateCode() {
    codeBlock.textContent = generateCSS();
  }

  function updateAll() {
    renderPreview();
    updateCode();
  }

  // --- UI 联动 ---
  function updateBorderControls() {
    const show = state.style === 'bordered';
    $('borderColorGroup').style.display = show ? '' : 'none';
    $('borderWidthGroup').style.display = show ? '' : 'none';
  }

  // --- 事件绑定 ---
  // 方向按钮
  $('dirBtns').addEventListener('click', e => {
    const btn = e.target.closest('button[data-dir]');
    if (!btn) return;
    state.direction = btn.dataset.dir;
    $('dirBtns').querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    updateAll();
  });

  // 样式预设
  $('presetBtns').addEventListener('click', e => {
    const btn = e.target.closest('button[data-style]');
    if (!btn) return;
    state.style = btn.dataset.style;
    $('presetBtns').querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    updateBorderControls();
    updateAll();
  });

  // 宽度滑块
  $('widthRange').addEventListener('input', e => {
    state.width = parseInt(e.target.value);
    $('widthVal').textContent = state.width;
    $('widthLabel').textContent = state.width;
    updateAll();
  });

  // 高度滑块
  $('heightRange').addEventListener('input', e => {
    state.height = parseInt(e.target.value);
    $('heightVal').textContent = state.height;
    $('heightLabel').textContent = state.height;
    updateAll();
  });

  // 填充颜色
  $('fillColor').addEventListener('input', e => {
    state.color = e.target.value;
    updateAll();
  });

  // 边框颜色
  $('borderColor').addEventListener('input', e => {
    state.borderColor = e.target.value;
    updateAll();
  });

  // 边框粗细
  $('borderWidthRange').addEventListener('input', e => {
    state.borderWidth = parseInt(e.target.value);
    $('bwVal').textContent = state.borderWidth;
    $('bwLabel').textContent = state.borderWidth;
    updateAll();
  });

  // 复制按钮
  let copyTimer;
  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(generateCSS());
      copyBtn.textContent = '✅ 已复制';
      copyBtn.classList.add('done');
      clearTimeout(copyTimer);
      copyTimer = setTimeout(() => {
        copyBtn.textContent = '📋 复制';
        copyBtn.classList.remove('done');
      }, 2000);
      // Toast
      toast.classList.add('on');
      setTimeout(() => toast.classList.remove('on'), 1800);
    } catch {
      // 回退方案
      const ta = document.createElement('textarea');
      ta.value = generateCSS();
      ta.style.position = 'fixed';ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      copyBtn.textContent = '✅ 已复制';
      copyBtn.classList.add('done');
      clearTimeout(copyTimer);
      copyTimer = setTimeout(() => {
        copyBtn.textContent = '📋 复制';
        copyBtn.classList.remove('done');
      }, 2000);
    }
  });

  // 初始化
  updateAll();
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
