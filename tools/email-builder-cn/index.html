<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📧 邮件构建器</title>
<meta name="description" content="可视化邮件构建器，拖拽组件快速生成HTML邮件模板">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📧 邮件构建器">
<meta property="og:description" content="可视化邮件构建器 - Gary's Tools">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📧</text></svg>">
<style>
:root{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--orange:#bc4c00;--purple:#8250df;--shadow:0 1px 3px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--orange:#d29922;--purple:#bc8cff;--shadow:0 1px 3px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);padding:16px;transition:background .3s,color .3s}
.container{max-width:1100px;margin:0 auto}
h1{font-size:1.3rem;color:var(--blue);border-bottom:2px solid var(--blue);padding-bottom:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:.9rem;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical;min-height:80px}
button{background:var(--blue);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600}
button:hover{opacity:.85}
.btn-green{background:var(--green)}.btn-red{background:var(--red)}.btn-orange{background:var(--orange)}.btn-purple{background:var(--purple)}.btn-sm{padding:4px 10px;font-size:.8rem}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row.full{grid-template-columns:1fr}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px}
.tab-bar{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tab-bar button{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.tab-bar button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.theme-toggle{position:fixed;top:12px;right:12px;background:var(--text2);color:var(--bg);border:none;padding:6px 12px;border-radius:8px;cursor:pointer;z-index:100}
.preview-box{background:#1a1a2e;color:#e6e6e6;padding:16px;border-radius:8px;border:1px solid var(--border);font-family:'SF Mono',Menlo,monospace;font-size:.8rem;line-height:1.6;white-space:pre-wrap;word-break:break-all;overflow:auto;max-height:500px}
.component-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:16px}
.component-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;cursor:pointer;transition:border-color .2s}
.component-item:hover{border-color:var(--blue)}
.component-item .icon{font-size:1.5rem;margin-bottom:4px}
.component-item .name{font-size:.75rem;color:var(--text2)}
.build-area{min-height:200px;border:2px dashed var(--border);border-radius:8px;padding:16px;transition:border-color .2s}
.build-area:hover{border-color:var(--blue)}
.build-area .placeholder{text-align:center;color:var(--text2);font-size:.85rem;padding:40px 0}
.built-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;position:relative}
.built-block .remove-btn{position:absolute;top:4px;right:4px;background:var(--red);color:#fff;border:none;width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:.7rem;display:flex;align-items:center;justify-content:center}
.built-block .block-label{font-size:.75rem;color:var(--text2);margin-bottom:4px}
.email-render{background:#fff;border:1px solid var(--border);border-radius:8px;padding:24px;margin-top:12px;color:#333;font-size:14px;line-height:1.6}
.email-render h1{color:#333;border:none;font-size:22px;margin-bottom:8px}
.email-render h2{color:#333;font-size:18px;margin:12px 0 8px}
.email-render p{margin-bottom:8px;color:#555}
.email-render img{max-width:100%;border-radius:8px}
.email-render .btn-email{display:inline-block;background:#0969da;color:#fff;padding:10px 24px;border-radius:6px;text-decoration:none;font-weight:600;margin:8px 0}
.email-render .divider{border-top:1px solid #eee;margin:16px 0}
.email-render .footer{font-size:12px;color:#999;text-align:center;margin-top:16px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">🌓</button>
<div class="container">
<h1>📧 邮件构建器</h1>

<div class="card">
<div class="section-title">组件库</div>
<div class="component-list" id="componentList"></div>
</div>

<div class="card">
<div class="section-title">构建区域</div>
<div class="build-area" id="buildArea">
<div class="placeholder">点击上方组件添加到邮件中</div>
</div>
<div style="display:flex;gap:8px;margin-top:12px">
<button onclick="clearBuild()">🗑 清空</button>
<button class="btn-green" onclick="previewEmail()">👁 预览</button>
<button class="btn-purple" onclick="exportHTML()">📤 导出HTML</button>
</div>
</div>

<div class="card" id="previewCard" style="display:none">
<div class="section-title">邮件预览</div>
<div class="email-render" id="emailPreview"></div>
</div>

<div class="card" id="htmlCard" style="display:none">
<div class="section-title">HTML输出</div>
<div class="preview-box" id="htmlOutput"></div>
<div style="margin-top:8px"><button class="btn-sm btn-green" onclick="copyHTML()">📋 复制</button></div>
</div>
</div>

<script src="../i18n.js" defer></script>
<script>
var builtBlocks = [];
var blockIdCounter = 0;

var components = [
  {type:'header',icon:'📌',name:'标题栏',fields:[{key:'title',label:'标题',val:'欢迎订阅我们的邮件'},{key:'subtitle',label:'副标题',val:'获取最新资讯与优惠'}]},
  {type:'text',icon:'📝',name:'文本段落',fields:[{key:'content',label:'内容',val:'这是一段正文内容，您可以在这里添加详细说明。'}]},
  {type:'image',icon:'🖼️',name:'图片',fields:[{key:'src',label:'图片URL',val:'https://placehold.co/600x300/0969da/fff?text=Banner'},{key:'alt',label:'替代文字',val:'Banner图片'}]},
  {type:'button',icon:'🔘',name:'按钮',fields:[{key:'text',label:'按钮文字',val:'立即查看'},{key:'url',label:'链接地址',val:'https://example.com'},{key:'color',label:'按钮颜色',val:'#0969da'}]},
  {type:'divider',icon:'➖',name:'分割线',fields:[]},
  {type:'two-col',icon:'📊',name:'双栏布局',fields:[{key:'left',label:'左栏内容',val:'左栏文本内容'},{key:'right',label:'右栏内容',val:'右栏文本内容'}]},
  {type:'social',icon:'🔗',name:'社交链接',fields:[{key:'twitter',label:'Twitter',val:'#'},{key:'facebook',label:'Facebook',val:'#'},{key:'instagram',label:'Instagram',val:'#'}]},
  {type:'footer',icon:'📋',name:'页脚',fields:[{key:'text',label:'页脚文字',val:'© 2024 您的公司名称。如不希望收到此类邮件，请退订。'},{key:'address',label:'地址',val:'上海市浦东新区XXX路XX号'}]},
  {type:'spacer',icon:'⬜',name:'间距',fields:[{key:'height',label:'高度(px)',val:'30'}]},
  {type:'coupon',icon:'🎁',name:'优惠券',fields:[{key:'code',label:'优惠码',val:'SAVE20'},{key:'discount',label:'优惠信息',val:'全场8折'},{key:'expire',label:'有效期',val:'2024-12-31'}]}
];

function renderComponents(){
  var el=document.getElementById('componentList');
  el.innerHTML=components.map(function(c,i){
    return '<div class="component-item" onclick="addComponent('+i+')"><div class="icon">'+c.icon+'</div><div class="name">'+c.name+'</div></div>';
  }).join('');
}

function addComponent(idx){
  var comp=components[idx];
  var block={id:blockIdCounter++,type:comp.type,name:comp.name,fields:{}};
  comp.fields.forEach(function(f){block.fields[f.key]=f.val;});
  builtBlocks.push(block);
  renderBuild();
}

function renderBuild(){
  var el=document.getElementById('buildArea');
  if(!builtBlocks.length){el.innerHTML='<div class="placeholder">点击上方组件添加到邮件中</div>';return;}
  el.innerHTML=builtBlocks.map(function(b,i){
    var content='';
    if(b.type==='header')content='<strong>'+b.fields.title+'</strong><br><span style="color:var(--text2);font-size:.85rem">'+b.fields.subtitle+'</span>';
    else if(b.type==='text')content=b.fields.content.substring(0,60)+(b.fields.content.length>60?'...':'');
    else if(b.type==='image')content='<img src="'+b.fields.src+'" style="max-width:100%;height:60px;object-fit:cover;border-radius:4px">';
    else if(b.type==='button')content='<span style="display:inline-block;background:'+b.fields.color+';color:#fff;padding:4px 12px;border-radius:4px;font-size:.8rem">'+b.fields.text+'</span>';
    else if(b.type==='divider')content='<hr style="border:none;border-top:1px solid var(--border)">';
    else if(b.type==='two-col')content='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.8rem"><div>'+b.fields.left+'</div><div>'+b.fields.right+'</div></div>';
    else if(b.type==='social')content='社交链接';
    else if(b.type==='footer')content='<span style="font-size:.75rem;color:var(--text2)">'+b.fields.text.substring(0,40)+'...</span>';
    else if(b.type==='spacer')content='<div style="height:'+b.fields.height+'px;background:repeating-linear-gradient(90deg,var(--border),var(--border) 4px,transparent 4px,transparent 8px)"></div>';
    else if(b.type==='coupon')content='<span style="background:var(--orange);color:#fff;padding:2px 8px;border-radius:4px;font-size:.8rem">'+b.fields.code+' - '+b.fields.discount+'</span>';
    return '<div class="built-block"><button class="remove-btn" onclick="removeBlock('+i+')">×</button><div class="block-label">'+b.name+'</div>'+content+'</div>';
  }).join('');
}

function removeBlock(i){builtBlocks.splice(i,1);renderBuild();}
function clearBuild(){builtBlocks=[];renderBuild();document.getElementById('previewCard').style.display='none';document.getElementById('htmlCard').style.display='none';}

function generateEmailHTML(){
  var html='<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1.0">\n</head>\n<body style="margin:0;padding:0;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,sans-serif">\n<div style="max-width:600px;margin:0 auto;background:#fff;padding:0">\n';
  builtBlocks.forEach(function(b){
    if(b.type==='header'){
      html+='<div style="background:linear-gradient(135deg,#0969da,#8250df);color:#fff;padding:40px 24px;text-align:center"><h1 style="margin:0 0 8px;font-size:24px">'+b.fields.title+'</h1><p style="margin:0;opacity:.9;font-size:14px">'+b.fields.subtitle+'</p></div>\n';
    }else if(b.type==='text'){
      html+='<div style="padding:16px 24px"><p style="margin:0;font-size:15px;line-height:1.6;color:#333">'+b.fields.content+'</p></div>\n';
    }else if(b.type==='image'){
      html+='<div style="padding:0 24px"><img src="'+b.fields.src+'" alt="'+b.fields.alt+'" style="width:100%;border-radius:8px"></div>\n';
    }else if(b.type==='button'){
      html+='<div style="padding:16px 24px;text-align:center"><a href="'+b.fields.url+'" style="display:inline-block;background:'+b.fields.color+';color:#fff;padding:12px 32px;border-radius:6px;text-decoration:none;font-weight:600">'+b.fields.text+'</a></div>\n';
    }else if(b.type==='divider'){
      html+='<div style="padding:0 24px"><hr style="border:none;border-top:1px solid #eee;margin:16px 0"></div>\n';
    }else if(b.type==='two-col'){
      html+='<div style="padding:16px 24px;display:flex;gap:16px"><div style="flex:1;font-size:14px;color:#555">'+b.fields.left+'</div><div style="flex:1;font-size:14px;color:#555">'+b.fields.right+'</div></div>\n';
    }else if(b.type==='social'){
      html+='<div style="padding:16px 24px;text-align:center"><a href="'+b.fields.twitter+'" style="margin:0 8px;color:#1da1f2;text-decoration:none">Twitter</a> <a href="'+b.fields.facebook+'" style="margin:0 8px;color:#1877f2;text-decoration:none">Facebook</a> <a href="'+b.fields.instagram+'" style="margin:0 8px;color:#e4405f;text-decoration:none">Instagram</a></div>\n';
    }else if(b.type==='footer'){
      html+='<div style="background:#f9f9f9;padding:24px;text-align:center;font-size:12px;color:#999"><p style="margin:0">'+b.fields.text+'</p><p style="margin:4px 0 0">'+b.fields.address+'</p></div>\n';
    }else if(b.type==='spacer'){
      html+='<div style="height:'+b.fields.height+'px"></div>\n';
    }else if(b.type==='coupon'){
      html+='<div style="padding:16px 24px;text-align:center"><div style="border:2px dashed #bc4c00;border-radius:8px;padding:16px;display:inline-block"><div style="font-size:20px;font-weight:700;color:#bc4c00">'+b.fields.discount+'</div><div style="font-size:14px;color:#666;margin:4px 0">优惠码: <strong>'+b.fields.code+'</strong></div><div style="font-size:12px;color:#999">有效期至 '+b.fields.expire+'</div></div></div>\n';
    }
  });
  html+='</div>\n</body>\n</html>';
  return html;
}

function previewEmail(){
  if(!builtBlocks.length){alert('请先添加组件');return;}
  var html=generateEmailHTML();
  document.getElementById('emailPreview').innerHTML=html.match(/<body[^>]*>([\s\S]*)<\/body>/i)?html.match(/<body[^>]*>([\s\S]*)<\/body>/i)[1]:'';
  document.getElementById('previewCard').style.display='block';
  document.getElementById('previewCard').scrollIntoView({behavior:'smooth'});
}

function exportHTML(){
  if(!builtBlocks.length){alert('请先添加组件');return;}
  document.getElementById('htmlOutput').textContent=generateEmailHTML();
  document.getElementById('htmlCard').style.display='block';
  document.getElementById('htmlCard').scrollIntoView({behavior:'smooth'});
}

function copyHTML(){
  navigator.clipboard.writeText(document.getElementById('htmlOutput').textContent).then(function(){alert('已复制到剪贴板');});
}

function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='dark'?'light':'dark');}
renderComponents();
</script>
</body>
</html>
