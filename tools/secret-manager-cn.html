<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密钥管理工具</title>
    <meta name="description" content="用于安全管理和存储密钥的工具">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
    <meta name="robots" content="index, follow">
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --text-primary: #e6e6e6;
            --text-secondary: #a6a6a6;
            --accent: #ff5722;
            --accent-hover: #ff7043;
            --border: #2a2a4a;
            --success: #4caf50;
            --warning: #ff9800;
            --danger: #f44336;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        h1 { color: var(--accent); margin-bottom: 2rem; text-align: center; }
        .card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: var(--text-secondary); }
        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 1rem;
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        button:hover { background: var(--accent-hover); }
        .secret-item { 
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 1rem;
            margin: 0.5rem 0;
            border: 1px solid var(--border);
        }
        .secret-name { font-weight: bold; color: var(--accent); margin-bottom: 0.5rem; }
        .secret-value { 
            font-family: monospace;
            background: var(--bg-primary);
            padding: 0.5rem;
            border-radius: 4px;
            word-break: break-all;
        }
        .security-notice {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid var(--danger);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }
    </style>
    <script src="i18n.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>密钥管理</h1>
        
        <div class="security-notice">
            <strong>安全提醒：</strong> 此工具仅用于演示。在生产环境中，请使用专业的密钥管理服务（如Vault、AWS Secrets Manager等）。
        </div>
        
        <div class="card">
            <h2>添加密钥</h2>
            <form id="secretForm">
                <div class="form-group">
                    <label>密钥名称</label>
                    <input type="text" id="secretName" placeholder="API_KEY" required>
                </div>
                <div class="form-group">
                    <label>密钥值</label>
                    <input type="password" id="secretValue" placeholder="输入密钥值" required>
                </div>
                <div class="form-group">
                    <label>环境</label>
                    <select id="secretEnv">
                        <option value="dev">开发环境</option>
                        <option value="staging">测试环境</option>
                        <option value="prod">生产环境</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea id="secretDescription" placeholder="密钥用途描述"></textarea>
                </div>
                <button type="submit">添加密钥</button>
            </form>
        </div>
        
        <div class="card">
            <h2>密钥列表</h2>
            <div id="secretList">
                <!-- 密钥将在这里显示 -->
            </div>
        </div>
    </div>

    <script>
        // 简单加密函数（仅用于演示，不安全）
        function encrypt(text, key) {
            let result = '';
            for (let i = 0; i < text.length; i++) {
                result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
            }
            return btoa(result);
        }
        
        // 简单解密函数
        function decrypt(encoded, key) {
            const text = atob(encoded);
            let result = '';
            for (let i = 0; i < text.length; i++) {
                result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
            }
            return result;
        }
        
        // 初始化数据
        let secrets = JSON.parse(localStorage.getItem('appSecrets')) || [];
        const encryptionKey = 'demo-key-123'; // 仅用于演示
        
        // 渲染密钥列表
        function renderSecrets() {
            const container = document.getElementById('secretList');
            container.innerHTML = '';
            
            if (secrets.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary); text-align: center; padding: 2rem;">没有存储的密钥</p>';
                return;
            }
            
            secrets.forEach((secret, index) => {
                const div = document.createElement('div');
                div.className = 'secret-item';
                div.innerHTML = `
                    <div class="secret-name">${secret.name}</div>
                    <div class="secret-value" id="secret-value-${index}">••••••••••••••••</div>
                    <div style="color: var(--text-secondary); margin: 0.5rem 0;">
                        环境：${secret.env} | 添加时间：${secret.createdAt}
                    </div>
                    <div style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 0.5rem;">
                        ${secret.description || '无描述'}
                    </div>
                    <div>
                        <button onclick="toggleSecretVisibility(${index})" style="margin-right: 0.5rem; padding: 0.5rem;">显示/隐藏</button>
                        <button onclick="copySecret(${index})" style="margin-right: 0.5rem; padding: 0.5rem; background: var(--success);">复制</button>
                        <button onclick="deleteSecret(${index})" style="background: var(--danger); padding: 0.5rem;">删除</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }
        
        // 添加密钥
        document.getElementById('secretForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const secretValue = document.getElementById('secretValue').value;
            const encryptedValue = encrypt(secretValue, encryptionKey);
            
            const newSecret = {
                name: document.getElementById('secretName').value,
                encryptedValue: encryptedValue,
                env: document.getElementById('secretEnv').value,
                description: document.getElementById('secretDescription').value,
                createdAt: new Date().toLocaleString()
            };
            
            secrets.push(newSecret);
            localStorage.setItem('appSecrets', JSON.stringify(secrets));
            renderSecrets();
            this.reset();
        });
        
        // 显示/隐藏密钥
        function toggleSecretVisibility(index) {
            const valueElement = document.getElementById(`secret-value-${index}`);
            if (valueElement.textContent === '••••••••••••••••') {
                const decryptedValue = decrypt(secrets[index].encryptedValue, encryptionKey);
                valueElement.textContent = decryptedValue;
            } else {
                valueElement.textContent = '••••••••••••••••';
            }
        }
        
        // 复制密钥
        function copySecret(index) {
            const decryptedValue = decrypt(secrets[index].encryptedValue, encryptionKey);
            navigator.clipboard.writeText(decryptedValue).then(() => {
                alert('密钥已复制到剪贴板');
            }).catch(err => {
                console.error('复制失败:', err);
            });
        }
        
        // 删除密钥
        function deleteSecret(index) {
            if (confirm('确定要删除此密钥吗？此操作不可撤销。')) {
                secrets.splice(index, 1);
                localStorage.setItem('appSecrets', JSON.stringify(secrets));
                renderSecrets();
            }
        }
        
        // 初始渲染
        renderSecrets();
        
        // 添加一些示例密钥
        if (secrets.length === 0) {
            secrets = [
                {
                    name: 'DATABASE_URL',
                    encryptedValue: encrypt('postgresql://user:pass@localhost:5432/db', encryptionKey),
                    env: 'dev',
                    description: '数据库连接字符串',
                    createdAt: new Date().toLocaleString()
                },
                {
                    name: 'API_KEY',
                    encryptedValue: encrypt('sk-1234567890abcdef', encryptionKey),
                    env: 'prod',
                    description: '第三方API密钥',
                    createdAt: new Date().toLocaleString()
                }
            ];
            localStorage.setItem('appSecrets', JSON.stringify(secrets));
            renderSecrets();
        }
    </script>
</body>
</html>
