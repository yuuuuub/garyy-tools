<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>经济日历</title>
<meta name="description" content="经济日历，全球经济事件和数据发布日程管理">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6;scroll-behavior:smooth}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:var(--text);font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{background:var(--accent2)}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
input,select,textarea{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:1fr 1fr 1fr}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-blue{background:rgba(59,130,246,.2);color:var(--accent2)}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-red{background:rgba(248,81,73,.2);color:var(--red)}
.badge-yellow{background:rgba(210,153,34,.2);color:var(--yellow)}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
.table th{color:var(--text2);font-size:.85rem;font-weight:600}
.table tr:hover{background:rgba(59,130,246,.05)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.85rem;white-space:nowrap;color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:var(--text)}
.tab:hover:not(.active){background:var(--border)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot-red{background:#f85149}
.dot-yellow{background:#d29922}
.dot-green{background:#3fb950}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}.grid-2,.grid-3{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="经济日历">
<meta property="og:description" content="经济日历，全球经济事件和数据发布日程管理">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/economic-calendar-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='📅 经济日历';
const APP=document.getElementById('app');

const COUNTRIES={CN:'🇨🇳 中国',US:'🇺🇸 美国',EU:'🇪🇺 欧元区',JP:'🇯🇵 日本',UK:'🇬🇧 英国'};
const IMPACT={3:'高',2:'中',1:'低'};
const IMPACT_CLASS={3:'badge-red',2:'badge-yellow',1:'badge-green'};
const IMPACT_DOT={3:'dot-red',2:'dot-yellow',1:'dot-green'};

let customEvents=JSON.parse(localStorage.getItem('ec_custom')||'[]');
let filterCountry=localStorage.getItem('ec_fc')||'all';
let filterImpact=parseInt(localStorage.getItem('ec_fi')||'0');

function getPredefinedEvents(){
  const now=new Date();
  const y=now.getFullYear(),m=now.getMonth();
  const events=[];
  const templates=[
    {name:'中国CPI同比',country:'CN',impact:3,time:'09:30'},
    {name:'中国PPI同比',country:'CN',impact:2,time:'09:30'},
    {name:'中国制造业PMI',country:'CN',impact:3,time:'09:00'},
    {name:'中国社会融资规模',country:'CN',impact:2,time:'10:00'},
    {name:'中国进出口数据',country:'CN',impact:2,time:'10:00'},
    {name:'中国GDP同比',country:'CN',impact:3,time:'10:00'},
    {name:'美联储利率决议',country:'US',impact:3,time:'02:00'},
    {name:'美国非农就业',country:'US',impact:3,time:'20:30'},
    {name:'美国CPI同比',country:'US',impact:3,time:'20:30'},
    {name:'美国初请失业金',country:'US',impact:2,time:'20:30'},
    {name:'美国零售销售',country:'US',impact:2,time:'20:30'},
    {name:'美国GDP初值',country:'US',impact:3,time:'20:30'},
    {name:'欧元区CPI终值',country:'EU',impact:2,time:'17:00'},
    {name:'欧央行利率决议',country:'EU',impact:3,time:'19:15'},
    {name:'欧元区制造业PMI',country:'EU',impact:2,time:'16:00'},
    {name:'日本央行利率决议',country:'JP',impact:3,time:'11:00'},
    {name:'日本CPI',country:'JP',impact:2,time:'07:30'},
    {name:'英国央行利率决议',country:'UK',impact:3,time:'19:00'},
    {name:'英国CPI',country:'UK',impact:2,time:'14:00'}
  ];
  for(let i=0;i<30;i++){
    const d=new Date(y,m,now.getDate()+i-5);
    const ds=d.toISOString().slice(0,10);
    const dow=d.getDay();
    if(dow===0||dow===6)continue;
    templates.forEach(t=>{
      if(Math.random()>0.6)return;
      const prev=d.toISOString().slice(0,10);
      events.push({id:'p_'+ds+'_'+t.name.replace(/\s/g,''),name:t.name,country:t.country,impact:t.impact,time:t.time,date:ds,prev:'—',forecast:'—',actual:Math.random()>0.5?(Math.random()*5-1).toFixed(1)+'%':'—'});
    });
  }
  return events.sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));
}

function getAllEvents(){
  const predefined=getPredefinedEvents();
  return [...predefined,...customEvents].sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));
}

function filterEvents(events){
  let filtered=events;
  if(filterCountry!=='all')filtered=filtered.filter(e=>e.country===filterCountry);
  if(filterImpact>0)filtered=filtered.filter(e=>e.impact===filterImpact);
  return filtered;
}

function showAddModal(){
  const overlay=document.createElement('div');overlay.className='modal-overlay';
  const countryOpts=Object.entries(COUNTRIES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  overlay.innerHTML=`<div class="modal"><h3 style="margin-bottom:16px">添加自定义事件</h3>
    <label>事件名称</label><input id="m_name" placeholder="如：央行会议">
    <label>国家/地区</label><select id="m_country">${countryOpts}</select>
    <label>日期</label><input id="m_date" type="date" value="${new Date().toISOString().slice(0,10)}">
    <label>时间</label><input id="m_time" type="time" value="09:00">
    <label>重要性</label><select id="m_impact"><option value="3">高</option><option value="2" selected>中</option><option value="1">低</option></select>
    <label>前值</label><input id="m_prev" placeholder="可选">
    <label>预测值</label><input id="m_forecast" placeholder="可选">
    <label>备注</label><textarea id="m_note" placeholder="可选"></textarea>
    <div class="flex" style="margin-top:16px"><button class="btn" onclick="saveEvent()">保存</button><button class="btn btn-danger" onclick="this.closest('.modal-overlay').remove()">取消</button></div></div>`;
  document.body.appendChild(overlay);
}

function saveEvent(){
  const name=document.getElementById('m_name').value.trim();
  const country=document.getElementById('m_country').value;
  const date=document.getElementById('m_date').value;
  const time=document.getElementById('m_time').value;
  const impact=parseInt(document.getElementById('m_impact').value);
  const prev=document.getElementById('m_prev').value.trim()||'—';
  const forecast=document.getElementById('m_forecast').value.trim()||'—';
  const note=document.getElementById('m_note').value.trim();
  if(!name||!date)return;
  customEvents.push({id:'c_'+Date.now().toString(36),name,country,impact,time,date,prev,forecast,actual:'—',note,custom:true});
  localStorage.setItem('ec_custom',JSON.stringify(customEvents));
  document.querySelector('.modal-overlay').remove();
  render();
}

function deleteEvent(id){
  customEvents=customEvents.filter(e=>e.id!==id);
  localStorage.setItem('ec_custom',JSON.stringify(customEvents));
  render();
}

function setFilter(type,val){
  if(type==='country'){filterCountry=val;localStorage.setItem('ec_fc',val)}
  if(type==='impact'){filterImpact=parseInt(val);localStorage.setItem('ec_fi',val)}
  render();
}

function render(){
  const allEvents=getAllEvents();
  const filtered=filterEvents(allEvents);
  const today=new Date().toISOString().slice(0,10);

  let h=`<h1>📅 经济日历</h1><p class="subtitle">全球经济事件和数据发布日程</p>`;

  const upcoming=filtered.filter(e=>e.date>=today).slice(0,5);
  h+=`<div class="card"><h3 style="margin-bottom:12px">即将到来的事件</h3>`;
  if(upcoming.length===0)h+=`<div class="empty">暂无即将到来的事件</div>`;
  else{
    h+=`<table class="table"><thead><tr><th>日期</th><th>时间</th><th>国家</th><th>事件</th><th>重要性</th></tr></thead><tbody>`;
    upcoming.forEach(e=>{
      h+=`<tr><td>${e.date}</td><td>${e.time}</td><td>${COUNTRIES[e.country]||e.country}</td><td>${e.name}</td><td><span class="badge ${IMPACT_CLASS[e.impact]}"><span class="dot ${IMPACT_DOT[e.impact]}"></span> ${IMPACT[e.impact]}</span></td></tr>`;
    });
    h+=`</tbody></table>`;
  }
  h+=`</div>`;

  h+=`<div class="card"><div class="flex-between" style="margin-bottom:12px"><span style="font-weight:700">全部事件</span><button class="btn btn-sm" onclick="showAddModal()">+ 添加事件</button></div>`;
  const countryOpts=`<option value="all">全部国家</option>`+Object.entries(COUNTRIES).map(([k,v])=>`<option value="${k}" ${filterCountry===k?'selected':''}>${v}</option>`).join('');
  h+=`<div class="flex" style="margin-bottom:12px">`;
  h+=`<select style="width:auto;margin-bottom:0" onchange="setFilter('country',this.value)">${countryOpts}</select>`;
  h+=`<select style="width:auto;margin-bottom:0" onchange="setFilter('impact',this.value)"><option value="0" ${filterImpact===0?'selected':''}>全部重要性</option><option value="3" ${filterImpact===3?'selected':''}>高</option><option value="2" ${filterImpact===2?'selected':''}>中</option><option value="1" ${filterImpact===1?'selected':''}>低</option></select>`;
  h+=`<span style="color:var(--text2);font-size:.85rem">共 ${filtered.length} 条</span>`;
  h+=`</div>`;

  if(filtered.length===0)h+=`<div class="empty">暂无匹配事件</div>`;
  else{
    let lastDate='';
    h+=`<table class="table"><thead><tr><th>时间</th><th>国家</th><th>事件</th><th>重要性</th><th>前值</th><th>预测</th><th>实际</th><th></th></tr></thead><tbody>`;
    filtered.forEach(e=>{
      if(e.date!==lastDate){
        h+=`<tr><td colspan="8" style="font-weight:700;color:var(--accent);padding-top:16px">${e.date} ${e.date===today?'(今天)':''}</td></tr>`;
        lastDate=e.date;
      }
      h+=`<tr><td>${e.time}</td><td>${COUNTRIES[e.country]||e.country}</td><td>${e.name}</td><td><span class="badge ${IMPACT_CLASS[e.impact]}"><span class="dot ${IMPACT_DOT[e.impact]}"></span> ${IMPACT[e.impact]}</span></td><td>${e.prev}</td><td>${e.forecast}</td><td style="font-weight:700">${e.actual}</td><td>${e.custom?`<button class="btn btn-sm btn-danger" onclick="deleteEvent('${e.id}')">删除</button>`:''}</td></tr>`;
    });
    h+=`</tbody></table>`;
  }
  h+=`</div>`;

  APP.innerHTML=h;
}

render();
</script>
</body>
</html>
