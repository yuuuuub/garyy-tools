<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字用法</title><meta name="description" content="汉字用法 - 在线查询汉字用法"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.character-display{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0}.character-main{font-size:6rem;font-weight:700;color:var(--blue)}.usage-list{margin-top:16px}.usage-item{padding:12px;background:var(--bg);border-radius:8px;margin-bottom:8px}.usage-type{font-size:.85rem;color:var(--green);margin-bottom:4px;font-weight:600}.usage-text{font-size:.9rem;color:var(--text);line-height:1.6}.usage-example{font-size:.85rem;color:var(--text2);margin-top:4px;font-style:italic}</style><meta property="og:title" content="汉字用法"><meta property="og:description" content="汉字用法 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div class="container"><h1>📝 汉字用法</h1><p class="sub">在线查询汉字用法</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" oninput="getUsage()">
</div>
<button class="btn" onclick="getUsage()">查询</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var usageData={
  '中':{usages:[{type:'名词用法',text:'表示中间、中心的位置',example:'中国、中央、中间'},{type:'动词用法',text:'表示击中、命中',example:'中奖、中靶、中选'},{type:'形容词用法',text:'表示中等的、普通的',example:'中等、中庸、中流'},{type:'成语用法',text:'包含"中"的成语',example:'中流砥柱、古今中外、外强中干'}],collocations:['中心','中间','中央','中国','中午','中学','中午','中年','心中','手中']},
  '国':{usages:[{type:'名词用法',text:'表示国家、国土',example:'中国、国家、国土'},{type:'名词用法',text:'表示国都、京城',example:'国人、国门'}],collocations:['国家','中国','国际','国旗','国土','国宝','国王','国外','国内','国宝']},
  '人':{usages:[{type:'名词用法',text:'表示人类、人们',example:'人们、人类、人生'},{type:'名词用法',text:'表示别人、他人',example:'人称、人品、人格'},{type:'量词用法',text:'用于人',example:'一家人、三个人'}],collocations:['人们','人类','人生','人家','人员','人才','人民','人格','人品','人生']},
  '大':{usages:[{type:'形容词用法',text:'表示大的、巨大的',example:'大小、大人、大学'},{type:'副词用法',text:'表示很、非常',example:'大约、大概、大事'},{type:'名词用法',text:'表示长大、年长',example:'老大、大嫂'}],collocations:['大家','大人','大学','大小','大概','大家','大约','大哥','大姐','大爷']},
  '小':{usages:[{type:'形容词用法',text:'表示小的、微小',example:'大小、小孩、小学'},{type:'副词用法',text:'表示稍微',example:'小看、小心、小跑'},{type:'名词用法',text:'表示小的方面',example:'大小、小节'}],collocations:['小孩','小学','小心','大小','小姐','小朋友','小时','小心','小说','小心']},
  '天':{usages:[{type:'名词用法',text:'表示天空',example:'天上、天空、天国'},{type:'名词用法',text:'表示一天、白天',example:'今天、明天、天黑'},{type:'形容词用法',text:'表示天然的',example:'天赋、天才、天性'}],collocations:['今天','明天','天气','天空','天天','天生','天才','天赋','天下','白天']},
  '地':{usages:[{type:'名词用法',text:'表示地面、土地',example:'土地、地球、地方'},{type:'助词用法',text:'状语标志',example:'慢慢地、轻轻地'}],collocations:['地方','地球','地面','土地','土地','地上','地下','大地','天地','外地']},
  '年':{usages:[{type:'名词用法',text:'表示年份、年龄',example:'今年、明年、年代'},{type:'量词用法',text:'用于年',example:'一年、三年、年轻'}],collocations:['今年','明年','去年','年轻','年龄','年代','年份','过年','新年','少年']},
  '月':{usages:[{type:'名词用法',text:'表示月亮、月份',example:'月亮、月光、月薪'},{type:'量词用法',text:'用于月',example:'一个月、两个月'}],collocations:['月亮','月光','月份','月薪','月饼','月球','岁月','日月','明月','半月']},
  '日':{usages:[{type:'名词用法',text:'表示太阳、日子',example:'日出、日期、日记'},{type:'量词用法',text:'用于天',example:'一日、三日、日历'}],collocations:['日记','日期','日历','日出','日落','每天','日子','今日','昨日','明日']},
  '水':{usages:[{type:'名词用法',text:'表示水、液体',example:'河水、水果、水平'},{type:'量词用法',text:'用于水',example:'一水、两水'}],collocations:['水果','水平','河水','海水','雨水','开水','水果','水面','水平','水杯']},
  '火':{usages:[{type:'名词用法',text:'表示火、火焰',example:'火灾、火车、火柴'},{type:'形容词用法',text:'表示紧急的',example:'火速、火急、火暴'}],collocations:['火车','火灾','火柴','火山','火焰','火速','火箭','火气','发火','上火']},
  '木':{usages:[{type:'名词用法',text:'表示木头、树木',example:'树木、木头、木材'},{type:'形容词用法',text:'表示木制的',example:'木桌、木椅、木门'}],collocations:['木头','木材','树木','木桌','木椅','木门','木工','木料','木板','木屋']},
  '金':{usages:[{type:'名词用法',text:'表示金属、黄金',example:'黄金、金钱、金融'},{type:'形容词用法',text:'表示金色的',example:'金色、金黄'}],collocations:['黄金','金钱','金融','金色','金黄','金子','金牌','金库','金币','金条']},
  '土':{usages:[{type:'名词用法',text:'表示土壤、土地',example:'土地、国土、土质'},{type:'形容词用法',text:'表示本地的',example:'土产、土话、土著'}],collocations:['土地','国土','土质','土产','土话','土著','土壤','土豆','土方','土木']},
  '山':{usages:[{type:'名词用法',text:'表示山、山脉',example:'高山、山峰、山林'},{type:'量词用法',text:'用于山',example:'一座山、两座山'}],collocations:['高山','山峰','山林','山水','山区','山地','山上','山下','山脚','山腰']},
  '石':{usages:[{type:'名词用法',text:'表示石头、岩石',example:'石头、石块、石碑'},{type:'量词用法',text:'用于石头',example:'一石、两石'}],collocations:['石头','石块','石碑','石狮','石桥','石壁','石窟','石器','石料','石雕']},
  '心':{usages:[{type:'名词用法',text:'表示心脏、心思',example:'心情、心理、心意'},{type:'名词用法',text:'表示中心、中央',example:'中心、核心、重心'}],collocations:['心情','心理','心意','心脏','中心','核心','重心','心灵','心态','心愿']},
  '手':{usages:[{type:'名词用法',text:'表示手、手掌',example:'手指、手表、手段'},{type:'量词用法',text:'用于手',example:'一手、两手'}],collocations:['手指','手表','手段','手艺','手工','手机','手册','手稿','手巾','手套']},
  '目':{usages:[{type:'名词用法',text:'表示眼睛、目光',example:'目光、目标、目前'},{type:'动词用法',text:'表示看、注视',example:'目送、目击'}],collocations:['目光','目标','目前','目录','目的','目击','目睹','目前','面目','眉目']},
  '口':{usages:[{type:'名词用法',text:'表示嘴、口',example:'门口、出口、人口'},{type:'量词用法',text:'用于口',example:'一口、两口'}],collocations:['门口','出口','人口','口才','口味','口罩','口水','口音','口红','口号']}
};
function getUsage(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var data=usageData[char];
  if(!data){
    data={usages:[{type:'暂无',text:'暂无详细用法',example:'暂无例句'}],collocations:['暂无']};
  }
  var html='<div class="card">';
  html+='<div class="character-display">';
  html+='<div class="character-main">'+char+'</div>';
  html+='</div>';
  html+='<div class="section"><h3>用法</h3>';
  html+='<div class="usage-list">';
  data.usages.forEach(function(usage){
    html+='<div class="usage-item">';
    html+='<div class="usage-type">'+usage.type+'</div>';
    html+='<div class="usage-text">'+usage.text+'</div>';
    html+='<div class="usage-example">例：'+usage.example+'</div>';
    html+='</div>';
  });
  html+='</div></div>';
  html+='<div class="section"><h3>常用搭配</h3>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div style="display:flex;flex-wrap:wrap;gap:8px">';
  data.collocations.forEach(function(word){
    html+='<span style="padding:4px 8px;background:var(--border);border-radius:4px;font-size:.85rem">'+word+'</span>';
  });
  html+='</div></div></div>';
  html+='</div>';
  r.innerHTML=html;
}
function randomCharacter(){
  var chars=Object.keys(usageData);
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  getUsage();
}
getUsage();
</script></body></html>
