<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 OKR追踪器</title>
<meta name="description" content="OKR目标管理工具，设定目标和关键结果，追踪完成进度">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a855f7;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700;--purple:#7c3aed}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.9}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
input[type=text]{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;margin-bottom:8px}
input:focus{outline:none;border-color:var(--accent)}
textarea{width:100%;min-height:60px;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;font-family:inherit;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
.okr-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
.okr-block .obj-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.okr-block .obj-title input{font-size:1rem;font-weight:600;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);width:70%}
.kr-item{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:8px;background:var(--card);border:1px solid var(--border);border-radius:6px}
.kr-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--green)}
.kr-item input[type=text]{flex:1;margin:0;background:transparent;border:none;border-bottom:1px solid var(--border);padding:4px 0}
.kr-item input[type=range]{width:120px;accent-color:var(--accent)}
.kr-item .kr-val{font-size:.85rem;font-weight:600;min-width:40px;text-align:center}
.kr-item .kr-val.high{color:var(--green)}
.kr-item .kr-val.mid{color:var(--yellow)}
.kr-item .kr-val.low{color:var(--red)}
.obj-progress{margin-top:8px}
.obj-progress .bar{width:100%;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.obj-progress .fill{height:100%;border-radius:4px;transition:width .3s}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.summary-stat{text-align:center;padding:14px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.summary-stat .num{font-size:1.5rem;font-weight:700}
.summary-stat .lbl{font-size:.75rem;color:var(--text2);margin-top:2px}
.quarter-tabs{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.qtab{padding:6px 16px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:.85rem;transition:all .2s}
.qtab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.color-dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px}
.hidden{display:none}
@media(max-width:600px){.summary-grid{grid-template-columns:repeat(2,1fr)}body{padding:10px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🎯 OKR追踪器">
<meta property="og:description" content="OKR目标管理工具，设定目标和关键结果，追踪完成进度">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='okr_tracker';
let state=JSON.parse(localStorage.getItem(STORE)||'null')||{
  quarters:['Q1 2025','Q2 2025'],
  currentQ:'Q2 2025',
  okrs:{}
};
if(!state.okrs[state.currentQ])state.okrs[state.currentQ]=[];
function getOKRs(){return state.okrs[state.currentQ]||[]}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function addObjective(){const okrs=getOKRs();okrs.push({id:Date.now(),title:'',color:['#3b82f6','#8b5cf6','#f59e0b','#22c55e','#ef4444'][okrs.length%5],krs:[{text:'',done:false,progress:0}]});save();render()}
function removeObjective(i){getOKRs().splice(i,1);save();render()}
function addObjectiveKR(i){getOKRs()[i].krs.push({text:'',done:false,progress:0});save();render()}
function removeObjectiveKR(oi,ki){getOKRs()[oi].krs.splice(ki,1);save();render()}
function getObjProgress(okr){if(!okr.krs.length)return 0;return Math.round(okr.krs.reduce((s,k)=>s+k.progress,0)/okr.krs.length)}
function getTotalProgress(){const okrs=getOKRs();if(!okrs.length)return 0;return Math.round(okrs.reduce((s,o)=>s+getObjProgress(o),0)/okrs.length)}
function getCompletedKR(){return getOKRs().reduce((s,o)=>s+o.krs.filter(k=>k.progress>=100).length,0)}
function getTotalKR(){return getOKRs().reduce((s,o)=>s+o.krs.length,0)}
function addQuarter(){const name=prompt('输入季度名称 (如 Q3 2025):');if(name&&name.trim()){state.quarters.push(name.trim());save();render()}}
function exportOKR(){let txt=`OKR报告 - ${state.currentQ}\n`+'='.repeat(40)+'\n\n';getOKRs().forEach((o,i)=>{txt+=`目标${i+1}: ${o.title||'未命名'} (${getObjProgress(o)}%)\n`;o.krs.forEach(k=>{txt+=`  ${k.done?'✓':'○'} ${k.text||'未命名'} - ${k.progress}%\n`});txt+='\n'});const blob=new Blob([txt],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`OKR_${state.currentQ}.txt`;a.click()}
function render(){
  const okrs=getOKRs();
  const totalP=getTotalProgress();
  const compKR=getCompletedKR();
  let h=`<div class="hdr"><h1>🎯 OKR追踪器</h1><p>目标与关键结果管理</p></div>`;
  h+=`<div class="cd"><div class="quarter-tabs">`;
  state.quarters.forEach(q=>{h+=`<div class="qtab${state.currentQ===q?' active':''}" onclick="state.currentQ='${q}';save();render()">${q}</div>`});
  h+=`<div class="qtab" onclick="addQuarter()">+</div></div>`;
  h+=`<div class="summary-grid"><div class="summary-stat"><div class="num" style="color:var(--accent)">${okrs.length}</div><div class="lbl">目标数</div></div>`;
  h+=`<div class="summary-stat"><div class="num" style="color:var(--yellow)">${compKR}/${getTotalKR()}</div><div class="lbl">关键结果</div></div>`;
  h+=`<div class="summary-stat"><div class="num" style="color:${totalP>=70?'var(--green)':totalP>=40?'var(--yellow)':'var(--red)'}">${totalP}%</div><div class="lbl">总进度</div></div>`;
  h+=`<div class="summary-stat"><div class="num" style="color:var(--green)">${Math.round(compKR/Math.max(1,getTotalKR())*100)}%</div><div class="lbl">完成率</div></div></div></div>`;
  h+=`<div class="cd"><h2>🎯 目标管理 <button class="sec" style="font-size:.75rem;padding:3px 10px;margin-left:6px" onclick="addObjective()">+ 新目标</button><button class="sec" style="font-size:.75rem;padding:3px 10px;margin-left:4px" onclick="exportOKR()">导出</button></h2>`;
  okrs.forEach((o,i)=>{const op=getObjProgress(o);const opColor=op>=70?'var(--green)':op>=40?'var(--yellow)':'var(--red)';
    h+=`<div class="okr-block"><div class="obj-title"><span><span class="color-dot" style="background:${o.color}"></span><input value="${o.title}" onchange="getOKRs()[${i}].title=this.value;save()" placeholder="输入目标...">`;
    h+=`</span><span style="display:flex;gap:4px"><span class="kr-val" style="font-size:1rem">${op}%</span><button class="sec dng" style="padding:2px 8px;font-size:.75rem" onclick="removeObjective(${i})">✕</button></span></div>`;
    h+=`<div class="obj-progress"><div class="bar"><div class="fill" style="width:${op}%;background:${opColor}"></div></div></div>`;
    o.krs.forEach((k,ki)=>{h+=`<div class="kr-item"><input type="checkbox"${k.done?' checked':''} onchange="const k=getOKRs()[${i}].krs[${ki}];k.done=this.checked;if(this.checked)k.progress=100;else k.progress=0;save();render()">`;
      h+=`<input type="text" value="${k.text}" onchange="getOKRs()[${i}].krs[${ki}].text=this.value;save()" placeholder="关键结果...">`;
      h+=`<input type="range" min="0" max="100" value="${k.progress}" oninput="getOKRs()[${i}].krs[${ki}].progress=+this.value;this.nextElementSibling.textContent=this.value+'%';this.nextElementSibling.className='kr-val '+(+this.value>=70?'high':+this.value>=40?'mid':'low');const bars=this.closest('.okr-block').querySelector('.fill');const krs=getOKRs()[${i}].krs;bars.style.width=Math.round(krs.reduce((s,k)=>s+k.progress,0)/krs.length)+'%'">`;
      h+=`<span class="kr-val ${k.progress>=70?'high':k.progress>=40?'mid':'low'}">${k.progress}%</span>`;
      h+=`<button class="sec" style="padding:2px 6px;font-size:.75rem" onclick="removeObjectiveKR(${i},${ki})">✕</button></div>`});
    h+=`<button class="sec" style="font-size:.8rem;padding:4px 12px;margin-top:8px" onclick="addObjectiveKR(${i})">+ 关键结果</button></div>`});
  h+=`</div>`;
  $('app').innerHTML=h;
}
render();
</script>
</body>
</html>
