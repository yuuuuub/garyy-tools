<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎮 2048</title>
  <meta name="description" content="2048数字合并游戏，滑动方块合成更大的数字">
  <style>
:root {--bg: #faf8ef;
--text: #776e65;
--board-bg: #bbada0;
--cell-bg: #cdc1b4;
--cell-text: #776e65;
--score-bg: #bbada0;
--btn-bg: #8f7a66;
--btn-text: #f9f6f2;
--game-over-overlay: rgba(238,228,218,0.73)}
[data-theme="dark"] {--bg: #1a1a2e;
--text: #e0e0e0;
--board-bg: #16213e;
--cell-bg: #0f3460;
--cell-text: #e0e0e0;
--score-bg: #16213e;
--btn-bg: #533483;
--btn-text: #e0e0e0;
--game-over-overlay: rgba(26,26,46,0.85)}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
background: var(--bg);
color: var(--text);
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
transition: background 0.3s, color 0.3s;
-webkit-tap-highlight-color: transparent;
user-select: none}
.container {width: 100%;
max-width: 500px;
padding: 16px}
.header {display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 12px}
.title {font-size: 2.5rem;
font-weight: 800;
line-height: 1}
.header-actions {display: flex;
gap: 8px}
.header-actions button {padding: 8px 14px;
font-size: 0.85rem;
font-weight: 600;
border: none;
border-radius: 8px;
cursor: pointer;
background: var(--btn-bg);
color: var(--btn-text);
transition: opacity 0.15s}
.header-actions button:active { opacity: 0.7; }
.scores {display: flex;
justify-content: center;
gap: 16px;
margin-bottom: 16px}
.score-box {background: var(--score-bg);
color: #fff;
border-radius: 8px;
padding: 8px 20px;
text-align: center;
min-width: 90px}
.score-label {font-size: 0.7rem;
text-transform: uppercase;
letter-spacing: 1px;
opacity: 0.85}
.score-value {font-size: 1.4rem;
font-weight: 700}
.board {position: relative;
background: var(--board-bg);
border-radius: 12px;
padding: 12px;
display: grid;
grid-template-columns: repeat(4, 1fr);
grid-template-rows: repeat(4, 1fr);
gap: 12px;
aspect-ratio: 1;
width: 100%;
touch-action: none}
.game-over-overlay {display: none;
position: absolute;
inset: 0;
background: var(--game-over-overlay);
border-radius: 12px;
flex-direction: column;
justify-content: center;
align-items: center;
z-index: 10;
font-size: 2rem;
font-weight: 800}
.game-over-overlay.active { display: flex; }
.game-over-overlay button {margin-top: 16px;
padding: 12px 28px;
font-size: 1rem;
font-weight: 700;
border: none;
border-radius: 8px;
cursor: pointer;
background: var(--btn-bg);
color: var(--btn-text)}
.cell {background: var(--cell-bg);
border-radius: 8px;
display: flex;
justify-content: center;
align-items: center;
font-weight: 800;
font-size: 1.8rem;
position: relative;
transition: transform 0.12s ease-in-out}
.tile {position: absolute;
inset: 12px;
border-radius: 8px;
display: flex;
justify-content: center;
align-items: center;
font-weight: 800;
z-index: 5;
transition: transform 0.12s ease-in-out}
.tile-2     { background: #eee4da; color: #776e65; }
.tile-4     { background: #ede0c8; color: #776e65; }
.tile-8     { background: #f2b179; color: #f9f6f2; }
.tile-16    { background: #f59563; color: #f9f6f2; }
.tile-32    { background: #f67c5f; color: #f9f6f2; }
.tile-64    { background: #f65e3b; color: #f9f6f2; }
.tile-128   { background: #edcf72; color: #f9f6f2; font-size: 1.5rem; }
.tile-256   { background: #edcc61; color: #f9f6f2; font-size: 1.5rem; }
.tile-512   { background: #edc850; color: #f9f6f2; font-size: 1.5rem; }
.tile-1024  { background: #edc53f; color: #f9f6f2; font-size: 1.2rem; }
.tile-2048  { background: #edc22e; color: #f9f6f2; font-size: 1.2rem; }
.tile-4096  { background: #3c3a32; color: #f9f6f2; font-size: 1.1rem; }
.tile-8192  { background: #3c3a32; color: #f9f6f2; font-size: 1.1rem; }
.tile-new {animation: pop 0.18s ease-in-out}
.tile-merge {animation: mergePop 0.2s ease-in-out}
@keyframes pop {0%   { transform: scale(0); }
70%  { transform: scale(1.1); }
100% { transform: scale(1); }}
@keyframes mergePop {0%   { transform: scale(1); }
40%  { transform: scale(1.25); }
100% { transform: scale(1); }}
.instruction {text-align: center;
margin-top: 12px;
font-size: 0.8rem;
opacity: 0.6}
@media (max-width: 400px) {.title { font-size: 2rem; }
.tile { font-size: 1.4rem; }
.tile-128, .tile-256, .tile-512 { font-size: 1.2rem; }
.tile-1024, .tile-2048 { font-size: 1rem; }
.tile-4096, .tile-8192 { font-size: 0.9rem; }}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🎮 2048">
  <meta property="og:description" content="2048数字合并游戏，滑动方块合成更大的数字">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/game-2048/">
</head>
<body>
  <div class="container">
    <!-- 头部 -->
    <div class="header">
      <div class="title">🎮 2048</div>
      <div class="header-actions">
        <button id="themeBtn" title="切换暗色模式">🌙</button>
        <button id="newGameBtn">新游戏</button>
        <button id="undoBtn" title="撤销一步">↩</button>
      </div>
    </div>

    <!-- 得分 -->
    <div class="scores">
      <div class="score-box">
        <div class="score-label">分数</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">最高分</div>
        <div class="score-value" id="bestScore">0</div>
      </div>
    </div>

    <!-- 游戏棋盘 -->
    <div class="board" id="board">
      <div class="game-over-overlay" id="gameOverOverlay">
        <span id="gameOverText">游戏结束!</span>
        <button onclick="newGame()">再来一局</button>
      </div>
      <!-- 4x4 = 16 个背景格 -->
    </div>
    <div class="instruction">方向键 / 滑动操作 &nbsp;|&nbsp; 合并数字到达 2048!</div>
  </div>

  <script>
    (function() {
      const SIZE = 4;
      const WIN_VALUE = 2048;

      // DOM
      const boardEl = document.getElementById('board');
      const scoreEl = document.getElementById('score');
      const bestScoreEl = document.getElementById('bestScore');
      const overlayEl = document.getElementById('gameOverOverlay');
      const gameOverTextEl = document.getElementById('gameOverText');
      const themeBtn = document.getElementById('themeBtn');
      const undoBtn = document.getElementById('undoBtn');

      // 状态
      let grid = [];
      let score = 0;
      let bestScore = 0;
      let gameOver = false;
      let won = false;
      let history = []; // 撤销历史

      // 主题
      const html = document.documentElement;
      const savedTheme = localStorage.getItem('2048-theme') || 'light';
      html.setAttribute('data-theme', savedTheme);
      themeBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

      themeBtn.addEventListener('click', () => {
        const current = html.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
        localStorage.setItem('2048-theme', next);
      });

      // 构建 DOM
      function buildBoard() {
        boardEl.querySelectorAll('.cell').forEach(c => c.remove());
        for (let i = 0; i < SIZE * SIZE; i++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.index = i;
          boardEl.appendChild(cell);
        }
      }

      // 渲染
      function render() {
        // 清除旧 tile
        boardEl.querySelectorAll('.tile').forEach(t => t.remove());

        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const val = grid[r][c];
            if (val === 0) continue;

            const tile = document.createElement('div');
            tile.className = `tile tile-${val}`;
            if (val <= 2048) {
              tile.classList.add('tile-new');
            }
            tile.textContent = val;

            // 计算像素位置
            const gap = 12;
            const boardRect = boardEl.getBoundingClientRect();
            const cellW = (boardRect.width - gap * 5) / 4;
            const left = gap + c * (cellW + gap);
            const top = gap + r * (cellW + gap);
            tile.style.width = cellW + 'px';
            tile.style.height = cellW + 'px';
            tile.style.left = left + 'px';
            tile.style.top = top + 'px';

            boardEl.appendChild(tile);
          }
        }

        scoreEl.textContent = score;
        bestScoreEl.textContent = bestScore;
      }

      // 保存历史
      function saveState() {
        if (history.length > 20) history.shift();
        history.push({
          grid: grid.map(row => [...row]),
          score: score
        });
      }

      // 撤销
      function undo() {
        if (gameOver || history.length === 0) return;
        const prev = history.pop();
        grid = prev.grid;
        score = prev.score;
        render();
      }

      // 随机生成
      function addRandomTile() {
        const empty = [];
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] === 0) empty.push({ r, c });
          }
        }
        if (empty.length === 0) return;
        const { r, c } = empty[Math.floor(Math.random() * empty.length)];
        grid[r][c] = Math.random() < 0.9 ? 2 : 4;
      }

      // 初始化
      function init() {
        grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
        score = 0;
        gameOver = false;
        won = false;
        history = [];
        overlayEl.classList.remove('active');
        bestScore = parseInt(localStorage.getItem('2048-best') || '0', 10);
        bestScoreEl.textContent = bestScore;

        addRandomTile();
        addRandomTile();
        render();
      }

      // 新游戏
      window.newGame = function() {
        init();
      };

      // 检查游戏状态
      function checkState() {
        // 胜利
        if (!won) {
          for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
              if (grid[r][c] >= WIN_VALUE) {
                won = true;
                gameOverTextEl.textContent = '🎉 你赢了！';
                overlayEl.classList.add('active');
                return;
              }
            }
          }
        }

        // 还有空格
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] === 0) return;
          }
        }

        // 还能合并
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE - 1; c++) {
            if (grid[r][c] === grid[r][c+1]) return;
          }
        }
        for (let r = 0; r < SIZE - 1; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] === grid[r+1][c]) return;
          }
        }

        // 游戏结束
        gameOver = true;
        gameOverTextEl.textContent = '游戏结束!';
        overlayEl.classList.add('active');
      }

      // 保存最高分
      function updateBestScore() {
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem('2048-best', bestScore);
        }
      }

      // 移动合并
      function slide(row) {
        // 去除零
        let arr = row.filter(v => v !== 0);
        // 合并
        for (let i = 0; i < arr.length - 1; i++) {
          if (arr[i] === arr[i+1]) {
            arr[i] *= 2;
            score += arr[i];
            arr[i+1] = 0;
          }
        }
        arr = arr.filter(v => v !== 0);
        while (arr.length < SIZE) arr.push(0);
        return arr;
      }

      function move(direction) {
        if (gameOver) return;
        if (won) return; // 胜利后不能移动

        const oldGrid = grid.map(row => [...row]);
        const oldScore = score;

        if (direction === 'left') {
          for (let r = 0; r < SIZE; r++) {
            grid[r] = slide(grid[r]);
          }
        } else if (direction === 'right') {
          for (let r = 0; r < SIZE; r++) {
            grid[r] = slide([...grid[r]].reverse()).reverse();
          }
        } else if (direction === 'up') {
          for (let c = 0; c < SIZE; c++) {
            const col = grid.map(row => row[c]);
            const newCol = slide(col);
            for (let r = 0; r < SIZE; r++) {
              grid[r][c] = newCol[r];
            }
          }
        } else if (direction === 'down') {
          for (let c = 0; c < SIZE; c++) {
            const col = grid.map(row => row[c]).reverse();
            const newCol = slide(col).reverse();
            for (let r = 0; r < SIZE; r++) {
              grid[r][c] = newCol[r];
            }
          }
        }

        // 检查是否有变化
        let changed = false;
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] !== oldGrid[r][c]) {
              changed = true;
              break;
            }
          }
          if (changed) break;
        }

        if (!changed) return;

        saveState();
        addRandomTile();
        updateBestScore();
        render();
        checkState();
      }

      // 键盘
      document.addEventListener('keydown', e => {
        const keyMap = {
          ArrowLeft: 'left',
          ArrowRight: 'right',
          ArrowUp: 'up',
          ArrowDown: 'down',
          a: 'left',
          d: 'right',
          w: 'up',
          s: 'down',
        };
        const dir = keyMap[e.key];
        if (dir) {
          e.preventDefault();
          move(dir);
        }
        if (e.key === 'z' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          undo();
        }
      });

      // 触摸
      let touchStartX = 0, touchStartY = 0;
      document.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }, { passive: true });

      document.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        const absDx = Math.abs(dx);
        const absDy = Math.abs(dy);

        if (Math.max(absDx, absDy) < 30) return; // 阈值

        if (absDx > absDy) {
          move(dx > 0 ? 'right' : 'left');
        } else {
          move(dy > 0 ? 'down' : 'up');
        }
      });

      // 按钮
      document.getElementById('newGameBtn').addEventListener('click', newGame);
      undoBtn.addEventListener('click', undo);

      // 窗口大小改变时重新渲染
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(render, 100);
      });

      // 启动
      buildBoard();
      init();
    })();
  </script>
<script src="../i18n.js" defer></script>
</body>
</html>
