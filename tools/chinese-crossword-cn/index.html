<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中文填字游戏</title><meta name="description" content="中文填字游戏 - 经典成语填字、汉字填字挑战"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#d29922;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin:4px}.btn:hover{opacity:.85}.btn-group{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}.crossword-grid{display:inline-grid;gap:2px;margin:16px auto;background:var(--border);padding:2px;border-radius:8px}.cell{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;border-radius:4px;cursor:pointer;transition:all .15s;position:relative}.cell.black{background:#21262d;cursor:default}.cell.active{background:rgba(59,130,246,.3);border:2px solid var(--blue)}.cell.correct{background:rgba(35,134,54,.3)}.cell input{width:100%;height:100%;text-align:center;border:none;background:transparent;color:var(--text);font-size:1.2rem;font-weight:700;outline:none;text-transform:uppercase}.clues-panel{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.clue-section h3{font-size:.95rem;margin-bottom:8px;color:var(--blue)}.clue-item{padding:8px 12px;background:var(--bg);border-radius:6px;margin-bottom:6px;font-size:.85rem;cursor:pointer;transition:all .15s;border-left:3px solid transparent}.clue-item:hover{border-left-color:var(--blue)}.clue-item.active{border-left-color:var(--green);background:rgba(35,134,54,.1)}.clue-item.solved{opacity:.5;text-decoration:line-through}.stats{display:flex;gap:16px;justify-content:center;margin:12px 0}.stat{text-align:center}.stat .num{font-size:1.3rem;font-weight:700;color:var(--blue)}.stat .lbl{font-size:.7rem;color:var(--text2)}.difficulty-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:12px}.diff-tab{padding:6px 16px;background:var(--bg);border:1px solid var(--border);border-radius:20px;cursor:pointer;color:var(--text2);font-size:.85rem}.diff-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="中文填字游戏"><meta property="og:description" content="中文填字游戏 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔤</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔤 中文填字游戏</h1><p class="sub">经典成语填字、汉字填字挑战</p>
<div class="card">
<div class="difficulty-tabs">
<div class="diff-tab active" onclick="setDifficulty('easy',this)">简单 8×8</div>
<div class="diff-tab" onclick="setDifficulty('medium',this)">中等 10×10</div>
<div class="diff-tab" onclick="setDifficulty('hard',this)">困难 12×12</div>
</div>
<div class="btn-group">
<button class="btn" onclick="newPuzzle()">生成新题</button>
<button class="btn" onclick="checkAll()">检查答案</button>
<button class="btn" onclick="revealAll()">显示答案</button>
<button class="btn" onclick="clearGrid()">清空</button>
</div>
<div class="stats">
<div class="stat"><div class="num" id="solvedCount">0</div><div class="lbl">已解出</div></div>
<div class="stat"><div class="num" id="totalCount">0</div><div class="lbl">总题数</div></div>
<div class="stat"><div class="num" id="progress">0%</div><div class="lbl">完成度</div></div>
</div>
<div style="text-align:center;overflow-x:auto;padding:10px">
<div class="crossword-grid" id="grid"></div>
</div>
</div>
<div class="card">
<div class="clues-panel">
<div class="clue-section"><h3>横向</h3><div id="acrossClues"></div></div>
<div class="clue-section"><h3>纵向</h3><div id="downClues"></div></div>
</div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var puzzles={
easy:{size:8,clues:[
{word:'一马当先',clue:'形容领先或带头',row:0,col:0,dir:'across'},
{word:'画龙点睛',clue:'比喻关键处点明要旨',row:0,col:4,dir:'across'},
{word:'守株待兔',clue:'比喻不主动努力',row:2,col:0,dir:'across'},
{word:'掩耳盗铃',clue:'自欺欺人',row:2,col:4,dir:'across'},
{word:'一五一十',clue:'叙述有条理',row:4,col:0,dir:'across'},
{word:'对牛弹琴',clue:'白费口舌',row:4,col:4,dir:'across'},
{word:'叶公好龙',clue:'口是心非',row:6,col:0,dir:'across'},
{word:'亡羊补牢',clue:'事后补救',row:6,col:4,dir:'across'},
{word:'一守画掩',clue:'',row:0,col:0,dir:'down'},
{word:'马株耳亡',clue:'',row:0,col:1,dir:'down'},
{word:'当待盗羊',clue:'',row:0,col:2,dir:'down'},
{word:'先兔铃牢',clue:'',row:0,col:3,dir:'down'},
{word:'画一对叶',clue:'',row:0,col:4,dir:'down'},
{word:'龙牛好公',clue:'',row:0,col:5,dir:'down'},
{word:'点琴龙好',clue:'',row:0,col:6,dir:'down'},
{word:'睛弹爱龙',clue:'',row:0,col:7,dir:'down'}
]},
medium:{size:10,clues:[
{word:'一心一意',clue:'全心全意',row:0,col:0,dir:'across'},
{word:'三心二意',clue:'心意不专',row:0,col:5,dir:'across'},
{word:'四面八方',clue:'到处各方面',row:2,col:0,dir:'across'},
{word:'五湖四海',clue:'全国各地',row:2,col:5,dir:'across'},
{word:'七上八下',clue:'心里不安',row:4,col:0,dir:'across'},
{word:'九牛一毛',clue:'微不足道',row:4,col:5,dir:'across'},
{word:'十全十美',clue:'完美无缺',row:6,col:0,dir:'across'},
{word:'百发百中',clue:'每次都能命中',row:6,col:5,dir:'across'},
{word:'千军万马',clue:'声势浩大',row:8,col:0,dir:'across'},
{word:'万紫千红',clue:'百花齐放',row:8,col:5,dir:'across'}
]},
hard:{size:12,clues:[
{word:'铁杵磨针',clue:'只要有恒心，就能成功',row:0,col:0,dir:'across'},
{word:'水落石出',clue:'真相大白',row:0,col:5,dir:'across'},
{word:'杯弓蛇影',clue:'疑神疑鬼',row:2,col:0,dir:'across'},
{word:'鹤立鸡群',clue:'超群出众',row:2,col:5,dir:'across'},
{word:'井底之蛙',clue:'见识短浅',row:4,col:0,dir:'across'},
{word:'画蛇添足',clue:'多此一举',row:4,col:5,dir:'across'},
{word:'刻舟求剑',clue:'拘泥固执',row:6,col:0,dir:'across'},
{word:'狐假虎威',clue:'仗势欺人',row:6,col:5,dir:'across'},
{word:'盲人摸象',clue:'以偏概全',row:8,col:0,dir:'across'},
{word:'螳臂当车',clue:'不自量力',row:8,col:5,dir:'across'},
{word:'黔驴技穷',clue:'本领用完了',row:10,col:0,dir:'across'},
{word:'杞人忧天',clue:'不必要的忧虑',row:10,col:5,dir:'across'}
]}
};
var difficulty='easy',grid=[],solution=[],size=8,clues=[],solvedSet=new Set(),activeClue=null;
function setDifficulty(d,el){
difficulty=d;document.querySelectorAll('.diff-tab').forEach(function(t){t.classList.remove('active');});el.classList.add('active');
newPuzzle();
}
function newPuzzle(){
var p=puzzles[difficulty];size=p.size;clues=p.clues;
grid=[];solution=[];solvedSet=new Set();activeClue=null;
for(var r=0;r<size;r++){grid[r]=[];solution[r]=[];for(var c=0;c<size;c++){grid[r][c]='';solution[r][c]='BLACK';}}
clues.forEach(function(clue){
var word=clue.word;
for(var i=0;i<word.length;i++){
var r=clue.dir==='across'?clue.row:clue.row+i;
var c=clue.dir==='across'?clue.col+i:clue.col;
if(r<size&&c<size){solution[r][c]=word[i];}
}
});
renderGrid();renderClues();updateStats();
}
function renderGrid(){
var g=document.getElementById('grid');
g.style.gridTemplateColumns='repeat('+size+',44px)';
var html='';
for(var r=0;r<size;r++){
for(var c=0;c<size;c++){
var val=solution[r][c]==='BLACK'?'black':'';
html+='<div class="cell '+val+'" data-row="'+r+'" data-col="'+c+'" onclick="selectCell('+r+','+c+')">';
if(solution[r][c]!=='BLACK'){html+='<input maxlength="1" id="cell-'+r+'-'+c+'" oninput="handleInput('+r+','+c+',this)" onfocus="focusCell('+r+','+c+')">';}
html+='</div>';
}
}
g.innerHTML=html;
}
function selectCell(r,c){if(solution[r][c]==='BLACK')return;var inp=document.getElementById('cell-'+r+'-'+c);if(inp)inp.focus();}
function focusCell(r,c){
document.querySelectorAll('.cell.active').forEach(function(el){el.classList.remove('active');});
var clue=findClueAt(r,c);
if(clue){
activeClue=clue;highlightClue(clue);
for(var i=0;i<clue.word.length;i++){
var cr=clue.dir==='across'?clue.row:clue.row+i;
var cc=clue.dir==='across'?clue.col+i:clue.col;
var cell=document.querySelector('[data-row="'+cr+'"][data-col="'+cc+'"]');
if(cell)cell.classList.add('active');
}
}
}
function findClueAt(r,c){
for(var i=0;i<clues.length;i++){
var cl=clues[i];
for(var j=0;j<cl.word.length;j++){
var cr=cl.dir==='across'?cl.row:cl.row+j;
var cc=cl.dir==='across'?cl.col+j:cl.col;
if(cr===r&&cc===c)return cl;
}
}
return null;
}
function handleInput(r,c,inp){
var val=inp.value.toUpperCase();grid[r][c]=val;
var clue=findClueAt(r,c);
if(clue){
var allFilled=true;var allCorrect=true;
for(var i=0;i<clue.word.length;i++){
var cr=clue.dir==='across'?cl.row:cl.row+i;
var cc=clue.dir==='across'?cl.col+i:clue.col;
var cellInp=document.getElementById('cell-'+cr+'-'+cc);
if(!cellInp||!cellInp.value){allFilled=false;break;}
if(cellInp.value.toUpperCase()!==clue.word[i])allCorrect=false;
}
if(allFilled&&allCorrect){
solvedSet.add(clue.word);updateStats();markClueSolved(clue);
}
}
if(val){var nextC=c+1;while(nextC<size&&solution[r][nextC]==='BLACK')nextC++;if(nextC<size)selectCell(r,nextC);}
}
function highlightClue(clue){
document.querySelectorAll('.clue-item').forEach(function(el){el.classList.remove('active');});
var el=document.querySelector('[data-clue="'+clue.word+'"]');
if(el)el.classList.add('active');
}
function markClueSolved(clue){
var el=document.querySelector('[data-clue="'+clue.word+'"]');
if(el)el.classList.add('solved');
}
function renderClues(){
var acrossHtml='';var downHtml='';
var acIdx=1;var dnIdx=1;
clues.forEach(function(clue){
if(clue.dir==='across'){
acrossHtml+='<div class="clue-item" data-clue="'+clue.word+'" onclick="focusClue(\''+clue.word+'\')">'+acIdx+'. '+clue.clue+' ('+clue.word.length+'字)</div>';
acIdx++;
}else{
downHtml+='<div class="clue-item" data-clue="'+clue.word+'" onclick="focusClue(\''+clue.word+'\')">'+dnIdx+'. '+clue.clue+' ('+clue.word.length+'字)</div>';
dnIdx++;
}
});
document.getElementById('acrossClues').innerHTML=acrossHtml;
document.getElementById('downClues').innerHTML=downHtml;
}
function focusClue(word){
var clue=clues.find(function(c){return c.word===word;});
if(clue){focusCell(clue.row,clue.col);}
}
function checkAll(){
var correct=0;var total=0;
clues.forEach(function(clue){
var allCorrect=true;
for(var i=0;i<clue.word.length;i++){
var r=clue.dir==='across'?clue.row:clue.row+i;
var c=clue.dir==='across'?clue.col+i:clue.col;
var inp=document.getElementById('cell-'+r+'-'+c);
total++;
if(!inp||inp.value.toUpperCase()!==clue.word[i]){allCorrect=false;}
var cell=document.querySelector('[data-row="'+r+'"][data-col="'+c+'"]');
if(inp&&inp.value){
if(inp.value.toUpperCase()===clue.word[i]){cell.classList.add('correct');correct++;}
else{cell.classList.remove('correct');}
}
}
});
alert('检查完成：'+correct+'/'+total+' 个格子正确');
}
function revealAll(){
clues.forEach(function(clue){
for(var i=0;i<clue.word.length;i++){
var r=clue.dir==='across'?clue.row:clue.row+i;
var c=clue.dir==='across'?clue.col+i:clue.col;
var inp=document.getElementById('cell-'+r+'-'+c);
if(inp){inp.value=clue.word[i];inp.style.color='var(--green)';}
solvedSet.add(clue.word);
}
});
updateStats();clues.forEach(function(clue){markClueSolved(clue);});
}
function clearGrid(){
for(var r=0;r<size;r++){for(var c=0;c<size;c++){
var inp=document.getElementById('cell-'+r+'-'+c);
if(inp){inp.value='';inp.style.color='';}
grid[r][c]='';
}}
solvedSet.clear();updateStats();
document.querySelectorAll('.clue-item').forEach(function(el){el.classList.remove('solved','active');});
}
function updateStats(){
document.getElementById('solvedCount').textContent=solvedSet.size;
document.getElementById('totalCount').textContent=clues.length;
document.getElementById('progress').textContent=clues.length?Math.round(solvedSet.size/clues.length*100)+'%':'0%';
}
newPuzzle();
</script></body></html>
