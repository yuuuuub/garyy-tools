<style>*{box-sizing:border-box}:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body {
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;
padding:16px;scroll-behavior:smooth;}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}

h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}

/* === UI 精细化覆盖（参考 shadcn/Mantine 现代设计）=== */
/* h1 标题增加金色渐变与字间距，提升传统命理质感 */
h1{letter-spacing:.02em;background:linear-gradient(135deg,#1f2328 0%,#92400e 60%,#b45309 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:800}

/* textarea 更精致的边框与 focus 态 */
textarea{box-shadow:inset 0 1px 2px rgba(15,23,42,.04);transition:border-color .2s,box-shadow .2s,background-color .2s}
textarea:focus{border-color:#92400e !important;background-color:#fffdf7 !important;box-shadow:0 0 0 3px rgba(146,64,14,.12),inset 0 1px 2px rgba(15,23,42,.04) !important}

/* Start 按钮增加微妙渐变与阴影层次 */
button.bg-slate-900{background:linear-gradient(180deg,#1f2937 0%,#0f172a 100%) !important;box-shadow:0 1px 2px rgba(15,23,42,.2),0 4px 12px rgba(15,23,42,.08),inset 0 1px 0 rgba(255,255,255,.08) !important;transition:all .2s !important}
button.bg-slate-900:hover{background:linear-gradient(180deg,#374151 0%,#1f2937 100%) !important;box-shadow:0 2px 4px rgba(15,23,42,.2),0 6px 16px rgba(15,23,42,.12),inset 0 1px 0 rgba(255,255,255,.1) !important;transform:translateY(-1px)}
button.bg-slate-900:active{transform:translateY(0);box-shadow:0 1px 2px rgba(15,23,42,.2),inset 0 1px 2px rgba(0,0,0,.1) !important}

/* 卡片增加更柔和阴影与圆角 */
[class*="bg-white"][class*="rounded"]{box-shadow:0 1px 3px rgba(15,23,42,.04),0 4px 12px rgba(15,23,42,.03) !important}

/* select 下拉框 focus 态 */
select:focus{border-color:#92400e !important;box-shadow:0 0 0 3px rgba(146,64,14,.12) !important}

/* 暗色主题适配 */
[data-theme="dark"] h1{background:linear-gradient(135deg,#e6edf3 0%,#fbbf24 60%,#f59e0b 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
[data-theme="dark"] textarea:focus{background-color:#0d1117 !important;box-shadow:0 0 0 3px rgba(251,191,36,.15),inset 0 1px 2px rgba(0,0,0,.2) !important}
[data-theme="dark"] [class*="bg-white"][class*="rounded"]{box-shadow:0 1px 3px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.2) !important}
</style>
