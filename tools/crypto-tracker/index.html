<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加密货币行情</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem}.sub{color:var(--text2);font-size:.82rem;margin-top:4px}
.search-box{display:flex;gap:8px;max-width:400px;margin:16px auto 0}
.search-box input{flex:1;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.9rem;outline:none}
.search-box button{padding:10px 20px;background:var(--blue);border:none;border-radius:10px;color:#fff;cursor:pointer;font-size:.9rem}
.crypto-card{margin-top:20px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:24px;text-align:center}
.crypto-icon{font-size:3rem;margin-bottom:8px}
.crypto-name{font-size:1.3rem;font-weight:700}
.crypto-name-cn{font-size:.85rem;color:var(--blue);margin-top:4px}
.crypto-price{font-size:2rem;font-weight:700;margin-top:12px}
.crypto-change{font-size:.9rem;margin-top:8px}
.crypto-change.up{color:var(--green)}.crypto-change.down{color:var(--red)}
.crypto-details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;text-align:left}
.detail-item{background:var(--bg);border-radius:8px;padding:12px}
.detail-label{font-size:.75rem;color:var(--text2)}
.detail-value{font-size:.9rem;font-weight:600;margin-top:4px}
.quick-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.quick-btn{padding:5px 10px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text2);cursor:pointer;font-size:.78rem}
</style>
</head>
<body>
<div class="container">
<header><h1>📊 加密货币行情</h1><p class="sub">支持中文名搜索 · CoinGecko API</p></header>
<div class="search-box">
<input type="text" id="searchInput" placeholder="输入币名，如 比特币、ethereum" onkeydown="if(event.key==='Enter')fetchCoin()">
<button onclick="fetchCoin()">查询</button>
</div>
<div class="quick-list" id="quickList"></div>
<div id="app"></div>
</div>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
var input=document.getElementById('searchInput');
var cnToId={
'比特币':'bitcoin','以太坊':'ethereum','泰达币':'tether','币安币':'binancecoin',
'瑞波币':'ripple','艾达币':'cardano','索拉纳':'solana','狗狗币':'dogecoin',
'波卡':'polkadot','莱特币':'litecoin','Polygon':'matic-network',
'雪崩':'avalanche-2','UNI':'uniswap','链link':'chainlink',
'恒星币':'stellar','门罗币':'monero','达世币':'dash',
'NEO':'neo','EOS':'eos','TRX':'tron','SHIB':'shiba-inu',
'Filecoin':'filecoin','IOTA':'iota','APT':'aptos',
'SUI':'sui','ARB':'arbitrum','OP':'optimism'
};
var idToCn={};
Object.keys(cnToId).forEach(function(k){idToCn[cnToId[k]]=k;});
var quickCoins=['比特币','以太坊','狗狗币','索拉纳','瑞波币','币安币'];
function renderQuick(){
var html='';
quickCoins.forEach(function(c){
html+='<button class="quick-btn" onclick="quickSearch(\''+c+'\')">'+c+'</button>';
});
document.getElementById('quickList').innerHTML=html;
}
window.quickSearch=function(c){input.value=c;fetchCoin();};
window.fetchCoin=function(){
var q=input.value.trim().toLowerCase();
if(!q){app.innerHTML='<div style="text-align:center;color:var(--text2);padding:40px">请输入币种名称</div>';return;}
var coinId=cnToId[q]||q;
app.innerHTML='<div style="text-align:center;padding:60px 0;color:var(--text2)"><div class="spinner" style="width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px"></div><p>获取数据中...</p></div>';
fetch('https://api.coingecko.com/api/v3/coins/'+coinId+'?localization=false&tickers=false&community_data=false&developer_data=false')
.then(function(r){if(!r.ok)throw new Error('未找到该币种');return r.json();})
.then(function(data){
var name=data.name||coinId;
var symbol=(data.symbol||'').toUpperCase();
var price=data.market_data?data.market_data.current_price.usd:0;
var change24h=data.market_data?data.market_data.price_change_percentage_24h:0;
var marketCap=data.market_data?data.market_data.market_cap.usd:0;
var volume=data.market_data?data.market_data.total_volume.usd:0;
var high24h=data.market_data?data.market_data.high_24h.usd:0;
var low24h=data.market_data?data.market_data.low_24h.usd:0;
var cnName=idToCn[data.id]||'';
var img=data.image?data.image.small:'';
var html='<div class="crypto-card">';
if(img)html+='<img src="'+img+'" alt="'+name+'" style="width:64px;height:64px">';
html+='<div class="crypto-name">'+name+' ('+symbol+')</div>';
if(cnName)html+='<div class="crypto-name-cn">'+cnName+'</div>';
html+='<div class="crypto-price">$'+price.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+'</div>';
html+='<div class="crypto-change '+(change24h>=0?'up':'down')+'">'+(change24h>=0?'↑':'↓')+' '+Math.abs(change24h).toFixed(2)+'% (24h)</div>';
html+='<div class="crypto-details">';
html+='<div class="detail-item"><div class="detail-label">📊 市值</div><div class="detail-value">$'+formatNum(marketCap)+'</div></div>';
html+='<div class="detail-item"><div class="detail-label">📈 24h成交量</div><div class="detail-value">$'+formatNum(volume)+'</div></div>';
html+='<div class="detail-item"><div class="detail-label">⬆️ 24h最高</div><div class="detail-value">$'+high24h.toLocaleString()+'</div></div>';
html+='<div class="detail-item"><div class="detail-label">⬇️ 24h最低</div><div class="detail-value">$'+low24h.toLocaleString()+'</div></div>';
html+='</div></div>';
app.innerHTML=html;
})
.catch(function(e){
app.innerHTML='<div style="text-align:center;padding:40px 0;color:var(--text2)"><p>⚠️ '+e.message+'</p><p style="font-size:.8rem;margin-top:8px">试试：比特币、ethereum、dogecoin</p></div>';
});
};
function formatNum(n){if(n>=1e12)return(n/1e12).toFixed(2)+'T';if(n>=1e9)return(n/1e9).toFixed(2)+'B';if(n>=1e6)return(n/1e6).toFixed(2)+'M';return n.toLocaleString();}
renderQuick();
})();
</script>
</body>
</html>
