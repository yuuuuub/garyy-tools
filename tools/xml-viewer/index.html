<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XML 查看器 | XML Viewer</title>
<meta property="og:title" content="XML 查看器 | XML Viewer">
<meta property="og:description" content="XML 查看器 | XML Viewer - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="XML查看器，格式化、折叠展开和语法高亮显示XML代码">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<script src="i18n.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--border:#30363d;--text:#c9d1d9;--text-secondary:#8b949e;--accent:#58a6ff;--accent-hover:#79c0ff;--green:#3fb950;--green-bg:rgba(63,185,80,.15);--red:#f85149;--red-bg:rgba(248,81,73,.15);--orange:#d2991d;--cyan:#39d2c0;--blue:#79c0ff;--purple:#bc8cff;--radius:8px;--radius-sm:6px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--bg-secondary:#fff;--bg-tertiary:#f0f2f5;--border:#d0d7de;--text:#1f2328;--text-secondary:#656d76;--accent:#0969da;--accent-hover:#0550ae;--green:#1a7f37;--green-bg:rgba(26,127,55,.1);--red:#cf222e;--red-bg:rgba(207,34,46,.1);--orange:#9a6700;--cyan:#0598bc;--blue:#0969da;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
.app-header{background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.app-header h1{font-size:1.25rem;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.app-header .subtitle{font-size:.8rem;color:var(--text-secondary)}
.container{max-width:1600px;margin:0 auto;padding:20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:20px;min-height:calc(100vh - 140px)}
@media(max-width:900px){.container{grid-template-columns:1fr}}
.panel{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.panel-header{padding:10px 16px;border-bottom:1px solid var(--border);font-size:.85rem;font-weight:500;color:var(--text-secondary);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.editor{width:100%;flex:1;min-height:400px;padding:16px;background:var(--bg);color:var(--text);border:none;resize:none;font-family:'Fira Code',Consolas,Monaco,monospace;font-size:.85rem;line-height:1.6;outline:none}
.editor::placeholder{color:var(--text-secondary)}
.tree-view{flex:1;min-height:400px;padding:16px;overflow:auto;font-family:'Fira Code',Consolas,Monaco,monospace;font-size:.82rem;line-height:1.8}
.tree-node{margin-left:0;white-space:nowrap}
.tree-toggle{display:inline-block;width:16px;cursor:pointer;color:var(--accent);user-select:none;text-align:center}
.tree-toggle.collapsed::before{content:'▶'}
.tree-toggle.expanded::before{content:'▼'}
.tree-children{margin-left:20px;overflow:hidden}
.tree-children.collapsed{display:none}
.tree-tag{color:var(--blue)}
.tree-attr{color:var(--purple)}
.tree-value{color:var(--green)}
.tree-text{color:var(--text)}
.tree-comment{color:var(--text-secondary);font-style:italic}
.tree-ns{color:var(--cyan)}
.btn{padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);cursor:pointer;font-size:.8rem;transition:var(--transition)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--border);background:var(--bg-secondary)}
.info-bar{display:flex;gap:16px;padding:8px 16px;border-top:1px solid var(--border);font-size:.75rem;color:var(--text-secondary);flex-wrap:wrap}
.info-item span{color:var(--cyan)}
.drop-zone{flex:1;min-height:400px;padding:16px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:.9rem;border:2px dashed var(--border);border-radius:var(--radius-sm);margin:16px;cursor:pointer;transition:var(--transition)}
.drop-zone:hover{border-color:var(--accent);color:var(--accent)}
.toast{position:fixed;bottom:20px;right:20px;padding:10px 20px;border-radius:var(--radius-sm);background:var(--green);color:#fff;font-size:.85rem;z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header class="app-header">
<div>
<h1>📋 XML 查看器</h1>
<span class="subtitle">格式化、折叠展开和语法高亮显示XML代码</span>
</div>
<div style="display:flex;gap:6px">
<button class="btn" onclick="loadSample()">示例XML</button>
<button class="btn" onclick="clearAll()">清空</button>
</div>
</header>
<div class="container">
<div class="panel">
<div class="panel-header">
<span>📝 XML 代码</span>
<div style="display:flex;gap:6px">
<button class="btn" onclick="formatXML()">✨ 格式化</button>
<button class="btn" onclick="minifyXML()">📦 压缩</button>
<button class="btn" onclick="copyCode()">📋 复制</button>
</div>
</div>
<textarea class="editor" id="editor" placeholder="粘贴XML代码...&#10;&#10;支持拖拽XML文件导入" spellcheck="false"></textarea>
<div class="info-bar" id="infoBar"></div>
</div>
<div class="panel">
<div class="panel-header">
<span>🌳 树形视图</span>
<div style="display:flex;gap:6px">
<button class="btn" onclick="expandAll()">全部展开</button>
<button class="btn" onclick="collapseAll()">全部折叠</button>
</div>
</div>
<div class="tree-view" id="treeView">
<div class="drop-zone" id="dropZone">拖放XML文件到这里，或点击选择文件
<input type="file" accept=".xml,text/xml,application/xml" style="display:none" id="fileInput" onchange="loadFile(event)">
</div>
</div>
</div>
</div>
<div class="toast" id="toast">已复制到剪贴板</div>

<script>
const editor=document.getElementById('editor'),treeView=document.getElementById('treeView'),infoBar=document.getElementById('infoBar'),dropZone=document.getElementById('dropZone'),fileInput=document.getElementById('fileInput');

editor.addEventListener('input',()=>{formatAndRender()});

dropZone.addEventListener('click',()=>fileInput.click());
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.style.borderColor='var(--accent)'});
dropZone.addEventListener('dragleave',()=>{dropZone.style.borderColor='var(--border)'});
dropZone.addEventListener('drop',e=>{
e.preventDefault();dropZone.style.borderColor='var(--border)';
const file=e.dataTransfer.files[0];
if(file){const r=new FileReader();r.onload=ev=>{editor.value=ev.target.result;formatAndRender()};r.readAsText(file)}
});

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function formatXML(){
const xml=editor.value.trim();
if(!xml)return;
try{
const parser=new DOMParser();
const doc=parser.parseFromString(xml,'text/xml');
const err=doc.querySelector('parsererror');
if(err){alert('XML解析错误: '+err.textContent.substring(0,200));return}
editor.value=serializeXML(doc,0);
formatAndRender();
}catch(e){alert('格式化失败: '+e.message)}
}

function serializeXML(node,depth){
const ind='  '.repeat(depth);
let result='';
if(node.nodeType===1){
const tag=node.tagName;
const attrs=Array.from(node.attributes).map(a=>` ${a.name}="${a.value}"`).join('');
if(!node.childNodes.length){
return ind+'<'+tag+attrs+'/>\n';
}
const hasChildElements=Array.from(node.childNodes).some(c=>c.nodeType===1);
if(!hasChildElements&&node.textContent.length<80){
return ind+'<'+tag+attrs+'>'+esc(node.textContent)+'</'+tag+'>\n';
}
result+=ind+'<'+tag+attrs+'>\n';
node.childNodes.forEach(c=>{
if(c.nodeType===1)result+=serializeXML(c,depth+1);
else if(c.nodeType===3&&c.textContent.trim())result+=ind+'  '+esc(c.textContent.trim())+'\n';
else if(c.nodeType===8)result+=ind+'  <!--'+esc(c.textContent)+'-->\n';
});
result+=ind+'</'+tag+'>\n';
}else if(node.nodeType===3&&node.textContent.trim()){
return ind+esc(node.textContent.trim())+'\n';
}else if(node.nodeType===8){
return ind+'<!--'+esc(node.textContent)+'-->\n';
}
return result;
}

function minifyXML(){
const xml=editor.value.trim();
if(!xml)return;
const min=xml.replace(/>\s+</g,'><').replace(/\n\s*/g,'').trim();
editor.value=min;
formatAndRender();
}

function formatAndRender(){
const xml=editor.value.trim();
if(!xml){treeView.innerHTML='<div class="drop-zone" id="dropZone" onclick="fileInput.click()">拖放XML文件到这里</div>';infoBar.innerHTML='';return}
try{
const parser=new DOMParser();
const doc=parser.parseFromString(xml,'text/xml');
const err=doc.querySelector('parsererror');
if(err){infoBar.innerHTML='<span style="color:var(--red)">XML解析错误</span>';return}
const tags=xml.match(/<[^>]+>/g)||[];
const elems=new Set();let depth=0,maxDepth=0;
function walk(node,d){
if(node.nodeType===1){
elems.add(node.tagName);
if(d>maxDepth)maxDepth=d;
node.childNodes.forEach(c=>walk(c,d+1));
}
}
doc.childNodes.forEach(c=>walk(c,0));
const size=new Blob([xml]).size;
infoBar.innerHTML=`
<div class="info-item">元素: <span>${elems.size}</span></div>
<div class="info-item">标签数: <span>${tags.length}</span></div>
<div class="info-item">最大深度: <span>${maxDepth}</span></div>
<div class="info-item">大小: <span>${(size/1024).toFixed(1)} KB</span></div>`;
renderTree(doc);
}catch(e){infoBar.innerHTML='<span style="color:var(--red)">解析失败</span>'}
}

function renderTree(doc){
const html=['<div class="tree-node">'];
let id=0;
function walk(node,depth){
if(node.nodeType===1){
const tag=node.tagName;
const attrs=Array.from(node.attributes).map(a=>` <span class="tree-attr">${esc(a.name)}</span>=<span class="tree-value">"${esc(a.value)}"</span>`).join('');
const hasChildren=Array.from(node.childNodes).some(c=>c.nodeType===1);
const nodeId='n'+(id++);
if(hasChildren){
html.push(`<span class="tree-toggle expanded" onclick="toggleNode('${nodeId}',this)"></span><span class="tree-tag">&lt;${tag}</span>${attrs}<span class="tree-tag">&gt;</span>`);
html.push(`<div class="tree-children" id="${nodeId}">`);
node.childNodes.forEach(c=>walk(c,depth+1));
html.push(`</div><span class="tree-tag">&lt;/${tag}&gt;</span>`);
}else{
const text=Array.from(node.childNodes).filter(c=>c.nodeType===3).map(c=>c.textContent.trim()).join('');
html.push(`<span class="tree-toggle" style="visibility:hidden"></span><span class="tree-tag">&lt;${tag}</span>${attrs}<span class="tree-tag">&gt;</span>`);
if(text)html.push(`<span class="tree-text">${esc(text)}</span>`);
html.push(`<span class="tree-tag">&lt;/${tag}&gt;</span>`);
}
html.push('\n');
}else if(node.nodeType===3&&node.textContent.trim()){
html.push(`<span class="tree-text">${esc(node.textContent.trim())}</span>\n`);
}else if(node.nodeType===8){
html.push(`<span class="tree-comment">&lt;!--${esc(node.textContent)}--&gt;</span>\n`);
}
}
doc.childNodes.forEach(c=>walk(c,0));
html.push('</div>');
treeView.innerHTML=html.join('');
}

function toggleNode(id,el){
const node=document.getElementById(id);
if(!node)return;
node.classList.toggle('collapsed');
el.classList.toggle('expanded');
el.classList.toggle('collapsed');
}

function expandAll(){
document.querySelectorAll('.tree-children').forEach(n=>n.classList.remove('collapsed'));
document.querySelectorAll('.tree-toggle').forEach(t=>{t.classList.add('expanded');t.classList.remove('collapsed')});
}

function collapseAll(){
document.querySelectorAll('.tree-children').forEach(n=>n.classList.add('collapsed'));
document.querySelectorAll('.tree-toggle').forEach(t=>{t.classList.add('collapsed');t.classList.remove('expanded')});
}

function copyCode(){
if(!editor.value)return;
navigator.clipboard.writeText(editor.value).then(()=>showToast());
}

function clearAll(){editor.value='';treeView.innerHTML='';infoBar.innerHTML=''}

function loadFile(e){
const file=e.target.files[0];if(!file)return;
const r=new FileReader();r.onload=ev=>{editor.value=ev.target.result;formatAndRender()};r.readAsText(file);
}

function loadSample(){
editor.value=`<?xml version="1.0" encoding="UTF-8"?>
<bookstore>
  <book category="fiction">
    <title lang="en">The Great Gatsby</title>
    <author>F. Scott Fitzgerald</author>
    <year>1925</year>
    <price>10.99</price>
  </book>
  <book category="non-fiction">
    <title lang="en">A Brief History of Time</title>
    <author>Stephen Hawking</author>
    <year>1988</year>
    <price>15.99</price>
  </book>
  <book category="fiction">
    <title lang="zh">活着</title>
    <author>余华</author>
    <year>1993</year>
    <price>8.50</price>
  </book>
</bookstore>`;
formatAndRender();
}

function showToast(){document.getElementById('toast').classList.add('show');setTimeout(()=>document.getElementById('toast').classList.remove('show'),1500)}
</script>
</body>
</html>
