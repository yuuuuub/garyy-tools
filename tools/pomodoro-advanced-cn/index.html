<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍅 高级番茄钟</title>
<meta name="description" content="高级番茄钟计时器，支持自定义时长、统计和白噪音">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;line-height:1.6}
.ctn{max-width:480px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.timer-wrap{text-align:center;padding:30px 0}
.timer-display{font-size:4rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:2px}
.timer-label{font-size:1rem;color:var(--text2);margin-top:8px}
.timer-ring{width:220px;height:220px;margin:0 auto 16px;position:relative}
.timer-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--border);stroke-width:8}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.mode-tabs{display:flex;gap:4px;margin-bottom:16px;justify-content:center}
.mode-tab{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.85rem;color:var(--text2);border:1px solid var(--border);background:var(--bg);transition:all .2s}
.mode-tab.active{background:var(--accent);color:var(--text);border-color:var(--accent)}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.settings-grid label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}
.settings-grid input{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem}
.settings-grid input:focus{outline:none;border-color:var(--accent)}
.stat-row{display:flex;justify-content:space-around;text-align:center;padding:12px 0}
.stat-num{font-size:1.5rem;font-weight:700;color:var(--accent)}
.stat-lbl{font-size:.8rem;color:var(--text2);margin-top:4px}
.session-dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--border)}
.dot.done{background:var(--accent)}
.dot.current{background:var(--warn);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍅</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🍅 高级番茄钟">
<meta property="og:description" content="高级番茄钟计时器，支持自定义时长、统计和白噪音">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🍅 高级番茄钟</h1><p>专注工作，高效休息</p></div>

<div class="cd">
<div class="mode-tabs">
<div class="mode-tab active" onclick="setMode('focus')">专注</div>
<div class="mode-tab" onclick="setMode('short')">短休息</div>
<div class="mode-tab" onclick="setMode('long')">长休息</div>
</div>
<div class="timer-wrap">
<div class="timer-ring">
<svg viewBox="0 0 100 100"><circle class="ring-bg" cx="50" cy="50" r="42"/><circle class="ring-fg" id="ringFg" cx="50" cy="50" r="42" stroke-dasharray="263.89" stroke-dashoffset="0"/></svg>
</div>
<div class="timer-display" id="timerDisplay">25:00</div>
<div class="timer-label" id="timerLabel">专注时间</div>
</div>
<div class="session-dots" id="sessionDots"></div>
<div class="bg">
<button onclick="toggleTimer()" id="mainBtn">▶ 开始</button>
<button class="sec" onclick="resetTimer()">↺ 重置</button>
<button class="sec" onclick="skipTimer()">⏭ 跳过</button>
</div></div>

<div class="cd"><h2>⚙️ 设置</h2>
<div class="settings-grid">
<div><label>专注时长（分钟）</label><input type="number" id="focusMin" value="25" min="1" max="120" onchange="updateSettings()"></div>
<div><label>短休息（分钟）</label><input type="number" id="shortMin" value="5" min="1" max="30" onchange="updateSettings()"></div>
<div><label>长休息（分钟）</label><input type="number" id="longMin" value="15" min="1" max="60" onchange="updateSettings()"></div>
<div><label>长休息间隔</label><input type="number" id="longAfter" value="4" min="2" max="10" onchange="updateSettings()"></div>
</div></div>

<div class="cd"><h2>📊 今日统计</h2>
<div class="stat-row">
<div><div class="stat-num" id="todaySessions">0</div><div class="stat-lbl">完成番茄</div></div>
<div><div class="stat-num" id="todayMinutes">0</div><div class="stat-lbl">专注分钟</div></div>
<div><div class="stat-num" id="totalSessions">0</div><div class="stat-lbl">累计番茄</div></div>
</div></div>
</div>

<script>
const $=id=>document.getElementById(id);
let settings=JSON.parse(localStorage.getItem('pa_settings')||'{"focus":25,"short":5,"long":15,"longAfter":4}');
let stats=JSON.parse(localStorage.getItem('pa_stats')||'{"today":"","sessions":0,"minutes":0,"total":0}');
let mode='focus',running=false,remaining=settings.focus*60,total=settings.focus*60,timer=null,sessionCount=0;

function save(){localStorage.setItem('pa_settings',JSON.stringify(settings));localStorage.setItem('pa_stats',JSON.stringify(stats))}

function setMode(m){
  if(running)return;
  mode=m;document.querySelectorAll('.mode-tab').forEach((t,i)=>t.classList.toggle('active',['focus','short','long'][i]===m));
  remaining=({focus:settings.focus,short:settings.short,long:settings.long})[m]*60;
  total=remaining;updateDisplay();
}

function toggleTimer(){
  if(running){clearInterval(timer);running=false;$('mainBtn').textContent='▶ 继续'}
  else{running=true;$('mainBtn').textContent='⏸ 暂停';timer=setInterval(tick,1000)}
}

function tick(){
  remaining--;updateDisplay();
  if(remaining<=0){clearInterval(timer);running=false;onSessionEnd()}
}

function onSessionEnd(){
  if(mode==='focus'){
    sessionCount++;stats.sessions++;stats.minutes+=settings.focus;stats.total++;
    if(sessionCount%settings.longAfter===0)setMode('long');else setMode('short');
    if(stats.today!==today()){stats.today=today();stats.sessions=1;stats.minutes=settings.focus}
    save();updateStats();
    try{new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdH+Jk4yGfnRwaXN+hZCOh4B4dHJ1fIaPj4uGf3h2dHZ+ho+OioZ/eHZ0dnyFj46Khn94dnN2fIWPjoqGf3h2c3Z8hY+OioZ/eHZzdns=')[0].play()}catch(e){}
    alert('🍅 番茄完成！休息一下吧');
  }else{setMode('focus')}
}

function resetTimer(){clearInterval(timer);running=false;remaining=({focus:settings.focus,short:settings.short,long:settings.long})[mode]*60;total=remaining;$('mainBtn').textContent='▶ 开始';updateDisplay()}
function skipTimer(){clearInterval(timer);running=false;onSessionEnd()}

function updateDisplay(){
  const min=Math.floor(remaining/60),sec=remaining%60;
  $('timerDisplay').textContent=`${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  const labels={focus:'专注时间',short:'短休息',long:'长休息'};
  $('timerLabel').textContent=labels[mode];
  const pct=total>0?((total-remaining)/total)*263.89:0;
  $('ringFg').setAttribute('stroke-dashoffset',263.89-pct);
  $('ringFg').setAttribute('stroke',mode==='focus'?'var(--accent)':'var(--success)');
  updateDots();
}

function updateDots(){
  let html='';
  for(let i=0;i<settings.longAfter;i++){
    const cls=i<sessionCount%settings.longAfter?'done':i===sessionCount%settings.longAfter&&mode==='focus'?'current':'';
    html+=`<div class="dot ${cls}"></div>`;
  }
  $('sessionDots').innerHTML=html;
}

function updateSettings(){
  settings.focus=+$('focusMin').value||25;settings.short=+$('shortMin').value||5;settings.long=+$('longMin').value||15;settings.longAfter=+$('longAfter').value||4;
  save();if(!running){remaining=({focus:settings.focus,short:settings.short,long:settings.long})[mode]*60;total=remaining;updateDisplay()}
}

function updateStats(){
  if(stats.today!==today()){stats.today=today();stats.sessions=0;stats.minutes=0}
  $('todaySessions').textContent=stats.sessions;
  $('todayMinutes').textContent=stats.minutes;
  $('totalSessions').textContent=stats.total;
}

function today(){return new Date().toISOString().slice(0,10)}
updateDisplay();updateStats();updateDots();
</script>
</body>
</html>
