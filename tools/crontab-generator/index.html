<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crontab 生成器 | Crontab Generator</title>
<meta property="og:title" content="Crontab 生成器 | Crontab Generator">
<meta property="og:description" content="可视化生成Crontab定时任务表达式，支持常用预设">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线Crontab表达式生成器，可视化配置定时任务计划">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏰</text></svg>">
<script src="i18n.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--border:#30363d;--text:#c9d1d9;--text-secondary:#8b949e;--accent:#58a6ff;--accent-hover:#79c0ff;--green:#3fb950;--green-bg:rgba(63,185,80,.15);--red:#f85149;--red-bg:rgba(248,81,73,.15);--orange:#d2991d;--cyan:#39d2c0;--blue:#79c0ff;--purple:#bc8cff;--radius:8px;--radius-sm:6px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--bg-secondary:#fff;--bg-tertiary:#f0f2f5;--border:#d0d7de;--text:#1f2328;--text-secondary:#656d76;--accent:#0969da;--accent-hover:#0550ae;--green:#1a7f37;--green-bg:rgba(26,127,55,.1);--red:#cf222e;--red-bg:rgba(207,34,46,.1);--orange:#9a6700;--cyan:#0598bc;--blue:#0969da;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
.app-header{background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.app-header h1{font-size:1.25rem;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.app-header .subtitle{font-size:.8rem;color:var(--text-secondary)}
.main{max-width:1000px;margin:0 auto;padding:20px 24px}
.card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h2{font-size:1rem;margin-bottom:12px;color:var(--text)}
.cron-display{display:flex;gap:12px;align-items:center;padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:16px;font-family:'Fira Code',Consolas,monospace;font-size:1.5rem;font-weight:700;color:var(--cyan);letter-spacing:2px;justify-content:center;flex-wrap:wrap}
.cron-display .sep{color:var(--text-secondary);font-weight:400}
.cron-field{display:flex;flex-direction:column;align-items:center;gap:4px}
.cron-field label{font-size:.7rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;font-family:-apple-system,sans-serif;font-weight:400}
.cron-field .val{font-size:1.2rem;color:var(--accent)}
.form-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
@media(max-width:700px){.form-grid{grid-template-columns:repeat(3,1fr)}}
.field-group{display:flex;flex-direction:column;gap:6px}
.field-group label{font-size:.8rem;color:var(--text-secondary);font-weight:500}
.field-group input{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:.85rem;outline:none;text-align:center;font-family:'Fira Code',Consolas,monospace}
.field-group input:focus{border-color:var(--accent)}
.field-group select{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:.85rem;outline:none}
.field-group select option{background:var(--bg-secondary)}
.field-hint{font-size:.7rem;color:var(--text-secondary)}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.btn{padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);cursor:pointer;font-size:.8rem;transition:var(--transition)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.output-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;font-family:'Fira Code',Consolas,monospace;font-size:.85rem;line-height:1.7;white-space:pre-wrap;position:relative}
.output-actions{display:flex;gap:8px;margin-bottom:8px}
.description{padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);margin-top:12px}
.description p{font-size:.9rem;color:var(--text);line-height:1.6}
.description .highlight{color:var(--cyan);font-weight:600}
.next-runs{margin-top:12px}
.next-runs h3{font-size:.85rem;color:var(--text-secondary);margin-bottom:8px}
.run-list{display:flex;flex-direction:column;gap:4px}
.run-item{display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--bg);border-radius:4px;font-size:.8rem}
.run-item .time{font-family:'Fira Code',Consolas,monospace;color:var(--accent);min-width:160px}
.run-item .day{color:var(--text-secondary)}
.empty-state{text-align:center;padding:40px;color:var(--text-secondary);font-size:.85rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<header class="app-header">
<div>
<h1>⏰ Crontab 生成器</h1>
<span class="subtitle">可视化生成 Cron 定时任务表达式</span>
</div>
<button class="btn" onclick="resetFields()">重置</button>
</header>
<div class="main">
<div class="card">
<h2>预设模板</h2>
<div class="presets" id="presets"></div>
</div>

<div class="card">
<h2>时间配置</h2>
<div class="cron-display" id="cronDisplay">
<div class="cron-field"><label>分</label><span class="val" id="dispMin">*</span></div>
<span class="sep"> </span>
<div class="cron-field"><label>时</label><span class="val" id="dispHour">*</span></div>
<span class="sep"> </span>
<div class="cron-field"><label>日</label><span class="val" id="dispDay">*</span></div>
<span class="sep"> </span>
<div class="cron-field"><label>月</label><span class="val" id="dispMonth">*</span></div>
<span class="sep"> </span>
<div class="cron-field"><label>周</label><span class="val" id="dispDow">*</span></div>
</div>

<div class="form-grid">
<div class="field-group">
<label>分钟 (0-59)</label>
<input id="fMin" value="*" oninput="updateCron()">
<span class="field-hint">* 每分钟 | */5 每5分钟 | 0,30 第0和30分钟</span>
</div>
<div class="field-group">
<label>小时 (0-23)</label>
<input id="fHour" value="*" oninput="updateCron()">
<span class="field-hint">* 每小时 | 9 上午9点 | 9-17 9到17点</span>
</div>
<div class="field-group">
<label>日期 (1-31)</label>
<input id="fDay" value="*" oninput="updateCron()">
<span class="field-hint">* 每天 | 1 每月1号 | 1,15 1号和15号</span>
</div>
<div class="field-group">
<label>月份 (1-12)</label>
<input id="fMonth" value="*" oninput="updateCron()">
<span class="field-hint">* 每月 | 1,6 1月和6月 | */3 每3个月</span>
</div>
<div class="field-group">
<label>星期 (0-6)</label>
<input id="fDow" value="*" oninput="updateCron()">
<span class="field-hint">* 每天 | 0 周日 | 1-5 工作日 | 6 周六</span>
</div>
</div>

<div class="field-group">
<label>命令</label>
<input id="fCmd" placeholder="/usr/bin/backup.sh" oninput="updateCron()" style="text-align:left">
</div>
</div>

<div class="card">
<h2>生成结果</h2>
<div class="output-actions">
<button class="btn btn-primary" onclick="copyCron()">📋 复制 Crontab</button>
<button class="btn" onclick="copyCommand()">📋 复制命令</button>
</div>
<div class="output-box" id="output">* * * * * /usr/bin/backup.sh</div>
<div class="description" id="description">
<p>每 <span class="highlight">分钟</span> 执行一次</p>
</div>
<div class="next-runs" id="nextRuns">
<h3>未来6次执行时间</h3>
<div class="run-list" id="runList"></div>
</div>
</div>
</div>

<script>
const PRESETS=[
  {label:'每分钟',cron:'* * * * *',cmd:'/path/to/script.sh'},
  {label:'每5分钟',cron:'*/5 * * * *',cmd:'/path/to/script.sh'},
  {label:'每小时',cron:'0 * * * *',cmd:'/path/to/script.sh'},
  {label:'每天凌晨',cron:'0 0 * * *',cmd:'/path/to/script.sh'},
  {label:'每天8点',cron:'0 8 * * *',cmd:'/path/to/script.sh'},
  {label:'每周一',cron:'0 0 * * 1',cmd:'/path/to/script.sh'},
  {label:'每月1号',cron:'0 0 1 * *',cmd:'/path/to/script.sh'},
  {label:'工作日9点',cron:'0 9 * * 1-5',cmd:'/path/to/script.sh'},
  {label:'每晚23点',cron:'0 23 * * *',cmd:'/path/to/script.sh'},
  {label:'每周日3点',cron:'0 3 * * 0',cmd:'/path/to/script.sh'},
  {label:'每季度',cron:'0 0 1 1,4,7,10 *',cmd:'/path/to/script.sh'},
  {label:'每月最后一天',cron:'0 0 28-31 * *',cmd:'/path/to/script.sh'},
];

function renderPresets(){
  const el=document.getElementById('presets');
  el.innerHTML=PRESETS.map((p,i)=>`<button class="btn" onclick="applyPreset(${i})">${p.label}</button>`).join('');
}

function applyPreset(i){
  const p=PRESETS[i];
  const parts=p.cron.split(' ');
  document.getElementById('fMin').value=parts[0]||'*';
  document.getElementById('fHour').value=parts[1]||'*';
  document.getElementById('fDay').value=parts[2]||'*';
  document.getElementById('fMonth').value=parts[3]||'*';
  document.getElementById('fDow').value=parts[4]||'*';
  document.getElementById('fCmd').value=p.cmd;
  updateCron();
}

function updateCron(){
  const min=document.getElementById('fMin').value.trim()||'*';
  const hour=document.getElementById('fHour').value.trim()||'*';
  const day=document.getElementById('fDay').value.trim()||'*';
  const month=document.getElementById('fMonth').value.trim()||'*';
  const dow=document.getElementById('fDow').value.trim()||'*';
  const cmd=document.getElementById('fCmd').value.trim()||'/path/to/script.sh';

  document.getElementById('dispMin').textContent=min;
  document.getElementById('dispHour').textContent=hour;
  document.getElementById('dispDay').textContent=day;
  document.getElementById('dispMonth').textContent=month;
  document.getElementById('dispDow').textContent=dow;

  const cron=`${min} ${hour} ${day} ${month} ${dow}`;
  document.getElementById('output').textContent=`${cron} ${cmd}`;

  describeCron(min,hour,day,month,dow);
  calcNextRuns(min,hour,day,month,dow);
}

function describeCron(min,hour,day,month,dow){
  const desc=[];
  const DOW_NAMES=['周日','周一','周二','周三','周四','周五','周六'];
  const MONTH_NAMES=['','一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

  if(min==='*'&&hour==='*') desc.push('每分钟');
  else if(min.startsWith('*/')) desc.push(`每 ${min.slice(2)} 分钟`);
  else if(min!=='*') desc.push(`在第 ${min} 分钟`);
  else desc.push('每分钟');

  if(hour==='*') desc.push('每小时');
  else if(hour.startsWith('*/')) desc.push(`每 ${hour.slice(2)} 小时`);
  else if(hour.includes('-')) desc.push(`${hour.replace('-',' 到 ')} 点之间`);
  else desc.push(`在 ${hour} 点`);

  if(day!=='*') desc.push(`每月 ${day} 号`);
  if(month!=='*') desc.push(`在 ${MONTH_NAMES[parseInt(month)]||month}月`);
  if(dow!=='*'){
    if(dow.includes('-')) desc.push(`周 ${dow.replace('-',' 到 ')} `);
    else desc.push(DOW_NAMES[parseInt(dow)]||`星期${dow}`);
  }

  const el=document.getElementById('description');
  el.innerHTML=`<p>${desc.map(d=>`<span class="highlight">${d}</span>`).join(' ')}</p>`;
}

function calcNextRuns(min,hour,day,month,dow){
  const runs=[];
  const now=new Date();
  const next=new Date(now);
  next.setSeconds(0);
  next.setMilliseconds(0);
  next.setMinutes(next.getMinutes()+1);

  let maxIter=525600;
  while(runs.length<6&&maxIter-->0){
    if(matchesCron(next,min,hour,day,month,dow)){
      runs.push(new Date(next));
    }
    next.setMinutes(next.getMinutes()+1);
  }

  const el=document.getElementById('runList');
  el.innerHTML=runs.map(r=>{
    const weekdays=['周日','周一','周二','周三','周四','周五','周六'];
    return `<div class="run-item">
      <span class="time">${r.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>
      <span class="day">${weekdays[r.getDay()]}</span>
    </div>`;
  }).join('');
}

function matchesCron(date,min,hour,day,month,dow){
  if(!matchField(date.getMinutes(),min))return false;
  if(!matchField(date.getHours(),hour))return false;
  if(!matchField(date.getDate(),day))return false;
  if(!matchField(date.getMonth()+1,month))return false;
  if(!matchField(date.getDay(),dow))return false;
  return true;
}

function matchField(value,cron){
  if(cron==='*')return true;
  const parts=cron.split(',');
  for(const part of parts){
    if(part.includes('-')){
      const [s,e]=part.split('-').map(Number);
      if(value>=s&&value<=e)return true;
    }else if(part.includes('/')){
      const [base,step]=part.split('/');
      if(base==='*'){
        if(value%parseInt(step)===0)return true;
      }else{
        if(value%parseInt(step)===parseInt(base)%parseInt(step))return true;
      }
    }else{
      if(value===parseInt(part))return true;
    }
  }
  return false;
}

function copyCron(){
  const text=document.getElementById('output').textContent;
  navigator.clipboard.writeText(text).then(()=>showToast('已复制 Crontab','success'));
}

function copyCommand(){
  const cmd=document.getElementById('fCmd').value.trim();
  navigator.clipboard.writeText(cmd).then(()=>showToast('已复制命令','success'));
}

function resetFields(){
  document.getElementById('fMin').value='*';
  document.getElementById('fHour').value='*';
  document.getElementById('fDay').value='*';
  document.getElementById('fMonth').value='*';
  document.getElementById('fDow').value='*';
  document.getElementById('fCmd').value='';
  updateCron();
}

function showToast(msg,type='success'){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;font-size:.85rem;font-weight:500;z-index:99999;transition:opacity .3s;background:var(--green);color:#fff';
  if(type==='error')t.style.background='var(--red)';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},2000);
}

renderPresets();
updateCron();
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
