<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📄 落地页构建器</title>
<meta property="og:title" content="📄 落地页构建器">
<meta property="og:description" content="📄 落地页构建器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="可视化落地页构建器，拖拽式搭建高转化营销页面">
<meta name="robots" content="index, follow">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<style>
:root{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--orange:#bc4c00;--purple:#8250df;--shadow:0 1px 3px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--orange:#d29922;--purple:#bc8cff;--shadow:0 1px 3px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding:20px}
.container{max-width:1100px;margin:0 auto}
h1{color:var(--blue);border-bottom:2px solid var(--blue);padding-bottom:10px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-weight:600;margin-bottom:4px;font-size:13px;color:var(--text2)}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:14px}
textarea{resize:vertical;min-height:60px}
button{background:var(--blue);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600}
button:hover{opacity:.85}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-purple{background:var(--purple)}
.theme-toggle{position:fixed;top:20px;right:20px;background:var(--text2);color:var(--bg);border:none;padding:6px 12px;border-radius:6px;cursor:pointer;z-index:100}
.builder-layout{display:grid;grid-template-columns:240px 1fr 280px;gap:16px}
.component-list{display:flex;flex-direction:column;gap:6px}
.component-item{padding:10px 12px;border:1px solid var(--border);border-radius:6px;cursor:grab;font-size:13px;background:var(--card);transition:all .2s}
.component-item:hover{border-color:var(--blue);background:var(--blue);color:#fff}
.canvas-area{min-height:500px;border:2px dashed var(--border);border-radius:8px;padding:12px;position:relative}
.canvas-area.drag-over{border-color:var(--blue);background:rgba(9,105,218,.05)}
.canvas-block{padding:12px;margin-bottom:8px;border:1px solid var(--border);border-radius:6px;background:var(--card);position:relative;cursor:pointer}
.canvas-block:hover{border-color:var(--blue)}
.canvas-block.selected{border-color:var(--blue);box-shadow:0 0 0 2px rgba(9,105,218,.2)}
.canvas-block .remove{position:absolute;top:4px;right:4px;background:var(--red);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;display:none}
.canvas-block:hover .remove{display:block}
.prop-panel{max-height:500px;overflow-y:auto}
.hero-preview{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:40px 24px;border-radius:6px;text-align:center}
.hero-preview h2{font-size:24px;margin-bottom:8px}
.hero-preview p{opacity:.9}
.cta-btn{background:#fff;color:#667eea;padding:10px 24px;border-radius:20px;border:none;font-weight:700;margin-top:12px;cursor:pointer}
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}
.feature-item{padding:16px}
.feature-item .icon{font-size:32px;margin-bottom:8px}
.feature-item h4{margin-bottom:4px}
.feature-item p{font-size:13px;color:var(--text2)}
.testimonial-card{padding:16px;border-left:3px solid var(--blue);background:var(--card);border-radius:0 6px 6px 0}
.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pricing-card{text-align:center;padding:20px;border:1px solid var(--border);border-radius:8px}
.pricing-card.featured{border-color:var(--blue);position:relative}
.pricing-card.featured::before{content:'推荐';position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;padding:2px 12px;border-radius:10px;font-size:11px}
.page-item{padding:12px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;background:var(--card)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">🌓</button>
<div class="container">
<h1>📄 落地页构建器</h1>

<div class="card" style="margin-bottom:16px">
<div class="grid-2">
<div><label>页面标题</label><input type="text" id="pageTitle" placeholder="例：限时特惠活动" oninput="updatePreview()"></div>
<div><label>页面URL路径</label><input type="text" id="pageSlug" placeholder="例：promo-618"></div>
</div>
<div style="margin-top:8px;display:flex;gap:8px;align-items:center">
<button onclick="savePage()">💾 保存页面</button>
<button class="btn-green" onclick="exportHTML()">📤 导出HTML</button>
<button class="btn-purple" onclick="exportJSON()">📋 导出JSON</button>
<span style="font-size:12px;color:var(--text2)">已保存页面：<span id="pageCount">0</span></span>
</div>
</div>

<div class="builder-layout">
<div class="card">
<h4 style="margin-bottom:12px">组件库</h4>
<div class="component-list">
<div class="component-item" draggable="true" data-type="hero" ondragstart="drag(event)">🎯 Hero横幅</div>
<div class="component-item" draggable="true" data-type="features" ondragstart="drag(event)">⭐ 功能特性</div>
<div class="component-item" draggable="true" data-type="testimonial" ondragstart="drag(event)">💬 用户评价</div>
<div class="component-item" draggable="true" data-type="pricing" ondragstart="drag(event)">💰 定价方案</div>
<div class="component-item" draggable="true" data-type="cta" ondragstart="drag(event)">🔘 CTA按钮</div>
<div class="component-item" draggable="true" data-type="text" ondragstart="drag(event)">📝 文本段落</div>
<div class="component-item" draggable="true" data-type="image" ondragstart="drag(event)">🖼 图片占位</div>
<div class="component-item" draggable="true" data-type="faq" ondragstart="drag(event)">❓ FAQ手风琴</div>
<div class="component-item" draggable="true" data-type="countdown" ondragstart="drag(event)">⏰ 倒计时</div>
<div class="component-item" draggable="true" data-type="social" ondragstart="drag(event)">🔗 社交证明</div>
</div>
</div>

<div>
<div class="canvas-area" id="canvas" ondrop="drop(event)" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')">
<div id="canvasContent"><p style="color:var(--text2);text-align:center;padding:60px 0">拖拽左侧组件到此处搭建页面</p></div>
</div>
<div style="display:flex;gap:8px;margin-top:8px">
<button class="btn-sm btn-purple" onclick="previewPage()">👁 预览</button>
<button class="btn-sm btn-red" onclick="clearCanvas()">🗑 清空</button>
</div>
</div>

<div class="card prop-panel">
<h4 style="margin-bottom:12px">属性面板</h4>
<div id="propContent"><p style="color:var(--text2);font-size:13px">点击画布中的组件编辑属性</p></div>

<h4 style="margin:16px 0 8px;font-size:14px">已保存页面</h4>
<div id="savedPages"></div>
</div>
</div>
</div>

<script src="../i18n.js" defer></script>
<script>
var blocks=[];var selectedIdx=-1;var savedPages=JSON.parse(localStorage.getItem('lp_pages')||'[]');

var defaultContent={
  hero:{title:'限时特惠，全场5折起！',subtitle:'新用户专享优惠，仅限今天',btnText:'立即购买',bg:'linear-gradient(135deg,#667eea,#764ba2)'},
  features:{title:'为什么选择我们？',items:['🚀 极速配送','🔒 安全可靠','💎 品质保证']},
  testimonial:{quote:'产品非常好用，强烈推荐！',author:'张三 · 产品经理'},
  pricing:{plans:[{name:'基础版',price:'¥99/月',features:['5个项目','10GB存储','邮件支持']},{name:'专业版',price:'¥299/月',features:['无限项目','100GB存储','优先支持','API访问'],featured:true},{name:'企业版',price:'¥999/月',features:['无限项目','1TB存储','专属客服','SLA保障']}]},
  cta:{text:'立即开始免费试用',color:'#0969da'},
  text:{content:'在此输入文本内容，支持多行文字描述。'},
  image:{alt:'图片描述',height:'200'},
  faq:{items:[{q:'如何退款？',a:'购买后7天内可申请全额退款。'},{q:'支持哪些支付方式？',a:'支持微信、支付宝、银行卡等主流支付方式。'},{q:'如何联系客服？',a:'可通过在线聊天或拨打400-xxx-xxxx联系。'}]},
  countdown:{endTime:'',label:'距活动结束还有'},
  social:{stats:[{num:'10,000+',label:'活跃用户'},{num:'99.9%',label:'可用率'},{num:'4.9/5',label:'用户评分'}]}
};

function drag(e){e.dataTransfer.setData('type',e.target.dataset.type);}

function drop(e){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  var type=e.dataTransfer.getData('type');
  if(!type)return;
  blocks.push({type:type,content:JSON.parse(JSON.stringify(defaultContent[type]))});
  selectedIdx=blocks.length-1;
  renderCanvas();renderProps();
}

function renderCanvas(){
  var el=document.getElementById('canvasContent');
  if(!blocks.length){el.innerHTML='<p style="color:var(--text2);text-align:center;padding:60px 0">拖拽左侧组件到此处搭建页面</p>';return;}
  el.innerHTML=blocks.map((b,i)=>{
    var sel=i===selectedIdx?'selected':'';
    var preview='';
    if(b.type==='hero'){
      preview='<div class="hero-preview" style="background:'+b.content.bg+'"><h2>'+b.content.title+'</h2><p>'+b.content.subtitle+'</p><button class="cta-btn">'+b.content.btnText+'</button></div>';
    }else if(b.type==='features'){
      preview='<h4 style="text-align:center;margin-bottom:8px">'+b.content.title+'</h4><div class="feature-grid">'+b.content.items.map(item=>'<div class="feature-item"><div class="icon">'+item.charAt(0)+'</div><p>'+item+'</p></div>').join('')+'</div>';
    }else if(b.type==='testimonial'){
      preview='<div class="testimonial-card"><p style="font-style:italic;margin-bottom:8px">"'+b.content.quote+'"</p><p style="font-size:13px;color:var(--text2)">— '+b.content.author+'</p></div>';
    }else if(b.type==='pricing'){
      preview='<div class="pricing-grid">'+b.content.plans.map(p=>'<div class="pricing-card'+(p.featured?' featured':'')+'"><h4>'+p.name+'</h4><div style="font-size:24px;font-weight:700;margin:8px 0">'+p.price+'</div><ul style="list-style:none;font-size:12px">'+p.features.map(f=>'<li style="padding:2px 0">✓ '+f+'</li>').join('')+'</ul><button style="margin-top:8px;width:100%">选择方案</button></div>').join('')+'</div>';
    }else if(b.type==='cta'){
      preview='<div style="text-align:center;padding:24px"><button style="background:'+b.content.color+';padding:12px 32px;font-size:18px;border-radius:8px">'+b.content.text+'</button></div>';
    }else if(b.type==='text'){
      preview='<p style="line-height:1.6">'+b.content.content+'</p>';
    }else if(b.type==='image'){
      preview='<div style="background:var(--border);height:'+b.content.height+'px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text2)">📷 '+b.content.alt+'</div>';
    }else if(b.type==='faq'){
      preview=b.content.items.map(item=>'<details style="margin-bottom:4px;border:1px solid var(--border);border-radius:4px;padding:8px"><summary style="cursor:pointer;font-weight:600">'+item.q+'</summary><p style="margin-top:8px;color:var(--text2);font-size:14px">'+item.a+'</p></details>').join('');
    }else if(b.type==='countdown'){
      preview='<div style="text-align:center;padding:20px;background:var(--bg);border-radius:6px"><p style="font-size:14px;color:var(--text2)">'+b.content.label+'</p><div id="countdown-display" style="font-size:32px;font-weight:700;color:var(--blue);margin-top:8px">--:--:--</div></div>';
    }else if(b.type==='social'){
      preview='<div style="display:flex;justify-content:center;gap:24px;padding:16px;background:var(--bg);border-radius:6px">'+b.content.stats.map(s=>'<div style="text-align:center"><div style="font-size:24px;font-weight:700;color:var(--blue)">'+s.num+'</div><div style="font-size:12px;color:var(--text2)">'+s.label+'</div></div>').join('')+'</div>';
    }
    var typeLabel={hero:'Hero横幅',features:'功能特性',testimonial:'用户评价',pricing:'定价方案',cta:'CTA按钮',text:'文本段落',image:'图片占位',faq:'FAQ',countdown:'倒计时',social:'社交证明'}[b.type];
    return '<div class="canvas-block '+sel+'" onclick="selectBlock('+i+')"><span style="font-size:11px;color:var(--text2)">'+typeLabel+'</span><button class="remove" onclick="event.stopPropagation();removeBlock('+i+')">×</button>'+preview+'</div>';
  }).join('');
}

function selectBlock(i){selectedIdx=i;renderCanvas();renderProps();}

function removeBlock(i){blocks.splice(i,1);if(selectedIdx>=blocks.length)selectedIdx=blocks.length-1;renderCanvas();renderProps();}

function clearCanvas(){if(confirm('确定清空所有组件？')){blocks=[];selectedIdx=-1;renderCanvas();renderProps();}}

function renderProps(){
  var el=document.getElementById('propContent');
  if(selectedIdx<0||selectedIdx>=blocks.length){el.innerHTML='<p style="color:var(--text2);font-size:13px">点击画布中的组件编辑属性</p>';return;}
  var b=blocks[selectedIdx];var c=b.content;var html='';
  if(b.type==='hero'){
    html='<label>标题</label><input value="'+c.title+'" oninput="blocks['+selectedIdx+'].content.title=this.value;renderCanvas()"><label style="margin-top:8px">副标题</label><input value="'+c.subtitle+'" oninput="blocks['+selectedIdx+'].content.subtitle=this.value;renderCanvas()"><label style="margin-top:8px">按钮文字</label><input value="'+c.btnText+'" oninput="blocks['+selectedIdx+'].content.btnText=this.value;renderCanvas()"><label style="margin-top:8px">背景渐变</label><input value="'+c.bg+'" oninput="blocks['+selectedIdx+'].content.bg=this.value;renderCanvas()">';
  }else if(b.type==='text'){
    html='<label>文本内容</label><textarea rows="4" oninput="blocks['+selectedIdx+'].content.content=this.value;renderCanvas()">'+c.content+'</textarea>';
  }else if(b.type==='cta'){
    html='<label>按钮文字</label><input value="'+c.text+'" oninput="blocks['+selectedIdx+'].content.text=this.value;renderCanvas()"><label style="margin-top:8px">按钮颜色</label><input type="color" value="'+c.color+'" oninput="blocks['+selectedIdx+'].content.color=this.value;renderCanvas()">';
  }else if(b.type==='image'){
    html='<label>图片描述</label><input value="'+c.alt+'" oninput="blocks['+selectedIdx+'].content.alt=this.value;renderCanvas()"><label style="margin-top:8px">高度(px)</label><input type="number" value="'+c.height+'" oninput="blocks['+selectedIdx+'].content.height=this.value;renderCanvas()">';
  }else if(b.type==='social'){
    c.stats.forEach(function(s,i){
      html+='<label>数字'+(i+1)+'</label><input value="'+s.num+'" oninput="blocks['+selectedIdx+'].content.stats['+i+'].num=this.value;renderCanvas()"><label>标签'+(i+1)+'</label><input value="'+s.label+'" oninput="blocks['+selectedIdx+'].content.stats['+i+'].label=this.value;renderCanvas()">';
    });
  }else{
    html='<pre style="font-size:11px;white-space:pre-wrap;color:var(--text2)">'+JSON.stringify(c,null,2)+'</pre><p style="font-size:12px;margin-top:8px;color:var(--text2)">选中此组件后可在代码中自定义</p>';
  }
  el.innerHTML=html;
}

function savePage(){
  var title=document.getElementById('pageTitle').value.trim();
  var slug=document.getElementById('pageSlug').value.trim();
  if(!title){alert('请输入页面标题');return;}
  savedPages.push({title:title,slug:slug||title,blocks:JSON.parse(JSON.stringify(blocks)),created:new Date().toLocaleDateString('zh-CN')});
  localStorage.setItem('lp_pages',JSON.stringify(savedPages));
  renderSavedPages();alert('保存成功！');
}

function renderSavedPages(){
  document.getElementById('pageCount').textContent=savedPages.length;
  document.getElementById('savedPages').innerHTML=savedPages.length?savedPages.map((p,i)=>
    '<div class="page-item"><div><strong>'+p.title+'</strong><div style="font-size:11px;color:var(--text2)">/'+p.slug+' · '+p.blocks.length+'个组件 · '+p.created+'</div></div><div style="display:flex;gap:4px"><button class="btn-sm" onclick="loadPage('+i+')">编辑</button><button class="btn-sm btn-red" onclick="deletePage('+i+')">删除</button></div></div>'
  ).join(''):'<p style="color:var(--text2);font-size:13px">暂无保存的页面</p>';
}

function loadPage(i){var p=savedPages[i];blocks=JSON.parse(JSON.stringify(p.blocks));document.getElementById('pageTitle').value=p.title;document.getElementById('pageSlug').value=p.slug;selectedIdx=-1;renderCanvas();renderProps();}
function deletePage(i){if(confirm('确定删除？')){savedPages.splice(i,1);localStorage.setItem('lp_pages',JSON.stringify(savedPages));renderSavedPages();}}

function exportHTML(){
  var title=document.getElementById('pageTitle').value||'落地页';
  var html='<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>'+title+'</title><style>body{font-family:-apple-system,sans-serif;margin:0;padding:0}*{box-sizing:border-box}</style></head><body>';
  blocks.forEach(b=>{
    if(b.type==='hero')html+='<div style="background:'+b.content.bg+';color:#fff;padding:60px 24px;text-align:center"><h1 style="font-size:32px;margin-bottom:8px">'+b.content.title+'</h1><p style="opacity:.9">'+b.content.subtitle+'</p><button style="background:#fff;color:#333;padding:12px 32px;border-radius:24px;border:none;font-size:16px;margin-top:16px;cursor:pointer">'+b.content.btnText+'</button></div>';
    else if(b.type==='text')html+='<div style="max-width:800px;margin:0 auto;padding:24px"><p style="line-height:1.8">'+b.content.content+'</p></div>';
    else if(b.type==='cta')html+='<div style="text-align:center;padding:32px"><button style="background:'+b.content.color+';color:#fff;padding:14px 36px;font-size:18px;border:none;border-radius:8px;cursor:pointer">'+b.content.text+'</button></div>';
  });
  html+='</body></html>';
  var blob=new Blob([html],{type:'text/html'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=title+'.html';a.click();
}

function exportJSON(){
  var data={title:document.getElementById('pageTitle').value,slug:document.getElementById('pageSlug').value,blocks:blocks};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(data.slug||'page')+'.json';a.click();
}

function previewPage(){
  var w=window.open('','_blank');
  var html='<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>预览</title><style>body{font-family:-apple-system,sans-serif;margin:0}*{box-sizing:border-box}</style></head><body>';
  blocks.forEach(b=>{
    if(b.type==='hero')html+='<div style="background:'+b.content.bg+';color:#fff;padding:60px 24px;text-align:center"><h1 style="font-size:32px;margin-bottom:8px">'+b.content.title+'</h1><p style="opacity:.9">'+b.content.subtitle+'</p><button style="background:#fff;color:#333;padding:12px 32px;border-radius:24px;border:none;font-size:16px;margin-top:16px">'+b.content.btnText+'</button></div>';
    else if(b.type==='features')html+='<div style="max-width:800px;margin:0 auto;padding:32px"><h2 style="text-align:center">'+b.content.title+'</h2><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px">'+b.content.items.map(item=>'<div style="text-align:center;padding:16px"><div style="font-size:32px;margin-bottom:8px">'+item.charAt(0)+'</div><p>'+item+'</p></div>').join('')+'</div></div>';
    else if(b.type==='testimonial')html+='<div style="max-width:600px;margin:0 auto;padding:24px;border-left:3px solid #0969da"><p style="font-style:italic;font-size:18px">"'+b.content.quote+'"</p><p style="color:#666;margin-top:8px">— '+b.content.author+'</p></div>';
    else if(b.type==='pricing')html+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:800px;margin:0 auto;padding:32px">'+b.content.plans.map(p=>'<div style="text-align:center;padding:24px;border:1px solid #ddd;border-radius:8px'+(p.featured?';border-color:#0969da':'')+'"><h3>'+p.name+'</h3><div style="font-size:28px;font-weight:700;margin:12px 0">'+p.price+'</div><ul style="list-style:none;padding:0">'+p.features.map(f=>'<li style="padding:4px 0">✓ '+f+'</li>').join('')+'</ul><button style="width:100%;padding:10px;background:#0969da;color:#fff;border:none;border-radius:6px;margin-top:12px;cursor:pointer">选择方案</button></div>').join('')+'</div>';
    else if(b.type==='cta')html+='<div style="text-align:center;padding:32px"><button style="background:'+b.content.color+';color:#fff;padding:14px 36px;font-size:18px;border:none;border-radius:8px;cursor:pointer">'+b.content.text+'</button></div>';
    else if(b.type==='text')html+='<div style="max-width:800px;margin:0 auto;padding:24px"><p style="line-height:1.8">'+b.content.content+'</p></div>';
    else if(b.type==='faq')html+='<div style="max-width:700px;margin:0 auto;padding:24px">'+b.content.items.map(item=>'<details style="margin-bottom:8px;border:1px solid #ddd;border-radius:6px;padding:12px"><summary style="cursor:pointer;font-weight:600">'+item.q+'</summary><p style="margin-top:8px;color:#666">'+item.a+'</p></details>').join('')+'</div>';
    else if(b.type==='social')html+='<div style="display:flex;justify-content:center;gap:40px;padding:32px;background:#f5f5f5">'+b.content.stats.map(s=>'<div style="text-align:center"><div style="font-size:28px;font-weight:700;color:#0969da">'+s.num+'</div><div style="color:#666">'+s.label+'</div></div>').join('')+'</div>';
    else if(b.type==='image')html+='<div style="background:#eee;height:'+b.content.height+'px;display:flex;align-items:center;justify-content:center;color:#999">📷 '+b.content.alt+'</div>';
  });
  html+='</body></html>';
  w.document.write(html);w.document.close();
}

renderSavedPages();
</script>
</body>
</html>
