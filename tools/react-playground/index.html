<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>React游乐场 - 在线React编辑器</title>
<meta name="description" content="React在线编辑器，实时编写和预览React组件">
<style>
:root {
--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#58a6ff;--success:#3fb950;--warning:#d29922;--error:#f85149;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
nav{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
nav .logo{font-size:18px;font-weight:600;color:var(--accent2);}
nav a{color:var(--accent);text-decoration:none;font-size:14px;}
nav a:hover{color:var(--accent2);}
.container{display:flex;flex-direction:column;height:calc(100vh - 52px);}
.toolbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s;}
.btn-primary{background:var(--accent);color:var(--text);}
.btn-primary:hover{background:var(--accent2);}
.btn-secondary{background:var(--border);color:var(--text);}
.btn-secondary:hover{background:#3d444d;}
.workspace{display:flex;flex:1;overflow:hidden;}
.editor-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border);}
.preview-panel{flex:1;display:flex;flex-direction:column;}
.panel-header{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;font-size:13px;color:var(--accent2);font-weight:500;}
.editor-wrapper{flex:1;position:relative;}
#reactEditor{width:100%;height:100%;background:var(--bg);border:none;color:var(--text);font-family:"Fira Code",Consolas,monospace;font-size:12px;padding:12px;resize:none;outline:none;line-height:1.5;}
.preview-area{flex:1;background:#fff;padding:20px;overflow:auto;}
#reactContainer{width:100%;min-height:200px;}
.templates{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;}
.templates span{font-size:12px;color:#8b949e;margin-right:8px;}
.template-btn{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:11px;color:var(--accent2);cursor:pointer;margin-right:6px;margin-bottom:4px;}
.template-btn:hover{border-color:var(--accent);color:var(--accent);}
.error-msg{color:var(--error);font-size:12px;padding:8px;background:rgba(248,81,73,0.1);margin:8px;border-radius:4px;}
@media(max-width:768px){
.workspace{flex-direction:column;}
.editor-panel{border-right:none;border-bottom:1px solid var(--border);}
}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="React游乐场 - 在线React编辑器">
  <meta property="og:description" content="React在线编辑器，实时编写和预览React组件">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/react-playground/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<nav>
<span class="logo">React游乐场</span>
<a href="/index.html">← 返回工具箱</a>
</nav>
<div class="container">
<div class="toolbar">
<button class="btn btn-primary" onclick="runCode()">▶ 运行</button>
<button class="btn btn-secondary" onclick="copyCode()">复制代码</button>
<button class="btn btn-secondary" onclick="resetCode()">重置</button>
<span id="errorMsg" class="error-msg" style="display:none;margin:0 0 0 8px;"></span>
</div>
<div class="templates">
<span>模板:</span>
<button class="template-btn" data-code="// 计数器组件\nfunction Counter() {\n  const [count, setCount] = React.useState(0);\n  \n  return (\n    <div style={{textAlign: 'center', padding: '20px'}}>\n      <h2>计数器</h2>\n      <p style={{fontSize: '48px', margin: '20px 0'}}>{count}</p>\n      <button onClick={() => setCount(count + 1)} style={{padding: '10px 20px', fontSize: '16px', background: '#3b82f6', color: 'white', border: 'none', borderRadius: '8px', cursor: 'pointer'}}>\n        点击 +1\n      </button>\n    </div>\n  );\n}">计数器</button>
<button class="template-btn" data-code="// 待办事项\nfunction TodoApp() {\n  const [todos, setTodos] = React.useState([\n    { id: 1, text: '学习React', done: true },\n    { id: 2, text: '写代码', done: false },\n    { id: 3, text: '部署上线', done: false }\n  ]);\n  const [input, setInput] = React.useState('');\n  \n  const addTodo = () => {\n    if (input.trim()) {\n      setTodos([...todos, { id: Date.now(), text: input, done: false }]);\n      setInput('');\n    }\n  };\n  \n  const toggleTodo = (id) => {\n    setTodos(todos.map(t => t.id === id ? {...t, done: !t.done} : t));\n  };\n  \n  return (\n    <div style={{maxWidth: '400px', margin: '0 auto'}}>\n      <h2 style={{marginBottom: '16px'}}>待办事项</h2>\n      <div style={{display: 'flex', gap: '8px', marginBottom: '16px'}}>\n        <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && addTodo()}\n          style={{flex: 1, padding: '8px', border: '1px solid #ccc', borderRadius: '4px'}} placeholder="添加新任务..." />\n        <button onClick={addTodo} style={{padding: '8px 16px', background: '#3b82f6', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer'}}>添加</button>\n      </div>\n      {todos.map(todo => (\n        <div key={todo.id} onClick={() => toggleTodo(todo.id)} style={{padding: '12px', margin: '8px 0', background: '#f5f5f5', borderRadius: '4px', cursor: 'pointer', textDecoration: todo.done ? 'line-through' : 'none'}}>\n          {todo.text}\n        </div>\n      ))}\n    </div>\n  );\n}">待办事项</button>
<button class="template-btn" data-code="// 颜色选择器\nfunction ColorPicker() {\n  const [color, setColor] = React.useState('#3b82f6');\n  const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];\n  \n  return (\n    <div style={{textAlign: 'center', padding: '20px'}}>\n      <h2>颜色选择器</h2>\n      <div style={{width: '150px', height: '150px', background: color, margin: '20px auto', borderRadius: '50%', boxShadow: `0 10px 40px ${color}40`}} />\n      <div style={{display: 'flex', gap: '10px', justifyContent: 'center'}}>\n        {colors.map(c => (\n          <div key={c} onClick={() => setColor(c)} style={{width: '40px', height: '40px', background: c, borderRadius: '50%', cursor: 'pointer', border: color === c ? '3px solid #333' : '3px solid transparent'}} />\n        ))}\n      </div>\n      <p style={{marginTop: '16px', color: '#666'}}>{color}</p>\n    </div>\n  );\n}">颜色选择器</button>
<button class="template-btn" data-code="// 时钟组件\nfunction Clock() {\n  const [time, setTime] = React.useState(new Date());\n  \n  React.useEffect(() => {\n    const timer = setInterval(() => setTime(new Date()), 1000);\n    return () => clearInterval(timer);\n  }, []);\n  \n  return (\n    <div style={{textAlign: 'center', padding: '40px'}}>\n      <h2 style={{marginBottom: '20px'}}>实时时钟</h2>\n      <div style={{fontSize: '64px', fontWeight: 'bold', color: '#3b82f6', fontFamily: 'monospace'}}>\n        {time.toLocaleTimeString('zh-CN')}\n      </div>\n      <p style={{color: '#666', marginTop: '10px'}}>{time.toLocaleDateString('zh-CN')}</p>\n    </div>\n  );\n}">时钟</button>
</div>
<div class="workspace">
<div class="editor-panel">
<div class="panel-header">React组件代码</div>
<div class="editor-wrapper">
<textarea id="reactEditor">// React组件代码
// 使用JSX语法编写组件

function App() {
  const [count, setCount] = React.useState(0);
  const [darkMode, setDarkMode] = React.useState(true);

  return (
    <div style={{
      padding: '40px',
      background: darkMode ? '#1a1a2e' : '#ffffff',
      color: darkMode ? '#ffffff' : '#333333',
      minHeight: '100vh',
      fontFamily: 'system-ui, sans-serif'
    }}>
      <h1 style={{marginBottom: '20px'}}>React组件示例</h1>

      <div style={{
        background: darkMode ? '#2d2d44' : '#f5f5f5',
        padding: '30px',
        borderRadius: '12px',
        marginBottom: '20px'
      }}>
        <p style={{fontSize: '24px', marginBottom: '16px'}}>
          计数: {count}
        </p>
        <button
          onClick={() => setCount(c => c + 1)}
          style={{
            padding: '12px 24px',
            background: '#3b82f6',
            color: 'white',
            border: 'none',
            borderRadius: '8px',
            fontSize: '16px',
            cursor: 'pointer',
            marginRight: '10px'
          }}
        >
          +1
        </button>
        <button
          onClick={() => setCount(0)}
          style={{
            padding: '12px 24px',
            background: '#6b7280',
            color: 'white',
            border: 'none',
            borderRadius: '8px',
            fontSize: '16px',
            cursor: 'pointer'
          }}
        >
          重置
        </button>
      </div>

      <button
        onClick={() => setDarkMode(!darkMode)}
        style={{
          padding: '10px 20px',
          background: darkMode ? '#fbbf24' : '#1f2937',
          color: darkMode ? '#1f2937' : '#ffffff',
          border: 'none',
          borderRadius: '8px',
          fontSize: '14px',
          cursor: 'pointer'
        }}
      >
        {darkMode ? '切换亮色模式' : '切换暗色模式'}
      </button>
    </div>
  );
}</textarea>
</div>
</div>
<div class="preview-panel">
<div class="panel-header">组件预览</div>
<div class="preview-area">
<div id="reactContainer"></div>
</div>
</div>
</div>
</div>
<script>
const reactEditor=document.getElementById('reactEditor');
const reactContainer=document.getElementById('reactContainer');
const errorMsg=document.getElementById('errorMsg');
function runCode(){
errorMsg.style.display='none';
const code=reactEditor.value;
try{
const transpiled=Babel.transform(code,{presets:['react']}).code;
const App=new Function('React',transpiled+'return App;')(React);
ReactDOM.createRoot(reactContainer).render(React.createElement(App));
}catch(e){
errorMsg.textContent='编译错误: '+e.message;
errorMsg.style.display='inline-block';
}
}
function copyCode(){
navigator.clipboard.writeText(reactEditor.value).then(()=>garyyToast('代码已复制到剪贴板'));
}
function resetCode(){
reactEditor.value='
runCode();
}
document.querySelectorAll('.template-btn').forEach(btn=>{
btn.onclick=()=>{
reactEditor.value=btn.dataset.code;
runCode();
};
});
function waitForDeps(){
if(typeof React!=='undefined'&&typeof ReactDOM!=='undefined'&&typeof Babel!=='undefined'){
runCode();
}else{
setTimeout(waitForDeps,100);
}
}
waitForDeps();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
