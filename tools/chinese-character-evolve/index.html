<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字进化</title><meta name="description" content="汉字进化 - 在线查看汉字进化过程"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.evolution-timeline{position:relative;padding:20px 0}.evolution-stage{display:flex;align-items:center;margin:20px 0;position:relative}.evolution-char{width:100px;height:100px;background:var(--bg);border:2px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:var(--blue);flex-shrink:0}.evolution-info{margin-left:20px;flex:1}.evolution-era{font-size:1.1rem;font-weight:600;color:var(--blue);margin-bottom:4px}.evolution-name{font-size:.9rem;color:var(--green);margin-bottom:4px}.evolution-desc{font-size:.85rem;color:var(--text2)}.evolution-line{position:absolute;left:50px;top:100px;bottom:-20px;width:2px;background:var(--border)}</style><meta property="og:title" content="汉字进化"><meta property="og:description" content="汉字进化 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🧬 汉字进化</h1><p class="sub">在线查看汉字进化过程</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" oninput="showEvolution()">
</div>
<button class="btn" onclick="showEvolution()">查看进化</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var evolutionData={
  '日':{stages:[{era:'甲骨文',char:'☉',name:'象形字',desc:'像太阳的形状，圆形中间有一点'},{era:'金文',char:'⊙',name:'象形字',desc:'继续描绘太阳的圆形'},{era:'小篆',char:'⊙',name:'象形字',desc:'更加规整的圆形'},{era:'隶书',char:'日',name:'方块字',desc:'演变为方块形状'},{era:'楷书',char:'日',name:'标准字',desc:'现代标准写法'}]},
  '月':{stages:[{era:'甲骨文',char:'☽',name:'象形字',desc:'像月亮的形状，弯月形'},{era:'金文',char:'☽',name:'象形字',desc:'继续描绘月亮的弯月形'},{era:'小篆',char:'☽',name:'象形字',desc:'更加规整的弯月形'},{era:'隶书',char:'月',name:'方块字',desc:'演变为方块形状'},{era:'楷书',char:'月',name:'标准字',desc:'现代标准写法'}]},
  '水':{stages:[{era:'甲骨文',char:'〰',name:'象形字',desc:'像流水的形状'},{era:'金文',char:'〜',name:'象形字',desc:'继续描绘流水的形状'},{era:'小篆',char:'〜',name:'象形字',desc:'更加规整的流水形状'},{era:'隶书',char:'水',name:'方块字',desc:'演变为方块形状'},{era:'楷书',char:'水',name:'标准字',desc:'现代标准写法'}]},
  '火':{stages:[{era:'甲骨文',char:'🔥',name:'象形字',desc:'像火焰的形状'},{era:'金文',char:'🔥',name:'象形字',desc:'继续描绘火焰的形状'},{era:'小篆',char:'🔥',name:'象形字',desc:'更加规整的火焰形状'},{era:'隶书',char:'火',name:'方块字',desc:'演变为方块形状'},{era:'楷书',char:'火',name:'标准字',desc:'现代标准写法'}]},
  '木':{stages:[{era:'甲骨文',char:'🌳',name:'象形字',desc:'像树木的形状，有树干和树枝'},{era:'金文',char:'🌳',name:'象形字',desc:'继续描绘树木的形状'},{era:'小篆',char:'🌳',name:'象形字',desc:'更加规整的树木形状'},{era:'隶书',char:'木',name:'方块字',desc:'演变为方块形状'},{era:'楷书',char:'木',name:'标准字',desc:'现代标准写法'}]},
  '山':{stages:[{era:'甲骨文',char:'⛰',name:'象形字',desc:'像山峰的形状'},{era:'金文',char:'⛰',name:'象形字',desc:'继续描绘山峰的形状'},{era:'小篆',char:'⛰',name:'象形字',desc:'更加规整的山峰形状'},{era:'隶书',char:'山',name:'方块字',desc:'演变为方块形状'},{era:'楷书',char:'山',name:'标准字',desc:'现代标准写法'}]},
  '人':{stages:[{era:'甲骨文',char:'👤',name:'象形字',desc:'像人侧面站立的形状'},{era:'金文',char:'👤',name:'象形字',desc:'继续描绘人的形状'},{era:'小篆',char:'👤',name:'象形字',desc:'更加规整的人形'},{era:'隶书',char:'人',name:'方块字',desc:'演变为方块形状'},{era:'楷书',char:'人',name:'标准字',desc:'现代标准写法'}]},
  '大':{stages:[{era:'甲骨文',char:'大',name:'象形字',desc:'像人张开双臂的形状，表示大'},{era:'金文',char:'大',name:'象形字',desc:'继续描绘大人的形状'},{era:'小篆',char:'大',name:'象形字',desc:'更加规整的大字形状'},{era:'隶书',char:'大',name:'方块字',desc:'演变为方块形状'},{era:'楷书',char:'大',name:'标准字',desc:'现代标准写法'}]},
  '小':{stages:[{era:'甲骨文',char:'小',name:'象形字',desc:'像细小的沙粒或碎片'},{era:'金文',char:'小',name:'象形字',desc:'继续描绘细小的形状'},{era:'小篆',char:'小',name:'象形字',desc:'更加规整的小字形状'},{era:'隶书',char:'小',name:'方块字',desc:'演变为方块形状'},{era:'楷书',char:'小',name:'标准字',desc:'现代标准写法'}]},
  '口':{stages:[{era:'甲骨文',char:'□',name:'象形字',desc:'像嘴巴的形状'},{era:'金文',char:'□',name:'象形字',desc:'继续描绘嘴巴的形状'},{era:'小篆',char:'□',name:'象形字',desc:'更加规整的嘴巴形状'},{era:'隶书',char:'口',name:'方块字',desc:'演变为方块形状'},{era:'楷书',char:'口',name:'标准字',desc:'现代标准写法'}]},
  '目':{stages:[{era:'甲骨文',char:'👁',name:'象形字',desc:'像眼睛的形状'},{era:'金文',char:'👁',name:'象形字',desc:'继续描绘眼睛的形状'},{era:'小篆',char:'👁',name:'象形字',desc:'更加规整的眼睛形状'},{era:'隶书',char:'目',name:'方块字',desc:'演变为方块形状'},{era:'楷书',char:'目',name:'标准字',desc:'现代标准写法'}]},
  '心':{stages:[{era:'甲骨文',char:'♥',name:'象形字',desc:'像心脏的形状'},{era:'金文',char:'♥',name:'象形字',desc:'继续描绘心脏的形状'},{era:'小篆',char:'♥',name:'象形字',desc:'更加规整的心脏形状'},{era:'隶书',char:'心',name:'方块字',desc:'演变为方块形状'},{era:'楷书',char:'心',name:'标准字',desc:'现代标准写法'}]},
  '手':{stages:[{era:'甲骨文',char:'✋',name:'象形字',desc:'像手掌的形状'},{era:'金文',char:'✋',name:'象形字',desc:'继续描绘手掌的形状'},{era:'小篆',char:'✋',name:'象形字',desc:'更加规整的手掌形状'},{era:'隶书',char:'手',name:'方块字',desc:'演变为方块形状'},{era:'楷书',char:'手',name:'标准字',desc:'现代标准写法'}]}
};
function showEvolution(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var data=evolutionData[char];
  if(!data){
    data={stages:[{era:'古代',char:char,name:'汉字',desc:'暂无详细进化信息'},{era:'现代',char:char,name:'标准字',desc:'现代标准写法'}]};
  }
  var html='<div class="card">';
  html+='<div style="text-align:center;margin-bottom:20px">';
  html+='<div style="font-size:4rem;font-weight:700;color:var(--blue)">'+char+'</div>';
  html+='<div style="font-size:1.1rem;color:var(--text2);margin-top:8px">汉字进化历程</div>';
  html+='</div>';
  html+='<div class="evolution-timeline">';
  data.stages.forEach(function(stage,index){
    html+='<div class="evolution-stage">';
    html+='<div class="evolution-char">'+stage.char+'</div>';
    html+='<div class="evolution-info">';
    html+='<div class="evolution-era">'+stage.era+'</div>';
    html+='<div class="evolution-name">'+stage.name+'</div>';
    html+='<div class="evolution-desc">'+stage.desc+'</div>';
    html+='</div>';
    if(index<data.stages.length-1){
      html+='<div class="evolution-line"></div>';
    }
    html+='</div>';
  });
  html+='</div></div>';
  r.innerHTML=html;
}
function randomCharacter(){
  var chars=Object.keys(evolutionData);
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  showEvolution();
}
showEvolution();
</script></body></html>
