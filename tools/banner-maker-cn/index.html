<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖼️ 横幅制作工具</title>
<meta name="description" content="在线横幅制作工具，支持文字、图片、渐变背景，多尺寸模板，导出PNG">
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:960px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.canvas-wrap{display:flex;justify-content:center;overflow:auto;padding:10px 0}
canvas#bannerCanvas{border:1px solid var(--border);border-radius:8px}
.form-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.form-row label{font-size:13px;color:var(--text-secondary);min-width:70px}
.form-row input[type="text"],.form-row select{padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--input-bg);color:var(--text);flex:1;min-width:120px}
.form-row input[type="color"]{width:40px;height:32px;border:1px solid var(--border);border-radius:6px;cursor:pointer;padding:2px}
.form-row input[type="range"]{flex:1;accent-color:var(--accent)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card-bg);color:var(--text);padding:10px 24px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow);border:1px solid var(--border)}
.toast.show{opacity:1}
.preset-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.preset{padding:8px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--card-bg);font-size:12px;cursor:pointer;transition:all .2s}
.preset:hover{border-color:var(--accent)}
.preset.active{border-color:var(--accent);background:var(--tag-bg)}
.gradient-bar{height:30px;border-radius:8px;border:1px solid var(--border);margin-bottom:8px}
.template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:12px}
.template-card{padding:12px;border:2px solid var(--border);border-radius:10px;cursor:pointer;text-align:center;font-size:12px;transition:all .2s;background:var(--input-bg)}
.template-card:hover{border-color:var(--accent)}
.template-card.active{border-color:var(--accent);background:var(--tag-bg)}
.template-card .tpl-preview{height:60px;border-radius:6px;margin-bottom:6px}
footer{text-align:center;padding:24px 0;color:var(--text-secondary);font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖼️</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--card-bg);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>🖼️ 横幅制作工具</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </header>

  <div class="card">
    <div class="card-title">📐 尺寸模板</div>
    <div class="preset-row" id="sizePresets"></div>
  </div>

  <div class="card">
    <div class="card-title">🖼️ 预览</div>
    <div class="canvas-wrap"><canvas id="bannerCanvas" width="800" height="400"></canvas></div>
  </div>

  <div class="card">
    <div class="card-title">🎨 背景</div>
    <div class="template-grid" id="bgTemplates"></div>
    <div class="form-row"><label>背景色</label><input type="color" id="bgColor1" value="#6366f1" onchange="render()"></div>
    <div class="form-row"><label>渐变结束</label><input type="color" id="bgColor2" value="#a855f7" onchange="render()"></div>
    <div class="form-row"><label>渐变角度</label><input type="range" min="0" max="360" value="135" id="bgAngle" oninput="document.getElementById('angleVal').textContent=this.value+'°';render()"><span id="angleVal">135°</span></div>
    <div class="form-row"><label>纯色模式</label><input type="checkbox" id="solidBg" onchange="render()"></div>
  </div>

  <div class="card">
    <div class="card-title">📝 主标题</div>
    <div class="form-row"><label>文字</label><input type="text" id="mainText" value="创建精彩横幅" oninput="render()"></div>
    <div class="form-row"><label>字体大小</label><input type="range" min="24" max="120" value="48" id="mainFontSize" oninput="document.getElementById('mainFSVal').textContent=this.value+'px';render()"><span id="mainFSVal">48px</span></div>
    <div class="form-row"><label>颜色</label><input type="color" id="mainColor" value="#ffffff" onchange="render()"></div>
    <div class="form-row"><label>字体</label><select id="mainFont" onchange="render()"><option value="Arial Black">黑体</option><option value="Arial">Arial</option><option value="Georgia">宋体</option><option value="Impact">Impact</option><option value="Comic Sans MS">圆体</option></select></div>
    <div class="form-row"><label>Y位置</label><input type="range" min="0" max="100" value="35" id="mainY" oninput="render()"><span id="mainYVal">35%</span></div>
    <div class="form-row"><label>阴影</label><input type="checkbox" id="mainShadow" checked onchange="render()"></div>
  </div>

  <div class="card">
    <div class="card-title">📝 副标题</div>
    <div class="form-row"><label>文字</label><input type="text" id="subText" value="简单易用，在线编辑" oninput="render()"></div>
    <div class="form-row"><label>字体大小</label><input type="range" min="12" max="60" value="24" id="subFontSize" oninput="document.getElementById('subFSVal').textContent=this.value+'px';render()"><span id="subFSVal">24px</span></div>
    <div class="form-row"><label>颜色</label><input type="color" id="subColor" value="#e0e7ff" onchange="render()"></div>
    <div class="form-row"><label>Y位置</label><input type="range" min="0" max="100" value="55" id="subY" oninput="render()"><span id="subYVal">55%</span></div>
  </div>

  <div class="card">
    <div class="card-title">🔘 按钮</div>
    <div class="form-row"><label>按钮文字</label><input type="text" id="btnText" value="立即体验" oninput="render()"></div>
    <div class="form-row"><label>按钮颜色</label><input type="color" id="btnColor" value="#ffffff" onchange="render()"></div>
    <div class="form-row"><label>文字颜色</label><input type="color" id="btnTextColor" value="#6366f1" onchange="render()"></div>
    <div class="form-row"><label>圆角</label><input type="range" min="0" max="30" value="20" id="btnRadius" oninput="render()"><span id="btnRVal">20</span></div>
    <div class="form-row"><label>Y位置</label><input type="range" min="0" max="100" value="72" id="btnY" oninput="render()"><span id="btnYVal">72%</span></div>
    <div class="form-row"><label>显示</label><input type="checkbox" id="showBtn" checked onchange="render()"></div>
  </div>

  <div class="card">
    <div class="card-title">✨ 装饰</div>
    <div class="form-row"><label>形状1</label><select id="deco1" onchange="render()"><option value="none">无</option><option value="circle">圆形</option><option value="ring">圆环</option><option value="dot">圆点</option></select></div>
    <div class="form-row"><label>形状2</label><select id="deco2" onchange="render()"><option value="none">无</option><option value="circle">圆形</option><option value="ring">圆环</option><option value="dot">圆点</option></select></div>
    <div class="form-row"><label>透明度</label><input type="range" min="5" max="40" value="15" id="decoAlpha" oninput="render()"><span id="decoAlphaVal">15%</span></div>
  </div>

  <div class="card">
    <div class="card-title">⚡ 操作</div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="exportPNG()">💾 导出PNG</button>
      <button class="btn btn-outline" onclick="exportJPG()">💾 导出JPG</button>
    </div>
  </div>

  <footer>🖼️ 横幅制作工具 - 快速创建社交媒体横幅</footer>
</div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/i18n-js@3/dist/i18n.min.js" defer></script>
<script>
const C=document.getElementById('bannerCanvas'),ctx=C.getContext('2d');
const sizes=[{w:800,h:400,l:'通用横幅 800x400'},{w:1200,h:630,l:'OG图 1200x630'},{w:1920,h:1080,l:'YouTube 1920x1080'},{w:1080,h:1080,l:'Instagram 1080'},{w:1200,h:628,l:'Facebook 1200x628'},{w:1500,h:500,l:'Twitter 1500x500'},{w:728,h:90,l:'广告横幅 728x90'},{w:320,h:50,l:'移动广告 320x50'}];
const bgTemplates=[{c1:'#6366f1',c2:'#a855f7',l:'紫蓝渐变'},{c1:'#ef4444',c2:'#f97316',l:'红橙渐变'},{c1:'#22c55e',c2:'#14b8a6',l:'绿色渐变'},{c1:'#3b82f6',c2:'#06b6d4',l:'蓝色渐变'},{c1:'#ec4899',c2:'#f43f5e',l:'粉红渐变'},{c1:'#1e293b',c2:'#475569',l:'深色渐变'},{c1:'#fbbf24',c2:'#f59e0b',l:'金色渐变'},{c1:'#8b5cf6',c2:'#d946ef',l:'紫粉渐变'}];

function init(){
  renderSizes();renderBgTemplates();render();
}

function renderSizes(){
  const row=document.getElementById('sizePresets');row.innerHTML='';
  sizes.forEach(s=>{
    const b=document.createElement('button');
    b.className='preset';
    b.textContent=s.l;
    b.onclick=()=>{C.width=s.w;C.height=s.h;render();showToast('尺寸: '+s.w+'x'+s.h);};
    row.appendChild(b);
  });
}

function renderBgTemplates(){
  const grid=document.getElementById('bgTemplates');grid.innerHTML='';
  bgTemplates.forEach(t=>{
    const card=document.createElement('div');
    card.className='template-card';
    const preview=document.createElement('div');
    preview.className='tpl-preview';
    preview.style.background=`linear-gradient(135deg,${t.c1},${t.c2})`;
    const label=document.createElement('div');
    label.textContent=t.l;
    card.append(preview,label);
    card.onclick=()=>{
      document.getElementById('bgColor1').value=t.c1;
      document.getElementById('bgColor2').value=t.c2;
      document.getElementById('solidBg').checked=false;
      render();
    };
    grid.appendChild(card);
  });
}

function render(){
  const w=C.width,h=C.height;
  const c1=document.getElementById('bgColor1').value;
  const c2=document.getElementById('bgColor2').value;
  const angle=parseInt(document.getElementById('bgAngle').value);
  const solid=document.getElementById('solidBg').checked;
  ctx.clearRect(0,0,w,h);

  if(solid){
    ctx.fillStyle=c1;ctx.fillRect(0,0,w,h);
  }else{
    const rad=angle*Math.PI/180;
    const cx=w/2+Math.cos(rad)*w/2;
    const cy=h/2+Math.sin(rad)*h/2;
    const grad=ctx.createLinearGradient(0,0,cx,cy);
    grad.addColorStop(0,c1);grad.addColorStop(1,c2);
    ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
  }

  const da=parseInt(document.getElementById('decoAlpha').value)/100;
  ctx.globalAlpha=da;
  const d1=document.getElementById('deco1').value;
  const d2=document.getElementById('deco2').value;
  if(d1!=='none'){
    ctx.fillStyle='rgba(255,255,255,0.5)';
    if(d1==='circle'){ctx.beginPath();ctx.arc(w*0.8,h*0.2,h*0.3,0,Math.PI*2);ctx.fill();}
    else if(d1==='ring'){ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=h*0.03;ctx.beginPath();ctx.arc(w*0.8,h*0.2,h*0.3,0,Math.PI*2);ctx.stroke();}
    else if(d1==='dot'){ctx.beginPath();ctx.arc(w*0.15,h*0.8,h*0.05,0,Math.PI*2);ctx.fill();}
  }
  if(d2!=='none'){
    ctx.fillStyle='rgba(255,255,255,0.5)';
    if(d2==='circle'){ctx.beginPath();ctx.arc(w*0.1,h*0.85,h*0.25,0,Math.PI*2);ctx.fill();}
    else if(d2==='ring'){ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=h*0.02;ctx.beginPath();ctx.arc(w*0.85,h*0.85,h*0.2,0,Math.PI*2);ctx.stroke();}
    else if(d2==='dot'){ctx.beginPath();ctx.arc(w*0.9,h*0.1,h*0.04,0,Math.PI*2);ctx.fill();}
  }
  ctx.globalAlpha=1;

  const mainText=document.getElementById('mainText').value;
  const mainFS=parseInt(document.getElementById('mainFontSize').value);
  const mainColor=document.getElementById('mainColor').value;
  const mainFont=document.getElementById('mainFont').value;
  const mainYP=parseInt(document.getElementById('mainY').value)/100;
  const mainShadow=document.getElementById('mainShadow').checked;

  ctx.font=`bold ${mainFS}px ${mainFont}`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(mainShadow){ctx.shadowColor='rgba(0,0,0,0.3)';ctx.shadowBlur=10;ctx.shadowOffsetY=4;}
  ctx.fillStyle=mainColor;
  ctx.fillText(mainText,w/2,h*mainYP);
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;

  const subText=document.getElementById('subText').value;
  const subFS=parseInt(document.getElementById('subFontSize').value);
  const subColor=document.getElementById('subColor').value;
  const subYP=parseInt(document.getElementById('subY').value)/100;
  ctx.font=`${subFS}px ${mainFont}`;
  ctx.fillStyle=subColor;
  ctx.fillText(subText,w/2,h*subYP);

  if(document.getElementById('showBtn').checked){
    const bt=document.getElementById('btnText').value;
    const bc=document.getElementById('btnColor').value;
    const btc=document.getElementById('btnTextColor').value;
    const br=parseInt(document.getElementById('btnRadius').value);
    const byP=parseInt(document.getElementById('btnY').value)/100;
    ctx.font=`bold ${Math.max(16,mainFS*0.4)}px ${mainFont}`;
    const tw=ctx.measureText(bt).width;
    const pw=tw+40,ph=mainFS*0.7;
    ctx.fillStyle=bc;
    roundRect(ctx,w/2-pw/2,h*byP-ph/2,pw,ph,br);ctx.fill();
    ctx.fillStyle=btc;
    ctx.fillText(bt,w/2,h*byP);
  }
}

function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);
  c.closePath();
}

function exportPNG(){
  const link=document.createElement('a');link.download='横幅_'+C.width+'x'+C.height+'_'+Date.now()+'.png';link.href=C.toDataURL('image/png');link.click();showToast('已导出PNG');
}
function exportJPG(){
  const link=document.createElement('a');link.download='横幅_'+C.width+'x'+C.height+'_'+Date.now()+'.jpg';link.href=C.toDataURL('image/jpeg',0.92);link.click();showToast('已导出JPG');
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function toggleTheme(){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';document.querySelector('.theme-toggle').textContent=d.dataset.theme==='dark'?'☀️':'🌙';}
document.querySelectorAll('#angleVal').forEach(e=>e.previousElementSibling.addEventListener('input',()=>e.textContent=e.previousElementSibling.value+'°'));

init();
</script>
</body>
</html>
