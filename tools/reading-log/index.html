<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 阅读日志</title>
<meta name="description" content="记录阅读书目和进度，养成阅读习惯">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:20px}
.ctn{max-width:600px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.li{padding:14px;border-bottom:1px solid var(--border)}
.li:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem}
.tag.reading{background:var(--accent)}
.tag.done{background:var(--success)}
.tag.wish{background:var(--warn)}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.st>div{text-align:center;padding:12px;background:var(--bg);border-radius:8px}
.st .nm{font-size:1.3rem;font-weight:700}
.st .lb{font-size:.75rem;color:var(--text2);margin-top:2px}
.pb{width:100%;height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:6px}
.pb .fl{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.notes{font-size:.85rem;color:var(--text2);margin-top:6px;white-space:pre-wrap}
.empty{color:var(--text2);text-align:center;padding:20px}
.filter-btns{display:flex;gap:6px;margin-bottom:12px}
.filter-btns button{padding:6px 14px;font-size:.85rem}
.filter-btns button.active{background:var(--accent)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📚 阅读日志">
<meta property="og:description" content="记录阅读书目和进度，养成阅读习惯">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📚 阅读日志</h1><p>记录阅读，分享知识</p></div>

<div class="st" id="stats"></div>

<div class="cd"><h2>添加书目</h2>
<label>书名</label><input type="text" id="bTitle" placeholder="如：三体">
<label>作者</label><input type="text" id="bAuthor" placeholder="如：刘慈欣">
<div class="fr">
<div><label>总页数</label><input type="number" id="bPages" value="300" min="1"></div>
<div><label>状态</label><select id="bStatus"><option value="reading">在读</option><option value="done">已读完</option><option value="wish">想读</option></select></div>
</div>
<label>笔记</label><textarea id="bNotes" placeholder="记录阅读感想..."></textarea>
<div class="bg"><button onclick="addBook()">添加书目</button></div></div>

<div class="filter-btns">
  <button class="active" onclick="setFilter('all',this)">全部</button>
  <button onclick="setFilter('reading',this)">在读</button>
  <button onclick="setFilter('done',this)">已读完</button>
  <button onclick="setFilter('wish',this)">想读</button>
</div>

<div class="cd"><h2>书目列表</h2><div id="bookList" class="empty">暂无书目</div></div>
</div>

<script>
const $ = id => document.getElementById(id);
let books = JSON.parse(localStorage.getItem('rl_books') || '[]');
let filter = 'all';

function save() { localStorage.setItem('rl_books', JSON.stringify(books)); }

function addBook() {
  const title = $('bTitle').value.trim();
  if (!title) { alert('请输入书名'); return; }
  books.push({
    id: Date.now(), title, author: $('bAuthor').value.trim(),
    totalPages: parseInt($('bPages').value) || 300,
    currentPage: 0, status: $('bStatus').value,
    notes: $('bNotes').value.trim(), dateAdded: new Date().toISOString().slice(0, 10)
  });
  save(); render(); $('bTitle').value = ''; $('bAuthor').value = ''; $('bNotes').value = '';
}

function updateProgress(id, val) {
  const b = books.find(x => x.id === id);
  if (b) { b.currentPage = Math.min(b.totalPages, Math.max(0, parseInt(val) || 0)); if (b.currentPage >= b.totalPages) b.status = 'done'; }
  save(); render();
}

function deleteBook(id) {
  books = books.filter(x => x.id !== id);
  save(); render();
}

function setFilter(f, el) {
  filter = f;
  document.querySelectorAll('.filter-btns button').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
}

function render() {
  const reading = books.filter(b => b.status === 'reading').length;
  const done = books.filter(b => b.status === 'done').length;
  const wish = books.filter(b => b.status === 'wish').length;
  const totalPages = books.filter(b => b.status === 'done').reduce((s, b) => s + b.totalPages, 0);

  $('stats').innerHTML = `
    <div><div class="nm" style="color:var(--accent)">${books.length}</div><div class="lb">总书目</div></div>
    <div><div class="nm" style="color:var(--accent)">${reading}</div><div class="lb">在读</div></div>
    <div><div class="nm" style="color:var(--success)">${done}</div><div class="lb">已读完</div></div>
    <div><div class="nm" style="color:var(--warn)">${totalPages}</div><div class="lb">已读页数</div></div>`;

  const statusLabel = { reading: '在读', done: '已读完', wish: '想读' };
  const filtered = filter === 'all' ? books : books.filter(b => b.status === filter);
  const sorted = [...filtered].sort((a, b) => a.status === 'reading' ? -1 : 1);

  $('bookList').innerHTML = sorted.length ? sorted.map(b => {
    const pct = b.totalPages > 0 ? Math.round(b.currentPage / b.totalPages * 100) : 0;
    return `<div class="li">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <strong>${b.title}</strong><span class="tag ${b.status}">${statusLabel[b.status]}</span>
      </div>
      <div style="font-size:.85rem;color:var(--text2);margin-top:4px">${b.author ? '作者: ' + b.author : ''} · ${b.dateAdded}</div>
      ${b.status === 'reading' ? `<div class="pb" style="margin-top:8px"><div class="fl" style="width:${pct}%"></div></div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
        <input type="range" min="0" max="${b.totalPages}" value="${b.currentPage}" style="flex:1" oninput="updateProgress(${b.id},this.value)">
        <span style="font-size:.8rem;color:var(--text2);min-width:80px;text-align:right">${b.currentPage}/${b.totalPages}页 (${pct}%)</span>
      </div>` : `<div style="font-size:.85rem;color:var(--text2);margin-top:4px">${b.totalPages}页</div>`}
      ${b.notes ? `<div class="notes">"${b.notes}"</div>` : ''}
      <div class="bg"><button class="dng" style="padding:4px 10px;font-size:.8rem" onclick="deleteBook(${b.id})">删除</button></div>
    </div>`;
  }).join('') : '<div class="empty">暂无书目</div>';
}

render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
