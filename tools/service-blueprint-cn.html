<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="服务蓝图工具 - 创建服务蓝图，可视化前台、后台和支持流程的完整服务体验">
    <meta name="robots" content="index, follow">
    <title>服务蓝图</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="i18n.js" defer></script>
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --primary-color: #0284c7; --secondary-color: #6c757d; --success-color: #28a745; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #dee2e6; --card-bg: #f8f9fa; --hover-color: #f1f3f5; }
        [data-theme="dark"] { --bg-color: #1a1a1a; --text-color: #ffffff; --primary-color: #38bdf8; --secondary-color: #6c757d; --success-color: #198754; --warning-color: #ffc107; --danger-color: #dc3545; --border-color: #444444; --card-bg: #2d2d2d; --hover-color: #3a3a3a; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background-color 0.3s, color 0.3s; }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .card { padding: 20px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--card-bg); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--card-bg); color: var(--text-color); box-sizing: border-box; }
        textarea { resize: vertical; min-height: 60px; }
        button { background-color: var(--primary-color); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 8px; margin-bottom: 8px; }
        button:hover { opacity: 0.9; }
        .btn-sm { padding: 6px 12px; font-size: 13px; }
        .btn-danger { background-color: var(--danger-color); }
        .btn-success { background-color: var(--success-color); }
        .btn-secondary { background-color: var(--secondary-color); }
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 8px 12px; background-color: var(--secondary-color); color: white; border: none; border-radius: 4px; cursor: pointer; z-index: 100; }
        .blueprint-wrapper { overflow-x: auto; }
        .blueprint-table { width: 100%; border-collapse: collapse; min-width: 900px; }
        .blueprint-table th, .blueprint-table td { padding: 10px; border: 1px solid var(--border-color); vertical-align: top; text-align: center; }
        .blueprint-table th { background: var(--card-bg); font-weight: bold; position: sticky; top: 0; }
        .bp-row-label { background: var(--card-bg); font-weight: bold; text-align: left; min-width: 140px; font-size: 13px; }
        .bp-phase { background: color-mix(in srgb, var(--primary-color) 8%, var(--card-bg)); font-weight: 600; }
        .bp-cell { min-height: 70px; font-size: 12px; text-align: left; padding: 8px; }
        .bp-cell .bp-item { padding: 4px 8px; margin-bottom: 4px; background: var(--bg-color); border-radius: 4px; border: 1px solid var(--border-color); }
        .bp-cell .bp-item.empty { color: var(--secondary-color); font-style: italic; background: transparent; border-style: dashed; }
        .line-of-interaction { border-top: 3px dashed var(--primary-color); }
        .line-of-visibility { border-top: 3px dashed var(--secondary-color); }
        .line-of-internal { border-top: 2px dotted var(--border-color); }
        .row-frontstage { background: color-mix(in srgb, #3b82f6 5%, var(--bg-color)); }
        .row-backstage { background: color-mix(in srgb, #f59e0b 5%, var(--bg-color)); }
        .row-support { background: color-mix(in srgb, #22c55e 5%, var(--bg-color)); }
        .row-emotion { background: color-mix(in srgb, #ec4899 5%, var(--bg-color)); }
        .phase-list { list-style: none; padding: 0; }
        .phase-item { display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 6px; background: var(--bg-color); font-size: 14px; }
        .phase-item .num { width: 24px; height: 24px; border-radius: 50%; background: var(--primary-color); color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; flex-shrink: 0; }
        .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: 13px; }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-dot { width: 16px; height: 16px; border-radius: 4px; }
        .bp-list-item { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 8px; background: var(--bg-color); cursor: pointer; }
        .bp-list-item:hover, .bp-list-item.active { border-color: var(--primary-color); }
        .contenteditable { cursor: text; }
        .contenteditable:focus { outline: 2px solid var(--primary-color); border-radius: 4px; }
        .grid-side { display: grid; grid-template-columns: 280px 1fr; gap: 16px; }
        @media (max-width: 900px) { .grid-side { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>服务蓝图</h1>

        <div class="grid-side">
            <div>
                <div class="card">
                    <button onclick="createBlueprint()" style="width:100%;">新建服务蓝图</button>
                    <button onclick="loadDemo()" class="btn-secondary" style="width:100%;">加载示例</button>
                    <button onclick="exportBP()" class="btn-success btn-sm" style="width:100%;margin-top:8px;">导出JSON</button>
                </div>

                <div class="card">
                    <h3>蓝图列表 <span id="bpCount" style="color:var(--secondary-color)">(0)</span></h3>
                    <div id="bpList"></div>
                </div>

                <div class="card" id="bpEditor" style="display:none;">
                    <h3>阶段管理</h3>
                    <div class="form-group"><label>阶段名称</label><input type="text" id="bpPhaseName" placeholder="如：进入餐厅"></div>
                    <button onclick="addBpPhase()">+ 添加阶段</button>
                    <div id="bpPhaseList" style="margin-top:12px;"></div>
                </div>
            </div>

            <div>
                <div class="card" id="bpTitle" style="display:none;">
                    <input type="text" id="currentBpName" style="font-size:18px;font-weight:bold;border:none;border-bottom:2px solid var(--primary-color);background:transparent;color:var(--text-color);" oninput="updateBpTitle()">
                </div>

                <div class="legend" id="bpLegend" style="display:none;">
                    <div class="legend-item"><div class="legend-dot" style="background:#3b82f6;"></div>前台 (Front Stage)</div>
                    <div class="legend-item"><div class="legend-dot" style="background:#f59e0b;"></div>后台 (Back Stage)</div>
                    <div class="legend-item"><div class="legend-dot" style="background:#22c55e;"></div>支持流程</div>
                    <div class="legend-item"><div class="legend-dot" style="background:#ec4899;"></div>情绪曲线</div>
                </div>

                <div class="card blueprint-wrapper" id="bpCanvas" style="display:none;">
                    <table class="blueprint-table" id="bpTable"></table>
                </div>

                <div id="emptyState" class="card" style="text-align:center;color:var(--secondary-color);padding:60px;">
                    <p style="font-size:48px;">🏗️</p>
                    <p>选择或创建一个服务蓝图</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let blueprints = [];
        let activeBPIdx = -1;

        function toggleTheme() {
            const html = document.documentElement;
            html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
        }

        function createBlueprint() {
            blueprints.push({
                name: '新服务蓝图',
                phases: ['阶段1', '阶段2', '阶段3', '阶段4'],
                rows: {
                    customer: ['', '', '', ''],
                    frontstage: ['', '', '', ''],
                    backstage: ['', '', '', ''],
                    support: ['', '', '', ''],
                    emotions: [3, 3, 3, 3]
                },
                id: Date.now()
            });
            renderBPList();
            selectBP(blueprints.length - 1);
        }

        function renderBPList() {
            const el = document.getElementById('bpList');
            document.getElementById('bpCount').textContent = '(' + blueprints.length + ')';
            el.innerHTML = blueprints.map((b, i) => `
                <div class="bp-list-item ${i===activeBPIdx?'active':''}" onclick="selectBP(${i})">
                    <div style="flex:1;"><strong style="font-size:14px;">${esc(b.name)}</strong><div style="font-size:12px;color:var(--secondary-color);">${b.phases.length} 个阶段</div></div>
                    <button class="btn-sm btn-danger" onclick="event.stopPropagation();blueprints.splice(${i},1);if(activeBPIdx===i){activeBPIdx=-1;hideBP();}renderBPList()">×</button>
                </div>
            `).join('') || '<div style="color:var(--secondary-color);text-align:center;padding:20px;">暂无蓝图</div>';
        }

        function selectBP(i) {
            activeBPIdx = i;
            const b = blueprints[i];
            document.getElementById('currentBpName').value = b.name;
            document.getElementById('bpTitle').style.display = 'block';
            document.getElementById('bpLegend').style.display = 'flex';
            document.getElementById('bpEditor').style.display = 'block';
            document.getElementById('bpCanvas').style.display = 'block';
            document.getElementById('emptyState').style.display = 'none';
            renderBPPhaseList();
            renderBPTable();
            renderBPList();
        }

        function hideBP() {
            ['bpTitle','bpLegend','bpEditor','bpCanvas'].forEach(id => document.getElementById(id).style.display = 'none');
            document.getElementById('emptyState').style.display = 'block';
        }

        function updateBpTitle() {
            if (activeBPIdx >= 0) {
                blueprints[activeBPIdx].name = document.getElementById('currentBpName').value;
                renderBPList();
            }
        }

        function addBpPhase() {
            if (activeBPIdx < 0) return;
            const name = document.getElementById('bpPhaseName').value.trim();
            if (!name) return;
            const b = blueprints[activeBPIdx];
            b.phases.push(name);
            ['customer','frontstage','backstage','support'].forEach(k => b.rows[k].push(''));
            b.rows.emotions.push(3);
            document.getElementById('bpPhaseName').value = '';
            renderBPPhaseList();
            renderBPTable();
        }

        function removeBpPhase(i) {
            if (activeBPIdx < 0) return;
            const b = blueprints[activeBPIdx];
            if (b.phases.length <= 1) { alert('至少需要一个阶段'); return; }
            b.phases.splice(i, 1);
            ['customer','frontstage','backstage','support'].forEach(k => b.rows[k].splice(i, 1));
            b.rows.emotions.splice(i, 1);
            renderBPPhaseList();
            renderBPTable();
        }

        function renderBPPhaseList() {
            if (activeBPIdx < 0) return;
            const b = blueprints[activeBPIdx];
            document.getElementById('bpPhaseList').innerHTML = b.phases.map((p, i) => `
                <div class="phase-item"><div class="num">${i+1}</div><span style="flex:1;">${esc(p)}</span><button class="btn-sm btn-danger" onclick="removeBpPhase(${i})">×</button></div>
            `).join('');
        }

        function renderBPTable() {
            if (activeBPIdx < 0) return;
            const b = blueprints[activeBPIdx];
            const emotionEmoji = ['😢','😟','😐','🙂','😍'];
            const rowDefs = [
                { key: 'emotions', label: '😊 情绪', cls: 'row-emotion', line: '' },
                { key: 'customer', label: '👤 用户行为', cls: '', line: '' },
                { key: 'frontstage', label: '🎙️ 前台触点', cls: 'row-frontstage', line: 'line-of-interaction' },
                { key: 'backstage', label: '⚙️ 后台操作', cls: 'row-backstage', line: 'line-of-visibility' },
                { key: 'support', label: '🔧 支持流程', cls: 'row-support', line: 'line-of-internal' }
            ];

            let html = '<thead><tr><th></th>';
            b.phases.forEach((p, i) => { html += `<th class="bp-phase">${i+1}. ${esc(p)}</th>`; });
            html += '</tr></thead><tbody>';

            rowDefs.forEach(row => {
                html += `<tr class="${row.line}"><td class="bp-row-label ${row.cls}">${row.label}</td>`;
                b.phases.forEach((_, i) => {
                    html += '<td class="bp-cell">';
                    if (row.key === 'emotions') {
                        html += '<div style="display:flex;gap:4px;justify-content:center;">';
                        emotionEmoji.forEach((e, j) => {
                            html += `<span style="font-size:16px;cursor:pointer;opacity:${b.rows.emotions[i]===j?1:0.3}" onclick="setBPEmotion(${i},${j})">${e}</span>`;
                        });
                        html += '</div>';
                    } else {
                        const val = b.rows[row.key][i];
                        const isEmpty = !val || val === '点击编辑...';
                        html += `<div class="bp-item ${isEmpty?'empty':''} contenteditable="true" onblur="updateBPCell('${row.key}',${i},this.textContent)">${esc(val || '点击编辑...')}</div>`;
                    }
                    html += '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody>';
            document.getElementById('bpTable').innerHTML = html;
        }

        function setBPEmotion(phaseIdx, emotion) {
            if (activeBPIdx < 0) return;
            blueprints[activeBPIdx].rows.emotions[phaseIdx] = emotion;
            renderBPTable();
        }

        function updateBPCell(key, phaseIdx, value) {
            if (activeBPIdx < 0) return;
            blueprints[activeBPIdx].rows[key][phaseIdx] = value;
        }

        function exportBP() {
            if (activeBPIdx < 0) return;
            const blob = new Blob([JSON.stringify(blueprints[activeBPIdx], null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = blueprints[activeBPIdx].name + '.json'; a.click();
            URL.revokeObjectURL(url);
        }

        function loadDemo() {
            blueprints = [{
                name: '外卖订餐服务蓝图',
                phases: ['打开App', '浏览菜单', '下单支付', '等待配送', '收餐评价'],
                rows: {
                    customer: ['打开外卖App', '浏览餐厅和菜品', '选餐下单付款', '等待送餐到达', '用餐后评价'],
                    frontstage: ['个性化推荐展示', '菜品图片/评分展示', '订单确认推送', '实时配送地图', '评价引导弹窗'],
                    backstage: ['算法推荐计算', '商家接单通知', '支付系统处理', '骑手调度分配', '评价数据分析'],
                    support: ['推荐引擎服务', '订单管理系统', '第三方支付网关', 'GPS定位系统', 'NLP情感分析'],
                    emotions: [3, 4, 3, 1, 4]
                },
                id: 1
            }];
            renderBPList();
            selectBP(0);
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        renderBPList();
    </script>
</body>
</html>
