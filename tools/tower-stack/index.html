<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🏗️ 叠高高</title>
<meta name="description" content="叠高高游戏，精准放置方块堆叠得更高">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px;flex-direction:columnscroll-behavior:smooth;}
h1{font-size:1.5rem;margin-bottom:4px}
.info{font-size:1rem;color:#8b949e;margin-bottom:8px}
.info b{color:var(--accent);font-size:1.3rem}
canvas{border-radius:8px;touch-action:none;max-width:100%}
.hint{font-size:.8rem;color:#8b949e;margin-top:8px}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🏗️ 叠高高">
  <meta property="og:description" content="叠高高游戏，精准放置方块堆叠得更高">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/tower-stack/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1>🏗️ 叠高高</h1>
<div class="info">高度: <b id="height">0</b> | 最高: <b id="best">0</b></div>
<canvas id="game" width="400" height="500"></canvas>
<div class="hint">点击/触摸放置方块</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=400,H=500;
let blocks=[],movingBlock=null,stack=[],gameOver=false,best=0,accuracy=0;
const BLOCK_H=30,BASE_Y=H-60;
function init(){
blocks=[];stack=[];movingBlock=null;gameOver=false;accuracy=0;
stack.push({x:100,y:BASE_Y,w:200,h:BLOCK_H,color:'#3b82f6'});
createMovingBlock();
}
function createMovingBlock(){
const last=stack[stack.length-1];
const w=last.w;
movingBlock={x:-60,y:BASE_Y-stack.length*BLOCK_H,w:w,h:BLOCK_H,speed:2,dir:1,color:getColor()};
}
function getColor(){
const colors=['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#e67e22','#1abc9c','#e91e63'];
return colors[stack.length%colors.length];
}
function place(){
if(!movingBlock||gameOver)return;
const last=stack[stack.length-1];
const overlap=Math.max(0,Math.min(movingBlock.x+movingBlock.w,last.x+last.w)-Math.max(movingBlock.x,last.x));
const pct=overlap/last.w;
if(pct<=0){gameOver=true;best=Math.max(best,stack.length-1);document.getElementById('best').textContent=best;return}
const newX=Math.max(movingBlock.x,last.x);
const newW=overlap;
stack.push({x:newX,y:movingBlock.y,w:newW,h:BLOCK_H,color:movingBlock.color});
document.getElementById('height').textContent=stack.length-1;
createMovingBlock();
}
let tapCount=0;
canvas.addEventListener('click',()=>{if(!gameOver)place()});
canvas.addEventListener('touchstart',e=>{e.preventDefault();if(!gameOver)place()});
function update(){
if(gameOver||!movingBlock)return;
movingBlock.x+=movingBlock.speed*movingBlock.dir;
if(movingBlock.x+movingBlock.w>W)movingBlock.dir=-1;
if(movingBlock.x<0)movingBlock.dir=1;
}
function draw(){
ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#333';ctx.fillRect(0,BASE_Y+BLOCK_H,W,60);
stack.forEach(b=>{
ctx.fillStyle=b.color;
ctx.fillRect(b.x,b.y,b.w,b.h);
ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1;
ctx.strokeRect(b.x,b.y,b.w,b.h);
});
if(movingBlock&&!gameOver){
ctx.fillStyle=movingBlock.color;
ctx.fillRect(movingBlock.x,movingBlock.y,movingBlock.w,movingBlock.h);
ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;
ctx.strokeRect(movingBlock.x,movingBlock.y,movingBlock.w,movingBlock.h);
}
if(gameOver){
ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';ctx.textAlign='center';
ctx.fillText('游戏结束',W/2,H/2-30);
ctx.font='18px sans-serif';ctx.fillText('高度: '+(stack.length-1),W/2,H/2+10);
ctx.fillText('点击重新开始',W/2,H/2+40);
}
}
function gameLoop(){update();draw();requestAnimationFrame(gameLoop)}
canvas.addEventListener('click',e=>{
if(gameOver)init();
});
init();gameLoop();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
