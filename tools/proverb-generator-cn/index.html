<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>谚语生成器</title><meta name="description" content="随机生成中国谚语，传承智慧"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#10b981}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:20px 0 8px;font-size:1.5rem;font-weight:700}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.options{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.options select{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.9rem}.btn{display:inline-block;padding:10px 20px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;transition:.2s}.btn:hover{opacity:.85}.btn-secondary{background:var(--border);color:var(--text)}.actions{display:flex;gap:8px;justify-content:center;margin-top:16px}.proverb-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-top:16px;text-align:center}.proverb-icon{font-size:2.5rem;margin-bottom:12px}.proverb-text{font-size:1.2rem;line-height:1.8;color:var(--text);margin-bottom:12px}.proverb-source{font-size:.85rem;color:var(--text2);margin-bottom:8px}.proverb-meaning{font-size:.9rem;color:var(--accent);line-height:1.6;display:none}.proverb-card.revealed .proverb-meaning{display:block}.reveal-btn{display:inline-block;margin-top:12px;padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;transition:.2s}.reveal-btn:hover{opacity:.85}.proverb-card.revealed .reveal-btn{display:none}.proverb-tags{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}.proverb-tag{padding:3px 10px;background:var(--bg);border:1px solid var(--border);border-radius:12px;font-size:.75rem;color:var(--text2)}.counter{font-size:.8rem;color:var(--text2);margin-top:8px}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}</style><meta name="robots" content="index, follow"><meta property="og:title" content="谚语生成器"><meta property="og:description" content="随机生成中国谚语"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📜</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>📜 谚语生成器</h1><p class="sub">随机生成中国谚语，传承智慧</p>
<div class="card">
<div class="options">
<select id="category"><option value="all">全部</option><option value="life">人生</option><option value="study">学习</option><option value="work">工作</option><option value="social">社交</option><option value="nature">自然</option><option value="health">健康</option></select>
</div>
<div class="actions"><button class="btn" onclick="generate()">🎲 生成谚语</button></div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
(function(){
var proverbs=[
{c:'life',text:'千里之行，始于足下',source:'老子',meaning:'再远的路，也要从脚下第一步开始走起。比喻事情的成功是由小到大逐渐积累的。'},
{c:'life',text:'塞翁失马，焉知非福',source:'淮南子',meaning:'比喻一时虽然受到损失，但也有可能带来好处。'},
{c:'life',text:'吃一堑，长一智',source:'民间谚语',meaning:'受一次挫折，增长一分见识。'},
{c:'life',text:'种瓜得瓜，种豆得豆',source:'民间谚语',meaning:'做了什么事，就会得到什么样的结果。'},
{c:'life',text:'不经一番寒彻骨，怎得梅花扑鼻香',source:'唐·黄檗禅师',meaning:'不经历一番刺骨的寒冷，怎能有梅花扑鼻的芳香。比喻不经历艰难困苦，就不能获得成功。'},
{c:'life',text:'世上无难事，只怕有心人',source:'民间谚语',meaning:'只要下定决心去做，世界上没有什么办不到的事情。'},
{c:'life',text:'失败是成功之母',source:'民间谚语',meaning:'从失败中吸取教训，就能获得成功。'},
{c:'life',text:'有志者事竟成',source:'后汉书',meaning:'只要有志气，有决心，事情终究会成功。'},
{c:'study',text:'学而时习之，不亦说乎',source:'论语',meaning:'学习并且经常复习，不是很快乐吗？'},
{c:'study',text:'温故而知新，可以为师矣',source:'论语',meaning:'温习旧知识从而得知新的理解，凭借这一点就可以成为老师了。'},
{c:'study',text:'三人行，必有我师焉',source:'论语',meaning:'几个人一起走路，其中必定有人可以做我的老师。'},
{c:'study',text:'书山有路勤为径，学海无涯苦作舟',source:'韩愈',meaning:'在读书、学习的道路上，没有捷径可走，勤奋和刻苦是唯一的途径。'},
{c:'study',text:'百闻不如一见',source:'汉书',meaning:'听别人说一百次，不如自己亲眼见一次。'},
{c:'study',text:'活到老，学到老',source:'民间谚语',meaning:'人要不停地学习，直到生命的尽头。'},
{c:'study',text:'读书破万卷，下笔如有神',source:'杜甫',meaning:'读书多了，写文章时就能得心应手。'},
{c:'study',text:'学无止境',source:'民间谚语',meaning:'学习是没有尽头的，要不断学习新知识。'},
{c:'work',text:'业精于勤，荒于嬉',source:'韩愈',meaning:'学业或事业的精进在于勤奋，而荒废在于嬉游。'},
{c:'work',text:'一分耕耘，一分收获',source:'民间谚语',meaning:'付出一份努力，就会有一份收获。'},
{c:'work',text:'滴水穿石，非一日之功',source:'民间谚语',meaning:'水滴能把石头穿透，这不是一天的功夫。比喻力量虽小，只要坚持不懈，事情就能成功。'},
{c:'work',text:'磨刀不误砍柴工',source:'民间谚语',meaning:'事先做好充分准备，不但不会耽误时间，反而能提高效率。'},
{c:'work',text:'笨鸟先飞',source:'民间谚语',meaning:'比喻能力差的人先行动，以弥补不足。'},
{c:'work',text:'熟能生巧',source:'民间谚语',meaning:'熟练了就能掌握窍门，运用自如。'},
{c:'work',text:'只要功夫深，铁杵磨成针',source:'民间谚语',meaning:'只要有决心，肯下功夫，再难的事也能做成。'},
{c:'work',text:'心急吃不了热豆腐',source:'民间谚语',meaning:'做事不能急于求成，要循序渐进。'},
{c:'social',text:'己所不欲，勿施于人',source:'论语',meaning:'自己不想要的东西，不要强加给别人。'},
{c:'social',text:'路遥知马力，日久见人心',source:'元曲',meaning:'路途遥远才能知道马的力气大小，日子长了才能看出人心的好坏。'},
{c:'social',text:'良药苦口利于病，忠言逆耳利于行',source:'史记',meaning:'好药吃起来虽苦，却有利于治病；忠诚的告诫听起来不舒服，却有利于行事。'},
{c:'social',text:'画龙画虎难画骨，知人知面不知心',source:'民间谚语',meaning:'画龙画虎容易，但画出骨头很难；认识一个人的面貌容易，但了解他的内心很难。'},
{c:'social',text:'人心齐，泰山移',source:'民间谚语',meaning:'只要大家一心一意，就能产生巨大的力量，连泰山也能移动。'},
{c:'social',text:'近朱者赤，近墨者黑',source:'民间谚语',meaning:'接近好人可以使人变好，接近坏人可以使人变坏。'},
{c:'social',text:'在家靠父母，出门靠朋友',source:'民间谚语',meaning:'在家有父母照顾，出门在外需要朋友帮助。'},
{c:'social',text:'多个朋友多条路',source:'民间谚语',meaning:'朋友多了，路就好走了。'},
{c:'nature',text:'瑞雪兆丰年',source:'民间谚语',meaning:'冬天下大雪，来年一定会有好收成。'},
{c:'nature',text:'春捂秋冻',source:'民间谚语',meaning:'春天不要急于脱衣服，秋天不要急于加衣服。'},
{c:'nature',text:'早霞不出门，晚霞行千里',source:'民间谚语',meaning:'早上有霞会下雨，傍晚有霞则是好天气。'},
{c:'nature',text:'朝霞不出门，晚霞行千里',source:'民间谚语',meaning:'早上有霞会下雨，傍晚有霞则是好天气。'},
{c:'nature',text:'一场秋雨一场寒',source:'民间谚语',meaning:'每下一场秋雨，天气就会变冷一些。'},
{c:'nature',text:'燕子低飞蛇过道，大雨不久就来到',source:'民间谚语',meaning:'燕子低飞、蛇过道，预示着即将下雨。'},
{c:'nature',text:'朝雾晴，晚雾雨',source:'民间谚语',meaning:'早上有雾是晴天，晚上有雾会下雨。'},
{c:'nature',text:'雷公先唱歌，有雨也不多',source:'民间谚语',meaning:'先打雷后下雨，雨量不会太大。'},
{c:'health',text:'饭后百步走，活到九十九',source:'民间谚语',meaning:'饭后适当散步，有利于健康长寿。'},
{c:'health',text:'病从口入，祸从口出',source:'民间谚语',meaning:'疾病多由饮食不洁引起，灾祸多由言语不当招致。'},
{c:'health',text:'早睡早起身体好',source:'民间谚语',meaning:'养成良好的作息习惯，有利于身体健康。'},
{c:'health',text:'冬吃萝卜夏吃姜，不劳医生开药方',source:'民间谚语',meaning:'萝卜和姜对身体有好处，合理饮食可以预防疾病。'},
{c:'health',text:'生命在于运动',source:'民间谚语',meaning:'经常运动才能保持身体健康。'},
{c:'health',text:'笑一笑，十年少',source:'民间谚语',meaning:'保持愉快的心情，人就会显得年轻。'},
{c:'health',text:'药补不如食补',source:'民间谚语',meaning:'食疗比药物补品更好。'},
{c:'health',text:'怒伤肝，思伤脾',source:'黄帝内经',meaning:'愤怒伤肝，忧思伤脾。情绪对身体有直接影响。'}
];
var count=0;
function generate(){
var cat=document.getElementById('category').value;
var filtered=cat==='all'?proverbs:proverbs.filter(function(p){return p.c===cat});
var proverb=filtered[Math.floor(Math.random()*filtered.length)];
count++;
var catNames={life:'人生',study:'学习',work:'工作',social:'社交',nature:'自然',health:'健康'};
document.getElementById('result').innerHTML='<div class="proverb-card" id="proverbCard"><div class="proverb-icon">📜</div><div class="proverb-text">"'+proverb.text+'"</div><div class="proverb-source">—— '+proverb.source+'</div><div class="proverb-meaning">'+proverb.meaning+'</div><button class="reveal-btn" onclick="document.getElementById(\'proverbCard\').classList.add(\'revealed\')">查看释义</button><div class="proverb-tags"><span class="proverb-tag">'+catNames[proverb.c]+'</span></div><div class="counter">已生成 '+count+' 条谚语</div></div>';
}
})();
</script></body></html>
