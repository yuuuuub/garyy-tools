<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON 转 CSV 工具 V2 | JSON to CSV</title>
<meta property="og:title" content="JSON 转 CSV 工具 V2 | JSON to CSV">
<meta property="og:description" content="JSON 转 CSV 工具 V2 | JSON to CSV - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="JSON转CSV工具，将JSON数组数据快速转换为CSV表格，支持自定义分隔符和编码">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<script src="../i18n.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--border:#30363d;--text:#c9d1d9;--text-secondary:#8b949e;--accent:#58a6ff;--accent-hover:#79c0ff;--green:#3fb950;--green-bg:rgba(63,185,80,.15);--red:#f85149;--red-bg:rgba(248,81,73,.15);--cyan:#39d2c0;--radius:8px;--radius-sm:6px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--bg-secondary:#fff;--bg-tertiary:#f0f2f5;--border:#d0d7de;--text:#1f2328;--text-secondary:#656d76;--accent:#0969da;--accent-hover:#0550ae;--green:#1a7f37;--green-bg:rgba(26,127,55,.1);--red:#cf222e;--red-bg:rgba(207,34,46,.1);--cyan:#0598bc}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;padding:16px}
.container{max-width:1200px;margin:0 auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{text-align:center;color:var(--text-secondary);font-size:.85rem;margin-bottom:20px}
.toolbar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.btn{padding:8px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);cursor:pointer;font-size:.82rem;transition:var(--transition)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:calc(100vh - 200px)}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.panel{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.panel-header{padding:8px 12px;border-bottom:1px solid var(--border);font-size:.8rem;color:var(--text-secondary);display:flex;justify-content:space-between;align-items:center}
textarea.code-input{width:100%;flex:1;min-height:400px;padding:12px;border:none;background:var(--bg);color:var(--text);font-family:'Fira Code',Consolas,monospace;font-size:.85rem;line-height:1.6;resize:none;outline:none;tab-size:2}
.output-area{flex:1;overflow:auto;padding:12px;font-family:'Fira Code',Consolas,monospace;font-size:.85rem;line-height:1.6;min-height:400px;white-space:pre-wrap;word-break:break-all}
.tabs{display:flex;border-bottom:1px solid var(--border);gap:0}
.tab{padding:8px 16px;font-size:.8rem;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;transition:var(--transition)}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.info-bar{font-size:.75rem;color:var(--text-secondary)}
.options{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding:10px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.82rem;align-items:center}
.options label{display:flex;align-items:center;gap:4px;color:var(--text-secondary)}
.error-msg{color:var(--red);font-size:.85rem;padding:12px;background:var(--red-bg);border:1px solid var(--red);border-radius:var(--radius-sm);margin-bottom:12px;display:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:8px 20px;border-radius:var(--radius);font-size:.85rem;opacity:0;transition:.3s;z-index:100}
.toast.show{opacity:1}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--bg-secondary);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>📊 JSON 转 CSV V2</h1>
<p class="sub">JSON数组数据转换为CSV表格，支持多种输出格式</p>
<div id="error" class="error-msg"></div>
<div class="options">
<label>分隔符:
<select id="delimiter" style="padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg-tertiary);color:var(--text);font-size:.8rem">
<option value=",">, (逗号)</option>
<option value="	">	 (Tab)</option>
<option value=";">; (分号)</option>
<option value="|">| (管道)</option>
</select>
</label>
<label><input type="checkbox" id="includeEmpty" checked> 包含空值</label>
<label><input type="checkbox" id="flattenNested" checked> 展平嵌套</label>
</div>
<div class="toolbar">
<button class="btn btn-primary" onclick="convert()">🔄 转换</button>
<button class="btn" onclick="loadSample()">📋 示例数据</button>
<button class="btn" onclick="clearAll()">🗑️ 清空</button>
<div class="sep"></div>
<button class="btn btn-green" onclick="copyOutput()">📋 复制</button>
<button class="btn" onclick="downloadCSV()">📥 下载CSV</button>
</div>
<div class="layout">
<div class="panel">
<div class="panel-header"><span>输入 JSON</span><span class="info-bar" id="inputInfo"></span></div>
<textarea class="code-input" id="input" placeholder='粘贴JSON数组数据，例如：
[
  {"name":"张三","age":25,"city":"北京"},
  {"name":"李四","age":30,"city":"上海"},
  {"name":"王五","age":28,"city":"广州"}
]'></textarea>
</div>
<div class="panel">
<div class="panel-header"><span>输出</span><span class="info-bar" id="outputInfo"></span></div>
<div class="tabs">
<div class="tab active" onclick="showTab(0)">CSV</div>
<div class="tab" onclick="showTab(1)">Markdown表格</div>
<div class="tab" onclick="showTab(2)">TSV</div>
</div>
<div class="output-area" id="output"><span style="color:var(--text-secondary)">点击"转换"将JSON转为CSV</span></div>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
var csvData='',currentTab=0,jsonRows=[];
function showError(msg){var e=document.getElementById('error');e.textContent=msg;e.style.display='block';setTimeout(function(){e.style.display='none'},5000)}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
function flattenObj(obj,prefix){
var result={};
Object.keys(obj).forEach(function(k){
var key=prefix?prefix+'.'+k:k;
var val=obj[k];
if(typeof val==='object'&&val!==null&&!Array.isArray(val)){
Object.assign(result,flattenObj(val,key));
}else{result[key]=val;}
});
return result;
}
function convert(){
var text=document.getElementById('input').value.trim();
if(!text){showError('请输入JSON数据');return;}
try{
var data=JSON.parse(text);
if(!Array.isArray(data))data=[data];
if(!data.length){showError('JSON数组为空');return;}
var flatten=document.getElementById('flattenNested').checked;
if(flatten)data=data.map(function(r){return flattenObj(r)});
jsonRows=data;
var keys=[];data.forEach(function(row){Object.keys(row).forEach(function(k){if(keys.indexOf(k)===-1)keys.push(k);})});
var delimiter=document.getElementById('delimiter').value;
var includeEmpty=document.getElementById('includeEmpty').checked;
csvData=keys.join(delimiter)+'\n'+data.map(function(row){
return keys.map(function(k){
var v=row[k];
if(v===null||v===undefined)return includeEmpty?'':'';
v=String(v);
if(v.indexOf(delimiter)>-1||v.indexOf('"')>-1||v.indexOf('\n')>-1)v='"'+v.replace(/"/g,'""')+'"';
return v;
}).join(delimiter);
}).join('\n');
document.getElementById('inputInfo').textContent=data.length+'条记录';
document.getElementById('outputInfo').textContent=keys.length+'列 × '+data.length+'行';
showTab(0);
document.getElementById('error').style.display='none';
toast('转换成功');
}catch(e){showError('JSON解析失败: '+e.message)}
}
function showTab(t){
currentTab=t;
document.querySelectorAll('.tabs .tab').forEach(function(b,i){b.classList.toggle('active',i===t);});
if(!csvData){return;}
var rows=csvData.split('\n');
if(t===0){document.getElementById('output').textContent=csvData;}
else if(t===1){
var headers=rows[0].split(document.getElementById('delimiter').value);
var md='| '+headers.join(' | ')+' |\n| '+headers.map(function(){return '---';}).join(' | ')+' |';
rows.slice(1).forEach(function(r){md+='\n| '+r.split(document.getElementById('delimiter').value).join(' | ')+' |';});
document.getElementById('output').textContent=md;
}else{
document.getElementById('output').textContent=rows.map(function(r){return r.replace(/,/g,'\t');}).join('\n');
}
}
function loadSample(){
document.getElementById('input').value=JSON.stringify([
{name:'张三',age:25,city:'北京',score:92,active:true},
{name:'李四',age:30,city:'上海',score:88,active:true},
{name:'王五',age:28,city:'广州',score:95,active:false},
{name:'赵六',age:35,city:'深圳',score:78,active:true},
{name:'钱七',age:22,city:'杭州',score:91,active:true}
],null,2);
convert();
}
function clearAll(){document.getElementById('input').value='';document.getElementById('output').innerHTML='<span style="color:var(--text-secondary)">点击"转换"将JSON转为CSV</span>';csvData='';jsonRows=[];document.getElementById('inputInfo').textContent='';document.getElementById('outputInfo').textContent=''}
function copyOutput(){navigator.clipboard.writeText(document.getElementById('output').textContent).then(function(){toast('已复制到剪贴板')})}
function downloadCSV(){
var blob=new Blob(['\ufeff'+document.getElementById('output').textContent],{type:'text/csv;charset=utf-8'});
var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data.csv';a.click();
}
</script>
</body>
</html>
