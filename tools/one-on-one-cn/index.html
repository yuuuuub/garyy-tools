<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一对一会议</title>
<meta name="description" content="一对一会议工具 - 高效管理管理者与团队成员的一对一沟通">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a371f7;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.85rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:5px 12px;font-size:.8rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
input,textarea,select{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;margin-bottom:8px}
textarea{resize:vertical;min-height:60px}
label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem;color:var(--text2)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.hidden{display:none!important}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:550px;max-height:80vh;overflow-y:auto}
.meeting-list{display:grid;gap:12px}
.meeting-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:all .2s}
.meeting-card:hover{border-color:var(--accent)}
.meeting-card.expanded{border-color:var(--accent)}
.meeting-header{display:flex;justify-content:space-between;align-items:center}
.meeting-person{font-weight:700;font-size:1rem}
.meeting-date{font-size:.8rem;color:var(--text2)}
.section-title{font-weight:700;font-size:.9rem;margin:16px 0 8px;color:var(--text2);display:flex;align-items:center;gap:6px}
.topic-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg);border-radius:8px;margin-bottom:6px}
.topic-text{font-size:.9rem}
.topic-done{color:var(--green);font-size:.85rem}
.mood-selector{display:flex;gap:6px;margin:8px 0}
.mood-btn{width:36px;height:36px;border:2px solid var(--border);border-radius:50%;background:var(--bg);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.mood-btn:hover{border-color:var(--accent)}
.mood-btn.active{border-color:var(--accent);background:var(--accent);transform:scale(1.1)}
.note-text{font-size:.9rem;line-height:1.6;white-space:pre-wrap}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.75rem;font-weight:600;margin:2px}
.tag-green{background:rgba(63,185,80,.2);color:var(--green)}
.tag-yellow{background:rgba(210,153,34,.2);color:var(--yellow)}
.tag-red{background:rgba(248,81,73,.2);color:var(--red)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.stat-card{text-align:center;padding:16px;background:var(--bg);border-radius:8px}
.stat-num{font-size:2rem;font-weight:700}
.stat-label{font-size:.8rem;color:var(--text2);margin-top:4px}
@media(max-width:600px){h1{font-size:1.4rem}.stats-grid{grid-template-columns:repeat(2,1fr)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='💬 一对一会议';
const APP=document.getElementById('app');
let data=JSON.parse(localStorage.getItem('o2o_data')||'{"meetings":[],"templates":["工作进展","职业发展","困难与障碍","反馈与建议","个人状态"]}');

function save(){localStorage.setItem('o2o_data',JSON.stringify(data))}

function render(){
  let h=`<h1>💬 一对一会议</h1><p class="subtitle">高效管理一对一沟通</p>`;
  const total=data.meetings.length;
  const thisMonth=data.meetings.filter(m=>{const d=new Date(m.date);const now=new Date();return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()}).length;

  h+=`<div class="stats-grid">`;
  h+=`<div class="stat-card"><div class="stat-num" style="color:var(--accent)">${total}</div><div class="stat-label">总会谈数</div></div>`;
  h+=`<div class="stat-card"><div class="stat-num" style="color:var(--green)">${thisMonth}</div><div class="stat-label">本月会谈</div></div>`;
  h+=`<div class="stat-card"><div class="stat-num" style="color:var(--purple)">${new Set(data.meetings.map(m=>m.person)).size}</div><div class="stat-label">会谈人数</div></div>`;
  h+=`</div>`;

  h+=`<div class="card"><div class="flex-between"><b>📋 议题模板</b><button class="btn btn-sm btn-outline" onclick="addTemplate()">+ 添加</button></div><div class="flex" style="margin-top:8px">`;
  data.templates.forEach((t,i)=>{
    h+=`<span class="tag tag-green">${t} <span style="cursor:pointer;margin-left:4px" onclick="delTemplate(${i})">✕</span></span>`;
  });
  h+=`</div></div>`;

  h+=`<div class="flex-between" style="margin:16px 0 12px"><b style="font-size:1.1rem">📅 会谈记录</b><button class="btn btn-sm" onclick="addMeeting()">+ 新建会谈</button></div>`;

  if(!data.meetings.length) h+=`<div class="card" style="text-align:center;color:var(--text2);padding:40px">暂无会谈记录</div>`;

  data.meetings.forEach((m,i)=>{
    h+=`<div class="meeting-card"><div class="meeting-header"><div><span class="meeting-person">${m.person}</span><span style="margin-left:8px">${m.mood||'😊'}</span></div><div class="flex"><span class="meeting-date">${m.date}</span><button class="btn btn-sm btn-danger" onclick="delMeeting(${i})">删除</button></div></div>`;
    if(m.topics&&m.topics.length){
      h+=`<div class="section-title">📝 议题</div>`;
      m.topics.forEach(t=>{h+=`<div class="topic-item"><span class="topic-text">${t.text}</span><span class="topic-done">${t.done?'✅':'⬜'}</span></div>`});
    }
    if(m.notes){h+=`<div class="section-title">📄 笔记</div><div class="note-text">${m.notes}</div>`}
    if(m.actionItems&&m.actionItems.length){
      h+=`<div class="section-title">🎯 行动项</div>`;
      m.actionItems.forEach(a=>{h+=`<div class="topic-item"><span class="topic-text">${a.done?'✅':'⬜'} ${a.text}</span></div>`});
    }
    h+=`</div>`;
  });
  APP.innerHTML=h;
}

function addMeeting(){
  const m=document.createElement('div');m.className='modal-overlay';m.innerHTML=`<div class="modal"><h3 style="margin-bottom:16px">💬 新建会谈</h3>
    <label>会谈对象</label><input id="mp" placeholder="姓名">
    <label>日期</label><input id="md" type="date" value="${new Date().toISOString().split('T')[0]}">
    <label>心情</label><div class="mood-selector">${['😊','😐','😟','😤','🎉'].map(e=>`<button type="button" class="mood-btn" onclick="selectMood(this,'${e}')">${e}</button>`).join('')}</div>
    <input type="hidden" id="mmood" value="😊">
    <label>议题（每行一个）</label><textarea id="mtopics" placeholder="议题1\n议题2">${data.templates.join('\n')}</textarea>
    <label>笔记</label><textarea id="mnotes" placeholder="会议笔记..."></textarea>
    <label>行动项（每行一个）</label><textarea id="mactions" placeholder="行动1\n行动2"></textarea>
    <div class="flex" style="justify-content:flex-end;margin-top:12px"><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
    <button class="btn btn-success" onclick="saveMeeting()">保存</button></div></div>`;
  document.body.appendChild(m);
}
function selectMood(el,mood){document.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.getElementById('mmood').value=mood}
function saveMeeting(){
  const person=document.getElementById('mp').value.trim();if(!person){alert('请输入姓名');return}
  const date=document.getElementById('md').value;
  const mood=document.getElementById('mmood').value;
  const topics=document.getElementById('mtopics').value.split('\n').filter(t=>t.trim()).map(t=>({text:t.trim(),done:false}));
  const notes=document.getElementById('mnotes').value.trim();
  const actionItems=document.getElementById('mactions').value.split('\n').filter(a=>a.trim()).map(a=>({text:a.trim(),done:false}));
  data.meetings.push({person,date,mood,topics,notes,actionItems});
  save();document.querySelector('.modal-overlay').remove();render();
}
function delMeeting(i){if(confirm('删除此会谈记录？')){data.meetings.splice(i,1);save();render()}}
function addTemplate(){const t=prompt('新议题模板：');if(t){data.templates.push(t.trim());save();render()}}
function delTemplate(i){data.templates.splice(i,1);save();render()}
render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
