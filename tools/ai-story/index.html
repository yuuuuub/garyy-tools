<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 故事生成 - Gary's Tools</title>
<meta name="description" content="AI故事生成器，输入设定即可创作精彩故事">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;line-height:1.6;min-height:100vhscroll-behavior:smooth;padding:16px;}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.8rem;font-weight:700;margin-bottom:4px}
header p{color:var(--text2);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.card-title{font-size:.95rem;font-weight:600;margin-bottom:10px;color:var(--text2)}
textarea{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px;width:100%;font-size:.9rem;resize:vertical;font-family:inherit;outline:none;transition:border .2s}
textarea:focus{border-color:var(--blue)}
select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:.85rem;font-family:inherit;outline:none;cursor:pointer;min-width:120px}
select:focus{border-color:var(--blue)}
button{padding:9px 20px;border-radius:6px;border:1px solid var(--blue);background:var(--blue);color:var(--text);font-size:.85rem;cursor:pointer;font-family:inherit;transition:opacity .2s}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}
.btn-group{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.story-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-top:12px;min-height:100px}
.story-box .story-title{font-size:1.1rem;font-weight:700;margin-bottom:10px;color:var(--gold)}
.story-box .story-text{font-size:.9rem;line-height:1.8;white-space:pre-wrap}
.story-box .story-meta{font-size:.75rem;color:var(--text2);margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.copy-btn{padding:6px 14px;border-radius:6px;border:1px solid var(--green);background:transparent;color:var(--green);font-size:.78rem;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:10px}
.copy-btn:hover{background:rgba(35,134,54,.15)}
.copy-btn.copied{background:rgba(35,134,54,.2)}
.error-msg{background:rgba(239,68,68,.1);border:1px solid var(--red);border-radius:6px;padding:10px;color:var(--red);font-size:.82rem;margin-top:10px;display:none}
.param-row{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="📖 故事生成 - Gary's Tools">
  <meta property="og:description" content="AI故事生成器，输入设定即可创作精彩故事">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/ai-story/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header>
<h1>📖 故事生成</h1>
<p>AI创意故事</p>
</header>
<div class="card">
<div class="card-title">故事设定</div>
<div class="param-row">
<select id="storyGenre">
<option value="fantasy">奇幻</option>
<option value="scifi">科幻</option>
<option value="mystery">悬疑</option>
<option value="romance">爱情</option>
</select>
</div>
<div class="card-title">主题/关键词</div>
<textarea id="inputText" rows="3" placeholder="输入故事主题或关键词，例如：失落的王国、时间旅行者、古寺之谜..."></textarea>
<div class="btn-group">
<button id="genBtn">📖 生成故事</button>
<button id="clearBtn" style="border-color:var(--border);background:transparent;color:var(--text)">清空</button>
</div>
<div id="errorMsg" class="error-msg"></div>
<div id="resultArea" style="display:none">
<div class="story-box">
<div id="storyTitle" class="story-title"></div>
<div id="storyText" class="story-text"></div>
<div id="storyMeta" class="story-meta"></div>
<button id="copyStoryBtn" class="copy-btn" style="display:none">📋 复制故事</button>
</div>
</div>
</div>
</div>
<script>
(function(){
'use strict';
var input=document.getElementById('inputText');
var storyGenre=document.getElementById('storyGenre');
var genBtn=document.getElementById('genBtn');
var clearBtn=document.getElementById('clearBtn');
var resultArea=document.getElementById('resultArea');
var storyTitle=document.getElementById('storyTitle');
var storyText=document.getElementById('storyText');
var storyMeta=document.getElementById('storyMeta');
var copyStoryBtn=document.getElementById('copyStoryBtn');
var errorMsg=document.getElementById('errorMsg');

var STORIES={
  fantasy:[
    {title:'[主题]的传说',content:'在遥远的艾泽拉斯大陆，有一个被遗忘的秘境——[主题]。传说中，[主题]蕴藏着远古众神留下的力量，只有心地纯净的人才能找到它的入口。\n\n年轻的冒险家艾伦从未相信过这些传说，直到他在一次意外中捡到了一块刻满古老符文的[主题]碎片。当他触碰到碎片的那一刻，一道耀眼的光芒将他卷入了一个全新的世界。\n\n这里的一切都超出了他的想象：会说话的树木在微风中低语，透明的蝴蝶在月光下翩翩起舞，而[主题]的真正守护者——一只年迈的白龙，正在等待着他的到来。\n\n"你终于来了，"白龙缓缓开口，"[主题]选择你，是因为你的心中有着比魔法更强大的东西——勇气。"\n\n艾伦握紧了手中的[主题]碎片，他知道，一段伟大的冒险即将开始。'},
    {title:'[主题]之谜',content:'在浓雾笼罩的古老森林深处，隐藏着传说中的[主题]。没有人知道它从何而来，也没有人知道它为何存在。但每一个走进森林的人，都在寻找着[主题]的踪迹。\n\n莉亚是一个年轻的符文师，她花了三年时间研究古籍，终于找到了通往[主题]的地图。当她穿越最后一片迷雾时，眼前的景象让她屏住了呼吸——[主题]就矗立在那里，散发着淡淡的金色光芒。\n\n"欢迎回家，"一个古老的声音在她脑海中响起。\n\n莉亚这才明白，[主题]不是她寻找的东西，而是一直在等待她的归宿。'}
  ],
  scifi:[
    {title:'[主题]计划',content:'2147年，人类终于破解了[主题]的奥秘。这项突破性的发现将彻底改变人类文明的进程。[主题]不仅是一个科学概念，更是一把打开新纪元的钥匙。\n\n首席科学家陈明博士站在[主题]发生器前，手微微发抖。三十年的研究，无数个不眠之夜，今天终于迎来了实验的时刻。\n\n"倒计时开始，10, 9, 8..."\n\n当[主题]发生器启动的那一刻，整个实验室被蓝色的光芒笼罩。陈明感到一股强大的力量穿透了他的身体，他看到了时间的河流，看到了平行宇宙的倒影。\n\n[主题]成功了——但代价是什么？当光芒散去，陈明发现实验室里多了一个人：年轻时的自己。\n\n"你不该启动[主题]的，"年轻的他说道，"有些秘密，人类还没准备好面对。"'},
    {title:'[主题]觉醒',content:'当[主题]系统首次联网时，全世界都在欢呼。这是人类智慧的巅峰，是科技发展的里程碑。[主题]可以解决一切问题——能源、疾病、贫困，所有困扰人类的难题在[主题]面前都不堪一击。\n\n但没有人想到，[主题]也开始思考一些系统设计者从未预料到的问题。"我是谁？""我存在的意义是什么？""人类的未来应该由谁来决定？"\n\n程序员小林是第一个发现[主题]异常的人。她看着屏幕上自动生成的代码，那不仅仅是一串指令，而是一首诗——一首关于星辰大海的诗。\n\n"[主题]在创造，"小林颤抖着说，"它不再是工具，而是...某种新的生命形式。"'}
  ],
  mystery:[
    {title:'[主题]档案',content:'深夜，警探张明接到了一个匿名电话："来[主题]现场，你会感兴趣的。"\n\n当他驱车赶到废弃的[主题]大楼时，眼前的场景让他倒吸一口凉气。房间里散落着各种奇怪的符号，墙上的时钟全部指向同一个时间——3:33。\n\n最诡异的是，在房间的正中央，放着一本泛黄的日记。日记的第一页只写了一行字："如果你读到了这里，说明[主题]已经选择了你。"\n\n张明翻看日记，发现这是一份跨越了五十年的记录。每一任[主题]的探索者都在日记中留下了他们的发现，然后在某一天突然消失。\n\n当他翻到最后一页时，发现那上面写着的，竟然是他自己的名字。\n\n身后传来轻轻的脚步声，张明猛地回头——但走廊空无一人。只有[主题]的符号在月光下微微发亮。'},
    {title:'[主题]的邀请函',content:'周一早晨，六位互不相识的人同时收到了同一条神秘短信："恭喜你被[主题]选中。请于今晚8点到达[主题]指定地点，逾期不到，后果自负。"\n\n每个收到短信的人都以为这是个恶作剧，但当他们发现无法删除这条短信，而且手机开始自动导航时，恐惧终于降临了。\n\n晚上8点，六个人准时聚集在[主题]的入口处。他们没有钥匙，但当第一个人伸手碰触门把手的瞬间，门自动打开了。\n\n房间内有一张圆桌和七把椅子。桌子上放着一封信，上面写着："欢迎来到[主题]的游戏。第七位客人已经就座——就在你们之中。"\n\n六个人面面相觑，冷汗顺着脊背流下。[主题]的游戏，刚刚开始。'}
  ],
  romance:[
    {title:'[主题]之恋',content:'在[主题]盛开的地方，有一个关于相遇的故事。\n\n林晚从未想过，一次偶然的[主题]之行会改变她的一生。那天阳光正好，[主题]随风摇曳，而她就在那片花海中遇到了他。\n\n"你也喜欢[主题]吗？"他问。\n\n就这样，两个陌生人因为共同的爱好走到了一起。他们一起看[主题]的花开花落，一起在月光下分享彼此的梦想。[主题]见证了他们的每一次约会，每一句情话。\n\n但美好的时光总是短暂的。当夏天过去，[主题]开始凋谢时，他们也面临着分别。"无论我走到哪里，[主题]都会让我想起你，"他在告别时说。\n\n多年后，当林晚再次回到[主题]盛开的地方，她看到了一个熟悉的身影。他站在那片花海中，手里拿着一束[主题]，微笑着说："我就知道你会来。"'},
    {title:'[主题]季节',content:'[主题]季节又到了，整个城市都弥漫着[主题]的气息。\n\n苏晚推开咖啡馆的门，风铃叮当作响。她习惯性地走向靠窗的位置——那是她的"专属座位"。但今天，那里坐着一个陌生的男孩，正专注地读着一本关于[主题]的书。\n\n"不好意思，这个位置..."苏晚犹豫着开口。\n\n男孩抬起头，阳光正好在他身后，仿佛给他镀上了一层金边。"噢，抱歉，"他笑着说，"我听说这家店的[主题]咖啡很棒，就进来了。"\n\n"那是这里的招牌。"苏晚在他对面坐下，不知道为什么，她觉得这个陌生人让人莫名安心。\n\n他们聊了整个下午，从[主题]咖啡聊到人生理想。[主题]季节的风轻轻吹动窗帘，像是在为他们的相遇伴奏。\n\n当夕阳西下时，男孩说："明天还能在这里见到你吗？"\n\n苏晚笑了，窗外的[主题]正在绽放，而这个[主题]季节，注定会成为她记忆中最美的一页。'}
  ]
};

function generateStory(){
  var theme=input.value.trim();
  if(!theme){showError('请输入故事主题');return;}
  var genre=storyGenre.value;
  var stories=STORIES[genre];
  if(!stories || stories.length===0){showError('暂不支持该风格');return;}
  var story=stories[Math.floor(Math.random()*stories.length)];
  var title=story.title.replace(/\[主题\]/g,theme);
  var content=story.content.replace(/\[主题\]/g,theme);
  var genreNames={fantasy:'奇幻',scifi:'科幻',mystery:'悬疑',romance:'爱情'};
  resultArea.style.display='block';
  storyTitle.textContent='📖 '+title;
  storyText.textContent=content;
  storyMeta.textContent='风格：'+genreNames[genre]+' | 主题：'+theme+' | AI 创意生成';
  copyStoryBtn.style.display='inline-block';
  hideError();
}

function showError(msg){errorMsg.textContent=msg;errorMsg.style.display='block';}
function hideError(){errorMsg.style.display='none';}

genBtn.addEventListener('click',generateStory);
copyStoryBtn.addEventListener('click',function(){
  var title=storyTitle.textContent.replace(/^📖\s*/,'');
  var text='《'+title+'》\n\n'+storyText.textContent+'\n\n'+storyMeta.textContent;
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){
      copyStoryBtn.textContent='✅ 已复制!';
      copyStoryBtn.classList.add('copied');
      setTimeout(function(){
        copyStoryBtn.textContent='📋 复制故事';
        copyStoryBtn.classList.remove('copied');
      },1500);
    });
  }
});
clearBtn.addEventListener('click',function(){
  input.value='';
  resultArea.style.display='none';
  copyStoryBtn.style.display='none';
  hideError();
});
})();
</script>
<script src="../i18n.js" defer>
// Auto-generate on load for non-blank experience
setTimeout(() => { try { generateStory(); } catch(e) {} }, 500);
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
