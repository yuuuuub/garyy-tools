<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国剪纸艺术</title><meta name="description" content="中国剪纸艺术 - 在线欣赏中国剪纸"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#d4a017;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#b8860b}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;cursor:pointer;transition:transform .2s}.item:hover{transform:translateY(-2px)}.item-title{font-size:1.2rem;font-weight:600;color:var(--gold);margin-bottom:8px}.item-meta{font-size:.9rem;color:var(--text2);margin-bottom:4px}.item-display{font-size:3rem;text-align:center;padding:30px;background:var(--bg);border-radius:8px;margin-bottom:12px;min-height:100px;display:flex;align-items:center;justify-content:center}.item-desc{font-size:.9rem;color:var(--text)}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{display:inline-block;padding:6px 14px;background:var(--bg);border:1px solid var(--border);border-radius:20px;color:var(--text2);font-size:.85rem;cursor:pointer;transition:all .2s}.btn:hover{border-color:var(--blue);color:var(--blue)}.btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center}.modal-overlay.show{display:flex}.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:700px;width:90%;max-height:80vh;overflow-y:auto;position:relative}.modal h2{color:var(--gold);margin-bottom:12px}.modal p{color:var(--text2);line-height:1.8;margin-bottom:12px}.close-btn{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--text2);font-size:1.5rem;cursor:pointer}.theme-toggle{position:fixed;top:8px;right:80px;z-index:9999;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 12px;cursor:pointer;color:var(--text);font-size:.75rem}.canvas-area{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;text-align:center}.canvas-area canvas{border:1px dashed var(--border);cursor:crosshair;max-width:100%}.tools-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}</style><meta property="og:title" content="中国剪纸艺术"><meta property="og:description" content="中国剪纸艺术 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✂️</text></svg>"></head><body>
<button class="theme-toggle" onclick="toggleTheme()">🌓</button>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>✂️ 中国剪纸艺术</h1><p class="sub">在线欣赏与体验中国剪纸</p>
<div class="card"><h3 style="margin-bottom:12px;color:var(--gold)">🎨 剪纸体验</h3>
<div class="canvas-area">
<canvas id="paperCanvas" width="400" height="400"></canvas>
<div class="tools-row">
<button class="btn" onclick="setTool('cut')">✂️ 剪纸</button>
<button class="btn" onclick="setTool('draw')">✏️ 画线</button>
<button class="btn" onclick="clearCanvas()">🗑️ 清空</button>
<button class="btn" onclick="downloadPaper()">💾 保存</button>
<button class="btn" onclick="toggleMirror()">🪞 镜像</button>
</div>
<p style="margin-top:8px;font-size:.8rem;color:var(--text2)">点击"镜像"后剪纸，体验对称剪纸效果</p>
</div></div>
<div class="card"><div class="search-box"><input type="text" id="searchInput" placeholder="搜索剪纸作品..." oninput="filterItems()"></div>
<div class="btn-group"><button class="btn active" onclick="filterByType('all',this)">全部</button><button class="btn" onclick="filterByType('春节',this)">春节</button><button class="btn" onclick="filterByType('婚庆',this)">婚庆</button><button class="btn" onclick="filterByType('生肖',this)">生肖</button><button class="btn" onclick="filterByType('花鸟',this)">花鸟</button><button class="btn" onclick="filterByType('人物',this)">人物</button></div></div>
<div id="itemList"></div></div>
<div class="modal-overlay" id="modal"><div class="modal"><button class="close-btn" onclick="closeModal()">×</button><h2 id="modalTitle"></h2><div id="modalDisplay" class="item-display"></div><p id="modalMeta"></p><p id="modalDesc"></p><p id="modalDetail" style="padding-top:12px;border-top:1px solid var(--border);margin-top:8px"></p></div></div>
<script src="../i18n.js" defer></script>
<script>
var items=[
  {title:'连年有余',type:'春节',emoji:'🐟',desc:'以莲花和鲤鱼为题材，寓意"连年有余"，是春节最常见的剪纸题材之一。',detail:'连年有余是中国传统吉祥图案，"莲"与"连"谐音，"鱼"与"余"谐音，寓意生活富足、年年有余。'},
  {title:'龙凤呈祥',type:'婚庆',emoji:'🐉',desc:'婚庆剪纸的经典题材，龙凤相配，寓意夫妻和谐、幸福美满。',detail:'龙凤呈祥是中式婚礼中最重要的装饰图案，象征阴阳和谐、夫妻恩爱。剪纸中的龙凤造型讲究对称平衡。'},
  {title:'十二生肖',type:'生肖',emoji:'🐲',desc:'以十二生肖为题材的剪纸系列，每个生肖都有独特的寓意和造型。',detail:'十二生肖剪纸是中国民间最常见的剪纸题材，每年春节都会有当年生肖的剪纸出售，寓意吉祥如意。'},
  {title:'喜鹊登梅',type:'花鸟',emoji:'🐦',desc:'喜鹊站在梅枝上，寓意"喜上眉梢"，是春节和婚庆常用的吉祥图案。',detail:'喜鹊在中国文化中象征喜事，梅花象征高洁。喜鹊登梅图案表达了对美好事物的期盼。'},
  {title:'抓髻娃娃',type:'人物',emoji:'👶',desc:'陕北剪纸的代表作品，抓髻娃娃是中国古老的生育崇拜符号，寓意多子多福。',detail:'抓髻娃娃是黄河流域民间剪纸的典型题材，造型古朴，具有原始生殖崇拜的文化内涵。'},
  {title:'春字剪纸',type:'春节',emoji:'🧧',desc:'将"春"字与各种吉祥图案结合的剪纸，是春节门窗装饰的必备品。',detail:'春字剪纸历史悠久，最早可追溯到汉代。人们在春节期间将春字剪纸贴在门窗上，迎接春天的到来。'},
  {title:'鸳鸯戏水',type:'婚庆',emoji:'🦆',desc:'鸳鸯在水中嬉戏的剪纸图案，寓意夫妻恩爱、永不分离。',detail:'鸳鸯在中国文化中是爱情的象征，因为鸳鸯总是成双成对出现。鸳鸯戏水是婚庆剪纸的经典题材。'},
  {title:'老鼠娶亲',type:'生肖',emoji:'🐭',desc:'以老鼠迎亲为题材的趣味剪纸，展现了热闹喜庆的民间场景。',detail:'老鼠娶亲是中国民间广泛流传的剪纸题材，描绘老鼠队伍浩浩荡荡迎娶新娘的场景，诙谐有趣。'},
  {title:'牡丹富贵',type:'花鸟',emoji:'🌺',desc:'以牡丹花为主题的剪纸，寓意富贵吉祥，是中国最经典的吉祥图案之一。',detail:'牡丹被誉为"花中之王"，象征富贵荣华。牡丹剪纸构图饱满，花瓣层叠，是剪纸艺人的看家本领。'},
  {title:'门神剪纸',type:'人物',emoji:'👹',desc:'以秦叔宝、尉迟恭为原型的门神剪纸，是春节贴在门上驱邪避灾的守护神。',detail:'门神是中国民间最常见的守护神，每逢春节家家户户都会在门上贴门神剪纸，祈求平安。'},
  {title:'福字倒贴',type:'春节',emoji:'福',desc:'将"福"字倒过来贴，寓意"福到了"，是春节期间最常见的习俗之一。',detail:'福字倒贴源于清代，取"福倒"与"福到"的谐音，表达了人们对幸福生活的美好期盼。'},
  {title:'百蝶图',type:'花鸟',emoji:'🦋',desc:'以蝴蝶为主题的剪纸长卷，百蝶翩翩起舞，寓意自由美好。',detail:'蝴蝶在中国文化中象征自由和爱情，"蝶"与"耋"谐音，也有长寿的寓意。百蝶图是剪纸艺人的炫技之作。'}
];
var currentType='all';
function renderItems(list){
  var el=document.getElementById('itemList');
  var html='';
  list.forEach(function(p,i){
    html+='<div class="item" onclick="showDetail('+items.indexOf(p)+')">';
    html+='<div class="item-title">'+p.emoji+' '+p.title+'</div>';
    html+='<div class="item-meta">'+p.type+'</div>';
    html+='<div class="item-display">'+p.emoji+'</div>';
    html+='<div class="item-desc">'+p.desc.substring(0,60)+'...</div>';
    html+='</div>';
  });
  el.innerHTML=html||'<div class="card" style="text-align:center;color:var(--text2)">未找到匹配的剪纸作品</div>';
}
function filterItems(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var filtered=items.filter(function(p){return(p.title.includes(q)||p.desc.includes(q))&&(currentType==='all'||p.type===currentType);});
  renderItems(filtered);
}
function filterByType(type,btn){
  currentType=type;
  document.querySelectorAll('.btn-group .btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  filterItems();
}
function showDetail(i){
  var p=items[i];
  document.getElementById('modalTitle').textContent=p.title;
  document.getElementById('modalDisplay').textContent=p.emoji;
  document.getElementById('modalMeta').textContent=p.type;
  document.getElementById('modalDesc').textContent=p.desc;
  document.getElementById('modalDetail').textContent=p.detail;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='light'?'dark':'light');}

var canvas=document.getElementById('paperCanvas'),ctx=canvas.getContext('2d');
var drawing=false,mirrorMode=false,currentTool='cut';
ctx.fillStyle='#d32f2f';ctx.fillRect(0,0,400,400);
ctx.strokeStyle='#d32f2f';ctx.lineWidth=2;

function setTool(t){currentTool=t;}
function toggleMirror(){mirrorMode=!mirrorMode;alert(mirrorMode?'镜像模式开启：在左侧绘制，右侧自动生成对称图案':'镜像模式关闭');}
function clearCanvas(){ctx.fillStyle='#d32f2f';ctx.fillRect(0,0,400,400);}
function downloadPaper(){var link=document.createElement('a');link.download='剪纸作品.png';link.href=canvas.toDataURL();link.click();}

canvas.addEventListener('mousedown',function(e){drawing=true;ctx.beginPath();var r=canvas.getBoundingClientRect();var x=(e.clientX-r.left)*(400/r.width),y=(e.clientY-r.top)*(400/r.height);ctx.moveTo(x,y);});
canvas.addEventListener('mousemove',function(e){
  if(!drawing)return;var r=canvas.getBoundingClientRect();var x=(e.clientX-r.left)*(400/r.width),y=(e.clientY-r.top)*(400/r.height);
  if(currentTool==='cut'){ctx.globalCompositeOperation='destination-out';ctx.fillStyle='white';ctx.arc(x,y,8,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='source-over';
  }else{ctx.lineTo(x,y);ctx.stroke();}
  if(mirrorMode){var mx=400-x;if(currentTool==='cut'){ctx.globalCompositeOperation='destination-out';ctx.fillStyle='white';ctx.arc(mx,y,8,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='source-over';}else{ctx.lineTo(mx,y);ctx.stroke();}}
});
canvas.addEventListener('mouseup',function(){drawing=false;});
canvas.addEventListener('mouseleave',function(){drawing=false;});

document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
renderItems(items);
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
