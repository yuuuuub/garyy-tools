<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏛️ 记忆宫殿</title>
<meta name="description" content="记忆宫殿工具，利用空间记忆法高效记忆知识">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.es{text-align:center;padding:40px;color:var(--text2)}
.palace-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:12px}
.palace-cell{aspect-ratio:1;border-radius:8px;border:2px solid var(--border);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-size:.8rem;text-align:center;padding:4px}
.palace-cell:hover{border-color:var(--accent);transform:scale(1.05)}
.palace-cell.active{border-color:var(--accent);background:rgba(59,130,246,.15)}
.palace-cell .num{font-size:1.2rem;font-weight:700;color:var(--accent)}
.palace-cell .assoc{font-size:.7rem;color:var(--text2);margin-top:2px}
.flash-card{perspective:1000px;height:200px;margin:12px 0}
.flash-inner{width:100%;height:100%;position:relative;transition:transform .6s;transform-style:preserve-3d}
.flash-card.flipped .flash-inner{transform:rotateY(180deg)}
.flash-front,.flash-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:1.2rem;padding:20px;text-align:center}
.flash-front{background:var(--accent);color:#fff}
.flash-back{background:var(--bg);border:1px solid var(--border);transform:rotateY(180deg);color:var(--text)}
.mem-item{padding:12px;border-bottom:1px solid var(--border)}.mem-item:last-child{border-bottom:none}
.mem-item .loc{font-weight:600;color:var(--accent)}
.mem-item .info{color:var(--text);margin-top:4px}
.mem-item .del{float:right;cursor:pointer;color:var(--danger);font-size:.85rem}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin-right:4px}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🏛️ 记忆宫殿">
<meta property="og:description" content="记忆宫殿工具，利用空间记忆法高效记忆知识">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🏛️ 记忆宫殿</h1><p>用空间位置记忆法，让记忆更牢固</p></div>

<div class="cd"><h2>📍 创建宫殿</h2>
<label>宫殿名称</label><input type="text" id="pName" placeholder="如：我的家、学校走廊">
<label>宫殿地点数量</label><select id="pSize"><option value="5">5个地点</option><option value="10" selected>10个地点</option><option value="15">15个地点</option><option value="20">20个地点</option></select>
<div class="bg"><button onclick="createPalace()">创建宫殿</button></div></div>

<div class="cd"><h2>🏛️ 宫殿布局</h2>
<div id="palaceGrid" class="es">请先创建宫殿</div></div>

<div class="cd"><h2>📝 记忆关联</h2>
<label>选择地点</label><select id="locSelect"><option value="">-- 选择地点 --</option></select>
<label>要记忆的内容</label><textarea id="memContent" placeholder="输入要在这个地点记忆的内容..."></textarea>
<label>联想画面（可选）</label><input type="text" id="memImage" placeholder="描述一个生动的联想画面">
<div class="bg"><button onclick="addMemory()">添加记忆</button></div></div>

<div class="cd"><h2>🃏 记忆卡片</h2>
<div id="flashArea" class="es">添加记忆后可进行卡片复习</div>
<div class="bg"><button onclick="startReview()" id="reviewBtn" class="hidden">开始复习</button>
<button onclick="flipCard()" id="flipBtn" class="hidden sec">翻转卡片</button>
<button onclick="nextCard()" id="nextBtn" class="hidden">下一个</button></div></div>

<div class="cd"><h2>📋 记忆清单</h2><div id="memList"></div></div>

<div class="cd"><h2>📊 统计</h2><div id="stats" class="es">暂无数据</div>
<div class="bg"><button class="sec" onclick="clearAll()">清空全部</button></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
let palaces=JSON.parse(localStorage.getItem('mp_palaces')||'[]');
let memories=JSON.parse(localStorage.getItem('mp_memories')||'[]');
let currentReview=[], reviewIdx=0;

function save(){localStorage.setItem('mp_palaces',JSON.stringify(palaces));localStorage.setItem('mp_memories',JSON.stringify(memories))}

function createPalace(){
  const name=$('pName').value.trim(),size=+$('pSize').value;
  if(!name){alert('请输入宫殿名称');return}
  palaces.push({id:Date.now(),name,size,created:new Date().toISOString()});
  save();$('pName').value='';render();
}

function render(){
  if(palaces.length===0){$('palaceGrid').innerHTML='<div class="es">请先创建宫殿</div>';return}
  const p=palaces[palaces.length-1];
  let html='';
  for(let i=1;i<=p.size;i++){
    const mem=memories.find(m=>m.palaceId===p.id&&m.loc===i);
    html+=`<div class="palace-cell" onclick="selectLoc(${i})" id="cell${i}"><div class="num">${i}</div><div class="assoc">${mem?mem.content.substring(0,8)+'...':'空'}</div></div>`;
  }
  $('palaceGrid').innerHTML=html;
  let opts='<option value="">-- 选择地点 --</option>';
  for(let i=1;i<=p.size;i++){
    const mem=memories.find(m=>m.palaceId===p.id&&m.loc===i);
    opts+=`<option value="${i}">地点${i}${mem?' ('+mem.content.substring(0,6)+')':''}</option>`;
  }
  $('locSelect').innerHTML=opts;
  renderMemList();renderStats();
}

function selectLoc(i){document.querySelectorAll('.palace-cell').forEach(c=>c.classList.remove('active'));const c=$('cell'+i);if(c)c.classList.add('active');$('locSelect').value=i}

function addMemory(){
  const palaceId=palaces.length?palaces[palaces.length-1].id:null;
  const loc=+$('locSelect').value,content=$('memContent').value.trim(),image=$('memImage').value.trim();
  if(!palaceId||!loc||!content){alert('请选择宫殿、地点并输入内容');return}
  memories=memories.filter(m=>!(m.palaceId===palaceId&&m.loc===loc));
  memories.push({id:Date.now(),palaceId,loc,content,image});
  save();$('memContent').value='';$('memImage').value='';render();
}

function renderMemList(){
  if(palaces.length===0){$('memList').innerHTML='';return}
  const pid=palaces[palaces.length-1].id;
  const list=memories.filter(m=>m.palaceId===pid).sort((a,b)=>a.loc-b.loc);
  if(!list.length){$('memList').innerHTML='<div class="es">暂无记忆</div>';return}
  $('memList').innerHTML=list.map(m=>`<div class="mem-item"><span class="del" onclick="delMem(${m.id})">✕</span><div class="loc">📍 地点 ${m.loc}</div><div class="info">${m.content}</div>${m.image?'<div style="font-size:.8rem;color:var(--warn);margin-top:4px">💡 '+m.image+'</div>':''}</div>`).join('');
}

function delMem(id){memories=memories.filter(m=>m.id!==id);save();render()}

function startReview(){
  if(palaces.length===0)return;
  const pid=palaces[palaces.length-1].id;
  currentReview=memories.filter(m=>m.palaceId===pid);
  if(!currentReview.length){alert('没有可复习的记忆');return}
  reviewIdx=0;showCard();$('reviewBtn').classList.add('hidden');$('flipBtn').classList.remove('hidden');$('nextBtn').classList.remove('hidden');
}

function showCard(){
  if(reviewIdx>=currentReview.length){$('flashArea').innerHTML='<div class="es">🎉 复习完成！</div>';$('flipBtn').classList.add('hidden');$('nextBtn').classList.add('hidden');$('reviewBtn').classList.remove('hidden');return}
  const m=currentReview[reviewIdx];
  $('flashArea').innerHTML=`<div class="flash-card" onclick="flipCard()" id="flashCard"><div class="flash-inner"><div class="flash-front">📍 地点 ${m.loc}</div><div class="flash-back">${m.content}${m.image?'<br><small style="color:var(--warn)">💡 '+m.image+'</small>':''}</div></div></div>`;
}

function flipCard(){const c=$('flashCard');if(c)c.classList.toggle('flipped')}
function nextCard(){reviewIdx++;showCard()}

function renderStats(){
  if(palaces.length===0){$('stats').innerHTML='暂无数据';return}
  const pid=palaces[palaces.length-1].id;
  const memCount=memories.filter(m=>m.palaceId===pid).length;
  const p=palaces[palaces.length-1];
  $('stats').innerHTML=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center"><div><div style="font-size:1.5rem;font-weight:700;color:var(--accent)">${p.size}</div><div style="font-size:.8rem;color:var(--text2)">总地点</div></div><div><div style="font-size:1.5rem;font-weight:700;color:var(--success)">${memCount}</div><div style="font-size:.8rem;color:var(--text2)">已记忆</div></div><div><div style="font-size:1.5rem;font-weight:700;color:var(--warn)">${p.size-memCount}</div><div style="font-size:.8rem;color:var(--text2)">待填充</div></div></div>`;
}

function clearAll(){if(!confirm('确定清空所有数据？'))return;palaces=[];memories=[];save();render()}
render();
</script>
</body>
</html>
