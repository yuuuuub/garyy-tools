<!DOCTYPE html>

<head>

<style>
:root {
  --bg: #0f172a; --surface: #1e293b; --surface-2: #334155;
  --text: #f1f5f9; --text-secondary: #94a3b8; --accent: #8b5cf6;
  --border: #475569; --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --radius: 12px; --transition: 0.25s ease;
}
[data-theme="light"] {
  --bg: #f8fafc; --surface: #ffffff; --surface-2: #f1f5f9;
  --text: #1e293b; --text-secondary: #64748b; --accent: #8b5cf6;
  --border: #e2e8f0; --shadow: 0 4px 24px rgba(0,0,0,0.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; justify-content: center; min-height: 100vh; padding: 16px;
  transition: background var(--transition), color var(--transition);
}
.container {
  max-width: 800px; width: 100%; background: var(--surface);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px;
  transition: background var(--transition), box-shadow var(--transition);
}
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
header h1 { font-size: 1.5rem; }
.theme-toggle {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; cursor: pointer; font-size: 1.1rem; color: var(--text);
}
.theme-toggle:hover { background: var(--accent); color: #fff; }
.section { margin-bottom: 16px; }
.section label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 6px; }
.row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.row label { margin-bottom: 0; min-width: 60px; font-size: 0.82rem; color: var(--text-secondary); }
.row input[type="range"] { flex: 1; min-width: 80px; accent-color: var(--accent); }
.row input[type="color"] {
  width: 32px; height: 32px; border: 2px solid var(--border); border-radius: 6px;
  cursor: pointer; padding: 0; background: none;
}
.row select {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 10px; color: var(--text); font-size: 0.85rem;
}
.canvas-wrap {
  display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap;
  justify-content: center; margin-bottom: 16px;
}
.editor-panel { position: relative; }
#pixelCanvas {
  border: 2px solid var(--border); cursor: crosshair; image-rendering: pixelated;
  display: block; touch-action: none;
}
.tool-bar { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
.tool-btn {
  padding: 6px 10px; border-radius: 6px; border: 2px solid var(--border);
  background: var(--surface-2); color: var(--text); cursor: pointer; font-size: 0.8rem;
  transition: all 0.15s;
}
.tool-btn:hover { border-color: var(--accent); }
.tool-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.palette-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 12px;
}
.palette-color {
  width: 36px; height: 36px; border-radius: 6px; border: 2px solid var(--border);
  cursor: pointer; transition: transform 0.15s;
}
.palette-color:hover { transform: scale(1.1); }
.palette-color.active { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
.preview-panel { text-align: center; }
.preview-panel label { margin-bottom: 8px; }
.preview-sprites { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.preview-sprite { text-align: center; }
.preview-sprite canvas {
  border: 1px solid var(--border); image-rendering: pixelated; display: block; margin: 0 auto 4px;
}
.preview-sprite span { font-size: 0.75rem; color: var(--text-secondary); }
.frames-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.frame-thumb {
  width: 56px; height: 56px; border: 2px solid var(--border); border-radius: 6px;
  cursor: pointer; image-rendering: pixelated; background: #000;
}
.frame-thumb.active { border-color: var(--accent); }
.frame-thumb.onion { opacity: 0.5; }
.btn {
  padding: 7px 14px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 0.82rem; font-weight: 600; transition: opacity 0.2s;
}
.btn:hover { opacity: 0.85; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.btn-danger { background: #ef4444; color: #fff; }
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 600px) { .controls-grid { grid-template-columns: 1fr; } }
.toggle-label {
  display: flex; align-items: center; gap: 6px; font-size: 0.82rem;
  color: var(--text-secondary); cursor: pointer;
}
.toggle-label input { accent-color: var(--accent); }
.anim-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.css-output {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px; font-family: 'Courier New', monospace; font-size: 0.72rem;
  color: var(--text); word-break: break-all; white-space: pre-wrap; margin-top: 8px;
  max-height: 160px; overflow-y: auto;
}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🕹️ 复古游戏风格制作器</h1>
    <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">🌓</button>
  </header>

  <div class="section">
    <div class="controls-grid">
      <div class="section">
        <label>网格尺寸</label>
        <select id="gridSize" onchange="changeGridSize()">
          <option value="8">8 × 8</option>
          <option value="16" selected>16 × 16</option>
          <option value="32">32 × 32</option>
          <option value="64">64 × 64</option>
        </select>
      </div>
      <div class="section">
        <label>镜像模式</label>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <label class="toggle-label"><input type="checkbox" id="mirrorX" onchange="render()"> X轴</label>
          <label class="toggle-label"><input type="checkbox" id="mirrorY" onchange="render()"> Y轴</label>
        </div>
      </div>
      <div class="section">
        <label class="toggle-label"><input type="checkbox" id="showGrid" checked onchange="render()"> 显示网格</label>
      </div>
      <div class="section">
        <label class="toggle-label"><input type="checkbox" id="onionSkin" onchange="render()"> 洋葱皮</label>
      </div>
    </div>
  </div>

  <div class="tool-bar" id="toolBar">
    <button class="tool-btn active" data-tool="pencil" onclick="setTool(this)">✏️ 铅笔</button>
    <button class="tool-btn" data-tool="eraser" onclick="setTool(this)">🧹 橡皮</button>
    <button class="tool-btn" data-tool="fill" onclick="setTool(this)">🪣 填充</button>
    <button class="tool-btn" data-tool="line" onclick="setTool(this)">📏 直线</button>
    <button class="tool-btn" data-tool="rect" onclick="setTool(this)">⬜ 矩形</button>
  </div>

  <div class="canvas-wrap">
    <div class="editor-panel">
      <canvas id="pixelCanvas" width="480" height="480"></canvas>
    </div>
    <div class="preview-panel">
      <label>预览</label>
      <div class="preview-sprites" id="previewSprites"></div>
      <div class="btn-row" style="margin-top:10px;justify-content:center;">
        <button class="btn btn-secondary" onclick="setPreviewScale(1)">1x</button>
        <button class="btn btn-secondary" onclick="setPreviewScale(2)">2x</button>
        <button class="btn btn-secondary" onclick="setPreviewScale(4)">4x</button>
      </div>
    </div>
  </div>

  <div class="section">
    <label>调色板 (点击编辑颜色)</label>
    <div class="palette-grid" id="paletteGrid"></div>
    <div class="row">
      <button class="btn btn-secondary" onclick="addPaletteColor()">+ 添加颜色</button>
      <button class="btn btn-secondary" onclick="resetPalette()">恢复默认</button>
    </div>
  </div>

  <div class="section">
    <label>动画帧</label>
    <div class="frames-bar" id="framesBar"></div>
    <div class="anim-bar">
      <button class="btn btn-primary" id="playBtn" onclick="togglePlay()">▶ 播放</button>
      <label style="font-size:0.82rem;color:var(--text-secondary)">FPS:</label>
      <input type="range" id="fps" min="1" max="24" value="8" style="width:100px;accent-color:var(--accent);" oninput="document.getElementById('fpsVal').textContent=this.value">
      <span id="fpsVal" style="font-size:0.82rem;">8</span>
      <button class="btn btn-secondary" onclick="addFrame()">+ 添加帧</button>
      <button class="btn btn-danger" onclick="removeFrame()">🗑 删除帧</button>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" onclick="exportPNG(1)">📥 导出 PNG 1x</button>
    <button class="btn btn-primary" onclick="exportPNG(4)">📥 导出 PNG 4x</button>
    <button class="btn btn-secondary" onclick="exportJSON()">📋 导出 JSON</button>
    <button class="btn btn-secondary" onclick="exportCSS()">🎨 导出 CSS</button>
    <button class="btn btn-secondary" onclick="importJSON()">📂 导入 JSON</button>
    <button class="btn btn-secondary" onclick="clearCanvas()">🗑 清空</button>
    <button class="btn btn-secondary" onclick="fillAll()">🪣 全部填充</button>
  </div>

  <div class="section" style="margin-top:16px;">
    <label>CSS Box-Shadow 输出 <button class="btn btn-secondary btn-small" onclick="copyCSSOutput()">📋 复制</button></label>
    <div class="css-output" id="cssOutput"></div>
  </div>

  <input type="file" id="jsonInput" accept=".json" style="display:none" onchange="handleImport(event)">
</div>

<script>
const defaultPalette = [
  '#000000','#ffffff','#ff0000','#00ff00',
  '#0000ff','#ffff00','#ff00ff','#00ffff',
  '#ff8800','#8800ff','#ff0088','#00ff88',
  '#0088ff','#88ff00','#884400','#444444'
];

let gridN = 16;
let palette = [...defaultPalette];
let currentColor = '#000000';
let currentTool = 'pencil';
let previewScale = 2;
let frames = [null];
let currentFrame = 0;
let playing = false;
let playTimer = null;
let drawing = false;
let lineStart = null;
let rectStart = null;
let previewCanvas = null;

function toggleTheme() {
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === 'light' ? 'dark' : 'light';
}

function makeEmptyGrid() {
  return Array.from({ length: gridN }, () => Array(gridN).fill(null));
}

function init() {
  frames = [makeEmptyGrid()];
  currentFrame = 0;
  setupCanvas();
  renderPalette();
  renderFrames();
  render();
}

function setupCanvas() {
  const canvas = document.getElementById('pixelCanvas');
  const size = Math.min(480, window.innerWidth - 60);
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  canvas.width = gridN;
  canvas.height = gridN;
  canvas.removeEventListener('mousedown', onDown);
  canvas.removeEventListener('mousemove', onMove);
  canvas.removeEventListener('mouseup', onUp);
  canvas.removeEventListener('mouseleave', onUp);
  canvas.removeEventListener('touchstart', onTouchStart);
  canvas.removeEventListener('touchmove', onTouchMove);
  canvas.removeEventListener('touchend', onUp);
  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onTouchStart, { passive: false });
  canvas.addEventListener('touchmove', onTouchMove, { passive: false });
  canvas.addEventListener('touchend', onUp);
}

function getCell(e) {
  const canvas = document.getElementById('pixelCanvas');
  const rect = canvas.getBoundingClientRect();
  const scaleX = gridN / rect.width;
  const scaleY = gridN / rect.height;
  let clientX, clientY;
  if (e.touches) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  const x = Math.floor((clientX - rect.left) * scaleX);
  const y = Math.floor((clientY - rect.top) * scaleY);
  return { x: Math.max(0, Math.min(gridN - 1, x)), y: Math.max(0, Math.min(gridN - 1, y)) };
}

function onDown(e) {
  e.preventDefault();
  drawing = true;
  const pos = getCell(e);
  const grid = frames[currentFrame];
  const mx = document.getElementById('mirrorX').checked;
  const my = document.getElementById('mirrorY').checked;

  if (currentTool === 'pencil' || currentTool === 'eraser') {
    setPixel(grid, pos.x, pos.y, currentTool === 'eraser' ? null : currentColor, mx, my);
    render();
  } else if (currentTool === 'fill') {
    floodFill(grid, pos.x, pos.y, currentTool === 'eraser' ? null : currentColor);
    render();
  } else if (currentTool === 'line' || currentTool === 'rect') {
    lineStart = pos;
  }
}

function onMove(e) {
  if (!drawing) return;
  const pos = getCell(e);
  const grid = frames[currentFrame];
  const mx = document.getElementById('mirrorX').checked;
  const my = document.getElementById('mirrorY').checked;
  if (currentTool === 'pencil' || currentTool === 'eraser') {
    setPixel(grid, pos.x, pos.y, currentTool === 'eraser' ? null : currentColor, mx, my);
    render();
  }
}

function onUp(e) {
  if (!drawing) return;
  if ((currentTool === 'line' || currentTool === 'rect') && lineStart) {
    const pos = e.changedTouches ? getCellFromTouch(e.changedTouches[0]) : getCell(e);
    const grid = frames[currentFrame];
    const mx = document.getElementById('mirrorX').checked;
    const my = document.getElementById('mirrorY').checked;
    if (currentTool === 'line') {
      drawLine(grid, lineStart.x, lineStart.y, pos.x, pos.y, currentColor, mx, my);
    } else {
      drawRect(grid, lineStart.x, lineStart.y, pos.x, pos.y, currentColor, mx, my);
    }
    lineStart = null;
    render();
  }
  drawing = false;
}

function getCellFromTouch(touch) {
  const canvas = document.getElementById('pixelCanvas');
  const rect = canvas.getBoundingClientRect();
  const scaleX = gridN / rect.width;
  const scaleY = gridN / rect.height;
  return {
    x: Math.max(0, Math.min(gridN - 1, Math.floor((touch.clientX - rect.left) * scaleX))),
    y: Math.max(0, Math.min(gridN - 1, Math.floor((touch.clientY - rect.top) * scaleY)))
  };
}

function onTouchStart(e) { e.preventDefault(); onDown(e); }
function onTouchMove(e) { e.preventDefault(); onMove(e); }

function setPixel(grid, x, y, color, mx, my) {
  if (x < 0 || x >= gridN || y < 0 || y >= gridN) return;
  grid[y][x] = color;
  if (mx) grid[y][gridN - 1 - x] = color;
  if (my) grid[gridN - 1 - y][x] = color;
  if (mx && my) grid[gridN - 1 - y][gridN - 1 - x] = color;
}

function floodFill(grid, x, y, fillColor) {
  if (x < 0 || x >= gridN || y < 0 || y >= gridN) return;
  const target = grid[y][x];
  if (target === fillColor) return;
  const stack = [[x, y]];
  while (stack.length) {
    const [cx, cy] = stack.pop();
    if (cx < 0 || cx >= gridN || cy < 0 || cy >= gridN) continue;
    if (grid[cy][cx] !== target) continue;
    grid[cy][cx] = fillColor;
    stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
  }
}

function drawLine(grid, x0, y0, x1, y1, color, mx, my) {
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
  const dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  while (true) {
    setPixel(grid, x0, y0, color, mx, my);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

function drawRect(grid, x0, y0, x1, y1, color, mx, my) {
  const minX = Math.min(x0, x1), maxX = Math.max(x0, x1);
  const minY = Math.min(y0, y1), maxY = Math.max(y0, y1);
  for (let x = minX; x <= maxX; x++) { setPixel(grid, x, minY, color, mx, my); setPixel(grid, x, maxY, color, mx, my); }
  for (let y = minY; y <= maxY; y++) { setPixel(grid, minX, y, color, mx, my); setPixel(grid, maxX, y, color, mx, my); }
}

function render() {
  const canvas = document.getElementById('pixelCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, gridN, gridN);
  const grid = frames[currentFrame];

  if (document.getElementById('onionSkin').checked && currentFrame > 0) {
    const prev = frames[currentFrame - 1];
    for (let y = 0; y < gridN; y++)
      for (let x = 0; x < gridN; x++)
        if (prev[y][x]) { ctx.globalAlpha = 0.3; ctx.fillStyle = prev[y][x]; ctx.fillRect(x, y, 1, 1); }
    ctx.globalAlpha = 1;
  }

  for (let y = 0; y < gridN; y++)
    for (let x = 0; x < gridN; x++)
      if (grid[y][x]) { ctx.fillStyle = grid[y][x]; ctx.fillRect(x, y, 1, 1); }

  if (document.getElementById('showGrid').checked) {
    ctx.strokeStyle = 'rgba(128,128,128,0.3)';
    ctx.lineWidth = 0.05;
    for (let i = 0; i <= gridN; i++) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, gridN); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(gridN, i); ctx.stroke();
    }
  }

  updatePreview();
  updateCSSOutput();
}

function updatePreview() {
  const container = document.getElementById('previewSprites');
  container.innerHTML = '';
  frames.forEach((frame, i) => {
    const div = document.createElement('div');
    div.className = 'preview-sprite';
    const c = document.createElement('canvas');
    c.width = gridN; c.height = gridN;
    c.style.width = (gridN * previewScale) + 'px';
    c.style.height = (gridN * previewScale) + 'px';
    if (i === currentFrame) c.style.border = '2px solid var(--accent)';
    const ctx = c.getContext('2d');
    for (let y = 0; y < gridN; y++)
      for (let x = 0; x < gridN; x++)
        if (frame[y][x]) { ctx.fillStyle = frame[y][x]; ctx.fillRect(x, y, 1, 1); }
    const sp = document.createElement('span');
    sp.textContent = 'F' + (i + 1);
    div.appendChild(c);
    div.appendChild(sp);
    container.appendChild(div);
  });
}

function setPreviewScale(s) {
  previewScale = s;
  render();
}

function renderPalette() {
  const grid = document.getElementById('paletteGrid');
  grid.innerHTML = '';
  palette.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'palette-color' + (c === currentColor ? ' active' : '');
    div.style.background = c;
    div.onclick = () => { currentColor = c; renderPalette(); };
    div.ondblclick = () => {
      const input = document.createElement('input');
      input.type = 'color'; input.value = c;
      input.onchange = () => { palette[i] = input.value; currentColor = input.value; renderPalette(); };
      input.click();
    };
    grid.appendChild(div);
  });
}

function addPaletteColor() {
  palette.push('#ffffff');
  currentColor = '#ffffff';
  renderPalette();
}

function resetPalette() {
  palette = [...defaultPalette];
  currentColor = palette[0];
  renderPalette();
}

function setTool(btn) {
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentTool = btn.dataset.tool;
}

function changeGridSize() {
  gridN = +document.getElementById('gridSize').value;
  frames = [makeEmptyGrid()];
  currentFrame = 0;
  setupCanvas();
  renderFrames();
  render();
}

function renderFrames() {
  const bar = document.getElementById('framesBar');
  bar.innerHTML = '';
  frames.forEach((frame, i) => {
    const c = document.createElement('canvas');
    c.width = gridN; c.height = gridN;
    c.className = 'frame-thumb' + (i === currentFrame ? ' active' : '');
    c.style.width = '56px'; c.style.height = '56px';
    const ctx = c.getContext('2d');
    for (let y = 0; y < gridN; y++)
      for (let x = 0; x < gridN; x++)
        if (frame[y][x]) { ctx.fillStyle = frame[y][x]; ctx.fillRect(x, y, 1, 1); }
    c.onclick = () => { currentFrame = i; renderFrames(); render(); };
    bar.appendChild(c);
  });
}

function addFrame() {
  frames.push(makeEmptyGrid());
  currentFrame = frames.length - 1;
  renderFrames();
  render();
}

function removeFrame() {
  if (frames.length <= 1) return;
  frames.splice(currentFrame, 1);
  if (currentFrame >= frames.length) currentFrame = frames.length - 1;
  renderFrames();
  render();
}

function togglePlay() {
  if (playing) {
    playing = false;
    clearInterval(playTimer);
    document.getElementById('playBtn').textContent = '▶ 播放';
  } else {
    playing = true;
    document.getElementById('playBtn').textContent = '⏸ 暂停';
    let fi = 0;
    playTimer = setInterval(() => {
      fi = (fi + 1) % frames.length;
      currentFrame = fi;
      renderFrames();
      render();
    }, 1000 / +document.getElementById('fps').value);
  }
}

function clearCanvas() {
  frames[currentFrame] = makeEmptyGrid();
  render();
}

function fillAll() {
  frames[currentFrame] = Array.from({ length: gridN }, () => Array(gridN).fill(currentColor));
  render();
}

function updateCSSOutput() {
  const grid = frames[currentFrame];
  const shadows = [];
  for (let y = 0; y < gridN; y++)
    for (let x = 0; x < gridN; x++)
      if (grid[y][x]) shadows.push(`${x}px ${y}px 0 ${grid[y][x]}`);
  document.getElementById('cssOutput').textContent =
    `width: ${gridN}px;\nheight: ${gridN}px;\nbox-shadow:\n  ${shadows.join(',\n  ')};`;
}

function copyCSSOutput() {
  navigator.clipboard.writeText(document.getElementById('cssOutput').textContent);
}

function exportPNG(scale) {
  const canvas = document.createElement('canvas');
  canvas.width = gridN * scale; canvas.height = gridN * scale;
  const ctx = canvas.getContext('2d');
  const grid = frames[currentFrame];
  for (let y = 0; y < gridN; y++)
    for (let x = 0; x < gridN; x++)
      if (grid[y][x]) { ctx.fillStyle = grid[y][x]; ctx.fillRect(x * scale, y * scale, scale, scale); }
  const link = document.createElement('a');
  link.download = `pixel-art-${gridN}x${gridN}-${scale}x.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function exportJSON() {
  const data = { gridN, palette, frames };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const link = document.createElement('a');
  link.download = 'pixel-art.json';
  link.href = URL.createObjectURL(blob);
  link.click();
}

function importJSON() {
  document.getElementById('jsonInput').click();
}

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      gridN = data.gridN;
      palette = data.palette || [...defaultPalette];
      frames = data.frames;
      currentFrame = 0;
      document.getElementById('gridSize').value = gridN;
      setupCanvas();
      renderPalette();
      renderFrames();
      render();
    } catch (err) { alert('JSON 格式错误'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function exportCSS() {
  let css = `/* 复古游戏像素画 CSS */\n.pixel-art {\n  width: ${gridN}px;\n  height: ${gridN}px;\n  image-rendering: pixelated;\n  box-shadow:\n`;
  const grid = frames[currentFrame];
  const shadows = [];
  for (let y = 0; y < gridN; y++)
    for (let x = 0; x < gridN; x++)
      if (grid[y][x]) shadows.push(`    ${x}px ${y}px 0 ${grid[y][x]}`);
  css += shadows.join(',\n') + ';\n}';
  navigator.clipboard.writeText(css);
  alert('CSS 已复制到剪贴板');
}

init();
</script>
</body>
</html>
