<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>专业多米诺</title><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#8b5cf6;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--orange:#f97316}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:1.8em;margin-bottom:8px;text-align:center}
.subtitle{color:#8b949e;margin-bottom:20px;text-align:center;font-size:.9em}
.game-area{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:700px;width:100%;margin-bottom:16px}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:1em;transition:all .2s}
.btn:hover{opacity:.9;transform:scale(1.02)}
.btn:active{transform:scale(.98)}
.btn-sm{padding:6px 14px;font-size:.85em}
.btn-green{background:var(--green)}.btn-red{background:var(--red)}.btn-yellow{background:var(--yellow);color:#000}.btn-orange{background:var(--orange)}
.flex{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.grid{display:grid;gap:4px}
.info{text-align:center;color:#8b949e;margin:12px 0;font-size:.95em}
.result{text-align:center;font-size:1.2em;margin:16px 0;padding:16px;border-radius:8px;background:var(--bg);min-height:40px}
.token{display:inline-block;padding:4px 10px;margin:3px;border-radius:6px;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:all .2s}
.token:hover{border-color:var(--accent)}
.token.active{background:var(--accent);border-color:var(--accent);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@media(max-width:480px){body{padding:12px}.game-area{padding:16px}h1{font-size:1.4em}}
</style></head><body>
<h1>专业多米诺</h1><p class="subtitle">经典多米诺骨牌</p>
<div class="game-area"><div id="hand" style="margin-bottom:16px"></div>
<div id="table" style="margin-bottom:16px"></div>
<div class="flex"><button class="btn" onclick="dealD()">发牌</button><button class="btn btn-green" onclick="drawD()">摸牌</button></div>
<div class="info" id="info"></div>
<script>
let doms=[],hand=[],table=[],pile=[];
function dealD(){doms=[];for(let i=0;i<=6;i++)for(let j=i;j<=6;j++)doms.push([i,j]);
doms.sort(()=>Math.random()-.5);hand=doms.splice(0,7);table=[];pile=doms;render();}
function domStr(d){return '<span style="display:inline-flex;flex-direction:column;align-items:center;padding:4px 8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;margin:2px;cursor:pointer"><span style="font-weight:bold">'+d[0]+'</span><span style="border-top:1px solid var(--border);width:100%"></span><span style="font-weight:bold">'+d[1]+'</span></span>';}
function render(){document.getElementById('hand').innerHTML=hand.map((d,i)=>'<span onclick="playD('+i+')" style="cursor:pointer">'+domStr(d)+'</span>').join('');
document.getElementById('table').innerHTML='<div style="color:#8b949e;margin-bottom:8px">桌面</div>'+(table.length?table.map(d=>domStr(d)).join(''):'<div>空</div>');
document.getElementById('info').innerHTML='手牌: '+hand.length+' | 牌堆: '+pile.length;}
function playD(i){if(!table.length){table.push(hand.splice(i,1)[0]);}else{const end=table[table.length-1][1];
if(hand[i][0]===end)table.push(hand.splice(i,1)[0]);else if(hand[i][1]===end){table.push([hand[i][1],hand[i][0]]);hand.splice(i,1);}}render();}
function drawD(){if(!pile.length)return;hand.push(pile.shift());render();}
dealD();</script>
</div></body></html>
