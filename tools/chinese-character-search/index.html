<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字搜索</title><meta name="description" content="汉字搜索 - 在线搜索汉字"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.search-results{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}.search-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;transition:transform .2s}.search-item:hover{transform:translateY(-2px)}.search-char{font-size:2rem;font-weight:700;color:var(--blue);margin-bottom:4px}.search-pinyin{font-size:.85rem;color:var(--text2);margin-bottom:4px}.search-meaning{font-size:.8rem;color:var(--text)}.filter-group{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.filter-btn{padding:6px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.85rem}.filter-btn.active{border-color:var(--blue);background:rgba(59,130,246,.1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="汉字搜索"><meta property="og:description" content="汉字搜索 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔍 汉字搜索</h1><p class="sub">在线搜索汉字</p>
<div class="card">
<div class="input-group">
<label>搜索汉字</label>
<input type="text" id="searchInput" placeholder="输入汉字、拼音或含义..." oninput="searchCharacters()">
</div>
<div class="filter-group">
<button class="filter-btn active" onclick="filterByStroke('all',this)">全部</button>
<button class="filter-btn" onclick="filterByStroke('1-3',this)">1-3画</button>
<button class="filter-btn" onclick="filterByStroke('4-6',this)">4-6画</button>
<button class="filter-btn" onclick="filterByStroke('7-9',this)">7-9画</button>
<button class="filter-btn" onclick="filterByStroke('10+',this)">10+画</button>
</div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var characters=[
  {char:'一',pinyin:'yī',strokes:1,radical:'一',meaning:'一，第一'},
  {char:'二',pinyin:'èr',strokes:2,radical:'二',meaning:'二，第二'},
  {char:'三',pinyin:'sān',strokes:3,radical:'一',meaning:'三，第三'},
  {char:'四',pinyin:'sì',strokes:5,radical:'囗',meaning:'四，第四'},
  {char:'五',pinyin:'wǔ',strokes:4,radical:'一',meaning:'五，第五'},
  {char:'六',pinyin:'liù',strokes:4,radical:'八',meaning:'六，第六'},
  {char:'七',pinyin:'qī',strokes:2,radical:'一',meaning:'七，第七'},
  {char:'八',pinyin:'bā',strokes:2,radical:'八',meaning:'八，第八'},
  {char:'九',pinyin:'jiǔ',strokes:2,radical:'丿',meaning:'九，第九'},
  {char:'十',pinyin:'shí',strokes:2,radical:'十',meaning:'十，第十'},
  {char:'大',pinyin:'dà',strokes:3,radical:'大',meaning:'大的，巨大'},
  {char:'小',pinyin:'xiǎo',strokes:3,radical:'小',meaning:'小的，微小'},
  {char:'多',pinyin:'duō',strokes:6,radical:'夕',meaning:'多的，很多'},
  {char:'少',pinyin:'shǎo',strokes:4,radical:'小',meaning:'少的，很少'},
  {char:'上',pinyin:'shàng',strokes:3,radical:'一',meaning:'上面，上方'},
  {char:'下',pinyin:'xià',strokes:3,radical:'一',meaning:'下面，下方'},
  {char:'左',pinyin:'zuǒ',strokes:5,radical:'工',meaning:'左边，左侧'},
  {char:'右',pinyin:'yòu',strokes:5,radical:'口',meaning:'右边，右侧'},
  {char:'前',pinyin:'qián',strokes:9,radical:'刂',meaning:'前面，前方'},
  {char:'后',pinyin:'hòu',strokes:6,radical:'口',meaning:'后面，后方'},
  {char:'东',pinyin:'dōng',strokes:5,radical:'一',meaning:'东方，东边'},
  {char:'西',pinyin:'xī',strokes:6,radical:'西',meaning:'西方，西边'},
  {char:'南',pinyin:'nán',strokes:9,radical:'十',meaning:'南方，南边'},
  {char:'北',pinyin:'běi',strokes:5,radical:'匕',meaning:'北方，北边'},
  {char:'天',pinyin:'tiān',strokes:4,radical:'大',meaning:'天空，一天'},
  {char:'地',pinyin:'dì',strokes:6,radical:'土',meaning:'地面，土地'},
  {char:'人',pinyin:'rén',strokes:2,radical:'人',meaning:'人类，人们'},
  {char:'口',pinyin:'kǒu',strokes:3,radical:'口',meaning:'嘴，口'},
  {char:'日',pinyin:'rì',strokes:4,radical:'日',meaning:'太阳，日子'},
  {char:'月',pinyin:'yuè',strokes:4,radical:'月',meaning:'月亮，月份'},
  {char:'水',pinyin:'shuǐ',strokes:4,radical:'水',meaning:'水，液体'},
  {char:'火',pinyin:'huǒ',strokes:4,radical:'火',meaning:'火，火焰'},
  {char:'木',pinyin:'mù',strokes:4,radical:'木',meaning:'木头，树木'},
  {char:'金',pinyin:'jīn',strokes:8,radical:'金',meaning:'金属，黄金'},
  {char:'土',pinyin:'tǔ',strokes:3,radical:'土',meaning:'土壤，土地'}
];
var currentFilter='all';
function searchCharacters(){
  var search=document.getElementById('searchInput').value.toLowerCase();
  var filtered=characters.filter(function(char){
    var matchSearch=char.char.includes(search)||char.pinyin.toLowerCase().includes(search)||char.meaning.toLowerCase().includes(search);
    var matchStroke=true;
    switch(currentFilter){
      case '1-3':matchStroke=char.strokes>=1&&char.strokes<=3;break;
      case '4-6':matchStroke=char.strokes>=4&&char.strokes<=6;break;
      case '7-9':matchStroke=char.strokes>=7&&char.strokes<=9;break;
      case '10+':matchStroke=char.strokes>=10;break;
    }
    return matchSearch&&matchStroke;
  });
  renderResults(filtered);
}
function filterByStroke(filter,btn){
  currentFilter=filter;
  document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  searchCharacters();
}
function renderResults(results){
  var html='<div class="card">';
  html+='<div style="margin-bottom:12px;color:var(--text2)">找到 '+results.length+' 个汉字</div>';
  html+='<div class="search-results">';
  results.forEach(function(char){
    html+='<div class="search-item">';
    html+='<div class="search-char">'+char.char+'</div>';
    html+='<div class="search-pinyin">'+char.pinyin+' ('+char.strokes+'画)</div>';
    html+='<div class="search-meaning">'+char.meaning+'</div>';
    html+='</div>';
  });
  html+='</div></div>';
  document.getElementById('result').innerHTML=html;
}
searchCharacters();

document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input[type=text],input[type=search],input:not([type])');if(inp)inp.focus();}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur();}});
</script></body></html>
