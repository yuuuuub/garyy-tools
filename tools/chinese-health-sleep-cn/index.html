<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌙 中医睡眠养生</title>
<meta property="og:title" content="🌙 中医睡眠养生">
<meta property="og:description" content="中医睡眠养生指南，子午觉、时辰养生、助眠功法 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="中医睡眠养生指南，子午觉、时辰养生、助眠功法">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">
<meta name="robots" content="index, follow">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;display:flex;justify-content:center}
.ctn{max-width:600px;width:100%}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit;font-size:.95rem}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:.75rem;font-weight:600}
.tag.s{background:rgba(34,197,94,.15);color:var(--success)}.tag.w{background:rgba(245,158,11,.15);color:var(--warn)}.tag.d{background:rgba(239,68,68,.15);color:var(--danger)}.tag.b{background:rgba(59,130,246,.15);color:var(--blue)}
.li{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.li:hover{border-color:var(--accent)}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:.9rem}
select,input,textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.9rem;margin-bottom:8px}
label{font-size:.85rem;color:var(--text2);margin-bottom:4px;display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
.tab-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:20px;font-size:.85rem;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:white;border-color:var(--accent)}
.detail{display:none}.detail.active{display:block}
.step{padding:10px;border-left:3px solid var(--accent);margin-bottom:8px;background:var(--bg);border-radius:0 8px 8px 0}
.step-num{font-weight:700;color:var(--accent);margin-right:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat{padding:12px;background:var(--bg);border-radius:8px}
.stat-num{font-size:1.5rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.75rem;color:var(--text2);margin-top:4px}
.log-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--border)}
.log-date{color:var(--text2);font-size:.85rem}
.flex{display:flex;gap:8px}.flex-1{flex:1}
.stars{display:flex;gap:4px;font-size:1.5rem;cursor:pointer}
.stars span{color:var(--border);transition:color .2s}
.stars span.active{color:var(--warn)}
.quality-bar{height:8px;border-radius:4px;background:var(--border);margin-top:8px;overflow:hidden}
.quality-fill{height:100%;border-radius:4px;transition:width .5s}
</style>
</head>
<body>
<div class="ctn">
<div class="hdr">
<h1>🌙 中医睡眠养生</h1>
<p>顺应天时，睡出健康</p>
</div>

<div class="tab-bar" id="tabs">
<div class="tab active" data-tab="knowledge">睡眠知识</div>
<div class="tab" data-tab="methods">睡眠方法</div>
<div class="tab" data-tab="record">睡眠记录</div>
<div class="tab" data-tab="stats">统计数据</div>
</div>

<div id="view-knowledge" class="detail active">
<div class="cd">
<h2>📋 睡眠养生知识</h2>
<div id="knowledge-list"></div>
</div>
<div class="cd" id="knowledge-detail" style="display:none">
<h2 id="kd-title">详情</h2>
<div id="kd-content"></div>
</div>
</div>

<div id="view-methods" class="detail">
<div class="cd">
<h2>🧘 助眠方法</h2>
<div id="method-list"></div>
</div>
<div class="cd" id="method-detail" style="display:none">
<h2 id="md-title">方法详情</h2>
<div id="md-content"></div>
</div>
</div>

<div id="view-record" class="detail">
<div class="cd">
<h2>📝 记录睡眠</h2>
<label>入睡时间</label>
<input type="time" id="sleep-time" value="22:30">
<label>起床时间</label>
<input type="time" id="wake-time" value="06:30">
<label>睡眠质量</label>
<div class="stars" id="quality-stars">
<span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
</div>
<label>备注（可选）</label>
<textarea id="sleep-note" rows="2" placeholder="如：做梦多、半夜醒来等"></textarea>
<button onclick="saveSleepRecord()" style="width:100%;margin-top:8px">保存记录</button>
</div>
<div class="cd">
<h2>📅 近7天记录</h2>
<div id="recent-records"></div>
</div>
</div>

<div id="view-stats" class="detail">
<div class="cd">
<h2>📊 睡眠统计</h2>
<div class="stats">
<div class="stat"><div class="stat-num" id="avg-duration">0</div><div class="stat-label">平均时长(h)</div></div>
<div class="stat"><div class="stat-num" id="avg-quality">0</div><div class="stat-label">平均质量</div></div>
<div class="stat"><div class="stat-num" id="total-records">0</div><div class="stat-label">记录天数</div></div>
</div>
</div>
<div class="cd">
<h2>📈 近7天趋势</h2>
<div id="trend-chart"></div>
</div>
</div>
</div>

<script>
const knowledge = [
  {name:'子午觉',desc:'子时（23:00-1:00）和午时（11:00-13:00）是最佳睡眠时间。子时阴气最盛，阳气初生，此时入睡最利于养阴；午时阳气最盛，阴气初生，小憩可养阳。',category:'时辰养生',tips:['子时前必须入睡','午睡控制在30分钟内','子午觉是中医养生核心']},
  {name:'十二时辰与睡眠',desc:'中医认为人体气血运行与十二时辰密切相关。丑时（1-3点）肝经当令，需深睡养肝血；寅时（3-5点）肺经当令，深睡有助于肺气宣发。',category:'时辰养生',tips:['23点前入睡','丑时保持深睡','避免凌晨熬夜']},
  {name:'睡前禁忌',desc:'中医认为睡前应避免剧烈运动、过饱饮食、情绪激动、饮茶饮酒等，以免扰动心神，影响入睡。',category:'注意事项',tips:['睡前2小时不进食','避免剧烈运动','不饮浓茶咖啡','保持心情平和']},
  {name:'心肾不交与失眠',desc:'中医认为失眠多因心肾不交，即心火上炎、肾水不能上济。表现为入睡困难、多梦易醒、心烦不安。',category:'中医辨证',tips:['宜交通心肾','可按揉涌泉穴','睡前泡脚引火归元']},
  {name:'肝郁化火与失眠',desc:'情志不畅导致肝气郁结，郁而化火，上扰心神。表现为急躁易怒、口苦目赤、难以入睡。',category:'中医辨证',tips:['疏肝理气为要','可饮菊花茶','保持心情舒畅']},
  {name:'心脾两虚与失眠',desc:'思虑过度、饮食不节损伤心脾，气血不足，心神失养。表现为多梦易醒、心悸健忘、面色萎黄。',category:'中医辨证',tips:['健脾养心','可食红枣桂圆','避免过度思虑']},
  {name:'胃不和则卧不安',desc:'饮食积滞、脾胃不和导致胃气不降，扰乱心神。表现为脘腹胀满、嗳气频繁、难以入睡。',category:'中医辨证',tips:['晚餐宜清淡','七分饱即可','饭后适当散步']},
  {name:'睡眠环境',desc:'中医强调睡眠环境应安静、避光、温度适宜。卧室宜暗不宜明，床铺软硬适中，枕头高度合适。',category:'环境调养',tips:['卧室宜暗宜静','温度18-22度','枕头一拳高','被褥清洁干燥']}
];

const methods = [
  {name:'热水泡脚',desc:'睡前用40-43度热水泡脚20分钟，可温通经络、引血下行、促进睡眠。水中可加艾叶、生姜、花椒等。',difficulty:'简单',duration:'20分钟',benefits:['温通经络','引血下行','放松身心','改善循环'],steps:['准备40-43度热水，水量没过脚踝','可加入艾叶20g或生姜3片','浸泡15-20分钟，期间可加热水保持温度','泡至微微出汗即可','泡后立即擦干，穿上袜子保暖']},
  {name:'按摩涌泉穴',desc:'涌泉穴位于足底前1/3凹陷处，是肾经起始穴。睡前按揉可引火归元、滋阴降火、安神助眠。',difficulty:'简单',duration:'10分钟',benefits:['引火归元','滋阴降火','安神助眠','补肾强身'],steps:['盘腿坐于床上','用拇指按揉涌泉穴','每侧按揉3-5分钟','力度以酸胀为度','按完后搓热足底']},
  {name:'腹式呼吸',desc:'仰卧，双手放于腹部，用鼻吸气使腹部隆起，用口呼气使腹部凹陷。深长缓慢的呼吸可放松身心。',difficulty:'简单',duration:'10分钟',benefits:['放松身心','降低心率','改善呼吸','促进睡眠'],steps:['仰卧床上，全身放松','一手放胸口，一手放腹部','鼻吸气4秒，腹部隆起','屏息2秒','口呼气6秒，腹部凹陷','重复10-15次']},
  {name:'睡前冥想',desc:'静坐或仰卧，专注于呼吸，排除杂念。可配合轻柔音乐或自然声音，帮助心神安宁。',difficulty:'中等',duration:'15分钟',benefits:['安定心神','减少焦虑','放松大脑','改善睡眠质量'],steps:['舒适坐姿或卧姿','闭眼，关注呼吸','想象宁静场景（如湖面、星空）','如有杂念，温和地将注意力拉回','持续10-15分钟']},
  {name:'穴位按摩安神',desc:'按摩安神穴位组合：神门穴、内关穴、百会穴，可宁心安神、改善睡眠。',difficulty:'简单',duration:'10分钟',benefits:['宁心安神','调节自律神经','缓解焦虑','改善入睡困难'],steps:['按揉神门穴（腕横纹尺侧端）3分钟','按揉内关穴（腕横纹上2寸）3分钟','按揉百会穴（头顶正中）3分钟','每个穴位以酸胀为度','配合深呼吸效果更佳']},
  {name:'睡眠环境优化',desc:'中医认为卧房宜暗、宜静、宜洁。调整卧室环境，配合香薰、音乐等，营造助眠氛围。',difficulty:'简单',duration:'—',benefits:['营造助眠氛围','减少外界干扰','提升睡眠质量','养成睡眠习惯'],steps:['保持卧室黑暗，使用遮光窗帘','室温控制在18-22度','可使用薰衣草、檀香等助眠香薰','选择舒适的枕头和被褥','睡前1小时关闭电子设备']}
];

let selectedQuality = 3;
let currentKnowledge = null;
let currentMethod = null;

function loadData() {
  const data = localStorage.getItem('sleep-data');
  return data ? JSON.parse(data) : { records: [] };
}
function saveData(data) { localStorage.setItem('sleep-data', JSON.stringify(data)); }

function renderKnowledge() {
  document.getElementById('knowledge-list').innerHTML = knowledge.map((k, i) => `
    <div class="li" onclick="showKnowledge(${i})">
      <div><strong>${k.name}</strong><br><span style="color:var(--text2);font-size:.85rem">${k.category}</span></div>
      <span class="tag b">${k.tips.length}条建议</span>
    </div>
  `).join('');
}

function showKnowledge(i) {
  currentKnowledge = i;
  const k = knowledge[i];
  const card = document.getElementById('knowledge-detail');
  card.style.display = 'block';
  document.getElementById('kd-title').textContent = k.name;
  document.getElementById('kd-content').innerHTML = `
    <p style="margin-bottom:12px;color:var(--text2)">${k.desc}</p>
    <div style="margin-bottom:12px"><strong>分类：</strong><span class="tag b">${k.category}</span></div>
    <div><strong>养生要点：</strong>
      ${k.tips.map((t, j) => `<div class="step"><span class="step-num">${j+1}.</span>${t}</div>`).join('')}
    </div>`;
}

function renderMethods() {
  document.getElementById('method-list').innerHTML = methods.map((m, i) => `
    <div class="li" onclick="showMethod(${i})">
      <div><strong>${m.name}</strong><br><span style="color:var(--text2);font-size:.85rem">${m.difficulty} · ${m.duration}</span></div>
      <span class="tag s">${m.benefits.length}种功效</span>
    </div>
  `).join('');
}

function showMethod(i) {
  currentMethod = i;
  const m = methods[i];
  const card = document.getElementById('method-detail');
  card.style.display = 'block';
  document.getElementById('md-title').textContent = m.name;
  document.getElementById('md-content').innerHTML = `
    <p style="margin-bottom:12px;color:var(--text2)">${m.desc}</p>
    <div style="margin-bottom:8px"><strong>难度：</strong><span class="tag s">${m.difficulty}</span> <strong style="margin-left:8px">时长：</strong><span class="tag w">${m.duration}</span></div>
    <div style="margin-bottom:12px"><strong>功效：</strong>${m.benefits.map(b => `<span class="tag s" style="margin:2px">${b}</span>`).join('')}</div>
    <div><strong>操作步骤：</strong>
      ${m.steps.map((s, j) => `<div class="step"><span class="step-num">${j+1}.</span>${s}</div>`).join('')}
    </div>`;
}

// Quality stars
document.getElementById('quality-stars').addEventListener('click', e => {
  const v = e.target.dataset.v;
  if (!v) return;
  selectedQuality = parseInt(v);
  document.querySelectorAll('#quality-stars span').forEach(s => {
    s.classList.toggle('active', parseInt(s.dataset.v) <= selectedQuality);
  });
});
document.querySelectorAll('#quality-stars span').forEach(s => {
  s.classList.toggle('active', parseInt(s.dataset.v) <= selectedQuality);
});

function saveSleepRecord() {
  const sleepTime = document.getElementById('sleep-time').value;
  const wakeTime = document.getElementById('wake-time').value;
  const note = document.getElementById('sleep-note').value;
  if (!sleepTime || !wakeTime) return alert('请填写入睡和起床时间');

  const [sh, sm] = sleepTime.split(':').map(Number);
  const [wh, wm] = wakeTime.split(':').map(Number);
  let hours = (wh * 60 + wm - sh * 60 - sm) / 60;
  if (hours < 0) hours += 24;

  const data = loadData();
  data.records.push({
    date: new Date().toISOString().split('T')[0],
    sleepTime, wakeTime, duration: hours, quality: selectedQuality, note,
    timestamp: Date.now()
  });
  saveData(data);
  alert(`✅ 已记录：${sleepTime}入睡，${wakeTime}起床，时长${hours.toFixed(1)}小时，质量${selectedQuality}星`);
  renderRecent();
}

function renderRecent() {
  const data = loadData();
  const records = data.records.slice(-7).reverse();
  const container = document.getElementById('recent-records');
  if (!records.length) { container.innerHTML = '<div class="empty">暂无记录</div>'; return; }
  container.innerHTML = records.map(r => `
    <div class="log-item">
      <div>
        <strong>${r.sleepTime} → ${r.wakeTime}</strong><br>
        <span class="log-date">${r.date} · ${r.duration.toFixed(1)}小时 · ${'★'.repeat(r.quality)}${'☆'.repeat(5 - r.quality)}</span>
        ${r.note ? `<br><span style="font-size:.8rem;color:var(--text2)">${r.note}</span>` : ''}
      </div>
    </div>
  `).join('');
}

function renderStats() {
  const data = loadData();
  const records = data.records;
  document.getElementById('total-records').textContent = records.length;
  if (!records.length) {
    document.getElementById('avg-duration').textContent = '—';
    document.getElementById('avg-quality').textContent = '—';
    return;
  }
  const avgDur = records.reduce((s, r) => s + r.duration, 0) / records.length;
  const avgQ = records.reduce((s, r) => s + r.quality, 0) / records.length;
  document.getElementById('avg-duration').textContent = avgDur.toFixed(1);
  document.getElementById('avg-quality').textContent = avgQ.toFixed(1);

  const recent = records.slice(-7);
  const chart = document.getElementById('trend-chart');
  chart.innerHTML = recent.map(r => {
    const pct = Math.min(r.duration / 12 * 100, 100);
    const color = r.duration >= 7 ? 'var(--success)' : r.duration >= 5 ? 'var(--warn)' : 'var(--danger)';
    return `<div style="margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;font-size:.8rem"><span>${r.date}</span><span>${r.duration.toFixed(1)}h · ${'★'.repeat(r.quality)}</span></div>
      <div class="quality-bar"><div class="quality-fill" style="width:${pct}%;background:${color}"></div></div>
    </div>`;
  }).join('');
}

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.detail').forEach(d => d.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'record') renderRecent();
    if (tab.dataset.tab === 'stats') renderStats();
  });
});

renderKnowledge();
renderMethods();
</script>
</body>
</html>
