<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💨 气功养生</title>
<meta property="og:title" content="💨 气功养生">
<meta property="og:description" content="气功养生功法大全，站桩、导引、吐纳、内功心法 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="气功养生功法大全，站桩、导引、吐纳、内功心法">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;display:flex;justify-content:center}
.ctn{max-width:600px;width:100%}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit;font-size:.95rem}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:.75rem;font-weight:600}
.tag.s{background:rgba(34,197,94,.15);color:var(--success)}.tag.w{background:rgba(245,158,11,.15);color:var(--warn)}.tag.d{background:rgba(239,68,68,.15);color:var(--danger)}
.li{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.li:hover{border-color:var(--accent)}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:.9rem}
select,input,textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.9rem;margin-bottom:8px}
label{font-size:.85rem;color:var(--text2);margin-bottom:4px;display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
.energy-orb{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,var(--accent),transparent);position:absolute;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-20px) scale(1.2)}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.3);opacity:1}}
.breathe-circle{width:100px;height:100px;border-radius:50%;border:3px solid var(--accent);margin:20px auto;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:600;animation:breathe 4s ease-in-out infinite}
.step-item{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:var(--bg)}
.step-item.active{border-color:var(--accent);background:rgba(59,130,246,.1)}
.rating{display:flex;gap:4px}.rating span{font-size:1.5rem;cursor:pointer;opacity:.3}.rating span.active{opacity:1}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💨</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div class="ctn">
<div class="hdr">
<h1>💨 气功养生</h1>
<p>气功养生功法大全，站桩、导引、吐纳、内功心法</p>
</div>

<div class="cd" id="tipCard">
<h2>💡 今日气功心得</h2>
<p id="dailyTip"></p>
</div>

<div class="cd" id="listView">
<h2>🧘 功法列表</h2>
<div id="methodList"></div>
</div>

<div class="cd" id="detailView" style="display:none">
<button class="sec" onclick="showList()" style="margin-bottom:16px">← 返回列表</button>
<h2 id="detailName"></h2>
<p id="detailOrigin" style="color:var(--text2);margin:8px 0;font-size:.85rem"></p>
<div style="display:flex;gap:8px;margin:12px 0">
<span class="tag" id="detailDifficulty"></span>
<span class="tag s" id="detailDuration"></span>
</div>
<div style="margin:16px 0">
<h3 style="font-size:.95rem;margin-bottom:8px">🌬️ 呼吸法</h3>
<p id="detailBreathing" style="padding:12px;background:var(--bg);border-radius:8px;font-size:.9rem"></p>
</div>
<div style="margin:16px 0">
<h3 style="font-size:.95rem;margin-bottom:8px">📋 练习步骤</h3>
<div id="detailSteps"></div>
</div>
<div style="margin:16px 0;text-align:center">
<button onclick="startPractice()">开始练习</button>
</div>
</div>

<div class="cd" id="practiceView" style="display:none">
<h2>🎯 练习中</h2>
<p id="practiceMethod" style="color:var(--accent);font-weight:600;margin-bottom:12px"></p>
<div style="position:relative;height:120px;margin:20px 0" id="energyContainer"></div>
<div id="breatheGuide" class="breathe-circle">吸气</div>
<div id="currentStep" class="step-item active" style="margin-top:16px"></div>
<p id="practiceTimer" style="text-align:center;font-size:1.5rem;font-weight:700;margin:12px 0;color:var(--accent)"></p>
<div style="display:flex;gap:8px;justify-content:center">
<button onclick="prevStep()">上一步</button>
<button onclick="nextStep()">下一步</button>
</div>
<div style="text-align:center;margin-top:12px">
<button class="sec" onclick="endPractice()">结束练习</button>
</div>
</div>

<div class="cd" id="logView" style="display:none">
<h2>📊 练习记录</h2>
<div id="statsArea" style="display:flex;gap:12px;margin-bottom:16px"></div>
<div id="logList"></div>
</div>

<div style="display:flex;gap:8px;justify-content:center;margin-top:16px">
<button class="sec" onclick="showView('listView')">🧘 功法</button>
<button class="sec" onclick="showView('logView')">📊 记录</button>
</div>
</div>

<script>
const METHODS = [
  {
    id:'zhanzhuang', name:'站桩功', origin:'源于古代导引术，是太极拳的基本功，已有数千年历史。站桩能培养内气，增强体质，是气功入门的基础功法。',
    difficulty:'初级', duration:'15-30分钟',
    breathing:'自然呼吸，逐渐过渡到腹式呼吸。吸气时腹部隆起，呼气时腹部收缩。呼吸要细、匀、深、长。',
    steps:['双脚平行站立，与肩同宽，脚尖微内扣','膝关节微屈，似坐非坐','含胸拔背，尾闾中正','双手环抱于胸前，如抱球状','沉肩坠肘，手指相对','双目微闭，舌抵上腭','意守丹田，排除杂念','站桩15-30分钟']
  },
  {
    id:'baduanjin', name:'八段锦', origin:'起源于宋代，由八节动作组成，是中国最著名的健身气功之一。动作柔和优美，适合各年龄段练习。',
    difficulty:'初级', duration:'15-20分钟',
    breathing:'配合动作自然呼吸，一般起势吸气，落势呼气。动作熟练后可采用逆腹式呼吸。',
    steps:['双手托天理三焦','左右开弓似射雕','调理脾胃须单举','五劳七伤往后瞧','摇头摆尾去心火','两手攀足固肾腰','攒拳怒目增气力','背后七颠百病消']
  },
  {
    id:'daoyin', name:'导引术', origin:'导引术是中医养生的重要组成部分，通过肢体运动配合呼吸来疏通经络、调和气血。马王堆出土的《导引图》是最早的文字记载。',
    difficulty:'初级', duration:'10-20分钟',
    breathing:'以意导气，以气运身。呼吸自然，意念引导气血运行。',
    steps:['准备活动，放松身心','调理呼吸，进入状态','按经络走向进行肢体导引','配合意念引导气血运行','动作轻柔缓慢','收功归元，静养片刻']
  },
  {
    id:'tuna', name:'吐纳功', origin:'吐纳是中国古代的呼吸养生法，通过特定的呼吸方式来调节身体机能。《庄子》记载："吹呴呼吸，吐故纳新"。',
    difficulty:'中级', duration:'10-15分钟',
    breathing:'以鼻吸口呼为主。吸气时意念将清气吸入丹田，呼气时将浊气排出体外。呼吸节奏为吸-停-呼。',
    steps:['盘坐或端坐，放松全身','闭目调息，排除杂念','鼻吸气，腹部隆起，意守丹田','屏息片刻，气沉丹田','口呼气，腹部收缩，排出浊气','反复练习，逐渐延长呼吸时间','收功时叩齿、咽津']
  },
  {
    id:'liuzijue', name:'六字诀', origin:'六字诀是通过六种特定的发声来调理脏腑的功法，最早见于南北朝陶弘景的《养性延命录》。每个字对应一个脏腑。',
    difficulty:'中级', duration:'20-30分钟',
    breathing:'每个字配合特定的呼吸方法。发声时气息从口中呼出，吸气时自然吸入。',
    steps:['嘘字诀 - 对应肝脏，春季练习','呵字诀 - 对应心脏，夏季练习','呼字诀 - 对应脾脏，长夏练习','呬字诀 - 对应肺脏，秋季练习','吹字诀 - 对应肾脏，冬季练习','嘻字诀 - 对应三焦，四季皆可','每个字练习6次，全套练习3遍']
  },
  {
    id:'wuqinxi', name:'五禽戏', origin:'五禽戏是东汉名医华佗创编，模仿虎、鹿、熊、猿、鸟五种动物的动作。是中国最早的全身性医疗体操。',
    difficulty:'中级', duration:'20-30分钟',
    breathing:'配合动作自然呼吸。模仿动物时呼吸要与动作协调，意念集中。',
    steps:['虎戏 - 扑抓动作，强腰固肾','鹿戏 - 奔跑回首，舒展筋骨','熊戏 - 摇晃行走，调理脾胃','猿戏 - 攀爬跳跃，灵活关节','鸟戏 - 展翅飞翔，调理肺气','全套练习，每个动物3-5分钟','收功归元，静养片刻']
  }
];

const TIPS = [
  '气功练习讲究"三调"：调身、调息、调心，三者合一方能见效。',
  '站桩时意守丹田，不可过度执着，似守非守为佳。',
  '练功宜在空气清新、环境安静之处，避免风口和潮湿之地。',
  '饭后一小时内不宜练功，空腹和过饱时也不宜。',
  '初学者练习时间不宜过长，循序渐进为要。',
  '练功时穿着宽松舒适，避免紧身衣物束缚。',
  '气功练习贵在坚持，每日定时练习效果最佳。',
  '练功后不宜立即洗冷水澡，应稍作休息。',
  '情绪激动时不宜练功，应先平复心情。',
  '练功时口中津液增多，应咽下，不可吐出。'
];

let practiceState = null;
let timerInterval = null;

function loadLogs(){ return JSON.parse(localStorage.getItem('qigong_logs')||'[]'); }
function saveLogs(logs){ localStorage.setItem('qigong_logs',JSON.stringify(logs)); }

function showView(id){
  ['listView','detailView','practiceView','logView'].forEach(v=>document.getElementById(v).style.display='none');
  document.getElementById(id).style.display='block';
  if(id==='logView') renderLogs();
}

function renderMethods(){
  const el=document.getElementById('methodList');
  el.innerHTML=METHODS.map(m=>`
    <div class="li" onclick="showDetail('${m.id}')">
      <div><strong>${m.name}</strong><br><span style="color:var(--text2);font-size:.8rem">${m.origin.slice(0,30)}...</span></div>
      <span class="tag ${m.difficulty==='初级'?'s':'w'}">${m.difficulty}</span>
    </div>
  `).join('');
}

function showDetail(id){
  const m=METHODS.find(x=>x.id===id);
  if(!m) return;
  document.getElementById('detailName').textContent=m.name;
  document.getElementById('detailOrigin').textContent=m.origin;
  document.getElementById('detailDifficulty').textContent=m.difficulty;
  document.getElementById('detailDuration').textContent=m.duration;
  document.getElementById('detailBreathing').textContent=m.breathing;
  document.getElementById('detailSteps').innerHTML=m.steps.map((s,i)=>`
    <div class="step-item"><strong>第${i+1}步：</strong>${s}</div>
  `).join('');
  practiceState={method:m,step:0,seconds:0};
  showView('detailView');
}

function showList(){ showView('listView'); }

function startPractice(){
  if(!practiceState) return;
  document.getElementById('practiceMethod').textContent=practiceState.method.name+' 练习中';
  showView('practiceView');
  renderPracticeStep();
  startTimer();
  renderEnergyOrbs();
}

function renderPracticeStep(){
  const m=practiceState.method;
  const step=m.steps[practiceState.step];
  document.getElementById('currentStep').innerHTML=`<strong>第${practiceState.step+1}步：</strong>${step}`;
  const isEven=practiceState.step%2===0;
  const guide=document.getElementById('breatheGuide');
  guide.textContent=isEven?'吸气':'呼气';
  guide.style.animationDuration=isEven?'4s':'3s';
}

function renderEnergyOrbs(){
  const c=document.getElementById('energyContainer');
  c.innerHTML='';
  for(let i=0;i<5;i++){
    const orb=document.createElement('div');
    orb.className='energy-orb';
    orb.style.left=Math.random()*80+10+'%';
    orb.style.top=Math.random()*80+10+'%';
    orb.style.animationDelay=i*0.5+'s';
    c.appendChild(orb);
  }
}

function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    practiceState.seconds++;
    const m=Math.floor(practiceState.seconds/60);
    const s=practiceState.seconds%60;
    document.getElementById('practiceTimer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  },1000);
}

function nextStep(){
  if(!practiceState) return;
  if(practiceState.step<practiceState.method.steps.length-1){
    practiceState.step++;
    renderPracticeStep();
  }
}

function prevStep(){
  if(!practiceState) return;
  if(practiceState.step>0){
    practiceState.step--;
    renderPracticeStep();
  }
}

function endPractice(){
  if(timerInterval) clearInterval(timerInterval);
  const logs=loadLogs();
  logs.push({
    date:new Date().toISOString(),
    method:practiceState.method.name,
    duration:practiceState.seconds,
    steps:practiceState.method.steps.length
  });
  saveLogs(logs);
  practiceState=null;
  showView('listView');
  alert('练习已记录！');
}

function renderLogs(){
  const logs=loadLogs();
  const total=logs.length;
  const totalMin=Math.round(logs.reduce((a,b)=>a+b.duration,0)/60);
  const methodCount={};
  logs.forEach(l=>{methodCount[l.method]=(methodCount[l.method]||0)+1});
  const fav=Object.entries(methodCount).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('statsArea').innerHTML=`
    <div style="flex:1;text-align:center;padding:12px;background:var(--bg);border-radius:8px">
      <div style="font-size:1.5rem;font-weight:700;color:var(--accent)">${total}</div>
      <div style="font-size:.8rem;color:var(--text2)">总次数</div>
    </div>
    <div style="flex:1;text-align:center;padding:12px;background:var(--bg);border-radius:8px">
      <div style="font-size:1.5rem;font-weight:700;color:var(--success)">${totalMin}</div>
      <div style="font-size:.8rem;color:var(--text2)">总分钟</div>
    </div>
    <div style="flex:1;text-align:center;padding:12px;background:var(--bg);border-radius:8px">
      <div style="font-size:1rem;font-weight:700;color:var(--warn)">${fav?fav[0]:'-'}</div>
      <div style="font-size:.8rem;color:var(--text2)">最爱功法</div>
    </div>
  `;
  document.getElementById('logList').innerHTML=logs.length?logs.slice(-10).reverse().map(l=>`
    <div class="li">
      <div><strong>${l.method}</strong><br><span style="color:var(--text2);font-size:.8rem">${new Date(l.date).toLocaleDateString('zh-CN')}</span></div>
      <span class="tag s">${Math.round(l.duration/60)}分钟</span>
    </div>
  `).join(''):'<div class="empty">暂无练习记录</div>';
}

function init(){
  document.getElementById('dailyTip').textContent=TIPS[Math.floor(Math.random()*TIPS.length)];
  renderMethods();
}

init();
</script>
</body>
</html>
