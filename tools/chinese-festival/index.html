ex, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">

<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🏮 中国节日查询</h1><p class="sub">在线查询中国传统节日</p>
<div class="card">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索节日..." oninput="filterFestivals()">
</div>
</div>
<div class="festival-grid" id="festivalGrid"></div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var festivals=[
  {name:'春节',date:'农历正月初一',desc:'中国最重要的传统节日，家人团聚，吃年夜饭，放鞭炮',category:'传统节日'},
  {name:'元宵节',date:'农历正月十五',desc:'赏花灯，吃元宵，猜灯谜',category:'传统节日'},
  {name:'龙抬头',date:'农历二月初二',desc:'理发，吃龙须面，祈求风调雨顺',category:'传统节日'},
  {name:'清明节',date:'公历4月5日前后',desc:'扫墓祭祖，踏青郊游',category:'传统节日'},
  {name:'端午节',date:'农历五月初五',desc:'吃粽子，赛龙舟，挂艾草',category:'传统节日'},
  {name:'七夕节',date:'农历七月初七',desc:'中国情人节，乞巧，观星',category:'传统节日'},
  {name:'中元节',date:'农历七月十五',desc:'祭祀祖先，放河灯',category:'传统节日'},
  {name:'中秋节',date:'农历八月十五',desc:'赏月，吃月饼，家人团聚',category:'传统节日'},
  {name:'重阳节',date:'农历九月初九',desc:'登高，赏菊，佩茱萸',category:'传统节日'},
  {name:'寒衣节',date:'农历十月初一',desc:'祭祀祖先，送寒衣',category:'传统节日'},
  {name:'下元节',date:'农历十月十五',desc:'祭祀祖先，祈求风调雨顺',category:'传统节日'},
  {name:'腊八节',date:'农历腊月初八',desc:'喝腊八粥，祭祀祖先',category:'传统节日'},
  {name:'小年',date:'农历腊月二十三',desc:'祭灶神，扫尘，贴窗花',category:'传统节日'},
  {name:'除夕',date:'农历腊月最后一天',desc:'守岁，吃年夜饭，放鞭炮',category:'传统节日'},
  {name:'元旦',date:'公历1月1日',desc:'新年第一天，放假庆祝',category:'公历节日'},
  {name:'妇女节',date:'公历3月8日',desc:'国际妇女节，庆祝女性成就',category:'公历节日'},
  {name:'劳动节',date:'公历5月1日',desc:'国际劳动节，放假庆祝',category:'公历节日'},
  {name:'青年节',date:'公历5月4日',desc:'中国青年节，纪念五四运动',category:'公历节日'},
  {name:'儿童节',date:'公历6月1日',desc:'国际儿童节，孩子们的节日',category:'公历节日'},
  {name:'建党节',date:'公历7月1日',desc:'中国共产党成立纪念日',category:'公历节日'},
  {name:'建军节',date:'公历8月1日',desc:'中国人民解放军建军纪念日',category:'公历节日'},
  {name:'教师节',date:'公历9月10日',desc:'尊师重教，感谢老师',category:'公历节日'},
  {name:'国庆节',date:'公历10月1日',desc:'中华人民共和国成立纪念日，放假庆祝',category:'公历节日'},
  {name:'重阳节',date:'农历九月初九',desc:'敬老节，关爱老人',category:'公历节日'}
];
function renderFestivals(festivalsToShow){
  var grid=document.getElementById('festivalGrid');
  var html='';
  festivalsToShow.forEach(function(festival){
    html+='<div class="festival-item">';
    html+='<div class="festival-name">'+festival.name+'</div>';
    html+='<div class="festival-date">📅 '+festival.date+'</div>';
    html+='<div class="festival-desc">'+festival.desc+'</div>';
    html+='<div class="festival-days">🏷️ '+festival.category+'</div>';
    html+='</div>';
  });
  grid.innerHTML=html;
}
function filterFestivals(){
  var search=document.getElementById('searchInput').value.toLowerCase();
  var filtered=festivals.filter(function(festival){
    return festival.name.toLowerCase().includes(search)||festival.desc.toLowerCase().includes(search)||festival.category.toLowerCase().includes(search);
  });
  renderFestivals(filtered);
}
renderFestivals(festivals);
</script></body></html>
