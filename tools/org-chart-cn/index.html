<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文组织架构图</title>
<meta name="description" content="可视化创建和管理企业组织架构图，支持拖拽和导出">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6;scroll-behavior:smooth}
.container{max-width:1200px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.hidden{display:none!important}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
#chart-canvas{width:100%;min-height:500px;overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);position:relative}
.org-node{position:absolute;background:var(--card);border:2px solid var(--border);border-radius:10px;padding:12px 16px;min-width:120px;text-align:center;cursor:move;transition:border-color .2s;user-select:none;z-index:1}
.org-node:hover{border-color:var(--accent)}
.org-node.selected{border-color:var(--accent);box-shadow:0 0 12px rgba(59,130,246,.3)}
.org-node .name{font-weight:700;font-size:.95rem}
.org-node .title{font-size:.8rem;color:var(--text2);margin-top:2px}
.org-line{position:absolute;pointer-events:none;z-index:0}
#toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.empty{text-align:center;color:var(--text2);padding:60px 20px;font-size:.9rem}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}h1{font-size:1.4rem}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中文组织架构图">
<meta property="og:description" content="可视化创建和管理企业组织架构图">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='🏢 中文组织架构图';
const APP=document.getElementById('app');
let orgs=JSON.parse(localStorage.getItem('oc_data')||'[]');
let curOrg=null;
let selectedNode=-1;
let dragging=null,dragOff={x:0,y:0};

function save(){localStorage.setItem('oc_data',JSON.stringify(orgs))}

function render(){
  let h=`<h1>🏢 中文组织架构图</h1><p class="subtitle">可视化组织架构管理</p>`;
  if(curOrg!==null){
    let o=orgs[curOrg];
    h+=`<div class="card"><div class="flex-between"><button class="btn btn-sm btn-outline" onclick="curOrg=null;selectedNode=-1;render()">← 返回</button><b>${o.name}</b><div class="flex"><button class="btn btn-sm" onclick="addNode()">+ 添加成员</button><button class="btn btn-sm btn-danger" onclick="deleteOrg()">删除</button></div></div></div>`;
    h+=`<div id="toolbar"><button class="btn btn-sm btn-outline" onclick="autoLayout()">自动排列</button><button class="btn btn-sm btn-outline" onclick="exportSVG()">导出图片</button></div>`;
    h+=`<div id="chart-canvas" style="height:600px;position:relative;overflow:auto">`;
    o.nodes.forEach((n,i)=>{
      let sel=i===selectedNode?'selected':'';
      h+=`<div class="org-node ${sel}" style="left:${n.x}px;top:${n.y}px" onmousedown="startDrag(event,${i})" onclick="selectNode(${i})"><div class="name">${esc(n.name)}</div><div class="title">${esc(n.title)}</div></div>`;
    });
    h+=`</div>`;
    if(selectedNode>=0&&selectedNode<o.nodes.length){
      let n=o.nodes[selectedNode];
      h+=`<div class="card" style="margin-top:12px"><h3 style="margin-bottom:12px">编辑成员</h3>`;
      h+=`<label>姓名</label><input value="${esc(n.name)}" onchange="updateNode('name',this.value)">`;
      h+=`<label>职位</label><input value="${esc(n.title)}" onchange="updateNode('title',this.value)">`;
      h+=`<label>上级</label><select onchange="updateNode('parent',parseInt(this.value))"><option value="-1">无（顶层）</option>`;
      o.nodes.forEach((nd,i)=>{if(i!==selectedNode)h+=`<option value="${i}" ${n.parent===i?'selected':''}>${esc(nd.name)}</option>`});
      h+=`</select>`;
      h+=`<div class="flex" style="margin-top:12px"><button class="btn btn-sm btn-danger" onclick="deleteNode()">删除成员</button></div></div>`;
    }
  } else {
    h+=`<div class="card"><div class="flex-between"><b>我的组织架构</b><button class="btn" onclick="addOrg()">+ 新建架构</button></div></div>`;
    if(orgs.length===0){
      h+=`<div class="empty">暂无组织架构，点击上方按钮新建</div>`;
    } else {
      h+=`<div class="card"><table style="width:100%;border-collapse:collapse">`;
      orgs.forEach((o,i)=>{
        h+=`<tr><td style="padding:12px;border-bottom:1px solid var(--border);cursor:pointer" onclick="curOrg=${i};render()"><b>${esc(o.name)}</b><span style="color:var(--text2);font-size:.85rem;margin-left:8px">${o.nodes.length} 人</span></td><td style="padding:12px;border-bottom:1px solid var(--border);text-align:right"><button class="btn btn-sm btn-danger" onclick="event.stopPropagation();orgs.splice(${i},1);save();render()">删除</button></td></tr>`;
      });
      h+=`</table></div>`;
    }
  }
  APP.innerHTML=h;
}

function addOrg(){
  let name=prompt('请输入组织名称：');
  if(!name)return;
  orgs.push({name,nodes:[{name:'CEO',title:'首席执行官',x:350,y:20,parent:-1}]});
  save();render();
}

function deleteOrg(){
  if(!confirm('确定删除此架构？'))return;
  orgs.splice(curOrg,1);curOrg=null;save();render();
}

function addNode(){
  let o=orgs[curOrg];
  o.nodes.push({name:'新成员',title:'职位',x:100+Math.random()*300,y:100+Math.random()*200,parent:selectedNode>=0?selectedNode:-1});
  save();render();
}

function selectNode(i){selectedNode=i;render()}

function deleteNode(){
  if(selectedNode<0)return;
  let o=orgs[curOrg];
  o.nodes.forEach(n=>{if(n.parent===selectedNode)n.parent=-1;else if(n.parent>selectedNode)n.parent--});
  o.nodes.splice(selectedNode,1);
  selectedNode=-1;save();render();
}

function updateNode(key,val){
  if(selectedNode<0)return;
  orgs[curOrg].nodes[selectedNode][key]=val;
  save();render();
}

function startDrag(e,i){
  e.preventDefault();
  let n=orgs[curOrg].nodes[i];
  dragging=i;
  let rect=e.target.closest('.org-node').getBoundingClientRect();
  dragOff={x:e.clientX-rect.left,y:e.clientY-rect.top};
  document.onmousemove=onDrag;
  document.onmouseup=stopDrag;
}

function onDrag(e){
  if(dragging===null)return;
  let canvas=document.getElementById('chart-canvas');
  let rect=canvas.getBoundingClientRect();
  let n=orgs[curOrg].nodes[dragging];
  n.x=Math.max(0,e.clientX-rect.left-canvas.scrollLeft+canvas.parentElement.scrollLeft-dragOff.x);
  n.y=Math.max(0,e.clientY-rect.top-canvas.scrollTop+canvas.parentElement.scrollTop-dragOff.y);
  save();render();
}

function stopDrag(){dragging=null;document.onmousemove=null;document.onmouseup=null}

function autoLayout(){
  let o=orgs[curOrg];
  if(o.nodes.length===0)return;
  let levels={};let roots=[];
  o.nodes.forEach((n,i)=>{if(n.parent===-1||n.parent>=o.nodes.length)roots.push(i);else{let lv=1;let p=n.parent;while(p>=0&&p<o.nodes.length&&o.nodes[p].parent!==-1){p=o.nodes[p].parent;lv++}if(!levels[lv])levels[lv]=[];levels[lv].push(i)}});
  roots.forEach((ri,idx)=>{o.nodes[ri].x=200+idx*200;o.nodes[ri].y=20});
  Object.keys(levels).sort((a,b)=>a-b).forEach(lv=>{
    let arr=levels[lv];
    arr.forEach((ni,idx)=>{o.nodes[ni].x=100+idx*200;o.nodes[ni].y=20+lv*100});
  });
  save();render();
}

function exportSVG(){
  let o=orgs[curOrg];
  let maxX=0,maxY=0;
  o.nodes.forEach(n=>{maxX=Math.max(maxX,n.x+150);maxY=Math.max(maxY,n.y+80)});
  let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${maxX}" height="${maxY}" style="background:#0d1117">`;
  o.nodes.forEach(n=>{
    if(n.parent>=0&&n.parent<o.nodes.length){
      let p=o.nodes[n.parent];
      svg+=`<line x1="${p.x+60}" y1="${p.y+40}" x2="${n.x+60}" y2="${n.y}" stroke="#30363d" stroke-width="2"/>`;
    }
  });
  o.nodes.forEach(n=>{
    svg+=`<rect x="${n.x}" y="${n.y}" width="120" height="50" rx="10" fill="#161b22" stroke="#3b82f6" stroke-width="2"/>`;
    svg+=`<text x="${n.x+60}" y="${n.y+22}" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="bold" font-family="sans-serif">${esc(n.name)}</text>`;
    svg+=`<text x="${n.x+60}" y="${n.y+40}" text-anchor="middle" fill="#8b949e" font-size="11" font-family="sans-serif">${esc(n.title)}</text>`;
  });
  svg+=`</svg>`;
  let blob=new Blob([svg],{type:'image/svg+xml'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='org-chart.svg';a.click();
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

render();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
