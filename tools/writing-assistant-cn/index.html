<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✍️ 中文写作助手</title>
<meta property="og:title" content="✍️ 中文写作助手">
<meta property="og:description" content="✍️ 中文写作助手 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="写作辅助工具，提供写作模板、字数统计、语法检查、Markdown预览">
<meta name="robots" content="index, follow">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:1000px;margin:0 auto}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
textarea{width:100%;padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;font-size:15px;line-height:1.8;resize:none;min-height:400px;font-family:inherit}
textarea:focus{border-color:var(--accent)}
button{padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.85}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.hidden{display:none}
.stat-bar{display:flex;gap:16px;flex-wrap:wrap;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px}
.stat-item{text-align:center}
.stat-num{font-size:1.2rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.7rem;color:var(--text2)}
.editor-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;height:calc(100vh - 220px);min-height:400px}
.preview{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;overflow-y:auto;line-height:1.9}
.preview h1{font-size:1.6rem;margin:16px 0 8px;border-bottom:2px solid var(--accent);padding-bottom:6px}
.preview h2{font-size:1.3rem;margin:14px 0 6px;color:var(--accent)}
.preview h3{font-size:1.1rem;margin:12px 0 4px}
.preview p{margin:8px 0}
.preview code{background:var(--bg);padding:2px 6px;border-radius:4px;font-size:.9rem}
.preview pre{background:var(--bg);padding:12px;border-radius:8px;overflow-x:auto;margin:8px 0}
.preview pre code{background:none;padding:0}
.preview blockquote{border-left:3px solid var(--accent);padding-left:12px;color:var(--text2);margin:8px 0}
.preview ul,.preview ol{padding-left:24px;margin:8px 0}
.preview strong{color:var(--accent)}
.suggestion{padding:12px;margin:6px 0;border-radius:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer;transition:all .15s}
.suggestion:hover{border-color:var(--accent)}
.suggestion .type{font-size:.75rem;color:var(--accent);font-weight:600}
.suggestion .text{font-size:.9rem;margin-top:4px}
.template-card{padding:16px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;background:var(--card)}
.template-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.template-card h3{font-size:1rem;margin-bottom:4px}
.template-card p{font-size:.8rem;color:var(--text2)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:90%;max-width:600px;max-height:80vh;overflow-y:auto}
@media(max-width:768px){.editor-wrap{grid-template-columns:1fr;height:auto}textarea{min-height:300px}.preview{min-height:300px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✍️</text></svg>">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1 style="position:fixed;top:6px;left:80px;z-index:999;font-size:1rem;pointer-events:none">✍️ 中文写作助手</h1>

<div class="ctn" style="padding-top:50px">
<div class="bg" style="justify-content:center;margin-bottom:16px">
<button onclick="showView('editor')" id="btn-editor">📝 编辑</button>
<button onclick="showView('templates')" id="btn-templates">📋 模板</button>
<button onclick="showView('suggestions')" id="btn-suggestions">💡 建议</button>
<button class="sec" onclick="saveContent()">💾 保存</button>
<button class="sec" onclick="exportContent()">📤 导出</button>
<button class="sec" onclick="document.getElementById('import-file').click()">📥 导入</button>
</div>

<div id="view-editor">
<div class="stat-bar" id="stats-bar"></div>
<div class="editor-wrap">
<textarea id="editor" placeholder="开始写作..." oninput="onInput()"></textarea>
<div class="preview" id="preview"></div>
</div>
</div>

<div id="view-templates" class="hidden">
<div class="bg" style="margin-bottom:16px;justify-content:center">
<h2 style="margin:0">📋 写作模板</h2>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px" id="template-grid"></div>
</div>

<div id="view-suggestions" class="hidden">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
<h2 style="margin:0">💡 写作建议</h2>
<button onclick="analyzeText()">🔄 重新分析</button>
</div>
<div id="suggestion-list"></div>
</div>
</div>

<input type="file" id="import-file" accept=".md,.txt" style="display:none" onchange="handleImport(event)">

<script>
const STORAGE_KEY='writing_assistant_data';
let content='';

function load(){try{const d=JSON.parse(localStorage.getItem(STORAGE_KEY));if(d)content=d.content||''}catch(e){}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify({content}))}

function showView(v){['editor','templates','suggestions'].forEach(id=>{document.getElementById('view-'+id).classList.toggle('hidden',id!==v);document.getElementById('btn-'+id)?.classList.toggle('active',id===v)});if(v==='suggestions')analyzeText()}

function onInput(){
content=document.getElementById('editor').value;
updateStats();
renderPreview();
}

function updateStats(){
const text=document.getElementById('editor').value;
const chars=text.length;
const charsNoSpace=text.replace(/\s/g,'').length;
const words=text.trim()?text.trim().split(/\s+/).length:0;
const sentences=text.split(/[。！？.!?]+/).filter(s=>s.trim()).length;
const paragraphs=text.split(/\n\s*\n/).filter(p=>p.trim()).length;
const readMin=Math.ceil(charsNoSpace/400);
document.getElementById('stats-bar').innerHTML=`
<div class="stat-item"><div class="stat-num">${chars}</div><div class="stat-label">字符数</div></div>
<div class="stat-item"><div class="stat-num">${charsNoSpace}</div><div class="stat-label">不含空格</div></div>
<div class="stat-item"><div class="stat-num">${words}</div><div class="stat-label">词数</div></div>
<div class="stat-item"><div class="stat-num">${sentences}</div><div class="stat-label">句子数</div></div>
<div class="stat-item"><div class="stat-num">${paragraphs}</div><div class="stat-label">段落数</div></div>
<div class="stat-item"><div class="stat-num">~${readMin}分</div><div class="stat-label">阅读时间</div></div>`;
}

function renderPreview(){
const text=document.getElementById('editor').value;
const html=markdownToHTML(text);
document.getElementById('preview').innerHTML=html||'<div style="color:var(--text2);text-align:center;padding:40px">预览区域</div>';
}

function markdownToHTML(md){
if(!md)return'';
let html=md
.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
.replace(/^### (.+)$/gm,'<h3>$1</h3>')
.replace(/^## (.+)$/gm,'<h2>$1</h2>')
.replace(/^# (.+)$/gm,'<h1>$1</h1>')
.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
.replace(/\*(.+?)\*/g,'<em>$1</em>')
.replace(/`(.+?)`/g,'<code>$1</code>')
.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>')
.replace(/^- (.+)$/gm,'<li>$1</li>')
.replace(/^(\d+)\. (.+)$/gm,'<li>$2</li>')
.replace(/\n\n/g,'</p><p>')
.replace(/\n/g,'<br>');
return'<p>'+html+'</p>';
}

function analyzeText(){
const text=document.getElementById('editor').value;
const suggestions=[];
if(!text){document.getElementById('suggestion-list').innerHTML='<div style="color:var(--text2);text-align:center;padding:40px">请输入文字后获取建议</div>';return}

// Length check
if(text.length<100)suggestions.push({type:'长度',text:'文章较短，建议扩展内容至300字以上',level:'warn'});
else if(text.length>5000)suggestions.push({type:'长度',text:'文章较长，考虑是否可以精简',level:'info'});
else suggestions.push({type:'长度',text:'文章长度适中',level:'good'});

// Sentence length
const sentences=text.split(/[。！？.!?]+/).filter(s=>s.trim());
const longSentences=sentences.filter(s=>s.length>60);
if(longSentences.length) suggestions.push({type:'句子',text:`有${longSentences.length}个句子过长(>60字)，建议拆分`,level:'warn'});
else suggestions.push({type:'句子',text:'句子长度适中，阅读体验良好',level:'good'});

// Repetition
const words=text.split('');
const wordFreq={};
words.forEach(w=>{if(w.trim())wordFreq[w]=(wordFreq[w]||0)+1});
const repeated=Object.entries(wordFreq).filter(([k,v])=>v>10&&k.trim());
if(repeated.length)suggestions.push({type:'重复',text:`"${repeated[0][0]}"出现${repeated[0][1]}次，考虑使用同义词替换`,level:'warn'});

// Punctuation
const commaCount=(text.match(/，/g)||[]).length;
const periodCount=(text.match(/。/g)||[]).length;
if(periodCount===0&&text.length>50)suggestions.push({type:'标点',text:'建议使用句号分隔句子',level:'warn'});

// Structure
const hasHeading=text.match(/^#{1,3} /m);
const hasList=text.match(/^[-\d]+\.? /m);
if(text.length>300&&!hasHeading)suggestions.push({type:'结构',text:'长文章建议使用标题(##)组织结构',level:'info'});
if(text.length>500&&!hasList)suggestions.push({type:'结构',text:'考虑使用列表(-)增强可读性',level:'info'});

// Readability
const avgSentenceLen=sentences.length?text.length/sentences.length:0;
if(avgSentenceLen>40)suggestions.push({type:'可读性',text:'平均句子长度偏高，建议使用短句',level:'warn'});
else suggestions.push({type:'可读性',text:'可读性良好',level:'good'});

const el=document.getElementById('suggestion-list');
el.innerHTML=suggestions.map(s=>{
const colors={good:'var(--green)',warn:'var(--yellow)',info:'var(--accent)'};
return`<div class="suggestion"><div class="type" style="color:${colors[s.level]}">${s.type}</div><div class="text">${s.text}</div></div>`;
}).join('');
}

function saveContent(){content=document.getElementById('editor').value;save();alert('已保存！')}

function exportContent(){
const text=document.getElementById('editor').value;
const blob=new Blob([text],{type:'text/markdown'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='写作内容.md';a.click();
}

function handleImport(e){
const f=e.target.files[0];if(!f)return;
const r=new FileReader();r.onload=ev=>{document.getElementById('editor').value=ev.target.result;onInput()};r.readAsText(f);
}

const templates=[
{name:'议论文',desc:'标准议论文结构',content:'# 标题\n\n## 引言\n\n（提出论点）\n\n## 论证一\n\n（分论点一及论据）\n\n## 论证二\n\n（分论点二及论据）\n\n## 反驳\n\n（对反面观点的回应）\n\n## 结论\n\n（总结全文，重申论点）\n'},
{name:'记叙文',desc:'故事叙述模板',content:'# 标题\n\n## 开头\n\n（时间、地点、人物设定）\n\n## 发展\n\n（事件经过）\n\n## 高潮\n\n（矛盾冲突）\n\n## 结局\n\n（故事收尾）\n\n## 感悟\n\n（从中得到的启示）\n'},
{name:'读书笔记',desc:'阅读后的整理笔记',content:'# 《书名》读书笔记\n\n## 基本信息\n- 作者：\n- 出版时间：\n- 阅读时间：\n\n## 核心观点\n\n（书的主要论点）\n\n## 精彩摘录\n\n> \n\n## 个人思考\n\n（自己的理解与感悟）\n\n## 行动计划\n\n- [ ] \n'},
{name:'工作日报',desc:'每日工作总结',content:'# 工作日报\n\n**日期**：\n**姓名**：\n\n## 今日完成\n\n1. \n2. \n\n## 进行中\n\n1. \n\n## 遇到的问题\n\n- \n\n## 明日计划\n\n1. \n2. \n'},
{name:'会议纪要',desc:'会议记录模板',content:'# 会议纪要\n\n**会议主题**：\n**时间**：\n**参会人员**：\n**记录人**：\n\n## 议题一\n\n**讨论内容**：\n\n**决议**：\n\n## 议题二\n\n**讨论内容**：\n\n**决议**：\n\n## 待办事项\n\n| 负责人 | 事项 | 截止日期 |\n|--------|------|----------|\n| | | |\n'},
{name:'项目提案',desc:'项目方案书模板',content:'# 项目提案\n\n## 项目背景\n\n（为什么要做这个项目）\n\n## 项目目标\n\n（要达成什么目标）\n\n## 实施方案\n\n### 技术方案\n\n### 时间计划\n\n### 资源需求\n\n## 预期成果\n\n## 风险评估\n\n| 风险 | 影响 | 应对措施 |\n|------|------|----------|\n| | | |\n'}
];

function renderTemplates(){
document.getElementById('template-grid').innerHTML=templates.map((t,i)=>`<div class="template-card" onclick="useTemplate(${i})"><h3>${t.name}</h3><p>${t.desc}</p></div>`).join('');
}

function useTemplate(i){
document.getElementById('editor').value=templates[i].content;
onInput();showView('editor');
}

load();
document.getElementById('editor').value=content;
updateStats();renderPreview();renderTemplates();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
