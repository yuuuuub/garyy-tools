<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双人桌上冰球</title>
    <meta name="description" content="双人桌上冰球游戏，和朋友对战比拼反应速度">
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --accent: #3b82f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { margin-bottom: 10px; }
        .score-board {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        .score-board .player {
            padding: 10px 30px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 10px;
            text-align: center;
        }
        .score-board .player.p1 { border-color: #ef4444; }
        .score-board .player.p2 { border-color: #3b82f6; }
        .score-board .score { font-size: 2rem; font-weight: bold; }
        #game-container {
            background: #1e3a5f;
            border-radius: 15px;
            padding: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        canvas { display: block; }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 12px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .status {
            margin-top: 15px;
            padding: 12px 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1.1rem;
        }
        .status.win { border-color: #22c55e; background: #14532d; }
        .controls-info {
            margin-top: 15px;
            padding: 15px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            color: #8b949e;
        }
    </style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="双人桌上冰球">
  <meta property="og:description" content="双人桌上冰球游戏，和朋友对战比拼反应速度">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/air-hockey-2p/">
</head>
<body>
    <h1>🏒 双人桌上冰球</h1>
    
    <div class="score-board">
        <div class="player p1">
            <div>玩家1 (W/S)</div>
            <div class="score" id="score1">0</div>
        </div>
        <div class="player p2">
            <div>玩家2 (↑/↓)</div>
            <div class="score" id="score2">0</div>
        </div>
    </div>
    
    <div id="game-container">
        <canvas id="canvas"></canvas>
    </div>
    
    <div class="controls">
        <button onclick="resetGame()">重新开始</button>
    </div>
    
    <div class="status" id="status">先得7分获胜！</div>
    
    <div class="controls-info">
        <p>玩家1：W(上) / S(下)</p>
        <p>玩家2：↑(上) / ↓(下)</p>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const score1El = document.getElementById('score1');
        const score2El = document.getElementById('score2');
        
        const W = 500;
        const H = 700;
        const PADDLE_W = 100;
        const PADDLE_H = 15;
        const PUCK_R = 15;
        const GOAL_W = 120;
        const WIN_SCORE = 7;
        
        canvas.width = W;
        canvas.height = H;
        
        let paddle1, paddle2, puck;
        let score1 = 0;
        let score2 = 0;
        let gameOver = false;
        let keys = {};
        
        function init() {
            paddle1 = { x: W / 2 - PADDLE_W / 2, y: 30, vx: 0 };
            paddle2 = { x: W / 2 - PADDLE_W / 2, y: H - 30 - PADDLE_H, vx: 0 };
            puck = { x: W / 2, y: H / 2, vx: 3, vy: 3 };
            
            score1 = 0;
            score2 = 0;
            gameOver = false;
            
            score1El.textContent = score1;
            score2El.textContent = score2;
            statusEl.textContent = '先得7分获胜！';
            statusEl.className = 'status';
            
            draw();
        }
        
        function draw() {
            ctx.fillStyle = '#1e3a5f';
            ctx.fillRect(0, 0, W, H);
            
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(5, 5, W - 10, H - 10);
            
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(5, H / 2);
            ctx.lineTo(W - 5, H / 2);
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.beginPath();
            ctx.arc(W / 2, H / 2, 50, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.stroke();
            
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(W / 2 - GOAL_W / 2, 0, GOAL_W, 10);
            ctx.fillRect(W / 2 - GOAL_W / 2, H - 10, GOAL_W, 10);
            
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(W / 2 - GOAL_W / 2, 5);
            ctx.lineTo(W / 2 + GOAL_W / 2, 5);
            ctx.stroke();
            
            ctx.strokeStyle = '#3b82f6';
            ctx.beginPath();
            ctx.moveTo(W / 2 - GOAL_W / 2, H - 5);
            ctx.lineTo(W / 2 + GOAL_W / 2, H - 5);
            ctx.stroke();
            
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(paddle1.x, paddle1.y, PADDLE_W, PADDLE_H);
            
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(paddle2.x, paddle2.y, PADDLE_W, PADDLE_H);
            
            ctx.beginPath();
            ctx.arc(puck.x, puck.y, PUCK_R, 0, Math.PI * 2);
            const gradient = ctx.createRadialGradient(puck.x - 3, puck.y - 3, 2, puck.x, puck.y, PUCK_R);
            gradient.addColorStop(0, '#fff');
            gradient.addColorStop(1, '#ccc');
            ctx.fillStyle = gradient;
            ctx.fill();
        }
        
        function update() {
            if (gameOver) return;
            
            if (keys['w'] || keys['W']) paddle1.vx = -8;
            else if (keys['s'] || keys['S']) paddle1.vx = 8;
            else paddle1.vx = 0;
            
            if (keys['ArrowUp']) paddle2.vx = -8;
            else if (keys['ArrowDown']) paddle2.vx = 8;
            else paddle2.vx = 0;
            
            paddle1.y += paddle1.vx;
            paddle2.y += paddle2.vx;
            
            paddle1.y = Math.max(10, Math.min(H / 2 - PADDLE_H - 10, paddle1.y));
            paddle2.y = Math.max(H / 2 + 10, Math.min(H - 10 - PADDLE_H, paddle2.y));
            
            paddle1.x = Math.max(10, Math.min(W - 10 - PADDLE_W, paddle1.x));
            paddle2.x = Math.max(10, Math.min(W - 10 - PADDLE_W, paddle2.x));
            
            puck.x += puck.vx;
            puck.y += puck.vy;
            
            if (puck.x - PUCK_R < 10) { puck.x = PUCK_R + 10; puck.vx *= -1; }
            if (puck.x + PUCK_R > W - 10) { puck.x = W - PUCK_R - 10; puck.vx *= -1; }
            
            if (puck.y - PUCK_R < 10) {
                if (puck.x > W / 2 - GOAL_W / 2 && puck.x < W / 2 + GOAL_W / 2) {
                    score2++;
                    score2El.textContent = score2;
                    if (score2 >= WIN_SCORE) {
                        gameOver = true;
                        statusEl.textContent = '🎉 玩家2获胜！';
                        statusEl.className = 'status win';
                    } else {
                        resetPuck();
                    }
                } else {
                    puck.y = PUCK_R + 10;
                    puck.vy *= -1;
                }
            }
            
            if (puck.y + PUCK_R > H - 10) {
                if (puck.x > W / 2 - GOAL_W / 2 && puck.x < W / 2 + GOAL_W / 2) {
                    score1++;
                    score1El.textContent = score1;
                    if (score1 >= WIN_SCORE) {
                        gameOver = true;
                        statusEl.textContent = '🎉 玩家1获胜！';
                        statusEl.className = 'status win';
                    } else {
                        resetPuck();
                    }
                } else {
                    puck.y = H - PUCK_R - 10;
                    puck.vy *= -1;
                }
            }
            
            checkPaddleCollision(paddle1, 1);
            checkPaddleCollision(paddle2, -1);
            
            draw();
        }
        
        function checkPaddleCollision(paddle, dir) {
            if (puck.y + PUCK_R > paddle.y && 
                puck.y - PUCK_R < paddle.y + PADDLE_H &&
                puck.x + PUCK_R > paddle.x && 
                puck.x - PUCK_R < paddle.x + PADDLE_W) {
                
                puck.vy = Math.abs(puck.vy) * dir;
                puck.y = dir > 0 ? paddle.y - PUCK_R : paddle.y + PADDLE_H + PUCK_R;
                
                const hitPos = (puck.x - paddle.x) / PADDLE_W;
                puck.vx = (hitPos - 0.5) * 8;
            }
        }
        
        function resetPuck() {
            puck.x = W / 2;
            puck.y = H / 2;
            puck.vx = (Math.random() - 0.5) * 4;
            puck.vy = (Math.random() > 0.5 ? 1 : -1) * 3;
        }
        
        function resetGame() {
            init();
        }
        
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        function gameLoop() {
            update();
            requestAnimationFrame(gameLoop);
        }
        requestAnimationFrame(gameLoop);
        
        init();
    </script>
</body>
</html>
