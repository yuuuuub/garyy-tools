<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON转YAML</title><meta name="description" content="JSON转YAML - 在线JSON转YAML工具"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:1000px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}textarea{width:100%;min-height:300px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-family:monospace;font-size:.85rem;resize:vertical;outline:none}textarea:focus{border-color:var(--blue)}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:600px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.btn-group{display:flex;gap:8px;fle <div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔄 JSON转YAML</h1><p class="sub">在线JSON转YAML工具</p>
<div class="layout">
<div class="card">
<div class="label">输入JSON</div>
<textarea id="jsonInput" placeholder='{"key": "value", "number": 123}'></textarea>
</div>
<div class="card">
<div class="label">YAML输出</div>
<textarea id="yamlOutput" readonly placeholder="YAML将显示在这里..."></textarea>
</div>
</div>
<div class="btn-group" style="justify-content:center">
<button class="btn" onclick="convertToJsonToYaml()">JSON → YAML</button>
<button class="btn" onclick="convertYamlToJson()">YAML → JSON</button>
<button class="btn" onclick="copyYaml()">复制YAML</button>
<button class="btn" onclick="copyJson()">复制JSON</button>
<button class="btn" onclick="clearAll()">清空</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
function convertToJsonToYaml(){
  var json=document.getElementById('jsonInput').value;
  var r=document.getElementById('result');
  if(!json){r.innerHTML='<div class="card" style="color:var(--red)">请输入JSON</div>';return;}
  try{
    var obj=JSON.parse(json);
    var yaml=jsonToYaml(obj);
    document.getElementById('yamlOutput').value=yaml;
    r.innerHTML='<div class="card" style="color:var(--green)">✅ 转换成功</div>';
  }catch(e){
    r.innerHTML='<div class="card" style="color:var(--red)">JSON格式错误: '+e.message+'</div>';
  }
}
function convertYamlToJson(){
  var yaml=document.getElementById('yamlOutput').value;
  var r=document.getElementById('result');
  if(!yaml){r.innerHTML='<div class="card" style="color:var(--red)">请输入YAML</div>';return;}
  try{
    var obj=yamlToJson(yaml);
    var json=JSON.stringify(obj,null,2);
    document.getElementById('jsonInput').value=json;
    r.innerHTML='<div class="card" style="color:var(--green)">✅ 转换成功</div>';
  }catch(e){
    r.innerHTML='<div class="card" style="color:var(--red)">YAML格式错误: '+e.message+'</div>';
  }
}
function copyYaml(){
  var yaml=document.getElementById('yamlOutput').value;
  if(!yaml){alert('没有YAML可复制');return;}
  navigator.clipboard.writeText(yaml).then(function(){alert('已复制YAML');}).catch(function(){alert('复制失败');});
}
function copyJson(){
  var json=document.getElementById('jsonInput').value;
  if(!json){alert('没有JSON可复制');return;}
  navigator.clipboard.writeText(json).then(function(){alert('已复制JSON');}).catch(function(){alert('复制失败');});
}
function clearAll(){
  document.getElementById('jsonInput').value='';
  document.getElementById('yamlOutput').value='';
  document.getElementById('result').innerHTML='';
}
function jsonToYaml(obj,indent){
  indent=indent||0;
  var prefix='  '.repeat(indent);
  var yaml='';
  if(Array.isArray(obj)){
    if(obj.length===0)return prefix+'[]';
    obj.forEach(function(item){
      if(typeof item==='object'&&item!==null){
        yaml+=prefix+'-\n'+jsonToYaml(item,indent+1);
      }else{
        yaml+=prefix+'- '+formatYamlValue(item)+'\n';
      }
    });
  }else if(typeof obj==='object'&&obj!==null){
    var keys=Object.keys(obj);
    if(keys.length===0)return prefix+'{}';
    keys.forEach(function(key){
      var value=obj[key];
      if(typeof value==='object'&&value!==null){
        yaml+=prefix+key+':\n'+jsonToYaml(value,indent+1);
      }else{
        yaml+=prefix+key+': '+formatYamlValue(value)+'\n';
      }
    });
  }else{
    yaml+=prefix+formatYamlValue(obj)+'\n';
  }
  return yaml;
}
function formatYamlValue(value){
  if(value===null)return'null';
  if(value===undefined)return'';
  if(typeof value==='string'){
    if(/[:{}\[\],&*?|>!%@`]/.test(value)||value.includes('\n')||value.startsWith(' ')||value.endsWith(' ')){
      return'"'+value.replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\n/g,'\\n')+'"';
    }
    return value;
  }
  if(typeof value==='boolean')return value.toString();
  if(typeof value==='number')return value.toString();
  return String(value);
}
function yamlToJson(yaml){
  var lines=yaml.split('\n');
  var result={};
  var currentObj=result;
  var stack=[{obj:result,indent:-1}];
  lines.forEach(function(line){
    if(line.trim()===''||line.trim().startsWith('#'))return;
    var indent=line.length-line.trimStart().length;
    while(stack.length>1&&stack[stack.length-1].indent>=indent){stack.pop();}
    currentObj=stack[stack.length-1].obj;
    var trimmed=line.trim();
    if(trimmed.startsWith('- ')){
      var value=parseYamlValue(trimmed.substring(2));
      if(!Array.isArray(currentObj)){
        var parent=stack[stack.length-2];
        parent.obj[parent.key]=[];
        currentObj=parent.obj[parent.key];
      }
      currentObj.push(value);
    }else if(trimmed.includes(': ')){
      var colonIndex=trimmed.indexOf(': ');
      var key=trimmed.substring(0,colonIndex).trim();
      var valueStr=trimmed.substring(colonIndex+2).trim();
      if(valueStr===''||valueStr==='{'){
        currentObj[key]={};
        stack.push({obj:currentObj[key],key:key,indent:indent});
      }else{
        currentObj[key]=parseYamlValue(valueStr);
      }
    }else if(trimmed.endsWith(':')){
      var key=trimmed.slice(0,-1).trim();
      currentObj[key]={};
      stack.push({obj:currentObj[key],key:key,indent:indent});
    }
  });
  return result;
}
function parseYamlValue(str){
  if(str==='null'||str==='~')return null;
  if(str==='true')return true;
  if(str==='false')return false;
  if(/^-?\d+$/.test(str))return parseInt(str);
  if(/^-?\d+\.\d+$/.test(str))return parseFloat(str);
  if((str.startsWith('"')&&str.endsWith('"'))||(str.startsWith("'")&&str.endsWith("'"))){
    return str.slice(1,-1);
  }
  if(str.startsWith('[')&&str.endsWith(']')){
    try{return JSON.parse(str);}catch(e){return str;}
  }
  return str;
}
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
