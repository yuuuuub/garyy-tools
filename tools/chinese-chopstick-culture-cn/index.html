<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国筷子文化 - Chinese Chopstick Culture</title>
<meta name="description" content="中国筷子文化百科，筷子历史、材质、地域风格、使用禁忌、工艺、象征意义">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国筷子文化 - Chinese Chopstick Culture">
<meta property="og:description" content="中国筷子文化百科，筷子历史、材质、地域风格、使用禁忌、工艺、象征意义">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-chopstick-culture-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥢</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#8b4513;--accent2:#6b3410}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#8b4513;--accent2:#6b3410}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a0f05 0%,#2a1a0a 50%,#3a2510 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #5a3a18;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#cd853f,#8b4513,#a0522d,#deb887);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.tea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.tea-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.tea-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.tea-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.tea-card .t-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.tea-card .t-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(139,69,19,0.15);color:var(--accent)}
.tea-card .t-name{font-size:1.3em;font-weight:bold}
.tea-card .t-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.tea-card .t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tea-card .t-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.tea-card .t-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.tea-card .t-detail strong{color:var(--text)}
.tea-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.tea-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🥢 中国筷子文化</h1>
<p>Chinese Chopstick Culture — 一双筷子，千年文明</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索筷子文化...（如"竹筷""紫檀""禁忌"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="历史渊源">📜 历史渊源</button>
<button class="filter-btn" data-filter="材质工艺">🪵 材质工艺</button>
<button class="filter-btn" data-filter="地域风格">🗺️ 地域风格</button>
<button class="filter-btn" data-filter="使用禁忌">🚫 使用禁忌</button>
<button class="filter-btn" data-filter="象征寓意">✨ 象征寓意</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="tea-grid" id="teaGrid"></div>
<footer><p>🥢 中国筷子文化 — 一双筷子，千年文明</p></footer>
</div>
<script>
const TEA_DATA=[
  {id:1,name:"筷子起源",en:"Origin of Chopsticks",category:"历史渊源",icon:"📜",summary:"三千多年的使用历史",detail:"筷子古称'箸'，最早出现在商代，距今已有三千多年历史。最初用于从锅中捞取食物。《史记》记载'纣王用象牙箸'，说明商代已有精致的筷子。明代后改称'筷子'，取'快'的谐音。",origin:"商代（约公元前1600年）",usage:"中国人日常用餐的主要餐具"},
  {id:2,name:"从箸到筷",en:"From 'Zhu' to 'Kuai'",category:"历史渊源",icon:"📝",summary:"名称的演变",detail:"筷子原名'箸'，因'箸'与'住'谐音（停住、搁浅），对行船不吉利。明代江南船民忌讳'箸'，改称'快'，后加竹字头成'筷'。这一叫法逐渐推广至全国。",origin:"明代民间忌讳",usage:"语言文化中的谐音禁忌影响"},
  {id:3,name:"材质总览",en:"Overview of Materials",category:"材质工艺",icon:"🪵",summary:"从竹木到金银",detail:"筷子材质极为丰富：竹筷（最常见）、木筷（红木、檀木）、金属筷（不锈钢、银筷）、骨筷（牛骨、象牙已禁）、陶瓷筷、塑料筷等。不同材质体现不同的文化价值和使用场景。",origin:"各时代发展",usage:"日常使用与收藏鉴赏"},
  {id:4,name:"竹筷",en:"Bamboo Chopsticks",category:"材质工艺",icon:"🎋",summary:"最普及的筷子",detail:"竹筷是中国最常用的筷子，轻便、便宜、环保。南方多用毛竹筷，北方多用箭竹筷。新筷子使用前要用盐水煮沸消毒。竹筷容易发霉，建议三个月更换一次。",origin:"竹文化传统",usage:"家庭日常使用的首选筷子"},
  {id:5,name:"红木筷",en:"Rosewood Chopsticks",category:"材质工艺",icon:"🪵",summary:"高档木筷",detail:"红木筷以紫檀、黄花梨、鸡翅木等名贵木材制成。手感温润，纹理美观，有一定收藏价值。使用前需要保养，不能长时间泡水，定期用食用油保养。",origin:"明清家具传统",usage:"高档家庭和礼品筷子"},
  {id:6,name:"银筷",en:"Silver Chopsticks",category:"材质工艺",icon:"🥈",summary:"验毒的传说",detail:"古代贵族使用银筷，传说银遇毒会变黑。虽然现代科学证明银筷验毒并不准确，但银离子确实有杀菌作用。银筷在古代是身份和地位的象征。",origin:"唐代宫廷",usage:"古代宫廷与贵族用餐"},
  {id:7,name:"北京风格",en:"Beijing Style",category:"地域风格",icon:"🏛️",summary:"大气端庄",detail:"北京筷子讲究大气端庄，多用红木或黄杨木，长度较长（约27厘米），筷头较粗。宫廷御用筷有鎏金、银丝镶嵌等装饰。北京人请客用高档筷子表示尊重。",origin:"京派文化",usage:"北方正式宴席"},
  {id:8,name:"潮汕风格",en:"Chaoshan Style",category:"地域风格",icon:"🌊",summary:"精致小巧",detail:"潮汕功夫茶配功夫筷，筷子较短（约21厘米），多用竹制或骨制。潮汕人吃饭用的公筷和私筷分开，体现了精细的饮食文化。潮汕地区的筷架也很讲究。",origin:"潮汕饮食文化",usage:"闽南功夫茶配餐"},
  {id:9,name:"日式筷子",en:"Japanese Hashi",category:"地域风格",icon:"🗾",summary:"短而尖",detail:"日本筷子（hashi）源自中国但发展出独特风格：较短（约23厘米），筷头尖锐，方便剔鱼刺。有'夫妇筷'（一对长短不同的筷子）的传统。日本有专门的筷架和筷袋文化。",origin:"唐代传入日本",usage:"日本饮食文化的核心餐具"},
  {id:10,name:"不插饭",en:"Don't Stick in Rice",category:"使用禁忌",icon:"🚫",summary:"最严重的禁忌",detail:"把筷子插在饭碗里是最大的筷子禁忌，因为这是祭祀死者的方式。绝对不能这样做，否则会被视为极大的不敬和诅咒。其他禁忌还包括不敲碗、不指人等。",origin:"祭祀文化",usage:"用餐中最需要避免的行为"},
  {id:11,name:"不交叉放",en:"Don't Cross Chopsticks",category:"使用禁忌",icon:"❌",summary:"否定的象征",detail:"筷子交叉放在桌上表示'否定'或'不认可'。在谈判或宴请场合尤其不能这样做。筷子应该平行放在筷架或桌上，表示和谐与认同。",origin:"民间象征",usage:"正式用餐中的筷子摆放禁忌"},
  {id:12,name:"不舔筷子",en:"Don't Lick Chopsticks",category:"使用禁忌",icon:"👅",summary:"不雅的行为",detail:"用舌头舔筷子是不雅的行为，尤其是从筷子根部舔到尖端。这在公共场合被视为没有教养。应该用筷子夹菜后直接送入口中。",origin:"传统教养",usage:"用餐举止的基本要求"},
  {id:13,name:"成双成对",en:"Always in Pairs",category:"象征寓意",icon:"💕",summary:"和谐的象征",detail:"筷子必须成双使用，象征'和合'、'成双成对'。婚礼上常送筷子，寓意新人成双成对、早生贵子。送人筷子不能送单根，否则不吉利。",origin:"婚嫁传统",usage:"婚礼礼品和祝福的载体"},
  {id:14,name:"天圆地方",en:"Round Heaven, Square Earth",category:"象征寓意",icon:"🌏",summary:"宇宙观的体现",detail:"传统筷子上方下圆（或上圆下方），象征'天圆地方'的宇宙观。圆头夹菜方便，方头放置不滚动。这种设计体现了中国古代的哲学思想和实用智慧。",origin:"中国古代哲学",usage:"筷子设计中的文化寓意"},
  {id:15,name:"筷子长度寓意",en:"Length Symbolism",category:"象征寓意",icon:"📏",summary:"七寸六分的意义",detail:"传统筷子标准长度为七寸六分（约23厘米），代表人有七情六欲。使用筷子时需要用两根，象征天地阴阳。夹菜的动作体现了阴阳调和的哲学。",origin:"中国传统哲学",usage:"筷子尺寸的文化内涵"},
  {id:16,name:"漆器筷子",en:"Lacquered Chopsticks",category:"材质工艺",icon:"🎨",summary:"精美的漆工艺",detail:"漆器筷子以木胎或竹胎涂以天然大漆制成，色彩鲜艳，防水耐用。福州脱胎漆筷、扬州漆筷最为著名。漆筷既是餐具也是工艺品，有很高的收藏价值。",origin:"战国漆器传统",usage:"高档餐具与工艺品"},
  {id:17,name:"合金筷",en:"Alloy Chopsticks",category:"材质工艺",icon:"⚙️",summary:"现代创新材质",detail:"合金筷是现代创新产品，采用食品级不锈钢或钛合金制成。耐用、不发霉、不滋生细菌。虽然失去了传统木筷的温润手感，但更加卫生和持久。",origin:"现代工业",usage:"现代家庭和餐厅的实用选择"},
  {id:18,name:"送筷习俗",en:"Gifting Chopsticks",category:"象征寓意",icon:"🎁",summary:"筷子作为礼品",detail:"送筷子在中国有丰富含义：送新人（成双成对），送老师（桃李满天下），送长辈（福寿双全），送合作伙伴（合作长久）。新居乔迁送筷子，寓意'快快发家'。",origin:"民间送礼传统",usage:"各种场合的文化礼品"},
  {id:19,name:"公筷文化",en:"Serving Chopsticks Culture",category:"使用禁忌",icon:"🥄",summary:"卫生用餐新风尚",detail:"公筷是近年推广的卫生用餐方式。每人一双私筷取菜到自己碗里，再用公筷从公共盘中夹菜。这既保留了合餐的传统，又减少了疾病传播的风险。",origin:"现代卫生观念",usage:"后疫情时代的用餐新规范"},
  {id:20,name:"筷子博物馆",en:"Chopstick Museum",category:"历史渊源",icon:"🏛️",summary:"收藏与展示",detail:"中国有多个筷子博物馆，如沈阳华夏筷子博物馆，收藏了从古至今数千双筷子。展品包括商代骨筷、汉代铜筷、唐代银筷等，展现了筷子文化的发展历程。",origin:"现代收藏",usage:"文化传承与博物馆展览"}
];
function renderCards(data){
  document.getElementById('teaGrid').innerHTML=data.map(t=>`
    <div class="tea-card" data-category="${t.category}">
      <div class="t-header"><div class="t-icon">${t.icon}</div><div><div class="t-name">${t.name}</div><div class="t-sub">${t.en}</div></div></div>
      <div class="t-meta"><span>${t.summary}</span><span>${t.category}</span></div>
      <div class="t-detail">${t.detail}</div>
      <div class="t-detail"><strong>起源：</strong>${t.origin}</div>
      <div class="t-detail"><strong>应用：</strong>${t.usage}</div>
    </div>`).join('');
}
function renderStats(data){
  const cats={};data.forEach(t=>{cats[t.category]=(cats[t.category]||0)+1});
  document.getElementById('statsOverview').innerHTML=`
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">筷子文化</div></div>
    ${Object.entries(cats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}`;
}
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  document.querySelectorAll('.tea-card').forEach(c=>{c.classList.toggle('hidden',q&&!c.textContent.toLowerCase().includes(q))});
});
document.getElementById('filterRow').addEventListener('click',function(e){
  if(!e.target.classList.contains('filter-btn'))return;
  this.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const f=e.target.dataset.filter;
  document.querySelectorAll('.tea-card').forEach(c=>{c.classList.toggle('hidden',f!=='all'&&c.dataset.category!==f)});
});
renderCards(TEA_DATA);renderStats(TEA_DATA);
</script>
</body>
</html>
