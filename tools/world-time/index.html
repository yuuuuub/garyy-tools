<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界时钟</title>
<meta name="description" content="世界时钟，查看全球主要城市当前时间">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16pxscroll-behavior:smooth;}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem;color:var(--text)}
.sub{color:var(--text2);font-size:.82rem;margin-top:4px}
.clock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:20px}
.clock-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-align:center}
.clock-city{font-size:.92rem;font-weight:600;margin-bottom:4px}
.clock-country{font-size:.75rem;color:var(--text2);margin-bottom:10px}
.clock-time{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--blue);margin-bottom:4px}
.clock-date{font-size:.8rem;color:var(--text2)}
.clock-icon{font-size:1.8rem;margin-bottom:6px}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="世界时钟">
  <meta property="og:description" content="世界时钟，查看全球主要城市当前时间">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/world-time/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header>
<h1>🕐 世界时钟</h1>
<p class="sub">全球主要城市时间 · 秒级更新</p>
</header>
<div id="app"></div>
</div>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
var cities=[
{name:'北京',country:'中国',tz:'Asia/Shanghai',offset:8,icon:'🇨🇳'},
{name:'东京',country:'日本',tz:'Asia/Tokyo',offset:9,icon:'🇯🇵'},
{name:'首尔',country:'韩国',tz:'Asia/Seoul',offset:9,icon:'🇰🇷'},
{name:'新加坡',country:'新加坡',tz:'Asia/Singapore',offset:8,icon:'🇸🇬'},
{name:'迪拜',country:'阿联酋',tz:'Asia/Dubai',offset:4,icon:'🇦🇪'},
{name:'莫斯科',country:'俄罗斯',tz:'Europe/Moscow',offset:3,icon:'🇷🇺'},
{name:'巴黎',country:'法国',tz:'Europe/Paris',offset:1,icon:'🇫🇷'},
{name:'伦敦',country:'英国',tz:'Europe/London',offset:0,icon:'🇬🇧'},
{name:'柏林',country:'德国',tz:'Europe/Berlin',offset:1,icon:'🇩🇪'},
{name:'纽约',country:'美国',tz:'America/New_York',offset:-5,icon:'🇺🇸'},
{name:'芝加哥',country:'美国',tz:'America/Chicago',offset:-6,icon:'🇺🇸'},
{name:'丹佛',country:'美国',tz:'America/Denver',offset:-7,icon:'🇺🇸'},
{name:'洛杉矶',country:'美国',tz:'America/Los_Angeles',offset:-8,icon:'🇺🇸'},
{name:'悉尼',country:'澳大利亚',tz:'Australia/Sydney',offset:11,icon:'🇦🇺'},
{name:'奥克兰',country:'新西兰',tz:'Pacific/Auckland',offset:13,icon:'🇳🇿'},
];
function pad(n){return n<10?'0'+n:''+n;}
function formatDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function formatTime(d){return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}
function getCityTime(offset){
var now=new Date();
var utc=now.getTime()+now.getTimezoneOffset()*60000;
var city=new Date(utc+offset*3600000);
return {date:formatDate(city),time:formatTime(city)};
}
function render(){
var html='<div class="clock-grid">';
cities.forEach(function(c){
var ct=getCityTime(c.offset);
html+='<div class="clock-card">';
html+='<div class="clock-icon">'+c.icon+'</div>';
html+='<div class="clock-city">'+c.name+'</div>';
html+='<div class="clock-country">'+c.country+'</div>';
html+='<div class="clock-time">'+ct.time+'</div>';
html+='<div class="clock-date">'+ct.date+'</div>';
html+='</div>';
});
html+='</div>';
app.innerHTML=html;
}
render();
setInterval(render,1000);
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
