<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生模拟 - 岁月如歌</title>
    <meta name="description" content="人生模拟游戏，从出生到老年的虚拟人生体验">
    <style>
:root {--bg: #0d1117;
--card: #161b22;
--border: #30363d;
--text: #e6edf3;
--accent: #3b82f6}
* {margin: 0;
padding: 0;
box-sizing: border-box}
body {font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 20px}
.game-container {max-width: 700px;
width: 100%;
background: var(--card);
border: 1px solid var(--border);
border-radius: 12px;
overflow: hidden}
.game-header {background: linear-gradient(135deg, #6366f1, #8b5cf6);
padding: 15px 20px;
display: flex;
justify-content: space-between;
align-items: center}
.game-header h1 {font-size: 1.3rem}
.age-display {font-size: 1.5rem;
font-weight: bold}
.timeline {display: flex;
padding: 15px 20px;
background: rgba(0,0,0,0.3);
gap: 5px;
overflow-x: auto}
.year-dot {width: 8px;
height: 8px;
border-radius: 50%;
background: var(--border);
flex-shrink: 0}
.year-dot.past { background: #6366f1; }
.year-dot.current { background: #22c55e; transform: scale(1.5); }
.stats-bar {display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 10px;
padding: 15px 20px;
background: rgba(0,0,0,0.2)}
.stat-item {text-align: center}
.stat-icon {font-size: 1.2rem}
.stat-bar {height: 6px;
background: rgba(255,255,255,0.2);
border-radius: 3px;
overflow: hidden;
margin: 5px 0}
.stat-fill {height: 100%;
border-radius: 3px;
transition: width 0.3s}
.fill-health { background: #ef4444; }
.fill-money { background: #f59e0b; }
.fill-happy { background: #ec4899; }
.fill-career { background: #3b82f6; }
.stat-val {font-size: 0.75rem;
opacity: 0.8}
.story-area {min-height: 250px;
padding: 25px}
.event-card {background: var(--bg);
border: 1px solid var(--border);
border-radius: 10px;
padding: 20px;
margin-bottom: 15px}
.event-year {font-size: 0.85rem;
color: var(--accent);
margin-bottom: 10px}
.event-text {line-height: 1.8;
font-size: 1rem}
.choices {display: flex;
flex-direction: column;
gap: 10px;
margin-top: 15px}
.choice-btn {background: rgba(99, 102, 241, 0.1);
border: 1px solid #6366f1;
color: var(--text);
padding: 12px 15px;
border-radius: 8px;
cursor: pointer;
text-align: left;
font-size: 0.95rem;
transition: all 0.3s}
.choice-btn:hover {background: rgba(99, 102, 241, 0.3);
transform: translateX(5px)}
.continue-btn {display: block;
width: 100%;
padding: 12px;
background: #6366f1;
border: none;
color: white;
border-radius: 8px;
cursor: pointer;
font-size: 1rem;
margin-top: 15px}
.life-log {padding: 15px 20px;
background: rgba(0,0,0,0.2);
max-height: 150px;
overflow-y: auto}
.log-title {font-size: 0.85rem;
margin-bottom: 10px;
opacity: 0.7}
.log-item {font-size: 0.8rem;
padding: 5px 0;
border-bottom: 1px solid var(--border);
opacity: 0.8}
.ending-overlay {position: fixed;
top: 0;
left: 0;
right: 0;
bottom: 0;
background: rgba(0,0,0,0.95);
display: flex;
justify-content: center;
align-items: center;
z-index: 100}
.ending-content {text-align: center;
padding: 40px;
max-width: 600px}
.ending-content h2 {font-size: 2rem;
margin-bottom: 20px}
.life-summary {text-align: left;
background: var(--bg);
border: 1px solid var(--border);
border-radius: 10px;
padding: 20px;
margin: 20px 0}
.summary-item {display: flex;
justify-content: space-between;
padding: 8px 0;
border-bottom: 1px solid var(--border)}
.ending-content p {font-size: 1rem;
line-height: 1.8;
margin: 20px 0}
.restart-btn {padding: 12px 30px;
background: #6366f1;
border: none;
color: white;
border-radius: 8px;
cursor: pointer;
font-size: 1rem}
.hidden { display: none !important; }
@media (max-width: 600px) {.stats-bar {grid-template-columns: repeat(2, 1fr)}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="人生模拟 - 岁月如歌">
  <meta property="og:description" content="人生模拟游戏，从出生到老年的虚拟人生体验">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/life-sim/">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>岁月如歌</h1>
            <span class="age-display" id="age-display">18岁</span>
        </div>
        
        <div class="timeline" id="timeline"></div>
        
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-icon">❤️</div>
                <div class="stat-bar"><div class="stat-fill fill-health" id="health-bar"></div></div>
                <div class="stat-val">健康: <span id="health-val">80</span></div>
            </div>
            <div class="stat-item">
                <div class="stat-icon">💰</div>
                <div class="stat-bar"><div class="stat-fill fill-money" id="money-bar"></div></div>
                <div class="stat-val">财富: <span id="money-val">30</span></div>
            </div>
            <div class="stat-item">
                <div class="stat-icon">😊</div>
                <div class="stat-bar"><div class="stat-fill fill-happy" id="happy-bar"></div></div>
                <div class="stat-val">幸福: <span id="happy-val">70</span></div>
            </div>
            <div class="stat-item">
                <div class="stat-icon">💼</div>
                <div class="stat-bar"><div class="stat-fill fill-career" id="career-bar"></div></div>
                <div class="stat-val">事业: <span id="career-val">20</span></div>
            </div>
        </div>
        
        <div class="story-area" id="story-area"></div>
        
        <div class="life-log">
            <div class="log-title">📜 人生记录</div>
            <div id="log-content"></div>
        </div>
    </div>
    
    <div class="ending-overlay hidden" id="ending-overlay">
        <div class="ending-content" id="ending-content"></div>
    </div>

    <script>
        const life = {
            age: 18,
            health: 80,
            money: 30,
            happy: 70,
            career: 20,
            flags: {},
            log: []
        };

        const events = {
            18: {
                text: '你高中毕业了，面临人生的重要抉择。是继续读大学，还是直接工作？',
                choices: [
                    { text: '考大学，继续深造', effect: () => { life.career += 10; }, next: 'college' },
                    { text: '直接工作赚钱', effect: () => { life.money += 20; life.career -= 5; }, next: 'work' },
                    { text: '学一门技术', effect: () => { life.career += 15; }, next: 'skill' }
                ]
            },
            college: {
                text: '你考上了大学，开始了四年的校园生活。在这里你遇到了很多有趣的人...',
                choices: [
                    { text: '努力学习，拿奖学金', effect: () => { life.career += 15; life.happy -= 5; }, next: 'grad' },
                    { text: '加入社团，享受青春', effect: () => { life.happy += 20; }, next: 'grad' },
                    { text: '谈恋爱', effect: () => { life.happy += 25; life.flags.love = true; }, next: 'grad' }
                ]
            },
            work: {
                text: '你找到了一份工作，虽然辛苦，但你开始积累社会经验。',
                choices: [
                    { text: '认真工作，争取升职', effect: () => { life.career += 10; life.money += 15; }, next: 'work20' },
                    { text: '边工作边学习', effect: () => { life.career += 15; life.money += 5; }, next: 'work20' }
                ]
            },
            skill: {
                text: '你选择学习编程，这是一门很有前景的技术。',
                effect: () => { life.flags.coder = true; },
                choices: [
                    { text: '成为程序员', effect: () => { life.career += 20; life.money += 25; }, next: 'work20' },
                    { text: '做自由职业者', effect: () => { life.happy += 15; life.money += 10; }, next: 'work20' }
                ]
            },
            grad: {
                text: '大学毕业了，你该考虑未来的方向了。',
                choices: [
                    { text: '找工作上班', effect: () => { life.career += 15; life.money += 20; }, next: 'work20' },
                    { text: '创业', effect: () => { life.money += 30; life.career += 10; life.happy -= 10; }, next: 'work20' },
                    { text: '继续读研', effect: () => { life.career += 25; life.money -= 10; }, next: 'work20' }
                ]
            },
            work20: {
                text: '25岁了，你的事业逐渐稳定。是时候考虑个人问题了。',
                choices: [
                    { text: '找对象结婚', effect: () => { life.happy += 20; life.flags.married = true; }, next: 'married' },
                    { text: '专心事业', effect: () => { life.career += 20; life.money += 15; }, next: 'career25' },
                    { text: '先享受单身生活', effect: () => { life.happy += 15; }, next: 'single25' }
                ]
            },
            married: {
                text: '你结婚了，组建了自己的小家庭。',
                choices: [
                    { text: '要孩子', effect: () => { life.happy += 25; life.money -= 20; life.flags.kids = true; }, next: 'family' },
                    { text: '过二人世界', effect: () => { life.happy += 15; }, next: 'family' }
                ]
            },
            career25: {
                text: '你在事业上取得了不错的成绩，升职加薪。',
                choices: [
                    { text: '继续拼搏', effect: () => { life.career += 25; life.money += 30; life.health -= 10; }, next: 'career30' },
                    { text: '寻求工作生活平衡', effect: () => { life.happy += 20; life.health += 10; }, next: 'balance' }
                ]
            },
            single25: {
                text: '30岁了，你开始思考人生的意义。',
                choices: [
                    { text: '安定下来', effect: () => { life.happy += 20; life.flags.late_married = true; }, next: 'family' },
                    { text: '继续追求梦想', effect: () => { life.career += 20; life.happy += 10; }, next: 'dream' }
                ]
            },
            family: {
                text: '35岁了，家庭生活忙碌而充实。',
                choices: [
                    { text: '给孩子最好的教育', effect: () => { life.money -= 25; life.happy += 15; }, next: 'midlife' },
                    { text: '带家人旅行', effect: () => { life.happy += 20; life.money -= 15; }, next: 'midlife' }
                ]
            },
            career30: {
                text: '38岁了，你成为了公司高管。',
                choices: [
                    { text: '继续向上爬', effect: () => { life.career += 20; life.money += 30; life.health -= 15; }, next: 'midlife' },
                    { text: '考虑退休生活', effect: () => { life.happy += 25; }, next: 'midlife' }
                ]
            },
            balance: {
                text: '35岁了，你找到了工作和生活的平衡。',
                choices: [
                    { text: '培养兴趣爱好', effect: () => { life.happy += 20; }, next: 'midlife' },
                    { text: '帮助他人', effect: () => { life.happy += 25; life.flags.kind = true; }, next: 'midlife' }
                ]
            },
            dream: {
                text: '你追逐梦想，虽然艰辛但很充实。',
                choices: [
                    { text: '梦想成真', effect: () => { life.happy += 30; life.career += 20; }, next: 'midlife' },
                    { text: '换个方向', effect: () => { life.happy += 10; }, next: 'midlife' }
                ]
            },
            midlife: {
                text: '45岁了，人生过半。回首往事，你有什么感悟？',
                choices: [
                    { text: '感恩一切', effect: () => { life.happy += 15; }, next: 'later' },
                    { text: '继续努力', effect: () => { life.career += 10; life.money += 15; }, next: 'later' }
                ]
            },
            later: {
                text: '50岁了，你开始享受人生。',
                choices: [
                    { text: '退休享受生活', effect: () => { life.happy += 20; life.health += 10; }, next: 'retire' },
                    { text: '做点有意义的事', effect: () => { life.happy += 25; life.flags.meaningful = true; }, next: 'retire' }
                ]
            },
            retire: {
                text: '60岁了，你的人生故事即将画上句号。',
                effect: () => { life.ended = true; },
                choices: [
                    { text: '回顾这一生', next: 'ending' }
                ]
            }
        };

        function updateUI() {
            document.getElementById('age-display').textContent = life.age + '岁';
            
            document.getElementById('health-bar').style.width = life.health + '%';
            document.getElementById('health-val').textContent = Math.round(life.health);
            document.getElementById('money-bar').style.width = life.money + '%';
            document.getElementById('money-val').textContent = Math.round(life.money);
            document.getElementById('happy-bar').style.width = life.happy + '%';
            document.getElementById('happy-val').textContent = Math.round(life.happy);
            document.getElementById('career-bar').style.width = life.career + '%';
            document.getElementById('career-val').textContent = Math.round(life.career);
            
            // 更新时间线
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';
            for (let i = 18; i <= 60; i++) {
                const dot = document.createElement('div');
                dot.className = 'year-dot';
                if (i < life.age) dot.classList.add('past');
                if (i === life.age) dot.classList.add('current');
                timeline.appendChild(dot);
            }
        }

        function addLog(text) {
            life.log.unshift(`${life.age}岁: ${text}`);
            const logContent = document.getElementById('log-content');
            logContent.innerHTML = life.log.slice(0, 10).map(l => `<div class="log-item">${l}</div>`).join('');
        }

        function renderEvent() {
            const event = events[life.age];
            if (!event) {
                nextYear();
                return;
            }
            
            const storyArea = document.getElementById('story-area');
            
            if (event.effect) event.effect();
            
            storyArea.innerHTML = `
                <div class="event-card">
                    <div class="event-year">📅 ${life.age}岁</div>
                    <div class="event-text">${event.text}</div>
                    <div class="choices">
                        ${event.choices.map((c, i) => `
                            <button class="choice-btn" onclick="makeChoice(${i})">${c.text}</button>
                        `).join('')}
                    </div>
                </div>
            `;
            
            updateUI();
        }

        function makeChoice(index) {
            const event = events[life.age];
            const choice = event.choices[index];
            
            if (choice.effect) choice.effect();
            addLog(choice.text);
            
            updateUI();
            
            life.age++;
            if (life.age > 60 || life.ended) {
                showEnding();
            } else {
                setTimeout(renderEvent, 300);
            }
        }

        function nextYear() {
            life.age++;
            if (life.age > 60) {
                showEnding();
            } else {
                renderEvent();
            }
        }

        function showEnding() {
            const overlay = document.getElementById('ending-overlay');
            const content = document.getElementById('ending-content');
            
            const totalScore = Math.round((life.health + life.money + life.happy + life.career) / 4);
            
            let ending;
            if (totalScore >= 80 && life.flags.kids && life.flags.married) {
                ending = {
                    title: '🌟 人生赢家',
                    color: '#fbbf24',
                    text: '你的人生堪称完美。事业有成，家庭幸福，子女孝顺。当你回首往事，心中满是感恩和满足。这是最幸福的人生。'
                };
            } else if (totalScore >= 60) {
                ending = {
                    title: '❤️ 平凡幸福',
                    color: '#ec4899',
                    text: '你的人生虽然平凡，但充满了爱和温暖。你有自己的家庭，有稳定的工作，有真心的朋友。这就是最真实的幸福。'
                };
            } else if (life.flags.meaningful) {
                ending = {
                    title: '🌟 有意义的人生',
                    color: '#22c55e',
                    text: '你用自己的方式帮助了很多人，虽然不是最富有的，但你的内心无比充实。你的善良和付出，让这个世界变得更美好了一点。'
                };
            } else if (life.career >= 70) {
                ending = {
                    title: '💼 事业有成',
                    color: '#3b82f6',
                    text: '你在事业上取得了巨大的成功，成为了行业的佼佼者。虽然有些遗憾，但你为自己的成就感到骄傲。'
                };
            } else {
                ending = {
                    title: '😊 普通人生',
                    color: '#6b7280',
                    text: '你的人生普普通通，没有什么大起大落。但这也是一种人生，平凡中也有属于自己的精彩。'
                };
            }
            
            content.innerHTML = `
                <h2 style="color: ${ending.color}">${ending.title}</h2>
                <p>${ending.text}</p>
                <div class="life-summary">
                    <div class="summary-item"><span>最终年龄</span><span>60岁</span></div>
                    <div class="summary-item"><span>健康指数</span><span>${Math.round(life.health)}</span></div>
                    <div class="summary-item"><span>财富指数</span><span>${Math.round(life.money)}</span></div>
                    <div class="summary-item"><span>幸福指数</span><span>${Math.round(life.happy)}</span></div>
                    <div class="summary-item"><span>事业指数</span><span>${Math.round(life.career)}</span></div>
                    <div class="summary-item"><span>综合评分</span><span>${totalScore}分</span></div>
                </div>
                <button class="restart-btn" onclick="restart()">重新开始</button>
            `;
            
            overlay.classList.remove('hidden');
        }

        function restart() {
            life.age = 18;
            life.health = 80;
            life.money = 30;
            life.happy = 70;
            life.career = 20;
            life.flags = {};
            life.log = [];
            life.ended = false;
            
            document.getElementById('ending-overlay').classList.add('hidden');
            document.getElementById('log-content').innerHTML = '';
            updateUI();
            renderEvent();
        }

        updateUI();
        renderEvent();
    </script>
<script src="../i18n.js" defer></script>
</body>
</html>
