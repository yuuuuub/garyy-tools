]},

function switchTab(name,el){
document.querySelectorAll('.tab-bar .tab').forEach(function(t){t.classList.remove('active')});
el.classList.add('active');
renderContent(name);
}
function renderContent(name){
var d=data[name];
var html='<div class="card"><h3>'+d.title+'</h3>';
if(d.content){html+=d.content;}
if(d.items){
d.items.forEach(function(item){
html+='<div class="item" onclick="showDetail(this)">';
html+='<h4>'+item.name+'</h4>';
if(item.era) html+='<div class="meta">'+item.era+(item.artist?' · '+item.artist:'')+(item.title?' · '+item.title:'')+'</div>';
if(item.contribution) html+='<div class="desc">'+item.contribution+'</div>';
if(item.style) html+='<div class="desc">'+item.style+'</div>';
if(item.desc) html+='<div class="desc">'+item.desc+'</div>';
html+='<div style="margin-top:8px">'+item.tags.map(function(t){return '<span class="tag" style="background:rgba(59,130,246,.15);color:var(--blue)">'+t+'</span>'}).join('')+'</div>';
html+='</div>';
});
}
if(d.questions){
var score=0;
d.questions.forEach(function(q,i){
html+='<div class="item" style="cursor:default" id="q'+i+'">';
html+='<h4>'+q.q+'</h4>';
q.options.forEach(function(opt,j){
html+='<div class="quiz-option" onclick="checkAnswer('+i+','+j+','+q.answer+',this)">'+String.fromCharCode(65+j)+'. '+opt+'</div>';
});
html+='<div class="explain" style="display:none;margin-top:8px;padding:8px;background:rgba(59,130,246,.1);border-radius:8px;font-size:.85rem">'+q.explain+'</div>';
html+='</div>';
});
html+='<div id="quizScore" style="display:none;text-align:center;margin-top:16px;padding:16px;background:rgba(35,134,54,.1);border-radius:8px"></div>';
}
html+='</div>';
document.getElementById('content').innerHTML=html;
}
function showDetail(el){
var desc=el.querySelector('.desc');
if(desc){desc.style.display=desc.style.display==='none'?'block':'none';}
}
function checkAnswer(qi,oi,correct,el){
var q=document.getElementById('q'+qi);
var opts=q.querySelectorAll('.quiz-option');
if(opts[0].classList.contains('correct')||opts[0].classList.contains('wrong')) return;
opts.forEach(function(o,i){
if(i===correct) o.classList.add('correct');
else if(i===oi) o.classList.add('wrong');
});
q.querySelector('.explain').style.display='block';
}
renderContent('overview');
