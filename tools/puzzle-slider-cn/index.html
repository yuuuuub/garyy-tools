<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>滑块拼图</title>
<meta property="og:title" content="滑块拼图">
<meta property="og:description" content="滑块拼图 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="经典15滑块拼图游戏，用最少步数还原图片顺序">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px;overflow-x:hidden;scroll-behavior:smoothpadding:16px;}
h1{font-size:1.5rem;margin-bottom:12px;color:#22c55e;text-shadow:0 0 10px #22c55e44}
.hud{display:flex;gap:16px;margin-bottom:16px;font-size:0.95rem;color:var(--text2)}
.hud span{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 14px}
.board{display:grid;gap:4px;background:var(--border);border-radius:10px;padding:4px;margin-bottom:16px}
.tile{display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:bold;border-radius:6px;cursor:pointer;transition:all 0.15s;background:var(--card);color:var(--text);border:2px solid var(--border);user-select:none}
.tile:hover{border-color:var(--blue)}
.tile.empty{background:transparent;border-color:transparent;cursor:default}
.tile.correct{border-color:var(--green);color:var(--green)}
.btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:1rem;cursor:pointer;margin-top:8px}
.btn:hover{opacity:.9}
.diff{display:flex;gap:8px;margin-bottom:16px}
.diff button{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.9rem}
.diff button.active{border-color:var(--blue);background:var(--blue);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔢</text></svg>">
<meta name="robots" content="index, follow">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1>🔢 滑块拼图</h1>
<div class="diff">
<button onclick="setSize(3)" id="d3" class="active">3×3</button>
<button onclick="setSize(4)" id="d4">4×4</button>
<button onclick="setSize(5)" id="d5">5×5</button>
</div>
<div class="hud"><span>步数: <b id="moves">0</b></span><span>时间: <b id="time">0</b>s</span></div>
<div class="board" id="board"></div>
<button class="btn" onclick="initGame()">打乱重来</button>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
<script>
let size=3,tiles=[],emptyIdx,moves=0,timer=0,interval=null;

function setSize(s){size=s;document.querySelectorAll('.diff button').forEach(b=>b.classList.remove('active'));document.getElementById('d'+s).classList.add('active');initGame()}

function initGame(){
clearInterval(interval);timer=0;moves=0;
document.getElementById('moves').textContent='0';
document.getElementById('time').textContent='0';
tiles=Array.from({length:size*size},(_,i)=>i===size*size-1?0:i+1);
emptyIdx=tiles.length-1;
shuffle();render();
interval=setInterval(()=>{timer++;document.getElementById('time').textContent=timer},1000);
}

function shuffle(){
for(let i=0;i<200;i++){
const adj=getAdj(emptyIdx);
const pick=adj[Math.floor(Math.random()*adj.length)];
swap(emptyIdx,pick);emptyIdx=pick;
}
if(isSolved())shuffle();
}

function getAdj(idx){
const r=Math.floor(idx/size),c=idx%size,adj=[];
if(r>0)adj.push(idx-size);if(r<size-1)adj.push(idx+size);
if(c>0)adj.push(idx-1);if(c<size-1)adj.push(idx+1);
return adj;
}

function swap(a,b)[tiles[a],tiles[b]]=[tiles[b],tiles[a]];

function render(){
const board=document.getElementById('board');
board.style.gridTemplateColumns=`repeat(${size},64px)`;
board.innerHTML='';
tiles.forEach((v,i)=>{
const tile=document.createElement('div');
tile.className='tile'+(v===0?' empty':'');
if(v===i+1)tile.classList.add('correct');
tile.textContent=v||'';
tile.onclick=()=>moveTile(i);
board.appendChild(tile);
});
}

function moveTile(idx){
if(idx===emptyIdx)return;
const adj=getAdj(emptyIdx);
if(!adj.includes(idx))return;
swap(emptyIdx,idx);emptyIdx=idx;moves++;
document.getElementById('moves').textContent=moves;
render();
if(isSolved()){clearInterval(interval);setTimeout(()=>alert('🎉 恭喜完成! 用时'+timer+'秒, '+moves+'步'),200)}
}

function isSolved(){return tiles.every((v,i)=>i===tiles.length-1?v===0:v===i+1)}

document.addEventListener('keydown',e=>{
const r=Math.floor(emptyIdx/size),c=emptyIdx%size;
if((e.key==='ArrowUp'||e.key==='w')&&r<size-1)moveTile(emptyIdx+size);
else if((e.key==='ArrowDown'||e.key==='s')&&r>0)moveTile(emptyIdx-size);
else if((e.key==='ArrowLeft'||e.key==='a')&&c<size-1)moveTile(emptyIdx+1);
else if((e.key==='ArrowRight'||e.key==='d')&&c>0)moveTile(emptyIdx-1);
});

initGame();
</script>
</body>
</html>
