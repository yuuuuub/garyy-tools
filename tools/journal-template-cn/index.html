<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📓 日记模板</title>
<meta name="description" content="日记模板工具，提供多种日记格式模板，帮助你养成写日记的习惯">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.es{text-align:center;padding:40px;color:var(--text2)}
.template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.template-card{padding:16px;border:2px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .2s;text-align:center}
.template-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.template-card.active{border-color:var(--accent);background:rgba(59,130,246,.1)}
.template-card .emoji{font-size:2rem;margin-bottom:8px}
.template-card .name{font-weight:600}
.template-card .desc{font-size:.8rem;color:var(--text2);margin-top:4px}
.journal-section{margin-bottom:16px}
.journal-section label{font-weight:600;color:var(--accent);margin-bottom:6px}
.journal-entry{padding:16px;border-bottom:1px solid var(--border)}.journal-entry:last-child{border-bottom:none}
.journal-entry .date{font-size:.8rem;color:var(--accent);font-weight:600}
.journal-entry .template-name{font-size:.8rem;color:var(--text2)}
.journal-entry .content{margin-top:8px;font-size:.9rem;white-space:pre-wrap}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📓</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📓 日记模板">
<meta property="og:description" content="日记模板工具，提供多种日记格式模板">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📓 日记模板</h1><p>多种日记格式，找到最适合你的写作方式</p></div>

<div class="cd"><h2>📋 选择模板</h2>
<div class="template-grid" id="templateGrid"></div></div>

<div class="cd"><h2>✏️ 写日记</h2>
<label>日期</label><input type="date" id="jDate">
<div id="journalForm"></div>
<div class="bg"><button onclick="saveJournal()">保存日记</button></div></div>

<div class="cd"><h2>📖 历史日记</h2><div id="journalList"></div></div>

<div class="cd"><h2>📊 统计</h2><div id="stats"></div>
<div class="bg"><button class="sec" onclick="clearAll()">清空全部</button></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
let journals=JSON.parse(localStorage.getItem('jt_journals')||'[]');
let selectedTemplate='gratitude';

const templates=[
  {id:'gratitude',name:'感恩日记',emoji:'🙏',desc:'记录3件值得感恩的事',fields:[{id:'g1',label:'感恩事项 1',type:'text'},{id:'g2',label:'感恩事项 2',type:'text'},{id:'g3',label:'感恩事项 3',type:'text'},{id:'gn',label:'今日感言',type:'textarea'}]},
  {id:'mood',name:'心情日记',emoji:'😊',desc:'记录今天的心情和原因',fields:[{id:'mood',label:'今天的心情',type:'text'},{id:'moodHigh',label:'今天最开心的事',type:'text'},{id:'moodLow',label:'今天最困扰的事',type:'text'},{id:'moodNote',label:'心情总结',type:'textarea'}]},
  {id:'daily',name:'每日记录',emoji:'📅',desc:'记录一天发生的重要事情',fields:[{id:'dTop3',label:'今天最重要的3件事',type:'textarea'},{id:'dLearn',label:'今天学到了什么',type:'text'},{id:'dGrateful',label:'今天感恩什么',type:'text'},{id:'dTomorrow',label:'明天的计划',type:'textarea'}]},
  {id:'reflection',name:'反思日记',emoji:'🪞',desc:'深度反思和自我觉察',fields:[{id:'rEvent',label:'发生了什么',type:'textarea'},{id:'rFeel',label:'我当时的感受',type:'text'},{id:'rWhy',label:'为什么会这样',type:'textarea'},{id:'rBetter',label:'下次怎么做更好',type:'textarea'}]},
  {id:'5min',name:'5分钟日记',emoji:'⚡',desc:'快速记录，5分钟完成',fields:[{id:'fGood',label:'今天顺利的事',type:'text'},{id:'fImprove',label:'可以改进的事',type:'text'},{id:'fFocus',label:'明天的首要任务',type:'text'}]},
  {id:'dream',name:'梦境日记',emoji:'🌙',desc:'记录和解读你的梦境',fields:[{id:'dreamContent',label:'梦境内容',type:'textarea'},{id:'dreamFeel',label:'梦中的感受',type:'text'},{id:'dreamInterpret',label:'可能的含义',type:'textarea'}]}
];

function save(){localStorage.setItem('jt_journals',JSON.stringify(journals))}

function renderTemplates(){
  $('templateGrid').innerHTML=templates.map(t=>`<div class="template-card ${t.id===selectedTemplate?'active':''}" onclick="selectTemplate('${t.id}')"><div class="emoji">${t.emoji}</div><div class="name">${t.name}</div><div class="desc">${t.desc}</div></div>`).join('');
  renderForm();
}

function selectTemplate(id){selectedTemplate=id;renderTemplates()}

function renderForm(){
  const tpl=templates.find(t=>t.id===selectedTemplate);
  if(!tpl)return;
  $('journalForm').innerHTML=tpl.fields.map(f=>`<div class="journal-section"><label>${f.label}</label>${f.type==='textarea'?`<textarea id="${f.id}" placeholder="写下你的想法..."></textarea>`:`<input type="text" id="${f.id}" placeholder="${f.label}">`}</div>`).join('');
}

function saveJournal(){
  const tpl=templates.find(t=>t.id===selectedTemplate);
  if(!tpl)return;
  const date=$('jDate').value||new Date().toISOString().slice(0,10);
  const content={};
  tpl.fields.forEach(f=>{content[f.id]=$(f.id)?.value?.trim()||''});
  const hasContent=Object.values(content).some(v=>v);
  if(!hasContent){alert('请至少填写一项内容');return}
  journals.push({id:Date.now(),date,template:selectedTemplate,templateName:tpl.name,content});
  save();renderJournals();renderStats();tpl.fields.forEach(f=>{if($(f.id))$(f.id).value=''});
}

function renderJournals(){
  if(!journals.length){$('journalList').innerHTML='<div class="es">暂无日记</div>';return}
  $('journalList').innerHTML=journals.slice().reverse().map(j=>{
    const tpl=templates.find(t=>t.id===j.template);
    let fieldsHtml='';
    if(tpl){tpl.fields.forEach(f=>{if(j.content[f.id])fieldsHtml+=`<div style="margin-top:6px"><span style="color:var(--text2);font-size:.8rem">${f.label}：</span>${j.content[f.id]}</div>`})}
    return `<div class="journal-entry"><div class="date">${j.date} <span class="template-name">${tpl?tpl.emoji+' '+tpl.name:''}</span><span style="float:right;cursor:pointer;color:var(--danger)" onclick="delJournal(${j.id})">✕</span></div><div class="content">${fieldsHtml}</div></div>`;
  }).join('');
}

function delJournal(id){journals=journals.filter(j=>j.id!==id);save();renderJournals();renderStats()}

function renderStats(){
  const total=journals.length;
  const templatesUsed=[...new Set(journals.map(j=>j.template))].length;
  const thisMonth=journals.filter(j=>j.date>=new Date().toISOString().slice(0,7)).length;
  $('stats').innerHTML=`<div class="gr"><div class="st"><div class="nm">${total}</div><div class="lb">日记总数</div></div><div class="st"><div class="nm">${templatesUsed}</div><div class="lb">使用模板</div></div><div class="st"><div class="nm">${thisMonth}</div><div class="lb">本月日记</div></div></div>`;
}

function clearAll(){if(!confirm('确定清空全部日记？'))return;journals=[];save();renderJournals();renderStats()}
$('jDate').value=new Date().toISOString().slice(0,10);
renderTemplates();renderJournals();renderStats();
</script>
</body>
</html>
