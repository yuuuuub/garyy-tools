<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技能矩阵</title>
<meta name="description" content="技能矩阵工具 - 评估和可视化团队成员技能水平，识别技能差距">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a371f7;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:1100px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.85rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:5px 12px;font-size:.8rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
input,textarea,select{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;margin-bottom:8px}
label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem;color:var(--text2)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.hidden{display:none!important}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:550px;max-height:80vh;overflow-y:auto}
.matrix-table{width:100%;border-collapse:collapse;overflow-x:auto;display:block}
.matrix-table th,.matrix-table td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
.matrix-table th{background:var(--bg);font-size:.85rem;font-weight:600;color:var(--text2);position:sticky;top:0}
.matrix-table td:first-child,.matrix-table th:first-child{text-align:left;font-weight:600}
.skill-cell{cursor:pointer;padding:4px 8px;border-radius:6px;transition:all .2s;font-weight:600}
.skill-cell:hover{transform:scale(1.05)}
.level-0{color:var(--text2)}
.level-1{background:rgba(248,81,73,.2);color:var(--red)}
.level-2{background:rgba(210,153,34,.2);color:var(--yellow)}
.level-3{background:rgba(59,130,246,.2);color:var(--accent)}
.level-4{background:rgba(63,185,80,.2);color:var(--green)}
.level-5{background:rgba(163,113,247,.2);color:var(--purple)}
.legend{display:flex;gap:12px;margin:12px 0;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:4px;font-size:.8rem}
.legend-dot{width:12px;height:12px;border-radius:3px}
.member-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.member-card{background:var(--bg);border-radius:8px;padding:12px;text-align:center}
.member-name{font-weight:700;margin-bottom:4px}
.member-avg{font-size:1.2rem;font-weight:700}
.member-bar{height:4px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
.member-bar-fill{height:100%;border-radius:2px}
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.85rem;white-space:nowrap;color:var(--text2);transition:all .2s}
.tab.active{background:var(--accent);color:#fff}
.tab:hover:not(.active){background:var(--border)}
@media(max-width:768px){h1{font-size:1.4rem}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='🎯 技能矩阵';
const APP=document.getElementById('app');
let data=JSON.parse(localStorage.getItem('smx_data')||'{"skills":["JavaScript","Python","React","Node.js","SQL","Git","Docker","AWS"],"members":[{"name":"张三",{JavaScript:4,Python:3,React:5,"Node.js":4,SQL:3,Git:4,Docker:3,AWS:2}],"levels":["","入门","初级","中级","高级","专家"]});

function save(){localStorage.setItem('smx_data',JSON.stringify(data))}
function getMemberSkills(m){return Object.keys(m).filter(k=>k!=='name')}
function getMemberAvg(m){const s=getMemberSkills(m);return s.length?s.reduce((a,k)=>a+(m[k]||0),0)/s.length:0}

function render(){
  let h=`<h1>🎯 技能矩阵</h1><p class="subtitle">评估和追踪团队技能水平</p>`;
  const avgAll=data.members.length?data.members.reduce((s,m)=>s+getMemberAvg(m),0)/data.members.length:0;

  h+=`<div class="card"><div class="flex-between"><b>⚙️ 管理</b><div class="flex"><button class="btn btn-sm" onclick="addMember()">+ 添加成员</button><button class="btn btn-sm btn-outline" onclick="addSkill()">+ 添加技能</button><button class="btn btn-sm btn-outline" onclick="exportCSV()">导出CSV</button></div></div></div>`;

  h+=`<div class="legend">`;
  for(let i=0;i<=5;i++) h+=`<div class="legend-item"><div class="legend-dot level-${i}"></div><span>${data.levels[i]}</span></div>`;
  h+=`</div>`;

  h+=`<div class="card" style="overflow-x:auto"><table class="matrix-table"><thead><tr><th>成员</th>`;
  data.skills.forEach(s=>{h+=`<th>${s}</th>`});
  h+=`<th>平均</th></tr></thead><tbody>`;
  data.members.forEach((m,mi)=>{
    h+=`<tr><td>${m.name} <span style="cursor:pointer;color:var(--red);font-size:.8rem" onclick="delMember(${mi})">✕</span></td>`;
    data.skills.forEach(sk=>{
      const v=m[sk]||0;
      h+=`<td><span class="skill-cell level-${v}" onclick="rateSkill(${mi},'${sk}')">${data.levels[v]||'-'}</span></td>`;
    });
    const avg=getMemberAvg(m);
    h+=`<td><span style="font-weight:700;color:${avg>=4?'var(--green)':avg>=3?'var(--accent)':'var(--yellow)'}">${avg.toFixed(1)}</span></td>`;
    h+=`</tr>`;
  });
  h+=`</tbody></table></div>`;

  h+=`<div class="card"><b>👥 成员概览</b><div class="member-stats">`;
  data.members.forEach(m=>{
    const avg=getMemberAvg(m);
    h+=`<div class="member-card"><div class="member-name">${m.name}</div><div class="member-avg" style="color:${avg>=4?'var(--green)':avg>=3?'var(--accent)':'var(--yellow)'}">${avg.toFixed(1)}</div><div style="font-size:.75rem;color:var(--text2)">技能平均分</div><div class="member-bar"><div class="member-bar-fill" style="width:${avg*20}%;background:${avg>=4?'var(--green)':avg>=3?'var(--accent)':'var(--yellow)'}"></div></div></div>`;
  });
  h+=`</div></div>`;

  h+=`<div class="card"><div class="flex-between"><b>📊 技能概览</b></div><div class="member-stats">`;
  data.skills.forEach(sk=>{
    const vals=data.members.map(m=>m[sk]||0);
    const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
    h+=`<div class="member-card"><div class="member-name">${sk}</div><div class="member-avg" style="color:${avg>=4?'var(--green)':avg>=3?'var(--accent)':'var(--yellow)'}">${avg.toFixed(1)}</div><div style="font-size:.75rem;color:var(--text2)">团队平均</div><div class="member-bar"><div class="member-bar-fill" style="width:${avg*20}%;background:${avg>=4?'var(--green)':avg>=3?'var(--accent)':'var(--yellow)'}"></div></div></div>`;
  });
  h+=`</div></div>`;
  APP.innerHTML=h;
}

function addMember(){
  const m=document.createElement('div');m.className='modal-overlay';m.innerHTML=`<div class="modal"><h3 style="margin-bottom:16px">添加成员</h3>
    <label>姓名</label><input id="mn" placeholder="成员姓名">
    <div class="flex" style="justify-content:flex-end;margin-top:12px"><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
    <button class="btn btn-success" onclick="saveMember()">确定</button></div></div>`;
  document.body.appendChild(m);
}
function saveMember(){
  const n=document.getElementById('mn').value.trim();if(!n)return;
  const m={name:n};data.skills.forEach(s=>{m[s]=0});data.members.push(m);
  save();document.querySelector('.modal-overlay').remove();render();
}
function delMember(i){if(confirm(`删除 ${data.members[i].name}？`)){data.members.splice(i,1);save();render()}}
function addSkill(){const s=prompt('技能名称：');if(s){data.skills.push(s.trim());data.members.forEach(m=>{m[s.trim()]=0});save();render()}}
function rateSkill(mi,skill){
  const m=document.createElement('div');m.className='modal-overlay';m.innerHTML=`<div class="modal"><h3 style="margin-bottom:16px">${data.members[mi].name} · ${skill}</h3>
    ${data.levels.map((l,i)=>i>0?`<div class="req-item" style="cursor:pointer;${(data.members[mi][skill]||0)===i?'border:2px solid var(--accent)':''}" onclick="setRate(${mi},'${skill}',${i})"><span class="skill-cell level-${i}">${l}</span></div>`:'').join('')}
    <div style="margin-top:12px"><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">关闭</button></div></div>`;
  document.body.appendChild(m);
}
function setRate(mi,skill,level){data.members[mi][skill]=level;save();document.querySelector('.modal-overlay').remove();render()}
function exportCSV(){
  let csv='成员,'+data.skills.join(',')+',平均\n';
  data.members.forEach(m=>{const avg=getMemberAvg(m);csv+=`${m.name},${data.skills.map(s=>m[s]||0).join(',')},${avg.toFixed(1)}\n`});
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='skill-matrix.csv';a.click();
}
render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
