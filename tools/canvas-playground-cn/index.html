<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas游乐场 - 在线Canvas编辑器</title>
<meta name="description" content="在线Canvas编辑器，实时编写和预览HTML5 Canvas绘图代码">
<style>
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent2:#58a6ff;--success:#3fb950;--warning:#d29922;--error:#f85149;--muted:#8b949e}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warning:#9a6700;--error:#cf222e;--muted:#656d76}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;scroll-behavior:smooth}
nav{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
nav .logo{font-size:18px;font-weight:600;color:var(--accent2)}
nav a{color:var(--accent);text-decoration:none;font-size:14px}
.container{display:flex;flex-direction:column;height:calc(100vh - 52px)}
.toolbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-secondary:hover{opacity:.8}
.workspace{display:flex;flex:1;overflow:hidden}
.editor-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border)}
.canvas-panel{flex:1;display:flex;flex-direction:column}
.panel-header{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;font-size:13px;color:var(--accent2);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.editor-wrapper{flex:1;position:relative}
#codeEditor{width:100%;height:100%;background:var(--bg);border:none;color:var(--text);font-family:"Fira Code",Consolas,monospace;font-size:14px;padding:12px;resize:none;outline:none;line-height:1.6}
.canvas-wrapper{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--card)}
#drawCanvas{border:1px solid var(--border);border-radius:4px;background:#fff}
.templates{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.templates span{font-size:12px;color:var(--muted);margin-right:4px}
.template-btn{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:11px;color:var(--accent2);cursor:pointer;transition:.2s}
.template-btn:hover{border-color:var(--accent);color:var(--accent)}
@media(max-width:768px){.workspace{flex-direction:column}.editor-panel{border-right:none;border-bottom:1px solid var(--border)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖼️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="Canvas游乐场 - 在线Canvas编辑器">

</head>
<body>
<h1>Canvas游乐场 - 在线Canvas编辑器</h1>
<nav>
<span class="logo">Canvas游乐场</span>
<a href="/index.html">← 返回工具箱</a>
</nav>
<div class="container">
<div class="toolbar">
<button class="btn btn-primary" onclick="runCode()">▶ 运行</button>
<button class="btn btn-secondary" onclick="clearCanvas()">清空画布</button>
<button class="btn btn-secondary" onclick="copyCode()">复制代码</button>
<button class="btn btn-secondary" onclick="resetCode()">重置</button>
</div>
<div class="templates">
<span>模板:</span>
<button class="template-btn" data-code="// 基础图形\nctx.fillStyle = '#3b82f6';\nctx.fillRect(20, 20, 100, 80);\n\nctx.fillStyle = '#f85149';\nctx.beginPath();\nctx.arc(250, 60, 50, 0, Math.PI * 2);\nctx.fill();\n\nctx.strokeStyle = '#3fb950';\nctx.lineWidth = 3;\nctx.strokeRect(350, 20, 100, 80);">基础图形</button>
<button class="template-btn" data-code="// 渐变效果\nconst grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);\ngrad.addColorStop(0, '#667eea');\ngrad.addColorStop(0.5, '#764ba2');\ngrad.addColorStop(1, '#f85149');\nctx.fillStyle = grad;\nctx.fillRect(0, 0, canvas.width, canvas.height);\n\n// 文字\nctx.fillStyle = '#fff';\nctx.font = 'bold 36px sans-serif';\nctx.textAlign = 'center';\nctx.fillText('Canvas渐变', canvas.width/2, canvas.height/2);">渐变效果</button>
<button class="template-btn" data-code="// 动画 - 弹跳球\nlet x = 50, y = 50, vx = 4, vy = 3;\nconst r = 20;\nfunction animate() {\n  ctx.clearRect(0, 0, canvas.width, canvas.height);\n  ctx.fillStyle = '#3b82f6';\n  ctx.beginPath();\n  ctx.arc(x, y, r, 0, Math.PI * 2);\n  ctx.fill();\n  ctx.shadowColor = '#3b82f6';\n  ctx.shadowBlur = 20;\n  x += vx; y += vy;\n  if (x + r > canvas.width || x - r < 0) vx = -vx;\n  if (y + r > canvas.height || y - r < 0) vy = -vy;\n  requestAnimationFrame(animate);\n}\nanimate();">动画</button>
<button class="template-btn" data-code="// 粒子效果\nconst particles = Array.from({length: 100}, () => ({\n  x: Math.random() * canvas.width,\n  y: Math.random() * canvas.height,\n  vx: (Math.random() - 0.5) * 2,\n  vy: (Math.random() - 0.5) * 2,\n  r: Math.random() * 4 + 1\n}));\nfunction draw() {\n  ctx.fillStyle = 'rgba(0,0,0,0.1)';\n  ctx.fillRect(0, 0, canvas.width, canvas.height);\n  particles.forEach(p => {\n    ctx.fillStyle = `hsl(${Math.random()*60+200},80%,60%)`;\n    ctx.beginPath();\n    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);\n    ctx.fill();\n    p.x += p.vx; p.y += p.vy;\n    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;\n    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;\n  });\n  requestAnimationFrame(draw);\n}\ndraw();">粒子效果</button>
<button class="template-btn" data-code="// 分形 - 递归树\nfunction tree(x, y, len, angle, depth) {\n  if (depth === 0) return;\n  const x2 = x + Math.cos(angle) * len;\n  const y2 = y - Math.sin(angle) * len;\n  ctx.strokeStyle = `hsl(${120 + depth * 15}, 70%, ${40 + depth * 5}%)`;\n  ctx.lineWidth = depth;\n  ctx.beginPath();\n  ctx.moveTo(x, y); ctx.lineTo(x2, y2); ctx.stroke();\n  tree(x2, y2, len * 0.7, angle - 0.4, depth - 1);\n  tree(x2, y2, len * 0.7, angle + 0.4, depth - 1);\n}\nctx.fillStyle = '#1a1a2e';\nctx.fillRect(0, 0, canvas.width, canvas.height);\ntree(canvas.width/2, canvas.height - 20, 100, Math.PI/2, 10);">分形图案</button>
<button class="template-btn" data-code="// 交互绘图\nlet drawing = false;\ncanvas.onmousedown = e => {\n  drawing = true;\n  ctx.beginPath();\n  ctx.moveTo(e.offsetX, e.offsetY);\n};\ncanvas.onmousemove = e => {\n  if (!drawing) return;\n  ctx.lineTo(e.offsetX, e.offsetY);\n  ctx.strokeStyle = '#3b82f6';\n  ctx.lineWidth = 3;\n  ctx.lineCap = 'round';\n  ctx.stroke();\n};\ncanvas.onmouseup = () => drawing = false;\ncanvas.onmouseleave = () => drawing = false;\nctx.fillStyle = '#1a1a2e';\nctx.fillRect(0, 0, canvas.width, canvas.height);\nctx.fillStyle = '#fff';\nctx.font = '16px sans-serif';\nctx.textAlign = 'center';\nctx.fillText('在画布上绘制!', canvas.width/2, canvas.height/2);">交互绘图</button>
</div>
<div class="workspace">
<div class="editor-panel">
<div class="panel-header"><span>Canvas代码</span><span style="font-size:11px;color:var(--muted)">ctx = 画布上下文 | canvas = 画布元素</span></div>
<div class="editor-wrapper">
<textarea id="codeEditor">// 基础图形
ctx.fillStyle = '#3b82f6';
ctx.fillRect(20, 20, 100, 80);

ctx.fillStyle = '#f85149';
ctx.beginPath();
ctx.arc(250, 60, 50, 0, Math.PI * 2);
ctx.fill();

ctx.strokeStyle = '#3fb950';
ctx.lineWidth = 3;
ctx.strokeRect(350, 20, 100, 80);

// 文字
ctx.fillStyle = '#1f2328';
ctx.font = 'bold 20px sans-serif';
ctx.fillText('Hello Canvas!', 150, 150);</textarea>
</div>
</div>
<div class="canvas-panel">
<div class="panel-header">画布</div>
<div class="canvas-wrapper">
<canvas id="drawCanvas" width="500" height="350"></canvas>
</div>
</div>
</div>
</div>
<script>
const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
const codeEditor = document.getElementById('codeEditor');

function runCode() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  try {
    const code = codeEditor.value;
    const fn = new Function('canvas', 'ctx', code);
    fn(canvas, ctx);
  } catch(e) {
    ctx.fillStyle = '#f85149';
    ctx.font = '14px monospace';
    ctx.fillText('错误: ' + e.message, 20, 30);
  }
}

function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function copyCode() {
  navigator.clipboard.writeText(codeEditor.value).then(() => alert('代码已复制'));
}

function resetCode() {
  codeEditor.value = '// 在此编写Canvas绘图代码\n// ctx = canvas.getContext(\'2d\')\nctx.fillStyle = \'#3b82f6\';\nctx.fillRect(20, 20, 100, 80);';
  runCode();
}

document.querySelectorAll('.template-btn').forEach(btn => {
  btn.onclick = () => { codeEditor.value = btn.dataset.code; runCode(); };
});

runCode();
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
