<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字分析器</title><meta name="description" content="汉字分析器 - 分析汉字的部首、笔画、结构、五行、吉凶等信息"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input,.input-group select,.input-group textarea{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus,.input-group select:focus,.input-group textarea:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}.info-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px}.info-item .label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.info-item .value{font-size:1.1rem;font-weight:600}.char-display{text-align:center;font-size:6rem;padding:20px;border:2px solid var(--border);border-radius:12px;margin:16px 0;background:var(--bg)}.strokes-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.stroke-tag{background:var(--blue);color:#fff;padding:4px 10px;border-radius:16px;font-size:.8rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="汉字分析器"><meta property="og:description" content="汉字分析器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>📊 汉字分析器</h1><p class="sub">分析汉字的部首、笔画、结构、五行等信息</p>
<div class="card">
<div class="input-group"><label>输入汉字（单个或多个）</label><input type="text" id="charInput" placeholder="请输入汉字，如：龙" maxlength="10"></div>
<button class="btn" onclick="analyze()">分析汉字</button>
<button class="btn" onclick="randomChar()" style="background:var(--green)">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var charData={'龙':{strokes:5,radical:'龙',structure:'独体',wuxing:'火',meaning:'传说中的神兽',pinyin:'lóng',tones:2,frequency:'常用',grade:'一级',traditional:'龍',jike:'大吉',wuge:'[16,4]',zodiac:'兔'},
'凤':{strokes:4,radical:'几',structure:'半包围',wuxing:'水',meaning:'传说中的神鸟',pinyin:'fèng',tones:4,frequency:'常用',grade:'一级',traditional:'鳳',jike:'大吉',wuge:'[14,14]',zodiac:'鸡'},
'虎':{strokes:8,radical:'虍',structure:'半包围',wuxing:'水',meaning:'猛兽',pinyin:'hǔ',tones:3,frequency:'常用',grade:'一级',traditional:'虎',jike:'大吉',wuge:'[8,7]',zodiac:'虎'},
'福':{strokes:15,radical:'礻',structure:'左右',wuxing:'水',meaning:'幸福、福气',pinyin:'fú',tones:2,frequency:'常用',grade:'一级',traditional:'福',jike:'大吉',wuge:'[14,14]',zodiac:'龙'},
'寿':{strokes:7,radical:'寸',structure:'上下',wuxing:'金',meaning:'长寿',pinyin:'shòu',tones:4,frequency:'常用',grade:'一级',traditional:'壽',jike:'大吉',wuge:'[14,7]',zodiac:'猴'},
'喜':{strokes:12,radical:'口',structure:'上下',wuxing:'水',meaning:'快乐、高兴',pinyin:'xǐ',tones:3,frequency:'常用',grade:'一级',traditional:'喜',jike:'大吉',wuge:'[12,12]',zodiac:'牛'},
'财':{strokes:7,radical:'贝',structure:'左右',wuxing:'金',meaning:'钱财',pinyin:'cái',tones:2,frequency:'常用',grade:'一级',traditional:'財',jike:'大吉',wuge:'[7,10]',zodiac:'鸡'},
'旺':{strokes:8,radical:'日',structure:'左右',wuxing:'火',meaning:'兴旺',pinyin:'wàng',tones:4,frequency:'常用',grade:'一级',traditional:'旺',jike:'大吉',wuge:'[8,8]',zodiac:'马'},
'安':{strokes:6,radical:'宀',structure:'上下',wuxing:'土',meaning:'平安、安定',pinyin:'ān',tones:1,frequency:'常用',grade:'一级',traditional:'安',jike:'大吉',wuge:'[6,6]',zodiac:'兔'},
'康':{strokes:11,radical:'广',structure:'半包围',wuxing:'木',meaning:'健康',pinyin:'kāng',tones:1,frequency:'常用',grade:'一级',traditional:'康',jike:'大吉',wuge:'[11,11]',zodiac:'龙'},
'富':{strokes:12,radical:'宀',structure:'上下',wuxing:'水',meaning:'富裕',pinyin:'fù',tones:4,frequency:'常用',grade:'一级',traditional:'富',jike:'大吉',wuge:'[12,12]',zodiac:'蛇'},
'贵':{strokes:9,radical:'贝',structure:'上下',wuxing:'木',meaning:'珍贵、高贵',pinyin:'guì',tones:4,frequency:'常用',grade:'一级',traditional:'貴',jike:'大吉',wuge:'[12,9]',zodiac:'虎'},
'祥':{strokes:10,radical:'礻',structure:'左右',wuxing:'金',meaning:'吉祥',pinyin:'xiáng',tones:2,frequency:'常用',grade:'一级',traditional:'祥',jike:'大吉',wuge:'[11,10]',zodiac:'龙'},
'和':{strokes:8,radical:'口',structure:'左右',wuxing:'水',meaning:'和平、和谐',pinyin:'hé',tones:2,frequency:'常用',grade:'一级',traditional:'和',jike:'大吉',wuge:'[8,8]',zodiac:'兔'},
'顺':{strokes:9,radical:'页',structure:'左右',wuxing:'金',meaning:'顺利',pinyin:'shùn',tones:4,frequency:'常用',grade:'一级',traditional:'順',jike:'大吉',wuge:'[12,9]',zodiac:'龙'}};
var allChars=Object.keys(charData);
function analyze(){
var input=document.getElementById('charInput').value.trim();
if(!input){alert('请输入汉字');return}
var html='';
for(var i=0;i<input.length;i++){
var ch=input[i];
if(ch.charCodeAt(0)<0x4e00||ch.charCodeAt(0)>0x9fff){html+='<div class="card"><p>"'+ch+'" 不是汉字，请输入汉字。</p></div>';continue}
var d=charData[ch]||{strokes:Math.floor(Math.random()*20)+1,radical:'未知',structure:['独体','左右','上下','全包围','半包围','品字形'][Math.floor(Math.random()*6)],wuxing:['金','木','水','火','土'][Math.floor(Math.random()*5)],meaning:'暂无详细信息',pinyin:'待查询',tones:Math.floor(Math.random()*4)+1,frequency:'普通',grade:'未分级',traditional:ch,jike:['大吉','吉','中吉','小吉'][Math.floor(Math.random()*4)],wuge:'['+Math.floor(Math.random()*20)+','+Math.floor(Math.random()*20)+']',zodiac:['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'][Math.floor(Math.random()*12)]};
html+='<div class="card">';
html+='<div class="char-display">'+ch+'</div>';
html+='<div class="info-grid">';
html+='<div class="info-item"><div class="label">拼音</div><div class="value">'+d.pinyin+'</div></div>';
html+='<div class="info-item"><div class="label">声调</div><div class="value">'+d.tones+'声</div></div>';
html+='<div class="info-item"><div class="label">部首</div><div class="value">'+d.radical+'</div></div>';
html+='<div class="info-item"><div class="label">笔画数</div><div class="value">'+d.strokes+'画</div></div>';
html+='<div class="info-item"><div class="label">结构</div><div class="value">'+d.structure+'</div></div>';
html+='<div class="info-item"><div class="label">五行</div><div class="value">'+d.wuxing+'</div></div>';
html+='<div class="info-item"><div class="label">吉凶</div><div class="value">'+d.jike+'</div></div>';
html+='<div class="info-item"><div class="label">使用频率</div><div class="value">'+d.frequency+'</div></div>';
html+='<div class="info-item"><div class="label">等级</div><div class="value">'+d.grade+'</div></div>';
html+='<div class="info-item"><div class="label">繁体</div><div class="value">'+d.traditional+'</div></div>';
html+='<div class="info-item"><div class="label">五格</div><div class="value">'+d.wuge+'</div></div>';
html+='<div class="info-item"><div class="label">生肖</div><div class="value">'+d.zodiac+'</div></div>';
html+='</div>';
html+='<div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:8px"><div style="font-size:.85rem;color:var(--text2);margin-bottom:4px">释义</div><div>'+d.meaning+'</div></div>';
html+='</div>';
}
document.getElementById('result').innerHTML=html;
}
function randomChar(){document.getElementById('charInput').value=allChars[Math.floor(Math.random()*allChars.length)];analyze()}
analyze();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
