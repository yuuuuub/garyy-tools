ont-size:.9rem;color:var(--green);margin-bottom:2px}.evolution-desc{font-size:.85rem;color:var(--text2)}.evolution-line{position:absolute;bottom:-16px;left:30px;width:2px;height:16px;background:var(--border)}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.evolution-stage{animation:fadeIn .3s ease-out}</style><meta property="og:title" content="汉字进化21"><meta property="og:description" content="汉字进化21 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧬</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🧬 汉字进化21</h1><p class="sub">在线查看汉字进化过程</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" oninput="showEvolution()">
</div>
<button class="btn" onclick="showEvolution()">查看进化</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var evolutionData={
  '东':{stages:[{era:'甲骨文',char:'🌅',name:'象形字',desc:'像日出东方'},{era:'金文',char:'東',name:'象形字',desc:'日出之形'},{era:'小篆',char:'東',name:'象形字',desc:'规范化东字'},{era:'隶书',char:'東',name:'繁体字',desc:'繁体东字'},{era:'楷书',char:'东',name:'简体字',desc:'现代简体写法'}]},
  '西':{stages:[{era:'甲骨文',char:'🌇',name:'象形字',desc:'像鸟归巢'},{era:'金文',char:'西',name:'象形字',desc:'鸟巢之形'},{era:'小篆',char:'西',name:'象形字',desc:'规范化西字'},{era:'隶书',char:'西',name:'方块字',desc:'更加规整'},{era:'楷书',char:'西',name:'标准字',desc:'现代标准写法'}]},
  '南':{stages:[{era:'甲骨文',char:'🧭',name:'象形字',desc:'像乐器形状'},{era:'金文',char:'南',name:'象形字',desc:'乐器之形'},{era:'小篆',char:'南',name:'象形字',desc:'规范化南字'},{era:'隶书',char:'南',name:'方块字',desc:'更加规整'},{era:'楷书',char:'南',name:'标准字',desc:'现代标准写法'}]},
  '北':{stages:[{era:'甲骨文',char:'❄️',name:'会意字',desc:'二人相背'},{era:'金文',char:'北',name:'会意字',desc:'相背之形'},{era:'小篆',char:'北',name:'会意字',desc:'规范化北字'},{era:'隶书',char:'北',name:'方块字',desc:'更加规整'},{era:'楷书',char:'北',name:'标准字',desc:'现代标准写法'}]},
  '中':{stages:[{era:'甲骨文',char:'🎯',name:'象形字',desc:'像旗杆立于中央'},{era:'金文',char:'中',name:'象形字',desc:'中央之形'},{era:'小篆',char:'中',name:'象形字',desc:'规范中字'},{era:'隶书',char:'中',name:'方块字',desc:'更加规整'},{era:'楷书',char:'中',name:'标准字',desc:'现代标准写法'}]},
  '上':{stages:[{era:'甲骨文',char:'⬆️',name:'指事字',desc:'指示上方位置'},{era:'金文',char:'上',name:'指事字',desc:'上方之形'},{era:'小篆',char:'上',name:'指事字',desc:'规范化上字'},{era:'隶书',char:'上',name:'方块字',desc:'更加规整'},{era:'楷书',char:'上',name:'标准字',desc:'现代标准写法'}]},
  '下':{stages:[{era:'甲骨文',char:'⬇️',name:'指事字',desc:'指示下方位置'},{era:'金文',char:'下',name:'指事字',desc:'下方之形'},{era:'小篆',char:'下',name:'指事字',desc:'规范化下字'},{era:'隶书',char:'下',name:'方块字',desc:'更加规整'},{era:'楷书',char:'下',name:'标准字',desc:'现代标准写法'}]},
  '左':{stages:[{era:'甲骨文',char:'👈',name:'会意字',desc:'从又从工'},{era:'金文',char:'左',name:'会意字',desc:'左手之形'},{era:'小篆',char:'左',name:'会意字',desc:'规范化左字'},{era:'隶书',char:'左',name:'方块字',desc:'更加规整'},{era:'楷书',char:'左',name:'标准字',desc:'现代标准写法'}]},
  '右':{stages:[{era:'甲骨文',char:'👉',name:'会意字',desc:'从又从口'},{era:'金文',char:'右',name:'会意字',desc:'右手之形'},{era:'小篆',char:'右',name:'会意字',desc:'规范化右字'},{era:'隶书',char:'右',name:'方块字',desc:'更加规整'},{era:'楷书',char:'右',name:'标准字',desc:'现代标准写法'}]},
  '前':{stages:[{era:'甲骨文',char:'🔜',name:'会意字',desc:'从止从舟'},{era:'金文',char:'前',name:'会意字',desc:'前进之形'},{era:'小篆',char:'前',name:'会意字',desc:'规范化前字'},{era:'隶书',char:'前',name:'方块字',desc:'更加规整'},{era:'楷书',char:'前',name:'标准字',desc:'现代标准写法'}]}
};
function showEvolution(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var data=evolutionData[char];
  if(!data){
    data={stages:[{era:'古代',char:char,name:'汉字',desc:'暂无详细进化信息'},{era:'现代',char:char,name:'标准字',desc:'现代标准写法'}]};
  }
  var html='<div class="card">';
  html+='<div style="text-align:center;margin-bottom:20px">';
  html+='<div style="font-size:4rem;font-weight:700;color:var(--blue)">'+char+'</div>';
  html+='<div style="font-size:1.1rem;color:var(--text2);margin-top:8px">汉字进化历程</div>';
  html+='</div>';
  html+='<div class="evolution-timeline">';
  data.stages.forEach(function(stage,index){
    html+='<div class="evolution-stage">';
    html+='<div class="evolution-char">'+stage.char+'</div>';
    html+='<div class="evolution-info">';
    html+='<div class="evolution-era">'+stage.era+'</div>';
    html+='<div class="evolution-name">'+stage.name+'</div>';
    html+='<div class="evolution-desc">'+stage.desc+'</div>';
    html+='</div>';
    if(index<data.stages.length-1){
      html+='<div class="evolution-line"></div>';
    }
    html+='</div>';
  });
  html+='</div></div>';
  r.innerHTML=html;
}
function randomCharacter(){
  var chars=Object.keys(evolutionData);
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  showEvolution();
}
showEvolution();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
