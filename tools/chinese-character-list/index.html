<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字列表</title><meta name="description" content="汉字列表 - 在线查看汉字列表"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.character-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px;margin:16px 0}.character-cell{aspect-ratio:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;transition:all .2s}.character-cell:hover{border-color:var(--blue);transform:scale(1.05)}.character-cell.selected{border-color:var(--green);background:rgba(35,134,54,.1)}.pagination{display:flex;gap:8px;justify-content:center;margin:16px 0}.page-btn{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.85rem}.page-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}

h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}
</style><meta property="og:title" content="汉字列表"><meta property="og:description" content="汉字列表 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>📚 汉字列表</h1><p class="sub">在线查看汉字列表</p>
<div class="card">
<div class="btn-group">
<button class="btn" onclick="showAll()">显示全部</button>
<button class="btn" onclick="showByRadical()">按部首</button>
<button class="btn" onclick="showByStrokes()">按笔画</button>
</div>
</div>
<div id="result"></div>
<div class="card" id="detailCard" style="display:none">
<h3 style="margin-bottom:16px">汉字详情</h3>
<div id="detail" style="padding:12px;background:var(--bg);border-radius:8px"></div>
</div></div>
<script src="../i18n.js" defer></script>
<script>
var characters=[
  {char:'一',pinyin:'yī',strokes:1,radical:'一',meaning:'一，第一'},
  {char:'二',pinyin:'èr',strokes:2,radical:'二',meaning:'二，第二'},
  {char:'三',pinyin:'sān',strokes:3,radical:'一',meaning:'三，第三'},
  {char:'四',pinyin:'sì',strokes:5,radical:'囗',meaning:'四，第四'},
  {char:'五',pinyin:'wǔ',strokes:4,radical:'一',meaning:'五，第五'},
  {char:'六',pinyin:'liù',strokes:4,radical:'八',meaning:'六，第六'},
  {char:'七',pinyin:'qī',strokes:2,radical:'一',meaning:'七，第七'},
  {char:'八',pinyin:'bā',strokes:2,radical:'八',meaning:'八，第八'},
  {char:'九',pinyin:'jiǔ',strokes:2,radical:'丿',meaning:'九，第九'},
  {char:'十',pinyin:'shí',strokes:2,radical:'十',meaning:'十，第十'},
  {char:'大',pinyin:'dà',strokes:3,radical:'大',meaning:'大的，巨大'},
  {char:'小',pinyin:'xiǎo',strokes:3,radical:'小',meaning:'小的，微小'},
  {char:'多',pinyin:'duō',strokes:6,radical:'夕',meaning:'多的，很多'},
  {char:'少',pinyin:'shǎo',strokes:4,radical:'小',meaning:'少的，很少'},
  {char:'上',pinyin:'shàng',strokes:3,radical:'一',meaning:'上面，上方'},
  {char:'下',pinyin:'xià',strokes:3,radical:'一',meaning:'下面，下方'},
  {char:'左',pinyin:'zuǒ',strokes:5,radical:'工',meaning:'左边，左侧'},
  {char:'右',pinyin:'yòu',strokes:5,radical:'口',meaning:'右边，右侧'},
  {char:'前',pinyin:'qián',strokes:9,radical:'刂',meaning:'前面，前方'},
  {char:'后',pinyin:'hòu',strokes:6,radical:'口',meaning:'后面，后方'},
  {char:'东',pinyin:'dōng',strokes:5,radical:'一',meaning:'东方，东边'},
  {char:'西',pinyin:'xī',strokes:6,radical:'西',meaning:'西方，西边'},
  {char:'南',pinyin:'nán',strokes:9,radical:'十',meaning:'南方，南边'},
  {char:'北',pinyin:'běi',strokes:5,radical:'匕',meaning:'北方，北边'},
  {char:'天',pinyin:'tiān',strokes:4,radical:'大',meaning:'天空，一天'},
  {char:'地',pinyin:'dì',strokes:6,radical:'土',meaning:'地面，土地'},
  {char:'人',pinyin:'rén',strokes:2,radical:'人',meaning:'人类，人们'},
  {char:'口',pinyin:'kǒu',strokes:3,radical:'口',meaning:'嘴，口'},
  {char:'日',pinyin:'rì',strokes:4,radical:'日',meaning:'太阳，日子'},
  {char:'月',pinyin:'yuè',strokes:4,radical:'月',meaning:'月亮，月份'},
  {char:'水',pinyin:'shuǐ',strokes:4,radical:'水',meaning:'水，液体'},
  {char:'火',pinyin:'huǒ',strokes:4,radical:'火',meaning:'火，火焰'},
  {char:'木',pinyin:'mù',strokes:4,radical:'木',meaning:'木头，树木'},
  {char:'金',pinyin:'jīn',strokes:8,radical:'金',meaning:'金属，黄金'},
  {char:'土',pinyin:'tǔ',strokes:3,radical:'土',meaning:'土壤，土地'}
];
var currentPage=1;
var pageSize=20;
var currentView='all';
function showAll(){
  currentView='all';
  currentPage=1;
  renderList(characters);
}
function showByRadical(){
  currentView='radical';
  currentPage=1;
  var grouped={};
  characters.forEach(function(char){
    if(!grouped[char.radical])grouped[char.radical]=[];
    grouped[char.radical].push(char);
  });
  var html='<div class="card">';
  html+='<div class="section"><h3>按部首分组</h3>';
  Object.keys(grouped).forEach(function(radical){
    html+='<div style="margin-bottom:16px">';
    html+='<div style="font-size:1rem;font-weight:600;color:var(--blue);margin-bottom:8px">'+radical+'部 ('+grouped[radical].length+')</div>';
    html+='<div class="character-grid">';
    grouped[radical].forEach(function(char){
      html+='<div class="character-cell" onclick="showDetail(\''+char.char+'\')">'+char.char+'</div>';
    });
    html+='</div></div>';
  });
  html+='</div></div>';
  document.getElementById('result').innerHTML=html;
}
function showByStrokes(){
  currentView='strokes';
  currentPage=1;
  var grouped={};
  characters.forEach(function(char){
    var key=char.strokes+'画';
    if(!grouped[key])grouped[key]=[];
    grouped[key].push(char);
  });
  var html='<div class="card">';
  html+='<div class="section"><h3>按笔画分组</h3>';
  Object.keys(grouped).sort().forEach(function(strokes){
    html+='<div style="margin-bottom:16px">';
    html+='<div style="font-size:1rem;font-weight:600;color:var(--blue);margin-bottom:8px">'+strokes+' ('+grouped[strokes].length+')</div>';
    html+='<div class="character-grid">';
    grouped[strokes].forEach(function(char){
      html+='<div class="character-cell" onclick="showDetail(\''+char.char+'\')">'+char.char+'</div>';
    });
    html+='</div></div>';
  });
  html+='</div></div>';
  document.getElementById('result').innerHTML=html;
}
function renderList(chars){
  var start=(currentPage-1)*pageSize;
  var end=start+pageSize;
  var pageChars=chars.slice(start,end);
  var totalPages=Math.ceil(chars.length/pageSize);
  var html='<div class="card">';
  html+='<div style="margin-bottom:12px;color:var(--text2)">共 '+chars.length+' 个汉字</div>';
  html+='<div class="character-grid">';
  pageChars.forEach(function(char){
    html+='<div class="character-cell" onclick="showDetail(\''+char.char+'\')">'+char.char+'</div>';
  });
  html+='</div>';
  html+='<div class="pagination">';
  for(var i=1;i<=totalPages;i++){
    html+='<div class="page-btn '+(i===currentPage?'active':'')+'" onclick="goToPage('+i+')">'+i+'</div>';
  }
  html+='</div></div>';
  document.getElementById('result').innerHTML=html;
}
function goToPage(page){
  currentPage=page;
  renderList(characters);
}
function showDetail(char){
  var character=characters.find(function(c){return c.char===char;});
  if(!character)return;
  document.getElementById('detailCard').style.display='block';
  var html='<div style="text-align:center;margin-bottom:16px">';
  html+='<div style="font-size:4rem;font-weight:700;color:var(--blue)">'+character.char+'</div>';
  html+='<div style="font-size:1.2rem;color:var(--green);margin-top:8px">'+character.pinyin+'</div>';
  html+='</div>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>笔画：</strong>'+character.strokes+'</div>';
  html+='<div><strong>部首：</strong>'+character.radical+'</div>';
  html+='<div><strong>含义：</strong>'+character.meaning+'</div>';
  html+='</div>';
  document.getElementById('detail').innerHTML=html;
  document.getElementById('detailCard').scrollIntoView({behavior:'smooth'});
}
showAll();
</script><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
