<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 双耳节拍</title>
<meta property="og:title" content="🧠 双耳节拍">
<meta property="og:description" content="🧠 双耳节拍 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线双耳节拍生成器，支持Alpha/Beta/Theta/Delta波段，帮助冥想和睡眠">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#ec4899;--accent2:#db2777;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#db2777;--accent2:#be185d}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.ctn{width:100%;max-width:500px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 20px;box-shadow:var(--shadow)}
header{text-align:center;margin-bottom:24px}h1{font-size:1.5rem;font-weight:700}.sub{color:var(--text2);font-size:.85rem;margin-top:4px}
.section{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}.section h2{font-size:1rem;margin-bottom:12px;color:var(--accent)}
.waves{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.wave{padding:14px 10px;border:2px solid var(--border);border-radius:10px;cursor:pointer;text-align:center;transition:all .2s;background:var(--card)}.wave:hover{border-color:var(--accent)}.wave.active{border-color:var(--accent);background:rgba(236,72,153,.1)}
.wave .name{font-size:.9rem;font-weight:600}.wave .hz{font-size:.75rem;color:var(--text2);margin-top:2px}.wave.active .name{color:var(--accent)}
.wave .desc{font-size:.7rem;color:var(--text2);margin-top:4px}
.slider-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}.slider-row label{font-size:.85rem;color:var(--text2);min-width:70px}
.slider-row input[type="range"]{flex:1;-webkit-appearance:none;height:6px;border-radius:3px;background:var(--border);outline:none}
.slider-row input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid var(--card)}
.slider-row span{font-size:.85rem;min-width:40px;text-align:right}
.timer-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tbtn{padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:var(--card);color:var(--text);font-size:.8rem;cursor:pointer;transition:all .2s}.tbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.ctrls{display:flex;gap:10px;margin-top:14px}.btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s}.btn-play{background:var(--accent);color:#fff}.btn-play:hover{background:var(--accent2)}.btn-play.playing{background:#ef4444}.btn-stop{background:var(--border);color:var(--text)}
.status{text-align:center;margin-top:12px;font-size:.85rem;color:var(--text2);min-height:20px}
.viz{display:flex;align-items:center;justify-content:center;height:60px;margin-top:12px;position:relative}
.viz-circle{width:50px;height:50px;border-radius:50%;border:3px solid var(--accent);opacity:.5;transition:all .3s}
.viz-circle.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.3);opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.ctn{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="ctn">
<header><h1>🧠 双耳节拍</h1><p class="sub">利用双耳差频引导脑波状态</p></header>

<div class="section"><h2>🎵 脑波波段</h2>
<div class="waves" id="waves"></div></div>

<div class="section">
<div class="slider-row"><label>基准频率</label><input type="range" id="baseFreq" min="100" max="500" value="200" oninput="updateBase(this.value)"><span id="baseV">200Hz</span></div>
<div class="slider-row"><label>音量</label><input type="range" id="vol" min="0" max="100" value="50" oninput="setVol(this.value)"><span id="volV">50%</span></div>
<div class="slider-row"><label>自定义差频</label><input type="range" id="customHz" min="1" max="40" value="10" oninput="updateCustom(this.value)"><span id="customV">10Hz</span></div>
</div>

<div class="section"><h2>⏱ 定时</h2>
<div class="timer-btns">
<button class="tbtn active" onclick="setTimer(0,this)">不限</button>
<button class="tbtn" onclick="setTimer(10,this)">10分钟</button>
<button class="tbtn" onclick="setTimer(20,this)">20分钟</button>
<button class="tbtn" onclick="setTimer(30,this)">30分钟</button>
<button class="tbtn" onclick="setTimer(60,this)">1小时</button>
</div></div>

<div class="ctrls">
<button class="btn btn-play" id="playBtn" onclick="toggle()">▶ 播放</button>
<button class="btn btn-stop" onclick="stop()">⏹ 停止</button>
</div>
<div class="viz"><div class="viz-circle" id="vizCircle"></div></div>
<div class="status" id="status">选择波段，点击播放</div>
</div>

<script src="../i18n.js" defer></script>
<script>
const waveTypes=[
  {id:'delta',name:'Delta波',hz:'0.5-4Hz',desc:'深度睡眠',diff:2},
  {id:'theta',name:'Theta波',hz:'4-8Hz',desc:'冥想放松',diff:6},
  {id:'alpha',name:'Alpha波',hz:'8-13Hz',desc:'平静专注',diff:10},
  {id:'beta',name:'Beta波',hz:'13-30Hz',desc:'清醒思考',diff:20},
  {id:'gamma',name:'Gamma波',hz:'30-50Hz',desc:'高度集中',diff:40},
  {id:'custom',name:'自定义',hz:'1-40Hz',desc:'手动调节',diff:10}
];

let actx=null,playing=false,timerId=null,timerMin=0;
let oscL=null,oscR=null,gainL=null,gainR=null,merger=null;
let current='alpha',baseFreqVal=200;

function $(id){return document.getElementById(id);}

function initWaves(){
  const g=$('waves');
  waveTypes.forEach((w,i)=>{
    const d=document.createElement('div');d.className='wave'+(i===2?' active':'');
    d.innerHTML=`<div class="name">${w.name}</div><div class="hz">${w.hz}</div><div class="desc">${w.desc}</div>`;
    d.onclick=()=>{current=w.id;g.querySelectorAll('.wave').forEach(x=>x.classList.remove('active'));d.classList.add('active');if(playing){stop();toggle();}};
    g.appendChild(d);
  });
}

function updateBase(v){baseFreqVal=+v;$('baseV').textContent=v+'Hz';}
function updateCustom(v){waveTypes.find(w=>w.id==='custom').diff=+v;$('customV').textContent=v+'Hz';}
function setVol(v){$('volV').textContent=v+'%';if(gainL)gainL.gain.value=v/100;if(gainR)gainR.gain.value=v/100;}
function setTimer(m,t){timerMin=m;document.querySelectorAll('.tbtn').forEach(x=>x.classList.remove('active'));t.classList.add('active');}

function setupAudio(){
  if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
  const diff=waveTypes.find(w=>w.id===current).diff;
  const vol=$('vol').value/100;

  merger=actx.createChannelMerger(2);
  merger.connect(actx.destination);

  oscL=actx.createOscillator();oscL.type='sine';oscL.frequency.value=baseFreqVal;
  gainL=actx.createGain();gainL.gain.value=vol;
  oscL.connect(gainL);gainL.connect(merger,0,0);

  oscR=actx.createOscillator();oscR.type='sine';oscR.frequency.value=baseFreqVal+diff;
  gainR=actx.createGain();gainR.gain.value=vol;
  oscR.connect(gainR);gainR.connect(merger,0,1);

  oscL.start();oscR.start();
}

function toggle(){
  if(playing){stop();return;}
  setupAudio();playing=true;
  $('playBtn').textContent='⏸ 暂停';$('playBtn').classList.add('playing');
  const w=waveTypes.find(w=>w.id===current);
  $('status').textContent=`正在播放：${w.name} (${w.desc}) - 差频 ${w.diff}Hz`;
  $('vizCircle').classList.add('pulse');
  $('vizCircle').style.animationDuration=(1000/w.diff)+'s';
  if(timerMin>0)timerId=setTimeout(()=>{stop();$('status').textContent='定时结束';},timerMin*60000);
}

function stop(){
  if(!playing)return;
  try{oscL.stop();}catch(e){}
  try{oscR.stop();}catch(e){}
  oscL=null;oscR=null;gainL=null;gainR=null;merger=null;
  playing=false;
  $('playBtn').textContent='▶ 播放';$('playBtn').classList.remove('playing');
  $('status').textContent='已停止';
  $('vizCircle').classList.remove('pulse');
  if(timerId){clearTimeout(timerId);timerId=null;}
}

initWaves();
</script>
</body>
</html>
