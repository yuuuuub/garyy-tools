<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>诗词生成器</title><meta name="description" content="随机生成中国古诗词，感受诗词之美"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#f472b6}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:20px 0 8px;font-size:1.5rem;font-weight:700}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.options{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.options select{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.9rem}.btn{display:inline-block;padding:10px 20px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;transition:.2s}.btn:hover{opacity:.85}.btn-secondary{background:var(--border);color:var(--text)}.actions{display:flex;gap:8px;justify-content:center;margin-top:16px}.poem-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-top:16px;text-align:center}.poem-icon{font-size:2.5rem;margin-bottom:12px}.poem-title{font-size:1.2rem;font-weight:700;color:var(--accent);margin-bottom:4px}.poem-author{font-size:.85rem;color:var(--text2);margin-bottom:16px}.poem-content{font-size:1.1rem;line-height:2;color:var(--text);white-space:pre-line;margin-bottom:16px}.poem-explain{font-size:.9rem;color:var(--text2);line-height:1.6;text-align:left;display:none}.poem-card.revealed .poem-explain{display:block}.reveal-btn{display:inline-block;margin-top:12px;padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;transition:.2s}.reveal-btn:hover{opacity:.85}.poem-card.revealed .reveal-btn{display:none}.poem-tags{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}.poem-tag{padding:3px 10px;background:var(--bg);border:1px solid var(--border);border-radius:12px;font-size:.75rem;color:var(--text2)}.counter{font-size:.8rem;color:var(--text2);margin-top:8px}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}</style><meta name="robots" content="index, follow"><meta property="og:title" content="诗词生成器"><meta property="og:description" content="随机生成中国古诗词"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🌸 诗词生成器</h1><p class="sub">随机生成中国古诗词，感受诗词之美</p>
<div class="card">
<div class="options">
<select id="category"><option value="all">全部</option><option value="spring">春</option><option value="summer">夏</option><option value="autumn">秋</option><option value="winter">冬</option><option value="love">爱情</option><option value="home">思乡</option><option value="nature">山水</option><option value="war">边塞</option></select>
</div>
<div class="actions"><button class="btn" onclick="generate()">🎲 生成诗词</button></div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
(function(){
var poems=[
{c:'spring',t:'春晓',a:'孟浩然',content:'春眠不觉晓，\n处处闻啼鸟。\n夜来风雨声，\n花落知多少。',e:'春天的夜晚睡得很舒服，不知不觉天就亮了。到处都能听到鸟儿的叫声。回想昨夜的风雨声，不知道花儿落了多少。'},
{c:'spring',t:'咏柳',a:'贺知章',content:'碧玉妆成一树高，\n万条垂下绿丝绦。\n不知细叶谁裁出，\n二月春风似剪刀。',e:'高高的柳树像是用碧玉装扮成的，垂下的千万条柳枝像绿色的丝带。不知道这细细的柳叶是谁裁剪出来的，原来是二月的春风像剪刀一样裁剪出来的。'},
{c:'spring',t:'春日',a:'朱熹',content:'胜日寻芳泗水滨，\n无边光景一时新。\n等闲识得东风面，\n万紫千红总是春。',e:'在美好的日子里沿着泗水河边踏青，无边无际的风光焕然一新。谁都可以看出春天的面貌，万紫千红的花朵都是春天的景象。'},
{c:'spring',t:'绝句',a:'杜甫',content:'迟日江山丽，\n春风花草香。\n泥融飞燕子，\n沙暖睡鸳鸯。',e:'江山沐浴着春光，多么秀丽。春风送来花草的芳香。燕子衔着湿泥忙着筑巢，暖和的沙子上睡着成双成对的鸳鸯。'},
{c:'summer',t:'小池',a:'杨万里',content:'泉眼无声惜细流，\n树阴照水爱晴柔。\n小荷才露尖尖角，\n早有蜻蜓立上头。',e:'泉水从泉眼中静静地流淌出来，树荫映照在水面上喜爱这晴天的柔和。小小的荷叶刚刚露出尖尖的角，就已经有蜻蜓立在上面了。'},
{c:'summer',t:'晓出净慈寺送林子方',a:'杨万里',content:'毕竟西湖六月中，\n风光不与四时同。\n接天莲叶无穷碧，\n映日荷花别样红。',e:'到底是西湖六月的风景，风光与其他季节不同。碧绿的莲叶连接天际，一望无际。在阳光的映照下，荷花显得特别鲜艳红润。'},
{c:'summer',t:'约客',a:'赵师秀',content:'黄梅时节家家雨，\n青草池塘处处蛙。\n有约不来过夜半，\n闲敲棋子落灯花。',e:'梅子黄时，家家户户都笼罩在烟雨之中。长满青草的池塘边，到处都是蛙鸣声。约好的客人过了半夜还没有来，我无聊地敲着棋子，震落了灯花。'},
{c:'autumn',t:'山行',a:'杜牧',content:'远上寒山石径斜，\n白云深处有人家。\n停车坐爱枫林晚，\n霜叶红于二月花。',e:'沿着弯弯曲曲的小路上山，在那白云深处居然还有人家。停下车来是因为喜爱这傍晚的枫林美景，经过霜打的枫叶比二月的花还要红。'},
{c:'autumn',t:'枫桥夜泊',a:'张继',content:'月落乌啼霜满天，\n江枫渔火对愁眠。\n姑苏城外寒山寺，\n夜半钟声到客船。',e:'月亮落下，乌鸦啼叫，寒霜满天。江边的枫树和渔船上的灯火陪伴着我忧愁入眠。姑苏城外的寒山寺，半夜的钟声传到了客船上。'},
{c:'autumn',t:'秋夕',a:'杜牧',content:'银烛秋光冷画屏，\n轻罗小扇扑流萤。\n天阶夜色凉如水，\n卧看牵牛织女星。',e:'银烛的烛光照着画面屏风，手持轻巧的团扇扑打着飞舞的萤火虫。皇宫中的石阶夜色如水般清凉，躺着观看天上的牵牛星和织女星。'},
{c:'winter',t:'江雪',a:'柳宗元',content:'千山鸟飞绝，\n万径人踪灭。\n孤舟蓑笠翁，\n独钓寒江雪。',e:'所有的山上都看不到飞鸟的影子，所有的道路上都没有人的踪迹。一条小船上坐着一个披着蓑衣戴着斗笠的渔翁，独自在漫天风雪中垂钓。'},
{c:'winter',t:'逢雪宿芙蓉山主人',a:'刘长卿',content:'日暮苍山远，\n天寒白屋贫。\n柴门闻犬吠，\n风雪夜归人。',e:'暮色苍茫，山路遥远。天气寒冷，茅屋显得更加简陋。柴门外突然传来狗叫声，原来是风雪之夜有人归来。'},
{c:'winter',t:'梅花',a:'王安石',content:'墙角数枝梅，\n凌寒独自开。\n遥知不是雪，\n为有暗香来。',e:'墙角有几枝梅花，冒着严寒独自开放。远远望去就知道那不是雪，因为有淡淡的清香飘来。'},
{c:'love',t:'相思',a:'王维',content:'红豆生南国，\n春来发几枝。\n愿君多采撷，\n此物最相思。',e:'红豆生长在南方，春天来了它会发出多少新枝呢？希望你多多采摘一些，因为红豆最能寄托相思之情。'},
{c:'love',t:'无题',a:'李商隐',content:'相见时难别亦难，\n东风无力百花残。\n春蚕到死丝方尽，\n蜡炬成灰泪始干。',e:'相见的机会太难得，分别时也难舍难分。东风无力，百花凋零。春蚕到死才停止吐丝，蜡烛烧成灰烬才停止流泪。'},
{c:'love',t:'鹊桥仙',a:'秦观',content:'纤云弄巧，飞星传恨，\n银汉迢迢暗度。\n金风玉露一相逢，\n便胜却人间无数。\n柔情似水，佳期如梦，\n忍顾鹊桥归路。\n两情若是久长时，又岂在朝朝暮暮。',e:'轻薄的云彩变幻着巧妙的形状，流星传递着离别的愁恨，牛郎织女渡过遥远的银河相会。在秋风白露时节的相逢，胜过人间无数次的相聚。'},
{c:'home',t:'静夜思',a:'李白',content:'床前明月光，\n疑是地上霜。\n举头望明月，\n低头思故乡。',e:'床前有明亮的月光，好像地上铺了一层白霜。抬头望着天上的明月，不禁低头思念起远方的故乡。'},
{c:'home',t:'九月九日忆山东兄弟',a:'王维',content:'独在异乡为异客，\n每逢佳节倍思亲。\n遥知兄弟登高处，\n遍插茱萸少一人。',e:'独自一人在他乡做客，每到佳节就格外思念亲人。远远想到兄弟们登高的地方，遍插茱萸的人群中唯独少了我一个人。'},
{c:'home',t:'泊船瓜洲',a:'王安石',content:'京口瓜洲一水间，\n钟山只隔数重山。\n春风又绿江南岸，\n明月何时照我还。',e:'京口和瓜洲之间只隔着一条长江，钟山也不过相隔几座山。春风又吹绿了长江南岸，明月什么时候才能照着我回到故乡。'},
{c:'nature',t:'望庐山瀑布',a:'李白',content:'日照香炉生紫烟，\n遥看瀑布挂前川。\n飞流直下三千尺，\n疑是银河落九天。',e:'阳光照射在香炉峰上升起紫色的烟雾，远远看去瀑布像一条白练挂在山前。水流从三千尺的高处飞流直下，让人怀疑是银河从九天之上落了下来。'},
{c:'nature',t:'望天门山',a:'李白',content:'天门中断楚江开，\n碧水东流至此回。\n两岸青山相对出，\n孤帆一片日边来。',e:'天门山从中间断开，楚江水奔涌而过。碧绿的江水向东流到这里又回旋。两岸的青山相对耸立，一叶孤舟从太阳那边驶来。'},
{c:'nature',t:'望洞庭',a:'刘禹锡',content:'湖光秋月两相和，\n潭面无风镜未磨。\n遥望洞庭山水翠，\n白银盘里一青螺。',e:'湖光和秋月交融在一起，水面无风就像一面没有打磨的铜镜。远远望去洞庭山水一片翠绿，就像白银盘里放着一只青螺。'},
{c:'war',t:'出塞',a:'王昌龄',content:'秦时明月汉时关，\n万里长征人未还。\n但使龙城飞将在，\n不教胡马度阴山。',e:'秦朝时的明月和汉朝时的边关，出征万里的战士至今还没有回来。只要有李广那样的飞将军在，就不会让敌人的骑兵越过阴山。'},
{c:'war',t:'凉州词',a:'王翰',content:'葡萄美酒夜光杯，\n欲饮琵琶马上催。\n醉卧沙场君莫笑，\n古来征战几人回。',e:'甘醇的葡萄美酒盛在夜光杯中，正要举杯痛饮，马上传来了琵琶声。即使醉卧在沙场上你也不要笑话，自古以来出征的战士有几人能活着回来。'},
{c:'war',t:'从军行',a:'王昌龄',content:'青海长云暗雪山，\n孤城遥望玉门关。\n黄沙百战穿金甲，\n不破楼兰终不还。',e:'青海湖上乌云密布，遮暗了雪山。站在孤城上遥望玉门关。在黄沙中身经百战磨穿了铁甲，不打败敌人誓不回还。'}
];
var count=0;
function generate(){
var cat=document.getElementById('category').value;
var filtered=cat==='all'?poems:poems.filter(function(p){return p.c===cat});
var poem=filtered[Math.floor(Math.random()*filtered.length)];
count++;
var catNames={spring:'春',summer:'夏',autumn:'秋',winter:'冬',love:'爱情',home:'思乡',nature:'山水',war:'边塞'};
document.getElementById('result').innerHTML='<div class="poem-card" id="poemCard"><div class="poem-icon">🌸</div><div class="poem-title">'+poem.t+'</div><div class="poem-author">'+poem.a+'</div><div class="poem-content">'+poem.content+'</div><div class="poem-explain">'+poem.e+'</div><button class="reveal-btn" onclick="document.getElementById(\'poemCard\').classList.add(\'revealed\')">查看释义</button><div class="poem-tags"><span class="poem-tag">'+catNames[poem.c]+'</span><span class="poem-tag">'+poem.a+'</span></div><div class="counter">已生成 '+count+' 首诗词</div></div>';
}
})();
</script></body></html>
