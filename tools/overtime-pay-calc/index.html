<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌙 加班费计算器</title>
<meta name="description" content="加班费计算器，快速计算加班工资和时薪">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {--bg: #f5f5f5; --card: #fff; --text: #1a1a2e; --text-secondary: #666;
--border: #e0e0e0; --primary: #6366f1; --primary-hover: #4f46e5;
--accent-1: #f59e0b; --accent-2: #ef4444; --accent-3: #8b5cf6;
--shadow: 0 2px 12px rgba(0,0,0,0.08);
--result-bg: #f8fafc; --tag-bg: #f1f5f9}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
[data-theme="dark"] {--bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --text-secondary: #94a3b8;
--border: #334155; --primary: #818cf8; --primary-hover: #6366f1;
--shadow: 0 2px 12px rgba(0,0,0,0.3);
--result-bg: #1a1f36; --tag-bg: #2d3748}
body {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
background: var(--bg); color: var(--text); min-height: 100vh;
display: flex; justify-content: center; padding: 16px;
transition: background 0.3s, color 0.3s}
.container { width: 100%; max-width: 480px; }
header {display: flex; justify-content: space-between; align-items: center;
margin-bottom: 20px}
h1 { font-size: 1.5rem; font-weight: 700; }
.theme-toggle {background: var(--card); border: 1px solid var(--border); color: var(--text);
border-radius: 50%; width: 40px; height: 40px; cursor: pointer;
font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
transition: all 0.2s}
.theme-toggle:hover { border-color: var(--primary); }
.card {background: var(--card); border-radius: 16px; padding: 24px;
box-shadow: var(--shadow); margin-bottom: 16px;
transition: background 0.3s}
.card-title {font-size: 0.9rem; font-weight: 600; color: var(--text-secondary);
text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px}
.input-group { margin-bottom: 14px; }
.input-group:last-child { margin-bottom: 0; }
label {display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 4px; color: var(--text-secondary)}
.input-row {display: flex; align-items: center; gap: 8px}
input[type="number"] {flex: 1; padding: 10px 14px; border: 1.5px solid var(--border);
border-radius: 10px; font-size: 1rem; background: var(--bg);
color: var(--text); outline: none; transition: border-color 0.2s;
-moz-appearance: textfield; min-width: 0}
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
input[type="number"]:focus { border-color: var(--primary); }
.unit { font-size: 0.85rem; color: var(--text-secondary); white-space: nowrap; flex-shrink: 0; }
.salary-input { font-size: 1.1rem; font-weight: 600; }
.result-item {display: flex; justify-content: space-between; align-items: center;
padding: 12px 0; border-bottom: 1px solid var(--border)}
.result-item:last-child { border-bottom: none; }
.result-label { font-size: 0.9rem; color: var(--text-secondary); }
.result-value { font-size: 1.05rem; font-weight: 600; }
.result-total {display: flex; justify-content: space-between; align-items: center;
padding: 16px 0 0; margin-top: 8px; border-top: 2px solid var(--primary)}
.result-total .result-label { font-size: 1rem; font-weight: 700; color: var(--text); }
.result-total .result-value { font-size: 1.4rem; font-weight: 800; color: var(--primary); }
.ratio-badge {display: inline-block; margin-top: 8px; padding: 4px 12px;
border-radius: 20px; font-size: 0.8rem; font-weight: 600;
background: var(--tag-bg); color: var(--text-secondary)}
.fun-section { margin-top: 12px; }
.fun-title { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 10px; }
.fun-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.fun-item {background: var(--result-bg); border-radius: 12px; padding: 14px 10px;
text-align: center; transition: transform 0.2s}
.fun-item:hover { transform: translateY(-2px); }
.fun-emoji { font-size: 1.8rem; display: block; margin-bottom: 6px; }
.fun-name { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 4px; }
.fun-count { font-size: 1.15rem; font-weight: 700; color: var(--text); }
.rating-section { text-align: center; margin-top: 16px; }
.rating-emoji { font-size: 3rem; display: block; margin-bottom: 6px; }
.rating-text { font-size: 0.9rem; color: var(--text-secondary); }
.note {text-align: center; font-size: 0.75rem; color: var(--text-secondary);
margin-top: 16px; line-height: 1.5}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🌙 加班费计算器">
  <meta property="og:description" content="加班费计算器，快速计算加班工资和时薪">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/overtime-pay-calc/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="container">
  <header>
    <h1>🌙 加班费计算器</h1>
    <button class="theme-toggle" id="themeBtn" title="切换主题">🌓</button>
  </header>

  <div class="card">
    <div class="card-title">📋 填写信息</div>
    <div class="input-group">
      <label for="salary">月薪（税前）</label>
      <div class="input-row">
        <input type="number" id="salary" class="salary-input" placeholder="例如：15000" min="0" step="100">
        <span class="unit">元/月</span>
      </div>
    </div>
    <div class="input-group">
      <label for="weekdayOT">工作日加班</label>
      <div class="input-row">
        <input type="number" id="weekdayOT" placeholder="0" min="0" step="0.5">
        <span class="unit">小时</span>
      </div>
    </div>
    <div class="input-group">
      <label for="weekendOT">休息日加班</label>
      <div class="input-row">
        <input type="number" id="weekendOT" placeholder="0" min="0" step="0.5">
        <span class="unit">小时</span>
      </div>
    </div>
    <div class="input-group">
      <label for="holidayOT">法定节假日加班</label>
      <div class="input-row">
        <input type="number" id="holidayOT" placeholder="0" min="0" step="0.5">
        <span class="unit">小时</span>
      </div>
    </div>
  </div>

  <div class="card" id="resultCard">
    <div class="card-title">💰 加班费明细</div>
    <div class="result-item">
      <span class="result-label">工作日加班（1.5倍）</span>
      <span class="result-value" id="weekdayPay">--</span>
    </div>
    <div class="result-item">
      <span class="result-label">休息日加班（2倍）</span>
      <span class="result-value" id="weekendPay">--</span>
    </div>
    <div class="result-item">
      <span class="result-label">法定假日加班（3倍）</span>
      <span class="result-value" id="holidayPay">--</span>
    </div>
    <div class="result-total">
      <span class="result-label">加班费合计</span>
      <span class="result-value" id="totalPay">¥0.00</span>
    </div>
    <div style="text-align:center;">
      <span class="ratio-badge" id="ratioBadge">占工资 --</span>
    </div>

    <div class="fun-section">
      <div class="fun-title">🛒 这加班费能买...</div>
      <div class="fun-grid">
        <div class="fun-item">
          <span class="fun-emoji">🧋</span>
          <span class="fun-name">奶茶（¥15/杯）</span>
          <span class="fun-count" id="funTea">-- 杯</span>
        </div>
        <div class="fun-item">
          <span class="fun-emoji">🍲</span>
          <span class="fun-name">火锅（¥200/顿）</span>
          <span class="fun-count" id="funHotpot">-- 顿</span>
        </div>
        <div class="fun-item">
          <span class="fun-emoji">🎮</span>
          <span class="fun-name">游戏机（¥3500/台）</span>
          <span class="fun-count" id="funConsole">-- 台</span>
        </div>
      </div>
    </div>

    <div class="rating-section">
      <span class="rating-emoji" id="ratingEmoji">👍</span>
      <span class="rating-text" id="ratingText">没有加班，健康生活！</span>
    </div>
  </div>

  <p class="note">
    基于中国劳动法计算：工作日加班 1.5 倍工资，休息日加班 2 倍工资，法定节假日加班 3 倍工资。<br>
    小时工资 = 月薪 ÷ 21.75 ÷ 8
  </p>
</div>

<script>
(function() {
  const STORAGE_KEY = 'overtime_pay_calc_data';
  const salaryInput = document.getElementById('salary');
  const weekdayInput = document.getElementById('weekdayOT');
  const weekendInput = document.getElementById('weekendOT');
  const holidayInput = document.getElementById('holidayOT');
  const themeBtn = document.getElementById('themeBtn');
  const weekdayPayEl = document.getElementById('weekdayPay');
  const weekendPayEl = document.getElementById('weekendPay');
  const holidayPayEl = document.getElementById('holidayPay');
  const totalPayEl = document.getElementById('totalPay');
  const ratioBadge = document.getElementById('ratioBadge');
  const funTea = document.getElementById('funTea');
  const funHotpot = document.getElementById('funHotpot');
  const funConsole = document.getElementById('funConsole');
  const ratingEmoji = document.getElementById('ratingEmoji');
  const ratingText = document.getElementById('ratingText');
  const WORK_DAYS = 21.75;
  const WORK_HOURS = 8;
  const WEEKDAY_RATE = 1.5;
  const WEEKEND_RATE = 2;
  const HOLIDAY_RATE = 3;
  const TEA_PRICE = 15;
  const HOTPOT_PRICE = 200;
  const CONSOLE_PRICE = 3500;
  function initTheme() {
    const saved = localStorage.getItem('theme');
    if (saved === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = '☀️';
    }
  }
  themeBtn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    if (current === 'dark') {
      document.documentElement.removeAttribute('data-theme');
      themeBtn.textContent = '🌓';
      localStorage.setItem('theme', 'light');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = '☀️';
      localStorage.setItem('theme', 'dark');
    }
  });
  function fmt(n) { return '¥' + n.toFixed(2); }
  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        salaryInput.value = data.salary || '';
        weekdayInput.value = data.wd || '';
        weekendInput.value = data.we || '';
        holidayInput.value = data.ho || '';
      }
    } catch(e) {}
  }
  function saveData() {
    const data = {
      salary: salaryInput.value,
      wd: weekdayInput.value,
      we: weekendInput.value,
      ho: holidayInput.value
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }
  function calc() {
    const salary = parseFloat(salaryInput.value) || 0;
    const wd = parseFloat(weekdayInput.value) || 0;
    const we = parseFloat(weekendInput.value) || 0;
    const ho = parseFloat(holidayInput.value) || 0;
    if (salary <= 0) {
      weekdayPayEl.textContent = '--';
      weekendPayEl.textContent = '--';
      holidayPayEl.textContent = '--';
      totalPayEl.textContent = '¥0.00';
      ratioBadge.textContent = '占工资 --';
      funTea.textContent = '-- 杯';
      funHotpot.textContent = '-- 顿';
      funConsole.textContent = '-- 台';
      updateRating(0);
      return;
    }
    const hourly = salary / WORK_DAYS / WORK_HOURS;
    const weekdayPay = hourly * WEEKDAY_RATE * wd;
    const weekendPay = hourly * WEEKEND_RATE * we;
    const holidayPay = hourly * HOLIDAY_RATE * ho;
    const total = weekdayPay + weekendPay + holidayPay;
    weekdayPayEl.textContent = fmt(weekdayPay);
    weekendPayEl.textContent = fmt(weekendPay);
    holidayPayEl.textContent = fmt(holidayPay);
    totalPayEl.textContent = fmt(total);
    const ratio = (total / salary * 100).toFixed(1);
    ratioBadge.textContent = '占工资 ' + ratio + '%';
    funTea.textContent = Math.floor(total / TEA_PRICE) + ' 杯';
    funHotpot.textContent = Math.floor(total / HOTPOT_PRICE) + ' 顿';
    funConsole.textContent = (total / CONSOLE_PRICE).toFixed(2) + ' 台';
    updateRating(ratio);
  }
  function updateRating(ratio) {
    const totalHours = (parseFloat(weekdayInput.value)||0) +
                       (parseFloat(weekendInput.value)||0) +
                       (parseFloat(holidayInput.value)||0);
    if (totalHours === 0) {
      ratingEmoji.textContent = '👍';
      ratingText.textContent = '没有加班，健康生活！';
    } else if (totalHours <= 10) {
      ratingEmoji.textContent = '😐';
      ratingText.textContent = '偶尔加班，还能接受~';
    } else {
      ratingEmoji.textContent = '💀';
      ratingText.textContent = '加班狂！注意身体啊...';
    }
  }
  [salaryInput, weekdayInput, weekendInput, holidayInput].forEach(el => {
    el.addEventListener('input', () => {
      saveData();
      calc();
    });
  });
  initTheme();
  loadData();
  calc();
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
