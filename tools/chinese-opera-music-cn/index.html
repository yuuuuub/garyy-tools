<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国戏曲音乐大全 - Chinese Opera Music Encyclopedia</title>
<meta name="description" content="中国戏曲音乐大全，涵盖京剧唱腔、昆曲曲牌、锣鼓经与伴奏乐器的系统知识">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国戏曲音乐大全 - Chinese Opera Music Encyclopedia">
<meta property="og:description" content="中国戏曲音乐大全，涵盖京剧唱腔、昆曲曲牌、锣鼓经与伴奏乐器的系统知识">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/chinese-opera-music-cn/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎶</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#a78bfa;--accent2:#8b6dea}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#7c5cbf;--accent2:#6a4caf}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#0a0520 0%,#150a30 50%,#201040 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #3a1a6a;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#a78bfa,#c4a8fa,#8b6dea,#7c5cbf);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.stats-overview{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:14px 20px;border:1px solid var(--border);text-align:center;min-width:90px}
.stat-card .stat-num{font-size:1.6em;font-weight:bold;color:var(--accent)}
.stat-card .stat-label{font-size:0.75em;color:var(--text2)}
.music-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.music-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.music-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.music-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.music-card .mu-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.music-card .mu-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(167,139,250,0.15);color:var(--accent)}
.music-card .mu-name{font-size:1.3em;font-weight:bold}
.music-card .mu-sub{font-size:0.8em;color:var(--text2);margin-top:2px}
.music-card .mu-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.music-card .mu-meta span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.music-card .mu-detail{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.music-card .mu-detail strong{color:var(--text)}
.music-card .mu-notes{margin-top:10px;border-top:1px solid var(--border);padding-top:8px;font-size:0.8em;color:var(--accent)}
.music-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.music-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🎶 中国戏曲音乐大全</h1>
<p>Chinese Opera Music Encyclopedia — 探索戏曲唱腔、曲牌、锣鼓经与伴奏音乐的奥秘</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索唱腔、曲牌或剧种...（如"西皮""二黄""昆曲"）" title="Enter键搜索">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="唱腔">唱腔</button>
<button class="filter-btn" data-filter="曲牌">曲牌</button>
<button class="filter-btn" data-filter="锣鼓经">锣鼓经</button>
<button class="filter-btn" data-filter="伴奏乐器">伴奏乐器</button>
<button class="filter-btn" data-filter="音乐理论">音乐理论</button>
</div>
<div class="stats-overview" id="statsOverview"></div>
<div class="music-grid" id="musicGrid"></div>
</div>
<footer>中国戏曲音乐大全 — 丝竹管弦 · 声腔之美 · garyy.top</footer>
<script>
const musicData=[
{name:"西皮",category:"唱腔",icon:"🎵",subtitle:"欢快激昂",key:"63弦",tempo:"中快",description:"西皮是京剧主要唱腔之一，曲调明快流畅，适合表现欢快、激昂的情绪。西皮腔以63弦（定弦la-mi）为特征，节奏活泼跳跃。"},
{name:"二黄",category:"唱腔",icon:"🎶",subtitle:"深沉凝重",key:"52弦",tempo:"中慢",description:"二黄是京剧另一主要唱腔，曲调深沉凝重，适合表现忧思、悲愤的情感。二黄腔以52弦（定弦sol-re）为特征，旋律委婉低回。"},
{name:"反二黄",category:"唱腔",icon:"🎶",subtitle:"悲怆凄凉",key:"15弦",tempo:"慢",description:"反二黄是二黄的反调，将定弦提高四度，曲调更加悲怆凄凉，多用于表现极度悲伤或慷慨悲歌的场景。"},
{name:"西皮流水",category:"唱腔",icon:"💧",subtitle:"流畅轻快",key:"63弦",tempo:"快",description:"西皮流水是西皮腔的快板形式，一板一眼，节奏明快，字多腔少，适合叙事和抒发轻快情感。"},
{name:"二黄原板",category:"唱腔",icon:"🎼",subtitle:"中速稳重",key:"52弦",tempo:"中速",description:"二黄原板是二黄腔的基本板式，一板三眼，速度中等，旋律舒展，是京剧唱腔的基础。"},
{name:"昆曲曲牌·山坡羊",category:"曲牌",icon:"🏔️",subtitle:"婉转悠扬",key:"小工调",tempo:"中速",description:"山坡羊是昆曲常用曲牌，旋律婉转悠扬，多用于抒情场面。《牡丹亭·游园》中杜丽娘唱段即用此曲牌。"},
{name:"昆曲曲牌·皂罗袍",category:"曲牌",icon:"👔",subtitle:"典雅华美",key:"小工调",tempo:"中慢",description:"皂罗袍是昆曲经典曲牌，旋律典雅华美，适合表现大家闺秀的端庄气质。常用于闺门旦的唱段。"},
{name:"昆曲曲牌·点绛唇",category:"曲牌",icon:"💋",subtitle:"刚健有力",key:"正工调",tempo:"中快",description:"点绛唇是昆曲常用曲牌，旋律刚健有力，多用于武将或刚烈人物的出场。节奏鲜明，气势磅礴。"},
{name:"锣鼓经·急急风",category:"锣鼓经",icon:"🥁",subtitle:"紧张激烈",instruments:"板鼓·大锣·小锣·铙钹",description:"急急风是京剧锣鼓经中节奏最快的鼓点，用于表现紧张激烈的战斗场面或紧急情节。鼓点急促密集，气氛紧张。"},
{name:"锣鼓经·慢长锤",category:"锣鼓经",icon:"🥁",subtitle:"庄重威严",instruments:"板鼓·大锣·小锣",description:"慢长锤是京剧锣鼓经中节奏较慢的鼓点，用于帝王将相出场或庄重场面。鼓点沉稳有力，气势恢宏。"},
{name:"锣鼓经·四击头",category:"锣鼓经",icon:"🥁",subtitle:"亮相定格",instruments:"板鼓·大锣·小锣·铙钹",description:"四击头是京剧演员亮相时的锣鼓点，四声重击后定格，突出人物造型。是京剧表演中最具标志性的锣鼓点之一。"},
{name:"京胡",category:"伴奏乐器",icon:"🎻",subtitle:"京剧主奏",pitch:"C-D调",timbre:"高亢明亮",description:"京胡是京剧文场的主奏乐器，琴筒以竹制，蛇皮蒙面。音色高亢明亮，穿透力极强，是京剧音乐的灵魂。"},
{name:"月琴",category:"伴奏乐器",icon:"🌙",subtitle:"弹拨伴奏",pitch:"G调",timbre:"清脆圆润",description:"月琴是京剧文场的重要伴奏乐器，四根弦，品丝定位。音色清脆圆润，与京胡配合，丰富音乐层次。"},
{name:"板鼓",category:"伴奏乐器",icon:"🥁",subtitle:"指挥节奏",pitch:"高音",timbre:"清脆短促",description:"板鼓是京剧武场的指挥乐器，鼓师通过板鼓控制整个乐队的节奏和速度。板鼓声音清脆短促，是戏曲音乐的节拍器。"},
{name:"五声音阶",category:"音乐理论",icon:"🎹",subtitle:"宫商角徵羽",key:"C D E G A",description:"五声音阶是中国传统音乐的基础，由宫、商、角、徵、羽五个音组成，对应西方音乐的C、D、E、G、A。戏曲音乐以五声音阶为核心。"},
{name:"板眼",category:"音乐理论",icon:"📏",subtitle:"节拍体系",description:"板眼是中国戏曲音乐的节拍体系。"板"为强拍，"眼"为弱拍。一板一眼相当于2/4拍，一板三眼相当于4/4拍，有板无眼相当于1/4拍。"}
];
function getStats(data){const cats={};data.forEach(m=>{cats[m.category]=(cats[m.category]||0)+1});return cats}
function renderStats(data){const stats=getStats(data);document.getElementById('statsOverview').innerHTML=`<div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">音乐条目</div></div>`+Object.entries(stats).map(([k,v])=>`<div class="stat-card"><div class="stat-num">${v}</div><div class="stat-label">${k}</div></div>`).join('')}
function renderCards(data){document.getElementById('musicGrid').innerHTML=data.map(m=>`<div class="music-card" data-category="${m.category}"><div class="mu-header"><div class="mu-icon">${m.icon}</div><div><div class="mu-name">${m.name}</div><div class="mu-sub">${m.subtitle}</div></div></div><div class="mu-meta"><span>${m.category}</span>${m.key?`<span>调式：${m.key}</span>`:''}${m.tempo?`<span>节奏：${m.tempo}</span>`:''}${m.instruments?`<span>乐器：${m.instruments}</span>`:''}${m.pitch?`<span>音高：${m.pitch}</span>`:''}${m.timbre?`<span>音色：${m.timbre}</span>`:''}</div><div class="mu-detail">${m.description}</div></div>`).join('')}
function filterCards(){const q=document.getElementById('searchInput').value.toLowerCase();const f=document.querySelector('.filter-btn.active').dataset.filter;const filtered=musicData.filter(m=>{const matchF=f==='all'||m.category===f;const matchQ=!q||m.name.toLowerCase().includes(q)||m.description.toLowerCase().includes(q)||m.subtitle.toLowerCase().includes(q);return matchF&&matchQ});renderCards(filtered);renderStats(filtered)}
document.getElementById('searchInput').addEventListener('input',filterCards);
document.getElementById('filterRow').addEventListener('click',e=>{if(e.target.classList.contains('filter-btn')){document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');filterCards()}});
renderCards(musicData);renderStats(musicData);
</script>
</body>
</html>
