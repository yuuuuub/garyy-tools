<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>重阳节登高赏菊</title>
<meta property="og:title" content="重阳节登高赏菊">
<meta property="og:description" content="重阳节登高赏菊 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="重阳节登高赏菊 - 重阳习俗、菊花文化、敬老传统、经典诗词">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌼</text></svg>">
<meta name="robots" content="index,follow">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#eab308;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:900px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.95rem;transition:all .2s}
.btn-primary{background:var(--blue);color:#fff}
.btn-secondary{background:var(--border);color:var(--text)}
.hidden{display:none}
.chrysanthemum{display:inline-block;position:relative;width:60px;height:60px;margin:10px}
.petal{position:absolute;width:12px;height:24px;background:#fbbf24;border-radius:50%;top:50%;left:50%;transform-origin:50% 0%}
.petal:nth-child(1){transform:translate(-50%,0) rotate(0deg);background:#fbbf24}
.petal:nth-child(2){transform:translate(-50%,0) rotate(36deg);background:#f59e0b}
.petal:nth-child(3){transform:translate(-50%,0) rotate(72deg);background:#fbbf24}
.petal:nth-child(4){transform:translate(-50%,0) rotate(108deg);background:#f59e0b}
.petal:nth-child(5){transform:translate(-50%,0) rotate(144deg);background:#fbbf24}
.petal:nth-child(6){transform:translate(-50%,0) rotate(180deg);background:#f59e0b}
.petal:nth-child(7){transform:translate(-50%,0) rotate(216deg);background:#fbbf24}
.petal:nth-child(8){transform:translate(-50%,0) rotate(252deg);background:#f59e0b}
.petal:nth-child(9){transform:translate(-50%,0) rotate(288deg);background:#fbbf24}
.petal:nth-child(10){transform:translate(-50%,0) rotate(324deg);background:#f59e0b}
.petal-center{position:absolute;width:20px;height:20px;background:#92400e;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%)}
.flower-wrap{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:10px 0}
.countdown-box{display:flex;gap:16px;justify-content:center;margin:16px 0}
.countdown-item{text-align:center}
.countdown-num{font-size:2rem;font-weight:700;color:var(--yellow);line-height:1}
.countdown-label{font-size:.75rem;color:var(--text2);margin-top:4px}
.custom-list{display:flex;flex-direction:column;gap:10px}
.custom-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;cursor:pointer;transition:all var(--transition)}
.custom-item:hover{border-color:var(--yellow)}
.custom-header{display:flex;align-items:center;gap:10px}
.custom-icon{font-size:1.5rem}
.custom-name{font-weight:600}
.custom-desc{color:var(--text2);font-size:.85rem;margin-top:4px}
.custom-detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);color:var(--text2);font-size:.85rem;line-height:1.6;display:none}
.custom-detail.show{display:block}
.poem-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:10px}
.poem-title{font-weight:700;margin-bottom:4px}
.poem-author{color:var(--blue);font-size:.85rem;margin-bottom:8px}
.poem-text{color:var(--text2);font-size:.9rem;line-height:1.8;white-space:pre-line}
.health-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:10px}
.health-title{font-weight:600;margin-bottom:6px}
.health-desc{color:var(--text2);font-size:.85rem;line-height:1.6}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div style="position:fixed;top:8px;right:8px;z-index:9999"><button class="btn btn-secondary" onclick="toggleTheme()" style="font-size:.8rem;padding:4px 10px" id="themeBtn">🌙 暗色</button></div>
<div class="container">
<h1>🌼 重阳节登高赏菊</h1>
<p class="sub">登高望远 · 菊花文化 · 敬老传统 · 经典诗词</p>

<div class="card">
<div class="flower-wrap">
<div class="chrysanthemum"><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal-center"></div></div>
<div class="chrysanthemum"><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal-center"></div></div>
<div class="chrysanthemum"><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal-center"></div></div>
</div>
<div class="countdown-box" id="countdown"></div>
<h2 style="text-align:center;font-size:1rem">距离重阳节</h2>
</div>

<div class="tabs">
<button class="btn btn-primary" onclick="showTab('customs')" id="tabCustoms">🎊 习俗</button>
<button class="btn btn-secondary" onclick="showTab('poems')" id="tabPoems">📜 诗词</button>
<button class="btn btn-secondary" onclick="showTab('health')" id="tabHealth">💚 敬老养生</button>
</div>

<div id="customsView"><div class="custom-list" id="customList"></div></div>
<div id="poemsView" class="hidden"></div>
<div id="healthView" class="hidden"></div>
</div>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script src="../i18n.js" defer></script>
<script>
var customs=[
{name:'登高望远',icon:'⛰️',desc:'重阳节登高望远，锻炼身体祈福',detail:'重阳登高的习俗与东汉桓景避灾的传说有关。九月九日，桓景听从仙人费长房的指点，携家人登高避灾，佩戴茱萸，饮菊花酒，果然平安。后来重阳登高成为全民习俗。'},
{name:'插茱萸',icon:'🌿',desc:'重阳节佩戴茱萸，辟邪祈福',detail:'茱萸是一种有浓烈香气的植物，古人认为可以辟邪消灾。重阳节时人们将茱萸插在头上或佩戴在身上。王维名句"遍插茱萸少一人"就描写了这一习俗。'},
{name:'赏菊花',icon:'🌼',desc:'重阳赏菊饮菊花酒，菊花象征长寿',detail:'九月又称"菊月"，重阳赏菊历史悠久。菊花不畏秋寒，象征坚强和长寿。人们还会饮菊花酒，据说可以延年益寿。菊花还可以做成菊花茶、菊花糕等。'},
{name:'吃重阳糕',icon:'🍰',desc:'食用重阳糕，"糕"与"高"谐音',detail:'重阳糕又称花糕、菊花糕。用米粉加糖蒸制，上面插彩旗、放栗子等。"糕"与"高"谐音，吃重阳糕寓意步步登高。有些地方会在糕上放一面小旗，象征茱萸。'},
{name:'饮菊花酒',icon:'🍶',desc:'饮用菊花酒，被认为可以延年益寿',detail:'菊花酒是用菊花和粮食酿造的酒。古人认为重阳节饮菊花酒可以消灾避祸、延年益寿。菊花酒清凉甘甜，有清热解毒的功效。'},
{name:'敬老爱老',icon:'🧓',desc:'重阳节也是敬老节，弘扬尊老美德',detail:'1989年，中国政府将重阳节定为"老人节"。重阳节敬老已经成为新风尚。人们会在这一天探望老人，陪伴他们登高、赏菊、吃重阳糕，表达对长辈的敬意和祝福。'}
];
var poems=[
{title:'九月九日忆山东兄弟',author:'王维（唐）',text:'独在异乡为异客，每逢佳节倍思亲。\n遥知兄弟登高处，遍插茱萸少一人。'},
{title:'过故人庄',author:'孟浩然（唐）',text:'故人具鸡黍，邀我至田家。\n绿树村边合，青山郭外斜。\n开轩面场圃，把酒话桑麻。\n待到重阳日，还来就菊花。'},
{title:'醉花阴·薄雾浓云愁永昼',author:'李清照（宋）',text:'薄雾浓云愁永昼，瑞脑消金兽。\n佳节又重阳，玉枕纱厨，半夜凉初透。\n\n东篱把酒黄昏后，有暗香盈袖。\n莫道不销魂，帘卷西风，人比黄花瘦。'},
{title:'采桑子·重阳',author:'毛泽东',text:'人生易老天难老，岁岁重阳。\n今又重阳，战地黄花分外香。\n\n一年一度秋风劲，不似春光。\n胜似春光，寥廓江天万里霜。'},
{title:'重阳席上赋白菊',author:'白居易（唐）',text:'满园花菊郁金黄，中有孤丛色似霜。\n还似今朝歌酒席，白头翁入少年场。'}
];
var healthTips=[
{title:'秋季养生饮食',icon:'🥗',desc:'多吃润肺食物：梨、百合、银耳、蜂蜜。少吃辛辣刺激食物，多喝温水。秋季干燥，适当增加滋阴润燥的食材。'},
{title:'适当运动',icon:'🏃',desc:'登高、散步、太极拳都是秋季适合的运动。老年人运动要量力而行，注意膝盖保护。清晨和傍晚是最佳运动时间。'},
{title:'充足睡眠',icon:'😴',desc:'秋季宜早睡早起，保证7-8小时睡眠。晚上可用温水泡脚，促进血液循环，有助于改善睡眠质量。'},
{title:'情志调养',icon:'😊',desc:'秋季容易产生悲秋情绪，要保持乐观心态。多与家人朋友交流，参加社交活动，保持心情愉悦。'},
{title:'防寒保暖',icon:'🧣',desc:'重阳时节天气转凉，要注意添加衣物。老年人抵抗力较弱，更要注意保暖防寒，预防感冒。'},
{title:'定期体检',icon:'🏥',desc:'建议老年人每年进行一次全面体检，关注血压、血糖、血脂等指标。有慢性病的要按时服药，定期复查。'}
];

function updateCountdown(){
  var now=new Date();var year=now.getFullYear();
  var chongyang=new Date(year,9,9);
  if(now>chongyang)chongyang=new Date(year+1,9,9);
  var diff=chongyang-now;var d=Math.floor(diff/864e5);
  document.getElementById('countdown').innerHTML='<div class="countdown-item"><div class="countdown-num">'+d+'</div><div class="countdown-label">天</div></div>';
}

function showTab(tab){
  ['customsView','poemsView','healthView'].forEach(function(v){document.getElementById(v).classList.add('hidden')});
  document.getElementById(tab+'View').classList.remove('hidden');
  ['tabCustoms','tabPoems','tabHealth'].forEach(function(id){document.getElementById(id).className='btn btn-secondary'});
  document.getElementById('tab'+tab.charAt(0).toUpperCase()+tab.slice(1)).className='btn btn-primary';
  if(tab==='poems')renderPoems();
  if(tab==='health')renderHealth();
}

function renderCustoms(){
  var h='';
  customs.forEach(function(c,i){
    h+='<div class="custom-item" onclick="toggleDetail('+i+')">';
    h+='<div class="custom-header"><span class="custom-icon">'+c.icon+'</span><div><div class="custom-name">'+c.name+'</div><div class="custom-desc">'+c.desc+'</div></div></div>';
    h+='<div class="custom-detail" id="cd-'+i+'">'+c.detail+'</div></div>';
  });
  document.getElementById('customList').innerHTML=h;
}

function toggleDetail(idx){var el=document.getElementById('cd-'+idx);if(el)el.classList.toggle('show')}

function renderPoems(){
  var h='';poems.forEach(function(p){
    h+='<div class="card poem-card"><div class="poem-title">'+p.title+'</div><div class="poem-author">'+p.author+'</div><div class="poem-text">'+p.text+'</div></div>';
  });document.getElementById('poemsView').innerHTML=h;
}

function renderHealth(){
  var h='';healthTips.forEach(function(t){
    h+='<div class="card health-card"><div class="health-title">'+t.icon+' '+t.title+'</div><div class="health-desc">'+t.desc+'</div></div>';
  });document.getElementById('healthView').innerHTML=h;
}

function toggleTheme(){
  var html=document.documentElement;var isLight=html.getAttribute('data-theme')==='light';
  html.setAttribute('data-theme',isLight?'dark':'light');
  document.getElementById('themeBtn').textContent=isLight?'☀️ 亮色':'🌙 暗色';
}

renderCustoms();updateCountdown();setInterval(updateCountdown,36e5);
window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});
</script>
</body>
</html>
