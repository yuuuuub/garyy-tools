function generate(){
var occ=document.getElementById('occasion').value;
var rec=document.getElementById('recipient').value;
var list=gifts[occ]&&gifts[occ][rec]?gifts[occ][rec]:(gifts[occ]&&gifts[occ].default?gifts[occ].default:null);
if(!list||!list.length){list=gifts[occ]&&gifts[occ].default?gifts[occ].default:[gifts.birthday.parents[0],gifts.birthday.couple[0],gifts.birthday.friend[0]];}
var html='<div class="card"><h3 style="margin-bottom:12px">推荐礼品 — '+occasionNames[occ]+' · '+recipientNames[rec]+'</h3><div class="gift-grid">';
list.forEach(function(g){
html+='<div class="gift-item" onclick="selectGift(this,\''+g.name+'\',\''+g.desc+'\',\''+g.price+'\')">';
html+='<div class="emoji">'+g.emoji+'</div><h3>'+g.name+'</h3>';
html+='<div class="price">¥'+g.price+'</div>';
html+='<div class="desc">'+g.desc+'</div>';
html+='<div style="margin-top:6px">'+g.tags.map(function(t){return '<span class="tag">'+t+'</span>'}).join('')+'</div></div>';
});
html+='</div></div><div class="card"><h3>选择提示</h3><p style="color:var(--text2);margin-top:8px">点击礼品可查看详情，生成送礼建议。</p></div>';
document.getElementById('result').innerHTML=html;
}
function selectGift(el,name,desc,price){
var items=document.querySelectorAll('.gift-item');
items.forEach(function(i){i.classList.remove('selected')});
el.classList.add('selected');
var html='<div class="card"><h3>'+name+'</h3><p style="color:var(--green);margin:8px 0">参考价格：¥'+price+'</p><p>'+desc+'</p><div class="result-box"><strong>送礼建议：</strong>\n• 提前准备，注意包装精美\n• 可附上一张手写贺卡增添心意\n• 根据对方喜好选择合适的款式\n• 节日期间提前送出更显诚意</div></div>';
document.getElementById('result').innerHTML+=html;
}
function randomGen(){
document.getElementById('occasion').selectedIndex=Math.floor(Math.random()*10);
document.getElementById('recipient').selectedIndex=Math.floor(Math.random()*9);
document.getElementById('budget').selectedIndex=Math.floor(Math.random()*5);
document.getElementById('preference').selectedIndex=Math.floor(Math.random()*6);
generate();
}
