<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 节假日倒计时</title>
<meta name="description" content="节假日倒计时工具，查看距离各节日还有几天">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {--bg: #0f0f1a;
--card-bg: rgba(255, 255, 255, 0.04);
--text: #e0e0e0;
--accent: #ff4757;
--gold: #f9ca24;
--muted: #6b7280}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
padding: 20px 16px 40px;
background-image:
radial-gradient(ellipse at 20% 10%, rgba(255, 71, 87, 0.08) 0%, transparent 50%),
radial-gradient(ellipse at 80% 90%, rgba(249, 202, 36, 0.06) 0%, transparent 50%)}
.container { max-width: 640px; margin: 0 auto; }
h1 {text-align: center;
font-size: clamp(1.5rem, 5vw, 2rem);
margin-bottom: 4px;
letter-spacing: 2px}
.subtitle {text-align: center;
color: var(--muted);
font-size: 0.85rem;
margin-bottom: 24px}
.hero-card {background: linear-gradient(135deg, rgba(255, 71, 87, 0.15), rgba(249, 202, 36, 0.1));
border: 1px solid rgba(255, 71, 87, 0.2);
border-radius: 20px;
padding: 28px 24px;
text-align: center;
margin-bottom: 12px;
position: relative;
overflow: hidden}
.hero-card::before {content: '';
position: absolute;
inset: 0;
background: radial-gradient(circle at 50% -20%, rgba(249, 202, 36, 0.12), transparent 70%);
pointer-events: none}
.hero-badge {display: inline-block;
background: rgba(255, 71, 87, 0.2);
color: var(--accent);
font-size: 0.75rem;
padding: 4px 12px;
border-radius: 20px;
margin-bottom: 12px;
position: relative}
.hero-emoji { font-size: 3.5rem; display: block; margin-bottom: 8px; position: relative; }
.hero-name { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; position: relative; }
.hero-date { color: var(--gold); font-size: 0.95rem; margin-bottom: 6px; position: relative; }
.hero-days {font-size: 3rem;
font-weight: 900;
color: var(--text);
position: relative}
.hero-days small { font-size: 1rem; font-weight: 400; color: var(--muted); }
.hero-desc { color: var(--muted); font-size: 0.85rem; margin-top: 4px; position: relative; }
.hero-past {font-size: 2rem;
font-weight: 900;
color: var(--muted);
position: relative}
.encourage {text-align: center;
margin: 20px 0 24px;
font-size: 0.9rem;
color: var(--muted);
font-style: italic}
.encourage span {color: var(--accent);
font-weight: 700;
font-style: normal}
.holiday-grid {display: flex;
flex-direction: column;
gap: 10px}
.holiday-card {display: flex;
align-items: center;
background: var(--card-bg);
border: 1px solid rgba(255, 255, 255, 0.06);
border-radius: 14px;
padding: 14px 16px;
gap: 14px;
transition: border-color 0.2s, background 0.2s;
backdrop-filter: blur(8px)}
.holiday-card:hover {border-color: rgba(255, 255, 255, 0.12);
background: rgba(255, 255, 255, 0.06)}
.holiday-card.past {opacity: 0.45}
.holiday-emoji { font-size: 2rem; flex-shrink: 0; width: 44px; text-align: center; }
.holiday-info { flex: 1; min-width: 0; }
.holiday-name { font-size: 1rem; font-weight: 600; }
.holiday-date { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
.holiday-countdown { text-align: right; flex-shrink: 0; }
.holiday-days { font-size: 1.3rem; font-weight: 700; color: var(--gold); }
.holiday-countdown .past-label { font-size: 0.9rem; color: var(--muted); font-weight: 600; }
footer {text-align: center;
color: var(--muted);
font-size: 0.7rem;
margin-top: 40px;
padding-top: 20px;
border-top: 1px solid rgba(255, 255, 255, 0.06)}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🎉 节假日倒计时">
  <meta property="og:description" content="节假日倒计时工具，查看距离各节日还有几天">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/holiday-countdown/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="container">
  <h1>🎉 节假日倒计时</h1>
  <p class="subtitle">法定节假日 &amp; 热门节日</p>

  <div id="hero"></div>
  <div id="encourage" class="encourage"></div>

  <div id="holidayGrid" class="holiday-grid"></div>

  <footer>数据仅供参考 · 春节/端午/中秋/七夕为农历日期</footer>
</div>

<script>
const FIXED_HOLIDAYS = [
  { name: '元旦', emoji: '🎆', month: 1, day: 1, desc: '新的一年，新的开始！' },
  { name: '情人节', emoji: '💕', month: 2, day: 14, desc: '浪漫的节日' },
  { name: '劳动节', emoji: '🛠️', month: 5, day: 1, desc: '致敬每一位劳动者' },
  { name: '国庆节', emoji: '🇨🇳', month: 10, day: 1, desc: '祖国生日快乐' },
  { name: '圣诞节', emoji: '🎄', month: 12, day: 25, desc: 'Merry Christmas!' },
];
const LUNAR_HOLIDAY_TABLE = {
  spring_festival: {
    name: '春节', emoji: '🧧', desc: '阖家团圆，辞旧迎新',
    dates: {
      2025: [1, 29], 2026: [2, 17], 2027: [2, 6],
      2028: [1, 26], 2029: [2, 13], 2030: [2, 3],
    }
  },
  qixi: {
    name: '七夕', emoji: '🌟', desc: '牛郎织女鹊桥相会',
    dates: {
      2025: [8, 29], 2026: [8, 19], 2027: [8, 8],
      2028: [8, 26], 2029: [8, 16], 2030: [8, 5],
    }
  },
};
const qingmingDates = {
  2025: [4, 4], 2026: [4, 5], 2027: [4, 5],
  2028: [4, 4], 2029: [4, 4], 2030: [4, 5],
};
const duanwuDates = {
  2025: [5, 31], 2026: [6, 19], 2027: [6, 9],
  2028: [5, 28], 2029: [6, 16], 2030: [6, 5],
};
const zhongqiuDates = {
  2025: [10, 6], 2026: [9, 25], 2027: [9, 15],
  2028: [10, 3], 2029: [9, 22], 2030: [9, 12],
};
function getHolidayDate(holiday, year) {
  if (holiday.month !== undefined) {
    return new Date(year, holiday.month - 1, holiday.day);
  }
  if (holiday.type === 'qingming') {
    const d = qingmingDates[year];
    if (!d) return null;
    return new Date(year, d[0] - 1, d[1]);
  }
  if (holiday.type === 'duanwu') {
    const d = duanwuDates[year];
    if (!d) return null;
    return new Date(year, d[0] - 1, d[1]);
  }
  if (holiday.type === 'zhongqiu') {
    const d = zhongqiuDates[year];
    if (!d) return null;
    return new Date(year, d[0] - 1, d[1]);
  }
  if (holiday.type === 'spring_festival') {
    const d = LUNAR_HOLIDAY_TABLE.spring_festival.dates[year];
    if (!d) return null;
    return new Date(year, d[0] - 1, d[1]);
  }
  if (holiday.type === 'qixi') {
    const d = LUNAR_HOLIDAY_TABLE.qixi.dates[year];
    if (!d) return null;
    return new Date(year, d[0] - 1, d[1]);
  }
  return null;
}
function formatDate(date) {
  const y = date.getFullYear();
  const m = date.getMonth() + 1;
  const d = date.getDate();
  return `${y}年${m}月${d}日`;
}
function getDaysUntil(targetDate, now) {
  const diff = targetDate.getTime() - now.getTime();
  return Math.ceil(diff / (1000 * 60 * 60 * 24));
}
function buildAllHolidays() {
  const holidays = [];
  FIXED_HOLIDAYS.forEach(h => {
    holidays.push({ ...h, type: 'fixed' });
  });
  holidays.push({ name: '清明节', emoji: '🌿', type: 'qingming', desc: '踏青祭祖，缅怀先人' });
  holidays.push({ name: '端午节', emoji: '🐉', type: 'duanwu', desc: '赛龙舟，吃粽子' });
  holidays.push({ name: '中秋节', emoji: '🥮', type: 'zhongqiu', desc: '月圆人团圆' });
  holidays.push({
    name: LUNAR_HOLIDAY_TABLE.spring_festival.name,
    emoji: LUNAR_HOLIDAY_TABLE.spring_festival.emoji,
    type: 'spring_festival',
    desc: LUNAR_HOLIDAY_TABLE.spring_festival.desc,
  });
  holidays.push({
    name: LUNAR_HOLIDAY_TABLE.qixi.name,
    emoji: LUNAR_HOLIDAY_TABLE.qixi.emoji,
    type: 'qixi',
    desc: LUNAR_HOLIDAY_TABLE.qixi.desc,
  });
  return holidays;
}
function render() {
  const now = new Date();
  const currentYear = now.getFullYear();
  const holidays = buildAllHolidays();
  const items = holidays.map(h => {
    let date = getHolidayDate(h, currentYear);
    let year = currentYear;
    if (!date) {
      date = getHolidayDate(h, currentYear + 1);
      year = currentYear + 1;
      if (!date) return null;
    }
    const daysUntil = getDaysUntil(date, now);
    if (daysUntil < 0) {
      const nextYearDate = getHolidayDate(h, currentYear + 1);
      if (!nextYearDate) return null;
      date = nextYearDate;
      year = currentYear + 1;
    }
    const daysUntilFinal = getDaysUntil(date, now);
    const isPastToday = daysUntilFinal <= 0 && getDaysUntil(date, now) < 0;
    return {
      ...h,
      date,
      year,
      daysUntil: daysUntilFinal > 0 ? daysUntilFinal : (daysUntilFinal < 0 ? daysUntilFinal : 0),
      isPast: daysUntilFinal < 0,
      isToday: daysUntilFinal === 0,
    };
  }).filter(Boolean);
  items.sort((a, b) => a.daysUntil - b.daysUntil);
  const nextHoliday = items.find(h => !h.isPast);
  const hero = document.getElementById('hero');
  if (nextHoliday) {
    hero.innerHTML = `
      <div class="hero-card">
        <div class="hero-badge">下一个假期</div>
        <span class="hero-emoji">${nextHoliday.emoji}</span>
        <div class="hero-name">${nextHoliday.name}</div>
        <div class="hero-date">${formatDate(nextHoliday.date)}</div>
        <div class="hero-days">
          ${nextHoliday.isToday ? '就是今天！🎉' : nextHoliday.daysUntil}
          ${nextHoliday.isToday ? '' : '<small> 天</small>'}
        </div>
        <div class="hero-desc">${nextHoliday.desc}</div>
      </div>
    `;
  } else {
    hero.innerHTML = `
      <div class="hero-card">
        <span class="hero-emoji">🎊</span>
        <div class="hero-name">所有节日数据已过期</div>
        <div class="hero-desc">请更新日期表</div>
      </div>
    `;
  }
  const encourage = document.getElementById('encourage');
  if (nextHoliday && !nextHoliday.isToday) {
    encourage.innerHTML = `你离下一个假期还有 <span>${nextHoliday.daysUntil}</span> 天，撑住！`;
  } else if (nextHoliday && nextHoliday.isToday) {
    encourage.innerHTML = `<span>🎉 今天就是假期，尽情享受吧！</span>`;
  } else {
    encourage.innerHTML = '';
  }
  const grid = document.getElementById('holidayGrid');
  const listItems = items.filter(h => h.name !== (nextHoliday ? nextHoliday.name : ''));
  grid.innerHTML = listItems.map(h => {
    const isPast = h.isPast;
    return `
      <div class="holiday-card${isPast ? ' past' : ''}">
        <span class="holiday-emoji">${h.emoji}</span>
        <div class="holiday-info">
          <div class="holiday-name">${h.name}</div>
          <div class="holiday-date">${formatDate(h.date)}</div>
        </div>
        <div class="holiday-countdown">
          ${isPast
            ? '<span class="past-label">已过</span>'
            : h.isToday
              ? '<span class="holiday-days" style="color:var(--accent);font-size:0.9rem;">今天</span>'
              : `<span class="holiday-days">${h.daysUntil}<small style="font-size:0.7rem;font-weight:400;color:var(--muted);">天</small></span>`
          }
        </div>
      </div>
    `;
  }).join('');
}
render();
const now = new Date();
const msUntilMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1).getTime() - now.getTime();
setTimeout(() => {
  render();
  setInterval(render, 24 * 60 * 60 * 1000);
}, msUntilMidnight + 1000);
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
