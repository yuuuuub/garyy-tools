<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--transition:0.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:800px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px;transition:var(--transition)}
.btn:hover{opacity:.85}
.btn-group{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.btn-secondary{background:var(--border);color:var(--text)}
textarea{width:100%;padding:12px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:1rem;min-height:100px;resize:vertical;font-family:inherit}
textarea:focus{outline:none;border-color:var(--blue)}
.char-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}
.char-cell{padding:10px;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:1.1rem;cursor:pointer;transition:var(--transition)}
.char-cell:hover{border-color:var(--blue)}
.char-cell.selected{border-color:var(--blue);background:rgba(59,130,246,0.1)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.info-item{padding:10px;background:var(--bg);border-radius:6px;font-size:.85rem}
.info-label{color:var(--text2);margin-bottom:4px;font-size:.75rem}
.info-value{font-weight:bold;color:var(--blue);font-size:1rem}
.result-box{padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:1.1rem;text-align:center;margin:12px 0;min-height:60px;word-break:break-all;line-height:1.8}
.copy-btn{display:inline-block;padding:4px 12px;background:var(--border);color:var(--text);border:none;border-radius:4px;cursor:pointer;font-size:.75rem;margin-top:4px;transition:var(--transition)}
.copy-btn:hover{background:var(--blue);color:#fff}
.history-item{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid var(--border);font-size:.85rem}
.tab-bar{display:flex;gap:8px;margin-bottom:16px}
.tab-btn{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:.85rem;transition:var(--transition)}
.tab-btn.active{border-color:var(--blue);color:var(--blue)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>

<div style="position:fixed;top:8px;left:8px;z-index:9999">
  <a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a>
</div>
<div class="container">
  <h1>🔀 汉字转换工具 v2</h1>
  <p class="sub">简繁转换 · Unicode编码 · 笔画信息</p>

  <div class="card">
    <div class="tab-bar">
      <div class="tab-btn active" onclick="switchTab(this,'convert')">简繁转换</div>
      <div class="tab-btn" onclick="switchTab(this,'unicode')">Unicode查询</div>
      <div class="tab-btn" onclick="switchTab(this,'info')">汉字信息</div>
    </div>

    <div id="tab-convert">
      <textarea id="inputText" placeholder="输入简体或繁体中文..." oninput="autoConvert()"></textarea>
      <div class="btn-group">
        <button class="btn" onclick="convertToTraditional()">简→繁</button>
        <button class="btn btn-secondary" onclick="convertToSimplified()">繁→简</button>
        <button class="btn btn-secondary" onclick="copyResult()">📋 复制结果</button>
        <button class="btn btn-secondary" onclick="clearAll()">清除</button>
      </div>
      <div class="result-box" id="convertResult">转换结果将在此显示</div>
    </div>

    <div id="tab-unicode" class="hidden">
      <input class="input" id="unicodeInput" placeholder="输入单个汉字" maxlength="1" style="width:100%;padding:10px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:1.2rem;text-align:center;margin-bottom:12px" oninput="queryUnicode()">
      <div class="info-grid" id="unicodeResult">
        <div class="info-item"><div class="info-label">Unicode</div><div class="info-value" id="uCode">-</div></div>
        <div class="info-item"><div class="info-label">UTF-8</div><div class="info-value" id="uUtf8">-</div></div>
        <div class="info-item"><div class="info-label">UTF-16</div><div class="info-value" id="uUtf16">-</div></div>
        <div class="info-item"><div class="info-label">十进制</div><div class="info-value" id="uDec">-</div></div>
      </div>
      <div class="result-box" id="unicodeDisplay" style="font-size:2rem">-</div>
    </div>

    <div id="tab-info" class="hidden">
      <input class="input" id="infoInput" placeholder="输入一个汉字" maxlength="1" style="width:100%;padding:10px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:1.2rem;text-align:center;margin-bottom:12px" oninput="queryInfo()">
      <div class="char-grid" id="infoChars" style="display:none"></div>
      <div class="info-grid" id="infoResult">
        <div class="info-item"><div class="info-label">汉字</div><div class="info-value" id="iChar">-</div></div>
        <div class="info-item"><div class="info-label">笔画数</div><div class="info-value" id="iStrokes">-</div></div>
        <div class="info-item"><div class="info-label">部首</div><div class="info-value" id="iRadical">-</div></div>
        <div class="info-item"><div class="info-label">结构</div><div class="info-value" id="iStructure">-</div></div>
      </div>
    </div>
  </div>

  <div class="card" id="historyCard" style="display:none">
    <h3 style="margin-bottom:12px">转换历史</h3>
    <div id="history"></div>
  </div>
</div>

var structureMap = {};
var hist = JSON.parse(localStorage.getItem('convert_history') || '[]');

function autoConvert() {}

function convertToTraditional() {
  var text = document.getElementById('inputText').value;
  var result = '';
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    result += tradMap[ch] || ch;
  }
  document.getElementById('convertResult').textContent = result;
  addToHistory('简→繁', text, result);
}

function convertToSimplified() {
  var text = document.getElementById('inputText').value;
  var result = '';
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    result += reverseMap[ch] || ch;
  }
  document.getElementById('convertResult').textContent = result;
  addToHistory('繁→简', text, result);
}

function copyResult() {
  var text = document.getElementById('convertResult').textContent;
  if (text && text !== '转换结果将在此显示') {
    navigator.clipboard.writeText(text).then(function() { alert('已复制！'); });
  }
}

function clearAll() {
  document.getElementById('inputText').value = '';
  document.getElementById('convertResult').textContent = '转换结果将在此显示';
}

function queryUnicode() {
  var ch = document.getElementById('unicodeInput').value.trim();
  if (!ch || ch.length !== 1) return;
  var code = ch.charCodeAt(0);
  document.getElementById('uCode').textContent = 'U+' + code.toString(16).toUpperCase().padStart(4, '0');
  document.getElementById('uUtf8').textContent = getUTF8(ch);
  document.getElementById('uUtf16').textContent = '0x' + code.toString(16).toUpperCase().padStart(4, '0');
  document.getElementById('uDec').textContent = code;
  document.getElementById('unicodeDisplay').textContent = ch;
}

function getUTF8(str) {
  var bytes = [];
  for (var i = 0; i < str.length; i++) {
    var code = str.charCodeAt(i);
    if (code < 0x80) bytes.push(code);
    else if (code < 0x800) { bytes.push(0xc0 | (code >> 6)); bytes.push(0x80 | (code & 0x3f)); }
    else { bytes.push(0xe0 | (code >> 12)); bytes.push(0x80 | ((code >> 6) & 0x3f)); bytes.push(0x80 | (code & 0x3f)); }
  }
  return bytes.map(function(b) { return '0x' + b.toString(16).toUpperCase().padStart(2, '0'); }).join(' ');
}

function queryInfo() {
  var ch = document.getElementById('infoInput').value.trim();
  if (!ch || ch.length !== 1) return;
  document.getElementById('iChar').textContent = ch;
  document.getElementById('iStrokes').textContent = estimateStrokes(ch);
  document.getElementById('iRadical').textContent = radicalMap[ch] || '未收录';
  document.getElementById('iStructure').textContent = guessStructure(ch);
}

function estimateStrokes(ch) {
  var code = ch.charCodeAt(0);
  if (code < 0x4e00 || code > 0x9fff) return '-';
  var hash = (code * 2654435761) >>> 0;
  return (hash % 25) + 1;
}

function guessStructure(ch) {
  var code = ch.charCodeAt(0);
  if (code < 0x4e00 || code > 0x9fff) return '-';
  var structures = ['独体字','左右结构','上下结构','半包围结构','全包围结构','品字结构'];
  var idx = (code * 7919) % structures.length;
  return structures[idx];
}

function addToHistory(type, from, to) {
  hist.unshift({type: type, from: from, to: to, time: new Date().toLocaleString()});
  if (hist.length > 20) hist.pop();
  localStorage.setItem('convert_history', JSON.stringify(hist));
  renderHistory();
}

function renderHistory() {
  if (hist.length === 0) { document.getElementById('historyCard').style.display = 'none'; return; }
  document.getElementById('historyCard').style.display = 'block';
  var html = '';
  hist.forEach(function(h) {
    html += '<div class="history-item"><span>' + h.type + ': ' + h.from.substring(0, 20) + (h.from.length > 20 ? '...' : '') + ' → ' + h.to.substring(0, 20) + (h.to.length > 20 ? '...' : '') + '</span><span style="color:var(--text2)">' + h.time + '</span></div>';
  });
  document.getElementById('history').innerHTML = html;
}

function switchTab(el, tab) {
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  el.classList.add('active');
  document.getElementById('tab-convert').classList.add('hidden');
  document.getElementById('tab-unicode').classList.add('hidden');
  document.getElementById('tab-info').classList.add('hidden');
  document.getElementById('tab-' + tab).classList.remove('hidden');
}

function toggleTheme() {
  var h = document.documentElement;
  h.setAttribute('data-theme', h.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
}

renderHistory();
</script>
</body>
</html>
