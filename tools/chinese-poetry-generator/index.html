<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>古诗生成器</title><meta name="description" content="古诗生成器 - 在线生成古诗"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input,.input-group select{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus,.input-group select:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.poem-display{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0;line-height:2;font-size:1.2rem}.poem-title{font-size:1.5rem;font-weight:700;color:var(--blue);margin-bottom:16px}.poem-author{font-size:1rem;color:var(--text2);margin-bottom:20px}.poem-content{font-size:1.2rem;line-height:2;white-space:pre-wrap}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}</style><meta property="og:title" content="古诗生成器"><meta property="og:description" content="古诗生成器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"></head><body>
<div class="container"><h1>📜 古诗生成器</h1><p class="sub">在线生成古诗</p>
<div class="card">
<div class="input-group">
<label>选择诗体</label>
<select id="poemType">
<option value="jueju">绝句（四句）</option>
<option value="lvshi">律诗（八句）</option>
<option value="gushi">古诗（自由）</option>
</select>
</div>
<div class="input-group">
<label>选择主题</label>
<select id="theme">
<option value="spring">春天</option>
<option value="summer">夏天</option>
<option value="autumn">秋天</option>
<option value="winter">冬天</option>
<option value="mountain">山水</option>
<option value="friendship">友情</option>
<option value="homesick">思乡</option>
<option value="love">爱情</option>
</select>
</div>
<div class="input-group">
<label>选择意境</label>
<select id="mood">
<option value="happy">欢乐</option>
<option value="sad">忧伤</option>
<option value="calm">平静</option>
<option value="excited">激昂</option>
<option value="nostalgic">怀旧</option>
</select>
</div>
<button class="btn" onclick="generatePoem()">生成古诗</button>
<button class="btn" onclick="randomPoem()">随机生成</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>

      {title:'西江月·夜行黄沙道中',author:'辛弃疾',content:'明月别枝惊鹊，\n清风半夜鸣蝉。\n稻花香里说丰年，\n听取蛙声一片。'}

    autumn:[

      {title:'枫桥夜泊',author:'张继',content:'月落乌啼霜满天，\n江枫渔火对愁眠。\n姑苏城外寒山寺，\n夜半钟声到客船。'},
      {title:'九月九日忆山东兄弟',author:'王维',content:'独在异乡为异客，\n每逢佳节倍思亲。\n遥知兄弟登高处，\n遍插茱萸少一人。'}

      {title:'江雪',author:'柳宗元',content:'千山鸟飞绝，\n万径人踪灭。\n孤舟蓑笠翁，\n独钓寒江雪。'},
      {title:'逢雪宿芙蓉山主人',author:'刘长卿',content:'日暮苍山远，\n天寒白屋贫。\n柴门闻犬吠，\n风雪夜归人。'},
      {title:'梅花',author:'王安石',content:'墙角数枝梅，\n凌寒独自开。\n遥知不是雪，\n为有暗香来。'}
    ],
    mountain:[
      {title:'望庐山瀑布',author:'李白',content:'日照香炉生紫烟，\n遥看瀑布挂前川。\n飞流直下三千尺，\n疑是银河落九天。'},
      {title:'题西林壁',author:'苏轼',content:'横看成岭侧成峰，\n远近高低各不同。\n不识庐山真面目，\n只缘身在此山中。'},
      {title:'望岳',author:'杜甫',content:'岱宗夫如何？\n齐鲁青未了。\n造化钟神秀，\n阴阳割昏晓。'}

      {title:'赠汪伦',author:'李白',content:'李白乘舟将欲行，\n忽闻岸上踏歌声。\n桃花潭水深千尺，\n不及汪伦送我情。'},
      {title:'送杜少府之任蜀州',author:'王勃',content:'城阙辅三秦，\n风烟望五津。\n与君离别意，\n同是宦游人。'}

    homesick:[
      {title:'静夜思',author:'李白',content:'床前明月光，\n疑是地上霜。\n举头望明月，\n低头思故乡。'},
      {title:'九月九日忆山东兄弟',author:'王维',content:'独在异乡为异客，\n每逢佳节倍思亲。\n遥知兄弟登高处，\n遍插茱萸少一人。'},
      {title:'回乡偶书',author:'贺知章',content:'少小离家老大回，\n乡音无改鬓毛衰。\n儿童相见不相识，\n笑问客从何处来。'}

  lvshi:{
    spring:[
      {title:'春望',author:'杜甫',content:'国破山河在，\n城春草木深。\n感时花溅泪，\n恨别鸟惊心。\n烽火连三月，\n家书抵万金。\n白头搔更短，\n浑欲不胜簪。'},
      {title:'钱塘湖春行',author:'白居易',content:'孤山寺北贾亭西，\n水面初平云脚低。\n几处早莺争暖树，\n谁家新燕啄春泥。\n乱花渐欲迷人眼，\n浅草才能没马蹄。\n最爱湖东行不足，\n绿杨阴里白沙堤。'}
    ],
    summer:[
      {title:'夏日南亭怀辛大',author:'孟浩然',content:'山光忽西落，\n池月渐东上。\n散发乘夕凉，\n开轩卧闲敞。\n荷风送香气，\n竹露滴清响。\n欲取鸣琴弹，\n恨无知音赏。'}
    ],
    autumn:[
      {title:'登高',author:'杜甫',content:'风急天高猿啸哀，\n渚清沙白鸟飞回。\n无边落木萧萧下，\n不尽长江滚滚来。\n万里悲秋常作客，\n百年多病独登台。\n艰难苦恨繁霜鬓，\n潦倒新停浊酒杯。'},
      {title:'秋兴八首',author:'杜甫',content:'玉露凋伤枫树林，\n巫山巫峡气萧森。\n江间波浪兼天涌，\n塞上风云接地阴。\n丛菊两开他日泪，\n孤舟一系故园心。\n寒衣处处催刀尺，\n白帝城高急暮砧。'}
    ],
    winter:[
      {title:'白雪歌送武判官归京',author:'岑参',content:'北风卷地白草折，\n胡天八月即飞雪。\n忽如一夜春风来，\n千树万树梨花开。\n散入珠帘湿罗幕，\n狐裘不暖锦衾薄。\n将军角弓不得控，\n都护铁衣冷难着。'}
    ],
    mountain:[
      {title:'望岳',author:'杜甫',content:'岱宗夫如何？\n齐鲁青未了。\n造化钟神秀，\n阴阳割昏晓。\n荡胸生曾云，\n决眦入归鸟。\n会当凌绝顶，\n一览众山小。'}
    ],
    friendship:[
      {title:'送友人',author:'李白',content:'青山横北郭，\n白水绕东城。\n此地一为别，\n孤蓬万里征。\n浮云游子意，\n落日故人情。\n挥手自兹去，\n萧萧班马鸣。'}
    ],
    homesick:[
      {title:'月夜忆舍弟',author:'杜甫',content:'戍鼓断人行，\n秋边一雁声。\n露从今夜白，\n月是故乡明。\n有弟皆分散，\n无家问死生。\n寄书长不达，\n况乃未休兵。'}

      {title:'无题',author:'李商隐',content:'昨夜星辰昨夜风，\n画楼西畔桂堂东。\n身无彩凤双飞翼，\n心有灵犀一点通。\n隔座送钩春酒暖，\n分曹射覆蜡灯红。\n嗟余听鼓应官去，\n走马兰台类转蓬。'}

    ],
    mountain:[

      {title:'送元二使安西',author:'王维',content:'渭城朝雨浥轻尘，\n客舍青青柳色新。\n劝君更尽一杯酒，\n西出阳关无故人。'}

      {title:'静夜思',author:'李白',content:'床前明月光，\n疑是地上霜。\n举头望明月，\n低头思故乡。'}
    ],
    love:[
      {title:'无题',author:'李商隐',content:'相见时难别亦难，\n东风无力百花残。\n春蚕到死丝方尽，\n蜡炬成灰泪始干。'}
    ]
  }

function generatePoem(){
  var type=document.getElementById('poemType').value;
  var theme=document.getElementById('theme').value;
  var mood=document.getElementById('mood').value;
  var poems=poemTemplates[type][theme];
  if(!poems||poems.length===0){
    poems=poemTemplates[type]['spring'];
  }
  var randomIndex=Math.floor(Math.random()*poems.length);
  var poem=poems[randomIndex];
  showPoem(poem);
}
function randomPoem(){
  var types=Object.keys(poemTemplates);
  var randomType=types[Math.floor(Math.random()*types.length)];
  var themes=Object.keys(poemTemplates[randomType]);
  var randomTheme=themes[Math.floor(Math.random()*themes.length)];
  var poems=poemTemplates[randomType][randomTheme];
  if(!poems||poems.length===0){
    poems=poemTemplates['jueju']['spring'];
  }
  var randomIndex=Math.floor(Math.random()*poems.length);
  var poem=poems[randomIndex];
  showPoem(poem);
}
function showPoem(poem){
  var r=document.getElementById('result');
  var html='<div class="card">';
  html+='<div class="poem-display">';
  html+='<div class="poem-title">'+poem.title+'</div>';
  html+='<div class="poem-author">作者：'+poem.author+'</div>';
  html+='<div class="poem-content">'+poem.content+'</div>';
  html+='</div>';
  html+='<div class="btn-group" style="justify-content:center">';
  html+='<button class="btn" onclick="copyPoem()">复制古诗</button>';
  html+='</div></div>';
  r.innerHTML=html;
}
function copyPoem(){
  var poemText=document.querySelector('.poem-content').textContent;
  var title=document.querySelector('.poem-title').textContent;
  var author=document.querySelector('.poem-author').textContent.replace('作者：','');
  var fullText=title+'\n'+author+'\n\n'+poemText;
  navigator.clipboard.writeText(fullText).then(function(){alert('已复制古诗');}).catch(function(){alert('复制失败');});
}
generatePoem();
</script></body></html>
