<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表情翻译</title>
<meta name="description" content="Emoji翻译 - 将文字翻译为Emoji表情">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent-hover:#2563eb}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:1.8rem;margin:20px 0 8px}
.sub{color:#8b949e;margin-bottom:24px;font-size:0.95rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:640px;margin-bottom:16px}
textarea{width:100%;min-height:100px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:14px;font-size:1rem;resize:vertical;font-family:inherit}
textarea:focus{outline:none;border-color:var(--accent)}
.btn-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
button{padding:10px 20px;border:none;border-radius:8px;font-size:0.95rem;cursor:pointer;font-weight:500;transition:background .2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--border);color:var(--text)}.btn-secondary:hover{background:#444c56}
.word-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.word-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;text-align:center;max-width:140px}
.word-text{font-size:0.85rem;color:#8b949e;margin-bottom:4px}
.word-emoji{font-size:1.5rem;margin-bottom:4px}
.emoji-options{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.emoji-opt{font-size:1.1rem;padding:2px 4px;cursor:pointer;border-radius:4px;transition:background .15s}
.emoji-opt:hover{background:rgba(59,130,246,0.2)}
.emoji-opt.selected{background:rgba(59,130,246,0.3)}
.result-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-size:1.8rem;line-height:1.8;min-height:60px;word-break:break-all}
.result-box:empty::before{content:"表情句子将显示在这里";color:#484f58;font-size:0.95rem}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#238636;color:#fff;padding:10px 24px;border-radius:8px;font-size:0.9rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="表情翻译">
  <meta property="og:description" content="Emoji翻译 - 将文字翻译为Emoji表情">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/emoji-translate/">
</head>
<body>
<h1>表情翻译</h1>
<p class="sub">输入文字，自动建议对应表情，构建表情句子</p>
<div class="card">
<textarea id="input" placeholder="请输入中文或英文文字...&#10;例如：今天天气很好，我想去公园玩"></textarea>
<div class="btn-row">
<button class="btn-primary" onclick="analyze()">分析翻译</button>
<button class="btn-secondary" onclick="clearAll()">清空</button>
</div>
</div>
<div class="card" id="wordCard" style="display:none">
<div style="font-weight:500;margin-bottom:8px">逐词表情建议</div>
<div style="color:#8b949e;font-size:0.85rem;margin-bottom:8px">点击选择最佳表情</div>
<div class="word-list" id="wordList"></div>
</div>
<div class="card">
<div style="font-weight:500;margin-bottom:8px">表情句子</div>
<div class="result-box" id="result"></div>
<div class="btn-row">
<button class="btn-primary" onclick="copyResult()">复制结果</button>
<button class="btn-secondary" onclick="clearResult()">清空结果</button>
</div>
</div>
<div class="toast" id="toast">已复制到剪贴板</div>
<script>
const WORD_EMOJI={
// 天气
'晴':'☀️','天气':'🌤️','热':'🥵','冷':'🥶','下雨':'🌧️','雨':'🌧️','雪':'❄️','风':'🌬️','云':'☁️','雾':'🌫️','雷':'⚡','彩虹':'🌈',
// 时间
'今天':'📅','明天':'📅','昨天':'📅','早上':'🌅','中午':'☀️','晚上':'🌙','深夜':'🌃','现在':'⏰','时间':'⏰','周末':'🎉','新年':'🧧','春节':'🧧','生日':'🎂',
// 情感
'开心':'😊','高兴':'😄','快乐':'🎉','兴奋':'🤩','激动':'😃','感动':'🥹','幸福':'🥰','满意':'😌','平静':'🧘','放松':'😌','伤心':'😢','难过':'😔','失望':'😞','生气':'😡','愤怒':'🤬','害怕':'😨','紧张':'😰','焦虑':'😟','孤独':'😔','无聊':'😒','尴尬':'😬','惊讶':'😮','惊喜':'🤩','无聊':'🙄','讨厌':'😤','喜欢':'😍','爱':'❤️','思念':'🥺','想念':'🥺','感谢':'🙏','抱歉':'😔','对不起':'😔',
// 动作
'吃':'🍜','喝':'🍺','睡':'😴','看':'👀','听':'👂','说':'💬','写':'✏️','读':'📖','跑':'🏃','走':'🚶','跳':'🤸','飞':'✈️','游泳':'🏊','唱歌':'🎤','跳舞':'💃','玩':'🎮','学习':'📚','工作':'💻','休息':'🧘','旅行':'✈️','购物':'🛒','做饭':'🍳','拍照':'📷','打电话':'📱','发消息':'💬','打字':'⌨️',
// 人
'朋友':'👫','家人':'👨‍👩‍👧‍👦','老师':'👨‍🏫','学生':'👨‍🎓','医生':'👨‍⚕️','警察':'👮','宝宝':'👶','孩子':'🧒','男人':'👨','女人':'👩',
// 物品
'手机':'📱','电脑':'💻','书':'📚','笔':'✏️','纸':'📄','钱':'💰','礼物':'🎁','花':'🌸','树':'🌳','猫':'🐱','狗':'🐶','鱼':'🐟','鸟':'🐦',
// 食物
'苹果':'🍎','香蕉':'🍌','西瓜':'🍉','草莓':'🍓','蛋糕':'🍰','冰淇淋':'🍦','咖啡':'☕','茶':'🍵','水':'💧','酒':'🍷','饭':'🍚','面条':'🍜','汉堡':'🍔','披萨':'🍕',
// 交通
'汽车':'🚗','公交':'🚌','地铁':'🚇','飞机':'✈️','火车':'🚂','自行车':'🚲',
// 符号
'好':'👍','坏':'👎','对':'✅','错':'❌','大':'⬆️','小':'⬇️','多':'➕','少':'➖','新':'🆕','快':'⚡','慢':'🐢','强':'💪','弱':'🫠','美':'✨','丑':'👹','真':'💯','假':'🤥',
// 常用短语
'加油':'💪','厉害':'🔥','酷':'😎','棒':'👍','赞':'👍','牛':'🐂','绝了':'🤯','无敌':'🦸','冲':'🚀','稳':'✅','稳了':'✅','666':'💯','哈哈哈':'😂','嘻嘻':'😄','嘿嘿':'😏','呜呜':'😭','啊':'😮','嗯':'🤔','好滴':'👌','好的':'👌','收到':'✅','没问题':'👌','可以':'✅','不行':'❌','不要':'🚫','随便':'🤷','随便吧':'🤷','无所谓':'🤷','算了吧':'😞','再见':'👋','拜拜':'👋','你好':'👋','早上好':'🌅','晚安':'🌙','生日快乐':'🎂','新年快乐':'🎊','恭喜发财':'🧧','祝你好运':'🤞','太棒了':'🎉','真厉害':'🔥','好可爱':'🥰','好搞笑':'😂','好漂亮':'✨','好帅':'😎','好甜':'🍬','好香':'🌸','好吃':'😋','好喝':'☕','好看':'👀','好玩':'🎮','好听':'🎵','好玩意':'💎','有意思':'🤔','无聊':'😒','没意思':'😒','有趣':'😄','有意思':'😄','搞笑':'😂','逗':'😄','可爱':'🥰','漂亮':'✨','好看':'✨','帅气':'😎','美丽':'🌸','帅':'😎','美':'✨','可爱死了':'😍','绝绝子':'🤯','YYDS':'🏆','破防了':'😭','无语了':'😶','服了':'🫡','好家伙':'😮','离谱':'🤯','太强了':'💪','牛批':'🐂','好耶':'🎉','芜湖':'🚀','起飞':'✈️','冲冲冲':'🚀','搞快点':'⚡','安排':'✅','收到':'✅','明白':'👌','了解':'👌',
// 否定
'不':'❌','没有':'❌','别':'🚫','禁止':'🚫','停':'🛑',
// 标点
'。':'','，':'','！':'❗','？':'❓','~':'〰️',',':'','!':'❗','?':'❓','.':''
};
let selectedEmojis={};
let resultSentence='';
function analyze(){
const text=document.getElementById('input').value.trim();
if(!text)return;
const words=tokenize(text);
const wordList=[];
for(const w of words){
if(!w.trim())continue;
const emojis=WORD_EMOJI[w]||findEmojisForWord(w);
wordList.push({word:w,emojis:Array.isArray(emojis)?emojis:[emojis],selected:null});
}
document.getElementById('wordCard').style.display='block';
renderWordList(wordList);
}
function tokenize(text){
const tokens=[];
let i=0;
while(i<text.length){
let matched=false;
for(let len=Math.min(6,text.length-i);len>=2;len--){
const sub=text.substring(i,i+len);
if(WORD_EMOJI[sub]!==undefined){
tokens.push(sub);
i+=len;
matched=true;
break;
}
}
if(!matched){
const ch=text[i];
if(ch.trim())tokens.push(ch);
i++;
}
}
return tokens;
}
function findEmojisForWord(word){
const defaults=['💡','❓'];
return defaults;
}
function renderWordList(wordList){
const el=document.getElementById('wordList');
el.innerHTML=wordList.map((item,i)=>{
const emojis=Array.isArray(item.emojis)?item.emojis:[item.emojis];
return`<div class="word-item" id="word-${i}">
<div class="word-text">${item.word}</div>
<div class="emoji-options">${emojis.map((e,j)=>
`<span class="emoji-opt" onclick="selectWordEmoji(${i},'${e}')">${e}</span>`
).join('')}</div>
</div>`;
}).join('');
}
function selectWordEmoji(idx,emoji){
selectedEmojis[idx]=emoji;
document.querySelectorAll(`#word-${idx} .emoji-opt`).forEach(el=>{
el.classList.toggle('selected',el.textContent===emoji);
});
buildSentence();
}
function buildSentence(){
const keys=Object.keys(selectedEmojis).sort((a,b)=>a-b);
resultSentence=keys.map(k=>selectedEmojis[k]).join(' ');
document.getElementById('result').textContent=resultSentence;
}
function clearResult(){
selectedEmojis={};
resultSentence='';
document.getElementById('result').textContent='';
document.querySelectorAll('.emoji-opt').forEach(el=>el.classList.remove('selected'));
}
function clearAll(){
document.getElementById('input').value='';
document.getElementById('wordCard').style.display='none';
clearResult();
}
function copyResult(){
const text=document.getElementById('result').textContent;
if(!text)return;
navigator.clipboard.writeText(text).then(()=>showToast('已复制'));
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500);}
</script>
<script src="../i18n.js"></script>
</body>
</html>
