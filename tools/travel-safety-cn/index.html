<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行安全指南</title>
<meta property="og:title" content="旅行安全指南">
<meta property="og:description" content="旅行安全知识和应急指南">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="旅行安全指南，提供目的地安全信息和应急处理方法">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--radius:10px;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;padding:16px;min-height:100vh;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text],select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--accent)}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:var(--text);margin-right:4px;margin-bottom:4px}
.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.safety-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.safety-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.safety-icon{font-size:1.5rem}
.safety-title{font-weight:600;font-size:1rem}
.safety-level{margin-left:auto;padding:3px 10px;border-radius:12px;font-size:.75rem;font-weight:600}
.safety-level.safe{background:rgba(34,197,94,.15);color:var(--success)}
.safety-level.medium{background:rgba(245,158,11,.15);color:var(--warn)}
.safety-level.danger{background:rgba(239,68,68,.15);color:var(--danger)}
.safety-desc{font-size:.85rem;color:var(--text2);margin-bottom:6px}
.safety-tips{font-size:.85rem;line-height:1.6}
.safety-tips li{padding:3px 0;list-style:none}
.safety-tips li::before{content:'⚠️ '}
.emergency-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.emergency-card .phone{font-size:1.1rem;font-weight:700;color:var(--danger);white-space:nowrap}
.emergency-card .info{flex:1}
.emergency-card .name{font-weight:600;font-size:.9rem}
.emergency-card .desc{font-size:.8rem;color:var(--text2)}
.scam-card{background:var(--bg);border-left:3px solid var(--danger);border-radius:0 8px 8px 0;padding:12px;margin-bottom:8px}
.scam-card .title{font-weight:600;font-size:.9rem;margin-bottom:4px}
.scam-card .desc{font-size:.85rem;color:var(--text2)}
.category-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cat-tab{padding:5px 12px;border-radius:16px;font-size:.8rem;background:var(--bg);border:1px solid var(--border);cursor:pointer;color:var(--text2);transition:all .15s}
.cat-tab:hover,.cat-tab.active{background:var(--accent);color:var(--text);border-color:var(--accent)}
.score-circle{width:80px;height:80px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 12px}
.score-circle .num{font-size:1.5rem;font-weight:700}
.score-circle .lbl{font-size:.7rem;color:var(--text2)}
.es{text-align:center;padding:40px;color:var(--text2)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🛡️ 旅行安全指南</h1><p>目的地安全信息与应急处理</p></div>

<div class="cd"><h2>🔍 查询目的地</h2>
<div style="display:flex;gap:8px">
<select id="destSelect" style="flex:1" onchange="loadSafety()"></select>
</div>
<div id="safetyScore" style="margin-top:12px"></div></div>

<div class="cd"><h2>📞 紧急联系方式</h2><div id="emergencyList"></div></div>

<div class="cd"><h2>🛡️ 安全建议</h2>
<div class="category-tabs" id="catTabs"></div>
<div id="safetyAdvice"></div></div>

<div class="cd"><h2>⚠️ 常见骗局</h2><div id="scamList"></div></div>

<div class="cd"><h2>📋 旅行安全自检</h2>
<div id="safetyChecklist"></div>
<div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center">
<span id="checkProgress" style="font-size:.85rem;color:var(--text2)">0/0 已完成</span>
<button class="sec" onclick="exportChecklist()" style="padding:6px 12px;font-size:.85rem">📤 导出</button>
</div></div>
</div>

<script>
const SAFETY_DATA={
  '日本':{score:92,level:'safe',levelText:'非常安全',
    emergency:[{name:'报警',phone:'110',desc:'警察'},{name:'急救/火警',phone:'119',desc:'救护车、消防'},{name:'中国大使馆',phone:'+81-3-3403-3065',desc:'东京'}],
    advice:{general:['日本整体治安非常好，深夜外出也相对安全','注意地震应急，了解酒店避难通道','丢失物品可前往交番（派出所）查询','遵守当地礼仪，不要大声喧哗'],food:['自来水可直接饮用','生食海鲜新鲜度高，但仍需注意过敏','便利店食品非常安全'],transport:['交通卡Suica/PASMO通用','注意电车末班车时间','出租车费用较高，建议用公共交通']},
    scams:[{t:'假警察检查护照',d:'声称检查护照并要求查看钱包，实际是骗子'},{t:'搭讪邀请喝酒',d:'被陌生人邀请去酒吧，结账时发现巨额账单'}]},
  '泰国':{score:75,level:'medium',levelText:'需注意',
    emergency:[{name:'旅游警察',phone:'1155',desc:'英语服务'},{name:'报警',phone:'191',desc:'警察'},{name:'急救',phone:'1669',desc:'急救中心'},{name:'中国大使馆',phone:'+66-2-245-0088',desc:'曼谷'}],
    advice:{general:['注意飞车抢包，斜挎包放身前','摩托车出行务必戴头盔','不要触摸他人头部','进入寺庙需着装得体'],food:['路边摊食物注意卫生','只喝瓶装水','冰块通常是工厂制作，可放心食用'],transport:['突突车先谈好价格','打车用Grab APP避免被宰','注意交通方向（靠左行驶）']},
    scams:[{t:'宝石/丝绸骗局',d:'被热情导游带去购物店，购买高价低质商品'},{t:'大皇宫提前关门',d:'出租车司机称大皇宫关门，推荐去其他景点购物'},{t:'Jet Ski碰瓷',d:'租用摩托艇后被声称损坏要求赔偿'}]},
  '新加坡':{score:95,level:'safe',levelText:'非常安全',
    emergency:[{name:'报警',phone:'999',desc:'警察'},{name:'急救',phone:'995',desc:'救护车'},{name:'中国大使馆',phone:'+65-6418-0252',desc:'新加坡'}],
    advice:{general:['全球最安全城市之一','严格法律，注意不要乱丢垃圾/嚼口香糖','贵重物品仍需看管'],food:['小贩中心食物安全且美味','自来水可直接饮用'],transport:['公共交通非常发达','出租车费用合理']},
    scams:[{t:'假换汇',d:'在非正规场所兑换货币收到假钞'}]},
  '美国':{score:65,level:'medium',levelText:'需警惕',
    emergency:[{name:'报警/急救/火警',phone:'911',desc:'通用紧急号码'},{name:'中国大使馆',phone:'+1-202-495-2266',desc:'华盛顿'}],
    advice:{general:['注意人身财产安全，尤其在大城市','了解当地法律（持枪州注意相关法规）','夜间避免独自在偏僻区域行走','保管好护照复印件'],food:['自来水可直接饮用','食品安全标准高'],transport:['租车需了解当地交通规则','注意停车费用和违章罚款']},
    scams:[{t:'假警察',d:'要求查看钱包或交出贵重物品'},{t:'街头游戏骗局',d:'三杯豆游戏等必输的赌局'}]},
  '法国':{score:70,level:'medium',levelText:'需注意',
    emergency:[{name:'报警',phone:'17',desc:'警察'},{name:'急救',phone:'15',desc:'SAMU急救'},{name:'消防',phone:'18',desc:'消防'},{name:'中国大使馆',phone:'+33-1-4952-1950',desc:'巴黎'}],
    advice:{general:['巴黎扒窃较多，注意随身物品','地铁和景点是高发区域','重要证件分散存放','夜间避免偏僻区域'],food:['自来水可直接饮用','餐厅用餐注意小费习俗（已含在账单中）'],transport:['巴黎地铁非常方便','购买Navigo交通卡更划算']},
    scams:[{t:'签名请愿骗局',d:'假装收集签名，趁机偷盗或勒索'},{t:'金戒指骗局',d:'有人在你面前捡起金戒指，邀请你分钱'}]},
  '澳大利亚':{score:88,level:'safe',levelText:'很安全',
    emergency:[{name:'报警/急救/火警',phone:'000',desc:'通用紧急号码'},{name:'中国大使馆',phone:'+61-2-6228-3999',desc:'堪培拉'}],
    advice:{general:['整体治安良好','注意防晒，紫外线极强','海边游泳注意安全旗帜标识','野生动物不要随意接触'],food:['食品安全标准高','自来水可直接饮用'],transport:['靠左行驶','租车需国际驾照']},
    scams:[{t:'假慈善募捐',d:'街头假借慈善名义募捐'}]},
  '英国':{score:82,level:'safe',levelText:'安全',
    emergency:[{name:'报警/急救/火警',phone:'999',desc:'通用紧急号码'},{name:'中国大使馆',phone:'+44-20-7299-4049',desc:'伦敦'}],
    advice:{general:['整体治安良好，注意扒窃','伦敦地铁注意站台间隙','尊重排队文化'],food:['自来水可直接饮用','Fish & Chips值得一试'],transport:['Oyster卡方便乘坐公共交通','黑色出租车可信赖']},
    scams:[{t:'假地铁工作人员',d:'要求查看钱包或银行卡'}]},
  '韩国':{score:85,level:'safe',levelText:'安全',
    emergency:[{name:'报警',phone:'112',desc:'警察'},{name:'急救',phone:'119',desc:'急救/消防'},{name:'中国大使馆',phone:'+82-2-738-1038',desc:'首尔'}],
    advice:{general:['治安非常好','深夜外出也相对安全','垃圾分类需遵守'],food:['自来水经净化可饮用','街边食品普遍安全'],transport:['T-money卡交通通用','出租车安全可靠']},
    scams:[{t:'KTV酒水骗局',d:'被邀请去娱乐场所，结账时发现天价账单'}]}
};
const CATEGORIES=['general','food','transport'];
const CAT_LABELS={general:'🏠 一般安全',food:'🍜 饮食安全',transport:'🚗 交通出行'};
const CHECKLIST_ITEMS=[
  {id:'passport',name:'护照和证件检查',cat:'docs'},
  {id:'insurance',name:'旅行保险确认',cat:'docs'},
  {id:'emergency',name:'紧急联系方式记录',cat:'prep'},
  {id:'copy',name:'证件复印件备份',cat:'prep'},
  {id:'bank',name:'银行卡海外权限开通',cat:'finance'},
  {id:'cash',name:'携带适量当地现金',cat:'finance'},
  {id:'medicine',name:'常备药品准备',cat:'health'},
  {id:'vaccine',name:'疫苗接种确认',cat:'health'},
  {id:'sim',name:'通讯/eSIM准备',cat:'comm'},
  {id:'map',name:'离线地图下载',cat:'comm'},
  {id:'hotel',name:'酒店地址备份',cat:'plan'},
  {id:'itinerary',name:'行程单打印',cat:'plan'}
];
let checkState=JSON.parse(localStorage.getItem('safety_check')||'{}');
let activeCat='general';
function $(id){return document.getElementById(id)}
function initCities(){
  const cities=Object.keys(SAFETY_DATA);
  $('destSelect').innerHTML=cities.map(c=>`<option value="${c}">${c}</option>`).join('');
}
function loadSafety(){
  const dest=$('destSelect').value;
  const data=SAFETY_DATA[dest];if(!data)return;
  const scoreColor=data.score>=80?'var(--success)':data.score>=60?'var(--warn)':'var(--danger)';
  $('safetyScore').innerHTML=`<div class="score-circle" style="border:4px solid ${scoreColor}"><span class="num" style="color:${scoreColor}">${data.score}</span><span class="lbl">安全指数</span></div>
    <div style="text-align:center"><span class="safety-level ${data.level}">${data.levelText}</span></div>`;
  $('emergencyList').innerHTML=data.emergency.map(e=>`<div class="emergency-card">
    <span class="phone">${e.phone}</span><div class="info"><div class="name">${e.name}</div><div class="desc">${e.desc}</div></div></div>`).join('');
  activeCat='general';renderCatTabs();renderAdvice(dest);renderScams(dest);
}
function renderCatTabs(){
  $('catTabs').innerHTML=CATEGORIES.map(c=>`<button class="cat-tab ${activeCat===c?'active':''}" onclick="setCat('${c}')">${CAT_LABELS[c]}</button>`).join('');
}
function setCat(c){activeCat=c;renderCatTabs();renderAdvice($('destSelect').value);}
function renderAdvice(dest){
  const data=SAFETY_DATA[dest];if(!data||!data.advice)return;
  const tips=data.advice[activeCat]||[];
  $('safetyAdvice').innerHTML=`<div class="safety-card"><ul class="safety-tips">${tips.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
}
function renderScams(dest){
  const data=SAFETY_DATA[dest];if(!data||!data.scams)return;
  $('scamList').innerHTML=data.scams.map(s=>`<div class="scam-card"><div class="title">⚠️ ${s.t}</div><div class="desc">${s.d}</div></div>`).join('');
}
function renderChecklist(){
  $('safetyChecklist').innerHTML=CHECKLIST_ITEMS.map(item=>`<div style="display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--border)">
    <input type="checkbox" ${checkState[item.id]?'checked':''} onchange="toggleCheck('${item.id}',this.checked)" style="width:18px;height:18px;accent-color:var(--success);cursor:pointer">
    <span style="flex:1;font-size:.9rem;${checkState[item.id]?'text-decoration:line-through;color:var(--text2)':''}">${item.name}</span></div>`).join('');
  const done=CHECKLIST_ITEMS.filter(i=>checkState[i.id]).length;
  $('checkProgress').textContent=`${done}/${CHECKLIST_ITEMS.length} 已完成`;
}
function toggleCheck(id,checked){checkState[id]=checked;localStorage.setItem('safety_check',JSON.stringify(checkState));renderChecklist();}
function exportChecklist(){
  let text='🛡️ 旅行安全自检清单\n'+'━'.repeat(25)+'\n\n';
  CHECKLIST_ITEMS.forEach(item=>{
    text+=`${checkState[item.id]?'☑':'☐'} ${item.name}\n`;
  });
  const blob=new Blob([text],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='安全自检清单.txt';a.click();
}
initCities();loadSafety();renderChecklist();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
