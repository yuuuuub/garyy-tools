<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 年龄计算器</title>
<meta name="description" content="年龄计算器，精确计算周岁虚岁和出生天数">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {--bg: #0d1117;
--card: #161b22;
--text: #e6edf3;
--text2: #8b949e;
--accent: #3b82f6;
--accent-light: #1e3a5f;
--border: #30363d;
--danger: #ef4444;
--danger-bg: #2d1b1b;
--shadow: 0 2px 12px rgba(0,0,0,.4);
--radius: 16px}
[data-theme="dark"] {--bg: #1a1a2e;
--card-bg: #252540;
--text: #e8e8ed;
--text-secondary: #a0a0b0;
--accent: #4da3ff;
--accent-light: #1e2a44;
--border: #3a3a55;
--highlight: #ff8c5a;
--highlight-bg: #2e1f18;
--shadow: 0 2px 12px rgba(0,0,0,0.3)}
body {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
padding: 20px;
transition: background 0.3s, color 0.3s}
.container { max-width: 520px; width: 100%; }
.header {text-align: center;
margin-bottom: 24px;
position: relative}
.header h1 { font-size: 2rem; font-weight: 700; }
.theme-toggle {position: absolute;
right: 0;
top: 50%;
transform: translateY(-50%);
background: var(--card-bg);
border: 1px solid var(--border);
border-radius: 50%;
width: 44px;
height: 44px;
cursor: pointer;
font-size: 1.3rem;
display: flex;
align-items: center;
justify-content: center;
transition: all 0.2s;
box-shadow: var(--shadow)}
.theme-toggle:hover { transform: translateY(-50%) scale(1.05); }
.theme-toggle:active { transform: translateY(-50%) scale(0.95); }
.card {background: var(--card-bg);
border-radius: var(--radius);
padding: 24px;
margin-bottom: 16px;
box-shadow: var(--shadow);
transition: background 0.3s, box-shadow 0.3s}
.card-title {font-size: 0.8rem;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 0.05em;
color: var(--text-secondary);
margin-bottom: 16px}
.input-group {display: flex;
flex-direction: column;
gap: 8px}
.input-group label {font-size: 0.9rem;
font-weight: 500;
color: var(--text-secondary)}
.input-group input[type="date"] {padding: 14px 16px;
border: 2px solid var(--border);
border-radius: 12px;
font-size: 1.1rem;
background: var(--card-bg);
color: var(--text);
outline: none;
transition: border-color 0.2s;
font-family: inherit;
width: 100%}
.input-group input[type="date"]:focus {border-color: var(--accent)}
.btn {width: 100%;
padding: 14px;
background: var(--accent);
color: #fff;
border: none;
border-radius: 12px;
font-size: 1rem;
font-weight: 600;
cursor: pointer;
transition: all 0.2s;
font-family: inherit;
margin-top: 8px}
.btn:hover { opacity: 0.9; transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.stats-grid {display: grid;
grid-template-columns: 1fr 1fr;
gap: 12px}
.stat-item {background: var(--accent-light);
border-radius: 12px;
padding: 20px 16px;
text-align: center;
transition: background 0.3s}
.stat-value {font-size: 1.8rem;
font-weight: 700;
color: var(--accent);
line-height: 1.1}
.stat-label {font-size: 0.75rem;
color: var(--text-secondary);
margin-top: 4px;
font-weight: 500}
.detail-row {display: flex;
justify-content: space-between;
align-items: center;
padding: 14px 0;
border-bottom: 1px solid var(--border)}
.detail-row:last-child { border-bottom: none; }
.detail-label {font-size: 0.9rem;
color: var(--text-secondary)}
.detail-value {font-size: 1rem;
font-weight: 600;
color: var(--text)}
.detail-value.highlight { color: var(--highlight); }
.countdown {font-size: 2.2rem;
font-weight: 700;
color: var(--highlight);
text-align: center;
padding: 8px 0}
.countdown-label {text-align: center;
color: var(--text-secondary);
font-size: 0.85rem;
margin-top: -4px}
.zodiac-row {display: flex;
gap: 16px}
.zodiac-tag {flex: 1;
text-align: center;
padding: 16px 12px;
background: var(--accent-light);
border-radius: 12px;
transition: background 0.3s}
.zodiac-emoji { font-size: 2rem; display: block; margin-bottom: 4px; }
.zodiac-name { font-size: 0.85rem; font-weight: 600; }
.zodiac-date { font-size: 0.7rem; color: var(--text-secondary); }
.generation-tag {display: inline-block;
background: var(--highlight-bg);
color: var(--highlight);
padding: 8px 20px;
border-radius: 20px;
font-weight: 700;
font-size: 1.1rem}
.gen-desc {margin-top: 8px;
font-size: 0.85rem;
color: var(--text-secondary);
line-height: 1.5}
.fun-item {display: flex;
align-items: center;
gap: 12px;
padding: 12px 0;
border-bottom: 1px solid var(--border)}
.fun-item:last-child { border-bottom: none; }
.fun-icon { font-size: 1.5rem; width: 36px; text-align: center; flex-shrink: 0; }
.fun-content { flex: 1; }
.fun-text { font-size: 0.9rem; line-height: 1.4; }
.fun-text strong { color: var(--highlight); }
.error-msg {color: #ff3b30;
font-size: 0.85rem;
text-align: center;
margin-top: 8px;
display: none}
.hidden { display: none !important; }
@media (min-width: 520px) {.stats-grid { grid-template-columns: repeat(4, 1fr); }
body { padding: 40px 20px; }}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🎂 年龄计算器">
  <meta property="og:description" content="年龄计算器，精确计算周岁虚岁和出生天数">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/age-calculator/">
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎂 年龄计算器</h1>
    <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>
  </div>

  <div class="card">
    <div class="card-title">📅 输入你的出生日期</div>
    <div class="input-group">
      <input type="date" id="birthInput" max="" />
      <button class="btn" id="calcBtn">计算年龄</button>
    </div>
    <div class="error-msg" id="errorMsg">请输入有效的出生日期</div>
  </div>

  <div id="results" class="hidden">

    <div class="card">
      <div class="card-title">📊 精确年龄</div>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-value" id="years">-</div>
          <div class="stat-label">岁</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="months">-</div>
          <div class="stat-label">月</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="weeks">-</div>
          <div class="stat-label">周</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="days">-</div>
          <div class="stat-label">天</div>
        </div>
      </div>
      <div style="margin-top: 12px;">
        <div class="detail-row">
          <span class="detail-label">小时</span>
          <span class="detail-value" id="hours">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">分钟</span>
          <span class="detail-value" id="minutes">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">秒</span>
          <span class="detail-value highlight" id="seconds">-</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🎈 下一岁生日倒计时</div>
      <div class="countdown" id="countdownDays">-</div>
      <div class="countdown-label">天</div>
    </div>

    <div class="card">
      <div class="card-title">🌟 生肖 & 星座</div>
      <div class="zodiac-row">
        <div class="zodiac-tag">
          <span class="zodiac-emoji" id="chineseZodiacEmoji">🐉</span>
          <div class="zodiac-name" id="chineseZodiacName">-</div>
          <div class="zodiac-date">生肖属相</div>
        </div>
        <div class="zodiac-tag">
          <span class="zodiac-emoji" id="westernZodiacEmoji">♈</span>
          <div class="zodiac-name" id="westernZodiacName">-</div>
          <div class="zodiac-date" id="westernZodiacDate">-</div>
        </div>
      </div>
    </div>

    <div class="card" style="text-align: center;">
      <div class="card-title">👥 同一代人</div>
      <div class="generation-tag" id="generation">-</div>
      <div class="gen-desc" id="genDesc">-</div>
    </div>

    <div class="card">
      <div class="card-title">🎯 趣味数据</div>
      <div class="fun-item">
        <span class="fun-icon">📅</span>
        <div class="fun-content">
          <div class="fun-text" id="funDays">-</div>
        </div>
      </div>
      <div class="fun-item">
        <span class="fun-icon">💓</span>
        <div class="fun-content">
          <div class="fun-text" id="funHeartbeat">-</div>
        </div>
      </div>
      <div class="fun-item">
        <span class="fun-icon">⏳</span>
        <div class="fun-content">
          <div class="fun-text" id="funRemaining">-</div>
        </div>
      </div>
      <div class="fun-item">
        <span class="fun-icon">🗓️</span>
        <div class="fun-content">
          <div class="fun-text" id="funLeapYears">-</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  const CHINESE_ZODIAC = ['鼠', '牛', '虎', '兔', '龙', '蛇', '马', '羊', '猴', '鸡', '狗', '猪'];
  const CHINESE_ZODIAC_EMOJI = ['🐭', '🐮', '🐯', '🐰', '🐲', '🐍', '🐴', '🐑', '🐵', '🐔', '🐶', '🐷'];
  const WESTERN_ZODIAC = [
    { name: '摩羯座', emoji: '♑', start: '01-01', end: '01-19', date: '12/22 - 1/19' },
    { name: '水瓶座', emoji: '♒', start: '01-20', end: '02-18', date: '1/20 - 2/18' },
    { name: '双鱼座', emoji: '♓', start: '02-19', end: '03-20', date: '2/19 - 3/20' },
    { name: '白羊座', emoji: '♈', start: '03-21', end: '04-19', date: '3/21 - 4/19' },
    { name: '金牛座', emoji: '♉', start: '04-20', end: '05-20', date: '4/20 - 5/20' },
    { name: '双子座', emoji: '♊', start: '05-21', end: '06-21', date: '5/21 - 6/21' },
    { name: '巨蟹座', emoji: '♋', start: '06-22', end: '07-22', date: '6/22 - 7/22' },
    { name: '狮子座', emoji: '♌', start: '07-23', end: '08-22', date: '7/23 - 8/22' },
    { name: '处女座', emoji: '♍', start: '08-23', end: '09-22', date: '8/23 - 9/22' },
    { name: '天秤座', emoji: '♎', start: '09-23', end: '10-23', date: '9/23 - 10/23' },
    { name: '天蝎座', emoji: '♏', start: '10-24', end: '11-22', date: '10/24 - 11/22' },
    { name: '射手座', emoji: '♐', start: '11-23', end: '12-21', date: '11/23 - 12/21' },
    { name: '摩羯座', emoji: '♑', start: '12-22', end: '12-31', date: '12/22 - 1/19' }
  ];
  const birthInput = document.getElementById('birthInput');
  const calcBtn = document.getElementById('calcBtn');
  const errorMsg = document.getElementById('errorMsg');
  const results = document.getElementById('results');
  const themeToggle = document.getElementById('themeToggle');
  const today = new Date();
  birthInput.max = today.toISOString().split('T')[0];
  function formatNumber(n) {
    return n.toLocaleString('zh-CN');
  }
  function daysBetween(d1, d2) {
    const ms = d2 - d1;
    return Math.floor(ms / (1000 * 60 * 60 * 24));
  }
  function isLeapYear(y) {
    return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
  }
  function countLeapYears(startYear, endYear) {
    let count = 0;
    for (let y = startYear; y <= endYear; y++) {
      if (isLeapYear(y)) count++;
    }
    return count;
  }
  function getChineseZodiac(year) {
    const index = (year - 4) % 12;
    return {
      name: CHINESE_ZODIAC[index],
      emoji: CHINESE_ZODIAC_EMOJI[index]
    };
  }
  function getWesternZodiac(month, day) {
    const mmdd = String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
    for (const z of WESTERN_ZODIAC) {
      if (mmdd >= z.start && mmdd <= z.end) return z;
    }
    return WESTERN_ZODIAC[0];
  }
  function getGeneration(year) {
    const decade = Math.floor(year / 10) * 10;
    const label = decade + '后';
    let desc = '';
    if (decade === 1960) desc = '拼搏的一代，改革开放的亲历者';
    else if (decade === 1970) desc = '务实的一代，见证中国经济腾飞';
    else if (decade === 1980) desc = '压力山大的一代，独生子女政策下的独苗';
    else if (decade === 1990) desc = '互联网原住民，见证从拨号上网到5G时代';
    else if (decade === 2000) desc = 'Z世代的排头兵，数字原生的第一代';
    else if (decade === 2010) desc = '10后小鲜肉，移动互联网时代成长的一代';
    else if (decade === 2020) desc = '20后萌新，AI时代的新生代';
    else if (year < 1960) desc = '长辈中的长辈，阅历丰富的前辈';
    else desc = '新时代的弄潮儿';
    return { label, desc };
  }
  function daysUntilNextBirthday(birthDate, now) {
    const currentYear = now.getFullYear();
    const nextBirthday = new Date(currentYear, birthDate.getMonth(), birthDate.getDate());
    const targetYear = nextBirthday > now ? currentYear : currentYear + 1;
    const actualNext = new Date(targetYear, birthDate.getMonth(), birthDate.getDate());
    return daysBetween(now, actualNext);
  }
  function calculate() {
    const birthValue = birthInput.value;
    if (!birthValue) {
      errorMsg.textContent = '请选择你的出生日期';
      errorMsg.style.display = 'block';
      results.classList.add('hidden');
      return;
    }
    const birthDate = new Date(birthValue + 'T00:00:00');
    const now = new Date();
    if (birthDate > now) {
      errorMsg.textContent = '出生日期不能是未来的日期';
      errorMsg.style.display = 'block';
      results.classList.add('hidden');
      return;
    }
    errorMsg.style.display = 'none';
    results.classList.remove('hidden');
    const totalDays = daysBetween(birthDate, now);
    const totalMs = now - birthDate;
    const totalHours = Math.floor(totalMs / (1000 * 60 * 60));
    const totalMinutes = Math.floor(totalMs / (1000 * 60));
    const totalSeconds = Math.floor(totalMs / 1000);
    const birthY = birthDate.getFullYear();
    const birthM = birthDate.getMonth();
    const birthD = birthDate.getDate();
    const nowY = now.getFullYear();
    const nowM = now.getMonth();
    const nowD = now.getDate();
    let ageYears = nowY - birthY;
    let ageMonths = nowM - birthM;
    let ageDays = nowD - birthD;
    if (ageDays < 0) {
      ageMonths--;
      const prevMonth = new Date(nowY, nowM, 0);
      ageDays += prevMonth.getDate();
    }
    if (ageMonths < 0) {
      ageYears--;
      ageMonths += 12;
    }
    const totalMonths = ageYears * 12 + ageMonths;
    const totalWeeks = Math.floor(totalDays / 7);
    document.getElementById('years').textContent = ageYears;
    document.getElementById('months').textContent = formatNumber(totalMonths);
    document.getElementById('weeks').textContent = formatNumber(totalWeeks);
    document.getElementById('days').textContent = formatNumber(totalDays);
    document.getElementById('hours').textContent = formatNumber(totalHours);
    document.getElementById('minutes').textContent = formatNumber(totalMinutes);
    document.getElementById('seconds').textContent = formatNumber(totalSeconds);
    const countdown = daysUntilNextBirthday(birthDate, now);
    document.getElementById('countdownDays').textContent = countdown;
    const chineseZodiac = getChineseZodiac(birthY);
    document.getElementById('chineseZodiacEmoji').textContent = chineseZodiac.emoji;
    document.getElementById('chineseZodiacName').textContent = '属' + chineseZodiac.name;
    const westernZodiac = getWesternZodiac(birthM + 1, birthD);
    document.getElementById('westernZodiacEmoji').textContent = westernZodiac.emoji;
    document.getElementById('westernZodiacName').textContent = westernZodiac.name;
    document.getElementById('westernZodiacDate').textContent = westernZodiac.date;
    const gen = getGeneration(birthY);
    document.getElementById('generation').textContent = gen.label;
    document.getElementById('genDesc').textContent = gen.desc;
    document.getElementById('funDays').innerHTML = '你已经来到这个世界 <strong>' + formatNumber(totalDays) + '</strong> 天了';
    const heartbeats = totalMinutes * 72;
    const heartbeatsYi = (heartbeats / 100000000).toFixed(2);
    document.getElementById('funHeartbeat').innerHTML = '你的心脏大约跳动了 <strong>' + formatNumber(Math.round(heartbeats)) + '</strong> 次（约 ' + heartbeatsYi + ' 亿次）';
    const lifeExpectancy = 80;
    const totalLifeDays = lifeExpectancy * 365 + Math.floor(lifeExpectancy / 4);
    const remainingDays = totalLifeDays - totalDays;
    document.getElementById('funRemaining').innerHTML = '如果你活到<strong>80岁</strong>，还剩大约 <strong>' + formatNumber(Math.max(0, remainingDays)) + '</strong> 天';
    const leapYears = countLeapYears(birthY, nowY);
    document.getElementById('funLeapYears').innerHTML = '你度过了 <strong>' + leapYears + '</strong> 个闰年';
    results.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  calcBtn.addEventListener('click', calculate);
  birthInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') calculate();
  });
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  let isDark = localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && prefersDark);
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    themeToggle.textContent = isDark ? '☀️' : '🌙';
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  }
  themeToggle.addEventListener('click', function() {
    isDark = !isDark;
    applyTheme();
  });
  applyTheme();
  const params = new URLSearchParams(window.location.search);
  const dateParam = params.get('date');
  if (dateParam) {
    birthInput.value = dateParam;
    calculate();
  }
})();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
