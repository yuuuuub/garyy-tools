<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧬 DNA分析器</title>
<meta property="og:title" content="🧬 DNA分析器">
<meta property="og:description" content="🧬 DNA分析器 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="DNA序列分析工具 - 碱基统计、GC含量、反向互补、转录翻译、限制性酶切位点分析">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧬</text></svg>">
<script src="../i18n.js" defer></script>
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px;line-height:1.4}
.hdr{text-align:center;margin-bottom:16px}.hdr h1{font-size:1.6rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.85rem}
.input-area{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.input-area textarea{width:100%;min-height:100px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-family:monospace;font-size:.9rem;resize:vertical;outline:none}
.input-area textarea:focus{border-color:var(--accent)}
.btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:.8rem;font-weight:600;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{opacity:.9}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--accent)}
.btn-success{background:var(--success);color:#fff}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.stat-card .num{font-size:1.4rem;font-weight:700;color:var(--accent)}
.stat-card .label{font-size:.75rem;color:var(--text2);margin-top:4px}
.gc-bar{height:24px;border-radius:12px;background:var(--bg);overflow:hidden;display:flex;margin:16px 0}
.gc-bar .gc{background:var(--success);height:100%;transition:width .5s}
.gc-bar .at{background:var(--warn);height:100%;transition:width .5s}
.result-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.result-section h3{font-size:.95rem;margin-bottom:10px;color:var(--accent)}
.result-section pre{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:monospace;font-size:.8rem;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow-y:auto}
.codon-table{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:4px}
.codon-item{background:var(--bg);padding:4px 8px;border-radius:4px;font-family:monospace;font-size:.75rem;display:flex;justify-content:space-between}
.codon-item .aa{color:var(--accent);font-weight:600}
.seq-display{font-family:monospace;font-size:.85rem;line-height:1.8;letter-spacing:1px}
.base-A{color:#e74c3c}.base-T{color:#3498db}.base-G{color:#f1c40f}.base-C{color:#2ecc71}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="hdr"><h1>🧬 DNA分析器</h1><p>碱基统计、GC含量、反向互补、转录翻译</p></div>
<div class="input-area">
<textarea id="dnaInput" placeholder="输入DNA序列（仅ATCG），或点击示例加载">ATGCGATCGATCGTAGCTAGCTAGCTTAAAGGGCCCTTTAAACCCGGGTTT</textarea>
<div class="btn-row">
<button class="btn btn-primary" onclick="analyze()">分析序列</button>
<button class="btn btn-secondary" onclick="loadExample()">加载示例</button>
<button class="btn btn-secondary" onclick="randomSeq()">随机序列</button>
<button class="btn btn-secondary" onclick="clearAll()">清空</button>
</div>
</div>
<div class="stats-grid" id="statsGrid"></div>
<div id="gcBar"></div>
<div id="results"></div>

<script>
const codons={UUU:'Phe',UUC:'Phe',UUA:'Leu',UUG:'Leu',CUU:'Leu',CUC:'Leu',CUA:'Leu',CUG:'Leu',AUU:'Ile',AUC:'Ile',AUA:'Ile',AUG:'Met',GUU:'Val',GUC:'Val',GUA:'Val',GUG:'Val',UCU:'Ser',UCC:'Ser',UCA:'Ser',UCG:'Ser',CCU:'Pro',CCC:'Pro',CCA:'Pro',CCG:'Pro',ACU:'Thr',ACC:'Thr',ACA:'Thr',ACG:'Thr',GCU:'Ala',GCC:'Ala',GCA:'Ala',GCG:'Ala',UAU:'Tyr',UAC:'Tyr',UAA:'Stop',UAG:'Stop',CAU:'His',CAC:'His',CAA:'Gln',CAG:'Gln',AAU:'Asn',AAC:'Asn',AAA:'Lys',AAG:'Lys',GAU:'Asp',GAC:'Asp',GAA:'Glu',GAG:'Glu',UGU:'Cys',UGC:'Cys',UGA:'Stop',UGG:'Trp',CGU:'Arg',CGC:'Arg',CGA:'Arg',CGG:'Arg',AGU:'Ser',AGC:'Ser',AGA:'Arg',AGG:'Arg',GGU:'Gly',GGC:'Gly',GGA:'Gly',GGG:'Gly'};
const aminoColors={Met:'#e74c3c',Stop:'#333',Gly:'#95a5a6',Ala:'#3498db',Val:'#2ecc71',Leu:'#e67e22',Ile:'#9b59b6',Pro:'#1abc9c',Phe:'#f39c12',Trp:'#8e44ad',Ser:'#16a085',Thr:'#2980b9',Cys:'#d35400',Tyr:'#c0392b',His:'#7f8c8d',Gln:'#27ae60',Asn:'#2c3e50',Lys:'#e74c3c',Asp:'#3498db',Glu:'#2ecc71',Arg:'#f1c40f'};

function analyze(){
const raw=document.getElementById('dnaInput').value.toUpperCase().replace(/[^ATCG]/g,'');
if(!raw){alert('请输入有效的DNA序列（仅ATCG）');return}
const len=raw.length;
const counts={A:0,T:0,C:0,G:0};
for(const b of raw)counts[b]++;
const gc=((counts.G+counts.C)/len*100).toFixed(1);
const at=((counts.A+counts.T)/len*100).toFixed(1);

document.getElementById('statsGrid').innerHTML=`
<div class="stat-card"><div class="num">${len}</div><div class="label">总长度</div></div>
<div class="stat-card"><div class="num" style="color:var(--danger)">${counts.A}</div><div class="label">A (腺嘌呤)</div></div>
<div class="stat-card"><div class="num" style="color:var(--accent)">${counts.T}</div><div class="label">T (胸腺嘧啶)</div></div>
<div class="stat-card"><div class="num" style="color:var(--success)">${counts.C}</div><div class="label">C (胞嘧啶)</div></div>
<div class="stat-card"><div class="num" style="color:var(--warn)">${counts.G}</div><div class="label">G (鸟嘌呤)</div></div>
<div class="stat-card"><div class="num" style="color:var(--success)">${gc}%</div><div class="label">GC含量</div></div>`;

document.getElementById('gcBar').innerHTML=`<div class="gc-bar"><div class="gc" style="width:${gc}%"></div><div class="at" style="width:${at}%"></div></div>`;

const complement=raw.split('').map(b=>({A:'T',T:'A',C:'G',G:'C'}[b])).join('');
const reverse=raw.split('').reverse().join('');
const revComp=complement.split('').reverse().join('');
const rna=raw.split('').map(b=>b==='T'?'U':b).join('');
const protein=[];
for(let i=0;i+2<rna.length;i+=3){
const codon=rna.substr(i,3);
const aa=codons[codon]||'?';
if(aa==='Stop')break;
protein.push(aa);
}

let seqHtml='<span class="seq-display">';
for(let i=0;i<raw.length;i++){
if(i>0&&i%10===0)seqHtml+=' ';
if(i>0&&i%60===0)seqHtml+='<br>';
seqHtml+=`<span class="base-${raw[i]}">${raw[i]}</span>`;
}
seqHtml+='</span>';

let codonHtml='<div class="codon-table">';
for(let i=0;i+2<rna.length;i+=3){
const codon=rna.substr(i,3);
const aa=codons[codon]||'?';
const color=aminoColors[aa]||'var(--text)';
codonHtml+=`<div class="codon-item"><span>${codon}</span><span class="aa" style="color:${color}">${aa}</span></div>`;
}
codonHtml+='</div>';

document.getElementById('results').innerHTML=`
<div class="result-section"><h3>序列可视化</h3><div>${seqHtml}</div></div>
<div class="result-section"><h3>反向互补链</h3><pre>${revComp}</pre></div>
<div class="result-section"><h3>mRNA转录</h3><pre>${rna}</pre></div>
<div class="result-section"><h3>蛋白质翻译 (${protein.length}个氨基酸)</h3><pre>${protein.join(' - ')}</pre></div>
<div class="result-section"><h3>密码子表</h3>${codonHtml}</div>`;
}

function loadExample(){
document.getElementById('dnaInput').value='ATGGTGAGCAAGGGCGAGGAGCTGTTCACCGGGGTGGTGCCCATCCTGGTCGAGCTGGACGGCGACGTAAACGGCCACAAGTTCAGCGTGTCCGGCGAGGGCGAGGGCGATGCCACCTACGGCAAGCTGACCCTGAAGTTCATCTGCACCACCGGCAAGCTGCCCGTGCCCTGGCCCACCCTCGTGACCACCCTGACCTACGGCGTGCAGTGCTTCAGCCGCTACCCCGACCACATGAAGCAGCACGACTTCTTCAAGTCCGCCATGCCCGAAGGCTACGTCCAGGAGCGCACCATCTTCTTCAAGGACGACGGCAACTACAAGACCCGCGCCGAGGTGAAGTTCGAGGGCGACACCCTGGTGAACCGCATCGAGCTGAAGGGCATCGACTTCAAGGAGGACGGCAACATCCTGGGGCACAAGCTGGAGTACAACTACAACAGCCACAACGTCTATATCATGGCCGACAAGCAGAAGAACGGCATCAAGGTGAACTTCAAGATCCGCCACAACATCGAGGACGGCAGCGTGCAGCTCGCCGACCACTACCAGCAGAACACCCCCATCGGCGACGGCCCCGTGCTGCTGCCCGACAACCACTACCTGAGCACCCAGTCCGCCCTGAGCAAAGACCCCAACGAGAAGCGCGATCACATGGTCCTGCTGGAGTTCGTGACCGCCGCCGGGATCACTCTCGGCATGGACGAGCTGTACAAGTAA';
analyze();
}

function randomSeq(){
const len=Math.floor(Math.random()*200)+50;
const bases='ATCG';
let seq='';
for(let i=0;i<len;i++)seq+=bases[Math.floor(Math.random()*4)];
document.getElementById('dnaInput').value=seq;
analyze();
}

function clearAll(){
document.getElementById('dnaInput').value='';
document.getElementById('statsGrid').innerHTML='';
document.getElementById('gcBar').innerHTML='';
document.getElementById('results').innerHTML='';
}

analyze();
</script>
</body>
</html>
