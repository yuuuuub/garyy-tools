<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据故事工具</title>
<meta name="description" content="数据故事工具，将数据转化为引人入胜的叙事故事">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<meta name="robots" content="index, follow">
<script src="../i18n.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a855f7;--pink:#ec4899;--cyan:#06b6d4;--orange:#f97316;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--green:#1a7f37;--red:#cf222e;--shadow:0 4px 24px rgba(0,0,0,.1)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.85rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:5px 12px;font-size:.8rem}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;margin-bottom:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem;color:var(--text2)}
.story-section{opacity:0;transform:translateY(40px);transition:all .8s cubic-bezier(.4,0,.2,1);padding:32px 24px}
.story-section.visible{opacity:1;transform:translateY(0)}
.story-number{font-size:5rem;font-weight:800;line-height:1;opacity:.15;position:absolute;top:-10px;right:20px}
.story-title{font-size:1.4rem;font-weight:700;margin-bottom:12px;position:relative}
.story-text{font-size:1rem;line-height:1.8;color:var(--text2);position:relative}
.story-highlight{display:inline-block;padding:2px 8px;border-radius:4px;font-weight:700}
.story-chart{margin:16px 0;position:relative}
.progress-dots{display:flex;gap:8px;justify-content:center;margin-top:16px}
.progress-dot{width:10px;height:10px;border-radius:50%;background:var(--border);transition:all .3s}
.progress-dot.active{background:var(--accent);transform:scale(1.3)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
@keyframes countUp{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
body,.container{animation:fadeIn .4s ease-out}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}.story-number{font-size:3rem}}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='📖 数据故事工具';
const $=id=>document.getElementById(id);
const APP=$('app');
const COLORS=['#3b82f6','#3fb950','#f85149','#d29922','#a855f7','#ec4899','#06b6d4','#f97316'];

let stories=[
  {title:'用户增长的故事',sections:[
    {num:'01',title:'起步阶段',text:'产品上线初期，月活用户仅',highlight:'500',highlightColor:'#f85149',desc:'人。但团队坚信产品价值，持续迭代优化。',chart:{type:'bar',data:[500,800,1200,2000,3500,6000],labels:['1月','2月','3月','4月','5月','6月']}},
    {num:'02',title:'突破增长',text:'通过口碑传播和精准营销，用户数实现',highlight:'10倍',highlightColor:'#3fb950',desc:'增长，月活突破5000人。',chart:{type:'line',data:[500,800,1200,2000,3500,6000],labels:['1月','2月','3月','4月','5月','6月']}},
    {num:'03',title:'规模效应',text:'当用户突破',highlight:'10000',highlightColor:'#3b82f6',desc:'后，网络效应开始显现，增长曲线陡然上升。',chart:{type:'area',data:[500,800,1200,2000,3500,6000,10000,18000],labels:['1月','2月','3月','4月','5月','6月','7月','8月']}},
    {num:'04',title:'持续领先',text:'最终达成',highlight:'月活50000',highlightColor:'#a855f7',desc:'的里程碑，成为行业领导者。',chart:{type:'bar',data:[500,800,1200,2000,3500,6000,10000,18000,32000,50000],labels:['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月']}}
  ]},
  {title:'营收增长的故事',sections:[
    {num:'01',title:'商业化探索',text:'首个季度营收',highlight:'12万',highlightColor:'#d29922',desc:'，验证了商业模式的可行性。',chart:{type:'bar',data:[12,18,25,35,48,65],labels:['Q1','Q2','Q3','Q4','Q5','Q6']}},
    {num:'02',title:'收入多元化',text:'拓展三条收入线，总收入提升',highlight:'200%',highlightColor:'#3fb950',desc:'。',chart:{type:'line',data:[12,24,40,60,85,115],labels:['Q1','Q2','Q3','Q4','Q5','Q6']}},
    {num:'03',title:'盈利拐点',text:'在第',highlight:'8个月',highlightColor:'#3b82f6',desc:'实现盈亏平衡，之后持续盈利。',chart:{type:'area',data:[-20,-15,-8,0,12,28,45,68],labels:['1月','2月','3月','4月','5月','6月','7月','8月']}},
    {num:'04',title:'规模化盈利',text:'年营收突破',highlight:'500万',highlightColor:'#a855f7',desc:'，利润率稳定在30%以上。',chart:{type:'bar',data:[12,24,40,60,85,115,148,195,260,350,430,520],labels:['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月']}}
  ]},
  {title:'团队成长的故事',sections:[
    {num:'01',title:'创业起步',text:'初始团队仅',highlight:'3人',highlightColor:'#f85149',desc:'，身兼数职，日夜奋战。',chart:{type:'bar',data:[3,5,8,12,18,25],labels:['1月','2月','3月','4月','5月','6月']}},
    {num:'02',title:'快速扩张',text:'半年内团队扩展到',highlight:'25人',highlightColor:'#3b82f6',desc:'，覆盖产品、技术、运营全链路。',chart:{type:'line',data:[3,5,8,12,18,25,35,48],labels:['1月','2月','3月','4月','5月','6月','7月','8月']}},
    {num:'03',title:'文化建设',text:'员工满意度达到',highlight:'92%',highlightColor:'#3fb950',desc:'，打造了高效协作的团队文化。',chart:{type:'bar',data:[75,78,82,85,88,90,92],labels:['1月','2月','3月','4月','5月','6月','7月']}},
    {num:'04',title:'行业标杆',text:'团队规模达到',highlight:'100人',highlightColor:'#a855f7',desc:'，成为行业人才吸引标杆。',chart:{type:'area',data:[3,5,8,12,18,25,35,48,65,82,100],labels:['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月']}}
  ]}
];

let curStory=0;
let curSection=0;
let isPlaying=false;
let playTimer=null;

function render(){
  let h=`<h1>📖 数据故事工具</h1><p class="subtitle">将数据转化为引人入胜的叙事</p>`;
  h+=`<div class="card"><div class="flex-between"><div class="flex">`;
  stories.forEach((s,i)=>{
    h+=`<button class="btn btn-sm" style="background:${curStory===i?'var(--accent)':'var(--border)'}" onclick="curStory=${i};curSection=0;stopPlay();render()">${s.title}</button>`;
  });
  h+=`</div><div class="flex"><button class="btn btn-sm btn-green" onclick="togglePlay()">${isPlaying?'⏸ 暂停':'▶ 自动播放'}</button><button class="btn btn-sm" onclick="prevSection()">← 上一节</button><button class="btn btn-sm" onclick="nextSection()">下一节 →</button></div></div></div>`;

  const story=stories[curStory];
  const sec=story.sections[curSection];

  h+=`<div class="card story-section visible" style="background:linear-gradient(135deg,#1a1a2e,#16213e);border:none;min-height:300px">`;
  h+=`<div class="story-number">${sec.num}</div>`;
  h+=`<div class="story-title" style="color:#fff;font-size:1.5rem">${sec.title}</div>`;
  h+=`<div class="story-text" style="color:#c9d1d9;font-size:1.1rem;line-height:2">${sec.text}<span class="story-highlight" style="background:${sec.highlightColor}22;color:${sec.highlightColor};font-size:1.3rem;padding:2px 10px;border-radius:6px">${sec.highlight}</span>${sec.desc}</div>`;
  h+=`<div class="story-chart">${renderChart(sec.chart)}</div>`;
  h+=`</div>`;

  h+=`<div class="progress-dots">`;
  story.sections.forEach((_,i)=>{
    h+=`<div class="progress-dot ${i===curSection?'active':''}" onclick="curSection=${i};stopPlay();render()"></div>`;
  });
  h+=`</div>`;

  h+=`<div class="card"><h3 style="margin-bottom:12px">📊 故事数据总览</h3>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px">`;
  const lastSec=story.sections[story.sections.length-1];
  const lastVal=lastSec.chart.data[lastSec.chart.data.length-1];
  const firstVal=story.sections[0].chart.data[0];
  const growth=Math.round((lastVal-firstVal)/firstVal*100);
  [{n:lastVal,l:'最终值',c:'var(--accent)'},{n:growth+'%',l:'总增长',c:'var(--green)'},{n:story.sections.length,l:'章节数',c:'var(--yellow)'},{n:lastSec.chart.data.length,l:'数据点',c:'var(--purple)'}].forEach(s=>{
    h+=`<div style="text-align:center;padding:12px;background:var(--bg);border-radius:8px"><div style="font-size:1.5rem;font-weight:700;color:${s.c}">${s.n}</div><div style="font-size:.8rem;color:var(--text2)">${s.l}</div></div>`;
  });
  h+=`</div></div>`;

  h+=`<div class="card"><h3 style="margin-bottom:12px">✏️ 编辑故事</h3>`;
  h+=`<label>章节标题</label><input value="${sec.title}" onchange="stories[${curStory}].sections[${curSection}].title=this.value;render()">`;
  h+=`<label>叙述文本</label><textarea onchange="stories[${curStory}].sections[${curSection}].text=this.value">${sec.text}</textarea>`;
  h+=`<label>高亮数据</label><input value="${sec.highlight}" onchange="stories[${curStory}].sections[${curSection}].highlight=this.value;render()">`;
  h+=`<label>数据（逗号分隔）</label><input value="${sec.chart.data.join(',')}" onchange="stories[${curStory}].sections[${curSection}].chart.data=this.value.split(',').map(Number);render()">`;
  h+=`<div class="flex"><button class="btn btn-sm btn-green" onclick="addSection()">+ 添加章节</button>`;
  if(story.sections.length>1) h+=`<button class="btn btn-sm btn-red" onclick="removeSection()">- 移除章节</button>`;
  h+=`</div></div>`;
  APP.innerHTML=h;
}

function renderChart(chart){
  if(chart.type==='bar') return renderBarChart(chart);
  if(chart.type==='line') return renderLineChart(chart);
  if(chart.type==='area') return renderAreaChart(chart);
  return '';
}

function renderBarChart(chart){
  const w=800,h=200,pad=40;
  const max=Math.max(...chart.data)*1.15||1;
  const gap=(w-pad*2)/chart.data.length;
  const bw=gap*.6;
  let s=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:200px">`;
  chart.data.forEach((v,i)=>{
    const bh=(v/max)*(h-pad*2);
    const x=pad+gap*i+gap/2;
    s+=`<rect x="${x-bw/2}" y="${h-pad}" width="${bw}" rx="3" fill="${COLORS[i%COLORS.length]}" opacity=".8"><animate attributeName="height" from="0" to="${bh}" dur=".8s" fill="freeze" begin="${i*0.1}s" calcMode="spline" keySplines="0.4 0 0.2 1"/><animate attributeName="y" from="${h-pad}" to="${h-pad-bh}" dur=".8s" fill="freeze" begin="${i*0.1}s" calcMode="spline" keySplines="0.4 0 0.2 1"/></rect>`;
    if(chart.labels&&chart.labels[i]) s+=`<text x="${x}" y="${h-pad+14}" text-anchor="middle" fill="var(--text2)" font-size="9">${chart.labels[i]}</text>`;
  });
  s+=`</svg>`;
  return s;
}

function renderLineChart(chart){
  const w=800,h=200,pad=40;
  const max=Math.max(...chart.data)*1.15||1;
  const gap=(w-pad*2)/(chart.data.length-1||1);
  let s=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:200px">`;
  const pts=chart.data.map((v,i)=>`${pad+gap*i},${h-pad-(v/max)*(h-pad*2)}`).join(' ');
  s+=`<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1500" stroke-dashoffset="1500"><animate attributeName="stroke-dashoffset" from="1500" to="0" dur="1.5s" fill="freeze"/></polyline>`;
  chart.data.forEach((v,i)=>{
    const cx=pad+gap*i,cy=h-pad-(v/max)*(h-pad*2);
    s+=`<circle cx="${cx}" cy="${cy}" r="0" fill="var(--accent)"><animate attributeName="r" from="0" to="4" dur=".3s" fill="freeze" begin="${0.3+i*0.15}s"/></circle>`;
  });
  s+=`</svg>`;
  return s;
}

function renderAreaChart(chart){
  const w=800,h=200,pad=40;
  const max=Math.max(...chart.data)*1.15||1;
  const gap=(w-pad*2)/(chart.data.length-1||1);
  let s=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:200px">`;
  const pts=chart.data.map((v,i)=>`${pad+gap*i},${h-pad-(v/max)*(h-pad*2)}`).join(' ');
  const areaPath=`M${pad},${h-pad} L${pts.split(' ').join(' L')} L${pad+gap*(chart.data.length-1)},${h-pad} Z`;
  s+=`<path d="${areaPath}" fill="var(--accent)" fill-opacity=".15" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/></path>`;
  s+=`<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="1500" stroke-dashoffset="1500"><animate attributeName="stroke-dashoffset" from="1500" to="0" dur="1.5s" fill="freeze"/></polyline>`;
  s+=`</svg>`;
  return s;
}

function nextSection(){
  const story=stories[curStory];
  if(curSection<story.sections.length-1){curSection++;render();}
  else{stopPlay();}
}
function prevSection(){if(curSection>0){curSection--;render();}}
function togglePlay(){
  if(isPlaying){stopPlay();return;}
  isPlaying=true;
  playTimer=setInterval(()=>{
    const story=stories[curStory];
    if(curSection<story.sections.length-1){curSection++;render();}
    else{curSection=0;render();}
  },3000);
  render();
}
function stopPlay(){isPlaying=false;if(playTimer){clearInterval(playTimer);playTimer=null;}render();}
function addSection(){
  stories[curStory].sections.push({num:String(stories[curStory].sections.length+1).padStart(2,'0'),title:'新章节',text:'在这里添加叙述',highlight:'0',highlightColor:'#3b82f6',desc:'。',chart:{type:'bar',data:[10,20,30,40,50,60],labels:['1月','2月','3月','4月','5月','6月']}});
  curSection=stories[curStory].sections.length-1;
  render();
}
function removeSection(){
  if(stories[curStory].sections.length>1){
    stories[curStory].sections.splice(curSection,1);
    curSection=Math.min(curSection,stories[curStory].sections.length-1);
    render();
  }
}
render();
</script>
</body>
</html>
