<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数学速算</title>
<meta name="description" content="数学速算挑战，在限定时间内完成数学题">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da}

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:15pxscroll-behavior:smooth;}
h1{font-size:1.5rem;margin-bottom:15px;color:#3b82f6}
.hud{display:flex;gap:15px;margin-bottom:20px;font-size:1rem;flex-wrap:wrap;justify-content:center}
.hud span{background:var(--bg);padding:6px 14px;border-radius:6px;border:1px solid #30363d}
.question{font-size:2.5rem;font-weight:bold;margin-bottom:20px;background:var(--bg);padding:15px 30px;border-radius:12px;border:2px solid #30363d;min-width:200px;text-align:center}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:320px;width:100%}
.opt{padding:15px;background:var(--bg);border:2px solid #30363d;border-radius:10px;font-size:1.3rem;cursor:pointer;text-align:center;transition:all .2s}
.opt:hover{border-color:#3b82f6}
.opt.correct{background:#166534;border-color:#22c55e}
.opt.wrong{background:#7f1d1d;border-color:#ef4444}
.status{margin-top:15px;font-size:1.1rem;min-height:1.5em}
button{padding:10px 24px;border:none;background:#3b82f6;color:var(--text);border-radius:8px;cursor:pointer;font-size:1rem;margin-top:10px}
.difficulty{display:flex;gap:8px;margin-bottom:15px}
.difficulty button{padding:6px 14px;font-size:0.85rem}
.difficulty button.active{background:#3b82f6}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="数学速算">
  <meta property="og:description" content="数学速算挑战，在限定时间内完成数学题">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/math-sprint/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1>🔢 数学速算</h1>
<div class="difficulty">
<button class="active" onclick="setDiff('easy',this)">简单</button>
<button onclick="setDiff('medium',this)">中等</button>
<button onclick="setDiff('hard',this)">困难</button>
</div>
<div class="hud">
<span>⏱ <b id="time">30</b>秒</span>
<span>正确: <b id="correct">0</b></span>
<span>连对: <b id="streak">0</b></span>
<span>最高连对: <b id="best">0</b></span>
</div>
<div class="question" id="question">?</div>
<div class="options" id="options"></div>
<div class="status" id="status">选择难度开始挑战</div>
<button onclick="start()">开始挑战</button>
<script>
let diff='easy',answer=0,correctN=0,streak=0,bestStreak=0,timer=30,timerId=null,running=false;

function setDiff(d,btn){
  diff=d;document.querySelectorAll('.difficulty button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function genQuestion(){
  let a,b,op,ans;
  const ops=diff==='easy'?['+','-']:diff==='medium'?['+','-','×']:[ '+','-','×','÷'];
  op=ops[Math.floor(Math.random()*ops.length)];
  if(op==='÷'){
    b=Math.floor(Math.random()*9)+2;
    ans=Math.floor(Math.random()*12)+1;
    a=ans*b;
  }else if(op==='×'){
    a=Math.floor(Math.random()*12)+1;b=Math.floor(Math.random()*12)+1;ans=a*b;
  }else{
    const max=diff==='hard'?100:50;
    a=Math.floor(Math.random()*max)+1;b=Math.floor(Math.random()*max)+1;
    if(op==='-'&&a<b)[a,b]=[b,a];
    ans=op==='+'?a+b:a-b;
  }
  answer=ans;
  document.getElementById('question').textContent=`${a} ${op} ${b} = ?`;

  const opts=new Set([ans]);
  while(opts.size<4){opts.add(ans+Math.floor(Math.random()*20)-10)}
  const shuffled=[...opts].sort(()=>Math.random()-0.5);
  const el=document.getElementById('options');el.innerHTML='';
  shuffled.forEach(o=>{
    const d=document.createElement('div');d.className='opt';d.textContent=o;
    d.onclick=()=>checkAnswer(o,d);el.appendChild(d);
  });
}

function checkAnswer(val,el){
  if(!running)return;
  if(val===answer){correctN++;streak++;if(streak>bestStreak)bestStreak=streak;
    el.classList.add('correct');
  }else{streak=0;el.classList.add('wrong');
    document.querySelectorAll('.opt').forEach(o=>{if(parseInt(o.textContent)===answer)o.classList.add('correct')});
  }
  document.getElementById('correct').textContent=correctN;
  document.getElementById('streak').textContent=streak;
  document.getElementById('best').textContent=bestStreak;
  setTimeout(genQuestion,400);
}

function start(){
  correctN=0;streak=0;timer=30;running=true;
  document.getElementById('correct').textContent=0;
  document.getElementById('streak').textContent=0;
  document.getElementById('time').textContent=30;
  document.getElementById('status').textContent='';
  if(timerId)clearInterval(timerId);
  timerId=setInterval(()=>{timer--;document.getElementById('time').textContent=timer;if(timer<=0)end()},1000);
  genQuestion();
}

function end(){
  running=false;clearInterval(timerId);
  document.getElementById('status').textContent=`🎉 完成！正确 ${correctN} 题，最高连对 ${bestStreak}`;
  document.getElementById('options').innerHTML='';
  document.getElementById('question').textContent='完成！';
}
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
