<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✍️ AI写作 - Gary's Tools</title>
<meta name="description" content="AI智能写作助手，支持文章、邮件、文案、故事等多种写作场景">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;line-height:1.6;min-height:100vh;scroll-behavior:smooth}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.8rem;font-weight:700;margin-bottom:4px}
header p{color:var(--text2);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.card-title{font-size:.95rem;font-weight:600;margin-bottom:10px;color:var(--text2)}
textarea{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px;width:100%;font-size:.9rem;resize:vertical;font-family:inherit;outline:none;transition:border .2s}
textarea:focus{border-color:var(--blue)}
select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:.85rem;font-family:inherit;outline:none;cursor:pointer}
select:focus{border-color:var(--blue)}
button{padding:9px 20px;border-radius:6px;border:1px solid var(--blue);background:var(--blue);color:var(--text);font-size:.85rem;cursor:pointer;font-family:inherit;transition:opacity .2s}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}
.result-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:12px;min-height:60px}
.result-box .label{color:var(--text2);font-size:.8rem;margin-bottom:6px}
.result-box .value{font-size:.95rem;line-height:1.7;white-space:pre-wrap}
.error-msg{background:rgba(239,68,68,.1);border:1px solid var(--red);border-radius:6px;padding:10px;color:var(--red);font-size:.82rem;margin-top:10px;display:none}
.btn-group{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.config-row{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.copy-btn{background:var(--card);border:1px solid var(--border);color:var(--text2);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:.75rem;margin-top:8px}
.copy-btn:hover{border-color:var(--blue);color:var(--blue)}
.input-group{margin-bottom:12px}
.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}
.input-group input,.input-group select{width:100%;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:.85rem;font-family:inherit;outline:none}
.input-group input:focus{border-color:var(--blue)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="✍️ AI写作 - Gary's Tools">
<meta property="og:description" content="AI智能写作助手，支持多种写作场景">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header>
<h1>✍️ AI写作</h1>
<p>SiliconFlow · 多场景写作助手</p>
<div style="margin-top:8px">
<button onclick="promptApiKey()" style="padding:4px 12px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:.75rem;cursor:pointer">⚙️ 设置 API Key</button>
<span id="keyStatus" style="font-size:.7rem;color:var(--text2);margin-left:8px"></span>
</div>
</header>
<div class="card">
<div class="config-row">
<select id="writeType">
<option value="article">📝 文章</option>
<option value="email">📧 邮件</option>
<option value="copy">💬 营销文案</option>
<option value="story">📖 故事</option>
<option value="social">📱 社交媒体</option>
<option value="resume">📋 简历描述</option>
<option value="cover">💼 求职信</option>
<option value="custom">✏️ 自定义</option>
</select>
<select id="tone">
<option value="professional">专业</option>
<option value="casual">轻松</option>
<option value="formal">正式</option>
<option value="humorous">幽默</option>
<option value="persuasive">说服力</option>
</select>
<select id="length">
<option value="short">短篇</option>
<option value="medium" selected>中等</option>
<option value="long">长篇</option>
</select>
</div>
<div class="input-group">
<label>主题/话题</label>
<input type="text" id="topic" placeholder="例如：远程办公的优缺点">
</div>
<div class="input-group">
<label>补充说明（可选）</label>
<input type="text" id="extra" placeholder="例如：目标读者是职场新人，需要包含具体案例">
</div>
<div class="btn-group">
<button id="writeBtn" onclick="write()">✍️ 开始写作</button>
<button onclick="resetForm()" style="border-color:var(--border);background:transparent;color:var(--text)">清空</button>
</div>
<div id="errorMsg" class="error-msg"></div>
<div id="resultArea" style="display:none">
<div class="result-box">
<div class="label">写作结果</div>
<div id="writeResult" class="value"></div>
<button class="copy-btn" onclick="copyResult()">📋 复制</button>
</div>
</div>
</div>
</div>
<script>
(function(){
'use strict';
var API_URL='https://api.siliconflow.cn/v1/chat/completions';
var API_KEY=localStorage.getItem('sf_api_key')||'';
var MODEL='Qwen/Qwen2.5-7B-Instruct';

var TYPE_MAP={
  article:'写一篇关于"{topic}"的文章',
  email:'写一封关于"{topic}"的邮件',
  copy:'写一段关于"{topic}"的营销文案',
  story:'写一个关于"{topic}"的短篇故事',
  social:'写一条关于"{topic}"的社交媒体帖子',
  resume:'为"{topic}"写一段简历工作描述',
  cover:'写一封关于"{topic}"的求职自荐信',
  custom:'根据以下要求写作："{topic}"'
};

var TONE_MAP={professional:'专业严谨的',casual:'轻松随意的',formal:'正式书面的',humorous:'幽默风趣的',persuasive:'具有说服力的'};
var LENGTH_MAP={short:'300字左右',medium:'600字左右',long:'1000字左右'};

window.write=function(){
  var topic=document.getElementById('topic').value.trim();
  if(!topic){showError('请输入主题/话题');return;}
  if(!API_KEY){showError('请先设置 API Key');return;}
  var type=document.getElementById('writeType').value;
  var tone=document.getElementById('tone').value;
  var len=document.getElementById('length').value;
  var extra=document.getElementById('extra').value.trim();
  setLoading(true);hideError();
  document.getElementById('resultArea').style.display='none';
  var prompt='你是一个专业写作助手，请用'+TONE_MAP[tone]+'风格，'+TYPE_MAP[type].replace('{topic}',topic)+'。长度控制在'+LENGTH_MAP[len]+'。用中文写作。';
  if(extra)prompt+=' 额外要求：'+extra;
  fetch(API_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
    body:JSON.stringify({model:MODEL,messages:[{role:'system',content:prompt},{role:'user',content:'请开始写作：'+topic}],max_tokens:2048,temperature:0.7})
  })
  .then(function(r){
    if(!r.ok)return r.json().then(function(d){throw new Error(d.error?.message||'请求失败')});
    return r.json();
  })
  .then(function(data){
    setLoading(false);
    if(data&&data.choices&&data.choices[0]&&data.choices[0].message){
      document.getElementById('resultArea').style.display='block';
      document.getElementById('writeResult').textContent=data.choices[0].message.content;
    }else{showError('无法解析返回结果');}
  })
  .catch(function(err){setLoading(false);showError(err.message||'请求失败，请稍后重试');});
};

window.copyResult=function(){
  navigator.clipboard.writeText(document.getElementById('writeResult').textContent).then(function(){
    var btn=document.querySelector('.copy-btn');btn.textContent='✅ 已复制';
    setTimeout(function(){btn.textContent='📋 复制';},1500);
  });
};

window.resetForm=function(){
  document.getElementById('topic').value='';
  document.getElementById('extra').value='';
  document.getElementById('resultArea').style.display='none';
  hideError();
};

function setLoading(v){document.getElementById('writeBtn').disabled=v;document.getElementById('writeBtn').textContent=v?'⏳ 写作中...':'✍️ 开始写作';}
function showError(msg){var e=document.getElementById('errorMsg');e.textContent=msg;e.style.display='block';}
window.hideError=function(){document.getElementById('errorMsg').style.display='none';};

function promptApiKey(){
  var key=prompt('请输入 SiliconFlow API Key\n\n免费注册: https://cloud.siliconflow.cn',API_KEY);
  if(key!==null){API_KEY=key.trim();localStorage.setItem('sf_api_key',API_KEY);updateKeyStatus();}
}
function updateKeyStatus(){
  var el=document.getElementById('keyStatus');
  if(API_KEY){el.textContent='✅ 已设置';el.style.color='var(--green)';}
  else{el.textContent='❌ 未设置';el.style.color='var(--red)';}
}
updateKeyStatus();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
