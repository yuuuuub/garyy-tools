<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国折纸艺术</title><meta name="description" content="中国折纸艺术 - 在线学习中国折纸"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#d4a017;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#b8860b}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;cursor:pointer;transition:transform .2s}.item:hover{transform:translateY(-2px)}.item-title{font-size:1.2rem;font-weight:600;color:var(--gold);margin-bottom:8px}.item-meta{font-size:.9rem;color:var(--text2);margin-bottom:4px}.item-display{font-size:3rem;text-align:center;padding:30px;background:var(--bg);border-radius:8px;margin-bottom:12px;min-height:100px;display:flex;align-items:center;justify-content:center}.item-desc{font-size:.9rem;color:var(--text)}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{display:inline-block;padding:6px 14px;background:var(--bg);border:1px solid var(--border);border-radius:20px;color:var(--text2);font-size:.85rem;cursor:pointer;transition:all .2s}.btn:hover{border-color:var(--blue);color:var(--blue)}.btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center}.modal-overlay.show{display:flex}.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:700px;width:90%;max-height:80vh;overflow-y:auto;position:relative}.modal h2{color:var(--gold);margin-bottom:12px}.modal p{color:var(--text2);line-height:1.8;margin-bottom:12px}.close-btn{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--text2);font-size:1.5rem;cursor:pointer}.theme-toggle{position:fixed;top:8px;right:80px;z-index:9999;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 12px;cursor:pointer;color:var(--text);font-size:.75rem}.steps-container{counter-reset:step}.step{display:flex;gap:12px;margin-bottom:16px;padding:12px;background:var(--bg);border-radius:8px;align-items:flex-start}.step::before{counter-increment:step;content:counter(step);display:flex;align-items:center;justify-content:center;width:28px;height:28px;background:var(--gold);color:#fff;border-radius:50%;font-weight:bold;font-size:.85rem;flex-shrink:0}.step p{margin:0;font-size:.9rem;color:var(--text);line-height:1.6}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="中国折纸艺术"><meta property="og:description" content="中国折纸艺术 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦢</text></svg>"></head><body>

<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🦢 中国折纸艺术</h1><p class="sub">在线学习中国折纸</p>
<div class="card"><div class="search-box"><input type="text" id="searchInput" placeholder="搜索折纸作品..." oninput="filterItems()"></div>
<div class="btn-group"><button class="btn active" onclick="filterByType('all',this)">全部</button><button class="btn" onclick="filterByType('动物',this)">动物</button><button class="btn" onclick="filterByType('花卉',this)">花卉</button><button class="btn" onclick="filterByType('节庆',this)">节庆</button><button class="btn" onclick="filterByType('实用',this)">实用</button></div></div>
<div id="itemList"></div></div>
<div class="modal-overlay" id="modal"><div class="modal"><button class="close-btn" onclick="closeModal()">×</button><h2 id="modalTitle"></h2><div id="modalDisplay" class="item-display"></div><p id="modalMeta"></p><p id="modalDesc"></p><div id="modalSteps" class="steps-container"></div><p id="modalDetail" style="padding-top:12px;border-top:1px solid var(--border);margin-top:8px"></p></div></div>
<script src="../i18n.js" defer></script>
<script>
var items=[
  {title:'千纸鹤',type:'动物',emoji:'🦢',desc:'最经典的折纸作品，寓意祈福纳祥。传说折一千只纸鹤可以实现一个愿望。',steps:['准备一张正方形纸','对角折叠成三角形','将两个底角向上折到顶角','翻面，将两侧向中线折叠','将下方三角形向上折','翻面折出鹤的头和尾','展开翅膀，千纸鹤完成'],detail:'千纸鹤在日本和中国文化中都有重要地位，象征和平、希望和祝福。'},
  {title:'纸船',type:'实用',emoji:'⛵',desc:'最简单的折纸作品之一，每个孩子都折过的经典。可以放在水上漂流。',steps:['准备一张长方形纸','沿长边对折','将两侧向中线折叠','将底部三角形向上折','打开中间，压成正方形','将两侧向上折','打开中间压成正方形','拉开两侧，纸船完成'],detail:'纸船是折纸入门的经典作品，简单易学，充满童趣。'},
  {title:'荷花',type:'花卉',emoji:'🪷',desc:'中国折纸的代表作品，寓意高洁、吉祥。多层花瓣逐层展开，造型优美。',steps:['准备一张正方形纸','沿两条对角线折叠','将四个角向中心折叠','再将四个角向中心折叠','翻面，将四个角向中心折叠','从背面逐层拉出花瓣','整理花瓣层次，荷花完成'],detail:'荷花折纸是中国传统折纸的经典，多层花瓣的展开需要耐心和技巧。'},
  {title:'纸扇子',type:'实用',emoji:'🪭',desc:'中国传统折纸，可实际使用的折纸作品。扇面可以绘画装饰。',steps:['准备一张长方形纸','沿长边反复正反折叠','在一端用胶水或线固定','展开另一端成扇形','可用颜料装饰扇面','纸扇子完成'],detail:'折纸扇子是中国夏季纳凉的传统工具，文人雅士常在扇面上题诗作画。'},
  {title:'金元宝',type:'节庆',emoji:'🪙',desc:'春节期间常见的折纸作品，寓意招财进宝。常用于祭祀和装饰。',steps:['准备一张金色长方形纸','沿长边对折','将两侧向中线折叠','将底部三角形向上折','打开中间压平','将两侧向内折叠','整理成元宝形状，完成'],detail:'金元宝折纸是中国春节期间的传统习俗，寓意新年财运亨通。'},
  {title:'纸蝴蝶',type:'动物',emoji:'🦋',desc:'造型优美的折纸作品，象征自由和爱情。可装饰在花束或礼品上。',steps:['准备一张正方形纸','沿两条对角线折叠','将两侧向中线折叠','将上方三角形向下折','翻面，将两侧向外折','折出触角和翅膀','整理形状，纸蝴蝶完成'],detail:'蝴蝶在中国文化中象征爱情和自由，"蝶"与"耋"谐音，也有长寿的寓意。'},
  {title:'纸玫瑰',type:'花卉',emoji:'🌹',desc:'精致的折纸作品，花瓣层层叠叠，送给爱人的最佳手工礼物。',steps:['准备一张正方形纸','沿两条对角线和中线折叠','将四个角向中心折叠','翻面，将四个角向中心折叠','再翻面，将四个角向中心折叠','从中心拉出花瓣','逐层整理花瓣，玫瑰完成'],detail:'纸玫瑰是最受欢迎的折纸作品之一，送给心爱的人表达真挚的感情。'},
  {title:'红包',type:'节庆',emoji:'🧧',desc:'春节必备的折纸作品，用于装压岁钱。不同造型的红包增添节日气氛。',steps:['准备一张红色正方形纸','沿中线对折','将两侧向中线折叠','将底部向上折叠','将顶部向下折叠作为封口','可用胶水固定','红包完成，可装入压岁钱'],detail:'红包是中国春节期间的传统习俗，长辈给晚辈压岁钱用红包包装，寓意辟邪驱鬼、保佑平安。'},
  {title:'纸青蛙',type:'动物',emoji:'🐸',desc:'会跳的折纸作品，按压尾部可以弹跳。深受孩子们喜爱。',steps:['准备一张正方形纸','沿两条对角线折叠','将两侧向中线折叠','将上方三角形向下折','翻面折出前腿','将下方向上折叠','折出后腿，按压可跳'],detail:'纸青蛙是互动性最强的折纸作品，按压尾部可以让青蛙跳起来。'},
  {title:'纸灯笼',type:'节庆',emoji:'🏮',desc:'中秋节和元宵节的装饰折纸，可配合蜡烛使用（需注意安全）。',steps:['准备一张红色长方形纸','沿长边反复正反折叠','在一端用线固定','展开另一端成灯笼形','可在灯笼上绘画装饰','纸灯笼完成'],detail:'纸灯笼是中国传统节日的装饰品，元宵节和中秋节家家户户都会挂灯笼。'},
  {title:'纸桃子',type:'花卉',emoji:'🍑',desc:'寓意长寿的折纸作品，寿宴上常见的装饰。造型圆润可爱。',steps:['准备一张粉色或红色纸','沿两条对角线折叠','将两侧向中线折叠','翻面，将下方三角形向上折','打开中间，将两侧向内折','整理成桃子形状','可用绿色纸做叶子装饰'],detail:'桃子在中国文化中象征长寿，"寿桃"是祝寿的传统礼物。'},
  {title:'纸粽子',type:'节庆',emoji:'🫔',desc:'端午节的特色折纸，用彩纸折成粽子形状，可做挂饰。',steps:['准备一张绿色长方形纸','将一角向上折叠','反复折叠成粽子形状','将末端塞入缝隙固定','可用彩线装饰','纸粽子完成'],detail:'端午节折纸粽子是近年来流行的节日手工，用彩纸折成粽子形状作为装饰。'}
];
var currentType='all';
function renderItems(list){
  var el=document.getElementById('itemList');
  var html='';
  list.forEach(function(p,i){
    html+='<div class="item" onclick="showDetail('+items.indexOf(p)+')">';
    html+='<div class="item-title">'+p.emoji+' '+p.title+'</div>';
    html+='<div class="item-meta">'+p.type+'</div>';
    html+='<div class="item-display">'+p.emoji+'</div>';
    html+='<div class="item-desc">'+p.desc.substring(0,60)+'...</div>';
    html+='</div>';
  });
  el.innerHTML=html||'<div class="card" style="text-align:center;color:var(--text2)">未找到匹配的折纸作品</div>';
}
function filterItems(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var filtered=items.filter(function(p){return(p.title.includes(q)||p.desc.includes(q))&&(currentType==='all'||p.type===currentType);});
  renderItems(filtered);
}
function filterByType(type,btn){
  currentType=type;
  document.querySelectorAll('.btn-group .btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  filterItems();
}
function showDetail(i){
  var p=items[i];
  document.getElementById('modalTitle').textContent=p.title;
  document.getElementById('modalDisplay').textContent=p.emoji;
  document.getElementById('modalMeta').textContent=p.type;
  document.getElementById('modalDesc').textContent=p.desc;
  var stepsHtml='';
  if(p.steps){p.steps.forEach(function(s){stepsHtml+='<div class="step"><p>'+s+'</p></div>';});}
  document.getElementById('modalSteps').innerHTML=stepsHtml;
  document.getElementById('modalDetail').textContent=p.detail;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='light'?'dark':'light');}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
renderItems(items);
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
