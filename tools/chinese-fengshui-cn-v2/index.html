<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>风水罗盘大全 V2 | Chinese Feng Shui V2</title>
<meta property="og:title" content="风水罗盘大全 V2 | Chinese Feng Shui V2">
<meta property="og:description" content="风水罗盘大全 V2 | Chinese Feng Shui V2 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="风水罗盘大全：八卦罗盘、九宫飞星、五行方位、命卦计算、家居办公风水。专业的中国风水文化工具。">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#d4a843;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#b8860b}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:900px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.8rem;color:var(--gold)}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;justify-content:center}
.tab{padding:8px 18px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text2);cursor:pointer;font-size:.85rem;transition:.2s}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.input-group{margin-bottom:12px}
.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}
.input-group select,.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}
.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}
.btn:hover{opacity:.85}
.result-area{margin-top:16px;display:none}
.result-area.show{display:block}
.bagua{width:320px;height:320px;margin:20px auto;position:relative;border-radius:50%;border:3px solid var(--gold);background:var(--bg)}
.bagua-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2rem;color:var(--gold);z-index:2;background:var(--card);width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--gold)}
.bagua-item{position:absolute;text-align:center;cursor:pointer;transition:.2s;padding:8px;border-radius:8px}
.bagua-item:hover{background:rgba(212,168,67,.15)}
.bagua-item .b-gua{font-size:1.4rem;font-weight:700}
.bagua-item .b-name{font-size:.8rem;color:var(--text2)}
.bagua-item .b-dir{font-size:.7rem;color:var(--gold)}
.flystar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.flystar-cell{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}
.flystar-cell .fs-star{font-size:1.4rem;font-weight:700;color:var(--gold)}
.flystar-cell .fs-name{font-size:.8rem;color:var(--text2);margin-top:2px}
.five-dir{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:12px 0}
.five-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}
.five-item .f-icon{font-size:2rem;margin-bottom:4px}
.five-item .f-el{font-size:1.1rem;font-weight:600}
.five-item .f-dir{font-size:.8rem;color:var(--text2)}
.five-item .f-color{font-size:.8rem;color:var(--text2)}
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin:12px 0}
.room-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px}
.room-card h4{color:var(--gold);margin-bottom:8px;font-size:.95rem}
.room-card ul{padding-left:18px;color:var(--text2);font-size:.85rem}
.room-card li{margin:4px 0}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.78rem;margin:2px}
.tag.good{background:rgba(35,134,54,.15);color:var(--green);border:1px solid rgba(35,134,54,.3)}
.tag.bad{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
#themeBtn{position:fixed;top:8px;right:8px;z-index:9999;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);cursor:pointer;font-size:.8rem}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<button id="themeBtn" onclick="toggleTheme()">🌓 主题</button>
<div class="container">
<h1>🧭 风水罗盘大全 V2</h1>
<p class="sub">八卦罗盘 · 九宫飞星 · 五行方位 · 命卦计算 · 家居办公风水</p>

<div class="tabs">
<button class="tab active" onclick="switchTab('bagua')">八卦罗盘</button>
<button class="tab" onclick="switchTab('flystar')">九宫飞星</button>
<button class="tab" onclick="switchTab('five')">五行方位</button>
<button class="tab" onclick="switchTab('kua')">命卦计算</button>
<button class="tab" onclick="switchTab('room')">家居风水</button>
<button class="tab" onclick="switchTab('office')">办公风水</button>
</div>

<div class="card" id="baguaPanel">
<p style="color:var(--text2);text-align:center;margin-bottom:12px">点击八卦查看详情</p>
<div class="bagua" id="baguaCompass">
<div class="bagua-center">☯</div>
</div>
<div class="result-area" id="baguaDetail"></div>
</div>

<div class="card" id="flystarPanel" style="display:none">
<div class="input-group"><label>选择年份</label><select id="flyYear"></select></div>
<button class="btn" onclick="calcFlyStar()">查看飞星</button>
<div class="result-area" id="flyResult"></div>
</div>

<div class="card" id="fivePanel" style="display:none">
<div id="fiveDisplay"></div>
</div>

<div class="card" id="kuaPanel" style="display:none">
<div class="input-group"><label>出生年份</label><select id="kuaYear"></select></div>
<div class="input-group"><label>性别</label><select id="kuaGender"><option value="male">男</option><option value="female">女</option></select></div>
<button class="btn" onclick="calcKua()">计算命卦</button>
<div class="result-area" id="kuaResult"></div>
</div>

<div class="card" id="roomPanel" style="display:none">
<div id="roomDisplay"></div>
</div>

<div class="card" id="officePanel" style="display:none">
<div class="input-group"><label>出生年份</label><select id="officeYear"></select></div>
<button class="btn" onclick="calcOffice()">查看建议</button>
<div class="result-area" id="officeResult"></div>
</div>
</div>

<script src="../i18n.js" defer></script>
<script>
var baguaData=[
{name:'乾',symbol:'☰',element:'金',direction:'西北',color:'白',family:'父',body:'头',desc:'天、刚健、领导力',nature:'天'},
{name:'兑',symbol:'☱',element:'金',direction:'西',color:'白',family:'少女',body:'口',desc:'泽、喜悦、口才',nature:'泽'},
{name:'离',symbol:'☲',element:'火',direction:'南',color:'红',family:'中女',body:'目',desc:'火、光明、文化',nature:'火'},
{name:'震',symbol:'☳',element:'木',direction:'东',color:'绿',family:'长男',body:'足',desc:'雷、动力、行动',nature:'雷'},
{name:'巽',symbol:'☴',element:'木',direction:'东南',color:'绿',family:'长女',body:'股',desc:'风、柔顺、渗透',nature:'风'},
{name:'坎',symbol:'☵',element:'水',direction:'北',color:'黑',family:'中男',body:'耳',desc:'水、智慧、险阻',nature:'水'},
{name:'艮',symbol:'☶',element:'土',direction:'东北',color:'黄',family:'少男',body:'手',desc:'山、停止、稳定',nature:'山'},
{name:'坤',symbol:'☷',element:'土',direction:'西南',color:'黄',family:'母',body:'腹',desc:'地、柔顺、包容',nature:'地'}
];

var starNames=['一白贪狼','二黑巨门','三碧禄存','四绿文曲','五黄廉贞','六白武曲','七赤破军','八白左辅','九紫右弼'];
var starWx=['水','土','木','木','土','金','金','土','火'];
var starFortune=['吉','凶','凶','吉','凶','吉','凶','吉','吉'];
var starColors=['#2196f3','#333','#4caf50','#4caf50','#ff9800','#ffd700','#ffd700','#ff9800','#9c27b0'];

var roomTips=[
{room:'卧室',tips:['床头靠实墙，不宜靠窗','镜子不对床','横梁不压床','保持空气流通','颜色宜暖色调']},
{room:'厨房',tips:['灶台不对门','水火不相邻','保持干净整洁','通风良好','不宜在房屋中心']},
{room:'客厅',tips:['沙发靠实墙','光线充足明亮','财位放绿植','避免穿堂风','电视不宜过大']},
{room:'卫生间',tips:['门不对卧室门','保持干燥通风','不宜在房屋中心','马桶不外露','颜色宜浅色']},
{room:'书房',tips:['书桌面朝门','背后有靠山','光线充足','避免横梁压顶','颜色宜安静']},
{room:'玄关',tips:['保持整洁明亮','鞋柜不超过膝盖高度','不宜正对卧室门','可放绿植装饰','镜子不对大门']}
];

function init(){
var ys=[];for(var y=2030;y>=1940;y--)ys.push(y);
['flyYear','kuaYear','officeYear'].forEach(function(id){
var sel=document.getElementById(id);if(!sel)return;
ys.forEach(function(y){var o=document.createElement('option');o.value=y;o.textContent=y+'年';sel.appendChild(o)});
});
renderBagua();
renderFive();
renderRooms();
}

function switchTab(tab){
document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
event.target.classList.add('active');
['baguaPanel','flystarPanel','fivePanel','kuaPanel','roomPanel','officePanel'].forEach(function(id){document.getElementById(id).style.display='none'});
var map={bagua:'baguaPanel',flystar:'flystarPanel',five:'fivePanel',kua:'kuaPanel',room:'roomPanel',office:'officePanel'};
document.getElementById(map[tab]).style.display='block';
}

function renderBagua(){
var c=document.getElementById('baguaCompass');
var positions=[
{top:'-10px',left:'50%',transform:'translateX(-50%)'},
{top:'25%',right:'-10px'},
{bottom:'25%',right:'-10px'},
{bottom:'-10px',left:'50%',transform:'translateX(-50%)'},
{bottom:'25%',left:'-10px'},
{top:'25%',left:'-10px'},
{top:'10px',left:'15%'},
{top:'10px',right:'15%'}
];
baguaData.forEach(function(g,i){
var div=document.createElement('div');
div.className='bagua-item';
div.style.cssText='top:'+positions[i].top+';left:'+(positions[i].left||'')+';right:'+(positions[i].right||'')+';bottom:'+(positions[i].bottom||'')+';'+(positions[i].transform?'transform:'+positions[i].transform:'');
div.innerHTML='<div class="b-gua">'+g.symbol+'</div><div class="b-name">'+g.name+'</div><div class="b-dir">'+g.direction+'</div>';
div.onclick=function(){showBaguaDetail(g)};
c.appendChild(div);
});
}

function showBaguaDetail(g){
var r=document.getElementById('baguaDetail');
r.className='result-area show';
r.innerHTML='<div style="text-align:center;margin-bottom:12px"><span style="font-size:2rem">'+g.symbol+'</span> <span style="font-size:1.4rem;color:var(--gold)">'+g.name+'卦</span></div>'+
'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px">'+
'<div style="background:var(--bg);padding:10px;border-radius:8px;text-align:center"><div style="color:var(--text2);font-size:.75rem">五行</div><div style="color:var(--gold);font-size:1.1rem">'+g.element+'</div></div>'+
'<div style="background:var(--bg);padding:10px;border-radius:8px;text-align:center"><div style="color:var(--text2);font-size:.75rem">方位</div><div style="color:var(--gold);font-size:1.1rem">'+g.direction+'</div></div>'+
'<div style="background:var(--bg);padding:10px;border-radius:8px;text-align:center"><div style="color:var(--text2);font-size:.75rem">象征</div><div style="color:var(--gold);font-size:1.1rem">'+g.nature+'</div></div>'+
'<div style="background:var(--bg);padding:10px;border-radius:8px;text-align:center"><div style="color:var(--text2);font-size:.75rem">家庭</div><div style="color:var(--gold);font-size:1.1rem">'+g.family+'</div></div>'+
'</div>'+
'<div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border)">'+
'<strong>含义：</strong>'+g.desc+'</div>';
}

function calcFlyStar(){
var y=parseInt(document.getElementById('flyYear').value);
var base=(y-1900)%9;
var stars=[];
for(var i=0;i<9;i++){
var starNum=((base+i)%9)+1;
stars.push({num:starNum,name:starNames[starNum-1],wx:starWx[starNum-1],fortune:starFortune[starNum-1],color:starColors[starNum-1]});
}
var r=document.getElementById('flyResult');
r.className='result-area show';
var grid=['中宫','西北','西','东北','南','北','西南','东','东南'];
var html='<div style="text-align:center;color:var(--text2);margin-bottom:12px">'+y+'年 九宫飞星图</div>';
html+='<div class="flystar-grid">';
for(var i=0;i<9;i++){
html+='<div class="flystar-cell" style="border-left:3px solid '+stars[i].color+'">';
html+='<div class="fs-star" style="color:'+stars[i].color+'">'+stars[i].num+'</div>';
html+='<div class="fs-name">'+stars[i].name.split(' ')[0]+'</div>';
html+='<div style="font-size:.7rem;color:var(--text2)">'+grid[i]+'</div>';
html+='<div><span class="tag '+(stars[i].fortune==='吉'?'good':'bad')+'">'+stars[i].fortune+'</span></div></div>';
}
html+='</div>';
var badStars=[];
for(var i=0;i<9;i++){if(stars[i].fortune==='凶')badStars.push(stars[i].name.split(' ')[0]+'在'+grid[i])}
if(badStars.length>0){
html+='<div style="padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border);margin-top:12px">';
html+='<strong>⚠️ 需注意方位：</strong>'+badStars.join('、')+'</div>';
}
r.innerHTML=html;
}

function renderFive(){
var data=[
{el:'木',icon:'🌳',dir:'东',color:'绿',season:'春',desc:'生长、向上、仁慈'},
{el:'火',icon:'🔥',dir:'南',color:'红',season:'夏',desc:'热情、光明、礼仪'},
{el:'土',icon:'🏔️',dir:'中',color:'黄',season:'四季末',desc:'稳定、包容、信用'},
{el:'金',icon:'⚔️',dir:'西',color:'白',season:'秋',desc:'刚毅、收敛、义气'},
{el:'水',icon:'💧',dir:'北',color:'黑',season:'冬',desc:'流动、智慧、柔顺'}
];
var html='<h3 style="color:var(--blue);margin-bottom:12px">五行方位对照</h3>';
html+='<div class="five-dir">';
data.forEach(function(d){
html+='<div class="five-item" style="border-top:3px solid '+({绿:'#4caf50',红:'#f44336',黄:'#ff9800',白:'#ccc',黑:'#333'}[d.color])+'">';
html+='<div class="f-icon">'+d.icon+'</div>';
html+='<div class="f-el" style="color:'+({绿:'#4caf50',红:'#f44336',黄:'#ff9800',白:'#ccc',黑:'#888'}[d.color])+'">'+d.el+'</div>';
html+='<div class="f-dir">方位：'+d.dir+'</div>';
html+='<div class="f-color">颜色：'+d.color+' · 季节：'+d.season+'</div>';
html+='<div style="font-size:.8rem;color:var(--text2);margin-top:4px">'+d.desc+'</div></div>';
});
html+='</div>';
html+='<div style="margin-top:16px;padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border)">';
html+='<strong>相生：</strong>木生火，火生土，土生金，金生水，水生木<br>';
html+='<strong>相克：</strong>木克土，土克水，水克火，火克金，金克木</div>';
document.getElementById('fiveDisplay').innerHTML=html;
}

function calcKua(){
var y=parseInt(document.getElementById('kuaYear').value);
var g=document.getElementById('kuaGender').value;
var sum=0;var ys=String(y);
for(var i=0;i<ys.length;i++)sum+=parseInt(ys[i]);
while(sum>=10){var s=0;var ss=String(sum);for(var i=0;i<ss.length;i++)s+=parseInt(ss[i]);sum=s}
var kua;
if(g==='male'){kua=(10-sum)%9;if(kua===0)kua=9}
else{var idx=(sum+5)%9;if(idx===0)idx=9;kua=idx}
var kuaNames={1:'坎水',2:'坤土',3:'震木',4:'巽木',5:g==='male'?'坤土':'艮土',6:'乾金',7:'兑金',8:'艮土',9:'离火'};
var luckyDirs={
1:['东南','东','南','北'],
2:['东北','西','西北','西南'],
3:['南','北','东南','东'],
4:['北','南','东','东南'],
6:['西','东北','西南','西北'],
7:['西北','西南','东北','西'],
8:['西','西北','西南','东北'],
9:['东','东南','北','南']
};
var badDirs={
1:['西','西南','东北','西北'],
2:['南','北','东','东南'],
3:['西','西北','东北','西南'],
4:['东北','西南','西北','西'],
6:['北','南','东','东南'],
7:['东南','北','南','东'],
8:['东','东南','北','南'],
9:['西','西北','东北','西南']
};
var r=document.getElementById('kuaResult');
r.className='result-area show';
var html='<div style="text-align:center;margin:12px 0"><span style="font-size:2rem;color:var(--gold)">'+kua+'</span> <span style="font-size:1.2rem">'+kuaNames[kua]+'</span></div>';
html+='<div style="padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border)">';
html+='<div><strong>吉方位：</strong>'+luckyDirs[kua].map(function(d){return '<span class="tag good">'+d+'</span>'}).join('')+'</div>';
html+='<div style="margin-top:8px"><strong>凶方位：</strong>'+badDirs[kua].map(function(d){return '<span class="tag bad">'+d+'</span>'}).join('')+'</div>';
html+='</div>';
html+='<div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border)">';
html+='<strong>建议：</strong>床头、办公桌朝向吉方位，避免面向凶方位。大门朝向吉方位最佳。</div>';
r.innerHTML=html;
}

function renderRooms(){
var html='<h3 style="color:var(--blue);margin-bottom:12px">家居风水指南</h3>';
html+='<div class="room-grid">';
roomTips.forEach(function(r){
html+='<div class="room-card"><h4>🏠 '+r.room+'</h4><ul>';
r.tips.forEach(function(t){html+='<li>'+t+'</li>'});
html+='</ul></div>';
});
html+='</div>';
document.getElementById('roomDisplay').innerHTML=html;
}

function calcOffice(){
var y=parseInt(document.getElementById('officeYear').value);
var sum=0;var ys=String(y);
for(var i=0;i<ys.length;i++)sum+=parseInt(ys[i]);
while(sum>=10){var s=0;var ss=String(sum);for(var i=0;i<ss.length;i++)s+=parseInt(ss[i]);sum=s}
var deskDirs=['坐北朝南','坐南朝北','坐东朝西','坐西朝东','坐东南朝西北','坐西北朝东南','坐东北朝西南','坐西南朝东北'];
var dirIdx=sum%8;
var r=document.getElementById('officeResult');
r.className='result-area show';
var html='<div style="padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border)">';
html+='<div><strong>推荐办公桌朝向：</strong><span style="color:var(--gold);font-size:1.1rem">'+deskDirs[dirIdx]+'</span></div>';
