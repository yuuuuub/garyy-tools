<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>条形码校验工具中文版</title>
<meta name="description" content="在线条形码校验工具，支持EAN-13/UPC-A/Code128/Code39等多种格式校验码验证">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:16px;min-height:100vh;scroll-behavior:smooth}
.container{max-width:720px;margin:auto;padding-bottom:50px;text-align:center}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.input-group{margin-bottom:14px;text-align:left}
.input-group label{display:block;font-size:.82rem;color:var(--text2);margin-bottom:6px}
.input-group input{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.85rem;outline:none;font-family:monospace;letter-spacing:1px}
.input-group input:focus{border-color:var(--blue)}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.btn{padding:10px 24px;border:none;border-radius:var(--radius);cursor:pointer;font-size:.85rem;background:var(--blue);color:#fff;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn.green{background:var(--green)}
.result-card{padding:20px;border-radius:var(--radius);margin-bottom:16px}
.result-card.valid{background:rgba(35,134,54,.1);border:1px solid var(--green)}
.result-card.invalid{background:rgba(239,68,68,.1);border:1px solid var(--red)}
.result-card.unknown{background:rgba(139,148,158,.1);border:1px solid var(--border)}
.result-icon{font-size:2.5rem;margin-bottom:8px}
.result-title{font-size:1.1rem;font-weight:600;margin-bottom:4px}
.result-detail{font-size:.82rem;color:var(--text2);line-height:1.6;text-align:left}
.result-detail strong{color:var(--text)}
.info-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:.8rem;text-align:left}
.info-table td{padding:8px 10px;border-bottom:1px solid var(--border)}
.info-table td:first-child{color:var(--text2);width:120px}
.info-table td:last-child{font-family:monospace}
.format-tabs{display:flex;gap:0;margin-bottom:16px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.format-tab{flex:1;padding:8px;border:none;background:transparent;color:var(--text2);cursor:pointer;font-size:.78rem;transition:all .15s}
.format-tab.active{background:var(--blue);color:#fff}
.format-tab:hover:not(.active){background:rgba(59,130,246,.1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✅</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="条形码校验工具中文版">
<meta property="og:description" content="在线条形码校验工具，支持多种格式验证">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/barcode-verification-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header><h1>条形码校验工具</h1><p>验证条形码格式和校验码的正确性</p></header>
<div class="card">
<div class="format-tabs">
<button class="format-tab active" data-fmt="auto">自动检测</button>
<button class="format-tab" data-fmt="ean13">EAN-13</button>
<button class="format-tab" data-fmt="upca">UPC-A</button>
<button class="format-tab" data-fmt="itf14">ITF-14</button>
</div>
<div class="input-group">
<label>输入条形码数字</label>
<input type="text" id="barcode-input" placeholder="输入数字条形码..." value="4006381333931">
</div>
<div class="btn-row">
<button class="btn green" id="verify-btn">校验条形码</button>
</div>
</div>
<div id="result-area"></div>
<div class="card" style="text-align:left">
<div style="font-size:.82rem;color:var(--text2);line-height:1.8">
<strong style="color:var(--text)">支持的条形码格式：</strong><br>
• <strong>EAN-13</strong>：13位数字（前12位+1位校验码）<br>
• <strong>UPC-A</strong>：12位数字（前11位+1位校验码）<br>
• <strong>ITF-14</strong>：14位数字（前13位+1位校验码）<br>
• <strong>EAN-8</strong>：8位数字（前7位+1位校验码）<br>
• 校验码计算规则：加权求和后取模10
</div>
</div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const input=$('barcode-input');
let selectedFormat='auto';

function calcEAN13Check(digits){
  let sum=0;
  for(let i=0;i<12;i++) sum+=digits[i]*(i%2===0?1:3);
  return(10-(sum%10))%10;
}

function calcUPCACheck(digits){
  let sum=0;
  for(let i=0;i<11;i++) sum+=digits[i]*(i%2===0?3:1);
  return(10-(sum%10))%10;
}

function calcITF14Check(digits){
  let sum=0;
  for(let i=0;i<13;i++) sum+=digits[i]*(i%2===0?3:1);
  return(10-(sum%10))%10;
}

function calcEAN8Check(digits){
  let sum=0;
  for(let i=0;i<7;i++) sum+=digits[i]*(i%2===0?3:1);
  return(10-(sum%10))%10;
}

function detectFormat(code){
  if(/^\d{13}$/.test(code))return 'ean13';
  if(/^\d{12}$/.test(code))return 'upca';
  if(/^\d{14}$/.test(code))return 'itf14';
  if(/^\d{8}$/.test(code))return 'ean8';
  return null;
}

function getFormatName(fmt){
  return{ean13:'EAN-13',upca:'UPC-A',itf14:'ITF-14',ean8:'EAN-8'}[fmt]||fmt;
}

function verify(){
  const code=input.value.replace(/[^0-9]/g,'');
  input.value=code;
  const area=$('result-area');

  if(!code){area.innerHTML='';return;}

  const fmt=selectedFormat==='auto'?detectFormat(code):selectedFormat;
  if(!fmt){
    area.innerHTML='<div class="result-card unknown"><div class="result-icon">❓</div><div class="result-title">无法识别格式</div><div class="result-detail">输入的数字长度不符合任何已知条形码格式。<br>请输入8、12、13或14位数字。</div></div>';
    return;
  }

  const digits=code.split('').map(Number);
  let expectedCheck,actualCheck;
  const details={};

  switch(fmt){
    case 'ean13':
      expectedCheck=calcEAN13Check(digits);
      actualCheck=digits[12];
      details['国家/地区代码']=code.substring(0,3);
      details['厂商代码']=code.substring(3,7);
      details['商品代码']=code.substring(7,12);
      details['校验码(输入)']=actualCheck;
      details['校验码(计算)']=expectedCheck;
      break;
    case 'upca':
      expectedCheck=calcUPCACheck(digits);
      actualCheck=digits[11];
      details['系统数字']=digits[0];
      details['厂商代码']=code.substring(1,6);
      details['产品代码']=code.substring(6,11);
      details['校验码(输入)']=actualCheck;
      details['校验码(计算)']=expectedCheck;
      break;
    case 'itf14':
      expectedCheck=calcITF14Check(digits);
      actualCheck=digits[13];
      details['包装指示符']=digits[0];
      details['EAN/UCC-13代码']=code.substring(1,14);
      details['校验码(输入)']=actualCheck;
      details['校验码(计算)']=expectedCheck;
      break;
    case 'ean8':
      expectedCheck=calcEAN8Check(digits);
      actualCheck=digits[7];
      details['国家/地区代码']=code.substring(0,3);
      details['产品代码']=code.substring(3,7);
      details['校验码(输入)']=actualCheck;
      details['校验码(计算)']=expectedCheck;
      break;
  }

  const isValid=expectedCheck===actualCheck;
  let detailHtml='<table class="info-table">';
  for(const[k,v] of Object.entries(details)){
    detailHtml+='<tr><td>'+k+'</td><td>'+v+'</td></tr>';
  }
  detailHtml+='<tr><td>校验结果</td><td style="color:'+(isValid?'var(--green)':'var(--red)')+';font-weight:700">'+(isValid?'✓ 通过':'✗ 失败')+'</td></tr>';
  detailHtml+='</table>';

  area.innerHTML='<div class="result-card '+(isValid?'valid':'invalid')+'"><div class="result-icon">'+(isValid?'✅':'❌')+'</div><div class="result-title">'+getFormatName(fmt)+' 校验'+(isValid?'通过':'失败')+'</div><div class="result-detail">条形码格式: <strong>'+getFormatName(fmt)+'</strong> ('+code.length+'位)<br>'+detailHtml+'</div></div>';
}

document.querySelectorAll('.format-tab').forEach(function(tab){
  tab.addEventListener('click',function(){
    document.querySelectorAll('.format-tab').forEach(t=>t.classList.remove('active'));
    this.classList.add('active');
    selectedFormat=this.dataset.fmt;
    verify();
  });
});

$('verify-btn').addEventListener('click',verify);
input.addEventListener('input',verify);

verify();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
