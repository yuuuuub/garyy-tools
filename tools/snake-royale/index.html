<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>贪吃蛇大逃杀</title>
<meta name="description" content="贪吃蛇大逃杀，多人竞技最后存活者获胜">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;flex-direction:columnpadding:16px;scroll-behavior:smooth;}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100}
#overlay h1{font-size:36px;color:var(--accent);margin-bottom:10px}
#overlay p{font-size:14px;color:#8b949e;margin-bottom:20px}
.btn{background:var(--accent);color:var(--text);border:none;padding:10px 28px;font-size:15px;border-radius:6px;cursor:pointer;font-family:monospace}
.btn:hover{filter:brightness(1.2)}
canvas{display:block;border:1px solid var(--border);background:var(--bg);border-radius:4px}
#hud{display:flex;gap:20px;margin:10px 0;font-size:13px;color:#8b949e}
#hud b{color:var(--accent)}
.snake-list{position:fixed;right:10px;top:60px;font-size:11px;color:#8b949e;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px;max-height:400px;overflow:hidden}
.snake-list .alive{color:var(--accent)}
.snake-list .dead{color:#484f58;text-decoration:line-through}
.snake-list .you{color:#f00;font-weight:bold}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="贪吃蛇大逃杀">
  <meta property="og:description" content="贪吃蛇大逃杀，多人竞技最后存活者获胜">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/snake-royale/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div id="overlay">
<h1>贪吃蛇大逃杀</h1>
<p>30条蛇同场竞技，最后存活者获胜！</p>
<p style="font-size:12px">方向键/WASD控制</p>
<button class="btn" onclick="startGame()">进入战场</button>
</div>
<div id="hud">
存活: <b id="alive">30</b> / 30 |
击杀: <b id="kills">0</b> |
长度: <b id="mylen">3</b>
</div>
<canvas id="gc" width="600" height="600"></canvas>
<div class="snake-list" id="snakeList"></div>
<script>
const W=600,H=600,G=15,COLS=W/G,ROWS=H/G;
const cv=document.getElementById('gc'),ctx=cv.getContext('2d');
const SNAKE_COUNT=30;
let snakes=[],foods=[],player,gameOn,timer,speed,killCount;

const AI_COLORS=['#ef4444','#f97316','#eab308','#84cc16','#22c55e','#14b8a6','#06b6d4','#8b5cf6','#d946ef','#ec4899','#f43f5e','#fb923c','#a3e635','#4ade80','#2dd4bf','#38bdf8','#a78bfa','#e879f9','#f472b6','#fb7185','#facc15','#34d399','#22d3ee','#818cf8','#c084fc','#f9a8d4','#fda4af','#fed7aa','#fde047','#bbf7d0'];

function initSnake(isPlayer){
const x=Math.floor(Math.random()*(COLS-10))+5;
const y=Math.floor(Math.random()*(ROWS-10))+5;
const dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
const dir=dirs[Math.floor(Math.random()*4)];
const body=[];
for(let i=0;i<3;i++)body.push({x:x-dir.x*i,y:y-dir.y*i});
return{
body,dir,
color:isPlayer?'#3b82f6':AI_COLORS[Math.floor(Math.random()*AI_COLORS.length)],
alive:true,
isPlayer,
targetDir:{...dir},
aiTimer:0,
aiTarget:null
};
}

function spawnFood(){
if(foods.length<50){
foods.push({x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)});
}
}

function moveSnake(s){
const head={x:s.body[0].x+s.dir.x,y:s.body[0].y+s.dir.y};
s.body.unshift(head);
const ate=foods.findIndex(f=>f.x===head.x&&f.y===head.y);
if(ate>=0){foods.splice(ate,1);spawnFood()}
else s.body.pop();
}

function aiControl(s){
if(s.isPlayer||!s.alive)return;
s.aiTimer++;
if(s.aiTimer<3)return;
s.aiTimer=0;
const head=s.body[0];
let bestDir=s.dir;
let bestScore=-999;
const dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
dirs.forEach(d=>{
if(d.x===-s.dir.x&&d.y===-s.dir.y)return;
const nx=head.x+d.x,ny=head.y+d.y;
if(nx<0||nx>=COLS||ny<0||ny>=ROWS)return;
let sc=0;
if(snakes.some(o=>o!==s&&o.alive&&o.body.some(b=>b.x===nx&&b.y===ny)))sc-=100;
foods.forEach(f=>{sc-=Math.abs(f.x-nx)+Math.abs(f.y-ny)});
const allBodies=snakes.flatMap(o=>o.body);
if(allBodies.some(b=>b.x===nx&&b.y===ny))sc-=50;
if(nx<=2||nx>=COLS-3||ny<=2||ny>=ROWS-3)sc-=30;
if(sc>bestScore){bestScore=sc;bestDir=d}
});
s.dir=bestDir;
}

function checkDeaths(){
snakes.forEach(s=>{
if(!s.alive)return;
const h=s.body[0];
if(h.x<0||h.x>=COLS||h.y<0||h.y>=ROWS){s.alive=false;return}
snakes.forEach(other=>{
if(other===s||!other.alive)return;
if(other.body.some(b=>b.x===h.x&&b.y===h.y)){
s.alive=false;
if(other.isPlayer)killCount++;
}
});
});
}

function draw(){
ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);
foods.forEach(f=>{ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(f.x*G+G/2,f.y*G+G/2,4,0,Math.PI*2);ctx.fill()});
snakes.forEach(s=>{
if(!s.alive)return;
ctx.fillStyle=s.color;
s.body.forEach((b,i)=>{
ctx.globalAlpha=i===0?1:0.7;
ctx.fillRect(b.x*G+1,b.y*G+1,G-2,G-2);
});
ctx.globalAlpha=1;
if(s.isPlayer){
ctx.strokeStyle='#fff';ctx.lineWidth=2;
ctx.strokeRect(s.body[0].x*G,s.body[0].y*G,G,G);
}
});
}

function updateHUD(){
const aliveCount=snakes.filter(s=>s.alive).length;
document.getElementById('alive').textContent=aliveCount;
document.getElementById('kills').textContent=killCount;
document.getElementById('mylen').textContent=player?.body.length||0;
const list=document.getElementById('snakeList');
const sorted=[...snakes].sort((a,b)=>b.body.length-a.body.length);
list.innerHTML=sorted.slice(0,15).map(s=>{
const cls=s.isPlayer?'you':s.alive?'alive':'dead';
return `<div class="${cls}">${s.isPlayer?'★ ':''}${s.alive?'':'✕ '}${s.body.length}</div>`;
}).join('');
}

function gameLoop(){
if(!gameOn)return;
const aliveCount=snakes.filter(s=>s.alive).length;
if(aliveCount<=1){endGame();return}
snakes.forEach(aiControl);
snakes.filter(s=>s.alive).forEach(moveSnake);
checkDeaths();
draw();updateHUD();
timer=setTimeout(gameLoop,100);
}

function startGame(){
document.getElementById('overlay').style.display='none';
snakes=[];foods=[];killCount=0;
for(let i=0;i<SNAKE_COUNT;i++)snakes.push(initSnake(i===0));
player=snakes[0];
for(let i=0;i<30;i++)spawnFood();
gameOn=true;gameLoop();
}

function endGame(){
gameOn=false;
const winner=snakes.find(s=>s.alive);
const ov=document.getElementById('overlay');ov.style.display='flex';
if(player.alive){
ov.innerHTML=`<h2>大吉大利！</h2><p>你是最后的幸存者！击杀: ${killCount} | 长度: ${player.body.length}</p><button class="btn" onclick="startGame()">再来一局</button>`;
}else{
ov.innerHTML=`<h2>你被淘汰了</h2><p>击杀: ${killCount} | 长度: ${player.body.length}</p><p>最后存活: 长度${winner?.body.length||0}</p><button class="btn" onclick="startGame()">再来一局</button>`;
}
}

document.addEventListener('keydown',e=>{
if(!gameOn||!player.alive)return;
e.preventDefault();
const d=player.dir;
if((e.key==='ArrowUp'||e.key==='w')&&d.y!==1)player.dir={x:0,y:-1};
else if((e.key==='ArrowDown'||e.key==='s')&&d.y!==-1)player.dir={x:0,y:1};
else if((e.key==='ArrowLeft'||e.key==='a')&&d.x!==1)player.dir={x:-1,y:0};
else if((e.key==='ArrowRight'||e.key==='d')&&d.x!==-1)player.dir={x:1,y:0};
});
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
