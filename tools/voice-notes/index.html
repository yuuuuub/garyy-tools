<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语音记事本 - Voice Notes</title>
<meta name="description" content="语音记事本，录音记录语音笔记和备忘">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {--bg: #0f0f0f;
--bg2: #1a1a1a;
--bg3: #252525;
--bg4: #2e2e2e;
--border: #333;
--text: #e0e0e0;
--text2: #999;
--accent: #60a5fa;
--accent2: #3b82f6;
--danger: #ef4444;
--danger2: #dc2626;
--success: #22c55e;
--success2: #16a34a;
--warning: #f59e0b;
--pin: #fbbf24}
body {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
line-height: 1.6}
.app { max-width: 800px; margin: 0 auto; padding: 16px; }
header {text-align: center; padding: 24px 0 16px; border-bottom: 1px solid var(--border);
margin-bottom: 20px}
header h1 { font-size: 1.8rem; color: var(--accent); font-weight: 700; letter-spacing: 0.02em; }
header p { color: var(--text2); font-size: 0.85rem; margin-top: 4px; }
.toolbar {display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 20px}
.search-box {flex: 1; min-width: 180px; padding: 10px 14px; border-radius: 8px;
border: 1px solid var(--border); background: var(--bg2); color: var(--text);
font-size: 0.95rem; outline: none; transition: border-color 0.2s}
.search-box:focus { border-color: var(--accent); }
.search-box::placeholder { color: var(--text2); }
.filter-tags {display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px}
.tag-chip {padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer;
border: 1px solid var(--border); background: var(--bg2); color: var(--text2);
transition: all 0.2s; white-space: nowrap}
.tag-chip:hover, .tag-chip.active { background: var(--accent2); color: var(--text); border-color: var(--accent2); }
.record-section {background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
padding: 20px; margin-bottom: 24px}
.record-section h2 { font-size: 1.1rem; margin-bottom: 12px; color: var(--accent); }
.record-controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.btn {padding: 9px 18px; border-radius: 8px; border: none; cursor: pointer;
font-size: 0.9rem; font-weight: 500; transition: all 0.2s; display: inline-flex;
align-items: center; gap: 6px; white-space: nowrap}
.btn-primary { background: var(--accent); color: #000; }
.btn-primary:hover { background: var(--accent2); }
.btn-danger { background: var(--danger); color: var(--text); }
.btn-danger:hover { background: var(--danger2); }
.btn-success { background: var(--success); color: #000; }
.btn-success:hover { background: var(--success2); }
.btn-ghost {background: transparent; border: 1px solid var(--border); color: var(--text)}
.btn-ghost:hover { background: var(--bg3); }
.btn-sm { padding: 5px 12px; font-size: 0.78rem; }
.recording-status {display: none; align-items: center; gap: 8px; padding: 8px 0; color: var(--danger);
font-weight: 600}
.recording-status.active { display: flex; }
.rec-indicator {width: 12px; height: 12px; border-radius: 50%; background: var(--danger);
animation: pulse 1s infinite}
@keyframes pulse {0%, 100% { opacity: 1; transform: scale(1); }
50% { opacity: 0.4; transform: scale(1.3); }}
.input-group { margin-bottom: 12px; }
.input-group label { display: block; font-size: 0.85rem; color: var(--text2); margin-bottom: 4px; }
.input-group input, .input-group textarea {width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
background: var(--bg3); color: var(--text); font-size: 0.95rem;
font-family: inherit; outline: none; resize: vertical; transition: border-color 0.2s}
.input-group input:focus, .input-group textarea:focus { border-color: var(--accent); }
.input-group textarea { min-height: 80px; }
.tag-select {display: flex; gap: 6px; flex-wrap: wrap}
.tag-option {padding: 4px 12px; border-radius: 20px; font-size: 0.78rem; cursor: pointer;
border: 1px solid var(--border); background: var(--bg3); color: var(--text2);
transition: all 0.2s; white-space: nowrap}
.tag-option:hover { border-color: var(--accent); color: var(--text); }
.tag-option.selected { background: var(--accent2); color: var(--text); border-color: var(--accent2); }
.live-text {background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
padding: 12px; min-height: 48px; color: var(--text2); font-style: italic;
font-size: 0.9rem; white-space: pre-wrap; word-break: break-word;
margin-top: 10px}
.live-text.has-content { color: var(--text); font-style: normal; }
.notes-list { }
.date-group { margin-bottom: 20px; }
.date-header {font-size: 0.85rem; color: var(--text2); padding: 6px 0; border-bottom: 1px solid var(--border);
margin-bottom: 8px; font-weight: 600}
.note-card {background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
padding: 14px 16px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s;
position: relative}
.note-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.note-card.pinned { border-left: 3px solid var(--pin); }
.note-card .note-header {display: flex; align-items: flex-start; justify-content: space-between; gap: 8px}
.note-card .note-title {font-weight: 600; font-size: 1rem; color: var(--text); flex: 1;
overflow: hidden; text-overflow: ellipsis; white-space: nowrap}
.note-card .note-meta {font-size: 0.75rem; color: var(--text2); margin-top: 4px; display: flex;
gap: 10px; flex-wrap: wrap; align-items: center}
.note-card .note-preview {font-size: 0.88rem; color: var(--text2); margin-top: 6px;
display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
overflow: hidden}
.note-card .note-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.note-card .note-tag {font-size: 0.7rem; padding: 2px 8px; border-radius: 10px;
background: var(--bg3); color: var(--accent); white-space: nowrap}
.note-card .pin-icon {color: var(--pin); font-size: 1.1rem; flex-shrink: 0}
.note-card .note-actions {display: flex; gap: 4px; align-items: center}
.note-card .note-actions button {background: none; border: none; color: var(--text2); cursor: pointer;
padding: 4px; border-radius: 4px; font-size: 0.85rem; transition: all 0.2s}
.note-card .note-actions button:hover { color: var(--text); background: var(--bg3); }
.empty-state {text-align: center; padding: 60px 20px; color: var(--text2)}
.empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
.empty-state p { font-size: 0.95rem; }
.modal-overlay {display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
z-index: 100; justify-content: center; align-items: flex-start;
padding: 40px 16px; overflow-y: auto}
.modal-overlay.active { display: flex; }
.modal {background: var(--bg2); border: 1px solid var(--border); border-radius: 14px;
padding: 24px; width: 100%; max-width: 600px}
.modal h3 { color: var(--accent); margin-bottom: 16px; font-size: 1.1rem; }
.modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.toast {position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
background: var(--bg3); color: var(--text); border: 1px solid var(--border);
padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; z-index: 200;
opacity: 0; transition: opacity 0.3s; pointer-events: none}
.toast.show { opacity: 1; }
.info-banner {background: var(--bg3); border: 1px solid var(--warning); border-radius: 8px;
padding: 10px 14px; font-size: 0.8rem; color: var(--warning); margin-bottom: 16px;
display: flex; align-items: flex-start; gap: 8px}
.info-banner .info-icon { flex-shrink: 0; font-size: 1rem; }
@media (max-width: 600px) {.app { padding: 10px; }
header h1 { font-size: 1.4rem; }
.toolbar { flex-direction: column; }
.record-controls { flex-direction: column; align-items: stretch; }
.btn { justify-content: center; }}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="语音记事本 - Voice Notes">
  <meta property="og:description" content="语音记事本，录音记录语音笔记和备忘">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/voice-notes/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="app">
  <header>
    <h1>语音记事本</h1>
    <p>Voice Notes — 语音转文字，智能记录你的想法</p>
  </header>

  <div class="info-banner">
    <span class="info-icon">&#9432;</span>
    <span>语音识别功能需要 Chrome / Edge 浏览器及网络连接。如不可用，可手动输入笔记内容。</span>
  </div>

  <div class="toolbar">
    <input type="text" class="search-box" id="searchInput" placeholder="搜索笔记...">
    <button class="btn btn-ghost btn-sm" onclick="toggleRecordSection()" id="toggleRecordBtn">+ 新建笔记</button>
    <button class="btn btn-ghost btn-sm" onclick="exportNotes()">导出</button>
  </div>

  <div class="filter-tags" id="tagFilters">
    <span class="tag-chip active" data-tag="all">全部</span>
    <span class="tag-chip" data-tag="工作">工作</span>
    <span class="tag-chip" data-tag="生活">生活</span>
    <span class="tag-chip" data-tag="学习">学习</span>
    <span class="tag-chip" data-tag="创意">创意</span>
    <span class="tag-chip" data-tag="其他">其他</span>
  </div>

  <div class="record-section" id="recordSection">
    <h2>录制新笔记</h2>
    <div class="record-controls">
      <button class="btn btn-danger" id="recordBtn" onclick="toggleRecording()">
        <span id="recordBtnIcon">&#127908;</span> <span id="recordBtnText">开始录音</span>
      </button>
      <button class="btn btn-ghost" id="pauseBtn" onclick="togglePause()" disabled>
        <span id="pauseBtnText">暂停</span>
      </button>
      <button class="btn btn-success" id="finalizeBtn" onclick="finalizeNote()" disabled>确认保存</button>
    </div>
    <div class="recording-status" id="recStatus">
      <span class="rec-indicator"></span>
      <span id="recStatusText">正在录音...</span>
    </div>
    <div class="live-text" id="liveText">录音内容将实时显示在这里...</div>
    <div style="margin-top:12px;">
      <div class="input-group">
        <label>笔记标题</label>
        <input type="text" id="noteTitle" placeholder="输入笔记标题...">
      </div>
      <div class="input-group">
        <label>标签</label>
        <div class="tag-select" id="noteTags">
          <span class="tag-option" data-tag="工作">工作</span>
          <span class="tag-option" data-tag="生活">生活</span>
          <span class="tag-option" data-tag="学习">学习</span>
          <span class="tag-option" data-tag="创意">创意</span>
          <span class="tag-option" data-tag="其他">其他</span>
        </div>
      </div>
    </div>
    <div class="input-group">
      <label>手动输入 / 编辑内容</label>
      <textarea id="noteContent" placeholder="直接输入或编辑识别到的文本..."></textarea>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-primary" onclick="saveManualNote()">保存笔记</button>
      <button class="btn btn-ghost" id="speakPreviewBtn" onclick="speakPreview()">朗读内容</button>
    </div>
  </div>

  <div class="notes-list" id="notesList"></div>
  <div class="empty-state" id="emptyState">
    <div class="icon">&#128172;</div>
    <p>还没有笔记</p>
    <p style="font-size:0.85rem;">点击「新建笔记」开始记录你的想法</p>
  </div>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>编辑笔记</h3>
    <div class="input-group">
      <label>标题</label>
      <input type="text" id="editTitle">
    </div>
    <div class="input-group">
      <label>标签</label>
      <div class="tag-select" id="editTags">
        <span class="tag-option" data-tag="工作">工作</span>
        <span class="tag-option" data-tag="生活">生活</span>
        <span class="tag-option" data-tag="学习">学习</span>
        <span class="tag-option" data-tag="创意">创意</span>
        <span class="tag-option" data-tag="其他">其他</span>
      </div>
    </div>
    <div class="input-group">
      <label>内容</label>
      <textarea id="editContent" style="min-height:150px;"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger btn-sm" onclick="deleteEditNote()">删除</button>
      <button class="btn btn-ghost btn-sm" onclick="closeEditModal()">取消</button>
      <button class="btn btn-primary btn-sm" onclick="saveEditNote()">保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <h3>确认删除</h3>
    <p style="color:var(--text2);margin-bottom:16px;">确定要删除这条笔记吗？此操作不可恢复。</p>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm" onclick="closeConfirmModal()">取消</button>
      <button class="btn btn-danger btn-sm" onclick="confirmDelete()">删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'voice_notes_data';
let notes = [];
let currentFilter = 'all';
let editNoteId = null;
let deleteNoteId = null;
function loadNotes() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    notes = raw ? JSON.parse(raw) : [];
  } catch (e) {
    notes = [];
  }
}
function saveNotes() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
}
function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).substring(2, 8);
}
function addNote(title, content, tags) {
  const note = {
    id: generateId(),
    title: title || '无标题',
    content: content || '',
    tags: tags || [],
    pinned: false,
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  notes.unshift(note);
  saveNotes();
  return note;
}
function updateNote(id, updates) {
  const idx = notes.findIndex(n => n.id === id);
  if (idx === -1) return;
  notes[idx] = { ...notes[idx], ...updates, updatedAt: new Date().toISOString() };
  saveNotes();
}
function deleteNote(id) {
  notes = notes.filter(n => n.id !== id);
  saveNotes();
}
function togglePin(id) {
  const note = notes.find(n => n.id === id);
  if (note) {
    note.pinned = !note.pinned;
    saveNotes();
  }
}
function getFilteredNotes() {
  let filtered = [...notes];
  if (currentFilter !== 'all') {
    filtered = filtered.filter(n => n.tags && n.tags.includes(currentFilter));
  }
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  if (query) {
    filtered = filtered.filter(n =>
      n.title.toLowerCase().includes(query) ||
      n.content.toLowerCase().includes(query) ||
      (n.tags && n.tags.some(t => t.toLowerCase().includes(query)))
    );
  }
  filtered.sort((a, b) => {
    if (a.pinned && !b.pinned) return -1;
    if (!a.pinned && b.pinned) return 1;
    return new Date(b.createdAt) - new Date(a.createdAt);
  });
  return filtered;
}
function formatDate(isoStr) {
  const d = new Date(isoStr);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const yesterday = new Date(today.getTime() - 86400000);
  const targetDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  if (targetDate.getTime() === today.getTime()) return '今天';
  if (targetDate.getTime() === yesterday.getTime()) return '昨天';
  const diffDays = Math.floor((today - targetDate) / 86400000);
  if (diffDays < 7) return `${diffDays}天前`;
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function formatTime(isoStr) {
  const d = new Date(isoStr);
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function groupByDate(notesList) {
  const groups = {};
  for (const n of notesList) {
    const dateKey = formatDate(n.createdAt);
    if (!groups[dateKey]) groups[dateKey] = [];
    groups[dateKey].push(n);
  }
  return groups;
}
function renderNotes() {
  const container = document.getElementById('notesList');
  const emptyState = document.getElementById('emptyState');
  const filtered = getFilteredNotes();
  if (filtered.length === 0) {
    container.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';
  const groups = groupByDate(filtered);
  let html = '';
  for (const [dateLabel, groupNotes] of Object.entries(groups)) {
    html += `<div class="date-group"><div class="date-header">${dateLabel}</div>`;
    for (const note of groupNotes) {
      const tagsHtml = (note.tags || []).map(t => `<span class="note-tag">${escHtml(t)}</span>`).join('');
      const pinIcon = note.pinned ? '<span class="pin-icon" title="已置顶">&#128204;</span>' : '';
      const preview = note.content.substring(0, 120) + (note.content.length > 120 ? '...' : '');
      html += `
        <div class="note-card ${note.pinned ? 'pinned' : ''}" data-id="${note.id}">
          <div class="note-header">
            <span class="note-title">${escHtml(note.title)}</span>
            <div class="note-actions">
              <button title="${note.pinned ? '取消置顶' : '置顶'}" onclick="event.stopPropagation(); doTogglePin('${note.id}')">${pinIcon}</button>
              <button title="朗读" onclick="event.stopPropagation(); speakNote('${note.id}')">&#128266;</button>
            </div>
          </div>
          <div class="note-preview">${escHtml(preview)}</div>
          <div class="note-meta">
            <span>${formatTime(note.createdAt)}</span>
            <div class="note-tags">${tagsHtml}</div>
          </div>
        </div>`;
    }
    html += '</div>';
  }
  container.innerHTML = html;
  container.querySelectorAll('.note-card').forEach(card => {
    card.addEventListener('click', () => openEditModal(card.dataset.id));
  });
}
function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
let recognition = null;
let isRecording = false;
let isPaused = false;
let finalTranscript = '';
let interimTranscript = '';
function initRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    showToast('您的浏览器不支持语音识别，请使用 Chrome 或 Edge 浏览器');
    return null;
  }
  const rec = new SpeechRecognition();
  rec.lang = 'zh-CN';
  rec.interimResults = true;
  rec.continuous = true;
  rec.onresult = (event) => {
    interimTranscript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const result = event.results[i];
      if (result.isFinal) {
        finalTranscript += result[0].transcript;
      } else {
        interimTranscript += result[0].transcript;
      }
    }
    updateLiveText(finalTranscript + interimTranscript);
    document.getElementById('noteContent').value = finalTranscript + interimTranscript;
    document.getElementById('finalizeBtn').disabled = !finalTranscript.trim();
  };
  rec.onerror = (event) => {
    if (event.error === 'not-allowed') {
      showToast('麦克风权限被拒绝，请在浏览器设置中允许麦克风访问');
    } else if (event.error === 'no-speech') {
    } else if (event.error === 'network') {
      showToast('网络连接失败，语音识别需要互联网连接');
    } else {
      showToast(`语音识别错误: ${event.error}`);
    }
  };
  rec.onend = () => {
    if (isRecording && !isPaused) {
      try { rec.start(); } catch (e) {  }
    }
  };
  return rec;
}
function toggleRecording() {
  if (isRecording) {
    stopRecording();
  } else {
    startRecording();
  }
}
function startRecording() {
  if (!recognition) {
    recognition = initRecognition();
  }
  if (!recognition) return;
  finalTranscript = '';
  interimTranscript = '';
  document.getElementById('noteContent').value = '';
  updateLiveText('');
  try {
    recognition.start();
    isRecording = true;
    updateRecordUI();
    showToast('开始录音...');
  } catch (e) {
    showToast('启动录音失败，请刷新页面重试');
  }
}
function stopRecording() {
  isRecording = false;
  isPaused = false;
  if (recognition) {
    try { recognition.stop(); } catch (e) {  }
  }
  updateRecordUI();
}
function togglePause() {
  if (!isRecording) return;
  if (isPaused) {
    try { recognition.start(); } catch (e) {  }
    isPaused = false;
  } else {
    try { recognition.stop(); } catch (e) {  }
    isPaused = true;
  }
  updateRecordUI();
}
function updateRecordUI() {
  const recordBtn = document.getElementById('recordBtn');
  const recordBtnIcon = document.getElementById('recordBtnIcon');
  const recordBtnText = document.getElementById('recordBtnText');
  const pauseBtn = document.getElementById('pauseBtn');
  const pauseBtnText = document.getElementById('pauseBtnText');
  const recStatus = document.getElementById('recStatus');
  const recStatusText = document.getElementById('recStatusText');
  if (isRecording) {
    recordBtnText.textContent = '停止录音';
    pauseBtn.disabled = false;
    recStatus.classList.add('active');
    if (isPaused) {
      recStatusText.textContent = '已暂停';
      recStatus.style.color = 'var(--warning)';
      pauseBtnText.textContent = '继续';
    } else {
      recStatusText.textContent = '正在录音...';
      recStatus.style.color = 'var(--danger)';
      pauseBtnText.textContent = '暂停';
    }
  } else {
    recordBtnText.textContent = '开始录音';
    pauseBtn.disabled = true;
    pauseBtnText.textContent = '暂停';
    recStatus.classList.remove('active');
  }
  document.getElementById('finalizeBtn').disabled = !finalTranscript.trim();
}
function updateLiveText(text) {
  const el = document.getElementById('liveText');
  if (text.trim()) {
    el.textContent = text;
    el.classList.add('has-content');
  } else {
    el.textContent = '录音内容将实时显示在这里...';
    el.classList.remove('has-content');
  }
}
function finalizeNote() {
  const content = document.getElementById('noteContent').value.trim();
  if (!content) {
    showToast('请先录制或输入内容');
    return;
  }
  const title = document.getElementById('noteTitle').value.trim();
  const tags = getSelectedTags('noteTags');
  addNote(title || content.substring(0, 30), content, tags);
  stopRecording();
  resetRecordForm();
  renderNotes();
  showToast('笔记已保存');
}
function saveManualNote() {
  const content = document.getElementById('noteContent').value.trim();
  if (!content) {
    showToast('请输入笔记内容');
    return;
  }
  const title = document.getElementById('noteTitle').value.trim();
  const tags = getSelectedTags('noteTags');
  addNote(title || content.substring(0, 30), content, tags);
  stopRecording();
  resetRecordForm();
  renderNotes();
  showToast('笔记已保存');
}
function resetRecordForm() {
  document.getElementById('noteTitle').value = '';
  document.getElementById('noteContent').value = '';
  updateLiveText('');
  finalTranscript = '';
  interimTranscript = '';
  document.getElementById('finalizeBtn').disabled = true;
  document.querySelectorAll('#noteTags .tag-option').forEach(el => el.classList.remove('selected'));
}
function getSelectedTags(containerId) {
  const tags = [];
  document.querySelectorAll(`#${containerId} .tag-option.selected`).forEach(el => {
    tags.push(el.dataset.tag);
  });
  return tags;
}
function setSelectedTags(containerId, tags) {
  const container = document.getElementById(containerId);
  container.querySelectorAll('.tag-option').forEach(el => {
    if (tags.includes(el.dataset.tag)) {
      el.classList.add('selected');
    } else {
      el.classList.remove('selected');
    }
  });
}
let speaking = false;
function speakNote(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  if (speaking) {
    window.speechSynthesis.cancel();
    speaking = false;
    return;
  }
  const utterance = new SpeechSynthesisUtterance(note.content);
  utterance.lang = 'zh-CN';
  utterance.rate = 1.0;
  utterance.pitch = 1.0;
  utterance.onstart = () => { speaking = true; };
  utterance.onend = () => { speaking = false; };
  utterance.onerror = () => { speaking = false; };
  window.speechSynthesis.speak(utterance);
}
function speakPreview() {
  const content = document.getElementById('noteContent').value.trim();
  if (!content) {
    showToast('没有可朗读的内容');
    return;
  }
  if (speaking) {
    window.speechSynthesis.cancel();
    speaking = false;
    return;
  }
  const utterance = new SpeechSynthesisUtterance(content);
  utterance.lang = 'zh-CN';
  utterance.rate = 1.0;
  utterance.onstart = () => { speaking = true; };
  utterance.onend = () => { speaking = false; };
  utterance.onerror = () => { speaking = false; };
  window.speechSynthesis.speak(utterance);
}
function openEditModal(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  editNoteId = id;
  document.getElementById('editTitle').value = note.title;
  document.getElementById('editContent').value = note.content;
  setSelectedTags('editTags', note.tags || []);
  document.getElementById('editModal').classList.add('active');
}
function closeEditModal() {
  editNoteId = null;
  document.getElementById('editModal').classList.remove('active');
}
function saveEditNote() {
  if (!editNoteId) return;
  const title = document.getElementById('editTitle').value.trim();
  const content = document.getElementById('editContent').value.trim();
  const tags = getSelectedTags('editTags');
  if (!content) {
    showToast('内容不能为空');
    return;
  }
  updateNote(editNoteId, { title: title || content.substring(0, 30), content, tags });
  closeEditModal();
  renderNotes();
  showToast('笔记已更新');
}
function deleteEditNote() {
  deleteNoteId = editNoteId;
  document.getElementById('editModal').classList.remove('active');
  document.getElementById('confirmModal').classList.add('active');
}
function closeConfirmModal() {
  deleteNoteId = null;
  document.getElementById('confirmModal').classList.remove('active');
}
function confirmDelete() {
  if (deleteNoteId) {
    deleteNote(deleteNoteId);
    deleteNoteId = null;
    renderNotes();
    showToast('笔记已删除');
  }
  document.getElementById('confirmModal').classList.remove('active');
}
function doTogglePin(id) {
  togglePin(id);
  renderNotes();
}
function exportNotes() {
  const filtered = getFilteredNotes();
  if (filtered.length === 0) {
    showToast('没有可导出的笔记');
    return;
  }
  let text = '';
  const groups = groupByDate(filtered);
  for (const [dateLabel, groupNotes] of Object.entries(groups)) {
    text += `\n========== ${dateLabel} ==========\n\n`;
    for (const note of groupNotes) {
      text += `${note.pinned ? '[置顶] ' : ''}${note.title}\n`;
      text += `时间: ${formatTime(note.createdAt)}\n`;
      if (note.tags && note.tags.length > 0) {
        text += `标签: ${note.tags.join(', ')}\n`;
      }
      text += `\n${note.content}\n`;
      text += '\n---\n\n';
    }
  }
  const blob = new Blob([text], { type: 'text/plain;charset=UTF-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const dateStr = new Date().toISOString().slice(0, 10);
  a.download = `语音笔记_${dateStr}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('笔记已导出');
}
let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}
document.getElementById('searchInput').addEventListener('input', () => {
  renderNotes();
});
document.getElementById('tagFilters').addEventListener('click', (e) => {
  const chip = e.target.closest('.tag-chip');
  if (!chip) return;
  document.querySelectorAll('#tagFilters .tag-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  currentFilter = chip.dataset.tag;
  renderNotes();
});
document.querySelectorAll('.tag-option').forEach(el => {
  el.addEventListener('click', () => el.classList.toggle('selected'));
});
document.getElementById('editModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeEditModal();
});
document.getElementById('confirmModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeConfirmModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('editModal').classList.contains('active')) {
      closeEditModal();
    } else if (document.getElementById('confirmModal').classList.contains('active')) {
      closeConfirmModal();
    }
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
    e.preventDefault();
    document.getElementById('noteContent').focus();
  }
});
function toggleRecordSection() {
  const section = document.getElementById('recordSection');
  const btn = document.getElementById('toggleRecordBtn');
  if (section.style.display === 'none') {
    section.style.display = 'block';
    btn.textContent = '- 收起';
  } else {
    section.style.display = 'none';
    btn.textContent = '+ 新建笔记';
  }
}
function init() {
  loadNotes();
  renderNotes();
  recognition = initRecognition();
}
init();
</script>
