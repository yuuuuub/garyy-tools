<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轮作规划器</title>
<meta name="description" content="科学轮作规划，避免连作障碍，合理安排茬口，提高土壤肥力">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔄</text></svg>">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#22c55e;--accent2:#16a34a;--success:#3b82f6;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#1a7f37;--accent2:#116329;--success:#0969da;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,select,button{font-family:inherit;font-size:.95rem}
input[type=text],select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{opacity:.9}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--danger)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1fr}}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;margin-right:4px}
.tag.g{background:var(--accent);color:#fff}.tag.w{background:var(--warn);color:#fff}.tag.r{background:var(--danger);color:#fff}.tag.b{background:var(--success);color:#fff}
.li{padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.es{text-align:center;padding:40px;color:var(--text2)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rotation-plan{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.rotation-cell{padding:12px;background:var(--bg);border-radius:8px;text-align:center;border:2px solid var(--border);cursor:pointer;transition:all .2s}
.rotation-cell:hover{border-color:var(--accent)}
.rotation-cell.selected{border-color:var(--accent);background:rgba(34,197,94,0.1)}
.rotation-cell .season{font-size:.75rem;color:var(--text2);margin-bottom:4px}
.rotation-cell .crop{font-size:1rem;font-weight:600}
.family-tag{display:inline-block;padding:4px 10px;border-radius:6px;font-size:.8rem;margin:2px}
.compat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:12px}
.compat-item{padding:10px;background:var(--bg);border-radius:8px;font-size:.85rem}
.compat-item .pair{font-weight:600;margin-bottom:4px}
.compat-item .status{font-size:.8rem}
.hidden{display:none}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>🔄 轮作规划器</h1><p>科学轮作 · 茬口安排 · 土壤养护</p></div>

<div class="cd">
<h2>作物科属速查</h2>
<p style="font-size:.85rem;color:var(--text2);margin-bottom:8px">同科作物不宜连作，轮作间隔至少2-3年</p>
<div id="familyList"></div>
</div>

<div class="cd">
<h2>创建轮作计划</h2>
<div class="fr">
<div><label>地块名称</label><input type="text" id="plotName" placeholder="如：菜地A"></div>
<div><label>种植年份</label><input type="text" id="planYear" placeholder="2025"></div>
</div>
<div style="margin-top:12px">
<label>四季种植安排（点击选择作物）</label>
<div class="rotation-plan" id="rotationGrid"></div>
</div>
<div class="bg"><button onclick="savePlan()">保存轮作计划</button></div>
</div>

<div class="cd">
<h2>轮作相容性</h2>
<p style="font-size:.85rem;color:var(--text2);margin-bottom:8px">查看哪些作物适合前后茬搭配</p>
<div class="fr">
<div><label>前茬作物</label><select id="preCrop" onchange="checkCompat()"></select></div>
<div><label>后茬作物</label><select id="postCrop" onchange="checkCompat()"></select></div>
</div>
<div id="compatResult" style="margin-top:12px"></div>
<div class="compat-grid" id="compatGrid"></div>
</div>

<div class="cd">
<h2>保存的轮作计划</h2>
<div id="planList" class="es">暂无计划</div>
</div>

<div class="cd">
<h2>轮作原则</h2>
<div id="principles"></div>
</div>
</div>

<script>
const DB='crop_rotation_db';
let plans=JSON.parse(localStorage.getItem(DB)||'[]');

const CROPS={
  '茄科':{color:'#ef4444',crops:['番茄','辣椒','茄子','土豆','烟草'],note:'易感青枯病、疫病，忌连作'},
  '葫芦科':{color:'#22c55e',crops:['黄瓜','南瓜','西瓜','甜瓜','冬瓜'],note:'易感枯萎病，需3年以上轮作'},
  '十字花科':{color:'#3b82f6',crops:['白菜','萝卜','甘蓝','花椰菜','油菜'],note:'易感根肿病、软腐病'},
  '豆科':{color:'#f59e0b',crops:['大豆','豌豆','豇豆','四季豆','花生'],note:'根瘤菌固氮，是良好前茬'},
  '百合科':{color:'#8b5cf6',crops:['大蒜','洋葱','韭菜','大葱'],note:'杀菌抑菌，是良好前茬'},
  '菊科':{color:'#ec4899',crops:['莴苣','茼蒿','向日葵','菊花'],note:'部分品种忌连作'},
  '伞形科':{color:'#14b8a6',crops:['胡萝卜','芹菜','香菜','茴香'],note:'易感菌核病'},
  '禾本科':{color:'#f97316',crops:['玉米','小麦','水稻','高粱'],note:'需氮较多，可与豆科轮作'},
};

const SEASONS=['春季','夏季','秋季','冬季'];
let seasonCrops=['','','',''];

const COMPAT={
  '茄科-葫芦科':'⚠️ 不推荐','茄科-十字花科':'✅ 推荐','茄科-豆科':'✅ 推荐',
  '茄科-百合科':'✅ 良好','茄科-禾本科':'⚠️ 一般','茄科-菊科':'⚠️ 一般',
  '葫芦科-十字花科':'⚠️ 一般','葫芦科-豆科':'✅ 推荐','葫芦科-百合科':'✅ 良好',
  '十字花科-豆科':'✅ 良好','十字花科-百合科':'✅ 良好','十字花科-禾本科':'✅ 推荐',
  '豆科-禾本科':'✅ 推荐','豆科-百合科':'✅ 推荐','百合科-十字花科':'✅ 良好',
  '禾本科-豆科':'✅ 推荐','禾本科-十字花科':'✅ 推荐','菊科-百合科':'✅ 良好',
};

const PRINCIPLES=[
  {title:'避免连作',desc:'同科作物在同一地块连续种植不超过2年，最好间隔3-4年',icon:'🚫'},
  {title:'科属轮换',desc:'不同科属作物交替种植，减少土传病害积累',icon:'🔄'},
  {title:'深浅搭配',desc:'深根作物与浅根作物轮作，充分利用不同土层养分',icon:'🌱'},
  {title:'氮磷平衡',desc:'耗氮作物后接固氮作物（如豆科），维持土壤肥力',icon:'⚖️'},
  {title:'茬口衔接',desc:'合理安排种植时间，确保土地利用率最大化',icon:'📅'},
  {title:'病虫回避',desc:'避免同病虫寄主作物连作，打断病虫害循环',icon:'🛡️'},
];

function initFamilyList(){
  const el=document.getElementById('familyList');
  el.innerHTML=Object.entries(CROPS).map(([family,data])=>`
    <div class="li" style="flex-direction:column;align-items:stretch">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="family-tag" style="background:${data.color};color:#fff">${family}</span>
        <span style="font-size:.85rem;color:var(--text2)">${data.note}</span>
      </div>
      <div style="margin-top:6px">${data.crops.map(c=>`<span class="tag" style="background:var(--bg);color:var(--text);border:1px solid var(--border)">${c}</span>`).join('')}</div>
    </div>`).join('');
}

function initRotationGrid(){
  const allCrops=Object.values(CROPS).flatMap(f=>f.crops);
  const el=document.getElementById('rotationGrid');
  el.innerHTML=SEASONS.map((s,i)=>`
    <div class="rotation-cell" onclick="selectCrop(${i})" id="rotCell${i}">
      <div class="season">${s}</div>
      <div class="crop" id="rotCrop${i}">点击选择</div>
    </div>`).join('');
}

let currentSeason=0;
function selectCrop(i){
  currentSeason=i;
  const allCrops=Object.values(CROPS).flatMap(f=>f.crops);
  const choice=prompt('输入作物名称\n\n可选：'+allCrops.join('、'));
  if(choice&&allCrops.includes(choice)){
    seasonCrops[i]=choice;
    document.getElementById('rotCrop'+i).textContent=choice;
    document.getElementById('rotCell'+i).classList.add('selected');
  }
}

function savePlan(){
  const name=document.getElementById('plotName').value.trim();
  const year=document.getElementById('planYear').value.trim()||new Date().getFullYear();
  if(!name)return alert('请输入地块名称');
  if(!seasonCrops.some(c=>c))return alert('请至少选择一个季节的作物');
  plans.push({name,year,crops:[...seasonCrops],date:new Date().toLocaleDateString(),id:Date.now()});
  localStorage.setItem(DB,JSON.stringify(plans));
  document.getElementById('plotName').value='';
  seasonCrops=['','','',''];
  SEASONS.forEach((_,i)=>{document.getElementById('rotCrop'+i).textContent='点击选择';document.getElementById('rotCell'+i).classList.remove('selected')});
  renderPlans();
}

function renderPlans(){
  const el=document.getElementById('planList');
  if(!plans.length){el.innerHTML='<div class="es">暂无计划</div>';return}
  el.innerHTML=plans.map((p,i)=>{
    const cropTags=p.crops.map((c,si)=>c?`<span class="tag g">${SEASONS[si]}:${c}</span>`:'').join('');
    return`<div class="li" style="flex-direction:column;align-items:stretch">
      <div style="display:flex;justify-content:space-between"><strong>${p.name}</strong><span style="font-size:.85rem;color:var(--text2)">${p.year}年</span></div>
      <div style="margin-top:4px">${cropTags}</div>
      <div class="bg"><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="plans.splice(${i},1);localStorage.setItem('${DB}',JSON.stringify(plans));renderPlans()">删除</button></div>
    </div>`}).reverse().join('');
}

function initCompatSelects(){
  const families=Object.keys(CROPS);
  const html=families.map(f=>`<option>${f}</option>`).join('');
  document.getElementById('preCrop').innerHTML=html;
  document.getElementById('postCrop').innerHTML=html;
  checkCompat();
}

function checkCompat(){
  const pre=document.getElementById('preCrop').value;
  const post=document.getElementById('postCrop').value;
  const key=pre+'-'+post;
  const revKey=post+'-'+pre;
  const result=COMPAT[key]||COMPAT[revKey]||(pre===post?'❌ 同科作物禁止连作':'⚠️ 无数据，请谨慎安排');
  document.getElementById('compatResult').innerHTML=`<div style="padding:12px;background:var(--bg);border-radius:8px;font-size:.1rem"><strong>${pre} → ${post}</strong>：<span style="font-size:.95rem">${result}</span></div>`;

  const grid=document.getElementById('compatGrid');
  grid.innerHTML='';
  Object.entries(CROPS).forEach(([fam,data])=>{
    if(fam===pre)return;
    const k=pre+'-'+fam;const rk=fam+'-'+pre;
    const status=COMPAT[k]||COMPAT[rk]||'⚠️ 待评估';
    grid.innerHTML+=`<div class="compat-item"><div class="pair">${pre} → ${fam}</div><div class="status">${status}</div></div>`;
  });
}

function initPrinciples(){
  document.getElementById('principles').innerHTML=PRINCIPLES.map(p=>`
    <div class="li" style="display:flex;gap:12px;align-items:flex-start">
      <span style="font-size:1.5rem">${p.icon}</span>
      <div><strong>${p.title}</strong><div style="font-size:.85rem;color:var(--text2);margin-top:2px">${p.desc}</div></div>
    </div>`).join('');
}

initFamilyList();initRotationGrid();initCompatSelects();initPrinciples();renderPlans();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
