<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据录入</title>
<meta name="description" content="数据录入工具，快速录入和管理结构化数据">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6scroll-behavior:smooth;}
.container{max-width:1000px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:var(--text);font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{background:var(--accent2)}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.btn-warning{background:var(--yellow);color:#000}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;gap:12px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-blue{background:rgba(59,130,246,.2);color:var(--accent2)}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-red{background:rgba(248,81,73,.2);color:var(--red)}
.badge-yellow{background:rgba(210,153,34,.2);color:var(--yellow)}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.hidden{display:none!important}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
.table th{color:var(--text2);font-size:.85rem;font-weight:600;background:var(--bg);position:sticky;top:0}
.table tr:hover{background:rgba(59,130,246,.05)}
.table-wrap{overflow-x:auto;max-height:500px;overflow-y:auto}
.form-row{display:grid;gap:12px;margin-bottom:12px}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="数据录入">
<meta property="og:description" content="数据录入工具，快速录入和管理结构化数据">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/data-entry-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='📝 数据录入';
const APP=document.getElementById('app');
let datasets=JSON.parse(localStorage.getItem('de_datasets')||'[]');
let curDS=null;
let editingRow=-1;
let searchQuery='';

function save(){localStorage.setItem('de_datasets',JSON.stringify(datasets))}

function render(){
  let h=`<h1>📝 数据录入</h1><p class="subtitle">定义字段结构，快速录入数据</p>`;
  if(curDS!==null){
    let ds=datasets[curDS];
    h+=`<div class="card"><div class="flex-between"><button class="btn btn-sm" onclick="curDS=null;render()">← 返回</button><b>${ds.title}</b><div class="flex"><span class="badge badge-blue">${ds.rows.length} 条</span><button class="btn btn-sm btn-success" onclick="showAddForm()">+ 录入</button><button class="btn btn-sm" onclick="exportCSV()">导出CSV</button></div></div></div>`;
    if(!ds.fields.length){
      h+=`<div class="card"><label>定义字段（每行一个字段名）</label><textarea id="fieldInput" rows="4" placeholder="姓名&#10;部门&#10;金额&#10;日期">${ds.fields.join('\n')}</textarea><button class="btn" onclick="saveFields()">保存字段</button></div>`;
    } else {
      h+=`<div class="card"><div class="flex-between" style="margin-bottom:8px"><label style="margin:0">搜索</label><button class="btn btn-sm btn-warning" onclick="editFields()">编辑字段</button></div><input id="searchInput" placeholder="搜索数据..." value="${searchQuery}" oninput="searchQuery=this.value;renderTable()"></div>`;
      h+=`<div class="card" style="padding:0"><div class="table-wrap"><table class="table" id="dataTable"><thead><tr><th>#</th>${ds.fields.map(f=>`<th>${f}</th>`).join('')}<th>操作</th></tr></thead><tbody id="dataBody"></tbody></table></div></div>`;
    }
  } else {
    h+=`<div class="card"><div class="flex-between"><span style="font-weight:700">数据集列表</span><button class="btn btn-sm" onclick="newDS()">+ 新建</button></div></div>`;
    datasets.forEach((ds,i)=>{
      h+=`<div class="card"><div class="flex-between"><b>${ds.title}</b><div class="flex"><span class="badge badge-blue">${ds.fields.length} 字段</span><span class="badge badge-green">${ds.rows.length} 条</span><button class="btn btn-sm" onclick="openDS(${i})">打开</button><button class="btn btn-sm btn-danger" onclick="delDS(${i})">×</button></div></div></div>`;
    });
    if(!datasets.length) h+=`<div class="empty">暂无数据集</div>`;
  }
  APP.innerHTML=h;
  if(curDS!==null&&datasets[curDS].fields.length) renderTable();
}

function renderTable(){
  let ds=datasets[curDS];
  let tbody=document.getElementById('dataBody');
  if(!tbody) return;
  let filtered=ds.rows.filter(r=>!searchQuery||r.some(c=>String(c).toLowerCase().includes(searchQuery.toLowerCase())));
  tbody.innerHTML=filtered.map((row,fi)=>{
    let ri=ds.rows.indexOf(row);
    if(editingRow===ri){
      return `<tr>${row.map((c,ci)=>`<td><input value="${c}" id="edit_${ci}" style="margin:0;padding:4px 8px;font-size:.85rem"></td>`).join('')}<td><button class="btn btn-sm btn-success" onclick="saveEdit(${ri})">✓</button> <button class="btn btn-sm" onclick="editingRow=-1;renderTable()">✕</button></td></tr>`;
    }
    return `<tr><td style="color:var(--text2)">${ri+1}</td>${row.map(c=>`<td>${c}</td>`).join('')}<td><button class="btn btn-sm" onclick="startEdit(${ri})">编辑</button> <button class="btn btn-sm btn-danger" onclick="delRow(${ri})">×</button></td></tr>`;
  }).join('');
  if(!filtered.length) tbody.innerHTML=`<tr><td colspan="${ds.fields.length+2}" class="empty" style="padding:30px">暂无数据</td></tr>`;
}

function saveFields(){
  let text=document.getElementById('fieldInput').value;
  let fields=text.split('\n').map(f=>f.trim()).filter(Boolean);
  datasets[curDS].fields=fields;
  save();render();
}

function editFields(){
  let ds=datasets[curDS];
  let text=prompt('编辑字段（每行一个）：',ds.fields.join('\n'));
  if(text===null) return;
  let fields=text.split('\n').map(f=>f.trim()).filter(Boolean);
  ds.fields=fields;
  save();render();
}

function showAddForm(){
  let ds=datasets[curDS];
  let values=[];
  for(let f of ds.fields){
    let v=prompt(`${f}：`,'');
    if(v===null) return;
    values.push(v);
  }
  ds.rows.push(values);
  save();render();
}

function startEdit(i){
  editingRow=i;
  renderTable();
}

function saveEdit(ri){
  let ds=datasets[curDS];
  ds.rows[ri]=ds.fields.map((_,ci)=>document.getElementById('edit_'+ci).value);
  editingRow=-1;
  save();render();
}

function delRow(i){
  if(confirm('删除此条数据？')){
    datasets[curDS].rows.splice(i,1);
    save();render();
  }
}

function exportCSV(){
  let ds=datasets[curDS];
  let csv=[ds.fields.join(',')];
  ds.rows.forEach(r=>csv.push(r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')));
  let blob=new Blob(['\uFEFF'+csv.join('\n')],{type:'text/csv;charset=utf-8'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=ds.title+'.csv';
  a.click();
}

function newDS(){let t=prompt('数据集名称：');if(t){datasets.push({title:t,fields:[],rows:[]});save();render()}}
function openDS(i){curDS=i;editingRow=-1;searchQuery='';render()}
function delDS(i){if(confirm('删除数据集？')){datasets.splice(i,1);curDS=null;save();render()}}

render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
