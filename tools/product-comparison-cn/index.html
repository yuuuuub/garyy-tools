<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 产品对比</title>
<meta name="description" content="产品对比工具，多维度对比产品优劣，做出最佳选择">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:900px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;background:var(--accent);color:#fff;margin-right:4px}
.tag.s{background:var(--success)}.tag.w{background:var(--warn)}.tag.d{background:var(--danger)}
.es{text-align:center;padding:40px;color:var(--text2)}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:.9rem}
th{color:var(--text2);font-weight:600;background:var(--bg)}
td.highlight{background:var(--success);color:#fff;font-weight:600;border-radius:4px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.fr{grid-template-columns:1fr}.ctn{padding:0}}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📊 产品对比">
<meta property="og:description" content="产品对比工具，多维度对比产品优劣，做出最佳选择">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📊 产品对比</h1><p>多维度对比产品优劣，做出最佳选择</p></div>

<div class="cd"><h2>添加产品</h2>
<div class="fr">
<div><label>产品名称</label><input type="text" id="pName" placeholder="如：iPhone 15"></div>
<div><label>产品图片URL（可选）</label><input type="text" id="pImg" placeholder="https://..."></div>
</div>
<div class="bg"><button onclick="addProduct()">添加产品</button></div></div>

<div class="cd"><h2>对比维度</h2>
<div class="fr">
<div><label>维度名称</label><input type="text" id="dName" placeholder="如：价格、性能、续航"></div>
<div><label>评分（1-10）</label><input type="number" id="dScore" min="1" max="10" value="5"></div>
</div>
<label>选择产品</label><select id="dProduct"></select>
<div class="bg"><button onclick="addDimension()">添加维度</button></div></div>

<div class="cd"><h2>对比结果</h2><div id="result" class="es">请先添加产品和维度</div></div>

<div class="cd"><h2>历史对比</h2><div id="history" class="es">暂无历史记录</div>
<div class="bg"><button class="sec" onclick="clearHistory()">清空历史</button></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
let products=JSON.parse(localStorage.getItem('pc_products')||'[]');
let dimensions=JSON.parse(localStorage.getItem('pc_dims')||'[]');
let history=JSON.parse(localStorage.getItem('pc_history')||'[]');

function save(){localStorage.setItem('pc_products',JSON.stringify(products));localStorage.setItem('pc_dims',JSON.stringify(dimensions));localStorage.setItem('pc_history',JSON.stringify(history));}

function addProduct(){
  const name=$('pName').value.trim();
  if(!name){alert('请输入产品名称');return;}
  products.push({id:Date.now(),name,img:$('pImg').value.trim()});
  save();render();$('pName').value='';$('pImg').value='';
}

function removeProduct(id){
  products=products.filter(p=>p.id!==id);
  dimensions=dimensions.filter(d=>d.productId!==id);
  save();render();
}

function addDimension(){
  const name=$('dName').value.trim();
  const score=parseInt($('dScore').value);
  const productId=parseInt($('dProduct').value);
  if(!name||!productId){alert('请填写完整信息');return;}
  dimensions.push({id:Date.now(),name,score:Math.min(10,Math.max(1,score)),productId});
  save();render();$('dName').value='';
}

function removeDimension(id){
  dimensions=dimensions.filter(d=>d.id!==id);
  save();render();
}

function getWinner(){
  if(!products.length||!dimensions.length)return null;
  const scores={};
  products.forEach(p=>{scores[p.id]=0;});
  dimensions.forEach(d=>{
    if(scores[d.productId]!==undefined)scores[d.productId]+=d.score;
  });
  let maxScore=-1,winner=null;
  Object.entries(scores).forEach(([id,s])=>{if(s>maxScore){maxScore=s;winner=parseInt(id);}});
  return winner;
}

function saveToHistory(){
  if(!products.length||!dimensions.length)return;
  const winner=getWinner();
  const winnerName=products.find(p=>p.id===winner)?.name||'无';
  history.push({
    date:new Date().toLocaleDateString(),
    products:products.map(p=>p.name).join(' vs '),
    winner:winnerName
  });
  if(history.length>20)history=history.slice(-20);
  save();renderHistory();
}

function clearHistory(){history=[];save();renderHistory();}

function render(){
  $('dProduct').innerHTML=products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  
  if(!products.length||!dimensions.length){
    $('result').innerHTML='<div class="es">请先添加产品和维度</div>';
    return;
  }
  
  const dimNames=[...new Set(dimensions.map(d=>d.name))];
  const winner=getWinner();
  
  let html=`<table><thead><tr><th>维度</th>`;
  products.forEach(p=>{html+=`<th>${p.name}</th>`;});
  html+=`</tr></thead><tbody>`;
  
  dimNames.forEach(dim=>{
    html+=`<tr><td><strong>${dim}</strong></td>`;
    products.forEach(p=>{
      const d=dimensions.find(x=>x.name===dim&&x.productId===p.id);
      const score=d?d.score:'-';
      const isMax=d&&d.score===Math.max(...dimensions.filter(x=>x.name===dim).map(x=>x.score));
      html+=`<td class="${isMax?'highlight':''}">${score}</td>`;
    });
    html+=`</tr>`;
  });
  
  html+=`<tr style="font-weight:700"><td>总分</td>`;
  products.forEach(p=>{
    const total=dimensions.filter(d=>d.productId===p.id).reduce((s,d)=>s+d.score,0);
    html+=`<td class="${p.id===winner?'highlight':''}">${total}</td>`;
  });
  html+=`</tr></tbody></table>`;
  
  html+=`<div class="bg"><button onclick="saveToHistory()">保存到历史</button></div>`;
  $('result').innerHTML=html;
}

function renderHistory(){
  $('history').innerHTML=history.length?history.map((h,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
    <span><span class="tag">${h.date}</span> ${h.products}</span>
    <span class="tag s">🏆 ${h.winner}</span>
  </div>`).reverse().join(''):'<div class="es">暂无历史记录</div>';
}

render();renderHistory();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
