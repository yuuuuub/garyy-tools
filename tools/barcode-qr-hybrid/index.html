<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR码+条形码混合生成器</title>
<meta name="description" content="同时生成QR二维码和Code128条形码的混合条码工具">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:16px;min-height:100vh;scroll-behavior:smooth}
.container{max-width:800px;margin:auto;padding-bottom:50px;text-align:center}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.output-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.output-box{background:#fff;display:inline-block;padding:16px;border-radius:12px;text-align:center;flex:1;min-width:240px;max-width:350px}
.output-box h3{font-size:.82rem;color:#333;margin-bottom:8px}
canvas{display:block;margin:auto}
.input-group{margin-bottom:14px;text-align:left}
.input-group label{display:block;font-size:.82rem;color:var(--text2);margin-bottom:6px}
.input-group input,.input-group textarea{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.85rem;outline:none}
.input-group input:focus,.input-group textarea:focus{border-color:var(--blue)}
.input-group textarea{min-height:60px;resize:vertical;font-family:monospace}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.btn{padding:10px 24px;border:none;border-radius:var(--radius);cursor:pointer;font-size:.85rem;background:var(--blue);color:#fff;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn.green{background:var(--green)}
.btn.gold{background:var(--gold);color:#000}
.btn.sm{padding:8px 16px;font-size:.78rem}
.mode-tabs{display:flex;gap:0;margin-bottom:16px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.mode-tab{flex:1;padding:10px;border:none;background:transparent;color:var(--text2);cursor:pointer;font-size:.85rem;transition:all .15s}
.mode-tab.active{background:var(--blue);color:#fff}
.mode-tab:hover:not(.active){background:rgba(59,130,246,.1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔀</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="QR码+条形码混合生成器">
<meta property="og:description" content="同时生成QR二维码和Code128条形码">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/barcode-qr-hybrid/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<header><h1>QR码 + 条形码 混合生成器</h1><p>同时生成二维码和条形码，一码双用</p></header>
<div class="mode-tabs">
<button class="mode-tab active" data-mode="hybrid">混合模式</button>
<button class="mode-tab" data-mode="qr">仅QR码</button>
<button class="mode-tab" data-mode="barcode">仅条形码</button>
</div>
<div class="card">
<div class="output-row" id="output-row">
<div class="output-box" id="qr-box">
<h3>QR 二维码</h3>
<canvas id="qr-canvas" width="250" height="250"></canvas>
</div>
<div class="output-box" id="bc-box">
<h3>Code 128 条形码</h3>
<canvas id="bc-canvas" width="300" height="100"></canvas>
</div>
</div>
</div>
<div class="card">
<div class="input-group">
<label>输入内容</label>
<textarea id="content-input" placeholder="输入文本或URL...">https://garyy.top</textarea>
</div>
<div class="btn-row">
<button class="btn green" id="generate-btn">生成</button>
<button class="btn gold" id="download-qr">下载QR码</button>
<button class="btn gold" id="download-bc">下载条形码</button>
</div>
</div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
let currentMode='hybrid';

const GF256={exp:new Array(512),log:new Array(256)};
(function(){let v=1;for(let i=0;i<255;i++){GF256.exp[i]=v;GF256.log[v]=i;v=(v*2)^(v>=128?0x11d:0);}for(let i=255;i<512;i++)GF256.exp[i]=GF256.exp[i-255];})();
function gfMul(a,b){if(a===0||b===0)return 0;return GF256.exp[(GF256.log[a]+GF256.log[b])%255];}
function gfPow(a,n){return GF256.exp[(GF256.log[a]*n)%255];}
function reedSolomonEncode(data,eccCount){let gen=[1];for(let i=0;i<eccCount;i++){const term=[1,gfPow(2,i)];const ng=new Array(gen.length+1).fill(0);for(let j=0;j<gen.length;j++){ng[j]^=gfMul(gen[j],term[0]);ng[j+1]^=gfMul(gen[j],term[1]);}gen=ng;}const msg=[...data,...new Array(eccCount).fill(0)];for(let i=0;i<data.length;i++){if(msg[i]!==0){const f=GF256.log[msg[i]];for(let j=0;j<gen.length;j++){msg[i+j]^=GF256.exp[(f+GF256.log[gen[j]])%255];}}}return msg.slice(data.length);}

function generateQRMatrix(text){
  const data=[];const str=String(text);
  for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);if(c<128)data.push(c);else if(c<0x800){data.push(0xc0|(c>>6));data.push(0x80|(c&0x3f));}else{data.push(0xe0|(c>>12));data.push(0x80|((c>>6)&0x3f));data.push(0x80|(c&0x3f));}}
  const versions=[{ver:2,total:44,ecc:18,blocks:1},{ver:3,total:70,ecc:26,blocks:1},{ver:4,total:100,ecc:36,blocks:2},{ver:5,total:134,ecc:48,blocks:2},{ver:6,total:172,ecc:64,blocks:4}];
  let vi=versions[versions.length-1];
  for(const v of versions){const cap=Math.floor((v.total-v.ecc)/2);if(data.length+3<=cap){vi=v;break;}}
  const{ver,total,ecc,blocks}=vi;const ms=17+ver*4;
  const enc=[];enc.push(0x40);enc.push(data.length);data.forEach(b=>enc.push(b));
  const td=total-ecc*blocks;while(enc.length<td){enc.push(0xec);if(enc.length<td)enc.push(0x11);}
  const allData=[];const bs=Math.ceil(enc.length/blocks);
  for(let b=0;b<blocks;b++){const s=b*bs;const d=enc.slice(s,s+bs);allData.push({data:d,ecc:reedSolomonEncode(d,ecc)});}
  const fb=[];const ml=Math.max(...allData.map(b=>b.data.length));
  for(let i=0;i<ml;i++)for(const blk of allData)if(i<blk.data.length)fb.push(blk.data[i]);
  for(let i=0;i<ecc;i++)for(const blk of allData)if(i<blk.ecc.length)fb.push(blk.ecc[i]);
  const sz=ms;const mx=[];for(let i=0;i<sz;i++)mx[i]=new Array(sz).fill(0);
  function addFP(x,y){for(let r=-1;r<=7;r++)for(let c=-1;c<=7;c++){if(x+c<0||x+c>=sz||y+r<0||y+r>=sz)continue;if(r>=0&&r<=6&&c>=0&&c<=6){const o=r===0||r===6||c===0||c===6;const n=(r>=2&&r<=4&&c>=2&&c<=4);mx[y+r][x+c]=(o||n)?1:0;}else mx[y+r][x+c]=0;}}
  addFP(0,0);addFP(sz-7,0);addFP(0,sz-7);
  for(let i=8;i<sz-8;i++){mx[6][i]=i%2===0?1:0;mx[i][6]=i%2===0?1:0;}
  mx[sz-8][8]=1;
  let bi=0;let dir=-1;
  for(let col=sz-1;col>0;col-=2){if(col===6)col--;for(let row=dir===-1?sz-1:0;row>=0&&row<sz;row+=dir){for(let c=0;c<2;c++){const x=col-c;if(x<0||mx[row][x]!==0||row===8||x===8)continue;if((row<8&&x<8)||(row<8&&x>=sz-8)||(row>=sz-8&&x<8))continue;if(bi<fb.length*8){const by=Math.floor(bi/8);const bp=7-(bi%8);mx[row][x]=(fb[by]>>bp)&1;bi++;}else mx[row][x]=0;}}dir=-dir;}
  for(let r=0;r<sz;r++)for(let c=0;c<sz;c++){if((r<9&&c<9)||(r<9&&c>=sz-8)||(r>=sz-8&&c<9)||r===6||c===6||r===8||c===8)continue;if((r+c)%2===0)mx[r][c]=mx[r][c]===0?1:0;}
  return mx;
}

function drawQR(text){
  const canvas=$('qr-canvas');const ctx=canvas.getContext('2d');
  if(!text){ctx.clearRect(0,0,canvas.width,canvas.height);return;}
  const mx=generateQRMatrix(text);const ms=mx.length;const cs=220/ms;const pad=15;
  canvas.width=220+pad*2;canvas.height=220+pad*2;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
  for(let r=0;r<ms;r++)for(let c=0;c<ms;c++)if(mx[r][c]){ctx.fillStyle='#000';ctx.fillRect(pad+c*cs,pad+r*cs,Math.ceil(cs),Math.ceil(cs));}
  canvas.style.width='100%';canvas.style.maxWidth='250px';canvas.style.height='auto';
}

const PATTERNS_B={' ':[2,1,2,2,2,2],'!':[2,2,2,1,2,2],'"':[2,2,2,2,2,1],'#':[1,2,1,2,2,3],'$':[1,2,1,3,2,2],'%':[1,3,1,2,2,2],'&':[1,2,2,2,1,3],"'":[1,2,2,3,1,2],'(':[1,3,2,2,1,2],')':[2,2,1,2,1,3],'*':[2,2,1,3,1,2],'+':[2,3,1,2,1,2],',':[1,1,2,2,3,2],'-':[1,2,2,1,3,2],'.':[1,2,2,2,3,1],'/':[1,1,3,2,2,2],'0':[1,2,3,1,2,2],'1':[2,2,3,1,1,2],'2':[2,2,1,1,3,2],'3':[2,2,1,2,3,1],'4':[1,3,2,1,2,2],'5':[2,3,1,1,2,2],'6':[2,3,1,2,2,1],'7':[1,1,2,3,2,2],'8':[1,2,2,3,1,2],'9':[1,2,2,3,2,1],':':[2,2,1,1,2,3],';':[2,2,1,2,2,1],'<':[2,1,2,1,2,3],'=':[2,1,2,3,2,1],'>':[2,3,2,1,2,1],'?':[1,1,1,3,2,2],'@':[1,3,1,1,2,2],'A':[1,3,1,2,2,1],'B':[1,1,2,3,1,2],'C':[1,2,2,1,3,1],'D':[1,2,2,2,1,3],'E':[1,1,3,2,1,2],'F':[1,3,3,1,1,2],'G':[1,3,3,2,1,1],'H':[1,1,2,1,3,2],'I':[1,2,2,1,1,3],'J':[1,2,2,2,1,1],'K':[2,3,1,1,1,2],'L':[2,3,1,2,1,1],'M':[2,1,3,1,1,2],'N':[2,1,3,2,1,1],'O':[2,1,1,3,1,2],'P':[2,1,1,2,1,3],'Q':[2,1,1,2,3,1],'R':[1,3,1,1,1,2],'S':[3,1,1,1,1,2],'T':[1,1,3,1,1,2],'U':[1,1,3,2,1,1],'V':[1,1,1,2,3,2],'W':[1,1,2,2,1,3],'X':[1,1,2,3,1,1],'Y':[1,3,2,1,1,1],'Z':[3,1,2,1,1,1],'[':[2,1,1,3,1,1],'\\':[2,1,1,1,3,1],']':[2,1,3,1,1,1],'^':[1,1,1,1,2,3],'_':[1,1,1,3,2,1],'`':[1,3,1,1,2,1],'a':[3,1,1,1,2,1],'b':[2,1,1,1,1,3],'c':[2,1,1,3,1,1],'d':[2,3,1,1,1,1],'e':[1,1,1,2,1,3],'f':[1,1,1,3,1,2],'g':[1,3,1,1,1,2],'h':[1,1,2,1,1,3],'i':[1,1,3,1,1,2],'j':[3,1,2,1,1,1],'k':[2,1,1,1,2,1],'l':[3,1,1,1,2,1],'m':[1,2,1,1,1,3],'n':[1,3,1,1,1,2],'o':[1,1,1,2,2,1],'p':[1,1,2,2,1,1],'q':[1,1,1,3,2,1],'r':[1,3,2,1,1,1],'s':[1,2,1,1,3,1],'t':[3,2,1,1,1,1],'u':[2,1,2,1,1,1],'v':[2,3,2,1,1,1],'w':[2,1,1,1,2,1],'x':[2,1,1,3,2,1],'y':[2,1,1,1,1,3],'z':[1,1,3,2,1,1],'{':[3,1,2,1,1,1],'|':[1,3,2,1,1,1],'}':[1,1,1,2,2,1],'~':[1,1,2,2,1,1]};
const START_B=[2,1,1,2,3,2],STOP=[2,3,3,1,1,1,2];

function drawBarcode(text){
  const canvas=$('bc-canvas');const ctx=canvas.getContext('2d');
  if(!text){ctx.clearRect(0,0,canvas.width,canvas.height);return;}
  const vals=[104];
  for(let i=0;i<text.length;i++){const p=PATTERNS_B[text[i]];if(p)vals.push(i+1);}
  let sum=vals[0];for(let i=1;i<vals.length;i++)sum+=i*vals[i];
  vals.push(sum%103);vals.push(106);
  const bars=[...START_B];
  for(const v of vals.slice(1,-1)){const ch=String.fromCharCode(v+32);const p=PATTERNS_B[ch];if(p)bars.push(...p);}
  bars.push(...STOP);
  const bw=Math.max(1,260/bars.length);
  canvas.width=300;canvas.height=100;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
  let x=20;
  for(let i=0;i<bars.length;i++){if(i%2===0){ctx.fillStyle='#000';ctx.fillRect(x,10,bw,55);}x+=bw;}
  ctx.fillStyle='#000';ctx.font='10px monospace';ctx.textAlign='center';
  ctx.fillText(text.length>35?text.substring(0,35)+'...':text,canvas.width/2,canvas.height-8);
  canvas.style.width='100%';canvas.style.maxWidth='300px';canvas.style.height='auto';
}

function generate(){
  const text=$('content-input').value;
  if(currentMode==='hybrid'||currentMode==='qr')drawQR(text);
  if(currentMode==='hybrid'||currentMode==='barcode')drawBarcode(text);
  $('qr-box').style.display=(currentMode==='hybrid'||currentMode==='qr')?'inline-block':'none';
  $('bc-box').style.display=(currentMode==='hybrid'||currentMode==='barcode')?'inline-block':'none';
}

$('content-input').addEventListener('input',generate);
$('generate-btn').addEventListener('click',generate);

document.querySelectorAll('.mode-tab').forEach(function(tab){
  tab.addEventListener('click',function(){
    document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));
    this.classList.add('active');
    currentMode=this.dataset.mode;
    generate();
  });
});

$('download-qr').addEventListener('click',function(){
  const c=$('qr-canvas');const link=document.createElement('a');
  link.download='qrcode.png';link.href=c.toDataURL('image/png');link.click();
});
$('download-bc').addEventListener('click',function(){
  const c=$('bc-canvas');const link=document.createElement('a');
  link.download='barcode.png';link.href=c.toDataURL('image/png');link.click();
});

generate();
})();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
