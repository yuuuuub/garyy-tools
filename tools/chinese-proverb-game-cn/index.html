<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国谚语游戏</title><meta name="description" content="中国谚语游戏 - 猜谚语、学谚语、谚语接龙"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#d29922;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin:4px}.btn:hover{opacity:.85}.btn.active{background:var(--green)}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}.mode-tabs{display:flex;gap:8px;margin-bottom:16px;justify-content:center}.mode-tab{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--text2)}.mode-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.proverb-display{font-size:1.4rem;text-align:center;padding:30px 20px;line-height:1.8;background:var(--bg);border-radius:12px;margin:16px 0;border-left:4px solid var(--blue)}.proverb-display .blank{display:inline-block;min-width:3em;border-bottom:3px dashed var(--blue);margin:0 4px;color:var(--blue)}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.option-btn{padding:14px;background:var(--bg);border:2px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;cursor:pointer;transition:all .2s;text-align:center}.option-btn:hover{border-color:var(--blue);transform:scale(1.02)}.option-btn.correct{background:rgba(35,134,54,.3);border-color:var(--green)}.option-btn.wrong{background:rgba(239,68,68,.3);border-color:var(--red)}.feedback{padding:12px;border-radius:8px;margin-top:12px;text-align:center;font-weight:600;display:none}.feedback.show{display:block}.feedback.correct{background:rgba(35,134,54,.2);color:var(--green)}.feedback.wrong{background:rgba(239,68,68,.2);color:var(--red)}.score-bar{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg);border-radius:8px;margin-top:12px}.score-val{font-size:1.3rem;font-weight:700;color:var(--blue)}.meaning-box{background:var(--bg);border-radius:8px;padding:16px;margin-top:12px;color:var(--text2);line-height:1.6}.category-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.cat-btn{padding:6px 12px;background:var(--bg);border:1px solid var(--border);border-radius:20px;font-size:.8rem;cursor:pointer;color:var(--text2)}.cat-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}</style><meta property="og:title" content="中国谚语游戏"><meta property="og:description" content="中国谚语游戏 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>📚 中国谚语游戏</h1><p class="sub">猜谚语、学谚语、谚语填空</p>
<div class="card">
<div class="mode-tabs">
<div class="mode-tab active" onclick="switchMode('quiz',this)">猜谚语</div>
<div class="mode-tab" onclick="switchMode('fill',this)">填空挑战</div>
<div class="mode-tab" onclick="switchMode('match',this)">出处配对</div>
<div class="mode-tab" onclick="switchMode('browse',this)">浏览学习</div>
</div>
<div class="btn-group">
<button class="btn" onclick="startGame()">开始游戏</button>
<button class="btn" onclick="skipQuestion()">跳过</button>
<button class="btn" onclick="useHint()">提示</button>
</div>
<div class="score-bar">
<div><span class="score-val" id="score">0</span> 分</div>
<div><span id="qNum">0</span>/<span id="qTotal">20</span></div>
<div>🔥 <span id="streak">0</span> 连对</div>
</div>
</div>
<div class="card" id="quizArea">
<div class="proverb-display" id="questionDisplay">点击"开始游戏"</div>
<div class="options" id="optionsArea"></div>
<div class="feedback" id="feedback"></div>
<div class="meaning-box" id="meaningBox" style="display:none"></div>
</div>
<div class="card" id="browseArea" style="display:none">
<div class="category-filter" id="categoryFilter"></div>
<div id="browseList"></div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var proverbs=[
{text:'千里之行，始于足下',source:'老子·道德经',category:'人生',meaning:'再远的路，也要从脚下第一步开始走起。'},
{text:'塞翁失马，焉知非福',source:'淮南子',category:'人生',meaning:'比喻一时虽然受到损失，但也有可能带来好处。'},
{text:'己所不欲，勿施于人',source:'论语',category:'社交',meaning:'自己不想要的东西，不要强加给别人。'},
{text:'学而时习之，不亦说乎',source:'论语',category:'学习',meaning:'学习并且经常复习，不是很快乐吗？'},
{text:'温故而知新，可以为师矣',source:'论语',category:'学习',meaning:'温习旧知识从而得知新的理解。'},
{text:'三人行，必有我师焉',source:'论语',category:'学习',meaning:'几个人一起走路，其中必定有人可以做我的老师。'},
{text:'业精于勤，荒于嬉',source:'韩愈',category:'工作',meaning:'学业或事业的精进在于勤奋，而荒废在于嬉游。'},
{text:'书山有路勤为径，学海无涯苦作舟',source:'韩愈',category:'学习',meaning:'在读书、学习的道路上，勤奋和刻苦是唯一的途径。'},
{text:'路遥知马力，日久见人心',source:'元曲',category:'社交',meaning:'路途遥远才能知道马的力气大小，日子长了才能看出人心的好坏。'},
{text:'良药苦口利于病，忠言逆耳利于行',source:'史记',category:'社交',meaning:'好药吃起来虽苦，却有利于治病；忠诚的告诫听起来不舒服，却有利于行事。'},
{text:'滴水穿石，非一日之功',source:'民间谚语',category:'工作',meaning:'水滴能把石头穿透，比喻力量虽小，只要坚持不懈，事情就能成功。'},
{text:'世上无难事，只怕有心人',source:'民间谚语',category:'人生',meaning:'只要下定决心去做，世界上没有什么办不到的事情。'},
{text:'一分耕耘，一分收获',source:'民间谚语',category:'工作',meaning:'付出一份努力，就会有一份收获。'},
{text:'吃一堑，长一智',source:'民间谚语',category:'人生',meaning:'受一次挫折，增长一分见识。'},
{text:'百闻不如一见',source:'汉书',category:'学习',meaning:'听别人说一百次，不如自己亲眼见一次。'},
{text:'活到老，学到老',source:'民间谚语',category:'学习',meaning:'人要不停地学习，直到生命的尽头。'},
{text:'人心齐，泰山移',source:'民间谚语',category:'社交',meaning:'只要大家一心一意，就能产生巨大的力量。'},
{text:'种瓜得瓜，种豆得豆',source:'民间谚语',category:'人生',meaning:'做了什么事，就会得到什么样的结果。'},
{text:'不经一番寒彻骨，怎得梅花扑鼻香',source:'唐·黄檗禅师',category:'人生',meaning:'不经历一番刺骨的寒冷，怎能有梅花扑鼻的芳香。'},
{text:'一寸光阴一寸金，寸金难买寸光阴',source:'民间谚语',category:'人生',meaning:'时间非常宝贵，金钱也买不到时间。'},
{text:'磨刀不误砍柴工',source:'民间谚语',category:'工作',meaning:'花时间做好准备工作，不会耽误工作进度，反而会提高效率。'},
{text:'满招损，谦受益',source:'尚书',category:'人生',meaning:'自满会招来损害，谦虚会得到益处。'},
{text:'知之为知之，不知为不知，是知也',source:'论语',category:'学习',meaning:'知道就是知道，不知道就是不知道，这才是真正的智慧。'},
{text:'言必信，行必果',source:'论语',category:'社交',meaning:'说话一定要守信用，做事一定要有结果。'},
{text:'失败是成功之母',source:'民间谚语',category:'人生',meaning:'从失败中吸取教训，就能走向成功。'},
{text:'笨鸟先飞',source:'民间谚语',category:'工作',meaning:'比喻能力差的人怕落后，做事比别人先动手。'},
{text:'熟能生巧',source:'民间谚语',category:'学习',meaning:'熟练了就能掌握技巧，运用自如。'},
{text:'一日为师，终身为父',source:'民间谚语',category:'社交',meaning:'即使是只教过自己一天的老师，也要一辈子当作父亲看待。'},
{text:'近朱者赤，近墨者黑',source:'太子少傅箴',category:'社交',meaning:'接近好人可以使人变好，接近坏人可以使人变坏。'},
{text:'有志者事竟成',source:'后汉书',category:'人生',meaning:'只要有志气、有决心，事情终究会成功。'}
];
var mode='quiz',currentQ=null,score=0,qNum=0,totalQ=20,streak=0,maxStreak=0,history=[],usedIds=[];
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
function switchMode(m,el){mode=m;document.querySelectorAll('.mode-tab').forEach(function(t){t.classList.remove('active');});el.classList.add('active');score=0;qNum=0;streak=0;history=[];usedIds=[];updateScore();
document.getElementById('browseArea').style.display=m==='browse'?'block':'none';
document.getElementById('quizArea').style.display=m==='browse'?'none':'block';
if(m==='browse')renderBrowse();
if(m==='quiz'||m==='fill'||m==='match'){document.getElementById('questionDisplay').textContent='点击"开始游戏"';document.getElementById('optionsArea').innerHTML='';document.getElementById('feedback').className='feedback';document.getElementById('meaningBox').style.display='none';}
}
function startGame(){score=0;qNum=0;streak=0;history=[];usedIds=[];totalQ=20;updateScore();nextQuestion();}
function nextQuestion(){
if(qNum>=totalQ){showResult();return;}
var available=[];for(var i=0;i<proverbs.length;i++){if(usedIds.indexOf(i)===-1)available.push(i);}
if(available.length<4){usedIds=[];available=proverbs.map(function(_,i){return i;});}
var idx=available[Math.floor(Math.random()*available.length)];usedIds.push(idx);currentQ=proverbs[idx];qNum++;
document.getElementById('qNum').textContent=qNum;document.getElementById('qTotal').textContent=totalQ;
document.getElementById('feedback').className='feedback';
document.getElementById('meaningBox').style.display='none';
if(mode==='fill'){
var parts=currentQ.text.split('');
var fillIdx=Math.floor(Math.random()*parts.length);
var display='';
for(var i=0;i<parts.length;i++){if(i===fillIdx)display+='<span class="blank">?</span>';else display+=parts[i];}
document.getElementById('questionDisplay').innerHTML=display;
document.getElementById('hintText').textContent='';
renderFillOptions(fillIdx);
}else if(mode==='match'){
document.getElementById('questionDisplay').textContent='这句谚语出自哪里？';
document.getElementById('questionDisplay').innerHTML+='<div style="font-size:1rem;margin-top:12px;color:var(--text2)">('+currentQ.text+')</div>';
renderMatchOptions();
}else{
document.getElementById('questionDisplay').textContent=currentQ.text;
renderQuizOptions();
}
}
function renderQuizOptions(){
var wrongPool=proverbs.filter(function(p){return p.meaning!==currentQ.meaning;});
var wrongs=shuffle(wrongPool).slice(0,3).map(function(p){return p.meaning;});
var opts=shuffle([currentQ.meaning].concat(wrongs));
var html='';opts.forEach(function(o){html+='<button class="option-btn" onclick="checkAnswer(this,\''+o.replace(/'/g,"\\'")+'\')">'+o+'</button>';});
document.getElementById('optionsArea').innerHTML=html;
}
function renderFillOptions(fillIdx){
var correct=currentQ.text[fillIdx];
var allChars='一二三四五六七八九十百千万大小上下左右前后东西南北天地人日月水火山石金木春夏秋冬仁义礼智信学文书画龙凤虎龟牛马羊鸡';
var opts=[correct];while(opts.length<4){var c=allChars[Math.floor(Math.random()*allChars.length)];if(opts.indexOf(c)===-1)opts.push(c);}
opts=shuffle(opts);
var html='';opts.forEach(function(o){html+='<button class="option-btn" onclick="checkFill(this,\''+o+'\')">'+o+'</button>';});
document.getElementById('optionsArea').innerHTML=html;
}
function renderMatchOptions(){
var wrongSources=shuffle(proverbs.filter(function(p){return p.source!==currentQ.source;})).slice(0,3).map(function(p){return p.source;});
var opts=shuffle([currentQ.source].concat(wrongSources));
var html='';opts.forEach(function(o){html+='<button class="option-btn" onclick="checkAnswer(this,\''+o.replace(/'/g,"\\'")+'\')">'+o+'</button>';});
document.getElementById('optionsArea').innerHTML=html;
}
function checkAnswer(el,ans){
var correct=ans===currentQ.meaning||ans===currentQ.source;
showFeedback(el,correct);
}
function checkFill(el,ans){
var correct=ans===currentQ.text[usedIds[usedIds.length-1]];
showFeedback(el,correct);
}
function showFeedback(el,correct){
var fb=document.getElementById('feedback');
if(correct){el.classList.add('correct');fb.className='feedback show correct';fb.textContent='✓ 正确！';score+=10+streak*2;streak++;if(streak>maxStreak)maxStreak=streak;history.push(true);}else{el.classList.add('wrong');fb.className='feedback show wrong';fb.textContent='✗ 答案：'+currentQ.meaning;streak=0;history.push(false);}
document.getElementById('meaningBox').textContent='📖 '+currentQ.meaning;
document.getElementById('meaningBox').style.display='block';
updateScore();
document.querySelectorAll('.option-btn').forEach(function(b){b.onclick=null;b.style.cursor='default';});
setTimeout(nextQuestion,2000);
}
function skipQuestion(){streak=0;history.push(false);updateScore();setTimeout(nextQuestion,500);}
function useHint(){document.getElementById('feedback').className='feedback show';document.getElementById('feedback').textContent='💡 提示：'+currentQ.source;score=Math.max(0,score-3);updateScore();}
function updateScore(){document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;}
function renderBrowse(){
var cats=['全部','人生','学习','工作','社交'];
var html='';cats.forEach(function(c){html+='<span class="cat-btn '+(c==='全部'?'active':'')+'" onclick="filterBrowse(\''+c+'\',this)">'+c+'</span>';});
document.getElementById('categoryFilter').innerHTML=html;filterBrowse('全部',null);
}
function filterBrowse(cat,el){
if(el){document.querySelectorAll('.cat-btn').forEach(function(b){b.classList.remove('active');});el.classList.add('active');}
var list=cat==='全部'?proverbs:proverbs.filter(function(p){return p.category===cat;});
var html='';list.forEach(function(p,i){
html+='<div class="proverb-item" onclick="this.classList.toggle(\'expanded\')" style="padding:16px;background:var(--bg);border-radius:8px;margin-bottom:8px;cursor:pointer;border-left:3px solid var(--blue)">';
html+='<div style="font-size:1.1rem;margin-bottom:6px">'+p.text+'</div>';
html+='<div style="font-size:.8rem;color:var(--text2)">'+p.source+' · '+p.category+'</div>';
html+='<div style="font-size:.9rem;color:var(--blue);margin-top:8px;display:none">'+p.meaning+'</div>';
html+='</div>';
});
document.getElementById('browseList').innerHTML=html;
document.querySelectorAll('.proverb-item').forEach(function(item){
item.addEventListener('click',function(){var m=this.querySelector('div:last-child');m.style.display=m.style.display==='none'?'block':'none';});
});
}
function showResult(){
var correct=history.filter(Boolean).length;
var pct=Math.round(correct/totalQ*100);
var grade=pct>=90?'S':pct>=80?'A':pct>=70?'B':pct>=60?'C':'D';
document.getElementById('quizArea').innerHTML='<div style="text-align:center;padding:30px"><div style="font-size:4rem;margin-bottom:16px">'+grade+'</div><h2>游戏结束</h2><p style="color:var(--text2);margin:12px 0">正确率：'+pct+'% ('+correct+'/'+totalQ+')</p><p style="color:var(--text2)">最高连对：'+maxStreak+'</p><p style="color:var(--blue);font-size:1.2rem;margin-top:12px">总分：'+score+'</p><button class="btn" onclick="startGame()" style="margin-top:16px">再来一局</button></div>';
}
</script></body></html>
