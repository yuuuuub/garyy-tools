<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>存储管理</title>
<meta name="description" content="手机存储管理工具，分析和清理存储空间">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--muted:#8b949e;--green:#3fb950;--red:#f85149}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;min-height:100vh}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px}
.header h1{font-size:20px;font-weight:600}
.container{max-width:800px;margin:0 auto;padding:24px}
.tabs{display:flex;gap:0;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:20px;overflow:hidden}
.tab{flex:1;padding:12px;text-align:center;cursor:pointer;font-size:14px;color:var(--muted);transition:all .2s;border-right:1px solid var(--border)}
.tab:last-child{border-right:none}
.tab:hover{color:var(--text)}
.tab.active{background:var(--accent);color:#fff}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.btn{padding:8px 16px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-danger{border-color:var(--red);color:var(--red)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.add-form{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-bottom:16px}
.form-input{padding:10px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none;font-family:monospace}
.form-input:focus{border-color:var(--accent)}
.storage-list{max-height:400px;overflow-y:auto}
.storage-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--border);font-size:13px}
.storage-item:last-child{border-bottom:none}
.storage-key{font-weight:600;color:var(--accent);max-width:30%;word-break:break-all}
.storage-val{color:var(--muted);max-width:50%;word-break:break-all;font-family:monospace;font-size:12px}
.storage-actions{display:flex;gap:4px}
.storage-actions button{padding:4px 8px;font-size:11px}
.empty{text-align:center;padding:30px;color:var(--muted)}
.count-badge{background:var(--accent);color:#fff;padding:2px 8px;border-radius:10px;font-size:12px;margin-left:8px}
@media(max-width:600px){.add-form{grid-template-columns:1fr}.storage-item{flex-direction:column;gap:6px;align-items:flex-start}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="存储管理">
  <meta property="og:description" content="手机存储管理工具，分析和清理存储空间">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/storage-manager/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div class="header">
<span style="font-size:28px">💾</span>
<h1>存储管理</h1>
</div>
<div class="container">
<div class="tabs">
<div class="tab active" onclick="switchTab('local')">LocalStorage <span class="count-badge" id="localCount">0</span></div>
<div class="tab" onclick="switchTab('session')">SessionStorage <span class="count-badge" id="sessionCount">0</span></div>
</div>
<div id="localPanel">
<div class="toolbar">
<button class="btn" onclick="refreshStorage()">🔄 刷新</button>
<button class="btn btn-danger" onclick="clearStorage('local')">🗑️ 清除全部</button>
<button class="btn" onclick="exportStorage('local')">📥 导出</button>
<button class="btn" onclick="importStorage('local')">📤 导入</button>
<button class="btn" onclick="calcSize('local')">📏 计算大小</button>
</div>
<div class="add-form">
<input class="form-input" id="addKey" placeholder="Key">
<input class="form-input" id="addValue" placeholder="Value">
<button class="btn btn-primary" style="grid-column:1/-1" onclick="addStorage('local')">添加</button>
</div>
<div class="card"><div class="storage-list" id="localList"></div></div>
</div>
<div id="sessionPanel" style="display:none">
<div class="toolbar">
<button class="btn" onclick="refreshStorage()">🔄 刷新</button>
<button class="btn btn-danger" onclick="clearStorage('session')">🗑️ 清除全部</button>
<button class="btn" onclick="exportStorage('session')">📥 导出</button>
<button class="btn" onclick="calcSize('session')">📏 计算大小</button>
</div>
<div class="add-form">
<input class="form-input" id="addKeyS" placeholder="Key">
<input class="form-input" id="addValueS" placeholder="Value">
<button class="btn btn-primary" style="grid-column:1/-1" onclick="addStorage('session')">添加</button>
</div>
<div class="card"><div class="storage-list" id="sessionList"></div></div>
</div>
<div class="card" id="sizeInfo" style="display:none"><h2 style="color:var(--accent);margin-bottom:8px">📊 存储大小</h2><div id="sizeDetails"></div></div>
</div>
<input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">
<script>
let currentTab='local';
function switchTab(tab){
currentTab=tab;
document.querySelectorAll('.tab').forEach((t,i)=>{t.classList.toggle('active',i===(tab==='local'?0:1))});
document.getElementById('localPanel').style.display=tab==='local'?'block':'none';
document.getElementById('sessionPanel').style.display=tab==='session'?'block':'none';
refreshStorage();
}
function getStorage(type){return type==='local'?localStorage:sessionStorage}
function refreshStorage(){
['local','session'].forEach(type=>{
const s=getStorage(type);
const list=document.getElementById(type==='local'?'localList':'sessionList');
const count=document.getElementById(type==='local'?'localCount':'sessionCount');
const items=[];
for(let i=0;i<s.length;i++){const k=s.key(i);items.push({key:k,value:s.getItem(k)})}
count.textContent=items.length;
if(!items.length){list.innerHTML='<div class="empty">暂无数据</div>';return}
list.innerHTML=items.map(item=>`
<div class="storage-item">
<span class="storage-key">${esc(item.key)}</span>
<span class="storage-val">${esc(truncate(item.value,100))}</span>
<div class="storage-actions">
<button class="btn" onclick="editItem('${type}','${esc(item.key)}')">编辑</button>
<button class="btn btn-danger" onclick="removeItem('${type}','${esc(item.key)}')">删除</button>
</div>
</div>`).join('');
});
}
function addStorage(type){
const key=(type==='local'?document.getElementById('addKey'):document.getElementById('addKeyS')).value.trim();
const value=(type==='local'?document.getElementById('addValue'):document.getElementById('addValueS')).value;
if(!key)return;
getStorage(type).setItem(key,value);
refreshStorage();
}
function removeItem(type,key){getStorage(type).removeItem(key);refreshStorage()}
function clearStorage(type){if(confirm('确定清除所有数据？')){getStorage(type).clear();refreshStorage()}}
function editItem(type,key){
const newVal=prompt('编辑值:',getStorage(type).getItem(key));
if(newVal!==null){getStorage(type).setItem(key,newVal);refreshStorage()}
}
function exportStorage(type){
const s=getStorage(type);const data={};
for(let i=0;i<s.length;i++){const k=s.key(i);data[k]=s.getItem(k)}
const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${type}-storage.json`;a.click();
}
function importStorage(type){document.getElementById('importFile').dataset.type=type;document.getElementById('importFile').click()}
function handleImport(e){
const file=e.target.files[0];if(!file)return;
const reader=new FileReader();
reader.onload=ev=>{
try{
const data=JSON.parse(ev.target.result);const type=e.target.dataset.type;
Object.entries(data).forEach(([k,v])=>getStorage(type).setItem(k,v));
refreshStorage();showImportMsg('导入成功','success');
}catch(err){showImportMsg('导入失败: '+err.message,'error')}
};
reader.readAsText(file);e.target.value='';
}
function calcSize(type){
const s=getStorage(type);let total=0;
for(let i=0;i<s.length;i++){const k=s.key(i);total+=(k.length+(s.getItem(k)||'').length)*2}
const kb=(total/1024).toFixed(2);const mb=(total/1048576).toFixed(4);
document.getElementById('sizeInfo').style.display='block';
document.getElementById('sizeDetails').innerHTML=`
<div class="storage-item"><span class="storage-key">条目数</span><span class="storage-val">${s.length}</span></div>
<div class="storage-item"><span class="storage-key">占用空间</span><span class="storage-val">${kb} KB (${mb} MB)</span></div>
<div class="storage-item"><span class="storage-key">字符数</span><span class="storage-val">${total/2}</span></div>`;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function truncate(s,n){return s&&s.length>n?s.slice(0,n)+'...':s||''}
function showImportMsg(msg,type){let el=document.getElementById('importMsg');if(!el){el=document.createElement('div');el.id='importMsg';el.style.cssText='text-align:center;padding:10px;border-radius:8px;margin-top:12px;font-size:.85rem';const imp=document.querySelector('[onclick*="importStorage"]');if(imp&&imp.parentElement)imp.parentElement.appendChild(el);}el.textContent=msg;el.style.display='block';el.style.background=type==='error'?'rgba(239,68,68,.15)':'rgba(34,197,94,.15)';el.style.color=type==='error'?'var(--danger)':'var(--success)';setTimeout(()=>el.style.display='none',3000)}
refreshStorage();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
