<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS 渐变生成器 | CSS Gradient Generator</title>
<meta name="description" content="CSS渐变生成器，可视化创建linear-gradient、radial-gradient和conic-gradient">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
<script src="i18n.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--bg-secondary:#161b22;--bg-tertiary:#21262d;--border:#30363d;--text:#c9d1d9;--text-secondary:#8b949e;--accent:#58a6ff;--accent-hover:#79c0ff;--green:#3fb950;--green-bg:rgba(63,185,80,.15);--red:#f85149;--red-bg:rgba(248,81,73,.15);--orange:#d2991d;--cyan:#39d2c0;--blue:#79c0ff;--purple:#bc8cff;--radius:8px;--radius-sm:6px;--transition:.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--bg-secondary:#fff;--bg-tertiary:#f0f2f5;--border:#d0d7de;--text:#1f2328;--text-secondary:#656d76;--accent:#0969da;--accent-hover:#0550ae;--green:#1a7f37;--green-bg:rgba(26,127,55,.1);--red:#cf222e;--red-bg:rgba(207,34,46,.1);--orange:#9a6700;--cyan:#0598bc;--blue:#0969da;--purple:#8250df}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
.app-header{background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.app-header h1{font-size:1.25rem;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.app-header .subtitle{font-size:.8rem;color:var(--text-secondary)}
.main{max-width:1600px;margin:0 auto;padding:20px 24px;display:grid;grid-template-columns:320px 1fr;gap:20px;min-height:calc(100vh - 140px)}
@media(max-width:900px){.main{grid-template-columns:1fr}}
.panel{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.panel-header{padding:10px 16px;border-bottom:1px solid var(--border);font-size:.85rem;font-weight:500;color:var(--text-secondary)}
.control-section{padding:16px;border-bottom:1px solid var(--border)}
.control-section:last-child{border-bottom:none}
.control-label{font-size:.8rem;color:var(--text-secondary);margin-bottom:8px;display:block}
.type-btns{display:flex;gap:4px}
.type-btn{flex:1;padding:8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);cursor:pointer;font-size:.8rem;text-align:center;transition:var(--transition)}
.type-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.type-btn:hover:not(.active){border-color:var(--accent)}
.angle-control{display:flex;align-items:center;gap:12px;margin-top:8px}
.angle-slider{flex:1;-webkit-appearance:none;height:6px;border-radius:3px;background:var(--bg-tertiary);outline:none}
.angle-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg-secondary)}
.angle-value{min-width:50px;text-align:center;font-size:.85rem;font-family:'Fira Code',Consolas,monospace}
.color-stops{display:flex;flex-direction:column;gap:8px}
.color-stop{display:flex;gap:8px;align-items:center}
.color-stop input[type="color"]{width:36px;height:36px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;background:none;padding:2px}
.color-stop input[type="text"]{flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:.8rem;font-family:'Fira Code',Consolas,monospace}
.color-stop input[type="range"]{width:80px;accent-color:var(--accent)}
.color-stop .remove-btn{padding:6px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--red);cursor:pointer;font-size:.75rem}
.add-color-btn{width:100%;padding:8px;border:1px dashed var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--text-secondary);cursor:pointer;font-size:.8rem;margin-top:8px}
.add-color-btn:hover{border-color:var(--accent);color:var(--accent)}
.preview-area{display:flex;flex-direction:column;gap:20px}
.gradient-preview{width:100%;height:300px;border-radius:var(--radius);border:1px solid var(--border);background-size:20px 20px}
.code-output{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;font-family:'Fira Code',Consolas,monospace;font-size:.85rem;line-height:1.6;white-space:pre-wrap;word-break:break-all;position:relative}
.code-output .copy-btn{position:absolute;top:8px;right:8px;padding:4px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);cursor:pointer;font-size:.75rem}
.code-output .copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.preset{height:40px;border-radius:var(--radius-sm);border:2px solid transparent;cursor:pointer;transition:var(--transition)}
.preset:hover{border-color:var(--accent);transform:scale(1.05)}
.btn{padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text);cursor:pointer;font-size:.8rem;transition:var(--transition)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.toast{position:fixed;bottom:20px;right:20px;padding:10px 20px;border-radius:var(--radius-sm);background:var(--green);color:#fff;font-size:.85rem;z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header class="app-header">
<div>
<h1>🎨 CSS 渐变生成器</h1>
<span class="subtitle">可视化创建CSS渐变效果</span>
</div>
<div style="display:flex;gap:6px">
<button class="btn" onclick="resetStops()">重置颜色</button>
</div>
</header>
<div class="main">
<div class="panel" style="max-height:calc(100vh - 100px);overflow-y:auto">
<div class="panel-header">渐变设置</div>
<div class="control-section">
<label class="control-label">渐变类型</label>
<div class="type-btns">
<div class="type-btn active" data-type="linear" onclick="setType('linear',this)">线性</div>
<div class="type-btn" data-type="radial" onclick="setType('radial',this)">径向</div>
<div class="type-btn" data-type="conic" onclick="setType('conic',this)">锥形</div>
</div>
</div>
<div class="control-section" id="angleSection">
<label class="control-label">角度</label>
<div class="angle-control">
<input type="range" class="angle-slider" id="angleSlider" min="0" max="360" value="135" oninput="updateAngle()">
<span class="angle-value" id="angleValue">135°</span>
</div>
</div>
<div class="control-section" id="radialSection" style="display:none">
<label class="control-label">径向形状</label>
<div class="type-btns">
<div class="type-btn active" data-shape="circle" onclick="setShape('circle',this)">圆形</div>
<div class="type-btn" data-shape="ellipse" onclick="setShape('ellipse',this)">椭圆</div>
</div>
</div>
<div class="control-section">
<label class="control-label">颜色停靠点</label>
<div class="color-stops" id="colorStops"></div>
<button class="add-color-btn" onclick="addColorStop()">+ 添加颜色</button>
</div>
<div class="control-section">
<label class="control-label">预设渐变</label>
<div class="presets" id="presets"></div>
</div>
</div>
<div class="preview-area">
<div class="gradient-preview" id="preview"></div>
<div class="code-output">
<button class="copy-btn" onclick="copyCSS()">📋 复制</button>
<span id="cssCode">background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);</span>
</div>
</div>
</div>
<div class="toast" id="toast">已复制到剪贴板</div>

<script>
let gradientType='linear';
let angle=135;
let shape='circle';
let stops=[
{color:'#667eea',pos:0},
{color:'#764ba2',pos:100}
];

const presetGradients=[
{stops:[{color:'#667eea',pos:0},{color:'#764ba2',pos:100}]},
{stops:[{color:'#f093fb',pos:0},{color:'#f5576c',pos:100}]},
{stops:[{color:'#4facfe',pos:0},{color:'#00f2fe',pos:100}]},
{stops:[{color:'#43e97b',pos:0},{color:'#38f9d7',pos:100}]},
{stops:[{color:'#fa709a',pos:0},{color:'#fee140',pos:100}]},
{stops:[{color:'#a18cd1',pos:0},{color:'#fbc2eb',pos:100}]},
{stops:[{color:'#ffecd2',pos:0},{color:'#fcb69f',pos:100}]},
{stops:[{color:'#ff9a9e',pos:0},{color:'#fecfef',pos:100}]},
{stops:[{color:'#89f7fe',pos:0},{color:'#66a6ff',pos:100}]},
{stops:[{color:'#fddb92',pos:0},{color:'#d1fdff',pos:100}]},
{stops:[{color:'#c471f5',pos:0},{color:'#fa71cd',pos:100}]},
{stops:[{color:'#48c6ef',pos:0},{color:'#6f86d6',pos:100}]},
];

function renderStops(){
const el=document.getElementById('colorStops');
el.innerHTML=stops.map((s,i)=>`
<div class="color-stop">
<input type="color" value="${s.color}" onchange="updateStop(${i},'color',this.value)">
<input type="text" value="${s.color}" onchange="updateStop(${i},'color',this.value)" style="width:80px">
<input type="range" min="0" max="100" value="${s.pos}" oninput="updateStop(${i},'pos',parseInt(this.value))">
<span style="font-size:.75rem;color:var(--text-secondary);min-width:35px">${s.pos}%</span>
<button class="remove-btn" onclick="removeStop(${i})" ${stops.length<=2?'disabled style="opacity:.3"':''}>×</button>
</div>`).join('');
}

function updateStop(i,key,val){
stops[i][key]=val;
if(key==='color'){
const inputs=document.querySelectorAll('.color-stop')[i].querySelectorAll('input[type="text"]');
if(inputs[0])inputs[0].value=val;
}
renderStops();
updateGradient();
}

function addColorStop(){
const lastColor=stops[stops.length-1].color;
stops.push({color:randomColor(),pos:100});
renderStops();
updateGradient();
}

function removeStop(i){
if(stops.length<=2)return;
stops.splice(i,1);
renderStops();
updateGradient();
}

function randomColor(){
return '#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
}

function resetStops(){
stops=[{color:'#667eea',pos:0},{color:'#764ba2',pos:100}];
renderStops();
updateGradient();
}

function setType(type,el){
gradientType=type;
el.parentElement.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));
el.classList.add('active');
document.getElementById('angleSection').style.display=type==='linear'?'':'none';
document.getElementById('radialSection').style.display=type==='radial'?'':'none';
updateGradient();
}

function setShape(s,el){
shape=s;
el.parentElement.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));
el.classList.add('active');
updateGradient();
}

function updateAngle(){
angle=parseInt(document.getElementById('angleSlider').value);
document.getElementById('angleValue').textContent=angle+'°';
updateGradient();
}

function buildGradientCSS(){
const sorted=[...stops].sort((a,b)=>a.pos-b.pos);
const colorList=sorted.map(s=>s.color+' '+s.pos+'%').join(', ');
if(gradientType==='linear')return`linear-gradient(${angle}deg, ${colorList})`;
if(gradientType==='radial')return`radial-gradient(${shape}, ${colorList})`;
return`conic-gradient(from ${angle}deg, ${colorList})`;
}

function updateGradient(){
const css=buildGradientCSS();
document.getElementById('preview').style.background=css;
const code=`background: ${css};`;
document.getElementById('cssCode').textContent=code;
}

function copyCSS(){
const text='background: '+buildGradientCSS()+';';
navigator.clipboard.writeText(text).then(()=>{showToast()});
}

function showToast(){document.getElementById('toast').classList.add('show');setTimeout(()=>document.getElementById('toast').classList.remove('show'),1500)}

function renderPresets(){
const el=document.getElementById('presets');
el.innerHTML=presetGradients.map((p,i)=>{
const css=`linear-gradient(135deg, ${p.stops.map(s=>s.color+' '+s.pos+'%').join(', ')})`;
return`<div class="preset" style="background:${css}" onclick="applyPreset(${i})" title="点击应用"></div>`;
}).join('');
}

function applyPreset(i){
stops=presetGradients[i].stops.map(s=>({...s}));
renderStops();
updateGradient();
}

renderStops();
renderPresets();
updateGradient();
</script>
</body>
</html>
