<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>绿色建筑评估系统 | Green Building CN</title>
<meta property="og:title" content="绿色建筑评估系统 | Green Building CN">
<meta property="og:description" content="绿色建筑评估系统 | Green Building CN - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="绿色建筑评估系统，评估建筑的节能环保等级">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>">
<meta name="robots" content="index, follow">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--card:#1a1d27;--input:#242836;--text:#e2e4e9;--text2:#8b8fa3;--green:#22c55e;--green2:#16a34a;--blue:#3b82f6;--purple:#8b5cf6;--warn:#f59e0b;--border:#2a2e3a;--radius:12px;--radius-sm:8px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--input:#f0f2f5;--text:#1f2328;--text2:#656d76;--green:#1a7f37;--blue:#0969da;--purple:#8250df;--warn:#bf8700;--border:#d0d7de}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;line-height:1.6;padding:20px}
.container{max-width:860px;margin:0 auto;padding:0 12px}
header{text-align:center;padding:40px 0 24px}
header h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#22c55e,#10b981,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.subtitle{color:var(--text2);font-size:.95rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:20px}
.card h2{font-size:1.15rem;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-group{margin-bottom:20px}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.score-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.score-item:last-child{border-bottom:none}
.score-item label{flex:1;font-size:.88rem}
.score-item select{background:var(--input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;color:var(--text);font-size:.85rem;width:140px;outline:none;cursor:pointer}
.score-item select:focus{border-color:var(--green)}
.score-item .pts{min-width:50px;text-align:right;font-size:.85rem;font-weight:600;color:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 32px;border-radius:var(--radius-sm);font-size:1rem;font-weight:600;border:none;cursor:pointer;font-family:inherit;transition:all .2s;width:100%}
.btn-primary{background:var(--green);color:#000}
.btn-primary:hover{background:var(--green2);transform:translateY(-1px)}
.btn-secondary{background:var(--input);color:var(--text);border:1px solid var(--border);margin-top:10px}
.result-hidden{display:none}
.result-visible{display:block;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.grade-box{text-align:center;padding:30px;background:var(--input);border-radius:var(--radius);margin-bottom:20px}
.grade-num{font-size:5rem;font-weight:800;line-height:1}
.grade-label{font-size:1.2rem;font-weight:600;margin-top:8px}
.grade-desc{font-size:.9rem;color:var(--text2);margin-top:4px}
.grade-bar{width:100%;height:12px;background:#1e2230;border-radius:6px;overflow:hidden;margin-top:16px}
.grade-fill{height:100%;border-radius:6px;transition:width .6s ease}
.radar-container{display:flex;justify-content:center;margin:16px 0}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:500px){.detail-grid{grid-template-columns:1fr}}
.detail-item{background:var(--input);border-radius:var(--radius-sm);padding:14px;display:flex;justify-content:space-between;align-items:center}
.detail-item .d-label{font-size:.88rem}
.detail-item .d-val{font-weight:700}
.tips-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media(max-width:500px){.tips-grid{grid-template-columns:1fr}}
.tip{background:var(--input);border-radius:var(--radius-sm);padding:14px;font-size:.88rem;border-left:3px solid var(--green)}
.tip .tip-cat{font-size:.75rem;color:var(--text2);margin-bottom:4px}
footer{text-align:center;padding:24px 0;color:var(--text2);font-size:.82rem}
</style>
</head>
<body>
<div class="container">
<header><h1>绿色建筑评估系统</h1><p class="subtitle">评估建筑节能等级，打造绿色空间</p></header>
<div class="card" id="inputCard">
<div class="section-group">
<div class="section-title">🏗️ 建筑基本信息</div>
<div class="score-item"><label>建筑类型</label><select id="bType"><option value="20">住宅建筑</option><option value="18">办公建筑</option><option value="16">商业建筑</option><option value="15">学校建筑</option><option value="14">工业建筑</option></select></div>
<div class="score-item"><label>建筑面积（m²）</label><select id="bArea"><option value="8">≤100</option><option value="10">100-500</option><option value="12">500-2000</option><option value="14">2000-10000</option><option value="16">>10000</option></select></div>
</div>
<div class="section-group">
<div class="section-title">☀️ 能源系统</div>
<div class="score-item"><label>外墙保温等级</label><select id="insulation"><option value="5">无保温</option><option value="10">普通保温</option><option value="15">良好保温</option><option value="20">高性能保温</option></select></div>
<div class="score-item"><label>窗户类型</label><select id="window"><option value="3">单层玻璃</option><option value="8">双层中空</option><option value="12">Low-E玻璃</option><option value="16">三层中空Low-E</option></select></div>
<div class="score-item"><label>空调系统</label><select id="hvac"><option value="5">普通空调</option><option value="10">变频空调</option><option value="15">中央空调+热回收</option><option value="20">地源热泵系统</option></select></div>
<div class="score-item"><label>照明系统</label><select id="lighting"><option value="3">普通照明</option><option value="8">LED照明</option><option value="12">智能照明控制</option><option value="16">自然采光+智能控制</option></select></div>
</div>
<div class="section-group">
<div class="section-title">🌿 可再生能源</div>
<div class="score-item"><label>太阳能利用</label><select id="solar"><option value="0">无</option><option value="5">太阳能热水</option><option value="10">屋顶光伏</option><option value="15">光伏+光热一体化</option></select></div>
<div class="score-item"><label>风能利用</label><select id="wind"><option value="0">无</option><option value="5">小型风电</option><option value="10">风光互补</option></select></div>
</div>
<div class="section-group">
<div class="section-title">💧 水资源管理</div>
<div class="score-item"><label>节水器具</label><select id="water"><option value="3">普通器具</option><option value="8">节水器具</option><option value="12">雨水回收+节水</option><option value="16">中水回用系统</option></select></div>
<div class="score-item"><label>绿化设计</label><select id="green"><option value="2">无绿化</option><option value="6">基础绿化</option><option value="10">屋顶绿化</option><option value="14">立体绿化系统</option></select></div>
</div>
<button class="btn btn-primary" onclick="calc()">🏢 评估建筑等级</button>
</div>
<div id="result" class="result-hidden">
<div class="grade-box">
<div class="grade-num" id="gradeNum" style="color:var(--green)">--</div>
<div class="grade-label" id="gradeLabel">--</div>
<div class="grade-desc" id="gradeDesc">--</div>
<div class="grade-bar"><div class="grade-fill" id="gradeFill" style="width:0%"></div></div>
</div>
<div class="card">
<h2><span class="icon">📊</span> 各项得分</h2>
<div class="detail-grid" id="details"></div>
</div>
<div class="card">
<h2><span class="icon">🎯</span> 改进建议</h2>
<div class="tips-grid" id="tips"></div>
</div>
<button class="btn btn-secondary" onclick="resetForm()">🔄 重新评估</button>
</div>
<footer>绿色建筑评估 · 参考中国绿色建筑评价标准 GB/T 50378</footer>
</div>
<script>
const SECTIONS=[
{title:'能源效率',id:'energy',fields:['insulation','window','hvac','lighting'],max:64,color:'#22c55e'},
{title:'可再生能源',id:'renew',fields:['solar','wind'],max:25,color:'#3b82f6'},
{title:'水资源',id:'water',fields:['water','green'],max:30,color:'#06b6d4'}
];
function getVal(id){return parseInt(document.getElementById(id).value)||0}
function calc(){
const totalScore=SECTIONS.reduce((s,sec)=>s+sec.fields.reduce((fs,fid)=>fs+getVal(fid),0),0);
const maxScore=SECTIONS.reduce((s,sec)=>s+sec.max,0);
const pct=totalScore/maxScore*100;
let grade,color;
if(pct>=90){grade='三星级';color='#22c55e'}
else if(pct>=75){grade='二星级';color='#3b82f6'}
else if(pct>=60){grade='一星级';color='#f59e0b'}
else{grade='未达标';color='#ef4444'}
document.getElementById('gradeNum').textContent=totalScore;
document.getElementById('gradeNum').style.color=color;
document.getElementById('gradeLabel').textContent=grade;
document.getElementById('gradeLabel').style.color=color;
document.getElementById('gradeDesc').textContent=`总分 ${totalScore}/${maxScore}，得分率 ${pct.toFixed(1)}%`;
document.getElementById('gradeFill').style.width=pct+'%';
document.getElementById('gradeFill').style.background=color;
let dh='';
SECTIONS.forEach(sec=>{
const secScore=sec.fields.reduce((s,fid)=>s+getVal(fid),0);
dh+=`<div class="detail-item"><span class="d-label">${sec.title}</span><span class="d-val" style="color:${sec.color}">${secScore}/${sec.max}</span></div>`;
});
document.getElementById('details').innerHTML=dh;
const tips=[];
if(getVal('insulation')<15)tips.push({cat:'保温',text:'提升外墙保温性能至高性能等级，可降低能耗30%'});
if(getVal('window')<12)tips.push({cat:'窗户',text:'更换为Low-E中空玻璃，有效隔热降噪'});
if(getVal('solar')<10)tips.push({cat:'太阳能',text:'安装屋顶光伏系统，实现部分能源自给'});
if(getVal('water')<12)tips.push({cat:'节水',text:'安装雨水回收系统，用于绿化灌溉'});
if(getVal('hvac')<15)tips.push({cat:'空调',text:'升级为地源热泵系统，能效比提高40%'});
if(getVal('lighting')<12)tips.push({cat:'照明',text:'采用自然采光+智能照明控制，减少人工照明'});
if(tips.length===0)tips.push({cat:'优秀',text:'恭喜！您的建筑已达到高标准绿色建筑要求'});
let th='';
tips.forEach(t=>{th+=`<div class="tip"><div class="tip-cat">${t.cat}</div>${t.text}</div>`});
document.getElementById('tips').innerHTML=th;
document.getElementById('result').className='result-visible';
document.getElementById('result').scrollIntoView({behavior:'smooth'});
}
function resetForm(){document.getElementById('result').className='result-hidden';document.getElementById('inputCard').scrollIntoView({behavior:'smooth'})}
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
