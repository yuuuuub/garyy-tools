<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宝宝起名大全 v2</title><meta name="description" content="宝宝起名大全，根据姓氏、性别、寓意生成好听的中文名字"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#ec4899}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}.container{max-width:800px;margin:auto}h1{text-align:center;padding:20px 0 8px;font-size:1.5rem;font-weight:700}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}.input-group label{font-size:.85rem;color:var(--text2);min-width:60px}.input-group input,.input-group select{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.9rem;flex:1;min-width:120px}.btn{display:inline-block;padding:10px 20px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;transition:.2s}.btn:hover{opacity:.85}.btn-secondary{background:var(--border);color:var(--text)}.actions{display:flex;gap:8px;justify-content:center;margin-top:16px}.name-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;cursor:pointer;transition:transform .2s}.name-card:hover{transform:translateY(-2px)}.name-display{font-size:1.5rem;font-weight:700;color:var(--accent)}.name-pinyin{font-size:.8rem;color:var(--text2);margin-top:2px}.name-meaning{font-size:.9rem;color:var(--text);margin-top:8px;line-height:1.5}.name-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.name-tag{padding:2px 8px;background:var(--card);border:1px solid var(--border);border-radius:10px;font-size:.7rem;color:var(--text2)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:16px}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body,.container{animation:fadeIn .4s ease-out}
@media(max-width:600px){
  body{padding:12px!important}
  .container{max-width:100%!important;padding:0!important}
  h1{font-size:1.3rem!important}
  .card{padding:14px!important;margin-bottom:10px!important}
  .btn{padding:8px 16px!important;font-size:.85rem!important}
  textarea,.input-group input,.input-group select{font-size:16px!important}
  .tools-grid,.grid,.result-grid{grid-template-columns:1fr!important}
  table{font-size:.78rem!important}
  th,td{padding:5px 4px!important}
  .tab-bar{gap:4px!important}
  .tab{padding:6px 10px!important;font-size:.75rem!important}
}
</style><meta name="robots" content="index, follow"><meta property="og:title" content="宝宝起名大全 v2"><meta property="og:description" content="宝宝起名大全，根据姓氏性别寓意生成好听的中文名字"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👶</text></svg>"></head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>👶 宝宝起名大全 v2</h1><p class="sub">根据姓氏、性别、寓意生成好听的中文名字</p>
<div class="card">
<div class="input-group"><label>姓氏</label><input type="text" id="surname" placeholder="输入姓氏" value="王"></div>
<div class="input-group"><label>性别</label><select id="gender"><option value="boy">男孩</option><option value="girl">女孩</option><option value="any">不限</option></select></div>
<div class="input-group"><label>寓意</label><select id="meaning"><option value="wisdom">聪慧睿智</option><option value="gentle">温文尔雅</option><option value="strong">坚强刚毅</option><option value="beautiful">美丽大方</option><option value="lucky">吉祥如意</option><option value="nature">自然清新</option><option value="ambition">志向远大</option></select></div>
<div class="input-group"><label>字数</label><select id="nameLen"><option value="2">两字名</option><option value="3">三字名</option></select></div>
<div class="actions"><button class="btn" onclick="generate()">🎲 生成名字</button><button class="btn btn-secondary" onclick="generateBatch()">📋 批量生成</button></div>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
(function(){
var chars={
boy:{wisdom:['睿','哲','智','明','聪','博','文','学','思','悟','达','通','知','识','慧'],gentle:['温','雅','谦','和','润','泽','安','宁','平','和','文','彬','礼','让','善'],strong:['刚','毅','坚','强','勇','猛','威','武','壮','铁','钢','磊','森','峰','岳'],lucky:['福','祥','瑞','吉','庆','嘉','顺','安','康','泰','鑫','隆','兴','旺','盛'],nature:['林','森','泽','海','山','川','峰','岩','松','柏','涛','溪','泉','雨','风'],ambition:['鹏','飞','翔','宇','天','龙','虎','骏','豪','杰','英','雄','志','宏','远']},
girl:{wisdom:['慧','颖','敏','思','聪','灵','悟','知','学','文','雅','书','诗','画','琴'],gentle:['婉','淑','娴','静','柔','温','雅','婷','嫣','娅','婉','兰','荷','薇','蕊'],beautiful:['美','丽','颖','妍','婧','婵','娟','姣','好','秀','俊','俏','姝','娜','媛'],lucky:['福','祥','瑞','嘉','安','康','宁','泰','顺','鑫','喜','乐','欢','欣','悦'],nature:['兰','梅','竹','菊','荷','莲','桂','杏','桃','柳','雪','霜','云','月','星'],ambition:['鹏','翔','宇','天','飞','凤','龙','英','豪','杰','雄','志','宏','远','飞']}
};
function generate(){
var surname=document.getElementById('surname').value.trim()||'王';
var gender=document.getElementById('gender').value;
var meaning=document.getElementById('meaning').value;
var nameLen=parseInt(document.getElementById('nameLen').value);
var g=gender==='any'?(Math.random()>.5?'boy':'girl'):gender;
var pool=chars[g][meaning];
var name='';
var used={};
for(var i=0;i<nameLen-1;i++){
var c;do{c=pool[Math.floor(Math.random()*pool.length)]}while(used[c]);used[c]=true;name+=c;
}
var meanings={wisdom:'聪慧睿智，才华横溢',gentle:'温文尔雅，谦和有礼',strong:'坚强刚毅，勇敢无畏',beautiful:'美丽大方，光彩照人',lucky:'吉祥如意，幸福安康',nature:'自然清新，纯净美好',ambition:'志向远大，前程似锦'};
document.getElementById('result').innerHTML='<div class="name-card"><div class="name-display">'+surname+name+'</div><div class="name-meaning">'+meanings[meaning]+'</div><div class="name-tags"><span class="name-tag">'+(g==='boy'?'♂男孩':'♀女孩')+'</span><span class="name-tag">'+nameLen+'字名</span><span class="name-tag">'+meanings[meaning].split('，')[0]+'</span></div></div>';
}
function generateBatch(){
var surname=document.getElementById('surname').value.trim()||'王';
var gender=document.getElementById('gender').value;
var meaning=document.getElementById('meaning').value;
var nameLen=parseInt(document.getElementById('nameLen').value);
var g=gender==='any'?(Math.random()>.5?'boy':'girl'):gender;
var pool=chars[g][meaning];
var names=[];var used={};
while(names.length<8&&Object.keys(used).length<pool.length){
var c;do{c=pool[Math.floor(Math.random()*pool.length)]}while(used[c]);used[c]=true;
var name='';for(var i=0;i<nameLen-1;i++){var nc;do{nc=pool[Math.floor(Math.random()*pool.length)]}while(name.includes(nc));name+=nc;}
names.push(surname+c+name);
}
var meanings={wisdom:'聪慧睿智',gentle:'温文尔雅',strong:'坚强刚毅',beautiful:'美丽大方',lucky:'吉祥如意',nature:'自然清新',ambition:'志向远大'};
var html='<div class="grid">';
names.forEach(function(n){html+='<div class="name-card"><div class="name-display">'+n+'</div><div class="name-tags"><span class="name-tag">'+meanings[meaning]+'</span></div></div>';});
html+='</div>';
document.getElementById('result').innerHTML=html;
}
})();
</script></body></html>
