<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国民族文化大全</title><meta name="description" content="中国民族文化大全 - 56个民族百科"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--yellow:#eab308;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.95rem;transition:all .2s}.btn-primary{background:var(--blue);color:#fff}.btn-secondary{background:var(--border);color:var(--text)}.hidden{display:none}.cat-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}.cat-tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:.8rem;transition:all .2s}.cat-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.ethnic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}.ethnic-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;cursor:pointer;transition:all .2s}.ethnic-card:hover{border-color:var(--blue);transform:translateY(-2px)}.ethnic-icon{font-size:2rem;margin-bottom:8px}.ethnic-name{font-size:1.1rem;font-weight:600;margin-bottom:4px}.ethnic-info{font-size:.8rem;color:var(--text2);margin-bottom:4px}.ethnic-pop{font-size:.75rem;color:var(--green)}.ethnic-detail{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-top:12px;animation:fadeIn .3s}.ethnic-detail h3{margin-bottom:12px}.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}.detail-box{text-align:center;padding:12px;background:var(--bg);border-radius:8px}.detail-box .val{font-size:1rem;font-weight:600;color:var(--blue)}.detail-box .lbl{font-size:.75rem;color:var(--text2);margin-top:4px}.detail-section{margin-top:12px}.detail-section h4{font-size:.9rem;color:var(--blue);margin-bottom:6px}.detail-section p{font-size:.85rem;color:var(--text2);line-height:1.6}.search-box{margin-bottom:16px}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}.stat-box{text-align:center;padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}.stat-box .val{font-size:1.3rem;font-weight:700;color:var(--blue)}.stat-box .lbl{font-size:.75rem;color:var(--text2);margin-top:4px}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.container{animation:fadeIn .4s ease-out}h1{font-size:clamp(1.3rem,3vw,1.8rem);text-align:center;padding:20px 0 10px;font-weight:700}</style><meta property="og:title" content="中国民族文化大全"><meta property="og:description" content="中国民族文化大全 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎎</text> <div class="container"><h1>🎎 中国民族文化大全</h1><p class="sub">了解中国丰富多彩的少数民族文化</p>
<div class="stats-row"><div class="stat-box"><div class="val">55</div><div class="lbl">少数民族</div></div><div class="stat-box"><div class="val">1.25亿</div><div class="lbl">少数民族人口</div></div><div class="stat-box"><div class="val">30+</div><div class="lbl">语言语系</div></div><div class="stat-box"><div class="val">100+</div><div class="lbl">民族节日</div></div></div>
<div class="search-box"><input type="text" id="searchInput" placeholder="搜索民族名称或地区..." oninput="filterEthnics()"></div>

<script>
var ethnics=[
{name:'蒙古族',icon:'🏇',population:'629万',regions:['内蒙古','新疆','青海'],language:'蒙古语族',festivals:['那达慕','马奶节','祭敖包'],food:['手抓羊肉','奶酪','奶茶','马奶酒'],clothing:'蒙古袍、腰带、马靴、银饰帽',architecture:'蒙古包（易于搬迁的圆形帐篷）',crafts:'马头琴、蒙古族刺绣、唐卡',desc:'蒙古族是中国北方的游牧民族，以骑马、射箭、摔跤著称。那达慕大会是蒙古族最盛大的节日，包含赛马、摔跤、射箭三项竞技。蒙古族的长调民歌和呼麦已被列入世界非物质文化遗产。'},
{name:'藏族',icon:'🏔️',population:'706万',regions:['西藏','青海','四川','甘肃'],language:'藏语',festivals:['雪顿节','藏历新年','望果节','赛马节'],food:['糌粑','酥油茶','青稞酒','牦牛肉'],clothing:'藏袍、藏靴、邦典（围裙）',architecture:'碉房、寺庙（如布达拉宫）',crafts:'唐卡、藏刀、藏毯、面具',desc:'藏族主要生活在青藏高原，信仰藏传佛教。雪顿节是藏族最重要的节日之一，有晒佛、藏戏表演等活动。藏族的唐卡艺术和藏戏已被列入世界非物质文化遗产。'},
{name:'维吾尔族',icon:'🕌',population:'1177万',regions:['新疆'],language:'维吾尔语（突厥语族）',festivals:['古尔邦节','肉孜节（开斋节）','诺鲁孜节'],food:['抓饭','馕','烤羊肉','拉面'],clothing:'花帽（朵帕）、艾德莱斯绸裙',architecture:'阿以旺民居（平顶土木结构）',crafts:'艾德莱斯绸、维吾尔族地毯、乐器',desc:'维吾尔族主要生活在新疆，能歌善舞。维吾尔族的十二木卡姆（大型音乐套曲）已被列入世界非物质文化遗产。古尔邦节是维吾尔族最盛大的节日。'},
{name:'苗族',icon:'🦋',population:'1106万',regions:['贵州','湖南','云南','四川'],language:'苗语',festivals:['苗年','姊妹节','芦笙节','龙船节'],food:['酸汤鱼','糯米饭','苗家米酒'],clothing:'银饰头饰、百褶裙、刺绣服饰',architecture:'吊脚楼（依山而建的木质楼房）',crafts:'苗族银饰、苗绣、蜡染、芦笙',desc:'苗族以精美的银饰和刺绣闻名。苗族姑娘的银饰头饰重达数斤，是家族财富的象征。苗族的蜡染和苗绣已被列入国家级非物质文化遗产。'},
{name:'彝族',icon:'🔥',population:'983万',regions:['四川','云南','贵州'],language:'彝语',festivals:['火把节','彝族年','赛装节'],food:['坨坨肉','荞麦饼','泡水酒'],clothing:'查尔瓦（披毡）、百褶裙、英雄结',architecture:'土掌房（平顶土木建筑）',crafts:'彝族漆器、银饰、刺绣',desc:'彝族是中国西南地区的重要民族。火把节是彝族最盛大的节日，被誉为"东方的狂欢节"。彝族的十月太阳历和毕摩文化独具特色。'},
{name:'壮族',icon:'🌾',population:'1957万',regions:['广西','云南'],language:'壮语（侗台语族）',festivals:['三月三歌节','蚂拐节','花炮节'],food:['五色糯米饭','酸笋','壮锦粽子'],clothing:'壮锦服饰、绣花鞋',architecture:'干栏式建筑（竹木结构）',crafts:'壮锦、绣球、铜鼓',desc:'壮族是中国人口最多的少数民族。壮族三月三歌节是盛大的对歌活动，被列入国家级非物质文化遗产。壮锦与云锦、蜀锦、宋锦并称为中国四大名锦。'},
{name:'布依族',icon:'🌊',population:'357万',regions:['贵州','云南'],language:'布依语（侗台语族）',festivals:['三月三','六月六','查白歌节'],food:['五色糯米饭','花米饭','酸菜鱼'],clothing:'蜡染服饰、银饰',architecture:'石板房（石头建造的民居）',crafts:'蜡染、刺绣、土布纺织',desc:'布依族主要生活在贵州，擅长蜡染工艺。布依族的蜡染以其蓝白相间的美丽图案闻名于世。六月六是布依族最盛大的节日。'},
{name:'朝鲜族',icon:'🇰🇵',population:'170万',regions:['吉林','辽宁','黑龙江'],language:'朝鲜语',festivals:['秋夕','端午','正月十五'],food:['打糕','辣白菜','冷面','烤肉'],clothing:'韩服（朝鲜族传统服饰）',architecture:'朝鲜族民居（火炕、瓦房）',crafts:'长鼓舞、板舞、朝鲜族刺绣',desc:'朝鲜族主要生活在东北地区，能歌善舞。长鼓舞和板舞是朝鲜族最具代表性的舞蹈形式。朝鲜族的泡菜制作技艺和农乐舞已被列入国家级非遗。'},
{name:'满族',icon:'👑',population:'1042万',regions:['辽宁','吉林','河北','北京'],language:'满语（已濒危）',festivals:['颁金节','开山节','走百病'],food:['萨其马','酸菜白肉','满汉全席'],clothing:'旗袍（源自满族服饰）、马褂',architecture:'四合院（受满族影响）',crafts:'剪纸、刺绣、珍珠绣',desc:'满族建立了清朝，对中国近现代历史影响深远。满族的旗袍已发展为中国女性的代表性服饰。满族的颁金节是纪念满族命名的节日。'},
{name:'侗族',icon:'🎵',population:'348万',regions:['贵州','湖南','广西'],language:'侗语（侗台语族）',festivals:['花炮节','新禾节','侗年'],food:['酸鱼','酸肉','糯米饭','油茶'],clothing:'侗族服饰、银饰、头巾',architecture:'鼓楼、风雨桥（不用一钉一铆）',crafts:'侗族大歌、侗锦、银饰',desc:'侗族以鼓楼和风雨桥闻名。侗族大歌是一种多声部合唱，已被列入世界非物质文化遗产。侗族的鼓楼是村寨的中心，是议事和娱乐的场所。'},
{name:'瑶族',icon:'🏮',population:'330万',regions:['广西','湖南','云南','广东'],language:'瑶语',festivals:['盘王节','达努节','耍歌堂'],food:['五色糯米饭','竹筒饭','瑶家腊肉'],clothing:'瑶族服饰（支系众多，各具特色）',architecture:'干栏式建筑',crafts:'瑶绣、长鼓、银饰',desc:'瑶族支系众多，有"盘瑶""布努瑶""茶山瑶"等。盘王节是瑶族最重要的节日，纪念瑶族始祖盘王。瑶族的长鼓舞和瑶族服饰已被列入国家级非遗。'},
{name:'白族',icon:'🌺',population:'209万',regions:['云南'],语言:'白语',festivals:['三月街','绕三灵','火把节'],food:['饵丝','乳扇','白族三道茶'],clothing:'白族服饰（以白色为主）',architecture:'白族民居（三坊一照壁）',crafts:'白族扎染、银饰、木雕',desc:'白族主要生活在云南大理，崇尚白色。白族三道茶"一苦二甜三回味"是独特的茶道文化。白族的扎染工艺已被列入国家级非物质文化遗产。'},
{name:'哈尼族',icon:'梯田',population:'173万',regions:['云南'],language:'哈尼语',festivals:['十月年','六月年','新米节'],food:['竹筒饭','梯田红米','酸笋鸡'],clothing:'哈尼族服饰（以黑色为主）',architecture:'蘑菇房（土木结构的特色民居）',crafts:'哈尼梯田文化、刺绣、编织',desc:'哈尼族创造了世界文化遗产——哈尼梯田。哈尼梯田有1300多年历史，是人类改造自然的伟大杰作。哈尼族的多声部民歌已被列入国家级非遗。'},
{name:'哈萨克族',icon:'🦅',population:'156万',regions:['新疆','甘肃'],language:'哈萨克语（突厥语族）',festivals:['古尔邦节','纳吾鲁孜节','阿肯弹唱会'],food:['马肉马肠','纳仁','奶茶','奶疙瘩'],clothing:'哈萨克族服饰、花帽、皮衣',architecture:'哈萨克毡房（与蒙古包类似）',crafts:'冬不拉、哈萨克族刺绣、花毡',desc:'哈萨克族是中亚的游牧民族，擅长骑术和狩猎。阿肯弹唱会是哈萨克族的文化盛事，阿肯（民间歌手）即兴对唱。冬不拉是哈萨克族最具代表性的乐器。'},
{name:'傣族',icon:'🦚',population:'133万',regions:['云南'],语言:'傣语（侗台语族）',festivals:['泼水节','开门节','关门节'],food:['菠萝饭','竹筒饭','香茅草烤鱼'],clothing:'傣族筒裙、紧身上衣',architecture:'傣族竹楼（高脚竹木建筑）',crafts:'傣族织锦、孔雀舞、象脚鼓',desc:'傣族主要生活在云南西双版纳，以泼水节闻名世界。泼水节是傣族的新年，人们互相泼水祝福。傣族的孔雀舞和贝叶经已被列入国家级非遗。'}
];

var currentCat='all';

function selectCat(el,cat){
  document.querySelectorAll('.cat-tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');currentCat=cat;filterEthnics();
}

function filterEthnics(){
  var search=document.getElementById('searchInput').value.toLowerCase();
  var filtered=ethnics.filter(function(e){
    if(currentCat!=='all'){
      var match=false;
      if(currentCat==='服饰'&&e.clothing)match=true;
      if(currentCat==='节日'&&e.festivals.length)match=true;
      if(currentCat==='建筑'&&e.architecture)match=true;
      if(currentCat==='饮食'&&e.food.length)match=true;
      if(currentCat==='手工艺'&&e.crafts)match=true;
      if(!match)return false;
    }
    if(search&&!e.name.toLowerCase().includes(search)&&!e.regions.join('').toLowerCase().includes(search))return false;
    return true;
  });
  renderEthnics(filtered);
}

function renderEthnics(items){
  var h='<div class="ethnic-grid">';
  items.forEach(function(e,i){
    h+='<div class="ethnic-card" onclick="showDetail('+ethnics.indexOf(e)+')">';
    h+='<div class="ethnic-icon">'+e.icon+'</div>';
    h+='<div class="ethnic-name">'+e.name+'</div>';
    h+='<div class="ethnic-info">'+e.regions.slice(0,2).join('、')+'</div>';
    h+='<div class="ethnic-pop">👥 '+e.population+'</div></div>';
  });
  h+='</div>';
  document.getElementById('ethnicList').innerHTML=h;
  document.getElementById('ethnicDetail').classList.add('hidden');
}

function showDetail(idx){
  var e=ethnics[idx];
  var h='<div class="ethnic-detail"><div style="display:flex;justify-content:space-between;align-items:center"><h3>'+e.icon+' '+e.name+'</h3><button class="btn btn-secondary" onclick="filterEthnics()" style="font-size:.8rem">← 返回</button></div>';
  h+='<div class="detail-grid"><div class="detail-box"><div class="val">'+e.population+'</div><div class="lbl">人口</div></div>';
  h+='<div class="detail-box"><div class="val">'+e.regions[0]+'</div><div class="lbl">主要分布</div></div>';
  h+='<div class="detail-box"><div class="val">'+e.language+'</div><div class="lbl">语言</div></div></div>';
  h+='<div class="detail-section"><h4>📖 简介</h4><p>'+e.desc+'</p></div>';
  h+='<div class="detail-section"><h4>👘 传统服饰</h4><p>'+e.clothing+'</p></div>';
  h+='<div class="detail-section"><h4>🎉 传统节日</h4><p>'+e.festivals.join('、')+'</p></div>';
  h+='<div class="detail-section"><h4>🍜 传统饮食</h4><p>'+e.food.join('、')+'</p></div>';
  h+='<div class="detail-section"><h4>🏠 传统建筑</h4><p>'+e.architecture+'</p></div>';
  h+='<div class="detail-section"><h4>🎨 手工艺</h4><p>'+e.crafts+'</p></div></div>';
  document.getElementById('ethnicDetail').innerHTML=h;
  document.getElementById('ethnicDetail').classList.remove('hidden');
  document.getElementById('ethnicList').innerHTML='';
}

filterEthnics();
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input');if(inp)inp.focus()}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur()}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0})</script>
