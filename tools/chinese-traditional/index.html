<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简繁体转换</title><meta name="description" content="简繁体转换 - 在线中文简繁体转换工具"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}textarea{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-family:monospace;font-size:.85rem;resize:vertical;outline:none}textarea:focus{border-color:var(--blue)}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{padding:8px 16px;background:var(--border);color:var(--text);border:none;border-radius:6px;cursor:pointer;font-size:.85rem}.tab.active{background:var(--blue);color:#fff}</style><meta property="og:title" content="简繁体转换"><meta property="og:description" content="简繁体转换 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div class="container"><h1>🔄 简繁体转换</h1><p class="sub">在线中文简繁体转换工具</p>
<div class="tabs">
<button class="tab active" onclick="switchTab('toTraditional')">简体→繁体</button>
<button class="tab" onclick="switchTab('toSimplified')">繁体→简体</button>
</div>
<div class="card" id="toTraditionalCard">
<div class="label">输入简体中文</div>
<textarea id="simplifiedInput" placeholder="输入简体中文..."></textarea>
<button class="btn" onclick="convertToTraditional()">转换为繁体</button>
</div>
<div class="card" id="toSimplifiedCard" style="display:none">
<div class="label">输入繁体中文</div>
<textarea id="traditionalInput" placeholder="输入繁体中文..."></textarea>
<button class="btn" onclick="convertToSimplified()">转换为简体</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var currentTab='toTraditional';
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  event.target.classList.add('active');
  document.getElementById('toTraditionalCard').style.display=tab==='toTraditional'?'block':'none';
  document.getElementById('toSimplifiedCard').style.display=tab==='toSimplified'?'block':'none';
  document.getElementById('result').innerHTML='';
}
var simplifiedToTraditional={
  '国':'國','人':'人','民':'民','共':'共','和':'和','中':'中','国':'國','国':'國',
  '北':'北','京':'京','上':'上','海':'海','广':'廣','州':'州','深':'深','圳':'圳',
  '成':'成','都':'都','杭':'杭','南':'南','武':'武','汉':'漢','西':'西','安':'安',
  '重':'重','慶':'慶','天':'天','津':'津','苏':'蘇','无':'無','锡':'錫','宁':'寧',
  '波':'波','青':'青','島':'島','大':'大','連':'連','廈':'廈','門':'門','福':'福',
  '昆':'昆','明':'明','貴':'貴','陽':'陽','銀':'銀','川':'川','哈':'哈','爾':'爾',
  '濱':'濱','長':'長','春':'春','沈':'沈','濟':'濟','鄭':'鄭','太':'太','原':'原',
  '石':'石','家':'家','莊':'莊','合':'合','肥':'肥','昌':'昌',
  '你':'你','好':'好','我':'我','是':'是','的':'的','了':'了','在':'在','有':'有',
  '这':'這','那':'那','他':'他','她':'她','它':'它','们':'們','什':'什','么':'麼',
  '怎':'怎','麼':'麼','為':'為','什':'什','麼':'麼','哪':'哪','裡':'裡','誰':'誰',
  '多':'多','少':'少','一':'一','二':'二','三':'三','四':'四','五':'五','六':'六',
  '七':'七','八':'八','九':'九','十':'十','百':'百','千':'千','萬':'萬','億':'億',
  '大':'大','小':'小','長':'長','短':'短','高':'高','低':'低','快':'快','慢':'慢',
  '新':'新','舊':'舊','好':'好','壞':'壞','美':'美','醜':'醜','吃':'吃','喝':'喝',
  '走':'走','跑':'跑','看':'看','聽':'聽','說':'說','讀':'讀','寫':'寫','學':'學',
  '做':'做','用':'用','買':'買','賣':'賣','開':'開','關':'關'
};
var traditionalToSimplified={};
Object.keys(simplifiedToTraditional).forEach(function(key){
  traditionalToSimplified[simplifiedToTraditional[key]]=key;
});
function convertToTraditional(){
  var text=document.getElementById('simplifiedInput').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入简体中文</div>';return;}
  var result='';
  for(var i=0;i<text.length;i++){
    var char=text[i];
    result+=simplifiedToTraditional[char]||char;
  }
  showResult(result,'繁体中文');
}
function convertToSimplified(){
  var text=document.getElementById('traditionalInput').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入繁体中文</div>';return;}
  var result='';
  for(var i=0;i<text.length;i++){
    var char=text[i];
    result+=traditionalToSimplified[char]||char;
  }
  showResult(result,'简体中文');
}
function showResult(text,title){
  var r=document.getElementById('result');
  var html='<div class="card"><div class="section"><h3>📋 '+title+'</h3>';
  html+='<div class="result-block" id="resultText">'+escapeHtml(text)+'</div>';
  html+='<button class="copy-btn" onclick="copyResult()">复制结果</button></div></div>';
  r.innerHTML=html;
}
function escapeHtml(text){
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function copyResult(){
  var text=document.getElementById('resultText').textContent;
  navigator.clipboard.writeText(text).then(function(){alert('已复制到剪贴板');}).catch(function(){alert('复制失败');});
}
convertToTraditional();
</script></body></html>
