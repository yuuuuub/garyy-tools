<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>古诗配对器 - Chinese Poetry Matcher</title>
<meta name="description" content="古诗配对游戏 - 上下句配对、朝代配对、诗人配对，测试你对古诗的熟悉程度">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}
.container{max-width:800px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem;font-weight:700}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.input-group{margin-bottom:12px}
.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}
.input-group select{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}
.input-group select:focus{border-color:var(--blue);outline:none}
.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:8px;margin-right:8px}
.btn:hover{opacity:.85}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.stats-bar{display:flex;gap:16px;justify-content:center;margin:12px 0;font-size:.9rem;flex-wrap:wrap}
.stat{padding:6px 14px;background:var(--bg);border:1px solid var(--border);border-radius:6px}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match-item{padding:12px;background:var(--bg);border:2px solid var(--border);border-radius:8px;cursor:pointer;text-align:center;font-size:.9rem;transition:all .2s;min-height:44px;display:flex;align-items:center;justify-content:center}
.match-item:hover{border-color:var(--blue);transform:translateY(-1px)}
.match-item.selected{border-color:var(--blue);background:rgba(59,130,246,0.1)}
.match-item.correct{border-color:var(--green);background:rgba(35,134,54,0.15);color:var(--green)}
.match-item.wrong{border-color:var(--red);background:rgba(239,68,68,0.15);color:var(--red);animation:shake .3s}
.match-item.done{opacity:.5;pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.progress-bar{width:100%;height:6px;background:var(--border);border-radius:3px;margin:12px 0;overflow:hidden}
.progress-fill{height:100%;background:var(--blue);border-radius:3px;transition:width .3s}
.result-screen{text-align:center;padding:30px}
.result-score{font-size:2.5rem;font-weight:700;color:var(--blue);margin:16px 0}
.result-detail{font-size:1rem;color:var(--text2);margin:8px 0}
.result-rank{font-size:1.5rem;margin:16px 0;padding:12px;background:var(--bg);border-radius:8px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>🎯 古诗配对器</h1>
<p class="sub">上下句配对 - 测试你对古诗的熟悉程度</p>

<div class="card" id="setupPanel">
<div class="input-group">
<label>配对模式</label>
<select id="gameMode">
<option value="couplet">经典配对（上句对下句）</option>
<option value="dynasty">朝代配对（诗句对朝代）</option>
<option value="poet">诗人配对（诗句对诗人）</option>
</select>
</div>
<div class="input-group">
<label>难度选择</label>
<select id="difficulty">
<option value="5">简单（5对）</option>
<option value="8">中等（8对）</option>
<option value="12">困难（12对）</option>
</select>
</div>
<button class="btn" onclick="startGame()">🎮 开始游戏</button>
</div>

<div id="gamePanel" style="display:none">
<div class="stats-bar">
<div class="stat">⏱ <span id="timer">0</span>秒</div>
<div class="stat">✅ <span id="correctCount">0</span></div>
<div class="stat">❌ <span id="wrongCount">0</span></div>
<div class="stat">📊 <span id="progress">0</span>/<span id="totalPairs">0</span></div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
<p style="text-align:center;color:var(--text2);font-size:.85rem;margin:8px 0" id="gameHint">点击左侧选择，再点击右侧配对</p>
<div class="match-grid" id="matchGrid"></div>
</div>

<div id="resultPanel" style="display:none"></div>
</div>
<script src="../i18n.js" defer></script>
<script>
var coupletPairs=[
{upper:'床前明月光',lower:'疑是地上霜',poet:'李白',dynasty:'唐'},
{upper:'举头望明月',lower:'低头思故乡',poet:'李白',dynasty:'唐'},
{upper:'春眠不觉晓',lower:'处处闻啼鸟',poet:'孟浩然',dynasty:'唐'},
{upper:'白日依山尽',lower:'黄河入海流',poet:'王之涣',dynasty:'唐'},
{upper:'锄禾日当午',lower:'汗滴禾下土',poet:'李绅',dynasty:'唐'},
{upper:'红豆生南国',lower:'春来发几枝',poet:'王维',dynasty:'唐'},
{upper:'独在异乡为异客',lower:'每逢佳节倍思亲',poet:'王维',dynasty:'唐'},
{upper:'国破山河在',lower:'城春草木深',poet:'杜甫',dynasty:'唐'},
{upper:'感时花溅泪',lower:'恨别鸟惊心',poet:'杜甫',dynasty:'唐'},
{upper:'千山鸟飞绝',lower:'万径人踪灭',poet:'柳宗元',dynasty:'唐'},
{upper:'空山不见人',lower:'但闻人语响',poet:'王维',dynasty:'唐'},
{upper:'松下问童子',lower:'言师采药去',poet:'贾岛',dynasty:'唐'},
{upper:'少小离家老大回',lower:'乡音无改鬓毛衰',poet:'贺知章',dynasty:'唐'},
{upper:'两个黄鹂鸣翠柳',lower:'一行白鹭上青天',poet:'杜甫',dynasty:'唐'},
{upper:'远上寒山石径斜',lower:'白云生处有人家',poet:'杜牧',dynasty:'唐'},
{upper:'月落乌啼霜满天',lower:'江枫渔火对愁眠',poet:'张继',dynasty:'唐'},
{upper:'日照香炉生紫烟',lower:'遥看瀑布挂前川',poet:'李白',dynasty:'唐'},
{upper:'清明时节雨纷纷',lower:'路上行人欲断魂',poet:'杜牧',dynasty:'唐'},
{upper:'葡萄美酒夜光杯',lower:'欲饮琵琶马上催',poet:'王翰',dynasty:'唐'},
{upper:'羌笛何须怨杨柳',lower:'春风不度玉门关',poet:'王之涣',dynasty:'唐'},
{upper:'大漠孤烟直',lower:'长河落日圆',poet:'王维',dynasty:'唐'},
{upper:'海内存知己',lower:'天涯若比邻',poet:'王勃',dynasty:'唐'},
{upper:'飞流直下三千尺',lower:'疑是银河落九天',poet:'李白',dynasty:'唐'},
{upper:'桃花潭水深千尺',lower:'不及汪伦送我情',poet:'李白',dynasty:'唐'},
{upper:'劝君更尽一杯酒',lower:'西出阳关无故人',poet:'王维',dynasty:'唐'},
{upper:'人生得意须尽欢',lower:'莫使金樽空对月',poet:'李白',dynasty:'唐'},
{upper:'天生我材必有用',lower:'千金散尽还复来',poet:'李白',dynasty:'唐'},
{upper:'无边落木萧萧下',lower:'不尽长江滚滚来',poet:'杜甫',dynasty:'唐'},
{upper:'出师未捷身先死',lower:'长使英雄泪满襟',poet:'杜甫',dynasty:'唐'},
{upper:'曾经沧海难为水',lower:'除却巫山不是云',poet:'元稹',dynasty:'唐'},
{upper:'明月几时有',lower:'把酒问青天',poet:'苏轼',dynasty:'宋'},
{upper:'大江东去',lower:'浪淘尽千古风流人物',poet:'苏轼',dynasty:'宋'},
{upper:'但愿人长久',lower:'千里共婵娟',poet:'苏轼',dynasty:'宋'},
{upper:'寻寻觅觅',lower:'冷冷清清',poet:'李清照',dynasty:'宋'},
{upper:'生当作人杰',lower:'死亦为鬼雄',poet:'李清照',dynasty:'宋'},
{upper:'两情若是久长时',lower:'又岂在朝朝暮暮',poet:'秦观',dynasty:'宋'},
{upper:'衣带渐宽终不悔',lower:'为伊消得人憔悴',poet:'柳永',dynasty:'宋'},
{upper:'春风又绿江南岸',lower:'明月何时照我还',poet:'王安石',dynasty:'宋'},
{upper:'不识庐山真面目',lower:'只缘身在此山中',poet:'苏轼',dynasty:'宋'},
{upper:'枯藤老树昏鸦',lower:'小桥流水人家',poet:'马致远',dynasty:'元'}
];

var gameState={
mode:'couplet',pairs:[],leftItems:[],rightItems:[],selected:null,
matched:0,wrong:0,total:0,timer:0,timerId:null
};

function startGame(){
var mode=document.getElementById('gameMode').value;
var count=parseInt(document.getElementById('difficulty').value);
var shuffled=coupletPairs.slice().sort(function(){return Math.random()-0.5;});
var selected=shuffled.slice(0,count);

gameState.mode=mode;
gameState.pairs=selected;
gameState.matched=0;
gameState.wrong=0;
gameState.total=count;
gameState.timer=0;
gameState.selected=null;

document.getElementById('setupPanel').style.display='none';
document.getElementById('resultPanel').style.display='none';
document.getElementById('gamePanel').style.display='block';
document.getElementById('totalPairs').textContent=count;
updateStats();

var left=[];var right=[];
selected.forEach(function(p,i){
if(mode==='couplet'){
left.push({id:i,text:p.upper,pairId:i});
right.push({id:i,text:p.lower,pairId:i});
}else if(mode==='dynasty'){
left.push({id:i,text:p.upper,pairId:i});
right.push({id:i,text:p.dynasty+'朝',pairId:i});
}else{
left.push({id:i,text:p.upper,pairId:i});
right.push({id:i,text:p.poet,pairId:i});
}
});
left=shuffleArr(left);
right=shuffleArr(right);
gameState.leftItems=left;
gameState.rightItems=right;
renderGrid();
startTimer();
}

function renderGrid(){
var grid=document.getElementById('matchGrid');
var html='';
gameState.leftItems.forEach(function(item){
var cls='match-item';
if(item.matched)cls+=' done';
if(gameState.selected&&gameState.selected.id===item.id&&gameState.selected.side==='left')cls+=' selected';
html+='<div class="'+cls+'" onclick="selectItem('+item.id+',\'left\')" id="l'+item.id+'">'+item.text+'</div>';
});
gameState.rightItems.forEach(function(item){
var cls='match-item';
if(item.matched)cls+=' done';
html+='<div class="'+cls+'" onclick="selectItem('+item.id+',\'right\')" id="r'+item.id+'">'+item.text+'</div>';
});
grid.innerHTML=html;
}

function selectItem(id,side){
if(side==='left'){
var item=gameState.leftItems.find(function(l){return l.id===id;});
if(!item||item.matched)return;
gameState.selected={id:id,side:'left',pairId:item.pairId};
renderGrid();
}else{
if(!gameState.selected||gameState.selected.side!=='left')return;
var rightItem=gameState.rightItems.find(function(r){return r.id===id;});
if(!rightItem||rightItem.matched)return;
if(rightItem.pairId===gameState.selected.pairId){
var leftItem=gameState.leftItems.find(function(l){return l.id===gameState.selected.id;});
leftItem.matched=true;
rightItem.matched=true;
gameState.matched++;
var lEl=document.getElementById('l'+id);
var rEl=document.getElementById('r'+id);
if(lEl){lEl.classList.add('correct');}
if(rEl){rEl.classList.add('correct');}
renderGrid();
gameState.selected=null;
updateStats();
if(gameState.matched===gameState.total){endGame();}
}else{
gameState.wrong++;
var rEl=document.getElementById('r'+id);
if(rEl){rEl.classList.add('wrong');setTimeout(function(){rEl.classList.remove('wrong');},600);}
updateStats();
}
}
}

function startTimer(){
if(gameState.timerId)clearInterval(gameState.timerId);
gameState.timerId=setInterval(function(){
gameState.timer++;
document.getElementById('timer').textContent=gameState.timer;
},1000);
}

function updateStats(){
document.getElementById('correctCount').textContent=gameState.matched;
document.getElementById('wrongCount').textContent=gameState.wrong;
document.getElementById('progress').textContent=gameState.matched;
var pct=(gameState.matched/gameState.total)*100;
document.getElementById('progressFill').style.width=pct+'%';
}

function endGame(){
clearInterval(gameState.timerId);
var accuracy=Math.round((gameState.matched/(gameState.matched+gameState.wrong))*100);
var rank='学徒';
if(accuracy>=95&&gameState.timer<30)rank='🏆 诗仙';
else if(accuracy>=85)rank='⭐ 诗圣';
else if(accuracy>=70)rank='📖 诗人';
else if(accuracy>=50)rank='📝 学童';

var html='<div class="card result-screen">';
html+='<h2>🎉 游戏结束</h2>';
html+='<div class="result-score">'+accuracy+'%</div>';
html+='<div class="result-detail">用时：'+gameState.timer+'秒 | 正确：'+gameState.matched+' | 错误：'+gameState.wrong+'</div>';
html+='<div class="result-rank">称号：'+rank+'</div>';
html+='<button class="btn" onclick="resetGame()">🔄 再来一局</button>';
html+='</div>';
document.getElementById('resultPanel').innerHTML=html;
document.getElementById('gamePanel').style.display='none';
document.getElementById('resultPanel').style.display='block';
}

function resetGame(){
document.getElementById('setupPanel').style.display='block';
document.getElementById('gamePanel').style.display='none';
document.getElementById('resultPanel').style.display='none';
if(gameState.timerId)clearInterval(gameState.timerId);
}

function shuffleArr(arr){
var a=arr.slice();
for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
return a;
}
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
