<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字动态</title><meta name="description" content="汉字动态 - 在线查看汉字动态效果"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.dynamic-container{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0;position:relative;overflow:hidden;height:300px}.dynamic-char{font-size:6rem;font-weight:700;color:var(--blue);position:absolute;cursor:pointer;transition:all .3s}.dynamic-options{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0}.dynamic-option{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.85rem;transition:all .2s}.dynamic-option:hover{border-color:var(--blue)}.dynamic-option.active{border-color:var(--green);background:rgba(35,134,54,.1)}.score-display{font-size:1.2rem;margin:16px 0}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="汉字动态"><meta property="og:description" content="汉字动态 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🎭 汉字动态</h1><p class="sub">在线查看汉字动态效果</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" value="汉" oninput="createDynamic()">
</div>
<button class="btn" onclick="createDynamic()">创建动态</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var dynamicTypes=['follow','explode','scatter','wave','rain','matrix','particles','trail','orbit','spiral'];
var currentType='follow';
var chars=[];
var animationId=null;
function createDynamic(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  if(animationId)cancelAnimationFrame(animationId);
  var html='<div class="card">';
  html+='<div class="dynamic-options">';
  dynamicTypes.forEach(function(type){
    html+='<div class="dynamic-option '+(type===currentType?'active':'')+'" onclick="setType(\''+type+'\')">'+getTypeName(type)+'</div>';
  });
  html+='</div>';
  html+='<div class="dynamic-container" id="dynamicContainer">';
  html+='</div>';
  html+='<div class="btn-group" style="justify-content:center">';
  html+='<button class="btn" onclick="clearDynamic()">清空</button>';
  html+='</div></div>';
  r.innerHTML=html;
  startDynamic(char);
}
function setType(type){
  currentType=type;
  var char=document.getElementById('characterInput').value.trim()||'汉';
  createDynamic();
}
function getTypeName(type){
  switch(type){
    case 'follow':return'跟随';
    case 'explode':return'爆炸';
    case 'scatter':return'散射';
    case 'wave':return'波浪';
    case 'rain':return'下雨';
    case 'matrix':return'矩阵';
    case 'particles':return'粒子';
    case 'trail':return'轨迹';
    case 'orbit':return'轨道';
    case 'spiral':return'螺旋';
    default:return'未知';
  }
}
function startDynamic(char){
  var container=document.getElementById('dynamicContainer');
  if(!container)return;
  chars=[];
  switch(currentType){
    case 'follow':
      createFollowDynamic(container,char);
      break;
    case 'explode':
      createExplodeDynamic(container,char);
      break;
    case 'scatter':
      createScatterDynamic(container,char);
      break;
    case 'wave':
      createWaveDynamic(container,char);
      break;
    case 'rain':
      createRainDynamic(container,char);
      break;
    case 'matrix':
      createMatrixDynamic(container,char);
      break;
    case 'particles':
      createParticlesDynamic(container,char);
      break;
    case 'trail':
      createTrailDynamic(container,char);
      break;
    case 'orbit':
      createOrbitDynamic(container,char);
      break;
    case 'spiral':
      createSpiralDynamic(container,char);
      break;
  }
}
function createFollowDynamic(container,char){
  container.innerHTML='';
  var el=document.createElement('div');
  el.className='dynamic-char';
  el.textContent=char;
  el.style.left='50%';
  el.style.top='50%';
  el.style.transform='translate(-50%,-50%)';
  container.appendChild(el);
  container.onmousemove=function(e){
    var rect=container.getBoundingClientRect();
    var x=e.clientX-rect.left;
    var y=e.clientY-rect.top;
    el.style.left=x+'px';
    el.style.top=y+'px';
  };
}
function createExplodeDynamic(container,char){
  container.innerHTML='';
  for(var i=0;i<10;i++){
    var el=document.createElement('div');
    el.className='dynamic-char';
    el.textContent=char;
    el.style.left='50%';
    el.style.top='50%';
    el.style.fontSize='2rem';
    el.style.opacity='1';
    container.appendChild(el);
    (function(element,index){
      setTimeout(function(){
        var angle=index*36*Math.PI/180;
        var distance=100+Math.random()*100;
        element.style.left=(50+50*Math.cos(angle))+'%';
        element.style.top=(50+50*Math.sin(angle))+'%';
        element.style.opacity='0';
      },index*100);
    })(el,i);
  }
}
function createScatterDynamic(container,char){
  container.innerHTML='';
  for(var i=0;i<20;i++){
    var el=document.createElement('div');
    el.className='dynamic-char';
    el.textContent=char;
    el.style.left=Math.random()*100+'%';
    el.style.top=Math.random()*100+'%';
    el.style.fontSize='1rem'+Math.random()*2+'rem';
    el.style.opacity=Math.random();
    container.appendChild(el);
  }
}
function createWaveDynamic(container,char){
  container.innerHTML='';
  for(var i=0;i<10;i++){
    var el=document.createElement('div');
    el.className='dynamic-char';
    el.textContent=char;
    el.style.left=(10+i*8)+'%';
    el.style.top='50%';
    el.style.fontSize='2rem';
    el.style.animation='wave 1s ease-in-out '+(i*0.1)+'s infinite';
    container.appendChild(el);
  }
}
function createRainDynamic(container,char){
  container.innerHTML='';
  for(var i=0;i<15;i++){
    var el=document.createElement('div');
    el.className='dynamic-char';
    el.textContent=char;
    el.style.left=Math.random()*100+'%';
    el.style.top='-10%';
    el.style.fontSize='1.5rem';
    el.style.animation='rain '+(2+Math.random()*2)+'s linear '+(Math.random()*2)+'s infinite';
    container.appendChild(el);
  }
}
function createMatrixDynamic(container,char){
  container.innerHTML='';
  for(var i=0;i<20;i++){
    var el=document.createElement('div');
    el.className='dynamic-char';
    el.textContent=char;
    el.style.left=Math.random()*100+'%';
    el.style.top='-10%';
    el.style.fontSize='1rem';
    el.style.color='var(--green)';
    el.style.opacity='0.7';
    el.style.animation='rain '+(1+Math.random()*3)+'s linear '+(Math.random()*3)+'s infinite';
    container.appendChild(el);
  }
}
function createParticlesDynamic(container,char){
  container.innerHTML='';
  for(var i=0;i<30;i++){
    var el=document.createElement('div');
    el.className='dynamic-char';
    el.textContent=char;
    el.style.left='50%';
    el.style.top='50%';
    el.style.fontSize='0.5rem';
    el.style.opacity='0.5';
    el.style.animation='particle '+(2+Math.random()*2)+'s linear '+(Math.random()*2)+'s infinite';
    container.appendChild(el);
  }
}
function createTrailDynamic(container,char){
  container.innerHTML='';
  var el=document.createElement('div');
  el.className='dynamic-char';
  el.textContent=char;
  el.style.left='50%';
  el.style.top='50%';
  container.appendChild(el);
  var trail=[];
  for(var i=0;i<5;i++){
    var trailEl=document.createElement('div');
    trailEl.className='dynamic-char';
    trailEl.textContent=char;
    trailEl.style.fontSize='3rem';
    trailEl.style.opacity=(0.5-i*0.1);
    trailEl.style.color='var(--blue)';
    container.appendChild(trailEl);
    trail.push(trailEl);
  }
  var angle=0;
  function animate(){
    angle+=0.05;
    var x=50+30*Math.cos(angle);
    var y=50+30*Math.sin(angle);
    el.style.left=x+'%';
    el.style.top=y+'%';
    for(var i=trail.length-1;i>0;i--){
      trail[i].style.left=trail[i-1].style.left;
      trail[i].style.top=trail[i-1].style.top;
    }
    trail[0].style.left=x+'%';
    trail[0].style.top=y+'%';
    animationId=requestAnimationFrame(animate);
  }
  animate();
}
function createOrbitDynamic(container,char){
  container.innerHTML='';
  var chars=[char,'一','二','三','四','五'];
  chars.forEach(function(c,i){
    var el=document.createElement('div');
    el.className='dynamic-char';
    el.textContent=c;
    el.style.fontSize='2rem';
    el.style.animation='orbit '+(3+i*0.5)+'s linear infinite';
    el.style.animationDelay=(-i*0.5)+'s';
    container.appendChild(el);
  });
}
function createSpiralDynamic(container,char){
  container.innerHTML='';
  for(var i=0;i<20;i++){
    var el=document.createElement('div');
    el.className='dynamic-char';
    el.textContent=char;
    el.style.fontSize='1rem';
    el.style.animation='spiral '+(2+i*0.1)+'s linear infinite';
    el.style.animationDelay=(-i*0.1)+'s';
    container.appendChild(el);
  }
}
function clearDynamic(){
  if(animationId)cancelAnimationFrame(animationId);
  var container=document.getElementById('dynamicContainer');
  if(container)container.innerHTML='';
}
function randomCharacter(){
  var chars='的一是不了人我在有他这中大来上个国到说们为子和你地出会也时要就可以生能那得着下自之年过发后与都而行前里如面起把好她事件什让新方头经于主学公同年去到理放心之你到家到国到我到他到她到它到我们到你们到他们到她们到它们到大家到所有到每个到任何到没有到一切到全部到整个';
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  createDynamic();
}
createDynamic();
</script>
<style>
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
@keyframes rain{0%{transform:translateY(-10%);opacity:1}100%{transform:translateY(110%);opacity:0}}
@keyframes particle{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(calc(var(--x,0)*100px),calc(var(--y,0)*100px)) scale(0);opacity:0}}
@keyframes orbit{0%{transform:rotate(0deg) translateX(100px) rotate(0deg)}100%{transform:rotate(360deg) translateX(100px) rotate(-360deg)}}
@keyframes spiral{0%{transform:rotate(0deg) translateX(0) scale(1);opacity:1}100%{transform:rotate(720deg) translateX(150px) scale(0);opacity:0}}
</style></body></html>
