<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚖️ 利弊分析器</title>
<meta name="description" content="利弊分析器，帮助你系统性地权衡决策的优缺点">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:720px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],textarea{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.es{text-align:center;padding:40px;color:var(--text2)}
.pros-cons{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:480px){.pros-cons{grid-template-columns:1fr}}
.pros-box,.cons-box{border-radius:var(--radius);padding:16px;border:1px solid var(--border)}
.pros-box{background:rgba(34,197,94,.08);border-color:var(--success)}.cons-box{background:rgba(239,68,68,.08);border-color:var(--danger)}
.pros-box h3{color:var(--success);margin-bottom:8px;font-size:1rem}.cons-box h3{color:var(--danger);margin-bottom:8px;font-size:1rem}
.li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.li span{flex:1}
.li .del{padding:2px 8px;font-size:.75rem}
.score-bar{text-align:center;padding:20px;font-size:1.2rem}
.score-num{font-size:3rem;font-weight:700}
.score-pos{color:var(--success)}.score-neg{color:var(--danger)}.score-neu{color:var(--warn)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}.gr .st{text-align:center;padding:16px;background:var(--bg);border-radius:8px}.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="⚖️ 利弊分析器">
<meta property="og:description" content="利弊分析器，帮助你系统性地权衡决策的优缺点">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>⚖️ 利弊分析器</h1><p>系统性权衡决策，看清利弊全貌</p></div>

<div class="cd"><h2>决策主题</h2>
<input type="text" id="topic" placeholder="如：是否换工作、要不要买房">
<div class="bg"><button onclick="newAnalysis()">开始分析</button></div></div>

<div class="cd hidden" id="analysisCard"><h2 id="analysisTitle">分析</h2>
<div class="pros-cons">
<div class="pros-box"><h3>✅ 优点（Pros）</h3><input type="text" id="proInput" placeholder="添加一个优点" onkeydown="if(event.key==='Enter')addPro()">
<div class="bg"><button onclick="addPro()">添加</button></div>
<div id="proList"></div></div>
<div class="cons-box"><h3>❌ 缺点（Cons）</h3><input type="text" id="conInput" placeholder="添加一个缺点" onkeydown="if(event.key==='Enter')addCon()">
<div class="bg"><button onclick="addCon()">添加</button></div>
<div id="conList"></div></div>
</div>
<div class="score-bar" id="scoreBar"></div>
<div class="bg"><button onclick="saveAnalysis()">保存分析</button><button class="sec" onclick="resetAnalysis()">重置</button></div></div>

<div class="cd"><h2>历史分析</h2><div id="history" class="es">暂无历史记录</div>
<div class="bg"><button class="sec" onclick="clearHistory()">清空历史</button></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
let currentAnalysis={topic:'',pros:[],cons:[]};
let analyses=JSON.parse(localStorage.getItem('pc_analyses')||'[]');

function newAnalysis(){
  const topic=$('topic').value.trim();
  if(!topic){alert('请输入决策主题');return;}
  currentAnalysis={topic,pros:[],cons:[]};
  $('analysisCard').classList.remove('hidden');
  $('analysisTitle').textContent='分析：'+topic;
  renderAnalysis();
}

function addPro(){
  const val=$('proInput').value.trim();
  if(!val)return;
  currentAnalysis.pros.push({id:Date.now(),text:val});
  $('proInput').value='';
  renderAnalysis();
}

function addCon(){
  const val=$('conInput').value.trim();
  if(!val)return;
  currentAnalysis.cons.push({id:Date.now(),text:val});
  $('conInput').value='';
  renderAnalysis();
}

function removePro(id){currentAnalysis.pros=currentAnalysis.pros.filter(p=>p.id!==id);renderAnalysis();}
function removeCon(id){currentAnalysis.cons=currentAnalysis.cons.filter(c=>c.id!==id);renderAnalysis();}

function renderAnalysis(){
  $('proList').innerHTML=currentAnalysis.pros.length?currentAnalysis.pros.map(p=>
    `<div class="li"><span>✅ ${p.text}</span><button class="dng del" onclick="removePro(${p.id})">删</button></div>`
  ).join(''):'<div class="es" style="padding:10px">暂无优点</div>';
  
  $('conList').innerHTML=currentAnalysis.cons.length?currentAnalysis.cons.map(c=>
    `<div class="li"><span>❌ ${c.text}</span><button class="dng del" onclick="removeCon(${c.id})">删</button></div>`
  ).join(''):'<div class="es" style="padding:10px">暂无缺点</div>';
  
  const diff=currentAnalysis.pros.length-currentAnalysis.cons.length;
  let cls='score-neu',label='⚖️ 均衡';
  if(diff>0){cls='score-pos';label='👍 倾向可行';}
  else if(diff<0){cls='score-neg';label='👎 倾向不可行';}
  $('scoreBar').innerHTML=`<div class="score-num ${cls}">${diff>0?'+':''}${diff}</div><div style="color:var(--text2)">${label}（优点 ${currentAnalysis.pros.length} / 缺点 ${currentAnalysis.cons.length}）</div>`;
}

function saveAnalysis(){
  if(!currentAnalysis.topic)return;
  analyses.push({...currentAnalysis,date:new Date().toLocaleDateString()});
  if(analyses.length>30)analyses=analyses.slice(-30);
  localStorage.setItem('pc_analyses',JSON.stringify(analyses));
  renderHistory();alert('已保存！');
}

function resetAnalysis(){currentAnalysis={topic:currentAnalysis.topic,pros:[],cons:[]};renderAnalysis();}

function clearHistory(){analyses=[];localStorage.setItem('pc_analyses',JSON.stringify(analyses));renderHistory();}

function renderHistory(){
  $('history').innerHTML=analyses.length?analyses.map((a,i)=>`<div style="padding:10px 0;border-bottom:1px solid var(--border)">
    <div style="display:flex;justify-content:space-between;align-items:center"><strong>${a.topic}</strong><span class="tag">${a.date}</span></div>
    <div style="font-size:.85rem;color:var(--text2);margin-top:4px">✅ ${a.pros.length} 优点 · ❌ ${a.cons.length} 缺点 · ${a.pros.length>=a.cons.length?'👍 倾向可行':'👎 倾向不可行'}</div>
    <button class="dng" style="padding:2px 8px;font-size:.75rem;margin-top:6px" onclick="analyses.splice(${i},1);localStorage.setItem('pc_analyses',JSON.stringify(analyses));renderHistory()">删除</button>
  </div>`).reverse().join(''):'<div class="es">暂无历史记录</div>';
}

renderHistory();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
