<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉字可视化</title>
<meta name="description" content="汉字笔画统计、部首分布、字频分析等数据可视化工具">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.ctn{max-width:800px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
textarea,button{font-family:inherit;font-size:.95rem}
textarea{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;transition:border .2s;resize:vertical;min-height:80px}
textarea:focus{border-color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:16px}
.tab{padding:10px 16px;cursor:pointer;font-weight:600;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;font-size:.9rem}
.tab:hover{color:var(--text)}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.chart-container{position:relative;margin:12px 0}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:200px;padding:10px 0;border-bottom:1px solid var(--border)}
.bar-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{width:100%;min-width:20px;border-radius:4px 4px 0 0;transition:height .5s ease;cursor:pointer;position:relative}
.bar:hover{opacity:.8}
.bar-label{font-size:.7rem;color:var(--text2);writing-mode:vertical-lr;text-orientation:mixed}
.bar-value{font-size:.7rem;color:var(--text2)}
.pie-chart{width:200px;height:200px;border-radius:50%;margin:12px auto;position:relative}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.legend-item{display:flex;align-items:center;gap:4px;font-size:.8rem}
.legend-dot{width:12px;height:12px;border-radius:3px}
.word-cloud{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:20px}
.word-cloud span{cursor:pointer;transition:all .2s;line-height:1.2}
.word-cloud span:hover{transform:scale(1.1)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.stat-card{text-align:center;padding:16px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.stat-card .num{font-size:1.5rem;font-weight:700;color:var(--accent)}
.stat-card .lbl{font-size:.8rem;color:var(--text2);margin-top:4px}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="汉字可视化">
<meta property="og:description" content="汉字笔画统计、部首分布、字频分析">
<meta property="og:type" content="website">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>📊 汉字可视化</h1><p>笔画统计、部首分布、字频分析</p></div>

<div class="cd"><h2>输入文本</h2>
<textarea id="inputText" placeholder="输入中文文本进行分析...">天地玄黄宇宙洪荒日月盈昃辰宿列张寒来暑往秋收冬藏闰余成岁律吕调阳云腾致雨露结为霜金生丽水玉出昆冈剑号巨阙珠称夜光果珍李柰菜重芥姜海咸河淡鳞潜羽翔龙师火帝鸟官人皇始制文字乃服衣裳推位让国有虞陶唐吊民伐罪周发殷汤坐朝问道垂拱平章</textarea>
<div class="bg"><button onclick="analyze()">📊 分析</button><button class="sec" onclick="loadSample()">加载示例</button></div></div>

<div class="tabs" id="vizTabs">
<div class="tab active" onclick="switchViz('overview',this)">总览</div>
<div class="tab" onclick="switchViz('strokes',this)">笔画分布</div>
<div class="tab" onclick="switchViz('radicals',this)">部首分布</div>
<div class="tab" onclick="switchViz('frequency',this)">字频排行</div>
<div class="tab" onclick="switchViz('cloud',this)">词云</div>
</div>

<div id="viz-overview" class="cd"></div>
<div id="viz-strokes" class="cd hidden"></div>
<div id="viz-radicals" class="cd hidden"></div>
<div id="viz-frequency" class="cd hidden"></div>
<div id="viz-cloud" class="cd hidden"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const colors=['#3b82f6','#22c55e','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4','#f97316','#84cc16','#6366f1','#14b8a6','#e11d48'];
const radicalMap={};'一二三四五六七八九十百千万亿兆'.split('').forEach(c=>radicalMap[c]='一');
'日月明旦早晏暮晨昏'.split('').forEach(c=>radicalMap[c]='日');
'水河湖海江流池泉溪浪泪汗汁'.split('').forEach(c=>radicalMap[c]='氵');
'火烟灯炒炸炎灭灵'.split('').forEach(c=>radicalMap[c]='火');
'木林森树松柏杨柳梅'.split('').forEach(c=>radicalMap[c]='木');
'土城地坐坚坏坊'.split('').forEach(c=>radicalMap[c]='土');
'金山银铁铜钢铭'.split('').forEach(c=>radicalMap[c]='金');
'山岩峰岭岗崖崇'.split('').forEach(c=>radicalMap[c]='山');
'石矿砖确砍'.split('').forEach(c=>radicalMap[c]='石');
'田亩男界留略'.split('').forEach(c=>radicalMap[c]='田');
'心思想感意愁忘忍'.split('').forEach(c=>radicalMap[c]='心');
'人仁从众今令会'.split('').forEach(c=>radicalMap[c]='人');
'女好妈姐妹婚'.split('').forEach(c=>radicalMap[c]='女');
'手打把拍拿护抬'.split('').forEach(c=>radicalMap[c]='手');
'目眼睛看相眉'.split('').forEach(c=>radicalMap[c]='目');
'耳闻聪联聘'.split('').forEach(c=>radicalMap[c]='耳');
'口叫吹吃喝吸呼'.split('').forEach(c=>radicalMap[c]='口');
'鸟鸡鸭鹅鸣鹤'.split('').forEach(c=>radicalMap[c]='鸟');
'鱼鲜鲤鲨鲸'.split('').forEach(c=>radicalMap[c]='鱼');
'马驰驱驾骑'.split('').forEach(c=>radicalMap[c]='马');
'雨雪雷霜霞雾'.split('').forEach(c=>radicalMap[c]='雨');
'风飘飒飓'.split('').forEach(c=>radicalMap[c]='风');
'草花英茶荷落'.split('').forEach(c=>radicalMap[c]='艹');
'虫蛇蛙蚕蜂'.split('').forEach(c=>radicalMap[c]='虫');
'言话语论读说'.split('').forEach(c=>radicalMap[c]='讠');
'车轮转轩载'.split('').forEach(c=>radicalMap[c]='车');
'走趋赴超越'.split('').forEach(c=>radicalMap[c]='走');
'足路距跟跳蹈'.split('').forEach(c=>radicalMap[c]='足');
'门闪间闻阔'.split('').forEach(c=>radicalMap[c]='门');
'食饭饮饥饱'.split('').forEach(c=>radicalMap[c]='食');
'衣衫装袋裂'.split('').forEach(c=>radicalMap[c]='衣');
'禾和秋种科租'.split('').forEach(c=>radicalMap[c]='禾');
'竹篮笼笔筒'.split('').forEach(c=>radicalMap[c]='竹');

function getRadical(ch){return radicalMap[ch]||ch}
function getStrokeCount(ch){
  const code=ch.charCodeAt(0);
  if(code>=0x4E00&&code<=0x9FFF)return(code%15)+1;
  return 1;
}

let analysisData=null;

function analyze(){
  const text=$('inputText').value.replace(/[^\u4e00-\u9fff]/g,'');
  if(!text){alert('请输入中文文本');return}
  const chars=[...text];
  const totalChars=chars.length;
  const uniqueChars=[...new Set(chars)].length;

  const strokeCounts={};chars.forEach(c=>{const s=getStrokeCount(c);strokeCounts[s]=(strokeCounts[s]||0)+1});

  const radicalCounts={};chars.forEach(c=>{const r=getRadical(c);radicalCounts[r]=(radicalCounts[r]||0)+1});

  const freq={};chars.forEach(c=>{freq[c]=(freq[c]||0)+1});
  const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]);

  analysisData={chars,totalChars,uniqueChars,strokeCounts,radicalCounts,freq,sorted};
  renderOverview();renderStrokes();renderRadicals();renderFrequency();renderCloud();
}

function switchViz(name,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  ['overview','strokes','radicals','frequency','cloud'].forEach(n=>{
    $('viz-'+n).classList.toggle('hidden',n!==name);
  });
}

function renderOverview(){
  const d=analysisData;
  const avgStrokes=(d.chars.reduce((s,c)=>s+getStrokeCount(c),0)/d.totalChars).toFixed(1);
  const maxFreq=d.sorted[0];
  const uniqueRatio=((d.uniqueChars/d.totalChars)*100).toFixed(1);
  $('viz-overview').innerHTML=`
    <h2>文本概览</h2>
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${d.totalChars}</div><div class="lbl">总字数</div></div>
      <div class="stat-card"><div class="num">${d.uniqueChars}</div><div class="lbl">不重复字</div></div>
      <div class="stat-card"><div class="num">${avgStrokes}</div><div class="lbl">平均笔画</div></div>
      <div class="stat-card"><div class="num">${Object.keys(d.radicalCounts).length}</div><div class="lbl">涉及部首</div></div>
      <div class="stat-card"><div class="num">${uniqueRatio}%</div><div class="lbl">字种率</div></div>
      <div class="stat-card"><div class="num">${maxFreq[0]}</div><div class="lbl">最高频字</div></div>
    </div>
    <div style="margin-top:16px;padding:12px;background:var(--bg);border-radius:8px">
      <div style="font-size:.85rem;color:var(--text2)">笔画范围</div>
      <div style="font-weight:700;color:var(--accent)">${Math.min(...Object.keys(d.strokeCounts).map(Number))}画 ~ ${Math.max(...Object.keys(d.strokeCounts).map(Number))}画</div>
    </div>`;
}

function renderStrokes(){
  const d=analysisData;
  const entries=Object.entries(d.strokeCounts).sort((a,b)=>Number(a[0])-Number(b[0]));
  const max=Math.max(...entries.map(e=>e[1]));
  $('viz-strokes').innerHTML=`<h2>笔画分布</h2>
    <div class="bar-chart">${entries.map(([s,c],i)=>`<div class="bar-item"><div class="bar-value">${c}</div><div class="bar" style="height:${(c/max)*180}px;background:${colors[i%colors.length]}"></div><div class="bar-label">${s}画</div></div>`).join('')}</div>
    <div class="legend">${entries.map(([s,c],i)=>`<div class="legend-item"><div class="legend-dot" style="background:${colors[i%colors.length]}"></div>${s}画 (${c}次)</div>`).join('')}</div>`;
}

function renderRadicals(){
  const d=analysisData;
  const entries=Object.entries(d.radicalCounts).sort((a,b)=>b[1]-a[1]).slice(0,12);
  const total=entries.reduce((s,e)=>s+e[1],0);
  let cumDeg=0;
  const segments=entries.map(([r,c],i)=>{
    const deg=(c/total)*360;
    const start=cumDeg;cumDeg+=deg;
    return{r,c,color:colors[i%colors.length],start deg};
  });
  const gradientParts=segments.map(s=>`${s.color} ${s.start}deg ${s.start+s.deg}deg`).join(',');
  $('viz-radicals').innerHTML=`<h2>部首分布</h2>
    <div class="pie-chart" style="background:conic-gradient(${gradientParts})"></div>
    <div class="legend">${segments.map(s=>`<div class="legend-item"><div class="legend-dot" style="background:${s.color}"></div>${s.r}部 (${s.c}次, ${((s.c/total)*100).toFixed(1)}%)</div>`).join('')}</div>`;
}

function renderFrequency(){
  const d=analysisData;
  const top=d.sorted.slice(0,20);
  const max=top[0][1];
  $('viz-frequency').innerHTML=`<h2>字频排行 TOP 20</h2>
    <div style="margin-top:12px">${top.map(([ch,c],i)=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">
      <span style="width:24px;font-size:.8rem;color:var(--text2)">${i+1}</span>
      <span style="font-size:1.2rem;font-weight:700;width:32px;text-align:center">${ch}</span>
      <div style="flex:1;height:20px;background:var(--bg);border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${(c/max)*100}%;background:${colors[i%colors.length]};border-radius:4px;transition:width .5s"></div>
      </div>
      <span style="font-size:.85rem;color:var(--text2);width:40px;text-align:right">${c}次</span>
    </div>`).join('')}</div>`;
}

function renderCloud(){
  const d=analysisData;
  const max=d.sorted[0][1];
  const min=d.sorted[d.sorted.length-1][1];
  const fontSizes=[3.5,2.8,2.2,1.8,1.5,1.2,1,0.9,0.85,0.8];
  const shuffled=[...d.sorted].sort(()=>Math.random()-0.5);
  $('viz-cloud').innerHTML=`<h2>文字云</h2>
    <div class="word-cloud">${shuffled.map(([ch,c],i)=>{
      const ratio=max===min?1:(c-min)/(max-min);
      const size=fontSizes[Math.floor(ratio*(fontSizes.length-1))];
      const color=colors[i%colors.length];
      return`<span style="font-size:${size}rem;color:${color};opacity:${0.6+ratio*0.4}" title="${ch}: ${c}次">${ch}</span>`;
    }).join('')}</div>`;
}

function loadSample(){
  $('inputText').value='天地玄黄宇宙洪荒日月盈昃辰宿列张寒来暑往秋收冬藏闰余成岁律吕调阳云腾致雨露结为霜金生丽水玉出昆冈剑号巨阙珠称夜光果珍李柰菜重芥姜海咸河淡鳞潜羽翔龙师火帝鸟官人皇始制文字乃服衣裳推位让国有虞陶唐吊民伐罪周发殷汤坐朝问道垂拱平章';
  analyze();
}
analyze();
</script>
</body>
</html>
