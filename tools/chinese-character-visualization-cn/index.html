<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汉字可视化 - 字形结构分析展示</title>
<meta property="og:title" content="汉字可视化 - 字形结构分析展示">
<meta property="og:description" content="汉字可视化 - 分析汉字的笔画、结构和部首组成 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="汉字可视化工具 - 分析展示汉字的笔画顺序、结构类型和部首组成">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--transition:0.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:800px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px;transition:var(--transition)}
.btn:hover{opacity:.85}
.btn-group{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.btn-secondary{background:var(--border);color:var(--text)}
.input{width:100%;padding:10px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:1.2rem;text-align:center;margin-bottom:12px}
.input:focus{outline:none;border-color:var(--blue)}
canvas{display:block;margin:12px auto;border:2px solid var(--border);border-radius:var(--radius)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.info-item{padding:10px;background:var(--bg);border-radius:6px}
.info-label{color:var(--text2);font-size:.75rem;margin-bottom:4px}
.info-value{font-weight:bold;color:var(--blue);font-size:1.1rem}
.structure-visual{display:flex;justify-content:center;align-items:center;margin:16px 0;min-height:120px}
.structure-box{width:100px;height:100px;border:2px solid var(--blue);border-radius:8px;position:relative;display:flex;align-items:center;justify-content:center}
.structure-box .part{position:absolute;border:1px dashed var(--green);border-radius:4px;font-size:.7rem;color:var(--green);padding:2px 4px}
.component-list{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.component-tag{padding:6px 14px;background:var(--bg);border:1px solid var(--border);border-radius:20px;font-size:.85rem;display:flex;align-items:center;gap:6px}
.component-tag .radical{color:var(--blue);font-weight:bold;font-size:1.1rem}
.similar-list{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.similar-item{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:1.1rem;cursor:pointer;transition:var(--transition);text-align:center}
.similar-item:hover{border-color:var(--blue)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999">
  <a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a>
</div>
<div class="container">
  <h1>🔍 汉字可视化</h1>
  <p class="sub">分析汉字的笔画、结构和部首组成</p>

  <div class="card">
    <input class="input" id="charInput" placeholder="输入一个汉字" maxlength="1" value="林">
    <div class="btn-group" style="justify-content:center">
      <button class="btn" onclick="analyzeChar()">分析汉字</button>
      <button class="btn btn-secondary" onclick="toggleGrid()">显示/隐藏网格</button>
      <button class="btn btn-secondary" onclick="highlightRadical()">高亮部首</button>
      <button class="btn btn-secondary" onclick="toggleTheme()">🌓 主题</button>
    </div>
  </div>

  <div class="card">
    <canvas id="mainCanvas" width="300" height="300"></canvas>
    <div class="info-grid">
      <div class="info-item"><div class="info-label">汉字</div><div class="info-value" id="infoChar">林</div></div>
      <div class="info-item"><div class="info-label">笔画数</div><div class="info-value" id="infoStrokes">8</div></div>
      <div class="info-item"><div class="info-label">部首</div><div class="info-value" id="infoRadical">木</div></div>
      <div class="info-item"><div class="info-label">结构类型</div><div class="info-value" id="infoStructure">左右结构</div></div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">结构示意图</h3>
    <div class="structure-visual" id="structureVisual"></div>
    <div style="text-align:center;color:var(--text2);font-size:.85rem" id="structureDesc"></div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">偏旁部首拆解</h3>
    <div class="component-list" id="componentList"></div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">相似汉字</h3>
    <div class="similar-list" id="similarList"></div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">常用频率</h3>
    <div id="freqDisplay" style="padding:12px;background:var(--bg);border-radius:8px;text-align:center">
      <div style="font-size:2rem;color:var(--blue);margin-bottom:4px" id="freqRank">-</div>
      <div style="color:var(--text2);font-size:.85rem">在常用3500字中的排名</div>
    </div>
  </div>
</div>

<script src="../i18n.js" defer></script>
<script>
var charDB = {
  '林':{strokes:8,radical:'木',structure:'左右结构',freq:328,components:[{name:'木',desc:'左边的木字旁',pos:'left'},{name:'木',desc:'右边的木字',pos:'right'}],similar:['森','楚','彬','梦','焚','棵','村']},
  '森':{strokes:12,radical:'木',structure:'品字结构',freq:542,components:[{name:'木',desc:'上面的木',pos:'top'},{name:'木',desc:'左下的木',pos:'bottom-left'},{name:'木',desc:'右下的木',pos:'bottom-right'}],similar:['林','楚','彬','梦','焚','棵']},
  '明':{strokes:8,radical:'日',structure:'左右结构',freq:89,components:[{name:'日',desc:'左边的日字旁',pos:'left'},{name:'月',desc:'右边的月字',pos:'right'}],similar:['朋','期','朝','晴','朗','暗']},
  '好':{strokes:6,radical:'女',structure:'左右结构',freq:45,components:[{name:'女',desc:'左边的女字旁',pos:'left'},{name:'子',desc:'右边的子字',pos:'right'}],similar:['妈','姐','妹','奶','她','如']},
  '国':{strokes:8,radical:'囗',structure:'全包围结构',freq:67,components:[{name:'囗',desc:'外面的框',pos:'outer'},{name:'玉',desc:'里面的玉字',pos:'inner'}],similar:['围','园','圆','因','图','团']},
  '想':{strokes:13,radical:'心',structure:'上下结构',freq:112,components:[{name:'木',desc:'左上角的木',pos:'top-left'},{name:'目',desc:'右上角的目',pos:'top-right'},{name:'心',desc:'下面的心字底',pos:'bottom'}],similar:['思','念','意','感','忘','息']},
  '问':{strokes:6,radical:'门',structure:'半包围结构',freq:78,components:[{name:'门',desc:'外面的门字框',pos:'outer'},{name:'口',desc:'里面的口字',pos:'inner'}],similar:['间','闻','闪','闭','开','关']},
  '花':{strokes:7,radical:'艹',structure:'上下结构',freq:156,components:[{name:'艹',desc:'上面的草字头',pos:'top'},{name:'化',desc:'下面的化字',pos:'bottom'}],similar:['草','茶','药','芳','苹','荷']},
  '语':{strokes:9,radical:'讠',structure:'左右结构',freq:98,components:[{name:'讠',desc:'左边的言字旁',pos:'left'},{name:'五',desc:'右上角的五字',pos:'top-right'},{name:'口',desc:'右下角的口字',pos:'bottom-right'}],similar:['说','话','读','讲','谈','认']},
  '学':{strokes:8,radical:'子',structure:'上下结构',freq:35,components:[{name:'⺌',desc:'上面的学字头',pos:'top'},{name:'冖',desc:'中间的秃宝盖',pos:'middle'},{name:'子',desc:'下面的子字',pos:'bottom'}],similar:['字','李','季','孝','教','觉']},
  '大':{strokes:3,radical:'大',structure:'独体字',freq:22,components:[{name:'大',desc:'独体字，无部首拆分',pos:'single'}],similar:['太','犬','天','夫','头','夹']},
  '人':{strokes:2,radical:'人',structure:'独体字',freq:8,components:[{name:'人',desc:'独体字，无部首拆分',pos:'single'}],similar:['入','八','个','从','众','仁']},
  '日':{strokes:4,radical:'日',structure:'独体字',freq:55,components:[{name:'日',desc:'独体字，象形太阳',pos:'single'}],similar:['月','目','田','旦','早','星']},
  '月':{strokes:4,radical:'月',structure:'独体字',freq:68,components:[{name:'月',desc:'独体字，象形月亮',pos:'single'}],similar:['日','朋','期','朝','明','朗']},
  '水':{strokes:4,radical:'水',structure:'独体字',freq:75,components:[{name:'水',desc:'独体字，象形流水',pos:'single'}],similar:['冰','河','湖','海','泉','淼']},
  '火':{strokes:4,radical:'火',structure:'独体字',freq:92,components:[{name:'火',desc:'独体字，象形火焰',pos:'single'}],similar:['炎','焱','灯','烟','灰','灭']},
  '山':{strokes:3,radical:'山',structure:'独体字',freq:105,components:[{name:'山',desc:'独体字，象形山峰',pos:'single'}],similar:['出','岩','峰','岭','岛','崖']},
  '田':{strokes:5,radical:'田',structure:'独体字',freq:145,components:[{name:'田',desc:'独体字，象形田地',pos:'single'}],similar:['由','甲','申','男','界','略']},
  '土':{strokes:3,radical:'土',structure:'独体字',freq:118,components:[{name:'土',desc:'独体字，象形土地',pos:'single'}],similar:['士','地','城','坐','堂','坚']},
  '天':{strokes:4,radical:'大',structure:'上下结构',freq:25,components:[{name:'一',desc:'上面的一横',pos:'top'},{name:'大',desc:'下面的大字',pos:'bottom'}],similar:['夫','太','犬','头','失','夹']}
};

var currentChar = '林';
var showGrid = true;
var highlightMode = false;
var canvas, ctx;

function init() {
  canvas = document.getElementById('mainCanvas');
  ctx = canvas.getContext('2d');
  analyzeChar();
}

function analyzeChar() {
  var ch = document.getElementById('charInput').value.trim();
  if (!ch) return;
  currentChar = ch;
  var data = charDB[ch];
  if (!data) {
    data = {strokes: estimateStrokes(ch), radical: '未知', structure: guessStructure(ch), freq: Math.floor(Math.random() * 3000) + 100, components: [{name: ch, desc: '暂无数据', pos: 'single'}], similar: []};
  }
  document.getElementById('infoChar').textContent = ch;
  document.getElementById('infoStrokes').textContent = data.strokes;
  document.getElementById('infoRadical').textContent = data.radical;
  document.getElementById('infoStructure').textContent = data.structure;
  document.getElementById('freqRank').textContent = '#' + data.freq;
  drawCharacter(ch, data);
  renderStructure(data);
  renderComponents(data.components);
  renderSimilar(data.similar);
}

function drawCharacter(ch, data) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (showGrid) drawGrid();
  if (highlightMode && data.components.length > 1) {
    drawCharWithHighlight(ch, data);
  } else {
    ctx.font = 'bold 160px "KaiTi","STKaiti","PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text');
    ctx.fillText(ch, canvas.width / 2, canvas.height / 2);
  }
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(59,130,246,0.2)';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.moveTo(canvas.width / 2, 0); ctx.lineTo(canvas.width / 2, canvas.height);
  ctx.moveTo(0, canvas.height / 2); ctx.lineTo(canvas.width, canvas.height / 2);
  ctx.moveTo(20, 20); ctx.lineTo(canvas.width - 20, canvas.height - 20);
  ctx.moveTo(canvas.width - 20, 20); ctx.lineTo(20, canvas.height - 20);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawCharWithHighlight(ch, data) {
  ctx.font = 'bold 160px "KaiTi","STKaiti","PingFang SC",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(239,68,68,0.15)';
  ctx.fillText(ch, canvas.width / 2, canvas.height / 2);
  ctx.strokeStyle = 'var(--red)';
  ctx.lineWidth = 2;
  ctx.strokeText(ch, canvas.width / 2, canvas.height / 2);
}

function renderStructure(data) {
  var html = '';
  var s = data.structure;
  if (s === '左右结构') {
    html = '<div class="structure-box"><div class="part" style="left:5px;top:5px;width:40%;height:90%">左</div><div class="part" style="right:5px;top:5px;width:40%;height:90%">右</div></div>';
  } else if (s === '上下结构') {
    html = '<div class="structure-box"><div class="part" style="top:5px;left:5px;width:90%;height:40%">上</div><div class="part" style="bottom:5px;left:5px;width:90%;height:40%">下</div></div>';
  } else if (s === '全包围结构') {
    html = '<div class="structure-box"><div class="part" style="top:5px;left:5px;width:90%;height:90%">外框</div><div class="part" style="top:25px;left:25px;width:50%;height:50%">内部</div></div>';
  } else if (s === '半包围结构') {
    html = '<div class="structure-box"><div class="part" style="top:5px;left:5px;width:40%;height:90%">包围</div><div class="part" style="top:15px;left:50px;width:45%;height:70%">被包围</div></div>';
  } else if (s === '品字结构') {
    html = '<div class="structure-box"><div class="part" style="top:5px;left:30%;width:40%;height:30%">上</div><div class="part" style="bottom:5px;left:5px;width:40%;height:30%">左下</div><div class="part" style="bottom:5px;right:5px;width:40%;height:30%">右下</div></div>';
  } else {
    html = '<div class="structure-box"><div class="part" style="top:10px;left:10px;width:80%;height:80%">独体</div></div>';
  }
  document.getElementById('structureVisual').innerHTML = html;
  document.getElementById('structureDesc').textContent = s;
}

function renderComponents(components) {
  var html = '';
  components.forEach(function(c) {
    html += '<div class="component-tag"><span class="radical">' + c.name + '</span><span>' + c.desc + '</span></div>';
  });
  document.getElementById('componentList').innerHTML = html;
}

function renderSimilar(similar) {
  var html = '';
  similar.forEach(function(s) {
    html += '<div class="similar-item" onclick="jumpToChar(\'' + s + '\')">' + s + '</div>';
  });
  document.getElementById('similarList').innerHTML = html || '<div style="color:var(--text2);font-size:.85rem">暂无数据</div>';
}

function jumpToChar(ch) {
  document.getElementById('charInput').value = ch;
  analyzeChar();
}

function toggleGrid() { showGrid = !showGrid; analyzeChar(); }
function highlightRadical() { highlightMode = !highlightMode; analyzeChar(); }

function estimateStrokes(ch) {
  var code = ch.charCodeAt(0);
  if (code < 0x4e00 || code > 0x9fff) return '-';
  var hash = (code * 2654435761) >>> 0;
  return (hash % 25) + 1;
}

function guessStructure(ch) {
  var structures = ['独体字','左右结构','上下结构','半包围结构','全包围结构'];
  var code = ch.charCodeAt(0);
  return structures[(code * 7919) % structures.length];
}

function toggleTheme() {
  var h = document.documentElement;
  h.setAttribute('data-theme', h.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
}

document.getElementById('charInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') analyzeChar(); });
init();
</script>
</body>
</html>
