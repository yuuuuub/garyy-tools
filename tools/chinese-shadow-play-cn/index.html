<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国皮影戏 - 光影之间 | Gary's Tools</title><meta name="description" content="中国皮影戏百科 - 皮影历史、制作工艺、表演艺术、代表剧目全解"><meta name="robots" content="index,follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#d4a574;--accent2:#8b6914}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#8b5e3c;--accent2:#6b4226}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;transition:background var(--transition),color var(--transition)}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem;font-weight:700}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.search-box{margin-bottom:16px}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.category-btn{padding:8px 16px;background:var(--border);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-size:.85rem;transition:all var(--transition)}.category-btn.active{background:var(--accent);color:#fff}.category-btn:hover{opacity:.85}.item{background:var( <div class="container"><h1>🎭 中国皮影戏</h1><p class="sub">皮影历史 · 制作工艺 · 表演艺术 · 代表剧目</p>

<div class="btn-group">
<button class="category-btn active" onclick="filterCat('all',this)">全部</button>
<button class="category-btn" onclick="filterCat('历史',this)">历史</button>
<button class="category-btn" onclick="filterCat('工艺',this)">工艺</button>
<button class="category-btn" onclick="filterCat('表演',this)">表演</button>
<button class="category-btn" onclick="filterCat('流派',this)">流派</button>

</div></div>

<script src="../i18n.js" defer></script>
<script>
var data=[
{title:'皮影戏起源',era:'西汉',cat:'历史',tags:['汉武帝','李夫人','光影'],desc:'相传起源于西汉，汉武帝思念亡妻李夫人，方士以光影术慰藉。',detail:'皮影戏起源有多种说法。最流行的传说是汉武帝思念亡妃李夫人，方士李少翁用棉帛裁成李夫人的影像，在帷幕后用灯光投影，武帝隔帐观看如见真人。虽然这个传说难以考证，但说明皮影戏与光影艺术的密切关系。',ref:'《汉书·李夫人传》'},
{title:'唐宋发展',era:'唐宋',cat:'历史',tags:['唐代','宋代','瓦舍勾栏'],desc:'唐代皮影戏开始成熟，宋代在瓦舍勾栏中广泛演出。',detail:'唐代皮影戏已相当成熟，寺院中用皮影讲经说法。宋代城市经济发展，皮影戏在瓦舍勾栏中广泛演出，成为市民娱乐的重要形式。宋代皮影戏已分化出不同的表演流派，出现了专业的皮影戏班子和艺人。',ref:'《东京梦华录》'},
{title:'明清鼎盛',era:'明清',cat:'历史',tags:['鼎盛','地方流派','宫廷'],desc:'明清是皮影戏的鼎盛期，形成了众多地方流派。',detail:'明清时期皮影戏达到鼎盛。各地形成了鲜明的地方特色：陕西皮影粗犷豪放，唐山皮影细腻精美，四川皮影诙谐幽默。清代宫廷中也有皮影戏演出，乾隆年间还曾用皮影戏招待外国使节。皮影戏甚至传播到了东南亚和欧洲。',ref:'《清稗类钞》'},
{title:'选皮',era:'历代',cat:'工艺',tags:['牛皮','制皮','选料'],desc:'制作皮影的第一步，选用优质牛皮或驴皮，经泡制处理。',detail:'皮影制作的第一步是选皮和制皮。传统皮影多用牛皮或驴皮，以秦川黄牛皮为佳。制皮过程包括：浸泡、刮毛、打磨、拉伸、晾干等多道工序。处理好的皮子要薄厚均匀、半透明，能在灯光下清晰投影。',ref:'《中国皮影戏》'},
{title:'雕刻',era:'历代',cat:'工艺',tags:['刀具','雕刻','精细'],desc:'用专用刀具在皮子上雕刻图案，是皮影制作最关键的工序。',detail:'皮影雕刻是制作皮影最核心的工序。艺人使用数十种专用刀具，在处理好的皮子上雕刻出人物、动物、道具等图案。雕刻讲究"推皮走刀"——刀不动而推皮前进。一个完整的皮影人物需要雕刻数千刀，耗时数天甚至数周。',ref:'《皮影戏制作技艺》'},
{title:'上色',era:'历代',cat:'工艺',tags:['矿物颜料','透明','彩绘'],desc:'用透明矿物颜料为皮影上色，要求色彩鲜艳且半透明。',detail:'皮影上色使用透明的矿物颜料，以红、黄、绿、黑为主色。上色时要注意颜料的透明度，因为皮影需要在灯光下投影。传统皮影的色彩讲究"五色分明"——红、黄、绿、黑、白，每种颜色都有特定的象征意义。',ref:'《皮影艺术》'},
{title:'操纵',era:'历代',cat:'表演',tags:['签子','操纵','手眼身法'],desc:'艺人用竹签操纵皮影人物，配合唱腔和音乐进行表演。',detail:'皮影戏的操纵是一门独特的技艺。艺人手持三根竹签（一根主签控制身体，两根手签控制双手），在白色幕布后面操纵皮影人物。高水平的艺人可以让皮影做出行走、奔跑、打斗、翻跟头等各种动作，人物栩栩如生。',ref:'《皮影戏表演艺术》'},
{title:'唱腔',era:'历代',cat:'表演',tags:['唱念做打','地方戏腔','一人多角'],desc:'皮影戏的唱腔融合了地方戏曲，一人常需演唱多个角色。',detail:'皮影戏的唱腔因地区而异，融合了当地戏曲的音乐特色。如陕西皮影碗碗腔、唐山皮影乐亭皮影、四川皮影灯戏等。皮影戏班通常只有几个人，一人需要操纵多个角色并变换唱腔，"一口诉说千古事，双手对舞百万兵"是皮影艺人的真实写照。',ref:'《中国戏曲志》'},
{title:'陕西皮影',era:'明清至今',cat:'流派',tags:['碗碗腔','华县','粗犷'],desc:'陕西皮影以碗碗腔为代表，风格粗犷豪放，是北方皮影的典型。',detail:'陕西皮影是中国皮影戏的重要流派，以华县皮影最为著名。陕西皮影的特点是人物造型粗犷豪放、线条简洁有力。碗碗腔是陕西皮影的主要唱腔，因以铜碗击节伴奏而得名。陕西皮影的代表剧目有《五典坡》《白蛇传》等。',ref:'《陕西皮影》'},
{title:'唐山皮影',era:'明代至今',cat:'流派',tags:['乐亭皮影','细腻','驴皮'],desc:'唐山皮影以驴皮雕刻，人物细腻精美，是北方皮影的精品。',detail:'唐山皮影又称"乐亭皮影"或"滦州影"，以驴皮为材料雕刻。其特点是人物造型细腻精美、色彩鲜艳明快。唐山皮影的唱腔以乐亭大鼓为基础，音乐优美动听。代表剧目有《五锋会》《镇冤塔》等。',ref:'《唐山皮影戏》'},
{title:'四川皮影',era:'清代至今',cat:'流派',tags:['灯戏','诙谐','民间'],desc:'四川皮影融合灯戏，风格诙谐幽默，贴近民间生活。',detail:'四川皮影戏融合了四川灯戏的表演特色，以诙谐幽默见长。四川皮影的人物造型夸张生动，表演风格活泼有趣。代表剧目有《孙悟空三打白骨精》《薛仁贵征东》等。四川皮影在民间广受欢迎，是川渝地区重要的民间艺术形式。',ref:'《四川皮影》'},
{title:'《白蛇传》',era:'清代至今',cat:'剧目',tags:['白娘子','雷峰塔','爱情'],desc:'经典爱情剧目，讲述白蛇精白素贞与许仙的爱情故事。',detail:'《白蛇传》是皮影戏的经典剧目之一，在全国各地皮影戏班中广泛演出。故事讲述了白蛇精白素贞与凡人许仙的爱情故事，以及法海和尚阻挠的经过。皮影戏中的白蛇变人、水漫金山等场景，通过光影效果表现得格外精彩。',ref:'《白蛇传》'},
{title:'《西游记》',era:'清代至今',cat:'剧目',tags:['孙悟空','降妖','神话'],desc:'以孙悟空为主角的神话剧目，是皮影戏最受欢迎的题材之一。',detail:'《西游记》是皮影戏最受欢迎的剧目题材之一。孙悟空、猪八戒等角色的皮影造型夸张生动，打斗场面精彩纷呈。其中"大闹天宫""三打白骨精""火焰山"等折子戏尤其受观众喜爱。皮影戏的光影效果使神仙法术的场面更加神奇。',ref:'《西游记》'},
{title:'《三国演义》',era:'清代至今',cat:'剧目',tags:['三国','战争','谋略'],desc:'以三国故事为题材的剧目，场面宏大，人物众多。',detail:'《三国演义》是皮影戏的传统大戏，常以连台本戏的形式演出。其中"赤壁之战""空城计""长坂坡"等折子戏最为精彩。皮影戏通过操纵多个皮影人物，表现千军万马的战争场面，别有一番气势。',ref:'《三国演义》'},
{title:'《封神演义》',era:'清代至今',cat:'剧目',tags:['封神','神话','法术'],desc:'以封神故事为题材，法术场面通过光影效果表现得格外神奇。',detail:'《封神演义》是皮影戏的重要神话剧目。故事讲述商周之际神仙斗法的故事。皮影戏中的"哪吒闹海""姜子牙封神""火烧琵琶精"等场景，通过灯光和操纵技巧表现各种法术和战斗场面，效果奇幻精彩。',ref:'《封神演义》'},
{title:'皮影与佛教',era:'唐代至今',cat:'历史',tags:['寺院','讲经','变文'],desc:'唐代寺院用皮影讲经说法，是皮影戏的重要发展动力。',detail:'唐代佛教寺院广泛使用皮影进行讲经说法，称为"影戏"或"弄影"。僧人用皮影演绎佛经故事，向信众传播佛教教义。这一传统推动了皮影戏的艺术发展，许多佛教题材的皮影作品至今仍保存在博物馆中。',ref:'《释氏要览》'},
{title:'皮影与电影',era:'近现代',cat:'历史',tags:['电影前身','光影艺术','影响'],desc:'皮影戏被认为是电影的前身之一，对现代影视艺术有深远影响。',detail:'皮影戏被誉为"世界上最早的电影"或"电影的前身"。它通过灯光投影和连续的动作表演，在白色幕布上展现故事，这与电影的原理有异曲同工之妙。2011年，中国皮影戏被列入联合国教科文组织"人类非物质文化遗产代表作名录"。',ref:'《中国皮影戏》'}
];
var currentCat='all';
function renderList(items){
  var el=document.getElementById('list');
  var s=document.getElementById('stats');
  s.textContent='共 '+items.length+' 条知识';
  el.innerHTML=items.map(function(d,i){
    return '<div class="item" onclick="this.classList.toggle(\'open\')">'+
    '<div class="item-title">'+d.title+'</div>'+
    '<div class="item-era">年代：'+d.era+'</div>'+
    '<div class="item-desc">'+d.desc+'</div>'+
    '<div class="item-detail"><h4>详细介绍</h4><p>'+d.detail+'</p>'+
    '<p style="margin-top:8px;color:var(--accent2)">参考：'+d.ref+'</p>'+
    '<div>'+d.tags.map(function(t){return '<span class="tag">'+t+'</span>'}).join('')+'</div></div></div>';
  }).join('');
}
function filterList(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var filtered=data.filter(function(d){
    var matchQ=d.title.toLowerCase().includes(q)||d.desc.toLowerCase().includes(q)||d.detail.toLowerCase().includes(q)||d.era.toLowerCase().includes(q);
    var matchC=currentCat==='all'||d.cat===currentCat;
    return matchQ&&matchC;
  });
  renderList(filtered);
}
function filterCat(cat,btn){
  currentCat=cat;
  document.querySelectorAll('.category-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  filterList();
}
renderList(data);
</script></body></html>
