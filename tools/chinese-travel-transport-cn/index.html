<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国旅行交通指南 - Chinese Travel Transport Guide</title>
<meta name="description" content="中国旅行交通指南，高铁、飞机、地铁、公交等出行方式全攻略">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国旅行交通指南 - Chinese Travel Transport Guide">
<meta property="og:description" content="中国旅行交通指南，高铁、飞机、地铁、公交等出行方式全攻略">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚄</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#0d9488;--accent2:#0f766e}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#0d9488;--accent2:#0f766e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#021515 0%,#042828 50%,#063838 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #115e59;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#0d9488,#5eead4,#14b8a6,#99f6e4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.transport-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:16px}
.transport-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.transport-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.transport-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.transport-card .t-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.transport-card .t-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(13,148,136,0.15);color:var(--accent)}
.transport-card .t-name{font-size:1.2em;font-weight:bold}
.transport-card .t-en{font-size:0.8em;color:var(--text2);margin-top:2px}
.transport-card .t-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.transport-card .t-tags span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.transport-card .t-content{font-size:0.85em;color:var(--text2);line-height:1.8;margin-bottom:8px}
.transport-card .t-content strong{color:var(--text)}
.transport-card .t-tips{margin-top:8px}
.transport-card .t-tip-item{display:flex;gap:8px;margin-bottom:6px;font-size:0.8em;color:var(--text2)}
.transport-card .t-tip-item::before{content:'✅';flex-shrink:0}
.transport-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.transport-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🚄 中国旅行交通指南</h1>
<p>Chinese Travel Transport Guide — 中国速度，畅行无阻</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索交通方式...（如"高铁""地铁""打车"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="长途出行">🚄 长途出行</button>
<button class="filter-btn" data-filter="城市交通">🚇 城市交通</button>
<button class="filter-btn" data-filter="打车出行">🚕 打车出行</button>
<button class="filter-btn" data-filter="特殊交通">🚌 特殊交通</button>
</div>
<div class="transport-grid" id="transportGrid"></div>
<footer><p>🚄 中国旅行交通指南 — 世界最快的高铁网络等你体验</p></footer>
</div>
<script>
const TRANSPORT_DATA=[
{id:1,name:"高铁",en:"High-Speed Rail",category:"长途出行",icon:"🚄",tags:["最快","舒适","准点"],content:"中国高铁网络全球第一，时速<strong>350公里</strong>。覆盖全国主要城市，准点率极高。车次分为G（高速）、D（动车）、C（城际）。<strong>提前30分钟</strong>到站即可。",tips:["通过12306官网/APP购票","二等座性价比最高","车上WiFi和插座齐全"]},
{id:2,name:"普通火车",en:"Regular Train",category:"长途出行",icon:"🚂",tags:["经济","夕发朝至","卧铺"],content:"适合<strong>预算有限</strong>的长途旅行。硬座、硬卧、软卧可选。K/T/Z字头列车，夜间卧铺可省一晚住宿费。虽然慢但沿途风景好。",tips:["卧铺需提前购票","带好充电宝和零食","硬卧上中下铺价格不同"]},
{id:3,name:"飞机",en:"Airplane",category:"长途出行",icon:"✈️",tags:["最快","提前订便宜","安检严格"],content:"国内航线密集，提前预订可低至<strong>2-3折</strong>。主要航空公司：国航、东航、南航、海航。廉价航空：春秋、九元、西部航空。",tips:["提前2小时到达机场","关注航司会员日优惠","行李额度提前确认"]},
{id:4,name:"地铁",en:"Subway/Metro",category:"城市交通",icon:"🚇",tags:["快捷","便宜","覆盖广"],content:"全国<strong>50+城市</strong>开通地铁。票价2-10元不等，支持支付宝/微信扫码乘车。早晚高峰较拥挤，避开7:30-9:00和17:00-19:00。",tips:["下载当地地铁APP更方便","换乘站注意方向","部分城市有日票/周票"]},
{id:5,name:"公交车",en:"Bus",category:"城市交通",icon:"🚌",tags:["覆盖广","便宜","速度慢"],content:"公交车票价1-3元，覆盖城市每个角落。支持移动支付。部分城市有<strong>快速公交(BRT)</strong>，有专用车道更快。",tips:["注意首末班车时间","上下车都要刷卡","高峰期可能没座位"]},
{id:6,name:"共享单车",en:"Shared Bicycle",category:"城市交通",icon:"🚲",tags:["便捷","便宜","自由"],content:"哈啰、美团、青桔三大品牌。起步价<strong>1.5元/30分钟</strong>。适合短距离出行，解决"最后一公里"。扫码即骑，随停随放。",tips:["注意骑行安全","找好停车点","新用户有优惠券"]},
{id:7,name:"网约车",en:"Ride-Hailing",category:"打车出行",icon:"📱",tags:["方便","舒适","可议价"],content:"滴滴出行<strong>市场份额最大</strong>。高德、曹操、T3等也有。支持预约、拼车。夜间有加价，高峰时段可能排队。",tips:["提前叫车更省时间","拼车更便宜","有行程分享功能"]},
{id:8,name:"出租车",en:"Taxi",category:"打车出行",icon:"🚕",tags:["招手即停","打表计费","正规"],content:"起步价根据城市不同，一般<strong>10-14元</strong>。要求司机打表。夜间有加价。火车站/机场有专门等候区。",tips:["上车确认打表","索要发票","遇到拒载可投诉"]},
{id:9,name:"轮渡",en:"Ferry",category:"特殊交通",icon:"⛴️",tags:["风景好","跨海","体验独特"],content:"沿海城市常见，如<strong>大连-烟台、厦门-金门</strong>。海南岛有跨海轮渡。部分景区有水上交通。价格比飞机便宜但耗时。",tips:["提前查看班次时间","晕船提前准备","甲板风景最好"]},
{id:10,name:"长途大巴",en:"Long-Distance Bus",category:"特殊交通",icon:"🚌",tags:["便宜","覆盖广","较慢"],content:"适合<strong>中小城市</strong>间出行。票价便宜但速度较慢。部分线路有卧铺大巴。可通过携程/12306等平台购票。",tips:["选择正规客运站","长途建议坐白天班次","注意行李安全"]},
{id:11,name:"磁悬浮列车",en:"Maglev Train",category:"特殊交通",icon:"🧲",tags:["最快","体验","上海特有"],content:"上海磁悬浮列车，最高时速<strong>431公里</strong>，浦东机场到龙阳路仅需<strong>8分钟</strong>。单程票价50元。体验中国速度的绝佳选择。",tips:["运营时间6:30-21:30","建议靠窗位置","速度感非常震撼"]},
{id:12,name:"自驾",en:"Self-Drive",category:"特殊交通",icon:"🚗",tags:["自由","灵活","需驾照"],content:"需<strong>中国驾照或国际驾照</strong>。高速公路收费，节假日免费。租车平台：神州、一嗨、联动云。新能源充电桩越来越普及。",tips:["高速ETC可省排队时间","注意限行规定","下载高德/百度地图"]}
];
const grid=document.getElementById('transportGrid');
const search=document.getElementById('searchInput');
const filterRow=document.getElementById('filterRow');
let currentFilter='all';
function render(){
const q=search.value.toLowerCase();
grid.innerHTML='';
TRANSPORT_DATA.filter(d=>{
const matchFilter=currentFilter==='all'||d.category===currentFilter;
const matchSearch=!q||d.name.toLowerCase().includes(q)||d.en.toLowerCase().includes(q)||d.content.includes(q)||d.tags.some(t=>t.includes(q));
return matchFilter&&matchSearch;
}).forEach(d=>{
const tagsHTML=d.tags.map(t=>`<span>${t}</span>`).join('');
const tipsHTML=d.tips.map(t=>`<div class="t-tip-item">${t}</div>`).join('');
grid.innerHTML+=`<div class="transport-card"><div class="t-header"><div class="t-icon">${d.icon}</div><div><div class="t-name">${d.name}</div><div class="t-en">${d.en}</div></div></div><div class="t-tags">${tagsHTML}</div><div class="t-content">${d.content}</div><div class="t-tips">${tipsHTML}</div></div>`;
});
}
filterRow.addEventListener('click',e=>{
if(e.target.classList.contains('filter-btn')){
filterRow.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
e.target.classList.add('active');
currentFilter=e.target.dataset.filter;
render();
}
});
search.addEventListener('input',render);
render();
</script>
</body>
</html>
