<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国水墨画体验</title><meta name="description" content="中国水墨画体验 - 在线体验水墨画创作"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--gold:#d4a017;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--gold:#b8860b}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:900px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;cursor:pointer;transition:transform .2s}.item:hover{transform:translateY(-2px)}.item-title{font-size:1.2rem;font-weight:600;color:var(--gold);margin-bottom:8px}.item-meta{font-size:.9rem;color:var(--text2);margin-bottom:4px}.item-display{font-size:3rem;text-align:center;padding:30px;background:var(--bg);border-radius:8px;margin-bottom:12px;min-height:100px;display:flex;align-items:center;justify-content:center}.item-desc{font-size:.9rem;color:var(--text)}.search-box input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.search-box input:focus{border-color:var(--blue);outline:none}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{display:inline-block;padding:6px 14px;background:var(--bg);border:1px solid var(--border);border-radius:20px;color:var(--text2);font-size:.85rem;cursor:pointer;transition:all .2s}.btn:hover{border-color:var(--blue);color:var(--blue)}.btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center}.modal-overlay.show{display:flex}.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:700px;width:90%;max-height:80vh;overflow-y:auto;position:relative}.modal h2{color:var(--gold);margin-bottom:12px}.modal p{color:var(--text2);line-height:1.8;margin-bottom:12px}.close-btn{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--text2);font-size:1.5rem;cursor:pointer}.theme-toggle{position:fixed;top:8px;right:80px;z-index:9999;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 12px;cursor:pointer;color:var(--text);font-size:.75rem}.canvas-area{background:#f5f0e8;border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px;text-align:center}.canvas-area canvas{border:1px solid #ccc;cursor:crosshair;max-width:100%;background:#f5f0e8}.tools-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center;align-items:center}.slider-group{display:flex;align-items:center;gap:8px}.slider-group label{font-size:.8rem;color:var(--text2)}.slider-group input[type=range]{width:100px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="中国水墨画体验"><meta property="og:description" content="中国水墨画体验 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖌️</text></svg>"></head><body>
<button class="theme-toggle" onclick="toggleTheme()">🌓</button>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🖌️ 中国水墨画体验</h1><p class="sub">在线体验水墨画创作</p>
<div class="card"><h3 style="margin-bottom:12px;color:var(--gold)">🎨 水墨画板</h3>
<div class="canvas-area">
<canvas id="inkCanvas" width="600" height="400"></canvas>
<div class="tools-row">
<button class="btn active" onclick="setBrush('ink',this)">🖌️ 毛笔</button>
<button class="btn" onclick="setBrush('splash',this)">💦 泼墨</button>
<button class="btn" onclick="setBrush('line',this)">📏 线条</button>
<div class="slider-group"><label>墨浓</label><input type="range" id="inkDensity" min="0" max="100" value="80" oninput="updateInk()"></div>
<div class="slider-group"><label>笔宽</label><input type="range" id="brushSize" min="1" max="30" value="8" oninput="updateInk()"></div>
<button class="btn" onclick="clearInk()">🗑️ 清空</button>
<button class="btn" onclick="downloadInk()">💾 保存</button>
<button class="btn" onclick="undoInk()">↩️ 撤销</button>
</div>
<p style="margin-top:8px;font-size:.8rem;color:var(--text2)">体验水墨晕染效果，调节墨浓和笔宽感受不同笔触</p>
</div></div>
<div class="card"><div class="search-box"><input type="text" id="searchInput" placeholder="搜索水墨画..." oninput="filterItems()"></div>
<div class="btn-group"><button class="btn active" onclick="filterByType('all',this)">全部</button><button class="btn" onclick="filterByType('山水',this)">山水</button><button class="btn" onclick="filterByType('花鸟',this)">花鸟</button><button class="btn" onclick="filterByType('人物',this)">人物</button><button class="btn" onclick="filterByType('技法',this)">技法</button></div></div>
<div id="itemList"></div></div>
<div class="modal-overlay" id="modal"><div class="modal"><button class="close-btn" onclick="closeModal()">×</button><h2 id="modalTitle"></h2><div id="modalDisplay" class="item-display"></div><p id="modalMeta"></p><p id="modalDesc"></p><p id="modalDetail" style="padding-top:12px;border-top:1px solid var(--border);margin-top:8px"></p></div></div>
<script src="../i18n.js" defer></script>
<script>
var items=[
  {title:'泼墨山水',type:'山水',emoji:'🏔️',desc:'以泼墨技法创作的山水画，墨色淋漓，气势磅礴。唐代王洽开创此法，现代张大千将其推向极致。',detail:'泼墨山水是将墨汁泼洒在纸上，利用墨的自然流动形成山峦、云雾的效果，再以笔点缀细节。这种技法追求天人合一的境界。'},
  {title:'写意荷花',type:'花鸟',emoji:'🪷',desc:'以写意笔法画荷花，寥寥数笔勾勒出荷花的清雅脱俗，体现"以少胜多"的意境。',detail:'写意荷花讲究笔墨的浓淡干湿，以简练的笔触表现荷花的神韵。齐白石的写意荷花最为著名。'},
  {title:'虾趣图',type:'花鸟',emoji:'🦐',desc:'齐白石的代表作，以水墨画虾，寥寥数笔便将虾的灵动表现得淋漓尽致。',detail:'齐白石画虾数十年，从写实到写意，最终形成独特的"白石虾"风格。虾身透明感是通过墨色的浓淡变化实现的。'},
  {title:'米点山水',type:'技法',emoji:'🌫️',desc:'以米芾、米友仁父子为代表的山水画技法，以横向墨点表现云山雾罩的效果。',detail:'米点皴是用横向的墨点堆叠表现山峦的方法，适合表现江南烟雨朦胧的景色。这种技法对后世文人画影响深远。'},
  {title:'枯笔焦墨',type:'技法',emoji:'🪵',desc:'以干枯的笔触和浓重的墨色作画，笔触苍劲有力，适合表现山石的质感。',detail:'枯笔焦墨是水墨画的高级技法，要求画家对笔墨有极高的控制力。黄宾虹是枯笔焦墨的大师。'},
  {title:'墨竹图',type:'花鸟',emoji:'🎋',desc:'以水墨画竹，是中国文人画的经典题材。文同、苏轼、郑板桥都是画竹名家。',detail:'墨竹讲究"胸有成竹"，落笔一气呵成。竹竿用中锋，竹叶用侧锋，浓淡相间，表现竹的劲节。'},
  {title:'指画山水',type:'技法',emoji:'☝️',desc:'以手指代替毛笔作画，指画创始人高其佩，现代潘天寿将其发扬光大。',detail:'指画用手指的指甲、指腹、手掌等部位蘸墨作画，产生独特的肌理效果，有一种毛笔无法达到的趣味。'},
  {title:'减笔人物',type:'人物',emoji:'👤',desc:'以极简的笔触画人物，南宋梁楷的《泼墨仙人图》是减笔人物画的巅峰之作。',detail:'减笔人物画以最少的笔触表现人物的神态，追求"得意忘形"的境界。梁楷的《泼墨仙人图》仅用寥寥数笔就画出了仙人的醉态。'},
  {title:'没骨花鸟',type:'花鸟',emoji:'🌺',desc:'不勾勒轮廓，直接以色彩或墨色点染成画的技法，始于徐崇嗣，清代恽寿平将其发扬光大。',detail:'没骨法是直接用色彩或墨色在纸上点染出物象的技法，不使用墨线勾勒轮廓，效果柔和自然。'},
  {title:'浅绛山水',type:'山水',emoji:'🌅',desc:'在水墨山水的基础上施以淡赭色，色调温润雅致，是元代以后文人画的主流风格。',detail:'浅绛山水以水墨为主，略施淡彩，以赭石色为主调，给人以温暖、恬静的感觉。黄公望的《富春山居图》就是浅绛山水的代表。'},
  {title:'破墨法',type:'技法',emoji:'💧',desc:'在先画的墨迹未干时，再用不同浓淡的墨叠加，使墨色自然融合的技法。',detail:'破墨法分为浓破淡和淡破浓两种。浓破淡是在淡墨上加浓墨，淡破浓是在浓墨上加淡墨。这种方法能产生丰富的墨色变化。'},
  {title:'水墨人物肖像',type:'人物',emoji:'🧑',desc:'以水墨技法画人物肖像，融合传统笔墨与现代造型，蒋兆和是此领域的开创者。',detail:'水墨人物肖像是将传统水墨技法与西方素描造型结合的创新画种，蒋兆和的《流民图》是其代表作。'}
];
var currentType='all';
function renderItems(list){
  var el=document.getElementById('itemList');
  var html='';
  list.forEach(function(p,i){
    html+='<div class="item" onclick="showDetail('+items.indexOf(p)+')">';
    html+='<div class="item-title">'+p.emoji+' '+p.title+'</div>';
    html+='<div class="item-meta">'+p.type+'</div>';
    html+='<div class="item-display">'+p.emoji+'</div>';
    html+='<div class="item-desc">'+p.desc.substring(0,60)+'...</div>';
    html+='</div>';
  });
  el.innerHTML=html||'<div class="card" style="text-align:center;color:var(--text2)">未找到匹配的水墨画</div>';
}
function filterItems(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var filtered=items.filter(function(p){return(p.title.includes(q)||p.desc.includes(q))&&(currentType==='all'||p.type===currentType);});
  renderItems(filtered);
}
function filterByType(type,btn){
  currentType=type;
  document.querySelectorAll('.btn-group .btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  filterItems();
}
function showDetail(i){
  var p=items[i];
  document.getElementById('modalTitle').textContent=p.title;
  document.getElementById('modalDisplay').textContent=p.emoji;
  document.getElementById('modalMeta').textContent=p.type;
  document.getElementById('modalDesc').textContent=p.desc;
  document.getElementById('modalDetail').textContent=p.detail;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
function toggleTheme(){var t=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',t==='light'?'dark':'light');}

var canvas=document.getElementById('inkCanvas'),ctx=canvas.getContext('2d');
var drawing=false,brushType='ink',inkDensity=80,brushSize=8;
var history_arr=[];function saveState(){history_arr.push(ctx.getImageData(0,0,600,400));if(history_arr.length>30)history_arr.shift();}

ctx.fillStyle='#f5f0e8';ctx.fillRect(0,0,600,400);saveState();

function setBrush(type,btn){brushType=type;document.querySelectorAll('.tools-row .btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');}
function updateInk(){inkDensity=document.getElementById('inkDensity').value;brushSize=document.getElementById('brushSize').value;}
function clearInk(){ctx.fillStyle='#f5f0e8';ctx.fillRect(0,0,600,400);saveState();}
function undoInk(){if(history_arr.length>1){history_arr.pop();ctx.putImageData(history_arr[history_arr.length-1],0,0);}}
function downloadInk(){var link=document.createElement('a');link.download='水墨画.png';link.href=canvas.toDataURL();link.click();}

function getInkColor(){var alpha=inkDensity/100;return 'rgba(20,20,20,'+alpha+')';}

canvas.addEventListener('mousedown',function(e){drawing=true;saveState();var r=canvas.getBoundingClientRect();var x=(e.clientX-r.left)*(600/r.width),y=(e.clientY-r.top)*(400/r.height);ctx.beginPath();ctx.moveTo(x,y);});
canvas.addEventListener('mousemove',function(e){
  if(!drawing)return;var r=canvas.getBoundingClientRect();var x=(e.clientX-r.left)*(600/r.width),y=(e.clientY-r.top)*(400/r.height);
  ctx.lineCap='round';ctx.lineJoin='round';
  if(brushType==='ink'){
    ctx.globalAlpha=inkDensity/100;ctx.strokeStyle=getInkColor();ctx.lineWidth=brushSize;
    ctx.lineTo(x,y);ctx.stroke();
    if(Math.random()>0.7){ctx.globalAlpha=0.05;ctx.fillStyle=getInkColor();ctx.beginPath();ctx.arc(x+(Math.random()-0.5)*brushSize*2,y+(Math.random()-0.5)*brushSize*2,brushSize*1.5,0,Math.PI*2);ctx.fill();}
  }else if(brushType==='splash'){
    ctx.globalAlpha=0.3;ctx.fillStyle=getInkColor();
    for(var i=0;i<3;i++){ctx.beginPath();ctx.arc(x+(Math.random()-0.5)*brushSize*4,y+(Math.random()-0.5)*brushSize*4,Math.random()*brushSize,0,Math.PI*2);ctx.fill();}
  }else{
    ctx.globalAlpha=inkDensity/100;ctx.strokeStyle=getInkColor();ctx.lineWidth=brushSize;ctx.lineTo(x,y);ctx.stroke();
  }
  ctx.globalAlpha=1;
});
canvas.addEventListener('mouseup',function(){drawing=false;});
canvas.addEventListener('mouseleave',function(){drawing=false;});

document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undoInk();}});
renderItems(items);
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
