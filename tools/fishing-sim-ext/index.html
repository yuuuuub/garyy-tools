<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>钓鱼模拟 - 垂钓大师</title>
    <meta name="description" content="钓鱼模拟游戏，在虚拟池塘体验垂钓乐趣">
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --accent: #3b82f6;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .game-container {
            max-width: 700px;
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .game-header {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .game-header h1 {
            font-size: 1.3rem;
        }
        
        .stats-bar {
            display: flex;
            gap: 15px;
        }
        
        .stat {
            font-size: 0.9rem;
        }
        
        .scene-area {
            height: 300px;
            position: relative;
            overflow: hidden;
        }
        
        .water {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px;
            background: linear-gradient(180deg, #0369a1, #0c4a6e);
            overflow: hidden;
        }
        
        .wave {
            position: absolute;
            width: 200%;
            height: 20px;
            background: repeating-linear-gradient(90deg, transparent, transparent 50px, rgba(255,255,255,0.1) 50px, rgba(255,255,255,0.1) 100px);
            animation: wave 3s linear infinite;
        }
        
        @keyframes wave {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        
        .wave:nth-child(1) { top: 0; opacity: 0.5; }
        .wave:nth-child(2) { top: 30px; opacity: 0.3; animation-duration: 4s; }
        .wave:nth-child(3) { top: 60px; opacity: 0.2; animation-duration: 5s; }
        
        .fishing-line {
            position: absolute;
            top: 0;
            left: 50%;
            width: 3px;
            height: 0;
            background: linear-gradient(180deg, #f5f5f5, #a3a3a3);
            transition: height 0.5s;
            transform-origin: top center;
        }
        
        .fishing-line.casting {
            height: 120px;
        }
        
        .hook {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 20px;
            border: 3px solid #a3a3a3;
            border-top: none;
            border-radius: 0 0 50% 50%;
        }
        
        .bobber {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: #ef4444;
            border-radius: 50%;
            display: none;
        }
        
        .bobber.show {
            display: block;
        }
        
        .bobber.bite {
            animation: bite 0.2s infinite;
        }
        
        @keyframes bite {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(5px); }
        }
        
        .fish-splash {
            position: absolute;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            opacity: 0;
        }
        
        .fish-splash.show {
            animation: splash 0.5s;
        }
        
        @keyframes splash {
            0% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-30px); }
        }
        
        .sky {
            position: absolute;
            top: 0;
            width: 100%;
            height: 150px;
            background: linear-gradient(180deg, #1e3a5f, #0ea5e9);
        }
        
        .clouds {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
        }
        
        .cloud {
            font-size: 2rem;
            opacity: 0.6;
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .fisherman {
            position: absolute;
            bottom: 140px;
            left: 30px;
            font-size: 3rem;
        }
        
        .control-area {
            padding: 20px;
        }
        
        .location-select {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .location-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--border);
            background: var(--bg);
            color: var(--text);
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        
        .location-btn:hover {
            border-color: var(--accent);
        }
        
        .location-btn.active {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.2);
        }
        
        .location-icon {
            font-size: 1.5rem;
        }
        
        .bait-select {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .bait-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--border);
            background: var(--bg);
            color: var(--text);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        
        .bait-btn:hover {
            border-color: var(--accent);
        }
        
        .bait-btn.active {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.2);
        }
        
        .fish-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .fish-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .fish-btn.cast {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }
        
        .fish-btn.wait {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }
        
        .fish-btn.catch {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            animation: pulse 0.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        .codex-area {
            padding: 20px;
            background: rgba(0,0,0,0.2);
            max-height: 200px;
            overflow-y: auto;
        }
        
        .codex-title {
            font-size: 1rem;
            margin-bottom: 10px;
        }
        
        .codex-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }
        
        .codex-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        
        .codex-item.caught {
            border-color: var(--accent);
        }
        
        .codex-fish {
            font-size: 2rem;
        }
        
        .codex-name {
            font-size: 0.8rem;
            margin-top: 5px;
        }
        
        .codex-rarity {
            font-size: 0.7rem;
            opacity: 0.7;
        }
        
        .result-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--card);
            border: 2px solid var(--accent);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            z-index: 100;
            animation: popIn 0.3s;
        }
        
        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        
        .result-fish {
            font-size: 4rem;
            margin-bottom: 15px;
        }
        
        .result-name {
            font-size: 1.3rem;
            margin-bottom: 5px;
        }
        
        .result-info {
            color: #9ca3af;
            margin-bottom: 20px;
        }
        
        .result-btn {
            padding: 10px 30px;
            background: var(--accent);
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 99;
        }
        
        .hidden { display: none !important; }
        
        @media (max-width: 500px) {
            .location-select, .bait-select {
                flex-wrap: wrap;
            }
            .location-btn, .bait-btn {
                flex: 0 0 calc(50% - 5px);
            }
        }
    </style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="钓鱼模拟 - 垂钓大师">
  <meta property="og:description" content="钓鱼模拟游戏，在虚拟池塘体验垂钓乐趣">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/fishing-sim-ext/">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>垂钓大师</h1>
            <div class="stats-bar">
                <div class="stat">🐟 已钓: <span id="caught-count">0</span></div>
                <div class="stat">📖 图鉴: <span id="codex-count">0</span>/12</div>
            </div>
        </div>
        
        <div class="scene-area">
            <div class="sky">
                <div class="clouds">
                    <div class="cloud">☁️</div>
                    <div class="cloud" style="animation-delay: 1s;">☁️</div>
                    <div class="cloud" style="animation-delay: 2s;">☁️</div>
                </div>
            </div>
            <div class="water">
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
            </div>
            <div class="fisherman">🎣</div>
            <div class="fishing-line" id="fishing-line">
                <div class="hook"></div>
                <div class="bobber" id="bobber"></div>
            </div>
            <div class="fish-splash" id="fish-splash">🐟</div>
        </div>
        
        <div class="control-area">
            <div class="location-select">
                <button class="location-btn active" onclick="setLocation('river')">
                    <div class="location-icon">🏞️</div>
                    <div>小河</div>
                </button>
                <button class="location-btn" onclick="setLocation('lake')">
                    <div class="location-icon">🌊</div>
                    <div>湖泊</div>
                </button>
                <button class="location-btn" onclick="setLocation('ocean')">
                    <div class="location-icon">🚢</div>
                    <div>大海</div>
                </button>
            </div>
            
            <div class="bait-select">
                <button class="bait-btn active" onclick="setBait('worm')">🪱 蚯蚓</button>
                <button class="bait-btn" onclick="setBait('lure')">🎣 拟饵</button>
                <button class="bait-btn" onclick="setBait('shrimp')">🦐 虾</button>
                <button class="bait-btn" onclick="setBait('corn')">🌽 玉米</button>
            </div>
            
            <button class="fish-btn cast" id="fish-btn" onclick="fishAction()">🎣 抛竿</button>
        </div>
        
        <div class="codex-area">
            <div class="codex-title">📖 鱼类图鉴</div>
            <div class="codex-grid" id="codex-grid"></div>
        </div>
    </div>
    
    <div class="overlay hidden" id="overlay"></div>
    <div class="result-popup hidden" id="result-popup">
        <div class="result-fish" id="result-fish"></div>
        <div class="result-name" id="result-name"></div>
        <div class="result-info" id="result-info"></div>
        <button class="result-btn" onclick="closeResult()">继续钓鱼</button>
    </div>

    <script>
        const fishData = [
            // 小河
            { id: 'carp', name: '鲤鱼', icon: '🐟', location: 'river', bait: ['worm', 'corn'], rarity: 'common', weight: '0.5-2kg' },
            { id: 'catfish', name: '鲶鱼', icon: '🐟', location: 'river', bait: ['worm', 'shrimp'], rarity: 'common', weight: '1-5kg' },
            { id: 'trout', name: '鳟鱼', icon: '🐟', location: 'river', bait: ['lure', 'worm'], rarity: 'uncommon', weight: '0.3-1.5kg' },
            { id: 'eel', name: '鳗鱼', icon: '🐍', location: 'river', bait: ['worm'], rarity: 'rare', weight: '0.5-2kg' },
            // 湖泊
            { id: 'bass', name: '鲈鱼', icon: '🐟', location: 'lake', bait: ['lure', 'shrimp'], rarity: 'common', weight: '1-4kg' },
            { id: 'perch', name: '河鲈', icon: '🐟', location: 'lake', bait: ['worm', 'lure'], rarity: 'common', weight: '0.5-2kg' },
            { id: 'pike', name: '梭子鱼', icon: '🐟', location: 'lake', bait: ['lure'], rarity: 'uncommon', weight: '2-8kg' },
            { id: 'sturgeon', name: '鲟鱼', icon: '🐟', location: 'lake', bait: ['worm', 'shrimp'], rarity: 'epic', weight: '5-20kg' },
            // 大海
            { id: 'mackerel', name: '鲭鱼', icon: '🐟', location: 'ocean', bait: ['lure', 'shrimp'], rarity: 'common', weight: '1-3kg' },
            { id: 'tuna', name: '金枪鱼', icon: '🐟', location: 'ocean', bait: ['lure'], rarity: 'uncommon', weight: '5-30kg' },
            { id: 'swordfish', name: '旗鱼', icon: '🐟', location: 'ocean', bait: ['lure', 'shrimp'], rarity: 'rare', weight: '10-50kg' },
            { id: 'whale', name: '蓝鲸', icon: '🐋', location: 'ocean', bait: ['shrimp'], rarity: 'legendary', weight: '1000kg+' }
        ];

        const rarityColors = {
            common: '#9ca3af',
            uncommon: '#22c55e',
            rare: '#3b82f6',
            epic: '#a855f7',
            legendary: '#f59e0b'
        };

        const rarityNames = {
            common: '普通',
            uncommon: '稀有',
            rare: '珍贵',
            epic: '史诗',
            legendary: '传说'
        };

        let gameState = {
            location: 'river',
            bait: 'worm',
            state: 'idle',
            caught: new Set(),
            totalCaught: 0
        };

        function updateUI() {
            document.getElementById('caught-count').textContent = gameState.totalCaught;
            document.getElementById('codex-count').textContent = gameState.caught.size;
            renderCodex();
        }

        function renderCodex() {
            const grid = document.getElementById('codex-grid');
            grid.innerHTML = fishData.map(fish => {
                const isCaught = gameState.caught.has(fish.id);
                return `<div class="codex-item ${isCaught ? 'caught' : ''}">
                    <div class="codex-fish">${isCaught ? fish.icon : '❓'}</div>
                    <div class="codex-name">${isCaught ? fish.name : '???'}</div>
                    <div class="codex-rarity" style="color: ${rarityColors[fish.rarity]}">${rarityNames[fish.rarity]}</div>
                </div>`;
            }).join('');
        }

        function setLocation(loc) {
            gameState.location = loc;
            document.querySelectorAll('.location-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            // 更新水面颜色
            const water = document.querySelector('.water');
            const colors = {
                river: 'linear-gradient(180deg, #0369a1, #0c4a6e)',
                lake: 'linear-gradient(180deg, #1e40af, #1e3a8a)',
                ocean: 'linear-gradient(180deg, #0c4a6e, #0f172a)'
            };
            water.style.background = colors[loc];
        }

        function setBait(bait) {
            gameState.bait = bait;
            document.querySelectorAll('.bait-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function fishAction() {
            const btn = document.getElementById('fish-btn');
            
            switch (gameState.state) {
                case 'idle':
                    // 抛竿
                    gameState.state = 'casting';
                    document.getElementById('fishing-line').classList.add('casting');
                    btn.textContent = '⏳ 等待中...';
                    btn.className = 'fish-btn wait';
                    
                    // 随机等待时间
                    const waitTime = 2000 + Math.random() * 3000;
                    setTimeout(() => {
                        if (gameState.state === 'casting') {
                            gameState.state = 'waiting';
                            document.getElementById('bobber').classList.add('show');
                        }
                    }, 1000);
                    
                    // 鱼咬钩
                    setTimeout(() => {
                        if (gameState.state === 'waiting') {
                            gameState.state = 'bite';
                            document.getElementById('bobber').classList.add('bite');
                            btn.textContent = '🐟 快收竿！';
                            btn.className = 'fish-btn catch';
                        }
                    }, waitTime);
                    break;
                    
                case 'bite':
                    // 收竿
                    catchFish();
                    break;
                    
                case 'waiting':
                    // 提前收竿
                    resetFishing();
                    btn.textContent = '🎣 抛竿';
                    btn.className = 'fish-btn cast';
                    break;
            }
        }

        function catchFish() {
            // 计算钓到什么鱼
            const availableFish = fishData.filter(f => 
                f.location === gameState.location && f.bait.includes(gameState.bait)
            );
            
            if (availableFish.length === 0) {
                showResult(null);
                return;
            }
            
            // 根据稀有度计算概率
            const weights = {
                common: 50,
                uncommon: 30,
                rare: 15,
                epic: 4,
                legendary: 1
            };
            
            let totalWeight = 0;
            const weightedFish = availableFish.map(f => {
                const w = weights[f.rarity];
                totalWeight += w;
                return { fish: f, weight: w };
            });
            
            let random = Math.random() * totalWeight;
            let selectedFish = weightedFish[0].fish;
            
            for (const wf of weightedFish) {
                random -= wf.weight;
                if (random <= 0) {
                    selectedFish = wf.fish;
                    break;
                }
            }
            
            showResult(selectedFish);
        }

        function showResult(fish) {
            const splash = document.getElementById('fish-splash');
            splash.classList.add('show');
            setTimeout(() => splash.classList.remove('show'), 500);
            
            resetFishing();
            
            if (!fish) {
                document.getElementById('result-fish').textContent = '💨';
                document.getElementById('result-name').textContent = '什么都没钓到';
                document.getElementById('result-info').textContent = '换个鱼饵试试吧';
            } else {
                document.getElementById('result-fish').textContent = fish.icon;
                document.getElementById('result-name').textContent = fish.name;
                document.getElementById('result-info').textContent = `${rarityNames[fish.rarity]} | 体重: ${fish.weight}`;
                
                gameState.caught.add(fish.id);
                gameState.totalCaught++;
            }
            
            document.getElementById('overlay').classList.remove('hidden');
            document.getElementById('result-popup').classList.remove('hidden');
        }

        function closeResult() {
            document.getElementById('overlay').classList.add('hidden');
            document.getElementById('result-popup').classList.add('hidden');
            updateUI();
        }

        function resetFishing() {
            gameState.state = 'idle';
            document.getElementById('fishing-line').classList.remove('casting');
            document.getElementById('bobber').classList.remove('show', 'bite');
            
            const btn = document.getElementById('fish-btn');
            btn.textContent = '🎣 抛竿';
            btn.className = 'fish-btn cast';
        }

        updateUI();
    </script>
<script src="../i18n.js"></script>
</body>
</html>
