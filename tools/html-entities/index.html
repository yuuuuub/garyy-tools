<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML实体编解码</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;min-height:100vh}
.container{max-width:800px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card h3{font-size:.85rem;color:var(--text2);margin-bottom:10px}
textarea{width:100%;min-height:180px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px;color:var(--text);font-family:monospace;font-size:.85rem;resize:vertical;outline:none}
textarea:focus{border-color:var(--blue)}
textarea.small{min-height:80px}
.btn-row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.btn{padding:8px 18px;border:none;border-radius:var(--radius);cursor:pointer;font-size:.82rem;background:var(--blue);color:#fff;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn.green{background:var(--green)}
.btn.gold{background:var(--gold);color:#000}
.btn.red{background:var(--red)}
.output-wrap{position:relative}
.output-wrap .copy-badge{position:absolute;top:8px;right:8px;padding:4px 10px;background:var(--green);color:#fff;border:none;border-radius:4px;font-size:.75rem;cursor:pointer;opacity:0;transition:opacity .2s}
.output-wrap:hover .copy-badge{opacity:1}
.status-msg{font-size:.82rem;min-height:24px;color:var(--text2);margin-bottom:4px}
.preview-box{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;margin-top:8px;min-height:40px;font-size:.9rem;line-height:1.6}
.preview-box .label{font-size:.75rem;color:var(--text2);margin-bottom:4px}
</style>
</head>
<body>
<div class="container">
<header><h1>HTML实体编解码</h1><p>特殊字符转义</p></header>
<div class="card">
<h3>输入</h3>
<textarea id="input" placeholder="在此输入文本..." class="small"><div class="content">
  <h1>Hello & Welcome</h1>
  <p>Tom & Jerry's "Adventure"</p>
</div></textarea>
<div class="btn-row">
<button class="btn green" id="encode-btn">编码 &lt; → &amp;lt;</button>
<button class="btn" id="decode-btn">解码 &amp;lt; → &lt;</button>
<button class="btn red" id="clear-btn">清空</button>
</div>
</div>
<div class="card">
<h3>输出</h3>
<div class="output-wrap">
<textarea id="output" placeholder="结果将显示在这里..." readonly class="small"></textarea>
<button class="copy-badge" id="copy-btn">复制</button>
</div>
<div class="status-msg" id="status"></div>
<div class="preview-box" id="preview-box"><div class="label">预览渲染效果:</div><div id="preview-content"></div></div>
</div>
</div>

<script>
(function(){
'use strict';

const $ = id => document.getElementById(id);
const input = $('input');
const output = $('output');
const status = $('status');
const previewContent = $('preview-content');

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
}

function unescapeHtml(str) {
  return str.replace(/&#39;/g, "'")
            .replace(/&quot;/g, '"')
            .replace(/&gt;/g, '>')
            .replace(/&lt;/g, '<')
            .replace(/&amp;/g, '&');
}

function updatePreview(text) {
  previewContent.textContent = text;
}

function process(mode) {
  const val = input.value;
  if(!val) {
    status.textContent = '请输入文本';
    status.style.color = 'var(--text2)';
    return;
  }
  try {
    if(mode === 'encode') {
      const result = escapeHtml(val);
      output.value = result;
      status.textContent = '编码完成';
      status.style.color = 'var(--green)';
      updatePreview(result);
    } else {
      const result = unescapeHtml(val);
      output.value = result;
      status.textContent = '解码完成';
      status.style.color = 'var(--green)';
      updatePreview(result);
    }
  } catch(e) {
    status.textContent = '错误: ' + e.message;
    status.style.color = 'var(--red)';
    output.value = '';
  }
}

$('encode-btn').addEventListener('click', function() { process('encode'); });
$('decode-btn').addEventListener('click', function() { process('decode'); });

$('clear-btn').addEventListener('click', function() {
  input.value = '';
  output.value = '';
  status.textContent = '';
  previewContent.textContent = '';
  input.focus();
});

$('copy-btn').addEventListener('click', function() {
  const val = output.value;
  if(!val) return;
  navigator.clipboard.writeText(val).then(function() {
    const btn = this;
    const orig = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(function(){ btn.textContent = orig; }, 1500);
  }.bind(this));
});

// Auto-preview decoded on input
input.addEventListener('input', function() {
  const val = this.value;
  if(val) {
    previewContent.textContent = val;
  } else {
    previewContent.textContent = '';
  }
});

// Init preview
previewContent.textContent = input.value;

})();
</script>
<script src="../i18n.js"></script>
</body>
</html>
