<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML实体编码工具</title><meta name="description" content="HTML实体编码工具 - 在线HTML实体编码解码"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}textarea{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-family:monospace;font-size:.85rem;resize:vertical;outline:none}textarea:focus{border-color:var(--blue)}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}</style><meta property="og:title" content="HTML实体编码工具"><meta property="og:description" content="HTML实体编码工具 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"></head><body>
<div class="container"><h1>📝 HTML实体编码工具</h1><p class="sub">在线HTML实体编码解码</p>
<div class="card"><div class="label">输入文本</div>
<textarea id="inputText" placeholder="输入要编码或解码的文本..."></textarea>
<div class="btn-group">
<button class="btn" onclick="encodeEntities()">编码为HTML实体</button>
<button class="btn" onclick="decodeEntities()">解码HTML实体</button>
<button class="btn" onclick="encodeAll()">编码所有字符</button>
<button class="btn" onclick="encodeSpecial()">编码特殊字符</button>
</div></div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var entityMap={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','/':'&#x2F;','`':'&#x60;','=':'&#x3D;'};
var reverseEntityMap={'&amp;':'&','&lt;':'<','&gt;':'>','&quot;':'"',"&#39;":'\'','&#x2F;':'/','&#x60;':'`','&#x3D;':'='};
function encodeEntities(){
  var text=document.getElementById('inputText').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入文本</div>';return;}
  var encoded=text.replace(/[&<>"'`=/]/g,function(s){return entityMap[s];});
  showResult(encoded,'编码结果');
}
function decodeEntities(){
  var text=document.getElementById('inputText').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入文本</div>';return;}
  var decoded=text.replace(/&amp;|&lt;|&gt;|&quot;|&#39;|&#x2F;|&#x60;|&#x3D;/g,function(s){return reverseEntityMap[s];});
  showResult(decoded,'解码结果');
}
function encodeAll(){
  var text=document.getElementById('inputText').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入文本</div>';return;}
  var encoded='';
  for(var i=0;i<text.length;i++){
    var code=text.charCodeAt(i);
    if(code>127){encoded+='&#'+code+';';}
    else{encoded+=text[i];}
  }
  showResult(encoded,'编码结果');
}
function encodeSpecial(){
  var text=document.getElementById('inputText').value;
  var r=document.getElementById('result');
  if(!text){r.innerHTML='<div class="card" style="color:var(--red)">请输入文本</div>';return;}
  var encoded=text.replace(/[&<>"']/g,function(s){return entityMap[s];});
  showResult(encoded,'编码结果');
}
function showResult(text,title){
  var r=document.getElementById('result');
  var html='<div class="card"><div class="section"><h3>📋 '+title+'</h3>';
  html+='<div class="result-block" id="resultText">'+escapeHtml(text)+'</div>';
  html+='<button class="copy-btn" onclick="copyResult()">复制结果</button></div></div>';
  r.innerHTML=html;
}
function escapeHtml(text){
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function copyResult(){
  var text=document.getElementById('resultText').textContent;
  navigator.clipboard.writeText(text).then(function(){alert('已复制到剪贴板');}).catch(function(){alert('复制失败');});
}
encodeEntities();
</script></body></html>'",'
