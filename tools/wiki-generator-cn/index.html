<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiki文档生成器</title>
<meta name="description" content="在线生成结构化Wiki文档，支持多级目录和Markdown导出">
<script defer src="../i18n.js"></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;scroll-behavior:smooth;padding:16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.85rem;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
input,select,button,textarea{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:.9rem;font-family:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical;min-height:80px}
.btn{background:var(--blue);color:#fff;border:none;padding:8px 20px;border-radius:var(--radius);cursor:pointer;font-size:.9rem;transition:opacity .2s;display:inline-block;text-align:center}
.btn:hover{opacity:.85}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:4px 12px;font-size:.8rem}
.form-row{display:flex;gap:12px;margin-bottom:12px}
.form-row .group{flex:1}
.group label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.section-title{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:var(--radius);cursor:pointer;font-size:.82rem;background:var(--card);border:1px solid var(--border);color:var(--text2);transition:all .2s}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.page-list{list-style:none;margin-bottom:12px}
.page-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);font-size:.85rem}
.page-item .page-title{flex:1;cursor:pointer}
.page-item .page-title:hover{color:var(--blue)}
.page-item .indent{color:var(--text2);margin-left:0}
.page-item .indent-1{margin-left:20px}
.page-item .indent-2{margin-left:40px}
.preview-box{background:#fff;color:#333;padding:24px;border-radius:var(--radius);border:1px solid #ddd;font-size:.82rem;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.preview-box h1,.preview-box h2,.preview-box h3{color:#333;border-bottom:1px solid #eee;padding-bottom:4px}
.output-area{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:12px;display:none}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto}
.modal h3{margin-bottom:16px}
@media(max-width:640px){.form-row{flex-direction:column}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="Wiki文档生成器">
<meta property="og:description" content="在线生成结构化Wiki文档">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>📖 Wiki文档生成器</h1>
    <p>创建结构化的Wiki知识文档</p>
  </header>

  <div class="card">
    <div class="section-title">Wiki信息</div>
    <div class="form-row">
      <div class="group"><label>Wiki标题</label><input type="text" id="wikiTitle" value="产品开发Wiki"></div>
      <div class="group"><label>作者</label><input type="text" id="wikiAuthor" value="技术团队"></div>
    </div>
    <div class="form-row">
      <div class="group"><label>描述</label><textarea id="wikiDesc" rows="2">本Wiki记录产品开发过程中的技术文档、规范和最佳实践。</textarea></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">文档页面</div>
    <ul class="page-list" id="pageList"></ul>
    <div class="form-row" style="margin-top:8px">
      <div class="group"><input type="text" id="newPageTitle" placeholder="新页面标题"></div>
      <div class="group" style="flex:0 0 auto">
        <select id="newPageLevel">
          <option value="1">一级</option>
          <option value="2">二级</option>
        </select>
      </div>
      <button class="btn btn-sm" onclick="addPage()">添加</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title">页面内容</div>
    <div class="form-row">
      <div class="group"><label>选择页面</label>
        <select id="pageSelect" onchange="loadPageContent()"></select>
      </div>
    </div>
    <div class="form-row">
      <div class="group"><textarea id="pageContent" rows="10" placeholder="在此编辑页面内容..."></textarea></div>
    </div>
    <div class="btn-group">
      <button class="btn" onclick="savePageContent()">保存内容</button>
      <button class="btn btn-outline" onclick="deletePage()">删除页面</button>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn" onclick="previewWiki()">预览</button>
    <button class="btn btn-green" onclick="exportMarkdown()">导出 Markdown</button>
    <button class="btn btn-outline" onclick="exportText()">导出 TXT</button>
  </div>

  <div class="output-area" id="outputArea">
    <div class="section-title">预览</div>
    <div class="preview-box" id="preview"></div>
  </div>
</div>

<script>
var pages = [
  {title:'快速开始', level:1, content:'# 快速开始\n\n## 环境准备\n\n1. 安装 Node.js 16+\n2. 克隆仓库\n3. 安装依赖: `npm install`\n\n## 启动开发\n\n```bash\nnpm run dev\n```\n\n访问 http://localhost:3000'},
  {title:'技术架构', level:1, content:'# 技术架构\n\n## 前端\n\n- Vue3 + TypeScript\n- Vite构建\n- Pinia状态管理\n\n## 后端\n\n- Node.js + Express\n- PostgreSQL数据库\n- Redis缓存'},
  {title:'编码规范', level:2, content:'# 编码规范\n\n## 命名规范\n\n- 变量: camelCase\n- 类: PascalCase\n- 常量: UPPER_SNAKE_CASE\n\n## 代码格式\n\n- 使用ESLint\n- 使用Prettier\n- 缩进2空格'},
  {title:'部署流程', level:2, content:'# 部署流程\n\n## 测试环境\n\n1. 合并到develop分支\n2. 自动触发CI/CD\n3. 部署到测试服务器\n\n## 生产环境\n\n1. 创建Release分支\n2. 代码评审通过\n3. 合并到main\n4. 打Tag触发部署'}
];

function renderPages() {
  var list = document.getElementById('pageList');
  var select = document.getElementById('pageSelect');
  list.innerHTML = '';
  select.innerHTML = '';
  pages.forEach(function(p, i) {
    var li = document.createElement('li');
    li.className = 'page-item';
    li.innerHTML = '<span class="page-title indent indent-' + p.level + '" onclick="selectPage(' + i + ')">' + p.title + '</span>' +
      '<span style="font-size:.7rem;color:var(--text2)">Lv' + p.level + '</span>';
    list.appendChild(li);
    select.innerHTML += '<option value="' + i + '">' + p.title + '</option>';
  });
}

function selectPage(i) {
  document.getElementById('pageSelect').value = i;
  loadPageContent();
}

function loadPageContent() {
  var i = Number(document.getElementById('pageSelect').value);
  document.getElementById('pageContent').value = pages[i].content;
}

function savePageContent() {
  var i = Number(document.getElementById('pageSelect').value);
  pages[i].content = document.getElementById('pageContent').value;
  alert('已保存');
}

function addPage() {
  var title = document.getElementById('newPageTitle').value.trim();
  if (!title) { alert('请输入页面标题'); return; }
  pages.push({title: title, level: Number(document.getElementById('newPageLevel').value), content: '# ' + title + '\n\n在此输入内容...'});
  document.getElementById('newPageTitle').value = '';
  renderPages();
}

function deletePage() {
  if (pages.length <= 1) { alert('至少保留一个页面'); return; }
  var i = Number(document.getElementById('pageSelect').value);
  if (!confirm('删除页面 "' + pages[i].title + '"？')) return;
  pages.splice(i, 1);
  renderPages();
  loadPageContent();
}

function generateMarkdown() {
  var title = document.getElementById('wikiTitle').value;
  var author = document.getElementById('wikiAuthor').value;
  var desc = document.getElementById('wikiDesc').value;
  var md = '# ' + title + '\n\n';
  md += '> ' + desc + '\n> 作者: ' + author + '\n> 生成时间: ' + new Date().toLocaleString('zh-CN') + '\n\n';
  md += '## 目录\n\n';
  pages.forEach(function(p, i) {
    var indent = p.level === 2 ? '  ' : '';
    md += indent + '- [' + p.title + '](#' + p.title.replace(/\s+/g, '-').toLowerCase() + ')\n';
  });
  md += '\n---\n\n';
  pages.forEach(function(p) {
    if (p.level === 1) {
      md += p.content + '\n\n---\n\n';
    } else {
      md += p.content + '\n\n---\n\n';
    }
  });
  return md;
}

function previewWiki() {
  document.getElementById('preview').textContent = generateMarkdown();
  document.getElementById('outputArea').style.display = 'block';
  document.getElementById('outputArea').scrollIntoView({ behavior: 'smooth' });
}

function exportMarkdown() {
  var md = generateMarkdown();
  var blob = new Blob([md], { type: 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = document.getElementById('wikiTitle').value + '.md';
  a.click();
}

function exportText() {
  previewWiki();
}

renderPages();
loadPageContent();
</script>
</body>
</html>
