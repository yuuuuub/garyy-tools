    climate:"气温明显升高，雷雨增多。蝼蝈鸣，蚯蚓出，王瓜生。农作物进入生长旺季。日照时间延长。",
    customs:"迎夏仪式、立夏秤人、斗蛋游戏、尝三新。江浙一带有\"立夏吃蛋\"习俗，\"立夏胸挂蛋，孩子不疰夏\"。",
    food:"立夏蛋、立夏饭（豌豆糯米饭）、乌米饭、樱桃、青梅。江南吃\"三鲜\"：樱桃、青梅、麦蚕。",
    health:"养心安神，戒躁戒怒。午睡养心，适当运动不过度。饮食宜清淡，多食苦味清心火。",
    farming:"中稻播种，早稻追肥，棉花查苗补苗。\"立夏不下，犁耙高挂\"，期盼雨水充足。",
    poetry:"《立夏》·陆游\n赤帜插城扉，东君整驾归。\n泥新巢燕闹，花尽蜜蜂稀。",
    poet:"陆游《立夏》" },
  { id:8, season:"夏天", sc:"summer", name:"小满", date:"5月21日前后", meaning:"麦类灌浆，小得盈满", icon:"🌾",
    climate:"麦类等夏熟作物籽粒开始灌浆饱满。南方雨水充沛，江河渐满。气温持续上升，天气渐热。",
    customs:"祭车神（祭水车、油车、丝车）、祭蚕神、看麦梢黄。江南蚕乡有\"小满戏\"演出。",
    food:"苦菜、蒲公英、苦瓜。\"春风吹，苦菜长，荒滩野地是粮仓\"。宜食清热利湿之品。",
    health:"防暑降温开始，注意饮食卫生。清热利湿，避免湿热内蕴。适当吃苦味食物，清心明目。",
    farming:"小麦灌浆关键期，防干热风。南方稻田需水管理，\"小满不满，干断田坎\"。",
    poetry:"《小满》·欧阳修\n夜莺啼绿柳，皓月醒长空。\n最爱垄头麦，迎风笑落红。",
    poet:"欧阳修《小满》" },
  { id:9, season:"夏天", sc:"summer", name:"芒种", date:"6月6日前后", meaning:"有芒作物成熟，夏播开始", icon:"🌾",
    climate:"气温显著升高，雨量充沛。螳螂生，鵙始鸣，反舌无声。是种植农作物时机的分界点。江淮流域进入梅雨季。",
    customs:"送花神（祭祀花神）、安苗（祈福丰收）、打泥巴仗（侗族）、煮梅（制作梅子食品）。",
    food:"青梅、杨梅、西瓜、绿豆汤。\"芒种夏至天，走路要人牵\"，宜食酸味开胃。煮青梅、制梅酒。",
    health:"清热祛湿，预防中暑和空调病。午休养心，饮食清淡。多饮水，适当补充盐分。",
    farming:"抢收小麦，抢种夏玉米、夏大豆。\"芒种忙，麦上场\"，是农事最繁忙的时节。",
    poetry:"《时雨》·陆游\n时雨及芒种，四野皆插秧。\n家家麦饭美，处处菱歌长。",
    poet:"陆游《时雨》" },
  { id:10, season:"夏天", sc:"summer", name:"夏至", date:"6月21日前后", meaning:"白昼最长，盛夏来临", icon:"🌞",
    climate:"太阳直射北回归线，北半球白昼最长。气温高，湿度大，雷阵雨频繁。鹿角解，蝉始鸣，半夏生。",
    customs:"祭神祀祖、消夏避伏、吃夏至面。\"冬至饺子夏至面\"，北方各地夏至吃面。南方有吃麦粽习俗。",
    food:"夏至面（凉面）、麦粽、馄饨、荔枝。\"吃过夏至面，一天短一线\"。宜食清凉解暑之品。",
    health:"养心安神，预防中暑。避免烈日暴晒，适当午休。饮食宜清淡，多吃苦味食物清心火。",
    farming:"水稻追肥除虫，棉花整枝打杈。\"夏至不锄根边草，如同养下毒蛇咬\"，中耕除草关键期。",
    poetry:"《夏至》·左河水\n火轮渐近暑徘徊，一夜生阴夏九来。\n知了不知耕种苦，卧闲枝上唱开怀。",
    poet:"左河水《夏至》" },
  { id:11, season:"夏天", sc:"summer", name:"小暑", date:"7月7日前后", meaning:"暑气渐盛，尚未极热", icon:"🔥",
    climate:"天气开始炎热，但未到最热。温风至，蟋蟀居宇，鹰始鸷。雷暴频繁，台风开始活跃。",
    customs:"食新（尝新米）、晒书画衣物（六月六晒红绿）、游伏（外出避暑）。民间有小暑\"食新\"祭祖习俗。",
    food:"新米、饺子、莲藕、绿豆汤。\"头伏饺子二伏面\"，小暑临近头伏。吃藕清热凉血，喝绿豆汤消暑。",
    health:"防暑降温，补充水分。避免高温时段户外活动。饮食清淡，多吃瓜果蔬菜。注意防蚊防虫。",
    farming:"早稻灌浆成熟，晚稻播种育秧。\"小暑天气热，棉花整枝不停歇\"。稻田追肥防虫。",
    poetry:"《小暑》·元稹\n倏忽温风至，因循小暑来。\n竹喧先觉雨，山暗已闻雷。",
    poet:"元稹《咏廿四气诗·小暑六月节》" },
  { id:12, season:"夏天", sc:"summer", name:"大暑", date:"7月23日前后", meaning:"一年中最热的时节", icon:"☀️",

  { id:13, season:"秋天", sc:"autumn", name:"立秋", date:"8月8日前后", meaning:"秋季开始，暑去凉来", icon:"🍂",
    climate:"暑气渐消，凉风至，白露降，寒蝉鸣。但\"秋老虎\"仍可能发威，早晚温差加大。",

    health:"养肺润燥，早睡早起。预防秋燥，多食滋阴润肺之品。\"秋瓜坏肚\"，少食生冷瓜果。",

    poet:"刘翰《立秋》" },
  { id:14, season:"秋天", sc:"autumn", name:"处暑", date:"8月23日前后", meaning:"暑气终止，秋意渐浓", icon:"🌤️",

    food:"鸭子（处暑吃鸭）、龙眼、酸梅汤。\"处暑送鸭，无病各家\"，鸭子性凉润燥。",
    health:"滋阴润燥，预防秋燥。调整作息，早睡早起。适当秋冻，增强耐寒能力。注意防过敏。",

    poetry:"《处暑》·左河水\n一度暑出处暑时，秋风送爽已觉迟。\n日行南径斜晖里，割稻陌阡车马驰。",
    poet:"左河水《处暑》" },
  { id:15, season:"秋天", sc:"autumn", name:"白露", date:"9月8日前后", meaning:"天气转凉，露凝而白", icon:"💧",

    health:"防秋燥，滋阴润肺。注意添衣保暖，\"白露身不露\"。多食梨、百合、银耳等白色食物润肺。",
    farming:"秋收全面开始，收割水稻、玉米。\"白露满地红黄白，棉花地里人如海\"。采摘秋茶。",
    poetry:"《白露》·杜甫\n白露团甘子，清晨散马蹄。\n圃开连石树，船渡入江溪。",
    poet:"杜甫《白露》" },
  { id:16, season:"秋天", sc:"autumn", name:"秋分", date:"9月23日前后", meaning:"昼夜平分，秋色正中", icon:"🍁",

    food:"秋菜（野苋菜）、汤圆、桂花糕、螃蟹。\"秋分吃秋菜\"，用秋菜和鱼片煮汤。",

  { id:17, season:"秋天", sc:"autumn", name:"寒露", date:"10月8日前后", meaning:"露水更冷，即将结冰", icon:"🥶",

    health:"防寒保暖，尤其注意足部保暖。\"寒露脚不露\"。预防呼吸道疾病，多食润肺养胃食物。",
    farming:"秋收扫尾，抢收晚稻、花生。冬小麦播种，油菜移栽。\"寒露收山楂，霜降刨地瓜\"。",

    poet:"白居易《池上》" },
  { id:18, season:"秋天", sc:"autumn", name:"霜降", date:"10月24日前后", meaning:"天气渐冷，开始降霜", icon:"❄️",

  { id:19, season:"冬天", sc:"winter", name:"立冬", date:"11月8日前后", meaning:"冬季开始，万物收藏", icon:"🧊",

  { id:20, season:"冬天", sc:"winter", name:"小雪", date:"11月22日前后", meaning:"开始降雪，但雪量不大", icon:"🌨️",

function getSolarTermDate(term, year) {
  const dateMap = {
    立春:[2,4], 雨水:[2,19], 惊蛰:[3,6], 春分:[3,21], 清明:[4,5], 谷雨:[4,20],
    立夏:[5,6], 小满:[5,21], 芒种:[6,6], 夏至:[6,21], 小暑:[7,7], 大暑:[7,23],
    立秋:[8,8], 处暑:[8,23], 白露:[9,8], 秋分:[9,23], 寒露:[10,8], 霜降:[10,24],
    立冬:[11,8], 小雪:[11,22], 大雪:[12,7], 冬至:[12,22], 小寒:[1,6], 大寒:[1,20]
  };
  const [m, d] = dateMap[term.name];
  if (m === 1 && d <= 20) return new Date(year + 1, 0, d);
  return new Date(year, m - 1, d);
}
function findCurrentAndNext() {
  const now = new Date();
  const year = now.getFullYear();
  let current = null, next = null;
  for (let i = solarTerms.length - 1; i >= 0; i--) {
    const d = getSolarTermDate(solarTerms[i], year);
    if (d <= now) {
      current = solarTerms[i];
      next = solarTerms[(i + 1) % 24];
      break;
    }
  }
  if (!current) {
    current = solarTerms[23];
    next = solarTerms[0];
  }
  return { current, next };
}
function renderCurrentHero() {
  const { current, next } = findCurrentAndNext();
  const hero = document.getElementById('currentHero');
  hero.className = 'current-hero ' + current.sc;
  hero.innerHTML = `
    <span class="hero-tag">当前节气</span>
    <div class="hero-name">${current.icon} ${current.name}</div>
    <div class="hero-date">${current.date} · ${current.meaning}</div>
    <div class="hero-desc">${current.climate}</div>
    <div class="hero-countdown">👉 下一个节气：${next.icon} ${next.name}（${next.date}）</div>
  `;
}
function updateCountdown() {
  const { next } = findCurrentAndNext();
  const year = new Date().getFullYear();
  const target = getSolarTermDate(next, year);
  const now = new Date();
  let diff = target - now;
  if (diff < 0) diff = 0;
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  const secs = Math.floor((diff % (1000 * 60)) / 1000);
  document.getElementById('cdTermName').textContent = `${next.icon} ${next.name}（${next.date}）`;
  document.getElementById('cdDays').textContent = days;
  document.getElementById('cdHours').textContent = String(hours).padStart(2,'0');
  document.getElementById('cdMins').textContent = String(mins).padStart(2,'0');
  document.getElementById('cdSecs').textContent = String(secs).padStart(2,'0');
}
function renderTimeline() {
  const { current } = findCurrentAndNext();
  const tl = document.getElementById('timeline');
  tl.innerHTML = solarTerms.map(t => {
    const cls = t.name === current.name ? `timeline-item ${t.sc} current` : `timeline-item ${t.sc}`;
    return `<div class="${cls}" onclick="scrollToTerm('${t.name}')">
      <div class="tm-name">${t.icon} ${t.name}</div>
      <div class="tm-date">${t.date}</div>
      <div class="tm-num">#${t.id}</div>
    </div>`;
  }).join('');
}
function renderTermCards(filtered) {
  const grid = document.getElementById('termsGrid');
  const noResult = document.getElementById('noResult');
  if (filtered.length === 0) {
    grid.innerHTML = '';
    noResult.classList.remove('hidden');
    return;
  }
  noResult.classList.add('hidden');
  grid.innerHTML = filtered.map(t => `
    <div class="term-card ${t.sc}" id="term-${t.name}">
      <div class="tc-header">
        <span class="tc-icon">${t.icon}</span>
        <span class="tc-name">${t.name}</span>
        <span class="tc-date">${t.date}</span>
      </div>
      <div class="tc-details">
        <div class="tc-detail"><div class="tc-label">含义</div><div class="tc-value">${t.meaning}</div></div>
        <div class="tc-detail"><div class="tc-label">气候特征</div><div class="tc-value">${t.climate}</div></div>
        <div class="tc-detail"><div class="tc-label">民俗活动</div><div class="tc-value">${t.customs}</div></div>
        <div class="tc-detail"><div class="tc-label">节气美食</div><div class="tc-value">${t.food}</div></div>
        <div class="tc-detail"><div class="tc-label">养生建议</div><div class="tc-value">${t.health}</div></div>
        <div class="tc-detail"><div class="tc-label">农事活动</div><div class="tc-value">${t.farming}</div></div>
      </div>
      <div class="tc-poetry">
        <span class="verse">${t.poetry.replace(/\n/g, '<br>')}</span>
        <span class="author">—— ${t.poet}</span>
      </div>
    </div>
  `).join('');
}
function scrollToTerm(name) {
  const el = document.getElementById('term-' + name);
  if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
}
let currentSeason = '全部';
let searchQuery = '';
function filterSeason(season) {
  currentSeason = season;
  document.querySelectorAll('.season-tab').forEach(b => b.classList.remove('active'));
  document.querySelector(`.season-tab[data-season="${season}"]`).classList.add('active');
  applyFilters();
}
function handleSearch() {
  searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
  applyFilters();
}
function applyFilters() {
  let filtered = solarTerms;
  if (currentSeason !== '全部') {
    filtered = filtered.filter(t => t.season === currentSeason);
  }
  if (searchQuery) {
    filtered = filtered.filter(t =>
      t.name.includes(searchQuery) ||
      t.meaning.includes(searchQuery) ||
      t.climate.includes(searchQuery) ||
      t.customs.includes(searchQuery) ||
      t.food.includes(searchQuery) ||
      t.health.includes(searchQuery) ||
      t.farming.includes(searchQuery) ||
      t.poetry.includes(searchQuery) ||
      t.date.includes(searchQuery) ||
      t.season.includes(searchQuery)
    );
  }
  renderTermCards(filtered);
}
renderCurrentHero();
updateCountdown();
setInterval(updateCountdown, 1000);
renderTimeline();
renderTermCards(solarTerms);
filterSeason('全部');
</script>
<script src="../i18n.js" defer>

</script>
