<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字特效</title><meta name="description" content="汉字特效 - 在线查看汉字特效"><style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.effect-container{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0;position:relative;overflow:hidden;min-height:200px}.effect-char{font-size:6rem;font-weight:700;color:var(--blue);display:inline-block}.effect-options{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0}.effect-option{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.85rem;transition:all .2s}.effect-option:hover{border-color:var(--blue)}.effect-option.active{border-color:var(--green);background:rgba(35,134,54,.1)}</style><meta property="og:title" content="汉字特效"><meta property="og:description" content="汉字特效 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>✨ 汉字特效</h1><p class="sub">在线查看汉字特效</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" value="特" oninput="showEffect()">
</div>
<button class="btn" onclick="showEffect()">显示特效</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var effectTypes=['fire','ice','electric','poison','holy','dark','light','shadow','rainbow','galaxy'];
var currentEffect='fire';
function showEffect(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var html='<div class="card">';
  html+='<div class="effect-options">';
  effectTypes.forEach(function(type){
    html+='<div class="effect-option '+(type===currentEffect?'active':'')+'" onclick="setEffect(\''+type+'\')">'+getEffectName(type)+'</div>';
  });
  html+='</div>';
  html+='<div class="effect-container">';
  html+=getEffectHTML(char);
  html+='</div>';
  html+='<div class="section"><h3>📋 特效说明</h3>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>特效类型：</strong>'+getEffectName(currentEffect)+'</div>';
  html+='<div><strong>效果描述：</strong>'+getEffectDescription(currentEffect)+'</div>';
  html+='</div></div></div>';
  r.innerHTML=html;
}
function setEffect(type){
  currentEffect=type;
  showEffect();
}
function getEffectName(type){
  switch(type){
    case 'fire':return'火焰';
    case 'ice':return'冰冻';
    case 'electric':return'电击';
    case 'poison':return'毒液';
    case 'holy':return'神圣';
    case 'dark':return'黑暗';
    case 'light':return'光明';
    case 'shadow':return'暗影';
    case 'rainbow':return'彩虹';
    case 'galaxy':return'银河';
    default:return'未知';
  }
}
function getEffectDescription(type){
  switch(type){
    case 'fire':return'燃烧的火焰效果，带有橙红色光芒';
    case 'ice':return'冰冻效果，带有蓝色冰晶';
    case 'electric':return'电击效果，带有黄色电弧';
    case 'poison':return'毒液效果，带有绿色毒雾';
    case 'holy':return'神圣效果，带有金色光芒';
    case 'dark':return'黑暗效果，带有深紫色气息';
    case 'light':return'光明效果，带有白色光辉';
    case 'shadow':return'暗影效果，带有灰色阴影';
    case 'rainbow':return'彩虹效果，带有七彩光芒';
    case 'galaxy':return'银河效果，带有星空特效';
    default:return'未知效果';
  }
}
function getEffectHTML(char){
  switch(currentEffect){
    case 'fire':
      return'<div class="effect-char" style="color:#ff4500;text-shadow:0 0 10px #ff4500,0 0 20px #ff4500,0 0 30px #ff4500,0 0 40px #ff0000,0 0 70px #ff0000;animation:fire 0.5s infinite alternate">'+char+'</div>';
    case 'ice':
      return'<div class="effect-char" style="color:#00bfff;text-shadow:0 0 10px #00bfff,0 0 20px #00bfff,0 0 30px #00bfff,0 0 40px #00ffff,0 0 70px #00ffff;animation:ice 2s infinite">'+char+'</div>';
    case 'electric':
      return'<div class="effect-char" style="color:#ffff00;text-shadow:0 0 10px #ffff00,0 0 20px #ffff00,0 0 30px #ffff00,0 0 40px #ffd700,0 0 70px #ffd700;animation:electric 0.2s infinite">'+char+'</div>';
    case 'poison':
      return'<div class="effect-char" style="color:#32cd32;text-shadow:0 0 10px #32cd32,0 0 20px #32cd32,0 0 30px #32cd32,0 0 40px #00ff00,0 0 70px #00ff00;animation:poison 1.5s infinite">'+char+'</div>';
    case 'holy':
      return'<div class="effect-char" style="color:#ffd700;text-shadow:0 0 10px #ffd700,0 0 20px #ffd700,0 0 30px #ffd700,0 0 40px #fffacd,0 0 70px #fffacd;animation:holy 2s infinite">'+char+'</div>';
    case 'dark':
      return'<div class="effect-char" style="color:#4b0082;text-shadow:0 0 10px #4b0082,0 0 20px #4b0082,0 0 30px #4b0082,0 0 40px #800080,0 0 70px #800080;animation:dark 3s infinite">'+char+'</div>';
    case 'light':
      return'<div class="effect-char" style="color:#ffffff;text-shadow:0 0 10px #ffffff,0 0 20px #ffffff,0 0 30px #ffffff,0 0 40px #f0f0f0,0 0 70px #f0f0f0;animation:light 1.5s infinite">'+char+'</div>';
    case 'shadow':
      return'<div class="effect-char" style="color:#696969;text-shadow:2px 2px 4px rgba(0,0,0,0.5),4px 4px 8px rgba(0,0,0,0.3);animation:shadow 2s infinite">'+char+'</div>';
    case 'rainbow':
      return'<div class="effect-char" style="animation:rainbow 3s linear infinite">'+char+'</div>';
    case 'galaxy':
      return'<div class="effect-char" style="background:linear-gradient(45deg,#000033,#000066,#000099,#0000cc,#0000ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:galaxy 5s linear infinite">'+char+'</div>';
    default:
      return'<div class="effect-char">'+char+'</div>';
  }
}
function randomCharacter(){
  var chars='的一是不了人我在有他这中大来上个国到说们为子和你地出会也时要就可以生能那得着下自之年过发后与都而行前里如面起把好她事件什让新方头经于主学公同年去到理放心之你到家到国到我到他到她到它到我们到你们到他们到她们到它们到大家到所有到每个到任何到没有到一切到全部到整个';
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  showEffect();
}
showEffect();
</script>
<style>
@keyframes fire{0%{text-shadow:0 0 10px #ff4500,0 0 20px #ff4500,0 0 30px #ff4500,0 0 40px #ff0000,0 0 70px #ff0000}100%{text-shadow:0 0 20px #ff4500,0 0 30px #ff4500,0 0 40px #ff4500,0 0 50px #ff0000,0 0 80px #ff0000,0 0 90px #ff0000}}
@keyframes ice{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.05);opacity:0.8}}
@keyframes electric{0%,100%{transform:translate(0)}25%{transform:translate(-2px,2px)}50%{transform:translate(2px,-2px)}75%{transform:translate(-2px,-2px)}}
@keyframes poison{0%,100%{opacity:1}50%{opacity:0.7}}
@keyframes holy{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.1);opacity:0.9}}
@keyframes dark{0%,100%{opacity:1}50%{opacity:0.6}}
@keyframes light{0%,100%{opacity:1}50%{opacity:0.8}}
@keyframes shadow{0%,100%{transform:translate(0)}50%{transform:translate(5px,5px)}}
@keyframes rainbow{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
@keyframes galaxy{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
</style></body></html>
