<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☕ 咖啡追踪</title>
<meta property="og:title" content="☕ 咖啡追踪">
<meta property="og:description" content="☕ 咖啡追踪 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="记录你的咖啡消费，追踪咖啡因摄入和口味偏好">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#3b82f6;--green:#238636;--red:#ef4444;--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#9a6700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6padding:16px;}
.ctn{max-width:720px;margin:0 auto}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select,button{font-family:inherit;font-size:.95rem}
input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:60px}select{cursor:pointer}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}button.dng{background:var(--danger)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.fr{grid-template-columns:1}.ctn{padding:0}}
.li{padding:12px;border-bottom:1px solid var(--border)}.li:last-child{border-bottom:none}
.es{text-align:center;padding:40px;color:var(--text2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
.gr .st{text-align:center;padding:12px;background:var(--bg);border-radius:8px}
.gr .st .nm{font-size:1.5rem;font-weight:700;color:var(--accent)}.gr .st .lb{font-size:.8rem;color:var(--text2);margin-top:4px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;color:#fff;margin-right:4px}
.tag.espresso{background:#8b4513}.tag.latte{background:#d2b48c;color:#333}.tag.americano{background:#2f1b14}.tag.cappuccino{background:#c4a882;color:#333}.tag.other{background:var(--text2)}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-bar button{padding:6px 14px;font-size:.85rem;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:20px;cursor:pointer}
.filter-bar button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.week-chart{display:flex;gap:4px;align-items:flex-end;height:100px;margin-top:10px}
.week-chart .bar{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:4px;transition:height .3s;position:relative}
.week-chart .bar .lbl{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:.65rem;color:var(--text2);white-space:nowrap}
.week-chart .bar .val{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:.7rem;color:var(--text2)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn">
<div class="hdr"><h1>☕ 咖啡追踪</h1><p>记录你的每一杯咖啡</p></div>

<div class="gr">
<div class="st"><div class="nm" id="sTotal">0</div><div class="lb">总杯数</div></div>
<div class="st"><div class="nm" id="sToday">0</div><div class="lb">今日</div></div>
<div class="st"><div class="nm" id="sCaffeine">0</div><div class="lb">今日咖啡因(mg)</div></div>
<div class="st"><div class="nm" id="sCost">0</div><div class="lb">本周花费</div></div>
</div>

<div class="cd" style="margin-top:16px"><h2>记录咖啡</h2>
<div class="fr">
<div><label>咖啡名称</label><input type="text" id="cName" placeholder="如：拿铁"></div>
<div><label>类型</label><select id="cType"><option value="espresso">浓缩</option><option value="latte">拿铁</option><option value="americano">美式</option><option value="cappuccino">卡布奇诺</option><option value="other">其他</option></select></div>
</div>
<div class="fr">
<div><label>日期</label><input type="date" id="cDate"></div>
<div><label>时间</label><input type="time" id="cTime"></div>
</div>
<div class="fr">
<div><label>咖啡因(mg)</label><input type="number" id="cCaffeine" placeholder="如：95"></div>
<div><label>花费(元)</label><input type="number" id="cCost" placeholder="0"></div>
</div>
<label>备注</label><textarea id="cNote" placeholder="口味、感受..."></textarea>
<div class="bg"><button onclick="addCoffee()">记录咖啡</button></div>
<div id="cMsg" style="display:none;text-align:center;padding:8px;border-radius:8px;margin-top:8px;font-size:.85rem"></div></div>

<div class="cd"><h2>本周咖啡因摄入</h2>
<div class="week-chart" id="weekChart"></div>
<div style="height:24px"></div>
</div>

<div class="cd"><h2>咖啡记录</h2>
<div class="filter-bar">
<button class="active" onclick="setFilter('all',this)">全部</button>
<button onclick="setFilter('today',this)">今日</button>
<button onclick="setFilter('week',this)">本周</button>
</div>
<div id="coffeeList" class="es">暂无记录</div>
</div>
</div>

<script>
let coffees=JSON.parse(localStorage.getItem('coffeeTracker')||'[]');
let filter='all';
const caffeineMap={espresso:63,latte:75,americano:95,cappuccino:75,other:80};
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function save(){localStorage.setItem('coffeeTracker',JSON.stringify(coffees))}
function showMsg(m,t){const e=$('cMsg');e.textContent=m;e.style.display='block';e.style.background=t==='error'?'rgba(239,68,68,.15)':'rgba(34,197,94,.15)';e.style.color=t==='error'?'var(--danger)':'var(--success)';setTimeout(()=>e.style.display='none',2000)}
function today(){return new Date().toISOString().slice(0,10)}
function weekAgo(){const d=new Date();d.setDate(d.getDate()-7);return d.toISOString().slice(0,10)}
function addCoffee(){const name=$('cName').value.trim(),type=$('cType').value,date=$('cDate').value||today(),time=$('cTime').value||new Date().toTimeString().slice(0,5),caffeine=parseInt($('cCaffeine').value)||caffeineMap[type],cost=parseFloat($('cCost').value)||0,note=$('cNote').value.trim();if(!name){showMsg('请填写咖啡名称','error');return}coffees.push({name,type,date,time,caffeine,cost,note,addedAt:Date.now()});save();render();showMsg('咖啡已记录','success');$('cName').value='';$('cNote').value=''}
function setFilter(f,el){filter=f;document.querySelectorAll('.filter-bar button').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()}
function render(){const td=today(),wa=weekAgo();const todayList=coffees.filter(c=>c.date===td);const weekList=coffees.filter(c=>c.date>=wa);const list=filter==='all'?coffees:filter==='today'?todayList:weekList;$('sTotal').textContent=coffees.length;$('sToday').textContent=todayList.length;$('sCaffeine').textContent=todayList.reduce((s,c)=>s+c.caffeine,0);$('sCost').textContent=weekList.reduce((s,c)=>s+c.cost,0).toFixed(0);
const days=['日','一','二','三','四','五','六'];const weekData=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const ds=d.toISOString().slice(0,10);const count=coffees.filter(c=>c.date===ds).length;weekData.push({day:days[d.getDay()],count})}
const maxC=Math.max(1,...weekData.map(d=>d.count));$('weekChart').innerHTML=weekData.map(d=>'<div class="bar" style="height:'+(d.count/maxC*100)+'%"><div class="val">'+d.count+'</div><div class="lbl">'+d.day+'</div></div>').join('');
const typeMap={espresso:'浓缩',latte:'拿铁',americano:'美式',cappuccino:'卡布奇诺',other:'其他'};$('coffeeList').innerHTML=list.length?list.map((c,i)=>{const realIdx=coffees.indexOf(c);return '<div class="li"><div style="display:flex;justify-content:space-between;align-items:center"><div><span style="font-weight:600">'+esc(c.name)+'</span><br><span class="tag '+c.type+'">'+typeMap[c.type]+'</span><span style="color:var(--text2);font-size:.8rem;margin-left:4px">'+c.date+' '+c.time+'</span></div><div style="text-align:right"><div style="font-size:.9rem;color:var(--accent)">'+c.caffeine+'mg</div>'+(c.cost?'<div style="font-size:.8rem;color:var(--text2)">¥'+c.cost.toFixed(0)+'</div>':'')+'</div></div>'+(c.note?'<div style="font-size:.85rem;color:var(--text2);margin-top:4px">'+esc(c.note)+'</div>':'')+'<div class="bg"><button class="dng" style="padding:4px 12px;font-size:.8rem" onclick="removeCoffee('+realIdx+')">删除</button></div></div>'}).join(''):'<div class="es">暂无记录</div>'}
function removeCoffee(i){coffees.splice(i,1);save();render()}
const now=new Date();$('cDate').value=today();$('cTime').value=now.toTimeString().slice(0,5);
render()
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
