<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 史诗追踪</title>
<meta name="description" content="史诗(Epic)追踪工具，管理大型用户故事和功能集">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:700px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.hidden{display:none!important}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.epic-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px;border-left:4px solid var(--accent)}
.epic-card h3{font-size:1rem;margin-bottom:6px}
.epic-meta{font-size:.8rem;color:var(--text2);margin-bottom:8px}
.story-item{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--border);font-size:.9rem}
.story-item:last-child{border-bottom:none}
.story-status{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.status-done{background:var(--green)}
.status-progress{background:var(--yellow)}
.status-todo{background:var(--border)}
.remove-btn{background:none;border:none;color:var(--red);cursor:pointer;font-size:.85rem;flex-shrink:0}
.add-row{display:flex;gap:6px;margin-top:8px}
.add-row input{margin-bottom:0;flex:1}
.add-row select{width:auto;margin-bottom:0}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600}
.tag-blue{background:rgba(59,130,246,.2);color:var(--accent)}
.tag-green{background:rgba(63,185,80,.2);color:var(--green)}
.tag-red{background:rgba(248,81,73,.2);color:var(--red)}
.empty{text-align:center;color:var(--text2);padding:40px}
.stat-row{display:flex;gap:16px;margin:8px 0}
.stat-item{text-align:center;flex:1}
.stat-num{font-size:1.5rem;font-weight:700;color:var(--accent)}
.stat-label{font-size:.75rem;color:var(--text2)}
@media(max-width:600px){body{padding:10px}.ctn{max-width:100%}.cd{padding:14px}h1{font-size:1.4rem}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🎯 史诗追踪">
<meta property="og:description" content="史诗(Epic)追踪工具，管理大型用户故事和功能集">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/epic-tracker-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='epic_tracker';
let epics=JSON.parse(localStorage.getItem(STORE)||'[]');
let curView='list',curId=null;
function save(){localStorage.setItem(STORE,JSON.stringify(epics))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function render(){
  let h=`<div class="hdr"><h1>🎯 史诗追踪</h1><p>管理大型用户故事和功能集</p></div>`;
  h+=`<div class="flex" style="justify-content:center;margin-bottom:16px"><button onclick="showNew()">新建史诗</button><button class="sec" onclick="curView='list';render()">全部史诗</button></div>`;
  h+=`<div id="viewNew" class="${curView==='new'?'':'hidden'}"></div>`;
  h+=`<div id="viewList" class="${curView==='list'?'':'hidden'}"></div>`;
  h+=`<div id="viewDetail" class="${curView==='detail'?'':'hidden'}"></div>`;
  $('app').innerHTML=h;
  if(curView==='new')renderNew();else if(curView==='list')renderList();else renderDetail();
}
function renderNew(){
  let h=`<div class="cd"><h2>新建史诗</h2>`;
  h+=`<label>史诗名称</label><input id="eName" placeholder="例如：用户管理系统">`;
  h+=`<label>描述</label><textarea id="eDesc" placeholder="史诗的整体描述"></textarea>`;
  h+=`<label>优先级</label><select id="ePriority"><option value="high">高</option><option value="med" selected>中</option><option value="low">低</option></select>`;
  h+=`<label>目标完成日期</label><input type="date" id="eDue">`;
  h+=`<div class="bg"><button onclick="saveEpic()">创建</button><button class="sec" onclick="curView='list';render()">取消</button></div></div>`;
  $('viewNew').innerHTML=h;
}
function saveEpic(){
  const name=$('eName').value.trim();if(!name){alert('请输入名称');return}
  epics.push({id:uid(),name,desc:$('eDesc').value,priority:$('ePriority').value,due:$('eDue').value,stories:[],createdAt:new Date().toISOString()});
  save();curId=epics[epics.length-1].id;curView='detail';render();
}
function renderList(){
  let h=`<div class="cd">`;
  if(!epics.length){h+=`<p class="empty">暂无史诗</p>`}
  epics.slice().reverse().forEach(e=>{
    const total=e.stories.length;
    const done=e.stories.filter(s=>s.status==='done').length;
    const pct=total?Math.round(done/total*100):0;
    h+=`<div class="epic-card" onclick="viewEpic('${e.id}')">`;
    h+=`<div class="flex-between"><h3>${e.name}</h3><span class="tag tag-${e.priority==='high'?'red':e.priority==='med'?'blue':'green'}">${{high:'高',med:'中',low:'低'}[e.priority]}</span></div>`;
    if(e.desc)h+=`<div class="epic-meta">${e.desc}</div>`;
    h+=`<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
    h+=`<div class="flex-between"><span class="epic-meta">${done}/${total} 故事完成</span>${e.due?`<span class="epic-meta">截止：${e.due}</span>`:''}</div></div>`;
  });
  h+=`</div>`;$('viewList').innerHTML=h;
}
function viewEpic(id){curId=id;curView='detail';render()}
function delEpic(id){if(!confirm('确定删除?'))return;epics=epics.filter(e=>e.id!==id);save();curView='list';render()}
function renderDetail(){
  const e=epics.find(x=>x.id===curId);if(!e){curView='list';render();return}
  const total=e.stories.length,done=e.stories.filter(s=>s.status==='done').length;
  const pct=total?Math.round(done/total*100):0;
  let h=`<div class="cd"><div class="flex-between"><h2>${e.name}</h2><span class="tag tag-${e.priority==='high'?'red':e.priority==='med'?'blue':'green'}">${{high:'高',med:'中',low:'低'}[e.priority]}</span></div>`;
  if(e.desc)h+=`<p style="color:var(--text2);margin-bottom:12px">${e.desc}</p>`;
  h+=`<div class="stat-row"><div class="stat-item"><div class="stat-num">${total}</div><div class="stat-label">总故事</div></div>`;
  h+=`<div class="stat-item"><div class="stat-num" style="color:var(--green)">${done}</div><div class="stat-label">已完成</div></div>`;
  h+=`<div class="stat-item"><div class="stat-num" style="color:var(--yellow)">${total-done}</div><div class="stat-label">进行中</div></div></div>`;
  h+=`<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
  h+=`<h2 style="margin-top:16px">用户故事</h2>`;
  h+=`<div class="flex"><input id="storyTitle" placeholder="故事标题" style="flex:1;margin-bottom:0"><select id="storyStatus" style="width:auto;margin-bottom:0"><option value="todo">待办</option><option value="progress">进行中</option><option value="done">完成</option></select><button onclick="addStory()">添加</button></div>`;
  e.stories.forEach((s,i)=>{
    h+=`<div class="story-item"><span class="story-status status-${s.status}"></span><span style="flex:1">${s.title}</span><button class="remove-btn" onclick="delStory('${e.id}',${i})">✕</button></div>`;
  });
  h+=`<div class="bg" style="margin-top:16px"><button class="sec" onclick="curView='list';render()">返回</button><button class="dng" onclick="delEpic('${e.id}')">删除史诗</button></div></div>`;
  $('viewDetail').innerHTML=h;
}
function addStory(){
  const e=epics.find(x=>x.id===curId);if(!e)return;
  const title=$('storyTitle').value.trim();if(!title)return;
  e.stories.push({id:uid(),title,status:$('storyStatus').value});
  save();$('storyTitle').value='';renderDetail();
}
function delStory(eid,idx){const e=epics.find(x=>x.id===eid);if(!e)return;e.stories.splice(idx,1);save();renderDetail()}
function showNew(){curView='new';render()}
render();
</script>
</body>
</html>
