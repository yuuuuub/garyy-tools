<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校验和计算器 - 在线校验码计算工具</title>
<meta property="og:title" content="校验和计算器 - 在线校验码计算工具">
<meta property="og:description" content="校验和计算器 - 在线校验码计算工具 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="在线校验和计算器 - CRC32/MD5/SHA1/SHA256校验码计算，支持文件和文本">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">
<script src="../i18n.js" defer></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {--green:#238636;--red:#ef4444;--blue:#3b82f6;
  --bg: #0d1117; --bg-card: #161b22; --bg-input: #0d1117;
  --border: #30363d; --text: #e6edf3; --text-secondary: #8b949e;
  --accent: #58a6ff; --accent-hover: #79c0ff; --danger: #f85149;
  --success: #3fb950; --warning: #d2991d; --radius: 8px;
}
[data-theme="light"] { --bg: #f6f8fa; --bg-card: #fff; --bg-input: #fff; --border: #d0d7de; --text: #1f2328; --text-secondary: #656d76; --accent: #0969da; --accent-hover: #0550ae; --danger: #cf222e; --success: #1a7f37; --warning: #9a6700; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; line-height: 1.6; }
.container { max-width: 800px; margin: 0 auto; }
h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), #bc8cff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-bottom: 8px; }
.subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 32px; }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
.card h2 { font-size: 1.1rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
label { display: block; font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 4px; margin-top: 12px; }
input, select, textarea { width: 100%; padding: 10px 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.95rem; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; font-family: monospace; }
.btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-weight: 500; transition: 0.2s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-sm { padding: 6px 12px; font-size: 0.8rem; }
.actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 8px; color: #fff; font-size: 0.9rem; z-index: 1000; animation: slideIn 0.3s ease; }
.toast-success { background: var(--success); }
.toast-error { background: var(--danger); }
@keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.drop-zone { border: 2px dashed var(--border); border-radius: 8px; padding: 40px; text-align: center; cursor: pointer; transition: 0.2s; }
.drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: rgba(88,166,255,0.05); }
.drop-zone .icon { font-size: 2.5rem; margin-bottom: 8px; }
.drop-zone p { color: var(--text-secondary); }
.result-table { width: 100%; border-collapse: collapse; }
.result-table th, .result-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); }
.result-table th { color: var(--text-secondary); font-weight: 500; font-size: 0.85rem; }
.result-table td { font-family: monospace; font-size: 0.9rem; word-break: break-all; }
.copy-btn { cursor: pointer; color: var(--accent); font-size: 0.8rem; margin-left: 8px; }
.copy-btn:hover { text-decoration: underline; }
.file-info { padding: 12px; background: var(--bg-input); border-radius: 6px; margin-top: 12px; display: none; }
.file-info .name { font-weight: 600; }
.file-info .size { color: var(--text-secondary); font-size: 0.85rem; }
.compare-box { margin-top: 12px; }
.compare-input { display: flex; gap: 8px; align-items: center; }
.compare-input input { flex: 1; }
.match { color: var(--success); font-weight: 600; }
.mismatch { color: var(--danger); font-weight: 600; }

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div class="container">
  <h1>🧮 校验和计算器</h1>
  <p class="subtitle">CRC32 / MD5 / SHA1 / SHA256 校验码计算</p>

  <div class="card">
    <h2>📝 文本输入</h2>
    <textarea id="text-input" rows="4" placeholder="输入文本计算校验和..." oninput="clearResults()"></textarea>
    <div class="actions">
      <button class="btn btn-primary" onclick="computeTextChecksum()">计算校验和</button>
      <button class="btn btn-outline" onclick="document.getElementById('text-input').value='';clearResults()">清空</button>
    </div>
  </div>

  <div class="card">
    <h2>📁 文件输入</h2>
    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
      <div class="icon">📄</div>
      <p>点击选择文件或拖拽文件到这里</p>
      <p style="font-size:0.8rem;margin-top:4px">支持任意文件类型</p>
    </div>
    <input type="file" id="file-input" style="display:none" onchange="handleFile(event)">
    <div class="file-info" id="file-info">
      <div class="name" id="file-name"></div>
      <div class="size" id="file-size"></div>
    </div>
  </div>

  <div class="card">
    <h2>📊 计算结果</h2>
    <div id="results-empty" style="color:var(--text-secondary);text-align:center;padding:24px">输入文本或选择文件后显示结果</div>
    <table class="result-table" id="results-table" style="display:none">
      <thead><tr><th>算法</th><th>校验和值</th><th>长度</th></tr></thead>
      <tbody id="results-body"></tbody>
    </table>
    <div class="compare-box" id="compare-box" style="display:none">
      <label>验证校验和（粘贴预期值对比）</label>
      <div class="compare-input">
        <select id="compare-algo" style="width:120px;flex:none"><option value="md5">MD5</option><option value="sha1">SHA-1</option><option value="sha256">SHA-256</option><option value="crc32">CRC32</option></select>
        <input id="compare-hash" placeholder="粘贴预期校验和">
        <button class="btn btn-outline btn-sm" onclick="compareChecksum()">对比</button>
      </div>
      <div id="compare-result" style="margin-top:8px"></div>
    </div>
  </div>

  <div class="card">
    <h2>📚 常见校验和格式</h2>
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:0.85rem">
        <thead><tr style="border-bottom:1px solid var(--border)"><th style="padding:8px;text-align:left">算法</th><th style="padding:8px;text-align:left">长度</th><th style="padding:8px;text-align:left">用途</th></tr></thead>
        <tbody>
          <tr style="border-bottom:1px solid var(--border)"><td style="padding:8px">CRC32</td><td style="padding:8px">8字符</td><td style="padding:8px">文件完整性、网络传输</td></tr>
          <tr style="border-bottom:1px solid var(--border)"><td style="padding:8px">MD5</td><td style="padding:8px">32字符</td><td style="padding:8px">文件校验（不推荐安全用途）</td></tr>
          <tr style="border-bottom:1px solid var(--border)"><td style="padding:8px">SHA-1</td><td style="padding:8px">40字符</td><td style="padding:8px">Git提交、证书指纹</td></tr>
          <tr style="border-bottom:1px solid var(--border)"><td style="padding:8px">SHA-256</td><td style="padding:8px">64字符</td><td style="padding:8px">区块链、安全校验、密码存储</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
let lastResults = {};
let currentFile = null;

function toast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function clearResults() {
  lastResults = {};
  document.getElementById('results-empty').style.display = 'block';
  document.getElementById('results-table').style.display = 'none';
  document.getElementById('compare-box').style.display = 'none';
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}

const dropZone = document.getElementById('drop-zone');
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) processFile(file);
});

function handleFile(e) { const file = e.target.files[0]; if (file) processFile(file); }

function processFile(file) {
  currentFile = file;
  document.getElementById('file-info').style.display = 'block';
  document.getElementById('file-name').textContent = file.name;
  document.getElementById('file-size').textContent = formatSize(file.size);
  computeFileChecksum(file);
}

async function computeTextChecksum() {
  const text = document.getElementById('text-input').value;
  if (!text) { toast('请输入文本', 'error'); return; }
  const encoder = new TextEncoder();
  const data = encoder.encode(text);
  await computeFromBytes(data);
}

async function computeFileChecksum(file) {
  const buffer = await file.arrayBuffer();
  await computeFromBytes(new Uint8Array(buffer));
}

async function computeFromBytes(data) {
  lastResults = {};
  const md5Hash = await computeMD5(data);
  const sha1Hash = await computeSHA1(data);
  const sha256Hash = await computeSHA256(data);
  const crc32Hash = computeCRC32(data);

  lastResults = { md5: md5Hash, sha1: sha1Hash, sha256: sha256Hash, crc32: crc32Hash };

  const body = document.getElementById('results-body');
  body.innerHTML = '';
  const rows = [
    { algo: 'CRC32', hash: crc32Hash, len: 8 },
    { algo: 'MD5', hash: md5Hash, len: 32 },
    { algo: 'SHA-1', hash: sha1Hash, len: 40 },
    { algo: 'SHA-256', hash: sha256Hash, len: 64 }
  ];
  rows.forEach(r => {
    const tr = document.createElement('tr');
    tr.style.borderBottom = '1px solid var(--border)';
    tr.innerHTML = `<td style="padding:12px 16px;font-weight:500">${r.algo}</td>
      <td style="padding:12px 16px;font-family:monospace;font-size:0.9rem;word-break:break-all">
        <span id="val-${r.algo}">${r.hash}</span>
        <span class="copy-btn" onclick="copyHash('${r.algo}','${r.hash}')">复制</span>
      </td>
      <td style="padding:12px 16px;color:var(--text-secondary)">${r.len}字符</td>`;
    body.appendChild(tr);
  });

  document.getElementById('results-empty').style.display = 'none';
  document.getElementById('results-table').style.display = 'table';
  document.getElementById('compare-box').style.display = 'block';
}

function copyHash(algo, hash) {
  navigator.clipboard.writeText(hash);
  toast(algo + ' 已复制');
}

async function computeMD5(data) {
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function computeSHA1(data) {
  const hash = await crypto.subtle.digest('SHA-1', data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function computeSHA256(data) {
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function computeCRC32(data) {
  let crc = 0xFFFFFFFF;
  const table = [];
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    table[i] = c;
  }
  for (let i = 0; i < data.length; i++) crc = table[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8);
  return ((crc ^ 0xFFFFFFFF) >>> 0).toString(16).padStart(8, '0');
}

function compareChecksum() {
  const algo = document.getElementById('compare-algo').value;
  const expected = document.getElementById('compare-hash').value.trim().toLowerCase();
  const resultBox = document.getElementById('compare-result');
  if (!expected) { toast('请输入预期校验和', 'error'); return; }
  const actual = lastResults[algo];
  if (!actual) { toast('请先计算校验和', 'error'); return; }
  if (actual === expected) {
    resultBox.innerHTML = '<span class="match">✅ 校验和匹配</span>';
    toast('校验和匹配');
  } else {
    resultBox.innerHTML = `<span class="mismatch">❌ 校验和不匹配</span><br><span style="font-size:0.8rem;color:var(--text-secondary)">预期: ${expected}<br>实际: ${actual}</span>`;
    toast('校验和不匹配', 'error');
  }
}
</script>
</body>
</html>
