<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💬 名言警句</title>
<style>
  :root {
    --bg: #f5f0e8;
    --card-bg: #fffef9;
    --text: #3e3a35;
    --text-secondary: #7a7368;
    --accent: #8b5e3c;
    --accent-hover: #6b4530;
    --border: #d4c8b8;
    --shadow: 0 4px 24px rgba(0,0,0,.08);
    --tag-bg: #ebe2d5;
    --tag-active-bg: #8b5e3c;
    --tag-active-text: #fff;
    --divider: #d4c8b8;
    --btn-text: #fff;
    --toggle-bg: #d4c8b8;
  }
  .dark {
    --bg: #1e1b18;
    --card-bg: #2a2520;
    --text: #e0d7cb;
    --text-secondary: #a09888;
    --accent: #c9a87c;
    --accent-hover: #ddbb88;
    --border: #4a4238;
    --shadow: 0 4px 24px rgba(0,0,0,.3);
    --tag-bg: #3a342c;
    --tag-active-bg: #c9a87c;
    --tag-active-text: #1e1b18;
    --divider: #4a4238;
    --btn-text: #1e1b18;
    --toggle-bg: #4a4238;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "Noto Serif SC", "Source Han Serif SC", "STSong", Georgia, "Times New Roman", serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .4s, color .4s;
    padding: 16px;
  }
  .container {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  .header {
    display: flex;
    width: 100%;
    justify-content: space-between;
    align-items: center;
  }
  .header h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: .02em;
  }
  .header-controls { display: flex; gap: 8px; align-items: center; }
  .icon-btn {
    background: var(--tag-bg);
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px; height: 36px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s, transform .15s;
  }
  .icon-btn:hover { background: var(--accent); color: var(--btn-text); }
  .icon-btn:active { transform: scale(.92); }
  .auto-badge {
    font-size: .7rem;
    background: var(--accent);
    color: var(--btn-text);
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
    display: none;
    line-height: 1.4;
  }
  .auto-badge.active { display: inline-block; }
  .tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .tag {
    font-size: .82rem;
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--tag-bg);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all .2s;
    font-family: inherit;
    white-space: nowrap;
  }
  .tag:hover { border-color: var(--accent); color: var(--accent); }
  .tag.active {
    background: var(--tag-active-bg);
    color: var(--tag-active-text);
    border-color: var(--tag-active-bg);
  }
  .card-wrapper {
    width: 100%;
    perspective: 1200px;
  }
  .card {
    width: 100%;
    min-height: 240px;
    background: var(--card-bg);
    border-radius: 16px;
    padding: 36px 32px 28px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
    transition: transform .5s cubic-bezier(.4,0,.2,1), background .4s, border-color .4s, box-shadow .4s;
    transform-style: preserve-3d;
    cursor: default;
  }
  .card.flip {
    transform: rotateY(180deg);
  }
  .card::before {
    content: '"';
    position: absolute;
    top: 12px; left: 20px;
    font-size: 4rem;
    color: var(--accent);
    opacity: .25;
    line-height: 1;
    font-family: Georgia, serif;
  }
  .card::after {
    content: '"';
    position: absolute;
    bottom: 4px; right: 20px;
    font-size: 4rem;
    color: var(--accent);
    opacity: .25;
    line-height: 1;
    font-family: Georgia, serif;
    transform: rotate(180deg);
  }
  .quote-text {
    font-size: 1.35rem;
    line-height: 1.8;
    margin-bottom: 16px;
    font-weight: 400;
    word-break: break-word;
  }
  .quote-author {
    font-size: .95rem;
    color: var(--text-secondary);
    font-style: italic;
  }
  .quote-author::before { content: "—— "; }
  .actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    font-family: inherit;
    font-size: .92rem;
    padding: 10px 28px;
    border-radius: 24px;
    border: 1px solid var(--accent);
    cursor: pointer;
    transition: all .2s;
    font-weight: 500;
  }
  .btn-primary {
    background: var(--accent);
    color: var(--btn-text);
  }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-outline {
    background: transparent;
    color: var(--accent);
  }
  .btn-outline:hover { background: var(--accent); color: var(--btn-text); }
  .btn:active { transform: scale(.95); }
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: var(--btn-text);
    padding: 10px 24px;
    border-radius: 20px;
    font-size: .88rem;
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
    z-index: 100;
    font-family: inherit;
  }
  .toast.show { opacity: 1; }
  .divider {
    width: 48px; height: 2px;
    background: var(--divider);
    border: none;
    margin: 4px auto 12px;
    border-radius: 1px;
  }
  @media (max-width: 480px) {
    .card { padding: 28px 20px 24px; min-height: 200px; }
    .quote-text { font-size: 1.15rem; }
    .header h1 { font-size: 1.3rem; }
    .tags { gap: 6px; }
    .tag { font-size: .75rem; padding: 5px 12px; }
  }
</style>
</head>

</div>

  { c: "人生", t: "We accept the love we think we deserve.", a: "Stephen Chbosky" },
];

const CATEGORY_CN = { 励志: "🔥 励志", 爱情: "💕 爱情", 人生: "🌿 人生", 幽默: "😄 幽默", 电影: "🎬 电影" };

let currentCategory = "all";
let currentIndex = -1;
let autoTimer = null;
let isAuto = false;

const $card = document.getElementById("card");
const $quoteText = document.getElementById("quoteText");
const $quoteAuthor = document.getElementById("quoteAuthor");
const $toast = document.getElementById("toast");
const $autoBadge = document.getElementById("autoBadge");
const $autoBtn = document.getElementById("autoBtn");
const $themeBtn = document.getElementById("themeBtn");

function getFiltered() {
  if (currentCategory === "all") return QUOTES;
  return QUOTES.filter(q => q.c === currentCategory);
}

function getRandom(excludeIndex) {
  const pool = getFiltered();
  if (pool.length <= 1) return 0;
  let idx;
  do { idx = Math.floor(Math.random() * pool.length); } while (idx === excludeIndex && pool.length > 1);
  return idx;
}

function displayQuote() {
  const pool = getFiltered();
  const idx = getRandom(currentIndex);
  currentIndex = idx;
  const q = pool[idx];
  $card.classList.add("flip");
  setTimeout(() => {
    $quoteText.textContent = q.t;
    $quoteAuthor.textContent = q.a;
    $card.classList.remove("flip");
  }, 250);
}

document.getElementById("refreshBtn").addEventListener("click", displayQuote);

document.getElementById("copyBtn").addEventListener("click", () => {
  const pool = getFiltered();
  const q = pool[currentIndex];
  const txt = `"${q.t}" —— ${q.a}`;
  navigator.clipboard.writeText(txt).then(() => {
    showToast("✅ 已复制到剪贴板");
  }).catch(() => {
    showToast("❌ 复制失败");
  });
});

function showToast(msg) {
  $toast.textContent = msg;
  $toast.classList.add("show");
  clearTimeout($toast._timeout);
  $toast._timeout = setTimeout(() => $toast.classList.remove("show"), 1800);
}

document.getElementById("tags").addEventListener("click", e => {
  if (!e.target.classList.contains("tag")) return;
  document.querySelectorAll(".tag").forEach(t => t.classList.remove("active"));
  e.target.classList.add("active");
  currentCategory = e.target.dataset.cat;
  currentIndex = -1;
  displayQuote();
});

$autoBtn.addEventListener("click", () => {
  isAuto = !isAuto;
  if (isAuto) {
    $autoBtn.textContent = "⏸";
    $autoBadge.classList.add("active");
    autoTimer = setInterval(displayQuote, 8000);
    showToast("⏱ 自动轮播已开启（每8秒）");
  } else {
    $autoBtn.textContent = "▶";
    $autoBadge.classList.remove("active");
    clearInterval(autoTimer);
    showToast("⏱ 自动轮播已关闭");
  }
});

$themeBtn.addEventListener("click", () => {
  document.documentElement.classList.toggle("dark");
  const isDark = document.documentElement.classList.contains("dark");
  $themeBtn.textContent = isDark ? "☀️" : "🌙";
  localStorage.setItem("quote-dark", isDark ? "1" : "0");
});

if (localStorage.getItem("quote-dark") === "1") {
  document.documentElement.classList.add("dark");
  $themeBtn.textContent = "☀️";
}

displayQuote();
</script>
<script src="../i18n.js"></script>
</body>
</html>
