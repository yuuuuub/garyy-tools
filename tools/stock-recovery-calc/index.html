<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票回本补仓计算器</title>
<meta name="description" content="股票回本补仓计算器，计算需要涨多少才能回本">
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --card-hover: #1f2332;
    --border: #2a2d3a;
    --text: #e1e4ed;
    --text-secondary: #8b8fa3;
    --accent: #4f8cff;
    --accent-glow: rgba(79, 140, 255, 0.15);
    --up: #e8394a;
    --up-bg: rgba(232, 57, 74, 0.12);
    --down: #2ecc71;
    --down-bg: rgba(46, 204, 113, 0.12);
    --input-bg: #13151d;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 720px; margin: 0 auto; padding: 20px 16px 40px; }
  header {
    text-align: center;
    padding: 32px 0 8px;
  }
  header h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, #4f8cff, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 1px;
  }
  header p {
    color: var(--text-secondary);
    margin-top: 6px;
    font-size: 14px;
  }

  /* Card */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .card-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
  }
  .card-title .icon { font-size: 20px; }

  /* Form */
  .input-row {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .input-group {
    flex: 1;
    min-width: 140px;
  }
  .input-group label {
    display: block;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 5px;
    font-weight: 500;
  }
  .input-group input {
    width: 100%;
    padding: 10px 12px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-group input:focus {
    border-color: var(--accent);
  }
  .input-group input::placeholder { color: #4a4d5a; }

  /* Result Display */
  .result-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-top: 16px;
  }
  .result-item {
    background: var(--input-bg);
    border-radius: var(--radius-sm);
    padding: 14px;
    text-align: center;
    border: 1px solid var(--border);
  }
  .result-item .label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }
  .result-item .value {
    font-size: 20px;
    font-weight: 700;
  }
  .result-item .sub {
    font-size: 12px;
    margin-top: 2px;
  }

  /* P&L colors: Chinese red-up green-down */
  .pnl-up { color: var(--up) !important; }
  .pnl-down { color: var(--down) !important; }
  .pnl-bg-up { background: var(--up-bg) !important; border-color: rgba(232, 57, 74, 0.25) !important; }
  .pnl-bg-down { background: var(--down-bg) !important; border-color: rgba(46, 204, 113, 0.25) !important; }

  /* Progress bar */
  .bar-section { margin-top: 16px; }
  .bar-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .bar-track {
    height: 12px;
    background: var(--input-bg);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    border-radius: 6px;
    transition: width 0.4s ease, background 0.4s ease;
    position: relative;
    min-width: 2px;
  }
  .bar-marker {
    position: absolute;
    top: -3px;
    width: 4px;
    height: 18px;
    border-radius: 2px;
    z-index: 2;
  }
  .bar-marker-cost {
    background: #fbbf24;
    left: 50%;
    transform: translateX(-50%);
  }
  .bar-marker-current {
    background: var(--text);
    transform: translateX(-50%);
  }
  .bar-legend {
    display: flex;
    gap: 16px;
    margin-top: 6px;
    font-size: 11px;
    color: var(--text-secondary);
  }
  .bar-legend span { display: flex; align-items: center; gap: 4px; }
  .bar-legend .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot-cost { background: #fbbf24; }
  .dot-current { background: var(--text); }

  /* Ring chart */
  .ring-section {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .ring-container {
    position: relative;
    width: 120px;
    height: 120px;
  }
  .ring-container svg {
    transform: rotate(-90deg);
    width: 120px;
    height: 120px;
  }
  .ring-bg {
    fill: none;
    stroke: var(--input-bg);
    stroke-width: 10;
  }
  .ring-fill {
    fill: none;
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.6s ease, stroke 0.4s ease;
  }
  .ring-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .ring-center .val {
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
  }
  .ring-center .lbl {
    font-size: 11px;
    color: var(--text-secondary);
  }
  .ring-info {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .ring-info-item {
    font-size: 14px;
  }
  .ring-info-item .number {
    font-size: 20px;
    font-weight: 700;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 16px;
    background: var(--input-bg);
    border-radius: var(--radius-sm);
    padding: 3px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: all 0.2s;
    border: none;
    background: transparent;
    font-family: inherit;
  }
  .tab.active {
    background: var(--accent);
    color: #fff;
  }

  /* Quick examples */
  .quick-examples {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .quick-btn {
    padding: 6px 14px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .quick-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Disclaimer */
  .disclaimer {
    background: rgba(251, 191, 36, 0.08);
    border: 1px solid rgba(251, 191, 36, 0.2);
    border-radius: var(--radius);
    padding: 16px;
    margin-top: 24px;
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.8;
  }
  .disclaimer strong { color: #fbbf24; }

  /* Section divider */
  .section-divider {
    height: 1px;
    background: var(--border);
    margin: 4px 0 20px;
  }

  .dca-results {
    margin-top: 16px;
    padding: 16px;
    background: var(--input-bg);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }
  .dca-step {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid rgba(42, 45, 58, 0.5);
    font-size: 13px;
  }
  .dca-step:last-child { border-bottom: none; }
  .dca-step .step-label { color: var(--text-secondary); }

  @media (max-width: 480px) {
    .container { padding: 12px 10px 32px; }
    .card { padding: 16px; }
    .result-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .result-item { padding: 10px; }
    .result-item .value { font-size: 17px; }
    .input-row { gap: 8px; }
    .input-group { min-width: 100px; }
    header h1 { font-size: 24px; }
  }
</style>

  <meta name="robots" content="index, follow">
  <meta property="og:title" content="股票回本补仓计算器">
  <meta property="og:description" content="股票回本补仓计算器，计算需要涨多少才能回本">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/stock-recovery-calc/">

<body>
<div class="container">

  <!-- Header -->
  <header>
    <h1>股票回本补仓计算器</h1>
    <p>计算套牢后回本目标价、补仓摊薄成本及定投模拟</p>
  </header>

  <!-- 持仓信息 -->
  <div class="card">
    <div class="card-title">
      <span class="icon">📊</span> 持仓信息
    </div>
    <div class="input-row">
      <div class="input-group">
        <label>持仓成本价 (元)</label>
        <input type="number" id="costPrice" step="0.01" placeholder="例: 50.00" oninput="calcAll()">
      </div>
      <div class="input-group">
        <label>持仓数量 (股)</label>
        <input type="number" id="shares" step="1" placeholder="例: 1000" oninput="calcAll()">
      </div>
      <div class="input-group">
        <label>当前市价 (元)</label>
        <input type="number" id="currentPrice" step="0.01" placeholder="例: 35.00" oninput="calcAll()">
      </div>
    </div>

    <!-- 日盈亏状态 -->
    <div class="result-grid" id="positionSummary"></div>

    <!-- 可视化对比条 -->
    <div class="bar-section" id="barSection" style="display:none;">
      <div class="bar-labels">
        <span>成本价 <b id="barCostLabel">--</b></span>
        <span>当前价 <b id="barCurrentLabel">--</b></span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="barFill"></div>
      </div>
      <div class="bar-legend">
        <span><span class="dot dot-cost"></span>成本价</span>
        <span><span class="dot dot-current"></span>当前价</span>
      </div>
    </div>

    <!-- 环形盈亏图 -->
    <div class="ring-section" id="ringSection" style="display:none;">
      <div class="ring-container">
        <svg viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52"/>
          <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="52"
                  stroke-dasharray="326.73" stroke-dashoffset="326.73"/>
        </svg>
        <div class="ring-center">
          <div class="val" id="ringPercent">--</div>
          <div class="lbl" id="ringLabel">盈亏</div>
        </div>
      </div>
      <div class="ring-info">
        <div class="ring-info-item">
          <span style="color:var(--text-secondary);">回本目标价</span><br>
          <span class="number" id="recoveryTarget" style="color:#fbbf24;">--</span>
        </div>
        <div class="ring-info-item">
          <span style="color:var(--text-secondary);">需涨幅</span><br>
          <span class="number" id="recoveryPct" style="color:#a78bfa;">--</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 补仓计算 -->
  <div class="card">
    <div class="card-title">
      <span class="icon">💰</span> 补仓计算
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchAvgTab('qty')" id="tabQty">按补仓数量</button>
      <button class="tab" onclick="switchAvgTab('amt')" id="tabAmt">按补仓金额</button>
    </div>
    <div class="input-row">
      <div class="input-group">
        <label>补仓价格 (元)</label>
        <input type="number" id="avgPrice" step="0.01" placeholder="例: 30.00" oninput="calcAll()">
      </div>
      <div class="input-group" id="avgQtyGroup">
        <label>补仓数量 (股)</label>
        <input type="number" id="avgQty" step="1" placeholder="例: 500" oninput="calcAll()">
      </div>
      <div class="input-group" id="avgAmtGroup" style="display:none;">
        <label>补仓金额 (元)</label>
        <input type="number" id="avgAmt" step="0.01" placeholder="例: 15000" oninput="calcAll()">
      </div>
    </div>

    <!-- 补仓后结果 -->
    <div class="result-grid" id="avgResults"></div>
  </div>

  <!-- 定投模拟 -->
  <div class="card">
    <div class="card-title">
      <span class="icon">📈</span> 定投模拟
    </div>
    <p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;">
      每次跌 N% 补仓，补仓 M 次，每次补 X 金额，模拟摊薄效果
    </p>
    <div class="input-row">
      <div class="input-group">
        <label>每跌 (%)</label>
        <input type="number" id="dcaDropPct" step="0.1" placeholder="例: 10" oninput="calcDCA()" value="10">
      </div>
      <div class="input-group">
        <label>补仓次数</label>
        <input type="number" id="dcaTimes" step="1" placeholder="例: 5" oninput="calcDCA()" value="5">
      </div>
      <div class="input-group">
        <label>每次金额 (元)</label>
        <input type="number" id="dcaAmt" step="0.01" placeholder="例: 10000" oninput="calcDCA()" value="10000">
      </div>
    </div>
    <div class="dca-results" id="dcaResults"></div>
    <p style="font-size:12px;color:var(--text-secondary);margin-top:12px;">
      提示：定投模拟假设每次跌到目标价位时按当时价格买入指定金额。
    </p>
  </div>

  <!-- 快速案例 -->
  <div class="card">
    <div class="card-title">
      <span class="icon">⚡</span> 快速案例
    </div>
    <p style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">点击预设常见套牢场景：</p>
    <div class="quick-examples">
      <button class="quick-btn" onclick="loadExample(1)">高位套牢 (茅台)</button>
      <button class="quick-btn" onclick="loadExample(2)">中位回调 (新能源)</button>
      <button class="quick-btn" onclick="loadExample(3)">深度套牢</button>
      <button class="quick-btn" onclick="loadExample(4)">小幅亏损</button>
      <button class="quick-btn" onclick="loadExample(5)">多次补仓</button>
    </div>
  </div>

  <!-- 免责声明 -->
  <div class="disclaimer">
    <strong>⚠ 免责声明：</strong>
    本计算器仅供学习参考，不构成任何投资建议。股市有风险，投资需谨慎。
    所有计算结果基于输入的假设数据，不保证准确性。实际操作中请结合自身风险承受能力和市场情况做出决策。
  </div>

</div>

<script>
// --- State ---
let avgTab = 'qty'; // 'qty' or 'amt'
const RING_CIRCUMFERENCE = 2 * Math.PI * 52; // ~326.73

// --- Quick Examples ---
const examples = {
  1: { costPrice: 2500, shares: 100, currentPrice: 1500, avgPrice: 1400, avgQty: 50 },
  2: { costPrice: 80, shares: 2000, currentPrice: 55, avgPrice: 48, avgQty: 1000 },
  3: { costPrice: 120, shares: 500, currentPrice: 40, avgPrice: 35, avgQty: 500 },
  4: { costPrice: 25, shares: 3000, currentPrice: 22.5, avgPrice: 21, avgQty: 1000 },
  5: { costPrice: 45, shares: 800, currentPrice: 28, avgPrice: 25, avgQty: 400 },
};

function loadExample(n) {
  const e = examples[n];
  document.getElementById('costPrice').value = e.costPrice;
  document.getElementById('shares').value = e.shares;
  document.getElementById('currentPrice').value = e.currentPrice;
  document.getElementById('avgPrice').value = e.avgPrice;
  if (avgTab === 'qty') {
    document.getElementById('avgQty').value = e.avgQty;
    document.getElementById('avgAmt').value = '';
  } else {
    document.getElementById('avgAmt').value = '';
    document.getElementById('avgQty').value = e.avgQty;
  }
  // Auto-fill DCA fields based on position
  const costPrice = parseFloat(e.costPrice);
  const currentPrice = parseFloat(e.currentPrice);
  if (costPrice && currentPrice) {
    const dropPct = ((costPrice - currentPrice) / costPrice * 100).toFixed(1);
    document.getElementById('dcaDropPct').value = dropPct > 0 ? dropPct : 10;
  }
  document.getElementById('dcaAmt').value = Math.round(e.costPrice * e.shares * 0.2);
  document.getElementById('dcaTimes').value = 3;
  calcAll();
}

// --- Tab Switch ---
function switchAvgTab(tab) {
  avgTab = tab;
  document.getElementById('tabQty').classList.toggle('active', tab === 'qty');
  document.getElementById('tabAmt').classList.toggle('active', tab === 'amt');
  document.getElementById('avgQtyGroup').style.display = tab === 'qty' ? '' : 'none';
  document.getElementById('avgAmtGroup').style.display = tab === 'amt' ? '' : 'none';
  calcAll();
}

// --- Utility ---
function fmt(num, dec) {
  if (num === null || num === undefined || isNaN(num)) return '--';
  return Number(num).toFixed(dec || 2);
}

function fmtSign(num, dec) {
  if (num === null || num === undefined || isNaN(num)) return '--';
  const v = Number(num);
  return (v >= 0 ? '+' : '') + v.toFixed(dec || 2);
}

function parseVal(id) {
  const v = parseFloat(document.getElementById(id).value);
  return isNaN(v) || v <= 0 ? null : v;
}

function pnlClass(val) {
  // Chinese convention: up=red(positive), down=green(negative)
  if (val === null || val === undefined || isNaN(val)) return '';
  return val > 0 ? 'pnl-up' : (val < 0 ? 'pnl-down' : '');
}

// --- Main Calculation ---
function calcAll() {
  const costPrice = parseVal('costPrice');
  const shares = parseVal('shares');
  const currentPrice = parseVal('currentPrice');
  const avgPrice = parseVal('avgPrice');
  let avgQty = null;
  if (avgTab === 'qty') {
    avgQty = parseVal('avgQty');
  } else {
    const avgAmt = parseVal('avgAmt');
    if (avgAmt && avgPrice) {
      avgQty = Math.floor(avgAmt / avgPrice);
    }
  }

  calcPosition(costPrice, shares, currentPrice);
  calcAverage(costPrice, shares, currentPrice, avgPrice, avgQty);
  calcDCA();

  // Sync avgQty input for amount mode
  if (avgTab === 'amt') {
    const amt = parseVal('avgAmt');
    const ap = parseVal('avgPrice');
    if (amt && ap) {
      document.getElementById('avgQty').value = Math.floor(amt / ap);
    }
  }
}

function calcPosition(costPrice, shares, currentPrice) {
  const summaryEl = document.getElementById('positionSummary');
  const barSection = document.getElementById('barSection');
  const ringSection = document.getElementById('ringSection');

  if (!costPrice || !shares || !currentPrice) {
    summaryEl.innerHTML = '';
    barSection.style.display = 'none';
    ringSection.style.display = 'none';
    return;
  }

  const marketValue = currentPrice * shares;
  const costValue = costPrice * shares;
  const pnlAmt = marketValue - costValue;
  const pnlPct = ((currentPrice - costPrice) / costPrice) * 100;
  const clsAmt = pnlClass(pnlAmt);
  const clsPct = pnlClass(pnlPct);

  summaryEl.innerHTML = `
    <div class="result-item">
      <div class="label">持仓市值</div>
      <div class="value">¥${fmt(marketValue, 0)}</div>
    </div>
    <div class="result-item ${pnlAmt > 0 ? 'pnl-bg-up' : (pnlAmt < 0 ? 'pnl-bg-down' : '')}">
      <div class="label">浮动盈亏 (金额)</div>
      <div class="value ${clsAmt}">${fmtSign(pnlAmt, 0)}</div>
    </div>
    <div class="result-item ${pnlPct > 0 ? 'pnl-bg-up' : (pnlPct < 0 ? 'pnl-bg-down' : '')}">
      <div class="label">浮动盈亏 (百分比)</div>
      <div class="value ${clsPct}">${fmtSign(pnlPct, 2)}%</div>
    </div>
  `;

  // Recovery target
  const recoveryTarget = costPrice;
  const recoveryPct = ((costPrice - currentPrice) / currentPrice) * 100;

  document.getElementById('recoveryTarget').textContent = '¥' + fmt(recoveryTarget);

  if (recoveryPct > 0) {
    document.getElementById('recoveryPct').textContent = '+' + fmt(recoveryPct, 2) + '%';
    document.getElementById('recoveryPct').style.color = 'var(--up)';
  } else if (recoveryPct < 0) {
    document.getElementById('recoveryPct').textContent = fmt(recoveryPct, 2) + '%';
    document.getElementById('recoveryPct').style.color = 'var(--down)';
  } else {
    document.getElementById('recoveryPct').textContent = '0.00%';
    document.getElementById('recoveryPct').style.color = 'var(--text)';
  }

  // Bar visualization
  barSection.style.display = '';
  const maxPrice = Math.max(costPrice, currentPrice) * 1.1;
  const costPos = (costPrice / maxPrice) * 100;
  const curPos = (currentPrice / maxPrice) * 100;

  document.getElementById('barCostLabel').textContent = '¥' + fmt(costPrice);
  document.getElementById('barCurrentLabel').textContent = '¥' + fmt(currentPrice);

  const barFill = document.getElementById('barFill');

  if (currentPrice >= costPrice) {
    // Current price >= cost price: show fill from 0 to cost price dim, then highlight to current
    barFill.style.width = curPos + '%';
    barFill.style.background = 'linear-gradient(90deg, #2ecc71, #2ecc71 ' + (costPos / curPos * 100) + '%, #27ae60 ' + (costPos / curPos * 100) + '%, #27ae60)';
  } else {
    // Current price < cost price
    barFill.style.width = costPos + '%';
    barFill.style.background = 'linear-gradient(90deg, var(--down) 0%, var(--down) ' + (curPos / costPos * 100) + '%, rgba(46,204,113,0.3) ' + (curPos / costPos * 100) + '%, rgba(46,204,113,0.3))';
  }

  // Ring chart
  ringSection.style.display = '';
  const ringFill = document.getElementById('ringFill');
  const ringPercentEl = document.getElementById('ringPercent');
  const ringLabelEl = document.getElementById('ringLabel');

  ringPercentEl.textContent = fmtSign(pnlPct, 1) + '%';
  ringPercentEl.className = 'val ' + clsPct;
  ringLabelEl.textContent = pnlPct >= 0 ? '盈利' : '亏损';

  // Ring offset: fully filled = offset 0; fully empty = offset ~327
  let fillRatio;
  if (pnlPct >= 0) {
    // Profit: fill ratio based on profit %
    fillRatio = Math.min(Math.abs(pnlPct) / 50, 1); // max at 50% profit
  } else {
    // Loss: show how much of the way to zero
    fillRatio = Math.min(Math.abs(pnlPct) / 100, 1);
  }
  const offset = RING_CIRCUMFERENCE * (1 - fillRatio);
  ringFill.setAttribute('stroke-dashoffset', offset);

  if (pnlAmt > 0) {
    ringFill.setAttribute('stroke', '#e8394a');
  } else if (pnlAmt < 0) {
    ringFill.setAttribute('stroke', '#2ecc71');
  } else {
    ringFill.setAttribute('stroke', '#4f8cff');
  }
}

function calcAverage(costPrice, shares, currentPrice, avgPrice, avgQty) {
  const avgResultsEl = document.getElementById('avgResults');

  if (!costPrice || !shares || !currentPrice || !avgPrice || !avgQty) {
    avgResultsEl.innerHTML = '';
    return;
  }

  const totalCost = costPrice * shares + avgPrice * avgQty;
  const totalShares = shares + avgQty;
  const newAvgCost = totalCost / totalShares;
  const newMarketValue = currentPrice * totalShares;
  const newPnlAmt = newMarketValue - totalCost;
  const newPnlPct = ((currentPrice - newAvgCost) / newAvgCost) * 100;
  const newRecoveryTarget = newAvgCost;
  const newRecoveryPct = newAvgCost > currentPrice ? ((newAvgCost - currentPrice) / currentPrice) * 100 : 0;

  const clsAmt = pnlClass(newPnlAmt);
  const clsPct = pnlClass(newPnlPct);

  avgResultsEl.innerHTML = `
    <div class="result-item">
      <div class="label">补仓后成本价</div>
      <div class="value" style="color:#fbbf24;">¥${fmt(newAvgCost)}</div>
      <div class="sub" style="color:var(--text-secondary);">原成本 ¥${fmt(costPrice)}</div>
    </div>
    <div class="result-item">
      <div class="label">补仓后持仓数量</div>
      <div class="value">${totalShares} 股</div>
      <div class="sub" style="color:var(--text-secondary);">原持仓 ${shares} 股</div>
    </div>
    <div class="result-item ${newPnlAmt > 0 ? 'pnl-bg-up' : (newPnlAmt < 0 ? 'pnl-bg-down' : '')}">
      <div class="label">补仓后浮动盈亏</div>
      <div class="value ${clsAmt}">${fmtSign(newPnlAmt, 0)}</div>
      <div class="sub ${clsPct}">${fmtSign(newPnlPct, 2)}%</div>
    </div>
    <div class="result-item">
      <div class="label">补仓后回本目标价</div>
      <div class="value" style="color:#fbbf24;">¥${fmt(newRecoveryTarget)}</div>
      <div class="sub" style="color:var(--text-secondary);">需涨 ${newAvgCost > currentPrice ? '+' + fmt(newRecoveryPct, 2) + '%' : '已回本'}</div>
    </div>
    <div class="result-item">
      <div class="label">补仓总投入</div>
      <div class="value">¥${fmt(avgPrice * avgQty, 0)}</div>
    </div>
    <div class="result-item">
      <div class="label">总持仓市值</div>
      <div class="value">¥${fmt(totalCost, 0)}</div>
    </div>
  `;
}

function calcDCA() {
  const costPrice = parseVal('costPrice');
  const shares = parseVal('shares');
  const currentPrice = parseVal('currentPrice');
  const dropPct = parseVal('dcaDropPct');
  const dcaTimes = parseVal('dcaTimes');
  const dcaAmt = parseVal('dcaAmt');
  const resultsEl = document.getElementById('dcaResults');

  if (!costPrice || !shares || !dropPct || !dcaTimes || !dcaAmt) {
    resultsEl.innerHTML = '<p style="color:var(--text-secondary);text-align:center;padding:20px 0;">请先填写持仓信息，再输入定投参数</p>';
    return;
  }

  if (!currentPrice) {
    resultsEl.innerHTML = '<p style="color:var(--text-secondary);text-align:center;padding:20px 0;">请填写当前市价</p>';
    return;
  }

  let totalShares = shares;
  let totalCost = costPrice * shares;
  let prevPrice = currentPrice;
  const dropFactor = 1 - dropPct / 100;

  let html = '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">模拟过程（假设每次跌到位后立即补仓）：</div>';
  html += '<div class="dca-step"><span class="step-label">初始持仓</span><span>' + shares + ' 股 × ¥' + fmt(costPrice) + ' = ¥' + fmt(costPrice * shares, 0) + '</span></div>';

  for (let i = 1; i <= dcaTimes; i++) {
    const buyPrice = prevPrice * dropFactor;
    const buyQty = Math.floor(dcaAmt / buyPrice);
    if (buyQty <= 0) break;

    totalCost += buyQty * buyPrice;
    totalShares += buyQty;
    const avgCost = totalCost / totalShares;

    html += '<div class="dca-step">';
    html += '<span class="step-label">第' + i + '次补仓 @¥' + fmt(buyPrice) + '</span>';
    html += '<span>' + buyQty + ' 股 × ¥' + fmt(buyPrice) + ' = ¥' + fmt(buyQty * buyPrice, 0) + '</span>';
    html += '</div>';

    prevPrice = buyPrice;
  }

  const finalAvgCost = totalCost / totalShares;
  const finalPnl = (currentPrice - finalAvgCost) / finalAvgCost * 100;
  const finalRecoveryPct = finalAvgCost > currentPrice ? ((finalAvgCost - currentPrice) / currentPrice) * 100 : 0;

  html += '</div>';

  // Summary
  html += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">';
  html += '<div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;">';
  html += '<span>定投后持仓总数：</span><b>' + totalShares + ' 股</b>';
  html += '</div>';
  html += '<div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;">';
  html += '<span>定投后总投入：</span><b>¥' + fmt(totalCost, 0) + '</b>';
  html += '</div>';
  html += '<div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;">';
  html += '<span>最终持仓成本：</span><b style="color:#fbbf24;">¥' + fmt(finalAvgCost) + '</b>';
  html += '</div>';
  html += '<div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;">';
  html += '<span>定投后盈亏：</span><b class="' + pnlClass(finalPnl) + '">' + fmtSign(finalPnl, 2) + '%</b>';
  html += '</div>';
  html += '<div style="display:flex;justify-content:space-between;font-size:14px;">';
  html += '<span>定投后回本目标价：</span><b style="color:#fbbf24;">¥' + fmt(finalAvgCost) + (finalRecoveryPct > 0 ? ' (需涨+' + fmt(finalRecoveryPct, 2) + '%)' : ' (已回本)') + '</b>';
  html += '</div>';
  html += '</div>';

  resultsEl.innerHTML = html;
}

calcAll();
