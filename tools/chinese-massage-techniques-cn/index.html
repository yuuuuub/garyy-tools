    <div style="margin-bottom:8px"><strong>频率：</strong><span class="tag b">${c.frequency}</span></div>
    <div style="margin-bottom:12px"><strong>按摩步骤：</strong>${c.protocol.map((p, j) => `<div class="step"><span class="step-num">${j+1}.</span>${p}</div>`).join('')}</div>
    <div><strong>注意事项：</strong><span style="color:var(--danger)">${c.precautions}</span></div>`;
}

function saveLog() {
  const area = document.getElementById('log-area').value;
  const technique = document.getElementById('log-technique').value;
  const duration = parseInt(document.getElementById('log-duration').value);
  const feeling = document.getElementById('log-feeling').value;
  const note = document.getElementById('log-note').value;
  const data = loadData();
  data.records.push({
    date: new Date().toISOString().split('T')[0],
    area, technique, duration, feeling, note, timestamp: Date.now()
  });
  saveData(data);
  alert('✅ 已记录');
  renderLogs();
}

function renderLogs() {
  const data = loadData();
  const recent = data.records.slice(-7).reverse();
  document.getElementById('recent-logs').innerHTML = recent.length ? recent.map(r => `
    <div class="log-item">
      <div><strong>${r.area} · ${r.technique}</strong><br><span class="log-date">${r.date} · ${r.duration}分钟 · ${r.feeling}</span></div>
      <span class="tag s">✓</span>
    </div>
  `).join('') : '<div class="empty">暂无记录</div>';
}

// Tabs
document.querySelectorAll('#tabs .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('#tabs .tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.detail').forEach(d => d.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'record') renderLogs();
  });
});

renderTechniqueList();
renderAreaList();
renderConditionList();
</script>
</body>
</html>
