<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海滩查找 - Beach Finder</title>
    <meta name="description" content="海滩查找工具，发现附近的美丽海滩和度假胜地">
    <style>
:root {--bg: #0d1117;
--card: #161b22;
--border: #30363d;
--text: #e6edf3;
--accent: #3b82f6;
--accent-hover: #2563eb;
--success: #3fb950;
--warning: #d29922;
--danger: #f85149;
--secondary: #8b949e}
* {margin: 0;
padding: 0;
box-sizing: border-box}
body {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
background: var(--bg);
color: var(--text);
line-height: 1.6;
min-height: 100vh}
.container {max-width: 1200px;
margin: 0 auto;
padding: 20px}
header {text-align: center;
padding: 40px 0;
border-bottom: 1px solid var(--border);
margin-bottom: 30px}
h1 {font-size: 2.5rem;
margin-bottom: 10px;
background: linear-gradient(135deg, var(--accent), var(--success));
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text}
.subtitle {color: var(--secondary);
font-size: 1.1rem}
.search-section {background: var(--card);
border: 1px solid var(--border);
border-radius: 12px;
padding: 24px;
margin-bottom: 30px}
.search-row {display: grid;
grid-template-columns: 1fr 200px 150px;
gap: 16px;
margin-bottom: 16px}
@media (max-width: 768px) {.search-row {grid-template-columns: 1fr}}
.search-input {width: 100%;
padding: 12px 16px;
background: var(--bg);
border: 1px solid var(--border);
border-radius: 8px;
color: var(--text);
font-size: 1rem;
transition: border-color 0.2s}
.search-input:focus {outline: none;
border-color: var(--accent)}
.filter-section {display: flex;
flex-wrap: wrap;
gap: 12px;
align-items: center}
.filter-label {color: var(--secondary);
font-size: 0.9rem}
.filter-btn {padding: 8px 16px;
background: var(--bg);
border: 1px solid var(--border);
border-radius: 20px;
color: var(--text);
cursor: pointer;
transition: all 0.2s;
font-size: 0.9rem}
.filter-btn:hover {border-color: var(--accent);
color: var(--accent)}
.filter-btn.active {background: var(--accent);
border-color: var(--accent);
color: white}
.results-header {display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 20px;
padding: 0 4px}
.results-count {color: var(--secondary)}
.sort-select {padding: 8px 12px;
background: var(--card);
border: 1px solid var(--border);
border-radius: 8px;
color: var(--text);
cursor: pointer}
.results-grid {display: grid;
grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
gap: 20px}
@media (max-width: 768px) {.results-grid {grid-template-columns: 1fr}}
.beach-card {background: var(--card);
border: 1px solid var(--border);
border-radius: 12px;
padding: 24px;
transition: transform 0.2s, box-shadow 0.2s}
.beach-card:hover {transform: translateY(-4px);
box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3)}
.beach-header {display: flex;
justify-content: space-between;
align-items: flex-start;
margin-bottom: 16px}
.beach-name {font-size: 1.3rem;
font-weight: 600;
color: var(--text)}
.beach-type {padding: 4px 10px;
background: rgba(59, 130, 246, 0.15);
color: var(--accent);
border-radius: 12px;
font-size: 0.8rem;
font-weight: 500}
.beach-location {color: var(--secondary);
font-size: 0.9rem;
margin-bottom: 12px;
display: flex;
align-items: center;
gap: 6px}
.beach-rating {display: flex;
align-items: center;
gap: 6px;
margin-bottom: 12px}
.stars {color: var(--warning);
letter-spacing: 2px}
.rating-value {font-weight: 600}
.rating-count {color: var(--secondary);
font-size: 0.85rem}
.beach-description {color: var(--secondary);
margin-bottom: 16px;
line-height: 1.5}
.beach-stats {display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 12px;
margin-bottom: 16px}
.stat-item {text-align: center;
padding: 12px;
background: var(--bg);
border-radius: 8px}
.stat-value {font-size: 1.1rem;
font-weight: 600;
color: var(--accent)}
.stat-label {font-size: 0.8rem;
color: var(--secondary);
margin-top: 4px}
.beach-features {display: flex;
flex-wrap: wrap;
gap: 8px;
margin-bottom: 16px}
.feature-tag {padding: 4px 10px;
background: var(--bg);
border: 1px solid var(--border);
border-radius: 6px;
font-size: 0.8rem;
color: var(--secondary)}
.beach-info {display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 12px;
padding-top: 16px;
border-top: 1px solid var(--border)}
.info-item {font-size: 0.9rem}
.info-label {color: var(--secondary);
font-size: 0.8rem;
margin-bottom: 4px}
.info-value {font-weight: 500}
.book-btn {width: 100%;
padding: 12px;
background: var(--accent);
border: none;
border-radius: 8px;
color: white;
font-weight: 600;
cursor: pointer;
transition: background 0.2s;
margin-top: 16px}
.book-btn:hover {background: var(--accent-hover)}
.no-results {text-align: center;
padding: 60px 20px;
color: var(--secondary)}
.no-results-icon {font-size: 3rem;
margin-bottom: 16px}
footer {text-align: center;
padding: 40px 0;
margin-top: 40px;
border-top: 1px solid var(--border);
color: var(--secondary);
font-size: 0.9rem}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="海滩查找 - Beach Finder">

  <meta property="og:type" content="website">

</head>
<body>
    <div class="container">
        <header>
            <h1>海滩查找</h1>
            <p class="subtitle">发现美丽海滩，享受阳光沙滩</p>
        </header>

        <div class="search-section">
            <div class="search-row">
                <input type="text" class="search-input" id="searchInput" placeholder="搜索海滩名称或位置...">
                <select class="sort-select" id="sortSelect">
                    <option value="rating">按评分排序</option>
                    <option value="crowd-low">拥挤度从低到高</option>
                    <option value="crowd-high">拥挤度从高到低</option>
                    <option value="name">按名称排序</option>
                </select>
            </div>
            <div class="filter-section">
                <span class="filter-label">沙质：</span>
                <button class="filter-btn active" data-sand="all">全部</button>
                <button class="filter-btn" data-sand="white">白沙滩</button>
                <button class="filter-btn" data-sand="golden">金沙滩</button>
                <button class="filter-btn" data-sand="black">黑沙滩</button>
                <button class="filter-btn" data-sand="coral">珊瑚沙滩</button>
            </div>
        </div>

        <div class="results-header">
            <span class="results-count" id="resultsCount">找到 10 个海滩</span>
        </div>

        <div class="results-grid" id="resultsGrid">

        </div>

        <div class="no-results" id="noResults" style="display: none;">
            <div class="no-results-icon">🏖️</div>
            <h2>未找到匹配的海滩</h2>
            <p>请尝试调整搜索条件或筛选项</p>
        </div>

        <footer>
            <p>© 2026 海滩查找 - 发现您的理想海滩</p>
        </footer>
    </div>

    <script>
        const beaches = [
            {
                name: "亚龙湾海滩",
                sand: "white",
                sandLabel: "白沙滩",
                location: "海南省三亚市",
                rating: 4.9,
                reviews: 3450,
                description: "中国最美的海湾之一，海水清澈，沙滩细腻，适合度假和水上活动。",
                waterQuality: "优",
                crowdLevel: 3,
                facilities: "淋浴, 遮阳伞, 救生员, 餐厅",
                bestSeason: "10月-次年4月",
                features: ["白沙滩", "水上运动", "高端酒店", "潜水"]
            },
            {
                name: "北海银滩",
                sand: "white",
                sandLabel: "白沙滩",
                location: "广西壮族自治区北海市",
                rating: 4.7,
                reviews: 2890,
                description: "滩长平、沙细白、水温净、浪柔软，被称为"天下第一滩"。",
                waterQuality: "良",
                crowdLevel: 2,
                facilities: "淋浴, 遮阳伞, 更衣室, 小吃摊",
                bestSeason: "4月-11月",
                features: ["银白沙滩", "免费开放", "日落美景", "海鲜"]
            },
            {
                name: "青岛金沙滩",
                sand: "golden",
                sandLabel: "金沙滩",
                location: "山东省青岛市",
                rating: 4.6,
                reviews: 2340,
                description: "亚洲最大的沙滩，沙质细腻，适合家庭游玩和沙滩运动。",
                waterQuality: "良",
                crowdLevel: 4,
                facilities: "淋浴, 遮阳伞, 停车场, 餐厅",
                bestSeason: "5月-10月",
                features: ["金沙滩", "啤酒节", "沙滩排球", "海鲜"]
            },
            {
                name: "厦门鼓浪屿海滩",
                sand: "coral",
                sandLabel: "珊瑚沙滩",
                location: "福建省厦门市",
                rating: 4.5,
                reviews: 1980,
                description: "鼓浪屿周边的多个小海滩，环境优美，适合散步和拍照。",
                waterQuality: "优",
                crowdLevel: 3,
                facilities: "遮阳伞, 小吃摊, 纪念品店",
                bestSeason: "3月-5月, 9月-11月",
                features: ["珊瑚沙滩", "文艺气息", "历史建筑", "美食"]
            },
            {
                name: "大连金石滩",
                sand: "golden",
                sandLabel: "金沙滩",
                location: "辽宁省大连市",
                rating: 4.4,
                reviews: 1560,
                description: "国家地质公园，奇特的海蚀地貌，适合观光和地质科普。",
                waterQuality: "良",
                crowdLevel: 2,
                facilities: "淋浴, 遮阳伞, 地质博物馆, 餐厅",
                bestSeason: "6月-9月",
                features: ["地质奇观", "黄金海岸", "主题公园", "温泉"]
            },
            {
                name: "深圳大梅沙海滨公园",
                sand: "golden",
                sandLabel: "金沙滩",
                location: "广东省深圳市",
                rating: 4.3,
                reviews: 1870,
                description: "深圳市区最近的海滩，交通便利，适合周末休闲。",
                waterQuality: "良",
                crowdLevel: 4,
                facilities: "淋浴, 遮阳伞, 救生员, 更衣室",
                bestSeason: "4月-10月",
                features: ["免费开放", "交通便利", "水上运动", "烧烤区"]
            },
            {
                name: "海南万宁日月湾",
                sand: "coral",
                sandLabel: "珊瑚沙滩",
                location: "海南省万宁市",
                rating: 4.6,
                reviews: 1230,
                description: "中国冲浪胜地，海浪条件优越，适合冲浪爱好者。",
                waterQuality: "优",
                crowdLevel: 2,
                facilities: "冲浪学校, 淋浴, 餐厅, 住宿",
                bestSeason: "10月-次年4月",
                features: ["冲浪胜地", "珊瑚沙滩", "冲浪教学", "冲浪装备"]
            },
            {
                name: "烟台金沙滩",
                sand: "golden",
                sandLabel: "金沙滩",
                location: "山东省烟台市",
                rating: 4.2,
                reviews: 980,
                description: "细沙如金，海水清澈，适合家庭游玩和海滨度假。",
                waterQuality: "良",
                crowdLevel: 2,
                facilities: "淋浴, 遮阳伞, 停车场, 餐厅",
                bestSeason: "5月-10月",
                features: ["金沙滩", "海景房", "海鲜市场", "温泉"]
            },
            {
                name: "北海涠洲岛海滩",
                sand: "coral",
                sandLabel: "珊瑚沙滩",
                location: "广西壮族自治区北海市",
                rating: 4.8,
                reviews: 1670,
                description: "火山岛上的原生态海滩，珊瑚礁丰富，适合浮潜和探险。",
                waterQuality: "优",
                crowdLevel: 1,
                facilities: "潜水店, 餐厅, 住宿, 自行车租赁",
                bestSeason: "4月-11月",
                features: ["火山地貌", "珊瑚礁", "原生态", "潜水"]
            },
            {
                name: "厦门环岛路海滩",
                sand: "white",
                sandLabel: "白沙滩",
                location: "福建省厦门市",
                rating: 4.4,
                reviews: 1450,
                description: "环岛路沿线的多个海滩，环境优美，适合骑行和散步。",
                waterQuality: "良",
                crowdLevel: 3,
                facilities: "自行车道, 淋浴, 遮阳伞, 小吃摊",
                bestSeason: "3月-5月, 9月-11月",
                features: ["环岛骑行", "白沙滩", "海景步道", "日落"]
            }
        ];
        let currentSand = 'all';
        let currentSort = 'rating';
        let searchQuery = '';
        function createStars(rating) {
            const fullStars = Math.floor(rating);
            const hasHalf = rating % 1 >= 0.5;
            let stars = '';
            for (let i = 0; i < fullStars; i++) {
                stars += '★';
            }
            if (hasHalf) {
                stars += '☆';
            }
            return stars;
        }
        function createCrowdIndicator(level) {
            const levels = ['空旷', '较少', '适中', '较多', '拥挤'];
            return levels[level - 1] || '未知';
        }
        function createBeachCard(beach) {
            return `
                <div class="beach-card">
                    <div class="beach-header">
                        <h3 class="beach-name">${beach.name}</h3>
                        <span class="beach-type">${beach.sandLabel}</span>
                    </div>
                    <div class="beach-location">📍 ${beach.location}</div>
                    <div class="beach-rating">
                        <span class="stars">${createStars(beach.rating)}</span>
                        <span class="rating-value">${beach.rating}</span>
                        <span class="rating-count">(${beach.reviews}条评价)</span>
                    </div>
                    <p class="beach-description">${beach.description}</p>
                    <div class="beach-stats">
                        <div class="stat-item">
                            <div class="stat-value">${beach.waterQuality}</div>
                            <div class="stat-label">水质</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${createCrowdIndicator(beach.crowdLevel)}</div>
                            <div class="stat-label">拥挤度</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${beach.bestSeason.split(',')[0]}</div>
                            <div class="stat-label">最佳季节</div>
                        </div>
                    </div>
                    <div class="beach-features">
                        ${beach.features.map(f => `<span class="feature-tag">${f}</span>`).join('')}
                    </div>
                    <div class="beach-info">
                        <div class="info-item">
                            <div class="info-label">设施</div>
                            <div class="info-value">${beach.facilities}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">最佳季节</div>
                            <div class="info-value">${beach.bestSeason}</div>
                        </div>
                    </div>
                    <button class="book-btn">查看详情</button>
                </div>
            `;
        }
        function filterAndSort() {
            let filtered = beaches;
            if (currentSand !== 'all') {
                filtered = filtered.filter(b => b.sand === currentSand);
            }
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                filtered = filtered.filter(b =>
                    b.name.toLowerCase().includes(query) ||
                    b.location.toLowerCase().includes(query)
                );
            }
            switch (currentSort) {
                case 'rating':
                    filtered.sort((a, b) => b.rating - a.rating);
                    break;
                case 'crowd-low':
                    filtered.sort((a, b) => a.crowdLevel - b.crowdLevel);
                    break;
                case 'crowd-high':
                    filtered.sort((a, b) => b.crowdLevel - a.crowdLevel);
                    break;
                case 'name':
                    filtered.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
                    break;
            }
            return filtered;
        }
        function renderResults() {
            const filtered = filterAndSort();
            const grid = document.getElementById('resultsGrid');
            const noResults = document.getElementById('noResults');
            const count = document.getElementById('resultsCount');
            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResults.style.display = 'block';
                count.textContent = '找到 0 个海滩';
            } else {
                noResults.style.display = 'none';
                grid.innerHTML = filtered.map(createBeachCard).join('');
                count.textContent = `找到 ${filtered.length} 个海滩`;
            }
        }
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSand = btn.dataset.sand;
                renderResults();
            });
        });
        document.getElementById('sortSelect').addEventListener('change', (e) => {
            currentSort = e.target.value;
            renderResults();
        });
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderResults();
        });
        renderResults();
    </script>
<script src="../i18n.js" defer></script>
</body>
</html>
