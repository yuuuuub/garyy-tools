<style>

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}
.container{max-width:800px;margin:auto}

.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.input-group{margin-bottom:12px}
.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}

.btn-red{background:var(--red)}
.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:20px;margin-top:16px}
.poem-display{text-align:center;padding:20px 0}
.poem-title{font-size:1.3rem;font-weight:700;margin-bottom:8px}
.poem-author{font-size:.9rem;color:var(--text2);margin-bottom:16px}
.poem-content{font-size:1.1rem;line-height:2;white-space:pre-line}
.tag{display:inline-block;padding:2px 8px;background:var(--blue);color:#fff;border-radius:4px;font-size:.75rem;margin:2px}

var wordBank={
nature:["春风","秋雨","明月","流水","青山","白云","飞鸟","落花","晨曦","暮霭","清风","细雨","残雪","孤烟","远山","碧水","翠竹","苍松","古木","幽兰","芳草","夕阳","朝霞","晚风","寒霜","暖阳","细柳","荷塘","梅花","菊花"],

function generatePoem(){
var type=document.getElementById('poemType').value;
var mood=document.getElementById('mood').value;
var dynasty=document.getElementById('dynasty').value;
var keyword=document.getElementById('keyword').value.trim();

var dynKey=dynasty==='tang'?'tang':dynasty==='song'?'song':dynasty==='wei'?'wei':'yuan';
var moodKey=mood==='bold'?'bold':mood==='graceful'?'graceful':mood==='fresh'?'fresh':mood==='deep'?'deep':mood==='leisurely'?'leisureful':'sad';

var phrases=poemDB[dynKey][moodKey].phrases;
var subjects=poemDB[dynKey][moodKey].subjects;

var poem=buildPoem(type,phrases,subjects,keyword,mood);
showPoem(poem);
}

function buildPoem(type,phrases,subjects,keyword,mood){
var title=keyword?keyword+'吟':subjects[Math.floor(Math.random()*subjects.length)]+'吟';
var content='';
var lines=[];

var naturals=wordBank.nature;
var emotions=wordBank.emotion;
var actions=wordBank.action;

function rw(){return naturals[Math.floor(Math.random()*naturals.length)];}
function re(){return emotions[Math.floor(Math.random()*emotions.length)];}
function ra(){return actions[Math.floor(Math.random()*actions.length)];}
function rp(){return phrases[Math.floor(Math.random()*phrases.length)];}
function rk(){return keyword||rw();}

if(type==='jueju5'){
lines=[rw()+rw()+re(),rw()+rw()+ra(),rw()+rw()+rw(),rw()+rw()+re()];
}else if(type==='jueju7'){
lines=[rw()+rw()+rw()+re(),rw()+rw()+rw()+ra(),rw()+rw()+rw()+rw(),rw()+rw()+rw()+re()];
}else if(type==='lvshi5'){
lines=[rw()+rw()+re(),rw()+rw()+ra(),rw()+rw()+rw(),rw()+rw()+re(),rw()+rw()+ra(),rw()+rw()+rw(),rw()+rw()+re(),rw()+rw()+ra()];
}else if(type==='lvshi7'){
lines=[rw()+rw()+rw()+re(),rw()+rw()+rw()+ra(),rw()+rw()+rw()+rw(),rw()+rw()+rw()+re(),rw()+rw()+rw()+ra(),rw()+rw()+rw()+rw(),rw()+rw()+rw()+re(),rw()+rw()+rw()+ra()];
}else if(type==='gushi'){
var len=6+Math.floor(Math.random()*6);
for(var i=0;i<len;i++){
var usePhrase=Math.random()>0.7;
lines.push(usePhrase?rp():rw()+rw()+re());
}
}else{
lines=[rw()+rw(),rw()+rw()+re(),rw()+rw(),rw()+rw()+ra(),rw()+rw(),rw()+rw()+re()];
}

content=lines.join('\n');
return{title:title,content:content,author:'AI创作',type:type,mood:mood};
}

function randomPoem(){
var types=['jueju5','jueju7','lvshi5','lvshi7','gushi','ci'];
var moods=['bold','graceful','fresh','deep','leisureful','sad'];
var dynasties=['tang','song','wei','yuan'];
document.getElementById('poemType').value=types[Math.floor(Math.random()*types.length)];
document.getElementById('mood').value=moods[Math.floor(Math.random()*moods.length)];
document.getElementById('dynasty').value=dynasties[Math.floor(Math.random()*dynasties.length)];
document.getElementById('keyword').value=wordBank.nature[Math.floor(Math.random()*wordBank.nature.length)];
generatePoem();
}

function showPoem(poem){
var typeNames={jueju5:'五言绝句',jueju7:'七言绝句',lvshi5:'五言律诗',lvshi7:'七言律诗',gushi:'古风',ci:'词'};
var moodNames={bold:'豪放',graceful:'婉约',fresh:'清新',deep:'沉郁',leisurely:'闲适',sad:'悲凉'};
var html='<div class="result-block"><div class="poem-display">';
html+='<div class="poem-title">'+poem.title+'</div>';
html+='<div class="poem-author">作者：'+poem.author+'</div>';
html+='<div style="margin-bottom:12px"><span class="tag">'+typeNames[poem.type]+'</span> <span class="tag">'+moodNames[poem.mood]+'</span></div>';
html+='<div class="poem-content">'+poem.content+'</div></div>';
html+='<div style="text-align:center;padding-top:12px">';
html+='<button class="btn" onclick="copyPoem()">📋 复制古诗</button>';
html+='<button class="btn btn-green" onclick="generatePoem()">🔄 重新生成</button>';
html+='</div></div>';
document.getElementById('result').innerHTML=html;
}

function copyPoem(){
var title=document.querySelector('.poem-title').textContent;
var author=document.querySelector('.poem-author').textContent.replace('作者：','');
var content=document.querySelector('.poem-content').textContent;
navigator.clipboard.writeText(title+'\n'+author+'\n\n'+content).then(function(){alert('已复制古诗');}).catch(function(){alert('复制失败');});
}
