var currentCat='all';
function selectCat(el,cat){
  document.querySelectorAll('.cat-tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');currentCat=cat;filterInstruments();
}
function filterInstruments(){
  var search=document.getElementById('searchInput').value.toLowerCase();
  var filtered=instruments.filter(function(inst){
    if(currentCat!=='all'&&inst.type!==currentCat)return false;
    if(search&&!inst.name.toLowerCase().includes(search)&&!inst.type.toLowerCase().includes(search)&&!inst.ethnic.toLowerCase().includes(search))return false;
    return true;
  });
  renderInstruments(filtered);
}
function renderInstruments(items){
  var h='<div class="instrument-grid">';
  items.forEach(function(inst,i){
    h+='<div class="instrument-card" onclick="showDetail('+instruments.indexOf(inst)+')">';
    h+='<div class="inst-icon">'+inst.icon+'</div>';
    h+='<div class="inst-name">'+inst.name+'</div>';
    h+='<div class="inst-type">'+inst.type+'</div>';
    h+='<div class="inst-ethnic">民族: '+inst.ethnic+'</div>';
    h+='<span class="inst-diff diff-'+(inst.diff==='简单'?'easy':inst.diff==='中等'?'medium':'hard')+'">'+inst.diff+'</span></div>';
  });
  h+='</div>';
  document.getElementById('instrumentList').innerHTML=h;
  document.getElementById('instrumentDetail').classList.add('hidden');
}
function showDetail(idx){
  var inst=instruments[idx];
  var h='<div class="detail-panel"><div class="detail-header"><span class="detail-name">'+inst.icon+' '+inst.name+'</span><button class="btn btn-secondary" onclick="filterInstruments()" style="font-size:.8rem">← 返回</button></div>';
  h+='<div class="detail-grid"><div class="detail-box"><div class="val">'+inst.type+'</div><div class="lbl">类型</div></div>';
  h+='<div class="detail-box"><div class="val">'+inst.ethnic+'</div><div class="lbl">民族</div></div>';
  h+='<div class="detail-box"><div class="val">'+inst.origin+'</div><div class="lbl">起源</div></div>';
  h+='<div class="detail-box"><div class="val">'+inst.diff+'</div><div class="lbl">学习难度</div></div></div>';
  h+='<div class="detail-section"><h4>📖 历史</h4><p>'+inst.history+'</p></div>';
  h+='<div class="detail-section"><h4>🎶 音色特点</h4><p>'+inst.sound+'</p></div>';
  h+='<div class="detail-section"><h4>🔍 构造特征</h4><p>'+inst.feature+'</p></div>';
  h+='<div class="detail-section"><h4>🎼 代表曲目</h4><p>'+inst.works.join('、')+'</p></div></div>';
  document.getElementById('instrumentDetail').innerHTML=h;
  document.getElementById('instrumentDetail').classList.remove('hidden');
  document.getElementById('instrumentList').innerHTML='';
}

var quizQuestions=[
{q:'以下哪种乐器有3000年以上历史？',opts:['二胡','古琴','马头琴','葫芦丝'],ans:1},
{q:'被称为"乐器界的扛把子"的是？',opts:['笛子','古筝','唢呐','琵琶'],ans:2},
{q:'二胡有几根弦？',opts:['一根','两根','三根','四根'],ans:1},
{q:'哪种乐器是用马的腿骨做琴筒的？',opts:['二胡','马头琴','马骨胡','京胡'],ans:2},
{q:'古琴有几根弦？',opts:['五根','六根','七根','八根'],ans:2},
{q:'哪种乐器是傣族的传统乐器？',opts:['芦笙','葫芦丝','冬不拉','马头琴'],ans:1},
{q:'琵琶有几根弦？',opts:['两根','三根','四根','五根'],ans:2},
{q:'以下哪首不是二胡名曲？',opts:['二泉映月','赛马','十面埋伏','光明行'],ans:2}
];
var quizState={current:0,score:0,answered:false};

function startQuiz(){
  quizState={current:0,score:0,answered:false};
  renderQuiz();
}
function renderQuiz(){
  if(quizState.current>=quizQuestions.length){
    document.getElementById('quizArea').innerHTML='<div style="text-align:center;padding:20px"><h3>测验完成！</h3><p style="font-size:2rem;color:var(--blue);margin:10px 0">'+quizState.score+'/'+quizQuestions.length+'</p><p style="color:var(--text2)">正确率: '+Math.round(quizState.score/quizQuestions.length*100)+'%</p><button class="btn btn-primary" onclick="startQuiz()" style="margin-top:10px">再来一轮</button></div>';
    return;
  }
  var q=quizQuestions[quizState.current];
  var h='<div class="quiz-card"><div class="q-num" style="font-size:.85rem;color:var(--text2);margin-bottom:8px">第 '+(quizState.current+1)+' / '+quizQuestions.length+' 题</div>';
  h+='<div class="quiz-q">'+q.q+'</div><div class="quiz-opts">';
  q.opts.forEach(function(o,i){h+='<div class="quiz-opt" onclick="answerQuiz('+i+')">'+o+'</div>'});
  h+='</div></div>';
  document.getElementById('quizArea').innerHTML=h;
}
function answerQuiz(idx){
  if(quizState.answered)return;
  quizState.answered=true;
  var q=quizQuestions[quizState.current];
  var correct=idx===q.ans;
  if(correct)quizState.score++;
  var opts=document.querySelectorAll('.quiz-opt');
  opts.forEach(function(o,i){
    if(i===q.ans)o.classList.add('correct');
    if(i===idx&&!correct)o.classList.add('wrong');
  });
  setTimeout(function(){quizState.current++;quizState.answered=false;renderQuiz()},1500);
}

function renderPlaylists(){
  var h='';
  playlists.forEach(function(p){
    h+='<div class="playlist-item"><div><div class="name">'+p.name+'</div><div class="desc">'+p.desc+' · '+p.instruments.join('、')+'</div></div></div>';
  });
  document.getElementById('playlists').innerHTML=h;
}

filterInstruments();renderPlaylists();
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var inp=document.querySelector('input');if(inp)inp.focus()}if(e.key==='Escape'){var inp=document.activeElement;if(inp&&inp.tagName==='INPUT')inp.blur()}});
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
