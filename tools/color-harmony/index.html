<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>色彩和谐 - Color Harmony</title>
<meta name="description" content="色彩和谐配色工具，基于色轮生成和谐配色方案">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{text-align:center;padding:2rem 1rem;border-bottom:1px solid var(--border)}
.header h1{font-size:1.8rem;margin-bottom:.3rem}
.header p{color:#8b949e;font-size:.9rem}
.container{max-width:1000px;margin:0 auto;padding:1.5rem}
.controls{display:flex;gap:1.5rem;flex-wrap:wrap;margin:1.5rem 0;align-items:flex-start}
.wheel-section{position:relative;width:300px;height:300px;flex-shrink:0}
#colorWheel{width:300px;height:300px;border-radius:50%;cursor:crosshair}
.mode-section{flex:1;min-width:260px}
.mode-btns{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
.mode-btn{padding:.4rem .8rem;border-radius:6px;background:var(--card);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:.8rem;transition:all .2s}
.mode-btn:hover,.mode-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.base-color{display:flex;align-items:center;gap:1rem;margin:1rem 0;padding:1rem;background:var(--card);border-radius:10px;border:1px solid var(--border)}
.base-swatch{width:56px;height:56px;border-radius:10px;border:2px solid var(--border);flex-shrink:0}
.base-info{flex:1}
.base-info h3{font-size:1rem;margin-bottom:.2rem}
.base-info p{font-size:.8rem;color:#8b949e;font-family:monospace}
.palette-section{margin-top:2rem}
.palette-section h2{margin-bottom:1rem;font-size:1.2rem}
.palette-display{display:flex;border-radius:12px;overflow:hidden;height:100px;margin-bottom:1rem}
.palette-color{flex:1;position:relative;cursor:pointer;transition:flex .3s}
.palette-color:hover{flex:1.5}
.palette-label{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:.2rem .5rem;border-radius:4px;font-size:.7rem;font-family:monospace;white-space:nowrap}
.palette-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1rem;margin-top:1rem}
.p-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .2s}
.p-card:hover{transform:translateY(-3px)}
.p-card-swatch{height:70px}
.p-card-info{padding:.6rem}
.p-card-info h4{font-size:.85rem;margin-bottom:.15rem}
.p-card-info p{font-size:.7rem;color:#8b949e;font-family:monospace}
.p-card-info .copy-hint{font-size:.65rem;color:var(--accent);margin-top:.2rem;opacity:0;transition:opacity .2s}
.p-card:hover .copy-hint{opacity:1}
.mode-desc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1rem;margin:1rem 0}
.mode-desc h4{color:var(--accent);margin-bottom:.4rem}
.mode-desc p{color:#8b949e;font-size:.85rem;line-height:1.5}
@media(max-width:600px){.wheel-section{width:220px;height:220px}#colorWheel{width:220px;height:220px}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="色彩和谐 - Color Harmony">
  <meta property="og:description" content="色彩和谐配色工具，基于色轮生成和谐配色方案">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/color-harmony/">
</head>
<body>
<div class="header">
<h1>🎨 色彩和谐</h1>
<p>生成和谐的配色方案</p>
</div>
<div class="container">
<div class="controls">
<div class="wheel-section">
<canvas id="colorWheel" width="300" height="300"></canvas>
</div>
<div class="mode-section">
<div class="mode-btns">
<div class="mode-btn active" data-mode="complementary">互补</div>
<div class="mode-btn" data-mode="analogous">类似</div>
<div class="mode-btn" data-mode="triadic">三色组</div>
<div class="mode-btn" data-mode="split">分裂互补</div>
<div class="mode-btn" data-mode="tetradic">四色组</div>
<div class="mode-btn" data-mode="square">正方形</div>
</div>
<div class="base-color">
<div class="base-swatch" id="baseSwatch" style="background:#3b82f6"></div>
<div class="base-info">
<h3>基础色</h3>
<p id="baseHex">#3B82F6 &nbsp; HSL(217, 84%, 60%)</p>
</div>
</div>
<div class="mode-desc" id="modeDesc">
<h4>互补色 Complementary</h4>
<p>色轮上相对180°的两种颜色。对比强烈，视觉冲击力大。适合需要高对比的设计。</p>
</div>
</div>
</div>
<div class="palette-section">
<h2>配色方案</h2>
<div class="palette-display" id="paletteDisplay"></div>
<div class="palette-cards" id="paletteCards"></div>
</div>
</div>

<script>
const modeDescriptions={
complementary:{title:'互补色 Complementary',desc:'色轮上相对180°的两种颜色。对比强烈，视觉冲击力大。适合需要高对比的设计。'},
analogous:{title:'类似色 Analogous',desc:'色轮上相邻±30°的颜色。和谐自然，适合营造统一氛围的设计。'},
triadic:{title:'三色组 Triadic',desc:'色轮上等距120°的三种颜色。鲜艳活泼，适合创意和儿童设计。'},
split:{title:'分裂互补 Split-Complementary',desc:'一种颜色搭配其互补色两侧各±30°的颜色。对比柔和，比互补色更灵活。'},
tetradic:{title:'四色组 Tetradic',desc:'色轮上两对互补色组成的矩形。色彩丰富，需要精心平衡使用比例。'},
square:{title:'正方形 Square',desc:'色轮上等距90°的四种颜色。最丰富的配色方案，需要控制主次比例。'}
};

let currentHue=217,currentSat=84,currentLig=60;
let currentMode='complementary';

const canvas=document.getElementById('colorWheel');
const ctx=canvas.getContext('2d');
const w=canvas.width,h=canvas.height,cx=w/2,cy=h/2,r=w/2-8;

function hslToRgb(h,s,l){h/=360;s/=100;l/=100;let r,g,b;if(s===0){r=g=b=l}else{const q=l<.5?l*(1+s):l+s-l*s,p=2*l-q;const f=(t)=>{if(t<0)t+=1;if(t>1)t-=1;return t<1/6?p+(q-p)*6*t:t<.5?q:t<2/3?p+(q-p)*(2/3-t)*6:p};r=f(h+1/3);g=f(h);b=f(h-1/3)}return[Math.round(r*255),Math.round(g*255),Math.round(b*255)]}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase()}
function hslToHex(h,s,l){const rgb=hslToRgb(h,s,l);return rgbToHex(...rgb)}

function drawWheel(){
const imgData=ctx.createImageData(w,h);
for(let y=0;y<h;y++){for(let x=0;x<w;x++){
const dx=x-cx,dy=y-cy,dist=Math.sqrt(dx*dx+dy*dy);
if(dist<=r&&dist>=r-35){
const angle=Math.atan2(dy,dx)*180/Math.PI;const hue=(angle+360)%360;
const rgb=hslToRgb(hue,100,50);const i=(y*w+x)*4;
imgData.data[i]=rgb[0];imgData.data[i+1]=rgb[1];imgData.data[i+2]=rgb[2];imgData.data[i+3]=255;
}else if(dist<r-35){
const angle=Math.atan2(dy,dx)*180/Math.PI;const hue=(angle+360)%360;
const sat=Math.max(0,Math.min(100,(dist/(r-35))*100));
const rgb=hslToRgb(hue,sat,50);const i=(y*w+x)*4;
imgData.data[i]=rgb[0];imgData.data[i+1]=rgb[1];imgData.data[i+2]=rgb[2];imgData.data[i+3]=255;
}
}}
ctx.putImageData(imgData,0,0);
drawMarkers();
}

function drawMarkers(){
const colors=getHarmonyColors();
colors.forEach((c,i)=>{
const rad=c.hue*Math.PI/180;
const mx=cx+Math.cos(rad)*r;
const my=cy+Math.sin(rad)*r;
ctx.beginPath();ctx.arc(mx,my,10,0,Math.PI*2);
ctx.fillStyle=hslToHex(c.hue,c.sat,c.lig);ctx.fill();
ctx.strokeStyle=i===0?'#fff':'#333';ctx.lineWidth=3;ctx.stroke();
ctx.beginPath();ctx.arc(mx,my,10,0,Math.PI*2);
ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.stroke();
});
// Draw lines
if(colors.length>1){
ctx.beginPath();
colors.forEach((c,i)=>{
const rad=c.hue*Math.PI/180;
const mx=cx+Math.cos(rad)*r;const my=cy+Math.sin(rad)*r;
if(i===0)ctx.moveTo(mx,my);else ctx.lineTo(mx,my);
});
ctx.closePath();ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;ctx.stroke();
}
}

function getHarmonyColors(){
const s=currentSat,l=currentLig;
const hues=[currentHue];
switch(currentMode){
case'complementary':hues.push((currentHue+180)%360);break;
case'analogous':hues.push((currentHue+30)%360,(currentHue+330)%360);break;
case'triadic':hues.push((currentHue+120)%360,(currentHue+240)%360);break;
case'split':hues.push((currentHue+150)%360,(currentHue+210)%360);break;
case'tetradic':hues.push((currentHue+60)%360,(currentHue+180)%360,(currentHue+240)%360);break;
case'square':hues.push((currentHue+90)%360,(currentHue+180)%360,(currentHue+270)%360);break;
}
return hues.map(h=>({hue:h,sat:s,lig:l}));
}

function updatePalette(){
const colors=getHarmonyColors();
const base=hslToHex(currentHue,currentSat,currentLig);
document.getElementById('baseSwatch').style.background=base;
document.getElementById('baseHex').textContent=`${base}  HSL(${Math.round(currentHue)}, ${Math.round(currentSat)}%, ${Math.round(currentLig)}%)`;
document.getElementById('modeDesc').innerHTML=`<h4>${modeDescriptions[currentMode].title}</h4><p>${modeDescriptions[currentMode].desc}</p>`;
const pd=document.getElementById('paletteDisplay');
pd.innerHTML='';
const pc=document.getElementById('paletteCards');
pc.innerHTML='';
colors.forEach((c,i)=>{
const hex=hslToHex(c.hue,c.sat,c.lig);
pd.innerHTML+=`<div class="palette-color" style="background:${hex}" onclick="copyHex('${hex}')"><div class="palette-label">${hex}</div></div>`;
pc.innerHTML+=`<div class="p-card" onclick="copyHex('${hex}')"><div class="p-card-swatch" style="background:${hex}"></div><div class="p-card-info"><h4>${i===0?'基础色':'颜色 '+(i+1)}</h4><p>${hex}</p><p>HSL(${Math.round(c.hue)}, ${Math.round(c.sat)}%, ${Math.round(c.lig)}%)</p><div class="copy-hint">点击复制</div></div></div>`;
});
drawMarkers();
}

function copyHex(hex){navigator.clipboard.writeText(hex).then(()=>{const n=document.createElement('div');n.textContent='已复制 '+hex;n.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#3b82f6;color:#fff;padding:.5rem 1rem;border-radius:8px;font-size:.85rem;z-index:999';document.body.appendChild(n);setTimeout(()=>n.remove(),1500)})}

canvas.addEventListener('click',e=>{
const rect=canvas.getBoundingClientRect();
const x=(e.clientX-rect.left)*(w/rect.width),y=(e.clientY-rect.top)*(h/rect.height);
const dx=x-cx,dy=y-cy,dist=Math.sqrt(dx*dx+dy*dy);
if(dist>r)return;
const angle=Math.atan2(dy,dx)*180/Math.PI;
currentHue=(angle+360)%360;
currentSat=Math.min(100,Math.max(0,(dist/r)*100));
updatePalette();
});

document.querySelectorAll('.mode-btn').forEach(btn=>{
btn.addEventListener('click',()=>{
document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');currentMode=btn.dataset.mode;updatePalette();
});
});

drawWheel();updatePalette();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
