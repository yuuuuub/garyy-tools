<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能提醒Pro</title>
<meta name="description" content="智能提醒Pro，支持定时提醒、重复提醒、分类管理和声音通知">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.container{max-width:800px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.btn-warning{background:var(--yellow);color:#000}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:var(--text2)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-blue{background:rgba(59,130,246,.2);color:var(--accent2)}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-red{background:rgba(248,81,73,.2);color:var(--red)}
.badge-yellow{background:rgba(210,153,34,.2);color:var(--yellow)}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.tag{display:inline-block;padding:4px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:.8rem;margin:2px;cursor:pointer}
.tag.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
.hidden{display:none!important}
.toggle{position:relative;width:48px;height:26px;border-radius:13px;background:var(--border);cursor:pointer;transition:background .3s}
.toggle.on{background:var(--green)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .3s}
.toggle.on::after{transform:translateX(22px)}
.reminder-item{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--border)}
.reminder-item:last-child{border-bottom:none}
.reminder-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔔</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="智能提醒Pro">
<meta property="og:description" content="智能提醒Pro，支持定时提醒、重复提醒、分类管理和声音通知">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/reminder-pro-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='🔔 智能提醒Pro';
const APP=document.getElementById('app');
let reminders=JSON.parse(localStorage.getItem('rp_reminders')||'[]');
let filterCat='all';
let modalOpen=false;
let editingIdx=-1;

const categories=[
  {id:'work',name:'工作',icon:'💼',color:'var(--accent)'},
  {id:'life',name:'生活',icon:'🏠',color:'var(--green)'},
  {id:'health',name:'健康',icon:'💊',color:'var(--red)'},
  {id:'study',name:'学习',icon:'📚',color:'var(--yellow)'},
  {id:'other',name:'其他',icon:'📌',color:'var(--text2)'}
];

const repeatOptions=[
  {id:'none',name:'不重复'},
  {id:'daily',name:'每天'},
  {id:'weekly',name:'每周'},
  {id:'monthly',name:'每月'},
  {id:'yearly',name:'每年'}
];

function save(){localStorage.setItem('rp_reminders',JSON.stringify(reminders))}

function checkReminders(){
  let now=new Date();
  reminders.forEach((r,i)=>{
    if(!r.active||r.notified) return;
    let rTime=new Date(r.datetime);
    if(now>=rTime){
      r.notified=true;
      save();
      showNotification(r);
    }
  });
}

function showNotification(r){
  if(Notification.permission==='granted'){
    new Notification('提醒：'+r.title,{body:r.note||'时间到了！',icon:'🔔'});
  }
  garyyToast(`🔔 ${r.title}\n${r.note||'时间到了！'}`);
  let audio=new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgip2Onp+OeF1fdJmnr5ZlOzVgip2Onp+OeF1fdJmr8Zp0Pz5ji6GQoJ+OeF1fdJmr8Zp0Pz5ji6GQoJ+OeF1fdJmr8Zp0Pz5ji6GQoJ8=');
  audio.play().catch(()=>{});
}

function render(){
  let h=`<h1>🔔 智能提醒Pro</h1><p class="subtitle">定时提醒 · 重复提醒 · 分类管理</p>`;
  let activeCount=reminders.filter(r=>r.active&&!r.notified).length;
  h+=`<div class="card"><div style="display:grid;grid-template-columns:repeat(3,1fr);text-align:center">
    <div><div style="font-size:1.8rem;font-weight:700;color:var(--accent)">${reminders.length}</div><div style="font-size:.8rem;color:var(--text2)">总提醒</div></div>
    <div><div style="font-size:1.8rem;font-weight:700;color:var(--green)">${activeCount}</div><div style="font-size:.8rem;color:var(--text2)">待触发</div></div>
    <div><div style="font-size:1.8rem;font-weight:700;color:var(--yellow)">${reminders.filter(r=>r.notified).length}</div><div style="font-size:.8rem;color:var(--text2)">已完成</div></div>
  </div></div>`;
  
  h+=`<div class="card"><div class="flex-between"><b>提醒列表</b><button class="btn btn-sm" onclick="openModal(-1)">+ 新建提醒</button></div>`;
  h+=`<div class="flex" style="margin-top:12px">`;
  [{id:'all',name:'全部'},...categories].forEach(c=>{
    h+=`<span class="tag ${filterCat===c.id?'active':''}" onclick="filterCat='${c.id}';render()">${c.icon||''} ${c.name}</span>`;
  });
  h+=`</div></div>`;

  let filtered=filterCat==='all'?reminders:reminders.filter(r=>r.category===filterCat);
  filtered.sort((a,b)=>new Date(a.datetime)-new Date(b.datetime));

  if(!filtered.length){
    h+=`<div class="empty">暂无提醒，点击上方按钮创建</div>`;
  } else {
    filtered.forEach((r,i)=>{
      let idx=reminders.indexOf(r);
      let cat=categories.find(c=>c.id===r.category)||categories[4];
      let now=new Date();
      let rTime=new Date(r.datetime);
      let diff=rTime-now;
      let timeStr='';
      if(r.notified) timeStr='已触发';
      else if(diff>0){
        let days=Math.floor(diff/86400000);
        let hours=Math.floor((diff%86400000)/3600000);
        let mins=Math.floor((diff%3600000)/60000);
        if(days>0) timeStr=`${days}天${hours}小时后`;
        else if(hours>0) timeStr=`${hours}小时${mins}分钟后`;
        else timeStr=`${mins}分钟后`;
      } else timeStr='已过期';
      
      let repName=repeatOptions.find(ro=>ro.id===r.repeat)?.name||'';
      h+=`<div class="card" style="padding:14px;opacity:${r.notified?.5:1}">
        <div class="flex-between">
          <div class="flex" style="gap:12px">
            <div class="reminder-icon" style="background:${cat.color}20;color:${cat.color}">${cat.icon}</div>
            <div>
              <b>${r.title}</b>
              <p style="font-size:.85rem;color:var(--text2)">${r.datetime} ${repName!=='不重复'?'🔁 '+repName:''}</p>
              <p style="font-size:.8rem;color:var(--text2)">${timeStr} <span class="badge ${r.notified?'badge-yellow':'badge-green'}">${r.notified?'已完成':'待触发'}</span></p>
              ${r.note?`<p style="font-size:.8rem;color:var(--text2);margin-top:2px">${r.note}</p>`:''}
            </div>
          </div>
          <div class="flex">
            <div class="toggle ${r.active?'on':''}" onclick="toggleActive(${idx})"></div>
            <button class="btn btn-sm" onclick="openModal(${idx})">编辑</button>
            <button class="btn btn-sm btn-danger" onclick="delReminder(${idx})">删除</button>
          </div>
        </div>
      </div>`;
    });
  }

  if(modalOpen) h+=renderModal();
  APP.innerHTML=h;
}

function renderModal(){
  let r=editingIdx>=0?reminders[editingIdx]:null;
  let dt=r?r.datetime:new Date(Date.now()+3600000).toISOString().slice(0,16);
  return `<div class="modal-overlay" onclick="modalOpen=false;render()"><div class="modal" onclick="event.stopPropagation()">
    <h2 style="margin-bottom:16px">${r?'编辑提醒':'新建提醒'}</h2>
    <label>标题</label><input id="rTitle" value="${r?r.title:''}" placeholder="提醒标题">
    <label>时间</label><input id="rTime" type="datetime-local" value="${dt}">
    <label>分类</label><select id="rCat">${categories.map(c=>`<option value="${c.id}" ${r&&r.category===c.id?'selected':''}>${c.icon} ${c.name}</option>`).join('')}</select>
    <label>重复</label><select id="rRepeat">${repeatOptions.map(ro=>`<option value="${ro.id}" ${r&&r.repeat===ro.id?'selected':''}>${ro.name}</option>`).join('')}</select>
    <label>备注</label><input id="rNote" value="${r?r.note||'':''}" placeholder="备注（可选）">
    <div class="flex" style="justify-content:flex-end;margin-top:16px">
      <button class="btn btn-sm btn-outline" style="background:transparent;border:1px solid var(--border);color:var(--text)" onclick="modalOpen=false;render()">取消</button>
      <button class="btn btn-sm btn-success" onclick="saveReminder()">保存</button>
    </div>
  </div></div>`;
}

function openModal(idx){
  editingIdx=idx;
  modalOpen=true;
  render();
  setTimeout(()=>{let t=document.getElementById('rTitle');if(t)t.focus()},100);
}

function saveReminder(){
  let title=document.getElementById('rTitle').value.trim();
  let datetime=document.getElementById('rTime').value;
  let category=document.getElementById('rCat').value;
  let repeat=document.getElementById('rRepeat').value;
  let note=document.getElementById('rNote').value.trim();
  if(!title||!datetime){alert('请填写标题和时间');return}
  if(editingIdx>=0){
    reminders[editingIdx]={...reminders[editingIdx],title,datetime,category,repeat,note,notified:false};
  } else {
    reminders.push({title,datetime,category,repeat,note,active:true,notified:false});
  }
  save();modalOpen=false;editingIdx=-1;render();
}

function toggleActive(idx){reminders[idx].active=!reminders[idx].active;save();render()}
function delReminder(idx){if(confirm('删除此提醒？')){reminders.splice(idx,1);save();render()}}

function initNotifications(){
  if('Notification' in window&&Notification.permission==='default'){
    Notification.requestPermission();
  }
}

setInterval(checkReminders,10000);
initNotifications();
render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
