<title>表情搜索</title>
<meta name="description" content="Emoji表情搜索工具，快速查找需要的Emoji表情">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--accent-hover:#2563eb}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:1.8rem;margin:20px 0 8px}
.sub{color:#8b949e;margin-bottom:24px;font-size:0.95rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:800px;margin-bottom:16px}
input[type=text]{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:1rem}
input[type=text]:focus{outline:none;border-color:var(--accent)}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.cat-btn{padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--text);cursor:pointer;font-size:0.85rem;transition:all .2s}
.cat-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.cat-btn:hover{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:16px}
.emoji-item{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer;transition:border-color .2s}
.emoji-item:hover{border-color:var(--accent)}
.emoji-item .icon{font-size:2rem;margin-bottom:4px}
.emoji-item .name{font-size:0.75rem;color:#8b949e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{color:#8b949e;font-size:0.85rem;margin-top:10px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#238636;color:#fff;padding:10px 24px;border-radius:8px;font-size:0.9rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
</style>

</head>

function init(){

categories.map(c=>`<button class="cat-btn" onclick="selectCat('${c}',this)">${c}</button>`).join('');

function selectCat(cat,el){
activeCat=cat;
document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
el.classList.add('active');
filterEmojis();
}
function filterEmojis(){
const q=document.getElementById('searchInput').value.trim().toLowerCase();
filtered=DB.filter(e=>{
const catMatch=activeCat==='全部'||e.c===activeCat;
const textMatch=!q||e.n.toLowerCase().includes(q)||e.d.toLowerCase().includes(q)||e.e.includes(q);
return catMatch&&textMatch;
});
render();
}
function render(){
document.getElementById('count').textContent=`共 ${filtered.length} 个表情`;
document.getElementById('grid').innerHTML=filtered.map(e=>
`<div class="emoji-item" onclick="copyEmoji('${e.e}')" title="${e.d}"><div class="icon">${e.e}</div><div class="name">${e.n}</div></div>`
).join('');
}
function copyEmoji(emoji){
navigator.clipboard.writeText(emoji).then(()=>{
const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1200);
});
}
