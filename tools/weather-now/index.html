<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时天气查询</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
h1{font-size:1.3rem;color:var(--text)}
.sub{color:var(--text2);font-size:.82rem;margin-top:4px}
.search-box{display:flex;gap:8px;max-width:400px;margin:16px auto 0}
.search-box input{flex:1;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:.9rem;outline:none}
.search-box input:focus{border-color:var(--blue)}
.search-box button{padding:10px 20px;background:var(--blue);border:none;border-radius:var(--radius);color:#fff;cursor:pointer;font-size:.9rem}
.search-box button:hover{opacity:.9}
.loading{text-align:center;padding:60px 0}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--text2);font-size:.85rem}
.error{text-align:center;padding:40px 0;color:var(--red);font-size:.9rem}
.retry-btn{margin-top:10px;padding:8px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);cursor:pointer;font-size:.85rem}
.weather-card{margin-top:20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;text-align:center}
.weather-temp{font-size:3rem;font-weight:700}
.weather-icon{font-size:3.5rem;margin:8px 0}
.weather-desc{font-size:1rem;color:var(--text2);margin-bottom:12px}
.weather-city{font-size:1.1rem;font-weight:600;margin-bottom:4px}
.weather-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:18px}
.weather-detail{background:var(--bg);border-radius:var(--radius);padding:12px}
.weather-detail .label{font-size:.75rem;color:var(--text2)}
.weather-detail .value{font-size:1rem;font-weight:600;margin-top:4px}
.city-list{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.city-item{padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;font-size:.9rem;transition:.2s}
.city-item:hover{background:#1c2333;border-color:var(--blue)}
.code-table{display:none;position:absolute;left:-9999px}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🌤️ 实时天气查询</h1>
<p class="sub">Open-Meteo · 免费天气数据</p>
</header>
<div class="search-box">
<input type="text" id="cityInput" placeholder="输入城市名，如 Beijing" onkeydown="if(event.key==='Enter')searchCity()">
<button onclick="searchCity()">查询</button>
</div>
<div id="app"></div>
</div>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
var cityInput=document.getElementById('cityInput');
var wmoCodes={'0':'☀️ 晴天','1':'🌤️ 大部晴朗','2':'⛅ 多云','3':'☁️ 阴天','45':'🌫️ 雾','48':'🌫️ 雾凇','51':'🌧️ 小毛毛雨','53':'🌧️ 中毛毛雨','55':'🌧️ 大毛毛雨','56':'🌧️ 冻毛毛雨','57':'🌧️ 冻毛毛雨','61':'🌧️ 小雨','63':'🌧️ 中雨','65':'🌧️ 大雨','66':'🌧️ 冻雨','67':'🌧️ 冻雨','71':'🌨️ 小雪','73':'🌨️ 中雪','75':'🌨️ 大雪','77':'🌨️ 雪粒','80':'🌧️ 阵雨','81':'🌧️ 中阵雨','82':'🌧️ 大阵雨','85':'🌨️ 小阵雪','86':'🌨️ 大阵雪','95':'⛈️ 雷暴','96':'⛈️ 冰雹雷暴','99':'⛈️ 强冰雹雷暴'};
window.searchCity=function(){
var q=cityInput.value.trim();
if(!q){app.innerHTML='<div class="error"><p>请输入城市名</p></div>';return;}
app.innerHTML='<div class="loading"><div class="spinner"></div><p>搜索中...</p></div>';
fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=5&language=zh')
.then(function(r){if(!r.ok)throw new Error('搜索失败');return r.json();})
.then(function(data){
if(!data.results||!data.results.length){
app.innerHTML='<div class="error"><p>未找到城市</p></div>';return;
}
if(data.results.length===1){
getWeather(data.results[0]);return;
}
var html='<div class="city-list">';
data.results.forEach(function(c){
var country=c.country||'';
html+='<div class="city-item" data-lat="'+c.latitude+'" data-lon="'+c.longitude+'" data-name="'+c.name+'">'+c.name+(c.admin1?', '+c.admin1:'')+(country?', '+country:'')+'</div>';
});
html+='</div>';
app.innerHTML=html;
document.querySelectorAll('.city-item').forEach(function(el){
el.addEventListener('click',function(){
getWeather({latitude:parseFloat(el.dataset.lat),longitude:parseFloat(el.dataset.lon),name:el.dataset.name});
});
});
})
.catch(function(e){
app.innerHTML='<div class="error"><p>⚠️ '+e.message+'</p><button class="retry-btn" onclick="searchCity()">重试</button></div>';
});
};
function getWeather(city){
app.innerHTML='<div class="loading"><div class="spinner"></div><p>获取天气数据...</p></div>';
var lat=city.latitude,lon=city.longitude,name=city.name;
fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current_weather=true&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=auto')
.then(function(r){if(!r.ok)throw new Error('获取天气失败');return r.json();})
.then(function(data){
var cw=data.current_weather;
var dl=data.daily;
var wmoCode=cw.weathercode;
var wmoDesc=wmoCodes[String(wmoCode)]||'🌡️ '+wmoCode;
var html='<div class="weather-card">';
html+='<div class="weather-city">'+name+'</div>';
html+='<div class="weather-icon">'+wmoDesc.split(' ')[0]+'</div>';
html+='<div class="weather-temp">'+cw.temperature+'°C</div>';
html+='<div class="weather-desc">'+wmoDesc.replace(/^[^\s]+\s/,'')+'</div>';
html+='<div class="weather-details">';
html+='<div class="weather-detail"><div class="label">🌡️ 当前温度</div><div class="value">'+cw.temperature+'°C</div></div>';
html+='<div class="weather-detail"><div class="label">💨 风速</div><div class="value">'+cw.windspeed+' km/h</div></div>';
html+='<div class="weather-detail"><div class="label">🧭 风向</div><div class="value">'+cw.winddirection+'°</div></div>';
html+='<div class="weather-detail"><div class="label">📈 最高温</div><div class="value">'+dl.temperature_2m_max[0]+'°C</div></div>';
html+='<div class="weather-detail"><div class="label">📉 最低温</div><div class="value">'+dl.temperature_2m_min[0]+'°C</div></div>';
html+='</div></div>';
app.innerHTML=html;
})
.catch(function(e){
app.innerHTML='<div class="error"><p>⚠️ '+e.message+'</p><button class="retry-btn" onclick="getWeather({latitude:'+lat+',longitude:'+lon+',name:\''+name+'\'})">重试</button></div>';
});
}
})();
</script>
<script src="../i18n.js"></script>
</body>
</html>
