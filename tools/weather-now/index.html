body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}

.search-box input:focus{border-color:var(--blue)}
.search-box button{padding:10px 20px;background:var(--blue);border:none;border-radius:var(--radius);color:var(--text);cursor:pointer;font-size:.9rem}
.search-box button:hover{opacity:.9}
.loading{text-align:center;padding:60px 0}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--text2);font-size:.85rem}
.error{text-align:center;padding:40px 0;color:var(--red);font-size:.9rem}
.retry-btn{margin-top:10px;padding:8px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);cursor:pointer;font-size:.85rem}
.weather-card{margin-top:20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;text-align:center}
.weather-temp{font-size:3rem;font-weight:700}
.weather-icon{font-size:3.5rem;margin:8px 0}
.weather-desc{font-size:1rem;color:var(--text2);margin-bottom:12px}
.weather-city{font-size:1.1rem;font-weight:600;margin-bottom:4px}
.weather-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:18px}
.weather-detail{background:var(--bg);border-radius:var(--radius);padding:12px}
.weather-detail .label{font-size:.75rem;color:var(--text2)}
.weather-detail .value{font-size:1rem;font-weight:600;margin-top:4px}
.city-list{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.city-item{padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;font-size:.9rem;transition:.2s}
.city-item:hover{background:#1c2333;border-color:var(--blue)}
.code-table{display:none;position:absolute;left:-9999px}

function searchCities(q){
  q = q.trim();
  if (!q) return [];
  var ql = q.toLowerCase();
  var matched = [];
  var seen = {};
  for (var i = 0; i < CITIES.length; i++){
    var c = CITIES[i];
    if (c[0] === q || c[0] === ql || c[0].toLowerCase() === ql){
      var key = c[0]+'|'+c[1];
      if (!seen[key]){matched.push(c); seen[key] = true;}
    }
  }
  for (var i = 0; i < CITIES.length; i++){
    var c = CITIES[i];
    if (c[0].indexOf(q) === 0 || c[0].toLowerCase().indexOf(ql) === 0){
      var key = c[0]+'|'+c[1];
      if (!seen[key]){matched.push(c); seen[key] = true;}
    }
  }
  if (PINYIN_MAP[ql]){
    var pCity = PINYIN_MAP[ql];
    for (var i = 0; i < CITIES.length; i++){
      var c = CITIES[i];
      if (c[0] === pCity){
        var key = c[0]+'|'+c[1];
        if (!seen[key]){matched.push(c); seen[key] = true;}
      }
    }
  }
  var subCount = 0;
  for (var i = 0; i < CITIES.length && subCount < 3; i++){
    var c = CITIES[i];
    if (c[0].indexOf(q) >= 0 || c[0].toLowerCase().indexOf(ql) >= 0){
      var key = c[0]+'|'+c[1];
      if (!seen[key]){matched.push(c); seen[key] = true; subCount++;}
    }
  }
  return matched.slice(0, 8);
}
function fetchWeather(city){
  var cacheKey=city[2]+','+city[3];
  if(weatherCache[cacheKey]&&Date.now()-weatherCache[cacheKey].time<600000){
    renderWeatherData(weatherCache[cacheKey].data,city);return;}
  app.innerHTML = '<div class="loading"><div class="spinner"></div><p>正在查询 '+city[0]+' 天气...</p></div>';
  var url = 'https://api.open-meteo.com/v1/forecast?latitude='+city[2]+'&longitude='+city[3]+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,pressure_msl&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max,wind_speed_10m_max&timezone=auto&forecast_days=16';
  fetch(url).then(function(r){
    if (!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(data){
    weatherCache[cacheKey]={data:data,time:Date.now()};
    renderWeatherData(data,city);
  }).catch(function(e){
    app.innerHTML = '<div class="error"><p>⚠️ 查询失败: '+e.message+'</p><button class="retry-btn" onclick="searchCity()">重试</button></div>';
  });
}

  if (d && d.time){
    html += '<div class="weather-card"><h3 style="font-size:.95rem;margin-bottom:12px">📅 未来15天预报</h3>';
    for (var i = 0; i < d.time.length; i++){
      var dw = String(d.weather_code[i]);
      var di = wmoCodes[dw] || '🌡️';
      var dateParts = d.time[i].split('-');
      var dateStr = parseInt(dateParts[1])+'月'+parseInt(dateParts[2])+'日';
      html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:'+(i<d.time.length-1?'1px solid var(--border)':'none')+'">';
      html += '<span style="font-size:.85rem;min-width:80px">'+dateStr+'</span>';
      html += '<span style="font-size:.85rem;min-width:40px">'+di+'</span>';
      html += '<span style="font-size:.82rem"><span style="color:var(--red)">'+Math.round(d.temperature_2m_max[i])+'°</span>/<span style="color:var(--blue)">'+Math.round(d.temperature_2m_min[i])+'°</span></span>';
      html += '<span style="font-size:.72rem;color:var(--text2);min-width:45px;text-align:right">'+(d.precipitation_probability_max[i]||0)+'%</span>';
      html += '<span style="font-size:.72rem;color:var(--text2);min-width:45px;text-align:right">'+(d.wind_speed_10m_max[i]?Math.round(d.wind_speed_10m_max[i])+'km':'')+'</span>';
      html += '</div>';
    }
    html += '</div>';
  }
  app.innerHTML = html;
}
window.searchCity = function(){
  var q = input.value.trim();
  if (!q){app.innerHTML='<div class="error"><p>请输入城市名</p></div>';return;}
  var cities = searchCities(q);
  if (cities.length === 0){
    app.innerHTML = '<div class="error"><p>未找到「'+q.replace(/[<>"'&]/g,'')+'」对应的城市</p></div>';
    return;
  }
  if (cities.length === 1){
    fetchWeather(cities[0]);
    return;
  }
  var html = '<div class="weather-card" style="text-align:left"><h3 style="font-size:.95rem;margin-bottom:12px">找到 '+cities.length+' 个匹配城市</h3><div class="city-list">';
  for (var i = 0; i < cities.length; i++){
    var c = cities[i];
    html += '<div class="city-item" onclick="selectCity('+i+')" data-idx="'+i+'">'+c[0]+'，'+c[1]+'</div>';
  }
  html += '</div></div>';
  app.innerHTML = html;
  window._cityResults = cities;
};
window.selectCity = function(idx){
  var cities = window._cityResults;
  if (cities && cities[idx]) fetchWeather(cities[idx]);
};
showHotCities();
input.focus();
})();
</script><script src="../i18n.js" defer></script>
