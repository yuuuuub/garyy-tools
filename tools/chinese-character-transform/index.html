<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字变形</title><meta name="description" content="汉字变形 - 在线查看汉字变形效果"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.transform-container{text-align:center;padding:40px;background:var(--bg);border-radius:12px;margin:16px 0}.transform-char{font-size:6rem;font-weight:700;color:var(--blue);display:inline-block}.transform-options{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0}.transform-option{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.85rem;transition:all .2s}.transform-option:hover{border-color:var(--blue)}.transform-option.active{border-color:var(--green);background:rgba(35,134,54,.1)}

</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🔄 汉字变形</h1><p class="sub">在线查看汉字变形效果</p>
<div class="card">
<div class="input-group">
<label>输入汉字</label>
<input type="text" id="characterInput" placeholder="输入一个汉字" maxlength="1" value="变" oninput="showTransform()">
</div>
<button class="btn" onclick="showTransform()">显示变形</button>
<button class="btn" onclick="randomCharacter()">随机汉字</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var transformTypes=['rotateX','rotateY','rotateZ','skewX','skewY','scaleX','scaleY','translateX','translateY','perspective'];
var currentTransform='rotateX';
function showTransform(){
  var char=document.getElementById('characterInput').value.trim();
  var r=document.getElementById('result');
  if(!char){r.innerHTML='';return;}
  if(char.length!==1){r.innerHTML='<div class="card" style="color:var(--red)">请输入一个汉字</div>';return;}
  var html='<div class="card">';
  html+='<div class="transform-options">';
  transformTypes.forEach(function(type){
    html+='<div class="transform-option '+(type===currentTransform?'active':'')+'" onclick="setTransform(\''+type+'\')">'+getTransformName(type)+'</div>';
  });
  html+='</div>';
  html+='<div class="transform-container">';
  html+='<div class="transform-char" style="animation:'+getTransformCSS(currentTransform)+'">'+char+'</div>';
  html+='</div>';
  html+='<div class="section"><h3>📋 变形说明</h3>';
  html+='<div style="padding:12px;background:var(--bg);border-radius:8px">';
  html+='<div><strong>变形类型：</strong>'+getTransformName(currentTransform)+'</div>';
  html+='<div><strong>效果描述：</strong>'+getTransformDescription(currentTransform)+'</div>';
  html+='</div></div></div>';
  r.innerHTML=html;
}
function setTransform(type){
  currentTransform=type;
  showTransform();
}
function getTransformName(type){
  switch(type){
    case 'rotateX':return'X轴旋转';
    case 'rotateY':return'Y轴旋转';
    case 'rotateZ':return'Z轴旋转';
    case 'skewX':return'X轴倾斜';
    case 'skewY':return'Y轴倾斜';
    case 'scaleX':return'X轴缩放';
    case 'scaleY':return'Y轴缩放';
    case 'translateX':return'X轴移动';
    case 'translateY':return'Y轴移动';
    case 'perspective':return'透视效果';
    default:return'未知';
  }
}
function getTransformDescription(type){
  switch(type){
    case 'rotateX':return'围绕X轴进行3D旋转';
    case 'rotateY':return'围绕Y轴进行3D旋转';
    case 'rotateZ':return'围绕Z轴进行2D旋转';
    case 'skewX':return'沿X轴方向倾斜';
    case 'skewY':return'沿Y轴方向倾斜';
    case 'scaleX':return'沿X轴方向缩放';
    case 'scaleY':return'沿Y轴方向缩放';
    case 'translateX':return'沿X轴方向移动';
    case 'translateY':return'沿Y轴方向移动';
    case 'perspective':return'添加3D透视效果';
    default:return'未知效果';
  }
}
function getTransformCSS(type){
  switch(type){
    case 'rotateX':return'rotateX 2s linear infinite';
    case 'rotateY':return'rotateY 2s linear infinite';
    case 'rotateZ':return'rotateZ 2s linear infinite';
    case 'skewX':return'skewX 2s ease-in-out infinite';
    case 'skewY':return'skewY 2s ease-in-out infinite';
    case 'scaleX':return'scaleX 2s ease-in-out infinite';
    case 'scaleY':return'scaleY 2s ease-in-out infinite';
    case 'translateX':return'translateX 2s ease-in-out infinite';
    case 'translateY':return'translateY 2s ease-in-out infinite';
    case 'perspective':return'perspective 2s ease-in-out infinite';
    default:return'none';
  }
}
function randomCharacter(){
  var chars='的一是不了人我在有他这中大来上个国到说们为子和你地出会也时要就可以生能那得着下自之年过发后与都而行前里如面起把好她事件什让新方头经于主学公同年去到理放心之你到家到国到我到他到她到它到我们到你们到他们到她们到它们到大家到所有到每个到任何到没有到一切到全部到整个';
  var randomChar=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('characterInput').value=randomChar;
  showTransform();
}
showTransform();
</script>
<style>
@keyframes rotateX{from{transform:rotateX(0deg)}to{transform:rotateX(360deg)}}
@keyframes rotateY{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
@keyframes rotateZ{from{transform:rotateZ(0deg)}to{transform:rotateZ(360deg)}}
@keyframes skewX{0%,100%{transform:skewX(0deg)}50%{transform:skewX(20deg)}}
@keyframes skewY{0%,100%{transform:skewY(0deg)}50%{transform:skewY(20deg)}}
@keyframes scaleX{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.5)}}
@keyframes scaleY{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.5)}}
@keyframes translateX{0%,100%{transform:translateX(0)}50%{transform:translateX(50px)}}
@keyframes translateY{0%,100%{transform:translateY(0)}50%{transform:translateY(50px)}}
@keyframes perspective{0%{transform:perspective(100px) rotateX(0deg)}50%{transform:perspective(100px) rotateX(180deg)}100%{transform:perspective(100px) rotateX(360deg)}}
</style><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
