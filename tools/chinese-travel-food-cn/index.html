<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国旅行美食指南 - Chinese Travel Food Guide</title>
<meta name="description" content="中国旅行美食指南，八大菜系、地方小吃与街头美食全攻略">
<meta name="robots" content="index, follow">
<meta property="og:title" content="中国旅行美食指南 - Chinese Travel Food Guide">
<meta property="og:description" content="中国旅行美食指南，八大菜系、地方小吃与街头美食全攻略">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍜</text></svg>">
<script src="../i18n.js" defer></script>
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--accent:#dc2626;--accent2:#b91c1c}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e;--accent:#dc2626;--accent2:#b91c1c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;scroll-behavior:smooth}
header{background:linear-gradient(135deg,#1a0505 0%,#2d0a0a 50%,#3d0f0f 100%);padding:40px 20px 30px;text-align:center;border-bottom:2px solid #7f1d1d;border-radius:0 0 20px 20px}
header h1{font-size:2.4em;background:linear-gradient(135deg,#dc2626,#f87171,#ef4444,#fca5a5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header p{color:var(--text2);font-size:1.05em}
.container{max-width:1400px;margin:0 auto;padding:20px}
.search-box{text-align:center;margin-bottom:24px}
.search-box input{width:100%;max-width:500px;padding:14px 20px;border-radius:30px;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none;transition:border-color 0.3s}
.search-box input:focus{border-color:var(--accent)}
.filter-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.filter-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.85em;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.food-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.food-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.food-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:14px 0 0 14px}
.food-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.food-card .f-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.food-card .f-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6em;flex-shrink:0;background:rgba(220,38,38,0.15);color:var(--accent)}
.food-card .f-name{font-size:1.3em;font-weight:bold}
.food-card .f-origin{font-size:0.8em;color:var(--text2);margin-top:2px}
.food-card .f-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.food-card .f-tags span{font-size:0.75em;padding:3px 10px;border-radius:10px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.food-card .f-desc{font-size:0.85em;color:var(--text2);line-height:1.7;margin-bottom:8px}
.food-card .f-desc strong{color:var(--text)}
.food-card .f-rating{display:flex;align-items:center;gap:4px;font-size:0.85em;color:var(--accent)}
.food-card.hidden{display:none}
footer{text-align:center;padding:30px;color:var(--text2);font-size:0.85em;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){header h1{font-size:1.6em}.food-grid{grid-template-columns:1fr}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<header>
<h1>🍜 中国旅行美食指南</h1>
<p>Chinese Travel Food Guide — 品味八大菜系，探索地道中国味</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="搜索美食...（如"火锅""小笼包""羊肉泡馍"）">
</div>
<div class="filter-row" id="filterRow">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="川菜">🌶️ 川菜</button>
<button class="filter-btn" data-filter="粤菜">🦐 粤菜</button>
<button class="filter-btn" data-filter="鲁菜">🥘 鲁菜</button>
<button class="filter-btn" data-filter="淮扬菜">🍜 淮扬菜</button>
<button class="filter-btn" data-filter="小吃">🍡 地方小吃</button>
<button class="filter-btn" data-filter="面食">🍝 面食</button>
<button class="filter-btn" data-filter="甜品">🍰 甜品饮品</button>
</div>
<div class="food-grid" id="foodGrid"></div>
<footer><p>🍜 中国旅行美食指南 — 民以食为天，食以味为先</p></footer>
</div>
<script>
const FOOD_DATA=[
{id:1,name:"四川火锅",en:"Sichuan Hotpot",origin:"四川成都",category:"川菜",icon:"🍲",spice:5,price:"人均60-120元",best:"冬季",desc:"麻辣鲜香，牛油锅底翻滚，毛肚鸭肠七上八下，是四川最具代表性的美食体验。"},
{id:2,name:"北京烤鸭",en:"Peking Duck",origin:"北京",category:"鲁菜",icon:"🦆",spice:1,price:"人均120-300元",best:"四季",desc:"全聚德、大董、四季民福，皮脆肉嫩，蘸甜面酱卷饼，京城必吃第一名。"},
{id:3,name:"小笼包",en:"Xiaolongbao",origin:"上海/无锡",category:"淮扬菜",icon:"🥟",spice:1,price:"人均20-50元",best:"四季",desc:"皮薄汁多，轻轻提、慢慢移、先开窗、后喝汤，上海南翔小笼最为经典。"},
{id:4,name:"广州早茶",en:"Cantonese Dim Sum",origin:"广东广州",category:"粤菜",icon:"🫖",spice:1,price:"人均50-100元",best:"早茶时段",desc:"虾饺、烧卖、叉烧包、肠粉、凤爪，一盅两件叹早茶，广式生活精髓。"},
{id:5,name:"兰州牛肉面",en:"Lanzhou Beef Noodles",origin:"甘肃兰州",category:"面食",icon:"🍜",spice:2,price:"人均10-20元",best:"四季",desc:"一清二白三红四绿五黄，清汤牛肉面是兰州人的早餐标配，实惠美味。"},
{id:6,name:"重庆酸辣粉",en:"Chongqing Hot & Sour Noodles",origin:"重庆",category:"小吃",icon:"🥢",spice:4,price:"人均10-20元",best:"四季",desc:"红薯粉丝酸辣爽口，花生碎与香菜点缀，街头小吃中的扛把子。"},
{id:7,name:"西安肉夹馍",en:"Roujiamo",origin:"陕西西安",category:"小吃",icon:"🫓",spice:2,price:"人均10-25元",best:"四季",desc:"白吉馍夹腊汁肉，外酥里嫩，汁水四溢，与凉皮、冰峰并称"三秦套餐"。"},
{id:8,name:"云南过桥米线",en:"Cross-Bridge Rice Noodles",origin:"云南蒙自",category:"小吃",icon:"🍲",spice:2,price:"人均25-60元",best:"四季",desc:"滚烫高汤配生鲜配料，自行涮烫，传说源自妻子为书生送饭的爱情故事。"},
{id:9,name:"武汉热干面",en:"Wuhan Hot Dry Noodles",origin:"湖北武汉",category:"面食",icon:"🍝",spice:2,price:"人均8-15元",best:"早餐",desc:"芝麻酱拌面，碱面筋道弹牙，配酸豆角萝卜丁，武汉人过早的首选。"},
{id:10,name:"长沙臭豆腐",en:"Changsha Stinky Tofu",origin:"湖南长沙",category:"小吃",icon:"🫘",spice:3,price:"人均5-15元",best:"四季",desc:"外焦里嫩，浇上辣椒汤汁，臭中带香，火宫殿是品尝正宗味道的好去处。"},
{id:11,name:"广东肠粉",en:"Rice Noodle Roll",origin:"广东",category:"粤菜",icon:"🥡",spice:1,price:"人均10-25元",best:"早餐",desc:"米浆蒸制的薄皮包裹虾仁或叉烧，淋上特制酱油，滑嫩鲜美。"},
{id:12,name:"山西刀削面",en:"Shanxi Knife-Cut Noodles",origin:"山西太原",category:"面食",icon:"🔪",spice:2,price:"人均12-25元",best:"四季",desc:"刀削入锅，面片中厚边薄，入口外滑内筋，配卤汁浇头，面食之王。"},
{id:13,name:"四川担担面",en:"Sichuan Dan Dan Noodles",origin:"四川成都",category:"面食",icon:"🥢",spice:4,price:"人均10-20元",best:"四季",desc:"肉臊子与芽菜碎铺面，麻辣咸鲜微甜，一碗小面，四川灵魂。"},
{id:14,name:"桂林米粉",en:"Guilin Rice Noodles",origin:"广西桂林",category:"小吃",icon:"🍜",spice:2,price:"人均8-15元",best:"四季",desc:"卤水浸泡的圆粉，配卤菜或锅烧，卤水是每家店的独门秘方。"},
{id:15,name:"杭州西湖醋鱼",en:"West Lake Fish in Vinegar",origin:"浙江杭州",category:"淮扬菜",icon:"🐟",spice:1,price:"人均80-150元",best:"四季",desc:"草鱼烹制，糖醋芡汁酸甜适口，西湖边楼外楼是品尝名店。"},
{id:16,name:"沙县小吃",en:"Shaxian Delicacies",origin:"福建沙县",category:"小吃",icon:"🍱",spice:1,price:"人均10-20元",best:"四季",desc:"蒸饺、拌面、炖罐、鸭腿，遍布全国的平民美食，经济实惠的代名词。"}
];
const grid=document.getElementById('foodGrid');
const search=document.getElementById('searchInput');
const filterRow=document.getElementById('filterRow');
let currentFilter='all';
function renderStars(n){return '🌶️'.repeat(n)+'<span style="opacity:0.3">'+'🌶️'.repeat(5-n)+'</span>'}
function render(){
const q=search.value.toLowerCase();
grid.innerHTML='';
FOOD_DATA.filter(d=>{
const matchFilter=currentFilter==='all'||d.category===currentFilter;
const matchSearch=!q||d.name.toLowerCase().includes(q)||d.en.toLowerCase().includes(q)||d.origin.includes(q)||d.desc.includes(q);
return matchFilter&&matchSearch;
}).forEach(d=>{
grid.innerHTML+=`<div class="food-card"><div class="f-header"><div class="f-icon">${d.icon}</div><div><div class="f-name">${d.name}</div><div class="f-origin">${d.origin} · ${d.en}</div></div></div><div class="f-tags"><span>${d.category}</span><span>💰 ${d.price}</span><span>📅 ${d.best}</span></div><div class="f-desc">${d.desc}</div><div class="f-rating">${renderStars(d.spice)} 辣度</div></div>`;
});
}
filterRow.addEventListener('click',e=>{
if(e.target.classList.contains('filter-btn')){
filterRow.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
e.target.classList.add('active');
currentFilter=e.target.dataset.filter;
render();
}
});
search.addEventListener('input',render);
render();
</script>
</body>
</html>
