<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎨 头像生成器</title>
<meta name="description" content="在线头像生成器，自定义风格、颜色、配饰，一键生成个性头像">
<style>
:root{--bg:#f5f5f5;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--accent:#6366f1;--accent-hover:#4f46e5;--tag-bg:#eef2ff;--tag-text:#4338ca;--preview-bg:#fafafa;--input-bg:#fff;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme="dark"]{--bg:#1a1a2e;--card-bg:#16213e;--text:#e8e8e8;--text-secondary:#a0a0b8;--border:#2a2a4a;--accent:#818cf8;--accent-hover:#6366f1;--tag-bg:#1e1b4b;--tag-text:#a5b4fc;--preview-bg:#0f3460;--input-bg:#1a1a2e;--shadow:0 2px 12px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;transition:background .3s,color .3s}
.container{max-width:540px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header h1{font-size:22px;font-weight:700}
.theme-toggle{background:var(--card-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent)}
.card{background:var(--card-bg);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.preview-box{display:flex;justify-content:center;padding:20px 0}
.preview-box canvas{border-radius:50%;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.tag-grid{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:8px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--card-bg);cursor:pointer;font-size:13px;transition:all .2s;user-select:none}
.tag:hover{border-color:var(--accent);transform:translateY(-1px)}
.tag.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.color-row{display:flex;gap:8px;flex-wrap:wrap}
.color-swatch{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:all .2s}
.color-swatch:hover{transform:scale(1.15)}
.color-swatch.active{border-color:var(--text);box-shadow:0 0 0 2px var(--accent)}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.slider-row label{font-size:13px;color:var(--text-secondary);min-width:60px}
.slider-row input[type="range"]{flex:1}
.slider-row span{font-size:13px;color:var(--text-secondary);min-width:36px;text-align:right}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.btn:active{transform:scale(.97)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card-bg);color:var(--text);padding:10px 24px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow);border:1px solid var(--border)}
.toast.show{opacity:1}
footer{text-align:center;padding:24px 0;color:var(--text-secondary);font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="🎨 头像生成器">
<meta property="og:description" content="在线头像生成器，自定义风格一键生成个性头像">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/avatar-generator-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text-secondary);font-size:.75rem;background:var(--card-bg);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
  <header>
    <h1>🎨 头像生成器</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </header>

  <div class="card">
    <div class="card-title">👁️ 预览</div>
    <div class="preview-box"><canvas id="avatarCanvas" width="200" height="200"></canvas></div>
  </div>

  <div class="card">
    <div class="card-title">🎭 风格</div>
    <div class="tag-grid" id="styleGrid"></div>
  </div>

  <div class="card">
    <div class="card-title">🎨 背景色</div>
    <div class="color-row" id="bgColors"></div>
  </div>

  <div class="card">
    <div class="card-title">😊 表情</div>
    <div class="tag-grid" id="faceGrid"></div>
  </div>

  <div class="card">
    <div class="card-title">👑 配饰</div>
    <div class="tag-grid" id="accGrid"></div>
  </div>

  <div class="card">
    <div class="card-title">📐 参数调节</div>
    <div class="slider-row"><label>大小</label><input type="range" min="40" max="80" value="60" id="sizeSlider" oninput="drawAvatar()"><span id="sizeVal">60</span></div>
    <div class="slider-row"><label>旋转</label><input type="range" min="-30" max="30" value="0" id="rotSlider" oninput="drawAvatar()"><span id="rotVal">0°</span></div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" onclick="randomize()">🎲 随机生成</button>
    <button class="btn btn-outline" onclick="downloadAvatar()">💾 下载头像</button>
  </div>

  <footer>头像生成器 · 纯 Canvas 绘制，所有数据本地处理</footer>
</div>
<div class="toast" id="toast"></div>
<script src="../i18n.js" defer></script>
<script>
const styles = [
  { name: '圆形', id: 'circle' },
  { name: '方形', id: 'square' },
  { name: '六边形', id: 'hex' },
  { name: '像素', id: 'pixel' },
  { name: '渐变', id: 'gradient' }
];

const bgColors = ['#6366f1','#ec4899','#f59e0b','#10b981','#3b82f6','#ef4444','#8b5cf6','#06b6d4','#f97316','#84cc16'];
const faces = ['😀','😂','😎','🥳','😏','🤔','😴','😲','🥴','😈','👹','🤖','👽','💀','🦝','🦊'];
const accessories = ['无','👑','🎩','👓','🕶️','🎓','🎀','🌸','⭐','🔥','💫','🎵'];

let state = { style:'circle', bg:'#6366f1', face:'😀', acc:'无', size:60, rot:0 };

function init() {
  const sg = document.getElementById('styleGrid');
  sg.innerHTML = styles.map(s => `<div class="tag${s.id===state.style?' active':''}" data-val="${s.id}" onclick="setStyle('${s.id}')">${s.name}</div>`).join('');

  const bc = document.getElementById('bgColors');
  bc.innerHTML = bgColors.map(c => `<div class="color-swatch${c===state.bg?' active':''}" style="background:${c}" onclick="setBg('${c}')"></div>`).join('');

  const fg = document.getElementById('faceGrid');
  fg.innerHTML = faces.map(f => `<div class="tag${f===state.face?' active':''}" onclick="setFace('${f}')">${f}</div>`).join('');

  const ag = document.getElementById('accGrid');
  ag.innerHTML = accessories.map(a => `<div class="tag${a===state.acc?' active':''}" onclick="setAcc('${a}')">${a}</div>`).join('');

  drawAvatar();
}

function setStyle(s) { state.style = s; updateActive('styleGrid', s); drawAvatar(); }
function setBg(c) { state.bg = c; document.querySelectorAll('#bgColors .color-swatch').forEach(el => el.classList.toggle('active', el.style.background === c || rgbToHex(el.style.background) === c)); drawAvatar(); }
function setFace(f) { state.face = f; updateActive('faceGrid', f); drawAvatar(); }
function setAcc(a) { state.acc = a; updateActive('accGrid', a); drawAvatar(); }

function updateActive(id, val) {
  document.querySelectorAll(`#${id} .tag`).forEach(el => el.classList.toggle('active', el.dataset.val === val || el.textContent.trim() === val));
}

function drawAvatar() {
  const c = document.getElementById('avatarCanvas');
  const ctx = c.getContext('2d');
  const sz = +document.getElementById('sizeSlider').value;
  const rot = +document.getElementById('rotSlider').value;
  state.size = sz; state.rot = rot;
  document.getElementById('sizeVal').textContent = sz;
  document.getElementById('rotVal').textContent = rot + '°';

  ctx.clearRect(0, 0, 200, 200);
  ctx.save();
  ctx.translate(100, 100);
  ctx.rotate(rot * Math.PI / 180);

  // background shape
  ctx.fillStyle = state.bg;
  if (state.style === 'circle') {
    ctx.beginPath(); ctx.arc(0, 0, sz, 0, Math.PI * 2); ctx.fill();
  } else if (state.style === 'square') {
    ctx.fillRect(-sz, -sz, sz * 2, sz * 2);
  } else if (state.style === 'hex') {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 3 * i - Math.PI / 6;
      ctx[i === 0 ? 'moveTo' : 'lineTo'](Math.cos(a) * sz, Math.sin(a) * sz);
    }
    ctx.closePath(); ctx.fill();
  } else if (state.style === 'pixel') {
    const ps = sz / 4;
    for (let x = -4; x < 4; x++) for (let y = -4; y < 4; y++) {
      if (Math.random() > 0.3) {
        ctx.globalAlpha = 0.7 + Math.random() * 0.3;
        ctx.fillRect(x * ps, y * ps, ps - 1, ps - 1);
      }
    }
    ctx.globalAlpha = 1;
  } else if (state.style === 'gradient') {
    const g = ctx.createLinearGradient(-sz, -sz, sz, sz);
    g.addColorStop(0, state.bg);
    g.addColorStop(1, shiftColor(state.bg, 60));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, sz, 0, Math.PI * 2); ctx.fill();
  }

  // face emoji
  ctx.font = `${sz}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(state.face, 0, 0);

  // accessory
  if (state.acc !== '无') {
    ctx.font = `${sz * 0.5}px serif`;
    ctx.fillText(state.acc, 0, -sz * 0.5);
  }

  ctx.restore();
}

function shiftColor(hex, amt) {
  const n = parseInt(hex.replace('#',''), 16);
  const r = Math.min(255, ((n >> 16) & 0xff) + amt);
  const g = Math.min(255, ((n >> 8) & 0xff) + amt);
  const b = Math.min(255, (n & 0xff) + amt);
  return `rgb(${r},${g},${b})`;
}

function rgbToHex(rgb) {
  if (rgb.startsWith('#')) return rgb;
  const m = rgb.match(/\d+/g);
  if (!m) return rgb;
  return '#' + m.slice(0,3).map(x => (+x).toString(16).padStart(2,'0')).join('');
}

function randomize() {
  state.style = styles[Math.floor(Math.random() * styles.length)].id;
  state.bg = bgColors[Math.floor(Math.random() * bgColors.length)];
  state.face = faces[Math.floor(Math.random() * faces.length)];
  state.acc = accessories[Math.floor(Math.random() * accessories.length)];
  document.getElementById('sizeSlider').value = 40 + Math.floor(Math.random() * 40);
  document.getElementById('rotSlider').value = Math.floor(Math.random() * 60) - 30;
  init();
  showToast('已随机生成！');
}

function downloadAvatar() {
  const c = document.getElementById('avatarCanvas');
  const a = document.createElement('a');
  a.download = 'avatar.png';
  a.href = c.toDataURL('image/png');
  a.click();
  showToast('头像已下载！');
}

function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  document.querySelector('.theme-toggle').textContent = t === 'dark' ? '☀️' : '🌙';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

init();
</script>
</body>
</html>
