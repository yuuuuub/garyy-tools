<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加载动画工具</title>
<meta property="og:title" content="加载动画工具">
<meta property="og:description" content="加载动画工具 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="加载动画工具，创建精美的CSS加载动画效果">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏳</text></svg>">
<meta name="robots" content="index, follow">
<script src="../i18n.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#a855f7;--pink:#ec4899;--cyan:#06b6d4;--orange:#f97316;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--green:#1a7f37;--red:#cf222e;--shadow:0 4px 24px rgba(0,0,0,.1)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.container{max-width:1000px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.85rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:5px 12px;font-size:.8rem}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;gap:16px}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;margin-bottom:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;margin-bottom:4px;font-weight:600;font-size:.85rem;color:var(--text2)}
.loader-box{display:flex;align-items:center;justify-content:center;width:100%;height:120px;background:var(--bg);border-radius:var(--radius);margin-bottom:8px}
.loader-label{text-align:center;font-size:.8rem;color:var(--text2)}
.loader-name{text-align:center;font-weight:600;font-size:.85rem;margin-top:4px}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.8);opacity:.5}}
@keyframes ripple{0%{transform:scale(0);opacity:1}100%{transform:scale(4);opacity:0}}
@keyframes wave{0%,40%,100%{transform:scaleY(.4)}20%{transform:scaleY(1)}}
@keyframes flip{0%{transform:perspective(120px) rotateX(0)}50%{transform:perspective(120px) rotateX(-180deg)}100%{transform:perspective(120px) rotateX(-360deg)}}
@keyframes orbit{0%{transform:rotate(0deg) translateX(20px) rotate(0deg)}100%{transform:rotate(360deg) translateX(20px) rotate(-360deg)}}
@keyframes morph{0%,100%{border-radius:50%;transform:rotate(0deg)}25%{border-radius:25% 50% 50% 50%;transform:rotate(90deg)}50%{border-radius:50% 25% 50% 50%;transform:rotate(180deg)}75%{border-radius:50% 50% 50% 25%;transform:rotate(270deg)}}
@keyframes typing{from{width:0}to{width:100%}}
@keyframes blink{0%,100%{border-color:var(--accent)}50%{border-color:transparent}}
@keyframes dots{0%,20%{content:'.'}40%{content:'..'}60%,100%{content:'...'}}
@keyframes gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes square{0%,70%,100%{transform:scale3d(1,1,1)}35%{transform:scale3d(0,0,1)}}
@keyframes grid{0%,100%{opacity:.3}50%{opacity:1}}
body,.container{animation:fadeIn .4s ease-out}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}.grid-3,.grid-4{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='⏳ 加载动画工具';
const $=id=>document.getElementById(id);
const APP=$('app');

function render(){
  let h=`<h1>⏳ 加载动画工具</h1><p class="subtitle">多种CSS加载动画效果，可直接复制代码</p>`;

  h+=`<div class="card"><h3 style="margin-bottom:16px">⭕ 旋转类</h3><div class="grid grid-4">`;
  const spinners=[
    {name:'基础旋转',html:`<div class="spinner"></div>`,code:`<div class="spinner"></div>`,css:`.spinner{width:40px;height:40px;border:3px solid #30363d;border-top-color:#3b82f6;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}`},
    {name:'双环旋转',html:`<div style="position:relative;width:40px;height:40px"><div style="position:absolute;inset:0;border:3px solid transparent;border-top-color:#3b82f6;border-radius:50%;animation:spin 1s linear infinite"></div><div style="position:absolute;inset:4px;border:3px solid transparent;border-top-color:#a855f7;border-radius:50%;animation:spin .6s linear infinite reverse"></div></div>`,code:`双环旋转`,css:`双层border旋转`},
    {name:'虚线旋转',html:`<div style="width:40px;height:40px;border:3px dashed var(--accent);border-radius:50%;animation:spin 3s linear infinite"></div>`,code:`虚线旋转`,css:`border-style:dashed`},
    {name:'渐变旋转',html:`<div style="width:40px;height:40px;border-radius:50%;background:conic-gradient(from 0deg,transparent,var(--accent));animation:spin 1s linear infinite;display:flex;align-items:center;justify-content:center"><div style="width:32px;height:32px;background:var(--bg);border-radius:50%"></div></div>`,code:`渐变旋转`,css:`conic-gradient`},
    {name:'点旋转',html:`<div style="width:40px;height:40px;position:relative;animation:spin 1.2s linear infinite"><div style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:8px;height:8px;background:var(--accent);border-radius:50%"></div><div style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:8px;height:8px;background:var(--accent);border-radius:50%;opacity:.4"></div><div style="position:absolute;left:0;top:50%;transform:translateY(-50%);width:8px;height:8px;background:var(--accent);border-radius:50%;opacity:.6"></div><div style="position:absolute;right:0;top:50%;transform:translateY(-50%);width:8px;height:8px;background:var(--accent);border-radius:50%;opacity:.2"></div></div>`,code:`点旋转`,css:`多元素旋转`},
    {name:'彩虹环',html:`<div style="width:40px;height:40px;border-radius:50%;background:conic-gradient(#f85149,#d29922,#3fb950,#3b82f6,#a855f7,#f85149);animation:spin 1.5s linear infinite;display:flex;align-items:center;justify-content:center"><div style="width:30px;height:30px;background:var(--bg);border-radius:50%"></div></div>`,code:`彩虹环`,css:`conic-gradient多色`}
  ];
  spinners.forEach(s=>{
    h+=`<div><div class="loader-box">${s.html}</div><div class="loader-name">${s.name}</div></div>`;
  });
  h+=`</div></div>`;

  h+=`<div class="card"><h3 style="margin-bottom:16px">📊 弹跳类</h3><div class="grid grid-4">`;
  const bouncers=[
    {name:'三点弹跳',html:`<div style="display:flex;gap:6px"><div style="width:12px;height:12px;background:var(--accent);border-radius:50%;animation:bounce 1.4s infinite ease-in-out both;animation-delay:-.32s"></div><div style="width:12px;height:12px;background:var(--accent);border-radius:50%;animation:bounce 1.4s infinite ease-in-out both;animation-delay:-.16s"></div><div style="width:12px;height:12px;background:var(--accent);border-radius:50%;animation:bounce 1.4s infinite ease-in-out both"></div></div>`,css:`@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}`},
    {name:'脉冲圆',html:`<div style="width:40px;height:40px;background:var(--accent);border-radius:50%;animation:pulse 1.5s infinite"></div>`,css:`@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.8);opacity:.5}}`},
    {name:'波纹效果',html:`<div style="position:relative;width:40px;height:40px"><div style="position:absolute;inset:0;border:2px solid var(--accent);border-radius:50%;animation:ripple 1.5s infinite"></div><div style="position:absolute;inset:0;border:2px solid var(--accent);border-radius:50%;animation:ripple 1.5s infinite .5s"></div></div>`,css:`@keyframes ripple{0%{transform:scale(0);opacity:1}100%{transform:scale(4);opacity:0}}`},
    {name:'翻转方块',html:`<div style="width:30px;height:30px;background:var(--accent);animation:flip 1.2s infinite"></div>`,css:`@keyframes flip{0%{transform:perspective(120px) rotateX(0)}50%{transform:perspective(120px) rotateX(-180deg)}100%{transform:perspective(120px) rotateX(-360deg)}}`},
    {name:'变形方块',html:`<div style="width:30px;height:30px;background:var(--accent);animation:morph 2s infinite ease-in-out"></div>`,css:`@keyframes morph{0%,100%{border-radius:50%;transform:rotate(0)}25%{border-radius:25% 50% 50% 50%;transform:rotate(90deg)}50%{border-radius:50% 25% 50% 50%;transform:rotate(180deg)}75%{border-radius:50% 50% 50% 25%;transform:rotate(270deg)}}`},
    {name:'网格脉冲',html:`<div style="display:grid;grid-template-columns:repeat(3,10px);gap:3px"><div style="width:10px;height:10px;background:var(--accent);animation:grid 1.2s infinite ease-in-out;animation-delay:0s"></div><div style="width:10px;height:10px;background:var(--accent);animation:grid 1.2s infinite ease-in-out;animation-delay:.1s"></div><div style="width:10px;height:10px;background:var(--accent);animation:grid 1.2s infinite ease-in-out;animation-delay:.2s"></div><div style="width:10px;height:10px;background:var(--accent);animation:grid 1.2s infinite ease-in-out;animation-delay:.1s"></div><div style="width:10px;height:10px;background:var(--accent);animation:grid 1.2s infinite ease-in-out;animation-delay:.2s"></div><div style="width:10px;height:10px;background:var(--accent);animation:grid 1.2s infinite ease-in-out;animation-delay:.3s"></div><div style="width:10px;height:10px;background:var(--accent);animation:grid 1.2s infinite ease-in-out;animation-delay:.2s"></div><div style="width:10px;height:10px;background:var(--accent);animation:grid 1.2s infinite ease-in-out;animation-delay:.3s"></div><div style="width:10px;height:10px;background:var(--accent);animation:grid 1.2s infinite ease-in-out;animation-delay:.4s"></div></div>`,css:`@keyframes grid{0%,100%{opacity:.3}50%{opacity:1}}`}
  ];
  bouncers.forEach(b=>{
    h+=`<div><div class="loader-box">${b.html}</div><div class="loader-name">${b.name}</div></div>`;
  });
  h+=`</div></div>`;

  h+=`<div class="card"><h3 style="margin-bottom:16px">📏 条形类</h3><div class="grid grid-4">`;
  const bars=[
    {name:'波浪条',html:`<div style="display:flex;align-items:end;gap:3px;height:40px"><div style="width:6px;background:var(--accent);animation:wave 1.2s infinite ease-in-out;animation-delay:0s;height:100%"></div><div style="width:6px;background:var(--accent);animation:wave 1.2s infinite ease-in-out;animation-delay:.1s;height:100%"></div><div style="width:6px;background:var(--accent);animation:wave 1.2s infinite ease-in-out;animation-delay:.2s;height:100%"></div><div style="width:6px;background:var(--accent);animation:wave 1.2s infinite ease-in-out;animation-delay:.3s;height:100%"></div><div style="width:6px;background:var(--accent);animation:wave 1.2s infinite ease-in-out;animation-delay:.4s;height:100%"></div></div>`,css:`@keyframes wave{0%,40%,100%{transform:scaleY(.4)}20%{transform:scaleY(1)}}`},
    {name:'进度条',html:`<div style="width:80%;height:6px;background:var(--border);border-radius:3px;overflow:hidden"><div style="width:40%;height:100%;background:linear-gradient(90deg,var(--accent),var(--purple));border-radius:3px;animation:progressBar 1.5s ease-in-out infinite"></div></div>`,css:`@keyframes progressBar{0%{width:0%;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0%;margin-left:100%}}`},
    {name:'条纹条',html:`<div style="width:80%;height:8px;background:var(--border);border-radius:4px;overflow:hidden"><div style="width:100%;height:100%;background:repeating-linear-gradient(90deg,var(--accent),var(--accent) 10px,transparent 10px,transparent 20px);background-size:200% 100%;animation:stripeBar 1s linear infinite"></div></div>`,css:`@keyframes stripeBar{0%{background-position:0 0}100%{background-position:40px 0}}`},
    {name:'弹性条',html:`<div style="width:80%;height:6px;background:var(--border);border-radius:3px;overflow:hidden"><div style="width:30%;height:100%;background:var(--green);border-radius:3px;animation:elasticBar 2s ease-in-out infinite"></div></div>`,css:`@keyframes elasticBar{0%{width:0;left:0}50%{width:80%}100%{width:0;left:100%}}`},
    {name:'呼吸条',html:`<div style="width:80%;height:8px;background:var(--border);border-radius:4px;overflow:hidden;position:relative"><div style="position:absolute;height:100%;background:linear-gradient(90deg,transparent,var(--accent),transparent);width:40%;animation:breatheBar 2s ease-in-out infinite"></div></div>`,css:`@keyframes breatheBar{0%,100%{left:-40%}50%{left:100%}}`},
    {name:'多段条',html:`<div style="width:80%;height:6px;background:var(--border);border-radius:3px;overflow:hidden;display:flex;gap:2px"><div style="flex:1;background:var(--accent);border-radius:3px;animation:segBar .8s infinite;animation-delay:0s"></div><div style="flex:1;background:var(--green);border-radius:3px;animation:segBar .8s infinite;animation-delay:.15s"></div><div style="flex:1;background:var(--yellow);border-radius:3px;animation:segBar .8s infinite;animation-delay:.3s"></div></div>`,css:`@keyframes segBar{0%,100%{opacity:.3;transform:scaleY(.5)}50%{opacity:1;transform:scaleY(1)}}`}
  ];
  bars.forEach(b=>{
    h+=`<div><div class="loader-box">${b.html}</div><div class="loader-name">${b.name}</div></div>`;
  });
  h+=`</div></div>`;

  h+=`<div class="card"><h3 style="margin-bottom:16px">✨ 特效类</h3><div class="grid grid-4">`;
  const specials=[
    {name:'轨道球',html:`<div style="width:50px;height:50px;position:relative"><div style="position:absolute;inset:0;border:2px solid var(--border);border-radius:50%"></div><div style="position:absolute;top:50%;left:50%;width:8px;height:8px;background:var(--accent);border-radius:50%;margin:-4px;animation:orbit 1.5s linear infinite"></div></div>`,css:`@keyframes orbit{0%{transform:rotate(0) translateX(20px) rotate(0)}100%{transform:rotate(360deg) translateX(20px) rotate(-360deg)}}`},
    {name:'呼吸灯',html:`<div style="width:20px;height:20px;background:var(--accent);border-radius:50%;box-shadow:0 0 0 0 rgba(59,130,246,.7);animation:glow 2s infinite"></div>`,css:`@keyframes glow{0%{box-shadow:0 0 0 0 rgba(59,130,246,.7)}70%{box-shadow:0 0 0 15px rgba(59,130,246,0)}100%{box-shadow:0 0 0 0 rgba(59,130,246,0)}}`},
    {name:'渐变背景',html:`<div style="width:80px;height:30px;border-radius:15px;background:linear-gradient(90deg,var(--accent),var(--purple),var(--pink),var(--accent));background-size:300% 100%;animation:gradient 2s ease infinite"></div>`,css:`@keyframes gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}`},
    {name:'打字效果',html:`<div style="font-family:monospace;font-size:.9rem;color:var(--accent);border-right:2px solid var(--accent);white-space:nowrap;overflow:hidden;width:0;animation:typing 2s steps(8) infinite, blink .8s step-end infinite alternate">Loading</div>`,css:`@keyframes typing{from{width:0}to{width:100%}}@keyframes blink{50%{border-color:transparent}}`},
    {name:'旋转方块组',html:`<div style="width:40px;height:40px;position:relative;animation:spin 2s linear infinite"><div style="position:absolute;width:16px;height:16px;background:var(--accent);top:0;left:12px;animation:square 1.2s infinite;animation-delay:0s"></div><div style="position:absolute;width:16px;height:16px;background:var(--green);top:12px;right:0;animation:square 1.2s infinite;animation-delay:.2s"></div><div style="position:absolute;width:16px;height:16px;background:var(--yellow);bottom:0;left:12px;animation:square 1.2s infinite;animation-delay:.4s"></div><div style="position:absolute;width:16px;height:16px;background:var(--red);top:12px;left:0;animation:square 1.2s infinite;animation-delay:.6s"></div></div>`,css:`@keyframes square{0%,70%,100%{transform:scale3d(1,1,1)}35%{transform:scale3d(0,0,1)}}`},
    {name:'DNA螺旋',html:`<div style="display:flex;gap:4px;align-items:center;height:40px"><div style="width:8px;height:8px;background:var(--accent);border-radius:50%;animation:dna 1.5s infinite ease-in-out;animation-delay:0s"></div><div style="width:8px;height:8px;background:var(--pink);border-radius:50%;animation:dna 1.5s infinite ease-in-out;animation-delay:.15s"></div><div style="width:8px;height:8px;background:var(--accent);border-radius:50%;animation:dna 1.5s infinite ease-in-out;animation-delay:.3s"></div><div style="width:8px;height:8px;background:var(--pink);border-radius:50%;animation:dna 1.5s infinite ease-in-out;animation-delay:.45s"></div><div style="width:8px;height:8px;background:var(--accent);border-radius:50%;animation:dna 1.5s infinite ease-in-out;animation-delay:.6s"></div></div>`,css:`@keyframes dna{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.3)}}`}
  ];
  specials.forEach(s=>{
    h+=`<div><div class="loader-box">${s.html}</div><div class="loader-name">${s.name}</div></div>`;
  });
  h+=`</div></div>`;

  h+=`<div class="card"><h3 style="margin-bottom:16px">📋 自定义配置</h3>`;
  h+=`<div class="grid grid-2"><div><label>动画颜色</label><input type="color" value="#3b82f6" id="colorPicker" onchange="updateColor(this.value)" style="height:40px;padding:4px"></div>`;
  h+=`<div><label>动画速度</label><input type="range" min="0.3" max="3" step="0.1" value="1" id="speedPicker" onchange="updateSpeed(this.value)"><div style="text-align:center;font-size:.8rem;color:var(--text2)">当前: <span id="speedVal">1</span>x</div></div></div>`;
  h+=`</div>`;
  APP.innerHTML=h;
}

function updateColor(color){
  document.querySelectorAll('.loader-box').forEach(box=>{
    box.querySelectorAll('[style*="var(--accent)"]').forEach(el=>{
      el.style.setProperty('--accent',color);
    });
  });
}
function updateSpeed(val){
  document.querySelectorAll('.loader-box *[style*="animation"]').forEach(el=>{
    const dur=parseFloat(el.style.animationDuration)||1;
    el.style.animationDuration=(dur/parseFloat(val))+'s';
  });
  $('speedVal').textContent=val;
}

render();
</script>
</body>
</html>
