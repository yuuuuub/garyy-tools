<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐱🐶 宠物年龄换算器</title>
<meta name="description" content="宠物年龄换算器，将宠物年龄转换为人类年龄">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {--bg: #f5f5f5; --card-bg: #fff; --text: #333; --text-secondary: #666;
--border: #e0e0e0; --accent: #f97316; --accent-hover: #ea580c;
--tag-bg: #fff3e0; --tag-text: #e65100; --shadow: 0 2px 12px rgba(0,0,0,0.08);
--table-stripe: #fafafa; --input-bg: #fff; --stage-bg: #f8f9fa}
[data-theme="dark"] {--bg: #1a1a2e; --card-bg: #16213e; --text: #e0e0e0; --text-secondary: #a0a0a0;
--border: #2a2a4a; --accent: #f97316; --accent-hover: #fb923c;
--tag-bg: #2d1f0e; --tag-text: #f97316; --shadow: 0 2px 12px rgba(0,0,0,0.3);
--table-stripe: #1a2744; --input-bg: #0f3460; --stage-bg: #16213e}
body {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', Roboto, 'Helvetica Neue', sans-serif;
background: var(--bg); color: var(--text); min-height: 100vh;
padding: 16px; line-height: 1.6;
transition: background 0.3s, color 0.3s}
.container { max-width: 600px; margin: 0 auto; }
header {text-align: center; padding: 24px 0 16px;
display: flex; align-items: center; justify-content: space-between}
h1 { font-size: 1.6rem; font-weight: 700; }
.theme-toggle {background: var(--card-bg); border: 1px solid var(--border);
border-radius: 50%; width: 40px; height: 40px; display: flex;
align-items: center; justify-content: center; cursor: pointer;
font-size: 1.2rem; color: var(--text); transition: all 0.2s}
.theme-toggle:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.card {background: var(--card-bg); border-radius: 16px; padding: 24px;
margin-bottom: 16px; box-shadow: var(--shadow);
border: 1px solid var(--border)}
.card-title {font-size: 1.1rem; font-weight: 600; margin-bottom: 16px;
display: flex; align-items: center; gap: 8px}
.pet-type-selector {display: flex; gap: 12px; margin-bottom: 20px}
.pet-type-btn {flex: 1; padding: 14px; border: 2px solid var(--border); border-radius: 12px;
background: var(--card-bg); cursor: pointer; text-align: center;
font-size: 1.5rem; font-weight: 600; transition: all 0.2s; color: var(--text)}
.pet-type-btn:hover { border-color: var(--accent); }
.pet-type-btn.active { border-color: var(--accent); background: var(--tag-bg); }
.pet-type-btn span { display: block; font-size: 0.8rem; font-weight: 400; margin-top: 4px;
color: var(--text-secondary); }
.input-group { margin-bottom: 16px; }
.input-group label {display: block; font-size: 0.85rem; font-weight: 500;
margin-bottom: 6px; color: var(--text-secondary)}
.input-row { display: flex; gap: 12px; }
.input-field {flex: 1; padding: 12px 14px; border: 2px solid var(--border);
border-radius: 10px; font-size: 1rem; background: var(--input-bg);
color: var(--text); transition: border-color 0.2s; outline: none;
width: 100%}
.input-field:focus { border-color: var(--accent); }
.size-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
.size-btn {padding: 10px 8px; border: 2px solid var(--border); border-radius: 10px;
background: var(--card-bg); cursor: pointer; text-align: center;
font-size: 0.85rem; font-weight: 500; transition: all 0.2s; color: var(--text)}
.size-btn:hover { border-color: var(--accent); }
.size-btn.active { border-color: var(--accent); background: var(--tag-bg); color: var(--tag-text); }
.result {text-align: center; padding: 24px 16px; background: linear-gradient(135deg, var(--tag-bg), var(--card-bg));
border-radius: 12px; margin: 16px 0}
.result-age { font-size: 2.4rem; font-weight: 800; color: var(--accent); }
.result-stage { font-size: 1.1rem; margin-top: 4px; color: var(--text-secondary); }
.result-generation {display: inline-block; margin-top: 8px; padding: 6px 16px;
background: var(--accent); color: #fff; border-radius: 20px;
font-size: 0.9rem; font-weight: 600}
.stage-bar {display: flex; height: 8px; border-radius: 4px; overflow: hidden;
margin-top: 12px; background: var(--border)}
.stage-bar .segment {transition: width 0.5s ease}
.stage-bar .puppy { background: #4ade80; }
.stage-bar .young { background: #60a5fa; }
.stage-bar .adult { background: #fbbf24; }
.stage-bar .senior { background: #f87171; }
.stage-indicator {position: relative; margin-top: -14px; font-size: 0.75rem}
.stage-indicator .marker {position: absolute; transform: translateX(-50%); font-size: 1rem}
.comparison-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.comparison-table th, .comparison-table td {padding: 10px 12px; text-align: center; border-bottom: 1px solid var(--border)}
.comparison-table th {font-weight: 600; font-size: 0.8rem; color: var(--text-secondary);
background: var(--table-stripe)}
.comparison-table tr:nth-child(even) { background: var(--table-stripe); }
.comparison-table td:first-child { font-weight: 600; }
.table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.note { font-size: 0.8rem; color: var(--text-secondary); margin-top: 12px; text-align: center; }
.hidden { display: none !important; }
footer { text-align: center; padding: 16px; font-size: 0.8rem; color: var(--text-secondary); }
@media (max-width: 400px) {body { padding: 8px; }
.card { padding: 16px; }
h1 { font-size: 1.3rem; }
.size-options { grid-template-columns: repeat(2, 1fr); }
.result-age { font-size: 2rem; }}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="🐱🐶 宠物年龄换算器">
  <meta property="og:description" content="宠物年龄换算器，将宠物年龄转换为人类年龄">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/pet-age-calc/">
</head>
<body>
<div class="container">
  <header>
    <h1>🐱🐶 宠物年龄换算器</h1>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题" id="themeBtn">🌙</button>
  </header>


  <div class="card">
    <div class="card-title">🐾 选择宠物类型</div>
    <div class="pet-type-selector">
      <button class="pet-type-btn active" data-pet="dog" onclick="selectPet('dog')">
        🐶<span>狗狗</span>
      </button>
      <button class="pet-type-btn" data-pet="cat" onclick="selectPet('cat')">
        🐱<span>猫咪</span>
      </button>
    </div>


    <div id="sizeSection">
      <div class="card-title">📏 狗狗体型</div>
      <div class="size-options">
        <button class="size-btn active" data-size="small" onclick="selectSize('small')">🐕 小型犬<br><small>&lt;9 kg</small></button>
        <button class="size-btn" data-size="medium" onclick="selectSize('medium')">🐕 中型犬<br><small>9-23 kg</small></button>
        <button class="size-btn" data-size="large" onclick="selectSize('large')">🐕‍🦺 大型犬<br><small>23-41 kg</small></button>
        <button class="size-btn" data-size="giant" onclick="selectSize('giant')">🦮 巨型犬<br><small>&gt;41 kg</small></button>
      </div>
    </div>


    <div class="card-title">🎂 宠物年龄</div>
    <div class="input-row">
      <div class="input-group" style="flex:1">
        <label for="yearsInput">年</label>
        <input type="number" id="yearsInput" class="input-field" min="0" max="30" value="2" placeholder="年" oninput="calculate()">
      </div>
      <div class="input-group" style="flex:1">
        <label for="monthsInput">月</label>
        <input type="number" id="monthsInput" class="input-field" min="0" max="11" value="0" placeholder="月" oninput="calculate()">
      </div>
    </div>


    <div class="result hidden" id="resultSection">
      <div style="font-size:0.9rem;color:var(--text-secondary)">你的宠物相当于人类的</div>
      <div class="result-age" id="resultAge">0 岁</div>
      <div class="result-stage" id="resultStage"></div>
      <div class="result-generation" id="resultGeneration"></div>
      <div class="stage-bar" id="stageBar">
        <div class="segment puppy" id="segPuppy" style="width:0%"></div>
        <div class="segment young" id="segYoung" style="width:0%"></div>
        <div class="segment adult" id="segAdult" style="width:0%"></div>
        <div class="segment senior" id="segSenior" style="width:0%"></div>
      </div>
    </div>
  </div>


  <div class="card">
    <div class="card-title">📊 年龄对照表</div>
    <div class="table-wrapper">
      <table class="comparison-table" id="comparisonTable">
        <thead>
          <tr>
            <th>宠物年龄</th>
            <th>人类等效年龄</th>
            <th>生命阶段</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="note">
      * 本换算基于兽医学广泛使用的参考标准，仅作参考。<br>
      不同品种和个体存在差异，请定期带宠物做健康检查。
    </div>
  </div>

  <footer>
    宠物年龄换算器 &copy; 2026 · 关爱毛孩子的每一个生命阶段
  </footer>
</div>

<script>
  let petType = 'dog';
  let dogSize = 'medium';
  let theme = localStorage.getItem('theme') || 'light';
  const DOG_RATIO = { small: 4, medium: 4, large: 5, giant: 6 };
  const DOG_FIRST_TWO = 10.5;
  document.addEventListener('DOMContentLoaded', () => {
    applyTheme();
    calculate();
  });
  function toggleTheme() {
    theme = theme === 'light' ? 'dark' : 'light';
    localStorage.setItem('theme', theme);
    applyTheme();
  }
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('themeBtn').textContent = theme === 'light' ? '🌙' : '☀️';
  }
  function selectPet(type) {
    petType = type;
    document.querySelectorAll('.pet-type-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-pet="${type}"]`).classList.add('active');
    document.getElementById('sizeSection').style.display = type === 'dog' ? '' : 'none';
    calculate();
  }
  function selectSize(size) {
    dogSize = size;
    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-size="${size}"]`).classList.add('active');
    calculate();
  }
  function calculate() {
    const years = parseFloat(document.getElementById('yearsInput').value) || 0;
    const months = parseFloat(document.getElementById('monthsInput').value) || 0;
    const totalYears = years + months / 12;
    if (totalYears <= 0 && years === 0 && months === 0) {
      document.getElementById('resultSection').classList.add('hidden');
      return;
    }
    let humanAge;
    if (petType === 'dog') {
      if (totalYears <= 2) {
        humanAge = totalYears * DOG_FIRST_TWO;
      } else {
        humanAge = 2 * DOG_FIRST_TWO + (totalYears - 2) * DOG_RATIO[dogSize];
      }
    } else {
      if (totalYears <= 1) {
        humanAge = totalYears * 15;
      } else if (totalYears <= 2) {
        humanAge = 15 + (totalYears - 1) * 9;
      } else {
        humanAge = 15 + 9 + (totalYears - 2) * 4;
      }
    }
    humanAge = Math.round(humanAge * 10) / 10;
    let stage, stageEmoji;
    if (totalYears <= 1) {
      stage = '幼年'; stageEmoji = '🍼';
    } else if (totalYears <= (petType === 'cat' ? 4 : 3)) {
      stage = '青年'; stageEmoji = '🌟';
    } else if (totalYears <= (petType === 'cat' ? 10 : 8)) {
      stage = '中年'; stageEmoji = '🏠';
    } else {
      stage = '老年'; stageEmoji = '🧓';
    }
    const maxPetAge = petType === 'cat' ? 15 : 12;
    const clampedAge = Math.min(totalYears, maxPetAge);
    const pct = (clampedAge / maxPetAge) * 100;
    let puppyPct, youngPct, adultPct, seniorPct;
    if (petType === 'cat') {
      puppyPct = Math.min(clampedAge, 1) / maxPetAge * 100;
      youngPct = clampedAge > 1 ? Math.min(clampedAge - 1, 3) / maxPetAge * 100 : 0;
      adultPct = clampedAge > 4 ? Math.min(clampedAge - 4, 6) / maxPetAge * 100 : 0;
      seniorPct = clampedAge > 10 ? (clampedAge - 10) / maxPetAge * 100 : 0;
    } else {
      puppyPct = Math.min(clampedAge, 1) / maxPetAge * 100;
      youngPct = clampedAge > 1 ? Math.min(clampedAge - 1, 2) / maxPetAge * 100 : 0;
      adultPct = clampedAge > 3 ? Math.min(clampedAge - 3, 5) / maxPetAge * 100 : 0;
      seniorPct = clampedAge > 8 ? (clampedAge - 8) / maxPetAge * 100 : 0;
    }
    document.getElementById('segPuppy').style.width = puppyPct + '%';
    document.getElementById('segYoung').style.width = youngPct + '%';
    document.getElementById('segAdult').style.width = adultPct + '%';
    document.getElementById('segSenior').style.width = seniorPct + '%';
    const humanAgeInt = Math.round(humanAge);
    let birthYear = 2026 - humanAgeInt;
    let generation;
    if (birthYear >= 2010) generation = '10后';
    else if (birthYear >= 2000) generation = '00后';
    else if (birthYear >= 1990) generation = '90后';
    else if (birthYear >= 1980) generation = '80后';
    else if (birthYear >= 1970) generation = '70后';
    else if (birthYear >= 1960) generation = '60后';
    else generation = '50后及更早';
    document.getElementById('resultSection').classList.remove('hidden');
    document.getElementById('resultAge').textContent = humanAge + ' 岁';
    document.getElementById('resultStage').textContent = stageEmoji + ' ' + stage + '阶段';
    document.getElementById('resultGeneration').textContent =
      '🧬 你家毛孩子已经是 ' + generation + ' 了';
    renderTable(totalYears);
  }
  function renderTable(currentAge) {
    const tbody = document.getElementById('tableBody');
    const milestones = [0.5, 1, 2, 3, 5, 7, 10, 15, 20];
    let html = '';
    milestones.forEach(petAge => {
      let hAge;
      if (petType === 'dog') {
        if (petAge <= 2) {
          hAge = petAge * DOG_FIRST_TWO;
        } else {
          hAge = 2 * DOG_FIRST_TWO + (petAge - 2) * DOG_RATIO[dogSize];
        }
      } else {
        if (petAge <= 1) {
          hAge = petAge * 15;
        } else if (petAge <= 2) {
          hAge = 15 + (petAge - 1) * 9;
        } else {
          hAge = 24 + (petAge - 2) * 4;
        }
      }
      hAge = Math.round(hAge);
      let stage;
      if (petAge <= 1) stage = '🍼 幼年';
      else if (petAge <= (petType === 'cat' ? 4 : 3)) stage = '🌟 青年';
      else if (petAge <= (petType === 'cat' ? 10 : 8)) stage = '🏠 中年';
      else stage = '🧓 老年';
      const highlight = Math.abs(petAge - Math.round(currentAge)) < 0.1;
      html += `<tr${highlight ? ' style="background:var(--tag-bg);font-weight:700"' : ''}>`;
      html += `<td>${petAge} 岁</td><td>≈ ${hAge} 岁</td><td>${stage}</td></tr>`;
    });
    tbody.innerHTML = html;
  }
</script>
<script src="../i18n.js" defer>
document.getElementById("yearsInput").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();toggleTheme();}});
</script>
</body>
</html>
