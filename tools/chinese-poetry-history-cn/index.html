<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中国古诗发展史 - Chinese Poetry History</title>
<meta name="description" content="中国古诗发展史 - 从先秦到近代，了解中国诗歌的千年演变历程">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px;scroll-behavior:smooth}
.container{max-width:900px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem;font-weight:700}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.era-nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.era-btn{padding:6px 14px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.8rem;color:var(--text);transition:all .2s}
.era-btn:hover,.era-btn.active{border-color:var(--blue);color:var(--blue);background:rgba(59,130,246,0.1)}
.era-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;cursor:pointer;transition:all .2s}
.era-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.era-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.era-title{font-size:1.1rem;font-weight:700;color:var(--blue)}
.era-period{font-size:.8rem;color:var(--text2);background:var(--bg);padding:2px 8px;border-radius:4px}
.era-desc{font-size:.9rem;color:var(--text2);line-height:1.6;margin-bottom:12px}
.era-content{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.era-card.expanded .era-content{display:block}
.subsection{margin-bottom:12px}
.subsection h4{font-size:.9rem;color:var(--green);margin-bottom:6px}
.subsection p,.subsection li{font-size:.85rem;line-height:1.6;color:var(--text2)}
.subsection ul{padding-left:16px}
.subsection li{margin-bottom:4px}
.poet-card{display:inline-block;padding:6px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;margin:3px;font-size:.8rem}
.poet-card .name{font-weight:700;color:var(--text)}
.poet-card .title{font-size:.7rem;color:var(--text2)}
.work-excerpt{padding:10px;background:var(--bg);border-left:3px solid var(--blue);margin:8px 0;font-size:.85rem;line-height:1.8;border-radius:0 6px 6px 0}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:16px 0}
.stat-card{text-align:center;padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:8px}
.stat-num{font-size:1.5rem;font-weight:700;color:var(--blue)}
.stat-label{font-size:.75rem;color:var(--text2);margin-top:4px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>📚 中国古诗发展史</h1>
<p class="sub">从先秦到近代 — 中国诗歌的千年演变</p>

<div class="stats-grid">
<div class="stat-card"><div class="stat-num">3000+</div><div class="stat-label">年历史</div></div>
<div class="stat-card"><div class="stat-num">8</div><div class="stat-label">主要时期</div></div>
<div class="stat-card"><div class="stat-num">500+</div><div class="stat-label">代表诗人</div></div>
<div class="stat-card"><div class="stat-num">5万+</div><div class="stat-label">传世诗作</div></div>
</div>

<div class="era-nav" id="eraNav"></div>
<div id="eraList"></div>
</div>
<script src="../i18n.js" defer></script>
<script>
var eras=[
{
id:'preqin',name:'先秦诗歌',period:'约前11世纪-前221年',emoji:'🏛️',
desc:'中国诗歌的源头，以《诗经》和《楚辞》为代表，奠定了中国诗歌现实主义和浪漫主义两大传统。',
features:['《诗经》：中国最早的诗歌总集，收录305篇','《楚辞》：屈原开创，浪漫主义传统','四言为主的诗歌形式','赋、比、兴的表现手法','关注社会现实与个人情感'],
poets:[{name:'屈原',title:'楚辞开创者',desc:'战国时期楚国诗人，创立楚辞体，代表作《离骚》《九歌》'}],
works:[{title:'关雎',author:'诗经',text:'关关雎鸠，在河之洲。窈窕淑女，君子好逑。'},{title:'离骚（节选）',author:'屈原',text:'路漫漫其修远兮，吾将上下而求索。'}]
},
{
id:'hanfu',name:'两汉乐府',period:'前206年-220年',emoji:'🎵',
desc:'汉代设立乐府机构采集民歌，乐府诗成为重要诗歌形式，五言诗逐渐成熟。',
features:['乐府机构采集民间诗歌','五言诗逐渐成熟','叙事诗发展（《孔雀东南飞》）','反映社会现实与民生疾苦','语言质朴自然'],
poets:[{name:'司马相如',title:'汉赋大家',desc:'西汉辞赋家，代表作《子虚赋》《上林赋》'},{name:'曹操',title:'建安文学领袖',desc:'东汉末年政治家、诗人，代表作《短歌行》《观沧海》'}],
works:[{title:'长歌行',author:'汉乐府',text:'百川东到海，何时复西归？少壮不努力，老大徒伤悲。'},{title:'孔雀东南飞（节选）',author:'汉乐府',text:'孔雀东南飞，五里一徘徊。十三能织素，十四学裁衣。'}]
},
{
id:'weijin',name:'魏晋南北朝',period:'220年-589年',emoji:'🎋',
desc:'建安文学慷慨悲凉，陶渊明开创田园诗派，谢灵运开创山水诗派，诗歌走向自觉。',
features:['建安风骨：慷慨悲凉','田园诗派（陶渊明）','山水诗派（谢灵运）','骈文与诗歌并行','诗歌理论自觉（《文心雕龙》）'],
poets:[{name:'陶渊明',title:'田园诗鼻祖',desc:'东晋诗人，开创田园诗派，代表作《归园田居》《饮酒》'},{name:'曹植',title:'建安之杰',desc:'曹操之子，才高八斗，代表作《洛神赋》《白马篇》'}],
works:[{title:'饮酒·其五',author:'陶渊明',text:'结庐在人境，而无车马喧。问君何能尔？心远地自偏。采菊东篱下，悠然见南山。'}]
},
{
id:'tang',name:'唐代诗歌',period:'618年-907年',emoji:'🌙',
desc:'中国诗歌的黄金时代，诗体完备，名家辈出，流派纷呈，唐诗成为中国文学的巅峰。',
features:['诗体完备：绝句、律诗、古风','初唐四杰开启新风','盛唐气象：李白、杜甫','中唐白居易新乐府运动','晚唐李杜商隐的细腻'],
poets:[{name:'李白',title:'诗仙',desc:'浪漫主义诗人，诗风豪放飘逸，代表作《将进酒》《蜀道难》'},{name:'杜甫',title:'诗圣',desc:'现实主义诗人，诗风沉郁顿挫，代表作《春望》《登高》'},{name:'王维',title:'诗佛',desc:'山水田园诗人，诗中有画，代表作《山居秋暝》《鹿柴》'}],
works:[{title:'将进酒（节选）',author:'李白',text:'君不见，黄河之水天上来，奔流到海不复回。天生我材必有用，千金散尽还复来。'},{title:'春望',author:'杜甫',text:'国破山河在，城春草木深。感时花溅泪，恨别鸟惊心。'}]
},
{
id:'songci',name:'宋代诗词',period:'960年-1279年',emoji:'🌸',
desc:'词成为宋代文学的代表，豪放派与婉约派并峙，宋诗以理趣见长。',
features:['词的鼎盛：豪放派与婉约派','苏轼开创豪放词风','李清照婉约词宗','宋诗以理趣、议论见长','柳永发展慢词'],
poets:[{name:'苏轼',title:'豪放派代表',desc:'北宋文学家，诗词文书画全能，代表作《水调歌头》《念奴娇》'},{name:'李清照',title:'婉约词宗',desc:'宋代女词人，词风婉约细腻，代表作《如梦令》《声声慢》'}],
works:[{title:'水调歌头',author:'苏轼',text:'明月几时有？把酒问青天。但愿人长久，千里共婵娟。'},{title:'如梦令',author:'李清照',text:'昨夜雨疏风骤，浓睡不消残酒。试问卷帘人，却道海棠依旧。'}]
},
{
id:'yuanqu',name:'元代散曲',period:'1271年-1368年',emoji:'🎭',
desc:'元曲成为新的文学形式，散曲与杂剧并行发展，语言通俗活泼。',
features:['散曲：小令与套数','语言通俗直白','关汉卿等杂剧大师','马致远等散曲名家','与戏曲艺术紧密结合'],
poets:[{name:'马致远',title:'曲状元',desc:'元代散曲家，代表作《天净沙·秋思》'},{name:'关汉卿',title:'元曲四大家之首',desc:'元代杂剧作家，代表作《窦娥冤》'}],
works:[{title:'天净沙·秋思',author:'马致远',text:'枯藤老树昏鸦，小桥流水人家，古道西风瘦马。夕阳西下，断肠人在天涯。'}]
},
{
id:'ming',name:'明代诗歌',period:'1368年-1644年',emoji:'📜',
desc:'明代诗歌以复古为主流，前后七子主张"文必秦汉，诗必盛唐"，后期出现性灵派。',
features:['前后七子复古运动','唐宋派的反对','公安派性灵说','市民文学兴起','诗歌与戏曲小说并行'],
poets:[{name:'高启',title:'明初诗人',desc:'明代诗人，诗风豪迈，代表作《登金陵雨花台望大江》'},{name:'唐寅',title:'江南才子',desc:'明代画家、诗人，代表作《桃花庵歌》'}],
works:[{title:'桃花庵歌（节选）',author:'唐寅',text:'桃花坞里桃花庵，桃花庵下桃花仙。桃花仙人种桃树，又摘桃花换酒钱。'}]
},
{
id:'qing',name:'清代诗词',period:'1644年-1912年',emoji:'🏮',
desc:'清代诗词呈现复兴之势，流派众多，纳兰性德、龚自珍等名家辈出。',
features:['清诗流派众多','纳兰性德的悼亡词','龚自珍的批判精神','同光体与新派诗','古典诗歌的总结与终结'],
poets:[{name:'纳兰性德',title:'清词三大家之一',desc:'清代词人，词风真挚自然，代表作《长相思》《木兰花慢》'},{name:'龚自珍',title:'近代启蒙思想家',desc:'清代诗人，代表作《己亥杂诗》'}],
works:[{title:'长相思',author:'纳兰性德',text:'山一程，水一程，身向榆关那畔行，夜深千帐灯。'},{title:'己亥杂诗',author:'龚自珍',text:'落红不是无情物，化作春泥更护花。'}]
}
];

function renderNav(){
var nav=document.getElementById('eraNav');
var html='';
eras.forEach(function(era){
html+='<button class="era-btn" onclick="scrollToEra(\''+era.id+'\')">'+era.emoji+' '+era.name+'</button>';
});
nav.innerHTML=html;
}

function renderEras(){
var list=document.getElementById('eraList');
var html='';
eras.forEach(function(era){
html+='<div class="era-card" id="era-'+era.id+'" onclick="toggleEra(this)">';
html+='<div class="era-header"><div class="era-title">'+era.emoji+' '+era.name+'</div>';
html+='<div class="era-period">'+era.period+'</div></div>';
html+='<div class="era-desc">'+era.desc+'</div>';
html+='<div class="era-content">';

html+='<div class="subsection"><h4>📌 时代特征</h4><ul>';
era.features.forEach(function(f){html+='<li>'+f+'</li>';});
html+='</ul></div>';

html+='<div class="subsection"><h4>✍️ 代表诗人</h4>';
era.poets.forEach(function(p){
html+='<div class="poet-card"><div class="name">'+p.name+'</div><div class="title">'+p.title+'</div></div>';
});
html+='</div>';

era.poets.forEach(function(p){
html+='<div class="subsection"><p><strong>'+p.name+'</strong>（'+p.title+'）：'+p.desc+'</p></div>';
});

html+='<div class="subsection"><h4>📖 名篇选读</h4>';
era.works.forEach(function(w){
html+='<div class="work-excerpt"><strong>《'+w.title+'》</strong> '+w.author+'<br>'+w.text+'</div>';
});
html+='</div>';

html+='</div></div>';
});
list.innerHTML=html;
}

function toggleEra(el){
el.classList.toggle('expanded');
}

function scrollToEra(id){
var el=document.getElementById('era-'+id);
if(el){
el.scrollIntoView({behavior:'smooth',block:'start'});
if(!el.classList.contains('expanded'))el.classList.add('expanded');
document.querySelectorAll('.era-btn').forEach(function(b){b.classList.remove('active');});
}
}

renderNav();
renderEras();
</script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button>
<script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body></html>
