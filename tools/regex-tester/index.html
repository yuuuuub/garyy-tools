<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正则测试器</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--gold:#f59e0b;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:0 16px;min-height:100vh}
.container{max-width:880px;margin:auto;padding-bottom:50px}
header{text-align:center;padding:28px 0 16px}
header h1{font-size:1.3rem}
header p{color:var(--text2);font-size:.85rem;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card h3{font-size:.85rem;color:var(--text2);margin-bottom:10px}
.input-group{margin-bottom:12px}
.input-group label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px}
.input-group input,.input-group textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.85rem;outline:none;font-family:monospace}
.input-group input:focus,.input-group textarea:focus{border-color:var(--blue)}
.input-group textarea{min-height:120px;resize:vertical}
.flags{display:flex;gap:12px;margin-bottom:12px}
.flag-item{display:flex;align-items:center;gap:4px;font-size:.8rem;color:var(--text2);cursor:pointer}
.flag-item input{accent-color:var(--blue)}
.test-result{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;min-height:80px;font-family:monospace;font-size:.85rem;line-height:1.8;white-space:pre-wrap;word-break:break-all}
.test-result mark{background:rgba(245,158,11,.35);color:var(--text);border-radius:3px;padding:0 2px}
.match-info{display:flex;gap:16px;margin:8px 0;font-size:.82rem}
.match-info span{color:var(--text2)}
.match-info strong{color:var(--gold)}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.preset-btn{padding:4px 10px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--text2);cursor:pointer;font-size:.75rem;transition:all .15s}
.preset-btn:hover{border-color:var(--blue);color:var(--blue)}
.match-list{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;max-height:160px;overflow-y:auto;font-size:.82rem}
.match-list .m-item{padding:3px 0;color:var(--text);border-bottom:1px solid var(--border)}
.match-list .m-item:last-child{border-bottom:none}
.match-list .m-idx{color:var(--text2);margin-right:8px}
.err-msg{color:var(--red);font-size:.82rem;margin-top:4px;min-height:20px}
</style>
</head>
<body>
<div class="container">
<header><h1>正则测试器</h1><p>正则表达式在线测试</p></header>
<div class="card">
<div class="input-group">
<label>正则表达式</label>
<input type="text" id="regex-input" placeholder="/表达式/修饰符 或直接输入表达式" value="\d{3,4}">
</div>
<div class="flags">
<label class="flag-item"><input type="checkbox" id="flag-g" checked> g (全局)</label>
<label class="flag-item"><input type="checkbox" id="flag-i"> i (忽略大小写)</label>
<label class="flag-item"><input type="checkbox" id="flag-m"> m (多行)</label>
<label class="flag-item"><input type="checkbox" id="flag-s"> s (dotAll)</label>
</div>
<div class="presets">
<span style="color:var(--text2);font-size:.75rem;line-height:28px">常用: </span>
<button class="preset-btn" data-pattern="\d+">数字 \d+</button>
<button class="preset-btn" data-pattern="[a-zA-Z]+">字母 [a-zA-Z]+</button>
<button class="preset-btn" data-pattern="\w+@\w+\.\w+">邮箱</button>
<button class="preset-btn" data-pattern="1[3-9]\d{9}">手机号</button>
<button class="preset-btn" data-pattern="https?://[^\s]+">URL</button>
<button class="preset-btn" data-pattern="\d{4}-\d{2}-\d{2}">日期</button>
<button class="preset-btn" data-pattern="\d{17}[\dXx]">身份证</button>
</div>
</div>
<div class="card">
<h3>测试文本</h3>
<div class="input-group">
<textarea id="test-text" placeholder="在此输入要测试的文本...">联系方式: 13800138000 或 email@example.com
日期: 2024-01-15
网站: https://example.com
邮编: 100010
身份证: 110101199001011234</textarea>
</div>
</div>
<div class="card">
<div class="match-info">
<span>匹配结果: <strong id="match-count">0</strong> 个</span>
<span>用时: <strong id="match-time">0</strong> ms</span>
</div>
<div class="test-result" id="test-result"></div>
<div class="err-msg" id="err-msg"></div>
<div class="match-list" id="match-list" style="margin-top:8px"><div style="color:var(--text2);font-size:.8rem;text-align:center;padding:8px">暂无匹配</div></div>
</div>
</div>

<script>
(function(){
'use strict';

const $ = id => document.getElementById(id);
const regexInput = $('regex-input');
const testText = $('test-text');
const testResult = $('test-result');
const matchCount = $('match-count');
const matchTime = $('match-time');
const matchList = $('match-list');
const errMsg = $('err-msg');
const flagG = $('flag-g');
const flagI = $('flag-i');
const flagM = $('flag-m');
const flagS = $('flag-s');

function getFlags() {
  let f = '';
  if(flagG.checked) f += 'g';
  if(flagI.checked) f += 'i';
  if(flagM.checked) f += 'm';
  if(flagS.checked) f += 's';
  return f;
}

function testRegex() {
  const pattern = regexInput.value.trim();
  const text = testText.value;
  const flags = getFlags();

  if(!pattern) {
    testResult.textContent = text;
    matchCount.textContent = '0';
    matchTime.textContent = '0';
    matchList.innerHTML = '<div style="color:var(--text2);font-size:.8rem;text-align:center;padding:8px">请输入正则表达式</div>';
    errMsg.textContent = '';
    return;
  }

  try {
    const regex = new RegExp(pattern, flags);
    const start = performance.now();

    let matches = [];
    let match;

    regex.lastIndex = 0;

    if(flags.includes('g')) {
      let result;
      while((result = regex.exec(text)) !== null) {
        matches.push({ text: result[0], index: result.index });
        if(result.index === regex.lastIndex) regex.lastIndex++;
      }
    } else {
      match = regex.exec(text);
      if(match) {
        matches.push({ text: match[0], index: match.index });
      }
    }

    matches.sort(function(a,b){ return a.index - b.index; });

    let html = '';
    let pos = 0;
    matches.forEach(function(m) {
      if(m.index < pos) return;
      html += escapeHtml(text.substring(pos, m.index));
      html += '<mark>' + escapeHtml(m.text) + '</mark>';
      pos = m.index + m.text.length;
    });
    html += escapeHtml(text.substring(pos));
    testResult.innerHTML = html || escapeHtml(text);

    const elapsed = Math.round(performance.now() - start);
    matchCount.textContent = matches.length;
    matchTime.textContent = elapsed;
    errMsg.textContent = '';

    if(matches.length === 0) {
      matchList.innerHTML = '<div style="color:var(--text2);font-size:.8rem;text-align:center;padding:8px">无匹配结果</div>';
    } else {
      let mhtml = '';
      matches.forEach(function(m, i) {
        const preview = m.text.length > 60 ? m.text.substring(0,60) + '...' : m.text;
        mhtml += '<div class="m-item"><span class="m-idx">#' + (i+1) + '</span>位置 ' + m.index + ': "' + escapeHtml(preview) + '"</div>';
      });
      matchList.innerHTML = mhtml;
    }

  } catch(e) {
    errMsg.textContent = '正则错误: ' + e.message;
    testResult.textContent = text;
    matchCount.textContent = '0';
    matchTime.textContent = '0';
    matchList.innerHTML = '<div style="color:var(--text2);font-size:.8rem;text-align:center;padding:8px">正则表达式有误</div>';
  }
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

let debounceTimer = null;
function debounceTest() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(testRegex, 200);
}

regexInput.addEventListener('input', debounceTest);
testText.addEventListener('input', debounceTest);
document.querySelectorAll('.flags input').forEach(function(el) {
  el.addEventListener('change', debounceTest);
});

document.querySelectorAll('.preset-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    regexInput.value = this.dataset.pattern;
    testRegex();
  });
});

testRegex();

})();
</script>
<script src="../i18n.js"></script>
</body>
</html>
