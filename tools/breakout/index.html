<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>打砖块</title>
<meta name="description" content="经典打砖块游戏，控制挡板反弹球击碎所有砖块">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da}

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;user-select:nonepadding:16px;scroll-behavior:smooth;}
h1{font-size:1.5rem;margin-bottom:10px;color:#3b82f6}
canvas{background:var(--bg);border:2px solid #30363d;border-radius:8px;touch-action:none}
.info{margin-top:10px;font-size:0.9rem;color:#8b949e}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="打砖块">
  <meta property="og:description" content="经典打砖块游戏，控制挡板反弹球击碎所有砖块">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/breakout/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1>🧱 打砖块</h1>
<canvas id="game" width="480" height="400"></canvas>
<div class="info">鼠标/触摸移动挡板</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const colors=['#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#8b5cf6'];
let paddle={x:W/2-40,y:H-30,w:80,h:12};
let ball={x:W/2,y:H-45,r:6,vx:3.5,vy:-3.5};
let bricks=[],score=0,lives=3,level=1,running=false;
function createBricks(){
  bricks=[];
  const cols=8,rows=4+Math.min(level,3),bw=W/cols-4,bh=18;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    bricks.push({x:c*(bw+4)+2,y:r*(bh+4)+40,w:bw,h:bh,alive:true,color:colors[r%colors.length],pts:(rows-r)*10});
  }
}
function resetBall(){ball={x:paddle.x+paddle.w/2,y:paddle.y-ball.r-1,r:6,vx:3.5*((Math.random()>0.5)?1:-1),vy:-3.5};running=false}
function resetAll(){score=0;lives=3;level=1;createBricks();paddle.x=W/2-40;resetBall()}
canvas.addEventListener('pointermove',e=>{
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const scaleX=W/rect.width;
  paddle.x=((e.clientX||e.touches?.[0]?.clientX||0)-rect.left)*scaleX-paddle.w/2;
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));
});
canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(!running&&lives>0)running=true});
function draw(){
  ctx.fillStyle='#161b22';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#3b82f6';
  ctx.beginPath();ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,4);ctx.fill();
  ctx.fillStyle='#e6edf3';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  bricks.forEach(b=>{if(!b.alive)return;ctx.fillStyle=b.color;ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,3);ctx.fill()});
  ctx.fillStyle='#e6edf3';ctx.font='bold 16px system-ui';ctx.textAlign='left';
  ctx.fillText(`分数: ${score}`,10,25);
  ctx.fillText(`生命: ${'❤️'.repeat(lives)}`,W-120,25);
  ctx.textAlign='center';ctx.fillText(`关卡 ${level}`,W/2,25);
  if(!running&&lives>0){
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e6edf3';ctx.font='bold 22px system-ui';ctx.fillText('点击开始',W/2,H/2);
  }
  if(lives<=0){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ef4444';ctx.font='bold 28px system-ui';ctx.fillText('游戏结束',W/2,H/2-20);
    ctx.fillStyle='#e6edf3';ctx.font='18px system-ui';ctx.fillText(`最终分数: ${score}`,W/2,H/2+20);
    ctx.fillStyle='#8b949e';ctx.font='16px system-ui';ctx.fillText('点击重新开始',W/2,H/2+55);
    canvas.onclick=()=>{resetAll();canvas.onclick=null};
  }
}
function update(){
  if(!running)return;
  ball.x+=ball.vx;ball.y+=ball.vy;
  if(ball.x-ball.r<0||ball.x+ball.r>W)ball.vx*=-1;
  if(ball.y-ball.r<0)ball.vy*=-1;
  if(ball.y+ball.r>H){lives--;resetBall();return}
  if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y+ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){
    ball.vy=-Math.abs(ball.vy);
    ball.vx=((ball.x-(paddle.x+paddle.w/2))/(paddle.w/2))*5;
  }
  bricks.forEach(b=>{
    if(!b.alive)return;
    if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){
      b.alive=false;ball.vy*=-1;score+=b.pts;
    }
  });
  if(bricks.every(b=>!b.alive)){level++;createBricks();resetBall()}
}
function loop(){update();draw();requestAnimationFrame(loop)}
createBricks();resetBall();loop();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
