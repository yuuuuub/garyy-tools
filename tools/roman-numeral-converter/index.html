<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>罗马数字转换器</title><meta name="description" content="罗马数字转换器 - 在线罗马数字转换工具"><style>:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16pxscroll-behavior:smooth;}.container{max-width:800px;margin:auto}h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}.input-group{margin-bottom:12px}.input-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}.input-group input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem}.input-group input:focus{border-color:var(--blue);outline:none}.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px}.btn:hover{opacity:.85}.section{margin-top:16px}.section h3{font-size:.95rem;margin-bottom:10px;color:var(--blue)}.result-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}.label{font-size:.75rem;color:var(--text2);margin-bottom:4px}.copy-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem;margin-top:8px}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{padding:8px 16px;background:var(--border);color:var(--text);border:none;border-radius:6px;cursor:pointer;font-size:.85rem}.tab.active{background:var(--blue);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style><meta property="og:title" content="罗马数字转换器"><meta property="og:description" content="罗马数字转换器 - Gary's Tools"><meta property="og:image" content="https://garyy.top/og-image.png"><meta name="robots" content="index, follow"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head><body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container"><h1>🏛️ 罗马数字转换器</h1><p class="sub">在线罗马数字转换工具</p>
<div class="tabs">
<button class="tab active" onclick="switchTab('toRoman')">数字→罗马数字</button>
<button class="tab" onclick="switchTab('toNumber')">罗马数字→数字</button>
</div>
<div class="card" id="toRomanCard">
<div class="input-group">
<label>输入数字 (1-3999)</label>
<input type="number" id="numberInput" min="1" max="3999" placeholder="123" oninput="convertToRoman()">
</div>
<button class="btn" onclick="convertToRoman()">转换</button>
</div>
<div class="card" id="toNumberCard" style="display:none">
<div class="input-group">
<label>输入罗马数字</label>
<input type="text" id="romanInput" placeholder="XII" oninput="convertToNumber()">
</div>
<button class="btn" onclick="convertToNumber()">转换</button>
</div>
<div id="result"></div></div>
<script src="../i18n.js" defer></script>
<script>
var currentTab='toRoman';
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  event.target.classList.add('active');
  document.getElementById('toRomanCard').style.display=tab==='toRoman'?'block':'none';
  document.getElementById('toNumberCard').style.display=tab==='toNumber'?'block':'none';
  document.getElementById('result').innerHTML='';
}
function convertToRoman(){
  var number=parseInt(document.getElementById('numberInput').value);
  var r=document.getElementById('result');
  if(isNaN(number)){r.innerHTML='';return;}
  if(number<1||number>3999){r.innerHTML='<div class="card" style="color:var(--red)">数字必须在1-3999之间</div>';return;}
  var roman=numberToRoman(number);
  showResult(roman,'罗马数字');
}
function convertToNumber(){
  var roman=document.getElementById('romanInput').value.trim().toUpperCase();
  var r=document.getElementById('result');
  if(!roman){r.innerHTML='';return;}
  var number=romanToNumber(roman);
  if(number===null){r.innerHTML='<div class="card" style="color:var(--red)">无效的罗马数字</div>';return;}
  showResult(number.toString(),'数字');
}
function numberToRoman(num){
  var values=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  var symbols=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  var result='';
  for(var i=0;i<values.length;i++){
    while(num>=values[i]){
      result+=symbols[i];
      num-=values[i];
    }
  }
  return result;
}
function romanToNumber(str){
  var romanMap={'I':1,'V':5,'X':10,'L':50,'C':100,'D':500,'M':1000};
  var result=0;
  var prev=0;
  for(var i=str.length-1;i>=0;i--){
    var current=romanMap[str[i]];
    if(!current)return null;
    if(current<prev){result-=current;}
    else{result+=current;}
    prev=current;
  }
  return result;
}
function showResult(text,title){
  var r=document.getElementById('result');
  var html='<div class="card"><div class="section"><h3>📋 '+title+'</h3>';
  html+='<div class="result-block" id="resultText">'+escapeHtml(text)+'</div>';
  html+='<button class="copy-btn" onclick="copyResult()">复制结果</button></div></div>';
  r.innerHTML=html;
}
function escapeHtml(text){
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function copyResult(){
  var text=document.getElementById('resultText').textContent;
  navigator.clipboard.writeText(text).then(function(){alert('已复制到剪贴板');}).catch(function(){alert('复制失败');});
}
convertToRoman();
</script></body></html>
