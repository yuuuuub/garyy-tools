<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汉字演变史 - 从甲骨文到简体字</title>
<meta property="og:title" content="汉字演变史 - 从甲骨文到简体字">
<meta property="og:description" content="汉字演变史 - 可视化展示汉字从甲骨文到简体字的演变过程 - Gary's Tools">
<meta property="og:image" content="https://garyy.top/og-image.png">
<meta name="description" content="汉字演变史 - 可视化展示汉字从甲骨文、金文、篆书、隶书、楷书到简体字的演变过程">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📜</text></svg>">
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--blue:#3b82f6;--green:#238636;--red:#ef4444;--radius:10px;--transition:0.2s ease}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vh;padding:16px}
.container{max-width:900px;margin:auto}
h1{text-align:center;padding:24px 0 8px;font-size:1.5rem}
.sub{text-align:center;color:var(--text2);font-size:.85rem;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 24px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:12px;transition:var(--transition)}
.btn:hover{opacity:.85}
.btn-group{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.btn-secondary{background:var(--border);color:var(--text)}
.char-select{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin:12px 0}
.char-btn{padding:10px;text-align:center;background:var(--bg);border:2px solid var(--border);border-radius:8px;cursor:pointer;font-size:1.3rem;transition:var(--transition)}
.char-btn:hover{border-color:var(--blue)}
.char-btn.active{border-color:var(--blue);background:rgba(59,130,246,0.1)}
.timeline{position:relative;padding:20px 0;margin:20px 0}
.timeline::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--border);transform:translateX(-50%)}
.timeline-item{position:relative;width:45%;padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:24px;transition:var(--transition)}
.timeline-item:hover{border-color:var(--blue);transform:translateY(-2px)}
.timeline-item:nth-child(odd){margin-left:5%}
.timeline-item:nth-child(even){margin-left:50%}
.timeline-item::before{content:'';position:absolute;top:20px;width:12px;height:12px;background:var(--blue);border-radius:50%;border:2px solid var(--bg)}
.timeline-item:nth-child(odd)::before{right:-6px}
.timeline-item:nth-child(even)::before{left:-6px}
.timeline-stage{font-weight:bold;color:var(--blue);font-size:.85rem;margin-bottom:4px}
.timeline-period{font-size:.75rem;color:var(--text2);margin-bottom:8px}
.timeline-desc{font-size:.85rem;line-height:1.5;color:var(--text2)}
.timeline-chars{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.timeline-char{font-size:2rem;padding:4px 12px;background:var(--card);border:1px solid var(--border);border-radius:6px;font-weight:bold}
.timeline-char.oracle{font-family:'KaiTi','STKaiti',serif;filter:blur(0.3px)}
.timeline-char.bronze{font-family:'STXingkai','FangSong',serif;font-weight:normal}
.timeline-char.seal{font-family:'STKaiti','FangSong',serif;border-radius:50%}
.timeline-char.clerical{font-family:'SimSun','STSong',serif;font-style:italic}
.timeline-char.regular{font-family:'SimSun','STSong',serif}
.timeline-char.modern{font-family:'PingFang SC',sans-serif}
.compare-view{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:16px 0}
.compare-cell{text-align:center;padding:12px 4px;background:var(--bg);border:1px solid var(--border);border-radius:6px}
.compare-label{font-size:.7rem;color:var(--text2);margin-top:4px}
.compare-char{font-size:1.8rem;font-weight:bold}
.compare-cell.highlight{border-color:var(--blue);background:rgba(59,130,246,0.05)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
@media(max-width:600px){
  .timeline::before{left:20px}
  .timeline-item{width:85%;margin-left:40px!important}
  .timeline-item::before{left:-26px!important;right:auto!important}
  .char-select{grid-template-columns:repeat(5,1fr)}
  .compare-view{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999">
  <a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a>
</div>
<div class="container">
  <h1>📜 汉字演变史</h1>
  <p class="sub">从甲骨文到简体字，可视化展示汉字的演变历程</p>

  <div class="card">
    <h3 style="margin-bottom:12px">选择汉字</h3>
    <div class="char-select" id="charSelect"></div>
    <div class="btn-group" style="justify-content:center;margin-top:12px">
      <button class="btn" onclick="showTimeline()">查看演变时间线</button>
      <button class="btn btn-secondary" onclick="showCompare()">对比视图</button>
      <button class="btn btn-secondary" onclick="toggleTheme()">🌓 主题</button>
    </div>
  </div>

  <div id="timelineView">
    <div class="card">
      <h3 id="timelineTitle" style="margin-bottom:4px">汉字演变时间线</h3>
      <p style="color:var(--text2);font-size:.85rem;margin-bottom:12px" id="timelineSub">选择一个汉字查看其演变历程</p>
      <div class="timeline" id="timeline"></div>
    </div>
  </div>

  <div id="compareView" style="display:none">
    <div class="card">
      <h3 style="margin-bottom:12px">六书对比视图</h3>
      <div class="compare-view" id="compareGrid"></div>
    </div>
  </div>
</div>

<script src="../i18n.js" defer></script>
<script>
var chars = ['日','月','水','火','山','田','土','人','大','小','天','地','目','口','手','木','鸟','鱼','马','龙'];
var stages = [
  {key:'oracle',name:'甲骨文',period:'约公元前1300年',desc:'商朝时期刻在龟甲和兽骨上的文字，是中国已知最早的成熟文字体系。笔画细瘦，多方折。'},
  {key:'bronze',name:'金文',period:'约公元前1100年',desc:'铸刻在青铜器上的文字，比甲骨文更加规整丰满，笔画粗壮圆润。'},
  {key:'seal',name:'篆书',period:'公元前221年',desc:'秦始皇统一六国后推行的标准字体，笔画匀称，结构对称，分为大篆和小篆。'},
  {key:'clerical',name:'隶书',period:'公元前200年',desc:'汉代流行的字体，化圆为方，出现波磔笔画，是古文字向今文字转变的标志，史称"隶变"。'},
  {key:'regular',name:'楷书',period:'公元200年',desc:'从隶书演变而来，字形方正，笔画平直，成为此后两千年的标准字体。'},
  {key:'modern',name:'简体字',period:'1956年至今',desc:'中华人民共和国推行的简化汉字，减少笔画数，便于学习和书写。'}
];

var charEvolutions = {
  '日':{oracle:'☉',bronze:'☉',seal:'日',clerical:'日',regular:'日',modern:'日'},
  '月':{oracle:'☽',bronze:'☽',seal:'月',clerical:'月',regular:'月',modern:'月'},
  '水':{oracle:'≈',bronze:'≈',seal:'水',clerical:'水',regular:'水',modern:'水'},
  '火':{oracle:'🔥',bronze:'火',seal:'火',clerical:'火',regular:'火',modern:'火'},
  '山':{oracle:'⛰',bronze:'山',seal:'山',clerical:'山',regular:'山',modern:'山'},
  '田':{oracle:'⊞',bronze:'田',seal:'田',clerical:'田',regular:'田',modern:'田'},
  '土':{oracle:'⊕',bronze:'土',seal:'土',clerical:'土',regular:'土',modern:'土'},
  '人':{oracle:'人',bronze:'人',seal:'人',clerical:'人',regular:'人',modern:'人'},
  '大':{oracle:'大',bronze:'大',seal:'大',clerical:'大',regular:'大',modern:'大'},
  '小':{oracle:'小',bronze:'小',seal:'小',clerical:'小',regular:'小',modern:'小'},
  '天':{oracle:'天',bronze:'天',seal:'天',clerical:'天',regular:'天',modern:'天'},
  '地':{oracle:'地',bronze:'地',seal:'地',clerical:'地',regular:'地',modern:'地'},
  '目':{oracle:'◎',bronze:'目',seal:'目',clerical:'目',regular:'目',modern:'目'},
  '口':{oracle:'口',bronze:'口',seal:'口',clerical:'口',regular:'口',modern:'口'},
  '手':{oracle:'✋',bronze:'手',seal:'手',clerical:'手',regular:'手',modern:'手'},
  '木':{oracle:'木',bronze:'木',seal:'木',clerical:'木',regular:'木',modern:'木'},
  '鸟':{oracle:'🐦',bronze:'鳥',seal:'鳥',clerical:'鳥',regular:'鳥',modern:'鸟'},
  '鱼':{oracle:'🐟',bronze:'魚',seal:'魚',clerical:'魚',regular:'魚',modern:'鱼'},
  '马':{oracle:'🐴',bronze:'馬',seal:'馬',clerical:'馬',regular:'馬',modern:'马'},
  '龙':{oracle:'🐉',bronze:'龍',seal:'龍',clerical:'龍',regular:'龍',modern:'龙'}
};

var selectedChar = '日';
var currentView = 'timeline';

function init() {
  renderCharSelect();
  showTimeline();
}

function renderCharSelect() {
  var html = '';
  chars.forEach(function(c) {
    html += '<div class="char-btn' + (c === selectedChar ? ' active' : '') + '" onclick="selectChar(\'' + c + '\')">' + c + '</div>';
  });
  document.getElementById('charSelect').innerHTML = html;
}

function selectChar(ch) {
  selectedChar = ch;
  renderCharSelect();
  if (currentView === 'timeline') showTimeline();
  else showCompare();
}

function showTimeline() {
  currentView = 'timeline';
  document.getElementById('timelineView').style.display = 'block';
  document.getElementById('compareView').style.display = 'none';
  document.getElementById('timelineTitle').textContent = selectedChar + ' 的演变历程';

  var evo = charEvolutions[selectedChar] || {};
  var html = '';
  stages.forEach(function(s, i) {
    var ch = evo[s.key] || selectedChar;
    html += '<div class="timeline-item" style="animation:fadeIn 0.3s ease-out ' + (i * 0.1) + 's both">';
    html += '<div class="timeline-stage">' + s.name + '</div>';
    html += '<div class="timeline-period">' + s.period + '</div>';
    html += '<div class="timeline-desc">' + s.desc + '</div>';
    html += '<div class="timeline-chars"><div class="timeline-char ' + s.key + '">' + ch + '</div></div>';
    html += '</div>';
  });
  document.getElementById('timeline').innerHTML = html;
}

function showCompare() {
  currentView = 'compare';
  document.getElementById('timelineView').style.display = 'none';
  document.getElementById('compareView').style.display = 'block';

  var evo = charEvolutions[selectedChar] || {};
  var html = '';
  stages.forEach(function(s) {
    var ch = evo[s.key] || selectedChar;
    html += '<div class="compare-cell highlight">';
    html += '<div class="compare-char ' + s.key + '">' + ch + '</div>';
    html += '<div class="compare-label">' + s.name + '</div>';
    html += '</div>';
  });
  document.getElementById('compareGrid').innerHTML = html;
}

function toggleTheme() {
  var h = document.documentElement;
  h.setAttribute('data-theme', h.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
}

init();
</script>
</body>
</html>
