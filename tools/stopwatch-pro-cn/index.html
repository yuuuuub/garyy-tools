<!DOCTYPE html>
<html style="scroll-behavior:smooth" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专业秒表Pro</title>
<meta name="description" content="专业秒表Pro，支持多圈计时、 lap 记录、分段统计和数据导出">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0969da;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.container{max-width:800px;margin:0 auto}
h1{font-size:1.8rem;margin-bottom:8px;text-align:center}
.subtitle{color:var(--text2);text-align:center;margin-bottom:24px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.95rem;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green)}
.btn-warning{background:var(--yellow);color:#000}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-blue{background:rgba(59,130,246,.2);color:var(--accent2)}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-red{background:rgba(248,81,73,.2);color:var(--red)}
.badge-yellow{background:rgba(210,153,34,.2);color:var(--yellow)}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:.9rem}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
.table th{color:var(--text2);font-size:.85rem;font-weight:600}
.table tr:hover{background:rgba(59,130,246,.05)}
.time-display{font-size:5rem;font-weight:700;font-family:'Courier New',monospace;text-align:center;padding:20px;color:var(--accent)}
.ms-display{font-size:2rem;color:var(--text2)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
@media(max-width:600px){body{padding:10px}.container{max-width:100%}.card{padding:14px}h1{font-size:1.4rem}.time-display{font-size:3rem}.ms-display{font-size:1.2rem}}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏱️</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="专业秒表Pro">
<meta property="og:description" content="专业秒表Pro，支持多圈计时、lap记录、分段统计和数据导出">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/stopwatch-pro-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container" id="app"></div>
<script>
document.title='⏱️ 专业秒表Pro';
const APP=document.getElementById('app');
let running=false;
let startTime=0;
let elapsed=0;
let lastLapTime=0;
let laps=[];
let animFrame=null;
let savedSessions=JSON.parse(localStorage.getItem('swp_sessions')||'[]');

function formatTime(ms){
  let totalSec=Math.floor(ms/1000);
  let h=Math.floor(totalSec/3600);
  let m=Math.floor((totalSec%3600)/60);
  let s=totalSec%60;
  let millis=Math.floor((ms%1000)/10);
  return{
    full:`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`,
    ms:String(millis).padStart(2,'0')
  };
}

function render(){
  let t=formatTime(elapsed);
  let h=`<h1>⏱️ 专业秒表Pro</h1><p class="subtitle">多圈计时 · lap记录 · 分段统计 · 数据导出</p>`;
  
  h+=`<div class="card" style="text-align:center">
    <div class="time-display">${t.full}<span class="ms-display">.${t.ms}</span></div>
    <div class="flex" style="justify-content:center">
      ${running?
        `<button class="btn btn-warning" onclick="lapLap()">计次</button>
         <button class="btn btn-danger" onclick="stopTimer()">停止</button>`:
        `<button class="btn btn-success" onclick="startTimer()">开始</button>
         <button class="btn btn-sm" onclick="resetTimer()" ${elapsed===0?'disabled':''}>重置</button>`
      }
    </div>
  </div>`;

  if(laps.length){
    h+=`<div class="card"><div class="flex-between"><b>Lap记录</b><span class="badge badge-blue">共 ${laps.length} 圈</span></div>`;
    h+=`<table class="table"><thead><tr><th>#</th><th>Lap时间</th><th>总时间</th><th>最快/最慢</th></tr></thead><tbody>`;
    let times=laps.map(l=>l.splitTime);
    let minLap=Math.min(...times);
    let maxLap=Math.max(...times);
    laps.slice().reverse().forEach((lap,i)=>{
      let idx=laps.length-i;
      let splitStr=formatTime(lap.splitTime);
      let totalStr=formatTime(lap.totalTime);
      let badge=lap.splitTime===minLap?'badge-green':lap.splitTime===maxLap?'badge-red':'';
      h+=`<tr><td>${idx}</td><td>${splitStr.full}.${splitStr.ms}</td><td>${totalStr.full}.${totalStr.ms}</td><td>${badge?`<span class="badge ${badge}">${lap.splitTime===minLap?'最快':'最慢'}</span>`:''}</td></tr>`;
    });
    h+=`</tbody></table></div>`;
  }

  if(laps.length>=2){
    let avg=laps.reduce((s,l)=>s+l.splitTime,0)/laps.length;
    let avgStr=formatTime(avg);
    h+=`<div class="card"><b>分段统计</b><div style="display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin-top:12px">
      <div><div style="font-size:1.3rem;font-weight:700;color:var(--accent)">${laps.length}</div><div style="font-size:.8rem;color:var(--text2)">总圈数</div></div>
      <div><div style="font-size:1.3rem;font-weight:700;color:var(--green)">${formatTime(Math.min(...laps.map(l=>l.splitTime))).full}</div><div style="font-size:.8rem;color:var(--text2)">最快单圈</div></div>
      <div><div style="font-size:1.3rem;font-weight:700;color:var(--red)">${formatTime(Math.max(...laps.map(l=>l.splitTime))).full}</div><div style="font-size:.8rem;color:var(--text2)">最慢单圈</div></div>
      <div><div style="font-size:1.3rem;font-weight:700;color:var(--yellow)">${avgStr.full}</div><div style="font-size:.8rem;color:var(--text2)">平均单圈</div></div>
    </div></div>`;
  }

  h+=`<div class="card"><div class="flex-between"><b>历史记录</b>`;
  if(savedSessions.length) h+=`<button class="btn btn-sm" onclick="exportData()">导出CSV</button>`;
  h+=`</div>`;
  if(!savedSessions.length) h+=`<div class="empty">暂无历史记录</div>`;
  else{
    h+=`<table class="table"><thead><tr><th>日期</th><th>总时间</th><th>Laps</th><th>操作</th></tr></thead><tbody>`;
    savedSessions.slice(-10).reverse().forEach((s,i)=>{
      let idx=savedSessions.indexOf(s);
      let t=formatTime(s.elapsed);
      h+=`<tr><td>${s.date}</td><td>${t.full}.${t.ms}</td><td>${s.laps.length}</td><td><button class="btn btn-sm btn-danger" onclick="delSession(${idx})">删除</button></td></tr>`;
    });
    h+=`</tbody></table>`;
  }
  h+=`</div>`;

  APP.innerHTML=h;
}

function startTimer(){
  running=true;
  startTime=performance.now()-elapsed;
  lastLapTime=elapsed;
  tick();
}

function tick(){
  if(!running) return;
  elapsed=performance.now()-startTime;
  let t=formatTime(elapsed);
  let display=document.querySelector('.time-display');
  if(display) display.innerHTML=`${t.full}<span class="ms-display">.${t.ms}</span>`;
  animFrame=requestAnimationFrame(tick);
}

function stopTimer(){
  running=false;
  cancelAnimationFrame(animFrame);
  if(elapsed>0){
    let now=new Date();
    savedSessions.push({
      date:`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`,
      elapsed:elapsed,
      laps:[...laps]
    });
    localStorage.setItem('swp_sessions',JSON.stringify(savedSessions));
  }
  render();
}

function resetTimer(){
  running=false;
  cancelAnimationFrame(animFrame);
  elapsed=0;
  lastLapTime=0;
  laps=[];
  render();
}

function lapLap(){
  if(!running) return;
  let splitTime=elapsed-lastLapTime;
  lastLapTime=elapsed;
  laps.push({splitTime,totalTime:elapsed});
  render();
}

function delSession(idx){if(confirm('删除？')){savedSessions.splice(idx,1);localStorage.setItem('swp_sessions',JSON.stringify(savedSessions));render()}}

function exportData(){
  let csv='日期,总时间,Lap#,Lap时间,总时间\n';
  savedSessions.forEach(s=>{
    let t=formatTime(s.elapsed);
    if(!s.laps.length) csv+=`${s.date},${t.full}.${t.ms},0,,\n`;
    else s.laps.forEach((l,i)=>{
      let st=formatTime(l.splitTime);
      let tt=formatTime(l.totalTime);
      csv+=`${s.date},${t.full}.${t.ms},${i+1},${st.full}.${st.ms},${tt.full}.${tt.ms}\n`;
    });
  });
  let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='stopwatch_data.csv';
  a.click();
}

render();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
