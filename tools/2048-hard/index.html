<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>困难2048</title>
<meta name="description" content="困难模式2048数字益智游戏，高难度挑战体验">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0padding:16px;scroll-behavior:smooth;}
.container{text-align:center;padding:20px;max-width:500px;width:100%}
h1{font-size:28px;margin-bottom:10px;color:var(--accent)}
.stats{display:flex;justify-content:center;gap:15px;margin-bottom:15px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 16px;min-width:90px}
.stat-label{font-size:11px;color:#8b949e;text-transform:uppercase}
.stat-value{font-size:22px;font-weight:bold;color:var(--accent)}
.stat.danger .stat-value{color:#ff6b6b}
.stat.success .stat-value{color:#55efc4}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:400px;margin:0 auto;background:var(--card);border:2px solid var(--border);border-radius:12px;padding:12px}
.cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;transition:all .12s}
.btn{background:var(--accent);color:var(--text);border:none;padding:12px 30px;border-radius:8px;font-size:16px;cursor:pointer;margin-top:15px;font-weight:bold}
.progress-bar{width:100%;height:8px;background:rgba(255,255,255,0.1);border-radius:4px;margin:10px auto;max-width:400px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.target-info{color:#8b949e;font-size:13px;margin-bottom:10px}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:100}
.overlay-box{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:30px;text-align:center}
.overlay-box h2{font-size:32px;margin-bottom:10px;color:var(--accent)}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="困难2048">
  <meta property="og:description" content="困难模式2048数字益智游戏，高难度挑战体验">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/2048-hard/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="container">
<h1>🔥 困难2048</h1>
<p class="target-info">目标: 达到 <strong>4096</strong> | 限制: <strong id="moveLimit">150</strong> 步</p>
<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
<div class="stats">
<div class="stat"><div class="stat-label">分数</div><div class="stat-value" id="score">0</div></div>
<div class="stat"><div class="stat-label">最高方块</div><div class="stat-value" id="maxTile">2</div></div>
<div class="stat danger"><div class="stat-label">剩余步数</div><div class="stat-value" id="remaining">150</div></div>
</div>
<div class="board" id="board"></div>
<button class="btn" onclick="restartGame()">重新开始</button>
<p style="color:#8b949e;margin-top:10px;font-size:13px">← ↑ ↓ → 或滑动操控</p>
</div>
<div class="overlay" id="overlay" style="display:none">
<div class="overlay-box">
<h2 id="overlayTitle">游戏结束</h2>
<p id="overlayMsg" style="margin:10px 0"></p>
<button class="btn" onclick="restartGame();document.getElementById('overlay').style.display='none'">再来一局</button>
</div>
</div>
<script>
const SIZE=4,MOVE_LIMIT=150,TARGET=4096;
let grid,score,maxTile,moves;
const colors={0:'rgba(255,255,255,0.05)',2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e',4096:'#3c3a32'};

function init(){
    grid=Array.from({length:SIZE},()=>Array(SIZE).fill(0));
    score=0;maxTile=2;moves=0;addRandom();addRandom();render();hideOverlay();
}

function addRandom(){
    const empty=[];
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(grid[r][c]===0)empty.push({r,c});
    if(!empty.length)return;
    const{r,c}=empty[Math.floor(Math.random()*empty.length)];
    grid[r][c]=Math.random()<0.9?2:4;
}

function render(){
    const board=document.getElementById('board');
    board.innerHTML='';
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
        const cell=document.createElement('div');
        cell.className='cell';
        const v=grid[r][c];
        cell.textContent=v||'';
        cell.style.background=colors[v]||`hsl(${Math.log2(v)*30},70%,50%)`;
        cell.style.color=v<=4?'#000':'#fff';
        cell.style.fontSize=v>=1024?'16px':v>=128?'20px':'24px';
        board.appendChild(cell);
    }
    document.getElementById('score').textContent=score;
    document.getElementById('maxTile').textContent=maxTile;
    const rem=MOVE_LIMIT-moves;
    document.getElementById('remaining').textContent=rem;
    document.getElementById('remaining').style.color=rem<=20?'#ff6b6b':rem<=50?'#feca57':'var(--accent)';
    const progress=Math.min(100,(maxTile/TARGET)*100);
    document.getElementById('progress').style.width=progress+'%';
    document.getElementById('progress').style.background=maxTile>=TARGET?'#55efc4':'var(--accent)';
}

function slide(row){
    let arr=row.filter(v=>v);
    for(let i=0;i<arr.length-1;i++)if(arr[i]===arr[i+1]){arr[i]*=2;score+=arr[i];arr.splice(i+1,1);}
    while(arr.length<SIZE)arr.push(0);
    return arr;
}

function move(dir){
    const g=grid.map(r=>[...r]);let moved=false;
    if(dir==='left'){for(let r=0;r<SIZE;r++){const s=slide(g[r]);if(s.join(',')!==g[r].join(','))moved=true;grid[r]=s;}}
    else if(dir==='right'){for(let r=0;r<SIZE;r++){const s=slide(g[r].slice().reverse()).reverse();if(s.join(',')!==g[r].join(','))moved=true;grid[r]=s;}}
    else if(dir==='up'){for(let c=0;c<SIZE;c++){const s=slide(g.map(r=>r[c]));if(s.join(',')!==g.map(r=>g[r][c]).join(','))moved=true;for(let r=0;r<SIZE;r++)grid[r][c]=s[r];}}
    else if(dir==='down'){for(let c=0;c<SIZE;c++){const s=slide(g.map(r=>r[c]).reverse()).reverse();if(s.join(',')!==g.map(r=>g[r][c]).join(','))moved=true;for(let r=0;r<SIZE;r++)grid[r][c]=s[r];}}
    if(moved){
        moves++;
        for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(grid[r][c]>maxTile)maxTile=grid[r][c];
        addRandom();render();
        if(maxTile>=TARGET)showOverlay('🎉 你赢了!',`分数: ${score}，仅用 ${moves} 步!`);
        else if(moves>=MOVE_LIMIT)showOverlay('❌ 步数用尽!',`最高方块: ${maxTile}，分数: ${score}`);
        else if(isGameOver())showOverlay('游戏结束',`最高方块: ${maxTile}，分数: ${score}`);
    }
}

function isGameOver(){
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
        if(grid[r][c]===0)return false;
        if(c<SIZE-1&&grid[r][c]===grid[r][c+1])return false;
        if(r<SIZE-1&&grid[r][c]===grid[r+1][c])return false;
    }
    return true;
}

function showOverlay(t,m){document.getElementById('overlayTitle').textContent=t;document.getElementById('overlayMsg').textContent=m;document.getElementById('overlay').style.display='flex';}
function hideOverlay(){document.getElementById('overlay').style.display='none';}

document.addEventListener('keydown',e=>{const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};if(m[e.key]){e.preventDefault();move(m[e.key]);}});
let tx,ty;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)<30&&Math.abs(dy)<30)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');else move(dy>0?'down':'up');});

function restartGame(){init();}
init();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
