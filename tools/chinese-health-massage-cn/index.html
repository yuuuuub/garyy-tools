<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#238636;--red:#ef4444;--blue:#3b82f6;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#2563eb;--success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--success:#1a7f37;--warn:#bf8700;--danger:#cf222e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:16px;display:flex;justify-content:center}
.ctn{max-width:600px;width:100%}.hdr{text-align:center;margin-bottom:24px}.hdr h1{font-size:1.8rem;font-weight:700}.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
button{padding:10px 20px;background:var(--accent);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit;font-size:.95rem}button:hover{background:var(--accent2)}button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:.75rem;font-weight:600}
.tag.s{background:rgba(34,197,94,.15);color:var(--success)}.tag.w{background:rgba(245,158,11,.15);color:var(--warn)}.tag.d{background:rgba(239,68,68,.15);color:var(--danger)}
.li{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.li:hover{border-color:var(--accent)}
.empty{text-align:center;color:var(--text2);padding:20px;font-size:.9rem}
select,input,textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.9rem;margin-bottom:8px}
label{font-size:.85rem;color:var(--text2);margin-bottom:4px;display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}body{animation:fadeIn .4s ease-out}
.pressure-bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin:8px 0}
.pressure-fill{height:100%;border-radius:4px;transition:width .3s}
.pressure-light .pressure-fill{width:33%;background:var(--success)}
.pressure-medium .pressure-fill{width:66%;background:var(--warn)}
.pressure-heavy .pressure-fill{width:100%;background:var(--danger)}
.rating{display:flex;gap:4px}.rating span{font-size:1.5rem;cursor:pointer;opacity:.3}.rating span.active{opacity:1}
</style>

<div style="margin:16px 0">

<div class="cd" id="bodyView" style="display:none">
<button class="sec" onclick="showMain()" style="margin-bottom:16px">← 返回</button>

<div class="cd" id="routineView" style="display:none">

<div style="display:flex;gap:8px;margin:12px 0">

<div class="cd" id="timerView" style="display:none">

<div style="display:flex;gap:8px;justify-content:center">
<button onclick="pauseTimer()">暂停</button>

</div>

<div class="cd" id="logView" style="display:none">
<h2>📊 按摩记录</h2>
<div id="logStats" style="display:flex;gap:12px;margin-bottom:16px"></div>

<div style="display:flex;gap:8px;justify-content:center;margin-top:16px">
<button class="sec" onclick="showView('mainView')">🔍 症状</button>

  ]},
  {name:'颈部',desc:'颈部按摩能缓解颈椎疲劳、改善头部供血',techniques:['拿法','揉法'],duration:'5-8分钟',pressure:'中',steps:[
    {step:'拿捏颈后肌肉，从上到下',duration:60},
    {step:'按揉风池穴，各30秒',duration:60},
    {step:'揉按颈肩交界处',duration:60},
    {step:'缓慢转动颈部，左右各5次',duration:30},
    {step:'拿捏斜方肌',duration:60}
  ]},
  {name:'肩部',desc:'肩部按摩能缓解肩周炎、消除肩部酸痛',techniques:['拿法','按法','揉法'],duration:'8-10分钟',pressure:'中',steps:[
    {step:'拿捏肩井穴，各30秒',duration:60},
    {step:'按揉肩髃穴，各20秒',duration:40},
    {step:'揉按肩贞穴',duration:40},
    {step:'拿捏三角肌',duration:60},
    {step:'拍打肩部',duration:30}
  ]},
  {name:'背部',desc:'背部按摩能舒筋活络、缓解腰背疼痛',techniques:['推法','揉法','拍法'],duration:'10-15分钟',pressure:'中',steps:[
    {step:'用手掌沿脊柱两侧从上往下推',duration:120},
    {step:'揉按膀胱经穴位',duration:120},
    {step:'拿捏背部肌肉',duration:60},
    {step:'拍打背部',duration:60},
    {step:'用掌根按压肾俞穴',duration:30}
  ]},
  {name:'腰部',desc:'腰部按摩能补肾强腰、缓解腰痛',techniques:['揉法','按法','擦法'],duration:'8-10分钟',pressure:'中',steps:[
    {step:'双手搓热后放在腰部',duration:30},
    {step:'上下擦动腰部，以透热为度',duration:120},

  ]},

    {step:'用手掌顺时针摩动胸部',duration:120},
    {step:'按揉膻中穴',duration:30},
    {step:'揉按中府穴',duration:30},
    {step:'从胸骨向两侧分推',duration:60},
    {step:'深呼吸配合按摩',duration:30}
  ]},
  {name:'腹部',desc:'腹部按摩能健脾和胃、促进消化',techniques:['摩法','揉法'],duration:'8-10分钟',pressure:'轻',steps:[
    {step:'顺时针摩腹36圈',duration:120},
    {step:'逆时针摩腹24圈',duration:90},
    {step:'按揉中脘穴',duration:30},
    {step:'揉按天枢穴',duration:30},
    {step:'按揉气海穴',duration:30}
  ]},
  {name:'手臂',desc:'手臂按摩能疏通经络、缓解手臂酸痛',techniques:['推法','揉法','拿法'],duration:'5-8分钟',pressure:'中',steps:[
    {step:'从肩部向手腕方向推',duration:60},
    {step:'拿捏上臂肌肉',duration:60},
    {step:'揉按曲池穴',duration:30},
    {step:'揉按合谷穴',duration:30},
    {step:'抖动手臂放松',duration:30}
  ]},
  {name:'手掌',desc:'手掌按摩能促进末梢循环、缓解手部疲劳',techniques:['揉法','按法'],duration:'3-5分钟',pressure:'中',steps:[
    {step:'揉按劳宫穴',duration:30},
    {step:'按揉各手指关节',duration:60},
    {step:'推擦手掌心',duration:30},
    {step:'拉伸各手指',duration:30},
    {step:'搓热手掌',duration:20}
  ]},
  {name:'大腿',desc:'大腿按摩能放松肌肉、缓解腿部疲劳',techniques:['拿法','揉法','推法'],duration:'8-10分钟',pressure:'中',steps:[
    {step:'从膝盖向大腿根部推',duration:60},
    {step:'拿捏大腿前侧肌肉',duration:60},
    {step:'揉按血海穴',duration:30},
    {step:'揉按梁丘穴',duration:30},
    {step:'拍打大腿放松',duration:30}
  ]},
  {name:'小腿',desc:'小腿按摩能缓解腿部酸胀、促进血液循环',techniques:['拿法','揉法','推法'],duration:'5-8分钟',pressure:'中',steps:[
    {step:'从脚踝向膝盖方向推',duration:60},
    {step:'拿捏小腿后侧肌肉',duration:60},
    {step:'揉按承山穴',duration:30},
    {step:'揉按足三里穴',duration:30},
    {step:'抖动小腿放松',duration:30}
  ]},
  {name:'足部',desc:'足部按摩能刺激穴位、调节脏腑功能',techniques:['按法','揉法'],duration:'8-10分钟',pressure:'中',steps:[
    {step:'按揉涌泉穴',duration:60},
    {step:'揉按太冲穴',duration:30},
    {step:'按压足三里穴',duration:30},
    {step:'揉搓脚心',duration:60},
    {step:'拉伸脚趾',duration:30}
  ]}

const SYMPTOMS = [
  {name:'头痛',areas:['头部']},
  {name:'颈痛',areas:['颈部']},
  {name:'腰痛',areas:['腰部','背部']},
  {name:'肩痛',areas:['肩部']},
  {name:'失眠',areas:['头部','足部']},
  {name:'消化不良',areas:['腹部']},
  {name:'疲劳',areas:['头部','足部','手臂']}
];

let massageLogs=JSON.parse(localStorage.getItem('massage_logs')||'[]');
let timerState=null;
let timerInterval=null;
let selectedSymptoms=new Set();

function showView(id){
  ['mainView','techniqueView','bodyView','routineView','timerView','logView'].forEach(v=>document.getElementById(v).style.display='none');
  document.getElementById(id).style.display='block';
  if(id==='logView') renderLogs();
  if(id==='bodyView') renderBodyList();
}

function renderSymptoms(){
  document.getElementById('symptomList').innerHTML=SYMPTOMS.map(s=>`
    <button class="sec" style="padding:6px 12px;font-size:.85rem" onclick="toggleSymptom('${s.name}')">${s.name}</button>
  `).join('');
}

function toggleSymptom(name){
  if(selectedSymptoms.has(name)) selectedSymptoms.delete(name); else selectedSymptoms.add(name);
  renderRecommendations();
}

function renderRecommendations(){
  const areas=new Set();
  selectedSymptoms.forEach(s=>{
    const sym=SYMPTOMS.find(x=>x.name===s);
    if(sym) sym.areas.forEach(a=>areas.add(a));
  });
  if(!areas.size){
    document.getElementById('recommendations').innerHTML='<div class="empty">请选择你的不适症状</div>';
    return;
  }
  const routines=BODY_AREAS.filter(a=>areas.has(a.name));
  document.getElementById('recommendations').innerHTML=routines.map(r=>`
    <div class="li" onclick="showRoutine('${r.name}')">
      <div><strong>${r.name}按摩</strong><br><span style="color:var(--text2);font-size:.8rem">${r.desc}</span></div>
      <span class="tag s">${r.duration}</span>
    </div>
  `).join('');
}

function renderBodyList(){
  document.getElementById('bodyList').innerHTML=BODY_AREAS.map(a=>`
    <div class="li" onclick="showRoutine('${a.name}')">
      <div><strong>${a.name}</strong><br><span style="color:var(--text2);font-size:.8rem">${a.techniques.join('、')}</span></div>
      <span class="tag s">${a.duration}</span>
    </div>
  `).join('');
}

function showBodyList(){showView('bodyView');}

function showRoutine(name){
  const r=BODY_AREAS.find(a=>a.name===name);
  if(!r) return;
  document.getElementById('routineName').textContent=r.name+'按摩';
  document.getElementById('routineDesc').textContent=r.desc;
  document.getElementById('routinePressure').textContent='力度：'+r.pressure;
  document.getElementById('routineDuration').textContent=r.duration;
  document.getElementById('routineSteps').innerHTML=r.steps.map((s,i)=>`
    <div class="li"><div><strong>第${i+1}步：</strong>${s.step}</div><span class="tag w">${s.duration}秒</span></div>
  `).join('');
  timerState={area:r,step:0,remaining:r.steps[0].duration,paused:false};
  showView('routineView');
}

function startMassageTimer(){
  if(!timerState) return;
  showView('timerView');
  updateTimerDisplay();
  if(timerInterval) clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    if(timerState.paused) return;
    timerState.remaining--;
    if(timerState.remaining<=0){
      if(timerState.step<timerState.area.steps.length-1){
        timerState.step++;
        timerState.remaining=timerState.area.steps[timerState.step].duration;
      } else {
        clearInterval(timerInterval);
        saveMassageLog();
        alert('按摩完成！');
        showView('mainView');
        return;
      }
    }
    updateTimerDisplay();
  },1000);
}

function updateTimerDisplay(){
  const m=Math.floor(timerState.remaining/60);
  const s=timerState.remaining%60;
  document.getElementById('timerArea').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  document.getElementById('timerStep').textContent=`${timerState.area.steps[timerState.step].step} (${timerState.step+1}/${timerState.area.steps.length})`;
}

function pauseTimer(){
  timerState.paused=!timerState.paused;
}

function stopTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerState=null;
  showView('mainView');
}

function saveMassageLog(){
  massageLogs.push({
    date:new Date().toISOString(),
    area:timerState.area.name,
    techniques:timerState.area.techniques,
    duration:timerState.area.steps.reduce((a,b)=>a+b.duration,0),
    rating:0
  });
  localStorage.setItem('massage_logs',JSON.stringify(massageLogs));
}

function renderLogs(){
  const total=massageLogs.length;
  const areaCount={};
  massageLogs.forEach(l=>{areaCount[l.area]=(areaCount[l.area]||0)+1});
  const topArea=Object.entries(areaCount).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('logStats').innerHTML=`
    <div style="flex:1;text-align:center;padding:12px;background:var(--bg);border-radius:8px">
      <div style="font-size:1.5rem;font-weight:700;color:var(--accent)">${total}</div>
      <div style="font-size:.8rem;color:var(--text2)">总次数</div>
    </div>
    <div style="flex:1;text-align:center;padding:12px;background:var(--bg);border-radius:8px">
      <div style="font-size:1rem;font-weight:700;color:var(--success)">${topArea?topArea[0]:'-'}</div>
      <div style="font-size:.8rem;color:var(--text2)">最常按摩</div>
    </div>
  `;
  document.getElementById('logList').innerHTML=massageLogs.length?massageLogs.slice(-10).reverse().map(l=>`
    <div class="li">
      <div><strong>${l.area}</strong><br><span style="color:var(--text2);font-size:.8rem">${new Date(l.date).toLocaleDateString('zh-CN')}</span></div>
      <span class="tag s">${Math.round(l.duration/60)}分钟</span>
    </div>
  `).join(''):'<div class="empty">暂无按摩记录</div>';
}

function showMain(){showView('mainView');}

renderSymptoms();
renderRecommendations();
</script>
</body>
</html>
