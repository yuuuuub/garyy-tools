<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>颜色记忆</title>
<meta name="description" content="颜色记忆挑战，考验你的色彩记忆力和反应速度">
<style>
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--success:#22c55e;--error:#ef4444}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20pxscroll-behavior:smooth;}
h1{font-size:1.8rem;margin-bottom:10px;color:var(--accent)}
.info-bar{display:flex;gap:12px;margin-bottom:15px;flex-wrap:wrap;justify-content:center}
.info-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:0.9rem}
.info-item span{color:var(--accent);font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:350px;width:100%;margin-bottom:15px}
.cell{aspect-ratio:1;border-radius:12px;cursor:pointer;transition:all 0.3s;user-select:none;border:3px solid transparent;opacity:0.4}
.cell.flash{opacity:1;transform:scale(1.08);box-shadow:0 0 20px currentColor}
.cell.selected{opacity:1;transform:scale(1.05);border-color:#fff}
.cell.correct{opacity:1;transform:scale(1.05);border-color:var(--success)}
.cell.wrong{opacity:0.6;transform:scale(0.95);border-color:var(--error);animation:shake 0.3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.msg{font-size:1.1rem;padding:10px;text-align:center;min-height:40px;color:var(--accent)}
.buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{background:var(--accent);color:var(--text);border:none;border-radius:8px;padding:10px 20px;font-size:1rem;cursor:pointer;font-family:inherit}
button:hover{opacity:0.85}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.container{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="颜色记忆">
  <meta property="og:description" content="颜色记忆挑战，考验你的色彩记忆力和反应速度">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/color-memory/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<h1>🌈 颜色记忆</h1>
<div class="info-bar">
  <div class="info-item">📊 等级: <span id="level">1</span></div>
  <div class="info-item">🔢 记忆: <span id="seqLen">3</span>个</div>
  <div class="info-item">🏆 最高等级: <span id="bestLevel">0</span></div>
</div>
<div class="grid" id="grid"></div>
<div class="msg" id="msg">点击"开始"记忆颜色序列</div>
<div class="buttons">
  <button onclick="startGame()">▶ 开始</button>
  <button onclick="resetGame()">🔄 重置</button>
</div>
<script>
const COLORS=['#ef4444','#f59e0b','#22c55e','#3b82f6','#8b5cf6','#ec4899','#06b6d4','#f97316','#84cc16','#e11d48','#14b8a6','#6366f1','#a855f7','#10b981','#f43f5e','#0ea5e9'];
let level=1,sequence=[],playerIdx=0,state='idle',bestLevel=parseInt(localStorage.getItem('cm_best')||'0');
document.getElementById('bestLevel').textContent=bestLevel;

function renderGrid(){
  const el=document.getElementById('grid');
  el.innerHTML='';
  COLORS.forEach((c,i)=>{
    const cell=document.createElement('div');
    cell.className='cell';
    cell.dataset.idx=i;
    cell.style.background=c;
    cell.style.color=c;
    cell.onclick=()=>onCellClick(i);
    el.appendChild(cell);
  });
}

function flashCell(idx,duration=500){
  return new Promise(resolve=>{
    const cell=document.querySelector(`.cell[data-idx="${idx}"]`);
    if(cell){cell.classList.add('flash');setTimeout(()=>{cell.classList.remove('flash');resolve()},duration)}
    else resolve();
  });
}

async function showSequence(){
  state='showing';
  document.getElementById('msg').textContent='👀 记住颜色顺序...';
  await new Promise(r=>setTimeout(r,500));
  for(let i=0;i<sequence.length;i++){
    await flashCell(sequence[i],600);
    await new Promise(r=>setTimeout(r,200));
  }
  state='input';
  document.getElementById('msg').textContent=`你的回合！点第 ${playerIdx+1} 个颜色`;
}

function onCellClick(idx){
  if(state!=='input')return;
  const cell=document.querySelector(`.cell[data-idx="${idx}"]`);
  if(idx===sequence[playerIdx]){
    cell.classList.add('correct');
    setTimeout(()=>cell.classList.remove('correct'),300);
    playerIdx++;
    if(playerIdx>=sequence.length){
      level++;
      document.getElementById('level').textContent=level;
      document.getElementById('msg').textContent='✅ 正确！下一关';
      setTimeout(()=>startRound(),1000);
    } else {
      document.getElementById('msg').textContent=`点第 ${playerIdx+1} 个颜色`;
    }
  } else {
    cell.classList.add('wrong');
    setTimeout(()=>cell.classList.remove('wrong'),300);
    gameOver();
  }
}

function generateSequence(){
  const len=level+2;
  sequence=[];
  for(let i=0;i<len;i++)sequence.push(Math.floor(Math.random()*COLORS.length));
  document.getElementById('seqLen').textContent=len;
}

function startRound(){generateSequence();playerIdx=0;showSequence()}
function startGame(){level=1;document.getElementById('level').textContent=1;startRound()}
function gameOver(){
  state='idle';
  if(level>bestLevel){bestLevel=level-1;localStorage.setItem('cm_best',bestLevel);document.getElementById('bestLevel').textContent=bestLevel}
  document.getElementById('msg').textContent=`❌ 错误！到达等级 ${level-1}`;
}
function resetGame(){state='idle';level=1;playerIdx=0;document.getElementById('level').textContent=1;document.getElementById('msg').textContent='点击"开始"记忆颜色序列';renderGrid()}
renderGrid();
</script>
<script src="../i18n.js" defer></script>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="position:fixed;bottom:20px;right:80px;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:1.1rem;opacity:0;transition:opacity .3s;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.3)" id="btt" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=window.scrollY>300?.8:0">↑</button><script>window.addEventListener("scroll",function(){var b=document.getElementById("btt");if(b)b.style.opacity=window.scrollY>300?.8:0});</script>
</body>
</html>
