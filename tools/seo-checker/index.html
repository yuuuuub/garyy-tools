<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEO检查</title>
<meta name="description" content="SEO优化检查工具，分析网站搜索引擎优化情况">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--muted:#8b949e;--green:#3fb950;--red:#f85149;--yellow:#d29922}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;min-height:100vh}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px}
.header h1{font-size:20px;font-weight:600}
.container{max-width:800px;margin:0 auto;padding:24px}
.input-row{display:flex;gap:8px;margin-bottom:20px}
.input-row input{flex:1;padding:12px 16px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;outline:none}
.input-row input:focus{border-color:var(--accent)}
.btn{padding:12px 24px;border-radius:8px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:14px;font-weight:500}
.btn:hover{opacity:.9}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.card h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.score-bar{height:12px;background:var(--border);border-radius:6px;margin:8px 0;overflow:hidden}
.score-fill{height:100%;border-radius:6px;transition:width .5s}
.check-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.check-item:last-child{border-bottom:none}
.check-icon{font-size:18px;flex-shrink:0;margin-top:2px}
.check-label{color:var(--muted);margin-bottom:2px;font-size:12px}
.check-value{word-break:break-all}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.info-row:last-child{border-bottom:none}
.info-row .label{color:var(--muted)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
.result{display:none}
.result.show{display:block}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
</head>
<body>
<div class="header">
<span style="font-size:28px">📊</span>
<h1>SEO检查</h1>
</div>
<div class="container">
<div class="input-row">
<input type="text" id="url" placeholder="输入页面URL（需同域）" title="Enter键搜索" onkeydown="if(event.key==='Enter')analyze()">
<button class="btn" onclick="analyze()">分析当前页面</button>
</div>
<div class="result" id="result">
<div class="card">
<h2>📈 SEO评分</h2>
<div class="score-bar"><div class="score-fill" id="scoreFill" style="width:0"></div></div>
<div style="text-align:center;font-size:24px;font-weight:700" id="scoreText">0/100</div>
</div>
<div class="card">
<h2>📋 基本标签</h2>
<div id="metaInfo"></div>
</div>
<div class="card">
<h2>📝 标题分析</h2>
<div id="titleInfo"></div>
</div>
<div class="card">
<h2>📖 描述分析</h2>
<div id="descInfo"></div>
</div>
<div class="card">
<h2>🔑 关键词分析</h2>
<div id="keywordInfo"></div>
</div>
<div class="card">
<h2>🖼️ 图片检查</h2>
<div id="imgInfo"></div>
</div>
<div class="card">
<h2>🔗 链接检查</h2>
<div id="linkInfo"></div>
</div>
<div class="card">
<h2>📑 结构化数据</h2>
<div id="schemaInfo"></div>
</div>
</div>
</div>
<script>
function analyze(){
let score=0;const checks=[];
const title=document.title;
const desc=document.querySelector('meta[name="description"]')?.content||'';
const keywords=document.querySelector('meta[name="keywords"]')?.content||'';
const canonical=document.querySelector('link[rel="canonical"]')?.href||'';
const ogTitle=document.querySelector('meta[property="og:title"]')?.content||'';
const ogDesc=document.querySelector('meta[property="og:description"]')?.content||'';
const ogImage=document.querySelector('meta[property="og:image"]')?.content||'';
const viewport=document.querySelector('meta[name="viewport"]')?.content||'';
const robots=document.querySelector('meta[name="robots"]')?.content||'';
const h1s=document.querySelectorAll('h1');
const imgs=document.querySelectorAll('img');
let imgNoAlt=0;imgs.forEach(i=>{if(!i.alt)imgNoAlt++});
const links=document.querySelectorAll('a[href]');
let externalLinks=0;links.forEach(l=>{if(l.hostname!==location.hostname)externalLinks++});
const schemas=document.querySelectorAll('script[type="application/ld+json"]');
// Title check
if(title){score+=15;checks.push(checkItem(true,'title',`"${title}" (${title.length}字符)`,title.length>=10&&title.length<=60?'长度合适':'建议10-60字符'))}
else{checks.push(checkItem(false,'title','未设置标题','必须设置title标签'))}
// Description check
if(desc){score+=15;checks.push(checkItem(true,'desc',`"${desc.slice(0,80)}..." (${desc.length}字符)`,desc.length>=120&&desc.length<=160?'长度合适':'建议120-160字符'))}
else{checks.push(checkItem(false,'desc','未设置描述','建议添加meta description'))}
// Keywords
if(keywords){score+=5;checks.push(checkItem(true,'kw',`${keywords.split(',').length}个关键词`,''))}
else{checks.push(checkItem(false,'kw','未设置关键词','可选'))}
// Canonical
if(canonical){score+=5;checks.push(checkItem(true,'canon',canonical,''))}
else{checks.push(checkItem(false,'canon','未设置canonical','建议设置'))}
// OG tags
if(ogTitle)score+=5;if(ogDesc)score+=5;if(ogImage)score+=5;
checks.push(checkItem(!!ogTitle,'og','OG标题: '+(ogTitle||'未设置'),''));
checks.push(checkItem(!!ogDesc,'og','OG描述: '+(ogDesc?'已设置':'未设置'),''));
checks.push(checkItem(!!ogImage,'og','OG图片: '+(ogImage?'已设置':'未设置'),''));
// Viewport
if(viewport){score+=5;checks.push(checkItem(true,'vp','响应式: 已设置',''))}
else{checks.push(checkItem(false,'vp','未设置viewport','移动端不适配'))}
// H1
if(h1s.length===1){score+=10;checks.push(checkItem(true,'h1',`"${h1s[0].textContent.slice(0,50)}"`,''))}
else if(h1s.length>1){checks.push(checkItem(false,'h1',`${h1s.length}个H1标签','建议只用1个'))}
else{checks.push(checkItem(false,'h1','没有H1标签','必须有且仅有1个'))}
// Images
const totalImgs=imgs.length;
if(totalImgs>0){if(imgNoAlt===0){score+=10;checks.push(checkItem(true,'img',`${totalImgs}张图片全部有alt`,''))}
else{checks.push(checkItem(false,'img',`${imgNoAlt}/${totalImgs}张图片缺少alt`,'所有图片应有alt属性'))}}
else{checks.push(checkItem(true,'img','无图片',''))}
// Links
score+=5;checks.push(checkItem(externalLinks>0,'links',`${links.length}个链接, ${externalLinks}个外部链接`,''));
// Schema
if(schemas.length>0){score+=10;checks.push(checkItem(true,'schema',`${schemas.length}个结构化数据`,''))}
else{checks.push(checkItem(false,'schema','无结构化数据','建议添加JSON-LD'))}
// Robots
if(robots&&!robots.includes('noindex')){score+=5;checks.push(checkItem(true,'robots',robots,''))}
else if(!robots){checks.push(checkItem(true,'robots','未设置(默认允许)',''))}
else{checks.push(checkItem(false,'robots',robots,'可能阻止索引'))}
// Render
const scoreColor=score>=80?'var(--green)':score>=50?'var(--yellow)':'var(--red)';
document.getElementById('scoreFill').style.width=score+'%';
document.getElementById('scoreFill').style.background=scoreColor;
document.getElementById('scoreText').textContent=score+'/100';
document.getElementById('scoreText').style.color=scoreColor;
document.getElementById('metaInfo').innerHTML=checks.slice(0,4).join('');
document.getElementById('titleInfo').innerHTML=checks[4]||'';
document.getElementById('descInfo').innerHTML=checks[1]||'';
document.getElementById('keywordInfo').innerHTML=checks[2]||'';
document.getElementById('imgInfo').innerHTML=checks.find(c=>c.includes('img'))||'';
document.getElementById('linkInfo').innerHTML=checks.find(c=>c.includes('links'))||'';
document.getElementById('schemaInfo').innerHTML=checks.find(c=>c.includes('schema'))||'';
document.getElementById('result').classList.add('show');
}
function checkItem(ok,label,value,tip){
return `<div class="check-item"><span class="check-icon">${ok?'✅':'⚠️'}</span><div><div class="check-label">${label}</div><div class="check-value">${value}</div>${tip?`<div style="font-size:12px;color:var(--muted)">${tip}</div>`:''}</div></div>`;
}
analyze();
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
