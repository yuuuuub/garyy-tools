<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HTML验证工具 - 验证HTML代码规范性">
    <meta name="robots" content="index, follow">
    <title>HTML验证工具</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --border-color: #dee2e6;
            --card-bg: #f8f9fa;
        }
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --primary-color: #0d6efd;
            --secondary-color: #6c757d;
            --success-color: #198754;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --border-color: #444444;
            --card-bg: #2d2d2d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        h1 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-family: monospace;
            resize: vertical;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            opacity: 0.9;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--card-bg);
        }
        .error-item {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 4px;
            background-color: rgba(220, 53, 69, 0.1);
            border-left: 4px solid var(--danger-color);
        }
        .warning-item {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 4px;
            background-color: rgba(255, 193, 7, 0.1);
            border-left: 4px solid var(--warning-color);
        }
        .info-item {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 4px;
            background-color: rgba(0, 123, 255, 0.1);
            border-left: 4px solid var(--primary-color);
        }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 8px 12px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .score {
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
        }
        .score.good {
            color: var(--success-color);
        }
        .score.average {
            color: var(--warning-color);
        }
        .score.poor {
            color: var(--danger-color);
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    <div class="container">
        <h1>HTML验证工具</h1>
        <p>输入HTML代码验证规范性</p>
        
        <div class="form-group">
            <label for="htmlInput">HTML代码:</label>
            <textarea id="htmlInput" rows="15" placeholder="粘贴HTML代码..."></textarea>
        </div>
        
        <button onclick="runValidation()">开始验证</button>
        
        <div id="result" class="result" style="display: none;">
            <h2>验证结果</h2>
            <div id="score" class="score"></div>
            <div id="issues"></div>
        </div>
    </div>

    <script src="i18n.js" defer></script>
    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            html.setAttribute('data-theme', currentTheme === 'light' ? 'dark' : 'light');
        }

        function runValidation() {
            const htmlInput = document.getElementById('htmlInput').value;
            
            if (!htmlInput) {
                alert('请输入HTML代码');
                return;
            }
            
            const issues = [];
            let score = 100;
            
            // 检查DOCTYPE
            if (!htmlInput.toLowerCase().includes('<!doctype html>')) {
                score -= 10;
                issues.push({
                    type: 'error',
                    message: '缺少DOCTYPE声明'
                });
            }
            
            // 检查html标签
            if (!htmlInput.includes('<html')) {
                score -= 10;
                issues.push({
                    type: 'error',
                    message: '缺少html标签'
                });
            }
            
            // 检查head和body
            if (!htmlInput.includes('<head>') || !htmlInput.includes('</head>')) {
                score -= 5;
                issues.push({
                    type: 'warning',
                    message: '缺少head标签或head标签未正确闭合'
                });
            }
            
            if (!htmlInput.includes('<body>') || !htmlInput.includes('</body>')) {
                score -= 5;
                issues.push({
                    type: 'warning',
                    message: '缺少body标签或body标签未正确闭合'
                });
            }
            
            // 检查meta charset
            if (!htmlInput.includes('charset=')) {
                score -= 5;
                issues.push({
                    type: 'warning',
                    message: '缺少字符集声明'
                });
            }
            
            // 检查标题
            if (!htmlInput.includes('<title>') || !htmlInput.includes('</title>')) {
                score -= 5;
                issues.push({
                    type: 'warning',
                    message: '缺少标题标签'
                });
            }
            
            // 检查图片alt属性
            const imgRegex = /<img[^>]+>/gi;
            const imgMatches = htmlInput.match(imgRegex) || [];
            imgMatches.forEach((img, index) => {
                if (!img.includes('alt=') || img.includes('alt=""')) {
                    score -= 2;
                    issues.push({
                        type: 'warning',
                        message: `图片缺少alt属性 (第${index + 1}个)`
                    });
                }
            });
            
            // 检查标签闭合
            const tagRegex = /<([a-z][a-z0-9]*)\b[^>]*>/gi;
            const tags = htmlInput.match(tagRegex) || [];
            const selfClosingTags = ['img', 'br', 'hr', 'input', 'meta', 'link'];
            const openTags = [];
            
            tags.forEach(tag => {
                const tagName = tag.match(/<([a-z][a-z0-9]*)/i)[1].toLowerCase();
                if (!selfClosingTags.includes(tagName)) {
                    openTags.push(tagName);
                }
            });
            
            // 简单检查未闭合标签
            const closeTagRegex = /<\/([a-z][a-z0-9]*)>/gi;
            const closeTags = htmlInput.match(closeTagRegex) || [];
            if (openTags.length > closeTags.length) {
                score -= 5;
                issues.push({
                    type: 'warning',
                    message: '可能存在未闭合的标签'
                });
            }
            
            // 检查内联样式
            if (htmlInput.includes('style=') && htmlInput.split('style=').length > 10) {
                score -= 3;
                issues.push({
                    type: 'info',
                    message: '使用了较多内联样式，建议使用外部样式表'
                });
            }
            
            // 检查废弃标签
            const deprecatedTags = ['<font', '<center', '<marquee', '<blink'];
            deprecatedTags.forEach(tag => {
                if (htmlInput.toLowerCase().includes(tag)) {
                    score -= 5;
                    issues.push({
                        type: 'error',
                        message: `使用了废弃的标签: ${tag}`
                    });
                }
            });
            
            // 计算最终分数
            score = Math.max(0, Math.min(100, score));
            
            // 显示结果
            const scoreDiv = document.getElementById('score');
            const issuesDiv = document.getElementById('issues');
            
            scoreDiv.textContent = `${score}分`;
            scoreDiv.className = `score ${score >= 80 ? 'good' : score >= 60 ? 'average' : 'poor'}`;
            
            if (issues.length === 0) {
                issuesDiv.innerHTML = '<div class="info-item">HTML验证通过</div>';
            } else {
                issuesDiv.innerHTML = issues.map(issue => 
                    `<div class="${issue.type}-item">${issue.message}</div>`
                ).join('');
            }
            
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
