<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="scroll-behavior:smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📝 会议记录</title>
<meta name="description" content="会议记录工具，高效记录和管理会议内容">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#3b82f6;--accent2:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;--green:#1a7f37;--red:#cf222e;--yellow:#bf8700}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.ctn{max-width:700px;margin:0 auto}
.hdr{text-align:center;margin-bottom:24px}
.hdr h1{font-size:1.8rem;font-weight:700}
.hdr p{color:var(--text2);margin-top:4px;font-size:.9rem}
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.cd h2{font-size:1.1rem;margin-bottom:12px;color:var(--accent)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px;margin-top:10px}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;font-family:inherit}
button:hover{opacity:.9}
button:active{transform:scale(.97)}
button.sec{background:var(--bg);border:1px solid var(--border);color:var(--text)}
button.dng{background:var(--red)}
button.grn{background:var(--green)}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.topic-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px}
.topic-card h3{font-size:.95rem;margin-bottom:8px}
.topic-card textarea{min-height:50px}
.action-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;background:var(--bg);padding:10px;border-radius:8px;border:1px solid var(--border)}
.action-row input,.action-row select{margin-bottom:0}
.action-row input:first-child{flex:2}
.action-row select{width:auto;min-width:90px}
.timer{font-size:2rem;font-weight:700;text-align:center;color:var(--accent);font-variant-numeric:tabular-nums}
.timer-btns{display:flex;gap:8px;justify-content:center;margin-top:8px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-green{background:rgba(63,185,80,.2);color:var(--green)}
.badge-yellow{background:rgba(210,153,34,.2);color:var(--yellow)}
.badge-red{background:rgba(248,81,73,.2);color:var(--red)}
.meeting-item{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .2s}
.meeting-item:hover{background:rgba(59,130,246,.05)}
.meeting-item:last-child{border-bottom:none}
.hidden{display:none!important}
@media(max-width:600px){body{padding:10px}.ctn{max-width:100%}.cd{padding:14px}h1{font-size:1.4rem}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body,.ctn{animation:fadeIn .4s ease-out}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<meta name="robots" content="index, follow">
<meta property="og:title" content="📝 会议记录">
<meta property="og:description" content="会议记录工具，高效记录和管理会议内容">
<meta property="og:type" content="website">
<meta property="og:url" content="https://garyy.top/tools/meeting-notes-cn/">
<meta property="og:image" content="https://garyy.top/og-image.png">
<script src="../i18n.js" defer></script>
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="ctn" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const STORE='mtg_data';
let meetings=JSON.parse(localStorage.getItem(STORE)||'[]');
let curView='list';let curId=null;
let timerSec=0,timerRunning=false,timerInterval=null;
let topics=[],actions=[];
function save(){localStorage.setItem(STORE,JSON.stringify(meetings))}
function fmt(s){const h=String(Math.floor(s/3600)).padStart(2,'0');const m=String(Math.floor(s%3600/60)).padStart(2,'0');const sec=String(s%60).padStart(2,'0');return h+':'+m+':'+sec}
function render(){
  let h=`<div class="hdr"><h1>📝 会议记录</h1><p>高效记录和管理会议内容</p></div>`;
  h+=`<div class="flex" style="justify-content:center;margin-bottom:16px"><button onclick="showNew()">新建会议</button><button class="sec" onclick="showList()">会议列表</button></div>`;
  h+=`<div id="viewNew" class="${curView==='new'?'':'hidden'}"></div>`;
  h+=`<div id="viewList" class="${curView==='list'?'':'hidden'}"></div>`;
  h+=`<div id="viewDetail" class="${curView==='detail'?'':'hidden'}"></div>`;
  $('app').innerHTML=h;
  if(curView==='new')renderNew();
  if(curView==='list')renderList();
  if(curView==='detail')renderDetail();
}
function showNew(){curView='new';curId=null;topics=[{title:'',content:'',conclusion:''}];actions=[{assignee:'',task:'',deadline:'',status:'待处理'}];timerSec=0;timerRunning=false;clearInterval(timerInterval);timerInterval=null;render();renderTimer()}
function showList(){curView='list';render()}
function showDetail(i){curView='detail';curId=i;render()}
function renderTimer(){
  const el=$('timerDisplay');if(!el)return;
  el.textContent=fmt(timerSec);
}
function toggleTimer(){
  if(timerRunning){clearInterval(timerInterval);timerInterval=null;timerRunning=false;}
  else{timerRunning=true;timerInterval=setInterval(()=>{timerSec++;renderTimer();},1000);}
  const btn=$('timerBtn');if(btn)btn.textContent=timerRunning?'⏸ 暂停':'▶ 开始';
}
function resetTimer(){clearInterval(timerInterval);timerInterval=null;timerRunning=false;timerSec=0;renderTimer();const btn=$('timerBtn');if(btn)btn.textContent='▶ 开始'}
function renderNew(){
  let h=`<div class="cd"><h2>会议信息</h2>`;
  h+=`<label>会议主题</label><input type="text" id="mTopic" placeholder="会议主题">`;
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>日期</label><input type="date" id="mDate" value="${new Date().toISOString().slice(0,10)}"></div>`;
  h+=`<div><label>时间</label><input type="time" id="mTime" value="${new Date().toTimeString().slice(0,5)}"></div></div>`;
  h+=`<label>参会人员（逗号分隔）</label><input type="text" id="mPeople" placeholder="张三, 李四, 王五">`;
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>地点</label><input type="text" id="mPlace" placeholder="会议室A"></div>`;
  h+=`<div><label>会议类型</label><select id="mType"><option>项目周会</option><option>需求评审</option><option>技术分享</option><option>站会</option><option>其他</option></select></div></div></div>`;
  h+=`<div class="cd"><h2>会议计时</h2><div class="timer" id="timerDisplay">00:00:00</div>`;
  h+=`<div class="timer-btns"><button id="timerBtn" onclick="toggleTimer()">▶ 开始</button><button class="sec" onclick="resetTimer()">重置</button></div></div>`;
  h+=`<div class="cd"><h2>讨论议题 <button class="sec" style="float:right;padding:4px 12px;font-size:.8rem" onclick="addTopic()">+ 添加</button></h2><div id="topicList"></div></div>`;
  h+=`<div class="cd"><h2>行动项 <button class="sec" style="float:right;padding:4px 12px;font-size:.8rem" onclick="addAction()">+ 添加</button></h2><div id="actionList"></div></div>`;
  h+=`<div class="bg" style="justify-content:center"><button class="grn" onclick="saveMeeting()">保存会议</button><button class="sec" onclick="showList()">取消</button></div>`;
  $('viewNew').innerHTML=h;
  renderTopics();renderActions();renderTimer();
}
function addTopic(){topics.push({title:'',content:'',conclusion:''});renderTopics()}
function removeTopic(i){topics.splice(i,1);renderTopics()}
function renderTopics(){
  let h='';topics.forEach((t,i)=>{
    h+=`<div class="topic-card"><div class="flex-between"><b>议题 ${i+1}</b><button class="dng" style="padding:2px 8px;font-size:.75rem" onclick="removeTopic(${i})">✕</button></div>`;
    h+=`<label>议题标题</label><input type="text" value="${t.title}" placeholder="议题标题" onchange="topics[${i}].title=this.value">`;
    h+=`<label>讨论内容</label><textarea placeholder="讨论内容..." onchange="topics[${i}].content=this.value">${t.content}</textarea>`;
    h+=`<label>结论</label><input type="text" value="${t.conclusion}" placeholder="结论/决定" onchange="topics[${i}].conclusion=this.value"></div>`;
  });
  const el=$('topicList');if(el)el.innerHTML=h;
}
function addAction(){actions.push({assignee:'',task:'',deadline:'',status:'待处理'});renderActions()}
function removeAction(i){actions.splice(i,1);renderActions()}
function renderActions(){
  let h='';actions.forEach((a,i)=>{
    h+=`<div class="action-row"><input type="text" value="${a.assignee}" placeholder="负责人" onchange="actions[${i}].assignee=this.value">`;
    h+=`<input type="text" value="${a.task}" placeholder="任务描述" onchange="actions[${i}].task=this.value">`;
    h+=`<input type="date" value="${a.deadline}" onchange="actions[${i}].deadline=this.value">`;
    h+=`<select onchange="actions[${i}].status=this.value"><option${a.status==='待处理'?' selected':''}>待处理</option><option${a.status==='进行中'?' selected':''}>进行中</option><option${a.status==='已完成'?' selected':''}>已完成</option></select>`;
    h+=`<button class="dng" style="padding:4px 8px;font-size:.8rem" onclick="removeAction(${i})">✕</button></div>`;
  });
  const el=$('actionList');if(el)el.innerHTML=h;
}
function saveMeeting(){
  const topic=$('mTopic').value.trim()||'未命名会议';
  const people=($('mPeople').value||'').split(',').map(s=>s.trim()).filter(Boolean);
  const m={id:Date.now(),topic,date:$('mDate').value,time:$('mTime').value,people,place:$('mPlace').value,type:$('mType').value,duration:timerSec,topics:topics.filter(t=>t.title.trim()),actions:actions.filter(a=>a.task.trim())};
  meetings.unshift(m);save();showList();
}
function renderList(){
  let h=`<div class="cd"><h2>会议列表 (${meetings.length})</h2>`;
  if(meetings.length===0)h+=`<div style="text-align:center;color:var(--text2);padding:30px">暂无会议记录</div>`;
  else meetings.forEach((m,i)=>{
    const sc=m.actions?a.actions.filter(a=>a.status==='已完成').length:0;
    const tc=m.actions?m.actions.length:0;
    h+=`<div class="meeting-item" onclick="showDetail(${i})"><div><b>${m.topic}</b><br><span style="font-size:.8rem;color:var(--text2)">${m.date} ${m.time} · ${m.people.length}人 · ${m.type}</span></div>`;
    h+=`<div style="text-align:right"><span class="badge badge-green">${sc}/${tc}项</span></div></div>`;
  });
  h+=`</div>`;
  $('viewList').innerHTML=h;
}
function renderDetail(){
  if(curId===null||!meetings[curId]){showList();return;}
  const m=meetings[curId];
  let h=`<div class="cd"><div class="flex-between"><button class="sec" onclick="showList()">← 返回</button><button class="dng" style="padding:6px 14px;font-size:.85rem" onclick="delMeeting()">删除</button></div></div>`;
  h+=`<div class="cd"><h2>${m.topic}</h2>`;
  h+=`<p><b>日期：</b>${m.date} ${m.time}　<b>类型：</b>${m.type}</p>`;
  h+=`<p><b>地点：</b>${m.place||'未填写'}　<b>时长：</b>${fmt(m.duration)}</p>`;
  h+=`<p><b>参会人员：</b>${m.people.join('、')||'未填写'}</p></div>`;
  if(m.topics&&m.topics.length>0){
    h+=`<div class="cd"><h2>讨论议题</h2>`;
    m.topics.forEach((t,i)=>{h+=`<div class="topic-card"><b>${i+1}. ${t.title}</b>`;if(t.content)h+=`<p style="margin-top:6px;color:var(--text2)">${t.content}</p>`;if(t.conclusion)h+=`<p style="margin-top:4px;color:var(--green)">结论：${t.conclusion}</p>`;h+=`</div>`;});
    h+=`</div>`;
  }
  if(m.actions&&m.actions.length>0){
    h+=`<div class="cd"><h2>行动项</h2>`;
    m.actions.forEach(a=>{
      const sc=a.status==='已完成'?'badge-green':a.status==='进行中'?'badge-yellow':'badge-red';
      h+=`<div class="action-row"><span style="flex:1">${a.task}</span><span style="font-size:.8rem;color:var(--text2)">${a.assignee}</span><span style="font-size:.8rem;color:var(--text2)">${a.deadline}</span><span class="badge ${sc}">${a.status}</span></div>`;
    });
    h+=`</div>`;
  }
  h+=`<div class="bg" style="justify-content:center"><button onclick="copyNotes()">复制会议记录</button></div>`;
  $('viewDetail').innerHTML=h;
}
function copyNotes(){
  const m=meetings[curId];
  let txt=`会议：${m.topic}\n日期：${m.date} ${m.time}\n地点：${m.place}\n类型：${m.type}\n参会：${m.people.join('、')}\n时长：${fmt(m.duration)}\n\n议题：\n`;
  (m.topics||[]).forEach((t,i)=>txt+=`${i+1}. ${t.title}\n   ${t.content}\n   结论：${t.conclusion}\n\n`);
  txt+=`行动项：\n`;
  (m.actions||[]).forEach(a=>txt+=`- [${a.status}] ${a.assignee}: ${a.task} (截止${a.deadline})\n`);
  navigator.clipboard.writeText(txt).then(()=>alert('已复制！')).catch(()=>alert('复制失败'));
}
function delMeeting(){if(!confirm('确定删除此会议记录？'))return;meetings.splice(curId,1);save();showList()}
render();
</script>
</body>
</html>
