<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>屏幕信息</title>
<meta name="description" content="屏幕信息查看工具，显示设备屏幕分辨率等参数">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--transition:0.2s ease;--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#3b82f6;--muted:#8b949e;--green:#3fb950}[data-theme="light"]{--bg:#f6f8fa;--card:#fff;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--blue:#0969da;--green:#1a7f37;--red:#cf222e}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;min-height:100vhpadding:16px;scroll-behavior:smooth;}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px}
.header h1{font-size:20px;font-weight:600}
.container{max-width:800px;margin:0 auto;padding:24px}
.screen-preview{width:100%;height:120px;background:linear-gradient(135deg,var(--accent),#8b5cf6);border-radius:12px;margin-bottom:24px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;position:relative;overflow:hidden}
.screen-preview span{position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.card h3{font-size:16px;margin-bottom:12px;color:var(--accent)}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.info-row:last-child{border-bottom:none}
.info-row .label{color:var(--muted)}
.info-row .value{font-weight:500}
.ruler{height:40px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin:8px 0;position:relative;overflow:hidden}
.ruler-marks{display:flex;height:100%;align-items:flex-end;padding:0 4px}
.ruler-mark{flex:1;border-left:1px solid var(--border);height:60%;position:relative}
.ruler-mark:nth-child(5n){height:100%;border-color:var(--accent)}
.ruler-mark:nth-child(5n)::after{content:attr(data-v);position:absolute;bottom:-16px;left:2px;font-size:9px;color:var(--muted)}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="屏幕信息">
  <meta property="og:description" content="屏幕信息查看工具，显示设备屏幕分辨率等参数">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://garyy.top/tools/screen-info/">
  <meta property="og:image" content="https://garyy.top/og-image.png">
</head>
<body>
<div style="position:fixed;top:8px;left:8px;z-index:9999"><a href="../index.html" style="text-decoration:none;color:var(--text2);font-size:.75rem;background:var(--card);padding:4px 10px;border-radius:8px;border:1px solid var(--border)">← 首页</a></div>
<div class="header">
<span style="font-size:28px">🖥️</span>
<h1>屏幕信息</h1>
</div>
<div class="container">
<div class="screen-preview"><span id="screenRes">${screen.width} × ${screen.height}</span></div>
<div class="card">
<h2>📐 分辨率信息</h2>
<div id="resInfo"></div>
</div>
<div class="card">
<h2>🎨 色彩信息</h2>
<div id="colorInfo"></div>
</div>
<div class="card">
<h2>📏 视口信息</h2>
<div id="viewportInfo"></div>
</div>
<div class="card">
<h2>🧭 方向信息</h2>
<div id="orientInfo"></div>
</div>
<div class="card">
<h2>📏 像素尺</h2>
<div class="ruler"><div class="ruler-marks" id="rulerMarks"></div></div>
</div>
</div>
<script>
function ir(l,v){return `<div class="info-row"><span class="label">${l}</span><span class="value">${v}</span></div>`}
document.getElementById('screenRes').textContent=screen.width+' × '+screen.height;
document.getElementById('resInfo').innerHTML=[
ir('屏幕宽度',screen.width+'px'),
ir('屏幕高度',screen.height+'px'),
ir('可用宽度',screen.availWidth+'px'),
ir('可用高度',screen.availHeight+'px'),
ir('色彩深度',screen.colorDepth+'bit'),
ir('像素比',window.devicePixelRatio+'x'),
ir('物理分辨率',screen.width*window.devicePixelRatio+' × '+screen.height*window.devicePixelRatio)
].join('');
document.getElementById('colorInfo').innerHTML=[
ir('色深',screen.colorDepth+'bit ('+Math.pow(2,screen.colorDepth)+'色)'),
ir('像素比',window.devicePixelRatio),
ir('颜色方案',window.matchMedia('(prefers-color-scheme:dark)').matches?'深色':'浅色'),
ir('对比度增强',window.matchMedia('(prefers-contrast:more)').matches?'是':'否'),
ir('减少动画',window.matchMedia('(prefers-reduced-motion:reduce)').matches?'是':'否')
].join('');
document.getElementById('viewportInfo').innerHTML=[
ir('视口宽度',window.innerWidth+'px'),
ir('视口高度',window.innerHeight+'px'),
ir('文档宽度',document.documentElement.clientWidth+'px'),
ir('文档高度',document.documentElement.clientHeight+'px'),
ir('滚动条宽度',window.innerWidth-document.documentElement.clientWidth+'px')
].join('');
const orient=screen.orientation||{};
document.getElementById('orientInfo').innerHTML=[
ir('方向类型',orient.type||'N/A'),
ir('角度',orient.angle!=null?orient.angle+'°':'N/A'),
ir('横向?',window.innerWidth>window.innerHeight?'是':'否')
].join('');
const ruler=document.getElementById('rulerMarks');
for(let i=0;i<=50;i++){
const m=document.createElement('div');
m.className='ruler-mark';
m.setAttribute('data-v',i%5===0?i*10+'px':'');
ruler.appendChild(m);
}
</script>
<script src="../i18n.js" defer></script>
</body>
</html>
