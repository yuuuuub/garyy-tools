// 收藏功能
var favs=JSON.parse(localStorage.getItem('garyy_favs')||'[]');
function toggleFav(p,e){
  e.stopPropagation();e.preventDefault();
  var idx=favs.indexOf(p);
  if(idx>-1)favs.splice(idx,1);else favs.push(p);
  localStorage.setItem('garyy_favs',JSON.stringify(favs));
  var card=document.querySelector('[href="/tools/'+p+'"]');
  if(card)card.classList.toggle('is-fav',favs.indexOf(p)>-1);
}

// 最近访问
function addRecent(p){var r=JSON.parse(localStorage.getItem('garyy_recent')||'[]');r=r.filter(function(x){return x!==p});r.unshift(p);if(r.length>10)r=r.slice(0,10);localStorage.setItem('garyy_recent',JSON.stringify(r));}

// 数字动画
function animateNum(el,target){
  var start=0;var duration=800;var startTime=null;
  function step(ts){
    if(!startTime)startTime=ts;
    var progress=Math.min((ts-startTime)/duration,1);
    el.textContent=Math.floor(progress*target);
    if(progress<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function render(){
  var cnt=document.getElementById('tools-container');
  var total=tools.reduce(function(s,c){return s+c.i.length},0);
  animateNum(document.getElementById('totalCount'),total);
  animateNum(document.getElementById('catCount'),tools.length);
  document.getElementById('headerDesc').textContent=total+'+ 免费在线小工具，即开即用';

  var allTools=tools.flatMap(function(c){return c.i});
  var ri=Math.floor(Math.random()*allTools.length);
  document.getElementById('randomLink').href='/tools/'+allTools[ri].p;

  // 渲染分类导航
  var navHtml=tools.map(function(c,i){
    return '<button class="cat-nav-btn" data-idx="'+i+'">'+c.c.slice(0,2)+' '+c.c.slice(3)+'</button>';
  }).join('');
  document.getElementById('catNav').innerHTML=navHtml;

  // 渲染工具列表
  cnt.innerHTML=tools.map(function(c,cIdx){
    return '<div class="category" data-cat="'+c.c+'" id="cat-'+cIdx+'">'+
      '<div class="cat-header"><span class="cat-icon">'+c.c.charAt(0)+'</span><span class="cat-title">'+c.c.slice(2)+'</span><span class="cat-count">'+c.i.length+'</span></div>'+
      '<div class="tools-grid">'+c.i.map(function(t){
        var isFav=favs.indexOf(t.p)>-1;
        return '<a class="tool-card'+(isFav?' is-fav':'')+'" href="/tools/'+t.p+'" onclick="addRecent(\''+t.p+'\')"><span class="emoji">'+t.e+'</span><span class="name">'+t.n+'</span><span class="fav-btn" onclick="toggleFav(\''+t.p+'\',event)">'+(isFav?'❤️':'🤍')+'</span></a>';
      }).join('')+'</div></div>';
  }).join('');
}
render();

// 分类导航点击
document.getElementById('catNav').addEventListener('click',function(e){
  var btn=e.target.closest('.cat-nav-btn');
  if(!btn)return;
  var idx=btn.dataset.idx;
  document.querySelectorAll('.cat-nav-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  var el=document.getElementById('cat-'+idx);
  if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
});

// 搜索功能
document.getElementById('search').addEventListener('input',function(){
  var q=this.value.toLowerCase();
  var visible=0;
  document.querySelectorAll('.category').forEach(function(cat){
    var cv=false;
    cat.querySelectorAll('.tool-card').forEach(function(card){
      var name=card.querySelector('.name').textContent.toLowerCase();
      if(!q||name.indexOf(q)>-1){card.classList.remove('hidden');cv=true;visible++}
      else card.classList.add('hidden');
    });
    cat.classList.toggle('hidden',!cv);
  });
  document.getElementById('totalCount').textContent=visible||'0';
  document.getElementById('searchCount').textContent=q?visible+' 个结果':'';
});

// 返回顶部按钮
window.addEventListener('scroll',function(){
  document.getElementById('backToTop').classList.toggle('show',window.scrollY>300);
});

// 键盘快捷键
document.addEventListener('keydown',function(e){
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('search').focus();}
  if(e.key==='Escape')document.getElementById('search').blur();
});
