function render(){
  const cnt = document.getElementById('tools-container');
  const total = tools.reduce((s,c)=>s+c.i.length,0);
  document.getElementById('totalCount').textContent = total;
  document.getElementById('catCount').textContent = tools.length;
  document.getElementById('headerDesc').textContent = total+'+ 免费在线小工具，即开即用';

  const allTools = tools.flatMap(c=>c.i);
  const ri = Math.floor(Math.random()*allTools.length);
  document.getElementById('randomLink').href = '/tools/'+allTools[ri].p;

  cnt.innerHTML = tools.map(c=>`
    <div class="category" data-cat="${c.c}">
      <div class="cat-header"><span class="cat-icon">${c.c.charAt(0)}</span><span class="cat-title">${c.c.slice(2)}</span><span class="cat-count">${c.i.length}</span></div>
      <div class="tools-grid">${c.i.map(t=>`<a class="tool-card" href="/tools/${t.p}"><span class="emoji">${t.e}</span><span class="name">${t.n}</span></a>`).join('')}</div>
    </div>
  `).join('');
}
render();

document.getElementById('search').addEventListener('input',function(){
  const q = this.value.toLowerCase();
  let visible=0;
  document.querySelectorAll('.category').forEach(cat=>{
    let cv=false;
    cat.querySelectorAll('.tool-card').forEach(card=>{
      const name=card.querySelector('.name').textContent.toLowerCase();
      if(!q||name.includes(q)){card.classList.remove('hidden');cv=true;visible++}
      else card.classList.add('hidden');
    });
    cat.classList.toggle('hidden',!cv);
  });
  document.getElementById('totalCount').textContent=visible||'0';
});
</script>
