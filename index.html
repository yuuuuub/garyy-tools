function animateNum(el,target){
  var start=0;var duration=800;var startTime=null;

  document.getElementById('totalLabel').textContent=isEn?'Total Tools':'工具总数';
  document.getElementById('catLabel').textContent=isEn?'Categories':'分类数量';
  document.getElementById('randomLabel').textContent=isEn?'Random':'随机探索';
  document.getElementById('search').placeholder=isEn?'Search tools...':'搜索工具...';
  document.getElementById('footerText').textContent=isEn?'All tools run locally in browser, no data uploaded':'全部工具浏览器本地运行，数据不上传服务器';
  document.getElementById('searchCount').textContent='';

  var allTools=tools.flatMap(function(c){return c.i});
  var ri=Math.floor(Math.random()*allTools.length);
  document.getElementById('randomLink').href='/tools/'+allTools[ri].p;

  // Render recent section
  var recent=JSON.parse(localStorage.getItem('garyy_recent')||'[]');
  if(recent.length>0){
    var recentHtml='<div class="section-block"><div class="recent-title section-title">🕐 '+(isEn?'Recent':'最近使用')+'</div><div class="chip-row">';
    recent.slice(0,8).forEach(function(path){
      var tool=allTools.find(function(t){return t.p===path});
      if(tool)recentHtml+='<a class="chip" href="/tools/'+tool.p+'"><span>'+tool.e+'</span>'+tool.n+'</a>';
    });
    recentHtml+='</div></div>';
    document.getElementById('recentArea').innerHTML=recentHtml;
  }

  // Nav with "全部" reset button first
  var navHtml='<button class="cat-nav-btn active" data-idx="all">'+(isEn?'🌟 All':'🌟 全部')+'</button>'+tools.map(function(c,i){
    var p=parseCat(c.c);
    return '<button class="cat-nav-btn" data-idx="'+i+'">'+p.s+' '+p.n+'</button>';
  }).join('');
  document.getElementById('catNav').innerHTML=navHtml;

  cnt.innerHTML=tools.map(function(c,cIdx){
    var p=parseCat(c.c);
    return '<div class="category" data-cat="'+c.c+'" id="cat-'+cIdx+'">'+
      '<div class="cat-header"><span class="cat-icon">'+p.s+'</span><span class="cat-title">'+p.n+'</span><span class="cat-count">'+c.i.length+'</span></div>'+
      '<div class="tools-grid">'+c.i.map(function(t){
        var isFav=favs.indexOf(t.p)>-1;
        var desc=toolDescs[t.p]||'';
        return '<a class="tool-card'+(isFav?' is-fav':'')+'" href="/tools/'+t.p+'" onclick="addRecent(\''+t.p+'\')" data-name="'+t.n+'" data-path="'+t.p+'" data-desc="'+desc+'" title="'+t.n+(desc?' · '+desc:'')+'"><span class="emoji">'+t.e+'</span><span class="info"><span class="name">'+t.n+'</span>'+(desc?'<span class="desc">'+desc+'</span>':'')+'</span><button class="fav-btn" onclick="toggleFav(\''+t.p+'\',event)" aria-label="收藏">'+(isFav?'❤️':'🤍')+'</button></a>';
      }).join('')+'</div></div>';
  }).join('');
}
render();
renderHot();
renderRecommend();

// 分类导航点击（含"全部"重置）
document.getElementById('catNav').addEventListener('click',function(e){
  var btn=e.target.closest('.cat-nav-btn');
  if(!btn)return;
  var idx=btn.dataset.idx;
  document.querySelectorAll('.cat-nav-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  if(idx==='all'){
    // 重置搜索与筛选
    var searchInput=document.getElementById('search');
    searchInput.value='';
    document.getElementById('searchCount').textContent='';
    document.getElementById('noResult').classList.remove('show');
    document.querySelectorAll('.category').forEach(function(c){c.classList.remove('hidden')});
    document.querySelectorAll('.tool-card').forEach(function(card){
      card.classList.remove('hidden');
      var name=card.dataset.name;
      var nameEl=card.querySelector('.name');
      if(nameEl&&name)nameEl.textContent=name;
    });
    document.getElementById('totalCount').textContent=getTotalCount();
    window.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  var el=document.getElementById('cat-'+idx);
  if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
});

// 热门工具排行
function renderHot(){
  var allTools=tools.flatMap(function(c){return c.i});
  var usage=JSON.parse(localStorage.getItem('garyy_usage')||'{}');
  var defaultHot=['json-formatter','qr-code-generator','weather-now','crypto-prices','bazi-cn','ai-chat-cn-v2','ip-lookup','xunwu','hash-generator','markdown-editor'];
  var sorted=allTools.filter(function(t){return usage[t.p]}).sort(function(a,b){return(usage[b.p]||0)-(usage[a.p]||0)}).slice(0,10);
  if(sorted.length<10){defaultHot.forEach(function(p){if(sorted.length<10&&!sorted.find(function(t){return t.p===p})){var tool=allTools.find(function(t){return t.p===p});if(tool)sorted.push(tool);}});}
  if(sorted.length===0)return;
  var isEn=currentLang==='en';
  var html='<div class="section-block"><div class="section-title">🔥 '+(isEn?'Popular':'热门工具')+'</div><div class="chip-row">';
  sorted.forEach(function(t){
    var count=usage[t.p]||0;
    var heat=count>=100000?Math.round(count/10000)+'万':count>=10000?Math.round(count/1000)+'千':count>=1000?Math.round(count/100)/10+'k':count>0?count+'次':'';
    html+='<a class="chip" href="/tools/'+t.p+'">'+t.e+' '+t.n+(heat?'<span class="heat">'+heat+'</span>':'')+'</a>';
  });
  html+='</div></div>';
  document.getElementById('hotArea').innerHTML=html;
}

// 智能推荐
function renderRecommend(){
  var allTools=tools.flatMap(function(c){return c.i});
  var recent=JSON.parse(localStorage.getItem('garyy_recent')||'[]');
  var recommended=[];
  if(recent.length>0){
    var lastPath=recent[0];
    var lastTool=allTools.find(function(t){return t.p===lastPath});
    if(lastTool){
      var cat=tools.find(function(c){return c.i.find(function(t){return t.p===lastPath})});
      if(cat){recommended=cat.i.filter(function(t){return t.p!==lastPath}).slice(0,8);}
    }
  }
  if(recommended.length===0){
    var aiCat=tools.find(function(c){return c.c.indexOf('AI')>-1});
    if(aiCat)recommended=aiCat.i.slice(0,8);
  }
  if(recommended.length===0)return;
  var isEn=currentLang==='en';
  var html='<div class="section-block"><div class="section-title">💡 '+(isEn?'For You':'为你推荐')+'</div><div class="chip-row">';
  recommended.forEach(function(t){
    html+='<a class="chip" href="/tools/'+t.p+'">'+t.e+' '+t.n+'</a>';
  });
  html+='</div></div>';
  document.getElementById('recommendArea').innerHTML=html;
}

// 多搜索引擎
var currentEngine=localStorage.getItem('garyy_search_engine')||'site';
function setEngine(engine,btn){
  currentEngine=engine;
  localStorage.setItem('garyy_search_engine',engine);
  document.querySelectorAll('.se-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  var isEn=currentLang==='en';
  document.getElementById('search').placeholder=engine==='site'?(isEn?'Search tools...':'搜索工具...'):engine==='google'?'Google 搜索...':'百度搜索...';
  // 切换到外部引擎时清空本地筛选，避免视觉混淆
  if(engine!=='site'){
    var searchInput=document.getElementById('search');
    searchInput.value='';
    document.getElementById('searchCount').textContent='';
    document.getElementById('noResult').classList.remove('show');
    document.querySelectorAll('.category').forEach(function(c){c.classList.remove('hidden')});
    document.querySelectorAll('.tool-card').forEach(function(card){
      card.classList.remove('hidden');
      var name=card.dataset.name;
      var nameEl=card.querySelector('.name');
      if(nameEl&&name)nameEl.textContent=name;
    });
    document.getElementById('totalCount').textContent=getTotalCount();
  }
}
// Init engine button
document.querySelectorAll('.se-btn').forEach(function(b){if(b.dataset.engine===currentEngine){b.classList.add('active')}else{b.classList.remove('active')}});
// 同步初始 placeholder
(function(){
  var isEn=currentLang==='en';
  if(currentEngine!=='site')document.getElementById('search').placeholder=currentEngine==='google'?'Google 搜索...':'百度搜索...';
})();

// 搜索 Enter（已合并去重，移除原文 416-421 的重复绑定）
document.getElementById('search').addEventListener('keydown',function(e){
  if(e.key==='Enter'){
    var q=this.value.trim();
    if(!q)return;
    if(currentEngine==='google'){window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank');return;}
    if(currentEngine==='baidu'){window.open('https://www.baidu.com/s?wd='+encodeURIComponent(q),'_blank');return;}
    var first=document.querySelector('.tool-card:not(.hidden)');
    if(first)first.click();
  }
});

// 站内搜索：实时筛选 + 高亮 + 无结果提示（外部引擎不做本地筛选）
document.getElementById('search').addEventListener('input',function(){
  if(currentEngine!=='site')return;
  var q=this.value.toLowerCase();
  var visible=0;
  document.querySelectorAll('.category').forEach(function(cat){
    var cv=false;
    cat.querySelectorAll('.tool-card').forEach(function(card){
      var name=card.dataset.name||card.querySelector('.name').textContent;
      var path=(card.dataset.path||card.getAttribute('href')||'').toLowerCase();
      var desc=(card.dataset.desc||'').toLowerCase();
      if(!q||name.toLowerCase().indexOf(q)>-1||path.indexOf(q)>-1||desc.indexOf(q)>-1){
        card.classList.remove('hidden');cv=true;visible++;
        var nameEl=card.querySelector('.name');
        nameEl.innerHTML=highlightText(name,q);
      }else{
        card.classList.add('hidden');
        card.querySelector('.name').textContent=name;
      }
    });
    cat.classList.toggle('hidden',!cv);
  });
  document.getElementById('totalCount').textContent=visible||'0';
  document.getElementById('searchCount').textContent=q?(visible+' '+(currentLang==='en'?'results':'个结果')):'';
  document.getElementById('noResult').classList.toggle('show',!!q&&visible===0);
});

// 返回顶部按钮
window.addEventListener('scroll',function(){
  document.getElementById('backToTop').classList.toggle('show',window.scrollY>300);
});

// 键盘快捷键
document.addEventListener('keydown',function(e){
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('search').focus();}
  if(e.key==='Escape')document.getElementById('search').blur();
});

// PWA Service Worker
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){})}
